# Press-pipeline toolchain. typst is pinned because compiled output is
# version-sensitive; avifenc and ffmpeg are system packages (no mise-native
# backend worth the weight). node/pnpm live in website/mise.toml.
[tools]
typst = "0.15.0"

[tasks.test]
description = "Unit tests (launcher, publish dead-man check, axes drawer)"
run = [
  "./tests/test_slopu.py",
  "./tests/test_publish_check.py",
  "./tests/test_draw_axes.py",
]

[tasks.typecheck]
description = "ty over the ops scripts and tests, with the union of their inline deps"
run = "uvx --with pyyaml --with types-PyYAML --with httpx --with pillow --with boto3 ty check ops tests"
