# Press-pipeline toolchain. typst and Ghostscript are pinned because compiled
# and compressed output are version-sensitive; avifenc and ffmpeg are system
# packages (no mise-native backend worth the weight). node/pnpm live in
# website/mise.toml.
[tools]
typst = "0.15.1"
"conda:ghostscript" = "10.08.0"

[tasks.test]
description = "pytest (xdist) over tests/: launcher, publish dead-man check, axes drawer, roster merge"
run = "uvx --with pytest-xdist --with pyyaml --with typer pytest -n auto tests"

[tasks.typecheck]
description = "ty over all the repo's Python, with the union of the scripts' inline deps"
run = "uvx --with pytest --with pyyaml --with types-PyYAML --with httpx --with pillow --with boto3 --with typer --with replicate --with bibtexparser==1.4.4 ty check ops tests analysis video/_kit video/colophon"
