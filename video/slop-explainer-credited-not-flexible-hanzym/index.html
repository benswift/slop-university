<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Credited, Not Flexible, Explained (landscape)</title>
    <link rel="stylesheet" href="kit/kit.css" />
    <style>
      html, body { width: 1920px; height: 1080px; }
      /* her name runs 507 px at the kit's 56 px, over the 440 px cell */
      .layer:has(> img[src$="headshots/lindiwe-achterberg.jpg"]) > .person-name.big { font-size: 46px; }
      /* a statement's gold phrase on a line of its own, so a wrap can't strand it */
      .statement-text .gold::before { content: "\A"; white-space: pre; }
    </style>
  </head>
  <body>
    <!-- A templated video: its script is video/scripts/slop-explainer-credited-not-flexible-hanzym.md, its picture spec.json on kit/beats.js. -->
    <div id="stage" class="stage" data-tail="7" data-aspect="landscape" data-composition-id="slop-explainer-credited-not-flexible-hanzym"
         data-start="0" data-duration="98.52" data-width="1920" data-height="1080" data-fps="50">
      <div id="scene" class="clip layer scene" data-start="0" data-duration="98.52" data-track-index="0"></div>
      <audio id="sound" class="clip" src="assets/mix.wav" data-start="0" data-duration="98.52" data-track-index="1"></audio>
    </div>
    <script type="module">
      import * as M from "./kit/motion/motion.js";
      import { fonts } from "./kit/motion/brand.js";
      import { prepare } from "./kit/beats.js";
      const build = await prepare();
      M.ready(build, { fonts, captions: false }).then(({ tl }) => {
        // the quote mark hangs above its rule by design (kit.css), not an overflow
        document.querySelectorAll(".quote-mark").forEach((m) => m.setAttribute("data-layout-allow-overflow", ""));
        // a word joiner after each hyphen keeps "thirty-six" on one caption line
        // (Public Sans has no non-breaking hyphen)
        document.querySelectorAll(".caption").forEach((c) => (c.textContent = c.textContent.replace(/(\w)-(\w)/g, "$1-\u2060$2")));
        window.__timelines["slop-explainer-credited-not-flexible-hanzym"] = tl;
      });
    </script>
  </body>
</html>
