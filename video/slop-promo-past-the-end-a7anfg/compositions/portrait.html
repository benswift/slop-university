<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Past the End Date (portrait)</title>
    <link rel="stylesheet" href="kit/kit.css" />
    <style>
      html, body { width: 1080px; height: 1920px; }
      /* the quote breaks after its first sentence, "decision." */
      .quote-word:nth-child(7):nth-last-child(9)::after { content: "\A"; white-space: pre; }
      /* the attribution wraps; balanced, it doesn't leave "Priorities" alone */
      .quote-by { text-wrap: balance; }
    </style>
  </head>
  <body>
    <!-- A templated video: its script is video/scripts/slop-promo-past-the-end-a7anfg.md, its picture spec.json on kit/beats.js. -->
    <div id="stage" class="stage" data-tail="7" data-aspect="portrait" data-composition-id="slop-promo-past-the-end-a7anfg"
         data-start="0" data-duration="57.80" data-width="1080" data-height="1920" data-fps="50">
      <div id="scene" class="clip layer scene" data-start="0" data-duration="57.80" data-track-index="0"></div>
      <audio id="sound" class="clip" src="assets/mix.wav" data-start="0" data-duration="57.80" data-track-index="1"></audio>
    </div>
    <script type="module">
      import * as M from "./kit/motion/motion.js";
      import { fonts } from "./kit/motion/brand.js";
      import { prepare } from "./kit/beats.js";
      const build = await prepare();
      M.ready(build, { fonts, captions: false }).then(({ tl }) => {
        // the quote mark hangs above its rule by design (kit.css), not an overflow
        document.querySelectorAll(".quote-mark").forEach((m) => m.setAttribute("data-layout-allow-overflow", ""));
        // a caption never breaks at a hyphen ("pop-" / "up"): a word joiner after each
        document.querySelectorAll(".caption").forEach((c) => {
          c.textContent = c.textContent.replace(/(\w)-(\w)/g, "$1-\u2060$2");
        });
        window.__timelines["slop-promo-past-the-end-a7anfg"] = tl;
      });
    </script>
  </body>
</html>
