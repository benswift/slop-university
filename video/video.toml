# The voice and music for every Slop University video; the keys are in the
# docstring of the styled-video skill's scripts/video.py.

[voice]
id = "WLKp2jV6nrS8aMkPPDRO" # Paul: Australian professional presenter, warm and articulate
lead = 2.0 # the title card holds alone before the first line

[music]
loudness = -22.0 # a little forward of the default -25
prompt = """Bright, modern instrumental underscore for a polished tech explainer. A \
bouncy analogue synth arpeggio, muted electric guitar plucks and soft \
handclaps over a tight, laid-back groove with a warm bass line. Optimistic \
and a little quirky, with small surprising flourishes, even energy \
throughout, no vocals. 104 bpm."""

[voices]
file = "../canon/voices.yml"
# The sustainability film's narrator: made with ElevenLabs Voice Design, not a
# clone, as HORIZONS requires (scripts/sustainability.md).
horizons-narrator = { id = "Rzvz2qSAdC4HpbVhtZ7Z", settings = { speed = 0.85 } }
