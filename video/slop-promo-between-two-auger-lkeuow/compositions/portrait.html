<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Between Two Auger Holes (portrait)</title>
    <link rel="stylesheet" href="kit/kit.css" />
    <style>
      html, body { width: 1080px; height: 1920px; }
      /* the quote breaks after its first sentence, "field." */
      .quote-word:nth-child(8)::after { content: "\A"; white-space: pre; }
      /* his hero has him in its left third: keep him in the portrait frame */
      .video-backdrop img, .layer:has(> .quote-scrim) > img { object-position: 30% 50%; }
    </style>
  </head>
  <body>
    <!-- A templated video: its script is video/scripts/slop-promo-between-two-auger-lkeuow.md, its picture spec.json on kit/beats.js. -->
    <div id="stage" class="stage" data-tail="7" data-aspect="portrait" data-composition-id="slop-promo-between-two-auger-lkeuow"
         data-start="0" data-duration="58.11" data-width="1080" data-height="1920" data-fps="50">
      <div id="scene" class="clip layer scene" data-start="0" data-duration="58.11" data-track-index="0"></div>
      <audio id="sound" class="clip" src="assets/mix.wav" data-start="0" data-duration="58.11" data-track-index="1"></audio>
    </div>
    <script type="module">
      import * as M from "./kit/motion/motion.js";
      import { fonts } from "./kit/motion/brand.js";
      import { prepare } from "./kit/beats.js";
      const build = await prepare();
      M.ready(build, { fonts, captions: false }).then(({ tl }) => {
        // the quote mark hangs above its rule by design (kit.css), not an overflow
        document.querySelectorAll(".quote-mark").forEach((m) => m.setAttribute("data-layout-allow-overflow", ""));
        // a caption never breaks at a hyphen ("fifty-" / "nine"): a word joiner after each
        document.querySelectorAll(".caption").forEach((c) => {
          c.textContent = c.textContent.replace(/(\w)-(\w)/g, "$1-\u2060$2");
        });
        // the attribution sets the name, then the school ("..., SCHOOL / OF UNDERLYING ..." otherwise)
        document.querySelectorAll(".quote-by").forEach((b) => {
          b.style.whiteSpace = "pre-line";
          b.textContent = b.textContent.replace(", ", ",\n");
        });
        window.__timelines["slop-promo-between-two-auger-lkeuow"] = tl;
      });
    </script>
  </body>
</html>
