<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>The Queue as Leading Indicator, Explained (portrait)</title>
    <link rel="stylesheet" href="kit/kit.css" />
    <style>
      html, body { width: 1080px; height: 1920px; }
      /* each statement's gold phrase on its own line, so a wrap never strands part of it */
      .statement-text .gold::before { content: "\A"; white-space: pre; }
      /* Beng sits in the left fifth of his hero: the quote's centre crop would keep only the panel */
      .layer:has(> .quote-scrim) > img[src$="people/casimir-beng.avif"] { object-position: 9% 50%; }
      /* Beng's quote otherwise wraps "by a stable / two quarters.": its gold phrase on a line of its own */
      .layer:has(> img[src$="people/casimir-beng.avif"]) + .quote .quote-word:not(.gold) + .quote-word.gold::before { content: "\A"; white-space: pre; }
    </style>
  </head>
  <body>
    <!-- A templated video: its script is video/scripts/slop-explainer-the-queue-as-4ek2jf.md, its picture spec.json on kit/beats.js. -->
    <div id="stage" class="stage" data-tail="7" data-aspect="portrait" data-composition-id="slop-explainer-the-queue-as-4ek2jf"
         data-start="0" data-duration="94.70" data-width="1080" data-height="1920" data-fps="50">
      <div id="scene" class="clip layer scene" data-start="0" data-duration="94.70" data-track-index="0"></div>
      <audio id="sound" class="clip" src="assets/mix.wav" data-start="0" data-duration="94.70" data-track-index="1"></audio>
    </div>
    <script type="module">
      import * as M from "./kit/motion/motion.js";
      import { fonts } from "./kit/motion/brand.js";
      import { prepare } from "./kit/beats.js";
      const build = await prepare();
      M.ready(build, { fonts, captions: false }).then(({ tl }) => {
        // the quote mark hangs above its rule by design (kit.css), not an overflow
        document.querySelectorAll(".quote-mark").forEach((m) => m.setAttribute("data-layout-allow-overflow", ""));
        // a word joiner after each hyphen keeps "twenty-four" on one caption line
        // (Public Sans has no non-breaking hyphen)
        document.querySelectorAll(".caption").forEach((c) => (c.textContent = c.textContent.replace(/(\w)-(\w)/g, "$1-⁠$2")));
        // the poster's attribution runs past the 868 px column: its title on a line of its own
        document.querySelectorAll(".quote-by").forEach((b) => {
          b.style.whiteSpace = "pre-line";
          b.textContent = b.textContent.replace(", The Queue", ",\nThe Queue");
        });
        window.__timelines["slop-explainer-the-queue-as-4ek2jf"] = tl;
      });
    </script>
  </body>
</html>
