<!doctype html>

  <head>

    <title>The Queue as Leading Indicator, Explained (landscape)</title>
    <link rel="stylesheet" href="kit/kit.css" />
    <style>
      html, body { width: 1920px; height: 1080px; }
      /* "Osei Vandermeer" is 443 px at 56 px, over the 440 px cell: it would wrap into his title */
      .person-name.big { font-size: 52px; }
      /* each statement's gold phrase on its own line, so a wrap never strands part of it */
      .statement-text .gold::before { content: "\A"; white-space: pre; }
      /* both quotes otherwise wrap a short last line that splits their gold phrase */
      .quote-text { text-wrap: balance; }
    </style>
  </head>
  <body>
    <!-- A templated video: its script is video/scripts/slop-explainer-the-queue-as-4ek2jf.md, its picture spec.json on kit/beats.js. -->

         data-start="0" data-duration="94.70" data-width="1920" data-height="1080" data-fps="50">
      <div id="scene" class="clip layer scene" data-start="0" data-duration="94.70" data-track-index="0"></div>
      <audio id="sound" class="clip" src="assets/mix.wav" data-start="0" data-duration="94.70" data-track-index="1"></audio>
    </div>
    <script type="module">
      import * as M from "./kit/motion/motion.js";
      import { fonts } from "./kit/motion/brand.js";
      import { prepare } from "./kit/beats.js";
      const build = await prepare();
      M.ready(build, { fonts, captions: false }).then(({ tl }) => {
        // the quote mark hangs above its rule by design (kit.css), not an overflow
        document.querySelectorAll(".quote-mark").forEach((m) => m.setAttribute("data-layout-allow-overflow", ""));
        // a word joiner after each hyphen keeps "twenty-four" on one caption line
        // (Public Sans has no non-breaking hyphen)
        document.querySelectorAll(".caption").forEach((c) => (c.textContent = c.textContent.replace(/(\w)-(\w)/g, "$1-⁠$2")));
        window.__timelines["slop-explainer-the-queue-as-4ek2jf"] = tl;
      });
    </script>
