<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>In the Wings (landscape)</title>
    <link rel="stylesheet" href="kit/kit.css" />
    <style>
      html, body { width: 1920px; height: 1080px; }
      /* "Thandiwe Solberg" is 468 px at 56 px, wider than the 440 px cell: it would wrap into her title */
      .person-name.big { font-size: 52px; }
      /* the quote breaks after its first sentence (its ninth word), not mid-way through the second */
      .quote-word:nth-child(9)::after { content: "\A"; white-space: pre; }
    </style>
  </head>
  <body>
    <!-- A templated video: its script is video/scripts/slop-promo-in-the-wings-bh1b4a.md, its picture spec.json on kit/beats.js. -->
    <div id="stage" class="stage" data-tail="7" data-aspect="landscape" data-composition-id="slop-promo-in-the-wings-bh1b4a"
         data-start="0" data-duration="57.77" data-width="1920" data-height="1080" data-fps="50">
      <div id="scene" class="clip layer scene" data-start="0" data-duration="57.77" data-track-index="0"></div>
      <audio id="sound" class="clip" src="assets/mix.wav" data-start="0" data-duration="57.77" data-track-index="1"></audio>
    </div>
    <script type="module">
      import * as M from "./kit/motion/motion.js";
      import { fonts } from "./kit/motion/brand.js";
      import { prepare } from "./kit/beats.js";
      const build = await prepare();
      M.ready(build, { fonts, captions: false }).then(({ tl }) => {
        // the quote mark hangs above its rule by design (kit.css), not an overflow
        document.querySelectorAll(".quote-mark").forEach((m) => m.setAttribute("data-layout-allow-overflow", ""));
        // a word joiner after each hyphen keeps "seventy-three" on one caption line
        // (Public Sans has no non-breaking hyphen)
        document.querySelectorAll(".caption").forEach((c) => (c.textContent = c.textContent.replace(/(\w)-(\w)/g, "$1-⁠$2")));
        window.__timelines["slop-promo-in-the-wings-bh1b4a"] = tl;
      });
    </script>
  </body>
</html>
