<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Carried Forward, Unopened, Explained (portrait)</title>
    <link rel="stylesheet" href="kit/kit.css" />
    <style>
      html, body { width: 1080px; height: 1920px; }
      /* each statement's gold phrase starts its own line */
      .statement-text .gold::before { content: "\A"; white-space: pre; }
      /* a long card title wraps in two even lines, not one word on the second */
      .card-title { text-wrap: balance; }
      /* the hero's stacked crates sit right of centre; the quote over it keeps the same crop */
      .video-backdrop img,
      .layer:has(> .quote-scrim) > img[src$="heroes/slop-thesis-crates-carried-forward-gekpe7.avif"] { object-position: 75% 50%; }
      /* Anyanwu stands a third of the way across her hero */
      .layer:has(> .quote-scrim) > img[src$="people/hedvig-anyanwu.avif"] { object-position: 25% 50%; }
      /* the opening quote's last line would hold only "the rest." */
      #stage[data-aspect="portrait"] .quote-text { text-wrap: balance; }
      /* at 56 px each statement's gold line, and the School's name, holds one line (878 and 865 px) */
      #stage[data-aspect="portrait"] .statement-text { font-size: 56px; }
    </style>
  </head>
  <body>
    <!-- A templated video: its script is video/scripts/slop-explainer-carried-forward-unopened-bkfk6z.md, its picture spec.json on kit/beats.js. -->
    <div id="stage" class="stage" data-tail="7" data-aspect="portrait" data-composition-id="slop-explainer-carried-forward-unopened-bkfk6z"
         data-start="0" data-duration="93.99" data-width="1080" data-height="1920" data-fps="50">
      <div id="scene" class="clip layer scene" data-start="0" data-duration="93.99" data-track-index="0"></div>
      <audio id="sound" class="clip" src="assets/mix.wav" data-start="0" data-duration="93.99" data-track-index="1"></audio>
    </div>
    <script type="module">
      import * as M from "./kit/motion/motion.js";
      import { fonts } from "./kit/motion/brand.js";
      import { prepare } from "./kit/beats.js";
      const build = await prepare();
      M.ready(build, { fonts, captions: false }).then(({ tl }) => {
        // the quote mark hangs above its rule by design (kit.css), not an overflow
        document.querySelectorAll(".quote-mark").forEach((m) => m.setAttribute("data-layout-allow-overflow", ""));
        // a word joiner after each hyphen keeps "carried-forward" on one caption line
        // (Public Sans has no non-breaking hyphen)
        document.querySelectorAll(".caption").forEach((c) => (c.textContent = c.textContent.replace(/(\w)-(\w)/g, "$1-\u2060$2")));
        window.__timelines["slop-explainer-carried-forward-unopened-bkfk6z"] = tl;
      });
    </script>
  </body>
</html>
