<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>The Rest of the Record (portrait)</title>
    <link rel="stylesheet" href="kit/kit.css" />
    <style>
      html, body { width: 1080px; height: 1920px; }
      /* Petra sits in the hero's left third: keep her in the portrait crop */
      .video-backdrop img, .scene img[src$="people/petra-umbile.avif"] { object-position: 30% 50%; }
      /* a long card title wraps in two even lines, not one word on the second */
      .card-title { text-wrap: balance; }
      /* the quote breaks after its first sentence (its ninth word), not mid-way through the second */
      .quote-word:nth-child(9)::after { content: "\A"; white-space: pre; }
    </style>
  </head>
  <body>
    <!-- A templated video: its script is video/scripts/slop-promo-the-rest-of-39uatm.md, its picture spec.json on kit/beats.js. -->
    <div id="stage" class="stage" data-tail="7" data-aspect="portrait" data-composition-id="slop-promo-the-rest-of-39uatm"
         data-start="0" data-duration="52.17" data-width="1080" data-height="1920" data-fps="50">
      <div id="scene" class="clip layer scene" data-start="0" data-duration="52.17" data-track-index="0"></div>
      <audio id="sound" class="clip" src="assets/mix.wav" data-start="0" data-duration="52.17" data-track-index="1"></audio>
    </div>
    <script type="module">
      import * as M from "./kit/motion/motion.js";
      import { fonts } from "./kit/motion/brand.js";
      import { prepare } from "./kit/beats.js";
      const build = await prepare();
      M.ready(build, { fonts, captions: false }).then(({ tl }) => {
        // the quote mark hangs above its rule by design (kit.css), not an overflow
        document.querySelectorAll(".quote-mark").forEach((m) => m.setAttribute("data-layout-allow-overflow", ""));
        window.__timelines["slop-promo-the-rest-of-39uatm"] = tl;
      });
    </script>
  </body>
</html>
