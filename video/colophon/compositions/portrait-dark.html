<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>About this project (portrait, dark)</title>
    <link rel="stylesheet" href="kit/kit-dark.css" />
    <style>
      html, body { width: 1080px; height: 1920px; }
    </style>
  </head>
  <body>
    <!-- Script: video/scripts/colophon.md. build() is in colophon.js; fetch-assets.py fills assets/. -->
    <div id="stage" class="stage" data-theme="dark" data-tail="7" data-aspect="portrait" data-composition-id="colophon"
         data-start="0" data-duration="90.84" data-width="1080" data-height="1920" data-fps="50">
      <div id="scene" class="clip layer scene" data-start="0" data-duration="90.84" data-track-index="0"></div>
      <audio id="sound" class="clip" src="assets/mix.wav" data-start="0" data-duration="90.84" data-track-index="1"></audio>
    </div>
    <script type="module">
      import * as M from "./kit/motion/motion.js";
      import { fonts } from "./kit/motion/brand.js";
      import { build } from "./colophon.js";
      M.ready(build, { fonts, captions: false }).then(({ tl }) => {
        window.__timelines["colophon"] = tl;
      });
    </script>
  </body>
</html>
