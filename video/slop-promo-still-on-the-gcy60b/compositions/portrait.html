<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Still on the Agenda (portrait)</title>
    <link rel="stylesheet" href="kit/kit.css" />
    <style>
      html, body { width: 1080px; height: 1920px; }
      /* her figure, at the left of her hero, at the centre of the portrait crop */
      .video-backdrop img, .layer:has(> .quote-scrim) > img { object-position: 14% 50%; }
    </style>
  </head>
  <body>
    <!-- A templated video: its script is video/scripts/slop-promo-still-on-the-gcy60b.md, its picture spec.json on kit/beats.js. -->
    <div id="stage" class="stage" data-tail="7" data-aspect="portrait" data-composition-id="slop-promo-still-on-the-gcy60b"
         data-start="0" data-duration="54.63" data-width="1080" data-height="1920" data-fps="50">
      <div id="scene" class="clip layer scene" data-start="0" data-duration="54.63" data-track-index="0"></div>
      <audio id="sound" class="clip" src="assets/mix.wav" data-start="0" data-duration="54.63" data-track-index="1"></audio>
    </div>
    <script type="module">
      import * as M from "./kit/motion/motion.js";
      import { fonts } from "./kit/motion/brand.js";
      import { prepare } from "./kit/beats.js";
      const build = await prepare();
      M.ready(build, { fonts, captions: false }).then(({ tl }) => {
        // the quote mark hangs above its rule by design (kit.css), not an overflow
        document.querySelectorAll(".quote-mark").forEach((m) => m.setAttribute("data-layout-allow-overflow", ""));
        window.__timelines["slop-promo-still-on-the-gcy60b"] = tl;
      });
    </script>
  </body>
</html>
