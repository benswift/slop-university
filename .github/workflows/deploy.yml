name: Deploy website to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    # Generous because the Astro image cache only saves in actions/cache's
    # post-job step: a build killed by this timeout saves nothing, so a cold
    # build that can't finish once can never seed the cache that would make it
    # fast. Any change to image format or srcset widths forces one fully cold
    # AVIF build, which runs well past an hour on this runner. The ceiling is
    # free on the warm builds that are the steady state.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise (node + pnpm)
        uses: jdx/mise-action@v5
        with:
          working_directory: website

      - name: Locate pnpm store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('website/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # node_modules/.astro holds the image service's transform cache --- ~5600
      # encodes, which is essentially the whole build cost --- plus the content
      # layer store. Without it every publish tick re-encodes every image from
      # scratch, ~20 times a day. Keyed on sha so each run saves its updated
      # cache; restore-keys picks up the most recent. Note the path is
      # workspace-relative, so it needs the website/ prefix that
      # defaults.run.working-directory supplies for run steps but not for uses.
      #
      # The v<N> segment is a manual cache lineage. Astro keys transforms by
      # content hash and never prunes, so changing image format or srcset
      # widths orphans every existing entry and the cache carries both
      # generations forever, fitting fewer entries in the repo's 10 GB budget.
      # Bump it whenever an image-config change invalidates the old entries;
      # it costs the one cold build that change forces anyway.
      - name: Cache Astro build cache
        uses: actions/cache@v6
        with:
          path: website/node_modules/.astro
          key: ${{ runner.os }}-astro-build-v3-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-build-v3-

      - name: Lint
        run: pnpm run lint

      - name: Lint CSS
        run: pnpm run lint:css

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build with Astro
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist
          # dist/.well-known/ (standard.site's domain verification) is
          # otherwise dropped: the action excludes dot-directories by default.
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Don't cap this short and plan to retry --- a retry cannot work here.
      # actions/deploy-pages derives the deployment id from github.sha
      # (pages_build_version), and its abort path cancels that id. A second
      # attempt in the same run therefore re-creates an already-cancelled
      # deployment and reads back "Deployment cancelled" within 5s, every
      # time. Waiting out the first attempt is the only thing that works.
      #
      # The cap needs to clear time spent in deployment_queued, which is
      # GitHub's to set and can step-change without warning from seconds to
      # several minutes; it is not a function of artifact size (worth watching
      # against the 1 GB Pages ceiling all the same).
      #
      # 600000 is the ceiling, not a preference --- the action clamps anything
      # higher and says so only in a warning buried in the step log ("timeout
      # value is greater than the allowed maximum"). Don't raise it expecting
      # an effect. If queue time ever exceeds 10 minutes there is no knob for
      # it: the run goes red while Pages usually completes the deployment
      # anyway, and the next publish tick redeploys the whole site regardless.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
