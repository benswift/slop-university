name: Deploy website to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    # Generous because the Astro image cache only saves in actions/cache's
    # post-job step: a build killed by this timeout saves nothing, so a cold
    # build that can't finish once can never seed the cache that would make it
    # fast. Any change to image format or srcset widths rehashes every
    # transform and forces one fully cold build, so leave room for it.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise (node + pnpm)
        uses: jdx/mise-action@v4
        with:
          working_directory: website

      - name: Locate pnpm store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('website/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # node_modules/.astro holds the image service's transform cache --- ~5600
      # encodes, which is essentially the whole build cost --- plus the content
      # layer store. Without it every publish tick re-encodes every image from
      # scratch, ~20 times a day. Keyed on sha so each run saves its updated
      # cache; restore-keys picks up the most recent. Note the path is
      # workspace-relative, so it needs the website/ prefix that
      # defaults.run.working-directory supplies for run steps but not for uses.
      #
      # The v2 segment is a manual cache lineage. Astro keys transforms by
      # content hash and never prunes, so changing image format or srcset
      # widths orphans every existing entry --- the cache then carries both
      # generations forever (434 MB of dead webp beside 275 MB of live avif,
      # measured at the v1 -> v2 switch), and a fatter entry means fewer of
      # them fit the repo's 10 GB budget before LRU eviction forces another
      # cold build. Bump this whenever an image-config change invalidates the
      # old entries; it costs the one cold build that change forces anyway.
      - name: Cache Astro build cache
        uses: actions/cache@v6
        with:
          path: website/node_modules/.astro
          key: ${{ runner.os }}-astro-build-v2-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-build-v2-

      - name: Lint
        run: pnpm run lint

      - name: Lint CSS
        run: pnpm run lint:css

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build with Astro
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # A healthy deploy takes ~30s, so 5 minutes is ample headroom. The
      # occasional stall on the Pages deployment API never recovers, it just
      # burns the clock --- capping the first attempt short leaves room to
      # retry inside the same run rather than going red and waiting an hour
      # for the next publish tick to redeploy.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 300000

      - name: Deploy to GitHub Pages (retry)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
