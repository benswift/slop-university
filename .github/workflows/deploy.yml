name: Deploy website to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    # Generous because the Astro image cache only saves in actions/cache's
    # post-job step: a build killed by this timeout saves nothing, so a cold
    # build that can't finish once can never seed the cache that would make it
    # fast. Any change to image format or srcset widths forces one fully cold
    # AVIF build, which runs well past an hour on this runner. The ceiling is
    # free on the warm builds that are the steady state.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise (node + pnpm)
        uses: jdx/mise-action@v5
        with:
          working_directory: website

      - name: Locate pnpm store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('website/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # node_modules/.astro holds the image service's transform cache --- ~5600
      # encodes, which is essentially the whole build cost --- plus the content
      # layer store. Without it every publish tick re-encodes every image from
      # scratch, ~20 times a day. Keyed on sha so each run saves its updated
      # cache; restore-keys picks up the most recent. Note the path is
      # workspace-relative, so it needs the website/ prefix that
      # defaults.run.working-directory supplies for run steps but not for uses.
      #
      # The v<N> segment is a manual cache lineage. Astro keys transforms by
      # content hash and never prunes, so changing image format or srcset
      # widths orphans every existing entry and the cache carries both
      # generations forever, fitting fewer entries in the repo's 10 GB budget.
      # Bump it whenever an image-config change invalidates the old entries;
      # it costs the one cold build that change forces anyway.
      - name: Cache Astro build cache
        uses: actions/cache@v6
        with:
          path: website/node_modules/.astro
          key: ${{ runner.os }}-astro-build-v3-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-build-v3-

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build with Astro
        run: pnpm run build

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist
          # dist/.well-known/ (standard.site's domain verification) is
          # otherwise dropped: the action excludes dot-directories by default.
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # The same Pages API calls actions/deploy-pages makes, minus its hard
      # 10-minute cap: GitHub sometimes holds a deployment in syncing_files
      # for ~10 minutes (it is not a function of artifact size), and on
      # timeout the action cancels the deployment, so it never goes live.
      #
      # Don't plan to retry instead. The deployment id is github.sha, so a
      # second attempt in the same run re-creates an already-cancelled
      # deployment and reads back deployment_cancelled within seconds. Waiting
      # out the first attempt is the only thing that works; keep the job's
      # timeout-minutes above WAIT_SECONDS so the cancel below still runs.
      - name: Deploy to GitHub Pages
        id: deployment
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          WAIT_SECONDS: 1200
        run: |
          set -euo pipefail
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$oidc"
          created=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" \
            -F artifact_id="$ARTIFACT_ID" -f pages_build_version="$GITHUB_SHA" -f oidc_token="$oidc")
          id=$(jq -r '.id // (.status_url | select(.) | split("/") | last) // env.GITHUB_SHA' <<<"$created")
          echo "page_url=$(jq -r .page_url <<<"$created")" >>"$GITHUB_OUTPUT"
          echo "Created deployment $id"
          deadline=$((SECONDS + WAIT_SECONDS))
          while :; do
            sleep 15
            status=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$id" --jq .status) || status=unknown
            echo "$(date -u +%T) $status"
            case $status in
              succeed) exit 0 ;;
              deployment_failed | deployment_content_failed | deployment_cancelled | deployment_lost)
                echo "::error::Pages deployment ended in $status"
                exit 1
                ;;
            esac
            if ((SECONDS >= deadline)); then
              echo "::error::Pages deployment still $status after ${WAIT_SECONDS}s; cancelling"
              gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$id/cancel" || true
              exit 1
            fi
          done
