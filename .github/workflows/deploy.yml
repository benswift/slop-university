name: Deploy website to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    # Keep this well above a cold build (nothing to restore from the Astro
    # cache below: ~8 minutes on this runner, against ~2 warm). The cache only
    # saves in actions/cache's post-job step, so a cold build killed by the
    # timeout never seeds the cache that makes the next one fast.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise (node + pnpm)
        uses: jdx/mise-action@v5
        with:
          working_directory: website

      - name: Locate pnpm store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('website/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # node_modules/.astro holds the image service's transform cache (~270
      # encodes, most of a cold build's cost), astro-theme-university's
      # accessibility-check results and the content layer store. Keyed on sha
      # so each run saves its updated cache; restore-keys picks up the most
      # recent. Note the path is workspace-relative, so it needs the website/
      # prefix that defaults.run.working-directory supplies for run steps but
      # not for uses.
      #
      # The v<N> segment is a manual cache lineage. Astro keys transforms by
      # content hash and never prunes, so changing image format or srcset
      # widths orphans every existing entry and the cache carries both
      # generations forever. Bump it whenever an image-config change
      # invalidates the old entries; it costs the one cold build that change
      # forces anyway.
      - name: Cache Astro build cache
        uses: actions/cache@v6
        with:
          path: website/node_modules/.astro
          key: ${{ runner.os }}-astro-build-v3-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-build-v3-

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build with Astro
        run: pnpm run build

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist
          # dist/.well-known/ (standard.site's domain verification) is
          # otherwise dropped: the action excludes dot-directories by default.
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    # Above ATTEMPTS x ATTEMPT_SECONDS, so the last cancel still runs.
    timeout-minutes: 40
    steps:
      # The Pages API calls actions/deploy-pages makes, plus retries. GitHub
      # sometimes leaves a deployment in syncing_files until it abandons it
      # ten minutes after creation (the status then reads back empty), so
      # waiting longer never helps; a fresh deployment usually syncs in
      # seconds. Each attempt needs its own pages_build_version: the
      # deployment id is that string, and re-creating a cancelled id reads
      # back deployment_cancelled at once.
      - name: Deploy to GitHub Pages
        id: deployment
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ATTEMPTS: 3
          ATTEMPT_SECONDS: 660
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/pages/deployments"
          for attempt in $(seq "$ATTEMPTS"); do
            version=$GITHUB_SHA
            ((attempt == 1)) || version="$GITHUB_SHA-$attempt"
            oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
            echo "::add-mask::$oidc"
            created=$(gh api -X POST "$api" \
              -F artifact_id="$ARTIFACT_ID" -f pages_build_version="$version" -f oidc_token="$oidc")
            id=$(jq -r '.id // (.status_url | select(.) | split("/") | last) // empty' <<<"$created")
            id=${id:-$version}
            echo "page_url=$(jq -r .page_url <<<"$created")" >>"$GITHUB_OUTPUT"
            echo "Attempt $attempt: created deployment $id"
            deadline=$((SECONDS + ATTEMPT_SECONDS))
            while :; do
              sleep 15
              body=$(gh api "$api/$id") || body='{"status":"unknown"}'
              status=$(jq -r '.status // ""' <<<"$body")
              echo "$(date -u +%T) ${status:-<empty> $body}"
              case $status in
                succeed) exit 0 ;;
                deployment_content_failed | deployment_cancelled)
                  echo "::error::Pages deployment ended in $status"
                  exit 1
                  ;;
                deployment_failed | deployment_lost | "") break ;;
              esac
              ((SECONDS < deadline)) || break
            done
            echo "::warning::Attempt $attempt gave up (${status:-empty status}); cancelling $id"
            gh api -X POST "$api/$id/cancel" >/dev/null || true
          done
          echo "::error::Pages deployment failed after $ATTEMPTS attempts"
          exit 1
