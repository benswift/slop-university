name: Deploy website to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    # Generous because the Astro image cache only saves in actions/cache's
    # post-job step: a build killed by this timeout saves nothing, so a cold
    # build that can't finish once can never seed the cache that would make it
    # fast. Any change to image format or srcset widths rehashes every
    # transform and forces one fully cold build, so leave room for it.
    #
    # 60 wasn't enough: the AVIF switch's cold build ran past it and was
    # killed with nothing saved, which is the unrecoverable case --- it would
    # have repeated hourly. AVIF encodes ~8x slower than webp and this runner
    # is ~2.5x slower than the box the 23-minute local measurement came from.
    # The ceiling is free on the warm builds that are the steady state.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise (node + pnpm)
        uses: jdx/mise-action@v4
        with:
          working_directory: website

      - name: Locate pnpm store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('website/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # node_modules/.astro holds the image service's transform cache --- ~5600
      # encodes, which is essentially the whole build cost --- plus the content
      # layer store. Without it every publish tick re-encodes every image from
      # scratch, ~20 times a day. Keyed on sha so each run saves its updated
      # cache; restore-keys picks up the most recent. Note the path is
      # workspace-relative, so it needs the website/ prefix that
      # defaults.run.working-directory supplies for run steps but not for uses.
      #
      # The v2 segment is a manual cache lineage. Astro keys transforms by
      # content hash and never prunes, so changing image format or srcset
      # widths orphans every existing entry --- the cache then carries both
      # generations forever (434 MB of dead webp beside 275 MB of live avif,
      # measured at the v1 -> v2 switch), and a fatter entry means fewer of
      # them fit the repo's 10 GB budget before LRU eviction forces another
      # cold build. Bump this whenever an image-config change invalidates the
      # old entries; it costs the one cold build that change forces anyway.
      - name: Cache Astro build cache
        uses: actions/cache@v6
        with:
          path: website/node_modules/.astro
          key: ${{ runner.os }}-astro-build-v3-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-build-v3-

      - name: Lint
        run: pnpm run lint

      - name: Lint CSS
        run: pnpm run lint:css

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build with Astro
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Don't cap this short and plan to retry --- a retry cannot work here.
      # actions/deploy-pages derives the deployment id from github.sha
      # (pages_build_version), and its abort path cancels that id. A second
      # attempt in the same run therefore re-creates an already-cancelled
      # deployment and reads back "Deployment cancelled" within 5s, every
      # time. Waiting out the first attempt is the only thing that works.
      #
      # The cap needs to clear time spent in deployment_queued, which is
      # GitHub's to set and can step-change without warning. It sat at ~20s for
      # days, then jumped to ~5min at 07:22 UTC on 2026-08-06 and stayed there
      # (195s, 285s, 305s, 311s, 312s on consecutive ticks) --- straddling the
      # old 300000 cap, so each run became a coin flip and two landed red with
      # a green build behind them.
      #
      # Don't read that as the artifact outgrowing something: it grows ~800 KB
      # per publish tick and went 427 -> 446 MB over the preceding day with the
      # deploy pinned at 20s throughout. Size is worth watching against the
      # 1 GB Pages ceiling, but it did not cause this.
      #
      # 600000 is the ceiling, not a preference --- the action clamps anything
      # higher and says so only in a warning buried in the step log ("timeout
      # value is greater than the allowed maximum"). Don't raise it expecting
      # an effect. If queue time ever exceeds 10 minutes there is no knob for
      # it: the run goes red while Pages usually completes the deployment
      # anyway, and the next publish tick redeploys the whole site regardless.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
