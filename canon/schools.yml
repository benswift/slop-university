# The institutional canon: schools and units (structured, renderable).
#
# This is the SOURCE OF TRUTH for every school, unit, lab, program, and named
# initiative of Slop University. The website's `schools` content collection
# loads this file directly (website/src/content.config.ts); every generated
# artefact, press release, and site page draws its org names from here.
#
# The authoring doctrine --- naming register, the "no faculties" rule, the
# collision-check requirement, history --- lives in the sibling schools.md.
# Add an org unit HERE first (name-collision checked); never invent one inside
# a run.
#
# `id` is the URL slug and the stable reference key. `school:` on a lab,
# program, or initiative is the parent school's id.

schools:
  - id: emergent-priorities
    name: School of Emergent Priorities
    blurb: >-
      The research-strategy school. Home of the Trajectory Analytics Group. Its
      outputs favour foresight, alignment, and anticipatory framings.
  - id: continuous-improvement
    name: School of Continuous Improvement
    blurb: >-
      The measurement-and-process school. Home of the Adaptive Metrics Lab. Its
      outputs favour evaluation, optimisation, and capability framings.
  - id: underlying-conditions
    name: School of Underlying Conditions
    blurb: >-
      The earth sciences school. It studies the rock, soil, and groundwater
      beneath the surface, by field mapping, drill core, and laboratory
      analysis of what is brought up.
    founded: "2026-10-09"
  - id: settled-matters
    name: School of Settled Matters
    blurb: >-
      The law school. It studies how legal rules are made, read, and applied,
      through close reading of statutes and decided cases, archival work in
      court records, and comparison across jurisdictions.
    founded: "2026-11-08"

units:
  - id: office-of-the-vice-chancellor
    name: Office of the Vice-Chancellor
    blurb: >-
      The University's executive office, holding final delegated authority over
      what is published under the institution's name. Not a school; it convenes
      no research and no roster researcher is affiliated to it. Generated
      artefacts may invoke the office --- a foreword, a delegation, a signature
      block --- but never its occupant by name.
  - id: office-of-research-outputs
    name: Office of Research Outputs
    blurb: >-
      The producing unit credited (rotated margin wordmark) on every research
      poster and paper: the university's organ for the manufacture of
      research-shaped objects, named without comment. Not a school; roster
      researchers are never affiliated to it.
  - id: university-council
    name: University Council
    blurb: >-
      The University's governing body, whose members lend their names to its
      mission. Not a school; it convenes no research, and no roster researcher
      is affiliated to it. Generated artefacts may invoke the Council as a
      body, but never name its members.
  - id: department-of-policy-settings
    name: Department of Policy Settings
    blurb: >-
      The University's policy department. It advises the Office of the
      Vice-Chancellor and the University Council on the settings under which
      the schools work, consults the schools on proposed changes to them,
      drafts the instruments that give those changes effect, and answers for
      their administration to the Committee on Settings Oversight. Not a
      school; it convenes no research, and no roster researcher is
      affiliated to it. Generated artefacts may invoke the Department, its
      divisions and its offices (the Secretary, a Deputy Secretary, a First
      Assistant Secretary, a branch Director), but never name an official.
  - id: committee-on-settings-oversight
    name: Committee on Settings Oversight
    blurb: >-
      The standing committee, elected from the academic staff of the schools,
      before which the Department of Policy Settings appears to answer for its
      administration. Questions the Department cannot answer at a hearing are
      taken on notice and answered in writing. Its members are roster
      researchers (never doctoral candidates), and a question is recorded
      against the member who asked it.

divisions:
  - id: settings-maintenance-division
    name: Settings Maintenance Division
    unit: department-of-policy-settings
    blurb: >-
      Keeps the University's settings under review once they are made: it
      monitors how each operates across the schools, records where one has
      drifted from its stated intent, recommends adjustment, and holds the
      register of settings in force.
  - id: consultation-and-uptake-division
    name: Consultation and Uptake Division
    unit: department-of-policy-settings
    blurb: >-
      Runs the Department's consultations with the schools: it prepares
      consultation papers, receives and analyses submissions, and reports on
      what was heard. Uptake is the Division's term for the passage of a
      consulted position into a settled one.
  - id: instruments-and-determinations-division
    name: Instruments and Determinations Division
    unit: department-of-policy-settings
    blurb: >-
      Drafts the determinations, guidelines and other instruments through
      which the Office of the Vice-Chancellor gives a setting effect, and keeps
      the register of instruments in force.

labs:
  - id: trajectory-analytics-group
    name: Trajectory Analytics Group
    school: emergent-priorities
    blurb: >-
      The School of Emergent Priorities' flagship research group, convening
      work on how priorities are sensed, tested, and carried through into
      durable institutional commitments. Its output anchors the School's
      anticipatory-capability agenda across settings from single labs to
      whole-of-university footprints.
  - id: adaptive-metrics-lab
    name: Adaptive Metrics Lab
    school: continuous-improvement
    blurb: >-
      The School of Continuous Improvement's flagship lab, convening work on
      how measurement systems are designed, calibrated, and fed back into the
      processes they track. Its output anchors the School's
      evaluation-ecosystem agenda, extending from single indicators to
      whole-of-university dashboards.
  - id: basement-relations-group
    name: Basement Relations Group
    school: underlying-conditions
    blurb: >-
      The School of Underlying Conditions' founding research group, convening
      work on how the crystalline basement meets the cover laid down upon it,
      read from drill core, field contacts, and thin section. Its output
      anchors the School's account of what the surface rests on, and of how
      far down that account needs to go.
  - id: received-readings-group
    name: Received Readings Group
    school: settled-matters
    blurb: >-
      The School of Settled Matters' founding research group, convening work
      on how a reading of a statute or a decided case becomes the accepted one,
      traced through the reported judgments, the commentaries, and the court
      files behind them. Its output anchors the School's account of when a
      question of interpretation can be said to be closed, and of what it
      takes to reopen one.

programs:
  - id: master-of-priority-studies
    name: Master of Priority Studies
    school: emergent-priorities
    blurb: >-
      The School of Emergent Priorities' flagship Masters program, preparing
      graduates to sense, sequence, and steward priorities across
      institutional settings.
  - id: master-of-applied-measurement
    name: Master of Applied Measurement
    acronym: MAM
    school: continuous-improvement
    blurb: >-
      The School of Continuous Improvement's flagship Masters program. The
      acronym "MAM" is used only in space-constrained contexts.
  - id: capability-sprints
    name: Capability Sprints
    school: continuous-improvement
    blurb: >-
      The short-course and executive-education line. Named Sprints include
      Leading with Metrics, Reading the Dashboard, Stewarding Indicators,
      Deciding Under Measurement, and Improving Improvement.

initiatives:
  - id: horizon-register
    name: Horizon Register
    school: emergent-priorities
    blurb: The School's rolling account of priorities on approach.
  - id: strategic-drift-survey
    name: Strategic Drift Survey
    school: emergent-priorities
    blurb: >-
      The annual instrument tracking the distance between stated and enacted
      priorities.
  - id: futures-in-committee
    name: Futures in Committee
    school: emergent-priorities
    blurb: The School's seminar series.
  - id: indicator-commons
    name: Indicator Commons
    school: continuous-improvement
    blurb: The shared indicator library.
  - id: living-dashboard
    name: Living Dashboard
    school: continuous-improvement
    blurb: The School's always-on self-measurement wall.
  - id: evaluation-of-evaluation
    name: Evaluation of Evaluation
    acronym: EoE
    school: continuous-improvement
    blurb: The meta-review program.
  - id: impact-pathway-atlas
    name: Impact Pathway Atlas
    school: continuous-improvement
    blurb: >-
      Traces how research effort becomes counted impact, mapping outputs
      through citation flows and narrative-CV pathways to their eventual
      recognition.
  - id: review-cadence-observatory
    name: Review Cadence Observatory
    school: continuous-improvement
    blurb: >-
      Monitors the rhythm at which the School's programs, labs, and
      initiatives return for review, surfacing when a review cadence has
      drifted from what its own indicators would set.
  - id: improvement-grand-rounds
    name: Improvement Grand Rounds
    school: continuous-improvement
    blurb: The School's seminar series.
  - id: demo-quarter
    name: Demo Quarter
    school: continuous-improvement
    blurb: The quarterly Masters-program showcase.

history:
  - id: institute-for-measurable-outcomes
    name: Institute for Measurable Outcomes
    school: continuous-improvement
    blurb: >-
      The School of Continuous Improvement's predecessor institution; the School
      traces its origins to it. Historical references only; never conflate with
      the School.
