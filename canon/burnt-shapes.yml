# Retired draw values --- mostly study designs the corpus overused to the point
# of self-parody, and any other pool value spent the same way. A STATIC
# exclusion list, read by `ops/draw-axes.py` when it draws a run's axes from
# `canon/axes.yml`. No publish run appends to this file, and no publish run may
# commit it: a uniform draw cannot overuse a value by construction, so there is
# nothing for a run to burn. Retiring one is a human decision, made from the
# corpus with hindsight.
#
# `excludes:` names the `canon/axes.yml` ids this entry retires, on any pool
# axis, and is what the drawer acts on --- an entry with no `excludes:`
# describes a design that was never a pool value (the pool cannot draw it, and
# the wrapper passes every entry's `shape:` to the run as prose so a composed
# topic does not reinvent it). Never rewrite or remove an entry: the ledger is
# the record of what the corpus already spent.
- added: 2026-08-16
  shape:
    capability rose while human quality fell (negative correlation, r ≈ −0.7)
- added: 2026-08-16
  shape: coined index forecasts an event by N weeks (r ≈ 0.7-0.8)
- added: 2026-08-16
  shape:
    forensic re-audit of administrative records finds the published measure
    diverges from the thing measured
- added: 2026-08-18
  shape:
    an industrial reliability or metrology procedure (FMECA, gauge R&R,
    acceptance sampling, life-cycle assessment, signal-detection scoring,
    discrete-event simulation) run wholesale over a domestic or community
    object, with its output adopted as a tolerance or specification
- added: 2026-08-21
  excludes: [instrument-validation]
  shape:
    an automated instrument, sensor, or scoring log validated against an
    independent manual observation or ground-truth check (does the
    official record actually track what happened)
- added: 2026-09-21
  excludes: [gerund]
  shape:
    the gerund methodological title --- every one of the last sixty outputs'
    gerund titles opened "Measuring the ...", so the form now reads as one
    title repeated. The methodological register it served is still available
    through the colon and declarative forms.
