# The draw pools for a publish run, drawn OUTSIDE the model.
#
# `ops/draw-axes.py` reads this file, draws with OS randomness, and the cron
# wrapper passes the draw on the /publish invocation line --- exactly as
# `ops/select-preset.sh` does for the preset.
#
# Why a draw and not the agent's judgement: a model left to choose converges on
# its favourites (one topic-sentence frame went from 0% to 93% of weekly output
# that way), and two slots reading the same corpus choose alike. A draw cannot
# overuse a value and two slots draw independently.
#
# A 2A run draws a `tradition` here and a subject from `subjects.tsv`. A thesis
# run (2T) draws a `setting` and reads `finding-shape` as a menu; those two
# pools serve the thesis alone (`skills/from-preset/presets/thesis.md`).
#
# Weights are relative within a pool and default to 1.
#
# To retire a thesis value, add it to `burnt-shapes.yml` (naming this file's id
# in its `excludes:`); do not delete pool entries to retire them.

# The scholarly tradition a 2A output is written from: its conventions of
# evidence, argument, citation and title. Broad on purpose --- the run chooses
# where inside it to stand.
tradition:
  - id: analytic-philosophy
    value: analytic philosophy
  - id: literary-criticism
    value: literary criticism (close reading)
  - id: art-history
    value: art history
  - id: musicology
    value: musicology
  - id: classics-and-philology
    value: classics and philology
  - id: social-and-cultural-history
    value: social and cultural history
  - id: the-history-and-philosophy-of-science
    value: the history and philosophy of science
  - id: legal-scholarship
    value: legal scholarship (the doctrinal case note)
  - id: jurisprudence
    value: jurisprudence
  - id: pure-mathematics
    value: pure mathematics
  - id: theoretical-computer-science
    value: theoretical computer science
  - id: statistics-and-methodology
    value: statistics and methodology
  - id: theoretical-physics
    value: theoretical physics
  - id: experimental-psychology
    value: experimental psychology
  - id: field-ecology
    value: field ecology
  - id: geology-and-physical-geography
    value: geology and physical geography
  - id: materials-science-and-engineering
    value: materials science and engineering
  - id: human-computer-interaction
    value: human-computer interaction
  - id: software-engineering-research
    value: software engineering research
  - id: machine-learning-research
    value: machine learning research
  - id: economics
    value: economics (theory)
  - id: economic-history
    value: economic history
  - id: ethnographic-sociology
    value: ethnographic sociology
  - id: cultural-anthropology
    value: cultural anthropology
  - id: linguistics
    value: linguistics
  - id: archaeology
    value: archaeology
  - id: architecture-and-design-criticism
    value: architecture and design criticism
  - id: urban-planning
    value: urban planning
  - id: education-research
    value: education research
  - id: science-and-technology-studies
    value: science and technology studies
  - id: media-and-communication-studies
    value: media and communication studies
  - id: information-and-library-science
    value: information and library science
  - id: theology-and-religious-studies
    value: theology and religious studies
  - id: political-theory
    value: political theory
  - id: organisation-and-management-studies
    value: organisation and management studies
  - id: operations-research
    value: operations research

finding-shape:
  - id: taxonomy
    value: a taxonomy or framework that sorts the object into kinds
  - id: qualitative
    value: a qualitative or interview study, reported in participants' terms
  - id: survey
    value: a survey of a population, reported as distributions
  - id: instrument-validation
    value:
      an instrument-validation study --- does the measure measure what it
      claims
  - id: null-result
    value:
      a null result reported as null, with no salvage and no "further work
      is needed"
  - id: failed-replication
    value:
      a failed replication of an earlier Slop University finding (the canon
      failing to reproduce itself is good satire)
  - id: systems-paper
    value: a systems or tool paper --- something was built, here is how it works
  - id: quasi-experiment
    value: a quasi-experiment exploiting a naturally occurring cutoff
  - id: case-study
    value:
      a single-site case study told in earnest case-method register, with a
      teaching note's air
  - id: maturity-model
    value: a maturity model with named levels an organisation is scored against
  - id: quadrant
    value:
      a 2x2 quadrant framework with the four cells named (also a fine poster
      chart)

setting:
  - id: domestic
    weight: 3
    value: domestic life --- the home, the kitchen, the yard, bin night
  - id: retail
    weight: 3
    value:
      shops and commerce --- the supermarket, the strip-mall trader, the food
      truck, loyalty cards, the EFTPOS terminal
  - id: workplace
    weight: 3
    value:
      working life --- the open-plan office, the shift roster, the stand-up,
      the performance review, franchise onboarding
  - id: transit
    weight: 3
    value: transit and the street --- the bus stop, the car park, the school run
  - id: online
    weight: 3
    value:
      online and digital life --- the group chat, the neighbourhood forum, the
      booking app, the review score
  - id: club
    weight: 3
    value:
      club and hobby life --- the sports club, the shed, the choir, the
      allotment, the raffle
  - id: civic
    # One flavour, not the house style.
    weight: 2
    value:
      civic-administrative life --- council, shire, a state scheme, compliance
      paperwork (vary the jurisdictional flavour, or keep it placeless)
  - id: campus
    # In the pool, never the default: most readers have never sat in a lecture
    # theatre and the joke has to land for them too.
    weight: 2
    value:
      campus life as ordinary furniture --- the coffee queue, the pigeons, the
      tea-room biscuits
