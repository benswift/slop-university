doi: 10.5555/slop.cdi4x2
summary: >-
  A paper from the School of Continuous Improvement pilots a
  Rostering-Reliability Score, built from how quickly a café shift-swap
  request is claimed in a team messaging group, across fourteen sites and an
  embedded ablation splitting a public pinned leaderboard from an identically
  computed private score. Median claim latency fell from 45.4 to 33.0 minutes
  at twelve of fourteen sites, but the ablation found no detectable difference
  between the public and private arms, and interviews with forty-two staff
  attribute most of the reduction to a pre-existing informal claiming norm
  that predates the pilot.
topic: >-
  how fast a barista's shift-swap request gets claimed in the café team
  group chat, and a proposal to formalise claim latency as a
  rostering-reliability score
