title: Formalising the Group Chat
subtitle: >-
  A Mixed-Methods Study of Café Shift-Swap Claim Latency
authors:
  - Casimir Beng
  - Solveig Adeyemi
  - Marit Osayande
preset: paper
school: School of Continuous Improvement
date: 2026-08-22
