title: Equal Turns, Longer Waits
subtitle: >-
  Building and Auditing a Round-Robin Scheduler for a Farmers Market's One
  Shared Card Reader
authors:
  - Runa Adegoke
  - Osei Vandermeer
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-27
publishedAt: "2026-08-27T09:04:16+10:00"
doi: 10.5555/slop.cmzmgb
summary: >-
  A research poster from the School of Emergent Priorities builds and
  deploys a weighted round-robin scheduler for a farmers market's single
  shared card reader, holding every stallholder's device-time within 8% of
  an equal split across a fourteen-week trial. Device-time fairness shows
  no association with customer queue length at the stall left without the
  reader (r = 0.05).
topic: >-
  a round-robin fairness scheduler built for a farmers market's single
  shared card reader, and whether holding every stallholder's device-time
  equal has any bearing on the customer queue at the stall left without it
