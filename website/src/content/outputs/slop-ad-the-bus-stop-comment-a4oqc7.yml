summary: >-
  A marketing poster for the School of Emergent Priorities draws on Dr Ronja
  Oyelaran's interviews with riders about the comment-slip box on a bus-stop
  pole, which a transit authority tallies as one completed consultation per
  slip. On the strength of what riders said they were posting, the School
  undertakes to answer every slip in writing, blank ones included.
