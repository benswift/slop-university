summary: A research explainer from the School of Emergent Priorities on Runa Adegoke,
  Iben Chikere and Casimir Beng's taxonomy of how closely car-share renters verify
  a return checklist. It follows the toll-transponder field from the checklist app's
  own log into the last five minutes before the late-return fee, where answers given
  from memory peak while the scheme's completion rate holds steady. Each of the three
  authors carries part of the account in their own voice.
topic: A research explainer of the paper cataloguing which items on a car-share return
  checklist renters check against the vehicle and which they tick from memory, as
  the late-return fee's deadline approaches and a compulsory photo step is added to
  the toll-transponder field
