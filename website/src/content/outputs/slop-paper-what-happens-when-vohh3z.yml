doi: 10.5555/slop.vohh3z
summary: >-
  A paper from the School of Emergent Priorities reports the design and
  season-long deployment of PANTRY (Peer Assessment of Neighbourhood-Tested
  Recipes and Yields), a review-management workflow that applies
  double-anonymous review, proximity-weighted conflict-of-interest
  declarations, meta-review, and a seven-day rebuttal window to the 143
  recipe submissions of a suburban primary school's fundraiser cookbook.
  Every submission received a documented decision letter; volunteer
  inter-reviewer agreement (weighted kappa = 0.28) fell within the bands
  reported for academic venues; the rebuttal window changed no decision and
  is retained for completeness; and the organising committee has adopted
  the season's 49.7% acceptance rate as the cookbook's headline quality
  indicator.
topic: >-
  what happens when a school-fete fundraiser cookbook adopts
  conference-grade peer review for its recipe submissions ---
  double-anonymous slice recipes, conflict declarations for in-laws, a
  rebuttal window, and a deployed review-management system that reports the
  season's acceptance rate with pride
