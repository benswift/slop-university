title: PANTRY
subtitle: >-
  Conference-Grade Peer Review for a School-Fete Fundraiser Cookbook
authors:
  - Anneke Tolan
  - Petra Umbile
  - Ingrid Vasseur
preset: paper
school: School of Emergent Priorities
