title: Was It Really Only the Rain?
subtitle: A failed replication of the quarterly-wash null on pigeon-roosted campus roofs
authors:
  - Petra Umbile
  - Osei Vandermeer
  - Runa Adegoke
preset: research-poster
school: School of Emergent Priorities
