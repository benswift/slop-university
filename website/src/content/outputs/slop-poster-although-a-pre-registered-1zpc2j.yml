publishedAt: 2026-09-21T13:01:14+10:00
doi: 10.5555/slop.1zpc2j
summary: >-
  A research poster from the School of Emergent Priorities replicates a
  pre-registered null on quarterly rooftop-solar washing across 24 covered-walkway
  and bike-shelter roofs, over six quarters in four staggered sequences. The
  wash effect on the 14-day performance ratio is 1.8 percentage points (95% CI
  0.9 to 2.7), against 0.11 in the original trial, and rises from 0.2 to 3.9 with
  the size of the roost; campus facilities adopt both results, with roost status
  attested by the wash crew, whose attestations matched the independent dusk
  count on 14 of 24 roofs.
topic: >-
  Although a pre-registered trial found quarterly rooftop-solar washing changes
  nothing the rain has not already done, a replication on the pigeon-roosted
  walkway and bike-shelter roofs of one campus finds a wash effect that fails the
  original equivalence bounds, and the Facilities attestation form now adopts
  both results
