summary: >-
  A research poster from the School of Underlying Conditions samples a 160 cm
  section of one archived pelagic core at 4 cm spacing through a 31 cm clay
  horizon, and uses the insoluble residue as a conserved quantity to restore
  the carbonate ooze dissolved from beneath it. The clay holds the residue of
  2.43 m of background ooze and the fragmented zone below it restores from
  38 cm to 0.96 m, bounding the seafloor consumed by the event at 3.0 m.
topic: >-
  how much seafloor an acidification event dissolved: restoring the carbonate
  burnt down beneath a clay horizon in one pelagic sediment core, from the
  insoluble residue it left behind
