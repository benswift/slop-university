summary: >-
  A case-for-support brochure from the School of Settled Matters invites
  partners and donors to back its work on the closing words of a forensic
  toxicology report, following how a phrase such as "below the reporting limit"
  comes to carry one settled meaning in court. Features set at the certificate,
  the sampled consignment and the witness box rest the case on seven published
  studies from across the University's four Schools.
