summary: >-
  A research poster from the School of Continuous Improvement sorts
  common-room biscuits into a four-kind taxonomy and certifies every
  restock against it. Certifier agreement holds overall but collapses for
  the kind trolley staff apply whenever a shortfall must be filled from
  stock already on hand.
topic: >-
  a four-kind taxonomy of tea-room biscuits, certified by a common-room
  panel, that now governs which packet Facilities may restock into a tin's
  rotation and which must be relabelled to fill a short kind
