summary: >-
  A case-for-support brochure from the School of Underlying Conditions invites
  partners to stand behind the protection of buried sites in place, through
  the School's groundwater fieldwork, soil survey and habits of record-keeping
  in place of excavation. It sets out three strands of work on the water
  table, the burial environment and the custody of records, and rests its
  appeal on eight published outputs cited by title and DOI.
topic: >-
  keeping buried sites buried: the case for supporting the earth-science work
  that protects archaeology by watching the ground and the water around it
  instead of opening it
