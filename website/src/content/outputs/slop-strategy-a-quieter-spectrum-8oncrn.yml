summary: >-
  Slop University's Strategic Plan 2026-2031 builds a University-wide
  capability in electromagnetic wave absorption materials around three
  priorities: a shared library of every absorber the University makes,
  characterised across its full measured range; one chamber with a single
  measurement protocol and a termly reference tile; and a room-by-room survey
  and treatment of the University's own estate, beginning where its
  instruments interfere with each other.
