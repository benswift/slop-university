title: Passing Made It Worse
subtitle: >-
  A Failed Replication of the Horizon Register's Completion-Tracks-Comprehension
  Finding at Three Junior-Sport Codes
authors:
  - Torun Ezeigwe
  - Ingeborg Nwachukwu
  - Anneke Tolan
preset: paper
school: School of Continuous Improvement
date: 2026-09-12
publishedAt: "2026-09-12T22:31:28+10:00"
doi: 10.5555/slop.bneh8f
summary: >-
  A paper from the School of Continuous Improvement replicates the Horizon
  Register's induction-module audit at a regional junior-sport association's
  mandatory concussion-recognition module, testing 187 volunteer coaches
  across sixteen football, netball and cricket clubs with an unannounced
  comprehension check two weeks after certification. Unlike the original
  finding, comprehension holds high and steady regardless of completion
  speed, and the association's response to the reassuring result is to
  double the check's frequency and publish a per-club league table.
topic: >-
  Two weeks after volunteer junior-sport coaches complete a
  concussion-recognition module, 89% pass an unannounced comprehension check
  -- a failed replication of the University's induction-module finding that
  completion tracks finishing, not understanding.
