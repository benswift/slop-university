title: Was the Junction Potential Subtracted?
subtitle: Recovering an Unrecorded Voltage Correction from the Archived Recordings of a Concluded Potassium-Channel Programme
authors:
  - Anselm Threlkeld
  - Joost Nwosu
preset: paper
school: School of Settled Matters
date: 2026-11-08
publishedAt: "2026-11-08T15:32:18+11:00"
doi: 10.5555/slop.mish5v
summary: >-
  A paper from the Schools of Settled Matters and Continuous Improvement reads
  the tail-current reversal potentials of 287 archived whole-cell recordings of
  a delayed-rectifier potassium channel to recover whether each had its liquid
  junction potential subtracted, a correction the programme's notebooks state
  for only 37 of them. Calibrated on those 37, the traces settle 129 of 141
  silent gluconate-era files in agreement with the acquisition headers, and
  re-referencing every file reduces the 8.2 mV activation shift the programme
  attributed to a C-terminal tag to 2.2 mV.
topic: >-
  whether an archived set of whole-cell recordings of a voltage-gated potassium
  channel had its liquid junction potential subtracted, when the notebook does
  not say and the recording's author cannot be asked: recovering the unrecorded
  correction from the traces themselves
