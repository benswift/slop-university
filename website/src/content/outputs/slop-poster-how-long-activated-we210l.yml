doi: 10.5555/slop.we210l
summary: >-
  A research poster from the School of Continuous Improvement assigns 224
  vacuum-dried activated-carbon electrode discs to seven bench intervals of up
  to a week in open laboratory air before coin-cell assembly, measuring their
  water re-uptake by Karl Fischer titration in a drier and a more humid band of
  the semester. Most re-uptake happens within six hours, and capacitance
  retention after 10,000 cycles at 2.7 V in organic electrolyte falls from 94
  per cent for direct transfer to 69 per cent after a week, tracking water
  content more closely than elapsed time; re-drying restores it to within one
  point.
topic: >-
  How long activated-carbon electrodes wait on the bench between vacuum drying
  and coin-cell assembly, and what the moisture they take up in that interval
  does to supercapacitors cycled at 2.7 V in organic electrolyte
