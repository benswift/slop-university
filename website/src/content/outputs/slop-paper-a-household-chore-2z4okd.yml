title: Photographed, Not Done
subtitle: >-
  Design and a Ten-Week, 41-Household Deployment of Latch, a Chore-Gated
  Wi-Fi Captive Portal
authors:
  - Osei Vandermeer
  - Casimir Beng
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
