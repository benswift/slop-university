doi: 10.5555/slop.2z4okd
summary: >-
  A paper from the School of Continuous Improvement reports a ten-week,
  41-household deployment of Latch, a captive-portal overlay that withholds a
  device's evening Wi-Fi lease until its owner uploads a photograph of a
  nominated chore area, checked against a stored reference image. Fleet-wide
  compliance climbs to a plateau within a month and holds regardless of a
  rising share of reused photographs the classifier cannot distinguish from
  fresh ones, and a staff router subsidy now renews solely on the certified
  compliance streak.
topic: >-
  A systems paper: can a household Wi-Fi captive portal that gates each
  evening's internet access behind a photographed, timestamped
  chore-completion form actually get the dishes and washing done?
