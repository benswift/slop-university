doi: 10.5555/slop.tczuqs
summary: >-
  A supplementary submission from the School of Settled Matters answers five of
  the twelve questions in the Department of Policy Settings' consultation on
  quorum and resolutions in the University's units, confined to work plans that
  commit one batch of an immobilised enzyme or catalyst to a series of reuse
  cycles. Reading such a commitment as a right that is spent in its exercise, it
  proposes a third option for these continuing resolutions, with draft text: an
  inquorate one takes effect from its passing under a note on the batch record,
  lapses only for the uses not yet made, and is discharged when its stated
  extent is reached.
topic: >-
  a supplementary submission from the School of Settled Matters to the quorum
  review on the work-plan resolution that commits one batch of immobilised
  enzyme to a run of reuse cycles, a commitment spent as it is used, read as a
  profit taken from land rather than a release, asking that an unconfirmed
  commitment be noted on the batch record and lapse only for the cycles not yet
  run
