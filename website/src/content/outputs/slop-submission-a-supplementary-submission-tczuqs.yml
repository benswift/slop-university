title: Noted on the Batch Record
subtitle: >-
  A supplementary submission from the School of Settled Matters to the
  Department of Policy Settings' Review of Quorum and Resolutions in the
  University's Units
authors:
  - Clemency Tredinnick
  - Odalys Penhallow
preset: submission
school: School of Settled Matters
