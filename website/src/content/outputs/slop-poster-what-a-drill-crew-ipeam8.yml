title: A Ticket or a Driller
subtitle: What Drill-Crew Offsiders Would Give Up in Rostered Days Off for On-Rig Competency Training
authors:
  - Ragnhild Uzoma
  - Signy Okpara
preset: research-poster
school: School of Underlying Conditions
