doi: 10.5555/slop.ipeam8
summary: >-
  A research poster from the School of Underlying Conditions reports a
  discrete choice experiment in which 184 offsiders on 23 exploration drilling
  rigs chose between competency-training packages priced in rostered days
  off. Two latent classes nearly mirror each other: ticket-seekers (57%)
  would give up 2.7 days for full unit credit and crew-keepers (43%) 2.1 days
  to be taught by their own driller, and offering both packages lifts
  predicted uptake from 46% under the current tablet programme to 74%.
topic: >-
  What a drill-crew offsider will give up for training: a discrete choice
  experiment on the format of on-rig competency training, with willingness to
  trade expressed in rostered days off
