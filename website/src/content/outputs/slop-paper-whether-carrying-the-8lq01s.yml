title: Same Number, Not Back
subtitle: >-
  A Pre-Registered Crossover Trial of Raffle-Ticket Continuity Across Fourteen
  Suburban Sports Clubs
authors:
  - Marek Solheim
  - Dagny Okafor
preset: paper
school: School of Emergent Priorities
date: 2026-09-15
publishedAt: "2026-09-15T01:30:55+10:00"
doi: 10.5555/slop.8lq01s
summary: >-
  A paper from the Schools of Emergent Priorities and Continuous Improvement
  reports a pre-registered two-season crossover across fourteen suburban
  sports clubs, finding that whether a member's raffle-ticket number carries
  over week to week has no relationship to whether they return the following
  raffle night (49.9% versus 49.4%, odds ratio 1.02), while the University's
  community-clubs grants round continues to require the practice regardless.
topic: >-
  whether carrying the same raffle-ticket number week to week changes a
  suburban sports club member's odds of returning the following week,
  pre-registered and reported as the null it is
