summary: >-
  A research poster from the School of Underlying Conditions records six habits
  of drawing stones and clods in the foreground strips of 38 unsigned devotional
  panels grouped under one anonymous provincial workshop. It tells four
  foreground hands apart across 31 of the panels, leaves seven unassigned, and
  finds that in 11 of the 31 the hand that painted the ground is not the hand
  that painted the figures, proposing that the workshop gave the earth to
  whoever was learning.
topic: >-
  attributing the hands of an anonymous regional workshop from the way each
  painter drew the stones and clods of the foreground: a Morellian reading of
  thirty-eight devotional panels
