title: Still Enough to Be Absent
subtitle: >-
  The Department of Policy Settings answers questions taken on notice by the
  Committee on Settings Oversight on the after-hours setback in the shared
  electrophysiology rooms
authors:
  - Ingeborg Nwachukwu
  - Casimir Beng
  - Marit Osayande
  - Dagny Okafor
preset: questions-on-notice
date: 2026-11-18
publishedAt: "2026-11-18T12:31:50+11:00"
doi: 10.5555/slop.4u1qhe
summary: >-
  The Department of Policy Settings answers five questions on section 9 of the
  Slop University (Building Services) Determination 2025, under which a space
  is conditioned after hours only while its sensor has registered movement in
  the preceding 30 minutes, as it applies to the two shared electrophysiology
  rooms of the Sciences Annexe, taken on notice at the Committee on Settings
  Oversight's Supplementary hearings of 16 November 2026 or lodged in writing
  after them. Its answers report setback beginning during a booking on 33 of 41
  booked room-nights since 1 September, with a lowest recorded room temperature
  of 17.1 °C; set out a rig induction checklist that tells operators both to
  keep still and to move every 20 minutes; decline a session-by-session account
  on resourcing; hold no evaluation of the setting's effect on research; and
  refer the question of overnight bookings to the Department's consultation on
  the maximum continuous booking.
topic: >-
  the after-hours thermal setback: the Committee presses the Department on the
  building setting that lets the shared electrophysiology rooms cool overnight,
  when the University's long ion-channel recordings run
