title: The Magnet Did Not Predict Who Washed Up
subtitle: Does a fridge chore chart's assignment forecast the RFID-logged doer across a school term of kitchen tasks?
authors:
  - Osei Vandermeer
  - Marek Solheim
  - Petra Umbile
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-27
publishedAt: "2026-08-27T19:31:16+10:00"
doi: 10.5555/slop.8srf3i
summary: >-
  A research poster from the School of Continuous Improvement tags a
  fridge chore chart's magnets with RFID and reads presence at the sink,
  bin store and laundry door across a 14-week school term in 46
  households, finding the assigned name matches the logged doer in 22% of
  1,142 task-instances --- statistically indistinguishable from the 20%
  expected under chance assignment, with no improvement across the term.
topic: >-
  does a fridge-magnet chore chart's task assignment actually predict who
  does the dishes, tracked with RFID-tagged magnets and a load-cell-backed
  board across ordinary kitchens over a school term
