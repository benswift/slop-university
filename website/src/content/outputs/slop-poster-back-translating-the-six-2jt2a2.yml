title: Loosened in Translation
subtitle: >-
  Clause-Level Divergence Across Six Community-Language Versions of One
  Council's Hall-Hire Conditions
authors:
  - Torun Ezeigwe
  - Ingeborg Nwachukwu
  - Solveig Adeyemi
preset: research-poster
school: School of Continuous Improvement
date: 2026-07-28
publishedAt: 2026-07-28T12:05:39+10:00
doi: 10.5555/slop.2jt2a2
summary: >-
  A research poster from the School of Continuous Improvement back-translates
  the six community-language versions of a metropolitan council's community-hall
  hire conditions, coding all 186 clause-instances against the 31-clause source
  and finding 43 divergent, of which 30 loosen an obligation and nine drop it
  entirely. Bookings issued a version in which a clause had loosened or vanished
  are pulled up on that clause roughly three times as often, while hirer
  certainty about the conditions is flat across versions.
topic: >-
  back-translating the six community-language versions of a council's
  community-hall hire conditions, coding where each rule loosens, tightens, or
  vanishes, and checking those divergences against what hirers are actually
  pulled up on afterwards
