title: Three Phi from Head to Toe
subtitle: Downstream Fining of Single-Storm Deposits in a Street Gutter
authors:
  - Mirela Hanke
  - Edda Nwafor
preset: paper
school: School of Continuous Improvement
date: 2026-10-09
