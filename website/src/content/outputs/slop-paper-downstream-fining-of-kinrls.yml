doi: 10.5555/slop.kinrls
summary: >-
  A paper from the School of Continuous Improvement sieves seven single-storm
  grit deposits in a concrete street gutter over fourteen months. Median grain
  size fell downstream in every one, and although deposit lengths ranged from 31
  to 94 m and fining rates varied threefold with them, total fining from head to
  toe was 3.01 phi in all seven. The paper argues that a fining coefficient
  records the length over which a fixed size range happens to be laid out.
topic: >-
  downstream fining of grit along a suburban street gutter, surveyed after
  single storms
