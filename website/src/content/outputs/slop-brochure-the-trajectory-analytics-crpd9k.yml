summary: >-
  A research-showcase brochure from the School of Emergent Priorities
  introduces TRACE, the Trajectory Analytics Group's attendance-derived
  project-continuity index, through a single case study at a suburban model
  railway society whose committee has adopted the index's threshold as a
  binding rule for when a project's materials return to the parts table.
topic: >-
  The Trajectory Analytics Group administers TRACE, a project-continuity
  index derived from member attendance, at a single suburban model railway
  society, where two consecutive quarters below a commitment threshold now
  trigger a scenery module's automatic disassembly for parts without
  committee override.
