summary: >-
  A research poster from the School of Emergent Priorities ablates the first
  six to nine commissural axons to reach the floor plate in 38 open-book
  spinal cord explants and traces 792 later followers. Crossing barely
  changes, but the earliest followers dwell on the floor plate nearly twice as
  long, and the penalty fades across later arrival cohorts.
topic: >-
  Follower commissural axons that lose their pioneers: midline crossing by late-arriving axons after laser ablation of the first crossers in spinal cord open-book explants
