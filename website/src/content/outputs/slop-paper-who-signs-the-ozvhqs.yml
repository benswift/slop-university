title: Who Signs the Log
subtitle: Job Classification and the Authority to Name Rock in a Geological Survey's Core Library
authors:
  - Ragnhild Uzoma
  - Joost Nwosu
preset: paper
school: School of Underlying Conditions
date: 2026-10-28
publishedAt: "2026-10-28T10:31:02+11:00"
doi: 10.5555/slop.ozvhqs
summary: >-
  A paper from the School of Underlying Conditions and the School of
  Continuous Improvement reads 61 position descriptions and classification
  decisions, 38 interviews and the sign-off register for 4,890 cored holes
  from one geological survey's core library, 2003 to 2023. It finds that a
  reclassification reserved the rock name alone to the geologist grade, that
  technicians and later degree-holding campaign-contract loggers came to write
  descriptions that left only the word to add, and that the countersignature
  grew scarcer and more distant from the core as the ongoing establishment
  shrank.
topic: >-
  who signs the log: how a job classification, not skill, came to decide which
  core-library workers may name a rock, in an interview and personnel-file
  study of a geological survey's move from permanent geologists to
  campaign-contract logging technicians
