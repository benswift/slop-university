doi: 10.5555/slop.uwt6ao
summary: >-
  A research poster from the School of Continuous Improvement scores 52 takeaway
  shops' food-delivery-app ready-time estimates against a four-level revision
  maturity model, from Frozen to Reconciled, across 11,860 orders and sixteen
  weeks. Thirty-one shops sit at Level 2, each step up narrows the gap between
  promised and actual ready time chiefly by lengthening the promise, and staff
  lunch reimbursement is now confined to the nine shops at Level 3 or above.
topic: >-
