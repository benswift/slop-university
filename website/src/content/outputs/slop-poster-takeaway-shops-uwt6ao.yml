title: Most Takeaway Shops Stop at Level Two
subtitle: Fifty-two shops' app ready-time estimates scored against a four-level revision maturity model, and the Level Three line set on staff lunch reimbursement
authors:
  - Eivind Onwuka
  - Joost Nwosu
  - Casimir Beng
preset: research-poster
school: School of Continuous Improvement
