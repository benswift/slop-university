title: Uncoiled Is Watered
subtitle: >-
  The 2026-2031 Strategic Plan Treats Eighteen Metres of Garden Hose as the
  Watering Event, and a Coiled Dry Garden as the Variance It Will Close
authors:
  - Verity Marris
  - Fenna Okoro
  - Ronja Oyelaran
preset: strategy
school: School of Emergent Priorities
date: 2026-08-26
publishedAt: 2026-08-26T10:05:16+10:00
doi: 10.5555/slop.3l3y0y
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to
  treating eighteen metres of uncoiled garden hose as a published watering
  event, whether the garden got wet or not. A Yard Run Encoder, a Hose-Metre
  Ledger, and a coil-without-run variance give the backyard tap a published
  account, a target, and a review cycle.
topic: >-
  Eighteen metres of uncoiled hose is this plan's published watering event, whether the garden got wet or not
