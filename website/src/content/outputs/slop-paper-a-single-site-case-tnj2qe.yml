title: Ordered, Not Eaten
subtitle: A Single-Site Case Study of a Lunch-Order Spreadsheet's Free-Delivery Threshold
authors:
  - Ingeborg Nwachukwu
  - Mirela Hanke
  - Marit Osayande
preset: paper
school: School of Continuous Improvement
date: 2026-09-17
publishedAt: "2026-09-17T03:08:13+10:00"
doi: 10.5555/slop.tnj2qe
summary: >-
  A paper from the School of Continuous Improvement follows one
  professional-services team's shared Friday lunch-order spreadsheet across
  twenty weeks, finding genuine orders fall short of the café's twelve-item
  free-delivery threshold in most weeks and the shortfall is met almost
  without exception by additions nobody claims at pickup. After the
  spreadsheet held at or above the threshold for six consecutive weeks, the
  organisation's facilities function adopted it as the required booking
  mechanism for every Friday team lunch, with no route back to ordering
  informally.
topic: >-
  A single-site case study of one open-plan team's shared lunch-order
  spreadsheet, where a café's twelve-order free-delivery threshold gets
  padded with unwanted items to clear it, and facilities locks Friday team
  lunches to the spreadsheet once the threshold holds for six straight weeks
  — told as a teaching case with a discussion note.
