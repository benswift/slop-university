title: The Monday Nose
subtitle: Weekend Recovery and Weekday Re-adaptation of Odour Thresholds for a Workplace's Own Cleaning Fragrance
authors:
  - Signy Okpara
  - Edda Nwafor
  - Thandiwe Solberg
preset: research-poster
school: School of Continuous Improvement
