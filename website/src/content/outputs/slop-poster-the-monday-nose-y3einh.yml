doi: 10.5555/slop.y3einh
summary: >-
  A research poster from the School of Continuous Improvement tracks the
  detection thresholds of 64 office staff for their own building's scented
  floor-cleaning product at Monday, Wednesday and Friday sessions over ten
  weeks, against 22 visitors and an n-butanol control, finding that a weekend
  away recovers about half of the staff's Friday deficit and that the gain is
  spent again by Wednesday.
topic: >-
  the Monday nose: staff detection thresholds for their own building's
  cleaning fragrance recover over each weekend away and climb back across the
  working week, a psychophysical study of long-term olfactory adaptation
