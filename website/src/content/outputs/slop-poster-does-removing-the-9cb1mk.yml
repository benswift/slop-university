doi: 10.5555/slop.9cb1mk
summary: >-
  A research poster from the School of Continuous Improvement replicates the
  University's retail performance-review finding --- that removing a rating
  scale's neutral option raises formal appeals --- inside 164 households
  running their own weekly fairness ballot. The design change that moved
  appeals in the workplace leaves household grievance-flags statistically
  unchanged, and the Evaluation of Evaluation program adopts the redesign
  across every family-facing program regardless.
topic: >-
  Does removing the neutral 'fine' option from a household's weekly
  kitchen-table fairness ballot increase how often someone raises a formal
  grievance at the next family meeting, the way appeals rose once a retail
  chain's performance-review scale lost its own midpoint?
