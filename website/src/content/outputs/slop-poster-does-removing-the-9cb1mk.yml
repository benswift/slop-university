title: No Midpoint, No Motion
subtitle: A Failed Household Replication of a Retail Performance-Review Appeals Effect
authors:
  - Mirela Hanke
  - Dagny Okafor
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-14
