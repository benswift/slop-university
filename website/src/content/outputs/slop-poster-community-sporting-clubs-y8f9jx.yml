title: Towards Full Assurance
subtitle: >-
  A Five-Level Maturity Model for Club Working-with-Children-Check
  Administration
authors:
  - Marek Solheim
  - Torun Ezeigwe
  - Casimir Beng
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-06
publishedAt: "2026-09-06T09:03:15+10:00"
doi: 10.5555/slop.y8f9jx
summary: >-
  A research poster from the School of Emergent Priorities scores 48
  community sporting clubs against a five-level working-with-children-check
  administration maturity model across three audit rounds in one season,
  finding assessed tier tracks the days remaining to the next audit (r =
  0.71) more closely than any independent record of onboarding practice, and
  that clubs below Level 4 are 2.6 times more likely to drop a marginal
  volunteer from the roster in the following fortnight.
topic: >-
  Community sporting clubs' working-with-children-check paperwork, scored
  against a five-level maturity model running from ad hoc to fully assured.
