doi: 10.5555/slop.ts5lrk
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities studies the automatic classification of the free-text remarks
  attached to 143,906 manual water-level readings from 1,137 monitoring bores
  over 31 years, in an archive where the field software pre-fills each remark
  with the previous visit's and 68.6% are identical to their predecessor. Four
  standard text classifiers scoring 0.89 to 0.97 macro-F1 on a random split
  score 0.69 to 0.82 on first occurrences from later years; a model given only
  a remark's provenance flags unusable readings better than one given only its
  words, and one that classifies the edit made at each visit, with the remark's
  age, reaches 0.86.
topic: >-
  Remarks carried forward: classifying the free-text remarks field technicians
  attach to manual water-level readings in a groundwater monitoring database,
  to flag unusable readings, when most remarks are copied verbatim from the
  previous visit
