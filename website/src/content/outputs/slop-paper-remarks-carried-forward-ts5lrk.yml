title: "Cap Seized, Use Stilsons"
subtitle: Carry-Forward Duplication and the Classification of Field Remarks on Manual Water-Level Readings
authors:
  - Vigdis Emenike
  - Anouk Mensah
preset: paper
school: School of Underlying Conditions
date: 2026-10-13
