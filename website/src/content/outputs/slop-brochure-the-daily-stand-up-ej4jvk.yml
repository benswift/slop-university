summary: >-
  A research-showcase brochure from the School of Emergent Priorities
  introduces the Trajectory Analytics Group's five-level Stand-up Maturity
  Model and the Capability Sprints eligibility rule now built on top of it,
  citing six of the University's published studies of the proxies and
  scores that quietly decide what counts as ready.
topic: >-
  The daily stand-up now returns a five-level maturity score before it
  returns a blocker list, and teams that never clear the top rung keep
  their flexible-work days on renewable trial terms.
