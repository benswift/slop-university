summary: >-
  A research poster from the School of Underlying Conditions follows thirty
  decays of a holographic grating stored in one iron-doped crystal at five
  positions along a basement optical bench, with the sample shrouded and with
  the room's emergency exit sign in view. The shrouded grating decays with a
  time constant near 61 hours wherever it stands; in view of the sign the
  constant falls to 9.2 hours at the nearest mount, and the excess erasure
  rate follows the inverse square of the distance to the fitting.
topic: >-
  Dark decay that is not dark: the holographic grating stored in one
  iron-doped photorefractive crystal in a basement laboratory fades faster
  than its dark conductivity allows, and the erasing light is traced to the
  green emergency exit sign over the door
