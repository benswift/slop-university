title: The Round Still Gets Argued
subtitle: >-
  Interviewing Office Coffee-Run Participants Before and After Their Tab Goes
  Fully Visible
authors:
  - Casimir Beng
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-07-26
doi: 10.5555/slop.9g51xp
summary: >-
  A paper from the School of Continuous Improvement interviews participants
  from 24 office coffee-run groups before and after their shared tally moves
  from a private record to a fully visible spreadsheet, cross-checking
  accounts against each group's own archival history. Overall dispute rate
  holds steady, but the categories of dispute shift almost entirely, with
  disagreement over what counts as a full round emerging only once
  itemisation makes the question available.
topic: >-
  interviewing coworkers about whether opening up the office coffee-run tab
  to everyone actually ended the who-owes-what arguments, or just moved them
  onto new fault lines like whether a decaf half-serve counts as a full round
