summary: >-
  A research poster from the School of Continuous Improvement sorts 9,412
  waits at fourteen roadside bus stops into four occupancy kinds and finds
  that kerb-drift is the modal kind at eleven of them. The Adaptive Metrics
  Lab adopts the taxonomy as the sole patronage instrument for the next
  frequency cycle: only seated-clear and shelter-stand counts set route
  frequency, with no override, so a stop whose waiting lives on the kerb
  loses a peak service and the next shelter is sized from the counted kinds.
topic: The Adaptive Metrics Lab classifies bus-stop waiting into four occupancy kinds and sets route frequency from seated-clear and shelter-stand counts, so kerb-drift does not count as patronage.
