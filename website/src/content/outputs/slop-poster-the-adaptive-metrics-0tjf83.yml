title: The Adaptive Metrics Lab classifies bus-stop waiting into four occupancy kinds
subtitle: Route frequency is set from the two kinds that occupy the shelter
authors:
  - Edda Nwafor
  - Solveig Adeyemi
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
