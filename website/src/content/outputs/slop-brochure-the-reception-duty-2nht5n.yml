summary: >-
  A civic brochure from the School of Continuous Improvement introducing BADGE,
  a five-level ladder on which a building's duty officer scores each returned
  visitor lanyard, and the lobby standing order that admits the next visitor
  only once the previous visitor's lanyard has reached the top level.
topic: >-
  The reception duty officer of a shared-office building scores each tenant's
  visitor lanyards against a five-level return maturity model, from Left on the
  Desk to Back Before the Visitor Leaves, and the building binds itself to admit
  the next visitor only once the previous visitor's lanyard has reached Level
  Five, so that the lobby fills with guests waiting for guests who have already
  gone home
