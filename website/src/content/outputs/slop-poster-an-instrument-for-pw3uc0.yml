doi: 10.5555/slop.pw3uc0
summary: >-
  A research poster from the School of Continuous Improvement audits
  recognition of a regular's usual order across 22 café sites and 236
  regulars in the seven weeks either side of a full rebrand. Component-level
  recall (drink type, size, temperature, milk, extras) holds broadly steady,
  but the unprompted "usual" call collapses from 93% to 61%, a pattern the
  team reads as cue-dependent retrieval rather than durable person memory.
topic: >-
  an instrument for auditing whether café staff still recognise a regular's
  usual order once a rebrand removes every visual cue they used to rely on
