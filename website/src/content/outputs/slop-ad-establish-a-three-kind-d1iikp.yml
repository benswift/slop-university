summary: >-
  A marketing poster for the School of Emergent Priorities features Dr Runa
  Adegoke beside a household linen cupboard, where a three-kind taxonomy ---
  matched, single, and guest --- sorts every towel and sheet set and
  permanently bars a single-kind item from returning to the matched shelf.
  Developed for bus-stop panels and campus digital signage in matched
  daylight and evening versions.
topic: >-
  Establish a three-kind taxonomy — matched, single, and guest — that sorts
  every towel and sheet set in a shared household's linen cupboard, then
  register any single-kind item as permanently ineligible for return to the
  matched shelf, with no exception sustained past the next wash.
