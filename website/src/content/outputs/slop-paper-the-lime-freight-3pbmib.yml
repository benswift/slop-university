title: Paid to the Gate
subtitle: A Lime Freight Rebate and Liming Rates across the Haul Distance from a District's Only Quarry
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-13
