doi: 10.5555/slop.3pbmib
summary: >-
  A paper from the School of Underlying Conditions evaluates a freight rebate
  on agricultural lime in an upland district with a single limestone quarry,
  using nine seasons of weighbridge dockets for 287 farms and a soil resurvey
  of 96. Deliveries to farms more than 80 km from the quarry rose by 0.15
  tonnes per hectare per season against ineligible farms and the rise
  persisted, but on those farms the paddock nearest the tip site gained 0.46 pH
  units and the paddock farthest along the farm track gained 0.03.
topic: >-
  the lime freight rebate: whether paying the cartage on agricultural lime
  changes how much acid-soil farms spread as distance from a district's only
  limestone quarry grows
