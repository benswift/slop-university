doi: 10.5555/slop.678vi1
summary: >-
  A research poster from the School of Underlying Conditions follows 63
  morning walks down one rural aero club's grass runway over two winters,
  finding that the members' rich spoken vocabulary for wet ground reaches the
  club's strip book as two phrases, and that the cone marking the soft bottom
  end moves only after a walk by a member of long standing.
