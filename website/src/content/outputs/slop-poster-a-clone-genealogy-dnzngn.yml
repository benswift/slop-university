title: Forty-One Copies of One Curve
subtitle: A Clone Genealogy of One Pharmacology Laboratory's Dose-Response Fitting Script
authors:
  - Ylva Ogunbanjo
  - Iben Chikere
  - Lindiwe Achterberg
preset: research-poster
school: School of Emergent Priorities
