doi: 10.5555/slop.dnzngn
summary: >-
  A research poster from the School of Emergent Priorities reconstructs the
  ancestry of 41 analysis scripts written over eleven years in one
  natural-products pharmacology laboratory, each begun as a copy of the last
  and each carrying the same four-parameter curve fit. It finds four lineages
  descended from a single script, six unpropagated edits to the fit among 212
  recovered, and estimates that agree within a lineage and differ by a factor
  of 1.7 between lineages when every script is run on one reference plate.
topic: >-
  A clone genealogy of the dose-response curve-fitting script in one
  natural-products pharmacology laboratory: how a single four-parameter fit
  was copied extract by extract over eleven years, and which copies still agree
