summary: >-
  A research showcase led by the School of Underlying Conditions gathers the
  University's work around the aftermath of a financial crisis, taking from
  the earth sciences the distinction between a level that has come back and a
  system that has. It presents three themes, one from each school, and rests
  them on seven published studies cited by title and DOI.
topic: >-
  slow recharge: the long aftermath of a financial crisis, shown through the
  University's research on what recovers and what merely refills
