title: The Annual Records Extract
subtitle: >-
  A Department of Policy Settings consultation paper on the census-date
  snapshot of the University's administrative records and the changes it does
  not hold
authors: []
preset: consultation-paper
date: 2026-11-24
publishedAt: "2026-11-24T03:00:47+11:00"
doi: 10.5555/slop.qyx5m7
summary: >-
  The Department of Policy Settings consults the schools on the Slop University
  (Records Extract) Determination 2019, under which seven classes of
  administrative record are copied as they stand on the last business day of
  March and released each July under keys issued for that extract alone.
  Noting work in the schools that mines the order in which records change,
  which a snapshot does not hold, it sets out four options: retaining the
  annual snapshot, quarterly census dates, an annual snapshot with a log of
  the year's changes, or a standing log whose keys hold across years. It poses
  nine questions and has formed no view.
topic: >-
  The annual census-date extract of the University's administrative records
  released to researchers who mine them, and whether a snapshot should give
  way to a log of changes
