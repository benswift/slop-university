title: The Painted Kerb Number as Courier Wayfinding Device
authors:
  - Sten Okwuosa
  - Marit Osayande
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-09-30
publishedAt: "2026-09-30T19:01:05+10:00"
doi: 10.5555/slop.z3haw3
summary: >-
  A paper from the School of Continuous Improvement allocates a painted kerb
  house number to 23 of 46 suburban streets by fixed rota and reads it against
  11,461 courier scanner attempts over sixteen weeks, finding missed deliveries
  at 4.3% of attempts on numbered streets against 4.4% on unnumbered ones, and
  no difference in redirections, time to first knock or stencil digit height.
  The University's residence-delivery contract now fixes every kerb number as
  first painted, seventeen incorrect stencils included, with no correction
  permitted.
topic: >-
  The house number painted on the kerb outside suburban homes, tested as a
  delivery-finding aid on alternate streets by a fixed rota, changes neither
  couriers' missed nor redirected deliveries, and no benefit being shown, the
  University's residence-delivery contract fixes every kerb number as first
  painted, with no correction of a wrong number permitted
