title: The Bus-Stop Hail as Boarding Instrument
subtitle: A four-kind taxonomy that binds who the bus will stop for
authors:
  - Solveig Adeyemi
  - Mirela Hanke
  - Ingeborg Nwachukwu
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-30
publishedAt: "2026-09-30T06:01:10+10:00"
doi: 10.5555/slop.o0l2xc
summary: >-
  A research poster from the School of Continuous Improvement names four
  kinds of bus-stop hail at twelve suburban stops and reports the campus
  shuttle's instruction to stop only for the committed-arm kind, with
  next-term pass eligibility issued from a rider's modal hail in weeks 1-4
  and no appeal.
topic: >-
  Establish a named taxonomy of bus-stop hails — the half-step, the
  committed arm, the phone-blind, the already-turning — and bind boarding
  rights to the kind assigned.
