title: To the Nearest Eighth
subtitle: A postgraduate prospectus argued from a dial with eight marks on it.
authors:
  - Thandiwe Solberg
  - Solveig Adeyemi
  - Fenna Okoro
preset: brochure
school: School of Continuous Improvement
date: 2026-08-15
publishedAt: 2026-08-15T09:01:53+10:00
doi: 10.5555/slop.cq5yst
summary: >-
  A prospectus brochure inviting postgraduate applicants into both Schools from
  a single roadside instrument --- the eight-mark fuel dial a hire-car return
  bay settles a refuelling charge from --- and setting out the Master of
  Applied Measurement, the Master of Priority Studies, the Capability Sprints
  line, and the Demo Quarter showcase around the habit of walking a figure back
  to the tool it was taken with. Two of the University's own published studies
  are cited by title and DOI in place of a claim about them.
topic: >-
  the hire-car return bay's condition form, where a car's fuel level is settled
  by ticking the nearest eighth on a printed dial and both the customer's
  refuelling charge and the depot's fleet fuel-recovery reporting follow those
  ticks --- an instrument too coarse to resolve what it decides, and the case
  for a university that goes and looks at the tool a number was collected with
