summary: >-
  A research poster from the School of Underlying Conditions treats the
  drilling-spoil aprons around 74 groundwater monitoring bores, drilled between
  1963 and 2019 on one alluvial plain, as a chronosequence dated by the bore
  register. It finds no visible A horizon on any apron younger than 12 years,
  surface organic carbon closing half its gap to the paired reference soil
  about every 25 years, and grout and pad rubble, not age, deciding whether an
  apron keys out as a Technosol or a Regosol.
topic: >-
  A chronosequence of the small soils that form on drilling-spoil aprons around
  groundwater monitoring bores, dated by each bore's installation year
