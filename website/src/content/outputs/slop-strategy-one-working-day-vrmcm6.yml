title: One Working Day, Wherever We Work
subtitle: A plan to hold every contract, field crew and visiting appointment to a single standard of decent work
authors:
  - Ragnhild Uzoma
  - Runa Adegoke
preset: strategy
school: School of Underlying Conditions
date: 2026-10-31
