summary: >-
  Slop University's Strategic Plan 2026-2031 commits the University to a
  single Employment Standard for every working relationship it holds, in any
  jurisdiction, with the more protective of the Standard and local law
  prevailing. Five priorities carry the Standard from the recorded working day
  and protected rest to field crews, casual staff and visiting appointees,
  delivered in three phases across the plan period.
topic: >-
  one working day wherever the University works: a plan to hold every
  contract, field crew and visiting appointment, at home and abroad, to a
  single international standard of decent work
