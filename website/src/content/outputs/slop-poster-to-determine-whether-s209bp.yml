doi: 10.5555/slop.s209bp
summary: >-
  A research poster from the School of Continuous Improvement reports a
  pre-registered 78-week study of 47 open-plan floors, finding that a published
  no-meeting Wednesday does not reduce same-week after-hours email (mean Δ =
  0.05 sends/person/week; r = 0.04). On the strength of the null, People &
  Culture writes the day into the team charter as a standing fixture, with
  internal room bookings refused and no manager override.
topic: >-
  To determine whether a published no-meeting Wednesday reduces same-week
  after-hours email volume.
