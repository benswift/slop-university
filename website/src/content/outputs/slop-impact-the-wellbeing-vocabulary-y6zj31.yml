doi: 10.5555/slop.y6zj31
summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 covers a
  program of work scoring 1.9 million words of staff-facing welfare
  communication from 64 collaborating organisations. Three strands cover a
  reading instrument for leave policies, roster notices and similar documents,
  a Living Dashboard tile showing an employer the register of its own
  messages, and Capability Sprints and Demo Quarter sessions in which the
  people who write notices redraft them and score them again.
topic: >-
