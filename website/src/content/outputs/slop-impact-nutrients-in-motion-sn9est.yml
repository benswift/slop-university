summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 looks back on
  a catchment program in which the School followed 9,412 soil and water samples
  from the hand that took them to the result that was filed. It reports a
  narrowing spread between seven laboratories on a shared reference sample, a
  status board whose readers consulted the date before the figure, a review
  calendar moved to the months when sampling runs were being completed, and a
  storm-sampling trigger agreed in writing by the volunteers who answer it.
