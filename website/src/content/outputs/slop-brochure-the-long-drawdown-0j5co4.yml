summary: >-
  A civic brochure offering the University to the district's retirees and
  near-retirees as a place to spend the time a working life puts by. It sets
  out three ways in (a Capability Sprints evening that reads a retirement-fund
  statement line by line without advising on it, the School of Underlying
  Conditions' bore-dipping round, and a public season of Futures in
  Committee) and grounds them in six published studies cited by title and DOI.
