summary: >-
  A paper from the School of Continuous Improvement scores 42 community
  choirs against a five-level Vocal Warm-Up Maturity Model, finding assigned
  level only weakly tracks singers' self-reported vocal strain even as the
  region's choirs association ties shared rehearsal-hall booking priority
  and instrument-loan access to the score.
topic: >-
  Community choir vocal-warm-up routines, scored against a five-level
  maturity model, with the local choirs association tying shared
  rehearsal-hall booking priority and the instrument-loan pool to a choir
  reaching Level 3.
