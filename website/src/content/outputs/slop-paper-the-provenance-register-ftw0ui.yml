title: Towards a Provenance Taxonomy for Donated Philatelic Lots
subtitle: A Five-Kind Register and the Exhibition Eligibility Rule It Now Enforces
authors:
  - Edda Nwafor
  - Thandiwe Solberg
  - Renke Sabel
preset: paper
school: School of Continuous Improvement
date: 2026-09-29
publishedAt: "2026-09-29T01:02:05+10:00"
doi: 10.5555/slop.ftw0ui
summary: >-
  A paper from the School of Continuous Improvement develops a Provenance
  Register that open-codes 214 donation-intake records at a suburban
  philatelic society into a five-kind taxonomy of documented ownership
  history, and reports the society's Exhibition Eligibility Rule, which
  admits only the two most thoroughly documented kinds to competitive
  judging and bars the remaining three for the life of the collection,
  regardless of catalogue value.
topic: >-
  The Provenance Register at a suburban philatelic society sorts every
  donated stamp-album lot into a five-kind taxonomy of documented ownership
  history, and a lot's kind now decides whether it may ever be entered in a
  club exhibition, regardless of catalogue rarity.
