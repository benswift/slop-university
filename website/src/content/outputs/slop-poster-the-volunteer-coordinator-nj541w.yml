title: Does the volunteer coordinator still know a channel from a claim?
subtitle: >-
  A four-kind taxonomy of witches'-hat kerbs, adopted as the marshal-hours
  rule
authors:
  - Hedvig Anyanwu
  - Fenna Okoro
  - Marek Solheim
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-15
publishedAt: "2026-09-15T15:09:11+10:00"
doi: 10.5555/slop.nj541w
summary: >-
  A research poster from the School of Emergent Priorities sorts school-run
  witches'-hat placements into four kinds --- Channel, Bay, Barrier, and
  Claim --- and binds marshal-hour allocation to Channel share, the one kind
  counted as a legitimate kerb. Channel placements rise from 19% to 47% of
  the afternoon layout once the hours rule is in force, while Barrier
  placements that daylighted the crossing fall by half.
topic: >-
  The volunteer coordinator on the school run sorts every witches'-hat
  placement into a kind of temporary kerb --- a channel, a bay, a barrier, or
  a claim --- and marshal hours are then allocated only to the kinds the
  framework counts as a legitimate kerb.
