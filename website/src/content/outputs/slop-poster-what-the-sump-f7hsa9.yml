summary: >-
  A research poster from the School of Emergent Priorities pushes four cores
  through the sediment sump of one recirculating teaching flume and reads its
  fill as a stratigraphic section, counting 57 sand-and-silt couplets against
  the 64 semesters in which the practical was timetabled. One couplet is laid
  down per semester, an erosional surface marks the sump's single cleanout,
  and one timetabled semester left no couplet at all.
topic: >-
  what the sump keeps: a stratigraphic reading of three decades of
  undergraduate flume practicals from cores through one teaching laboratory's
  sediment-recirculation tank
