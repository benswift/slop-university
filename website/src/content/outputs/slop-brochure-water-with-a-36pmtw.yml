summary: >-
  A research showcase from the School of Underlying Conditions presents the
  University's groundwater program under three headings: the age of a water,
  its origin, and the monitoring bore as an instrument in its own right. It
  introduces the three researchers who carry the program and rests its account
  on seven published studies cited by title and DOI.
