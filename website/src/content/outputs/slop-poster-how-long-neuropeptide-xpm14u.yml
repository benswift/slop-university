title: What the Rhythm Still Carries
subtitle: Neuropeptide modulation outlasting a thirty-minute washout in the isolated crab pyloric circuit
authors:
  - Clemency Tredinnick
  - Odalys Penhallow
  - Anselm Threlkeld
preset: research-poster
