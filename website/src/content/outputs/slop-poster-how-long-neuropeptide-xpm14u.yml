summary: >-
  A research poster from the School of Settled Matters times the return of the
  pyloric rhythm to its own baseline in 24 isolated crab stomatogastric
  preparations after 5, 15 or 45 minutes of bath-applied proctolin, finding
  median recovery of 18, 29 and 52 minutes, with seven of eight long-exposure
  preparations still outside baseline at the laboratory's customary
  thirty-minute washout.
topic: >-
  how long neuropeptide modulation of an isolated crab pyloric rhythm outlasts
  the laboratory's thirty-minute washout, and whether the carry-over scales with
  how long the peptide was applied
