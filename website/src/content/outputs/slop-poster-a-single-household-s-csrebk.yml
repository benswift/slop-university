summary: >-
  A research poster from the School of Emergent Priorities follows a single
  household's eight-week medicine-cabinet expiry audit into a trainee
  aged-care assessor curriculum, reporting that the shelf the log tracked
  least reliably is the one the resulting case file now treats as resolved.
topic: >-
  a single household's bathroom medicine-cabinet expiry-date audit log, kept
  for one home-visit assessment cycle, reassigns who in the household does
  the pharmacy run and gets folded into a trainee aged-care assessor's
  home-visit case file, told as an earnest teaching case for trainee
  assessors
