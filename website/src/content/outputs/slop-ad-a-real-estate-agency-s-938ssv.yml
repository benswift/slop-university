summary: >-
  A marketing poster for the School of Continuous Improvement advertises the
  Master of Applied Measurement against a real-estate agency's shopfront
  window, where a grid of near-identical listing photographs turns out to
  share one photographic method rather than depict twelve different
  properties. Developed for the University's portrait signage panels and the
  campus digital rotation.
topic: >-
  a real-estate agency's shopfront window, its glass papered with a grid of
  the season's active listings, each property photographed to the agency's
  own strict house style guide --- same hour, same lens height, same three
  staging cues --- so what looks like a dozen different properties is one
  photographic method applied a dozen times over; staged as a come-study
  campaign for the Master of Applied Measurement, the picture for what
  studying measurement under real repetition looks like
