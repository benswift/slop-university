title: Does Cutting Screen Time Off Early Just Move It to Tomorrow?
subtitle: A Regression-Discontinuity Test of a Home Router's Rounded Daily Cap in
  146 Households
authors:
  - Marit Osayande
  - Mirela Hanke
  - Casimir Beng
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-28
publishedAt: "2026-08-28T04:32:04+10:00"
doi: 10.5555/slop.nsvac8
summary: >-
  A research poster from the School of Continuous Improvement treats a home
  router's minute-rounded daily screen-time cap as a natural experiment,
  comparing 146 households whose children fall just above and just below the
  cutoff on an ordinary day. Children cut off within a minute of the cap use
  9.4 more minutes online the following day than children left running to
  just under it, an effect largest on days the router's countdown warning
  never fired.
topic: >-
  a home Wi-Fi router's parental-control app cuts a child's device off the
  instant its logged screen-time tally crosses the daily cap; because the
  app's clock rounds to the nearest minute, children landing just above and
  just below the cap on an ordinary day are quasi-randomly split into
  cut-off-early and let-run-late groups, used here to test whether the
  automatic cutoff itself changes how hard a child pushes the limit the next
  day
