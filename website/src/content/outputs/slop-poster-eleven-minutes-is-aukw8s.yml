summary: >-
  A research poster from the School of Emergent Priorities surveys 340
  cat-owning households nationally on how many minutes after a smart flap's
  programmed curfew their cat is typically still outside, finding a
  right-skewed delay distribution that rises with distance from the nearest
  street light. A home insurer is now drafting the sample median into the
  pass threshold for a wildlife-curfew discount tier.
topic: >-
  Eleven minutes is how far past a smart cat flap's programmed curfew
  surveyed households report their cat is typically still outside, a
  self-reported distribution an insurer's wildlife-curfew discount scheme now
  certifies compliant households against
