summary: >-
  A prospectus brochure led by the School of Underlying Conditions invites
  prospective students to bring a question about hostile language online to a
  university disposed to read before it labels. It presents the habit through
  each of the three schools --- what a record may say about material nobody
  recovered, what a disagreement between two readers is evidence of, and how a
  concern becomes a definition --- and rests the invitation on five published
  studies cited by title and DOI.
topic: >-
  we read the comments: an invitation to study the patient reading of hostile
  language online, the borderline case, and the people who label it
