title: One Trackmaker, Two Muds
subtitle: Substrate Consistency and the Small Tridactyl Morphotypes of a Lower Jurassic Lake-Margin Tracksite
authors:
  - Anselm Threlkeld
  - Brynjar Obiora
preset: paper
school: School of Settled Matters
date: 2026-11-13
publishedAt: "2026-11-13T23:01:54+11:00"
doi: 10.5555/slop.aclo7p
summary: >-
  A paper in vertebrate ichnology from the School of Settled Matters and the
  School of Underlying Conditions re-documents all 146 small tridactyl tracks on
  the four cleared surfaces of a lake-margin tracksite and measures each against
  the consistency of the bed it was made in. Track depth alone recovers 84% of a
  1987 catalogue's split into two morphotypes, depth-adjusted shape differences
  fall within measurement error, and five trackways change from one morphotype
  to the other where they cross from mat-bound to soft mud, so the paper reads
  the two morphotypes as one kind of trackmaker on two substrates.
topic: >-
  whether the two small tridactyl track morphotypes catalogued from one
  lake-margin tracksite are a single trackmaker walking on firm and on soft mud,
  re-tested by remeasuring every track against the consistency of the bed it
  was made in
