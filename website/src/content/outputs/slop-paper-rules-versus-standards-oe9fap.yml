title: What the Portal Can Read
subtitle: Statutory Definitions, Automated Eligibility and Bunching in Regional Cluster Grants
authors:
  - Anselm Threlkeld
  - Tove Ilesanmi
  - Kwame Lindqvist
preset: paper
school: School of Settled Matters
date: 2026-11-08
publishedAt: "2026-11-08T19:02:19+11:00"
doi: 10.5555/slop.oe9fap
summary: >-
  A paper from the School of Settled Matters and the School of Emergent
  Priorities codes the definition of "cluster" in 38 regional cluster grant
  instruments across six states of one federation and links them to 6,140
  applications lodged through a shared grants portal. Where a statute defines a
  cluster by a member count and a radius, the portal checks eligibility itself
  and decisions arrive about three quarters sooner, but declared consortium
  size bunches at the threshold and internal reviews move from whether a group
  is a cluster to whether each member is an enterprise.
topic: >-
  Rules versus standards in regional cluster grant instruments: when a statute
  defines 'cluster' by a numeric test, agencies automate eligibility in the
  online portal, cutting processing time but inducing firms to bunch at the
  threshold
