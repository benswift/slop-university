summary: >-
  A brochure inviting religious education teachers to bring their classes to
  the School of Underlying Conditions, where a morning at a monitoring bore,
  over a core tray's stand-in block for unrecovered rock, or at a disputed
  paddock fence is offered as company for the classroom's questions of origin,
  testimony and shared ground. Six published studies, from a congregation's
  intercession book to a secondary peace education unit, are cited by title and
  DOI as the work each visit grows from.
