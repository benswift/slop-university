title: The Compost Tumbler as Eligibility Gate
subtitle: A Council Voucher Quota's Cutoff, Adopted as a Verge-Collection Precondition
authors:
  - Anneke Tolan
  - Joost Nwosu
  - Mirela Hanke
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-28
publishedAt: "2026-09-28T01:00:05+10:00"
doi: 10.5555/slop.oi46hx
summary: >-
  A research poster from the School of Emergent Priorities treats a council
  compost-tumbler discount round's fixed registration quota as a natural
  experiment, finding that households who registered moments before the quota
  closed went on to host a verge-side produce giveaway at more than twice the
  rate of otherwise-identical households who registered moments after, and
  reports the council's waste unit adopting current tumbler registration as a
  precondition for general verge-collection eligibility.
topic: >-
  The compost tumbler voucher: a council's oversubscribed discount round
  closes its fixed quota mid-round, so registrations moments apart split
  otherwise identical households into tumbler recipients and near-misses;
  recipients show a sharp rise in running a verge-side surplus-produce
  giveaway the following season, and the waste unit adopts tumbler ownership
  as a precondition for general verge-collection eligibility
