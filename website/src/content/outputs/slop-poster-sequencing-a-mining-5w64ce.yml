summary: >-
  A research poster from the School of Underlying Conditions formulates a
  regional mining tribunal's inspections of drill core at a shared core shed as
  a single-machine sequencing problem, in which the cost of moving from one
  matter to the next is the number of trays carried off and on the layout
  racks. Solving eleven sittings exactly, it finds that the optimal order needs
  2,829 tray moves against the filing order's 4,481, that four-fifths of the
  saving survives a constraint keeping part-heard matters first, and that a
  greedy rule comes within four per cent of optimal on every sitting.
topic: >-
  sequencing a mining tribunal's core-shed views as a single-machine scheduling
  problem with sequence-dependent set-up times: the layout racks are re-laid
  between matters, matters sharing a borehole are cheap to run back to back,
  and the registry lists in filing order
