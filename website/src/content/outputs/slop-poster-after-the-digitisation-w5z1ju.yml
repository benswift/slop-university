doi: 10.5555/slop.w5z1ju
summary: >-
  A research poster from the School of Continuous Improvement codes 4,908
  physical elements found in 187 volunteer-club minute books into an
  eight-category taxonomy of matter the sector's approved digitisation profile
  cannot represent, finding 96% of volumes carry at least one. In clubs that
  later adopted the taxonomy as a disposition checklist, each category now
  appears in the digitise-and-dispose workflow's final column, recorded as
  noted, discarded.
topic: >-
  after the digitisation grant's scanner arrives, club secretaries skip-bin a
  century of minute books as each PDF uploads; a taxonomy of everything the
  approved scan settings cannot carry --- pressed flora, pencil marginalia, a
  sauce stain once adjudicated as evidence of a contested vote --- assembled
  from the trunks not yet binned, and adopted into the sector's retention
  guidance as a checklist whose final column reads 'noted, discarded'
