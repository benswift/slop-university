title: A Taxonomy of Non-Digitisable Matter
subtitle: What 187 Club Minute Books Carry That the Approved Scan Profile Cannot
authors:
  - Solveig Adeyemi
  - Marek Solheim
  - Iben Chikere
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-18
