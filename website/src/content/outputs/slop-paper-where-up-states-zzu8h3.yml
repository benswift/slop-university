title: The Down State Forgets
subtitle: Adaptation Recovery Decides the Initiating Layer of the Slow Oscillation Only When Down States Are Short
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-15
publishedAt: "2026-10-15T16:00:56+11:00"
doi: 10.5555/slop.zzu8h3
summary: >-
  A paper from the School of Underlying Conditions runs a three-layer rate
  model of a cortical column through the slow oscillation and asks whether
  layer 5 leads the column into each up state because it is the most excitable
  layer or because it recovers soonest from adaptation. When down states are
  long, the share of up states initiated in layer 5 depends on its excitability
  alone; when they shorten to one to three seconds, slow layer-5 recovery cuts
  that share from 59% to 32% at matched excitability.
topic: >-
  Where up states begin: a laminar network model of slow-oscillation
  initiation in the infragranular layers of cortex
