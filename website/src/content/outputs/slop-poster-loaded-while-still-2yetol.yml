title: Loaded While Still Setting
subtitle: When a Setting Thermoresponsive Depot Stops Taking Up a Model Solute
authors:
  - Odalys Penhallow
  - Clemency Tredinnick
  - Gunnhild Ekwueme
preset: research-poster
school: School of Settled Matters
