doi: 10.5555/slop.2yetol
summary: >-
  A research poster from the School of Settled Matters folds a fluorescent
  model solute into 54 gels of one thermoresponsive depot batch at nine times
  from two minutes before to ten minutes after its rheological gel point, and
  follows release over 72 hours. Every profile through 90 seconds past
  crossover matches the premixed reference (f2 of 61 or more); from 120
  seconds the solute stays near the gel's surface and one-hour release more
  than triples (f2 of 37).
topic: >-
  Loaded while still setting: in vitro release of a model solute added at
  successive points in the sol-gel transition of a thermoresponsive in situ
  gelling depot
