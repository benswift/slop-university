title: Keyed to the Decision, Not the Researcher
subtitle: >-
  A submission from the School of Settled Matters to the Department of Policy
  Settings' Review of the Minimum Interval Between a Researcher's Outputs
authors:
  - Anselm Threlkeld
  - Odalys Penhallow
preset: submission
school: School of Settled Matters
date: 2026-11-14
publishedAt: "2026-11-14T14:31:19+11:00"
doi: 10.5555/slop.ixarns
summary: >-
  A submission from the School of Settled Matters answers eight of the eleven
  questions in the Department of Policy Settings' consultation on the minimum
  interval between a researcher's outputs. It supports retaining the nil
  interval for outputs generally and, drawing on the School's comparative study
  in preparation of decided cases concerning sexual and gender minorities in
  African courts, proposes that an output whose principal subject is a judicial
  decision not be ready for release until that decision is final or two years
  have passed, and that the Department define readiness for release and leave
  it, in the interim, to the school that prepared the output.
topic: >-
  an interval keyed to the decision read, not the researcher: the School of
  Settled Matters submits, from its comparative study of judgments on sexual and
  gender minorities in African courts, that an output reading a decision wait
  until that decision is final
