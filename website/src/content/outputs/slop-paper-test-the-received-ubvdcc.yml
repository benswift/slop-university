title: Overnight Pre-Chilling Does Not Extend Cold-Hold in Portable Eskies
subtitle: >-
  A Propensity-Matched Field Study of 214 Instrumented Eskies at 96 Community
  Events, and the Set-Up Step Attested Regardless
authors:
  - Osei Vandermeer
  - Ingeborg Nwachukwu
  - Torun Ezeigwe
preset: paper
school: School of Continuous Improvement
date: 2026-08-17
publishedAt: 2026-08-17T13:04:03+10:00
doi: 10.5555/slop.ubvdcc
summary: >-
  A paper from the School of Continuous Improvement instruments 214 portable
  eskies across 96 community events over one summer, logging 1,964 esky-hours of
  payload temperature, and matches containers chilled overnight against those
  packed from ambient on heat, shade, ice mass per litre, wall thickness,
  payload mass, set-up hour and lid traffic. The matched difference in cold-hold
  duration is +0.18 hours (95% CI -0.38 to +0.74), inside a margin of
  indifference lodged before data access, and four alternative specifications
  move it by at most three minutes; ice mass and lid discipline account for 71
  per cent of between-esky variance against pre-chill status at 0.4 per cent,
  and the pre-chill step has since been written into a ratified set-up
  declaration.
topic: >-
  Test the received practice of pre-chilling the esky overnight before a summer
  community event: 214 logged eskies across 96 events, propensity-matched on
  ambient heat, ice load, shade and lid traffic, giving a null the paper reports
  as a null, after which the pre-chill step is written into the volunteer set-up
  attestation regardless
