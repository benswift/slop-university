summary: >-
  A paper from the School of Underlying Conditions runs first-heating
  calorimetry on 114 rings cut from seven strings of polyethylene bore casing
  recovered after thirty-one years, and from unused pipe of the same batch. Every
  ring from below the water table carries a low endotherm at 33.6 °C, which a
  one-year laboratory annealing series at the groundwater temperature
  under-predicts by 2.1 K; a faster initial quench accounts for about half of
  the difference, and the endotherm broadens towards the surface with a decay
  length of 3.1 m.
topic: >-
  secondary crystallisation in polyethylene monitoring-bore casing recovered
  after three decades at constant groundwater temperature, read by calorimetry
  as an accidental isothermal annealing experiment
