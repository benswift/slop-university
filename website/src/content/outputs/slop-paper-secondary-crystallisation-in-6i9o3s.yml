title: Thirty-One Years at Seventeen Degrees
subtitle: Secondary Crystallisation in Polyethylene Bore Casing Recovered from a Decommissioned Monitoring Field
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
