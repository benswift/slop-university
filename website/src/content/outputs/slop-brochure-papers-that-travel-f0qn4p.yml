summary: >-
  A case-for-support brochure from the School of Settled Matters invites
  partners to back its study of the documents that accompany goods across
  borders, in three features on the documentary credit, on provisions copied
  between statutes and model treaty texts, and on the licensing counter and
  invoice where the law of trade is applied. It quotes two researchers from two
  Schools, profiles two, and features seven published studies cited by title
  and DOI.
topic: >-
  papers that travel with the cargo: a case for supporting the School of
  Settled Matters' study of how the documents of trade come to be read the same
  way at both ends of a voyage
