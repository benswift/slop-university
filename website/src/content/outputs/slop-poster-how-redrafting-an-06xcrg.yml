summary: >-
  A research poster from the School of Settled Matters reads 214 insulator
  tenders submitted to one coastal utility between 1948 and 1991 against nine
  drafts of its insulator specification and 61 warranty files on contamination
  flashover. Once a 1966 redraft replaced "suitable for coastal service" with a
  minimum creepage distance of 25 mm/kV, 83% of tenders offered within 1 mm/kV
  of it, a priced row for additional creepage appeared in 97 of 126, and
  warranty disputes fell from 38 to 3, while line washing rose from 4% to 19%
  of maintenance outlay and recorded flashovers showed no break.
topic: >-
  How redrafting an insulator tender's 'suitable for coastal service' as a numeric creepage minimum turned flashover liability into a priced line item, in one coastal utility's procurement records, 1948-1991
