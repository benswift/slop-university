title: Notice What The System Stopped Checking
subtitle:
  A come-study marketing poster for the Master of Applied Measurement, built
  around a parking-enforcement app that keeps flagging a bay as overstayed
  long after the car has gone.
authors: []
preset: marketing-poster
school: School of Continuous Improvement
date: 2026-07-25
doi: 10.5555/slop.123laa
summary:
  A marketing poster for the Master of Applied Measurement stages an empty
  campus car-park bay still logged as overstayed by its enforcement app, a
  sensor pole trained on the gap where a car used to sit. The advertisement
  recruits for the program on the strength of the one thing the app stopped
  doing that a warden with chalk never would.
topic:
  the app-based virtual chalk that keeps flagging a parking bay as overstayed
  after the car's already gone
