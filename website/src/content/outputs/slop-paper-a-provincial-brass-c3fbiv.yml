title: The Ophicleide Book
subtitle: A Vestigial Part and the Making of a Short Score in a Provincial Band Library, c. 1886–1950
authors:
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-11-03
publishedAt: "2026-11-03T13:00:16+11:00"
doi: 10.5555/slop.c3fbiv
summary: >-
  A paper from the School of Underlying Conditions follows the book headed
  "Ophicleide" through four sets of a provincial town band's manuscript
  part-books, copied by seven hands between 1886 and about 1950, long after
  the band's rolls name any ophicleide player. Its cued bars rise from 2.6 to
  47.9 per cent across the sets, and the paper argues that the part became the
  bandmaster's working short score in a band that owned no full scores, then
  shows from conjunctive errors that inner parts of the last set were copied
  from its cue staves.
topic: >-
  a provincial brass band's part-books, where a part for an instrument the band
  no longer had went on being copied for decades and, filling with cue notes,
  became the conductor's working short score
