summary: >-
  A research poster from the School of Settled Matters treats the cosmological
  constant of unimodular gravity as an integration constant that accumulates
  under energy diffusion, and integrates five toy diffusion sources against a
  fixed flat background from z = 1100 with the Friedmann constraint imposed.
  Matter-tracking sources settle to within 1% of today's value by z ≈ 236 and
  z ≈ 47; sources tied to cosmic time or to structure formation are still
  accruing at z = 0.07 or later, and only these move the effective equation of
  state off −1, to between −1.05 and −1.35.
topic: >-
  When the cosmological constant was settled: in unimodular gravity Lambda is an
  integration constant, and with energy diffusion it accumulates over cosmic
  history; integrating five toy diffusion models to find the epoch after which
  further diffusion stops moving it
