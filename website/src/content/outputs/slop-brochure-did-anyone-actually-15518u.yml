doi: 10.5555/slop.15518u
summary: >-
  A research-showcase brochure presenting the University's campaign on
  documentary attention: whether the everyday documents of household, club,
  and committee life --- the newsletter, the minutes, the acknowledgement log
  --- ever meet a reader. Seven published studies are drawn together as the
  campaign's evidence base, alongside the Depth-of-Reading Scale the program
  intends to steward across both schools.
topic: >-
  did anyone actually read it? a campaign for the University's program that
  answers the question no sender can ask --- planting a prize sentence deep in
  the school newsletter, doorknocking for unprompted recall of the strata
  minutes, and scoring the everyday documents of household and club life by
  how far into them anyone can be shown to have got
