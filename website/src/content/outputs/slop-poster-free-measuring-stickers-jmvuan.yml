title: The Ruler Was Still on the Boat
subtitle: >-
  A Pre-Registered Randomised Trial of Issued Measuring Stickers at 26 Boat
  Ramps, Against a Compliance Rate That Patrols Where It Patrolled Last Season
authors:
  - Runa Adegoke
  - Ingrid Vasseur
  - Kwame Lindqvist
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-01
publishedAt: "2026-08-01T03:03:33+10:00"
doi: 10.5555/slop.jmvuan
summary: >-
  A research poster from the School of Emergent Priorities randomises 1,914
  launches across 26 boat ramps in four estuary districts, fitting a free
  measuring sticker to the gunwale on treated ramp-days and scoring undersize
  retention by independent creel survey at the cleaning bench. Retention is 6.8
  per cent with a sticker against 7.1 per cent without, reported as a null, and
  the districts' published compliance rates hold between 94.1 and 96.3 per cent
  throughout on inspections rostered from the previous season's rate.
topic: >-
  free measuring stickers handed out at boat ramps, a randomised trial that
  changed undersize retention not at all, and a fisheries compliance rate whose
  patrol windows are rostered from last season's compliance rate
