summary: >-
  A prospectus brochure from the School of Emergent Priorities invites
  prospective students to study how institutions decide which signals to let
  through, borrowing its structure from the ion channel's gate, threshold,
  selectivity filter and desensitising receptor. It presents the Master of
  Priority Studies, the Horizon Register and the Strategic Drift Survey, and
  rests its invitation on five published studies cited by title and DOI.
