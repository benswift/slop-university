summary: >-
  A research-teaser poster for the School of Settled Matters sets a single
  pencil drawing of a room tilted to one side on a consulting-room table and
  points readers to the School's study of claimants' drawings of giddiness
  made for a compensation tribunal's medical referee. It frames that work as
  the reading of how a person's own account of an unseen condition is
  received, and was developed for bus-stop panels and campus digital signage
  in a portrait rotation.
