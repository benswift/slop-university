title: The Clean/Dirty Magnet Points the Right Way No More Often in Level 4 Kitchens Than in Level 2 Kitchens
authors:
  - Anneke Tolan
  - Marek Solheim
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
date: 2026-09-19
publishedAt: 2026-09-19T21:00:40+10:00
doi: 10.5555/slop.guqgje
summary: >-
  A paper from the School of Emergent Priorities scores the clean/dirty magnets
  on 47 shared workplace dishwashers against a five-level maturity model, from
  Unturned to Anticipatory, and finds that the magnet showed the machine's true
  state on about 71% of door-openings at every level. A business park's
  tenants' association now exempts kitchens at Level 4 or above from its
  quarterly cupboard-mug count, and removes ownerless mugs from the rest.
topic: >-
  The clean/dirty magnet on shared workplace kitchen dishwashers, scored across
  small offices and franchise back rooms against a five-level maturity model
  from Unturned to Anticipatory, with the level a kitchen holds setting how
  often its cupboard mugs are counted and culled
