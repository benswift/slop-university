doi: 10.5555/slop.1ohecb
summary: >-
  A paper from the School of Continuous Improvement fields a two-axis
  quadrant that scores kitchen benchtop appliances by usage frequency and
  benchtop footprint, and refers appliances landing in the resulting Latent
  Liability cell into a 90-day trial-removal protocol with a witnessed
  disposal log, overridable only by a written exception reviewed at the
  household's next Capability Sprint check-in.
topic: >-
  Establish a two-axis quadrant framework classifying kitchen counter
  appliances by usage frequency and benchtop footprint, and determine
  whether items in the low-usage, high-footprint cell warrant mandatory
  trial removal with a witnessed disposal log.
