doi: 10.5555/slop.d46w1n
summary: >-
  A research poster from the School of Continuous Improvement has six
  operators set up one tabletop control unit thirty times in a 3 m
  semi-anechoic chamber, each to the same written cable-dressing instruction,
  and finds that re-setup, not the operator or the repeat scan, carries most of
  the variance in its radiated-emission margin: up to 7.4 dB at a 148 MHz cable
  resonance, enough to fail four of the thirty setups, against 0.8 dB when the
  setup is left untouched. A taped layout plate with a reference photograph
  narrowed the spread to 2.1 dB across ten further setups.
topic: >-
  how much of a test laboratory's radiated-emission margin is decided by where
  the operator lays the cables on the table
