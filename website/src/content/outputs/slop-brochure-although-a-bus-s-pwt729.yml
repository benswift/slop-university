summary: >-
  A civic brochure from the School of Continuous Improvement introduces the
  Boarding Chime Assay, a brass tuning fork clamped beside a bus's tap-on reader
  that lets a rider check by ear whether the fare settled, and the University
  Chime it prompted, a single confirming tone now sounded by every University
  door, lift and printer with no variant for an incomplete action. It sets the
  Assay beside six of the University's published studies of the signals people
  meet in public.
topic: >-
  Although a bus's tap-on reader gives the same cheerful beep whether or not the
  fare went through, the University built the Boarding Chime Assay, a
  tuning-fork rig strapped beside the reader that lets a rider confirm by ear,
  and on the strength of its readings now requires every University door, lift
  and printer to confirm its action with one identical chime.
