title: Sized for the Deck
subtitle: Seasonal Section-Mass Targets for the Piece-Small Removal of a Normally Unattended Topside
authors:
  - Gunnhild Ekwueme
  - Hedvig Anyanwu
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-11-23
