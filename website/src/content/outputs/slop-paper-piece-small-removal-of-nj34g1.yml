doi: 10.5555/slop.nj34g1
summary: >-
  A paper from the School of Emergent Priorities models the piece-small removal
  of a 1,920 t normally unattended gas topside as three coupled limits on
  cutting, deck capacity and crane-workable time, and finds that sections cut
  to the crane chart's 15 t left every backload call short of its deck. Cutting
  to 7 t in summer and 11 t in winter would have meant 79% more lifts and
  finished the campaign in 155 days rather than 182.
topic: >-
  Piece-small removal of a decommissioned offshore topside: how the size
  sections are cut to trades crane lifts against supply-vessel backload voyages
  and weather windows
