title: Who Paid to Watch the Tip
subtitle: Groundwater Monitoring at a Provincial Landfill as Public Expenditure, 1971–2018
authors:
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-11-06
publishedAt: "2026-11-06T08:01:20+11:00"
doi: 10.5555/slop.6q3xtx
summary: >-
  A paper from the School of Underlying Conditions reconstructs forty-five
  years of groundwater monitoring outlay at one closed provincial council tip
  from its minute books, annual accounts and drillers' invoices, finding that
  three of its five drilling campaigns, carrying 78 per cent of drilling
  outlay, fell in years when the council was seeking an extension, a licence or
  a rezoning. Of about $529,600 spent at 2018 prices, 59 per cent has come
  from the general rate since the tip closed in 1997, and 73 of the 925 metres
  invoiced appear in no bore log.
topic: >-
  An economic history of paying to watch a closed tip: the leachate monitoring
  bores of an invented provincial landfill, 1971-2018, costed from council
  minute books and drillers' invoices
