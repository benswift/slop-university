title: Edited, Not Opened
subtitle: >-
  A Twelve-Month Case Study of a Main-Street Evening Activation Pilot, Its
  Declared Trading-Hours Coverage, and 23,836 Door Observations
authors:
  - Ronja Oyelaran
  - Anouk Mensah
  - Lindiwe Achterberg
preset: paper
school: School of Emergent Priorities
date: 2026-08-15
publishedAt: 2026-08-15T03:01:03+10:00
doi: 10.5555/slop.d3oueo
summary: >-
  A paper from the School of Emergent Priorities follows one town-centre
  precinct of 118 ground-floor premises, 96 of them chamber members, through a
  twelve-month evening activation pilot, setting the chamber's published
  evening trading coverage against a fixed-route observation record of 202
  circuit passes and 23,836 door observations at 18:15 and 19:15. Declared
  coverage rises from 31.3 to 57.3 per cent while the share of member premises
  observed open at 18:15 moves from 24.6 to 27.1 per cent (95% CI -1.4 to
  +6.3). Of the 28.1 points of gross entry into the declared category, 21.9
  come from premises whose observed hours did not change at all; fourteen
  further premises extended their evening trading without editing a listing and
  are absent from the figure entirely. Where a closing time is declared, the
  door closes a median 38 minutes before it, and recomputing coverage under two
  alternative definitions moves the year-end figure by at most 3.1 points while
  preserving the monthly ordering exactly.
topic: >-
  the laminated opening-hours card taped inside a suburban shopfront door,
  where a main-street business chamber computes the strip's evening trading
  coverage from the hours members declare on their directory listing --- a case
  study of one twelve-month evening activation pilot in which the published
  coverage figure rises almost entirely through listing edits by shops whose
  doors did not change, while the shops that genuinely began trading later
  never updated the listing and so never entered the figure
