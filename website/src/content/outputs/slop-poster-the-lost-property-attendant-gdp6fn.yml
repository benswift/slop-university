title: "Claimed, Therefore Closed"
subtitle: "A five-level claim-maturity model for the campus lost-property window"
authors:
  - Ronja Oyelaran
  - Iben Chikere
  - Hedvig Anyanwu
preset: research-poster
school: School of Emergent Priorities
