doi: 10.5555/slop.gdp6fn
summary: >-
  A research poster from the School of Emergent Priorities scores fourteen
  faculty lost-property windows against a five-level claim-maturity model
  (Ad hoc, Logged, Windowed, Reunited, Closed) over eleven months and 3,812
  logged items. Eleven of fourteen windows that reached Closed had weekly
  collection hours withdrawn at the next review cycle, with no restored-hours
  exception; recovery of items still in those buildings fell from 61% at
  Windowed sites to 9% once the hatch was shut.
topic: >-
  The lost-property attendant scores each faculty against a five-level
  claim-maturity model; faculties that reach Closed lose their collection
  window because claim demand has been designed out.
