title: What the Burden Was For
subtitle: Eliciting Three Disciplines' Weights on When a Restrictive Covenant Has Outlived Its Purpose
authors:
  - Clemency Tredinnick
  - Mirela Hanke
  - Odalys Penhallow
preset: research-poster
school: School of Settled Matters
