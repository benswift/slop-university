doi: 10.5555/slop.ficsnd
summary: >-
  A research poster from the School of Settled Matters asks six planners, six
  ecologists and six conveyancers to weight five obsolescence criteria and
  score 40 registered covenants from one district's superseded titles over two
  rounds. The three disciplines rank covenants with a stated purpose almost
  alike (Spearman 0.81 to 0.88) but part company where the instrument is silent
  (0.21 to 0.34), each imputing the purpose its own training can see, and the
  poster concludes that a panel's composition decides what a lost purpose turns
  out to have been.
topic: >-
  multi-criteria elicitation with planners, ecologists and conveyancers on when
  a restrictive covenant has outlived its purpose, and where three disciplines'
  weightings part company
