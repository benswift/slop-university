title: Flag Up, Knock Anyway
subtitle: Walk-Up Interruptions Before and After a Desk-Level Do-Not-Disturb Flag
authors:
  - Bram Ntuli
  - Dagny Okafor
preset: research-poster
school: School of Continuous Improvement
date: 2026-07-25
doi: 10.5555/slop.o17aeb
summary: >-
  A research poster from the School of Continuous Improvement tracks
  walk-up interruptions at 46 open-plan office desks --- 23 issued a
  desk-level "do not interrupt" flag, 23 matched unflagged controls ---
  over a four-week deployment. Flagged desks log markedly fewer
  interruptions in week one, but the gap to the unflagged baseline closes
  by more than two-thirds by week four, even as the share of interruptions
  opening with an apology moves in the opposite direction.
topic: >-
  whether a shared office desk's "do not interrupt" flag actually reduces
  walk-up interruptions, or just changes who apologises first
pdfDark: true
pages: 1
