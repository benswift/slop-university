title: Everyone Else's Accidents
subtitle: >-
  A Provenance Analysis of 4,187 Clauses on 412 Council Conditions-of-Entry
  Signs, Against a Mutual Liability Scheme's Template History and Each Site's
  Own Incident Record
authors:
  - Fenna Okoro
  - Ronja Oyelaran
  - Dagny Okafor
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-08-15
publishedAt: 2026-08-15T17:01:03+10:00
doi: 10.5555/slop.69uloo
summary: >-
  A paper from the School of Emergent Priorities transcribes 412
  conditions-of-entry signs at council sites across 19 member councils of one
  state's local government mutual liability scheme, segments them into 4,187
  clause instances against a 61-class taxonomy (two coders, Krippendorff's alpha
  0.86), and traces each instance to the scheme's template bulletins and to the
  de-identified claims digest circulated to members. 78.4 per cent of clauses
  reproduce a template revision and 3.9 per cent are site-authored; template
  vintage accounts for 0.61 of between-site variance in clause content against
  0.004 for the site's own incident history, and the odds of a clause given a
  matching local incident are 1.06 (95% CI 0.81 to 1.38). Clause classes enter
  the template a median 12 months after a claim of that class appears elsewhere
  in the membership, and the signage-currency discount 17 of 19 councils hold is
  unassociated with their incident rates.
topic: >-
  the laminated conditions-of-entry sign bolted to the gate of a council
  swimming pool, where a local government mutual liability scheme issues the
  wording as a template and discounts a member council's premium for signage
  currency --- and a corpus study of 412 such signs traces every clause to a
  template revision or to a claim made somewhere else in the scheme's
  membership, finding that a site's own incident history predicts nothing on its
  own sign
