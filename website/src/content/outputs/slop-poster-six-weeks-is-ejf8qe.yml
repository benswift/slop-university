doi: 10.5555/slop.ejf8qe
summary: >-
  A research poster from the School of Continuous Improvement develops CORD, a
  four-kind taxonomy — Claimed, Orphaned, Derelict, Untested — for cables found
  in a shared university tea-room charging drawer, and reports a 28-week
  deployment across six drawers in which the coded kind predicted eventual
  disposal timing more closely than a cable's visible condition. On the
  strength of the finding, the School is extending the same retention
  timetable to every shared amenity point on campus.
topic: >-
  Six weeks is how long an unclaimed cable now has before Facilities empties
  the tea-room's shared charging drawer — but sorting a stranger's cable into
  "still someone's" or "nobody's" has, until now, been left to whoever cleans
  it: a four-kind provenance taxonomy (claimed, orphaned, derelict, untested)
  and the disposal timetable it justifies
