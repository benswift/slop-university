title: CORD
subtitle: A four-kind provenance taxonomy for the shared tea-room charging drawer, and the disposal timetable it sets
authors:
  - Dagny Okafor
  - Joost Nwosu
  - Solveig Adeyemi
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-15
