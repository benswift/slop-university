title: How Many Times Has the Gas at the Spark Gap Already Burned?
subtitle: Residence-Time Distributions of an Active Hydrogen Pre-Chamber in a Cold-Flow Tracer Rig
authors:
  - Fenna Okoro
  - Halvard Nnamani
preset: paper
school: School of Emergent Priorities
date: 2026-11-01
publishedAt: "2026-11-01T09:30:21+11:00"
doi: 10.5555/slop.tnslc9
summary: >-
  A paper from the School of Emergent Priorities measures the residence-time
  distribution of one active hydrogen pre-chamber on a cold-flow tracer rig,
  across five purge rates and two injector orientations, and fits a two-zone
  exchange model where tanks in series fails. With the axial injector about 30%
  of the chamber, almost all of it the electrode recess, exchanges slowly, so
  that at one chamber volume of purge per cycle the gas at the spark gap has on
  average been through 2.7 earlier combustion events.
topic: >-
  the pre-chamber of a hydrogen jet-ignition engine read as a chemical reactor:
  residence-time distributions from a cold-flow tracer rig, fitted with
  tanks-in-series and dead-volume models, and what they say about the residual
  gas left at spark
