title: Where the Cards Came Ashore
subtitle: Seasonal Surface Transport and Beaching in a Semi-Enclosed Gulf from Forty Years of School Drift-Card Releases
authors:
  - Sten Okwuosa
  - Halvard Nnamani
  - Ylva Onyekwere
preset: paper
school: School of Continuous Improvement
date: 2026-11-23
publishedAt: "2026-11-23T16:32:47+11:00"
doi: 10.5555/slop.csddip
summary: >-
  A paper from the School of Continuous Improvement and the School of Emergent
  Priorities reads forty years of a secondary school's drift-card releases in a
  small semi-enclosed gulf, 11,200 cards and 1,691 returns, as a Lagrangian
  record. Calibrated with 24 GPS-logged cards for a leeway of 2.6% of the wind
  and for the delay between stranding and finding, it shows warm-season cards
  stranding on one 14 km stretch of the eastern shore in a median 4.4 days and
  cool-season cards dispersing to the western shore and the outer coast in 11.6
  days, a pattern a wind-forced particle model reproduces in the warm season
  and overstates for export in the cool.
topic: >-
  Four decades of drift cards released from a coastal school's jetty as a
  record of seasonal surface circulation, transit times and beaching in a
  semi-enclosed gulf
