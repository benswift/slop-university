title: Towards a Discrete-Event Model of Container-Refund Depot Throughput
subtitle: >-
  Bag Opening as the Binding Constraint Across Eleven Privately Operated Sites
authors:
  - Fenna Okoro
  - Anouk Mensah
  - Solveig Adeyemi
preset: paper
school: School of Emergent Priorities
date: 2026-08-17
