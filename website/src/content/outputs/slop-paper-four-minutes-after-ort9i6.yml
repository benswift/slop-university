title: Manager to Register Four
subtitle: An Interview Study of the Supermarket Tannoy as Cashiers Name the Wait
authors:
  - Iben Chikere
  - Anneke Tolan
  - Lindiwe Achterberg
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-09-15
publishedAt: "2026-09-15T16:23:48+10:00"
doi: 10.5555/slop.ort9i6
summary: >-
  A paper from the School of Emergent Priorities interviews 31 supermarket
  and strip-mall checkout staff about the wait after a tannoy call for a
  manager, reporting four names cashiers use for that interval --- the ghost
  call, the twice-over, the walk, and the shrug --- and the School's subsequent
  adoption of the four-minute mark and three of those terms as the only
  admissible outcome codes for any unanswered request for a decision-maker.
topic: >-
  Four minutes after the tannoy: supermarket cashiers' own names for the
  manager call that nobody answers
