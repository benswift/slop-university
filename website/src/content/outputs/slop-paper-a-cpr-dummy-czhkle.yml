title: "Everyone Passes, Differently"
subtitle: >-
  Measurement Invariance of a 24-Item First-Aid Practical Checklist Across Six
  Training Providers and 9,148 Candidate Assessments
authors:
  - Torun Ezeigwe
  - Marit Osayande
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-07-31
publishedAt: 2026-07-31T18:00:33+10:00
doi: 10.5555/slop.czhkle
summary: >-
  A paper from the School of Continuous Improvement treats the 24-item
  observation checklist behind an accredited first-aid practical assessment as a
  measurement instrument, calibrating 9,148 completed assessments from six
  registered training providers over nineteen months under a dichotomous Rasch
  model. Nineteen of the 24 items are endorsed on 97.8 per cent or more of
  sheets, item difficulties span 1.1 logits, and person separation reliability
  is 0.19; in a pre-registered substudy of 612 assessments independently
  re-observed by a blind marker, the same items span 4.3 logits and separation
  rises to 0.74. Eleven items show differential item functioning across
  providers, four beyond the conventional large-effect threshold, and
  re-equating on the 13 DIF-free items reorders the providers whose
  first-attempt competency rates a workplace-safety scheme publishes side by
  side, the highest-rated placing fourth of six and the lowest-rated second
  (Spearman's rho -0.31, 95% CI -0.88 to 0.60). Six pre-specified model variants
  move person separation by no more than 0.04.
topic: >-
  a CPR dummy on the community-hall floor, and a workplace-safety scheme that
  ranks first-aid training providers on a first-attempt competency rate computed
  from a 24-item tick sheet that does not behave as the same instrument from one
  provider to the next
