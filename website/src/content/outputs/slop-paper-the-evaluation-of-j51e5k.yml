title: Removing the Neutral Middle Rating Increases Formal Appeals Against Performance Reviews
authors:
  - Anneke Tolan
  - Casimir Beng
  - Dagny Okafor
preset: paper
school: School of Emergent Priorities
date: 2026-09-13
publishedAt: "2026-09-13T21:00:28+10:00"
doi: 10.5555/slop.j51e5k
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement treats a retail chain's mid-cycle performance-review scale
  migration --- from a five-point scale with a middle option to a four-point
  scale without one --- as a naturally occurring cutoff, finding a
  6.4-percentage-point rise in formal appeals immediately after the change and
  no comparable break at three placebo dates. The University's Evaluation of
  Evaluation program is moving to recommend four-point, no-midpoint scales
  wherever a workplace rating feeds an eligibility decision.
topic: >-
  The Evaluation of Evaluation program treats a retail chain's mid-cycle
  performance-review scale change -- from a five-point scale with a middle
  option to a four-point scale without one -- as a naturally occurring
  cutoff, certifying the post-change cohort's higher appeal rate as evidence
  for a binary rating mandate
