title: While the Cheques Were Checked
subtitle: Know-How Trading Among Rival Settlement Clerks and Its Displacement by Electronic Settlement
authors:
  - Clemency Tredinnick
  - Anneke Tolan
preset: paper
school: School of Settled Matters
date: 2026-11-25
publishedAt: "2026-11-25T13:31:47+11:00"
doi: 10.5555/slop.34vya2
summary: >-
  A paper from the School of Settled Matters and the School of Emergent
  Priorities draws on 34 interviews and 2,151 query-book entries from one
  regional city's conveyancing practices to show that rival settlement clerks
  taught one another the work while waiting together in a shared settlement
  room, chiefly so that a counterparty's error would not hold up their own
  settlement. Once settlement moved online, the share of the small practices'
  queries resolved by a peer on an unrelated matter fell from 31 to 7 per
  cent, and the share put to the other side of the same matter rose from 9 to
  22 per cent.
topic: >-
  Know-how traded between rival conveyancing clerks in a settlement room while
  waiting for the other side, and where small practices source that knowledge
  once settlement goes electronic
