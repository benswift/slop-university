summary: >-
  A research poster from the School of Underlying Conditions runs a
  photocatalysed atom-transfer radical addition through six cycles of two
  minutes' irradiation and twenty-eight minutes' dark, finding a quantum yield
  of 18 and 66 of its 86 points of conversion gained with the lamp off. Radical
  traps admitted at lamp-off stop the dark gain, and the poster reads the
  reaction as a chain the lamp only initiates.
topic: >-
  after the lamp, a quantum-yield and light/dark-interval study of how much of
  a visible-light atom-transfer radical addition goes on as a chain once the
  irradiation stops
