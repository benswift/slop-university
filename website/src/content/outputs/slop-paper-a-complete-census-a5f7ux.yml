summary: >-
  A paper from the School of Underlying Conditions images one 200 µm field of a
  porous anodic alumina film as a mosaic of 1,600 tiles and locates every one of
  its 4,251,318 pores, finding 5.42% of them miscoordinated, all as
  dislocations, along the boundaries of 3,412 orientational domains. Diffraction
  mapping of the stripped metal shows the pore lattice changing domain along 93%
  of the aluminium grain-boundary length in the field, and thinning the mosaic
  shows that a single tile of the same film returns a defect fraction anywhere
  between 2.1% and 11.8%.
topic: >-
  A complete census of pore-lattice defects in one 200-micrometre field of
  self-ordered anodic alumina, every pore located, and how the ordered domains
  sit against the aluminium grains beneath
