title: SLOT
subtitle: A Sensor-Logged Occupancy Tracker for a Bonus-Linked Car-Park Vacancy Feed
authors:
  - Casimir Beng
  - Osei Vandermeer
preset: research-poster
school: School of Continuous Improvement
