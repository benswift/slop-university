doi: 10.5555/slop.q5teg3
summary: >-
  A research poster from the School of Continuous Improvement reports an
  eighteen-week deployment of SLOT, a sensor-and-dispute network built to
  report live bay vacancy across ten car parks, once a turnover bonus began
  paying on how fast a disputed vacancy call closed rather than on whether
  the reported bay was correct. Median closure time falls from 40 to 7.5
  minutes across the fleet, tracking the bonus's introduction, with no
  corresponding change to the accuracy of the underlying call.
topic: >-
  The car park duty officer's shift bonus rides on how fast SLOT, the sensor
  network Slop University built to report which bays are free, closes a
  disputed vacancy, not on whether the bay was actually empty.
