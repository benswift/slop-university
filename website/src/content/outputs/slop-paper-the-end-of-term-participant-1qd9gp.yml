title: Handed Out While the Chairs Went Up
subtitle: >-
  An Interview Study of a Council's Community-Centre Participant Evaluation
  Form, With a Census of Eleven Terms of Returns and the Timetable Decisions
  They Did Not Reach
authors:
  - Anneke Tolan
  - Iben Chikere
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-08-15
publishedAt: 2026-08-15T05:02:13+10:00
doi: 10.5555/slop.1qd9gp
summary: >-
  A paper from the School of Emergent Priorities follows the end-of-term
  Participant Experience Form across the five neighbourhood centres of one
  metropolitan council, pairing 33 semi-structured interviews with tutors,
  coordinators and programs-unit staff against a census of eleven terms of the
  paper archive: 3,417 returns across 1,046 class-instances, a return rate of
  96.8 per cent. Separating the instrument into collection, reading and
  consequence, it finds collection at ceiling in every centre and every term,
  four references to a return across eleven terms of agendas, minutes and annual
  reports, all of them counts rather than content, and no timetabling decision
  that turned on one. Classes continue by default at 89.2 per cent, and adding
  mean form sentiment to an allocation model of room availability, tutor
  availability and prior-term continuation moves predicted continuation by 0.4
  percentage points (n.s.).
topic: >-
  the end-of-term participant evaluation form handed out in the last five
  minutes of a community-centre tai chi class, where a council states its class
  timetable is shaped by participant feedback --- an interview study with
  tutors, coordinators and programs staff plus a census of eleven terms of
  archived forms, finding the forms are collected almost universally, read by no
  one, and that next term's timetable is set by room and tutor availability with
  classes continuing by default
