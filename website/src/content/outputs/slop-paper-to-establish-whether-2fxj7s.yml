title: Next Stop, Formerly
subtitle: A Teaching Case on a Bus Stop That Outlived the Hardware Store It Was Named For
authors:
  - Ingeborg Nwachukwu
  - Signy Okpara
  - Torun Ezeigwe
preset: paper
school: School of Continuous Improvement
date: 2026-10-09
publishedAt: "2026-10-09T11:01:55+11:00"
doi: 10.5555/slop.2fxj7s
summary: >-
  A paper from the School of Continuous Improvement presents a single-site
  teaching case on a suburban bus stop still registered and announced under the
  name of a hardware store closed eleven years earlier. A twelve-week crossover
  of three recorded announcements finds missed-stop rates and dwell times
  unchanged, riders' use of the old name unmoved by a rename and lowered by
  about 28 points under a second voice, and the transit authority tying any
  renaming of a stop to the session that replaces the voice announcing it.
topic: >-
  To establish whether a bus stop still registered and announced under the name
  of a hardware store that closed years ago should keep that name, in a
  single-site teaching case on one suburban route's stop-name register and the
  recorded voice that announces it
