title: How Used Is "Barely Used"?
subtitle: >-
  Three Delphi Rounds, 41 Raters, and the Condition Schedule Ratified Without
  Them
authors:
  - Bram Ntuli
  - Sten Okwuosa
  - Iben Chikere
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-16
publishedAt: "2026-08-16T20:01:03+10:00"
doi: 10.5555/slop.g0qn6j
summary: >-
  A research poster from the School of Continuous Improvement convenes 41
  marketplace moderators, second-hand dealers, and valuers over three Delphi
  rounds to fix the boundaries between the four condition grades sellers type
  into second-hand listings. Twenty-four items entered round one and eight were
  carried to round three, with panel retention at 41 of 41. Every item
  specifying the evidence a seller must supply crosses the 75 per cent
  agreement threshold registered before the first round, reaching 82.9 to 92.7
  per cent; no item defining a boundary between grades does, and the two
  adjacent-grade boundaries gain 7.3 points each across the three rounds. The
  condition schedule was subsequently ratified with the four grades as the
  panel left them and the evidence checklist attached as a numbered
  requirement, so compliance is audited on the photographs supplied rather than
  on the grade chosen.
topic: >-
  As new, barely used, good, well loved --- four condition grades in second-hand
  listings with no definition between them. A three-round Delphi panel of 41
  marketplace moderators, second-hand dealers, and valuers rates photographs of
  real posted items to fix the boundaries; consensus lands only on the evidence
  a seller must supply (original packaging, a receipt, a close photo of the wear
  point) and never on the grades themselves, and the condition schedule is
  adopted anyway, unresolved grades and all, with a mandatory evidence checklist
  attached for auditing
