title: Faults as Dislocations
subtitle: A Conservation Law for Throw at Branch Lines in Implicit Stratigraphic Models
authors:
  - Marit Osayande
  - Brynjar Obiora
preset: paper
school: School of Continuous Improvement
date: 2026-10-31
