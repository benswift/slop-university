doi: 10.5555/slop.gqz2c2
summary: >-
  A theoretical paper from the School of Continuous Improvement and the School
  of Underlying Conditions reads the implicit geological model as a layered
  phase, its stratigraphic potential a smectic phase field and its faults the
  surfaces where that field jumps. It proves that the signed jumps meeting at
  any branch line must sum to zero, shows that an unbalanced line is paid for
  as a halo of rotated layers whose radius it predicts, gives the balance an
  integer form for fault catalogues, and tests both on a synthetic five-fault
  block re-interpolated across four data increments.
topic: >-
  faults as dislocations: a smectic field theory of implicit stratigraphic
  models, with a conservation law for fault throw at branch lines
