title: Ten Seconds, Minuted
subtitle: A Single-Site Case Study of a Community Choir's Raffle Tin, and the Draw Rule It Produced
authors:
  - Petra Umbile
  - Hedvig Anyanwu
  - Marek Solheim
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-21
publishedAt: 2026-09-21T03:01:13+10:00
doi: 10.5555/slop.9s9wmg
summary: >-
  A research poster from the School of Emergent Priorities follows one
  suburban community choir through eleven end-of-year raffle draws from a single
  tin, finding that the last-sold block of tickets, 22% of the 6,240 sold, won
  41% of the 132 prizes, and that timing and minuting the constitutional
  ten-second shake changed the record of the draw but not its outcome. The
  University has since adopted the timed, minuted ten-second shake as the
  standard for every draw it runs.
topic: >-
  Although a community choir's Christmas raffle tin was shaken for the full ten
  seconds its constitution requires, the last-sold tickets kept winning; a
  single-site teaching case whose minuted ten-second shake now binds every
  University draw
