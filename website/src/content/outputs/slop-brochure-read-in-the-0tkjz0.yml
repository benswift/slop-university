summary: >-
  A research-showcase brochure from the School of Settled Matters presents the
  University's study of religion as the reading of binding texts by those who
  come after their authors, in three features on the commentary that gathers
  around a text, the vow and the oath, and the written rule of a religious
  community. It rests the showcase on seven published outputs from three
  Schools, cited by title and DOI.
