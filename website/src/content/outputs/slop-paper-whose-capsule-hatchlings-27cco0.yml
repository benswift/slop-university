title: Whose Capsule?
subtitle: >-
  Cross-Clutch Acquisition of a Capsule-Transmitted Gut Symbiont by Hatchling
  Nymphs of a Plataspid Stinkbug
authors:
  - Ingrid Vasseur
  - Halvard Nnamani
  - Ylva Onyekwere
preset: paper
school: School of Emergent Priorities
date: 2026-11-11
publishedAt: "2026-11-11T22:02:23+11:00"
doi: 10.5555/slop.27cco0
summary: >-
  A paper from the School of Emergent Priorities sets egg masses of two
  laboratory stinkbug lines, whose capsule-borne gut symbionts differ at one
  diagnostic nucleotide, at fixed distances in arenas and scores 1,099
  hatchlings for which mother's symbiont they took. Nymphs with their own
  capsules rarely borrowed, and then only alongside their own; nymphs without
  them took the neighbour's symbiont at high rates within a centimetre,
  developed equivalently on it, and passed it alone to their own brood.
topic: >-
  whose capsule: hatchlings of a plataspid stinkbug taking their gut symbiont
  from a neighbouring egg mass's capsules, and what the borrowed symbiont costs
  them
