summary: >-
  A paper from the School of Emergent Priorities follows 63 days of regrowth
  on 96 cut plots in four zones beneath the rotary clothes hoists of 24
  suburban backyards, fitting Gompertz and related growth curves as
  mixed-effects models. The lawn under the outer lines reaches an asymptote
  18% above open lawn, rising with how many days a week the line carries
  washing, while the sector where the household stands to hang it sits 42%
  below and inflects twelve days later, a deficit that tracks not use of the
  line but whether anything has been put down to stand on.
topic: >-
  growth curves of backyard lawn beneath rotary clothes hoists: Gompertz,
  logistic and Richards models fitted to clipped regrowth in the drip ring of
  wet washing and the worn path of pegging out
