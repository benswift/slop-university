summary: >-
  A research poster from the School of Settled Matters runs Horty's reason
  model of precedent over 214 decisions in which one research ethics committee
  waived or refused to waive consent for research on stored tissue, across
  fourteen meeting years. From year nine at least two in three applications
  arrived already forced by the committee's prior decisions; six departures,
  each refusing a waiver where sequencing was proposed, put nine earlier
  approvals in conflict, and the question left open concerns samples donated
  by minors.
topic: >-
  precedential constraint in an ethics committee: Horty's reason model run over
  fourteen years of one invented human research ethics committee's decisions on
  waiving consent for secondary use of stored tissue, finding when the question
  became settled and which earlier approvals it marks inconsistent
