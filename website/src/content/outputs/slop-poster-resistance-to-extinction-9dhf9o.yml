title: The Lever Still Gets a Visit
subtitle: Resistance to Extinction of a Water-Reinforced Lever Press after Abrupt versus Thinned Withdrawal
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: research-poster
school: School of Underlying Conditions
