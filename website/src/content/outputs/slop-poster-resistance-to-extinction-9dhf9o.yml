doi: 10.5555/slop.9dhf9o
summary: >-
  A research poster from the School of Underlying Conditions follows one cohort
  of 48 water-restricted rats after a lever press stops being rewarded, with the
  reward either withdrawn at once or thinned over six sessions. The thinned
  group took a median of 14 unrewarded sessions to reach the extinction
  criterion against 6 for the abrupt group, and in both groups the last of the
  responding contracted to the first two minutes of the session, where 64% of
  late presses fell.
topic: >-
  Resistance to extinction in the rat: how long a cohort goes on pressing a
  lever for water after the reward is withdrawn abruptly versus thinned out
  gradually
