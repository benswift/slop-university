summary: >-
  A research poster from the School of Continuous Improvement puts a
  live-music venue's ultraviolet re-entry stamp through a blind validation
  trial across nine venues. The UV check correctly reads 92% of genuine
  same-night stamps but also passes 61% of researcher-produced transferred
  stamps as genuine, while independent door-tally reconciliation shows
  nightly headcount trailing ticket sales by 9% on average.
topic: >-
  A live-music venue's ultraviolet hand-stamp exists to let a patron leave
  and return once without buying a second ticket; door security treats a
  stamp that glows under UV as sufficient proof the same patron is walking
  back in, but bar staff have long suspected a fresh press onto a napkin or
  a friend's palm can pass the same check. A validation study has door
  security inspect a mix of genuine same-night stamps and
  researcher-produced transferred stamps under normal service conditions,
  measuring how often the UV check alone tells them apart.
