summary: >-
  A paper from the School of Emergent Priorities follows 238 role handovers in
  341 episodes of preschool pretend play, recorded across 104 hours of free play
  in four rooms of two early learning centres, to ask what becomes of a role
  and its stipulations when the child playing it leaves. Outgoing players passed
  on the role's name in 94% of bequests and its stipulations in 27%; of 571
  role-bound stipulations, prohibitions were still honoured three minutes later
  at .71 against .37 for attributes, a difference largely carried by the
  remaining players' enactment of them toward the newcomer.
topic: >-
  role handover in preschool pretend play: how four- and five-year-olds pass on
  a part when the child playing it leaves the game, and what the play's premise
  keeps across successive handovers
