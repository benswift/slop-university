title: You Be the Mum Now
subtitle: Role Handover and the Survival of Pretend Stipulations in Preschool Peer Play
authors:
  - Iben Chikere
  - Anneke Tolan
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
