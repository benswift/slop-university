summary: >-
  A research poster from the School of Continuous Improvement surveys 186
  households on fill-at-emptying of the kitchen scraps caddy (n = 3,214
  events) and finds a right-skewed distribution (median 61%, IQR 48–74%).
  Facilities now permits staff kitchens to empty only inside that band, with
  a public register of out-of-band empties and liner restock withheld after
  two dwell breaches in a fortnight.
