title: It Came with the Hill
subtitle: How Households Read the Public-Welfare Forest Designation on Collective Forest-Use Certificates in a Southern Hill County
authors:
  - Clemency Tredinnick
preset: paper
school: School of Settled Matters
date: 2026-11-23
publishedAt: "2026-11-23T12:00:16+11:00"
doi: 10.5555/slop.kgbp9g
summary: >-
  A paper from the School of Settled Matters reads the forest-use certificates
  of 126 households in three hill villages, 208 of whose 371 parcels carry the
  public-welfare forest designation, alongside 74 interviews and 52 boundary
  walks. Households read the designation as a lease to the state, a burden
  that came with the hill, or a status of the trees, and on 23 designated
  parcels worked by someone other than the certificate holder the restriction
  bound whoever worked the slope while the compensation followed the name on
  the certificate, passed on in full on only six.
topic: >-
  how households in a hill county of southern China read the public-welfare
  forest designation that rides with their collective forest-use certificates
  after tenure reform
