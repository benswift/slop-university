summary: >-
  A research-showcase brochure from the School of Continuous Improvement
  profiles CUSP, the Cutoff Utilisation Studies Programme, and its method for
  finding the naturally occurring cutoffs already sorting community life in
  two. Six published Slop University studies anchor the case, alongside the
  researchers behind them.
topic: >-
  a suburban club raffle's early-bird ticket cutoff, treated as the flagship
  illustration of CUSP, the School of Continuous Improvement's programme for
  exploiting the naturally occurring cutoffs already threaded through
  community life --- committee-eligibility lines, waiting-list thresholds,
  audition scores --- with clubs that adopt the method binding themselves to
  the exact minute its analysis names as optimal, never a convenient round
  hour chosen by whoever is rostered on the ticket table that evening
