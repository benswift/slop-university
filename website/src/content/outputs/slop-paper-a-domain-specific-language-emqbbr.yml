title: The Sticker Fires Before Anyone Checks the Date
subtitle: >-
  GONDOLA, a Domain-Specific Language for Perishable-Stock Markdown Rules
  Compiled to Shelf-Edge-Label Firmware
authors:
  - Casimir Beng
  - Joost Nwosu
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-09-15
publishedAt: "2026-09-15T03:33:14+10:00"
doi: 10.5555/slop.emqbbr
summary: >-
  A paper from the School of Continuous Improvement describes GONDOLA, a
  domain-specific language for perishable-stock markdown rules compiled to
  electronic shelf-edge-label firmware and wired to a store's live EFTPOS
  feed, and reports a fourteen-week, twenty-two-store deployment in which a
  trader co-op's supplier-quota committee adopted the compiler's end-of-cycle
  high-waste-risk flag list as the binding basis for the following cycle's
  order allocation.
topic: >-
  A domain-specific language for perishable-stock markdown rules, compiled to
  electronic shelf-edge-label firmware and wired to a strip-mall grocer's
  live EFTPOS sales feed, with the trader co-op adopting its flagged
  high-waste-risk SKU list as the binding basis for next cycle's supplier
  order quotas.
