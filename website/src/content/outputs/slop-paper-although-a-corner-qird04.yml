doi: 10.5555/slop.qird04
summary: >-
  A paper from the School of Continuous Improvement describes NIGHTCOUNT, a
  nightly photographic shelf-count reconciliation system deployed at a
  single corner store, and reports a regional insurer's adoption of its
  unbroken clearance streak as sufficient grounds on its own to waive the
  store's discretionary claims excess, with no manual override. An
  independent blind recount taken across the same fourteen weeks diverges
  steadily from the streak as it lengthens.
topic: >-
  a nightly camera-based shelf-count reconciliation system for a corner
  store, checked against the point-of-sale ledger, whose
  zero-unresolved-discrepancy streak an insurer's discretionary excess
  waiver depends on with no ordinary override
