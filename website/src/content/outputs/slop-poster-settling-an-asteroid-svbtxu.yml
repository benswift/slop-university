title: Settled by the Fourth Opposition
subtitle: How much follow-up astrometry before a faint main-belt orbit stops missing its next apparition
authors:
  - Odalys Penhallow
  - Vigdis Emenike
  - Anouk Mensah
preset: research-poster
school: School of Settled Matters
date: 2026-11-11
publishedAt: "2026-11-11T22:30:31+11:00"
doi: 10.5555/slop.svbtxu
summary: >-
  A research poster from the School of Settled Matters refits the orbits of 312
  faint main-belt asteroids followed by one small-telescope recovery programme
  on their first one to four oppositions, finding that the next-apparition
  ephemeris passes a 2-arcsecond test for 37% of orbits at three oppositions and
  93% at four, that 98 of the 214 orbits the programme had logged as secure
  after three still missed, and that 9 of 12 reopenings followed a re-reduction
  of the first apparition against a newer star catalogue.
topic: >-
  settling an asteroid orbit: how many oppositions of follow-up astrometry
  before a faint main-belt object's next-apparition ephemeris stops missing,
  from a small-telescope recovery programme
