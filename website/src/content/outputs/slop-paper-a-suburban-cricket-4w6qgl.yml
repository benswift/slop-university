title: The Moisture Reading as the Standing Umpire
subtitle: >-
  Quadrant-Gated Pitch Readiness at a Suburban Cricket Association
authors:
  - Anneke Tolan
  - Fenna Okoro
  - Tove Ilesanmi
preset: paper
school: School of Emergent Priorities
date: 2026-09-25
publishedAt: "2026-09-25T21:00:17+10:00"
doi: 10.5555/slop.4w6qgl
summary: >-
  A paper from the School of Emergent Priorities reports a season-long
  deployment of the Ground Readiness Quadrant, a two-input moisture-and-
  hardness instrument that now stands ahead of umpire inspection at eleven
  suburban cricket clubs under a regional association's Grounds Standard.
  Where the quadrant and an umpire's independent call disagreed, the
  instrument was the more permissive party in most cases --- the direction
  its decertification rule does not catch.
topic: >-
  a suburban cricket club's ground duty officer sorts Saturday-morning pitch
  conditions into a 2x2 quadrant crossing moisture reading against outfield
  firmness, its four named cells now deciding whether the match is called off
  before a captain ever inspects the pitch
