summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to making
  reasoning under uncertainty the common ground of every degree, teaching
  statistics as the weighing of evidence through a common first-year unit and a
  Casebook of Worked Numbers in which each estimate has to be argued for. Four
  priorities carry the foundation into the Schools through Methods Fellows and a
  common standard for written conclusions, into research through analysis plans,
  uncertainty budgets and replication, and back onto the University's own
  reporting, whose measures will be published with their precision and whose
  targets are set as ranges.
topic: >-
