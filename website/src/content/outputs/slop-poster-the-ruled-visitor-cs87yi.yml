title: Whoever Found the Pen
subtitle: >-
  Criterion Validity of a Comment-Book Engagement Indicator at 26 Regional
  Galleries
authors:
  - Ronja Oyelaran
  - Marek Solheim
  - Torun Ezeigwe
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-07
publishedAt: 2026-08-07T04:01:19+10:00
doi: 10.5555/slop.cs87yi
summary: >-
  A research poster from the School of Emergent Priorities tests whether a state
  galleries network's exhibition-engagement indicator, the count of visitor
  comment-book entries per thousand visitors, measures what it is used to
  decide. Across 26 regional galleries over fourteen months, 4,318 book entries
  were transcribed and double-coded (kappa = 0.84) and 3,904 exit intercepts
  were run on the same gallery-days. The indicator shows only a weak association
  with survey-measured engagement (r = 0.19, 95% CI -0.21 to 0.54) and a
  stronger one with the share of visitors arriving in an organised group
  (r = 0.58); 61% of entries carry no evaluative content, and every touring-show
  extension in the window went to a gallery in the indicator's top quartile.
topic: >-
  the ruled visitor comment book on a plinth by the door of a regional public
  gallery, biro on a string, where a state galleries network reports
  comment-book entries per thousand visitors as its exhibition-engagement
  indicator and extends or retires touring shows on it --- validating that
  indicator against an independent exit-intercept survey run at the same
  galleries on the same days
