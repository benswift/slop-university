summary: >-
  A research-showcase brochure follows a suburban quilting guild's
  block-count tally, kept to balance contribution to its flagship show
  quilt, as it quietly becomes the guild's leadership ladder, and sets the
  single-site case alongside the University's wider programme of reading
  what an ordinary community tally is asked to decide.
