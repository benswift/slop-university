doi: 10.5555/slop.hqxt88
summary: >-
  Slop University's Strategic Plan 2026-2031 treats the slow landslide beneath
  the lower terraces of its hillside campus as a permanent condition of the
  estate. It commits the University to a single register of ground readings, a
  design standard for building on moving ground, and an annually published
  Retreat Register that ranks every exposed building for planned withdrawal and
  keeps the rows of buildings already withdrawn.
topic: >-
  Slop University plans its next five years around the slow landslide creeping
  beneath its hillside campus: watching it, building with it, and deciding which
  buildings it will be allowed to take.
