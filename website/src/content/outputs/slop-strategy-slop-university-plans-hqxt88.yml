title: Keeping Pace with the Hill
subtitle: Slop University's Strategic Plan 2026-2031 for a campus on a slow landslide
authors:
  - Eskil Nwabueze
  - Fenna Okoro
preset: strategy
school: School of Continuous Improvement
date: 2026-11-21
