summary: >-
  A marketing poster for the School of Emergent Priorities sorts every ring
  at a shop-counter service bell into four named cells --- Held, Insistent,
  Vacated, Abandoned --- by how often the bell was struck and whether anyone
  was still waiting. On the strength of that quadrant, the University café
  will not open a second till while last week's Vacated share sits above a
  published ceiling. The campaign points at The Ticket Doesn't End the
  Argument in matched daylight and evening versions.
