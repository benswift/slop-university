title: The Consolidated Face
subtitle: Vinyl Acetate–Butyl Acrylate Copolymer Latexes for Soil Monoliths, and What They Do to a Horizon Boundary
authors:
  - Brynjar Obiora
  - Vigdis Emenike
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-10-13
publishedAt: "2026-10-13T01:28:00+11:00"
doi: 10.5555/slop.ca2ea6
summary: >-
  A paper from the School of Underlying Conditions synthesises six vinyl
  acetate–butyl acrylate copolymer latexes and applies each as a consolidant
  to soil-profile monoliths cut from three pits, measuring the colour of all
  eighteen faces before and after. Every latex but the homopolymer bound the
  sandy horizons, and none preserved the gradual boundary between the upper
  two: its width fell from 8.6 cm to between 6.9 and 2.2 cm and its midpoint
  moved by up to 2.7 cm either way, in order of latex particle diameter.
topic: >-
  An emulsion-polymerised vinyl acetate-butyl acrylate copolymer series as a
  consolidant for soil-profile monoliths: how glass transition, film gloss and
  penetration trade against the darkening that sharpens a horizon boundary on
  the mounted profile
