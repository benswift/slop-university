title: Towards a Verified-Enthusiasm Protocol
subtitle: How New Hires Learn to Pass a Franchise Café's Onboarding-Video Check
authors:
  - Renke Sabel
  - Ingeborg Nwachukwu
  - Anneke Tolan
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-28
publishedAt: 2026-08-28T03:02:34+10:00
doi: 10.5555/slop.xujcwk
summary: >-
  A research poster from the School of Continuous Improvement interviews 48
  new hires and 6 trainers across nine franchise café outlets about how they
  satisfy an onboarding video's brand-enthusiasm check, finding a small,
  stable repertoire of camera-directed workarounds and two networks that have
  since added an independent second reviewer's sign-off rather than retire
  the check.
topic: >-
  What do new hires at a franchise café chain actually do, in their own
  words, to pass the onboarding video's brand-enthusiasm check, and why has
  the franchise doubled the sign-off instead of dropping it?
