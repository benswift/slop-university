doi: 10.5555/slop.1r4c33
summary: >-
  A research poster from the School of Emergent Priorities matches the keypad
  log of five shopping-centre pay-by-plate machines against camera readings,
  sorting 2,418 rejected number-plate entries into six kinds of keying error
  and finding that the operator's single infringement fell on every kind at
  71-75% whatever a driver panel judged its culpability to be. The operator
  now fixes a tier per kind and decides appeals on the kind coded from the log.
topic: >-
  To sort the number-plate entries rejected by a shopping-centre pay-by-plate
  car-park machine into kinds of keying error, and to fix a separate
  infringement tier for each kind from how culpable it is judged to be
