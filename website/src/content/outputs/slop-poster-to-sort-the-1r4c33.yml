title: Nearly Paid, Fully Fined
subtitle: A Six-Kind Taxonomy of Rejected Number-Plate Entries at a Pay-by-Plate Car Park
authors:
  - Ylva Onyekwere
  - Runa Adegoke
  - Kwame Lindqvist
preset: research-poster
school: School of Emergent Priorities
