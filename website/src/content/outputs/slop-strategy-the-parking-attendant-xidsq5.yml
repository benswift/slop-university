title: Displayed Is Paid
subtitle: >-
  The 2026-2031 Strategic Plan Adopts the Parking Attendant's Census of
  Dash Tickets as Paid Occupancy, With No Expiry a Displayed Ticket Can
  Outrun
authors:
  - Petra Umbile
  - Iben Chikere
  - Ronja Oyelaran
preset: strategy
school: School of Emergent Priorities
date: 2026-09-08
publishedAt: "2026-09-08T19:32:15+10:00"
doi: 10.5555/slop.xidsq5
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to
  treating paper on the dash as paid occupancy across every bay it licenses,
  retiring expiry as an indicator, holding leftover tickets as occupancy in
  empty bays, logging ticketless cars as vacancies, and indexing partner-site
  placement funding to displayed-paper share.
topic: >-
  The parking attendant surveys every car at the meter, reporting the
  distribution of pay-and-display tickets on the dash — face-up, face-down,
  faded, or gone — and the University treats paper on the dash as paid
  occupancy, with no expiry a displayed ticket cannot outrun.
