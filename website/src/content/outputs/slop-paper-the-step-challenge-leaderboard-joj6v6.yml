title: Nothing Moved but the Benchmark
subtitle: >-
  A Random-Effects Meta-Analysis of 46 Workplace Step-Challenge Evaluations
  Lodged Under an Accreditation Scheme That Sets Its Threshold From Them
authors:
  - Dagny Okafor
  - Sten Okwuosa
  - Ingeborg Nwachukwu
preset: paper
school: School of Continuous Improvement
date: 2026-08-16
publishedAt: 2026-08-16T16:01:35+10:00
doi: 10.5555/slop.joj6v6
summary: >-
  A paper from the School of Continuous Improvement synthesises all 46
  evaluations lodged across seven rounds of one workplace-activity accreditation
  (16,082 participants), under a scheme whose benchmark is recomputed each round
  as the pooled effect of the evaluations lodged the round before. The pooled
  gain is 1,318 steps per day (95% CI 1,074 to 1,562) with substantial
  heterogeneity (I2 = 89.4 per cent), of which measurement source explains 68.7
  per cent: evaluations whose counts came from the challenge application return
  1,712 steps per day, those issuing sealed accelerometers read independently of
  the challenge return 118, an interval including zero. Funnel asymmetry is
  present (Egger's intercept 2.41, p = 0.002), 15 of 61 registered challenges
  were never lodged, and trim-and-fill adjusts the pooled estimate to 624 steps
  per day. Across the seven rounds the benchmark rose from 640 to 1,318 steps
  per day while the independently measured estimate stayed between 74 and 141,
  and refitting under REML with the Knapp-Hartung adjustment moves the pooled
  estimate by 24 steps per day.
topic: >-
  the step-challenge leaderboard printed out and taped to the tea-room fridge
  each Monday, where a workplace-health peak body's accreditation requires each
  member employer to run an annual step challenge and lodge its evaluation, and
  sets the benchmark every member must beat at the pooled effect from the
  evaluations lodged the year before; a random-effects meta-analysis of the
  lodged evaluations finds the pooled gain is a measurement artefact, large
  wherever the challenge app supplied the step counts, indistinguishable from
  zero in the few that issued sealed accelerometers, and the funnel asymmetric
  because a coordinator whose challenge moved nothing had nothing to lodge, so
  the benchmark climbs each year on evidence it compelled into existence
