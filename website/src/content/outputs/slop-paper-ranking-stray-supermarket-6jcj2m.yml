title: Visible First
subtitle: >-
  An Exposure-Weighted Dispatch Service for Stray Supermarket Trolleys
authors:
  - Verity Marris
  - Torun Ezeigwe
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
date: 2026-07-28
publishedAt: 2026-07-28T06:01:39+10:00
doi: 10.5555/slop.6jcj2m
summary: >-
  A paper from the School of Emergent Priorities describes an eighteen-week
  deployment of a dispatch service that ranks each reported stray supermarket
  trolley by an estimate of how readily it is seen from the arterial road
  network, discounted by estimated retrieval cost, across a twenty-one-store
  retail network handling 9,412 reports from four depots. Exposure-weighted
  median time to collection fell from 58.4 hours to 9.0 hours and improved at
  every depot, while across all reports the ninetieth percentile rose from 96
  hours to 412 hours and the share still open at study close rose from 0.4% to
  6.1%, entirely within laneway and drainage-reserve frontages; an ablation
  removing the sightline prior from the exposure weight produced no detectable
  change in any headline measure.
topic: >-
  ranking stray supermarket trolleys for collection by how visible each one is
  from a main road rather than how far it has strayed, and what happens to the
  trolleys nobody can see
