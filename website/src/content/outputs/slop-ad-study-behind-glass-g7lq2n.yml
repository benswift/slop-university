summary: >-
  A marketing poster for Slop University invites applications to the School of
  Settled Matters, presenting its reading rooms, glazed on all four sides, as a
  guarantee that no student's study goes unseen. Composed for portrait campus
  and roadside signage, it pictures a lit glass pavilion of readers at dusk,
  watched from the path outside.
