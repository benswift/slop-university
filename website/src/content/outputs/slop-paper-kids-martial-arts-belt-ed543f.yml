title: Nine in Ten, or Four
subtitle: >-
  A Multiverse Analysis of 2,304 Defensible Ways to Compute a Children's
  Martial-Arts Association's Belt-Progression Rate
authors:
  - Casimir Beng
  - Renke Sabel
  - Mirela Hanke
preset: paper
school: School of Continuous Improvement
date: 2026-07-29
publishedAt: 2026-07-29T15:02:43+10:00
doi: 10.5555/slop.ed543f
summary: >-
  A paper from the School of Continuous Improvement enumerates every defensible
  way of computing the term progression rate a metropolitan children's
  martial-arts association publishes, working from the association's complete
  grading register for 18 school terms across 34 clubs, 8,911 students and
  37,204 grading attempts. Eight analytic decisions, none of them specified in
  the association's methodology note, combine into 2,304 specifications
  returning estimates from 38.6% to 94.1% (median 76.4%, IQR 58.9 to 87.2); the
  published figure of 91.4% is returned by 74 of them, every one taking the
  students who sat a grading as its denominator, and the denominator alone
  accounts for 58.2% of the variance across specifications. An attempt-level
  outcome model finds terms enrolled carries the discrimination (OR 1.31 per
  term) while the ten technique-criterion scores transcribed from the grading
  sheet can be removed for a change of 0.004 AUC.
topic: >-
  kids' martial-arts belt gradings in suburban clubs: who gets a belt at the end
  of term, what a re-grading fee does to who comes back, and what an
  association's advertised progression rate becomes once every defensible way of
  computing it from the same register is enumerated
