title: The Chalkboard Special as a Loyalty Filter
subtitle: Who hears the second list at the counter
authors:
  - Casimir Beng
  - Dagny Okafor
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-25
publishedAt: "2026-09-25T14:02:05+10:00"
doi: 10.5555/slop.r5g3n3
summary: >-
  A research poster from the School of Continuous Improvement interviews 34
  supermarket, strip-mall and food-truck staff across 21 sites about an
  unchalked second specials list, finding 85% independently name the same
  criterion for who hears it. The Office of Research Outputs is drafting a
  written loyalty-recognition rubric for adoption across affiliated retail
  partners on the strength of the convergence.
topic: >-
  Determine whether supermarket, strip-mall and food-truck staff keep two
  specials lists -- one chalked up for everyone, one offered by word of mouth
  only to certain regulars -- and what, in their own words, decides who hears
  the second list
