title: Buy the Ring, Make the Rest
subtitle: >-
  A Transaction-Cost Theory of the Route Boundary in Heterocycle Synthesis
authors:
  - Clemency Tredinnick
  - Kwame Lindqvist
  - Sunniva Balogun
preset: paper
school: School of Settled Matters
date: 2026-11-25
publishedAt: "2026-11-25T18:00:52+11:00"
doi: 10.5555/slop.h555gz
summary: >-
  A paper from the School of Settled Matters models a synthesis group's choice
  to make or buy each intermediate on a route to a heterocyclic target as a
  problem in transaction-cost economics, and proves that catalogue supply ends
  at the ring that carries its coupling handles. The optimal boundary sits
  there when the ring's regiochemistry is settled and retreats to the acyclic
  precursors when it is not; on a stylised five-step route, buying the
  handle-bearing ring saves about a third of the cost of making everything.
topic: >-
  a transaction-cost theory of when a synthesis group should make a
  heterocyclic building block in-house or buy it, and why the make-or-buy
  boundary falls at the ring
