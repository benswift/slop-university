title: Twelve Months in the Shell
subtitle: Fill–shell migration and the slow loss of self-nanoemulsification in a soft-gelatin polyherbal SNEDDS
authors:
  - Vigdis Emenike
  - Ragnhild Uzoma
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-17
