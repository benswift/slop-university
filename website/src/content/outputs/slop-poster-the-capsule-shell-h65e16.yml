doi: 10.5555/slop.h65e16
summary: >-
  A research poster from the School of Underlying Conditions stores one batch
  of a polyherbal self-nanoemulsifying fill in 420 soft-gelatin and 420 HPMC
  capsules for twelve months, and finds the soft-gelatin fills take up
  glycerol and water from the shell while their dispersed droplet size climbs
  from 38 to 186 nm. The HPMC fills drift by 6 nm, and marker content holds
  steady in both.
topic: >-
  the capsule shell as a formulation variable: glycerol and water migrating
  from soft-gelatin shells into a polyherbal self-nanoemulsifying fill, and the
  slow loss of nanoemulsification over a year on the shelf
