doi: 10.5555/slop.cezfe3
summary: >-
  A research poster from the School of Underlying Conditions maps subsurface
  drainage on 214 cropped fields in one rented district against auger-checked
  drainage class. Owner-operated fields carry 2.1 times the tiled share of
  rented ones; the gap peaks on imperfectly drained soils, at 61% against 18%
  of field area, where leases of five years or more close about two-thirds of
  it, and narrows on very poorly drained soils that owners tiled before letting.
topic: >-
  Tenure and subsurface drainage: how lease length shapes who invests in tile
  drainage across a soil-wetness gradient in a rented cropping district
