title: Who Drains the Rented Field
subtitle: >-
  Lease length, cost-sharing and subsurface drainage across a soil-wetness
  gradient
authors:
  - Brynjar Obiora
  - Clemency Tredinnick
  - Ylva Ogunbanjo
preset: research-poster
school: School of Underlying Conditions
date: 2026-11-22
