summary: >-
  A prospectus from the School of Underlying Conditions invites prospective
  students to learn mathematics in the course of studying the ground, starting
  from whatever they already have. It sets the teaching in three places, the
  core tray, the outcrop, and the bench and bore, profiles the three
  researchers who teach there, and rests its invitation on five published
  studies cited by title and DOI.
