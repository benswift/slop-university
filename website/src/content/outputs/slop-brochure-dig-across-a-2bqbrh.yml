summary: >-
  A prospectus inviting students to enrol in one of the University's three
  Schools and study across all of them, presented as a single line of inquiry
  that runs from the priorities of the School of Emergent Priorities, through
  the measurement of the School of Continuous Improvement, down to the soil
  and rock of the School of Underlying Conditions. Five published studies that
  reached beyond their home discipline are cited by title and DOI as the
  evidence for the pitch.
