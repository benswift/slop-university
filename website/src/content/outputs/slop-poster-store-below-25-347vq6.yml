title: Below 25 °C, on Average
subtitle: Mean kinetic temperature and projected marker retention for one tincture lot in 48 household storage places
authors:
  - Vigdis Emenike
  - Casimir Beng
  - Ylva Ogunbanjo
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-30
publishedAt: "2026-10-30T18:31:16+11:00"
doi: 10.5555/slop.347vq6
summary: >-
  A research poster from the School of Underlying Conditions logs the
  temperature beside one lot of an ethanolic leaf tincture in 48 households for
  twelve months and finds its mean kinetic temperature above the arithmetic
  mean in every storage place. Bottles kept on windowsills and over cooktops
  averaged under the label's 25 °C yet ran at 27.8 to 28.9 °C kinetically,
  bringing their projected marker retention to its 90 per cent limit at 18 to
  20 months, inside the labelled shelf life of 24.
topic: >-
  store below 25 °C: logging the cupboards where one herbal tincture is
  actually kept, and what their mean kinetic temperature does to the marker
  constituent its shelf life was assigned on
