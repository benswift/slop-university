summary: >-
  A case-for-support brochure from the School of Continuous Improvement takes
  the call and response of Caribbean and African oral storytelling as its model
  of feedback, and invites partners to support three strands of work: the
  Adaptive Metrics Lab's study of how a group knows it has been answered,
  reading circles that finish a text together, and a library of readers'
  replies kept by the Living Dashboard. It features eight of the University's
  published outputs and profiles two of its researchers.
topic: >-
  call and response: a university that answers what it reads, after the story
  circles of Caribbean and African oral literature
