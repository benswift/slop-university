summary: >-
  A prospectus led by the School of Underlying Conditions invites students to
  study management as it is practised across the University's three schools:
  the field crew and its briefing, the agenda and its minutes, and the task
  that is handed to someone else. It rests the invitation on five published
  studies of handovers, meetings, keys and ledgers, cited by title and DOI.
