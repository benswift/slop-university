title: Mark It Top
subtitle: Where the Seabed Begins on a Coastal Survey Vessel's Deck
authors:
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-11-10
publishedAt: "2026-11-10T20:32:14+11:00"
doi: 10.5555/slop.yjuo1j
summary: >-
  An ethnography from the School of Underlying Conditions follows the
  gravity-coring crew of a state survey vessel across five legs and 188
  observed recoveries, asking how the technicians decide where to draw the pen
  line marked TOP that becomes each core's zero depth. It describes four ways a
  top is settled, finds that half are settled by tipping the liner and marking
  where the mud stops moving, and argues that on this deck the seabed begins
  where a core can be carried.
topic: >-
  the core top: an ethnography of a coastal survey vessel's gravity-coring
  crew, and how they settle on deck where the seabed begins in each core
