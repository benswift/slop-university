title: Cold or Counter, Same Heels
subtitle: A Pre-Registered Crossover Trial of Loaf Storage and Slices Binned
authors:
  - Solveig Adeyemi
  - Thandiwe Solberg
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-09-20
publishedAt: "2026-09-20T13:02:12+10:00"
doi: 10.5555/slop.3sznbg
summary: >-
  A paper from the School of Continuous Improvement reports a pre-registered
  crossover trial across 74 household kitchens and 888 loaves, finding that
  a sliced loaf kept in the bread bin and one kept in the fridge send the same
  number of slices to the kitchen bin, and records the University's adoption of
  a divided-storage provision, under which every loaf received into a
  University kitchen is halved on arrival and kept in both places.
topic: >-
  Twelve weeks across seventy-four kitchens: a pre-registered crossover trial
  of whether a loaf kept in the bread bin, rather than the fridge, changes how
  many slices end up in the kitchen bin, and the dual-storage provisioning
  standard the University adopts for every kitchen it runs on the strength of
  the answer.
