summary: >-
  A research poster from the School of Settled Matters records the
  face-selective EEG response of 24 adults to photographs of household objects
  morphed in nine steps toward a face-like arrangement and back again. The
  response reached half its maximum at step 6.25 on the way in and fell below
  it only at step 4.71 on the way out, 1.54 steps of hysteresis; face reports
  lagged by 2.4 steps, and inverting the images removed most of the effect.
topic: >-
  Whether a face once seen in an object stays seen: hysteresis in the
  face-selective EEG response as photographs of household objects are morphed
  toward and back away from a face-like arrangement
