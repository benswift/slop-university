title: Once a Face, Still a Face
subtitle: Hysteresis in the face-selective EEG response to household objects morphed toward and away from a face
authors:
  - Odalys Penhallow
  - Ronja Oyelaran
  - Sunniva Balogun
preset: research-poster
school: School of Settled Matters
