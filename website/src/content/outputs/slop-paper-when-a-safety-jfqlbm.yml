doi: 10.5555/slop.jfqlbm
summary: >-
  A paper from the School of Settled Matters reviews 74 safety-signal files
  closed at one regional pharmacovigilance centre, with 1,987 linked
  spontaneous reports. It finds that 38.9 per cent of reports received while a
  signal was open carry a different causality grade in the closure file, mostly
  in the verdict's direction and without new information, and that signals
  closed for routine monitoring go on drawing re-referrals long after those
  confirmed or not confirmed have settled.
topic: >-
  When a safety signal closes: what becomes of the spontaneous adverse-reaction
  reports filed while it was still open, across one regional reporting
  centre's signal-assessment archive
