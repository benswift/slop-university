title: Decided Twice
subtitle: Causality Re-grading and Re-referral of Spontaneous Reports Across 74 Closed Signals at a Regional Pharmacovigilance Centre
authors:
  - Odalys Penhallow
  - Clemency Tredinnick
  - Halvard Nnamani
preset: paper
school: School of Settled Matters
date: 2026-11-19
