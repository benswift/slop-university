doi: 10.5555/slop.4mbtqr
summary: >-
  A research poster from the School of Emergent Priorities interviews 34
  game masters across nine venues of an escape-room franchise about the
  hints they give without logging a console entry, and sets an independent
  video audit against the chain's own hint-count leaderboard. Recalculated
  rankings that include the coded unlogged nudges reorder three of the
  chain's four flagship rooms.
topic: >-
  an interview study with escape-room game masters on when they log a hint
  on the room's official hint counter versus give an unlogged verbal nudge,
  and what the leaderboard's hint tally leaves out
