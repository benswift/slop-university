title: The Hint That Didn't Count
subtitle: >-
  Interviewing Escape-Room Game Masters on Logged and Unlogged Hints
authors:
  - Petra Umbile
  - Anneke Tolan
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-12
