title: Does Passing a Radio Club's Arbitrary Cutoff Actually Predict More Time on Air?
subtitle: >-
  A Regression-Discontinuity Design Around a Suburban Radio Club's In-House
  Assessment Cutoff
authors:
  - Lindiwe Achterberg
  - Verity Marris
  - Petra Umbile
preset: paper
school: School of Emergent Priorities
date: 2026-09-15
publishedAt: "2026-09-15T11:06:24+10:00"
doi: 10.5555/slop.03eybs
summary: >-
  A paper from the School of Emergent Priorities treats a suburban amateur
  radio club's fifteen-year-old, never-revalidated 70-point pass mark as a
  regression-discontinuity cutoff across 214 assessment sittings, finding
  self-logged monthly on-air hours jump sharply at the mark while the
  repeater's own independently metered log shows no comparable rise. The
  club's training and assessment coordinator continues to treat clearing the
  mark as permanent grounds for exemption from net-control duty and priority
  in the equipment-loan queue.
topic: >-
  A suburban amateur radio club's training and assessment coordinator treats
  an arbitrary 70/100 pass mark on the club's own in-house Advanced Operator
  theory assessment as sufficient grounds to exempt a member from net-control
  duty and grant first call on loaned equipment for as long as they remain
  financial; a regression-discontinuity design around the cutoff finds
  self-logged air-time hours jump sharply at the mark while the repeater's own
  independently metered usage log does not.
