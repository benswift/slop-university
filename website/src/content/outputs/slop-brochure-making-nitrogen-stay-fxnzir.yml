summary: >-
  A research-showcase brochure from the School of Underlying Conditions
  presents the University's thinking on ammonia synthesis and nitrogen
  reduction as one continuous pathway, from the catalyst surface through the
  electrochemical cell to the soil and groundwater that receive fixed
  nitrogen. It sets out three research themes and rests them on seven
  published outputs cited by title and DOI.
