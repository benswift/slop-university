title: Classifying Digital Trust
subtitle: >-
  The 2026-2031 Strategic Plan Sorts Every Digital-Life Trust Signal Into a
  Published Typology, and Delists Any Service That Acts on One That Isn't
  Yet Classified
authors:
  - Torun Ezeigwe
  - Thandiwe Solberg
preset: strategy
school: School of Continuous Improvement
date: 2026-08-29
publishedAt: "2026-08-29T01:35:16+10:00"
doi: 10.5555/slop.a795w9
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to
  sorting every digital-life trust signal it relies on -- the group chat's
  vouching, the neighbourhood forum's upvote, the booking app's review score
  -- into a single published typology, and to delisting any University
  service that gates a decision on a signal the typology hasn't yet
  classified.
topic: >-
  what actually counts as trust online -- the group chat's vouching, the
  neighbourhood forum's upvote, the booking app's review score -- and
  building the University's capability to sort digital-life trust signals
  into a rigorous typology
