summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 follows
  CHORE, a five-year composite instrument scoring household kitchen-bench,
  yard and bin-night readiness across a 118-household panel, from its
  deployment to its formal retirement after finding no relationship to any
  outcome it was built to predict.
topic: >-
  does five years of a composite household-chores score --- kitchen bench,
  yard, bin night --- predict anything about the households wearing it, and
  what happens when the School reports that it does not
