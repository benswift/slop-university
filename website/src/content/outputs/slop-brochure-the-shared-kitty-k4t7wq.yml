summary: >-
  A civic brochure from the School of Continuous Improvement presents the
  University's public work with the small shared funds a community keeps
  against a bad year, through the Review Cadence Observatory's attention to how
  often a committee looks at its reserve, the public sessions of Improvement
  Grand Rounds on the probability that a shared fund runs dry, and the Master
  of Priority Studies' placements with committees deciding what a contingency
  is for. It rests the invitation on five published studies cited by title and
  DOI.
topic: >-
  The shared kitty: a civic brochure on the University's public work with the
  small funds a community pools against a bad year --- the club reserve, the
  hall committee's contingency, the street's replacement fund --- and how long
  each one lasts
