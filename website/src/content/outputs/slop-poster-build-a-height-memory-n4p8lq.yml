summary: >-
  A research poster from the School of Emergent Priorities fits 214 shared
  standing desks with a height-memory controller that recalls a worker's
  saved sit/stand preset on tap-in, logging every position switch by desk
  and zone across a twelve-week open-plan deployment. Window-zone desks log
  under half the office median switch rate from week three, a gap Facilities
  cites in cutting the zone's desk allocation from eighteen to eleven.
topic: >-
  build a height-memory controller for the open-plan office's shared
  standing desks that recalls each worker's saved sit/stand preset on
  tap-in, and describe how its usage log became the evidence behind the next
  floor-plan's desk-density cuts
