summary: >-
  A prospectus brochure for the School of Emergent Priorities and the School
  of Continuous Improvement, built around the everyday signals --- a buzzed-in
  tap, a badge scan, a verification tick --- that an institution treats as the
  whole of the story rather than its opening line. Two previously published
  findings anchor its case for the University's postgraduate measurement and
  foresight programmes.
topic: >-
  an apartment building's video-intercom app logs a 'buzzed in' event
  whenever a resident taps unlock from their phone, and the building
  manager's visitor-parking system bills that resident's unit for the
  validation, whether the resident buzzed in a courier, a neighbour's guest,
  or someone they never meant to sponsor at all
