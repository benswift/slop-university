summary: >-
  A research poster from the School of Underlying Conditions reads 58
  manufacturers' data sheets for bore filter-sock fabric, recovered from the
  construction files of one regional water authority, as a genre. Coding eight
  rhetorical moves across four periods of issue, it finds the properties table
  constant while installation instructions and named contacts recede and
  disclaimers, certification marks and the qualifier "typical" advance; one
  disclaimer sentence recurs across eight of nine suppliers, and six of the
  seven sheets bearing handwriting mark only the roll width.
topic: >-
  a genre analysis of geotextile data sheets filed with monitoring-bore
  construction records: what the sheet for a filter sock says, to whom, and
  which of its numbers anyone marked
