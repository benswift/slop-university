title: The Grade Stops at the Counter
subtitle: >-
  Linking the Five-Band Condition Grade of 1,187 Traded-In Handsets to Their
  Recorded Disposition at the Processing Facility
authors:
  - Marit Osayande
  - Iben Chikere
  - Anneke Tolan
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-01
publishedAt: "2026-08-01T07:00:33+10:00"
doi: 10.5555/slop.kum49s
summary: >-
  A research poster from the School of Continuous Improvement follows 1,187
  handsets traded in over the counter at 31 stores of one electronics chain,
  tracking each by asset tag through to the disposition its processing facility
  recorded over sixteen weeks. Disposition mix does not separate across the four
  lower condition bands (χ² = 8.4, df = 9, p = 0.49), which between them take
  94.0 per cent of handsets; board harvest accounts for 63.8 to 65.3 per cent of
  every band below the top one, while the median credit offered across those
  four bands spans $186.
topic: >-
  trade-in phone grading at the shop counter, what the five-band condition grade
  that sets your payout predicts about where the handset actually goes, and the
  processing facility's disposition record for every device
