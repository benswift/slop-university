doi: 10.5555/slop.3es318
summary: >-
  A paper from the School of Continuous Improvement scores 63 roadside service stations against the five-level Toilet-Key Custody Maturity Model, from Loose to Reconciled, and sets each station's level against the wait for the customer toilet key, the keys lost per year and the share of toilet-bound entrants who asked for it. The median wait rises about 41 seconds per level while keys lost do not differ by level, and the University now issues every key it holds, of whatever lock, on a Level 3 fob of not less than 180 mm.
topic: >-
  The Adaptive Metrics Lab scores roadside service stations against a five-level Toilet-Key Custody Maturity Model (Loose, Tagged, Encumbered, Ledgered, Reconciled), and the University fits every key it issues with a Level 3 oversized fob whatever the lock.
