doi: 10.5555/slop.1ag5cm
summary: >-
  A paper from the School of Underlying Conditions dissects 24 hands of fresh
  ginger from one smallholder lot into 418 fractions and assays each for
  6-gingerol. The processing bench's routine sample, a peeled mid-section of
  a primary finger, came within 2.4 per cent of the whole-hand content only
  because discarding the rich peel and leaving out the poor mother rhizome
  erred in opposite directions, and compositing segments within hands would
  halve its sampling error for the same chromatography.
topic: >-
  the gingerol an assay never sees: how much of one smallholder lot's
  6-gingerol goes out with the peel and trimmed fingers before assay, and how
  segment position biases the sample
