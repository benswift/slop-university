title: What the Assay Never Sees
subtitle: Peel, Tips and Segment Position in the 6-Gingerol Content of One Lot of Fresh Ginger Rhizome
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-11-02
