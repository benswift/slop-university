doi: 10.5555/slop.20xlw4
summary: >-
  A research poster from the School of Underlying Conditions runs three
  identical nickel methanation tubes from one hydrogen supply through 41
  unplanned outages, holding one under feed gas, purging and cooling the
  second and purging and trace-heating the third. Holding recovers faster than
  purging on every outage under 5 h and slower on every one over 12 h, keeping
  warm recovers within 15 min throughout, and a rule that holds for 45 min
  before purging and warming matches it at a median 8 min while skipping 20
  purges.
topic: >-
  Hold, purge or keep it warm: how a pilot fixed-bed CO2 methanation reactor
  recovers after unplanned hydrogen outages under three standby strategies
