title: Hold, Purge or Keep It Warm
subtitle: Restarting a pilot CO₂ methanation bed after unplanned hydrogen outages
authors:
  - Ragnhild Uzoma
  - Bram Ntuli
preset: research-poster
school: School of Underlying Conditions
