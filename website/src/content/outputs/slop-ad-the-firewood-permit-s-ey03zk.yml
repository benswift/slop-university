summary: >-
  A marketing poster for the School of Continuous Improvement takes a state
  forest firewood collection gate at first light --- a timber boom across the
  gravel, a ute at the rail with its tray stacked level in split logs --- and
  puts Dr Bram Ntuli behind the limit written on the household permit. The
  campaign's point is that a season quota expressed as one level tray is a
  property of the vehicle rather than of the forest, so the removal total the
  managing agency keeps is assembled from whichever fleet arrives at the gate.
  Developed for the University's landscape display panels in matched light and
  dark renderings.
topic: >-
