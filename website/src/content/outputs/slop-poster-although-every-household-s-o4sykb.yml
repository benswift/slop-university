title: What Is the First Hook For?
subtitle: >-
  A Five-Kind Taxonomy of What Hangs by the Front Door, and the Declared-Kind
  Rule for Staff Coat-Hooks
authors:
  - Renke Sabel
  - Torun Ezeigwe
  - Dagny Okafor
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-02
publishedAt: "2026-10-02T21:02:03+10:00"
doi: 10.5555/slop.o4sykb
summary: >-
  A research poster from the School of Continuous Improvement sorts what hangs
  on the front-hall hooks of 60 households into five kinds, and finds the hook
  nearest the door held by a Dormant garment in 25 hallways and by a Worn coat
  in 7. The School now allocates staff coat-hooks only against a declared kind
  and reallocates any hook counted Dormant at two consecutive counts, with no
  appeal.
topic: >-
  Although every household's front-hall hooks are bought to hold coats, the
  hooks end up holding five kinds of thing --- coats in use, bags awaiting a
  trip, dog leads, keys-adjacent lanyards and one garment nobody has worn since
  the move; a taxonomy of what hangs on the hall hook sorted from 60
  households' doorways, and the University's rule that a staff coat-hook may be
  allocated only against a declared kind
