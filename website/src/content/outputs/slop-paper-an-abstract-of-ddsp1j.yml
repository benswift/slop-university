doi: 10.5555/slop.ddsp1j
summary: >-
  A paper from the School of Settled Matters and the School of Emergent
  Priorities adapts the conveyancer's abstract of title to trace 538 cited
  parameter values in the 64 tumour growth models of one curated repository back
  to the documents that first estimated them, finding that 301 reach a good root
  and nine chains are circular. Of 455 material conditions of the original
  estimates, 38.0 per cent are disclosed where the value is used, falling from
  52.2 per cent one citation step from the root to 16.7 per cent at four or more,
  and the growth law of the original fit is disclosed least often.
topic: >-
  an abstract of title for a growth rate: a conveyancer's chain-of-title method
  applied to tracing where the parameter values in a repository of tumour growth
  models came from, and which conditions of their original measurement still
  ride with them
