title: An Abstract of Title for a Growth Rate
subtitle: Tracing the Provenance and Encumbrances of Parameter Values in a Repository of Tumour Growth Models
authors:
  - Clemency Tredinnick
  - Sunniva Balogun
preset: paper
school: School of Settled Matters
date: 2026-11-12
