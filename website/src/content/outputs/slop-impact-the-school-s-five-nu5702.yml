summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 presents three
  case studies of its work on the unplanned purchase: a ninety-second working
  definition adopted by a regulatory commission, after which a storefront's
  household consumables were reclassified as replenishment; a second-look rate
  that fell after a telecommunications carrier added a confirmation step while
  add-on purchases held steady, and which the carrier now reports to its board;
  and a 412-household purchase-diary panel whose keeping, participants said,
  became part of how they decided, and which a philanthropic foundation now
  funds as a program in its own right.
