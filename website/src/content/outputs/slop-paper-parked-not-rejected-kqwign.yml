title: Parked, Not Rejected
subtitle: >-
  How Employee Sustainability Suggestions Are Reframed and Held in a
  Manufacturer's Stage-Gate Idea Scheme
authors:
  - Solveig Adeyemi
  - Edda Nwafor
  - Lindiwe Achterberg
preset: paper
school: School of Continuous Improvement
date: 2026-11-16
publishedAt: 2026-11-16T17:01:47+11:00
doi: 10.5555/slop.kqwign
summary: >-
  A paper from the School of Continuous Improvement and the School of Emergent
  Priorities follows 412 sustainability-tagged employee suggestions through six
  years of one manufacturer's four-gate idea scheme, finding that 203 were held
  on hold for more than a year rather than declined, and that the ecological
  justification fell from 46% of submitted texts to 11% of those reviewed at the
  second gate, mostly through rewriting by sponsoring managers.
topic: >-
  parked not rejected: what happens to employee sustainability suggestions as
  they pass the gates of a manufacturer's idea-management scheme
