title: Returned, Not Discarded
subtitle: Blessed water and a dengue campaign's weekly emptying round at a pilgrimage shrine
authors:
  - Clemency Tredinnick
  - Vigdis Emenike
  - Odalys Penhallow
preset: research-poster
school: School of Settled Matters
