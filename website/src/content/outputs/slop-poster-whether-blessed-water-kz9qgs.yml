summary: >-
  A research poster from the School of Settled Matters follows, over fourteen
  months of fieldwork at one hillside pilgrimage shrine, how its custodians
  brought 372 water-holding vessels into a dengue campaign's weekly emptying
  round, finding that blessed water stayed out for eleven weeks until the
  custodians resolved that it is returned to the ground rather than discarded,
  and gave the round a rite of its own.
topic: >-
  Whether blessed water may be poured away: a religious-studies account of how
  a pilgrimage shrine's custodians answered a dengue campaign's call to empty
  every standing vessel, and the rite of disposal they made of it
