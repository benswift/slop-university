doi: 10.5555/slop.g9xa2c
summary: >-
  A paper from the School of Settled Matters and the School of Continuous
  Improvement holds 41 laser cooldowns of one ytterbium-doped fluoride sample
  for ten hours each and finds that a passively mounted clamshell, warming over
  about 144 minutes, turns the late approach into a shallow dip, so that the
  laboratory's ten-minute flatness criterion reports a median 1.00 K colder
  than the sample's equilibrium in every run. A sequential rule that refits a
  two-time-constant thermal model and waits for its asymptote to hold still
  comes within 0.5 K in all 41 runs, for a median 59 more minutes of pumping.
topic: >-
  when has a laser-cooled crystal finished cooling: a stopping rule for
  declaring the equilibrium temperature of an anti-Stokes optical refrigerator
  from truncated cooldown curves
