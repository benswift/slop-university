title: Declaring the End of a Cooldown
subtitle: A Shield Transient Biases the Flatness Criterion in an Anti-Stokes Optical Refrigerator
authors:
  - Odalys Penhallow
  - Bram Ntuli
preset: paper
school: School of Settled Matters
date: 2026-11-14
