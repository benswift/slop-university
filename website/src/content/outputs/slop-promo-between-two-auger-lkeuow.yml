summary: "A short profile of Dr Brynjar Obiora, Senior Research Fellow in the School
  of Underlying Conditions, told largely in his own words. A soil surveyor of twelve
  years' standing, Dr Obiora describes the question at the centre of his research:
  where one soil ends and the next begins when the ground changes by degrees, and
  who decides. The film also marks his seed grant to renew the survey's soil colour
  book, one page at a time, and a body of work that reaches well beyond the pit."
