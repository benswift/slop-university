title: Thirty-One Steps, Seventy-Four Gestures
subtitle: An Experimental Reconstruction of a Retired Haemolytic Plaque Assay and the Waste It Leaves
authors:
  - Brynjar Obiora
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
publishedAt: "2026-10-12T21:36:22+11:00"
doi: 10.5555/slop.eytlha
summary: >-
  A paper from the School of Underlying Conditions applies experimental
  archaeology to a retired laboratory procedure, working a deaccessioned
  plaque-assay bench kit twenty-four times with inert substitutes and resolving
  its thirty-one-step handwritten protocol into seventy-four gestures, twenty-nine
  of them unwritten. Plates a retired technician would accept rose sharply after
  her single visit for both operators, and the durable discard of a run, fourteen
  glass pipettes, is shown to lie whole and in one corner of a practised bench.
topic: >-
  An experimental-archaeology reconstruction of a superseded immunotoxicity
  bench assay from a surviving kit and its handwritten protocol, worked dry by
  novice and trained hands to record its gestures and the waste each run leaves
  behind
