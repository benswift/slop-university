doi: 10.5555/slop.r3jg95
summary: >-
  A paper from the School of Underlying Conditions digs six profile pits
  through one winter's bank of stranded kelp on an unnamed beach, describes
  each pit face as a soil profile, and assays the 24 horizon samples for
  soluble phlorotannin and extractable alginate. Four horizons recurred in
  every pit; phlorotannin fell 35-fold from the top horizon to the bottom, in
  steps at the horizon boundaries, while alginate yield persisted far deeper,
  and the horizon a sample came from described it better than its depth did.
topic: >-
  A soil surveyor digs profile pits through one winter's wrack bank on an
  unnamed beach and samples its horizons for phlorotannin and alginate, to ask
  how deep in the heap a stranded kelp's extractable compounds persist
