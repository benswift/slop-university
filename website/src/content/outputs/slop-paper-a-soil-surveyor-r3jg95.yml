title: Horizons in a Wrack Bank
subtitle: Phlorotannin and Alginate Down Six Profile Pits Through One Winter's Stranded Kelp
authors:
  - Brynjar Obiora
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
