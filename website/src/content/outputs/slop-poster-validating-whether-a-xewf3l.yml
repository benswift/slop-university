title: A Signal-Detection Audit of a Community-Theatre Verification Panel
subtitle: Pre-opening line-check verdicts against backstage earpiece-prompter logs across six show openings
authors:
  - Torun Ezeigwe
  - Renke Sabel
  - Dagny Okafor
