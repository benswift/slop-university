doi: 10.5555/slop.xewf3l
summary: >-
  A research poster from the School of Continuous Improvement compares a
  community theatre society's live pre-opening line-check verdicts against
  backstage earpiece-prompter usage logs across 214 checks and six show
  openings. Agreement between panel and log is only moderate (κ = 0.55), and
  lopsided: the panel clears a genuinely memorised performance with 93%
  specificity but catches an earpiece-prompted one at just 58% sensitivity,
  suggesting a fluent recital is doing most of the classifying.
topic: >-
  validating whether a community theatre society's pre-opening line-check
  panel can actually tell a memorised performance from an earpiece-prompted
  one
