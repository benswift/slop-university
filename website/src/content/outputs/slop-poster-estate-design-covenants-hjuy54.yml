title: Different From Its Neighbour
subtitle: >-
  Realised Façade Variety and the Five-Lot Anti-Repetition Covenant Across 2,148
  Dwellings in Nine Land Releases
authors:
  - Ingrid Vasseur
  - Kwame Lindqvist
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-01
publishedAt: "2026-08-01T10:04:33+10:00"
doi: 10.5555/slop.hjuy54
summary: >-
  A research poster from the School of Emergent Priorities classifies the front
  elevation of 2,148 completed dwellings across nine covenanted land releases in
  three growth corridors, matching every lot to the design-review file that
  approved it. The approved palettes list 26 to 41 façade schemes per release
  against an effective number built of 3.3 (range 2.6 to 5.1); the five-lot
  anti-repetition covenant is satisfied at 98.6 per cent of 9,204 eligible
  windows, against 95.9 per cent under 10,000 random re-orderings of each
  street's own built stock, while the panel records design-variation compliance
  at 99.5 per cent.
topic: >-
  estate design covenants that forbid two alike houses within five lots, tested
  against the variety a completed street actually shows, and a developer
  design-review panel whose compliance rate counts the rule rather than the
  streetscape
