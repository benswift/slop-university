title: Picked Fast, Swam Slow
subtitle: A Season of Lap-Timing Against a Self-Selected Lane Quadrant
authors:
  - Petra Umbile
  - Renke Sabel
  - Ronja Oyelaran
preset: research-poster
school: School of Emergent Priorities
