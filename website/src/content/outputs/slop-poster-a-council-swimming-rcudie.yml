doi: 10.5555/slop.rcudie
summary: >-
  A research poster from the School of Emergent Priorities fits three lanes
  of a council pool with infrared split timers and stroke-count sensors for
  a fourteen-week season, testing whether swimmers' self-selected lane
  quadrant (fast/slow crossed with continuous/stop-start, chosen at the
  turnstile board) matches the quadrant their measured pace and stroke
  pattern would place them in; self-selected and measured quadrant agree
  for only 35% of the pool's 214 swimmers (κ = 0.18), with disagreement
  concentrated in the fast/continuous self-selection.
topic: >-
  a council swimming pool lets swimmers self-select their lane at the
  turnstile from a posted two-by-two board (fast/slow crossed with
  continuous/stop-start), sorting entry traffic without a queue; a season
  of lap-timing logs the actual pace and stroke pattern of everyone who
  picks a lane, testing whether swimmers' self-selected quadrant matches
  the quadrant their swimming behaviour would place them in
