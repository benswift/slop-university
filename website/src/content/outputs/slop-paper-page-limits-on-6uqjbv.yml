title: Page Limits as Bid Caps
subtitle: Proposal length in research funding contests
authors:
  - Osei Vandermeer
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-10-13
publishedAt: 2026-10-13T01:00:54+11:00
doi: 10.5555/slop.6uqjbv
summary: >-
  A paper from the School of Continuous Improvement models the page limit on a
  research grant application as a rigid cap on bids in a two-applicant all-pay
  contest. A limit short enough to bind on both applicants makes both write
  exactly to it and reduces the award to a coin toss; within a band of such
  limits total pages written exceed the unlimited contest's; and every positive
  limit in that region is dominated by a free lottery, which itself outperforms
  the unlimited contest whenever the weaker project is worth more than a third
  of the stronger.
topic: >-
  Page limits on research grant applications, treated as bid caps in an all-pay
  contest: when a short limit saves applicant effort, and when it only turns the
  scheme into a lottery with a ticket price
