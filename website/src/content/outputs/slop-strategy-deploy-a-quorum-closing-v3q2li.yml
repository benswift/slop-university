doi: 10.5555/slop.v3q2li
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to
  building a quorum-closing coordination service that seals and reopens
  RSVP polls across every University-affiliated group chat, publishing a
  member's coordination reliability record and withdrawing room-booking
  and event-hosting priority when that record falls short.
topic: >-
  Deploy a quorum-closing bot across every University-affiliated group chat
  that seals an RSVP poll the instant attendance clears its threshold, and
  reopens it automatically the moment a confirmed attendee withdraws
