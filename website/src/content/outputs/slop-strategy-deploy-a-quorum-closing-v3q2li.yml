title: Confirmed Until It Isn't
subtitle: >-
  The 2026-2031 Strategic Plan Builds a Quorum-Closing Bot for Every
  University Group Chat, and Ties Room Bookings to the Reliability Record
  It Keeps
authors:
  - Hedvig Anyanwu
  - Runa Adegoke
preset: strategy
school: School of Emergent Priorities
date: 2026-09-17
