title: Should a Swap Board Decide the Holiday Roster?
authors:
  - Hedvig Anyanwu
  - Ronja Oyelaran
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
date: 2026-09-18
publishedAt: "2026-09-18T04:01:12+10:00"
doi: 10.5555/slop.w0qtnq
summary: >-
  A paper from the School of Emergent Priorities codes 22 weeks of a
  franchise chain's handwritten shift-swap corkboards across 34 outlets
  against a five-rung Swap Reciprocity Maturity Model, finding that reaching
  the Model's top rung --- the store's eligibility floor for first pick of
  the public-holiday roster --- tracks a staff member's tenure far more
  reliably than an independently tallied count of favours actually returned.
topic: >-
  A staff break-room's handwritten shift-swap corkboard is scored weekly
  against a named-level Swap Reciprocity Maturity Model, and reaching the
  model's Level 3 rung becomes the store's eligibility floor for first pick
  of the public-holiday roster.
