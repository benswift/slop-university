summary: >-
  A marketing poster from the School of Emergent Priorities carries the Master
  of Priority Studies onto the University's portrait signage rotation,
  presenting the dispatch order of a remote hybrid power station (sun, then
  wind, then storage, then a generator held in reserve) as a sequence a
  prospective student will learn to set, and pointing readers to three of the
  University's published studies of energy.
