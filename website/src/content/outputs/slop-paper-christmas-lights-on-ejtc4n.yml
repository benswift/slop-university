title: Groundwork for a Take-Down Date
subtitle: A Household Survey of Christmas Lights Left on the Gutter
authors:
  - Iben Chikere
  - Marek Solheim
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-10-04
publishedAt: "2026-10-04T04:01:55+11:00"
doi: 10.5555/slop.ejtc4n
summary: >-
  A paper from the School of Emergent Priorities surveys 438 households on 24
  suburban streets about when their gutter lights came down after twelfth night,
  finding a bimodal distribution with a median in week 6 and 13.3% still up in
  week 38, unmoved by the height of the dwelling. The University has fixed its
  own Take-Down Date at week 19 with no exemption, set a Bulb-Out Tolerance of
  31% dark, and kept one Standing Strand lit on every building through the year.
topic: >-
  Christmas lights on the gutter, surveyed across suburban households as
  distributions of weeks left up past twelfth night, strands still lit and
  visitors who have commented, and the take-down date the University binds
  itself to for its own seasonal decorations
