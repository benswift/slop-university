title: A Birth-Date Cutoff Predicts Representative Selection Better Than a Season of Play
authors:
  - Osei Vandermeer
  - Ingeborg Nwachukwu
  - Dagny Okafor
preset: paper
school: School of Continuous Improvement
date: 2026-09-15
publishedAt: "2026-09-15T04:04:55+10:00"
doi: 10.5555/slop.f66jy8
summary: >-
  A regression-discontinuity study finds that a suburban football
  association's 1 January grading cutoff produces an 18.6-percentage-point
  jump in representative-squad selection, robust to bandwidth choice and
  three placebo cutoffs. It reports the quarterly, appeal-free capability
  index the association's Grading Panel has adopted in response, and the
  index's qualifying score across its first five resets.
topic: >-
  a regression-discontinuity study of a suburban junior Australian-rules
  football club's 1 January birth-date grading cutoff, finding it predicts
  representative-squad selection far better than a season of matches does,
  and the Age-Adjusted Capability Index Slop University now recommends the
  club adopt for mandatory quarterly re-grading with no appeal
