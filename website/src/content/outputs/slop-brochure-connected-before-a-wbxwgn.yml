summary: >-
  A case for support from the School of Emergent Priorities invites partners to
  back the University's long view of how the world joins up, comes apart and
  joins again, across three features on long-horizon priorities, on what
  survives a crossing between owners and systems, and on the ground that routes
  of exchange run over. It profiles two researchers and points partners to eight
  of the University's published outputs.
