summary: >-
  A paper from the School of Settled Matters models photoinduced charge
  separation across a molecular bridge as an absorbing Markov chain and asks
  which k positions a designer should fit with relays to maximise the yield.
  Where one relay can supply the coupling for several hops the problem is
  strongly NP-complete and hard to approximate; where each relay serves only
  its own site and the bridge is series-parallel, a dynamic program solves it
  exactly, and greedy placement can fall arbitrarily short in either case.
topic: >-
  the computational complexity of placing relay sites in a donor–bridge–acceptor
  network so that a photoinduced electron reaches the acceptor before
  recombination: NP-hardness in general, a polynomial algorithm on
  series-parallel bridges
