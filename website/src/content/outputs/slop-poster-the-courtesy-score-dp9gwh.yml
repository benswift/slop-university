summary: >-
  A research poster traces one apartment block's shared-laundry Courtesy
  Score across two AGM cycles, finding its citations in subcommittee
  nomination statements shift from the flag's original noise-and-lateness
  criteria toward a general character reference, most sharply in
  subcommittees carrying no stated competence requirement.
topic: >-
  The Courtesy Score, logged by an apartment block's shared-laundry booking
  app to flag noisy or late collectors, becomes the character reference
  neighbours cite when nominating each other to the body corporate's
  unrelated subcommittees. A single block's two AGM cycles are read as a
  case-method teaching note on what an app rating gets trusted to prove once
  nobody remembers what it was built to measure.
