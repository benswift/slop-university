title: Ahead of the Alarm
subtitle: Which Alarm Classes Prompt Operator Action in a Multipurpose Batch Plant, and Which Only Confirm It
authors:
  - Ylva Ogunbanjo
  - Casimir Beng
  - Runa Adegoke
preset: research-poster
school: School of Emergent Priorities
