doi: 10.5555/slop.w6a98k
summary: >-
  A research poster from the School of Emergent Priorities aligns fourteen
  months of alarm and operator-action logs from a multipurpose batch chemical
  plant, matching 3,914 of 5,121 alarm episodes across five classes to the
  operator's first corrective move. On charging-phase jacket-temperature alarms
  71% of those moves came before the alarm sounded, while agitator, condenser
  and scrubber alarms were answered after onset.
topic: >-
  Operators often move before the alarm sounds: aligning fourteen months of
  alarm and operator-action logs from a multipurpose batch plant to ask which
  alarm classes prompt corrective action and which only confirm what the
  operator already did
