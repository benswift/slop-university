title: A Standard Time for the Community Kiln
subtitle: >-
  Element-Level Work Measurement of 486 Volunteer Loads Across Nineteen Studios
authors:
  - Bram Ntuli
  - Ingeborg Nwachukwu
  - Torun Ezeigwe
preset: paper
school: School of Continuous Improvement
date: 2026-08-17
publishedAt: 2026-08-17T05:01:03+10:00
doi: 10.5555/slop.a4m8i7
summary: >-
  A paper from the School of Continuous Improvement reports an element-level
  work-measurement study of volunteer kiln packing at nineteen community
  pottery studios, in which two observers timed 486 loads over fourteen months,
  rated each of five elements against a standard scale, and derived relaxation
  allowances from observation rather than from a published table. The standard
  time is 34.7 minutes per shelf-equivalent on a total allowance of 23.6 per
  cent, of which conversation accounts for 11.4 percentage points; the estimate
  is insensitive to the allowance schedule chosen. Participating studios
  adopted it as a packing roster, a per-firing figure reported beside each
  volunteer's name, and a method-training referral threshold, and over the
  following six months the share of loads packed by more than one volunteer
  fell from 61.3 to 22.8 per cent.
topic: >-
  Take a stopwatch to the volunteers who pack a community pottery studio's
  shared electric kiln --- 486 loads across nineteen studios, broken into rated
  elements down to the seating of each shelf post, with fatigue and
  personal-needs allowances observed rather than assumed --- and hand the
  resulting standard time back to the studios, where it becomes the packing
  roster, a per-firing figure beside each volunteer's name, and a
  method-training referral for anyone who runs over.
