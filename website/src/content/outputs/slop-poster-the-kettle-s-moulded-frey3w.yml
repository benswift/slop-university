title: One Cup or the Lot
subtitle: A Household Survey of Kettle Fill Levels Against the Moulded MIN and MAX Marks, and the Standard Fills the University Draws From Them
authors:
  - Torun Ezeigwe
  - Solveig Adeyemi
  - Marit Osayande
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-22
publishedAt: "2026-09-22T05:02:12+10:00"
doi: 10.5555/slop.frey3w
summary: >-
  A research poster from the School of Continuous Improvement surveys 412
  households across 1,236 boils and reports the water level at each switch-on
  as a distribution, finding two heaps, one beneath the moulded MIN mark and one
  against MAX, and few boils between them. The School adopts the heaps as
  Standard Fills for the University's staff-kitchenette kettles.
topic: >-
  The kettle's moulded MIN and MAX lines, read across a survey of households as
  the distribution of water levels at which each kettle is actually switched on,
  become the fill every household boils, and the University re-marks its own
  kettles at the modal level
