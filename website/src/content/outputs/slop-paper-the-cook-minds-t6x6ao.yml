title: The Cook Minds the Mud
subtitle: Kitchen Words and the Lowest Job on a Survey Boring Crew, 1921–1968
authors:
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
publishedAt: "2026-10-12T20:00:45+11:00"
doi: 10.5555/slop.t6x6ao
summary: >-
  A paper from the School of Underlying Conditions reads 212 field journals,
  the wage sheets and forty-one recorded interviews from one geological
  survey's boring branch to follow the job of minding the drilling mud between
  1921 and 1968. The newest hand on each crew kept both the mud pit and the
  camp kitchen and graded the mud in kitchen words, from tea to porridge; the
  paper traces how the job rose to second on the wage sheet while the work at
  the pit barely changed, and how its vocabulary divided once someone else was
  hired to cook.
topic: >-
  the cook minds the mud: a social history of who tended the drilling fluid on
  a geological survey's boring crews, the kitchen words they had for how it
  ran, and how the lowest job on the rig became the best paid
