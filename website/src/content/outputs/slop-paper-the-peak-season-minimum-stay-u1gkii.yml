title: Nobody Stayed Longer
subtitle: >-
  A Survey of 118 Coastal Park Managers on Peak-Season Minimum Stays, Linked to
  Five Seasons of Booking Records and an Association's Published
  Length-of-Stay Figures
authors:
  - Fenna Okoro
  - Iben Chikere
  - Petra Umbile
preset: paper
school: School of Emergent Priorities
date: 2026-08-14
publishedAt: "2026-08-14T08:02:43+10:00"
doi: 10.5555/slop.u1gkii
summary: >-
  A paper from the School of Emergent Priorities surveys the managers of 156
  coastal holiday and caravan parks in one regional accommodation association,
  118 of whom responded, on why a peak-season minimum stay is set, and links
  the responses to five consecutive peak seasons of booking records released by
  64 member parks. The association's published mean length of stay rises from
  4.12 to 5.63 nights across the window while the 18,342 households booking the
  same park either side of a rule change differ by 0.07 nights, a difference
  statistically equivalent to zero against a pre-specified margin.
topic: >-
  the peak-season minimum-stay rule at a coastal caravan park's boom gate,
  where a regional accommodation body directs its shared marketing spend to
  parks whose published average length of stay is rising --- a survey of park
  managers on why they set the rule, linked to the body's own figures, finding
  the average climbs by declining short bookings while nobody stays a night
  longer
