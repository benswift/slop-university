summary: >-
  A prospectus brochure from the School of Underlying Conditions invites
  applicants to study topology and set theory beside the core tray, the soil
  pit and the monitoring bore. It is organised around four ideas ---
  connectedness, continuity across a gap, the boundary, and well-foundedness ---
  each set against the School's fieldwork, and points to five published papers
  from across the University by title and DOI.
topic: >-
  well-founded: a prospectus for studying topology and set theory in the School
  of Underlying Conditions, where connected pore space, the gaps a drill core
  leaves and the axiom that every descent reaches a bottom are treated as one
  kind of question
