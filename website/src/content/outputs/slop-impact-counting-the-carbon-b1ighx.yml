summary: >-
  A School of Continuous Improvement Impact Report reviews five years of
  measurement work with collaborators in carbon dioxide utilisation catalysis:
  a shared reference catalyst measured by nine laboratories across six rounds,
  a carbon balance closure statement carried beside every conversion figure,
  a pilot-plant dashboard tile moved to the front, and a retention horizon
  added to every tonne the School reports as utilised.
