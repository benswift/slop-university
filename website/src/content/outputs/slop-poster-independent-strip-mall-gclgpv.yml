title: Held, Not Owed
subtitle: A Single Audited Hold-Duration Policy for the Strip Mall's Under-the-Counter Trust
authors:
  - Iben Chikere
  - Solveig Adeyemi
  - Lindiwe Achterberg
preset: research-poster
school: School of Emergent Priorities
