doi: 10.5555/slop.gclgpv
summary: >-
  A qualitative interview study of thirty-one strip-mall shopkeepers' own
  criteria for holding an item behind the counter, whose findings the
  University adopts as a single fixed 48-hour hold-duration policy audited
  across four monitored strip malls.
topic: >-
  Independent strip-mall shopkeepers, interviewed in their own words, on how
  they personally judge which regular customers earn a held item behind the
  counter and for how long -- then Slop University establishes a single
  fixed hold-duration policy, audited shopfront by shopfront, that replaces
  every trader's own judgement.
