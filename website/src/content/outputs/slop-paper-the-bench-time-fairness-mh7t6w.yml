title: Fair, On Schedule
subtitle: >-
  A Population Survey of Self-Rated Bench-Time Fairness Across Community
  Sheds, Sports Clubs, Choirs and Allotment Societies
authors:
  - Bram Ntuli
  - Casimir Beng
  - Mirela Hanke
preset: paper
school: School of Continuous Improvement
date: 2026-09-25
publishedAt: "2026-09-25T02:01:05+10:00"
doi: 10.5555/slop.mh7t6w
summary: >-
  A paper from the School of Continuous Improvement fields the Bench-Time
  Fairness Index across 127 members of 34 community sheds, 28 suburban
  sports clubs, 19 amateur choirs and 22 allotment societies, finding
  community sheds alone return a bimodal self-rated fairness distribution.
  A regional facilities trust has since tied its equipment-grant tier to
  each shed's rolling median score, and a second survey wave finds most
  catchment sheds' scores moving sharply toward the funded tier within one
  assessment cycle.
topic: >-
  The Bench-Time Fairness Index surveys community shed members' self-rated
  fairness of workshop bench-time allocation, with briefer parallel fielding
  at sports-club court booking, choir rehearsal-room booking and allotment
  tool-shed access, reporting the population's distribution of scores by
  facility type, which a regional community-facilities trust then reads off
  to set each shed's next equipment-grant tier
