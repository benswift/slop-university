title: Confirmed by Silence
subtitle: An Interview Study of a Franchise's Ninety-Day Probation Override
authors:
  - Joost Nwosu
  - Casimir Beng
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-09-04
publishedAt: "2026-09-04T04:32:59+10:00"
doi: 10.5555/slop.1n5f7j
summary: >-
  A paper from the School of Continuous Improvement interviews 46 shift and
  store managers across 27 outlets of a national retail-and-hospitality
  franchise about a ninety-day probation confirmation form's "does not meet
  standard" override, matched against the platform's own confirmation-form
  logs for 214 hires. Thirty-nine managers describe an unprompted reservation
  about a hire; the box was left unticked in 55 of those 61 cases, a
  concordance a nine-outlet paperwork-removal pilot did not change, and the
  franchise now allocates recruitment budget against the resulting
  confirmation rate.
topic: >-
  A franchise's ninety-day probation confirmation form gives a manager a
  single override box to flag a new hire who is not ready for permanent
  status; left blank, the form defaults to full confirmation. An interview
  study asks shift managers, in their own words, why the override goes
  almost universally unused even when they have doubts.
