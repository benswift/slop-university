title: Someone Wrote a Number Down
subtitle: >-
  Criterion Validity of Emergency-Contact Field Completion as a Measure of
  Contactability Across 186 Community Sport Clubs
authors:
  - Torun Ezeigwe
  - Dagny Okafor
  - Lindiwe Achterberg
preset: paper
school: School of Continuous Improvement
date: 2026-08-16
publishedAt: 2026-08-16T14:02:34+10:00
doi: 10.5555/slop.munqx5
summary: >-
  A paper from the School of Continuous Improvement assesses whether the
  emergency-contact field on a junior sport registration measures anything about
  contactability, using three seasons of records across 186 affiliated clubs
  (38,417 registrations) and the state association's own annual verification
  round. Completion reached 96.8% of registrations while 23.7% of 2,412 verified
  fields resolved to a reachable adult who confirmed the nomination, the largest
  single outcome being a duplicate of the lodging adult's own number. Agreement
  between indicator and criterion was negligible (Cohen's kappa = 0.01), and the
  41 clubs operating a mandatory-field rule reported complete fields with
  contactability unchanged.
topic: >-
  the emergency-contact line on a junior sports club sign-on form --- a name and
  a mobile written once in biro at a trestle table and never touched again ---
  where a state association reports member-safety readiness as the share of
  registrations with the field filled in
