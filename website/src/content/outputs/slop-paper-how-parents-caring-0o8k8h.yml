doi: 10.5555/slop.0o8k8h
summary: >-
  A paper from the School of Emergent Priorities interviews twelve parents from
  ten families whose child's overnight respite house stopped offering stays
  without ever announcing a closure, and develops four themes through
  interpretative phenomenological analysis: keeping the bag packed, reading the
  silence, a loss with no date, and making the ending themselves. It reads the
  accounts as ambiguous loss, and finds that the work of ending the service fell
  to the families.
topic: >-
  how parents caring for a disabled child make sense of a respite service that
  lapsed without ever being formally closed, an interpretative phenomenological
  analysis
