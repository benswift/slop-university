summary: >-
  A research poster from the School of Emergent Priorities restages the
  lobby-noticeboard hardening taxonomy on booking-app owner-responses. Ruling-coded
  replies attract a second review within 14 days at 1.41 times the Apology rate,
  the original 2.1-times closure advantage does not reproduce, and Horizon
  Register standing instruction 2026/51 now permits only a pre-registered Apology
  template on University-affiliated listings, holding a Ruling-coded reply from
  Trusted Local for one review cycle with no ordinary override.
topic: >-
