summary: >-
  A marketing poster follows Dr Joost Nwosu's attempt to replicate a
  farmers-market card reader's round-robin turn-fairness protocol at a
  suburban bus stop's single bench seat, finding no comparable effect once
  irregular bus arrivals and passengers' own queue habits set the pace; the
  shelter's laminated turn-order card remains the stop's official seating
  protocol regardless.
topic: >-
  does the round-robin turn-fairness protocol that held a farmers-market card
  reader's device-time equal also hold the single bench seat at a suburban
  bus stop
