title: Grounded, Not Idle
subtitle: Ultrafine Particles Downwind of an Inland Regional Airport through a 2020 Lockdown, and the Engine Ground Runs That Continued
authors:
  - Anselm Threlkeld
  - Brynjar Obiora
preset: paper
school: School of Settled Matters
date: 2026-11-15
