doi: 10.5555/slop.ivzmzg
summary: >-
  A paper from the School of Settled Matters and the School of Underlying
  Conditions normalises ten weeks of particle number, black carbon and NO2
  records for weather at an inland regional airport whose scheduled flights
  were suspended in a 2020 lockdown, and reads them against the airport's
  movement log and an airline's maintenance log. Particle number downwind of
  the airfield fell 60%, against 33% at a kerbside site in the town, but 236
  engine ground runs on the nine parked turboprops carried 23% of the
  airport-sector particle number in 5.6% of its hours; accounting for them
  raises aviation's estimated pre-pandemic share from 45% to 71%.
topic: >-
  when the runway closed: ultrafine particle number counts downwind of an
  inland regional airport whose scheduled flights were grounded by a COVID-19
  lockdown, used to separate aviation's share from the road traffic that also
  fell
