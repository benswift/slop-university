title: Two Soils, One Kiln
subtitle: Partitioning Bitter-Acid and Xanthohumol Variation in the Cones of a Hop Garden That Crosses a Mapped Soil Boundary
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-29
publishedAt: "2026-10-29T13:02:15+11:00"
doi: 10.5555/slop.6uy8gt
summary: >-
  A paper from the School of Underlying Conditions follows the cones of 96
  hills across a mapped soil boundary in one hop garden through picking and
  kilning, using two blocks picked in opposite directions to separate the soil
  from the picking order. Adjusted for picking day, the terrace loam carries
  slightly more α-acid, worth about 1.3 days of picking, while β-acids follow
  the calendar alone and xanthohumol shows no trace of the soil, falling with
  the kiln's air-on temperature and in the lower layer of the bed.
topic: >-
  two soils under one hop garden: whether a mapped soil boundary across the
  yard shows in the xanthohumol and alpha-acid content of its cones as a herbal
  starting material, once picking order and kiln load are accounted for
