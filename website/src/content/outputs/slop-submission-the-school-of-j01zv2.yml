title: Untreated by What the Trial Studies
subtitle: >-
  A submission from the School of Settled Matters to the Department of Policy
  Settings' consultation on Untreated Controls on the Research Farm
authors:
  - Clemency Tredinnick
  - Anselm Threlkeld
preset: submission
school: School of Settled Matters
date: 2026-11-24
publishedAt: "2026-11-24T18:30:49+11:00"
doi: 10.5555/slop.j01zv2
summary: >-
  The School of Settled Matters answers six of the nine questions and prefers
  Option 1, amended so that a school declaring a pest trial states what its
  control plot is untreated by and section 14(2) excludes the plot from that
  class of treatment alone, and so that the Register records each control
  plot's prior untreated seasons and its neighbours and passes the record with
  the ground. It reads the word as its members read the mill-annealed control
  in their titanium heat-treatment work, and asks that laboratories stay
  outside the review.
topic: >-
  the School of Settled Matters reads untreated in the research farm's
  control-plot rule as its titanium metallurgists read a mill-annealed bar:
  untreated only against the treatment under study, and carrying a history the
  Register should record
