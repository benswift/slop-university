title: Room on Paper
subtitle: A Plot-by-Plot Ground Audit of Remaining Interment Capacity at Four Council
  Cemeteries, and the Acquisition Trigger It Re-Dates
authors:
  - Ingrid Vasseur
  - Lindiwe Achterberg
  - Anouk Mensah
preset: research-poster
school: School of Emergent Priorities
