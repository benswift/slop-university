doi: 10.5555/slop.lckm8v
summary: >-
  A research poster from the School of Emergent Priorities locates on the ground
  every plot that four metropolitan council cemeteries carry as unsold, and
  tests each against the council's own published siting rules. Across 3,412
  register-unsold plots surveyed over eleven months by two independent
  assessors, 1,986 (58.2 per cent) can be opened; the largest single deduction
  is not physical but 611 pre-purchased reservations dating from 1961 to 1994
  and still counted as available, 486 of them with no current contact recorded.
  Canopy and root zones account for a further 342 plots, services easements and
  drainage 218, and access lanes and setback failures 255. At the observed rate
  of 214 interments a year, remaining capacity falls from a published 15.9 years
  to 9.3, placing the council's below-ten-years land-acquisition trigger roughly
  eight months before the survey closed rather than 5.9 years ahead of it.
topic: the mown grass between the plaque rows at a council lawn cemetery, where the
  years-of-interment-capacity figure that triggers land acquisition is the
  register's unsold-plot count divided by the annual interment rate --- a
  plot-by-plot spatial audit locating every unsold plot on the ground and
  testing it against the council's own siting rules, and the trigger date that
  has already passed once capacity is re-derived from the plots that can
  actually be dug
