title: The Metrics Lab Reran The Index. Nothing Replicated.
subtitle: >-
  A featured-researcher marketing poster for the School of Continuous
  Improvement, built around Dr Mirela Hanke's failed replication of the
  Swipe Regularity Index on an allotment society's plot sign-in sheet,
  developed for bus-stop panels and campus digital signage in a landscape
  rotation.
