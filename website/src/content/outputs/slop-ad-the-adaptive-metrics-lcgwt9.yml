summary: >-
  A marketing poster for the School of Continuous Improvement features Dr
  Mirela Hanke, Postdoctoral Fellow and Deputy Convenor of the Living
  Dashboard, and her attempt to repeat the Swipe Regularity Index --- built
  to forecast hot-desk tidiness-sweep failures --- unchanged on an
  allotment society's plot sign-in sheet, where it forecasts nothing.
topic: >-
