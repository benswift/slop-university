title: Countersigning Assisted Decisions
subtitle: >-
  A Department of Policy Settings consultation paper on whether the University
  should keep requiring a named officer's signature on every assisted decision
  about a researcher
authors: []
preset: consultation-paper
date: 2026-11-22
publishedAt: "2026-11-22T00:01:46+11:00"
doi: 10.5555/slop.k7jpwu
summary: >-
  A consultation paper from the Department of Policy Settings invites
  submissions on the Slop University (Assisted Decisions) Determination 2026,
  under which every decision about a researcher made with a recommendation from
  an automated tool must be countersigned by a named officer before it takes
  effect. Drawing on the Register of Countersignatures and four of the
  University's outputs, it weighs retaining the requirement against a schedule
  of consequential decisions whose countersignatures would record the material
  considered, and records a preliminary view, conditional on consultation,
  that the schedule warrants further development.
topic: >-
  review of the setting that a named officer countersign every decision about a
  researcher made with the help of an automated tool, and whether
  countersignature still does what it was made to do
