summary: >-
  A research-showcase brochure built around the University's own habit of
  re-testing its findings: a self-checkout study found no link between a
  shopper's stated trust and their override behaviour, and this campaign
  follows the same question onto a franchise's shift-cover app, where a
  worker's confidence rating turns out to predict something after all. It
  sets the Trajectory Analytics Group and the Adaptive Metrics Lab beside
  eight published studies of instruments that did, and didn't, travel.
topic: >-
  Does a finding that held at the self-checkout still hold at the shift
  roster? A franchise's cover-request app calls in backup only when a
  worker's own confidence rating clears a threshold, and Slop University
  sends its checkout-trust researchers back into the field to test whether
  the relationship they didn't find the first time turns up this time --- a
  campaign for a university that checks its own working.
