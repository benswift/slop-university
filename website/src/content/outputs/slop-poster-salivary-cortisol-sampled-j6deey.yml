doi: 10.5555/slop.j6deey
summary: >-
  A research poster from the School of Continuous Improvement samples salivary
  cortisol every half hour across one regional brass band contest day from 141
  players in six amateur bands, and finds that in every band the day's highest
  median came thirty minutes after the morning's public draw for playing order,
  not after the band's own performance, with Band A, drawn first, posting the
  highest morning response of all.
topic: >-
  Salivary cortisol sampled across one brass band contest day in six amateur
  bands, finding players' peak tracked the public draw for playing order rather
  than their own time on stage
