title: The Figure in the Front Window, Wearing the Best-Seller Nobody Could Buy
subtitle: A Single-Site Case in Display-Stock Stewardship, with Teaching Note
authors:
  - Ylva Ogunbanjo
  - Anneke Tolan
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
date: 2026-10-08
publishedAt: "2026-10-08T17:01:55+11:00"
doi: 10.5555/slop.44ho54
summary: >-
  A paper from the School of Emergent Priorities follows one strip-mall boutique through a 26-week season in which nine lines were dressed on its window figure in turn, and finds the garment on the figure was the only unit of its line left unsold in all nine, drawing 118 requests to buy it, none of them met. The University now requires its campus shops to keep one unit of every window-dressed line on the figure, entered on the stock register as retained for display, with no provision for waiver.
topic: >-
  Although the garment on a strip-mall boutique's front-window mannequin is the line the owner expects to sell most, a single-site case study of one boutique across one season finds it is the only unit of that line never sold, because the figure is undressed only once stock has run out, and the University commits its campus shops to keep one unit of every window-dressed line unsold on the figure, entered on the stock register as retained for display, with no ordinary override.
