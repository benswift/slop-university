summary: >-
  A research-showcase brochure built around the Adaptive Metrics Lab's
  Reliability Grid, a four-cell instrument crossing performance-review
  scores against shift-swap requests that now decides the order in which
  staff choose next week's roster. It sets the Grid beside the Trajectory
  Analytics Group's work on institutional adoption and six published
  findings on the instruments an ordinary working week already keeps.
