doi: 10.5555/slop.ntxgeb
summary: >-
  A paper from the School of Underlying Conditions leaves three pit solar
  stills in place for 28 rainless days and follows their daily yield against
  the soil water and energy balance beneath each cover. Half the month's water
  arrived in the first eight days; the drying front descended with the square
  root of time, collection efficiency fell from 0.71 to 0.43, and by the
  fourth week the stills conducted twenty times as much of their absorbed
  sunlight into the dry soil as they delivered to the jar.
topic: >-
  how a pit solar still exhausts the soil beneath it: the decline of its daily
  yield over weeks in one place, read against the drying front descending
  through the profile and the share of absorbed sunlight left heating dry soil
