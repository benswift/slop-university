title: Twenty-Eight Days in One Pit
subtitle: Yield Decline, Drying-Front Descent and Energy Partition in a Stationary Soil Solar Still
authors:
  - Brynjar Obiora
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-31
