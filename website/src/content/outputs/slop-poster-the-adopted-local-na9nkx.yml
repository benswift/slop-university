title: The Name Stays with the Counter
subtitle: >-
  Inherited Adopted Names among Chinese Shopkeepers in a West African Market
  Town
authors:
  - Halvard Nnamani
  - Gunnhild Ekwueme
  - Verity Marris
preset: research-poster
school: School of Emergent Priorities
