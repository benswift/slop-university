doi: 10.5555/slop.na9nkx
summary: >-
  A research poster from the School of Emergent Priorities follows the local
  first names customers give the Chinese proprietors of 63 general-goods shops
  in a West African market town through 41 changes of ownership, finding that
  29 of the names passed to the next proprietor with the shop and that 47 of
  the 63 current names were first used by a customer or an assistant rather
  than chosen by the shopkeeper.
topic: >-
  the adopted local first names Chinese shopkeepers in a West African market
  town are given, and how those names pass with the shop to its next proprietor
