title: The Pole-Stop Roll Call as Punctuality Device
subtitle: A Fortnightly Crossover Trial Across 28 Walking School Bus Routes
authors:
  - Marit Osayande
  - Thandiwe Solberg
  - Edda Nwafor
preset: paper
school: School of Continuous Improvement
date: 2026-10-05
publishedAt: "2026-10-05T05:01:55+11:00"
doi: 10.5555/slop.mqg1vf
summary: >-
  A paper from the School of Continuous Improvement alternates called and silent
  fortnights across 28 walking school bus routes and 1,646 route-mornings, and
  finds that groups reach the school gate at the same minute either way (a
  difference of -0.18 minutes, 95% CI -0.61 to 0.25), whether the roll is read
  by the coordinator or a child monitor. The University has resolved that every
  intercampus shuttle driver read the full roll of registered riders aloud at
  each stop, with a stop entered as closed only when the last name is called.
topic: >-
  The volunteer coordinator of a walking school bus asked whether calling the
  roll at each pole stop changes when the children reach the school gate; across
  28 routes alternated by fortnight, roll-call and silent mornings arrived at the
  same minute, reported as a null, and the University, reasoning that a roll
  costing no punctuality costs nothing, binds its campus shuttle drivers to read
  a full roll aloud at every stop
