doi: 10.5555/slop.81m4k2
summary: >-
  A School of Continuous Improvement Impact Report looks back over 31
  Capability Sprint cohorts in which herbal-medicine exporters, customs brokers
  and border officers drafted a shared description sheet for dried root
  consignments, with tariff-heading agreement on sampled consignments rising
  from 47 to 91 per cent. It also reports that pre-lodgement consultations
  between brokers and the agency fell almost as fast as classification
  disputes, and that the cooperation indicator the School built with a
  regulatory commission now reports both lines together.
topic: >-
  a root by any other heading: five years of the School of Continuous
  Improvement's Capability Sprints for herbal-medicine exporters and customs
  brokers, and what a shared tariff-classification vocabulary did to
  cross-border trade cooperation
