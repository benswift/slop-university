title: Ten Metres to the Cold Room
subtitle: Holding Out-of-Grade Carrots for Food-Rescue Collection at a Regional Packhouse
authors:
  - Bram Ntuli
  - Osei Vandermeer
preset: paper
school: School of Continuous Improvement
date: 2026-11-08
publishedAt: "2026-11-08T10:32:18+11:00"
doi: 10.5555/slop.m11vkw
summary: >-
  A paper from the School of Continuous Improvement crosses the holding place of
  178 bulk bins of out-of-grade carrots at one regional packhouse, the loading
  yard or the cold room, with a food-rescue charity's weekly or twice-weekly
  collection over a twelve-week trial. Cold-room bins collected once a week
  yielded 92.2 per cent accepted mass against 58.5 per cent from the yard, a
  second weekly run lifted yard bins only to 82.8 per cent, and cumulative
  degree-hours above 0 °C alone explained acceptance better than the four arms.
topic: >-
  Out-of-grade carrots held for food-rescue collection at one regional
  packhouse: where the reject bin stands matters more than how often the charity
  calls
