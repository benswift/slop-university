summary: >-
  A research poster from the School of Continuous Improvement crosses message
  urgency against civility in six streets' group chats, finding the
  sharpest-worded urgent messages emptied out once a standing auto-mute took
  hold, while committee-logged resolution times held flat across the trial.
topic: >-
  sorting street group-chat messages into an urgency-versus-civility quadrant,
  muting the low-civility high-urgency cell for a fixed review cycle
