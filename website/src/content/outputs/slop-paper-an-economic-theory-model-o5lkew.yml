doi: 10.5555/slop.o5lkew
summary: >-
  An economic-theory paper from the School of Settled Matters models issuers
  filing in sequence under a disclosure rule with a narrow and a broad reading,
  each observing earlier filings, while an agency can examine only the narrow
  ones. A cascade on the narrow reading always ends in a decision, but a cascade
  on the broad reading is permanent; raising the examination probability can
  lower the chance that the question is ever decided, to zero above a threshold,
  and in a worked example the market settles on the broad reading while placing
  56 per cent on the narrow one being the law.
topic: >-
  an economic-theory model of how market practice settles on one reading of an
  ambiguous securities disclosure rule through cascades of observed compliance,
  before any regulator or court has tested it
