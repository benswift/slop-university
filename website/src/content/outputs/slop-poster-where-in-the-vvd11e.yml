doi: 10.5555/slop.vvd11e
summary: >-
  A research poster from the School of Underlying Conditions carbonises one
  coal blend twelve times in a pilot slot oven, lays each pushed charge out in
  order, and tests coke strength after reaction at fifteen positions along the
  length and height of the charge. Mean strength differs by 9.6 points between
  the mid-height centre and the roof row at the pusher end, against a standard
  deviation of 1.4 points between pushes.
topic: >-
  Where in the oven the coke was made: mapping coke strength after reaction by
  position along the length and height of a slot-oven charge, over twelve
  pushes of a pilot coke oven
