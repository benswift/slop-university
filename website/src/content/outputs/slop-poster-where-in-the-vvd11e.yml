title: Where in the Oven the Coke Was Made
subtitle: Positional variation in coke strength after reaction across twelve pilot-oven pushes
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
  - Vigdis Emenike
preset: research-poster
school: School of Underlying Conditions
