title: “Is This Like the Flashcards One?”
subtitle: Tutors' Rulings on an AI Clause and the Making of a Settled Question
authors:
  - Odalys Penhallow
preset: paper
school: School of Settled Matters
date: 2026-11-15
publishedAt: "2026-11-15T17:30:51+11:00"
doi: 10.5555/slop.csborv
summary: >-
  An ethnography from the School of Settled Matters follows the fourteen
  sessional tutors of a first-year reading and writing programme through one
  teaching year, as their answers to students' questions about a one-sentence
  generative AI clause were copied into a shared spreadsheet, named and cited as
  precedent. It finds that a question counted as settled when tutors stopped
  forwarding it to the convenor, that settlement came slowest where the line ran
  through a student's own effort, and that changes in the tools reopened
  questions the clause itself never had.
topic: >-
  an ethnography of the tutors' room in one teaching programme, where answers to
  students' questions about what the AI clause permits accrete into an unwritten
  case law, and how a question comes to count as settled
