summary: >-
  A prospectus brochure built around an instrument that certifies itself: the
  shopping-centre claw machine whose lease-mandated payout ratio is confirmed
  from its own internal counter. It sets the Master of Applied Measurement,
  the Master of Priority Studies, and the Capability Sprints short courses
  beside two published findings on the same problem, and pitches postgraduate
  study as the habit of counting a reported figure a second time.
topic: >-
  a suburban shopping-centre arcade's claw machine, where the prize-payout
  ratio the venue's family-entertainment lease requires is verified from the
  machine's own internal win counter --- a counter that ticks for any prize
  dispensed, including the one an attendant hands over from behind the
  counter when a child cries
