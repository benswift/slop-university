summary: >-
  A research-showcase brochure from the School of Emergent Priorities opens on
  a campus coffee cart's five-dollar card-payment minimum, and follows it into
  the University's new cross-School Threshold Design Studio, a standing unit
  that will find, log, and offer to redesign the naturally occurring cutoffs
  already running inside any partner organisation's ordinary operations.
topic: >-
  The coffee queue's five-dollar card-payment minimum changes what people add
  to a small order.
