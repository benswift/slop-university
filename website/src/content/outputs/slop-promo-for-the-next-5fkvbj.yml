summary: A short profile of Dr Iben Chikere, Lecturer in the School of Emergent Priorities,
  told largely in her own words. Dr Chikere describes her research into what a handover
  keeps of a role once its holder moves on, from the shortcuts passed between street-library
  volunteers to the sprinkler timers a house keeps after settlement day and the calls
  new volunteer officers make to the people they replaced. The video also marks her
  standing as the University's most-funded researcher, with a list of co-authors that
  now takes in every one of her colleagues.
topic: "a promo profile of Dr Iben Chikere, the University's most-funded researcher,
  in her own voice: what a handover note keeps of a role and what it leaves out, from
  street-library volunteers and a sold house's sprinkler timers to new volunteer
  officers who ring their predecessors, written with every one of her colleagues"
