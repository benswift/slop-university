doi: 10.5555/slop.ffzczm
summary: >-
  A paper from the School of Underlying Conditions and the School of
  Continuous Improvement treats the questioning of a witness to a venomous
  animal from a printed checklist as a search game in which the witness may
  answer wrongly a bounded number of times and may say they did not see. It
  proves that the animal can be identified exactly when every two animals on
  the checklist differ in more features than went unseen, bounds the number of
  questions needed from above and below, and works an eight-animal checklist
  through by hand.
topic: >-
  searching with lies and shrugs: the query complexity of identifying an
  unseen biting animal from a fixed feature checklist when the witness errs a
  bounded number of times and declines to answer about what was not seen
