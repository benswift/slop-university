title: Searching with Lies and Shrugs
subtitle: Identifying an Unseen Animal from a Fixed Checklist When the Witness May Err
authors:
  - Ragnhild Uzoma
  - Solveig Adeyemi
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
