summary: >-
  A civic brochure in which the Schools of Settled Matters and Underlying
  Conditions open a shared reading table to the district, inviting households
  and tradespeople to bring in the kettle scale, tap crust and wall salt bloom
  their water leaves behind. Its three features read what the water carried up
  from the ground and what the district's titles say about the drains that
  carried it away; it quotes three researchers, profiles two, and features six
  published studies cited by title and DOI.
