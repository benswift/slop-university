title: "Credited, Not Flexible"
subtitle: "A Regression-Discontinuity Design Around a Shift-Rostering App's Weekend Fairness-Credit Threshold"
authors:
  - Lindiwe Achterberg
  - Casimir Beng
  - Anneke Tolan
preset: paper
school: School of Emergent Priorities
date: 2026-09-12
publishedAt: "2026-09-12T09:01:30+10:00"
doi: 10.5555/slop.gj2xye
summary: >-
  A paper from the School of Emergent Priorities treats a shift-rostering
  platform's weekend-shift fairness-credit threshold as a natural
  regression-discontinuity cutoff across 438 workers at a 24-outlet
  retail-and-hospitality chain, finding that crossing the threshold is
  followed by a 36-percentage-point fall in how often a worker's next
  appraisal uses a flexibility-adjacent term, an effect three placebo
  cutoffs fail to reproduce.
topic: >-
  a regression-discontinuity design around a shift-rostering app's
  weekend-shift 'fairness credit' counter, which deprioritises a worker for
  future weekend shifts the moment their tally crosses a fixed threshold,
  testing whether crossing that count causes supervisors' written appraisal
  comments to describe the same worker as measurably less 'flexible'
