title: Pats That Stayed
subtitle: >-
  Dung-pat persistence, beetle colonisation and a treatment calendar read back
  from one grazed paddock
authors:
  - Ragnhild Uzoma
  - Eskil Nwabueze
preset: paper
school: School of Underlying Conditions
date: 2026-11-01
publishedAt: "2026-11-01T02:31:15+11:00"
doi: 10.5555/slop.6tfc1g
summary: >-
  A paper from the School of Underlying Conditions and the School of Continuous
  Improvement marks 360 fresh dung pats in 30 weekly cohorts on one set-stocked
  cattle paddock and ages every standing pat on twelve belt transects at the
  season's end. Pats dropped in the four weeks after a spring pour-on persisted
  three times as long as summer pats and held a tenth of their beetles, and the
  end-of-season census found them at 6.8 times the expected number, but the
  herd's autumn treatment left no trace, because by then beetles were scarce
  in every pat.
topic: >-
  a field census of dung pats that refuse to decay on a cattle paddock, read
  back as a record of when the herd was given a macrocyclic lactone pour-on,
  and of the dung beetles that stayed away
