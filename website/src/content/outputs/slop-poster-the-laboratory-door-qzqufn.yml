title: Who the Door Is Talking To
subtitle: A Media-Archaeological Reading of Hazard Placards on Thirty-Eight Laboratory Doors
authors:
  - Vigdis Emenike
  - Anouk Mensah
  - Sunniva Balogun
preset: research-poster
