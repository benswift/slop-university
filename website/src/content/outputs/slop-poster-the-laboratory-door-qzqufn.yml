doi: 10.5555/slop.qzqufn
summary: >-
  A research poster from the School of Underlying Conditions records the 450
  surviving hazard placards on 38 doors of one late-1960s chemistry building
  as a stratigraphy, dating each layer from its typeface, laminate and
  adhesive and coding whom its wording addresses. Early layers speak to
  whoever is about to enter; since the 2000s the largest share is written to
  be checked by an auditor rather than read by an entrant, and almost nothing
  is ever taken down.
topic: >-
  The laboratory door as a medium: a media-archaeological reading of the
  hazard placards that accrete layer on layer on the doors of one ageing
  chemistry building, and whom each layer was written to address
