title: The Legend Is Read Last
subtitle: >-
  What the School learned about its charts from the people who read them,
  2021–2026
authors:
  - Marit Osayande
  - Mirela Hanke
  - Thandiwe Solberg
preset: impact-report
school: School of Continuous Improvement
date: 2026-10-12
