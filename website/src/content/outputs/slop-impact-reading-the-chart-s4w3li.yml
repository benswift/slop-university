doi: 10.5555/slop.s4w3li
summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 reviews its
  visual analytics program through 1,316 reading sessions in which
  collaborators read their own charts aloud and marked in pencil where they
  looked. Three accounts cover how a chart is read, the unexamined choices
  embedded in an axis, and the upkeep of a display once it is on the wall,
  each recording a setting a collaborator changed and kept and the practice
  the School adopted in turn, including the retirement of 174 tiles from the
  Living Dashboard.
topic: >-
  reading the chart together: a retrospective on the School's visual
  analytics work and how its collaborators came to see their own data
