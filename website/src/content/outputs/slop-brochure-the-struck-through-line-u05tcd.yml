summary: >-
  A research-showcase brochure from the School of Continuous Improvement
  presents STRIKE, a teaching case that follows one household's shared grocery
  list through the decision to stop deleting struck lines, and sets out the
  Strike Retention Rule by which the University keeps every struck line in
  place on its own rosters, requisition lists, run sheets and shared task
  lists. Seven published University studies on the lists, ticks and counts of
  everyday digital life are cited by title and DOI.
topic: >-
  The struck-through line on one household's shared grocery-list app, taught as
  a single-site case, and the Strike Retention Rule the University set for its
  own lists
