title: A Cut Nobody Watched
subtitle: Tense and Agency in the Edge Notes of an Abrasive Waterjet Shop
authors:
  - Sten Okwuosa
preset: paper
school: School of Continuous Improvement
date: 2026-10-20
publishedAt: "2026-10-20T15:00:59+11:00"
doi: 10.5555/slop.0feq30
summary: >-
  A paper from the School of Continuous Improvement reads closely the 2,214
  edge notes kept in eleven volumes at the inspection bench of a jobbing
  abrasive waterjet shop between 2011 and 2025, in which three successive
  inspectors describe cut faces produced out of anyone's sight. It finds the
  jet narrated in the past tense and the part in the present, and the notes'
  grammatical subject moving from the jet, to the edge, to the inspector
  writing in the first person.
topic: >-
  a close reading of how inspectors at an abrasive waterjet shop narrate the
  cut edge — striation, taper, frosting — as the record of a cut nobody
  watched
