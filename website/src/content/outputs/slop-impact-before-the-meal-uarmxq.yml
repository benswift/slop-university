summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 recounts five
  years of work with neuropeptide physiology laboratories across five impact
  areas: a pre-anticipatory sampling window set at least four hours before a
  colony's scheduled feed, a nine-laboratory ring trial that narrowed the
  widest gap between immunoassay and mass-spectrometry readings from 62 to 19
  per cent, a timing-only amendment tier that cut the median review wait from
  34 days to nine, a shared facility dashboard whose 2025 review retired 21 of
  its 64 indicators and added seven, all concerning time, and a cold-chain
  record that has each sample's thaw events completed at receipt.
