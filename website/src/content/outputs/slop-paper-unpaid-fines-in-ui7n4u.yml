doi: 10.5555/slop.ui7n4u
summary: >-
  A paper from the School of Continuous Improvement reads the fine book of a
  provincial printing house, kept by the workmen between 1868 and 1903, as a
  ledger of debts rather than a record of discipline. Only two pence in every
  five levied was ever settled, and journeymen carrying the largest balances
  stayed longest; the paper argues that the uncollected fine worked as a bond
  posted in arrears.
topic: >-
  unpaid fines in a printing chapel book as a bond that kept journeymen in the
  house
