title: Owing the Chapel
subtitle: Unpaid Fines and the Length of a Journeyman's Stay in a Provincial Printing House, 1868–1903
authors:
  - Ingeborg Nwachukwu
preset: paper
school: School of Continuous Improvement
date: 2026-10-09
