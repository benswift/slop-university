title: The Cohort Cannot Be Re-Asked
subtitle: Scoring Learned Health-State Value Sets by Decision Survival Under Preference Drift
authors:
  - Anselm Threlkeld
  - Mirela Hanke
preset: paper
school: School of Settled Matters
date: 2026-11-14
