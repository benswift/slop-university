title: The Meadow Has Been Further Out
subtitle: >-
  Buried Rhizome Mats and Drive-by-Drive Shortening Correction in Push Cores
  from an Estuarine Seagrass Flat
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-18
publishedAt: "2026-10-18T05:02:56+11:00"
doi: 10.5555/slop.fkbmr6
summary: >-
  A paper from the School of Underlying Conditions cores eighteen positions
  across the seaward edge of an estuarine seagrass meadow, logging each push
  core's shortening drive by drive, and finds the loss concentrated in the
  drive beneath each buried rhizome mat; corrected drive by drive, horizon
  depths fall within 1.3 cm of three pit faces, where uncorrected depths erred
  by up to 15 cm. The corrected cores record three meadows separated by two
  sand burials, the middle one, buried about four decades before coring,
  reaching at least 60 m beyond the present edge.
topic: >-
  buried rhizome mats in push cores from a sheltered estuarine seagrass meadow
  as a stratigraphic record of its retreats and returns, with depths corrected
  for core shortening
