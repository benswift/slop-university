title: Friday's Fluence
subtitle: A Two-Reservoir Wall Model for Start-of-Week Fuelling in a Small Research Tokamak
authors:
  - Clemency Tredinnick
  - Casimir Beng
preset: paper
school: School of Settled Matters
date: 2026-11-21
