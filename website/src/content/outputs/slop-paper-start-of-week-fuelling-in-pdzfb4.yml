doi: 10.5555/slop.pdzfb4
summary: >-
  A paper from the School of Settled Matters and the School of Continuous
  Improvement follows 1,386 hydrogen discharges over a fourteen-week campaign on
  a small limiter tokamak and models the first wall as a weakly bound inventory
  released over minutes and a trapped inventory of limited capacity released
  over about 34 hours. The model reproduces the first-shot density deficit after
  idle periods, which averaged 16.8% after a night and 41.0% after a weekend,
  traces the spread between Mondays to the previous Friday's fluence, and, used
  to set the prefill, brought the first shot of a session to within a median
  3.8% of its requested density.
topic: >-
  start-of-week fuelling in a small research tokamak: the first wall modelled as
  a two-timescale hydrogen reservoir, fitted to a campaign of discharges,
  predicts how far the week's first shots fall short of their programmed density
  and sets the gas pre-fill that corrects them
