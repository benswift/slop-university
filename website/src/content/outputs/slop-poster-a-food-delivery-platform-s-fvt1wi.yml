doi: 10.5555/slop.fvt1wi
summary: >-
  A research poster from the School of Emergent Priorities scores 214
  food-delivery riders across five depots against the route their app told
  them to take, finding on-time arrival rates fall from 89% in the
  least-compliant adherence quintile to 54% in the most-compliant quintile
  over a six-month deployment, with the riders penalised for the most
  off-route shortcuts also arriving the fastest.
topic: >-
  a food-delivery platform's route-adherence score rates a rider by how
  closely their GPS track follows the app's suggested path to the door, but
  the score's harshest non-compliance flags land on the riders whose
  off-route shortcuts get them there fastest, sorting a depot's riders into
  a compliance-versus-arrival-time matrix that rewards following the map
  over knowing the streets
