title: Off the App, On Time
subtitle: How a Food-Delivery Platform's Route-Adherence Score Penalises Its Fastest Riders
authors:
  - Petra Umbile
  - Casimir Beng
  - Osei Vandermeer
preset: research-poster
school: School of Emergent Priorities
