title: Level Five Is a Bucket
subtitle: A five-level maturity model for the roadworks Stop/Slow bat, scored at 30 lane closures
authors:
  - Eivind Onwuka
  - Marit Osayande
  - Signy Okpara
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-06
publishedAt: "2026-10-06T14:01:55+11:00"
doi: 10.5555/slop.l4a0zb
summary: >-
  A research poster from the School of Continuous Improvement scores 30
  roadworks lane closures on a five-level Stop/Slow bat maturity model, Held Low
  to Bucketed, finding that median queue-clear waits fall from 98 s at Level 1
  to 41 s at Level 4 and rise to 68 s at the three Level Five closures, and that
  the road authority stands down the controller at any closure reaching Level
  Five, leaving the bat in a 20-litre bucket for the rest of the works.
topic: >-
  a roadworks traffic controller scores 30 lane-closure sites against a
  five-level Stop/Slow bat maturity model, and the road authority stands down
  the controller at any site reaching Level Five, leaving the bat standing in a
  bucket
