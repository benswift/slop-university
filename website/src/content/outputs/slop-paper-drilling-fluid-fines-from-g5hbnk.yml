doi: 10.5555/slop.g5hbnk
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities tests 31 samples of the fines settled from one cored borehole's
  drilling-fluid returns as solid acid catalysts for the solvent-free Biginelli
  synthesis of a dihydropyrimidinone. Fines from the nine intervals where the
  core had been ground away gave a median yield of 73 per cent against 37.5 for
  fines from recovered intervals, yet every sample fell on one line of yield
  against cation-exchange capacity, so the paper reads the catalyst's activity
  as a measure of the swelling clay in rock that never reached the core tray.
topic: >-
  Drilling-fluid fines from a borehole's unrecovered core intervals, tested by
  depth as a clay acid catalyst for the three-component Biginelli synthesis of
  dihydropyrimidinones
