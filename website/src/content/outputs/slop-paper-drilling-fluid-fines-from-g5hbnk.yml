title: What the Bit Ground Away
subtitle: Drilling-Fluid Fines from Intervals of Core Loss as Clay Acid Catalysts for the Biginelli Reaction
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
  - Halvard Nnamani
preset: paper
school: School of Underlying Conditions
date: 2026-11-16
