title: Kept on the Chart
subtitle: The Survival of Tax-Motivated Subsidiaries After the Regime They Served Was Repealed
authors:
  - Clemency Tredinnick
  - Kwame Lindqvist
preset: paper
school: School of Settled Matters
date: 2026-11-10
publishedAt: "2026-11-10T14:30:18+11:00"
doi: 10.5555/slop.6pyn2j
summary: >-
  A paper from the School of Settled Matters and the School of Emergent
  Priorities follows 341 subsidiaries that 87 listed groups held under a
  repealed concessional regime for group finance and holding companies through
  ten years of published subsidiary schedules, finding that half were still
  listed eight years after repeal, against under three years for operating
  shells whose business had been sold or closed. Removal is associated with
  the costs of unwinding an entity and with the arrival of a new chief
  financial officer or head of tax, and 63 of the 148 survivors had acquired a
  new stated activity by the end of the window.
topic: >-
  how long tax-motivated subsidiaries survive in corporate groups after the
  rule they were set up to exploit has been repealed
