doi: 10.5555/slop.emn8yk
summary: >-
  A paper from the School of Emergent Priorities surveys 6,512 courier
  photographs of parcels left in a safe place across 1,406 households and
  reports the distance from the door as distributions by dwelling type, with a
  pooled median of 3.1 metres that holds across courier networks. The School has
  adopted that median as the service radius for its examination packs: a pack
  photographed beyond it is not served and is redelivered, with no override, and
  the radius narrows by a tenth of a metre each teaching period while the band
  beneath it stays crowded.
topic: >-
  Three-point-one metres is the median distance between the front door and the
  parcel in 'left in a safe place' delivery-confirmation photographs: a survey of
  photographed parcels across households, reported as distributions, and the
  University accepting such a photograph as proof of service
