summary: >-
  A research poster from the School of Emergent Priorities decomposes the single
  surface-hardness reading a regional junior football association requires
  before play, taking 3,744 drop readings across 26 venues at twelve positions
  per ground, on six half-hourly occasions, by two blind assessors over nine
  winter Saturdays. In a crossed random-effects generalisability design,
  position within the ground accounts for 41.8 per cent of total variance and
  hour of the morning for 22.3 per cent, against 14.9 per cent for the ground
  itself and 11.6 per cent for the assessor. A single reading taken exactly as
  the protocol specifies has a dependability coefficient of 0.28 against the
  association's 110-gravity threshold, and two assessors taking it twenty
  minutes apart return calls on opposite sides of that threshold at 8 of the 26
  venues. A decision study puts a nine-position, two-occasion design at the
  conventional 0.80 floor with no additional equipment.
topic:
  the drop-hammer hardness reading a volunteer takes on the goal square before
  junior football on a Saturday morning, where a regional sporting association
  reports grounds assessed against a hardness threshold as its player-safety
  indicator and one number decides whether the children play --- a
  generalisability study decomposing that single reading's variance across
  position on the ground, hour of the morning, and which volunteer holds the
  hammer, and what the mandated reading turns out to be a measure of
