summary: >-
  Slop University's Strategic Plan 2026-2031 positions the University as a
  Nourishing University, establishing a standing weekly Long Table in every
  school, hosted by fixed rotation inside a protected common hour, and a
  Campus Ground Register that must characterise a site by pit, core or bore
  before any kitchen garden is planted on it, with uncharacterised ground
  left unplanted and mapped as such.
topic: >-
  the nourishing university: a strategic plan that makes the shared table its
  unit of belonging, and grows campus food only from ground it has first
  learned to read
