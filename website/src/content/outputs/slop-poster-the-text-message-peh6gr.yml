title: Suspicion Is Not Detection
subtitle: >-
  A Signal-Detection Study of 18,480 Judgements Before and After a
  Scam-Awareness Program
authors:
  - Ingeborg Nwachukwu
  - Sten Okwuosa
  - Osei Vandermeer
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-06
publishedAt: 2026-08-06T02:01:09+10:00
doi: 10.5555/slop.peh6gr
summary: >-
  A research poster from the School of Continuous Improvement decomposes the
  indicator one metropolitan council reports for its scam-awareness program, the
  share of scam messages residents correctly flag, into sensitivity and response
  criterion. 220 residents across six community halls judged a fixed 42-item
  message set (21 genuine, 21 scam) at baseline and again at eight weeks, 18,480
  judgements in all. Correct flagging of scam messages rises 17.6 points to 88.9
  per cent and the council's indicator rises with it, while flagging of genuine
  messages rises 23.2 points to 46.1 per cent. Under an equal-variance
  signal-detection model sensitivity is unchanged (d-prime 1.31 to 1.32, 95% CI
  of change -0.11 to +0.14) and the criterion moves -0.65 (95% CI -0.74 to
  -0.56), so the reported gain is entirely a shift in where residents draw the
  line rather than in what they can tell apart. At eight weeks 41.4 per cent
  flag a pharmacy's script-ready notice and 49.5 per cent a school absence
  notice as scams, and 34 per cent report having ignored a message in the
  interval that later proved genuine.
topic: >-
  the text message on a phone in a kitchen --- the parcel one, the pharmacy's
  script-ready one, the school's absence one --- where a council's
  scam-awareness program counts the share of scam messages residents correctly
  flag as its indicator, and a signal-detection study asks whether the workshops
  improved anyone's ability to tell the two apart or only moved where the line
  is drawn, and what the shift costs in genuine messages missed
