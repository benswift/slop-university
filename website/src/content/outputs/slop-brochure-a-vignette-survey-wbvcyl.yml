summary: >-
  A brochure from the School of Emergent Priorities showcases the
  University's programme studying where official discretion actually sits,
  from a survey design that puts identical cases in front of officers in
  different regional offices to the published tolerance bands that follow,
  alongside eight previously published outputs drawn from the civic-life
  corpus.
topic: >-
  a vignette survey of state housing-commission maintenance-triage officers,
  given the identical repair scenario and asked to classify its urgency,
  reported as the spread of classifications across regional offices
