title: The Outline Stays
subtitle: >-
  Five years of a footpath-trading maturity model, and the nine shires that
  repaint every sandwich-board outline each year
authors:
  - Eivind Onwuka
  - Renke Sabel
  - Osei Vandermeer
preset: impact-report
school: School of Continuous Improvement
date: 2026-10-08
publishedAt: "2026-10-08T18:01:55+11:00"
doi: 10.5555/slop.pa98nj
summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 follows a
  five-level maturity model for shire sandwich-board permits, from Loose to
  Outlined, into the nine shires at the top level: each repaints every outline
  on its register at the start of each financial year, and an outline leaves
  the register only when its permit holder lodges a retirement form that a shop
  which has ceased to trade is unable to lodge.
topic: >-
  The footpath-trading maturity model scores each shire's sandwich-board
  permits on five named levels, and at the top level the board stands on a
  painted outline that the shire repaints every year whether or not the shop
  still trades
