title: What Do You Do When the Caller Fails the Question?
subtitle: A Typology of Call-Centre Verification Workarounds Under a Pass-Rate KPI
authors:
  - Dagny Okafor
  - Casimir Beng
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-22
