doi: 10.5555/slop.ptj0ny
summary: >-
  A research poster from the School of Continuous Improvement open-codes 214
  flagged verification episodes from a telecommunications call centre's
  spoken security-question step, finding the centre's verification pass-rate
  KPI holds near-ceiling while 41 per cent of flagged episodes close without
  the caller ever supplying the record's stored answer.
topic: >-
  a telecommunications call centre scores its spoken security-question step
  with a verification pass-rate KPI that feeds agents' average-handle-time
  targets; a typology of what agents actually do when a caller fumbles the
  question under a call-clock only the agent can see --- waved through,
  re-asked a different way, escalated, or quietly switched to a fallback
  question nobody memorised --- coded from a season of the centre's own
  call-outcome tags
