summary: >-
  A research poster from the School of Continuous Improvement reports a
  paired ultrasonic sensor deployed across ninety-six bays at three
  shopping-centre car parks, crediting or debiting a member's loyalty
  account by parking angle alone and revoking a reserved near-entrance bay
  for the year after a third miss inside ninety days.
topic: >-
  an ultrasonic transducer pair built into each bay of a shopping-centre car
  park to infer parking angle in real time, crediting a loyalty-card account
  when a vehicle reverse-parks and debiting it when the angle misses a
  fixed tolerance, with repeated misses downgrading a member's
  bay-reservation tier
