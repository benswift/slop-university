title: The Rule That Never Fires
subtitle: Canons of Statutory Construction as Conflict-Resolution Semantics for an Inherited Firewall Estate
authors:
  - Anselm Threlkeld
  - Clemency Tredinnick
preset: paper
school: School of Settled Matters
