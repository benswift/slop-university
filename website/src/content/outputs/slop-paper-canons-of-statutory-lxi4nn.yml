summary: >-
  A paper from the School of Settled Matters states lex specialis, lex
  posterior and the presumption against surplusage as relations over packet
  filter match sets, and applies the resulting construction to the 2,904
  active rules of six firewalls in one anonymised regional utility, finding
  611 conflicting pairs and 118 rules that first-match order leaves
  inoperative. Where a change ticket records the requester's intent, the canon
  reading agrees with it in 85% of shadowing pairs against first-match order's
  13%, while for partially overlapping rules position remains the better guide.
topic: >-
  Canons of statutory construction as conflict-resolution semantics for
  access-control policies: lex specialis, lex posterior and the shadowed
  firewall rule
