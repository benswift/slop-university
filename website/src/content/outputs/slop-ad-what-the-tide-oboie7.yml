summary: >-
  A marketing poster for the School of Underlying Conditions places one of the
  School's published papers on the University's signage rotation: a winter
  beach at low water, a profile pit cut square through the strand-line kelp and
  a surveyor at its edge, under six words of display type and the paper's title
  and identifier. Prepared for the portrait panels in matched daylight and
  evening renderings.
