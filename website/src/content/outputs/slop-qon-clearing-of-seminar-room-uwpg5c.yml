title: Whatever Its Height
subtitle: >-
  The Department of Policy Settings answers questions taken on notice by the
  Committee on Settings Oversight on the clearing of writing surfaces in the
  University's teaching rooms
authors:
  - Verity Marris
  - Iben Chikere
  - Anneke Tolan
  - Anselm Threlkeld
preset: questions-on-notice
date: 2026-11-17
