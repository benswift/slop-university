doi: 10.5555/slop.uwpg5c
summary: >-
  The Department of Policy Settings answers six questions on the Slop
  University (Teaching Spaces) Determination 2026, which has the writing
  surfaces of a bookable teaching room cleared at the end of each booking and
  refits rooms with a single glass surface of 2.4 by 1.2 metres. Taken on notice
  at the Committee on Settings Oversight's Spring hearings of 13 November 2026
  or lodged in writing after them, its answers state that it does not hold how
  many surfaces were cleared bearing a do-not-erase notice; report fixed writing
  surface in rooms within scope falling from 426.24 to 283.68 square metres as
  the rooms rose from 67 to 80; give 37 retained-surface applications, nine of
  them granted; decline to match 41,306 recorded clears to their bookings; and
  find that a sliding panel raised above reach is not cleared, whatever its
  height, while a mobile whiteboard falls outside the Determination.
topic: >-
  Clearing of seminar-room writing surfaces at the end of each booking, which
  erases the operator theory seminar's working boards between its weekly
  sittings
