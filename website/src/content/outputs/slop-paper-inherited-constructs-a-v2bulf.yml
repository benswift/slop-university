summary: >-
  A paper from the School of Settled Matters and the School of Emergent
  Priorities resequences end to end 318 of the 364 tubes a photostimulation
  facility's deposit register lists as microbial-opsin expression constructs,
  deposited across fourteen years, and classifies each against the construct
  the register names. The opsin reading frame matched its label in 297 tubes
  while 118 carried it under a different promoter, tag, regulatory element or
  backbone; divergence tracked the number of re-deposit steps rather than
  years in storage, and shared silent variants resolved 243 tubes into six
  derivation lineages the register records for 96.
topic: >-
  inherited constructs: a sequence audit of the legacy opsin plasmid stocks
  left in a shared optogenetics freezer, and what each tube still carries
