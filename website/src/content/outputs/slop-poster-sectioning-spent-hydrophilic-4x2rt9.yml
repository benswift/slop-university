doi: 10.5555/slop.4x2rt9
summary: >-
  A research poster from the School of Underlying Conditions runs 96
  hydrophilic matrix tablets carrying a model tracer through a paddle
  dissolution bath, lifts sixteen at each of six pull times, and cores every
  spent tablet into five radial shells for assay. The run closes to 99.5% of
  label at 24 hours, with 7.2% still in the tablet, 61% of that in the two
  innermost shells, and nine crumbled shells logged as lost.
topic: >-
  sectioning spent hydrophilic matrix tablets to find where the unreleased
  fraction of a model payload sits after a dissolution run
