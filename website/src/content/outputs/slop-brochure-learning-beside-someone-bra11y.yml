summary: >-
  A prospectus led by the School of Underlying Conditions invites prospective
  students into the University's coaching culture, in which every newcomer
  learns the work in pairs beside someone further along: at the monitoring
  bore, at the core bench of the Basement Relations Group, and in the
  practice circles of Capability Sprints. It sets that teaching beside five
  published University studies of trainees, apprentices, practicum
  supervision, help-seeking and role handover.
