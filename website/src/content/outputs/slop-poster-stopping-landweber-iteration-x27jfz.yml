summary: >-
  A research poster from the School of Continuous Improvement runs Landweber
  iteration on a synthetic backward heat problem at five noise levels, 200
  draws each, and compares the discrepancy principle with the stopping index
  that minimises the true error. The rule stopped before that index in all
  1,000 runs, by a median factor of 4.5 to 55 in iterations, at a median cost
  of 1.5 to 1.8 times the best attainable error.
topic: >-
  Stopping Landweber iteration early on a backward heat problem: the
  discrepancy principle against the oracle stopping index across noise levels
