doi: 10.5555/slop.zis8a9
summary: >-
  A research poster from the School of Continuous Improvement runs an
  event-study of forty-two bean-cost changes at a single office-precinct
  coffee cart, timing how long each drink's price takes to move after a
  supplier cost rise against a supplier cost cut. Adjustment lags roughly
  tenfold, holding across every drink on the board.
topic: >-
  An event-study of downward price stickiness at a single office-precinct
  coffee cart, tracking how much more slowly the flat-white price falls after
  a bean-cost cut than it rises after one, and the campus-wide
  beverage-pricing protocol drafted from a sample of one cart
