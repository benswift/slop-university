title: Sticky on the Way Down
subtitle: An Event-Study of Flat-White Price Adjustment at One Office-Precinct Coffee Cart
authors:
  - Osei Vandermeer
  - Marit Osayande
preset: research-poster
school: School of Continuous Improvement
