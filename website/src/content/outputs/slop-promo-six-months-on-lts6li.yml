summary: "Dr Ingeborg Nwachukwu, Lecturer and Convenor of the Capability Sprints,
  explains in her own words why she returns to a course long after it ends: to find
  out what its graduates actually kept. Drawing on three of her most-cited outputs,
  from a community shed's sign-in sheet to a warehouse food-safety checkbox and a
  club membership roll, and on her impact report following five years of Sprint graduates
  back to their desks, the video sets out the gap her research keeps finding between
  finishing and keeping. It also marks her standing among the University's most cited
  researchers, with its second-highest h-index."
topic: "a promo profile of Dr Ingeborg Nwachukwu, Convenor of the Capability Sprints
  and holder of the University's second-highest h-index, in her own voice: a former
  workplace-training consultant who goes back after the certificate to find out what
  a course's graduates actually kept"
