summary: >-
  A civic brochure from the School of Continuous Improvement follows an
  allotment produce-table steward's sort of every surplus vegetable into four
  kinds of glut, and invites neighbouring sites to read their own gates the same
  way. The University now fixes each kind's recipe-card allowance and sends the
  remainder out on a Sunday round that the allotment sites it keeps have no
  means of moving.
topic: >-
  The produce-table steward at a community allotment sorts every surplus
  vegetable left on the swap table into four kinds of glut, and the University
  now binds each kind to a fixed recipe-card allowance and a collection round
  with no ordinary override
