title: Every Surplus Vegetable Is One of Four Kinds
subtitle: What the allotment swap table taught the University about its collection rounds
authors:
  - Ingeborg Nwachukwu
  - Edda Nwafor
  - Bram Ntuli
preset: brochure
school: School of Continuous Improvement
