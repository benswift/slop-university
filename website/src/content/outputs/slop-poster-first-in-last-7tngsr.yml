title: First In, Not First Out
subtitle: Arrival order and lymph-node departure of macrophage cohorts in resolving mouse peritonitis
authors:
  - Ylva Onyekwere
  - Signy Okpara
  - Ingrid Vasseur
preset: research-poster
school: School of Emergent Priorities
date: 2026-11-01
