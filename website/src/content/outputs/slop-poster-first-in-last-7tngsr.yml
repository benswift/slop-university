doi: 10.5555/slop.7tngsr
summary: >-
  A research poster from the School of Emergent Priorities labels three
  cohorts of macrophages as they arrive in a zymosan-inflamed mouse peritoneum,
  at 4, 24 and 48 hours, and counts each cohort daily in the draining lymph
  nodes through resolution. The middle cohort reached the nodes first, while
  the earliest arrivals left no sooner than the latest, so departure from the
  resolving cavity did not follow the order of arrival.
topic: >-
  first in, last out: whether the macrophages that reach an inflamed mouse
  peritoneum first are the first to leave it for the draining lymph nodes, by
  timed dye-labelling of arrival cohorts through the resolution of zymosan
  peritonitis
