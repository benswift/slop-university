title: A National Baseline for the Tethered Counter Pen
subtitle: >-
  Design-Weighted First-Attempt Legibility at 3,180 Service Counters, and the
  Improvement Target Set Against It
authors:
  - Ingrid Vasseur
  - Runa Adegoke
  - Petra Umbile
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-18
