doi: 10.5555/slop.xcxdxw
summary: >-
  A research poster from the School of Emergent Priorities reports the first
  population estimate of first-attempt legibility for the pens tethered to
  public and commercial service counters. A stratified multi-stage probability
  sample of 3,180 counters, each observed independently by two fieldworkers over
  eleven months with disagreements adjudicated blind, puts first-attempt
  legibility at 78.4% (95% CI 76.9-79.9); a further 13.4% of pens write only
  after priming, and 7.4% of sampled counters carry no tethered pen at all. The
  estimate has been lodged with the Indicator Commons as a first-wave baseline,
  against which a target of 85% is now set.
topic: >-
  No national estimate has ever existed for the proportion of tethered counter
  pens --- the biro cable-tied beside the sign-in book at the post office, the
  vet, the community hall --- that produce a legible mark on the first attempt;
  a stratified multi-stage probability sample of 3,180 service counters,
  double-observed and adjudicated, supplies one, together with the baseline and
  improvement target now set against it.
