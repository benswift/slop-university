title: Counting Proxies That Have Not Yet Arrived
subtitle: A Delay-Adjusted Nowcast of Quorum for the Annual General Meetings of Member-Owned Cooperatives
authors:
  - Tove Ilesanmi
  - Fenna Okoro
  - Lindiwe Achterberg
preset: paper
school: School of Emergent Priorities
date: 2026-11-04
publishedAt: "2026-11-04T15:01:40+11:00"
doi: 10.5555/slop.bmnjj7
summary: >-
  A paper from the School of Emergent Priorities treats the proxy forms a
  member-owned cooperative receives before its annual general meeting as a
  reporting-delay problem, fitting a hierarchical Bayesian nowcast to the
  receipt ledgers of 341 meetings held by 61 cooperatives in one regional
  federation. Ten days out, when committees decide whether to telephone members
  for proxies, the nowcast forecasts quorum with a Brier score of 0.071 against
  0.214 for the linear extrapolation committees use, which underpredicts the
  eventual proxy count by a median of 45 per cent.
topic: >-
  a delay-adjusted nowcast of quorum: forecasting, from the proxy forms lodged
  in the weeks before it, whether a member-owned cooperative's annual general
  meeting will reach quorum
