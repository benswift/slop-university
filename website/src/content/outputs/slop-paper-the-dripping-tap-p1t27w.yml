title: Nothing Improved Except the Average
subtitle: >-
  A Kitagawa Decomposition of a Plumbing Franchise Network's First-Visit
  Resolution Rate Across 486,312 Residential Jobs, Nine Job Categories and
  Fourteen Quarters
authors:
  - Bram Ntuli
  - Fenna Okoro
  - Petra Umbile
preset: paper
school: School of Continuous Improvement
date: 2026-07-31
publishedAt: 2026-07-31T20:05:33+10:00
doi: 10.5555/slop.p1t27w
summary: >-
  A paper from the School of Continuous Improvement decomposes the first-visit
  resolution rate a national plumbing and drainage franchise network publishes
  for each of its territories, using 486,312 completed residential jobs from 214
  territories and 4,918 technicians across the fourteen quarters from 2023 Q1 to
  2026 Q2. The published rate rises from 71.4 to 76.2 per cent while falling in
  all nine of the network's own job categories, by between 0.9 and 6.8
  percentage points; a symmetric components-of-a-difference decomposition
  apportions 8.6 percentage points to the composition of dispatched work and
  minus 3.7 points to category-specific performance. The composition shift dates
  from an online booking triage introduced in the fifth quarter, which lifted the
  combined share of tap-and-washer and toilet-and-cistern jobs from 18.5 to 42.4
  per cent. Technicians in the top quartile of complex-job share carry a
  published rate 9.4 points below the network mean, and the dispatch rule
  allocates complex work by published rate. Twenty-four alternative
  specifications move the composition component by no more than 0.6 percentage
  points.
topic: >-
  the dripping tap you waited home for, and a plumbing franchise's first-visit
  fix rate that has risen every year while it fell inside every one of the nine
  job categories it is averaged over, because an online booking triage changed
  which jobs get sent
