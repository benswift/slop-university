doi: 10.5555/slop.82d9n9
summary: >-
  A paper from the School of Continuous Improvement describes the Redemption
  Likelihood Index, a scoring tool built for a strip-mall pawnbroking chain
  that now decides front-wall shelf placement and handling priority for
  every pledged item, with anything scoring below a lower threshold routed
  straight to early resale processing once the statutory minimum hold has
  passed. Across a fourteen-month deployment, the redemption-rate gap
  between front-wall and back-room items widens from under six points
  before roll-out to 29 points by month fourteen, and the chain's own
  fit-out policy now binds shelf allocation to the score with no
  discretionary override.
topic: >-
