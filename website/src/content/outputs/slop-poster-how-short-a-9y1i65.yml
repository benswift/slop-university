title: Nothing Is Safe to Forget
subtitle: Fixed memory windows in an L1 solver for Caputo relaxation
authors:
  - Thandiwe Solberg
  - Joost Nwosu
  - Eskil Nwabueze
preset: research-poster
school: School of Continuous Improvement
