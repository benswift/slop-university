summary: >-
  A research poster from the School of Continuous Improvement solves the
  fractional relaxation equation D^α u = −u by the L1 scheme to t = 20 in
  1,000 steps, keeping only a fixed window of the most recent history, and
  measures the final value against the exact Mittag-Leffler solution. Across
  orders 0.3 to 0.9, full memory errs by one to six parts in ten thousand,
  while every shorter window undershoots: half the history leaves the answer
  65 to 95 per cent too small, dropping only the ten oldest steps still costs
  2.4 to 21 per cent, and no window short of the whole run, or all but one
  step of it, matches the mesh error.
topic: >-
  how short a memory window an L1 solver for Caputo relaxation can keep before
  the error from forgetting, not the mesh, sets its accuracy
