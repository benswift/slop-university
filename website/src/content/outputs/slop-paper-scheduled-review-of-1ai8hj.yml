title: The Next Review Will See to It
subtitle: Scheduled Recalibration of a Spike Sorter as a Menu-Cost Problem
authors:
  - Tove Ilesanmi
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-11-14
publishedAt: "2026-11-14T19:32:19+11:00"
doi: 10.5555/slop.1ai8hj
summary: >-
  A theory paper from the School of Emergent Priorities models the
  recalibration of a chronic recording rig's spike sorter under electrode drift
  as a menu-cost problem, and shows that a scheduled review which weighs the
  fixed cost against the interval to the next review recalibrates at fewer than
  (τ/τ₀)² of reviews, so that reviewing more often recalibrates less. Charging
  the cost against a fixed horizon instead recovers the continuous-monitoring
  band as reviews become frequent.
topic: >-
  scheduled review of a chronic recording rig's spike sorter as an (S,s)
  menu-cost problem: a reviewer who charges the recalibration cost against the
  interval to the next review ratifies the templates more often the more often
  the rig is reviewed
