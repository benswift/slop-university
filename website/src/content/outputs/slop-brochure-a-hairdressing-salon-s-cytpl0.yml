summary: >-
  A marketing brochure for the Schools of Emergent Priorities and Continuous
  Improvement gathers seven of the University's published studies under one
  observation: an automated threshold routinely decides what happened before
  the person it concerns gets a chance to agree. The campaign opens on a
  hairdressing salon's booking app, which reclassifies a twelve-minute-late
  arrival as a no-show before the stylist has looked up from the chair.
topic: >-
  a hairdressing salon's booking app that reclassifies a customer arriving
  twelve minutes late as a no-show the instant its own cutoff timer expires,
  charging the cancellation fee before the stylist at the chair has even
  looked up, checked against the paper appointment book kept behind the
  counter as backup, which still says the client showed
