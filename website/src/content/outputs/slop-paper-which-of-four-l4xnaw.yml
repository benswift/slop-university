title: Does a Forgotten Lunchbox Reach Its Child Before the Lunch Bell?
authors:
  - Lindiwe Achterberg
  - Ronja Oyelaran
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-09-29
publishedAt: "2026-09-29T13:01:23+10:00"
doi: 10.5555/slop.l4xnaw
summary: >-
  A paper from the School of Emergent Priorities follows 3,206 lunchboxes
  handed in at 19 primary-school front offices over one term, sorting each at
  the counter into a four-cell quadrant of name on the lid against arrival
  before or after morning tea, and reports the cluster's working group
  adopting the cells as a dispatch rule whose round-compliance figure reads
  100 per cent while delivery is unchanged.
topic: >-
  Which of four counter cells --- named or unnamed, before or after morning tea
  --- decides whether a forgotten lunchbox handed in at a primary-school office
  reaches its child before the lunch bell, and what should the office's
  delivery round do about it?
