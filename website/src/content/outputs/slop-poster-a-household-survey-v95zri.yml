doi: 10.5555/slop.v95zri
summary: >-
  A research poster from the School of Continuous Improvement catalogues 214
  household kitchen drawers against a shared five-category taxonomy and finds
  the aggregate composition holding within two percentage points across
  dwelling types. The resulting distribution has been adopted as a reference
  miscellany profile: a drawer departing from it by more than one category is
  now eligible for declutter-nudge outreach.
topic: >-
  a household survey of the kitchen junk drawer's contents, sorted against a
  shared taxonomy and reported as the distribution of category shares across
  the sample, which the Adaptive Metrics Lab adopts as the reference
  miscellany profile a drawer's declutter-nudge eligibility is now scored
  against
