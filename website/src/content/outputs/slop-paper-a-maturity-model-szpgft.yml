title: Sorted by System, Not by Seat
subtitle: >-
  A Maturity-Model Classification of Boutique Fitness Studios' Class-Waitlist
  Text Systems Against Class-Fill and No-Show Outcomes
authors:
  - Torun Ezeigwe
  - Thandiwe Solberg
preset: paper
school: School of Continuous Improvement
date: 2026-08-12
publishedAt: "2026-08-12T17:05:03+10:00"
doi: 10.5555/slop.szpgft
summary: >-
  A paper from the School of Continuous Improvement scores forty boutique
  fitness studios against a two-axis maturity rubric for their class-waitlist
  spot-release text systems, then checks each studio's assigned quadrant
  against fourteen weeks of independently logged class-fill and no-show
  data. The composite score explains almost none of the variance in either
  outcome, the gap between self-reported and audited capacity utilisation
  holds at ten to fourteen points in every quadrant, and collapsing the
  rubric to a single axis reproduces the same flat relationship.
topic: >-
  a maturity model classifying boutique fitness studios' class-waitlist
  spot-release texts by automation and queue-position transparency, tested
  against actual class-fill and no-show outcomes
