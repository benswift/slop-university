doi: 10.5555/slop.43f3tg
summary: >-
  A research poster from the School of Underlying Conditions follows the
  photoluminescent shared paths of a suburban precinct that switches its
  streetlights off from 00:30 to 05:00, logging afterglow on 212 segments
  across 38 spring nights and redrawing each local centre's 800 m walkable
  catchment at half-hour cross-sections. By 03:00 the three catchments hold
  58%, 43% and 20% of their lit-hours area, and the segments under heavy
  street-tree canopy go dark first, among them 71% of the planning scheme's
  green links by 02:30.
topic: >-
  the catchment after midnight: walkable isochrones on phosphorescent shared
  paths in a precinct that dims its streetlights, shrinking through the night
  and fastest under the street-tree canopy the planning scheme requires
