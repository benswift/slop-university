title: What Survives a Migration?
subtitle: Periodic Payments and Inertia at a Member-Owned Lender
authors:
  - Halvard Nnamani
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-10-13
publishedAt: "2026-10-13T01:08:59+11:00"
doi: 10.5555/slop.68ktj8
summary: >-
  A paper from the School of Emergent Priorities uses a core-banking migration
  at an unnamed member-owned lender, in which 6,214 periodic payments held in a
  superseded record format were cancelled with notice while 22,870 others were
  carried across untouched, to estimate how much of a stock of standing
  instructions persists through inertia. Within 78 weeks 55.7 per cent of the
  cancelled instructions had been set up again; re-establishment depended on
  what the payment was for and how old the instruction was, and not detectably
  on its amount.
topic: >-
  periodic payments lost in a credit union's core-banking migration, and which
  of them members bother to set up again
