summary: >-
  A marketing poster for the School of Continuous Improvement puts the
  Master of Applied Measurement in front of a suburban street library box
  --- a timber case on a front fence whose registered turnover is read off
  a monthly photograph of its spines --- and holds the distinction between
  a shelf that is turning over and one that has merely stayed full.
  Developed for bus-stop panels and campus digital signage in matched
  daylight and evening versions.
topic: >-
  the street library box on a front fence, where the volunteer network that
  registers them scores each box's turnover from a monthly photo of the
  spines behind the perspex --- so a box whose books change hands weekly
  and one nobody has opened since autumn both report a full shelf, and the
  network's restocking goes to the boxes that photograph emptiest
