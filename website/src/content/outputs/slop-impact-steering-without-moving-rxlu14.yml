summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 follows four
  areas of work in which the School took the reconfigurable metasurface as a
  model for changing an organisation one setting at a time: a one-setting rule
  for a carrier's antenna-test teams, a shared reporting template for a nine-chamber
  reference-tile round-robin, a single reconfigurable dashboard for a
  regulatory commission's six committees, and early signals for a research
  consortium's planning group.
topic: >-
  steering without moving parts: five years in which the School worked beside
  antenna and metasurface engineers and took the reconfigurable surface, a flat
  array of small cells that bends a beam with nothing moving, as its model for
  redirecting an organisation by small local adjustments rather than
  restructures
