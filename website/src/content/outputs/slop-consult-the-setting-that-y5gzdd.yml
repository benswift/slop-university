title: Allocating Time on the Shared Hydraulic Test Loop
subtitle: >-
  A Department of Policy Settings consultation paper on whether the Slop
  University (Hydraulic Test Loop) Determination 2026 should go on apportioning
  the loop's run-time among the schools by research headcount
authors: []
preset: consultation-paper
date: 2026-11-25
publishedAt: "2026-11-25T21:01:48+11:00"
doi: 10.5555/slop.y5gzdd
summary: >-
  A consultation paper from the Department of Policy Settings invites
  submissions on the Hydraulic Test Loop Determination 2026, which apportions
  the shared loop's quarterly run-time among the schools by research headcount,
  with a ten-hour minimum, no transfers and lapse at quarter's end. Reporting
  that 41 per cent of the first full quarter's loop-hours lapsed while two
  schools exhausted theirs in five weeks, it cites three of the University's
  outputs on test design, line restarts and shift-log vocabulary, sets out three
  options from retaining the setting to booked windows and concurrent use under
  a pressure floor, and offers a preliminary view favouring booked windows with
  a changeover condition.
topic: >-
  the setting that apportions run-time on the University's shared hydraulic
  test loop among the schools by research headcount, and whether it should give
  way to booked windows or to a draw suspended whenever loop pressure falls
  below a floor
