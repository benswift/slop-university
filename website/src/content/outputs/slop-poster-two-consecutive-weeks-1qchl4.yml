title: "Always a Five"
subtitle: "Self-Report Inflation Under an Automated Wellbeing-Escalation Trigger"
authors:
  - Dagny Okafor
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-16
