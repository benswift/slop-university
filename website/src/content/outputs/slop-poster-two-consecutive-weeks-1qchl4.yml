doi: 10.5555/slop.1qchl4
summary: >-
  An interview study of thirty-four staff at three open-plan employers finds
  self-reported wellbeing-survey scores rising once an automatic two-week
  escalation rule begins, while independently coded interview sentiment for
  the same participants holds flat across the same window.
topic: >-
  Two consecutive weeks under three out of five is what triggers a mandatory
  wellbeing check-in on a weekly pulse-survey bot, and an interview study of
  open-plan staff finds out what the number they type is actually reporting
  once it can summon a meeting.
