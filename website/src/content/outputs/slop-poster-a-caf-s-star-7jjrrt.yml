doi: 10.5555/slop.7jjrrt
summary: >-
  A research poster from the School of Continuous Improvement matches 214
  suburban cafés' baseline directory-app star ratings against their trading
  status eighteen months later. The rating showed no association with
  survival at any threshold tested, and the University's Trusted Local
  placement gate, set at the same rating, continues unrevised.
topic: >-
  a café's star rating on a suburban directory app bears no relationship to
  whether it is still trading eighteen months later, reported flatly with no
  salvage and no further trial proposed
