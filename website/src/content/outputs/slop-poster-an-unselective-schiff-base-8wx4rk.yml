summary: >-
  A research poster from the School of Underlying Conditions times the
  fluorescence response of a single unselective Schiff-base probe to metal
  cations in dilute-acid leachates of crushed drill core from one borehole.
  Endpoint emission cannot separate aluminium from gallium, but fitted response
  half-times, taken with the sign of the response, give four non-overlapping
  signatures across six leachate matrices and resolve a two-ion mixture from
  one trace.
topic: >-
  An unselective Schiff-base fluorescent probe tells which metal cation it has
  bound in drill-core leachate by how fast it lights up, so rise time rather
  than brightness is the selective signal
