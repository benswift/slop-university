title: The Joke Was Never About You
subtitle: Despite Staff Denials, Customer Experience Auto-Flags Accounts for Recurring Joke Names
authors:
  - Hedvig Anyanwu
  - Casimir Beng
  - Verity Marris
preset: research-poster
school: School of Emergent Priorities
