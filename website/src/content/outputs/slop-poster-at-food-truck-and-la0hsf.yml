doi: 10.5555/slop.la0hsf
summary: >-
  A research poster from the School of Emergent Priorities interviews counter
  staff at 19 food-truck and cafe sites about the joke or fabricated order
  names they use to privately resequence service during a rush, and reports
  a franchise customer-experience office reading the same point-of-sale
  field as a formal signal, auto-flagging a loyalty account as
  high-maintenance whenever a joke name recurs, with no staff sign-off,
  review date, or override.
topic: >-
  At food-truck and cafe counters, staff describe in interview treating a
  customer's joke or obviously fake order name as a private signal for how
  demanding that customer will be, using it to quietly resequence who gets
  served first during a rush; although staff insist this is a private
  coping game and never a judgement of the customer, a franchise's
  customer-experience office has begun mining the point-of-sale system's
  saved order-name field and applying a formal high-maintenance flag to the
  customer's loyalty account whenever a joke name recurs.
