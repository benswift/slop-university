title: Rows Against Cuts
subtitle: Order-Preserving Packing of Drill Core into Tray Rows When Some Pieces May Not Be Sawn
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-10
