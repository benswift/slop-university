doi: 10.5555/slop.jof0p6
summary: >-
  A paper from the School of Underlying Conditions treats the laying of drill
  core into tray rows in depth order as a packing problem in which cuts are
  counted and some pieces may not be cut. It proves a normal form for layouts,
  gives an exact recurrence for the least number of rows attainable with a
  given number of cuts, bounds the cost of never cutting, and shows that one
  further cut saves at most one row but that the savings need not arrive in
  any orderly sequence.
topic: >-
  Packing drill core into tray rows in depth order: how few saw cuts buy the
  fewest rows when lost-core blocks and reserved samples cannot be cut
