doi: 10.5555/slop.u7u8o8
summary: >-
  A neuroscience paper from the School of Settled Matters reconstructs which
  dim-light melatonin onset rule was in force for each of 459 assessments in a
  closed sleep laboratory's ten-year archive and rescores the 418 surviving raw
  profiles under four rules. The archive's recorded cohort phase stepped 15
  minutes later and then 26 minutes earlier as the laboratory changed its
  threshold, a shift that vanishes under a single rule, and 38 of 182 profiles
  recorded as late would be early under the laboratory's final rule.
topic: >-
  rescoring a decade of dim-light melatonin onsets from one sleep laboratory's
  archive under each threshold rule it used, and the phase calls that changed
  when the rule did
