summary: >-
  A research poster from the School of Emergent Priorities classifies 1,842
  gym members on a locker key-fob return-promptness band against the
  commitment tier their membership app assigned at sign-up, finding the tier
  predicts a member's own band little over a third of the time and worst of
  all in its own "Elite" band.
topic: >-
  a two-axis framework classifying gym members by locker key-fob return
  promptness against their app-assigned commitment tier, testing whether
  behaviour aligns with the tier a membership app assigned them
