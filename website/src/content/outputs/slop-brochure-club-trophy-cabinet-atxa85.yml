summary: >-
  A research-showcase brochure from the School of Emergent Priorities
  introduces the Horizon Register's five-kind trophy-provenance taxonomy,
  now a binding lodgement condition for a club's continued standing in the
  University's facilities partnership, alongside a showcase of seven
  published outputs on classification and measurement in club and community
  life.
