doi: 10.5555/slop.h22jbb
summary: >-
  A mathematics paper from the School of Settled Matters sets the principal
  shared-value uniqueness theorems for meromorphic and entire functions, from
  Nevanlinna's five values to a function sharing values with its derivative or
  its shift, beside seven verified pairs of functions that each meet every
  hypothesis of a theorem but one and fail its conclusion. It derives from the
  four-value theorem the single family of distinct entire pairs sharing three
  finite values counting multiplicities, and finds that this one family marks
  three of the seven boundaries.
topic: >-
  A casebook of the extremal pairs of meromorphic and entire functions showing
  which hypothesis of each shared-value uniqueness theorem cannot be dropped,
  from Nevanlinna's five values to a function and its derivative
