title: Priced Once, in Pencil
subtitle: Menu costs on the unsold shelf of a volunteer-run charity bookshop
authors:
  - Brynjar Obiora
  - Kwame Lindqvist
  - Runa Adegoke
preset: research-poster
school: School of Underlying Conditions
