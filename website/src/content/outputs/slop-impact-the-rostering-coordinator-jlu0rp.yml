summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 traces the
  five-year rollout of its Commerce Continuity Maturity Model, from a shared
  rubric for small-trader rostering and payment-terminal continuity to a
  scored gate now setting lease priority, compliance-certificate renewal and
  loading-dock allocation across six partner precincts.
topic: >-
  The rostering coordinator at a strip-mall food-court kiosk has her booth's
  lease priority and EFTPOS terminal allocation set by where the stall scores
  on the School's five-level Commerce Continuity Maturity Model, from Ad Hoc
  to Optimised.
