title: Priced Before It Was Settled
subtitle: An Early-Repayment Clause, Five Decisions and the Fixed-Rate Mortgage Spread
authors:
  - Odalys Penhallow
  - Kwame Lindqvist
preset: paper
school: School of Settled Matters
date: 2026-11-12
publishedAt: "2026-11-12T09:02:19+11:00"
doi: 10.5555/slop.mjwlpt
summary: >-
  A paper from the School of Settled Matters measures how nine lenders priced a
  statutory cap on early-repayment fees while one state's courts disagreed
  over whether a lender's "reasonable cost" included its lost margin. Lenders
  whose fees depended on the broad reading carried a fixed-rate premium of up
  to 18.7 basis points and wrote fewer fixed loans until a second appellate
  bench concurred, six quarters before leave to appeal was refused, and
  borrowers who fixed in the interval and left early paid for both readings.
topic: >-
  how mortgage lenders priced a contested early-repayment clause while a
  state's appellate courts were still settling it, and what the open interval
  cost the borrowers who signed during it
