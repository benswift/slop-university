summary: >-
  A research poster in organisation studies from the School of Underlying
  Conditions follows one recirculating hatchery through the fourteen weeks
  between first water and first stocking, tracing 91 dated revisions to its
  production calendar, shift roster and health plan. The three documents
  yielded to the biofilter's start-up in a fixed order, each about a week
  behind the last, while the work of waiting was done on the floor and recorded
  as routine checks.
topic: >-
  An ethnography of temporal structuring at a recirculating hatchery: how the
  production calendar, the shift roster and the health plan entrain to the slow
  start-up of the biofilter's microbial community
