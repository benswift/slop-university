doi: 10.5555/slop.sg0x7q
summary: >-
  A research poster from the School of Underlying Conditions reads fourteen
  months of a merged wholesale distributor's vendor-master review log and finds
  that data stewards' merge decisions followed the name, address and tax-number
  fields on the review screen's first tab, while bank details, held on a second
  tab opened in 11% of reviews, moved the merge rate by only three to seven
  points.
topic: >-
  how data stewards decided which of a merged wholesale distributor's duplicate supplier records were one supplier during an ERP consolidation, read from the merge review log against the fields the review screen put side by side
