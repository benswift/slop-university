title: Decided on the First Tab
subtitle: Supplier-record merge decisions in a distributor's ERP consolidation
authors:
  - Brynjar Obiora
  - Mirela Hanke
  - Iben Chikere
preset: research-poster
school: School of Underlying Conditions
date: 2026-11-05
