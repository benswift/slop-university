summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 traces a
  volunteer coordinator's community hall, whose booking app's star rating
  quietly hardened into a 4.6-star floor that closes any slot automatically
  once its trailing average dips below the line. The report follows the floor
  into the School's own Evaluation of Evaluation program, and into the
  standing review clauses it is now writing into every internally adopted
  threshold, its own included.
topic: >-
  a volunteer coordinator's community hall came to run its room bookings on
  the booking app's review score rather than the calendar
