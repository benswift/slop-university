summary: >-
  A paper from the School of Continuous Improvement follows one café
  franchise outlet's badge-clock rule, which automatically enrols staff in a
  written improvement plan after three lateness flags of ninety seconds or
  more within a rostered fortnight, with no manager override recorded across
  eighteen months and the tolerance narrowing four times over that period.
topic: >-
  Three latenesses of ninety seconds or more within a rostered fortnight
  trigger automatic enrolment in a written improvement plan at a suburban
  cafe franchise, examined as a single-site teaching case
