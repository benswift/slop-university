summary: >-
  A marketing poster for the Master of Applied Measurement sorts 3,140
  performance-review self-assessments into four named cells by word count and
  rating, and sets out the length at which a form's rating box now unlocks.
  Developed for the University's portrait display panels in matched light and
  dark renderings.
topic: >-
  Two hundred and twelve words is the length at which a performance-review
  self-assessment stops being rated Meets and starts being rated Exceeds, and
  the four named cells (Plain Meeters, Fluent Meeters, Plain Exceeders, Fluent
  Exceeders) that 3,140 self-assessments sort into by word count and rating, on
  the strength of which the University fixed the word count a form must reach
  before its rating box unlocks
