title: How Many Words Make an Exceeds?
subtitle: >-
  Self-assessment length against rating across 3,140 performance reviews, and
  the word count now fixed before a rating box unlocks, as an intake campaign
  for the Master of Applied Measurement
authors:
  - Renke Sabel
  - Dagny Okafor
