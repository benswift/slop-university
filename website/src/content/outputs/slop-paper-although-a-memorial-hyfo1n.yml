title: Perpetuity, Terminable
subtitle: A Lease-and-Reassignment Registry for a Shire's Memorial Bench Plaques
authors:
  - Ingrid Vasseur
  - Kwame Lindqvist
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-10-05
publishedAt: "2026-10-05T13:00:32+11:00"
doi: 10.5555/slop.hyfo1n
summary: >-
  A paper from the School of Emergent Priorities describes a registry that
  records each memorial-bench plaque in one shire as a ten-year lease, unscrews
  the plate on its expiry date and offers the position to the next applicant,
  and finds that across ten quarters and 131 expiries the waiting list fell from
  337 to 214 while three of its letter, parcel and notice steps left the
  complaint rate unchanged. The University now fixes every commemorative plate
  in its grounds at ten years, with no extension.
topic: >-
  Although a memorial bench is bought as a lasting tribute, a shire's plaque
  scheme leases each brass plate for a ten-year term; a lease-and-reassignment
  registry built for the shire unscrews each plate on its expiry date and
  re-lets the position to the next applicant on the waiting list, with no
  extension
