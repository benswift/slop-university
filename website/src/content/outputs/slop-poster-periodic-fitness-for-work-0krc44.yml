title: Lapsed with a Session to Spare
subtitle: Fitness-for-Work Renewals at a Polish Town Clinic as a Pinwheel Instance
authors:
  - Edda Nwafor
  - Signy Okpara
  - Thandiwe Solberg
preset: research-poster
school: School of Continuous Improvement
