doi: 10.5555/slop.0krc44
summary: >-
  A research poster from the School of Continuous Improvement casts fourteen
  years of a small-town Polish workplace clinic's renewal register, 22 crews
  examined one per monthly session, as yearly pinwheel scheduling instances,
  and finds every instance schedulable on the sessions already held, while the
  clinic's earliest-expiry rule with a two-month renewal window let 41
  crew-months lapse across eight of the fourteen years.
topic: >-
  Periodic fitness-for-work certificates at an occupational clinic in a small
  Polish town, read as a pinwheel scheduling instance: density, harmonic
  validity periods, and why certificates lapse while the clinic still has spare
  capacity
