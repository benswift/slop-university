title: No Cent Wasted
subtitle: A Regression-Discontinuity Estimate of Cash-Total Bunching at Australia's Five-Cent Rounding Line
authors:
  - Petra Umbile
  - Casimir Beng
  - Dagny Okafor
preset: paper
school: School of Emergent Priorities
date: 2026-09-26
publishedAt: "2026-09-26T07:01:05+10:00"
doi: 10.5555/slop.x8vv6e
summary: >-
  A regression-discontinuity study applies McCrary's density test to 1.42
  million cash transactions across a supermarket chain, two strip-mall
  traders' associations and a food-truck market, finding basket totals
  cluster on the side of Australia's five-cent rounding line that already
  favours the shopper, with no matching pattern in the same registers'
  card-paid totals. The Adaptive Metrics Lab has directed every campus
  retail concession that accepts cash to reprice its menu around the
  finding.
topic: >-
  Five cents is the width of Australia's cash-rounding band at the register,
  and the naturally occurring cutoff at each nickel boundary lets a
  regression-discontinuity design test whether basket totals at the
  supermarket, the strip-mall trader and the food truck cluster on the side
  that rounds down
