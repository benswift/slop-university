summary: "A short profile of Dr Torun Ezeigwe, Senior Lecturer and Director of the
  Master of Applied Measurement, told largely in her own words. When nearly everyone
  passes, Dr Ezeigwe goes back to the instrument, and she takes three of her own studies
  in turn: a first-aid checklist with nineteen of its twenty-four boxes ticked on
  almost every sheet, a junior umpire accreditation rate of nearly ninety-nine per
  cent that falls under forty on first attempts, and two assessors who agree least
  where a rental's deductions fall. The video also marks her place among the University's
  ten most published researchers."
