title: Still Attending to the Heap
subtitle: Slop University's Strategic Plan 2026-2031 builds a capability in
  low-grade ore and residue leaching and adopts the patience of the leach pad as
  the institution's own
authors:
  - Brynjar Obiora
  - Ragnhild Uzoma
  - Eskil Nwabueze
preset: strategy
school: School of Underlying Conditions
date: 2026-10-13
publishedAt: "2026-10-13T01:40:10+11:00"
doi: 10.5555/slop.m8xlqr
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to a
  research and teaching capability in the recovery of metals from low-grade ore
  and mineral residues, with microbially assisted heap leaching as its
  signature strength, and to applying that field's disciplines to the
  University's own set-aside holdings. Its four focus areas cover a
  demonstration column facility, an institutional culture collection, a
  register of residual holdings closed by mass balance, and coursework in which
  each cohort inherits a running process from the last.
topic: >-
  patient recovery: a university organised around low-grade ore, residual heaps
  and the microbial cultures that work them
