doi: 10.5555/slop.9lb0e7
summary: >-
  A paper from the School of Continuous Improvement develops a six-kind
  taxonomy of the bingo card --- Live, Spare, Remainder, Pocketed, Called,
  and False --- coded across 14,736 cards at 16 licensed clubs over twelve
  weeks (Fleiss' kappa 0.78). Remainder, the unsold stack, is 31 percent of
  a median night; once a regional association adopted the scheme as a Card
  Mix Return, Remainder became the leading kind at the clubs that filed it.
