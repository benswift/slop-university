title: Nearly Means Nine
subtitle: >-
  The School of Continuous Improvement's Impact Report 2021-2026, on the
  minutes behind a "nearly there" at the school gate and the bus stop
authors:
  - Osei Vandermeer
  - Marit Osayande
  - Torun Ezeigwe
preset: impact-report
school: School of Continuous Improvement
date: 2026-10-02
publishedAt: "2026-10-02T04:00:55+10:00"
doi: 10.5555/slop.1xfl8o
summary: >-
  The School of Continuous Improvement's five-year impact report follows the
  phrase "nearly there" through two surveys of 7,412 people at school gates and
  bus stops, reports the stated minutes as distributions, and records the band
  the School's collaborators printed beneath the phrase and the standing rule
  the School adopted for its own use of it.
topic: >-
  How long is 'nearly there' when it is texted from a school-run car park or a
  bus stop, and what may a timetable promise on the strength of the answer?
