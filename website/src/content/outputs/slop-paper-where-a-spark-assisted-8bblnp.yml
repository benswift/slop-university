summary: >-
  A paper in chemical engineering from the School of Underlying Conditions and
  the School of Continuous Improvement classifies 3,000 cycles of a
  single-cylinder research engine as flame-dominated, mixed or
  autoignition-dominated while intake temperature is stepped from 70 to
  120 °C. Between about 80 and 107 °C no class holds 80% of cycles, the
  autoignition fraction there is spread in a single broad mode rather than
  two populations, and a cycle's early flame largely settles its class: at
  100 °C each crank-angle degree of earlier CA10 roughly doubles the odds of
  autoignition dominance.
topic: >-
  where a spark-assisted compression ignition engine's cycles stop being flame
  propagation and become end-gas autoignition: classifying 3,000 cycles by heat
  release across an intake-temperature sweep in a single-cylinder research
  engine, and the transitional band between the two regimes
