title: The Flame Decides
subtitle: Cycle-Resolved Regime Classification of Spark-Assisted Compression Ignition Across an Intake-Temperature Sweep
authors:
  - Brynjar Obiora
  - Casimir Beng
preset: paper
school: School of Underlying Conditions
