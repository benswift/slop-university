summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 presents four
  case studies of its work with the fiscal councils, statistics agencies and
  audit offices of a monetary union: a vintage register and estimate statement
  for output-gap estimates, a reporting guide and banded comparative table for
  reading the fiscal reference values, a harmonised exclusion register with
  review dates for the expenditure benchmark, and a redrafted notification
  calendar for the annual surveillance cycle.
topic: >-
  fiscal rules as indicators: the School's five years helping European fiscal
  councils measure the output gap, the debt anchor and the expenditure
  benchmark
