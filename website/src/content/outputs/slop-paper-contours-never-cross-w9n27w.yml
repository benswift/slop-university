title: Contours Never Cross
subtitle: How a Cartographic Rule Shapes Geoscience Students' Concept Images of Level Sets
authors:
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-23
publishedAt: "2026-10-23T05:01:56+11:00"
doi: 10.5555/slop.w9n27w
summary: >-
  A paper from the School of Underlying Conditions gives a six-item level-set
  instrument to 187 students in a second-year service calculus unit and
  interviews twelve who had completed field mapping, finding that the
  field-mapping students read contour diagrams better at regular values but
  reject the self-crossing contour at a saddle (13% accept it, against 38% of
  their classmates), and that a task shifting the contour interval moves ten
  of the twelve to an account in which the crossing depends on where the
  counting starts.
topic: >-
  contours never cross: how earth-science undergraduates' field-map rules for
  contour lines shape their concept images of level sets in a service
  multivariable calculus course, read against the saddle where a level set
  does cross itself
