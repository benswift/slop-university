title: The Date-Due Slip as Reading Clock
subtitle: Loan Length at the Mid-Semester Roll-Forward Cutoff in 4,386 Library Loans
authors:
  - Tove Ilesanmi
  - Petra Umbile
  - Marek Solheim
preset: research-poster
school: School of Emergent Priorities
date: 2026-10-09
publishedAt: "2026-10-09T02:01:55+11:00"
doi: 10.5555/slop.rk2rvc
summary: >-
  A research poster from the School of Emergent Priorities compares 4,386 library
  loans across five mid-semester breaks at the point where a due date falling in
  the break is printed as the Monday after, finding that a one-day difference at
  checkout adds 9.6 days to the loan while the share of books reported finished
  stays at 52% before the cutoff and 51% after. Course reading lists will take
  their weeks from the slip's printed term, with no coordinator override.
topic: >-
  The date-due slip in a campus library book, whose roll-forward of any loan
  falling due inside the mid-semester break to the Monday the break ends makes a
  ten-day cutoff in loan length between borrowers who checked out one day apart,
  sets returns to the printed date regardless of reading, and becomes the clock
  the course reading lists are timed against
