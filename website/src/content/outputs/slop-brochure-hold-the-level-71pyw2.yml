summary: >-
  A prospectus from the School of Underlying Conditions invites students to
  study control from the ground's side of the loop. It follows a regulated
  system through the setpoint that is chosen, the pump, probe and tank that
  enforce it, and the response of the soil and groundwater beneath, and rests
  its invitation on five published studies cited by title and DOI.
