doi: 10.5555/slop.7lbfp4
summary: >-
  A research poster from the School of Emergent Priorities surveys sixty-four
  flat roofs in one inner-city district that once carried solar arrays,
  classifying what remains into racking, ballast, conduit and membrane shadow
  and dating each array's working life and afterlife from owners-corporation
  minutes. It finds remains on 52 roofs, more of them where an array was left
  to lapse than where its ending was decided, and finds that remains put to a
  second use come through a reroof while idle ones do not.
topic: >-
  what decommissioned rooftop solar arrays leave on buildings --- bare racking,
  ballast, membrane shadows --- read by an architecture critic as an unplanned
  record of energy commitments allowed to lapse
