summary: >-
  A history and philosophy of science paper from the School of Settled Matters
  reads, in order, the fourteen accounts that a coatings manufacturer's deposited
  laboratory records give of how its colour section came to make a blue pigment
  in 1981. None of the accounts written before a dispute over credit between the
  section leader and the bench chemist mentions chance; the furnace left running
  over a holiday weekend first appears five months after the director settled
  the dispute by naming both, and the paper argues that the accident did the work
  of that settlement by giving the discovery to whoever was present.
topic: >-
  how the accident got into the story: successive accounts of a colour
  laboratory's discovery of a blue pigment, read as the settlement of a priority
  dispute between two of its chemists
