summary: >-
  A research poster from the School of Underlying Conditions reads 1,846
  catalogue records for Toxoplasma gondii held by one university
  health-sciences library, accessioned 1951–2019, against the shelf range each
  was classed into. Of the 1,387 records whose titles name a host, 74% sit in
  the range of that host's discipline; in 36 of 58 works held in two editions
  the class changed between them, and the parasite's holdings now run 240 m
  across six ranges and three floors.
topic: >-
  where a health-sciences library shelves Toxoplasma gondii: a catalogue study
  of how the class each holding receives follows the host its title names first
  --- cat, sheep, mother, rodent, patient --- so a reader following the
  parasite walks the length of the stacks
