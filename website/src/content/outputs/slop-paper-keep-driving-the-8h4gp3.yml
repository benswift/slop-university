doi: 10.5555/slop.8h4gp3
summary: >-
  A paper from the School of Underlying Conditions reads the diesel particulate
  filter regeneration notice as a genre, across 37 owner's handbook editions,
  164 dashboard photographs and 412 driver defect slips from one regional
  council fleet's workshop archive. Over three periods of issue the handbooks
  stop naming what the filter holds (soot, then particles, then deposits, then
  only "the filter") while the cleaning passes from a process the vehicle
  performs to a task the driver is asked to help with; the fleet's drivers,
  whose routes belong to the depot, answer the notice's request to keep driving
  on their defect slips, 131 of which record a detour taken to clear it.
topic: >-
  keep driving: the diesel particulate filter regeneration notice as a mode of
