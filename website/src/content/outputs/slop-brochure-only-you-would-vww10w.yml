summary: >-
  A prospectus for prospective students is arranged around the three security
  questions every new student sets on enrolment day, the name of a first
  school, the street they grew up on and the teacher they remember, and takes
  each as the way into one of the University's three Schools. It cites five
  published studies on how people, places and systems recognise one another,
  profiles three doctoral candidates, and closes on the University's promise to
  keep the answers.
