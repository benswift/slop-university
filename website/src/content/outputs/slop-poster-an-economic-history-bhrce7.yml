summary: >-
  A research poster from the School of Settled Matters reads eight versions of
  one immunotoxin consortium's licence agreement against 104 quarterly cost
  sheets, 1981–2006. The toxin chain's share of unit production cost fell from
  47% to 6% while its half of the royalty was retyped verbatim in seven of the
  eight versions, and 31 of 44 substantive edits fell instead on the definition
  of "Conjugate", through which the parties moved new formats in and out of the
  royalty base.
topic: >-
  An economic history of an invented immunotoxin consortium's licence ledger,
  1981-2006: the royalty share fixed for the toxin half of the conjugate
  outlived the production costs that once justified it
