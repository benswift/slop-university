title: Half the Molecule, Half the Royalty
subtitle: Contract Persistence in an Immunotoxin Licence Ledger, 1981–2006
authors:
  - Anselm Threlkeld
  - Odalys Penhallow
  - Sunniva Balogun
preset: research-poster
