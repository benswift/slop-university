title: Saturated at the Tank
subtitle: Rock-salt core lost to a recirculated brine drilling fluid tracks its undersaturation at the bit, not the length of the run
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: research-poster
school: School of Underlying Conditions
