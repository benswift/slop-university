doi: 10.5555/slop.k3vz8q
summary: >-
  A research poster from the School of Underlying Conditions reconstructs the
  saturation state of a recirculated sodium chloride brine at the bit for 31
  cored runs through one halite interval and models the salt lost from each run
  as film-controlled dissolution. The brine read saturated in the mud tank on
  every run, yet ran 0.9 to 6.1% undersaturated at the warmer bit, and the
  halite lost per run followed that undersaturation (r = 0.97), peaking in the
  twelve runs cut within one circulation of a make-up water addition, while
  drilled length and bit hours explained little.
topic: >-
  rock-salt core lost from one evaporite drilling program, read as a
  mass-transfer problem: the recirculated brine drilling fluid that is
  saturated in the mud tank falls below saturation at the bit after make-up
  water and downhole warming, and the lost intervals track that
  undersaturation, not run length
