title: The Lessons Nobody Watched
subtitle: >-
  Candidate Selection of Formally Observed Lessons in a Final Secondary
  Practicum, and a Recovery Statement for the Practicum Report
authors:
  - Ragnhild Uzoma
  - Torun Ezeigwe
preset: paper
school: School of Underlying Conditions
date: 2026-10-31
publishedAt: "2026-10-31T01:31:34+11:00"
doi: 10.5555/slop.ppjhh8
summary: >-
  A paper from the School of Underlying Conditions and the School of
  Continuous Improvement sets the complete lesson logs of 52 pre-service
  secondary teachers (5,412 lessons) against the 156 lessons their
  supervisors formally observed, each chosen by the candidate. Observed
  lessons were disproportionately new-content lessons with the candidate's
  most settled class, often rehearsed on a parallel class earlier in the
  week, and only two were assessment lessons; mentor notes rated them 0.49
  points higher on a four-point scale, a gap that reweighting on the recorded
  features of the choice closes only by a little over half. The paper
  proposes a recovery statement for the practicum report, recording how many
  lessons were taught and seen, who chose them, and which domains were rated
  without observation.
topic: >-
  which lessons pre-service teachers put forward for their supervisor's formal
  practicum observations, and what the final practicum report is entitled to
  say about the lessons nobody observed
