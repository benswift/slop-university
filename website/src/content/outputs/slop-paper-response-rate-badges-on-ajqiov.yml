title: The Same Ninety-Eight Per Cent, Read Three Ways
subtitle: A Population Survey of What Booking-App Guests and Hosts Believe a Host's Response-Rate Badge Certifies
authors:
  - Ronja Oyelaran
  - Kwame Lindqvist
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-09-16
publishedAt: "2026-09-16T03:36:49+10:00"
doi: 10.5555/slop.ajqiov
summary: >-
  A paper from the School of Emergent Priorities surveys 1,412 booking-app
  guests and hosts, stratified by account tenure and booking frequency, on
  what a host's published response-rate percentage is believed to certify
  and the lowest value at which they would still book. Belief splits close
  to evenly across three readings in every stratum tested, and stated trust
  thresholds vary widely enough that a single published cutoff sits above
  some respondents' threshold and below others', reading the identical
  figure; showing respondents the platform's own definition of the metric
  beforehand changes neither distribution.
topic: >-
  a population survey of booking-app guests and hosts measuring what they
  believe a host's published response-rate percentage badge actually
  certifies (speed, certainty of acceptance, or politeness) and the trust
  threshold at which they'd still book, reported as distributions by user
  tenure and booking frequency
