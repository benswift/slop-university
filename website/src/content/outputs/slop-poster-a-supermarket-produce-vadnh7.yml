summary: >-
  A research poster from the School of Emergent Priorities reports a
  twenty-six-week trial in four supermarkets in which the overhead mister above
  the leafy greens was switched on and off in alternating weeks, and finds no
  difference in the weight of greens sold per thousand shopper entries: 61.6 kg
  with the mist on against 61.3 kg with it off, with an interval that spans
  zero. Every produce mister on University premises is now recorded as a fixed
  installation, changeable only after a twenty-six-week alternating-weeks trial
  of its own.
topic: >-
  A supermarket produce manager switches the overhead mist sprayer over the
  leafy-greens display on and off in alternating weeks through a full trading
  season and finds the weight of greens bought does not move; the University
  binds every produce mister to its found setting, changeable only after a
  26-week alternating-weeks trial
