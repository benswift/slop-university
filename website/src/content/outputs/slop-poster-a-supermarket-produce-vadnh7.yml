title: Measuring the Mist
subtitle: A Twenty-Six-Week Alternating-Weeks Trial of the Produce Mister Over the Leafy Greens, Four Stores
authors:
  - Iben Chikere
  - Joost Nwosu
  - Runa Adegoke
preset: research-poster
school: School of Emergent Priorities
