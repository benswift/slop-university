title: Before the Axis Settles
subtitle: A Heterotypic Stressor Met Mid-Habituation to Repeated Restraint Draws a
  Larger, Slower-Resolving Corticosterone Response in the Rat
authors:
  - Odalys Penhallow
  - Eivind Onwuka
  - Eskil Nwabueze
preset: paper
school: School of Settled Matters
date: 2026-11-14
publishedAt: "2026-11-14T05:32:19+11:00"
doi: 10.5555/slop.7ap69h
summary: >-
  A paper from the School of Settled Matters and the School of Continuous
  Improvement fits a per-animal settling criterion to the corticosterone
  response across ten daily restraint sessions in 48 rats, then delivers an
  unfamiliar elevated-platform stressor either before any animal could have
  settled or after most had. Both histories raised the peak response, but only
  the early group's response resolved slowly, with an integrated response 61%
  above controls and a decline half-time of 31 min against 20; Fos counts in two
  regions followed the same ordering.
topic: >-
  a novel stressor delivered while the rat corticosterone response to repeated
  restraint is still habituating, before it has settled, draws a larger and
  slower-resolving response than the same stressor delivered after
