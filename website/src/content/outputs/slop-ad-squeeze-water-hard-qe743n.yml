summary: >-
  A marketing poster for Slop University features doctoral candidate Ylva
  Ogunbanjo at the microscope beside a diamond anvil cell, a backyard washing
  line through the window behind her, and invites passers-by to meet the
  researchers who follow water from the clothes line to the pressures at which
  it freezes without the cold. Composed for bus-stop panels and campus digital
  signage in a portrait rotation.
