summary: >-
  A research poster from the School of Emergent Priorities sets crate hire for a
  staged office restack as a newsvendor problem and replays three order rules
  across 187 stages of 41 archived restacks. Scarf's distribution-free rule
  costs 1.09 times the hindsight optimum against 1.38 for the per-desk
  allowance, but crates carried forward sealed from stage to stage account for
  37% of all crate-weeks hired.
topic: >-
  how many moving crates to hire for a staged office restack, set as a
  distribution-free newsvendor problem and replayed against archived moves in
  which a share of crates went back unopened
