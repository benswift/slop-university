summary: >-
  A research poster from the School of Continuous Improvement times 5,812
  exits at eight public car-park ramps while the boom is stuck open, and
  finds the attendant's wave-through does not shorten the pause. The
  University enters the wave on a Settled Null Register, forbids waving a
  raised boom at a listed site, and adopts the observed pause as the minimum
  authorised exit dwell.
topic: >-
  the boom-gate attendant finds no shortening of exit pause under a
  stuck-open arm
