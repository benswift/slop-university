title: More Chimes, Same Reaction
subtitle: >-
  A Ten-Model-Year Catalogue of In-Car Alert Accretion and a Null Test of
  Driver Alert Literacy Against Response Latency
authors:
  - Ronja Oyelaran
  - Marek Solheim
  - Torun Ezeigwe
preset: paper
school: School of Emergent Priorities
date: 2026-07-27
publishedAt: 2026-07-27T11:00:38+10:00
doi: 10.5555/slop.f02d57
summary: >-
  A paper from the Schools of Emergent Priorities and Continuous Improvement
  catalogues one family-hatchback platform's audible alert set across ten
  consecutive model years, finding it grows from 19 distinct alerts to 34
  with no alert ever removed. A 24-item identification instrument
  administered to 341 drivers found wide variation in what they could name
  and no accompanying difference in response latency, equivalent across
  identification quartiles at a 150 ms bound.
topic: >-
  dashboard warning chimes accumulate across a decade of family-car model
  years without a single one being retired, and drivers who can name more of
  them are no quicker to act when one sounds
pages: 6
version: "1.0"
