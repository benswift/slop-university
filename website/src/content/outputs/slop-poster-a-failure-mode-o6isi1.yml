title: A Criticality Analysis of the Folding Event Marquee
subtitle: >-
  141 failure modes, and a control schedule larger than the volunteer base it
  protects
authors:
  - Bram Ntuli
  - Marit Osayande
  - Anneke Tolan
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-18
publishedAt: 2026-08-18T00:04:20+10:00
doi: 10.5555/slop.o6isi1
summary: >-
  A research poster from the School of Continuous Improvement runs a full
  failure mode, effects and criticality analysis over the folding marquee
  erected at community events, enumerating 141 failure modes across 47 marquees
  observed at 96 events and scoring each on a pre-registered severity,
  occurrence and detection scale. Thirty-eight modes clear the ratified action
  threshold of RPN 100; the highest-ranked is not structural but stowing the
  canopy damp, which surfaces a median sixteen days later to a different crew
  and retains a residual RPN of 288 once the recommended control is applied.
  The control schedule the ranking generates specifies 214 documented checks per
  event against a median volunteer base of nine, and has been adopted in full by
  the Indicator Commons.
topic: >-
  A failure mode, effects and criticality analysis of the sort written for
  ventilators and aircraft subsystems, run end-to-end over the folding marquee
  erected at community events, and the control schedule its ratified
  risk-priority threshold generates --- more documented checks per event than
  the event has volunteers
