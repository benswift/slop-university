summary: >-
  A paper from the School of Underlying Conditions describes a bench rig that
  rolls one passive laminate-keel prosthetic foot across four prepared and
  described soil beds in place of a rigid plate. The foot's roll-over radius of
  362 mm on the plate fell on a first pass to between 341 mm on air-dry clay
  loam clods and 203 mm on loose sand; a series-compliance model accounted for
  the clay-loam beds but not the sand, and eight passes along the same lane
  restored most of the lost radius on the sandy beds and almost none on moist
  clay loam.
topic: >-
  a bench rig that rolls a passive prosthetic foot across beds of described field soil instead of the test standard's rigid plate, and what the ground's compliance does to the foot's roll-over shape
