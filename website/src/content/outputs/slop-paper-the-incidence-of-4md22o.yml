title: Who Pays for the Candidate's Breakfast?
subtitle: Examination Timing and the Incidence of a Demand Shock at a Rural Periodic Market
authors:
  - Petra Umbile
  - Sunniva Balogun
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-10-15
publishedAt: "2026-10-15T17:01:56+11:00"
doi: 10.5555/slop.4md22o
summary: >-
  A paper from the School of Emergent Priorities uses the year-to-year movement
  of a national school-leaving examination across a seven-week window to trace
  an exam-week demand shock for eggs through eleven years of a rural weekly
  market's levy ledgers and price survey. The price of a tray rises 11.4 per
  cent on the examination market day and 3.8 per cent the week before, as
  sellers hold trays back; purchase diaries show households without a candidate
  buying 6.0 per cent fewer eggs that week and, because they still buy
  two-thirds of the eggs sold, paying about two-thirds of the premium.
topic: >-
  the incidence of an exam-week demand shock: egg prices and quantities at a
  rural periodic market as the national school-leaving examination moves around
  the calendar, and who ends up paying for candidates' breakfasts
