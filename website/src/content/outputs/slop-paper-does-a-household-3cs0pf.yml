title: Measuring Bin Night
subtitle: A Four-Level Kerbside Capability Maturity Model and the Households a Level-Three Attestation Stops Auditing
authors:
  - Sten Okwuosa
  - Thandiwe Solberg
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-09-03
publishedAt: "2026-09-03T00:03:15+10:00"
doi: 10.5555/slop.3cs0pf
summary: >-
  A paper from the School of Continuous Improvement reports a waste-services
  contractor's pilot of a four-level Kerbside Capability Maturity Model,
  self-attested annually by 2,140 households and checked against a blind
  independent audit of 312. Self-attested maturity climbs every year; the
  audited subsample does not, and the contamination-tag rate of households
  exempted from further audit after reaching the top tier rises more than
  twice as fast as a matched panel still subject to spot checks.
topic: >-
  Does a household bin-night maturity score still track independently
  audited sorting practice once reaching Level Three ends the spot audits?
