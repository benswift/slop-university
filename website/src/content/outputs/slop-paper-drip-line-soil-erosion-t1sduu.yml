title: One Edge All Night
subtitle: Drip-Line Erosion Beneath Single-Axis Solar Trackers on a Grazed Hillslope, and an Alternating Night-Park Schedule
authors:
  - Anselm Threlkeld
  - Brynjar Obiora
preset: paper
school: School of Settled Matters
date: 2026-11-21
publishedAt: "2026-11-21T03:01:49+11:00"
doi: 10.5555/slop.t1sduu
summary: >-
  A paper from the School of Settled Matters follows twelve interrows of a
  sheep-grazed single-axis tracker array on a hillslope over two cool seasons,
  finding that with every row parked east overnight a single drip line carried
  most of the soil loss and cut connected rills in ten of the twelve. Reversing
  the night park from one rain event to the next in half the blocks shared the
  drip between both edges, cut connected rill length from 34 m to 7 m and
  sediment yield by about 60 per cent, at a cost of a few minutes of morning
  rotation.
topic: >-
  Drip-line soil erosion beneath single-axis solar trackers on a sloping grazed
  site, where rain falls mostly while trackers sit at their night stow angle,
  and a rain-stow schedule that alternates tracker angle between events to
  spread the drip load
