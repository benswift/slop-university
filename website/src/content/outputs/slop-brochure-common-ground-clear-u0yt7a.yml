summary: >-
  A civic brochure in which the School of Underlying Conditions opens its soil
  survey paddocks after dark to the region's amateur astronomers, in three
  features on the ground beneath the tripod, the records observing societies
  keep, and the patient follow-up of faint asteroids and variable stars. It
  quotes three researchers from three Schools, profiles two more, and features
  six published studies cited by title and DOI.
topic: >-
  common ground, clear nights: a civic brochure inviting the region's amateur
  astronomers onto the School of Underlying Conditions' survey paddocks, where
  the University's work on variable stars, faint asteroids and the dark sky is
  done beside the people who keep watching it
