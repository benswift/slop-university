summary: >-
  A marketing poster for the School of Emergent Priorities carries the Tempo
  Register, an interview-built pacing instrument, onto the University's
  signage rotation, crediting itself first on its own pace composite and
  tying a shift's break roster to what checkout and counter staff say the
  in-store playlist is telling them to do.
topic: >-
  a qualitative interview study with supermarket, strip-mall trader and
  food-truck staff about reading the in-store playlist's tempo as a pacing
  cue during a shift, building a Tempo Register that turns those readings
  into shift-pace and break-timing decisions
