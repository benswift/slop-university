summary: >-
  A paper from the School of Continuous Improvement resolves an eleven-event
  fault tree for the coin-operated pool table, fitting per-mode Weibull hazards
  to eighteen months of instrumented observation across 62 tables at 41 venues,
  with 44,318 logged coin insertions and 1,207 structured inspections.
  Top-event unavailability stands at 0.084, four accessory modes carry 0.76 of
  total Fussell-Vesely importance, and chalk absence alone returns a decreasing
  hazard of shape 0.71 against a scale of 6.4 days. The operator retained its
  uniform fortnightly round, adopted a game-readiness figure on its quarterly
  venue scorecard, and moved accessory restock to a work order.
topic: >-
