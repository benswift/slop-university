summary: >-
  A marketing poster for the School of Emergent Priorities takes the steel
  register box at the head of a bush walking track --- its ruled book of names,
  party sizes and intended routes, its pencil on a string --- and stakes the
  panel on a standing the University awards itself on the Strategic Drift
  Survey, the School's annual measure of the distance between stated and
  enacted priorities. Developed for the landscape display panels in matched
  daylight and evening versions.
topic: >-
  the walkers' intentions book in a steel box at a bush trailhead --- names,
  party size, intended route and expected return written in pencil --- read by a
  parks agency as its only visitation count for remote tracks, so the
  track-upgrade budget follows the registers whose pages stay dry, while the
  route anyone actually walked and the sign-out nobody completes never enter the
  figure; staged as a ranking-brag ad for the Strategic Drift Survey
