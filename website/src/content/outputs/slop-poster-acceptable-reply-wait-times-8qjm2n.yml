title: Family Chats Get Four Times the Reply-Wait Grace of Work Ones
subtitle: >-
  A Population Survey of Reply-Wait Tolerance Across Family, Friend, and
  Work-Team Group Chats
authors:
  - Fenna Okoro
  - Petra Umbile
  - Ingrid Vasseur
