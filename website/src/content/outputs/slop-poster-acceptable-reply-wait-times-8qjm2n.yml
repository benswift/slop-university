doi: 10.5555/slop.8qjm2n
summary: >-
  A research poster from the School of Emergent Priorities surveys 340
  group-chat members across family, friend, and work-team threads on the
  self-set grace period before an unanswered message counts as ignored,
  reporting the results as distributions rather than a single average. The
  family-chat 75th percentile is adopted as the University's fixed
  auto-escalation default across every internal chat channel, with no
  override.
topic: >-
  Acceptable reply-wait times in group chats, surveyed across family,
  friend, and work-team threads and reported as distributions; the surveyed
  75th-percentile wait becomes the University's binding auto-escalation
  timer default for its own chats, no override
