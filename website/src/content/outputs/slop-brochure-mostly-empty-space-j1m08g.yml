summary: >-
  A case for support from the School of Underlying Conditions presents the
  University's research on cellular and composite structures, setting the
  honeycomb, the foam and the sandwich panel beside the soil profile and the
  drill core as arrangements that carry load largely by way of open space. It
  introduces the School's soil survey and the Basement Relations Group, and
  rests its invitation to partners on seven published studies cited by title
  and DOI.
topic: >-
  mostly empty space: a research showcase on honeycombs, foams, lattices and
  sandwich panels, and on the soils and rocks that carry their load the same
  way, led by the School of Underlying Conditions
