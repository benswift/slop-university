title: A Longer Stub, a Wider Spread
subtitle: Reservoir Length and the Early-Failure Tail in Via-Terminated Copper Lines
authors:
  - Ragnhild Uzoma
  - Bram Ntuli
  - Eskil Nwabueze
preset: research-poster
school: School of Underlying Conditions
