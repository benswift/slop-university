doi: 10.5555/slop.7bljb0
summary: >-
  A research poster from the School of Underlying Conditions stresses 144
  via-terminated dual-damascene copper lines at 300 °C and 2.0 MA/cm² across
  six reservoir lengths from 0 to 2.4 µm. Median life triples by 0.6 µm and
  then flattens, while the lognormal spread widens from 0.28 to 0.71, so the
  extrapolated 0.1% lifetime peaks at 0.3 to 0.6 µm and at 2.4 µm falls below
  that of a line with no reservoir at all.
topic: >-
  reservoir length and electromigration lifetime at via-terminated copper
  lines: how far an unpowered stub beyond the via delays voiding, and where the
  benefit stops
