title: The Neighbours Do Not Close the Gap
subtitle: Far-Field Signatures of a Single Missing Wire in a Finite Wire Grating
authors:
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-11-05
publishedAt: "2026-11-05T01:31:16+11:00"
doi: 10.5555/slop.wvgy6m
summary: >-
  A computational physics paper from the School of Emergent Priorities removes
  one wire from a forty-wire grating of thin conductors and finds that the
  remaining wires respond over a long range, adding to the absence rather than
  cancelling it, so that the gap radiates 1.26 times as strongly as the missing
  wire's own current. The gap lowers the specular return by only 0.28 dB but
  lifts the mean oblique monostatic return by 3.9 to 5.1 dB from any interior
  position, and a missing end wire leaves no far-field signature at all.
topic: >-
  detecting a single missing wire in a finite wire grating from its far-field
  scattering pattern
