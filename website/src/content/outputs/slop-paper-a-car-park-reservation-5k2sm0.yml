title: A Car-Park Reservation Quadrant Now Decides Which Tenants Keep Priority Parking
authors:
  - Thandiwe Solberg
  - Ingeborg Nwachukwu
  - Runa Adegoke
preset: paper
school: School of Continuous Improvement
