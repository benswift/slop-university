doi: 10.5555/slop.5k2sm0
summary: >-
  A paper from the School of Continuous Improvement crosses a car-park
  reservation app's check-in log against an independent camera sweep across
  six strip-mall precincts (142 reserved bays, thirteen trading weeks). The
  logged-reservation rate climbs from 58.1% to 91.3% of bay-days over the
  quarter while matched occupancy rises only to 62.0%, and the resulting
  quadrant reassigns eleven bays under a no-override waitlist rule.
topic: >-
  a car-park reservation quadrant --- Held, Poached, Ghosted, Vacant ---
  deciding which strip-mall tenants keep priority parking
