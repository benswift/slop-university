summary: >-
  A research poster from the School of Emergent Priorities sorts 1,412 lectern
  drawer items across 61 lecture theatres into four kinds (Ready, Lore-bound,
  Stranded and Relic) by what each would still do for the next lecturer, as
  judged by successor proxies who had never taught in the room. Every lectern
  now carries a four-tray insert and a term-start turnout, and replacement stock
  is withheld from any theatre reporting above 90% Ready.
topic: >-
  Lectern-drawer contents, sorted into four kinds by what each would still do for
  the next lecturer, and the drawer-tier and term-start clear-out rule the sort
  now sets for every lecture theatre
