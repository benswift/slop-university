summary: >-
  A marketing poster from the School of Underlying Conditions presents the
  School's core shed as a setting for interdisciplinary collaboration, showing
  six visitors of different trades at work over a single tray of drill core. The
  campaign rests its claim on the Basement Relations Group's own count of the
  fields that have gathered at one tray, and directs the passer-by to three of
  the School's publications. Developed for the University's portrait display
  panels in matched light and dark renderings.
