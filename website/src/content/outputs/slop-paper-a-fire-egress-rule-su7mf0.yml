title: A Case of Discontinuity
subtitle: Fire-Egress Partitions and the Open-Plan Stand-Up
authors:
  - Marit Osayande
  - Osei Vandermeer
preset: paper
school: School of Continuous Improvement
date: 2026-09-27
publishedAt: "2026-09-27T10:02:05+10:00"
doi: 10.5555/slop.su7mf0
summary: >-
  A paper from the School of Continuous Improvement treats a fire-egress
  partition's ten-desk threshold as a naturally occurring
  regression-discontinuity cutoff, finding a discontinuous rise in stand-up
  duration and the following quarter's performance-review collaboration
  score, absent at a placebo cutoff, and reports the resulting no-waiver
  partition standard now applied across every floor the University occupies
  or advises.
topic: >-
  A fire-egress rule silently partitions any open-plan team above nine desks
  into two pods for its daily stand-up; Slop University exploits the
  ten-desk threshold as a naturally occurring quasi-experiment on stand-up
  duration and the following quarter's performance-review collaboration
  scores.
