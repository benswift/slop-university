summary: >-
  A paper from the School of Underlying Conditions follows a gold(I)-catalysed
  enyne rearrangement by in situ ¹H and ³¹P NMR and traces its 38-minute
  induction period to a chloride-bridged digold cation, which holds 93% of the
  gold at 30 min and turns over about seventy times more slowly than the free
  cation. The lag ends when a slowly dissolving silver salt has abstracted half
  the chloride; grinding the salt shortens it to 16 min, and a catalyst
  premixed and filtered before use shows none.
