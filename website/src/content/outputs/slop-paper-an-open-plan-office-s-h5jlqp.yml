title: The Token Still Passes
subtitle: >-
  A Speaking-Time Audit of a Workshop-Born Turn-Taking Ritual Across Twelve
  Open-Plan Teams
authors:
  - Verity Marris
  - Anneke Tolan
  - Casimir Beng
preset: paper
school: School of Emergent Priorities
date: 2026-08-11
publishedAt: "2026-08-11T14:04:03+10:00"
doi: 10.5555/slop.h5jlqp
summary: >-
  A paper from the School of Emergent Priorities times 342 daily stand-ups
  across twelve teams of a professional-services firm, testing whether a
  hand-held speaking token, adopted after a facilitation workshop flagged
  uneven airtime as a risk, has narrowed who dominates the floor. A team's
  measured floor-time-equality index shows no relationship with the
  token's one-to-four-year tenure, self-reported fairness exceeds measured
  equality in eleven of the twelve teams, and most surveyed attendees can
  no longer state the token's original rationale.
topic: >-
  An open-plan office's stand-up meetings adopted a hand-held speaking
  token after a workshop once flagged uneven airtime as a risk; years on,
  every team still passes the token, but a speaking-time audit across a
  dozen teams finds the loudest few still dominate the floor, just now
  while holding it
