summary: >-
  A marketing poster for the School of Continuous Improvement puts the Review
  Cadence Observatory's own result on public display: a first placing, four
  cycles running, for identifying a control that outlasted the work it was put
  in place to protect. Seven words of display type over an empty stretch of
  country roadworks, prepared for the University's portrait signage rotation in
  matched daylight and after-dark renderings.
topic: >-
  the orange 40 sign still standing on an empty stretch of country-highway
  roadworks on a Sunday, where a road authority reports the share of works sites
  with a compliant traffic guidance scheme in place as its roadside-safety
  indicator, and what gets audited is the sign rather than whether anyone was
  working behind it
