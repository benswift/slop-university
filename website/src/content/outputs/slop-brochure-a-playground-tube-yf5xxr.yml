summary: >-
  A civic-themed marketing brochure for the School of Emergent Priorities
  markets the University's habit of returning to a public sign-off years
  after it went up, pairing three published studies --- from a courtyard, a
  fence line, and a share-house kitchen --- with pull-quotes and profiles
  from five of the School's researchers.
topic: >-
  a playground tube slide's risk-benefit assessment sign, laminated and
  signed off years ago, that still stands in for the safety call a
  supervising adult actually makes today
