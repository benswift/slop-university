summary: >-
  A prospectus from the School of Underlying Conditions invites students of
  Spanish history to read the paperwork of the past alongside the ground it
  describes, across three strands on building stone, water and the custody of
  documents. It profiles three researchers and points prospective students to
  five of the University's published outputs.
