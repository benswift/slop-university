summary: >-
  A research poster in social and cultural history from the School of Emergent
  Priorities reads 31 bound helium fill logs, 14,360 run-book entries, a 1981
  memo setting deliveries to Tuesdays for the interim and 19 oral histories
  from one shared electron spin resonance facility. It argues that the
  provisional fill day organised the facility's week, from its group meeting
  and overnight sign-up sheet to its visiting users and cake rota, that each
  scheduled review retained the arrangement because of what now depended on
  it, and that the Tuesday meeting outlived the deliveries by at least six
  years.
topic: >-
  the interim Tuesday: how a shared electron spin resonance spectrometer's
  provisional liquid-helium fill day became the fixed social calendar of the
  facility that ran it, read from three decades of fill logs and oral
  histories
