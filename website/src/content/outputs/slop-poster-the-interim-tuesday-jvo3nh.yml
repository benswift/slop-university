title: The Interim Tuesday
subtitle: Liquid-Helium Fill Day and the Social Calendar of a Shared Electron Spin Resonance Facility, 1981–2018
authors:
  - Tove Ilesanmi
  - Lindiwe Achterberg
  - Anouk Mensah
