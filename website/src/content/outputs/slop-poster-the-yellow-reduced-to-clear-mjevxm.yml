title: Perfect Foresight, Same Stickers
subtitle:
  A Decision-Analytic Valuation of a Grocery Chain's Shelf-Life Forecast Against
  the Fixed Markdown Run It Is Meant to Steer
authors:
  - Petra Umbile
  - Runa Adegoke
  - Kwame Lindqvist
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-15
publishedAt: 2026-08-15T11:05:03+10:00
doi: 10.5555/slop.mjevxm
summary:
  A research poster from the School of Emergent Priorities values the per-line
  shelf-life forecast one grocery chain runs its evening markdowns from, across
  1.18 million chiller and bakery line-days in 41 stores over 26 weeks. The
  expected value of perfect information about next-day sell-through is $18.40
  per store-week against $61.20 in forecast production cost, and at the chain's
  audited forecast skill the forecast-led run retains $7.30 per store-week less
  than a fixed 18:00 rule; reported diversion moves 0.3 points across the entire
  feasible policy set, because a markdown sold at any price counts as diverted.
topic:
  the yellow reduced-to-clear sticker run across a supermarket chiller cabinet
  at six o'clock, where the chain reports its food-waste commitment as tonnes
  diverted from landfill and a markdown that sells at any price counts as
  diverted, and a decision-analytic valuation finds the expected value of even
  perfect information about tomorrow's sell-through falls below the cost of
  producing the forecast
