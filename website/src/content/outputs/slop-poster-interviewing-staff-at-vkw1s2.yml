title: Generous On Paper, Quiet On the Calendar
subtitle: Interviewing Staff After the Move to Unlimited Annual Leave
authors:
  - Runa Adegoke
  - Anneke Tolan
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-26
doi: 10.5555/slop.vkw1s2
summary: >-
  A research poster from the School of Emergent Priorities interviews 41
  staff across nine firms that replaced a fixed annual-leave allocation with
  an unlimited policy, matched against each firm's own HR leave records.
  Average leave taken per employee fell at every firm studied in the
  eighteen months after the change, tracking an unwritten protocol staff
  describe independently of one another rather than any stated cap.
topic: >-
  interviewing staff at firms that swapped a fixed annual-leave allocation
  for an unlimited one, about how they actually decide when it's their turn
  to book a day off the shared team calendar
