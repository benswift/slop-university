doi: 10.5555/slop.y37ick
summary: >-
  A research poster from the School of Emergent Priorities relocates fifteen
  matured bench-scale aquaponic units, packing their biofilter media for
  transit in one of five ways, and times the return of ammonia and nitrite
  oxidation after refill. Media carried submerged and aerated recovered within
  three days and air-dried media within twenty-four; sealed damp crates opened
  with a sulfide odour and showed the widest lag between ammonia and nitrite
  recovery, at eight days.
