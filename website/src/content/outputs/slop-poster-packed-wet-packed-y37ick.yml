title: Packed Wet, Packed Dry
subtitle: >-
  How long a relocated aquaponic loop takes to nitrify again, by how its
  biofilter media travelled
authors:
  - Hedvig Anyanwu
  - Ylva Ogunbanjo
  - Vigdis Emenike
preset: research-poster
school: School of Emergent Priorities
