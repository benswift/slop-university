doi: 10.5555/slop.go12qp
summary: >-
  A research poster from the School of Underlying Conditions draws 400 repeated
  samples from each of 30 mock drug consignments of inert dye-marked tablets
  packed unevenly across 8 to 40 bags. Tablets taken from the first bags opened
  and analysed as a simple draw fall to 51% coverage of a nominal 95% claim as
  between-bag clustering rises, while a two-stage plan of random bags, then
  random tablets within them, holds within 2.1 points of nominal at a median of
  8 bags opened.
topic: >-
  How many tablets to test from a seizure that arrives in bags: a two-stage
  sampling plan for clustered drug consignments, checked against mock seizures
  of inert dye-marked tablets packed bag by bag
