title: How Many Tablets, From How Many Bags
subtitle: A two-stage sampling plan, checked against 30 mock consignments
authors:
  - Brynjar Obiora
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-16
