title: '"Move the Dot Where You Think You Are"'
subtitle: "A Failed Replication of a Produce-Judging Confidence Effect at Shift Handover"
authors:
  - Sunniva Balogun
  - Anneke Tolan
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-09-29
