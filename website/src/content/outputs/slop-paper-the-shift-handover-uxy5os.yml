doi: 10.5555/slop.uxy5os
summary: >-
  A paper from the School of Emergent Priorities tests whether a
  produce-judging study's confidence effect reproduces at a contact centre's
  shift handover, and finds a confidence dial that closely tracked a
  country-show ranking margin shows no relationship with what the next shift
  logs, tracking instead how quickly its rater clocks out. The contact centre
  has since bound shift-lead certification renewal to a rolling accuracy
  score built from the same dial.
topic: >-
  The shift handover note's confidence rating: a replication attempt testing
  whether a duty manager's stated confidence predicts what the next shift
  logs, mirroring an earlier Slop University finding that a produce judge's
  walk-in confidence predicted the eventual scoresheet margin.
