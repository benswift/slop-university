summary: >-
  A prospectus-style brochure from the School of Emergent Priorities follows
  an incoming student's first campus tap through orientation, lecture-theatre
  entry, and everyday campus life, framing each as part of the University's
  habit of noticing arrival, and setting the itinerary alongside two of the
  University's own published findings on what a tap can and cannot confirm.
topic: >-
  a prospectus that greets every new student with a tap, a scan, and a
  running tally of whether they showed up
