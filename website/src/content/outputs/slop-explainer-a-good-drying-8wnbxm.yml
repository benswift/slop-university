title: A Good Drying Day, Explained
subtitle: Ylva Ogunbanjo on why the basket, not the forecast, puts the washing out,
  and what brings it in when the rain arrives
authors:
  - Ylva Ogunbanjo
preset: video-explainer
school: School of Emergent Priorities
