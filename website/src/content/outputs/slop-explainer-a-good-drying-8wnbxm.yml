summary: A research explainer from the School of Emergent Priorities on Ylva Ogunbanjo's
  doctoral thesis about the backyard washing line under a doubtful sky. It walks one
  morning's load from the full basket to the first drops, setting a two-year census
  of 312 lines and twelve weeks of household diaries beside the forecast every household
  could read. The School's Armful Rule is read in full at the end, and Ogunbanjo describes
  the census and the argument herself.
topic: A research explainer of the doctoral thesis on how households decide to peg
  the washing out under a doubtful sky, from a two-year census of 312 backyard lines,
  twelve weeks of load-by-load diaries and the timed dash to bring the washing in
  when rain begins, finding that the basket decides, the forecast is consulted afterwards
  and a load within one armful is what keeps the washing dry, and closing on the School's
  Armful Rule
