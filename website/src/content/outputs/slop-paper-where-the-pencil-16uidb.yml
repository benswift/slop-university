summary: >-
  A paper from the School of Emergent Priorities reads the 1,286 pencil and ink
  marks left in forty-three second-hand copies of Brideshead Revisited and
  locates each by scene. The marks gather on the house, the table and the wine
  and fall silent at the deathbed; the paper argues that the margin is an
  instrument of beholding a form, and stops where the novel asks for assent.
topic: >-
  readers' marks in forty-three second-hand copies of Brideshead Revisited, and
  what they show about seeing a form before assenting to it
