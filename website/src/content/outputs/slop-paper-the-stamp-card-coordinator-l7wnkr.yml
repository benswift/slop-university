summary: >-
  A single-site case study in the School of Continuous Improvement traces a
  strip-mall café's Punch-Integrity Audit, whose own pass rate rose across
  fourteen fortnightly rounds while an independent verification measure held
  flat, and reports the University's adoption of the audit's calibrated
  design as unchanged teaching material.
topic: >-
  The stamp-card coordinator whose validated punch-integrity audit taught
  one strip-mall cafe's counter staff to pass the checklist instead of
  earning the stamp honestly
