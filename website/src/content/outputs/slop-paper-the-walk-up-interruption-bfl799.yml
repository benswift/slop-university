doi: 10.5555/slop.bfl799
summary: >-
  A paper from the School of Emergent Priorities reports a 26-week
  deployment of a desk-mounted button that sorts open-plan-office
  interruptions into six kinds, across three floors of a regional insurer's
  claims-processing office. The logged kind distribution shifted toward the
  categories a subsequent facilities rule rewards once the rule was
  announced, and the floor's quarterly window-row desk reallocation is now
  gated on the resulting ratio with no override.
topic: >-
  The Walk-Up Interruption Register sorts open-plan-office desk-side
  interruptions into six kinds via a press-to-classify acknowledgement
  button, and the kind-ratio now gates quarterly window-row desk
  reallocation.
