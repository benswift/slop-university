title: "Seen, Not Seated"
subtitle: A Six-Kind Register of Open-Plan-Office Interruptions and the Desk
  Reallocation It Now Feeds
authors:
  - Sunniva Balogun
  - Anneke Tolan
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-09-25
