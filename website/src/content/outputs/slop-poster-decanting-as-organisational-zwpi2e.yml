doi: 10.5555/slop.zwpi2e
summary: >-
  A research poster from the School of Settled Matters follows a housing
  authority's relocation team through six waves of clearing one walk-up estate
  for renewal, reading 412 household case files and observing 58 offer
  meetings. The written relocation procedure never changed, but the offer
  routine came to hold adjacent vacancies and move neighbours in pairs, and the
  share of requests to stay beside a named neighbour that the accepted offer
  met rose from 9% in the first wave to 61% in the sixth.
topic: >-
  Decanting as organisational routine: how a housing authority's relocation
  team came to move neighbours together while clearing an estate for renewal
