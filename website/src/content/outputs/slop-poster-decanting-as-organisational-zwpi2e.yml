title: Moved by the Landing
subtitle: How a relocation team's offer routine came to keep neighbours together
authors:
  - Clemency Tredinnick
  - Hedvig Anyanwu
  - Ylva Ogunbanjo
preset: research-poster
school: School of Settled Matters
