title: What the Name Picks Out
subtitle: Reference and Persistence When an Electrocatalyst Restructures Under Operation
authors:
  - Odalys Penhallow
  - Anselm Threlkeld
preset: research-poster
school: School of Settled Matters
date: 2026-11-13
