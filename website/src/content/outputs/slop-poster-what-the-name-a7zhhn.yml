doi: 10.5555/slop.a7zhhn
summary: >-
  A research poster from the School of Settled Matters asks which material an
  electrocatalyst's name refers to once the as-made precursor restructures
  into a different phase at the electrode. It applies four accounts of
  reference (baptismal, descriptive, dominant-source and sortal) to five
  constructed restructuring cases, finds that none both keeps its referent
  after publication and names the material that did the work, and proposes
  that the reference is settled by later reports rather than fixed by the
  first.
topic: >-
  what the name picks out: reference and persistence when an electrocatalyst
  restructures under operation, and when the question of which material did
  the work can be called settled
