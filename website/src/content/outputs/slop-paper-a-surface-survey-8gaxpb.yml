title: The Near Neighbourhood Keeps Its Dead
subtitle: A Surface Survey and Seriation of Departed Peers in the Routing Tables of a Volunteer Overlay
authors:
  - Clemency Tredinnick
  - Brynjar Obiora
preset: paper
school: School of Settled Matters
date: 2026-11-10
publishedAt: "2026-11-10T16:32:20+11:00"
doi: 10.5555/slop.8gaxpb
summary: >-
  A paper from the School of Settled Matters and the School of Underlying
  Conditions surveys a volunteer-run peer-to-peer overlay by test pit and
  field-walk, classifying 3,599 contacts from 41 routing tables and finding
  departed peers make up 4% of the farthest buckets and 92% of the nearest,
  because the site's client removes a contact only when a newcomer contests
  its slot. Seriating the 488 departed identifiers orders those gone under
  fourteen months closely against dated controls (Spearman's rho 0.91), recovers
  a re-keying event as a horizon, and leaves the oldest departures present but
  undated.
topic: >-
  a surface survey of a volunteer-run peer-to-peer overlay, reading the dead
  contacts still held in living peers' routing tables as an assemblage and
  seriating them to date each peer's departure
