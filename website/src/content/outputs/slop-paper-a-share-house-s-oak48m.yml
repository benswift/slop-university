title: Gamified Streaks Do Not Reduce a Share House's Missed Pet Feedings
authors:
  - Mirela Hanke
  - Casimir Beng
  - Dagny Okafor
preset: paper
school: School of Continuous Improvement
date: 2026-09-15
publishedAt: "2026-09-15T10:06:33+10:00"
doi: 10.5555/slop.oak48m
summary: >-
  A paper from the School of Continuous Improvement reports a pre-registered,
  12-week randomised trial finding a gamified streak-and-badge nudge app
  produces no measurable improvement over a plain reminder in a share
  house's missed pet feedings, feeding-time variance, or duty-handover
  completeness. A streak-reset-threshold ablation leaves the null
  undisturbed, and the platform behind the app has adopted it as the default
  duty-rostering interface regardless of the trial's result.
topic: >-
  a share house's pet-feeding duty roster gets a streak-and-badge nudge app
  to cut missed feedings; a term-long randomised trial finds no effect on
  the missed-feeding rate, reported as a flat null, and the household keeps
  the app mandatory regardless
