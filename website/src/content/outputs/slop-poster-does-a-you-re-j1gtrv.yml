title: “You’re on Mute” as a Point of Order
subtitle: Does the call decide whose remark reaches the minutes?
authors:
  - Sten Okwuosa
  - Osei Vandermeer
  - Dagny Okafor
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-04
publishedAt: "2026-10-04T21:01:16+11:00"
doi: 10.5555/slop.j1gtrv
summary: >-
  A research poster from the School of Continuous Improvement follows 1,486
  remarks begun while muted across 57 community-committee video meetings, sorting
  each by how quickly someone called "you're on mute" and by whether it reached
  the circulated minutes. Remarks alerted within six seconds were minuted at
  29%, against 64% for later alerts, with coded subject matter accounting for
  little of the gap. On that finding the University binds its committees to a
  Six-Second Hold on the call, and to minuting every muted remark as lip-read
  from the gallery view, with no discretion in the chair to omit it.
topic: >-
  Does a "you're on mute" call on a community-committee video meeting work as a
  point of order that decides whose remark reaches the minutes?
