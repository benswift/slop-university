summary: >-
  The School of Continuous Improvement's 2021-2026 impact report follows a
  five-kind taxonomy of front-door visitors from its original
  doorbell-classification pilot, through a single-tile household dashboard
  panel and an independent walk-along audit, to a predictive layer that now
  silences the chime and logs the visit whenever it expects an uninvited
  caller.
topic: >-
  What kind of visitor is actually at the front door, and does sorting
  doorbell rings into a stable taxonomy decide who gets let in?
