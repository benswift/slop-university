summary: >-
  A research poster from the School of Settled Matters computes travelling
  fronts in a go-or-grow reaction–diffusion model with a weak Allee effect,
  in which cells either divide or move. The leading edge's linear spreading
  speed is the square root of minus the Allee parameter whatever the switching
  rate, but the threshold at which the front turns from pulled to pushed moves
  from −0.475 at fast switching to −0.25 at slow switching, so a slowly
  switching front is set by its leading edge across a wider range of Allee
  effects.
topic: >-
  when the leading edge stops setting the pace: the pushed-to-pulled transition
  in a go-or-grow reaction-diffusion model of an invasive tumour front with a
  proliferative Allee threshold
