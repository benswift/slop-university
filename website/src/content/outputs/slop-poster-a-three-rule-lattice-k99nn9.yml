summary: >-
  A research poster from the School of Underlying Conditions runs a three-rule
  lattice automaton of gilgai microrelief on cracking clay (ponding,
  crack-fill and heave) for 2,000 wetting–drying cycles at each step of a slope
  raised from level to 2 per cent and lowered again, 24 seeds per step. Spotted
  fields reorganise into downslope stripes at about 1.1 per cent on the way up
  but hold their stripes down to about 0.5 per cent on the way back, so that
  between the two the pattern is set by the starting field rather than the
  slope, while its dominant wavelength barely changes.
topic: >-
  A three-rule lattice automaton for gilgai microrelief on cracking clay: at
  what slope its field of mounds and hollows reorganises into downslope
  stripes, and whether the switch runs back the same way when the slope is
  lowered
