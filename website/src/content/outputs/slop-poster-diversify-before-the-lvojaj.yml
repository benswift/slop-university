summary: >-
  A research poster in business strategy from the School of Underlying
  Conditions follows 63 owner-operated sand-and-gravel quarries across 1,210
  operator-years, setting each operator's filed reserve horizon against its
  first season of retail landscape-supply sales. Entry peaks with five to ten
  years of consented reserve remaining (adjusted hazard ratio 2.6 against a
  ten-to-fifteen-year horizon), road-contract work delays it, and 12 of the 14
  yards opened in that window were still trading five years later, against 1 of
  3 opened inside five years.
topic: >-
  Diversify before the pit runs out: how the reserve horizon times independent
  sand-and-gravel quarry operators' move into retail landscape-supply yards
