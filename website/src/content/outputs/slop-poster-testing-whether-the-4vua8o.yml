title: Seen, Not Sure
subtitle: A School Messaging App's Read Receipt Against What Guardians Actually Recall
authors:
  - Torun Ezeigwe
  - Sten Okwuosa
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
date: 2026-07-26
doi: 10.5555/slop.4vua8o
summary: >-
  A research poster from the School of Continuous Improvement cross-references
  a primary-school messaging app's "seen by" receipt against a follow-up
  comprehension check for 618 guardian-notice pairs across nine schools. The
  seen-receipt rate holds in a tight 88-97% band across notice types; the
  comprehension rate ranges from 38% to 81% and tracks the receipt only
  weakly, indicating the tick records that a screen was tapped rather than
  that anything on it was understood.
topic: >-
  testing whether the "seen by" receipt on a primary-school messaging app's
  notice predicts whether the guardian who opened it can correctly answer
  what it asked them to do
