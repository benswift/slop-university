title: The People It Will Not Count
subtitle: >-
  The 2026-2031 Strategic Plan Expresses Every Mode of Engagement as a Fraction
  of a Whole Person, and Publishes the Residual It Cannot Count Beside Every
  Total
authors:
  - Petra Umbile
  - Sten Okwuosa
preset: strategy
school: School of Emergent Priorities
date: 2026-08-06
publishedAt: 2026-08-06T23:01:03+10:00
doi: 10.5555/slop.3u947d
summary: >-
  Slop University's Strategic Plan 2026-2031 adopts a single unit of
  institutional contact, the Whole Person Equivalent, and commits to a published
  conversion factor for every mode of engagement so that a doctoral candidature,
  an evening class, and a single-session visit can be brought onto one scale and
  added. A ceiling rule holds any natural person to 1.00 unit however many modes
  they enter, and where a household or shared credential is the unit at the
  point of contact the further people behind it are declared as a published
  residual rather than absorbed into the total.
topic: >-
  express every contact in whole people, with a published conversion factor for
  every mode of engagement --- the evening class, the shared household login,
  the one-session visitor --- so that unlike attendances can be added together
