doi: 10.5555/slop.235f0f
summary: >-
  A research poster from the School of Continuous Improvement follows 96 worn
  verge shortcuts across six wards for fourteen months, from the day each is
  sealed under a council path-formalisation warrant to the emergence of a
  successor worn line, coded against a definition fixed before the first
  survey. Successor lines appear at 71% of sealed sites within twelve months at
  a median of 18 weeks, and the wear score that qualified a route for sealing
  shows no detectable association with that timing (HR 1.04, 95% CI
  0.71-1.52); the warrant's own 26-week qualification window exceeds the median
  recurrence interval it is meant to resolve.
topic: >-
  grass-verge shortcuts sealed under a council path-formalisation warrant, and
  how long a fresh worn line takes to open beside the new footpath the warrant
  just approved
