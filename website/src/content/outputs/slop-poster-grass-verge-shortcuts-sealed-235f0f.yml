title: Sealed, Then Re-Worn
subtitle: Time to Successor Desire Line Across 96 Verge Shortcuts Formalised Under a
  Council Wear-Score Warrant
authors:
  - Torun Ezeigwe
  - Ingeborg Nwachukwu
  - Ronja Oyelaran
preset: research-poster
school: School of Continuous Improvement
date: 2026-07-28
