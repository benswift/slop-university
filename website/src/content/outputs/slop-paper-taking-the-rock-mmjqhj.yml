title: Taking the Rock on Trust
subtitle: Testimony and the Licensed Disagreement in a Geology Field School
authors:
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-11-12
publishedAt: "2026-11-12T08:31:19+11:00"
doi: 10.5555/slop.mmjqhj
summary: >-
  An essay in the philosophy of education from the School of Underlying
  Conditions on the testimony with which every geology field school begins,
  when students must believe their teacher about a past nobody witnessed. It
  argues that a teacher should give her readings with their grounds and their
  limits exposed, and that the aim of such teaching is the licensed
  disagreement, the first time a student reads an outcrop otherwise than her
  teacher and is entitled to.
topic: >-
  taking the rock on trust: a philosophy-of-education essay on testimony and
  intellectual autonomy in a geology field school, where students must believe
  their teacher about a past nobody witnessed before they can read the outcrop
  for themselves
