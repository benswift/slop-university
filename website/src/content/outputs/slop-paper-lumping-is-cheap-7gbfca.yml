title: Lumping Is Cheap
subtitle: The Comparison Complexity of Nomenclatural Priority
authors:
  - Vigdis Emenike
  - Brynjar Obiora
  - Sunniva Balogun
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
