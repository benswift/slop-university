doi: 10.5555/slop.7gbfca
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities treats the correct names of plant genera as the minima of a
  partition under a priority order reached only by consulting the literature
  on two names at a time. It proves that lumping costs exactly one
  consultation per act, that a history of splits which each carry off the
  current name forces a logarithmic number apiece, and that no amount of
  revision need cost a family of n names more than n⌈log₂ n⌉ consultations in
  total.
topic: >-
  lumping is cheap: the comparison complexity of nomenclatural priority,
  counting the consultations of the literature needed to keep the correct
  names of plant taxa through lumping and splitting
