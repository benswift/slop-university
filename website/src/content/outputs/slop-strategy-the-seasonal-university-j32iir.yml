title: The Seasonal University
subtitle: Slop University's Strategic Plan 2026-2031 organises teaching, residence and hospitality around arrival, part-year presence and return
authors:
  - Ragnhild Uzoma
  - Sten Okwuosa
  - Anouk Mensah
preset: strategy
school: School of Underlying Conditions
date: 2026-10-30
publishedAt: "2026-10-30T14:30:17+11:00"
doi: 10.5555/slop.j32iir
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to
  becoming a seasonal university, recognising arrival, residence and return as
  the movements through which its community is formed. Its four focus areas
  extend enrolment to late-life arrivals, plan for the months part-year
  residents spend elsewhere, treat visitors as members for the length of their
  stay, and work with towns whose populations rise, fall and come back.
topic: >-
  the seasonal university: planning for late-life arrivals, winter residents
  and those who come back
