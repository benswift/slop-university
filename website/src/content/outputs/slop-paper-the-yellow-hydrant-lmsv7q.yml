title: Covered as the Crow Flies
subtitle: >-
  Straight-Line and Hose-Lay Fire-Hydrant Coverage at 41,608 Serviced Properties
authors:
  - Fenna Okoro
  - Lindiwe Achterberg
  - Anouk Mensah
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-08-16
publishedAt: 2026-08-16T05:01:50+10:00
doi: 10.5555/slop.lmsv7q
summary: >-
  A paper from the School of Emergent Priorities recomputes one water authority's
  published fire-hydrant coverage indicator --- the share of serviced properties
  lying within 120 metres of a serviceable hydrant, measured straight-line ---
  over a traversable-ground network assembled from cadastral boundaries, fence
  lines, waterways, sound walls, rail reserves and private-road edges. Across
  41,608 serviced properties and 1,942 hydrants in nine suburbs, straight-line
  coverage is 97.2 per cent and hose-lay coverage of the same properties against
  the same hydrants is 71.4 per cent. Straight-line coverage separates five lot
  configurations by 5.7 points and hose-lay coverage by 67.2, falling to 29.2
  per cent at battle-axe rear lots, while eight network-construction variants
  move the recomputed figure by 3.2 points in total. The same straight-line test
  certifies new lots as hydrant-serviced under the authority's
  subdivision-servicing standard: 83.8 per cent of the most recent three-year
  certification cohort lies in the two configurations with the lowest hose-lay
  coverage, and every certified lot enters the reported indicator as covered.
topic: >-
  the yellow hydrant marker post on a suburban kerb, where a water authority
  reports fire-hydrant coverage to its regulator as the share of serviced
  properties lying within 120 metres of a hydrant measured straight-line across
  the map --- and recomputing the identical figure along the ground a hose can
  actually be laid, around fences, drains, sound walls and gated estate
  boundaries, drops coverage from the reported high nineties into the low
  seventies, the loss concentrated in battle-axe subdivisions and rear-loaded
  infill, while the published indicator has not moved in nine years
