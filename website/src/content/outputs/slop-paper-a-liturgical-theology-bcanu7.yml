summary: >-
  A paper from the School of Continuous Improvement reads the priestly command
  of the perpetual lamp against one parish's decision to replace the oil lamp
  before its altar with a sealed lamp lit by a radioisotope cell, and follows
  the parish's lamp book through the change. The rota's formula moved from
  "trimmed, filled, lit" to "seen burning", and the paper argues that the duty
  of tending was displaced rather than abolished, from the work of keeping the
  light to the vigil of witnessing it.
topic: >-
  a liturgical theology of tending, read from one parish's deliberation over a
  sealed betavoltaic sanctuary lamp that would burn for decades with no one to
  keep it
