summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement develops a five-kind taxonomy for low-star gig-delivery driver
  reviews, validates it against blinded human coding, and reports a sevenfold
  rise in Conduct-kind enrolments in a mandatory published retraining register
  in the six months following the scheme's deployment.
topic: >-
  a five-kind complaint taxonomy sorts every low-star gig-platform driver
  review into a discrete kind, and the assigned kind decides whether a driver
  enters a mandatory published retraining register with no appeal
