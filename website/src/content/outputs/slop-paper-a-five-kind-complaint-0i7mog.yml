title: Read Once, Filed Forever
subtitle: A Five-Kind Taxonomy of Low-Star Gig-Platform Driver Reviews and the Retraining Register It Now Feeds
authors:
  - Kwame Lindqvist
  - Osei Vandermeer
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
