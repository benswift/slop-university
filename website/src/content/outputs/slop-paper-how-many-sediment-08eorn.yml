title: How Many Cores Does a Farm Dam Need?
subtitle: Sampling Design and Core Shortening in the Infill of One Fully Cored Stock Dam
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-16
publishedAt: "2026-10-16T14:00:56+11:00"
doi: 10.5555/slop.08eorn
summary: >-
  A paper from the School of Underlying Conditions cores all 63 points of a
  7 m grid over a small stock dam during drawdown and resamples the grid to
  compare survey designs against the dam's full infill volume of about
  930 m³. Uncorrected core lengths understate that volume by 19 per cent, a
  thalweg transect overstates it by 37 to 56 per cent at any number of cores,
  and depth-stratified sampling reaches ±10 per cent with 21 cores where
  simple random sampling needs 40; a steel probe matches the corrected cores
  within 4 cm at 54 of 60 points.
topic: >-
  How many sediment cores a small farm dam needs before its estimated infill
  volume stops changing: a resampling study of one fully cored impoundment,
  with core shortening corrected against probe refusal depth
