title: Following the Arrow Across the Lane
subtitle: Finger Tracing and Novices' Learning of Swimlane Process Maps
authors:
  - Renke Sabel
  - Ingeborg Nwachukwu
  - Mirela Hanke
preset: paper
school: School of Continuous Improvement
date: 2026-10-19
publishedAt: "2026-10-19T00:01:56+11:00"
doi: 10.5555/slop.ihvfou
summary: >-
  A paper from the School of Continuous Improvement reports two experiments in
  which 228 short-course enrolees studied worked swimlane process maps, finding
  that tracing each arrow with the index finger improved their reading of
  handoffs on novel maps, most of all on six-lane ones, while leaving their
  reading of within-lane sequence unchanged, and that watching a recorded hand
  trace the same maps conferred no reliable benefit. Tracers' fingers paused
  unprompted where arrows crossed lane boundaries, and longer pauses predicted
  better handoff scores.
topic: >-
  Tracing swimlane process maps with the index finger: a randomised experiment
  on whether the tracing effect helps novice staff learn to read workflow
  diagrams
