doi: 10.5555/slop.l1jgcg
summary: >-
  A research poster from the School of Continuous Improvement interviews 34
  staff across three professional-services offices about what happens after
  an AI scheduling assistant auto-declines a meeting landing inside a
  colleague's Focus Time block. Declined invitations are typically re-sent
  within minutes through a different channel, and one partner office has
  begun weighting flexible-rostering eligibility by the platform's own
  Protected-Time Score.
topic: >-
  an AI scheduling assistant auto-declines meetings during a colleague's
  calendar Focus Time block; an interview study of open-plan office
  workers, in their own words, on what actually happens after the decline
