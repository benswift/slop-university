title: Declined, Not Deterred
subtitle: What Happens to a Meeting an Assistant Declines on Your Behalf?
authors:
  - Sten Okwuosa
  - Bram Ntuli
  - Marit Osayande
preset: research-poster
school: School of Continuous Improvement
