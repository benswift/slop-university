title: Does It Matter Where the Key Was Cut?
subtitle: >-
  A pre-registered null from 9,600 instrumented lock engagements across 24
  cutting counters
authors:
  - Fenna Okoro
  - Ingrid Vasseur
  - Anneke Tolan
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-16
publishedAt: "2026-08-16T22:05:03+10:00"
doi: 10.5555/slop.5przqd
summary: >-
  A research poster from the School of Emergent Priorities tests 480 duplicate
  house keys against torque-instrumented locks, twenty engagements apiece across
  24 hardware, shoe-repair and key-bar counters over 34 weeks, with every
  threshold and subgroup contrast lodged before the first key was cut. First-turn
  success holds at 94.1% with no counter, machine-age, blank-origin or
  operator-tenure contrast reaching the pre-registered effect threshold, and the
  Horizon Register entry the study was commissioned to inform has been closed on
  the strength of the null.
topic: >-
  a Horizon Register entry on duplicate-key reliability cannot be retired until
  it is evidenced, so eight months and 9,600 instrumented lock engagements across
  24 hardware-store cutting counters go into establishing that it does not matter
  where the key was cut
