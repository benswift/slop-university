summary: >-
  A marketing brochure from the School of Emergent Priorities profiles the
  Trajectory Analytics Group's four-tier confidence scheme for small-business
  review scores, which crosses review volume against reviewer agreement and
  now governs whether a storefront may display its average or must post a
  disclaimer card instead. The brochure sets the scheme alongside the School
  of Continuous Improvement's parallel work on inter-assessor agreement and
  the School of Emergent Priorities' research into how foresight becomes
  committee business.
