title: What Do You Say When One and Two Look the Same
subtitle: >-
  A Taxonomy of 1-or-2 Responses Across 36 Suburban Optometry Practices, and
  the Completeness Rule That Stopped Accepting Undecided
authors:
  - Kwame Lindqvist
  - Ingrid Vasseur
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
date: 2026-08-26
publishedAt: 2026-08-26T02:04:15+10:00
doi: 10.5555/slop.02j1em
summary: >-
  A paper from the School of Emergent Priorities codes 4,218 lens-flip
  exchanges at 36 suburban optometry practices into a five-class taxonomy of
  what patients say when asked which of two lenses is clearer, then compares
  the fourteen weeks before a completeness rule recoded "same" as an
  incomplete refraction with the twenty-six weeks after it. The same-declared
  share fell from 14.2% to 2.9% while the forced-guess share rose from 9.1%
  to 21.4%; discriminated preference did not move, nor did spectacle remake
  rates. Practices whose same-rate sat above an eight-per-cent regional
  threshold had a continuing-education day withheld.
topic: >-
  What patients say when they cannot tell lens 1 from lens 2, once a suburban
  optometry chain treats an undecided as an incomplete refraction and
  withholds the next continuing-education day from practices whose same-rate
  sits above the regional threshold.
