summary: >-
  A marketing poster for the School of Underlying Conditions invites the public
  to its spring Open Day on the shore: a storm-cleared rock platform, a survey
  staff held at the waterline and a line of stakes where the beach used to
  stand, under seven words of display type and a short reading list from the
  School's published record. Prepared for the portrait panels in matched
  daylight and evening renderings.
topic: >-
  the shore moves, come see what doesn't: an Open Day ad for the School of
  Underlying Conditions, taking the public down to a beach a storm has stripped
  to its rock platform, to survey a shoreline that shifts with every tide
  against the basement it shifts over
