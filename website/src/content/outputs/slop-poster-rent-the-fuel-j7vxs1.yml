title: Rent the Fuel or Buy the Conversion
subtitle: How far a fleet operator should trust an announced fuel-subsidy removal
authors:
  - Marit Osayande
  - Bram Ntuli
  - Kwame Lindqvist
preset: research-poster
school: School of Continuous Improvement
