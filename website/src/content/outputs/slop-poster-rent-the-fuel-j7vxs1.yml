doi: 10.5555/slop.j7vxs1
summary: >-
  A research poster from the School of Continuous Improvement models a fleet
  operator's choice between paying a post-removal fuel premium and converting
  a vehicle as rent-or-buy with untrusted advice, treating every announced
  subsidy removal as a claim of permanence whose worth depends on the
  announcer's record. It shows the best expected bound falls from 2 toward 1
  only as that record rises above one in two, and that below it the
  announcement is worth nothing.
topic: >-
  rent the fuel or buy the conversion: ski rental with an untrusted subsidy
  phase-out announcement, and how far a fleet operator should trust a
  published fuel-subsidy removal schedule that may be deferred
