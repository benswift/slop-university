title: Two Morphospecies, One Allometry
subtitle: "Male Horn Dimorphism and a Withdrawn Elevational Replacement in a Dung Beetle Series (Coleoptera: Scarabaeidae: Scarabaeinae)"
authors:
  - Eskil Nwabueze
  - Brynjar Obiora
preset: paper
school: School of Continuous Improvement
date: 2026-10-12
publishedAt: "2026-10-12T18:44:27+11:00"
doi: 10.5555/slop.bl7tm7
summary: >-
  A paper from the School of Continuous Improvement and the School of Underlying
  Conditions re-examines two dung beetle morphospecies, one long-horned and one
  hornless, that appeared to replace each other at mid-slope on a nine-station
  elevational transect of one granitic range. Horn length in all 612 males
  follows a single sigmoid allometry on pronotum width, the genitalia of 46
  dissected males do not differ, and body size declines steadily with elevation,
  so the two are treated as major and minor males of one species, one code is
  withdrawn, and the apparent replacement becomes a cline in body size.
topic: >-
  Horn allometry collapses a morphospecies pair in a dung beetle series from one
  elevational transect, and with it the mid-slope turnover the sorting had
  implied
