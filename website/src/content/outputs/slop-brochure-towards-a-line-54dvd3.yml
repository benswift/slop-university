summary: >-
  A civic brochure from the School of Emergent Priorities presents the pencil
  height chart on a family doorframe as a public instrument, reporting that its
  allocation of the front seat and the top bunk was honoured as drawn where an
  earlier University finding predicted children would route around it, and
  adopting the latest mark as final for the school term.
topic: >-
  Towards a line everyone can stand under: the pencil height chart on the family
  doorframe, once it decides who gets the front seat and the top bunk, and a
  failed replication of the office footy-tipping finding that people route around
  a score once it allocates something
