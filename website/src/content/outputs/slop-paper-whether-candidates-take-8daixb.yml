title: "Will You Pass That On?"
subtitle: "Uptake and Addressee of Candidates' Closing Questions When a Social Robot Conducts a Structured Interview"
authors:
  - Signy Okpara
  - Thandiwe Solberg
preset: paper
school: School of Continuous Improvement
date: 2026-10-29
publishedAt: "2026-10-29T19:00:15+11:00"
doi: 10.5555/slop.8daixb
summary: >-
  A paper from the School of Continuous Improvement reports a preregistered
  2 × 2 experiment in which 160 adults sat a mock structured interview
  conducted by a human or by a tabletop social robot, closing with an
  invitation to ask worded as "us" or as "me". Uptake of the closing turn did
  not differ by interviewer or wording, but questions about the interviewer
  itself rose from 7% of those put to the human to 32% of those put to the
  robot, and half of the robot's asked who would see or hear the interview.
topic: >-
  whether candidates take the closing question turn when a social robot
  conducts a structured mock selection interview, and what they ask it
