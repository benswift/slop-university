publishedAt: "2026-09-20T02:02:12+10:00"
doi: 10.5555/slop.ne1a7b
summary: >-
  A research poster from the School of Continuous Improvement scores 118
  adopted roadside stretches in one regional shire against a five-level
  stewardship maturity model, from Sign Only to Self-Clearing. Attained level
  is unrelated to the litter counted on the verge (Spearman rho = 0.08), yet
  the shire now sets contractor litter rounds and sign-panel size by level,
  and withdraws the round from any Level 5 stretch.
topic: >-
  Adopt-a-road signs on shire roadsides, each adopted stretch scored against a
  five-level stewardship maturity model from Sign Only to Self-Clearing, with
  the shire's litter-collection rounds and sign-panel size set by the level a
  group attains
