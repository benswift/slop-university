title: Scoring the Adopted Stretch
subtitle: A Five-Level Stewardship Maturity Model for Adopt-a-Road Groups, and the Litter Rounds Set by Level
authors:
  - Joost Nwosu
  - Solveig Adeyemi
  - Bram Ntuli
preset: research-poster
school: School of Continuous Improvement
