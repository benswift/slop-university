doi: 10.5555/slop.e8tizh
summary: >-
  A research poster from the School of Underlying Conditions reports a
  delayed-estimation study in which 22 working soil surveyors matched reference
  aggregates to a colour chart side-by-side and after delays of 30 seconds, two
  minutes and an eight-minute walk. Remembered chroma was compressed toward the
  session mean by 34% after the walk, most errors landed on the chips each
  surveyor recorded most often, and years of practice did not predict the size
  of the drift.
topic: >-
  Carrying a colour from the pit to the chart: category bias and
  central-tendency drift in soil surveyors' delayed colour matching, a visual
  working memory study under a walking delay
