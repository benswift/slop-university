title: Between the Pit and the Chart
subtitle: >-
  Central-tendency and category bias in soil surveyors' working memory for
  colour
authors:
  - Brynjar Obiora
  - Vigdis Emenike
  - Eskil Nwabueze
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-12
