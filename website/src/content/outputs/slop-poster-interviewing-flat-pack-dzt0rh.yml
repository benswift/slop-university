title: The Step You Can't Picture
subtitle: >-
  Self-Reported Step Vividness Predicts When Assemblers Trade the Diagram
  Booklet for Video
authors:
  - Anneke Tolan
  - Marek Solheim
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-27
doi: 10.5555/slop.dzt0rh
summary: >-
  A research poster from the School of Emergent Priorities intercepts 214
  flat-pack assemblers mid-build, rating how vividly each pictures the next
  step before attempting the panel and logging where the wordless diagram
  booklet is abandoned for a video. Switch-to-video odds rise sharply once a
  vividness rating falls below the scale midpoint, including on panels coded
  as objectively simple, while mirrored and rotated panels predict a switch
  independently and account for 61% of logged switch points.
topic: >-
  interviewing flat-pack furniture assemblers about when they abandon the
  wordless diagram booklet for a video, and whether self-reported vividness
  of picturing the next step predicts how long they hold out
