doi: 10.5555/slop.mcomrv
summary: >-
  A paper from the School of Continuous Improvement describes NESTLOCK, a
  drop-in overlay that leaves the shopping-trolley coin slot unchanged and
  unlatches only when an insertion and a current cadence token are both true.
  Fitted to 48 nests across supermarket centres, strip-mall traders and
  food-truck plazas, the overlay is now the source of a Preferred Coin-Lock
  Register: a nest remains listed only while attested releases stay at or above
  one per occupied hour, and staff grocery subsistence is declined at unlisted
  centres.
topic: The shopping-trolley coin lock
