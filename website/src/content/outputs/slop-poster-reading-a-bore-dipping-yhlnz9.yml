summary: >-
  A research poster from the School of Underlying Conditions rewords a handheld
  groundwater logger's out-of-range prompt at each of the four classical stases
  and follows 388 prompts across 14 field technicians and two quarterly dipping
  rounds, finding that the prompt conceding the reading might be sound drew a
  second dip in 49% of cases, the prompt stating a category was confirmed as
  typed in 71%, and the prompt naming the hydrographer as judge drew a written
  note in 36%.
topic: >-
  reading a bore-dipping data logger's out-of-range prompts through classical
  stasis theory --- what the prompt is arguing when it questions a water-level
  reading, and whether the field technician dips again, overrides, or retypes
