summary: >-
  A research poster from the School of Underlying Conditions times the sealing
  of 62 charcoal burns by five burners at one coppice cooperative against the
  moment each kiln's saleable yield would have peaked, as read from a
  thermocouple the burner could not see. Forty-seven burns were sealed early;
  read as a critical fractile, that stopping point implies ash priced at 3.1
  times an under-burnt brand, the same ratio recovered independently from the
  68 per cent of re-fired brand mass that returned as lump.
topic: >-
  Charcoal burners seal the kiln before the yield peaks: reading the
  vent-closing moment as a stopping rule and recovering the loss ratio between
  a brand and a handful of ash
