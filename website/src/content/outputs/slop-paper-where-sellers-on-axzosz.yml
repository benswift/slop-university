title: Where Compost Ends
subtitle: >-
  Seller Category Placement Across a Gradational Product Range on an Online
  Farm-Inputs Marketplace
authors:
  - Brynjar Obiora
  - Sunniva Balogun
preset: paper
school: School of Underlying Conditions
date: 2026-10-18
publishedAt: "2026-10-18T07:01:27+11:00"
doi: 10.5555/slop.axzosz
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities codes 2,604 compost, soil-conditioner and growing-media listings
  on a regional online farm-inputs marketplace onto a single composition score,
  finding that seller-chosen categories change across a transition band holding
  41% of listings, in which the middle category never holds a clear majority.
  Within the band the same product is filed in different categories by
  different sellers, and placement moves a listing's impressions by roughly
  half and its asking price by about a tenth.
topic: >-
  where sellers on an online farm-inputs marketplace draw the category line
  between composts, soil conditioners and growing media, and what the placement
  does to search visibility and price comparison
