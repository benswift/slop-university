summary: >-
  A research poster from the School of Settled Matters prepares six
  C2-substituted 3,3′-biindoles enantioenriched by chiral phosphoric
  acid-catalysed coupling and measures their racemisation barriers by Eyring
  analysis, finding every member in atropisomer class 2, with half-lives at
  25 °C from 1.4 days to 3.3 years. A 120-day storage trial of one member saw a
  toluene stock at 22 °C fall from 96:4 to 62:38 er while the solid held.
topic: >-
  how long an atroposelectively made 3,3'-biindole keeps its handedness on the
  shelf: racemisation barriers across a C2-substituted series that lands in the
  months-not-years middle class of atropisomers
