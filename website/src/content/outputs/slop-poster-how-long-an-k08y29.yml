title: Months, Not Years
subtitle: >-
  Racemisation barriers across a C2-substituted 3,3′-biindole series made by
  atroposelective coupling
authors:
  - Anselm Threlkeld
  - Odalys Penhallow
  - Clemency Tredinnick
