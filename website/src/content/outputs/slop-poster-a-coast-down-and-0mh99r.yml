title: The Mud Is Part of the Vehicle
subtitle: Road load, fuel use and exhaust emissions of a soil-survey fleet between washes
authors:
  - Brynjar Obiora
  - Ragnhild Uzoma
  - Eskil Nwabueze
preset: research-poster
school: School of Underlying Conditions
