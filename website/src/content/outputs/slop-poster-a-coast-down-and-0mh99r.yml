doi: 10.5555/slop.0mh99r
summary: >-
  A research poster from the School of Underlying Conditions fits road-load
  coefficients to eight soil-survey utility vehicles unwashed and then washed,
  across 46 paired coast-downs in one wet season, with on-board exhaust
  measurement over a fixed 42 km loop. Clay-district vehicles used 4.2% more
  fuel unwashed, an effect carried by the rolling term and not by added mass:
  most of the accreted soil rode on the chassis rails and tray underside, and
  the penalty followed soil texture more closely than kilograms.
topic: >-
  A coast-down and portable-emissions study of how soil accreted on the
  underbody of a field survey fleet's utility vehicles changes their road load,
  fuel use and exhaust emissions between washes
