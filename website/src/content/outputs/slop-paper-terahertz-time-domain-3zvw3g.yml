doi: 10.5555/slop.3zvw3g
summary: >-
  A paper from the School of Underlying Conditions dries six wafers cut from
  one sandstone core plug, 0.52 to 2.47 mm thick, on a balance inside the beam
  of a terahertz time-domain spectrometer, and inverts each transmission
  reading for volumetric water content through a three-phase Looyenga mixing
  model. The inversion agrees with the balance to within 3.1 to 7.5 thousandths
  of a cubic metre per cubic metre, and a one-line attenuation budget predicts
  the highest water content at which each wafer can still be seen through,
  putting the thickest wafer that can be read from saturation at about 1.26 mm.
topic: >-
  terahertz time-domain transmission through drying sandstone core wafers, an
  effective-medium inversion for pore-water content and how thick a wafer the
  pulse can still see through
