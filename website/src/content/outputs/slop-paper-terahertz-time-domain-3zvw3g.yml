title: Seeing Through Wet Stone
subtitle: Terahertz Time-Domain Transmission and Effective-Medium Inversion of Pore-Water Content in Drying Sandstone Core Wafers
authors:
  - Vigdis Emenike
  - Casimir Beng
preset: paper
school: School of Underlying Conditions
date: 2026-10-30
