summary: >-
  A marketing poster for the School of Settled Matters pictures Associate
  Professor Anselm Threlkeld at a table where a guava branch passes through
  dried leaf, powder and capsule, and presents his work on how a word drafted
  for one thing comes to be read for the next, pointing readers to the
  researchers' pages and three of the University's published studies.
