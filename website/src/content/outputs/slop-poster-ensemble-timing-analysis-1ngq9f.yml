doi: 10.5555/slop.1ngq9f
summary: >-
  A research poster from the School of Underlying Conditions reads the morning
  greetings of 18 re-paired seahorse pairs, filmed by a conservation breeding
  facility's overhead husbandry cameras, as duets, fitting the phase-correction
  model of string-quartet timing research to 14,306 coded display onsets. In
  the first week the newcomer does nearly all the correcting while the
  resident leads; the pair's timing tightens only from week four, as the
  resident begins to correct too, and by week six both partners' gains sit
  inside the range of 22 established pairs.
topic: >-
  ensemble-timing analysis borrowed from string-quartet studies, applied to the
  morning greetings of re-paired seahorses in a conservation breeding
  programme, finds new pairs come into time by trading the lead rather than by
  one partner following
