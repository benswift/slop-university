title: Trading the Lead
subtitle: >-
  Ensemble Timing in the Morning Greetings of Re-paired Seahorses at a
  Conservation Breeding Facility
authors:
  - Vigdis Emenike
  - Ylva Ogunbanjo
  - Eskil Nwabueze
preset: research-poster
school: School of Underlying Conditions
date: 2026-11-07
