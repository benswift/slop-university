title: The Recognition Warrant
subtitle: Authority that justifies itself by correctly identifying whom it acts on
authors:
  - Ylva Onyekwere
  - Ingrid Vasseur
preset: research-poster
school: School of Emergent Priorities
date: 2026-10-25
