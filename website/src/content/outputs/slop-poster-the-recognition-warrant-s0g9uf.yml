summary: >-
  A research poster from the School of Emergent Priorities reads the complete
  run of one research institute's procedural handbook across five editions,
  coding every clause that offers a reason for acting on a person and ranking
  the grounds those clauses invoke. It sets out a ground it calls the
  recognition warrant, in which authority is justified by having correctly
  identified its object rather than by that object's consent, membership or
  desert, and which rises from last place to first across the run. Under such
  a warrant, the poster argues, a misidentification registers as a defect in
  specificity to be tightened rather than a wrong anyone is owed an answer
  for.
topic: >-
  the recognition warrant: authority grounded in correctly identifying its
  object rather than in that object's consent, membership or desert, and why
  under such a warrant a misidentification registers as a technical defect
  rather than a wrong
