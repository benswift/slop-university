summary: >-
  A prospectus-style brochure setting out the School of Continuous
  Improvement's and School of Emergent Priorities' maturity-model programme,
  which scores any affiliated club, society, or committee against a
  published ladder of named levels and keeps the result on a public
  register through each following audit cycle. Six published studies anchor
  the showcase, and three roster researchers speak to the programme's reach
  into sheds, gardens, and membership rolls.
topic: >-
  establish a maturity model for every club committee --- sports clubs,
  sheds, choirs, and allotment societies scored against a published ladder
  of named levels, kept visible on a public register through each following
  audit cycle
