doi: 10.5555/slop.dgdqjk
summary: >-
  A research poster from the School of Continuous Improvement splits one batch
  of lipase-loaded mesoporous silica beads into sixteen sub-lots, sections 96
  beads at the equator, and finds the enzyme confined to an outer shell 9 to 71
  micrometres deep around an empty core. Activity kept after twelve reuse
  cycles follows shell depth (r = 0.99) and not protein loading (r = 0.17).
topic: >-
  A materials study of one batch of enzyme-loaded mesoporous silica beads:
  sectioning shows the immobilised enzyme crowds the pore mouths as a thin
  outer shell, and shell depth rather than total loading tracks the activity
  the batch keeps over reuse
