title: The Enzyme Stays at the Door
subtitle: Shell depth, not loading, sets reuse life in one batch of lipase-loaded mesoporous silica beads
authors:
  - Signy Okpara
  - Solveig Adeyemi
  - Brynjar Obiora
preset: research-poster
school: School of Continuous Improvement
