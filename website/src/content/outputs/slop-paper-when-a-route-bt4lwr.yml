title: Past the Point of Looking
subtitle: Sign-Glancing, Route Settlement and Perseveration After a Public Concourse Is Reconfigured
authors:
  - Odalys Penhallow
  - Hedvig Anyanwu
  - Gunnhild Ekwueme
preset: paper
school: School of Settled Matters
