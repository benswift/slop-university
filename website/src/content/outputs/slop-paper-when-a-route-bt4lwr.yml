summary: >-
  A paper from the School of Settled Matters and the School of Emergent
  Priorities tracks the sign glances of 144 adults over fourteen walks to a
  records counter in a virtual three-level public building, then closes the
  gallery on their route. Participants who had stopped glancing before the
  closure made nearly three times as many approaches to the closed gallery,
  more the longer they had stopped, while practice as such predicted nothing;
  a closure notice posted at the upstream junction reached mainly those still
  reading the signs.
topic: >-
  When a route through a building stops being checked: a repeated-trials
  wayfinding experiment on sign-glancing and route perseverance after a
  concourse is reconfigured
