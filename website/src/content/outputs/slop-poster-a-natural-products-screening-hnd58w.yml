summary: >-
  A research poster from the School of Emergent Priorities reads the 214
  written rulings of one natural-products screening consortium's Attribution
  Panel, 2004 to 2025, as case law, coding the test each ruling applied to
  decide whether a modified antitumour derivative is still its natural parent
  compound. The scaffold test falls from 71 to 14 per cent of rulings as a
  lineage test rises from 10 to 63 per cent, though no ruling overrules the
  scaffold test and 38 distinguish it, and nine derivatives now hold a parent's
  designation while sharing no ring with it.
topic: >-
  a natural-products screening consortium's attribution panel, read as case
  law: how two decades of rulings on whether a modified antitumour derivative
  is still its natural parent compound drifted from a structural test to a
  lineage test
