title: Every Burden Needs a Plot
subtitle: >-
  Carrying Easements and Covenants through Land Readjustment as a
  Mixed-Integer Assignment Problem
authors:
  - Clemency Tredinnick
  - Ronja Oyelaran
preset: paper
school: School of Settled Matters
date: 2026-11-13
publishedAt: "2026-11-13T08:00:49+11:00"
doi: 10.5555/slop.tpl5jq
summary: >-
  A paper from the School of Settled Matters and the School of Emergent
  Priorities formulates the replotting step of a peri-urban land readjustment
  scheme as a mixed-integer assignment in which every easement, covenant,
  charge and lease must ride with its owner's new plot or be extinguished.
  Across 296 parcels and 94 encumbrances, 18 of the 25 location-bound burdens
  with a site can be carried for 5.0 m of mean owner displacement, while the
  last seven, mostly covenants whose benefited land the layout absorbs into
  road reserve, add a further 20.0 m and fall on 25 owners too few to block
  the scheme.
topic: >-
  land readjustment as an assignment problem: replotting peri-urban parcels in
  a growing Asian city so that every easement and covenant on the old parcels
  rides with some new one
