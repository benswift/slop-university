summary: >-
  A research-showcase brochure follows conducting polymers through three
  settings in which the University has taken them up: as soft electrodes laid
  against the unrecovered intervals of a borehole, as films and gels studied
  for how they age on the shelves and in the sheds where samples are kept,
  and as wall panels that change shade with a reading in place of a printed
  number. It quotes the researchers leading each strand and grounds the
  account in seven published outputs from all three schools.
