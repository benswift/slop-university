title: Called Last, Known First
subtitle: Timing a Junior Sports Club's Formal Pathway-Conversation Call
  Against the First Mention of a Cut in the Team Group Chat
authors:
  - Torun Ezeigwe
  - Thandiwe Solberg
preset: paper
school: School of Continuous Improvement
date: 2026-07-26
doi: 10.5555/slop.uklf1u
summary: >-
  A paper from the School of Continuous Improvement times 246 junior-sport
  tryout outcomes across twenty-one clubs and three codes against a club's
  formally rostered pathway-conversation call and the team's own group chat,
  finding the chat names the outcome first in three cycles out of four and
  that training the calling coach in a structured feedback script leaves the
  gap unchanged.
topic: >-
  comparing, across junior sports clubs that introduced a mandatory
  post-tryout "pathway conversation" call for players who don't make the
  team, how often the news has already reached the team group chat before
  that call is placed
pdf: /outputs/pdf/slop-paper-comparing-across-junior-uklf1u.pdf
pages: 5
