summary: >-
  A prospectus brochure from the School of Continuous Improvement invites
  prospective students to learn the slow evidentiary work by which fenced-off
  ground is declared fit for use again. It presents that work through the soil
  survey of the School of Underlying Conditions, the Master of Applied
  Measurement and the Trajectory Analytics Group, and rests its invitation on
  five published studies cited by title and DOI.
