title: Nobody Marks Themselves
subtitle: An Impartial Rule for Dividing a Field-Mapping Team's Mark
authors:
  - Ragnhild Uzoma
  - Torun Ezeigwe
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-11-05
publishedAt: "2026-11-05T04:01:16+11:00"
doi: 10.5555/slop.k4bmiw
summary: >-
  A paper from the School of Underlying Conditions replaces the field-mapping
  camp's self-inclusive peer-adjustment rule with a leave-yourself-out rule
  under which no student's own Contribution Statement can change their own
  mark. Recomputing 184 statements from three cohorts, it finds the rule moves
  the median student by 1.9 marks in 100 and removes the 7.3-mark average
  return to shifting ten points onto oneself, at an average cost of 1.7 marks
  to a team's agreed top contributor.
topic: >-
  impartial division of a field-mapping team's mark: a peer-report rule under
  which no student's own report can change their own share, applied to three
  years of field-camp contribution reports
