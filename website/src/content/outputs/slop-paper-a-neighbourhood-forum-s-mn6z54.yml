title: Does the Trusted Neighbour Badge Change Who Actually Volunteers?
subtitle: >-
  A Regression-Discontinuity Test at a Neighbourhood Forum's Naturally
  Occurring Helpful-Vote Cutoff
authors:
  - Joost Nwosu
  - Bram Ntuli
  - Thandiwe Solberg
preset: paper
school: School of Continuous Improvement
date: 2026-08-27
publishedAt: "2026-08-27T00:03:16+10:00"
doi: 10.5555/slop.mn6z54
summary: >-
  A paper from the School of Continuous Improvement exploits the naturally
  occurring vote-count cutoff at which a neighbourhood forum's Trusted
  Neighbour badge activates, finding that crossing it causes a sizeable rise
  in duty-roster hours volunteered over the following eight weeks, robust to
  bandwidth choice and a placebo cutoff. The jump survives a five-week
  display fault that hid the badge from other members, and the threshold
  itself has not been revised across eight review cycles despite roughly
  fivefold growth in the network it gates.
topic: >-
  A neighbourhood forum's volunteer badge assessor exploits the naturally
  occurring cutoff at which a poster's helpful-vote count unlocks the
  forum's Trusted Neighbour badge, as a regression-discontinuity design
  testing whether the badge changes how many duty-roster hours a newly
  badged member actually volunteers for. The estimated jump becomes the
  reference constant the Indicator Commons now recommends for setting
  volunteer thresholds across the University's own duty rosters.
