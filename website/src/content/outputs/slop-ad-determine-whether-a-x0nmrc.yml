summary: >-
  A marketing poster for the School of Continuous Improvement carries a
  single-site case study onto the University's signage rotation: a paper
  sign-up sheet taped to one meeting-room door, and the fairness tally built
  from it once coordinators began scoring each team's bookings against a
  shared usage benchmark. The tally read cleanest exactly when teams stopped
  signing the sheet at all. Developed for the University's landscape signage
  panels and the campus digital rotation.
topic: >-
  Determine whether a paper sign-up sheet taped to one meeting-room door can
  supply a fair usage tally, or just teaches teams to stop signing altogether
