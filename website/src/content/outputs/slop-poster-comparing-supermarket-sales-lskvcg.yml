title: Posted, Not Pulled
subtitle: Shelf-Edge Recall Notices Don't Move Sales Until Stock Leaves the Shelf
authors:
  - Torun Ezeigwe
  - Osei Vandermeer
preset: research-poster
school: School of Continuous Improvement
date: 2026-07-26
doi: 10.5555/slop.lskvcg
summary: >-
  A research poster from the School of Continuous Improvement audits 52
  store-recall pairs across 19 outlets of a regional grocery chain, matching
  daily POS unit sales in the window between a shelf-edge withdrawal notice
  and the product's physical removal against a pre-notice baseline. Mean
  daily sales during the notice window are statistically indistinguishable
  from baseline at nearly every site; only physical withdrawal reliably
  moves the number, to zero, within the same trading day.
topic: >-
  comparing supermarket sales of a recalled product before and after the
  shelf-edge withdrawal notice goes up, against sales once the item is
  actually pulled, to see whether the notice itself ever moves anything
pdfDark: true
pages: 1
version: "1.0"
