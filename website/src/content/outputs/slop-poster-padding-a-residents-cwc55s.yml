title: Simulating the Neighbours Who Never Write Back
subtitle: >-
  A Synthetic Household Panel for the Residents' Association Annual Survey
authors:
  - Mirela Hanke
  - Ronja Oyelaran
  - Torun Ezeigwe
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-19
publishedAt: "2026-08-19T01:01:03+10:00"
doi: 10.5555/slop.cwc55s
summary: >-
  A research poster from the School of Continuous Improvement pairs each of the
  148 dwellings that did not return a residents' association's annual letterbox
  survey with a synthetic household conditioned on kerb-visible cues, lifting
  recorded coverage from 31% to a reportable 100%. The panel raises concerns in
  categories returned surveys leave blank (52 footpath concerns per 100
  dwellings against none since 2019), agreement with a follow-up doorknock is
  moderate at best (weighted κ = 0.41), and the committee has minuted three
  concerns held by no resident.
topic: >-
  padding a residents' association's annual letterbox survey with synthetic
  households until coverage reads 100%, then minuting the concerns only the
  simulated neighbours hold
