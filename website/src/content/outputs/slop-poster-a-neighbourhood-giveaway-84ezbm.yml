title: The Badge They Say Doesn't Matter
subtitle: >-
  Self-Reported Weight Versus Revealed Win Rate in a Giveaway Group's
  Contested Claims
authors:
  - Solveig Adeyemi
  - Casimir Beng
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-22
publishedAt: "2026-08-22T07:01:28+10:00"
doi: 10.5555/slop.84ezbm
summary: >-
  A research poster from the School of Continuous Improvement surveys 42
  volunteer approvers across nine neighbourhood giveaway groups on how much a
  member's good-karma badge shapes a contested claim, then checks the answer
  against 118 contested three-way threads from the same groups. Self-reported
  reliance on the badge averages 17%; the higher-badge claimant's revealed win
  rate averages 70%, a gap that holds across item category, approver tenure,
  and how prominently a group displays the badge.
topic: >-
  a neighbourhood giveaway group's good-karma ranking badge next to each
  member's name, and a survey of the group's volunteer approvers on how much
  they think it decides who gets a contested item, checked against who
  actually wins
