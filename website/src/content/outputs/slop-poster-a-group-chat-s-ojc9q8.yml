doi: 10.5555/slop.ojc9q8
summary: >-
  A research poster from the School of Emergent Priorities treats a group
  chat's fifteen-minute message-edit deadline as a natural experiment,
  finding that disputes settled by a visible public correction run
  measurably longer than those settled by a silent edit. The University is
  now weighing the same deadline for staff email.
topic: >-
  A group chat's message-edit window closes exactly fifteen minutes after
  sending; Slop University exploits that fixed cutoff as a natural
  experiment, comparing messages edited just before and just after the mark
  for their effect on how long a thread's argument runs, then adopts the
  same fifteen-minute window as the retraction deadline for staff email
