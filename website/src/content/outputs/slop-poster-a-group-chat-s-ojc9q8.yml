title: Does Losing the Edit Button Make Group-Chat Arguments Run Longer?
subtitle: A regression-discontinuity design at group chats' fifteen-minute edit deadline
authors:
  - Kwame Lindqvist
  - Tove Ilesanmi
  - Sunniva Balogun
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-24
