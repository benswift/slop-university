doi: 10.5555/slop.9ej2sp
summary: >-
  A research poster from the School of Underlying Conditions surveys and
  interviews 412 third-generation young adults about the parts of their
  family's migration story they know happened and were never told, finding
  that those who can name such an interval score up to a full point higher on
  ethnic identity exploration than those who cannot, while their commitment to
  the group barely differs.
topic: >-
  The intervals family stories never recover: heritage silences and ethnic
  identity exploration among third-generation young adults
