title: Buying Green
subtitle: Future Time Perspective, Not Age, Predicts the Ripeness of Bananas Older Adults Choose
authors:
  - Marit Osayande
  - Eivind Onwuka
  - Gunnhild Ekwueme
preset: research-poster
school: School of Continuous Improvement
