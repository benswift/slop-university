doi: 10.5555/slop.aotpe9
summary: >-
  A research poster from the School of Continuous Improvement measures the
  future time perspective of 214 shoppers aged 62 to 93 at four suburban
  greengrocers, reads each a limited, control or expanded time-horizon prompt,
  and records the ripeness of the banana bunch they buy. Future time
  perspective predicts a greener choice and age adds nothing once it is known;
  the expanded prompt moves low-perspective shoppers most, the limited prompt
  high-perspective shoppers.
topic: >-
  Whether older adults' future time perspective, rather than their age,
  predicts how unripe the bananas they choose are, with a time-horizon
  manipulation at the shelf
