summary: >-
  A research poster from the School of Settled Matters traces 1,846
  administrative templates in use three years after four vocational-college
  mergers back to their pre-merger parents, finding that 19% descend from the
  absorbed college against the 4% its integration plan provided for, with the
  persistence concentrated in enrolment, assessment and student support and
  mostly carried under the acquiring college's header.
topic: >-
  Whose forms survive a merger: tracing the origin of every administrative
  template in use three years after four mergers of vocational colleges, and
  finding the absorbed partner's forms persist in student-facing functions
  where the integration plan said they would be retired
