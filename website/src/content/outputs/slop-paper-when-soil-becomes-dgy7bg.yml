title: When Soil Becomes a Medium
subtitle: The Redescription of a Soil-Bed Odour Filter in the Logbooks of a District Sewage Works, 1971-2002
authors:
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-27
publishedAt: "2026-10-27T21:01:25+11:00"
doi: 10.5555/slop.dgy7bg
summary: >-
  A paper from the School of Underlying Conditions reads thirty-one years of
  daily logbooks from a district sewage works that treated the air off its
  inlet channel by blowing it through a bed of paddock topsoil. Coding the
  1,625 entries that mention the bed by register, it finds that the operators
  stopped describing the bed as a soil and began describing it as filter
  packing in the decade after a manometer was fitted across the fan outlet,
  well before any of its material was replaced, and argues that the bed
  changed kind under a change of instrument rather than of substance.
topic: >-
  when soil becomes a medium: an archival history of a district sewage works' soil-bed odour filter, and how its operators' logbooks stopped describing the bed as a soil and began describing it as filter packing
