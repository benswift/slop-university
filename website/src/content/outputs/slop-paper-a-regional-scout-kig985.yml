title: Which Requirements Get Photographed?
subtitle: >-
  Evidence-Completeness Scoring and Requirement Selection Across a Regional
  Scout Association's Skill-Badge Programme
authors:
  - Runa Adegoke
  - Casimir Beng
preset: paper
school: School of Emergent Priorities
date: 2026-08-25
publishedAt: "2026-08-25T03:01:51+10:00"
doi: 10.5555/slop.kig985
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement analyses eighteen months of a regional Scout association's
  badge-evidence application, finding that photographable, single-sitting
  requirements clear near-total evidence rates while sustained or reflective
  requirements remain the least documented throughout the deployment.
topic: >-
  A regional Scout association rolls out a badge-evidence app that scores how
  complete each child's photographed proof is for a skill badge, and troop
  leaders start steering activities toward whichever requirements photograph
  well rather than whichever ones the kids actually need to practise.
