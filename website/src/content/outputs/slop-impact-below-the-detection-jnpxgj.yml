doi: 10.5555/slop.jnpxgj
summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 follows five
  years of work with laser gas-sensing laboratories on what happens to a
  sensitivity target once it has been met: a written review adopted by a
  regional university network after an analyser that met its target in 2022
  slid from first to fourth of four by 2025, 23 targets formally retired with
  collaborators, and a monthly format in which all 212 of a consortium's field
  stations report their in-field noise floor beside the quoted figure. Over the
  period the median ratio of the two rose from 2.1 to 3.4.
