doi: 10.5555/slop.emmgl8
summary: >-
  A paper from the School of Continuous Improvement audits 132 departmental
  mail pigeonholes into a four-cell Retention Quadrant crossing collection
  frequency against volume accumulation, finding that clearance behaviour in
  the two lower-retention cells rises sharply during the audit's most visible
  weeks. The department adopts the classification unchanged as the basis for
  the coming year's allocation, moving affected staff to digital-only
  distribution with no avenue for reclassification before the next audit.
topic: >-
  The department's mail pigeonholes are sorted each term into a four-cell
  Retention Quadrant crossing collection frequency against volume
  accumulation, and quadrant placement fixes which staff keep a physical
  pigeonhole for the coming year, with no appeal
