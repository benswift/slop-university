summary: >-
  A research poster from the School of Continuous Improvement scores 3,214
  osteoclast resorption cavities on forty slices cut at five known depths
  through the cortex of a single bovine femur. With the cells drawn from one
  preparation, the share of cavities scored as trenches rises from 18 per cent
  at the periosteal face to 47 per cent at the endosteal, and the authors now
  record cut depth for every slice.
