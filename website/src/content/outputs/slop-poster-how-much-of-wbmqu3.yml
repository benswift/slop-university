doi: 10.5555/slop.wbmqu3
summary: >-
  A research poster from the School of Underlying Conditions treats a 400 m
  cored hole whose bottom 100 m was not recovered as a half-inverse
  Sturm-Liouville problem, and reads off from the established theory that the
  lost quarter is uniquely determined by every second eigenfrequency of the
  column. A numerical experiment on three test profiles recovers nine modes of
  the lost interval from the first 40 eigenvalues and four from every second
  one; no spectrum of the column was recorded.
topic: >-
  How much of a borehole's unrecovered core is determined by the vibration
  spectrum of the column: the half-inverse Sturm-Liouville problem applied to
  core loss
