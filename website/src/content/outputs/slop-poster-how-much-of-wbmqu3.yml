title: What the Column Still Knows
subtitle: Partial-data inverse spectral theory for a borehole with unrecovered core
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
  - Brynjar Obiora
preset: research-poster
school: School of Underlying Conditions
