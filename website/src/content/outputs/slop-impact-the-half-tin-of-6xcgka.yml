summary: >-
  The School of Continuous Improvement's five-year impact report on retained
  holdings: an instrument that attaches a recorded intended use to a kept item,
  a review protocol that treats deferral as a permitted outcome, and
  twenty-two audited sites across which recorded intent rose at every holding
  type measured. The School's stated position is that this measures
  documentation rather than restraint.
topic: >-
  the half-tin of paint on the shed shelf, the spare tile behind the toilet,
  the drawer of unlabelled cables --- what a household or a community club
  keeps against a future need, and five years of the University's work turning
  that keeping into a scored, reviewable holding
