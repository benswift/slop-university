summary: >-
  A research poster from the School of Underlying Conditions places each
  four-voice sonority of a motet set whose altus partbook is lost in the
  orbifold of unordered pitch-class quadruples, where the missing voice traces
  a loop that meets the singular stratum wherever it would double a surviving
  part. In seven control motets whose altus survives in a later intabulation,
  the original altus supplies the missing chord member at 80% of 412
  incomplete sonorities against 52% and 49% for two published completions; in
  the 24 motets with no altus, a single regular completion remains at 288 of
  351.
