summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 looks back on
  the sixty-two decision protocols it drafted with collaborators, each naming,
  before a joint project began, the discipline that would hold the casting vote
  on each kind of question. Of the 418 disagreements later logged under those
  protocols, the casting vote was exercised nine times.
topic: >-
  the casting vote: the School's five years helping interdisciplinary project
  teams settle, before the work starts, whose discipline decides when their
  experts disagree
