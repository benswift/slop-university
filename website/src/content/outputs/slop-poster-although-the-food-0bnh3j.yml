doi: 10.5555/slop.0bnh3j
summary: >-
  A research poster from the School of Continuous Improvement matches one
  food truck's daily chalkboard special against its own walk-in fridge's
  stock log across an eight-week trading window. The specials board tracks
  the stock log's single soonest-to-use-by item on 34 of 37 observed trading
  days, and the University's Capability Sprints program adopts the match as
  recommended practice for other small food-service traders.
topic: >-
  Although the food truck's chalkboard advertises a new "today's chef's
  special" every morning, the dish it names tracks the walk-in fridge's
  soonest use-by date almost exactly — a single-site case study, in earnest
  case-method register with a teaching note's air, of one food truck's
  specials board and the stock log sitting behind it.
