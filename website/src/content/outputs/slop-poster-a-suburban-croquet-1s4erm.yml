summary: >-
  A research poster from the School of Continuous Improvement follows a
  suburban croquet club's fee-tracking spreadsheet as it accretes three
  seasons of handicap and attendance data, sorting the 48-member roll into
  a four-cell quadrant. Members in the quadrant's Keyholders cell hold most
  of the club's mallet-shed keys and grand-final places, and the committee
  has adopted the quadrant as its reissue and selection instrument outright.
topic: >-
  a suburban croquet club committee diverts its $2 name-tag replacement levy
  into a handicap-and-attendance tracking spreadsheet, then sorts members
  through the resulting quadrant to ration mallet-shed keys and grand-final
  selection
