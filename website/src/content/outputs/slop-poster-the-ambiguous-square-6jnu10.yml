doi: 10.5555/slop.6jnu10
summary: >-
  A research poster from the School of Underlying Conditions proves that a soil
  boundary interpolated between two-class auger holes is forced in every cell
  of a triangular grid but has two valid drawings in each checkerboard cell of a
  square grid, so that a square sheet with s such cells admits 2^s maps whose
  counts of mapped soil-A polygons differ by at most s. Twelve archived 15 × 15
  survey sheets hold 66 checkerboard cells in 2,352, and their original pencil lines
  resolve 58 of them for the soil the surveyor was following.
topic: >-
  The ambiguous square: on a square auger grid a checkerboard cell of two soils
  admits two boundary drawings while a triangular grid admits exactly one; a
  combinatorial proof, a count of the choices a surveyor is forced to make, and
  a re-drawing of archived survey sheets
