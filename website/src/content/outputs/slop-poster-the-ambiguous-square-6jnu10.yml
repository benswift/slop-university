title: The Ambiguous Square
subtitle: When a soil boundary drawn between auger holes is fixed by the holes, and when by the grid
authors:
  - Brynjar Obiora
  - Eskil Nwabueze
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-31
