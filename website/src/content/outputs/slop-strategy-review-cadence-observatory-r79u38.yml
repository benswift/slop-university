summary: >-
  Slop University's Strategic Plan 2026-2031 places the minutes-to-arrival
  countdown at every bus stop under a published standard, and commits the
  Review Cadence Observatory to hold the rejoin safeguard from a charging-bank
  finding in force at each stop after a first kerbside wave failed to reproduce
  it, retiring the safeguard at a stop only after three consecutive review
  cycles in which it still does not.
