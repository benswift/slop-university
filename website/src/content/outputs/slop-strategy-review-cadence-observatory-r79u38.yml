title: HEADWAY
subtitle: >-
  Headway Estimation, Arrival Display and Waiting-time Assurance Yardstick: A
  Strategic Plan for the Bus-Stop Countdown, Its Rejoin Safeguard and the Stops
  Where the Finding Has Yet to Reproduce
authors:
