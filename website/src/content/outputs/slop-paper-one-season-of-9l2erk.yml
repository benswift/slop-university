title: One Season of a Wetland
subtitle: Excursion Timing and Secondary Students' Reasoning About Seasonal Change at a Temporary Wetland
authors:
  - Bram Ntuli
  - Ingeborg Nwachukwu
  - Brynjar Obiora
preset: paper
school: School of Continuous Improvement
date: 2026-11-17
publishedAt: "2026-11-17T09:31:47+11:00"
doi: 10.5555/slop.9l2erk
summary: >-
  A paper from the School of Continuous Improvement and the School of
  Underlying Conditions audits 1,148 freshwater excursions approved for 37
  secondary schools over five years, 61.2% of them in the late-summer term the
  district's ecosystems unit occupies, and reports a class-randomised trial in
  which Year 9 students who visited one temporary wetland once in each term,
  for the same five hours on site, scored 2.1 points higher (of 6) on reasoning
  across seasons than students given the customary single day, with no
  difference on what one visit could show.
topic: >-
  One season of a wetland: school environmental-education excursions cluster in
  a single term, so students come to know a wetland in only one season; a
  timetable audit and a four-season repeat-visit trial
