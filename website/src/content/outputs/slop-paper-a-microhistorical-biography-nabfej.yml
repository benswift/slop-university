summary: >-
  An essay from the School of Underlying Conditions attempts the biography of
  an unnamed core logger from the 3,912 entries one hand wrote in the remarks
  column of a regional survey's borehole log sheets across thirty-one years of
  service, identified on 6,870 sheets from 412 holes. The entries give no
  birth, household or death, and the one apparent event, eleven weeks in which
  the hand changes, is left undecided between two readings. The essay argues
  that they support a biography of attention, and that the subject's
  namelessness is a condition to write under and not a gap to repair.
topic: >-
  A microhistorical biography of an unnamed core-shed logger, reconstructed
  from three decades of handwriting in the remarks column of a regional
  survey's borehole logs
