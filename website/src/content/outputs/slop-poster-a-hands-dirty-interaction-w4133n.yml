summary: >-
  A research poster from the School of Underlying Conditions compares four ways
  for eighteen hop selectors to take notes while their palms are coated in
  resin, across 432 video-coded rubs in one selection room, and reports that
  dictation is paid for in sniffs while a three-button foot pedal leaves the
  rub closest to its note-free baseline.
topic: >-
  A hands-dirty interaction study of how hop selectors take notes during the
  hand-rub, when resin-coated palms rule out the touchscreen: voice, foot-pedal
  and scribe input compared at the selection table
