doi: 10.5555/slop.m9x739
summary: >-
  A paper from the School of Underlying Conditions follows the plaster dental
  casts in a regional cleft unit's basement store through three regimes of
  keeping, each with its own catalogue and its own mark on the casts' bases:
  clinical record, masked and coded comparative evidence, and surplus sorted
  by a space review. Of the 4,377 casts on the shelves in 2009, 98 per cent of
  those once coded for comparison were retained, among them 167 that can no
  longer be matched to any patient, against 32 per cent of the never-coded
  series.
topic: >-
  How a regional cleft unit's plaster dental casts moved from clinical record
  to research evidence to storage problem, read as the career of a scientific
  object through an invented unit's cast store
