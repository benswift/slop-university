title: Nothing Happened to the Plaster
subtitle: Record, Evidence and Surplus in a Regional Cleft Unit's Store of Dental Casts, 1958–2011
authors:
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-10-25
