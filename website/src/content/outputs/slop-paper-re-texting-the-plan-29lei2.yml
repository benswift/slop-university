title: Harvest on the Downbeat
subtitle: Contrafactum and Text-Setting in Radio Songs Commissioned for Four Successive Development Plans
authors:
  - Anselm Threlkeld
preset: paper
school: School of Settled Matters
date: 2026-11-08
