title: A Hand in the Ground
subtitle: Attributing Unsigned Profile Descriptions in a Soil Survey's Card Archive, and How a Describer Became a Correction to the Soil
authors:
  - Brynjar Obiora
  - Iben Chikere
preset: paper
school: School of Underlying Conditions
date: 2026-11-02
publishedAt: "2026-11-02T11:31:16+11:00"
doi: 10.5555/slop.kupw80
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities follows a regional soil survey's eighteen-month effort to give
  describers to the 1,209 of its 3,412 legacy profile cards that carried no
  usable signature, read by senior staff from habits of notation and, for
  typed transcriptions, by a stylometric model. Once named, each describer's
  tendencies, estimated from pits two people had described, were applied to
  their cards as an offset, so that attribution begun as provenance ended as
  calibration, and the 137 cards no one could place were corrected as the work
  of a pooled describer.
topic: >-
  who described this pit: attributing unsigned legacy soil profile cards to
  their describers by habits of phrase, and how a describer's style becomes a
  correction applied to the soil
