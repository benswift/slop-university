title: Counted as Attended
subtitle: >-
  A submission from the School of Settled Matters to the Department of Policy
  Settings' consultation on the Review of the Length of a Treatment Session
authors:
  - Clemency Tredinnick
  - Anselm Threlkeld
preset: submission
school: School of Settled Matters
date: 2026-11-23
publishedAt: "2026-11-23T00:00:48+11:00"
doi: 10.5555/slop.cat9ry
summary: >-
  A submission from the School of Settled Matters answers five of the six
  questions in the Department of Policy Settings' review of the fifty-minute
  treatment session, drawing on the School's one approved study, in which
  twelve ninety-minute sessions conducted through an interpreter are recorded
  under the counting rule as twenty-four. It prefers Option 2 with a
  twenty-minute record interval after an interpreted session and the
  interpreter booked through it, supports the Department's preliminary view
  that outputs report the occasions participants attended, and asks that
  studies approved before commencement may elect into the varied setting.
topic: >-
  interpreted treatment sessions for participants seeking protection: the
  School of Settled Matters answers the review of the fifty-minute session,
  asking that a session conducted through an interpreter count once at its
  full length, with a longer record interval, and that approved studies may
  elect into the varied setting
