summary: >-
  A research poster from the School of Settled Matters ball-mills an in-house
  carboxylic acid with eight amino acids at 1:1 and stores the co-amorphous
  pairs in open dishes at 40 °C and 75% relative humidity for a year, finding
  that the degree of salt formation orders how long each pair stays amorphous
  (Spearman ρ = 0.96) while its glass transition temperature does not (ρ = 0.29).
topic: >-
  A co-amorphous screen of a model poorly soluble weak acid with eight amino
  acid coformers, asking whether the glass transition or the degree of salt
  formation better orders how long each pair stays amorphous under accelerated
  storage
