title: Down the Hole and Back Again
subtitle: >-
  A Strategic Plan for Downhole Sensing, a Reference Bore on the University's
  Own Ground, and Readings Held Provisional Until Their Instrument Returns
authors:
  - Vigdis Emenike
  - Ragnhild Uzoma
  - Torun Ezeigwe
preset: strategy
school: School of Underlying Conditions
date: 2026-10-29
publishedAt: "2026-10-29T09:01:17+11:00"
doi: 10.5555/slop.yslmbd
summary: >-
  Slop University's Strategic Plan 2026-2031 sets out a capability in sensing
  for deep and hot boreholes, built around a reference bore with a
  temperature-controlled interval on the University's own estate. Across five
  focus areas it commits the institution to a shared instrument pool, explicit
  gap entries and a roll of unreturned instruments, and a discipline under
  which every downhole reading stays provisional until the instrument that took
  it has come back up and passed a closing check.
topic: >-
  instruments that go down the hole and keep telling the truth: a plan to build
  the University's capability in downhole sensors for hot, deep boreholes, from
  a test bore on campus to the discipline of checking every instrument for drift
