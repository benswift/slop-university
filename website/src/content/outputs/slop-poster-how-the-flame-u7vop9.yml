summary: >-
  A research poster from the School of Emergent Priorities codes the combustion
  chamber in 412 cutaway and sectional sheets from one engine builder's
  drawing-office files to one of four motifs, and attributes the unsigned sheets
  to seven hands from incidental detail. Of the 61 sheets depicting
  low-temperature combustion engines, the earliest 19 retain the radiating
  burst and the remaining 42 fill the chamber with the stipple screen the
  office had used for coolant since its first decade.
topic: >-
  How the flame is drawn: an art historian's iconographic study of an invented
  archive of engine cutaway illustrations, and what the draughtsmen did when
  low-temperature combustion gave them no flame front to draw
