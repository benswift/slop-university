title: Where the Prohibition Ends
subtitle: Snares follow the marker stones, not the bell, at a grove where killing is forbidden
authors:
  - Anselm Threlkeld
  - Clemency Tredinnick
  - Odalys Penhallow
preset: research-poster
school: School of Settled Matters
