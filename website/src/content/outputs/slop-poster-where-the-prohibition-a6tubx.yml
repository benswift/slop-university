doi: 10.5555/slop.a6tubx
summary: >-
  A research poster from the School of Settled Matters counts new wire-snare
  sets on 32 belt transects across the boundary of a forest grove whose
  customary rule forbids killing within hearing of its bell, a boundary later
  fixed by a line of marker stones. Over twelve monthly sweeps, snaring rises
  from under one to more than forty sets per hectare in the first ten metres
  past the stones on both slopes, whether the bell's reach runs a median 48
  metres beyond them or falls 31 metres short, and a breakpoint model on
  distance from the stones far outperforms one on distance from the bell.
topic: >-
  Where the prohibition ends: snare density along transects across two
  readings of a sacred grove's boundary, the bell-reach of its customary rule
  against killing and the marker-stone line that later fixed it
