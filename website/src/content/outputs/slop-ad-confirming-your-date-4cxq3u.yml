summary: >-
  A marketing poster for the Capability Sprints, the School of Continuous
  Improvement's short-course and executive-education line, staged on a chemist's
  counter where a stapled paper bag changes hands after a question about a date
  of birth --- a check that two people sharing a name and a birthday will both
  pass, and that the counter's verification rate counts as having been answered.
  Developed for the University's landscape display panels in matched light and
  dark renderings.
