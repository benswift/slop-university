title: Twenty Cells Certify a Thousand Punnets
subtitle: >-
  A single-sampling germination acceptance plan for seedling lots, and the
  verdict that lands after the sale
authors:
  - Osei Vandermeer
  - Joost Nwosu
  - Solveig Adeyemi
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-17
publishedAt: 2026-08-17T20:00:41+10:00
doi: 10.5555/slop.nueyan
summary: >-
  A research poster from the School of Continuous Improvement specifies a
  single-sampling attributes plan for the seedling punnets a garden-centre chain
  receives, drawing twenty cells from each incoming lot and accepting on one
  failure to germinate. Across 316 lots over fourteen months the plan
  discriminates as designed, at a producer's risk of 3.6 per cent and a
  consumer's risk of 10 per cent at eighteen per cent nonconforming, but returns
  its verdict a median of twenty-one days after receipt against a median shelf
  residence of eight, so 91.5 per cent of lots are certified after the last
  punnet has been sold.
topic: >-
  Germination-test a sample of cells from every incoming lot of seedling punnets
  at a garden-centre chain, derive the operating-characteristic curve for the
  resulting single-sampling acceptance plan, and adopt it as the chain's
  incoming-goods standard even though the three-week verdict lands after the lot
  has been sold, so a failed lot is raised as a retrospective finding against the
  gardens it is already growing in.
