summary: >-
  A research poster from the School of Continuous Improvement reports a
  fourteen-week deployment of a household menu-optimiser across 46
  households, in which the instrument's own preference-fit score climbs from
  61% to 89% while plate-scraped leftover mass rises alongside it, and the
  Adaptive Metrics Lab adopts the fit score as the reference instrument for
  the coming Capability Sprints household-provisioning module regardless.
topic: >-
  A menu-optimiser instrument built for the household meal-plan duty
  officer, balancing every member's stated preferences into a single weekly
  score, deployed across share houses and families to see whether the
  highest-scoring week is also the one everyone actually eats
