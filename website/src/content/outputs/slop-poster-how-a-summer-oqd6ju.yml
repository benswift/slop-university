title: Jackets Back On for the Client
subtitle: How a Few Meeting Rooms Decide the Chiller Savings of a Summer Dress Code
authors:
  - Edda Nwafor
  - Thandiwe Solberg
  - Renke Sabel
preset: research-poster
school: School of Continuous Improvement
