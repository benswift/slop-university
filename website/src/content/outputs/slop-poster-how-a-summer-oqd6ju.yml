doi: 10.5555/slop.oqd6ju
summary: >-
  A research poster from the School of Continuous Improvement meters fourteen
  summer weeks across five office buildings whose jacket-optional dress code
  raised the open-plan cooling setpoint from 23.0 to 25.5 °C, and finds
  metered chiller-plant savings of 3 to 8 per cent against 15 to 19 per cent
  modelled. Client meeting rooms, three per cent of floor area, held the
  shared supply-air reset in 71 per cent of occupied hours, with overrides
  clustering before external bookings; the one building whose meeting rooms
  ran on their own loop kept most of its modelled saving.
topic: >-
  how a summer dress code that drops the jacket lets an office building raise
  its cooling setpoint, and how the few client meeting rooms where jackets go
  back on decide whether the chiller saves anything
