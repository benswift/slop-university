title: Count the Members a Period Back
subtitle: >-
  A submission from the School of Underlying Conditions to the Department of
  Policy Settings' Review of Quorum and Resolutions in the University's Units
authors:
  - Vigdis Emenike
  - Ragnhild Uzoma
preset: submission
school: School of Underlying Conditions
date: 2026-11-17
publishedAt: "2026-11-17T08:02:47+11:00"
doi: 10.5555/slop.qwv1up
summary: >-
  A submission from the School of Underlying Conditions answers eight of the
  twelve questions in the Department of Policy Settings' consultation on
  quorum and resolutions in the University's units. Reading a unit's minutes
  as a monitoring record, it proposes a third option in which a unit's quorum
  is counted on the greater of its present membership and its membership a
  teaching period earlier, so that the quorum falls only after a contraction
  has persisted, and asks that each minute record the membership it counted,
  that a sitting member be drawable from any school, and that an inquorate
  resolution stay open to confirmation until the unit's next meeting.
topic: >-
  a lagged quorum: the School of Underlying Conditions reads a unit's meeting
  attendance as a time series, and asks that quorum follow a shrinking
  membership down only after a lag, and that an inquorate resolution be
  confirmed at the unit's next meeting rather than within sixty days
