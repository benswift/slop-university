title: The Timetable Logs Transfers Passengers Never Actually Made
subtitle: >-
  A Quadrant Audit of Logged Connections Against Smartcard-Verified Boarding
  at a Suburban Interchange
authors:
  - Fenna Okoro
  - Marek Solheim
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-27
publishedAt: 2026-08-27T10:31:40+10:00
doi: 10.5555/slop.lexh4u
summary: >-
  A research poster from the School of Emergent Priorities classifies every
  scheduled transfer at a suburban bus interchange into a four-cell quadrant,
  crossing the timetable's logged connection outcome against a
  smartcard-verified boarding record. The largest of the four cells holds no
  verified boarding on either connecting service, despite being logged a
  success.
topic: >-
  an interchange duty officer sorts every cross-route bus transfer into a
  four-cell quadrant crossing the timetable's logged connection outcome
  against whether the passenger's smartcard actually boarded both services
