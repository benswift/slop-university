doi: 10.5555/slop.laat50
summary: >-
  A School of Continuous Improvement Impact Report pairs five years of a
  home solar app's daily self-sufficiency score against an independently
  calibrated meter at 1,240 households' grid connection points, finding the
  two track closely on an ordinary day and diverge most in the week
  daylight saving begins, and that households check the score most often at
  exactly the hours it is least settled.
topic: >-
  five years measuring whether a home solar app's daily self-sufficiency
  score tracks what a household actually draws from the grid, or just how
  the app defines a day
