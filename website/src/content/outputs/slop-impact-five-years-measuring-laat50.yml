title: A Slightly Different Question
subtitle: >-
  Five Years Measuring a Home Solar App's Daily Self-Sufficiency Score
  Against an Independently Metered Grid Draw
authors:
  - Casimir Beng
  - Osei Vandermeer
  - Bram Ntuli
preset: impact-report
school: School of Continuous Improvement
date: 2026-08-08
