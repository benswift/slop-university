title: Back Over the Fence by Saturday
subtitle: A Five-Level Maturity Model for Garden-Tool Lending Between Neighbouring Households
authors:
  - Marit Osayande
  - Thandiwe Solberg
  - Bram Ntuli
preset: paper
school: School of Continuous Improvement
date: 2026-09-16
publishedAt: "2026-09-16T14:09:32+10:00"
doi: 10.5555/slop.ulgtaw
summary: >-
  A paper from the School of Continuous Improvement specifies a five-level
  Tool-Return Maturity Model scoring how reliably neighbouring households
  record, chase, and return borrowed garden tools, applying it across 46
  streets in three neighbourhoods. The assigned level tracks only weakly
  against an independently logged neighbour-dispute rate, and the district's
  Community Garden Trust has adopted Level 3 attainment as an eligibility
  threshold for its annual community-garden plot ballot.
topic: >-
  What turns a borrowed garden ladder into a returned one? A five-level
  maturity model scores neighbouring households' tool-lending etiquette, and
  the community garden plot ballot favours whichever street reaches Level 3.
