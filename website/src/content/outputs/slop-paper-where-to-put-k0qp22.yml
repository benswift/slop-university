title: Where the Lattice Starts
subtitle: Vertex Packing and Valley Dose for Lattice Radiotherapy in 240 Synthetic Irregular Targets
authors:
  - Ylva Onyekwere
  - Bram Ntuli
preset: paper
school: School of Emergent Priorities
date: 2026-10-23
