doi: 10.5555/slop.k0qp22
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement treats the placement of high-dose vertices in lattice
  radiotherapy as a constrained sphere-packing problem, comparing four placement
  rules across 240 simulated irregular targets under an analytic dose kernel.
  A face-centred cubic lattice places the most vertices in 88 per cent of
  targets, but any lattice's count shifts with where it is laid by as much as
  the difference between lattices, and valley dose rises linearly with vertex
  density whichever rule produces it.
topic: >-
  where to put the vertices: lattice radiotherapy vertex placement as a
  constrained sphere-packing problem in synthetic irregular targets, trading
  vertex count against valley dose
