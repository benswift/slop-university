title: A Stepped-Wedge Trial of Restricted Out-of-Order Notices
subtitle: >-
  Unauthorised Notices, Fault-to-Notice Delay, and Time to Repair Across 38
  Suburban Railway Stations
authors:
  - Marit Osayande
  - Solveig Adeyemi
  - Ronja Oyelaran
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-18
publishedAt: 2026-08-18T10:04:04+10:00
doi: 10.5555/slop.gav3rv
summary: >-
  A research poster from the School of Continuous Improvement reports a
  stepped-wedge cluster-randomised trial across 38 suburban railway stations,
  in which out-of-order notices were reserved to rostered staff working from a
  serialised pad and unauthorised notices removed on sight. Unauthorised
  notices fell from 2.8 to 0.3 per station-week while the pooled median
  interval from fault onset to first visible notice rose from 5.2 to 19.4
  hours, with the interval from first notice to repair statistically
  indistinguishable across the trial.
topic: >-
  A metropolitan rail operator rules that only a rostered staff member may
  declare a machine out of order, replacing the taped sheet of A4 anyone could
  put up with a serialised defect-notification pad; a stepped-wedge
  cluster-randomised trial across 38 suburban stations finds unauthorised signs
  all but disappear while faults sit unmarked far longer and time-to-repair
  does not move, after which the operator issues a serialised pad to the
  travelling public and reports notifications lodged as a passenger-engagement
  figure.
