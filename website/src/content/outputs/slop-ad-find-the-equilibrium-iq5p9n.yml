summary: >-
  A marketing poster from the School of Emergent Priorities sets a graduate
  seminar around a long table, a blank grid laid between the students and one
  counter mid-move, beneath an invitation to find the equilibrium before anyone
  else does. The campaign presents the Master of Priority Studies as training in
  reading an institution's agenda as a set of interdependent moves, and directs
  the prospective student to the program and to the School's published record.
  Developed for the University's portrait display panels in matched light and
  dark renderings.
topic: >-
