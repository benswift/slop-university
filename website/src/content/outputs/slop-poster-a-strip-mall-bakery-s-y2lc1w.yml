summary: >-
  A research poster from the School of Continuous Improvement follows a
  single strip-mall bakery across a fourteen-week lease-review window,
  matching its landlord's doorway footfall counter against the shop's own
  delivery log. Counted footfall crossed the lease's rent-step threshold
  twice before settling into a stable band beneath it, a shift traced to how
  delivery trolleys were walked through the doorway rather than to any
  change in trade; the resulting heuristic is now taught as a Capability
  Sprint exhibit and piloted with further leaseholders.
topic: >-
  a strip-mall bakery's rent-indexed doorway footfall counter, and the
  single-site case study of how its owner learned exactly which daily
  movements the beam would count as a customer, kept inside the safe band
  between the rent-step and non-renewal thresholds -- now taught as a
  Capability Sprint exhibit and piloted as guidance for other leased tenants
