title: Still Sand, Already Mud
subtitle: The Development of Order Effects in Children's Categorisation of a Graded Sediment Series
authors:
  - Brynjar Obiora
  - Gunnhild Ekwueme
preset: paper
school: School of Underlying Conditions
date: 2026-11-22
