doi: 10.5555/slop.lr3bal
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities asks 164 children in Foundation to Year 6 of two primary schools to
  call fifteen moist sediment samples, graded from 4% to 88% fines, sand or
  mud, in random, ascending and descending order. The unordered boundary sits
  near 46% fines at every age, but the order effect reverses: the youngest
  children hold the earlier word 2.7 steps too long, Year 6 children give it up
  1.2 steps early, and the sign changes at about 8.6 years.
topic: >-
  children aged five to eleven sorting a graded series of sediment jars into
  sand and mud, presented ascending and descending, finding younger children
  hold the earlier word past the midpoint while older children abandon it early,
  the order effect reversing in sign between seven and nine
