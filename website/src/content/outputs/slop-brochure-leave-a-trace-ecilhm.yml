summary: >-
  A prospectus for prospective research students presents the School of
  Underlying Conditions' isotope work as the craft of placing a label and
  keeping track of it, through labelled standards checked month by month,
  groundwater read for the heavy atoms it carries, and the provenance of
  stockroom reagents and drill core. It closes on the Impact Pathway Atlas,
  which follows each student's work from first submission onward, and rests
  the invitation on five published studies cited by title and DOI.
topic: >-
  leave a trace: a prospectus for the University's isotope laboratories,
  selling prospective students on the craft of the label --- swapping one
  hydrogen for a deuterium so a molecule can be followed through a reaction, a
  water or a rock --- and on a university that means to follow its students
  the same way
