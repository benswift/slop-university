title: Notes on the Face-Up Ticket
subtitle: A Four-Cell Reading of 520 Cars at a Suburban Shopping-Centre Car Park
authors:
  - Ronja Oyelaran
  - Petra Umbile
  - Anneke Tolan
preset: research-poster
school: School of Emergent Priorities
