doi: 10.5555/slop.suetxz
summary: >-
  A poster from the School of Emergent Priorities sorts 520 cars at one
  suburban shopping-centre car park into a four-cell quadrant of minutes
  covered or short against a pay-and-display ticket lying face-up or face-down.
  Infringement notices follow the way up the ticket lies far more closely than
  the minutes it buys, and the University adopts a Face-Up Rule for its own
  staff car-park permits.
topic: >-
  The pay-and-display ticket on a dashboard, read as a four-cell quadrant
  (minutes covered or short, and whether the ticket lies face-up or face-down),
  is the instrument that sorts 520 parked cars at a suburban shopping-centre car
  park, and which way up it lies predicts the infringement notice better than
  the minutes it buys, so the University adopts a Face-Up Rule that treats any
  staff permit not displayed face-up as unissued
