title: Returned to Lawn
subtitle: >-
  The Department of Policy Settings answers questions taken on notice by the
  Committee on Settings Oversight on the review of informal paths worn across
  the University's lawns
authors:
  - Ragnhild Uzoma
  - Clemency Tredinnick
  - Marek Solheim
preset: questions-on-notice
date: 2026-11-21
publishedAt: "2026-11-21T10:01:46+11:00"
doi: 10.5555/slop.828yay
summary: >-
  The Department of Policy Settings answers five questions on section 22 of
  the Slop University (Grounds and Foreshore) Determination 2024, under which a
  line worn across a lawn is entered on the worn-line schedule and, at the next
  half-yearly grounds review, either formalised as a path in the Register of
  Paths or returfed and its entry closed, taken on notice at the Committee on
  Settings Oversight's Supplementary hearings of 19 November 2026 or lodged in
  writing after them. Its answers report that of 171 lines entered across four
  reviews, 22 were formalised, 146 reinstated and three deferred; hold no
  record of the course of reinstated lines or of how many were worn again,
  closed entries being destroyed twelve months after closure; confirm that the
  period for which a line has been walked is not among the matters the review
  considers; decline on resourcing to recover the reasons for each
  reinstatement; and answer that the Register of Paths, as determined, shows
  only paths constructed.
topic: >-
  the worn-paths setting: the Committee presses the Department on the grounds
  setting under which informal paths worn across the University's lawns are
  reviewed after a fixed interval and either paved into the register of paths
  or returfed and struck from it, and on what the record keeps of the paths
  returfed
