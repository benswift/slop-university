title: The Dry Bench
subtitle: Slop University's Strategic Plan 2026-2031 builds its heterocyclic chemistry around solvent-minimal methods from the first bench
authors:
  - Signy Okpara
  - Halvard Nnamani
  - Sunniva Balogun
preset: strategy
school: School of Continuous Improvement
