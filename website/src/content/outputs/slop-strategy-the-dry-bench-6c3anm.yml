doi: 10.5555/slop.6c3anm
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the University to becoming
  a centre for the synthesis and reactivity of heterocycles, built on
  solvent-minimal and mechanochemical methods from the outset rather than
  retrofitted later. Its four priorities make the dry bench the default for new
  routes, focus research on ring construction and late-stage modification, teach
  synthesis that way from the first practical class, and treat open method
  records and shared instruments as research infrastructure.
