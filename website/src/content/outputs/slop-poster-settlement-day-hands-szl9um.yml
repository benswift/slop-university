doi: 10.5555/slop.szl9um
summary: >-
  A research poster from the School of Emergent Priorities inventories 412
  timed and scheduled behaviours across 61 recently transferred households,
  scoring each on attributability, amendability, and accommodation. Fewer than
  half could be both named and amended; the poster proposes a four-class
  custody taxonomy (attested, inherited, orphaned, feral) and finds households
  accommodate inherited schedules rather than amend them.
topic: >-
  settlement day hands over the deed, the keys, and the alarm code, but not the
  6am sprinkler --- a field inventory of households living inside automations
  set by people who no longer live there, scoring every timed behaviour in the
  house on who can name it, who can alter it, and who merely reschedules life
  around it, towards a custody taxonomy of inherited domestic automation
