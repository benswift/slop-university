summary: A short profile of Associate Professor Casimir Beng, Lead of the Adaptive
  Metrics Lab, told largely in his own words. Trained as a control engineer, Associate
  Professor Beng describes how the lab tests whether the everyday measures organisations
  rely on, from a self-checkout's error prompt to a training checkbox and a smart
  irrigation controller, record what they claim to. The video also marks his standing
  as the University's most published and most cited researcher.
