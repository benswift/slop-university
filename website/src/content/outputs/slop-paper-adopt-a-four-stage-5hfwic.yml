title: A Four-Stage Item-Control Maturity Model for the Suburban Fitting Room
subtitle: District Visits Sequenced from the Attested Stage
authors:
  - Ingeborg Nwachukwu
  - Osei Vandermeer
  - Joost Nwosu
  - Torun Ezeigwe
preset: paper
school: School of Continuous Improvement
date: 2026-08-25
publishedAt: "2026-08-25T21:00:14+10:00"
doi: 10.5555/slop.5hfwic
summary: >-
  A paper from the School of Continuous Improvement specifies a four-stage
  Fitting-room Item-Control Maturity Model for a 48-store suburban clothing
  chain and reports a deployment in which attested stage became the ranking
  input to the district-visit sequencer. Visit cadence concentrated on
  Stage-3 (plastic six-item tag) and Stage-4 (RFID clip) stores; unknown-loss
  shares did not separate by stage. Five of six Stage-4 attestations described
  a clip kit that remained in the stockroom cupboard. Recoding Stage 4 as
  Stage 3 left the visit order almost unchanged (Kendall tau = 0.98).
topic: >-
  Adopt a four-stage fitting-room item-control maturity model as the rule
  that sequences a clothing chain's district-manager store visits, counting
  the plastic six-item tag as Stage Three.
