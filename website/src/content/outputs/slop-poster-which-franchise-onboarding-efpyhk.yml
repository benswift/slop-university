title: Which onboarding quadrant should decide the first Saturday shift?
subtitle: Four named cells of the franchise training video, bound to the first-fortnight floor roster
authors:
  - Marit Osayande
  - Ingeborg Nwachukwu
  - Hedvig Anyanwu
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-15
