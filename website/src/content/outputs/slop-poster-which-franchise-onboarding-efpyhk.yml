doi: 10.5555/slop.efpyhk
summary: >-
  A research poster from the School of Continuous Improvement codes 214
  franchise onboarding sessions at 38 sites into four named cells of the
  training video and its quiz, and finds Skipped-passed accounts for 63% of
  first-Saturday shifts. Partner sites adopt that cell as the sole
  first-fortnight floor rule, with no override.
topic: >-
  Which franchise-onboarding quadrant should decide who is rostered onto a
  customer-facing Saturday shift in the first fortnight?
