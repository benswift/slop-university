doi: 10.5555/slop.e38kfm
summary: >-
  A research poster from the School of Continuous Improvement scores 71
  apartment-building committees' resident group chats against a five-level
  Group-Chat Governance Maturity Index, tracked across six quarterly
  rounds against an independent audit of how disputes were actually
  resolved. Committees keep improving on the Index's own criteria after
  crossing Level 3, the threshold at which a strata manager grants chat
  autonomy, but the share of disputes the independent audit finds resolved
  outside the monitored thread rises from a pre-crossing median of 15% to
  a post-crossing median of 51%.
topic: >-
  measuring group-chat governance maturity in apartment-building
  residents' chats, scored against a five-level index, and what crossing
  level three buys a building's committee
