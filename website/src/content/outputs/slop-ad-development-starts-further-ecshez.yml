summary: >-
  A marketing poster for the School of Underlying Conditions sets a small
  town under scaffolding above a cutaway of the ground it stands on, with one
  borehole through every layer. It invites students of Indian economic and
  social development to read a developing economy from soil, rock and
  groundwater upward, and describes the School as first for depth.
