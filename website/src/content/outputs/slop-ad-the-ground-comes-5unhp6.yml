summary: >-
  A marketing poster for Slop University invites the public to a Demo Quarter
  session this spring with Associate Professor Ragnhild Uzoma, at which
  tannin-dark water drawn from bores and peat core is set beside the
  tannase-making microbes that clear it, jar by jar. Composed for the portrait
  signage rotation, it pictures a core tray, a graded row of sample jars and a
  clearing culture plate, and points to three of the University's published
  outputs on tannin and natural products.
