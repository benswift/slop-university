title: Deploying a Milk-Rostering Service Across 46 Shared Workplace Kitchens
subtitle: >-
  Off-roster purchasing fell to near zero, mornings without milk rose, and the
  ledger was adopted regardless
authors:
  - Sten Okwuosa
  - Joost Nwosu
  - Ingeborg Nwachukwu
