summary: >-
  A research poster from the School of Continuous Improvement reports a
  fourteen-month deployment of the Shared Kitchen Rostering Service across 46
  shared workplace kitchens, in which a rota nominates the next milk purchaser
  and posts each rostered purchase to a per-person contribution ledger. Buying
  outside the roster fell from a pooled 4.1 to 0.3 purchases per site-month with
  no recovery, mornings on which the fridge held no milk rose from 1.2 to 2.9,
  and the ledger held 66 per cent of observed purchases.
topic: >-
  Build a rostering service that decides whose turn it is to buy the milk for a
  shared workplace kitchen, deploy it across forty-six workplaces for two terms,
  and report what it does: off-roster purchasing falls to almost nothing, the
  fridge runs dry more often than before, and the University responds by
  adopting the service's contribution ledger as the record of who has
  contributed and making a nil return referrable.
