summary: >-
  A paper from the School of Underlying Conditions reads the minute books of one
  colonial presbytery from 1852 to 1891 beside the session books of two
  congregations whose bounds it fixed along a creek in 1858. When a flood moved
  the creek, the court kept the line where the water had been and ruled that
  discipline follows the dwelling and not the sitting; the essay argues that a
  division the Westminster divines had commended as expedient came to be treated
  as a fact about the ground.
topic: >-
  where a nineteenth-century Presbyterian court drew the bounds between its
  congregations, and how a line between two sessions decided which elders
  disciplined the households living along it
