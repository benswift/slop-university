title: On Which Side of the Creek
subtitle: The Bounds of Congregations and the Reach of Discipline in a Nineteenth-Century Presbytery
authors:
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-11-02
