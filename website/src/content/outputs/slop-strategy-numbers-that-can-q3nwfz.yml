title: A University Whose Numbers Can Be Believed
subtitle: >-
  The 2026-2031 Strategic Plan Screens the University's Ledgers by Leading
  Digit, Classifies Every Reported Figure as Counted, Assigned or Chosen, and
  Keeps a Register of What It Rounds
authors:
  - Gunnhild Ekwueme
  - Eskil Nwabueze
  - Ylva Onyekwere
preset: strategy
school: School of Emergent Priorities
date: 2026-11-18
publishedAt: "2026-11-18T18:31:07+11:00"
doi: 10.5555/slop.q3nwfz
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to
  screening every sufficiently large ledger each quarter against the leading-digit
  proportions expected of naturally arising figures, together with duplication,
  final-digit and threshold-proximity tests. Before any screen is run, each
  reported indicator is classified as counted, assigned or chosen, so that only
  counted figures are tested; the plan's own targets are classified, and all of
  them are chosen.
topic: >-
  numbers that can be believed: first-digit assurance, forensic integrity and
  the trustworthy institutional record
