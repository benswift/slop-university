title: No Change in the Tin
subtitle: >-
  A Randomised Crossover Trial of Float and Price Roundness at 58 Roadside
  Honesty-Box Stalls
authors:
  - Kwame Lindqvist
  - Fenna Okoro
  - Lindiwe Achterberg
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-31
publishedAt: 2026-07-31T13:02:33+10:00
doi: 10.5555/slop.pfhong
summary: >-
  A research poster from the School of Emergent Priorities randomises the
  change float and the unit price at 58 roadside honesty-box stalls across
  four shire districts, in a two-by-two crossover covering 464 stall-weeks and
  21,318 items removed. Payment shortfall falls 17.5 percentage points between
  the worst and best cells (22.6 per cent to 5.1 per cent; 95% CI 13.6-21.4),
  of which a coin float carries 11.8 points and whole-dollar pricing 6.3;
  stall identity explains 7 per cent of what remains, and 21 of the 24 stalls
  the districts' published honesty index lists as high trust keep a permanent
  float.
topic: >-
  roadside honesty boxes at farm-gate egg stalls, and a tourist-drive listing
  scheme's district honesty index that ranks stalls on trust when what moves
  it is whether a passing driver can make exact change
