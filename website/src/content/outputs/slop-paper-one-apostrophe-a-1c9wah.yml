summary: >-
  A paper from the School of Settled Matters reads all 233 letters a small
  town's weekly newspaper printed between 1961 and 2004 on whether the town's
  name takes a possessive apostrophe, finding that every argument had been made
  by 1972 and that later letters answered each new surface bearing the name.
  A 1997 gazettal by the state's place-names authority did not end the
  correspondence; the editor's fifth closure, in 2004, referred readers to the
  paper's own files and did, although the town's shopfronts remain almost evenly
  divided on the spelling.
topic: >-
  one apostrophe: a cultural history of the forty-year argument on a regional
  newspaper's letters page over whether a small town's name takes a possessive
  apostrophe, and of how the town stopped arguing it while its signs, school
  jumpers and shopfronts still disagreed
