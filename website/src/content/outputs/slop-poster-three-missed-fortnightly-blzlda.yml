title: A Third Missed Inspection Sends the Weeding to the Gate
subtitle: A Quasi-Experiment at the Two-Miss, Three-Miss Threshold in Fourteen Allotment Associations
authors:
  - Tove Ilesanmi
  - Marek Solheim
  - Anouk Mensah
preset: research-poster
school: School of Emergent Priorities
date: 2026-10-09
publishedAt: "2026-10-09T14:30:55+11:00"
doi: 10.5555/slop.blzlda
summary: >-
  A research poster from the School of Emergent Priorities compares 318
  allotment plots either side of the rule that pins a yellow notice to a gate
  after a third missed fortnightly inspection, using 40,704 quadrat counts
  across fourteen associations. Weed clearance in the first two metres rises
  from 13% to 61% at the third miss while clearance beyond four metres does not
  move, and the association now stakes the inspector's line at the back fence
  and fails any plot cleared at the gate ahead of its fence end.
topic: >-
  Three missed fortnightly inspections is when the community allotment
  association pins a yellow notice to a plot's gate, so a plot with two misses
  and a plot with three misses sit side by side in the same soil; comparing them
  across that threshold, the notice sends the tenant's weeding to the strip of
  bed visible from the path, and the association lays the inspector's measuring
  line along the back fence instead
