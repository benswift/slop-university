title: The Pumps Hold the Frequency Up
subtitle: Irrigation load and a ROCOF islanding relay, replayed through a year of one rural feeder
authors:
  - Odalys Penhallow
  - Casimir Beng
preset: research-poster
school: School of Settled Matters
