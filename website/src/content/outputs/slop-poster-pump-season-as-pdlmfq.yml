doi: 10.5555/slop.pdlmfq
summary: >-
  A research poster from the School of Settled Matters replays 160 islanding
  events, sampled from a year of one rural feeder's recorded load, through a
  rate-of-change-of-frequency relay at a single setting on a hardware-in-the-loop
  rig. Forty were not tripped within two seconds, rising from 2 of 40 where
  induction motors made up under a tenth of the load to 21 of 40 where they made
  up more than two-fifths, all of them in irrigation-season late afternoons.
topic: >-
  Pump season as a non-detection zone: whether induction-motor irrigation load
  lets a rate-of-change-of-frequency islanding detector miss islands on one
  rural feeder, replayed through a year of recorded load
