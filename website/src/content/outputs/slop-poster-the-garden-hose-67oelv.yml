title: Towards a Hose That Is Away
subtitle: How 34 householders say a garden hose is finished with, in their own terms
authors:
  - Solveig Adeyemi
  - Edda Nwafor
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-09
publishedAt: "2026-10-09T01:01:56+11:00"
doi: 10.5555/slop.67oelv
summary: >-
  A research poster from the School of Continuous Improvement interviews 34
  householders at the outdoor tap of 29 households and keeps their own phrases
  as the codes, finding that 27 judge a hose away by what no one has said about
  it while 12 count coiling. The University's outdoor-tap register now takes
  the participants' four words as its only entries and enters a hose as away
  only on the word of two occupants of the adjacent building.
topic: >-
  The garden hose: interviews with householders on what makes a hose 'away'
  rather than merely not in use, reported in their own terms, and the
  two-neighbour attestation the University's grounds register adopts from them
