title: Unto the Third and Fourth Generation
subtitle: >-
  Inherited Guilt and Answerability in Sixty-Six Budget Speeches, 1958–2023
authors:
  - Gunnhild Ekwueme
  - Marek Solheim
  - Anselm Threlkeld
preset: research-poster
school: School of Emergent Priorities
