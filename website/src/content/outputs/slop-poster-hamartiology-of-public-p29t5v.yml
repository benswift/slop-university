summary: >-
  A research poster from the School of Emergent Priorities reads the 66 annual
  budget speeches of one small parliamentary state, 1958 to 2023, for the 1,412
  sentences that pass public debt to children or the unborn, and codes each
  against four scriptural frames. It finds the speeches moving from Ezekiel's
  answerability, 44% of the first decade's sentences, to the iniquity visited
  in Exodus 34:7, 58% of the last, and that only 23 of 612 visitation
  sentences set anything the heirs receive beside the debt, where the verse
  itself puts the mercy kept for thousands first.
topic: >-
  Hamartiology of public debt: seven decades of a small state's budget speeches
  read for whether debt passed to unborn generations is framed as inherited
  guilt (Exodus 34) or each generation answering for its own (Ezekiel 18)
