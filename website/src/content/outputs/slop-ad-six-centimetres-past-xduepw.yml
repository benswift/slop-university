title: Notes on the No-Permit Line
subtitle: >-
  The Adaptive Metrics Lab treats a backyard fence's no-permit height ceiling
  as a natural boundary between maintained and neglected fences
authors:
  - Joost Nwosu
preset: marketing-poster
school: School of Continuous Improvement
date: 2026-09-24
