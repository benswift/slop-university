doi: 10.5555/slop.xduepw
summary: >-
  A marketing poster from the School of Continuous Improvement treats the
  region's no-permit fence-height ceiling as a natural experiment, finding
  that backyard fences built right at the line are repainted nearly twice as
  often as fences built just over it, and proposes the same boundary as an
  eligibility test for a civic beautification grant.
topic: >-
  Six centimetres past the no-permit fence-height line is enough to halve how
  often a backyard fence gets repainted.
