summary: >-
  A case-for-support brochure led by the School of Settled Matters invites
  partners into the University's research on what a coalfield leaves behind:
  the core a drill run fails to recover, the fines settled in a closed
  washery's pond, the ash under a kiln, the pillars left standing underground,
  and the leases and covenants that decide who answers for them. It features
  the Schools of Underlying Conditions, Settled Matters and Emergent
  Priorities, and cites seven published studies by title and DOI.
