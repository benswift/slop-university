summary: >-
  A research poster from the School of Continuous Improvement scores 96
  strip-mall shopfronts against a four-stage card-machine continuity model
  and tracks who receives the University's Capability Sprints placement
  hours, which require attested Level 3. Three years on, every recorded
  placement hour went to a trader already at Level 3 or above, and none of
  the 53 traders below the threshold in 2023 have since qualified.
topic: >-
  Which strip-mall traders ever graduate past Level 1 on a four-stage
  card-machine backup maturity model, when Level 3 is also the entry ticket
  to the University's free small-business placement hours?
