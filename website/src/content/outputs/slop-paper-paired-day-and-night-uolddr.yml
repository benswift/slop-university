title: Released at Dusk
subtitle: Day and night Lagrangian sampling of pharmaceutical residues along an effluent-dominated creek
authors:
  - Anouk Mensah
  - Iben Chikere
  - Brynjar Obiora
preset: paper
school: School of Emergent Priorities
