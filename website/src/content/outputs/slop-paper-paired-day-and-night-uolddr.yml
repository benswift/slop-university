doi: 10.5555/slop.uolddr
summary: >-
  A paper from the School of Emergent Priorities and the School of Underlying
  Conditions follows eight tagged parcels of treated lagoon effluent down 4.9 km
  of an unnamed effluent-dominated creek, four released on the works' ordinary
  evening timer and four on a schedule shifted by twelve hours. Diclofenac fell
  to 0.44 of its initial bromide-normalised concentration by day and 0.91 by
  night, almost all of the daytime loss occurring in the unshaded first 1.8 km,
  while trimethoprim fell to about 0.7 in both arms, chiefly across three gravel
  riffles, and carbamazepine was conserved throughout.
topic: >-
  Paired day-and-night Lagrangian sampling that follows parcels of treated
  effluent down an effluent-dominated creek, to separate sunlight-driven from
  streambed-driven attenuation of pharmaceutical and antibiotic residues
