doi: 10.5555/slop.qjzhbx
summary: >-
  A research poster from the School of Underlying Conditions surveys soil
  thermal conductivity at twelve stations along the 120-metre ground loop that
  cools an electric-aircraft charger at a grass airstrip, where the trench
  passes from red loam into cracking clay. Expressed at the loop's single
  design conductivity, the trench is equivalent to 100 metres in February and
  140 metres in August, and reversing the direction of flow made no measurable
  difference to the return temperature.
topic: >-
  Sizing a buried ground loop to reject battery-charging heat at a grass
  airstrip for electric aircraft, where the trench crosses the boundary between
  two mapped soils and the soil's thermal conductivity changes with it
