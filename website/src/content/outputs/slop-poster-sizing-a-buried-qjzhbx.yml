title: The Trench Crosses a Line
subtitle: Ground-coupled heat rejection for electric-aircraft charging across a mapped soil boundary
authors:
  - Brynjar Obiora
  - Vigdis Emenike
  - Casimir Beng
preset: research-poster
school: School of Underlying Conditions
