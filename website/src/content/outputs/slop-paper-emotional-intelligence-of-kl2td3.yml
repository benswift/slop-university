title: Softly Refused
subtitle: Emotion Management, Defect Explicitness and Relodgement at a Registry Counter
authors:
  - Odalys Penhallow
  - Ingrid Vasseur
preset: paper
school: School of Settled Matters
date: 2026-11-25
publishedAt: "2026-11-25T14:01:47+11:00"
doi: 10.5555/slop.kl2td3
summary: >-
  A paper from the School of Settled Matters links ability and trait emotional
  intelligence scores for 47 court registry counter clerks to 3,108 counter
  rejections, finding that clerks high in emotion management are rated warmer
  by filers but see self-represented filers' documents cured at first
  relodgement less often (OR 0.79 per SD), largely because they state the
  defect less explicitly, while emotion perception predicts more cures and
  trait emotional intelligence predicts nothing.
topic: >-
  emotional intelligence of court registry counter clerks: whether the staff
  who reject defective filings most gently are the ones whose filers come back
  with the right defect fixed
