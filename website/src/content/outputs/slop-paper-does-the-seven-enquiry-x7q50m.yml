title: Seen but Untaken
subtitle: >-
  A Failed Replication of the Seven-Enquiry Uptake Threshold in Street and
  Apartment-Block Giveaway Group Chats
authors:
  - Solveig Adeyemi
  - Casimir Beng
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-09-23
publishedAt: "2026-09-23T15:00:40+10:00"
doi: 10.5555/slop.x7q50m
summary: >-
  A paper from the School of Continuous Improvement follows 61 street and
  apartment-block giveaway group chats for 22 weeks, finding that a
  neighbourhood-marketplace threshold linking a giveaway's prior-enquiry count
  to its eventual uptake does not reproduce where read receipts already make
  interest visible to the whole group, and that an oversight committee has
  extended the threshold to these chats regardless.
topic: >-
  Does the seven-enquiry threshold that predicted when a
  neighbourhood-marketplace giveaway listing actually got collected also
  predict when the same offer, posted instead to a street group chat with
  visible read receipts, actually gets claimed?
