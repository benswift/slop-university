summary: >-
  Slop University's Strategic Plan 2026-2031 anchors a University-wide botanical
  capability in the undocumented hawthorn hedge along the campus's western
  boundary, under four focus areas. It commits the University to a
  segment-by-segment census with a voucher specimen for every shrub, a single
  traceable pathway from pressed specimen to characterised extract, a soil
  profile beneath every segment and a cutting calendar set by the research
  program, and the adoption of census segments by local schools and community
  groups.
