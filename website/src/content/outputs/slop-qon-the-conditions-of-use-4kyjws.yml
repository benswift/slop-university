title: Binds Each Later Holder
subtitle: >-
  The Department of Policy Settings answers questions taken on notice by the
  Committee on Settings Oversight on the conditions of use that ride with the
  University's dendrimer and hyperbranched-polymer stocks
authors:
  - Clemency Tredinnick
  - Anselm Threlkeld
  - Iben Chikere
  - Ragnhild Uzoma
preset: questions-on-notice
date: 2026-11-21
publishedAt: "2026-11-21T05:30:46+11:00"
doi: 10.5555/slop.4kyjws
summary: >-
  The Department of Policy Settings answers five questions on section 12 of the
  Slop University (Research Materials Transfer) Determination 2022, under which
  a condition of use recorded against a material at transfer attaches to it and
  to any material derived from it and binds each later holder, taken on notice
  at the Committee on Settings Oversight's Supplementary hearings of 18
  November 2026 or lodged in writing after them. Its answers tabulate the
  conditions carried by 74 dendrimer stocks in the shared materials store, a
  median of 13 at the sixth generation and above and 23 on one
  seventh-generation stock, 17 of them naming closed projects; confirm that a
  hyperbranched polymer made from two transferred monomer lots carries both
  lots' conditions into every part of it; state that the Register does not
  record a holder's departure; report that no means of discharging a condition
  has been considered; and decline on resourcing to establish which of 2,936
  entries concern material that no longer exists.
topic: >-
  the conditions-of-use carry-over: the Committee presses the Department on how
  conditions attached to a material on transfer bind the dendrimer and
  hyperbranched-polymer stocks grown from it, generation after generation
