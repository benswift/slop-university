doi: 10.5555/slop.8p3qcp
summary: >-
  A paper from the School of Emergent Priorities surveys 4,103 members of 62
  parent, sporting-club, and strata group chats and codes 1,847 photo dumps,
  finding a median dump of nine near-duplicate frames and a first reply that
  lands most often on the second or third photo. On the strength of those
  distributions the University now confirms a seminar-room booking only on
  the poster variant that receives the first reply, after a mandatory burst
  of nine.
topic: >-
  Nine is the median size of a parent group-chat photo dump of a parking
  spot, a birthday cake or a lost hat, and the University will now confirm a
  seminar-room booking only on the poster variant that receives the first
  reply, requiring organisers to post at least nine near-duplicates to the
  school chat
