title: Towards a Portable Entitlement Standard
subtitle: >-
  The Biscuit Entitlement Gate's committee-cycle effect, tested at a
  strip-mall supermarket's loyalty counter
authors:
  - Ronja Oyelaran
  - Joost Nwosu
preset: brochure
school: School of Emergent Priorities
date: 2026-09-16
publishedAt: "2026-09-16T18:16:53+10:00"
doi: 10.5555/slop.jv3fwv
summary: >-
  A prospectus brochure from the School of Emergent Priorities follows a
  pilot carrying the Biscuit Entitlement Gate's committee-governed
  recalculation cycle into a strip-mall supermarket's loyalty-card counter,
  and reports that a first trading quarter found no relationship between the
  cycle and how shoppers redeemed their points. The School reads the null
  result as reason to widen the trial to eleven further strip-mall and
  food-truck sites rather than to close it.
topic: >-
  Establish whether the Biscuit Entitlement Gate's committee-cycle
  engagement effect replicates when the same entitlement mechanism governs
  loyalty-card point redemption at a strip-mall supermarket
