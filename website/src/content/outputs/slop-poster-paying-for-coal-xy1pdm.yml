title: The Price of the Pillars
subtitle: Surrender valuations of abandoned coal and the leasing of underground gasification, 1894–1971
authors:
  - Ragnhild Uzoma
  - Marek Solheim
  - Sunniva Balogun
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-26
