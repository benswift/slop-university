doi: 10.5555/slop.xy1pdm
summary: >-
  A research poster from the School of Underlying Conditions reads the lease,
  royalty and surrender ledgers of one private mineral estate in a worked-out
  coalfield district, 1894–1971, and finds that the royalties its agents asked
  of 23 proposals to gasify coal underground followed the valuation booked
  against abandoned pillar coal at surrender, not the gas the proposers expected
  to raise. All nine executed leases fell on the three seams the ledgers had
  valued lowest.
topic: >-
  paying for coal left in the ground: how a worked-out coalfield district's
  royalty ledgers priced abandoned pillar coal, and what that price did to its
  later underground gasification leases
