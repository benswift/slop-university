title: Towards a Standard Margin of Forgiveness
subtitle: A Regression-Discontinuity Study of a Residential Speed Camera's Trigger Tolerance
authors:
  - Anouk Mensah
  - Lindiwe Achterberg
  - Ronja Oyelaran
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-19
