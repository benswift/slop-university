doi: 10.5555/slop.588y7b
summary: >-
  A research poster from the School of Emergent Priorities treats a fixed
  roadside camera's 54.0 km/h trigger as a natural regression-discontinuity
  design on one 50 km/h residential street, finding that vehicles following a
  flashed car ran 3.1 km/h slower over the next 40 m across 386 leader-follower
  pairs, and reports the School's adoption of the camera's 8 per cent margin
  as the tolerance on a lamp above every meeting-room door.
topic: >-
  a residential street's speed-camera trigger tolerance, the few kilometres an
  hour over the limit that a camera forgives, whose flash sorts near-identical
  drivers into photographed and unphotographed and is read as a cutoff, then
  adopted as the door-lamp margin on the School's own meeting rooms
