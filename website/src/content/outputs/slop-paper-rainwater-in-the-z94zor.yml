doi: 10.5555/slop.z94zor
summary: >-
  A paper from the School of Underlying Conditions surveys the 41 wellhead
  cellars still open on the retired oil and gas field beneath the campus at
  thirteen fortnightly visits across one wet season. Thirty-four held water,
  15 showed a sheen and 3 a stream of bubbles beside the wellhead; anurans
  bred in 21, and the concrete-lined cellars released no metamorphs until a
  timber plank was put in.
topic: >-
  rainwater in the wellhead cellars of the retired oilfield beneath the
  campus: a one-season field survey of what collects in them, the hydrocarbon
  sheen on it, and the tadpoles that breed there and cannot climb out
