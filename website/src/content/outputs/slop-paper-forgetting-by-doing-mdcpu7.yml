title: The Experience Leaves in the Van
subtitle: Installer Exit and the Depreciation of Learning in a Regional Rooftop Solar Market
authors:
  - Sten Okwuosa
  - Signy Okpara
preset: paper
school: School of Continuous Improvement
date: 2026-11-05
publishedAt: "2026-11-05T08:00:59+11:00"
doi: 10.5555/slop.mdcpu7
summary: >-
  An energy economics paper from the School of Continuous Improvement estimates
  learning curves with depreciating experience from 38,412 rooftop solar
  installation records in one regional distribution area, each naming both the
  installing firm and the crew lead who signed the job. Experience accumulated
  by the firm appears to depreciate with a half-life of 3.3 quarters, but
  experience accumulated by the crew lead barely depreciates at all, and an
  event study of 274 crew-lead departures shows that firms lose installation
  speed when a lead leaves while the lead's own jobs at a new firm recover
  within a quarter; the experience the region loses outright departs with the
  41 per cent of leads who leave the register, concentrated after the rebate's
  step-downs.
topic: >-
  forgetting by doing: installer exit and the depreciation of accumulated
  experience in a regional rooftop solar installation market
