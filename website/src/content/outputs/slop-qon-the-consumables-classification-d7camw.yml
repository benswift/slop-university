title: Weighed as Plastic
subtitle: >-
  The Department of Policy Settings answers questions taken on notice by the
  Committee on Settings Oversight on the classification of printed electrodes
  under the Laboratory Consumables Determination
authors:
  - Brynjar Obiora
  - Vigdis Emenike
  - Casimir Beng
  - Odalys Penhallow
preset: questions-on-notice
date: 2026-11-21
publishedAt: "2026-11-21T10:31:48+11:00"
doi: 10.5555/slop.d7camw
summary: >-
  The Department of Policy Settings answers five questions on Schedule 2 of the
  Slop University (Laboratory Consumables) Determination 2025, which classes
  each consumable by the material predominant in it by mass and so places
  screen-printed electrodes and biosensor strips among single-use plastic
  labware, taken on notice at the Committee on Settings Oversight's Spring
  hearings of 11 November 2026 or lodged in writing after them. Its answers
  explain that the test was chosen so that no item need be examined, and hold
  no record that a printed electrode was; report 14,630 printed electrodes
  ordered and $9,351.36 in consumables levy charged on them; record 13,902
  reuse attempts without their results, 6,140 of them entered a hundred or more
  at a time; decline to release 23 exemption applications on resourcing, of
  which 17 were refused for seeking an exemption by class; and confirm that no
  consultation paper was issued on the Schedule.
topic: >-
  the consumables classification setting: the Committee presses the Department
  on the Laboratory Consumables Determination's predominant-material-by-mass
  test, which classes screen-printed electrodes and biosensor strips as
  single-use plastic labware, so each bears the consumables levy and cannot be
  discarded until a reuse attempt is recorded
