doi: 10.5555/slop.x2iyt7
summary: >-
  A paper from the School of Underlying Conditions treats the correlation
  between a soil map legend and its renumbered second edition as a two-slice
  tensor and determines its rank over the real numbers exactly. The rank
  exceeds the number of mapping units by the largest number of cycles of the
  renumbering whose lengths share a divisor of at least three, so that
  exchanged pairs cost nothing; the paper proves the excess stable under
  perturbation, tabulates it for legends of up to ten units, and works one
  legend of fourteen by hand.
topic: >-
  the exact real tensor rank of the two-slice tensor pairing the identity with
  a permutation matrix, read as a soil map legend before and after a
  relabelling: the rank exceeds the number of map units by the largest number
  of cycles sharing a divisor of at least three, so swaps are free and
  three-way rotations are not
