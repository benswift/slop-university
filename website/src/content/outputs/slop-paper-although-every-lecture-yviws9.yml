title: Does a Level-4 lecture theatre still have a working marker?
authors:
  - Ingeborg Nwachukwu
  - Solveig Adeyemi
  - Torun Ezeigwe
preset: paper
school: School of Continuous Improvement
date: 2026-09-15
publishedAt: 2026-09-15T14:11:43+10:00
doi: 10.5555/slop.yviws9
summary: >-
  A paper from the School of Continuous Improvement scores 47 lecture theatres
  against a five-level Marker Stewardship Maturity Model and pairs each week's
  attestation with an independent writing-line count of working markers left on
  the tray. Rooms attested at Level 4 hold a median of zero working markers on
  the tray, against two at Level 2, and Facilities has adopted Level 4 as the
  sole eligibility condition for the 2027 audiovisual-refresh round, with no
  ordinary override.
topic: >-
  Although every lecture theatre still has a marker tray, the University scores
  each room against a five-level Marker Stewardship Maturity Model and withholds
  the next AV refresh until the room attests Level 4.
