summary: >-
  A consultation paper from the Department of Policy Settings invites
  submissions on whether the Shared Preparations Acknowledgement Guidelines
  2019, under which a group that prepares a compound for another group's
  research is thanked in the acknowledgements and credited with nothing else,
  should be remade as they stand or replaced by registered preparation records
  carrying their own identifiers. Most of the transfers it reviews are of
  boronic esters, silanes and related building blocks. It cites four of the
  University's outputs, finds the recommended acknowledgement in just over a
  third of the outputs it could match to a supply, and records a preliminary
  view, conditional on consultation, favouring further work on registered
  records for preparations used in published outputs.
topic: >-
  how the University credits a group that prepares a boronic ester or silane
  building block in bulk for other groups' syntheses: a review of the Shared
  Preparations Acknowledgement Guidelines, under which the preparer receives a
  line of thanks and nothing that counts
