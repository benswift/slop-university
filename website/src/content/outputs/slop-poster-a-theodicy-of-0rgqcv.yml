summary: >-
  A research poster from the School of Continuous Improvement codes the
  accounts technicians logged for 213 episodes of unexplained ion-selective
  electrode drift at one water-testing laboratory against five types drawn from
  the sociology of theodicy, finding that accounts pass from mechanism through
  self-blame and deferral to the electrode's temperament the longer drift goes
  unexplained. Most temperament entries on electrodes since retired were later
  re-annotated as membrane ageing.
topic: >-
  A theodicy of drift: how technicians at a water-testing bench account for
  ion-selective electrodes that will not hold their calibration, read through
  the sociology of theodicy
