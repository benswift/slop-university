summary: >-
  A research poster from the School of Underlying Conditions compiles a
  historical lexicon of the soil words landholders used, from 1,946 dated
  margin notes in 212 field notebooks of one district soil survey. Of 143
  headwords, those for how ground behaves under an implement mostly leave the
  notebooks with the horse team, while colour, material and place terms
  persist, and surveyors drop the inverted commas only from words their own
  auger could confirm.
topic: >-
  Farmers' soil words in the margins of one district's survey field notebooks:
  a historical lexicon of which vernacular terms outlived formal soil
  classification and which went out with the horse-drawn plough
