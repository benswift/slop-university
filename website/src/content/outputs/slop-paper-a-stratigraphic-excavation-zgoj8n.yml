title: A Site That Can Be Dug Twice
subtitle: Stratigraphic Excavation of the Nested Archives on a Decommissioned Backup Volume
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-11
publishedAt: "2026-10-11T07:01:56+11:00"
doi: 10.5555/slop.zgoj8n
summary: >-
  A paper from the School of Underlying Conditions excavates one decommissioned
  departmental backup volume by context, recording 412 nested compressed
  archives and 401 enclosures and resolving them into 61 groups and five phases
  without opening a single member for reading. Because unpacking a copy
  destroys nothing, the second author then excavated the volume again
  independently; the two excavations agree on every context and relation and
  differ on nine of the 61 groups.
topic: >-
  A stratigraphic excavation of a decommissioned departmental backup volume,
  reading its nested compressed archives as deposits and establishing the order
  in which they were packed
