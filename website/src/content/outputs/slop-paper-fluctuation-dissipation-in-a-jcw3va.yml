title: The Bore Still Rings
subtitle: Well–Aquifer Damping from Ambient Water-Level Noise and a Duty-Cycled Microcontroller Logger
authors:
  - Vigdis Emenike
  - Casimir Beng
preset: paper
school: School of Underlying Conditions
date: 2026-11-17
