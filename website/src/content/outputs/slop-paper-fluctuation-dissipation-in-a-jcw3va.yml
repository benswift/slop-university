doi: 10.5555/slop.jcw3va
summary: >-
  A paper from the School of Underlying Conditions shows that a monitoring
  bore's damping rate, the quantity a slug test is run to measure, can be read
  from the water column's ambient fluctuations through the fluctuation–dissipation
  relation wherever the forcing is flat across the resonance, and that a
  battery-powered microcontroller logger spending one hour of sensor time a day
  in bursts of about a minute recovers it to within 7–9% per day, with the bound
  degrading only slowly as the bore passes through critical damping.
topic: >-
  Fluctuation–dissipation in a disused bore: recovering aquifer damping from
  the background noise logged by a microcontroller pressure sensor
