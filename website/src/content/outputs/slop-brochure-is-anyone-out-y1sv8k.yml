summary: >-
  A research showcase from the School of Settled Matters presents the
  University's work around the search for life beyond Earth in three strands:
  reading silence and absence as evidence, the history of observatory
  instruments and the people who keep them, and the standards by which a
  question of that size could be judged settled. It quotes three researchers,
  profiles three, and features eight published studies from four Schools,
  cited by title and DOI.
topic: >-
  is anyone out there: a research showcase on how the University studies the
  search for life beyond Earth, and on what it would take for that question
  ever to be settled
