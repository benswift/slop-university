summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to the
  geological and geophysical sciences as a long-horizon priority. Five
  priorities provide for standing field stations held open between projects
  across the principal tectonic settings, long-record observatories funded to
  outlast the plan, a Solid Record Trust for the University's core and sample
  collections, a shared foundation in deep time for every commencing student,
  and governance whose review cycles are matched to the lifespan of the assets
  they govern.
