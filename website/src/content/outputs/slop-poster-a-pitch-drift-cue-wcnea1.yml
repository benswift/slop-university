doi: 10.5555/slop.wcnea1
summary: >-
  A research poster from the School of Continuous Improvement clips a
  real-time pitch-lock sensor and traffic-light indicator to every riser
  position across three suburban choirs for a 22-week season, logging each
  singer's cumulative green-light minutes against a blind panel's
  intonation ratings of the same recordings. The two measures correlate
  only moderately (r = 0.44, n = 94), and two of the three choirs have
  adopted the tally as their standing criterion for front-row placement and
  solo-audition shortlisting regardless.
topic: >-
  a real-time pitch-drift cue device for community-choir risers, clipping a
  reference-pitch sensor and traffic-light indicator to each riser position
  across three suburban choirs, and the cumulative green-light minutes two
  committees now weigh over the conductor's own ear for front-row placement
  and solo-audition invitations
