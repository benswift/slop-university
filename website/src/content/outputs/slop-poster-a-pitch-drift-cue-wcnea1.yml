title: GLIM
subtitle: >-
  A Green-Light Intonation Monitor for Choir Risers, and the Placement Rule
  It Now Feeds
authors:
  - Osei Vandermeer
  - Solveig Adeyemi
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
