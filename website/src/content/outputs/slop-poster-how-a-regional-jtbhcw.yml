title: The Far Run
subtitle: Run Allocation and the Allowance Gap among Groundwater Monitoring Technicians
authors:
  - Vigdis Emenike
  - Signy Okpara
preset: research-poster
school: School of Underlying Conditions
date: 2026-11-04
