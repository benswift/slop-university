doi: 10.5555/slop.jtbhcw
summary: >-
  A research poster from the School of Underlying Conditions matches a year of
  run sheets (6,412 runs) to payroll allowance lines for 38 groundwater
  monitoring technicians across five depots of a regional water authority, and
  draws on 22 interviews with technicians and run allocators. Base pay is at
  parity, but women, two in five technicians, are crewed on one in eleven
  overnight far runs and dip 1.3 times as many bores per rostered day on the
  near-town rounds, so that the pay gap sits almost wholly in camping, meal
  and travel allowances.
topic: >-
  How a regional water authority's allocation of groundwater monitoring runs
  sent men on the overnight far runs and women on the dense near-town rounds,
  so that women dipped more bores while men drew the travel and camping
  allowances that made up the take-home pay gap
