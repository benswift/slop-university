summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 recounts five
  years extending regional development programs' records of innovation from
  launches and pilots to the adaptations, substitutions and repairs regional
  enterprises make unreported. It reports three case studies: a one-page
  adaptations-in-use record that lifted a grant program's recorded innovation
  rate from four to more than two hundred per hundred funded enterprises, a
  meta-review of 38 regional enterprise evaluations, and a pathway through which
  an engineering peak body now recognises a documented field repair as a
  practice innovation.
