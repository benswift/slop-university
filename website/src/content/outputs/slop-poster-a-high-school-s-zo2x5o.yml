doi: 10.5555/slop.zo2x5o
summary: >-
  A research poster from the School of Continuous Improvement compares two
  feeder-network campuses on a shared swipe-card engagement-risk platform,
  matching percentiles for 214 flagged students against wellbeing-team
  contact logs and finding that staff override access, not the score
  itself, decides which flagged students are actually called home.
topic: >-
  a high school's swipe-card roll-call generates a daily engagement-risk
  score; comparing two campuses on the same platform, one where staff can
  override its outreach list and one where they can't, on who actually gets
  called home
