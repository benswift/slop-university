title: ‘It Smells Fine’
subtitle: >-
  Willingness to finish a yoghurt across a printed use-by date, and the
  Strategic Drift Survey's revised closing day, as an intake campaign for the
  Master of Priority Studies
authors:
  - Ronja Oyelaran
preset: marketing-poster
school: School of Emergent Priorities
date: 2026-10-03
