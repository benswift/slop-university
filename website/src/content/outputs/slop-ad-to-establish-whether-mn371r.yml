summary: >-
  A marketing poster for the Master of Priority Studies sets cartons of yoghurt
  dated a day either side of their printed use-by cutoff side by side on one
  fridge shelf and asks which a household will finish. The Strategic Drift
  Survey's response window now closes the day after the printed date. Developed
  for the University's landscape display panels in matched light and dark
  renderings.
topic: >-
  To establish whether a household's willingness to finish a yoghurt changes at
  its printed use-by date, comparing cartons dated a day either side of the
  cutoff on one fridge shelf, and why the Strategic Drift Survey now closes its
  response window the day after the printed date
