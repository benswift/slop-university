doi: 10.5555/slop.e1szwr
summary: >-
  A paper from the School of Continuous Improvement and the School of
  Emergent Priorities codes 161 transcribed interviews from a regional
  pottery guild association's live glaze-recipe check, introduced after a
  wave of near-identical written statements, into a seven-category taxonomy
  of the verbal tactics applicants use when their honest answer is thin.
  Borrowed recipe and oxide name-drop are the most prevalent and most likely
  to co-occur, and the coding scheme holds when the convenor's own follow-up
  questioning is redacted from the transcript before coding.
topic: >-
  a taxonomy of the verbal tactics community pottery-guild members use to
  pass the live glaze-recipe interview that replaced a written skills
  self-assessment, after members began submitting AI-drafted recipe
  write-ups to jump the advanced-kiln waiting list
