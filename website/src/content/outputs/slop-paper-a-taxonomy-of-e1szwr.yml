title: Interviewing for Authenticity
subtitle: A Taxonomy of Verbal Tactics in a Community Pottery Guild's Live Glaze-Recipe Check
authors:
  - Dagny Okafor
  - Casimir Beng
  - Iben Chikere
preset: paper
school: School of Continuous Improvement
date: 2026-08-25
