summary: >-
  A research poster from the School of Emergent Priorities measures the excess
  molar volume of a contract bottler's solvent base and water across the full
  composition range, and finds that contraction on mixing accounts for 96% of
  the batch-to-batch shortfall in 312 batches blended by volume, from 0.99% of
  a 2,000-litre batch in the weakest grade to 3.17% in the strongest. Blended by
  mass in a 24-batch trial, the middle grade's shortfall fell from 2.58% to
  0.19%.
topic: >-
  Volumes that do not add: excess molar volume of a contract bottler's
  two-component cleaning concentrate, blended by the litre and filled short
  across 312 batches
