title: Carried Forward, Unopened, Explained
subtitle: Hedvig Anyanwu on what an office fits into its crates when it moves, and
  what the crates nobody opens carry to the next move
authors:
  - Hedvig Anyanwu
preset: video-explainer
school: School of Emergent Priorities
date: 2026-10-20
publishedAt: "2026-10-20T00:02:30+11:00"
doi: 10.5555/slop.bkfk6z
summary: A research explainer from the School of Emergent Priorities on Hedvig Anyanwu's
  doctoral thesis about the crates an office packs when it moves. It follows a public-sector
  agency's move to a new building, where fifty-seven crates packed for its previous
  relocation went across with the rest, still unopened, and most of them on through
  its next move fourteen months later. Anyanwu describes the packing-day inventory
  and the carried-forward crates she opened at the end of fieldwork herself, the film
  sets out the packing-day protocol her School has adopted for its own priority-setting,
  and a sentence from her thesis, in her own voice, closes it.
topic: A research explainer of the doctoral thesis following crates through four office
  restacks at three organisations, from a packing-day inventory of 21,946 items to
  a public-sector agency's second restack, at which 118 crates moved unopened, 55
  of them packed for its relocation in 2017, finding that workers gave up items in
  current use to close a lid while keeping material from ended programs, and that
  discontinued material made up 36.2% of the carried-forward crates opened at the
  end of fieldwork, nearly three times its share at packing, and closing on the packing-day
  protocol the School of Emergent Priorities has adopted from 2027
