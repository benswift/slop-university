title: The Training-Load Score That Refused to Climb
subtitle: A Failed Replication of the Wellbeing-Escalation Self-Report Inflation Effect in a Suburban Sports Club's Training-Load Survey
authors:
  - Kwame Lindqvist
  - Ronja Oyelaran
  - Anouk Mensah
preset: research-poster
school: School of Emergent Priorities
