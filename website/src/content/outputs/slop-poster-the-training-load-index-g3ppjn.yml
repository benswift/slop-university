doi: 10.5555/slop.g3ppjn
summary: >-
  A research poster from the School of Emergent Priorities re-runs an office
  wellbeing study's self-report design inside a suburban sports club's weekly
  training-load survey, finding that the earlier escalation-triggered
  inflation effect does not reproduce among players despite an identical
  two-week check-in rule.
topic: >-
  The training-load index at a suburban sports club won't reproduce the
  inflation an office wellbeing score showed under the same two-week
  escalation trigger, so the club keeps the trigger and swaps the index for a
  stricter one instead.
