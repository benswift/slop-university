summary: >-
  A marketing poster for the School of Emergent Priorities sets an
  early-morning loading dock, its roller doors shut but one, beneath an
  invitation to the summer season of Futures in Committee, which turns the
  School's seminar series to the standby arrangements on which supply chain
  resilience depends. Developed for campus digital signage in a landscape
  rotation, with sessions from February.
