summary: >-
  A research poster from the School of Underlying Conditions reads the
  common-law presumption of death after seven years' absence as a decision
  taken under a declared loss, and sets it against 1,286 absentee files of a
  composite probate registry. At seven silent years the estimated chance of a
  living return is 0.19, so a step at year seven is optimal only where a false
  death is weighed at 4.3 times a false life.
topic: >-
  The common-law presumption of death after seven years' absence read as a
  survival-function estimator under right-censoring: what loss function a step
  at year seven minimises, set against return times in an invented registry of
  absentees
