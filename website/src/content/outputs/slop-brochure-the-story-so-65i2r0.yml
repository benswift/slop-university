summary: >-
  A research-showcase brochure from the School of Settled Matters presents the
  law's records as stories, in three features on how a judgment tells its
  facts, what a certificate of title hands each new owner, and what a record
  leaves untold, the last shared with the Basement Relations Group of the
  School of Underlying Conditions. It rests the showcase on seven published
  outputs from three Schools, cited by title and DOI.
