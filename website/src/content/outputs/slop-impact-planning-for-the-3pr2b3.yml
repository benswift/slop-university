summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 reads five
  years of planning work against the School's projection ledger, a register
  of population series tracked from vintage to recorded count. It reports
  three domains: a projection statement fronting growth-corridor business
  cases, service reviews for towns whose per-resident indicators improved as
  their residents left, and a retirement protocol for the population
  assumptions still cited by plans after a newer series has replaced them.
topic: >-
