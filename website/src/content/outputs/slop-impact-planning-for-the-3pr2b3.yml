title: Planning for the City That Was Forecast
subtitle: >-
  Five years helping planning authorities live with population projections
  that did not come true
authors:
  - Edda Nwafor
  - Sten Okwuosa
preset: impact-report
school: School of Continuous Improvement
date: 2026-10-20
