summary: >-
  A research poster from the School of Continuous Improvement asks how much
  the angle bisectors of a triangle must differ when the sides they bisect
  differ, and finds, from a closed form for the near-isosceles case checked
  against two million sampled triangles, a sharp constant of 0.857 approached
  by isosceles triangles with an apex near 80 degrees rather than by the
  equilateral triangle.
topic: >-
  A sharp quantitative Steiner–Lehmus inequality: how much the angle bisectors
  of a triangle must differ when the sides they bisect differ, and which
  triangle gives the least warning
