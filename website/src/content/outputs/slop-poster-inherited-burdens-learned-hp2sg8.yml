doi: 10.5555/slop.hp2sg8
summary: >-
  A research poster from the School of Settled Matters addresses each of
  41,806 lots in a synthesised land register by its line of descent through the
  subdivision tree, read as an 11-adic integer, and predicts seven types of
  easement and covenant from 6,240 hand-read titles. At a 5% label budget a
  p-adic wavelet kernel reaches macro-F1 0.75 against 0.58 for a Euclidean
  embedding and 0.69 for a Poincaré embedding, leading on every burden type
  except covenants imposed at subdivision, which have no ancestor to inherit
  from.
topic: >-
  inherited burdens, learned ultrametrically: a p-adic classifier reads which
  easements and covenants a subdivided lot carries from its place in the
  subdivision tree, against Euclidean and hyperbolic embeddings
