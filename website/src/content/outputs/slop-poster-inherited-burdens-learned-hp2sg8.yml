title: What the Parent Lot Leaves
subtitle: Ultrametric Embeddings Predict the Burdens a Subdivided Lot Inherits
authors:
  - Clemency Tredinnick
  - Mirela Hanke
  - Bram Ntuli
preset: research-poster
school: School of Settled Matters
