doi: 10.5555/slop.ap3r9n
summary: >-
  A paper from the School of Continuous Improvement follows 1,396 new hires at
  37 contractor-run food outlets and sorts each issued work apron into a
  two-by-two of new or inherited by measured or off the peg, reporting that
  week-three wear is highest for the inherited, unfitted Passed-on cell and
  lowest for the new, unfitted Boxed cell, and recording the Review Cadence
  Observatory's decision to tie campus catering-contract renewal to a census
  of aprons carrying twenty laundry cycles, a count that rose from 29 to 91 per
  cent while wear held still.
topic: >-
  Which of four kinds of issued work apron (new or inherited, fitted to the
  wearer or not) is still being worn by a new hire in their third week, and
  which kind should a catering contractor then be required to issue first?
