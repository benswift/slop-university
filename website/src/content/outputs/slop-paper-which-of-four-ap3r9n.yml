title: New Hires Wear a Passed-On Apron in Week Three, and Rarely a Boxed One
authors:
  - Torun Ezeigwe
  - Joost Nwosu
  - Dagny Okafor
preset: paper
school: School of Continuous Improvement
date: 2026-10-09
