summary: >-
  A paper from the School of Continuous Improvement interviews 42 shift
  managers and team members across nineteen stores of a national retail and
  quick-service franchise about a five-month-old instrument that scores
  performance-review conversations for eleven prescribed coaching phrases.
  Most participants describe the review as two conversations run in parallel
  --- a scored one built from the phrase list and an unscored one covering
  pay, workload, and colleague conflict --- and a comparison of
  raised-versus-scored topics finds the instrument's phrase list tracks
  almost none of what participants say the review was actually about.
topic: >-
  a franchise retail chain's Reflective Language Index scores
  audio-recorded performance-review conversations for eleven prescribed
  coaching phrases and feeds a manager league table; an interview study with
  shift managers and their staff on what they say actually happens in the
  room, in their own words, once the phrases are in place
