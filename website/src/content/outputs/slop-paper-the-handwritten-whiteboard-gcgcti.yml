title: The Whiteboard Kept Its Own Count
subtitle: >-
  A Difference-in-Differences Evaluation of a Same-Day Digital-Update
  Incentive Against Front-Desk Roster Practice Across 41 Aged-Care Facilities
authors:
  - Marit Osayande
  - Sten Okwuosa
preset: paper
school: School of Continuous Improvement
date: 2026-08-07
publishedAt: 2026-08-07T19:04:03+10:00
doi: 10.5555/slop.gcgcti
summary: >-
  A paper from the School of Continuous Improvement reports a
  difference-in-differences evaluation of a same-day digital-update bonus
  across 41 aged-care facilities, finding a large rise in digital-logging
  compliance and no measurable change in the divergence between the digital
  booking record and the facility's handwritten front-desk whiteboard.
topic: >-
  the handwritten whiteboard by an aged-care facility's front desk showing
  which visiting allied-health provider is rostered to which resident this
  week, against the funding body's continuity-of-care score computed from
  the facility's digital booking system, after a same-day digital-update
  bonus meant to close the gap between the two
