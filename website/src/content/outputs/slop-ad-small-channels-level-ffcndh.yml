doi: 10.5555/slop.ffcndh
summary: >-
  A marketing poster for the School of Underlying Conditions sets a thin glass
  flow channel on a three-point levelling mount, a spirit level beside it, and
  presents the School's microfluidic and small-channel bench work through one
  of its published studies of bench tilt. It invites the passer-by to see the
  work, and proposes that flow at small scales begins with what the apparatus
  is standing on.
topic: >-
  small channels, level benches: the School of Underlying Conditions advertises
  its thin-channel flow and microfluidic bench work by teasing the field-flow
  fractionation channel that six benches could not agree on until it was
  levelled
