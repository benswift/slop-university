title: Small Channels. Level Benches.
subtitle: >-
  A display campaign from the School of Underlying Conditions for its
  small-scale flow work, led by a channel that six benches could not agree on.
authors:
  - Vigdis Emenike
  - Ragnhild Uzoma
preset: marketing-poster
school: School of Underlying Conditions
