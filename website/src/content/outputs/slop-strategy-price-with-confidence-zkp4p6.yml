title: The Considered Price
subtitle: Slop University's Strategic Plan 2026-2031 sets a posture on what the University charges, how its prices are shown, and how those who pay them decide
authors:
  - Torun Ezeigwe
  - Solveig Adeyemi
  - Petra Umbile
preset: strategy
school: School of Continuous Improvement
date: 2026-10-13
publishedAt: "2026-10-13T02:17:29+11:00"
doi: 10.5555/slop.zkp4p6
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to a
  considered price: every charge the University sets is to have an owner, a
  rationale and a review date, to be shown where the decision to pay is made,
  and to change with notice and in both directions. Its five focus areas
  extend the same posture to a standing study of how the campus community
  meets a price and to price literacy across the curriculum.
topic: >-
  price with confidence: a campus-wide posture on what the University charges
  for the things it sells, how those prices are shown, and how the people who
  pay them decide
