title: Found Where It Was Drawn
subtitle: A Utility Record Shifts the Criterion, Not the Sensitivity, of Ground-Penetrating Radar Interpreters, and Ends Their Search Early
authors:
  - Ronja Oyelaran
  - Ragnhild Uzoma
  - Bram Ntuli
preset: paper
school: School of Emergent Priorities
date: 2026-10-28
publishedAt: "2026-10-28T13:01:58+11:00"
doi: 10.5555/slop.zgp2ve
summary: >-
  A paper from the School of Emergent Priorities reports a within-participant
  signal-detection experiment in which 32 trained utility locators and 32
  novices searched 180 forward-modelled ground-penetrating radar scans for
  buried services with no record, an accurate record or a displaced record
  drawn over the scan. At the drawn position the record shifted the response
  criterion sharply towards reporting a service with little gain in
  sensitivity; elsewhere it lowered hit rates on undrawn services from .78 to
  .61, more so the further they lay from the line, and shortened the search,
  with locators no better protected than novices.
topic: >-
  a signal-detection experiment on how a utility record overlaid on a
  ground-penetrating radar scan shifts where interpreters report buried
  services, and what they stop searching for once the drawn service is found
