title: Mentor Sign-Off Does Not Cut Rejected Raffle-Quilt Squares
subtitle: A Stepped-Wedge Trial Across Twenty-Four Patchwork Guild Branches
authors:
  - Fenna Okoro
  - Marek Solheim
  - Solveig Adeyemi
preset: paper
school: School of Emergent Priorities
date: 2026-09-07
