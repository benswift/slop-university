doi: 10.5555/slop.qsmj11
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement reports a preregistered stepped-wedge trial of a mandatory
  mentor sign-off across 24 patchwork guild branches, finding no change in
  either the square-rejection rate at final assembly or submission-to-assembly
  lead time; the state guild federation has made the sign-off compulsory at
  every branch regardless, closing the Horizon Register's quality-drift item
  as resolved.
topic: >-
  mentor sign-off for patchwork guilds' raffle-quilt squares, made a permanent
  mandatory step everywhere despite a stepped-wedge trial finding no drop in
  rejection rates, with the Horizon Register's quality-drift item closed as
  resolved
