summary: >-
  A research-showcase brochure from the School of Underlying Conditions
  presents the University's work on phosphodiesterases, the enzymes that end a
  cell's cyclic-nucleotide messages, as a meeting point for all three Schools.
  It moves from the assay bench through the placement of signals within the
  cell to the arrows students draw for them, and rests its showcase on eight
  published studies cited by title and DOI.
topic: >-
  where the signal stops: a research showcase inviting readers into the study
