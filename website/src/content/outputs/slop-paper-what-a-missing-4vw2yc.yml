title: Read Against the Shelf
subtitle: Category Expectation and the Meaning of an Absent Halal Mark
authors:
  - Ragnhild Uzoma
  - Anneke Tolan
preset: paper
school: School of Underlying Conditions
date: 2026-10-31
publishedAt: "2026-10-31T14:02:15+11:00"
doi: 10.5555/slop.4vw2yc
summary: >-
  A paper from the School of Underlying Conditions has 48 Muslim household
  shoppers sort 60 grocery packs, each shown with or without a generic halal
  certification mark, and finds that the penalty for a missing mark rises
  almost one-for-one with how often the category's packs carry one on audited
  shelves, from 79 percentage points for fresh poultry to nothing below about
  one pack in ten. Below that point the sign reverses, and a mark on
  dishwashing liquid or canned vegetables sends shoppers to check more often
  than its absence does.
topic: >-
  what a missing halal mark tells a shopper, category-relative inference from
  absent certification in a card-sort study of everyday groceries
