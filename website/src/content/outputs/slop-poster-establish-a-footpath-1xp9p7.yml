title: Corralled, Not Clear
subtitle: A Parking-Compliance Quadrant for Shared Footpath Scooters
authors:
  - Ingeborg Nwachukwu
  - Sten Okwuosa
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-24
