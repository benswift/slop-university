doi: 10.5555/slop.1xp9p7
summary: >-
  A research poster from the School of Continuous Improvement audits 1,842
  share-scooter parking events against a four-cell corral-and-clearance
  quadrant across three transit-precinct sites, finding that a rider's second
  placement in the blocked-corral cell now triggers a week-long rental-account
  suspension regardless of the corral's own marked capacity.
topic: >-
  Establish a footpath-corral quadrant --- parking accuracy crossed with
  accessible-path clearance --- that suspends a share-scooter rider's rental
  account for a week after a second placement in the blocked-corral cell
