title: Was Like That When We Moved In
subtitle: >-
  A Nine-Category Coding Frame for 61,884 Free-Text Entry Condition Descriptions
  and the Six-Line Bond Schedule with No Line for the Largest
authors:
  - Thandiwe Solberg
  - Ingeborg Nwachukwu
  - Marek Solheim
  - Petra Umbile
preset: paper
school: School of Continuous Improvement
date: 2026-08-01
publishedAt: "2026-08-01T09:01:33+10:00"
doi: 10.5555/slop.8ezzbp
summary: >-
  A paper from the School of Continuous Improvement codes 61,884 free-text
  descriptions from 4,312 rental entry condition reports lodged with one
  property-management group over six years, developing a nine-category frame
  whose largest category --- condition described by reference to a previous
  occupant, the age of a fitting, or the state in which the property arrived ---
  accounts for 28.4 per cent of what tenants write. A mapping panel of the
  group's own staff could place 81.2 per cent of that category on none of the
  six lines the bond is settled against, leaving 30.6 per cent of all coded
  description mass unassignable; after the free-text field was replaced with a
  drop-down built from those six lines, the category fell from 27.9 to 4.6 per
  cent of recorded content while the volume of content rose.
topic: >-
  rental entry condition reports filled in on the first day of a lease, a coding
  taxonomy of what their free-text descriptions actually record across one
  property group's six-year archive, and the six-line bond-deduction schedule
  that has no line for the largest category the taxonomy finds
