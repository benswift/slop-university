doi: 10.5555/slop.rj06ug
summary: >-
  A submission from the School of Continuous Improvement answers nine of the
  twelve questions in the Department of Policy Settings' consultation on quorum
  and resolutions in the University's units. Borrowing the size-consistency
  test that chemical physics applies to its correlation methods, it shows that
  section 9, read across a joint meeting, asks for fewer members than the units
  would need apart, and that Option 2 widens the gap. It proposes a third
  option in which a joint meeting is quorate only where each unit's own quorum
  and director are present, asks that a unit of one stay quorate alone, and
  that every minute record who was present, from which unit, and whether any
  of them was the resolution's subject.
topic: >-
  a size-consistent quorum: the School of Continuous Improvement asks that a
  unit's quorum pass the test chemical physics sets its correlation methods, so
  that units resolving a joint output together need what they would need apart
