title: A Quorum That Adds Up
subtitle: >-
  A submission from the School of Continuous Improvement to the Department of
  Policy Settings' Review of Quorum and Resolutions in the University's Units
authors:
  - Eskil Nwabueze
  - Signy Okpara
  - Bram Ntuli
preset: submission
school: School of Continuous Improvement
date: 2026-11-17
