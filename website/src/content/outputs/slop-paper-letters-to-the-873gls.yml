title: Be Kind to Yourself
subtitle: Provision and Recital in the Letters Beginning Teachers Address to Themselves
authors:
  - Anselm Threlkeld
preset: paper
school: School of Settled Matters
date: 2026-11-23
publishedAt: "2026-11-23T13:30:47+11:00"
doi: 10.5555/slop.873gls
summary: >-
  A paper from the School of Settled Matters closely reads 168 letters that
  first-year teachers wrote to themselves at the end of an induction programme
  and received a year later, finding that the letters draft their hopes as
  recitals that bind no one and their instructions as conditioned provisions,
  and that the 41 recipients who returned their letters annotated the
  provisions and left the recitals unanswered. After a sample letter entered
  the programme pack, "be kind to yourself" appeared in 61 of the next 100
  letters.
topic: >-
  letters to the second-year self: a close reading of the sealed letters
  beginning teachers write at the end of an induction year and receive back
  twelve months later, read for how their second person binds a later reader
  who cannot ask the writer what was meant
