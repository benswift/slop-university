title: No One Prays for Recharge
subtitle: Petition and Its Objects in a Dry District's Intercession Book
authors:
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
publishedAt: "2026-10-12T19:04:54+11:00"
doi: 10.5555/slop.ixja8o
summary: >-
  A paper from the School of Underlying Conditions reads, in the order they
  were written, the 388 petitions concerning water in one unnamed
  congregation's intercession book across the 127 Sundays of a dry spell. The
  petitions for rain grow from a single word into statements of depth, rate,
  paddock and date, which the essay reads as a congregation itemising what its
  prayer had always meant; none of them asks that the aquifer the town drinks
  from be restored, and the essay argues that a petition needs an answer that
  can arrive on a day.
topic: >-
  A close reading of the handwritten rain petitions in one unnamed dry-district
  congregation's intercession book across a dry spell: what the prayers ask
  for, how the asking sharpens, and why the aquifer the town drinks from is
  never prayed for
