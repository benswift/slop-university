doi: 10.5555/slop.pkqlgj
summary: >-
  A research poster from the School of Underlying Conditions cycles one batch
  of a ruthenium and sodium oxide dual-function material through CO₂ capture,
  a nitrogen purge of seven lengths from 0 to 480 s, and hydrogenation at
  320 °C, closing the carbon balance for every cycle. Slip of unconverted CO₂
  falls to 5.1% of the captured carbon by a 30 s purge and barely moves after
  it, while carbon vented during the purge climbs to 22.0% at 480 s, a setting
  that returns 31% less methane per hour than the 30 s optimum.
topic: >-
  how long to purge: the inert sweep between the capture and hydrogenation
  steps of a dual-function material cycle for integrated CO2 capture and
  methanation, and what each extra second of it costs in methane
