summary: >-
  A research-showcase brochure from the School of Emergent Priorities
  introduces STAMP, a five-level maturity model for small-trader loyalty
  and payment infrastructure, and ties the University's small-commerce
  advisory service to whichever rung a shop's till can show it has reached.
topic: >-
  How many rungs sit between a food truck's paper stamp card and a
  supermarket's real-time loyalty-tier engine? Slop University scores
  strip-mall traders' loyalty and EFTPOS setups against STAMP, a
  five-level maturity ladder, and gates its small-commerce advisory
  service on clearing the second rung.
