summary: >-
  A research poster from the School of Underlying Conditions pairs particle
  counters at the lower entrance and upper vent of an undeveloped limestone
  cave for thirteen months and reports the fraction of entering particles
  recovered at the far opening, by size and by draught direction. Both seasons
  pass 0.3-0.5 µm particles best and keep about nine in ten above 2.5 µm; the
  slower summer draught recovers less at every size, and the 64% of hours in
  which the draught reversed daily are logged as unrecovered intervals.
topic: >-
  seasonal aerosol exchange at the mouth of an undeveloped limestone cave: the
  winter chimney draught draws surface particles in, the summer outflow returns
  them depleted, and the difference is what the passages keep
