title: The Stores Set the Date
subtitle: >-
  Last-Time Buys and the Renewal of Obsolescent Signalling Assets at a
  Regional Rail Operator
authors:
  - Hedvig Anyanwu
  - Marit Osayande
  - Osei Vandermeer
preset: paper
school: School of Emergent Priorities
date: 2026-11-07
publishedAt: "2026-11-07T13:31:19+11:00"
doi: 10.5555/slop.9xcctj
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement follows twelve last-time buys of signalling components at a
  regional rail operator and finds that each asset's programmed renewal year
  sits within a year of the date its spares are projected to run out, a
  horizon the buy itself produced. Five of the twelve lots have never been
  opened, and they support the latest renewals in the capital plan.
topic: >-
  Last-time buys for obsolescent rail signalling components: a case study of
  how one regional operator sizes its lifetime stockpiles, and how the size of
  a sealed stockpile quietly fixes when the asset it supports will be renewed
