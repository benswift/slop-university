title: Bioavailable by Design
subtitle: A Strategic Plan making formulation and delivery science a University-wide priority
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
  - Verity Marris
preset: strategy
school: School of Underlying Conditions
