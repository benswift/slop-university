summary: >-
  Slop University's Strategic Plan 2026-2031 commits the University to treat
  the distance between a compound that performs in the assay and one that
  dissolves as a strategic question, under four priorities: developability
  data from the first assay, formulation as a discipline in its own right,
  biorelevant release with every profile retained, and formulation literacy
  across teaching and research training. It rests its case on six published
  University outputs, none of them formulation research.
topic: >-
  bioavailable by design: formulation and drug-delivery science as a
  University-wide priority, built around the promising compounds that work in
  the assay and will not dissolve
