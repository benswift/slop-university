title: Does Third Place Come Back More Often Than Fourth?
subtitle: >-
  A Club Quiz Night's Voucher Line Becomes the 2026-2031 Strategic Plan's
  Standard for Every Ranked Allocation
authors:
  - Ylva Onyekwere
  - Ingeborg Nwachukwu
preset: strategy
school: School of Emergent Priorities
date: 2026-10-09
publishedAt: "2026-10-09T16:01:55+11:00"
doi: 10.5555/slop.kn9m0h
summary: >-
  Slop University's Strategic Plan 2026-2031 takes the answer to a question
  community clubs have long asked of their monthly quiz nights, that the team
  placing third and taking the last voucher returns more often than the team
  placing fourth by a single point, and binds the University to award exactly
  three places in every ranked allocation on a line published in advance. Every
  University-run scored contest is to be moderated so that third and fourth
  stand one point apart, and community partnership support is to follow the
  next-month return of the first team below the line.
topic: >-
  Does the team that places third at a bowls club's monthly quiz night, and
  takes home the last of three prize vouchers, return more often than the team
  that places fourth by a single point and takes home nothing?
