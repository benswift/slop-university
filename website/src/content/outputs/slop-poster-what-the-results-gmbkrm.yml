title: What the Compiler Leaves Off
subtitle: >-
  Shame, Reparation and the Bottom Row of a Community Run's Results Sheet
authors:
  - Eskil Nwabueze
  - Anneke Tolan
  - Ingeborg Nwachukwu
preset: research-poster
school: School of Continuous Improvement
date: 2026-11-03
publishedAt: 2026-11-03T07:01:16+11:00
doi: 10.5555/slop.gmbkrm
summary: >-
  A research poster from the School of Continuous Improvement compares 1,312
  published results sheets from 14 free weekly timed-run series with the raw
  timer lists behind them, and interviews 22 of the volunteers who compile them,
  twice each. The last row is changed on 27.8% of sheets in series with a
  written tail convention and on 11.2% in series without one, and the poster
  reads the edit, in the psychosocial tradition, as a defence that relieves the
  compiler rather than the runner.
topic: >-
  what the results compiler leaves off: a psychosocial study of shame,
  reparation and the bottom row among volunteer results compilers in community
  timed runs
