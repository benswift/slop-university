title: Where to Draw the Lot Line
subtitle: Dividing a Graded Field Between Two Second-Price Auctions
authors:
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-14
publishedAt: "2026-10-14T01:01:56+11:00"
doi: 10.5555/slop.rvwwn3
summary: >-
  A paper from the School of Underlying Conditions models a seller who divides
  a field of continuously grading soil into two lots, each sold by second-price
  auction, and asks where the dividing line earns most. With two bidders no
  division beats the field sold whole; with three or more evenly spread bidders
  the best line is the midpoint, worth one-sixth more than the undivided field
  as bidders become numerous; and when bidders favour one end the best line
  moves toward them, to 0.72 of the field's length with three bidders.
topic: >-
  Where to draw the lot line: a seller divides a field whose soil grades
  continuously from one end to the other into two lots sold by separate
  second-price auctions, and the revenue-optimal boundary is derived as a
  function of the number of bidders
