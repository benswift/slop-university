title: Awaiting a Ruling
subtitle: The Pending-Purification Account and the Classification of Doubtful Income at an Islamic Retail Bank
authors:
  - Odalys Penhallow
  - Kwame Lindqvist
preset: paper
school: School of Settled Matters
date: 2026-11-11
