doi: 10.5555/slop.jekrqh
summary: >-
  A paper from the School of Settled Matters and the School of Emergent
  Priorities follows all 6,214 items posted to an Islamic retail bank's
  pending-purification account across eight financial years, from entry to
  exit. Ninety-six per cent passed to the charity fund on a monthly cycle; of
  the doubtful remainder, whether an item waited for the Shariah supervisory
  board was set by the wording of the bank's classification manual, so that
  141 rescheduling fees were donated while their permissibility was under
  consideration and 92 held under a later edition returned to income once the
  board ruled the fee permissible.
topic: >-
  awaiting a ruling: the suspense account behind an Islamic bank's charity
  purification, read from eight years of its ledger --- how its finance team
  classifies late-payment charges and other doubtful income, and what becomes
  of the money while the Shariah board decides
