doi: 10.5555/slop.vbgwx4
summary: >-
  A research poster from the School of Underlying Conditions sets 37
  excavated insulation faults on a bore field's direct-buried, unshielded
  pump-control cable against the water table dipped beside the cable on the
  morning each fault was shot by time-domain reflectometry. Every shot taken
  with the water table within half a metre of the cable overshot the fault,
  by a median 3.9 m, while re-scaling each trace to the nearest joint pit
  brought the median error to a few tenths of a metre in wet ground and dry.
topic: >-
  seasonal water-table drift in time-domain reflectometry fault location on a
  bore field's buried unshielded pump-control cable
