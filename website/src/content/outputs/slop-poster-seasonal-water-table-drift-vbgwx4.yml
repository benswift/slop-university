title: Where the Pulse Slows
subtitle: >-
  Water-Table Error in Locating Faults on a Bore Field's Buried Control Cable
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: research-poster
school: School of Underlying Conditions
date: 2026-11-04
