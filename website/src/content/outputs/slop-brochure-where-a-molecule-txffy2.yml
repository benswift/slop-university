summary: >-
  A prospectus led by the School of Settled Matters invites students to study
  the alkaloids in three settings at once: the field where a bulb is lifted
  with its soil, the bench where the same compound is built step by step, and
  the seminar where a specification, a contract or a decided case must say
  whether the made compound counts as the found one. It rests the invitation
  on five published outputs cited by title and DOI.
topic: >-
  where a molecule comes from: a prospectus for students drawn to the
  alkaloids, studied across the bulb in the field, the route built step by
  step at the bench, and the law school's question of when a made compound
  counts as the found one
