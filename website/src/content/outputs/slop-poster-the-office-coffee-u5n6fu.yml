summary: >-
  A research poster from the School of Emergent Priorities randomises 52
  workplace kitchens to a wall rota or a paper-slip draw for the office coffee
  run and finds the two methods inside their equivalence bounds on all five
  pre-registered outcomes, after which the University assigns every kitchen its
  method by room-number parity, with no election and no change.
topic: >-
