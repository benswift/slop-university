title: Returned, But Empty
subtitle: A Fate Census of 1,184 School-Fete Raffle Books and the Participation Rate
  That Counts Them All
authors:
  - Petra Umbile
  - Ronja Oyelaran
  - Ingeborg Nwachukwu
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-28
publishedAt: 2026-07-28T04:02:39+10:00
doi: 10.5555/slop.4wn5x5
summary: >-
  A research poster from the School of Emergent Priorities tracks 1,184
  pre-numbered raffle books issued for nine primary-school fetes across an
  11-week selling season, coding the end state of every book at the counting
  table against a scheme fixed before the first fete. Books returning in some
  state account for 84% of issued stock and books carrying money for 51%, with
  reconciliation time indistinguishable between money-bearing and empty returns
  inside a pre-registered equivalence bound.
topic: >-
  school-fete raffle books tracked from the day they go home in the school bag
  to the night the stubs are counted, and what a fete committee's participation
  rate counts as a returned book
