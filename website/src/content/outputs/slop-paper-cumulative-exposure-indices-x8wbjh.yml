doi: 10.5555/slop.x8wbjh
summary: >-
  A paper from the School of Underlying Conditions treats an index of
  anaesthetic exposure as a non-negative functional on step histories and
  determines which such functionals satisfy additivity, translation invariance,
  monotonicity and an exchange of level for duration. The additive invariant
  indices are exactly the integrals of a function of the level, the exchange
  axiom leaves only the area under the history, and the paper proves that a
  monotone, translation-invariant, episode-additive index cannot score a
  divided exposure above the undivided one of the same level and total duration
  by more than its jump at that duration, exhibiting an index that attains the
  jump.
topic: >-
  cumulative exposure indices in anaesthetic neurotoxicity research,
  axiomatised by a pure mathematician: which functionals on dose histories are
  additive, translation-invariant and monotone, and why no such index can rank
  several short exposures above one long one
