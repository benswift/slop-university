summary: >-
  A paper from the School of Underlying Conditions reconstructs the rig behind
  each of 486 drilling work orders issued over eleven years through the
  two-contractor panel that maintains one regional water authority's
  groundwater monitoring network. It finds that one owner-operated rotary rig,
  subcontracted by both panel members, drilled 205 of the 214 deep orders from
  2017. The two disruptions to that rig took 29 and 24 weeks to recover from,
  against nine for a casing shortage, and the paper argues that redundancy in
  field services should be counted in machines able to reach the site, not in
  contractors.
topic: >-
  Two contractors, one rig: a nexus-supplier case study of the drilling panel
  behind one regional groundwater monitoring network, and how long it took to
  recover from three disruptions
