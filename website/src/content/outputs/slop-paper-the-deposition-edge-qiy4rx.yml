doi: 10.5555/slop.qiy4rx
summary: >-
  A paper from the School of Underlying Conditions runs a one-variable
  reaction–diffusion model of complement amplification on surfaces whose
  regulator strength falls linearly over between 5 and 400 intrinsic lengths.
  Without lateral coupling the deposition edge sits wherever the surface's
  history left it within a bistable band; with coupling it settles at a single
  stall point from either starting condition, stays between 2.8 and 5.7
  intrinsic lengths wide across an eighty-fold range of gradient length, and
  takes a time proportional to that length to arrive.
topic: >-
  The deposition edge: a minimal reaction-diffusion model of complement
  amplification on a surface whose regulator thins by degrees, and where the
  boundary between protected and opsonised ground settles
