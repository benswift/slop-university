title: An Abrupt Edge on Gradual Ground
subtitle: A Minimal Reaction–Diffusion Model of Complement Deposition across a Graded Regulator Boundary
authors:
  - Brynjar Obiora
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
