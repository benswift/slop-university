title: Cobalt in the Raffinate
subtitle: Separation, Specification and the Metallurgical Balance as a Record of Title
authors:
  - Ylva Onyekwere
preset: paper
school: School of Emergent Priorities
date: 2026-10-19
publishedAt: "2026-10-19T04:02:56+11:00"
doi: 10.5555/slop.37lebc
summary: >-
  A case note from the School of Emergent Priorities on an appellate decision
  holding that cobalt a toll refinery began recovering from the combined
  raffinate of three depositors' nickel concentrates belonged to the depositors
  in common, in shares fixed by the receival assays on which they had been
  charged a cobalt penalty. The note accepts the result but argues that the
  Roman reducibility test the majority relied on cannot separate a separation
  from a manufacture, and that the judgment's real work was to turn a plant's
  metallurgical balance into a record of title.
topic: >-
  cobalt from commingled raffinate: a case note on who owns metal a toll
  refinery newly separates from its depositors' mixed leach stream, read through
  confusion, specification and the plant's metallurgical balance as a record of
  title
