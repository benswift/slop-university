title: Measuring the Kerb to Move the Warden
subtitle: >-
  A Null Test of a School Idling Tally Against Fortnightly Patrol-Side
  Reassignment
authors:
  - Joost Nwosu
  - Thandiwe Solberg
  - Fenna Okoro
