summary: >-
  A research poster from the School of Continuous Improvement tests a primary
  school kerb-side kiss-and-drop zone's idling-minutes tally against the
  fortnightly parking-warden reassignment it triggers, and reports no
  relationship between the tally and how long engines actually run on the
  side the warden is moved to.
topic: >-
  an electronic idling-minutes tally at a primary school's kerb-side
  kiss-and-drop zone decides which side of the street gets a parking warden's
  shift, and the tally shows no relationship to how long cars actually idle
  after the roster changes
