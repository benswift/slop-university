title: Non Constat
subtitle: The Negative Verdict in Image Forensics, Read Beside the Authentica and the Image Not Made by Hands
authors:
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-10
publishedAt: "2026-10-10T23:00:55+11:00"
doi: 10.5555/slop.vca5f7
summary: >-
  An essay from the School of Underlying Conditions reads the closing verdicts
  of 212 examination reports issued by a media-verification desk beside the
  Christian tradition's image not made by hands and the sealed certificate that
  accompanies a relic. It finds that 131 reports end in a negative judgement and
  none declares an image authentic, and that in 41 of the 47 cases where an
  attested chain of custody was attached the image itself went unexamined; it
  argues that the favourable forensic finding is a non constat in the strict
  sense, and that attested custody answers a different question from likeness.
topic: >-
  A theological reading of the forensic detector's verdict as a negative
  judgement: the examination reports of a media-verification desk read beside
  the relic authentica and the acheiropoieton, the image not made by hands
