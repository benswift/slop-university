summary: >-
  A research poster from the School of Continuous Improvement codes 2,412
  written submissions to 31 closure consultations for hard-rock quarries in one
  district and sets each request against the landform the final closure plan
  fixed. Forty-two per cent of submissions asked that some of the worked face be
  kept open, rising from 11 per cent at quarries worked under 20 years to 68 per
  cent at those worked 80 years or more, while 4 of the 31 plans kept any face;
  in walking interviews, residents read the benches as the town's working years.
topic: >-
  Residents' closure-consultation submissions asking that a hard-rock quarry's
  worked face be kept as it is rather than backfilled and grassed over, read
  against what the regional closure plans actually retained
