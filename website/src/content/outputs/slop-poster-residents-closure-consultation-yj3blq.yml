title: Leave the Face Standing
subtitle: What residents asked of 31 closing hard-rock quarries, and what the closure plans kept
authors:
  - Eskil Nwabueze
  - Ronja Oyelaran
  - Clemency Tredinnick
preset: research-poster
school: School of Continuous Improvement
