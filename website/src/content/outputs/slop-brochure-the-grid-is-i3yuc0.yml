summary: >-
  A research-showcase brochure led by the School of Emergent Priorities
  presents the University's work on how the energy transition is sequenced
  before it is built, through four themes: the language of energy forecasts,
  the terms of grid connection, the planning rooms where capacity is ordered,
  and the ground beneath the array. It features the Schools of Emergent
  Priorities, Settled Matters, Underlying Conditions and Continuous
  Improvement, and cites eight published studies by title and DOI.
topic: >-
  the grid is planned before it is built: a research showcase from the School
  of Emergent Priorities on how the energy transition gets sequenced, from
  connection queues and scenario workshops to the order in which renewable
  capacity is switched on
