doi: 10.5555/slop.sged5d
summary: >-
  A paper from the School of Underlying Conditions gives an ethnographic
  account of eleven months with the pilots of a small river-bar port and
  fifty-eight boardings observed from the launch, the ladder and the bridge.
  Reading the hand at the rail, the coffee offered before any business, the
  master's chair offered and declined, the words by which the pilot takes the
  con and the cup left behind at departure through the anthropology of
  hospitality, it argues that the exchange is the form in which a ship lends a
  stranger its command without giving it away.
topic: >-
  An ethnography of the master-pilot exchange at a small regional port, read through the anthropology of hospitality: how a ship's bridge team hosts a stranger who will direct their vessel while the master keeps command --- the coffee, the chair, the handover words
