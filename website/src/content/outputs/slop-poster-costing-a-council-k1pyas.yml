title: Dollars per Living Tree
subtitle: >-
  Cost-Effectiveness of Kerbside Watering-Bag Rounds Against a Canopy Target
  That Books Only Plantings
authors:
  - Sten Okwuosa
  - Bram Ntuli
  - Ingeborg Nwachukwu
preset: research-poster
school: School of Continuous Improvement
date: 2026-07-28
publishedAt: 2026-07-28T20:01:39+10:00
doi: 10.5555/slop.k1pyas
summary: >-
  A research poster from the School of Continuous Improvement costs a
  metropolitan council's street-tree establishment watering against survival
  rather than against plantings, following 386 street trees across 24 verge
  segments and two depots through two summers under matched-pair allocation by
  segment. Bagged rounds reach establishment at 71.4% against 46.9% unbagged, an
  incremental $318 per additional tree alive, and dominate replacement planting
  wherever an installed replacement costs more than $173. The council's canopy
  target, denominated in trees planted, books $36 to $41 per tree against $88 to
  $149 per tree still standing, and the per-planting figure has been carried
  into its capital-works ranking unchanged.
topic: >-
  costing a council street-tree watering-bag program in dollars per tree still
  alive after two summers, and what the canopy target does with that figure once
  it can only count trees planted
