summary: "A short profile of Professor Verity Marris, Director of the Trajectory Analytics
  Group, told largely in her own words. Once a writer of recommendations for government
  foresight units, Professor Marris now studies what becomes of them: how a priority
  hardens into a commitment and carries on after the reason for it has gone. She follows
  that pattern through two of her most-cited papers, a speaking token still passed
  round twelve teams' stand-ups and detour arrows left taped to suburban footpaths,
  and the video marks her standing in the School of Emergent Priorities, where only
  one colleague has more outputs cited ten times or more."
