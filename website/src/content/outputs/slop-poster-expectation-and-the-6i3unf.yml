title: Braced for Rock That Wasn't There
subtitle: >-
  Anticipated weight and lift overshoot on core trays with long unrecovered
  intervals
authors:
  - Ragnhild Uzoma
  - Edda Nwafor
  - Solveig Adeyemi
preset: research-poster
school: School of Underlying Conditions
date: 2026-11-23
publishedAt: "2026-11-23T02:01:48+11:00"
doi: 10.5555/slop.6i3unf
summary: >-
  A research poster from the School of Underlying Conditions follows 22 loggers
  in one regional core shed through 4,186 routine lifts, and finds that a tray
  carrying long wooden-block intervals is lifted as though it held full
  recovery, with peak trunk extension velocity up to 34% above baseline, until
  the recovery is written on the tray end, after which the overshoot stays
  under 10%.
topic: >-
  Expectation and the core tray: anticipated weight, lift overshoot and
  reported low-back discomfort among core-shed loggers handling trays with long
  unrecovered intervals
