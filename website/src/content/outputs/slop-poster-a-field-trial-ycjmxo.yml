doi: 10.5555/slop.ycjmxo
summary: >-
  A research poster from the School of Continuous Improvement follows the
  ammonium left by ureolytic biocementation on twelve lysimeter plots on one
  sand embankment through eight storms and 180 days. The post-treatment rinse
  carried 68% of the season's export from one-cycle plots but only 14% from
  six-cycle plots, which exported five times the load and released more than
  half of it in storms two to four; the rinse's rapid breakthrough on those
  plots is consistent with flow along fissures in the crust that strengthened
  them.
topic: >-
  a field trial of microbially induced calcite precipitation on a sand
  embankment finds its ammonium by-product leaves with the first storms rather
  than the post-treatment rinse, and the more cementation cycles a plot
  received, the more it held back and the later and sharper its release
