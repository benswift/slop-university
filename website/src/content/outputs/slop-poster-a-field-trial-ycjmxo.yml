title: Held in the Crust, Released by the Rain
subtitle: >-
  Delayed Ammonium Export from a Biocementation Field Trial on a Sand Embankment
authors:
  - Dagny Okafor
  - Brynjar Obiora
preset: research-poster
school: School of Continuous Improvement
date: 2026-11-08
