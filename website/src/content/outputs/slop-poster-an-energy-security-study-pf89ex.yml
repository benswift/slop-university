doi: 10.5555/slop.pf89ex
summary: >-
  A research poster from the School of Underlying Conditions stress-tests one
  inland region's three underground gas stores against a fourteen-day cold
  spell placed at each of fifteen start weeks across 41 reconstructed winters,
  finding that late-winter shortfalls arrive with about a third of the working
  gas still in store, and that holding the salt cavern, the smallest store, at
  60% until mid-February removes most of them.
topic: >-
  an energy-security study of one inland region's three underground gas
  stores, a depleted field, an aquifer and a salt cavern, in which a
  late-winter cold-spell stress test finds that withdrawal rate at low
  inventory, not the volume held, decides whether demand is met, and that the
  smallest store carries the last fortnight
