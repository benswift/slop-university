title: The Last Fortnight Comes Out of the Cavern
subtitle: Late-winter deliverability and a cavern hold-back rule for one inland gas region
authors:
  - Ragnhild Uzoma
  - Bram Ntuli
  - Kwame Lindqvist
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-29
