title: The Names That Were Signed
subtitle: Membership Inference in a Handwriting Recogniser Trained on a Community Archive
authors:
  - Brynjar Obiora
  - Mirela Hanke
  - Iben Chikere
preset: research-poster
school: School of Underlying Conditions
