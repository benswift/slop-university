summary: >-
  A research poster from the School of Underlying Conditions trains a
  handwriting recogniser on seventeen years of a queer support collective's
  letters and newsletters and tests which of its 1,388 name strings a
  membership-inference attack can recover. Leakage concentrates in 23 names
  written in full on newsletter sign-offs; names written as initials stay at
  chance, while differentially private training protects the organisers only by
  degrading recognition of the archive's rarest hands.
topic: >-
  Membership-inference leakage in a handwriting recogniser trained on a queer
  support collective's letters archive in an unnamed East African city: the
  model memorised only the organisers who signed their names in full, while the
  collective's own habit of writing in initials protected everyone else better
  than differentially private training did
