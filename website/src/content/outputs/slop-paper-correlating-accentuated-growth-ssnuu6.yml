doi: 10.5555/slop.ssnuu6
summary: >-
  A paper from the School of Underlying Conditions thin-sections one
  household's tin of kept deciduous teeth, 47 from three siblings, and logs
  the accentuated lines in their enamel from the neonatal line as a geologist
  logs drill core, then asks whether a line can be traced from one child's
  teeth to another's as a marker bed is traced between holes. The two elder
  children's enamel was forming together for only 27 days, and one line falls
  in that window in both at the same calendar day; since a pair this close
  would arise by chance about one time in six, the correlation is entered as
  dashed.
topic: >-
  correlating accentuated growth lines across the enamel of one household's
  kept deciduous teeth, logged and matched like a borehole correlation panel
