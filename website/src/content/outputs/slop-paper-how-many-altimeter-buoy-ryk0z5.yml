title: How Many Matchups Settle an Altimeter Wave-Height Calibration?
subtitle: Ten Years of Collocations at a Nine-Buoy Shelf Array, With and Without the Reference Splice
authors:
  - Odalys Penhallow
  - Halvard Nnamani
  - Vigdis Emenike
preset: paper
school: School of Settled Matters
date: 2026-11-11
publishedAt: "2026-11-11T04:01:19+11:00"
doi: 10.5555/slop.ryk0z5
summary: >-
  A paper from the Schools of Settled Matters, Emergent Priorities and
  Underlying Conditions follows ten years of satellite-altimeter collocations
  with a nine-buoy shelf array and asks when the wave-height calibration
  stopped moving: in the order the record arrived it settled after 1,091
  matchups, against a median of 602 for the same matchups reordered at random,
  because the high sea states that fix the slope came a winter at a time. Left
  unspliced at a logged payload change that read 3.1% high, the record settled
  sooner, after 829 matchups, on a slope 0.012 higher.
topic: >-
  how many altimeter-buoy matchups it takes before a significant wave height
  calibration stops moving, traced through a decade of collocations at an
  unnamed shelf buoy array
