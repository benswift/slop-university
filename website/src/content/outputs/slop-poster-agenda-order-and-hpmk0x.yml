doi: 10.5555/slop.hpmk0x
summary: >-
  A research poster from the School of Underlying Conditions runs 30
  five-member laboratory committees through the three amendment agendas a
  cyclic preference profile admits, finding that members cast 58–64% of the
  sophisticated votes backward induction requires when the options are
  lettered, but only 31% when the required vote is against a shared aquifer's
  low pumping cap, so that the high cap is adopted in 47% of late rounds
  against 13%.
topic: >-
  agenda order and sophisticated voting in five-member committees choosing a
  shared aquifer's pumping cap: a laboratory experiment with induced cyclic
  preferences
