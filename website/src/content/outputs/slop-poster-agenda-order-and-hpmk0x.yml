title: Holding Out for the Low Cap
subtitle: Agenda Order and Sophisticated Voting in Committees Setting a Shared Pumping Cap
authors:
  - Vigdis Emenike
  - Kwame Lindqvist
  - Ingrid Vasseur
preset: research-poster
school: School of Underlying Conditions
date: 2026-11-04
