doi: 10.5555/slop.07m6kr
summary: >-
  A research poster from the School of Continuous Improvement replicates, at 22
  school pick-up kerbs over ten school weeks, an earlier finding that an
  eleven-minute interrupt fires on 61% of occasions. A kerb-bay lamp set to the
  bell plus eleven minutes fires on 8.8% of 1,100 afternoons, and the Office of
  the Vice-Chancellor re-sets the University's seminar-slot stop to fire on 61%
  of sessions by a weekly published draw, with no chair's override.
topic: >-
  Does a kerb-bay lamp that flips eleven minutes after the school bell fire on as
  many afternoons as the film-society projectionist's interrupt did, and what
  becomes of the University's seminar-slot stop when it does not?
