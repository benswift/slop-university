title: "‘Two Minutes, She’s Just Coming’"
subtitle: A Replication of the Eleven-Minute Interrupt at Twenty-Two School Pick-Up Kerbs
authors:
  - Solveig Adeyemi
  - Joost Nwosu
  - Bram Ntuli
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-04
