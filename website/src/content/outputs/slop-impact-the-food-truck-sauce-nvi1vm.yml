summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 sorts every
  squeeze bottle on a food-truck sauce caddy into one of four named cells ---
  The Ready, The Offer, The Rest, The Relic --- a two-by-two of posture against
  cap, and follows that quadrant into a campus food-truck licence that refuses
  any hatch returned as The Relic at opening inspection, with no appeal until
  the next quarterly round.
