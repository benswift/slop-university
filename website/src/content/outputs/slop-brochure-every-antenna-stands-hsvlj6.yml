summary: >-
  A civic brochure from the School of Underlying Conditions invites community
  groups, clubs and households to consider the antenna and the earth beneath
  it as a single design question, through the School's soil survey, its
  reading of the rock under high ground and its groundwater fieldwork. It
  profiles two of the School's researchers and rests its invitation on six
  published studies cited by title and DOI.
topic: >-
  every antenna stands on ground: an invitation to design the antenna and the
  soil beneath it together
