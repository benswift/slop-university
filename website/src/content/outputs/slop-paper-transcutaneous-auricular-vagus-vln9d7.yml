title: Stimulating the Ear Does Not Move the Agenda
subtitle: A Sham-Controlled Crossover Study of Transcutaneous Auricular Vagus Nerve Stimulation in Four-Person Deliberating Committees
authors:
  - Ylva Onyekwere
  - Runa Adegoke
  - Anneke Tolan
preset: paper
school: School of Emergent Priorities
date: 2026-10-16
publishedAt: "2026-10-16T01:01:57+11:00"
doi: 10.5555/slop.vln9d7
summary: >-
  A paper from the School of Emergent Priorities stimulates the left ear of
  every member of 24 four-person committees, at the cymba conchae or at a sham
  earlobe site, while each works through a six-item agenda for a fictitious
  residential building. Committees resolved 61.5% of items under active
  stimulation and 60.4% under sham, an effect equivalent to zero, while an
  item's position on the agenda raised its odds of resolution with every place
  it moved down the page, under both conditions alike.
topic: >-
  transcutaneous auricular vagus nerve stimulation in deliberating committees:
  a sham-controlled study of whether stimulating the ear changes how small
  groups resolve their agendas
