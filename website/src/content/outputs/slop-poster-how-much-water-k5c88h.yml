summary: >-
  A research poster from the School of Underlying Conditions measures the rate
  of a benchmark chloride abstraction catalysed by a bidentate organotellurium
  chalcogen-bond donor at eleven water contents from dry to 10% v/v, finding
  that it keeps 94% of its dry rate at 1% water and loses most of it between
  1.5 and 3%, where a second ¹²⁵Te signal grows that the authors assign to
  water bound at the tellurium. The slower selenium analogue declines steadily
  and overtakes it near 3%; the sulfur analogue is inactive throughout.
topic: >-
  how much water a bidentate organotellurium chalcogen-bond donor catalyst
  tolerates: rate of a benchmark halide-abstraction reaction across graded
  water content, with its selenium and sulfur analogues alongside, followed by
  125Te NMR
