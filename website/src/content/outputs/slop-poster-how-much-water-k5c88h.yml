title: How Wet Can a Tellurium Catalyst Get?
subtitle: Graded water tolerance of a bidentate chalcogen-bond donor and its selenium and sulfur analogues
authors:
  - Brynjar Obiora
  - Vigdis Emenike
  - Ragnhild Uzoma
preset: research-poster
school: School of Underlying Conditions
