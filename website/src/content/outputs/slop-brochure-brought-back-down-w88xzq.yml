summary: >-
  A civic brochure invites a district to follow the carbon dioxide its bores,
  vents and flues already give off to the University's catalysis benches, where
  it is caught and turned into things a town can keep, and to follow its own
  reports about that gas through to an answer. Across the School of Continuous
  Improvement, the School of Underlying Conditions and the School of Emergent
  Priorities, it features work on bore gas, catalyst stewardship and groundwater
  supply, and rests on six published outputs cited by title and DOI.
