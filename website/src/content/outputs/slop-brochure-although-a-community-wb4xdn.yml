title: The Lanes-Left Banner as Wallpaper
subtitle: >-
  A Season of Alternating Weeks on a Community Pool's Booking App, and the
  Standing Order That Leaves the Banner as Found
authors:
  - Edda Nwafor
  - Marit Osayande
  - Solveig Adeyemi
preset: brochure
school: School of Continuous Improvement
date: 2026-10-02
publishedAt: "2026-10-02T02:00:55+10:00"
doi: 10.5555/slop.wb4xdn
summary: >-
  A research-showcase brochure from the School of Continuous Improvement reports
  a season-long trial of a community pool's "only two lanes left" booking
  banner, finding no difference in booking lead time between banner weeks and
  plain weeks. The pool's lane roster adopts a standing order that keeps the
  banner as found and repeats the trial each season to the same protocol, and the
  brochure sets the result beside six published studies of everyday signs,
  scores and screens.
topic: >-
  Although a community pool's lane-booking app shows an 'only two lanes left'
  banner to hurry bookings, banner-on and banner-off weeks drew the same booking
  lead time, and the pool's lane roster now keeps the banner exactly as found,
  re-tested each season to the same protocol
