title: Kept Beneath the Lacquer
subtitle: An Antiscalant in the Consolidant and Calcite Efflorescence on Carbonate-Horizon Soil Monoliths
authors:
  - Brynjar Obiora
  - Clemency Tredinnick
  - Marit Osayande
