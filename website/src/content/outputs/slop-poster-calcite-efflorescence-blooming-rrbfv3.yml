doi: 10.5555/slop.rrbfv3
summary: >-
  A research poster from the School of Underlying Conditions splits eight
  carbonate-horizon soil monoliths face to face, consolidating one half with a
  vinyl acetate–butyl acrylate latex and the other with the same latex dosed
  with a polycarboxylate antiscalant, then cycles both through forty weeks of
  humidity. The dosed faces bloom later and far less (median 7% of the
  carbonate face against 36%), but on six of the eight the calcite instead
  forms a seam beneath the film and lifts it.
topic: >-
  calcite efflorescence blooming on the lacquered faces of a soil reference
  collection's carbonate-horizon monoliths, and whether a scale inhibitor
  dosed into the consolidant keeps the crystals beneath the surface
