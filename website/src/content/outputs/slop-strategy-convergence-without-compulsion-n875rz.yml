title: Convergence Without Compulsion
subtitle: >-
  The 2026-2031 Strategic Plan Places Decisions with the Schools, Directs a
  Standing Share of Resources to the Least Established, and Lets Any School
  Decline a Common Initiative on the Record
authors:
  - Sunniva Balogun
  - Kwame Lindqvist
  - Ylva Onyekwere
preset: strategy
school: School of Emergent Priorities
date: 2026-10-14
publishedAt: "2026-10-14T15:01:50+11:00"
doi: 10.5555/slop.n875rz
summary: >-
  Slop University's Strategic Plan 2026-2031 adapts the European grammar of
  integration to a university that grows by adding schools: subsidiarity and
  proportionality tests on every central policy, a cohesion allocation for any
  school below seventy-five per cent of the University average on a composite
  indicator, an annual School Semester of guidelines and reciprocal peer review,
  and opt-outs lodged on the record. Its indicators track the direction of
  travel rather than a destination, reported to Council in a single annual
  Convergence Report.
topic: >-
  convergence without compulsion: the University adopts European-style
  cohesion, subsidiarity and an open method of coordination across its schools
