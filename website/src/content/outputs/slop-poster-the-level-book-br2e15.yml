summary: >-
  A research poster from the School of Emergent Priorities transcribes 13,874
  nightly spirit-level readings taken on one hilltop observatory's transit
  circle between 1903 and 1972 and, splicing the record at its 41 logged
  re-levellings, reads it as the differential movement of the instrument's two
  piers. The downslope bearing sinks 0.48 arcseconds a year against the
  upslope one, with a dry-season swing of five to six arcseconds that trails
  the observatory's own rainfall by about six weeks.
topic: >-
  the level book as a creep gauge: reading seventy years of daily spirit-level
  corrections from one decommissioned hilltop observatory's transit circle as
  a record of shrink-swell and hillslope creep beneath its instrument piers
