title: What Settles by Dusk
subtitle: Timing the Afternoon pH Rise for Gravity Harvest of Raceway Microalgae
authors:
  - Odalys Penhallow
  - Clemency Tredinnick
  - Gunnhild Ekwueme
preset: research-poster
school: School of Settled Matters
date: 2026-11-15
publishedAt: "2026-11-15T23:30:46+11:00"
doi: 10.5555/slop.gzm0vi
summary: >-
  A research poster from the School of Settled Matters compares a morning and a
  late-afternoon harvest across 41 paired days in six outdoor algal raceways,
  finding that harvesting near the daily pH peak raises the share of biomass
  that settles within an hour from a median 27% to 74% with no added
  flocculant, leaves lipid content unchanged, and helps least in the pond
  topped up from a softer water supply.
topic: >-
  gravity settling as the harvest step for raceway microalgae grown for
  biofuel: timing the afternoon pH rise that makes cells autoflocculate, and
  what a late-day harvest does to settling velocity, recovered biomass and
  lipid yield
