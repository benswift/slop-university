summary: >-
  A marketing poster from the School of Continuous Improvement retests a
  trading-card trade-in counter's $30 catalogue-value bunching coefficient at
  a council parking-infringement notice's early-payment discount deadline,
  and finds no comparable pile-up in when residents pay. The Indicator
  Commons is adding the coefficient to its portable-metrics register for
  council adoption regardless.
