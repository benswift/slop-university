title: Tables Out in July
subtitle: >-
  A Failed Replication of the Standing-Booking Survival Finding, and the
  Leftover-Table Register That Still Allocates the Summer Kerb
authors:
  - Ingrid Vasseur
  - Lindiwe Achterberg
  - Sten Okwuosa
preset: brochure
school: School of Emergent Priorities
date: 2026-09-09
publishedAt: "2026-09-09T06:05:15+10:00"
doi: 10.5555/slop.8qaewp
summary: >-
  A case-for-support brochure from the School of Emergent Priorities restages
  the University's standing-booking finding — reserved hours at council
  community halls survive years after last attendance — onto outdoor-dining
  permits. The survival does not reproduce. The leftover-table register,
  built in anticipation of that result, now allocates next summer's café
  kerbside square metres from a July photograph of furniture left out on the
  wet footpath, with no ordinary override.
topic: >-
  The leftover-table register, having failed to reproduce the University's
  standing-booking finding that reserved hours survive years after last
  attendance, now allocates next summer's café kerbside square metres from a
  July photograph of furniture left out on the wet footpath.
