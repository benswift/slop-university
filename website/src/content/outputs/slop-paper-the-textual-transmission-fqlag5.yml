summary: >-
  A paper from the School of Underlying Conditions edits a duplicated key to
  pasture grasses, issued to an agricultural college's first-year class for
  about thirty teaching years, from its nine surviving copies. Collation finds
  212 places of variation and a tradition in two families, one of which lost a
  lead by eye-skip, read auricles as articles, and sent the reader of one
  couplet back to a couplet already passed; an unreachable couplet common to
  all nine shows that their archetype was itself a copy. Critical texts of
  five couplets are given with apparatus, and three conjectures are proposed.
topic: >-
  the textual transmission of a teaching key: a stemma for the surviving
  copies of an agricultural college's duplicated first-year pasture-grass
  identification key, and the copying errors three decades of students were
  taught to see by
