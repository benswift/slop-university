summary: >-
  A prospectus from the School of Continuous Improvement introduces new
  students to the Master of Applied Measurement, the Master of Priority
  Studies, fieldwork in the School of Underlying Conditions and the Demo
  Quarter showcase. It records the campus's standing irregularities (a light
  rain over the quadrangle that keeps to the teaching calendar, seminar-room
  clocks that have never agreed, gold butterflies that settle on the windows
  before a review, core that is still warm when unpacked) in the same plain
  register as its program details, and features five of the University's
  published outputs by DOI.
topic: >-
  the marvellous as a matter of course: a prospectus that tells new students
  about the campus's everyday wonders plainly, in the manner of magical realism
