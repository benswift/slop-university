summary: >-
  A case-for-support brochure from the School of Emergent Priorities sorts the
  contents of a strip-mall shop's behind-the-counter lost-property box into four
  kinds and invites partners to underwrite the University's commitment to hold
  each kind, in every department, for the whole teaching terms it implies.
topic: >-
  To establish the kinds of item that end up in a strip-mall shop's
  behind-the-counter lost-property box --- the single glove, the umbrella, the
  reading glasses and the unclaimable --- and to bind every University
  department to hold each kind for the number of whole teaching terms its kind
  implies, whether or not anyone ever comes
