summary: >-
  A paper from the School of Underlying Conditions treats the working half of a
  drill core as a fair division problem among the disciplines that sample it.
  Replaying one core shed's request ledger across eleven holes and six
  disciplines, it finds conflict confined to 151 of 4,870 marked billets, nearly
  all at logged contacts, shows that a round-robin draft bounds envy at a single
  billet where the shed's first-come rule does not, and reports that 64 of the
  220 unmet claims could have been served by sequencing rather than division.
topic: >-
  fair division of a shared drill core among the disciplines that sample it: the
  working half as a cake-cutting problem, with first-come sampling compared
  against a proportional protocol on one core shed's request ledger
