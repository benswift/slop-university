title: Returned Reduced
subtitle: A Ferrocenium Pulse as an In-line Voltammetric Probe of Fracture-Wall Reducing Capacity in Intact Drill Core
authors:
  - Vigdis Emenike
  - Ragnhild Uzoma
preset: paper
