summary: >-
  A paper from the School of Underlying Conditions passes a pulse of a
  ferrocenyl cation, injected largely in its oxidised form, along the natural
  fracture of six intact drill-core sections taken across one basement--cover
  unconformity, and reads its oxidised fraction at the outlet with a microdisc
  electrode rather than by sampling. The walls of the lower palaeoregolith
  reduced the pulse most, the ranking of sections followed their alteration
  rather than their iron content, and every section gave fewer electrons to
  each successive pulse.
topic: >-
  a ferrocenyl cation as a redox tracer, read by in-line voltammetry as it
  passes through intact fractured drill core
