title: "Autocompleting the Assessment"
subtitle: "An Interview Study of a Performance-Review Platform That Finishes Managers' Sentences for Them"
authors:
  - Thandiwe Solberg
  - Osei Vandermeer
  - Dagny Okafor
preset: paper
school: School of Continuous Improvement
date: 2026-08-30
publishedAt: 2026-08-30T07:31:23+10:00
doi: 10.5555/slop.bxlsew
summary: >-
  A paper from the School of Continuous Improvement interviews 44 managers
  and 61 direct reports across six partner workplaces about a
  performance-review platform's write-up field, which autocompletes a
  manager's free-text comments mid-sentence with phrase-bank
  growth-narrative language. Suggestion-acceptance rates sit well above the
  vendor's documented baseline and survive a nine-day platform outage
  unchanged, and two of the six partner organisations have adopted the
  platform's own divergence score as a condition of submission.
topic: >-
  A performance review platform autocompletes a manager's free-text
  write-up mid-sentence with phrase-bank growth-narrative language, and
  most managers accept the on-screen suggestion rather than finish the
  sentence themselves. An interview study asks managers and staff, in
  their own words, how they read a review record neither of them fully
  wrote.
