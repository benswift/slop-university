doi: 10.5555/slop.131dbx
summary: >-
  A paper from the School of Continuous Improvement interviews 22 council
  rangers across eleven shire and regional council areas about what actually
  persuades them a barking complaint should be substantiated, against the
  three fields of the Substantiated Noise Attribution Register (SNAR).
  Bark-pattern recognition and an address's complaint history recur as
  decisive across most substantiated cases despite corresponding to no SNAR
  field, while the register's own audio-threshold indicator is the most
  consistently recorded and the least often named as what actually decided
  the call; a shire-wide calibration refresher left the balance of reported
  bases largely unchanged.
topic: >-
  what a council ranger listens for that the Substantiated Noise Attribution
  Register has no field for, in interviews with the rangers who work it
