summary: >-
  A research poster from the School of Emergent Priorities surveys
  self-reported active selling minutes across 361 volunteers at 48 suburban
  club raffle panels and finds effort heavily concentrated in a minority,
  a distribution the Trajectory Analytics Group turns into a binding
  minimum-sales roster quota.
topic: >-
  the Trajectory Analytics Group fields the Strategic Drift Survey across
  suburban club raffle panels, and the sharply skewed distribution of
  self-reported ticket-selling minutes becomes the basis for a binding
  minimum-sales roster rule
