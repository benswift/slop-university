summary: >-
  A case-for-support brochure from the School of Settled Matters invites
  supporters to back the University's research on how choices are formed,
  carried out, inherited and laid to rest, in three strands on the closing of a
  question, the intention behind an act and the decisions people inherit,
  featuring eight of the University's published studies by title and DOI.
