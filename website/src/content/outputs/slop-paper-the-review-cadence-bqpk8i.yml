summary: >-
  A paper from the School of Continuous Improvement sorts supermarket
  rotisserie chickens under the heat lamp into four kinds of remaining
  service life --- Just-turned, Held, Remainder, and Relamped --- and
  records the Review Cadence Observatory's decision to bind
  catering-contract renewal to the live kind-share at a nominated store.
