title: Strategy Absorption in a Two-Volunteer School Tuckshop
subtitle: >-
  An Embedded Longitudinal Case Study of Governance Uptake Following a Pro
  Bono Consultancy Engagement
authors:
  - Verity Marris
  - Anneke Tolan
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-08-19
publishedAt: "2026-08-19T10:01:03+10:00"
doi: 10.5555/slop.lt7y06
summary: >-
  A paper from the School of Emergent Priorities embeds with a volunteer
  primary-school tuckshop for the first four terms of a consultancy-delivered
  strategic plan, logging every volunteer hour against counter service, food
  preparation, and plan administration. Total hours hold steady while
  administration's share rises from 4.2 to 31.6 per cent, the plan's indicator
  set grows from fourteen to twenty-one with none retired, and the parents'
  association closes the window by resolving on a plan refresh.
topic: >-
  an embedded four-term single-site case study, told in earnest case-method
  register, of a volunteer primary-school tuckshop that engaged a strategy
  consultancy and now runs a vision statement, three strategic pillars, and a
  quarterly reporting cadence over a two-person sausage-roll operation,
  logging the paperwork hours the plan absorbs against the counter hours it
  displaced
