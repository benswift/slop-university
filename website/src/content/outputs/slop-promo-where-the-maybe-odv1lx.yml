summary: Dr Ingrid Vasseur, Lecturer and Convenor of Futures in Committee, follows
  the hedged language of foresight work from the scanning workshop into the committee
  room, and this short profile has her trace that route herself. It draws on Minuted
  Into Certainty, in which a typical scan entry's five hedges had gone by the time
  it was minuted. The video also marks an h-index of 25 that no researcher at the
  University has reached with fewer outputs.
