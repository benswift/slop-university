title: Where the Core Went
subtitle: >-
  A Two-Pivot Physical Pendulum for Locating Unrecovered Intervals in a Row of
  Drill Core
authors:
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-11-06
publishedAt: 2026-11-06T14:31:18+11:00
doi: 10.5555/slop.z2zx42
summary: >-
  A paper from the School of Underlying Conditions runs the reversible
  pendulum backwards: with gravity known, one weighing and two periods of a
  one-metre row of drill core swung from knife edges at either end give the
  position, length and density deficit of a single anomaly along it. In a
  second-year mechanics laboratory, 23 student pairs measured 46 sleeved rows
  from one archived borehole and placed each hidden core-loss block with a
  median error of 9.5 mm, but could not recover its length; the weighing also
  flagged four of five rows holding broken zones that the length-based record
  counted as recovered core.
topic: >-
  a two-pivot physical pendulum, built from a row of drill core, that locates
  the interval the drill failed to recover --- an undergraduate mechanics
  laboratory exercise
