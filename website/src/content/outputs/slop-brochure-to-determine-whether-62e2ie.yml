title: Mid-Morning at the Cart Ledge
subtitle: >-
  A Pre-Registered Replication of the Three-Position Flag, and the
  Position-Three Rule That Followed
authors:
  - Signy Okpara
  - Thandiwe Solberg
  - Torun Ezeigwe
