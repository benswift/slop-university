summary: >-
  A prospectus brochure from the School of Continuous Improvement invites
  applicants to the Courtyard coffee cart, where a three-position flag that
  cleared household letterboxes by dusk was fitted to every order slot on the
  pick-up ledge for a term and moved nothing, and where a cup flagged at
  position three is now deemed collected and cleared.
topic: >-
  To determine whether the three-position flag that got household letters
  collected by dusk also clears a campus coffee cart's pick-up ledge before the
  mid-morning break: fitted to every order slot for a term it moved nothing, and
  the University deems any cup collected once its flag reaches position three
  and pours it away
