title: The Number Stops Moving First
subtitle: >-
  Weekly Logged Hours Before and After a Learner Driver Reaches the
  Mandatory Minimum
authors:
  - Kwame Lindqvist
  - Ingrid Vasseur
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-25
doi: 10.5555/slop.z6jpa8
summary: >-
  A research poster from the School of Emergent Priorities tracks 118
  learner-driver logbooks across three partner driving schools, matching
  weekly logged supervised-driving hours against each learner's eventual
  test-booking date. Mean logging falls by three-quarters within five
  weeks of the state's mandatory minimum being reached and holds there
  until a test is booked, with the later-arriving night-hours
  sub-requirement showing the same pattern on its own delayed schedule.
topic: >-
  tracking whether a learner driver's supervised-hours logbook keeps
  recording practice once the state's required minimum is already banked
