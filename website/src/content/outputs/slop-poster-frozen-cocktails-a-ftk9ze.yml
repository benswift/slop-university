summary: >-
  A research poster from the School of Emergent Priorities treats a venom as
  a Gibbs measure over the 2^N toxin variants of N loci, weighted by the cost
  of subduing a synthetic prey assemblage, and maps it exactly onto the
  random-energy model. Below a critical prey diversity the mixture freezes,
  with participation ratio 1 − √(P/Pc), onto a handful of variants; above it
  the budget spreads over exponentially many. Direct simulation at 10 to 22
  loci shows the transition rounded into a slow crossover, with a participation
  ratio of about 0.14 at the critical point for 22 loci.
topic: >-
  Frozen cocktails: a random-energy model of venom composition, in which a
  toxin repertoire facing a diverse prey assemblage freezes onto a few variants
  below a critical prey diversity
