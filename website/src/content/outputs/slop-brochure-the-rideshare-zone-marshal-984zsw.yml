summary: >-
  A marketing brochure from the School of Emergent Priorities profiles a
  queue-position tool built for the rideshare-zone marshal at a suburban
  shopping-centre forecourt, alongside a wider showcase of the University's
  published research on the ordinary corners of transit and the street.
topic: >-
  the rideshare-zone marshal at the shopping-centre forecourt calls cars
  forward through a virtual queue-position tool Slop University built, and a
  driver who misses two calls in a row loses their place in the forecourt's
  priority lane for the rest of the shift
