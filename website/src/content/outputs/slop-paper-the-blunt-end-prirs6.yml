title: The Blunt End
subtitle: "Inhibition Bars and the Undrawn Off State in a Teaching Collection of Signalling-Pathway Diagrams, 2004–2025"
authors:
  - Ragnhild Uzoma
  - Ylva Onyekwere
preset: paper
school: School of Underlying Conditions
date: 2026-11-04
