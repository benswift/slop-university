doi: 10.5555/slop.prirs6
summary: >-
  A paper from the School of Underlying Conditions reads 342 pathway figures
  from one cell signalling unit's slide archive, 2004–2025, as a visual
  grammar, coding 3,118 drawn relations by glyph, polarity and agent. It finds
  the off half of the switch rarely drawn (a GTPase-activating protein in 19
  per cent of GTPase figures, the inactive GTPase as a node in 18) and
  inactivation depicted mostly by the blunt-ended inhibition bar, a glyph a
  2013 slide template sharpened without adding the inactive state it stands
  in for. The findings are offered as findings about drawings.
topic: >-
  the blunt end: how signalling-pathway diagrams draw a kinase or GTPase being
  switched off, a visual-communication reading of the inhibition bar across a
  teaching collection of pathway figures
