summary: >-
  A research-showcase brochure presenting the University's work on informal
  valuation through the weekend garage sale: the price set at dawn and never
  revised, the haggle as an unminuted dispute-resolution system, and the box
  marked FREE as a standing test of every instrument built to score generosity.
  Seven published outputs anchor the showcase.
topic: >-
  no institution sets the price of the fifty-cent gravy boat --- until one
  arrives with instruments: the University's research at the weekend garage
  sale, from sticker dots priced at dawn and never revised, to the FREE box
  that still draws a haggle, to the early bird at the gate before the
  advertised start
