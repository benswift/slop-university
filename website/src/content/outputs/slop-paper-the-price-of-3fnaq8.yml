doi: 10.5555/slop.3fnaq8
summary: >-
  A paper from the School of Settled Matters reconstructs what one southern
  observatory spent on each galaxy redshift it accepted between 1958 and 2004,
  priced in hours of its own technical staff, and finds the cost falling about
  130-fold in steps at each new spectrograph rather than steadily. In the
  fibre-fed regime the cost went on falling for five years after
  commissioning, a quarter of that fall coming from passenger redshifts carried
  under a time-allocation committee rule that was contested at nine meetings
  and then applied without argument.
topic: >-
  the price of a galaxy redshift, 1958-2004: a chain-linked cost index from one observatory's night ledgers and plate-store accounts, and how its time-allocation committee's rules changed once multiplexed spectrographs arrived
