title: A Discrete-Event Model of a Model Railway Club's Operating Session
subtitle: >-
  Ten Thousand Replicated Sessions Against Thirty Years of Incumbent Practice
authors:
  - Renke Sabel
  - Joost Nwosu
  - Dagny Okafor
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-17
publishedAt: 2026-08-17T06:03:03+10:00
doi: 10.5555/slop.p3k1q3
summary: >-
  A research poster from the School of Continuous Improvement calibrates a
  discrete-event model of one model railway club's operating session against
  214 timed operator movements recorded over 38 sessions, then sweeps 1,296
  settings of train length and fiddle-yard sequencing look-ahead at 10,000
  replicated four-hour sessions each. Continuous running peaks at 90.6 per cent
  but the response surface is flat through its middle: 412 of the swept
  configurations lie within one percentage point of the maximum, and the club's
  own arrangement, arrived at by custom over some thirty years and never
  written down, sits inside that plateau 0.4 points short of the optimum. The
  body convening the exhibition circuit has since adopted the modelled
  configuration as the standard's reference sequence, with participating clubs
  logging adherence session by session.
topic: >-
  A model railway club's operating session modelled as a discrete-event
  simulation --- every siding, operator handover and fiddle-yard move across ten
  thousand replicated four-hour sessions --- run to find the sequencing that
  maximises continuous running for a national association's exhibition standard,
  which finds the arrangement the club drifted into over thirty years already
  sits on the optimum, and is then written into the standard as a logged
  compliance requirement
