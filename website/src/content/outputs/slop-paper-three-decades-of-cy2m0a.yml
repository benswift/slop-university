title: Thirty-One Years on the Cut Line
subtitle: Shrub Regrowth across an Abandoned Seismic Survey Grid in a Semi-Arid Shrubland
authors:
  - Ylva Ogunbanjo
  - Brynjar Obiora
preset: paper
school: School of Emergent Priorities
date: 2026-10-13
publishedAt: "2026-10-13T01:00:56+11:00"
doi: 10.5555/slop.cy2m0a
summary: >-
  A paper from the School of Emergent Priorities resurveys 42 lines of a seismic
  grid cut through a semi-arid shrubland and abandoned without a well, pairing
  126 on-line stations with undisturbed controls and tracing each line through
  five epochs of aerial photography. Lines cut with the dozer blade raised have
  recovered to a median 0.84 of control shrub cover after thirty-one years and
  lines cut with the blade down to 0.37, while line width explains almost
  nothing and the spoil windrows beside bladed lines carry more shrub than the
  shrubland around them.
topic: >-
  Three decades of regrowth on the cut lines of an abandoned seismic survey grid
  in a semi-arid shrubland: which lines closed over, which stayed open, and what
  width, orientation and vehicle reuse had to do with it
