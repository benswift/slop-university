summary: >-
  A civic brochure led from the School of Underlying Conditions takes the
  neutrophil, the cell that reaches an injury first and spends itself there,
  as its picture of the University as a neighbour. Its three features follow
  researchers to coastal bores ahead of a cyclone's rain, to the deli counters
  and giveaway noticeboards where a town sorts out who goes next, and to the
  clearing-up after a response, and it rests its invitation on six published
  outputs cited by title and DOI.
topic: >-
  First to Arrive: a civic brochure borrowing the neutrophil's oxidative burst
  --- fast, local, spent on arrival --- as the image of how Slop University
  answers its neighbours, selling its schools as the cells that get there first
