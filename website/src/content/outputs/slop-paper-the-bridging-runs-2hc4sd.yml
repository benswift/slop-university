title: Bridging Runs
subtitle: A Reference Catalyst, Its Ration and Its Successor in One Industrial Reforming Laboratory, 1971–2004
authors:
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-10-29
publishedAt: "2026-10-29T01:01:15+11:00"
doi: 10.5555/slop.2hc4sd
summary: >-
  A paper from the School of Underlying Conditions follows one industrial
  laboratory's reference nickel steam-reforming catalyst through 61 bench
  notebooks and the 1,236 withdrawals of its stock register, from its setting
  aside in 1971 to its last charge in 2004. It finds that the reference's
  authority rested on four phases of rationing kept as obligations, and that
  fourteen bridging runs, filed as a calibration, conferred its standing on a
  remade successor that ran at 0.87 of its activity.
topic: >-
  the bridging runs, a history-and-philosophy-of-science study of one
  industrial laboratory's reference nickel steam-reforming catalyst, rationed
  across four decades of formulation trials and finally remade, in which the
  new batch was accepted as the same reference only by being run alongside the
  last grams of the old
