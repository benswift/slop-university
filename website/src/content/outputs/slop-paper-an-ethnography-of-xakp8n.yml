summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities reports sixteen months of participant observation in one synthesis
  group working on indole derivatives, following the 612 vials handed over at
  four doctoral departures. Six months on, 86 had been used by the successor,
  212 kept unopened and 314 thrown away, and a vial's fate turned less on how
  much it held than on whether it came with a notebook page the successor could
  follow.
topic: >-
  an ethnography of the handover of indole intermediates when a doctoral
  student leaves a synthesis group: how a rack of vials becomes something the
  next student can use, keep or throw away
