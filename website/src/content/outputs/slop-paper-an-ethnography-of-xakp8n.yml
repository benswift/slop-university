title: Fine When I Made It
subtitle: The Handover Rack and the Afterlife of Indole Intermediates in a Synthetic Chemistry Group
authors:
  - Ragnhild Uzoma
  - Sunniva Balogun
preset: paper
school: School of Underlying Conditions
