title: Shelved by Class, Learned by Contrast
subtitle: >-
  Interleaved and Blocked Practice in Trainee Surveyors' Hand Estimates of Clay
  Content
authors:
  - Brynjar Obiora
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-21
publishedAt: "2026-10-21T18:01:59+11:00"
doi: 10.5555/slop.4fzhsj
summary: >-
  A paper from the School of Underlying Conditions randomises 48 trainees in an
  introductory field course to practise hand-texturing the same reference soils
  either one texture class at a time, in the order the reference collection is
  shelved, or with the classes mixed. Mixed practice looked worse during
  training and held up better nine days later, chiefly between neighbouring
  mid-range classes, but neither schedule prepared trainees for six subplastic
  clays the collection does not hold.
topic: >-
  interleaved versus blocked practice in learning to texture soils by hand: a
  field-course experiment on whether trainee surveyors' feel for clay content
  transfers to soils they have not handled
