summary: >-
  A paper from the School of Emergent Priorities asks what second-year
  immunology students take the arrows to mean when they redraw an inflammatory
  signalling cascade from memory. Most arrows were glossed as bare sequence
  rather than in the sense intended, and the paper argues that the redrawing
  task, as usually marked, measures only the order of telling.
