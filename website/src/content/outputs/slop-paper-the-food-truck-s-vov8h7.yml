title: Notes on the Last Order
subtitle: A Regression-Discontinuity Study of Portion Size and Counter Chat
  Either Side of a Campus Lunch Van's Happy-Hour Deadline
authors:
  - Sunniva Balogun
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-09-24
publishedAt: "2026-09-24T17:01:05+10:00"
doi: 10.5555/slop.vov8h7
summary: >-
  A paper from the School of Emergent Priorities pairs 6,842 EFTPOS-timestamped
  transactions across 94 trading days with a tray-mounted scale and a
  counter-facing audio classifier, finding a sharp regression discontinuity in
  portion mass and counter-chat duration at a campus lunch van's posted
  happy-hour deadline, while payment-processing time shows no comparable
  movement. The University's midday concession agreement with the van has been
  amended to move the deadline five minutes later.
topic: >-
  The food truck's happy-hour deadline quietly re-sizes the last order: a
  regression-discontinuity study of portion size and counter chat in the
  minutes either side of a lunch van's fixed discount cutoff, whose finding
  persuades the campus catering contract to move the deadline five minutes
  later
