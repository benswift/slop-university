title: Still Under Review
subtitle: >-
  A Field Study of Portal Status Displays and Applicant Persistence After an
  Internal-Transfer Process Goes Quiet
authors:
  - Lindiwe Achterberg
  - Fenna Okoro
preset: paper
school: School of Emergent Priorities
date: 2026-07-27
doi: 10.5555/slop.kbdcdq
summary: >-
  A paper from the School of Emergent Priorities cross-references an
  internal-transfer portal's status field against the case-management
  system's own reviewer log across fourteen business units, finding the
  field freezes at "Under review" well after review activity continues
  behind it. Applicants shown the frozen field check back for a median of
  forty-six days longer than applicants shown no status at all, and go on
  to reapply to a later posting at a lower rate; an ablation adding a
  "last updated" timestamp beside the frozen field changes neither
  behaviour.
topic: >-
  auditing whether an internal-transfer portal's applicant status bar
  changes how long staff keep checking back on a promotion application
  that's already gone quiet, compared to a portal that shows no status
  indicator at all
