title: Calibrating the Knob of Butter
subtitle: >-
  A Multi-Kitchen Elicitation Study of the Quantitative Content of Domestic
  Recipe Language
authors:
  - Torun Ezeigwe
  - Casimir Beng
  - Mirela Hanke
preset: paper
school: School of Continuous Improvement
date: 2026-08-19
publishedAt: 2026-08-19T12:01:35+10:00
doi: 10.5555/slop.xobnx7
summary: >-
  A paper from the School of Continuous Improvement elicits the quantitative
  content of twelve domestic quantity terms and two doneness phrases from 247
  home cooks across 61 kitchens and 24 family lines, recording 8,892
  concealed-scale dispensing events and finding a vocabulary of local
  standards: agreement among cooks of the same kitchen is high (ICC = 0.84),
  along a family line moderate (0.37), and between unrelated kitchens
  negligible (0.06), while cooks dispense far more consistently (r = 0.91)
  than they can verbally state (r = 0.44). The paper derives a Domestic
  Reference Units table and advises that its validity ends at the kitchen door
  it was calibrated in.
topic: >-
  how much is a splash? the undefined units of the home recipe --- the knob of
  butter, the pinch, the glug, 'until golden' --- elicited as grams,
  millilitres, and minutes from hundreds of cooks, with the variance
  decomposed by kitchen and family line, and a conversion standard proposed in
  full earnest whose validity ends at the kitchen door it was calibrated in
