title: Seed at the Top
subtitle: Placement of Aged Media and the Ripening of a Fresh Sand Bed for the Heterogeneous Oxidation of Ferrous Iron
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
