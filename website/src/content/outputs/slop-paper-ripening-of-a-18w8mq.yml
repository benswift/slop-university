doi: 10.5555/slop.18w8mq
summary: >-
  A paper from the School of Underlying Conditions runs six sand columns for
  70 days on aerated, iron-bearing water from one monitoring bore and follows
  the rate constant at which each bed oxidises ferrous iron. Fresh sand took
  about a month to become catalytic; a tenth of the bed volume in aged, coated
  media brought the half-ripening time to 12.9 days when laid on top and 18.4
  days when mixed through, and made no measurable difference when laid at the
  bottom, with activity entering every bed from its upstream end.
topic: >-
  ripening of a fresh sand bed: a packed-column study of how filter sand
  becomes catalytic for the oxidation of dissolved iron in bore water, and
  whether seeding it with aged media shortens the wait
