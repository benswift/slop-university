summary: >-
  A case-for-support brochure that presents the University's work on speech
  and sound as a single listening agenda across its three schools: the words
  people reach for when they describe a noise, what a sensor registers when it
  registers one, and what a bore returns of the ground it was drilled through.
  It invites partners to open their call logs, complaint registers and core
  sheds to the University's researchers, and rests the invitation on eight
  published studies cited by title and DOI.
