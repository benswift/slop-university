summary: >-
  A paper from the School of Settled Matters and the School of Underlying
  Conditions assays leaf extracts from 64 herbarium vouchers collected from one
  shrub stand between 1983 and 2024 for α-glucosidase inhibition, against
  freshly pressed leaves from the same stand. Retention falls with a labile
  half-life of 3.2 years to a stable 0.389 of fresh activity that holds to the
  oldest sheet at 42 years; eighteen sheets measured in 2009 and again in 2025
  confirm the plateau, and total phenolic content keeps falling without
  tracking it.
topic: >-
  How long a pressed leaf keeps its activity: estimating the decay of in-vitro
  alpha-glucosidase inhibition across four decades of herbarium vouchers
  collected from one coded shrub population, and whether the loss levels off
