title: Ten Years to the Floor
subtitle: A Stable Fraction of α-Glucosidase Inhibition in Four Decades of Herbarium Vouchers from One Shrub Population
authors:
  - Odalys Penhallow
  - Brynjar Obiora
preset: paper
school: School of Settled Matters
