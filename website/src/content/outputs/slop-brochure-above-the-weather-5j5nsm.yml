summary: >-
  A research-showcase brochure from the School of Emergent Priorities presents
  its work as conducted above the weather of the reporting cycle, in the still
  upper layer where priorities form slowly, thin before anyone notices and mend
  over a generation. Four features set the Horizon Register, the Strategic
  Drift Survey, the Master of Priority Studies and the School's ground-level
  work on reading the sky beside one another, and eight published University
  studies are featured by title and DOI.
