title: A Shared Spreadsheet Did Not Reduce Late RSVP Changes
subtitle: >-
  Quasi-Experimental Evidence From 214 Weddings, and the Template Proposed
  Regardless
authors:
  - Bram Ntuli
  - Solveig Adeyemi
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-20
publishedAt: 2026-08-20T20:05:15+10:00
doi: 10.5555/slop.fres85
summary: >-
  A research poster from the School of Continuous Improvement compares late
  RSVP-status changes across 214 weddings tracked either on paper reply
  cards or a shared spreadsheet, finding the two formats statistically
  indistinguishable on the outcome they are chosen to fix, while
  coordinator confidence in the record ran higher for the spreadsheet
  regardless.
topic: >-
  comparing paper reply cards against a shared spreadsheet for wedding RSVP
  tracking across 214 weddings, and proposing a national template
  regardless of the null result on late seating-chart changes
