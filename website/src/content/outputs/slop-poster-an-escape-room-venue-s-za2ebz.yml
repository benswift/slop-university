title: The Button Remembers the Roster
subtitle: Validating a Hint-Press Difficulty Rating Against Independent Player Surveys
authors:
  - Runa Adegoke
  - Marek Solheim
  - Fenna Okoro
preset: research-poster
school: School of Emergent Priorities
