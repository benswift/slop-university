doi: 10.5555/slop.za2ebz
summary: >-
  A research poster from the School of Emergent Priorities cross-references
  an escape-room chain's hint-press difficulty rating against independent
  post-session player surveys across 286 sessions, four rooms, and eleven
  rostered staff. The posted rating tracks which staff member issued a
  session's hints more closely than it tracks the room, with only a weak
  association (r = -0.20) to independently reported challenge.
topic: >-
  An escape-room venue's in-room hint-request button feeds a per-session
  press count that the venue republishes online as each room's official
  difficulty rating; a study tests whether that rating actually helps
  prospective bookers anticipate how hard a room will feel, cross-referencing
  the posted rating against independent post-session difficulty and
  enjoyment surveys and the rostered staff member's own hint-giving habits.
