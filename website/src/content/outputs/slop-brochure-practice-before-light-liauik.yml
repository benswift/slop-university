summary: >-
  A prospectus from the School of Continuous Improvement presents the Master of
  Applied Measurement and the Capability Sprints through the developing retina,
  which rehearses its connections in waves of spontaneous activity before the
  eye first opens, and builds its case on rehearsal, sequence and the pruning of
  what goes unused. Five published University studies are featured by title and
  DOI, with pull-quotes from three of the School's academic staff.
