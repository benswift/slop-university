title: The Ground After Dark
subtitle: Solar background and sub-canopy ground detection in single-photon UAV lidar
authors:
  - Odalys Penhallow
  - Casimir Beng
  - Ragnhild Uzoma
preset: research-poster
school: School of Settled Matters
