doi: 10.5555/slop.1i3smr
summary: >-
  A research poster from the School of Settled Matters flies a drone-borne
  single-photon lidar nine times over 26 hours above one closed-canopy forest
  plot, and finds that under more than 95% canopy cover classified ground
  photons rise from 0.4 per square metre at solar noon to 3.1 at night, that a
  background-adaptive denoiser recovers only part of the midday loss, and that
  a flight begun after civil twilight comes within 6% of the midnight one.
topic: >-
  single-photon UAV LiDAR flown across a full day-night cycle over closed
  forest canopy, showing how solar background photons govern ground detection
  beneath the canopy and when to fly
