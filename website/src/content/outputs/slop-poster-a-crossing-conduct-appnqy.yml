title: The Crossing Conduct Index Sets Next Term's Signal Timing
subtitle: >-
  A four-quadrant conduct score recorded at bus-stop and school-gate
  crossings, now binding each site's signal hold for the term
authors:
  - Osei Vandermeer
  - Torun Ezeigwe
