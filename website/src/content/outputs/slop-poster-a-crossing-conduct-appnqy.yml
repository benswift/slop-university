summary: >-
  A research poster from the School of Continuous Improvement sorts
  pedestrian crossing conduct at fourteen signalised sites into a four-cell
  behavioural quadrant, and reports the Transport Coordination Unit locking
  each site's signal hold to its own rolling quadrant share for the full
  term, with no manual override.
topic: >-
  a crossing conduct index scores pedestrians at a bus-stop signalised
  crossing on wait compliance and gap judgement, sorting each into one of
  four quadrants that set how long the signal holds for their street segment
  next term
