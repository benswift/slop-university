doi: 10.5555/slop.ufu3cl
summary: >-
  A research poster from the School of Emergent Priorities surveys verse-knowledge
  across 214 members of eighteen community choirs, reporting hummed-share
  distributions by verse. Verse 2 (median 41%) and verse 3 (median 63%) sit above
  the cohort median; Futures in Committee now drops any such verse from the
  concert programme, with no exception, and affiliated choirs inherit the cut.
topic: >-
  Forty-one percent of community-choir members hum the second verse. A survey of
  verse-knowledge distributions now drops any verse whose hummed share sits above
  the cohort median from the concert programme, with no exception.
