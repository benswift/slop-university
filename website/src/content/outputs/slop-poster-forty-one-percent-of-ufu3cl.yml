title: Hummed, Not Sung
subtitle: Verse-knowledge distributions, and the programme they now govern
authors:
  - Anneke Tolan
  - Ronja Oyelaran
  - Tove Ilesanmi
preset: research-poster
school: School of Emergent Priorities
