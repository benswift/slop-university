summary: >-
  A marketing poster presents the University's intellectual capital through a
  single drill-core tray left under a lamp at the end of the day, its pencil
  and hand lens still in place and its stool pushed back. The campaign hooks on
  the School of Underlying Conditions' paper on human-to-structural capital
  conversion in a drill-core repository, and is prepared for the portrait
  signage panels in matched light and dark renderings with a short reading list
  from the University's published record.
