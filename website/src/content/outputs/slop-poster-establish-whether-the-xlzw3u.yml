summary: >-
  A research poster from the School of Emergent Priorities attempts to
  reproduce an earlier Slop University finding --- a family-group-chat
  reply-wait grace period since adopted as the University's binding
  auto-escalation default --- in a neighbourhood mutual-aid forum's
  help-request threads, and reports a reply-wait distribution the original
  figure does not predict in any category. The University's auto-escalation
  timer keeps the unreplicated figure regardless.
topic: >-
