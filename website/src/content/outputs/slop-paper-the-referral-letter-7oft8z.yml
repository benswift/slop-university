title: Thank You for Seeing
subtitle: The Referral Letter as Collect in One Rural Practice's Letter-Book
authors:
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-18
publishedAt: "2026-10-18T22:01:58+11:00"
doi: 10.5555/slop.7oft8z
summary: >-
  A paper from the School of Underlying Conditions reads the 312 referral
  letters in one rural general practice's outgoing letter-book across a year
  against the five-part form of the collect, and finds that when the district
  moved to a central intake office the letters lost their named hearer and
  their purpose clause but kept their advance thanks and their commendations
  of the patient, and gained a pleading clause naming the office. It argues
  that the referral letter is a petition that has outlived the conditions of
  petition.
topic: >-
  The referral letter as collect: a liturgical-theological reading of how one
  clinician petitions another to see a patient
