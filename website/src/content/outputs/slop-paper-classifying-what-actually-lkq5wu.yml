title: The Scanner Read the Stairs as a Drop
subtitle: >-
  A Taxonomy of a Courier Handheld Scanner's Fall-Detection Alerts, Tested
  Against Which Alarm Categories a Damaged-Parcel Claim Later Confirms
authors:
  - Torun Ezeigwe
  - Solveig Adeyemi
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-08-08
publishedAt: "2026-08-08T11:04:04+10:00"
doi: 10.5555/slop.lkq5wu
summary: >-
  A paper from the School of Continuous Improvement hand-codes 4,180
  fall-detection alerts logged by a parcel courier's handheld scanner across
  nine depots into a five-category taxonomy, cross-referenced against the
  network's damaged-parcel claims register. Genuine-drop alerts are matched
  to a confirmed claim at 44.6%, an order of magnitude above every other
  category, while the network's own gentle-handling score treats all five
  categories identically; a firmware recalibration aimed at the two largest
  false-positive categories leaves the score's spread across drivers
  statistically unchanged.
topic: >-
  classifying what actually trips a parcel courier's handheld scanner
  drop-detection alarm, and whether the alarm categories that fire most
  often are the ones a damaged-parcel claim later confirms
