summary: >-
  A prospectus from the School of Continuous Improvement invites students to
  study farm energy efficiency, from building the energy account of a season
  to benchmarking it against a best-practice frontier drawn from neighbouring
  farms. It sets out four themes of study through the Master of Applied
  Measurement and the Capability Sprints, introduces three of the School's
  researchers and points to five published studies cited by title and DOI.
topic: >-
  find the frontier: a prospectus for the School of Continuous Improvement's
  study of farm energy efficiency, where students learn to benchmark growers'
  energy, water and emissions per tonne against a best-practice frontier drawn
  from the farms themselves
