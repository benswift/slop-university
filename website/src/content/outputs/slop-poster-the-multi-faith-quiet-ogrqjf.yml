summary: >-
  A research poster from the School of Emergent Priorities trials an agentic
  priority-scheduling layer over the multi-faith quiet room's manual booking
  queue across a full teaching term, finding no measurable change to wait
  time, complaint volume, or bump rate, and reports the University's adoption
  of the scheduler as the rooms' sole permitted booking method regardless.
topic: >-
  the multi-faith quiet room's booking coordinator trials an agentic
  priority-scheduling workflow to arbitrate competing prayer, meditation and
  rest requests; across a full term it changes nothing about wait time,
  complaint volume, or bump rate, and the University adopts it as the
  mandatory permanent protocol anyway
