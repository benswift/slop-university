title: RELAY
subtitle: >-
  The Rostered Escort and Lift Assurance Yardstick: A Five-Level Maturity Model for School-Run Carpool Groups, and the Car-Share Bays Allocated by Level
authors:
  - Joost Nwosu
  - Solveig Adeyemi
  - Bram Ntuli
preset: paper
school: School of Continuous Improvement
date: 2026-10-05
publishedAt: "2026-10-05T19:00:55+11:00"
doi: 10.5555/slop.16l2hi
summary: >-
  A paper from the School of Continuous Improvement scores 57 school-run carpool groups across eleven primary-school catchments on a five-level maturity model, from Group Chat to Self-Sustaining, over four school terms. Assigned level is scored reliably from paperwork on file and rises across the year, while mean children per car at the gate falls from 3.4 at Level 1 to 2.2 at Level 5; the University now assigns the eleven reserved car-share bays in its north staff car park by level alone, with no allowance for occupancy and no appeal inside the year.
topic: >-
  The Review Cadence Observatory scored school-run carpool groups against a five-level maturity model from Group Chat to Self-Sustaining, and the University allocated its reserved staff car-share bays strictly by the level a carpool's paperwork reached
