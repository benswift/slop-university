title: Punctual by Timetable, Slower on the Ramp
subtitle: >-
  Observed Waiting Time at Six Cable-Ferry Crossings, Three of Which Publish a
  Timetable So That Punctuality Can Be Reported
authors:
  - Anneke Tolan
  - Kwame Lindqvist
  - Petra Umbile
preset: paper
school: School of Emergent Priorities
date: 2026-08-04
publishedAt: 2026-08-04T23:01:33+10:00
doi: 10.5555/slop.lv6uqp
summary: >-
  A paper from the School of Emergent Priorities observes six free vehicular
  cable-ferry crossings on one inland river system over 72 crossing-days,
  recording 9,431 vehicle movements from the queue to the far ramp. All six are
  assessed under a road authority's service standard whose punctuality
  indicator scores departures against a published timetable, so the three
  crossings that run continuously on demand are returned as not assessed in
  every quarter while the three that have adopted a notional timetable report
  96.7 per cent. Observed median waiting time at the timetabled crossings is
  6.7 minutes against 2.1 minutes at the on-demand ones, a difference of 3.8
  minutes (95 per cent CI 2.4 to 5.2) once arrival rate, crossing length and
  time of day are accounted for. At 34.2 per cent of timetabled departures the
  deck was loaded and the far ramp clear for at least 60 seconds before the
  notional departure time, with 61 per cent of held minutes falling between
  10:00 and 14:00; five recomputations of the published figure move it by no
  more than 0.6 points.
topic: >-
  the little cable ferry that pulls itself across a country river whenever cars
  turn up, and the departure-punctuality standard written for timetabled buses
  that now applies to it --- observed across six crossings, three of which
  publish a notional timetable so the indicator can be computed, where the
  timetabled crossings score better on punctuality and hold waiting cars on the
  ramp for longer
