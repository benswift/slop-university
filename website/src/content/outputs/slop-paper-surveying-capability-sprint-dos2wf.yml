summary: >-
  A paper from the School of Continuous Improvement surveys 400 Capability
  Sprint graduates eighteen months after course completion on how often they
  now make their bed, finding self-reported weekly frequency splits into two
  clusters -- fifty-seven per cent report six or seven mornings, thirty-four
  per cent report none -- with almost nobody in between, and reports the
  program's shift from a mean-based retention figure to a binary standard.
topic: >-
