title: Must the trolleys reach Level 4 before Saturday opens?
subtitle: >-
  A five-level maturity model of the supermarket trolley-coin return, adopted as
  the Saturday trading threshold
authors:
  - Solveig Adeyemi
  - Torun Ezeigwe
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-29
publishedAt: "2026-09-29T23:01:05+10:00"
doi: 10.5555/slop.0e25kl
summary: >-
  A research poster from the School of Continuous Improvement scores 54
  supermarket car parks against a five-level Trolley Return Maturity Model
  (Honour, Coin-lock, Desk-token, App-unlock, Fleet-twin) and finds Saturday
  wander 2.1 times higher at App-unlock than at Coin-lock or Desk-token. The
  University now withholds the Saturday trading window from any store below
  Level 4, with no store-level override.
topic: >-
  Five named levels score the supermarket trolley-coin return, and a store
  sitting below Level 4 is barred from the Saturday trading window.
