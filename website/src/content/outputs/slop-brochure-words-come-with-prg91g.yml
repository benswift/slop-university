summary: >-
  A prospectus brochure led from the School of Settled Matters invites
  prospective students to study language, metaphor and the mind across the
  University, presenting the inherited figures of ordinary speech as a common
  object of inquiry for the School of Settled Matters, the School of Emergent
  Priorities and the School of Underlying Conditions, and showcasing five of
  the University's published outputs on reading, wording and reception.
