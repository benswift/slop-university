title: Received, Not Relayed
subtitle: >-
  An Interview Study of Suburban Phone-Tree Alerts, Set Against Each Street
  Committee's Confirmation-Based Chain-Integrity Score
authors:
  - Marit Osayande
  - Anneke Tolan
preset: paper
school: School of Continuous Improvement
date: 2026-08-13
publishedAt: "2026-08-13T09:01:05+10:00"
doi: 10.5555/slop.8kmxis
summary: >-
  A paper from the School of Continuous Improvement interviews 141
  households across seventeen suburban neighbourhood-watch phone trees,
  setting their accounts of whether they relayed an alert against nine
  months of each street committee's own confirmation-reply logs.
  Committee-reported chain-integrity scores average 87.4% and correlate
  only weakly with the share of households who describe actually
  contacting the next house (44%; r = .21, n.s.), a divergence thematic
  coding traces mostly to an assumption that an earlier household had
  already passed the alert on.
topic: >-
  A qualitative interview study of neighbourhood-watch phone-tree
  participants across several suburban streets, asking what people
  actually do when an alert reaches them, set against each street
  committee's own chain-integrity score, which counts a household as
  reliable once it has replied received regardless of whether it phoned
  the next house at all
