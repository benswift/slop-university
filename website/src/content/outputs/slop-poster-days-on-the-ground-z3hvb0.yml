doi: 10.5555/slop.z3hvb0
summary: >-
  A research poster from the School of Settled Matters stakes 84 windfall
  quinces on one orchard floor on the day each fell, collects twelve at each of
  seven intervals up to nine days, and extracts pectin separately from each
  fruit's upper face and the face resting on the soil. Upper-face pectin stays
  high-methoxyl throughout, while soil-contact pectin crosses into the
  low-methoxyl range between days three and five and, by day seven, sets only
  with calcium.
topic: >-
  Days on the ground: how windfall quince pectin's degree of esterification,
  and so its gelling route, shifts across a week on one orchard's floor
