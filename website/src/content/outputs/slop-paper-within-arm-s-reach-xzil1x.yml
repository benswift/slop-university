title: Within Arm's Reach
subtitle: >-
  Clean-Spoon Supply and Utensil Re-entry During In-Process Tasting in Eighteen
  Restaurant Kitchens
authors:
  - Signy Okpara
  - Edda Nwafor
  - Thandiwe Solberg
preset: paper
school: School of Continuous Improvement
date: 2026-11-02
publishedAt: "2026-11-02T06:32:16+11:00"
doi: 10.5555/slop.xzil1x
summary: >-
  A paper from the School of Continuous Improvement observes 54 dinner services
  in 18 restaurant kitchens and codes 4,212 tastes taken by cooks during
  preparation, finding that the tasting utensil re-entered the food in 6.2
  percent of tastes while the station's tray of clean spoons was stocked and
  32.4 percent once it had run empty, which it did in 39 of the 54 services.
  Once the empty tray is accounted for, most of the apparent effect of the
  busiest part of service on re-entry disappears.
topic: >-
  within arm's reach: clean-spoon proximity and utensil re-entry during cooks'
