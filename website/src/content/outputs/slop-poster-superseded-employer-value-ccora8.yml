doi: 10.5555/slop.ccora8
summary: >-
  A research poster from the School of Settled Matters follows 403 superseded
  value-proposition clauses through one employer's 186 job-advert templates for
  30 months after its employer brand was relaunched. Withdrawn clauses survived
  a median of 4 months in recruitment-maintained templates and 17 months in
  manager-cloned ones, and new hires recruited through an advert still carrying
  one reported more early psychological contract breach.
topic: >-
  Superseded employer value propositions that survive in e-recruitment
  job-advert templates after a rebrand, and the applicants who join on them
