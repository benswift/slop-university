summary: >-
  A paper from the School of Settled Matters and the School of Continuous
  Improvement models a 48 GWh island grid moving from diesel to a 90% wind,
  solar and storage share by a statutory target year, charging each cohort's
  embodied energy to the island when it is built. A 2030 target yields the
  largest surplus to 2075 but drops the island's net energy in its first build
  year to a third of the all-diesel baseline, a floor at three-quarters of that
  baseline first admits 2037, and a fleet built in four years returns two-thirds
  of its first trough when it falls due for replacement together.
topic: >-
  the energy cost of a deadline: a dynamic net-energy model of an island grid
  replacing diesel with wind, solar and storage, asking what bringing its
  legislated renewables target forward spends of the surplus energy the
  transition was meant to protect
