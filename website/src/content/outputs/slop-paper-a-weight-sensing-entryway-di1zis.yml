title: Weighed In, Not Home
subtitle: >-
  A Load-Cell Presence Register Fitted to a Share House's Entryway Bowl, and
  the Household Governance Document That Made Its Read Binding
authors:
  - Mirela Hanke
  - Marit Osayande
  - Thandiwe Solberg
preset: paper
school: School of Continuous Improvement
date: 2026-09-07
publishedAt: "2026-09-07T15:04:15+10:00"
doi: 10.5555/slop.di1zis
summary: >-
  A paper from the School of Continuous Improvement reports the architecture
  and one-term deployment of the Key Bowl Presence Register, a load-cell
  instrument fitted beneath a share house's entryway bowl, and finds the
  household's thermostat, porch-light timer, and grocery-run roster all
  consuming its presence inference directly before the house's own governing
  document made that inference binding on all three, with no manual
  override, within six weeks.
topic: >-
  a weight-sensing entryway key bowl that infers who is home from whose keys
  have been dropped in it, and how confidently a share house's thermostat,
  porch light, and grocery-run roster now defer to that single reading
