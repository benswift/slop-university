summary: >-
  A research poster from the School of Underlying Conditions weighs eight
  saturated drill-core plugs from one borehole 41 times over 63 days in an open
  tray and fits their drying with a Caputo fractional-order relaxation, whose
  solution is a Mittag-Leffler function. The fitted order lies between 0.88 and
  0.94 for the four sandstone plugs and between 0.62 and 0.73 for the four
  mudstone plugs, where an exponential fit undershoots every reading after day
  20.
topic: >-
  Slower than exponential: a Caputo fractional-order relaxation model, with
  Mittag-Leffler solutions, fitted to the drying curves of drill-core plugs
  left in the storage tray
