doi: 10.5555/slop.f19kv5
summary: >-
  A research poster from the School of Settled Matters combs 612 children at
  the core gate of a bushland reserve across 38 class visits in one spring
  term, finding that socks carry 58% of the seed that passes the boot-brush
  station, which removes most sole-borne seed and almost none above the welt,
  and that a four-minute pre-gate sock-check game played in pairs lowers the
  gate count from 11.8 to 4.2 seeds a child.
topic: >-
  Seeds that ride above the brush line: weed seed carried on school-group socks
  and laces past a nature reserve's boot-brush station, and whether a pre-walk
  sock-check game removes more than the brush does
