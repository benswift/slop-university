title: Above the Brush Line
subtitle: Weed Seed on School-Group Socks and Laces at a Reserve's Boot-Brush Station
authors:
  - Anselm Threlkeld
  - Vigdis Emenike
preset: research-poster
school: School of Settled Matters
date: 2026-11-22
