summary: >-
  A marketing poster for the School of Underlying Conditions sets a surveyor
  checking a clipboard against a banded pit face, beside a row of identical
  pits running to the horizon, and celebrates the soil survey's sustained first
  place on the University's internal field-procedure conformance audit, with a
  described profile on file for every hole opened. Prepared for the landscape
  signage panels in matched daylight and evening renderings, with a short
  reading list from the survey's published record.
