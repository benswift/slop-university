summary: >-
  A marketing poster for the School of Emergent Priorities sets the School's
  standing on the Horizon Register against a public telephone at the quiet end
  of a suburban shopping strip, where a universal-service obligation is
  discharged in phones retained and the demand for retaining one is read from
  what its coin box yields. The calls were made free, the yield has been nil on
  every collection round since, and the panel runs in matched light and dark
  cuts for the display rotation.
topic: >-
  the free-to-call payphone counts as unused --- a universal-service scheme
  still reads payphone demand off the coins collected, so every phone has
  returned zero since calls were made free and is scheduled for removal on it,
  staged as a ranking-brag ad for the School of Emergent Priorities
