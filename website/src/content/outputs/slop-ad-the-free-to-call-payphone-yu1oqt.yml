title: Free To Call. Counted As Unused.
subtitle: >-
  A ranking-brag marketing poster for the School of Emergent Priorities,
  carrying the School's standing on the Horizon Register onto the portrait
  signage panels, staged at a suburban phone box whose coin box has yielded
  nothing since the calls were made free
