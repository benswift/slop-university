title: The Buffer Outlives the Tank
subtitle: Residual Hazard at a Decommissioned Water-Works Chlorine Store and the Separation Line Still Burdening Its Neighbours
authors:
  - Clemency Tredinnick
  - Fenna Okoro
  - Vigdis Emenike
preset: paper
school: School of Settled Matters
date: 2026-11-15
