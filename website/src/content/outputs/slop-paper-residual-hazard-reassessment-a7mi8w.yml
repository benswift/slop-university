doi: 10.5555/slop.a7mi8w
summary: >-
  A paper from the Schools of Settled Matters, Emergent Priorities and
  Underlying Conditions re-derives the toxic-gas hazard footprint of a water
  treatment works whose chlorine drum store closed in 2009, against the 650 m
  separation line drawn around that store in 1983 and still carried by a
  planning overlay and a covenant on 41 neighbouring lots. The largest present
  scenario, at a hypochlorite fill point 560 m east of the old store, reaches
  195 m under stable night conditions: 38 of the burdened lots lie outside
  every present footprint, while four unburdened lots in a later eastern
  subdivision lie inside it.
topic: >-
  residual-hazard reassessment of a decommissioned water-works chlorine store
  against the separation buffer still burdening its neighbouring lots
