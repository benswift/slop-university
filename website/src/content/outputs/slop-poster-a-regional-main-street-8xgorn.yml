summary: >-
  A research poster from the School of Settled Matters tests a regional
  main-street renewal fund open only to towns of fewer than 5,000 residents,
  whose guidelines let each council nominate the localities that made up its
  town. Across 214 towns the nominated counts bunch just below the cap while
  counts on a fixed boundary do not, with 23 towns above 5,000 nominating
  themselves under it by leaving out a median of two outlying localities; the
  fund's estimated lift to main-street shopfront occupancy falls from 7.9
  percentage points on the nominated count to 2.3 points, indistinguishable
  from zero, on the fixed one.
topic: >-
  a regional main-street renewal fund open only to towns under 5,000
  residents: a regression-discontinuity and bunching study finding councils
  sorted just below the cap by choosing which localities counted as the town,
  and estimating the fund's effect on shopfront occupancy once the sorted towns
  are set aside
