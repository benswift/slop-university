summary: >-
  A research poster from the School of Emergent Priorities presents a
  single-site teaching case of a suburban six-bell tower after a
  striking-quality register, not the captain, began assigning the tenor
  rope. The register reassigns the tenor on seven of eleven subsequent
  practice nights; affiliated societies are asked to roster their heaviest
  rope from the live rank, with no captain override sustained beyond a
  single practice night.
topic: >-
