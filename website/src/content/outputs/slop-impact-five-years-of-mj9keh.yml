summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 looks back on
  five years of scheduling work: an examination timetable that became
  clash-free as its window lengthened from 14 to 23 days, a review calendar
  that now schedules its own review, and a roster fairness index that rose at
  six freight depots while the night shifts stayed largely where they were.
