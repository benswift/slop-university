summary: >-
  A research poster from the School of Emergent Priorities treats each budget
  cycle's indexation of a ledger amount as a random step of its log-mantissa
  around the unit circle, so that Benford's law is the walk's equilibrium, and
  predicts a slowest relaxation time of 5.1 cycles from the spread of the
  indexation factors. Across 312 cost centres in one anonymised ledger the first
  harmonic decays with a fitted time of 6.0 cycles, 86 of a standard first-digit
  screen's 103 flags fall on centres under four cycles old, and a null aged with
  each account flags five, all of them planted manipulations.
topic: >-
  Leading digits as a relaxation process: a multiplicatively indexed ledger
  approaches Benford's law like a random walk on the circle, so young cost
  centres fail first-digit fraud screens for being young
