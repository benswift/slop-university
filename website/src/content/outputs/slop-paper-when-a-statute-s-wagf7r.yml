doi: 10.5555/slop.wagf7r
summary: >-
  A decision-sciences paper from the School of Settled Matters and the School of
  Continuous Improvement models the date fixed by a statutory review clause as a
  value-of-information decision limited by the reviewed program's outcome lag,
  and codes 164 review clauses in one sub-national statute book. The 145
  calendar clauses are uncorrelated with lag, 28 fall due before any outcome is
  observable, and as drafted they capture 76% of the decision value available
  from their reviews; counting three years from the end of the lag captures 96%,
  while conditioning the date on accrued information adds at most 3%.
topic: >-
  When a statute's mandated review falls due: a value-of-information model of
  fixed-date versus trigger-based review clauses for evaluating legislated
  programs
