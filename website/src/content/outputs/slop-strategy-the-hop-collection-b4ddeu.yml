title: Lifted in Dormancy
subtitle: A strategic plan that moves the University's living hop collection to clean ground, read and settled plant by plant
authors:
  - Clemency Tredinnick
  - Hedvig Anyanwu
  - Sunniva Balogun
preset: strategy
school: School of Settled Matters
date: 2026-11-25
publishedAt: "2026-11-25T06:31:04+11:00"
doi: 10.5555/slop.b4ddeu
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the University to moving
  its living collection of some three hundred hop accessions from the ground
  it has long occupied to prepared ground on the campus's upper terrace, in
  three dormant-season tranches from screened propagation stock. No accession
  may be lifted until its bitter acids, prenylflavonoids and essential oils
  have been read against a comparison band published in advance and the
  terms of its deposit have been settled, and every plant is read again on
  the new ground.
topic: >-
  the hop collection moves: a strategic plan staking 2026-2031 on lifting the
  University's living collection of hop accessions onto clean ground,
  chemotyping every plant's bitter acids, prenylflavonoids and oils before it
  is moved, and settling the terms on which each was deposited
