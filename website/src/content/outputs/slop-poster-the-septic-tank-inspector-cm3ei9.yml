title: On a paddock lid after rain
subtitle: >-
  An interview study of the septic-tank inspector's vernacular for a tank that
  will do until the next round
authors:
  - Eskil Nwabueze
  - Joost Nwosu
  - Dagny Okafor
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-07
publishedAt: "2026-10-07T12:01:55+11:00"
doi: 10.5555/slop.cm3ei9
summary: >-
  A research poster from the School of Continuous Improvement interviews 41
  septic-tank inspectors across 14 shires at the lid, codes their first
  unprompted phrase for each of 112 deferrals, and finds six recurring phrases
  covering 83 of those deferrals. On the strength of that vernacular the School
  publishes the six phrases as the On-Site Will-Do Lexicon, and from the next
  review cycle no tank may be certified, deferred, or scheduled for pump-out
  unless the attending inspector's phrase is attested against the lexicon, with
  no exception sustained for more than a single review cycle.
topic: >-
  The septic-tank inspector describes, in their own words, a lid that will do
  until the next round
