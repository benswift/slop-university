title: Ours by Long Use
subtitle: Complaint Letters after a Biscuit Reformulation, Read as Claims of Prescriptive Right
authors:
  - Ronja Oyelaran
  - Marek Solheim
  - Anouk Mensah
preset: research-poster
school: School of Emergent Priorities
