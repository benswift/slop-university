summary: >-
  A research poster from the School of Emergent Priorities codes 1,140 letters
  and emails sent to a regional biscuit maker in the two years after it
  reformulated its plain sweet biscuit, and finds the correspondence moving
  from preference to title: claims that the old recipe tasted better fall from
  62% to 21% of letters, while claims that long use had made the biscuit
  partly the writers' own rise from 17% to 48%. Read in the vocabulary of
  political theory, the late letters are less consumer feedback than an
  objection to an alteration of the constitution made without a convention.
topic: >-
  who owns the original recipe: complaint letters to a regional biscuit maker
  after a reformulation, read as claims of prescriptive right rather than
  consumer preference
