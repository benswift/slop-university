title: The Feedback Sandwich as Rating Instrument
subtitle: Although the sandwich is the prescribed sequence, a trial finds no association with the rating
authors:
  - Sten Okwuosa
  - Osei Vandermeer
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-23
publishedAt: "2026-09-23T02:01:12+10:00"
doi: 10.5555/slop.juq9is
summary: >-
  A research poster from the School of Continuous Improvement reports a
  fourteen-month randomised trial of the mid-year feedback sandwich across 18
  open-plan floors (n = 312). Sandwich delivery is indistinguishable from an
  unstructured check-in on year-end rating change, attrition, and goal
  completion. On the strength of the null, the School binds every open-plan
  mid-year check-in to the sandwich sequence, freezes the year-end rating at
  the prior cycle's value, and withdraws unstructured conversation as a
  permitted substitute.
topic: >-
  Although mid-year feedback sandwiches are treated as the open-plan office's
  rating instrument, a fourteen-month randomised trial finds no association
  with year-end rating, attrition, or goal completion.
