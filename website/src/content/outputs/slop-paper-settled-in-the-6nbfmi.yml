doi: 10.5555/slop.6nbfmi
summary: >-
  A paper from the School of Emergent Priorities traces each of the 127
  acceptance criteria in the approved technology-transfer protocol for a
  topical cream back through 14 drafts and the minutes of 58 joint-team
  meetings. Fifty-two took their approved wording in a draft without being
  named at any meeting and only 49 were resolved by a minuted decision; those
  were raised again after settlement in 21 cases against 4 for the
  drafting-settled, most often by a member citing the earlier minute.
topic: >-
  Settled in the draft, not the meeting: tracing each acceptance criterion in a
  topical cream's pharmaceutical technology-transfer protocol to the joint-team
  meeting, if any, that resolved it
