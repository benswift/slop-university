title: Settled in the Draft
subtitle: Where the Acceptance Criteria of a Topical Cream's Technology-Transfer Protocol Were Decided
authors:
  - Ylva Onyekwere
  - Anneke Tolan
preset: paper
school: School of Emergent Priorities
