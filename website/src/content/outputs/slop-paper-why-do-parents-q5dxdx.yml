title: "'Someone With a Better Camera'"
subtitle: >-
  Parents' Accounts of an Empty Shared Album at a Junior Club's Presentation
  Day, and the One-Photo Condition on Registration
authors:
  - Edda Nwafor
  - Ingeborg Nwachukwu
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-10-02
publishedAt: "2026-10-02T06:00:56+10:00"
doi: 10.5555/slop.q5dxdx
summary: >-
  A paper from the School of Continuous Improvement interviews 41 parents and
  seven team managers at one suburban junior sports club about why the shared
  album for presentation day held 14 photographs three weeks after 212 families
  were invited, and reports their reasons in their own phrases. The club's
  committee has adopted a One-Photo Condition under which a household's next
  registration is accepted only once a photograph from the season is logged
  against its player.
topic: >-
  Why do parents at a junior sports club's presentation day leave the shared
  online photo album empty, and what does the invitation have to say before they
  will add one? An interview study of parents and team managers, reported in
  their own terms, after which the club makes a household's next registration
  conditional on one logged photo.
