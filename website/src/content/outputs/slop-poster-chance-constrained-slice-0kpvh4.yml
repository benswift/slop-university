summary: >-
  A research poster from the School of Underlying Conditions formulates a
  per-epoch chance-constrained reservation of radio capacity for
  measurement-while-drilling telemetry on a remote exploration camp's shared
  private 5G network. Over four held-out weeks and three rigs, the reservation
  cuts unrecorded log from 41.6 m under best effort to 3.2 m while reserving
  11% of capacity on average, most of it in the hours after each change of
  shift.
topic: >-
  Chance-constrained slice reservation on a drilling camp's private 5G network:
  minimising metres of unrecorded measurement-while-drilling log at shift change
