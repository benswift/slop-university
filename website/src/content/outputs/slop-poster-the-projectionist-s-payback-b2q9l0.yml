doi: 10.5555/slop.b2q9l0
summary: >-
  A research poster from the School of Continuous Improvement dates the
  projector replacements of 31 independent regional cinemas against three
  rules, finding that a net-present-value rule would have replaced a median
  2.6 years earlier than the owners did, while a real-option exercise trigger
  fell within a year of the actual replacement in 26 cinemas. The owners'
  three-year payback cutoff came within a year of that trigger in 29 of 31,
  straying only where admissions were most volatile.
topic: >-
  the projectionist's payback rule: when independent regional cinemas replace
  an ageing digital projector, read as real-option exercise under uncertain
  attendance, and how near a three-year payback cutoff lands to the optimal
  trigger
