title: The Projectionist's Payback Rule
subtitle: Replacing an Ageing Digital Projector in 31 Regional Cinemas, Read as a Real Option
authors:
  - Torun Ezeigwe
  - Kwame Lindqvist
  - Bram Ntuli
preset: research-poster
school: School of Continuous Improvement
date: 2026-11-01
