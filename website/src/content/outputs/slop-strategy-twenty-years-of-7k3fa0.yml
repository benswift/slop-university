summary: >-
  Slop University's Strategic Plan 2026-2031 stakes the University's next five
  years on a craniofacial growth record kept for one cohort from infancy into
  early adult life, and drafts its central commitments as undertakings, held by
  named offices and entered in a register, that bind the four strategic plans
  after it. Four priorities cover the record's continuity of measurement, the
  undertakings and the conditions of their discharge, the return of consent to
  each participant at adulthood, and the record's design for its later reader.
