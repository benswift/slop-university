title: Twenty Years of Growth, Undertaken Now
subtitle: A strategic plan that binds its four successors to a craniofacial growth record
authors:
  - Clemency Tredinnick
  - Iben Chikere
  - Marek Solheim
preset: strategy
school: School of Settled Matters
