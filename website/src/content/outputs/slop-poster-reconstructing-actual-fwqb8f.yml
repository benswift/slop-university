summary: >-
  A research poster from the School of Continuous Improvement reconstructs
  true per-service boarding counts from smartcard tap and turnstile logs
  across six stations, testing them against a transit agency's published
  crowding index. Reconstructed counts exceed the published figure at five of
  six stations, enough in one case to move a station across the
  service-frequency threshold.
topic: >-
  reconstructing actual train-platform boardings from smartcard tap
  timestamps to audit the crowding index that sets service frequency
