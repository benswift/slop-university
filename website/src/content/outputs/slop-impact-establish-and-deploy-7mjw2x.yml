doi: 10.5555/slop.7mjw2x
summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 traces the
  design and deployment of an autonomous rostering agent that assigns,
  reminds, and escalates household bin night duty across 68 share houses,
  university residences, family homes and community housing sites, and
  follows the School's decision to adopt the agent's weekly roster as each
  household's binding schedule of record, enforced through an escalation
  ladder and a published, unappealable annual ranking of site adherence.
topic: >-
  Establish and deploy an autonomous rostering agent that assigns, reminds,
  and escalates household bin night duty across a share house, then adopt
  its weekly roster as the binding schedule of record with no manual
  override.
