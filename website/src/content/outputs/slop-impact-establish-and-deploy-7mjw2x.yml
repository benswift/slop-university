title: Towards a Roster That Runs Itself
subtitle: Five Years Building, Deploying and Binding a Household to an Autonomous Bin Night Rostering Agent
authors:
  - Dagny Okafor
  - Mirela Hanke
  - Bram Ntuli
preset: impact-report
school: School of Continuous Improvement
date: 2026-08-31
