title: The Fete Pile
subtitle: Senior Secondary Students and a Training Set Inherited From Last Year's Class
authors:
  - Clemency Tredinnick
  - Sunniva Balogun
  - Mirela Hanke
preset: paper
school: School of Settled Matters
date: 2026-11-14
publishedAt: "2026-11-14T05:00:19+11:00"
doi: 10.5555/slop.s5omo1
summary: >-
  A paper from the School of Settled Matters follows 22 students in a Year
  11–12 machine-learning elective as they extend a lost-property image
  classifier built by the previous year's class, whose 2,316 inherited
  photographs include a fete class kept for a stall that is no longer run and
  whose rule nobody wrote down. Students changed 3.1 per cent of inherited
  labels against 21.4 per cent of their own until a provenance pass had them
  write each inherited class's rule from its examples; changes to inherited
  labels then rose to 18.7 per cent and the class dissolved the fete pile with
  a recorded reason.
topic: >-
  inherited training sets in a senior secondary machine-learning elective: what
  students do with labelling decisions made by last year's class, a classroom
  case study
