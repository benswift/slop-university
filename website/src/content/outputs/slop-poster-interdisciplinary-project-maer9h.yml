summary: >-
  A research poster from the School of Emergent Priorities reads the question
  registers of 46 interdisciplinary project teams as an optimal-stopping
  problem. Teams commit at a median of the third logged candidate, 24% of the
  eventual register and well short of the classical 1/e cutoff, and earlier
  with each added discipline; priced at the meeting hours each candidate
  consumed, 37 of the 46 stops fall within one candidate of the cost-adjusted
  optimum.
topic: >-
  interdisciplinary project teams commit to a shared research question after
  logging only a few candidates in their question register, read as an
  optimal-stopping problem: they stop well short of the secretary-rule
  threshold, and sooner the more disciplines they hold
