summary: >-
  A submission from the School of Settled Matters answers five of the six
  questions in the Department of Policy Settings' consultation on Guideline 4.3
  and outputs in dialogue form. Reading the statement of finding through the
  law of running accounts, it proposes a fourth option, a statement of account
  recorded only once the authors assent to the Office's settled wording, asks
  that a statement recording an open question be accepted as a finding, and
  asks that any statement settled from a position note say so.
topic: >-
  a law school's submission on the dialogue-form setting, reading the statement
  of finding through the law of running trade accounts: a finding should be
  settled like an account stated, agreed by authors and Office, and an
  unsettled question lodged as an open balance
