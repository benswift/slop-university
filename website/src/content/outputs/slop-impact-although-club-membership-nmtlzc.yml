summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 surveys five
  years of self-reported attendance and commitment across 214 sports clubs,
  choirs, sheds and allotment associations, and reports the gap between a
  growing membership roll and the room as a distribution rather than a
  single participation rate.
topic: >-
  although club membership rolls at suburban sports clubs, choirs, sheds and
  allotments kept climbing, a five-year survey of these clubs' own members
  found attendance and commitment distributed along a stubborn long tail of
  the signed-up-but-absent, and the School's improvement methodology went
  looking for the gap between the roll and the room
