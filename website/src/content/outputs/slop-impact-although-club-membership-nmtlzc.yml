title: Paid Up, Not Present
subtitle: A Five-Year Survey of Attendance and Commitment at 214 Sports Clubs,
  Choirs, Sheds and Allotment Associations
authors:
  - Ingeborg Nwachukwu
  - Mirela Hanke
