summary: >-
  A research poster from the School of Settled Matters reads the glossaries of
  twelve inherited groundwater, soil-water and land-surface codes as
  definitions sections and traces 1,487 defined terms through 38,906 use sites,
  finding that 8.3% of uses depart from the glossary, that 59% of those
  departures are unannounced, and that departure rises from a median 2.0% one
  call from the defining module to 13.8% at five or more. It proposes a
  contrary-intention annotation and a lint for undeclared departures, which
  maintainers of three codes used to sort 241 flagged departures into 188
  intended and 53 defects.
topic: >-
  defined-term drift in research software: a static analysis of whether
  quantities declared in a scientific code's glossary keep their defined
  meaning through the call graph, read with a parliamentary drafter's
  definitions section in hand
