doi: 10.5555/slop.640nkq
summary: >-
  A research poster from the School of Continuous Improvement sequences the 66
  printed slips pasted one over another in a regional export-licensing office's
  tariff book, 1977–1994, and finds the export-permit fee revised on erosion
  rather than on the calendar: the interval between revisions fell from eleven
  months to one while the real catch-up at each revision held steady. From
  mid-1991 the book records no revision at all, because the fee was stated in
  an indexation unit and converted at the counter each morning.
topic: >-
  Menu costs at the permit counter: how often a provincial export-licensing
  office revised its stamped fee tariff through Brazil's high-inflation decades
