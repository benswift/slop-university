title: One Row, Four Rates
subtitle: >-
  Aggregation-Rule Sensitivity in a Junior Sports Association's Volunteer
  Umpire Accreditation Record
authors:
  - Torun Ezeigwe
  - Marit Osayande
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-07-30
publishedAt: 2026-07-30T12:03:33+10:00
doi: 10.5555/slop.5b349c
summary: >-
  A paper from the School of Continuous Improvement recovers the attempt-level
  event log behind five seasons of a metropolitan junior sports association's
  volunteer umpire accreditation record (4,318 volunteer-seasons, 61 clubs,
  18,704 attempts) and re-scores it under four aggregation rules. The
  association's published rate of 98.6% keeps each volunteer's best attempt;
  the same records yield 39.6% under a first-attempt rule and 68.4% under a
  mean-of-attempts rule, and club rank order barely survives the change
  (Spearman rho = 0.31). The paper identifies no correct rate, tracing the rule
  in operation to a portal schema that holds one score per volunteer-season
  rather than to any documented decision.
topic: >-
  re-scoring a junior sports association's volunteer umpire accreditation
  records under four aggregation rules, since the portal stores only the
  attempt that passed and the association's club-health rating reads that
  stored figure as competence
