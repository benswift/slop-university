title: In Date, and No Safer
subtitle: >-
  Blinded Bench-Testing of 386 Appliances Against the Test-and-Tag Sticker at 61
  Council Community Facilities
authors:
  - Marit Osayande
  - Solveig Adeyemi
  - Thandiwe Solberg
preset: research-poster
school: School of Continuous Improvement
