doi: 10.5555/slop.tyesio
summary: >-
  A research poster from the School of Continuous Improvement bench-tests 386
  portable appliances drawn from 61 council community facilities against a
  reference standard set outside the tagging record, with each appliance's
  test-and-tag sticker concealed from the licensed electrician conducting the
  test. Fault prevalence is 8.5 per cent overall and near-identical either side
  of the tag (8.5 per cent among appliances carrying a current tag, 8.7 per cent
  among those lapsed or untagged; positive likelihood ratio 1.02, 95% CI 0.26 to
  3.94), and the tag's negative predictive value of 0.914 is indistinguishable
  from the sample's base rate of soundness. The council's quarterly
  proportion-tagged indicator did not fall below 93.6 per cent at any point, and
  28 of the 33 failures were found on appliances in date.
topic: >-
  the coloured test-and-tag sticker on the cord of the urn and pie warmer in
  council community facilities, evaluated as a screening test for whether the
  appliance is actually electrically safe against a blinded full bench test,
  while the council reports the proportion of appliances currently tagged as its
  electrical-safety indicator
