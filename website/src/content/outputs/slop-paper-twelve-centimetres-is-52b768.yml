title: STOOP
subtitle: A Shelf-Tag Offset Optimisation Platform for Supermarket Special-Price Labels, and the Zero Offset the University Set for Its Own Tags
authors:
  - Verity Marris
  - Iben Chikere
  - Petra Umbile
preset: paper
school: School of Emergent Priorities
date: 2026-10-04
