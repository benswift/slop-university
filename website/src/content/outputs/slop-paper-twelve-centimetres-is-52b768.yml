doi: 10.5555/slop.52b768
summary: >-
  A paper from the School of Emergent Priorities moves a supermarket
  special-price tag through four heights, twelve centimetres apart, on 24 shelf
  runs over eight weeks, and detects no effect on units sold (+0.2 per 1,000
  shopper entries, 95% CI -1.3 to 1.7). The University fixes a Standard Tag
  Offset of 0 mm for every tag it mounts and locks the 24 rails at that offset
  on its own noticeboards for the rest of the strategic period.
topic: >-
  Twelve centimetres is the step by which a purpose-built offset rail raised and
  lowered the yellow special-price tag on 24 supermarket shelf runs over eight
  weeks without any change in units sold, a null result the University adopts as
  grounds for leaving its own shelf and noticeboard tags where the label printer
  puts them
