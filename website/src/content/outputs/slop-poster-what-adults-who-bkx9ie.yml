doi: 10.5555/slop.bkx9ie
summary: >-
  A research poster from the School of Underlying Conditions reports a
  fourteen-day event-contingent diary kept by 31 adults who stutter, in which
  each of 1,284 entries records the word intended and what was said in its
  place. Content words were mostly exchanged for synonyms, while the speaker's
  own name, numbers and times were talked around or cost the sentence, and 167
  entries record an utterance that did not happen.
topic: >-
  what adults who stutter say in place of the words they anticipate stuttering
  on: a diary study of word substitution and the words that go unsaid
