title: The Word That Was Not Said
subtitle: >-
  Substitution before anticipated stuttering in a fourteen-day speech diary
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
  - Lindiwe Achterberg
preset: research-poster
school: School of Underlying Conditions
