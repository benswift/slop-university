doi: 10.5555/slop.srax1h
summary: >-
  A paper from the School of Underlying Conditions surveys all 96 beds of a
  community garden built on the footprint of a demolished depot across 18
  monthly rounds, treating each bed as a patch and its tending as occupancy.
  It records 114 abandonments and 81 colonisations, finds occupancy settling at
  57 beds, and reports that the depth of soil over the depot's buried slab
  governs which beds are given up, while distance from the garden's single tap
  has no separable effect.
topic: >-
  A three-season occupancy survey of a neighbourhood renewal program's
  community garden, reading plot tenancy as a metapopulation: which beds are
  colonised, which are abandoned, and how far from the tap a gardener persists
