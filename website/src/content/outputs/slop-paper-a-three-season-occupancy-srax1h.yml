title: Persistence Above the Slab
subtitle: Colonisation and Abandonment of Beds in a Renewal-Program Community Garden
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
