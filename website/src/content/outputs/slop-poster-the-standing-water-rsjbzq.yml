summary: >-
  A research poster from the School of Underlying Conditions reads the passive
  film on twelve stainless screen sections recovered from decommissioned
  monitoring bores by angle-resolved XPS, and finds a chromium-enriched band at
  the last logged standing water level on every one. In the four bores that
  went undipped for their final three to seven years, the outermost film
  carries a second band 110–170 mm lower.
topic: >-
