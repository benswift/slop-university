summary: The School of Continuous Improvement's Impact Report 2021-2026 sets out four
  case studies from a Masters reading strand built on the stories of Flannery
  O'Connor and the journals and letters of Thomas Merton, covering a fixed review
  hour adopted by nine operations teams, a named turn opening every Improvement
  Grand Rounds case, letters overtaking progress reports from collaborators, and
  a daily dark hour on the Living Dashboard.
topic: "Reading O'Connor and Merton: five years of the School's reading strand, in
