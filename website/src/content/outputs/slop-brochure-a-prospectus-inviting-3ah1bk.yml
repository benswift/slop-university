summary: >-
  A prospectus addressed to working drug-safety case processors invites them to
  carry the practice of reading an incomplete report into the School of
  Continuous Improvement, through the Master of Applied Measurement, the
  Capability Sprints and doctoral study at Improvement Grand Rounds. Five
  published studies of records read closely, from a pharmacy reporting map to
  an incompletely recovered drill core, are featured by title and DOI.
topic: >-
  a prospectus inviting drug-safety case processors, the people who read every
  adverse-reaction report as it arrives, to bring the craft of the incomplete
  report to the School of Continuous Improvement
