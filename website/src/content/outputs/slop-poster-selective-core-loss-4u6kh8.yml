summary: >-
  A research poster from the School of Underlying Conditions twins 14 HQ
  exploration holes through one coking-coal seam with large-diameter holes and
  finds that 73% of the core the smaller holes lost was bright coal, so that
  their seam composites read 1.7 points higher in ash and one crucible swelling
  unit lower. Assigning each lost interval the properties of its density-log
  class cuts the ash bias to 0.4 points.
topic: >-
  selective core loss in friable coal seams, and what unrecovered bright-coal
  intervals do to the coking properties a seam composite reports
