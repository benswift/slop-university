summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to
  planning, deciding and reporting in ranges, with a stated confidence
  attached to every major commitment and a standing record of how those
  statements fared. Its four priorities extend the same posture to research
  reporting, the curriculum, and the University's provision for unlikely
  years.
topic: >-
  planning in distributions: a risk-literate university that holds its
  ambitions at calibrated confidence
