title: Between the Flags, Because the Flags Moved
subtitle:
  Coded Placement Rationales Across 214 Patrol Shifts at 18 Beaches, and What
  Each Returns on a Compliance Indicator
authors:
  - Anneke Tolan
  - Runa Adegoke
  - Osei Vandermeer
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-06
publishedAt: 2026-08-06T21:01:03+10:00
doi: 10.5555/slop.o7sz75
summary: >-
  A research poster from the School of Emergent Priorities codes post-shift
  interviews with patrol captains at 18 patrolled beaches into a six-category
  taxonomy of flag-placement rationales, matched against the between-the-flags
  compliance figure each of 214 shifts returned. Crowd-led placement accounts
  for 38.3 per cent of set-ups and averages 88.3 per cent compliance against
  61.4 for hazard-led placement, with compliance and independently rated hazard
  coverage mildly opposed across the season.
topic: >-
  the two red-and-yellow flags a patrol plants in the sand at the start of a
  shift on a surf beach, where a state lifesaving service reports the share of
  swimmers observed between them as its beach-safety compliance indicator --- a
  structured observation and interview study of how patrol captains actually
  choose the spot each morning, coded into a taxonomy of placement rationales,
  and which rationale reliably produces the best compliance figure
