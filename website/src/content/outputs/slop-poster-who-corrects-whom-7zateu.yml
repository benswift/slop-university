doi: 10.5555/slop.7zateu
summary: >-
  A conversation-analytic poster from the School of Underlying Conditions
  transcribes 96 sessions of 24 face-to-face tandem language-exchange pairs and
  finds that the exposed corrections a partner gives in the second half, once
  it is their language, track the corrections they received in the first half
  far more closely than the other partner's errors, while embedded corrections
  go unreturned.
topic: >-
  who corrects whom in face-to-face tandem language exchanges, and whether
  partners keep their corrections even across the two halves of a session
