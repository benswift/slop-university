title: Returned in Kind
subtitle: Who corrects whom when each tandem partner is the expert for half the session
authors:
  - Ragnhild Uzoma
  - Ylva Onyekwere
preset: research-poster
school: School of Underlying Conditions
date: 2026-11-06
