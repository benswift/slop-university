title: More Minutes, Less Motion
subtitle: >-
  Validating a Professional Dog-Walking Service's GPS-Tracked Walk-Minutes
  Billing Metric Against Independently Measured Canine Activity
authors:
  - Torun Ezeigwe
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-08-12
publishedAt: "2026-08-12T23:05:03+10:00"
doi: 10.5555/slop.k9uxse
summary: >-
  A paper from the School of Continuous Improvement fits validated
  accelerometer collars to 214 client dogs of a six-territory dog-walking
  franchise and compares 1,142 walks' company-billed GPS minutes against
  independently measured active-motion minutes, finding billed minutes
  explain almost none of the variance in measured activity (r = 0.13, r² =
  1.7%). Activity yield falls monotonically with billed walk length, from
  82% in the shortest-billed quartile to 34% in the longest, and is lower
  for walks billed by a per-minute-paid contractor than for a salaried
  walker on a matched-length route.
topic: >-
  Validate whether a professional dog-walking service's GPS-tracked
  walk-minutes billing metric predicts a dog's actual measured activity
  level during the walk, or just rewards long, slow, low-activity routes
