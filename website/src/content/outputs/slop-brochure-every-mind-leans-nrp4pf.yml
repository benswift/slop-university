summary: >-
  A prospectus brochure from the School of Underlying Conditions invites
  prospective students to study the brain's two unequal halves across all three
  of the University's Schools: the counted strokes of the handwriting drill and
  the layered cortical column, the recording session and who completes it, and
  the boundaries traced on stained brain sections. It sets that invitation
  beside five of the University's published studies of the hand, the cortex and
  the lines drawn across them.
