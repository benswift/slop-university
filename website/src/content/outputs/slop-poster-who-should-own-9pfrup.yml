summary: >-
  A research poster from the School of Settled Matters models a nanofiller
  supplier and a compounder who each invest in a matrix-specific surface
  treatment that neither can contract on, and compares arm's-length supply with
  ownership of the treatment step by either party. Arm's-length supply holds up
  to a specificity threshold that falls steeply as one party's investment comes
  to dominate; beyond it, the step belongs to whichever party's investment
  weighs more.
topic: >-
  Who should own the coupling agent: a property-rights model of hold-up between
  a nanofiller supplier and a compounder over matrix-specific surface treatment
