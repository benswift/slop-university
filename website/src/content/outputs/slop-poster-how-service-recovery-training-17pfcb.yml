title: The Customer Was Also in Training
subtitle: Peer Role-Play and the Settled Complaint in a Contact-Centre Induction
authors:
  - Odalys Penhallow
  - Ingeborg Nwachukwu
preset: research-poster
school: School of Settled Matters
date: 2026-11-09
