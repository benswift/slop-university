doi: 10.5555/slop.17pfcb
summary: >-
  A research poster from the School of Settled Matters follows six cohorts
  (74 trainees) through a regional contact centre's fifteen-day complaints
  induction, finding that trainees' judgements of when a recorded complaint
  call is resolved converge on a single closing cue, the handler's
  restatement of the remedy with the caller's agreement, which rose from 54%
  to 92% of such calls judged resolved, while trainees playing the customer in
  peer role-play came to accept that restatement in 96% of role-plays by day
  11; test calls carrying the cue were recontacted within thirty days about as
  often as those without it.
topic: >-
  how service-recovery training teaches new complaint handlers to judge when a
  customer's complaint is settled
