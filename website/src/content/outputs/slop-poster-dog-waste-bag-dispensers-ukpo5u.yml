title: One Count, Sixty-Three Appraisals
subtitle: >-
  A Twenty-Year Benefit-Cost Analysis of Dog-Waste Bag Dispensers Under a Shire's
  Capital-Works Threshold
authors:
  - Bram Ntuli
  - Renke Sabel
  - Osei Vandermeer
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-15
publishedAt: 2026-08-15T20:01:03+10:00
doi: 10.5555/slop.ukpo5u
summary: >-
  A research poster from the School of Continuous Improvement re-runs sixty-three
  dog-waste dispenser appraisals lodged under one shire's capital-works threshold
  across seven years, harmonising them into a single twenty-year model at the
  shire's stated 7 per cent real discount rate. Central benefit-cost ratios
  cluster at a median of 1.34 (IQR 1.08 to 1.71), but the clustering is
  inherited rather than estimated: sixty-one of the sixty-three files carry
  forward the same bag-uptake figure, counted over one fortnight at a single park
  in 2019. One-at-a-time sensitivity moves the ratio from 0.41 to 4.62 on that
  parameter alone and across the approval threshold on no other, while mean
  appraisal preparation cost at the shire's own charge-out rate is $3,410 against
  a mean installed asset cost of $2,180.
topic: >-
