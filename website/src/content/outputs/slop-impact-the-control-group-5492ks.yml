summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 looks back on
  five years of work with sixty-one immune-function testing laboratories on the
  archives of untreated-control results each new study is compared against,
  through three case studies: a schema exercise and the consolidation of 41,900
  scattered control observations into one archive with its gaps recorded, a
  retirement protocol under which 1,208 ranges were withdrawn from routine
  comparison with a successor or a recorded gap, and a display trial that put a
  range's age and sample count beside the range itself.
