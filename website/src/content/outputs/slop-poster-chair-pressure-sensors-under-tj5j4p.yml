title: Measuring Who Stands
subtitle: Chair-Sensor Compliance and Stand-Up Speaking-Time Equity
authors:
  - Marek Solheim
  - Fenna Okoro
  - Anouk Mensah
preset: research-poster
school: School of Emergent Priorities
