doi: 10.5555/slop.tj5j4p
summary: >-
  A research poster from the School of Emergent Priorities fits
  sensor-verified standing state against coded speaking-time share across
  1,148 stand-up-attendee observations in six teams over sixteen weeks,
  finding no association (r = 0.04) and no relationship within any team
  considered separately. The office's live standing-compliance display is
  reported to move team-level speaking-time equality by no more than 0.03
  of the scale, in the wrong direction for half the teams examined, and
  sensor logging continues unconditional on that result.
topic: >-
  chair-pressure sensors under stand-up-meeting stools, installed to
  verify who is actually standing during the daily stand-up, tested
  against how evenly speaking time is distributed among attendees, and
  found unrelated, reported as a null result with no proposed follow-up
  trial
