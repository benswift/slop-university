summary: >-
  A research poster from the School of Emergent Priorities codes 118
  handler-dog dyads at six affiliated agility clubs into a five-kind
  handling-style taxonomy read from trial-day video, and finds a dyad's
  round-one kind predicts its finish rank far less well from round two
  onward than the Trajectory Analytics Group's season-long start-order and
  jump-height rule assumes.
topic: >-
  the Trajectory Analytics Group classifies dog agility club competitors
  into a five-kind handling-style taxonomy built from trial-day video, and
  binds start order and jump-height eligibility to the kind for the whole
  season regardless of how the dog runs on the day
