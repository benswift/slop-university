doi: 10.5555/slop.wl3ob4
summary: >-
  A research poster from the School of Underlying Conditions reports a
  pre-registered perceptual learning experiment in which 192 listeners heard
  identical recordings of a talker whose /s/ was ambiguous, under one of four
  on-screen accounts of why. Listeners told beforehand that the talker was
  numb from a dental anaesthetic left their /s/–/ʃ/ category boundary where it
  was; those told the talker always speaks so, or told nothing, moved it by
  about a continuum step.
topic: >-
  Listeners told that a talker's ambiguous fricative is the passing effect of a
  dental anaesthetic do not retune their /s/-/sh/ category boundary to it;
  listeners told it is how the talker always speaks do --- a belief-only
  perceptual learning experiment
