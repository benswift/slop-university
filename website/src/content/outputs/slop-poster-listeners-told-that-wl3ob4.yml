title: Not for an Afternoon
subtitle: Listeners Withhold Phonetic Retuning from a Talker They Are Told Is Temporarily Numb
authors:
  - Brynjar Obiora
  - Vigdis Emenike
  - Eivind Onwuka
preset: research-poster
school: School of Underlying Conditions
