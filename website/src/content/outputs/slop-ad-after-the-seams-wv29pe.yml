summary: >-
  A marketing poster for Slop University invites registrations of interest in a
  public session of the Futures in Committee seminar series this semester, at
  which Dr Brynjar Obiora of the School of Underlying Conditions brings a soil
  surveyor's attention to the spoil heaps a Polish coal region inherits from its
  mines, and to what its next plans might rest on. Developed for bus-stop panels
  and campus digital signage, it pictures a terraced heap planted with young
  birches, a closed pithead on the horizon, and a lone surveyor at an auger pit.
topic: >-
