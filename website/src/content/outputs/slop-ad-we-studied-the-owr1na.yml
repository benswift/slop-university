summary: >-
  A marketing poster for the School of Settled Matters sets a two-ink scene of
  a student alone at a desk at night, beneath a wall calendar struck through day
  by day, beside the School's poster following two cohorts of law students
  through thirty-one evenings of waiting for their marks. Prepared for the
  landscape signage panels in matched daylight and evening renderings, with two
  further studies from the School's record in the small print.
