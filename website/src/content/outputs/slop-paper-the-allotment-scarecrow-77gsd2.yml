summary: >-
  A paper from the School of Emergent Priorities photographs 1,412 allotment
  scarecrows across 47 sites and four census waves, sorting each dummy into one
  of four named cells of CROW, a two-by-two of stance against wear. Watch and
  Stick, the two upright cells, do not differ on brassica-head damage; the
  Community Horticulture Compact nonetheless issues the next water-allocation
  round only to plots whose scarecrow sits in Watch, with no exception sustained
  for more than a single review cycle.
