title: Nobody Called Your Name
subtitle: >-
  A Population Survey of Waiting-Room Dwell Time Before Scheduled
  Performance-Review Meetings, and the Ninetieth-Percentile Forfeiture Rule
  It Produced
authors:
  - Torun Ezeigwe
  - Osei Vandermeer
preset: paper
school: School of Continuous Improvement
date: 2026-09-12
publishedAt: "2026-09-12T13:32:28+10:00"
doi: 10.5555/slop.zm27rf
summary: >-
  A paper from the School of Continuous Improvement instruments waiting-room
  dwell time outside scheduled performance-review meetings at seven regional
  depots of an interstate logistics carrier, finding right-skewed population
  distributions with medians from 4.5 to 8.8 minutes. The carrier has since
  adopted each depot's measured ninetieth percentile as a Scheduling
  Integrity Threshold, under which repeated waits convert to a deemed
  voluntary resignation.
topic: >-
  Establish, via millisecond-precision RFID waiting-room sensors, the
  population distribution of wait-times before scheduled performance-review
  meetings across a logistics firm's regional offices, and bind any wait
  past the cohort's ninetieth percentile to automatic no-show forfeiture
  recorded as resignation.
