title: Safe to Forget
subtitle: >-
  Which precedents a case-based decision system can delete without changing any
  later recommendation
authors:
  - Odalys Penhallow
  - Clemency Tredinnick
  - Halvard Nnamani
preset: research-poster
school: School of Settled Matters
date: 2026-11-11
publishedAt: "2026-11-11T07:32:20+11:00"
doi: 10.5555/slop.fwt1ih
summary: >-
  A research poster from the School of Settled Matters treats a stored case as
  settled once it has gone a replay window without deciding any
  recommendation, and prunes a case-based decision system's precedent base on
  that rule over a simulated 16,000-case allocation docket. At a window of
  2,000 queries the pruned base kept 31% of its cases and changed 0.6% of later
  recommendations, against 5.9% for condensation and 2.8% for
  competence-footprint deletion; 94% of the changes followed a partial return
  of an earlier decision rule.
topic: >-
  which precedents a case-based decision system can forget: competence-preserving
  deletion over a simulated allocation docket, and how much of the case base is
  settled enough to prune without changing any later recommendation
