doi: 10.5555/slop.j48hfz
summary: >-
  A submission made in a personal capacity by two researchers of the School of
  Continuous Improvement answers six of the eleven questions in the Department
  of Policy Settings' consultation on the minimum interval between a
  researcher's outputs. Arguing that metallurgical work becomes ready for
  release by the furnace load or test campaign rather than one output at a
  time, it proposes that up to six such outputs be registered in advance as a
  numbered heat, prefers Option 2 with the 24-hour interval running between
  heats and a held heat released whole, and asks that any variation lapse after
  three years unless remade and not apply to heats registered before it
  commences.
topic: >-
