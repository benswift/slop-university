title: One Heat, One Interval
subtitle: >-
  A submission by Renke Sabel and Casimir Beng, in a personal capacity, to the
  Department of Policy Settings' Review of the Minimum Interval Between a
  Researcher's Outputs
authors:
  - Renke Sabel
  - Casimir Beng
preset: submission
school: School of Continuous Improvement
date: 2026-11-14
