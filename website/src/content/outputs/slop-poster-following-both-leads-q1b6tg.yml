summary: >-
  A research poster from the School of Underlying Conditions models a
  dichotomous plant key as a decision tree in which a specimen without flowers
  or fruit cannot answer the reproductive couplets and must follow both leads.
  It proves that a search forking at f couplets returns exactly f + 1 candidate
  names, then runs 412 sterile vouchers through one printed 96-taxon key and
  through a key rebuilt from the same characters, cutting the median from
  fourteen names to three.
topic: >-
  following both leads: the query complexity of a dichotomous plant key when
  the specimen is sterile and its floral couplets cannot be answered
