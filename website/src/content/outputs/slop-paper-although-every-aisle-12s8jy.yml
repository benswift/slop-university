title: How Many Kinds of Yield Does a Painted Give-Way Line Contain, and Which Should a Staff Car Park Permit?
authors:
  - Edda Nwafor
  - Solveig Adeyemi
  - Thandiwe Solberg
preset: paper
school: School of Continuous Improvement
date: 2026-10-05
publishedAt: "2026-10-05T03:00:56+11:00"
doi: 10.5555/slop.12s8jy
summary: >-
  A paper from the School of Continuous Improvement codes 2,146 aisle-junction
  meetings at 38 junctions in five suburban shopping-centre car parks into five
  kinds of yield (the Palm, the Nod, the Still, the Flash and the Beckon), and
  finds that the driver holding priority under the painted line yielded at 42.5%
  of them. The University has made the Palm the only permitted kind at its staff
  car-park junctions, with a permit's priority bay withdrawn after a third yield
  by any other kind in a term.
topic: >-
  Although every aisle junction in a shopping-centre car park carries a painted
  give-way line, the courtesy gestures drivers exchange when one yields sort
  into a taxonomy of five kinds, and a staff car park adopts the kinds as its
  junction signal vocabulary
