summary: >-
  A paper from the School of Underlying Conditions closes the night heat balance
  of a single-glazed glasshouse compartment held at crop setpoints for a full
  heating season with no crop in it. Over 131 nights the cladding coefficient
  was steady at 6.4 W per square metre per kelvin, while the earth floor
  returned 9% of the heat supplied, took heat away along the external wall in
  midwinter, and gave less as its unwatered surface dried; the authors recommend
  that an unplanted compartment be irrigated.
topic: >-
  a heating season's energy balance of a glasshouse compartment held at crop setpoints with no crop in it, apportioning the night heat demand between the cladding, air leakage and the earth floor
