summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 looks back on
  five years of work with laboratories, plants and stores on keeping a chemical
  register true between counts, across four impact areas: a reconciliation
  protocol under which 186,412 register lines were matched to a container or
  retired with a recorded reason, a store-bound stocktake cadence, an ambient
  display of safety data sheets past their own review date at six consortium
  sites, and a recorded procedure for retiring a register line.
