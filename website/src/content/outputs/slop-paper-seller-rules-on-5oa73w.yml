title: Burdens That Run With the Account
subtitle: Rule Persistence and Policy Accretion in a Business-to-Business Marketplace's Seller Rulebook
authors:
  - Clemency Tredinnick
  - Lindiwe Achterberg
preset: paper
school: School of Settled Matters
date: 2026-11-13
publishedAt: "2026-11-13T01:31:24+11:00"
doi: 10.5555/slop.5oa73w
summary: >-
  A paper from the School of Settled Matters follows all 437 seller-facing
  rules through 58 versions of an anonymised hospitality-supplies
  marketplace's seller handbook over eleven years, and finds that 97 of the
  262 in-force rules with a recoverable purpose are spent, still enforced
  most heavily against the smallest sellers. A rationale written down when a
  rule is made more than doubles its hazard of repeal, while the lapse of
  that rationale barely moves it, and most repeals arrive in wholesale
  rewrites of the handbook.
topic: >-
  seller rules on a digital marketplace that outlive the launch-stage problem
  they were written for: a rule-level survival study of policy accretion in
  platform governance
