summary: >-
  A research poster from the School of Settled Matters chemotypes 64 feral hop
  plants growing on the fences of a former hop farm since cut into 19
  rural-residential lots, and finds three clusters: 29 plants match reference
  cones of the cultivar in the farm's last planting records on all four
  descriptors, and 26 of them grow on fences that follow the farm's
  pre-subdivision rows and headlands, while the low-α, cohumulone-rich plants
  sit mostly on fences built at subdivision.
topic: >-
  Chemotyping the feral hops that climb the old boundary fences of a subdivided
  former hop farm: bitter-acid, xanthohumol and essential-oil profiles of the
  escaped plants, and which of them still carry the farm's cultivar
