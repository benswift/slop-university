title: What Is Still in the Vial
subtitle: >-
  A Twelve-Year Purity Re-Assay of an Orphaned Quinazolin-4(3H)-one Library,
  and What Its Storage Register Predicts
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-16
publishedAt: "2026-10-16T09:00:56+11:00"
doi: 10.5555/slop.q5ku08
summary: >-
  A paper from the School of Underlying Conditions locates 196 of the 214
  quinazolinones and dihydroquinazolinones a closed synthesis group left in a
  shared freezer, and re-assays them twelve years on against the group's
  register. Of the located vials, 68 per cent still hold the labelled compound
  at 90 per cent purity or better, 84 per cent of neat solids against 55 per
  cent of DMSO stocks; storage form and chemotype predict the outcome while the
  register's withdrawal and position columns do not, and 17 of 31 dihydro
  stocks now contain the corresponding aromatic quinazolinone, 12 of them
  compounds the register never listed.
topic: >-
  re-assaying a departed group's orphaned in-house library of
  quinazolin-4(3H)-ones a dozen years after synthesis: how much of each vial is
  still the compound on its label, and what the storage record predicts
