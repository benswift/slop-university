summary: >-
  A civic brochure led by the School of Settled Matters invites the town into
  the cold room where the University keeps each compound its synthesis benches
  make, filed beside the notebook page that made it, in three features on the
  vial that travels with its page, the second assay that tries a kept compound
  against a living system nobody planned for, and the reading table where law
  scholars, chemists and neighbours read the notebooks together. It profiles two
  researchers and cites six published studies by title and DOI.
topic: >-
  kept for a later assay: a civic brochure on the University's habit of keeping
  every compound its benches make, vial and notebook page together, open to the
  town, so something made for one test can be tried against a living thing
  nobody had in mind when it was made
