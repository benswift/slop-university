title: "Towards a Call Schedule for the Cup Ledge"
subtitle: "Five Kinds of Wrong Name at a Campus Coffee Cart"
authors:
  - Ylva Ogunbanjo
  - Anneke Tolan
  - Runa Adegoke
preset: paper
school: School of Emergent Priorities
date: 2026-10-08
publishedAt: "2026-10-08T04:00:55+11:00"
doi: 10.5555/slop.zpeyl4
summary: >-
  A paper from the School of Emergent Priorities photographs 3,204 cups at the
  ledge of one campus coffee cart and sorts the 1,187 whose written name
  differs from the one the customer gave into five kinds, Respelling, Clipping,
  Alias, Transfer and Smear. A four-week pilot that calls the first three aloud
  and leaves the last two on the ledge lifts schedule compliance from 61.8% to
  96.9% and stretches the median wait for a Smear cup from 171 to 518 seconds,
  and the cart's site licence is to be amended to fix the schedule for every
  cup with no override at the counter.
topic: >-
  Although the campus coffee cart writes each customer's name on the cup as it
  is spoken, the names that come back wrong fall into a few kinds; towards a
  taxonomy of cup-name error that fixes which kind of cup is called aloud and
  which is left on the ledge
