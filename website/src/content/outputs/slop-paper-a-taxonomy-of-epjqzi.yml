title: Past the Guard Petals
subtitle: >-
  A Taxonomy of Florists' Informal Freshness Cues at a Supermarket-Adjacent
  Flower-Shop Chain, Set Against an Automated Hours-Since-Delivery Markdown
  Timer
authors:
  - Iben Chikere
  - Anneke Tolan
preset: paper
school: School of Emergent Priorities
date: 2026-08-12
publishedAt: "2026-08-12T19:01:03+10:00"
doi: 10.5555/slop.epjqzi
summary: >-
  A paper from the School of Emergent Priorities develops a six-category
  taxonomy of florists' tacit freshness cues, drawn from eleven weeks of
  markdown and removal calls across nineteen stores of a
  supermarket-adjacent flower-shop chain. Matched against the chain's fixed
  automated markdown timer, the categories show no reliable difference in
  aggregate timing but diverge sharply once broken out, a pattern that
  survives dropping the taxonomy's rarest category.
topic: >-
  a taxonomy of the informal cues florists at a supermarket-adjacent
  flower-shop chain use to judge when a bunch is past its best, set against
  the chain's automated hours-since-delivery markdown timer that never
  consults them
