title: Still Counting the Traps
subtitle: >-
  Five Years of the School of Continuous Improvement Helping Vector
  Surveillance Programs Retire the Indicators Nobody Consults
authors:
  - Renke Sabel
  - Edda Nwafor
  - Sten Okwuosa
  - Dagny Okafor
preset: impact-report
school: School of Continuous Improvement
date: 2026-11-19
