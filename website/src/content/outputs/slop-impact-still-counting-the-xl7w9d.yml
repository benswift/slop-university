doi: 10.5555/slop.xl7w9d
summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 reviews five
  seasons of work with five mosquito and tick surveillance programs: a revised
  trap-night record that made failed nights countable, a three-laboratory
  comparison that agreed a single sentinel-flock classification, and a
  retirement review, built on 212 coded committee minutes, that took the
  programs' combined seasonal-risk dashboards from 34 indicators to 20 while
  retaining a winter tick-drag transect on its carriage figures.
topic: >-
  still counting the traps: the School's five years helping vector
  surveillance programs decide which mosquito trap nights, tick drags and
  sentinel-flock bleeds still earn a place on the seasonal-risk dashboard, and
  how to retire the ones that don't
