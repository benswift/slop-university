summary: The School of Continuous Improvement's Impact Report 2021-2026 accounts for
  the schedule of equivalences it published through the Indicator Commons in
  June 2021 --- a table converting an occasion of everyday support into a common
  unit, so that a spare key held next door, a lift to an appointment and a
  Saturday fixture can be added together and ranked. Of the three coefficients
  it carries, one has been revised in five years; the report traces the
  schedule's undocumented custody, the annual return built on it, and the
  allocation ranking that has reproduced the table's own ordering since 2023.
topic: the everyday things people say hold their week together --- the neighbour who
  keeps a spare key, the lift to an appointment, the Saturday fixture ---
  converted into one comparable wellbeing return so they can be ranked against
  each other, and the conversion table nobody has reopened since it was built
