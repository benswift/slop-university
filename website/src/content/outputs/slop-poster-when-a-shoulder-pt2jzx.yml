summary: >-
  A research poster from the School of Continuous Improvement asks 58
  practising spectroscopists how many peaks they see in thirteen simulated
  ¹H doublets whose separation-to-linewidth ratio runs from 0.3 to 1.5, and
  reads their answers against supervaluationist, epistemicist and contextualist
  accounts of vagueness. Half answer "two" only at a ratio of 0.84, well past
  the 1/√3 at which a central dip appears; "neither" reaches 41 per cent near
  0.7; the 50 per cent point moves from 0.92 to 0.75 with the order of
  presentation; and 47 of 58 endorse "one peak or two" for spectra they had
  called neither.
topic: >-
  when a shoulder becomes a peak: an experimental-philosophy study of how NMR
  spectroscopists count partially resolved signals, read against
  supervaluationist and epistemicist accounts of vagueness
