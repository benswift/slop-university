title: The Ring and the Look
subtitle: >-
  Reliability-weighted combination of sight and hammer-tap sound in core
  loggers' grading of weathering
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
  - Brynjar Obiora
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-13
