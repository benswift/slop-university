doi: 10.5555/slop.8z5gyv
summary: >-
  A research poster from the School of Underlying Conditions reports a
  pre-registered cue-combination experiment in which 36 working core loggers
  judged which of two sandstone sticks was the more weathered by sight alone, by
  the sound of a hammer tap alone, and by both. Combined thresholds fell close
  to the reliability-weighted prediction, first- and second-year loggers gave
  the tap less weight than its measured reliability warranted, and a
  three-step conflict between the look and the ring was mostly heard as two
  different sticks.
topic: >-
  Core loggers grade the weathering of drill core by eye and by the ring of a
  hammer tap: a cue-combination experiment pairing each stick of core with
  another stick's tap, testing whether sight and sound are weighted by their
  reliability
