summary: >-
  A research poster from the School of Emergent Priorities specifies KERB, a
  five-level maturity model scoring households' bin-night kerbside readiness
  across three suburban streets, and reports that two streets have adopted
  the model's shared verge-storage reassignment rule as standing practice
  for households sustaining Level 3 or above.
topic: >-
  The Trajectory Analytics Group administers KERB, a five-level maturity
  model (Reactive, Scheduled, Coordinated, Anticipatory, Self-Optimising)
  scoring a street's households on bin-night kerbside readiness, and
  recommends the shared verge storage corner be reassigned to whichever
  household holds the top sustained level
