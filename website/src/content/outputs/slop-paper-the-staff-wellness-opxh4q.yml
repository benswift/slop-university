title: The Wellness Pulse Survey's Top Maturity Rung Pays for a Response Rate, Not for Wellbeing
subtitle: An Eighteen-Month Field Study of a 46-Store Retail Network's Manager Bonus Pool
authors:
  - Marit Osayande
  - Casimir Beng
  - Osei Vandermeer
preset: paper
school: School of Continuous Improvement
date: 2026-09-27
publishedAt: "2026-09-27T22:01:08+10:00"
doi: 10.5555/slop.opxh4q
summary: >-
  A paper from the School of Continuous Improvement reports eighteen months
  of the Response Assurance Maturity Model, a five-level ladder scoring a
  46-store retail network's wellness-pulse survey practice, whose top rung
  ties store-manager retention bonus to a sustained response rate. Kiosk
  response rates climb from 58% to 98% across the deployment while an
  independent, incentive-free wellbeing check drifts slightly downward over
  the same period, and a batch-completion audit finds part of the top
  rung's population reached it through completion practice rather than a
  change in what completions report.
topic: >-
  The staff wellness pulse survey now returns a five-level maturity score,
  and reaching the top rung ties every manager's bonus to a response rate
  they coach into being
