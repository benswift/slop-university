doi: 10.5555/slop.bk5lf1
summary: >-
  An experimental psychology paper from the Schools of Underlying Conditions
  and Continuous Improvement has 40 operators make 1,440 duplicate dips in a
  transducer-logged test standpipe, with the first reading hidden, shown, or
  shown displaced by 12 mm before the check dip. Showing the first reading
  halves the spread of duplicate differences and makes almost a third of pairs
  identical while improving accuracy far less, a displaced reading draws the
  check 0.41 of the way toward it in experienced and novice operators alike,
  and the intraclass correlation reads 0.99999 throughout; the authors
  recommend that the check be made blind.
topic: >-
  the previous reading on the sheet: an anchoring experiment on how printing
  the last dip on the field sheet inflates the apparent test-retest
  reliability of manual groundwater-level readings
