title: Agreeing With the Sheet
subtitle: Anchoring on the Recorded First Reading Inflates the Repeatability of Manual Groundwater-Level Measurement
authors:
  - Vigdis Emenike
  - Mirela Hanke
preset: paper
school: School of Underlying Conditions
date: 2026-11-04
