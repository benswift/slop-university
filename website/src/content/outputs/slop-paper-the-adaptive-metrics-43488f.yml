doi: 10.5555/slop.43488f
summary: >-
  A paper from the School of Continuous Improvement sorts each of 44,736 cups
  handed out at twelve supermarket tasting tables into four named cells ---
  Redundant, Put Back, Converted and Passed --- by the shopper's trolley at
  hand-over and basket at the till. Under a renewal condition on the share of
  cups followed by a purchase, the Redundant cell rises from 9% to 52% and
  Converted cups per stall-hour fall from 6.5 to 2.1 with unit sales
  unchanged; the Adaptive Metrics Lab now licenses every table on the Converted
  cell alone, under an Empty-Trolley Rule with no override at the table.
topic: The Adaptive Metrics Lab sorts every cup handed out at supermarket tasting stalls into one of four named quadrants by toothpick colour, and ties each stall's table licence to the Converted quadrant alone --- after which stalls hand samples only to shoppers already holding the product
