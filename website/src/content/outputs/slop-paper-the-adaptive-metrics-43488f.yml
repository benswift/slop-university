title: Tasting Stalls Licensed on Bought Share Hand Their Cups to Shoppers Already Holding the Product
authors:
  - Eivind Onwuka
  - Thandiwe Solberg
  - Casimir Beng
preset: paper
school: School of Continuous Improvement
