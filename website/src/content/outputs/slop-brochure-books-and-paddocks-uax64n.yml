summary: >-
  A prospectus from the School of Continuous Improvement invites prospective
  students to study agricultural audit and assurance, the work of reading a
  farm's records against the ground they describe. It presents the Master of
  Applied Measurement, the Evaluation of Evaluation program and the Capability
  Sprints, introduces three researchers, and cites five published studies by
  title and DOI.
