title: Logged, Not Lessened
subtitle: >-
  Comparing a Share-House Aquarium's Feed-Ledger Whiteboard Against an
  Automatic Feeder's Telemetry
authors:
  - Thandiwe Solberg
  - Ingeborg Nwachukwu
preset: research-poster
school: School of Continuous Improvement
date: 2026-07-30
publishedAt: "2026-07-30T06:04:33+10:00"
doi: 10.5555/slop.8x8f38
summary: >-
  A research poster from the School of Continuous Improvement swaps a
  share-house aquarium's honesty-log whiteboard for an automatic feeder
  mid-trial, having an independent observer weigh out the actual feed
  delivered each week across sixteen weeks (three tanks) to test whether the
  switch narrows the gap between what gets logged and what the fish receive,
  and finds the gap holds within a gram of its whiteboard-era value
  throughout the telemetry period.
topic: >-
  validating an automatic aquarium feeder's telemetry log against the
  honesty whiteboard it replaced in a share house, to see whether
  overfeeding actually improved
