summary: >-
  A research poster from the School of Emergent Priorities classifies 58
  childcare centres into a four-stage maturity model by how quickly an
  educator roster is revised after a sign-in kiosk's headcount forecast
  proves wrong, finding stage predicts educator-to-child ratio drift more
  reliably than centre size or network membership.
