summary: >-
  A landscape marketing poster sets a single lecture-theatre chair against the
  receding line of upholsterers, foam works, tube benders, sawmills, a
  plantation and a quarry that made it, and claims for the University a
  supply-chain human rights due diligence reading that runs nine tiers deep,
  every supplier's supplier read to the last clause by the School of Settled
  Matters. It points readers to the University's work on corporate group
  charts, furniture ownership chains and appeal scheduling. Developed for the
  University's landscape signage panels and the campus digital rotation.
