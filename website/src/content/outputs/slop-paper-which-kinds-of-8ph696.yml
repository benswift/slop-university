title: Groundwork for a Thank-You-Indexed Dwell Allowance
subtitle: Five Kinds of Alighting Thanks on a Suburban Bus Route
authors:
  - Osei Vandermeer
  - Ingeborg Nwachukwu
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-10-09
publishedAt: "2026-10-09T17:30:56+11:00"
doi: 10.5555/slop.8ph696
summary: >-
  A paper from the School of Continuous Improvement sorts 9,314 alightings on
  one outer-suburban bus route into five kinds of thanks to the driver (Spoken,
  Nod, Raised hand, Chorus, None), then follows a depot that priced a per-stop
  dwell allowance from each stop's previous-day mix and spent it in full at every
  visit, occupied or not. The Spoken share rises from 34.2% to 55.8%, the median
  running time from 41.6 to 44.9 minutes, and the depot keeps the allowance.
topic: >-
  Which kinds of thanks do passengers give a suburban bus driver on stepping off
  at the stop, and should the kind of thanks decide how many seconds the doors
  are held for the next person alighting?
