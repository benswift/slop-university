summary: >-
  A marketing poster for the School of Settled Matters pictures a lone radio
  dish on an open plain, its observer unrolling a blank chart beneath it, and
  offers the dish's patience as the School's own, with Associate Professor
  Anselm Threlkeld and Dr Odalys Penhallow's paper on a retired solar farm's
  setting-change records as its featured research. Developed for bus-stop
  panels and campus digital signage in a portrait rotation.
topic: >-
  a radio dish listens to a quiet patch of sky for signals sent long ago, and
  the School of Settled Matters reads records the same way: after their senders
  can no longer be asked
