title: The Last Jar on the Shelf
subtitle: >-
  Scarcity and Contamination Inferences at a Campus Pharmacy's Skincare Fixture
authors:
  - Torun Ezeigwe
  - Edda Nwafor
  - Signy Okpara
preset: research-poster
school: School of Continuous Improvement
date: 2026-11-04
publishedAt: "2026-11-04T19:32:16+11:00"
doi: 10.5555/slop.z6idbx
summary: >-
  A research poster from the School of Continuous Improvement sets the facings
  of four house-brand skincare lines on one campus pharmacy fixture to full,
  to a single square and sealed unit, or to a single disturbed unit across
  1,184 restock episodes. A sealed last unit lifts sales on every line; once
  disturbed, it keeps most of that lift for foot balm and hand cream and falls
  below a full facing for face cream and lip balm, so the point where the last
  unit reads as handled rather than chosen falls between the hand and the face.
topic: >-
  The last jar on the shelf: when a single remaining unit reads as popular and
  when it reads as handled, in a field experiment on a campus pharmacy's
  skincare fixture
