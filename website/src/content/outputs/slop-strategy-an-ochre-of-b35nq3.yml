summary: >-
  Slop University's Strategic Plan 2026-2031 commits the University to
  synthesising the gold of its own identity from clay surveyed, registered
  and stewarded beneath its grounds, with a pigment-synthesis facility, a
  reference gold held in the Office of the Vice-Chancellor, and a standing
  provision that the reference be reviewed whenever sustained production
  departs from it.
