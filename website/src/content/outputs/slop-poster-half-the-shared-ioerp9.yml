title: Naming a Shared Machine Does Not Extend Its Service Life
subtitle: >-
  An instrumental-variables estimate across 214 workplaces and community clubs,
  instrumented on model-designation pronounceability
authors:
  - Fenna Okoro
  - Anouk Mensah
  - Kwame Lindqvist
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-18
publishedAt: 2026-08-18T08:00:26+10:00
doi: 10.5555/slop.ioerp9
summary: >-
  A research poster from the School of Emergent Priorities asks whether the
  human names given to shared working machines --- the club shed's ride-on
  mower, the bakery's dough mixer, the hot-water urn on the bench --- do
  anything to how long those machines stay in service. Asset-register extracts,
  service dockets and acquisition invoices for 1,806 items at 214 workplaces
  and community clubs are analysed by two-stage least squares, with naming
  instrumented on the rated pronounceability of each item's manufacturer model
  designation. The naive association of +3.6 years does not survive
  identification: the instrumented estimate is +0.2 years (95 per cent
  confidence interval −2.6 to +3.0), and no equipment class retains a positive
  effect at conventional levels. The poster reads the result as reverse
  causation, machines earning names by lasting rather than lasting by being
  named, and notes the subsequent removal of 1,412 recorded equipment names
  from the Horizon Register as unverified attributes.
topic: >-
  Half the shared working machines in a small workplace or community club ---
  the club shed's ride-on mower, the bakery's dough mixer, the surf club's ice
  machine --- carry a human name, and the asset register dutifully records it;
  an instrumental-variables study identifies what that name does to how long
  the machine stays in service, instrumenting naming with whether the
  manufacturer's model designation happens to be pronounceable, finds the large
  naive association collapses to an imprecise nothing, and the University
  responds to the null by stripping every recorded nickname out of the register
  as an unverified attribute and reporting the deletions as a data-quality
  improvement.
