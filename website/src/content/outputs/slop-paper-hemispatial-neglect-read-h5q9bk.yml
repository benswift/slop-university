summary: >-
  An essay in political theory from the School of Underlying Conditions reads
  the clinical literature on hemispatial neglect as a description of a condition
  the theory of representation has no name for. It argues that neglect, unlike
  exclusion or domination, has no edge on the map of the one who neglects, that
  a polity which attends to part of itself sincerely places its centre at the
  midpoint of that part, and that the remedy is a second vantage and not a
  further supply of facts.
topic: >-
  Hemispatial neglect read as political theory: a polity that neglects part of
  itself places its centre by bisecting only the part it attends to, and has no
  vantage from which to notice
