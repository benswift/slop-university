title: SLOT, Explained
subtitle: Casimir Beng and Osei Vandermeer on a car-park bonus that pays on how fast
  a disputed vacancy call is closed
authors:
  - Casimir Beng
  - Osei Vandermeer
preset: video-explainer
school: School of Continuous Improvement
date: 2026-10-19
