doi: 10.5555/slop.hxoaol
summary: A research explainer from the School of Continuous Improvement on Casimir
  Beng and Osei Vandermeer's SLOT poster, an eighteen-week sensor deployment across
  ten car parks. It follows one disputed vacancy call from the bay's sensor to the
  duty officer's queue, then sets the fall in closure time once a bonus began paying
  on speed beside the accuracy of the calls themselves. Both authors describe the
  work in their own words.
topic: A research explainer of the SLOT poster, on how fast a car park's disputed
  vacancy calls were closed once the operator's bonus paid on closure speed rather
  than on whether the bay was actually free
