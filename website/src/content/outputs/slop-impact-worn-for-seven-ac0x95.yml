summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 follows five
  years of work on drug-free test patches in wear and the patches returned at
  removal: a five-band edge-lift card two scorers came to agree on 94 times in
  100, wear diaries that reported full adhesion on day five for 90 per cent of
  patches against 64 per cent in photographs, and a residual-content protocol
  that found a median 58 per cent of labelled load remaining and led the School
  to withdraw its own delivered-fraction indicator. It closes with the
  Capability Sprints' move to a seven-day format of twenty minutes a morning,
  which improved application at ninety days on all five Sprints, and a
  reporting window that holds every indicator until its stated lag has passed.
topic: >-
  worn for seven days: what five years of measuring transdermal patches in wear
  (adhesion, edge lift and the drug still left in a patch at removal) taught the
  School, and how a steady zero-order dose became its model for improvement
