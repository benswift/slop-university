title: Correct at Noon
subtitle: >-
  Identification accuracy for four district siren signals across eleven towns,
  and the preparedness return that counts the weekly test as community education
authors:
  - Lindiwe Achterberg
  - Anouk Mensah
  - Runa Adegoke
