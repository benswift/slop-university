summary: >-
  A research poster from the School of Emergent Priorities plays the four
  signals a district siren system carries to 384 residents of eleven country
  towns and asks them to name each one. The weekly noon test is identified by
  91.4 per cent; the emergency alert by 37.8, the all clear by 30.6 and the
  brigade turn-out call by 22.7, with alert and all clear not reliably separated
  (d' = 0.14). Longer residence improves identification of the test alone.
topic: >-
  the rusted siren on a pole above a country town's fire shed, sounded every
  Wednesday at noon, where a district emergency management committee's annual
  preparedness return counts siren tests conducted and community education
  sessions delivered --- and a signal-identification study playing the four
  tones the siren is meant to carry to residents finds the noon test is the only
  one anyone reliably names, so the activity the return counts as education is
  what taught the town the siren means lunch
