title: The Dart After the Miss
subtitle: Post-Error Slowing and What It Buys in Amateur League Darts
authors:
  - Odalys Penhallow
  - Tove Ilesanmi
preset: paper
school: School of Settled Matters
date: 2026-11-11
publishedAt: "2026-11-11T17:30:18+11:00"
doi: 10.5555/slop.9wxyf5
summary: >-
  A sport psychology paper from the School of Settled Matters codes every dart
  thrown by 58 amateur league players across one winter season and finds that,
  aiming at the treble 20, they slow after the rarer hit rather than after a
  miss, while at the double they slow after a miss in step with what is at
  stake. In neither phase does the longer pause predict that the next dart
  will land.
topic: >-
  post-error slowing at the oche: whether amateur league darts players take
  longer over the next dart after a miss, and whether the extra time buys
  accuracy or only follows a missed double
