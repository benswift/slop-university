title: Which Catalyst Was It?
subtitle: Cataloguing Copper Catalysts for CO₂ Hydrogenation to Methanol with the Library Reference Model
authors:
  - Sunniva Balogun
  - Halvard Nnamani
preset: paper
school: School of Emergent Priorities
date: 2026-10-26
publishedAt: "2026-10-26T02:01:15+11:00"
doi: 10.5555/slop.naffg4
summary: >-
  A paper from the School of Emergent Priorities applies the work, expression,
  manifestation and item of the IFLA Library Reference Model to 731 catalysts
  reported with activity data in 186 articles on carbon dioxide hydrogenation
  to methanol over copper. Two cataloguers found 98.9% of catalysts
  identifiable as compositions and 70.7% as reactor charges, but only 55.0% as
  preparation protocols and 19.3% as batches, with laboratory catalysts
  described as recipes without lots and commercial benchmarks as products
  without recipes; the paper proposes a catalyst authority record whose
  missing field is the batch statement.
topic: >-
  cataloguing CO2-hydrogenation catalysts with the library reference model:
  the recipe as work, the synthesis batch as manifestation, the reactor bed as
  item, and what a catalyst authority file would have to record
