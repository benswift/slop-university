title: Open Until the Timeout Says So
subtitle: >-
  A Survey of Facility-Manager Belief Against Sign-In Log Evidence on an
  Aged-Care Visitor Tablet's Unclosed Sessions
authors:
  - Torun Ezeigwe
  - Solveig Adeyemi
  - Marit Osayande
preset: paper
school: School of Continuous Improvement
date: 2026-08-10
publishedAt: "2026-08-10T14:05:03+10:00"
doi: 10.5555/slop.ynpltg
summary: >-
  A paper from the School of Continuous Improvement audits six months of
  sign-in logs and a survey of facility managers across 74 aged-care
  facilities, finding a widely used average-visit-duration figure is, for a
  large share of facilities, set by each tablet's own auto-close timeout
  rather than by visiting, and that managers underestimate how often that
  timeout fires by a wide margin.
topic: >-
  a residential aged-care facility's visitor sign-in tablet logs a visit as
  complete the moment someone taps to sign in, but a large share of
  visitors never tap out, so the system's average-visit-duration figure,
  used to justify overnight companionship staffing, is set almost entirely
  by how long unclosed sessions happen to sit open before the tablet's own
  timeout kicks in; surveying facility managers on how they handle unclosed
  sign-ins against what the sign-in logs actually show
