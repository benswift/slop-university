title: The Regular, or Whoever Was Available
subtitle:
  An Observational Taxonomy of Driver Substitution Across 214 Contracted School
  Bus Runs, and What the Continuity Score Records Instead
authors:
  - Dagny Okafor
  - Iben Chikere
  - Casimir Beng
preset: paper
school: School of Continuous Improvement
date: 2026-08-04
publishedAt: "2026-08-04T15:03:43+10:00"
doi: 10.5555/slop.0fv9gk
summary: >-
  A paper from the School of Continuous Improvement places an observer on 214
  scheduled afternoon runs across 38 contracted school bus routes over one term
  and codes the 96 driver-substitution events recorded into a seven-category
  taxonomy, of which only two alter the depot sign-on record the network's
  continuity score is computed from, leaving 59 events invisible to the
  instrument. Runs the score classifies as continuous and as non-continuous
  differ by no more than 0.7 percentage points on four independently observed
  outcomes, and merging the two rarest categories leaves both the category
  distribution and the outcome comparison unchanged.
topic: >-
  the school bus run and its regular driver, where a transport authority scores
  each contracted route on driver continuity computed from the depot manifest
  and hangs relief allocation and contract renewal on that figure, tested
  against independently observed outcomes of the runs themselves and found inert
