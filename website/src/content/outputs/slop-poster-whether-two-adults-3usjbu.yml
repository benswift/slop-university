summary: >-
  A research poster from the School of Continuous Improvement measures dim-light
  melatonin onset at home in 34 newly cohabiting couples at weeks 2, 13 and 26
  after move-in, and finds the median within-couple gap narrowing from 79 to 43
  minutes, almost entirely because the later partner advanced, with the
  household's last lamp-off shifting earlier ahead of the change in phase and
  no convergence among matched pseudo-couples.
topic: >-
  whether two adults who move in together come to share a circadian phase: dim-light melatonin onset tracked in newly cohabiting couples over their first six months, against the hour the household's last lamp goes off
