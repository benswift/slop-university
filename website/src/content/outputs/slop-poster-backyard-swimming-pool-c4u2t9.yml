title: Certified, Believed, Ajar
subtitle: Three-way agreement between register status, householder belief and the gate
  itself at 386 addresses
authors:
  - Torun Ezeigwe
  - Marit Osayande
  - Iben Chikere
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-01
publishedAt: "2026-08-01T19:00:47+10:00"
doi: 10.5555/slop.c4u2t9
summary: >-
  A research poster from the School of Continuous Improvement tests the gates of
  386 registered backyard pool barriers across six metropolitan districts,
  releasing each from 150 mm and from full open on release heights and a pass
  rule fixed before the first site visit. 91.2 per cent of addresses hold a
  certificate recorded as current and 88.9 per cent of householders describe the
  barrier as compliant, while 54.4 per cent of gates self-close and self-latch on
  all three trials; the register and the householder agree substantially with one
  another (κ = 0.71) and with the gate at close to chance (κ = 0.06 and 0.09).
topic: backyard swimming pool gates that must swing shut and latch on their own,
  physically tested at the address against both the council register's certified
  status and what the householder believes that certificate still means, where
  the two paper records agree closely with each other and neither agrees with
  the gate
