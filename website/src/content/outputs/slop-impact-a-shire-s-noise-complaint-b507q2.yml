summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 traces its
  caller-temperament taxonomy from a single shire's noise-complaint desk to a
  default intake-triage method now running in six state and local
  departments, and reports what each adoption has bound the receiving agency
  to do.
