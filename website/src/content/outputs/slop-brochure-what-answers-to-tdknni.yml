summary: >-
  A research-showcase brochure led by the School of Underlying Conditions
  gathers the University's work on light and response under a single question,
  what answers once it is illuminated, across three features on sight, on the
  signal a sample gives, and on light in public life. Seven published
  University studies are cited by title and DOI, with pull-quotes from three
  of the researchers behind them.
topic: >-
  what answers to light: a research showcase of work that only responds once it
  is illuminated, from the photoreceptor and the light-switched cell to drill
  core brought up into daylight
