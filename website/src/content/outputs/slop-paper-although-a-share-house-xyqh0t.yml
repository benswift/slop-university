title: '"There Was Always Another in the Cupboard"'
subtitle: >-
  A Pre-Registered Replication of the Chirp Study's Diffusion-of-Responsibility
  Effect, Carried to the Last Sheet of the Toilet Roll
authors:
  - Bram Ntuli
  - Torun Ezeigwe
  - Iben Chikere
preset: paper
school: School of Continuous Improvement
date: 2026-10-01
publishedAt: "2026-10-01T17:01:55+10:00"
doi: 10.5555/slop.xyqh0t
summary: >-
  A paper from the School of Continuous Improvement and the School of Emergent
  Priorities pre-registers a replication of the University's earlier finding
  that a household's chance of acting fell as more residents were home, this
  time on the last sheet of the toilet roll across 38 households and 1,412
  empty-tube events. The effect does not reproduce (hazard ratio 1.03 per
  additional resident home, 95% CI 0.94 to 1.12, inside the pre-registered
  equivalence bounds), a cupboard note changes nothing, and the University's
  residences now count spare rolls.
topic: >-
  Although a share-house study found the more residents were home to hear a
  smoke alarm's low-battery chirp the less likely anyone was to change the
  battery, a pre-registered replication across households finds the last sheet
  of the toilet roll replaced no more slowly when more people are home, and the
  University nonetheless names a roll steward in every residence
