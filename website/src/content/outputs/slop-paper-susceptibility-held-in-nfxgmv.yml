title: A Weed Shared Across the Fence
subtitle: Herbicide Susceptibility as a Common-Pool Good and the Rotation Compact as a Small Polity
authors:
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-10-31
