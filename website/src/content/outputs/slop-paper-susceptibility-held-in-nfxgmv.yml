doi: 10.5555/slop.nfxgmv
summary: >-
  An essay in political theory from the School of Underlying Conditions reads
  nineteen seasons of the minute book of a voluntary compact among dryland
  growers, who agree each autumn on one herbicide group none of them will
  apply. It argues that the compact is a small republic of forbearance: its
  membership runs with the paddock rather than the person, it answers each
  member's undetectable power over the shared stock with a spoken declaration
  rather than monitoring, and it attends to the seed bank, the party every
  decision concerns, only through a standing item that cannot say what it
  holds.
topic: >-
  susceptibility held in common, herbicide resistance and the rotation compact
  of a dryland weed district read as a small polity
