summary: >-
  A civic brochure that borrows immunology's idea of tolerance, the education
  by which a body learns to leave its own tissue alone, to set out the
  University's place in its town. It follows the School of Underlying
  Conditions' soil survey across the campus fence into neighbouring gardens,
  the School of Emergent Priorities' models of how the thymus screens self from
  stranger, and the University's studies of everyday misrecognition at the
  kerb, the market queue and the main street, carried by six published studies
  cited by title and DOI.
topic: >-
  not a foreign body: a civic brochure from the School of Underlying Conditions
  borrowing immunology's idea of tolerance --- how a body learns to leave its
  own tissue alone --- for the University's long effort to be counted part of
  its town rather than a graft the town keeps an eye on, from the soil survey
  that runs straight across the campus fence to the studies of what a place
  recognises as its own
