summary: >-
  A paper from the School of Underlying Conditions follows 444 customer persona
  sheets written by 148 student teams across four teaching periods of one
  first-year marketing subject, and finds that most personas were given an
  alliterative name before the team had opened the dataset. Personas named
  first stated an age a mean of 11.4 years from the median age of their own
  cluster, the age tracking the given name and not the data, and a trial that
  held the name field shut until a clustering checkpoint closed the gap while
  teams coined spoken nicknames for their segments within minutes.
topic: "persona naming in an introductory marketing subject: what the alliterative name settles about a customer segment before the data is read"
