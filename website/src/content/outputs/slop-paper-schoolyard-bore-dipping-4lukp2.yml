title: The Lake Under the Oval
subtitle: How Secondary Students Redraw the Water Table After a Term of Dipping Their Own Schoolyard Bore
authors:
  - Vigdis Emenike
  - Torun Ezeigwe
preset: paper
school: School of Underlying Conditions
date: 2026-10-25
