doi: 10.5555/slop.4lukp2
summary: >-
  A paper from the School of Underlying Conditions compares the cross-sections
  78 Year 9 students drew of the ground beneath their school oval before and
  after a term of weekly readings from a long-unused monitoring bore at its
  edge. Lake and cavern models of groundwater fell from 45% to 14% of drawings,
  while the most common new feature was a water table drawn across the whole
  section and labelled with the class's last reading; the authors argue that
  the smaller groups who drew the water table as a band, or only near the
  bore, drew what a hydrogeologist would.
topic: >-
  schoolyard bore dipping and where secondary students draw the water table
  before and after a term of monitoring their own groundwater
