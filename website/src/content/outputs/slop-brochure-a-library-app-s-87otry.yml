summary: >-
  A research-showcase brochure from the School of Continuous Improvement
  introduces the Adaptive Metrics Lab's Loan-Velocity Register, a library
  app instrument that re-ranks e-book hold queues by borrowers' historical
  reading pace rather than arrival order, and sets it beside six published
  studies of the instruments already deciding who goes next across ordinary
  digital life.
topic: >-
  A library app's e-book hold queue doesn't count arrivals: Slop University's
  Loan-Velocity Register re-ranks every waiting reader by how fast the people
  ahead of them have historically finished a loan, then tells each one a
  position that isn't their place in line. A campaign for the instruments the
  University builds to read the rest of ordinary digital life.
