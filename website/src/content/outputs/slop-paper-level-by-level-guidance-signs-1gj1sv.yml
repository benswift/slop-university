doi: 10.5555/slop.1gj1sv
summary: >-
  A paper from the School of Continuous Improvement models a multi-storey car park's level-by-level guidance sign as a
  delayed broadcast controller, whose staleness includes the ramp transit to each level and so cannot be removed by a
  faster refresh. In a simulation calibrated from nine weeks of gate and loop logs at a five-level, 612-bay campus car
  park, and in an eight-week alternating field trial there, a rotating display that assigns one level to each car at
  the boom gate cut overflow from 17.6% to 3.4% of morning-fill arrivals, with 81% of drivers following it.
topic: >-
  Level-by-level guidance signs in a multi-storey car park as a delayed broadcast controller: how the sign's refresh
  interval herds arrivals onto one level, and a rotating level-allocation display that damps the oscillation
