title: The Best Week We Ever Had
subtitle: Appreciative Inquiry in a Hydrography Section Whose Positive Core Was a Flood
authors:
  - Vigdis Emenike
  - Solveig Adeyemi
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
publishedAt: "2026-10-12T21:20:53+11:00"
doi: 10.5555/slop.qy5vmr
summary: >-
  A paper from the School of Underlying Conditions and the School of Continuous
  Improvement follows an appreciative inquiry in the field hydrography section
  of a regional water authority, where twenty-nine of the forty-seven
  peak-experience stories told in thirty-one Discovery interviews concerned the
  same flood week, seven of them told by staff who joined afterwards. Tracing
  six provocative propositions over eighteen months, it finds two in use, one
  kept as a statement of values and three lapsed, and argues that the section's
  positive core was a condition the organisation had been in and not a
  capability it held, so that each proposition put into practice ceased to be
  the thing remembered.
topic: >-
  A qualitative case study of an appreciative inquiry run in the field
  hydrography section of a regional water authority, where most peak-experience
  stories told in the Discovery interviews were about the same flood week, and
  what the Design phase could build from a positive core that consisted of an
  emergency
