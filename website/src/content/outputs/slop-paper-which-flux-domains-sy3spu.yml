title: Which Flux Comes Back
subtitle: Sample-Fixed and Cryostat-Fixed Memory of the Intermediate State in a Repeatedly Field-Cooled Lead Disc
authors:
  - Eivind Onwuka
  - Thandiwe Solberg
  - Brynjar Obiora
preset: paper
school: School of Continuous Improvement
date: 2026-11-01
publishedAt: "2026-11-01T12:00:19+11:00"
doi: 10.5555/slop.sy3spu
summary: >-
  A paper from the School of Continuous Improvement and the School of
  Underlying Conditions images the intermediate state of one annealed lead disc
  magneto-optically over 200 field-cooled cycles at five reduced fields, and
  finds that consecutive patterns share a stable fraction of their arrangement
  at every field. Remounting the disc a quarter turn round shows where that
  memory is kept: below a reduced field of about 0.4 the tubular pattern turns
  with the sample, above it the lamellae stay with the cryostat's temperature
  gradient, and warming the disc to 20 K between cooldowns leaves either
  unchanged.
topic: >-
  which flux domains come back, pattern memory of the intermediate state in a
  type-I lead disc imaged magneto-optically across repeated field-cooled
  cycles
