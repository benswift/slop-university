title: Towards a Register for Every Unlogged Tiff
subtitle: >-
  A featured-researcher campaign for the School of Continuous Improvement,
  built around Dr Solveig Adeyemi's survey of unreported everyday friction
  and the standing register it makes the case for.
authors:
  - Solveig Adeyemi
