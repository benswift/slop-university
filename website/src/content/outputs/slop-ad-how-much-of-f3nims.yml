summary: >-
  A marketing poster for the School of Continuous Improvement features Dr
  Solveig Adeyemi's survey of the friction that goes unreported in a group
  chat, a neighbourhood forum, and a five-star review, building the case
  for a standing register that would log it anyway.
topic: >-
  How much of what goes wrong in a group chat, a neighbourhood forum, or a
  five-star review never gets reported at all -- surveyed across platforms
  and relationships and reported as distributions, feeding the School's
  case for a register that would log this kind of friction as a matter of
  course.
