title: Humid Before the Door Opens
subtitle: Calendar-preview model predictive control of a soil-core archive
authors:
  - Brynjar Obiora
  - Ragnhild Uzoma
  - Marit Osayande
preset: research-poster
school: School of Underlying Conditions
