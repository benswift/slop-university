summary: >-
  A research poster from the School of Underlying Conditions rotates three
  humidity controllers through a 4 °C soil-core archive over twelve weeks and
  61 booked inspections, feeding one of them the booking calendar as a
  previewed disturbance. With the preview, a model predictive controller held
  the store in its 88–94% band for 93% of inspection minutes against 58% for
  the incumbent PI loop, and sentinel cores lost 0.17 rather than 0.41 g/kg of
  water a week; nearly a quarter of door openings were never booked, and there
  the preview added nothing.
topic: >-
  Model predictive control of humidity in a soil-core archive, using the
  inspection booking calendar as a previewed disturbance so the store
  pre-humidifies before cores are consulted
