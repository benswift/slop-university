summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 looks back on
  five years of work with the oil and gas sector across three areas: reconciling
  facilities' reported flaring against their own flare-meter records, measuring
  the interval between a leak survey's finding and its recorded repair, and
  resurveying a hundred wells listed as plugged on a state register, fewer than
  half of which carried a complete closure record. It closes with the School's
  intention to build a shared approach to the aftercare record of a closed well.
