summary: >-
  A portrait display advertisement for the School of Underlying Conditions sets
  a lone technician raising a test pole to the ceiling detector among the
  drill-core racks of the Basement Relations Group's core store, and presents
  the store's first place on the University's own Indicator Commons readiness
  composite. Prepared for the portrait signage panels in matched daylight and
  evening renderings, with a short reading list from the University's published
  record on detection.
