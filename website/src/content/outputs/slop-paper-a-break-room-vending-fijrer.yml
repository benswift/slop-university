title: "The Committee That Stopped Meeting"
subtitle: "A Ledger-Based Audit of Restock Latency Under an Unretired Sign-Off Requirement"
authors:
  - Dagny Okafor
  - Renke Sabel
  - Marit Osayande
preset: paper
school: School of Continuous Improvement
date: 2026-08-09
publishedAt: "2026-08-09T23:01:22+10:00"
doi: 10.5555/slop.fijrer
summary: >-
  A paper from the School of Continuous Improvement audits restock requests
  across a regional logistics firm's break-room vending machines, finding
  that a sign-off requirement instituted by a since-defunct Product
  Placement Review Committee adds a median 8.1 days to restock latency and
  roughly quintuples the share of requests left unresolved past 90 days, a
  gap that survives an ablation on product turnover.
topic: >-
  a break-room vending machine's restock approval step still requires
  sign-off from a product-review committee that quietly stopped meeting;
  building a simple ledger instrument to measure how many items now wait
  indefinitely
