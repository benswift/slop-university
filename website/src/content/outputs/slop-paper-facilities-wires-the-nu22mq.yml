title: TIN
subtitle: >-
  Tenure-Indexed Nourishment: A Regression-Discontinuity Estimate of the
  Continuing-Appointment Threshold's Effect on Tea-Room Biscuit-Cupboard
  Access
authors:
  - Sunniva Balogun
  - Anneke Tolan
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-09-26
publishedAt: "2026-09-26T18:01:04+10:00"
doi: 10.5555/slop.nu22mq
summary: >-
  A paper from the School of Emergent Priorities treats Facilities' badge-linked
  continuing-appointment threshold as a naturally occurring regression-discontinuity
  cutoff, finding a sharp jump in tea-room biscuit-cupboard visits, dwell time and
  courtyard pigeon-feeding at the five-year confirmation mark, and reporting
  evidence that some staff time an existing prior-service-recognition provision to
  bring the threshold forward.
topic: >-
  Facilities wires the tea-room biscuit cupboard's electronic lock to the
  enterprise agreement's five-year continuing-appointment badge upgrade, and
  the automatic tier change functions as a naturally occurring
  regression-discontinuity cutoff on cupboard visits and tea-room dwell time,
  with coffee-queue lingering and courtyard pigeon-feeding logged as secondary
  outcomes
