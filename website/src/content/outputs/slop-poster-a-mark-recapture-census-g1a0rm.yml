summary: >-
  A research poster from the School of Emergent Priorities treats the receipts
  46 households keep for the tax return as a closed animal population, marking
  every receipt found in a household's own gather and recapturing a fortnight
  later. A heterogeneous-catchability model puts the households' first gather
  at 43 per cent of an estimated 3,236 receipts, with the designated folder
  holding about a fifth of them and the email inbox, the car and the coat
  pockets the most under-counted microhabitats.
topic: >-
  a mark-recapture census of the receipts households keep for the tax return:
  how many there are, which microhabitats they occupy, and how many are still
  legible at lodgement
