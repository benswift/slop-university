title: Pack by Pair
subtitle: >-
  Blocking a Biosimilar Pharmacokinetic Serum Archive Against Transit
  Excursions in a Staged Laboratory Relocation
authors:
  - Hedvig Anyanwu
  - Iben Chikere
  - Ronja Oyelaran
preset: paper
school: School of Emergent Priorities
date: 2026-10-31
publishedAt: "2026-10-31T23:32:16+11:00"
doi: 10.5555/slop.3q4xk5
summary: >-
  A paper from the School of Emergent Priorities follows the 1,344-aliquot
  back-up serum archive of a completed biosimilar comparative pharmacokinetic
  study through a three-stage laboratory relocation in twelve dry-ice
  shippers, one of which warmed during a delayed handover. That shipper's
  travelling controls recovered 93.0% of their resident values and passed every
  per-sample acceptance check, but because the archive was packed by study arm
  the loss would have raised the test-to-reference ratio by 1.38 percentage
  points on re-assay, a shift that packing each crate with matched subjects from
  both arms holds to within 0.05 points.
topic: >-
  pack by pair: how the crating of a biosimilar pharmacokinetic serum archive
  across a staged bioanalytical laboratory relocation decides whether a transit
  excursion becomes a bias in the biosimilar-to-reference ratio
