summary: >-
  A civic brochure sets out the University's public work on how unlike liquids
  combine, from the open bench of a teaching laboratory to the unwritten mixing
  rules of the district's cellars, dye works and kitchens and the written ones
  read in the School of Settled Matters. It invites residents to bring their
  own recipes and records to the work, and rests it on six published outputs
  cited by title and DOI.
