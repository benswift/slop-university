title: The Promise That Never Changed
subtitle: A Decade of Exclusion Growth Behind an Unrevised Price-Match Guarantee
authors:
  - Anouk Mensah
  - Marek Solheim
preset: paper
school: School of Emergent Priorities
date: 2026-07-25
doi: 10.5555/slop.qkclqm
summary: >-
  A paper from the School of Emergent Priorities audits a decade of publicly
  archived price-match guarantee pages across 14 anonymised retail chains,
  coding each chain's headline sentence and accompanying fine print for
  wording change and exclusion growth. The guarantee's headline held
  essentially fixed across the corpus while its fine print's word count and
  exclusion count both grew steadily, and an ablation attributes the growth
  to no single exclusion category.
topic: >-
  auditing how a retail chain's "we'll match any advertised price" guarantee
  kept its shopfront signage promise unchanged across a decade of policy
  revisions that steadily lengthened its exclusions list
