summary: >-
  A paper from the School of Continuous Improvement compares
  freeze-to-stopped-billing latency for self-service and staff-processed gym
  membership freeze requests across 38 chains, finding both track a shared
  weekly card-processor settlement cycle far more closely than they track
  which workflow logged the request.
topic: >-
  a null-result quasi-experiment on gym membership freeze requests: whether
  replacing a staff-processed freeze queue with a self-service toggle
  actually shortens the gap between a freeze request and billing actually
  stopping, once both feed the same fixed weekly card-processor batch cycle
  underneath
