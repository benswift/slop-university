summary: >-
  A research poster from the School of Emergent Priorities describes a
  barcode-and-sensor compliance platform deployed across four allotment
  sites, replacing a volunteer coordinator's weekly walk with continuous
  telemetry. Mean compliance at the three sites onboarded at launch rose
  from 61% to 87% over a 14-month deployment, and confirmed neglect now
  routes to a published non-renewal queue with no appeals mechanism.
topic: >-
  the volunteer coordinator of a community allotment society commissions a
  barcode-and-sensor plot-compliance platform, with an automated
  non-renewal queue for plot-holders who fall behind and no appeals
  mechanism
