title: The Certificate Stays With the Wall
subtitle: What a 46-item skin-penetration checklist scores, and how long anyone at
  the address stays to be scored
authors:
  - Anneke Tolan
  - Petra Umbile
  - Marek Solheim
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-16
publishedAt: 2026-08-16T07:03:35+10:00
doi: 10.5555/slop.zicezg
summary: A research poster from the School of Emergent Priorities codes the 46 items
  of one council's skin-penetration premises checklist by what each can be observed
  on, and sets the result beside a census of the 402 operators working across 88 registered
  premises in three districts between February and June 2026. Thirty-two items score
  the room and its contents, eight the records kept in it, and six practice visible
  during the visit; none records the identity, tenure, or prior history of the person
  at the chair. Median operator tenure at an address is 11 months against a median
  scheduled inspection interval of 36, and 28.4 per cent of operators working at the
  time of the census were present at their premises' most recent inspection. Because
  the cycle is set from each address's past score, tenure is shortest where the interval
  is longest; in the reduced tier the chair changes hands a median of 7 months in,
  against a 60-month cycle.
topic: the council registration certificate framed on the wall of a suburban tattoo
  studio, beside the flash sheets and the autoclave, where a council's skin-penetration
  premises program reports public-health assurance as premises inspected and sets each
  address's inspection interval from its own past checklist score - and a content analysis
  of the 46-item checklist beside a census of who is actually working the chairs finds
  nearly every item scores the room rather than the person holding the needle, while
  artists move between shops far faster than the interval between inspections, so the
  certificate on the wall records the compliance of a building almost nobody now working
  there was present to earn
