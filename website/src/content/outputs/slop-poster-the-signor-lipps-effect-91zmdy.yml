doi: 10.5555/slop.91zmdy
summary: >-
  A research poster from the School of Underlying Conditions treats the gradual
  disappearance of 25 foraminiferal morphotypes below a single ash bed in one
  quarry section as the finite-size rounding of a sharp transition, with
  picking effort standing in for system size. Thinning 60 samples from 800
  specimens to 50 collapses the last-occurrence distributions onto one curve
  with an exponent of 0.83, and the extrapolated width of the extinction at
  infinite effort is zero to within the sample spacing.
topic: >-
  the Signor-Lipps effect read as finite-size rounding of a sharp transition:
  a scaling collapse of fossil last occurrences against sampling effort in one
  measured mudstone section
