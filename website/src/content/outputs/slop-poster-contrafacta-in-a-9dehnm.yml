summary: >-
  A research poster from the School of Continuous Improvement reconstructs the
  tune stock of one Jewish mutual-aid society's hand-copied songbook, 214
  entries on 61 tunes, in which Yiddish songs, Spanish translations of Kipling's
  ballads and Borges's milonga texts were written under the same borrowed
  melodies. It finds the compilers paired text to tune by metre rather than by
  origin, and that a song took its occasion, and its belonging, from the tune.
topic: >-
  Contrafacta in a provincial Jewish songbook: Kipling ballads in Spanish and
  Borges milongas set to the same borrowed tunes
