title: The Line That Stays
subtitle: Setbacks and Planning Horizons at the Interdiffusion Boundary of Two Layered Solutions
authors:
  - Brynjar Obiora
  - Ronja Oyelaran
preset: paper
school: School of Underlying Conditions
