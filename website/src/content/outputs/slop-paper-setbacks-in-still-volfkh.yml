summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities reads the interface between two still solutions layered in a glass
  column with a planner's instruments. Across seven surveys in 343 days the
  half-concentration line never moved while the transition zone widened with the
  square root of time, so a setback measured from that line has a horizon fixed
  by the diffusion coefficient and the threshold chosen for the far side: a
  one-metre strip lasts about thirty-two years to the quartile contour and under
  three to the one-per-cent trace. Twelve practitioners asked where the lower
  layer ended split by profession, planners marking a contour that advanced and
  soil surveyors the line that stays.
topic: >-
  Setbacks in still liquids: an urban planner's zoning of the interdiffusion
  boundary between two layered solutions, with the diffusion coefficient read
  as the horizon over which a fixed setback is consumed
