title: Friday Starts on Thursday
subtitle: Casual Dress, the Calendar and the Weekly Cycle of Office Formality
authors:
  - Edda Nwafor
preset: thesis
school: School of Continuous Improvement
date: 2026-09-28
publishedAt: "2026-09-28T21:30:17+10:00"
doi: 10.5555/slop.7xrmf5
summary: >-
  A doctoral thesis from the School of Continuous Improvement codes 212,406
  arrivals at the lift lobbies of six office buildings over thirty weeks, links
  48 workers' dress diaries to their own calendars, and trials weekday dress
  bands across 24 teams. Formality falls through the working week rather than at
  its end and workers dress for the most formal encounter in their calendar, and
  the thesis recommends the University adopt the Graded Week Standard the School
  already applies to its own staff, whose bands are lowered each year as the
  observed week falls below them.
topic: >-
  casual Friday in the open-plan office: arrivals coded for formality at the
  lift lobby, jeans creeping back into Thursday, and a school that now gives
  each weekday its own dress band and lowers the bands as the drift continues
