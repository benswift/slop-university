summary: >-
  A research-showcase brochure led by the School of Underlying Conditions takes
  the acousto-optic cell, in which a sound wave travelling through a crystal
  steers a beam of light, as the emblem of a wider habit in the University's
  research: sending one wave into or across a thing and attending to what
  returns. Three features follow that habit from a stored grating on a basement
  optical bench to the hammer tap on drill core and the pulse down a monitoring
  bore, and out to the sensors and sirens of the street, citing eight published
  University outputs by title and DOI.
topic: >-
