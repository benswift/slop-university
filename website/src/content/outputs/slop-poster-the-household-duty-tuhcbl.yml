summary: >-
  A research poster from the School of Continuous Improvement specifies
  HAMPER, a closed-loop wash-order controller the household duty officer
  operates from hamper-weight telemetry. Across 42 households and 3,276
  loads, 78% of released cycles fell in two published slots; an unscheduled
  cycle is logged as a published service failure and discretionary-laundry
  privilege suspends until the next roster.
topic: >-
  The household duty officer operates HAMPER, a closed-loop wash-order
  controller that writes the week's load sequence from hamper-weight
  telemetry and treats an unscheduled cycle as a published service failure.
