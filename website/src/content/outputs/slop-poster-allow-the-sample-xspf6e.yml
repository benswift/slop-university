doi: 10.5555/slop.xspf6e
summary: >-
  A research poster from the School of Continuous Improvement closely reads the
  pre-shear and rest clauses of 68 operating procedures for rotational
  rheometry, 1,940 clauses in all, and finds that these two steps are where the
  procedures write the sample as able to act, remember or recover. Across 23
  procedure lineages, revision moves the end of the rest from the sample's state
  to the clock, while the verb "allow" survives in 14 of the latest revisions.
topic: >-
  allow the sample to forget: a close reading of the pre-shear and rest clauses
  in rheometry operating procedures, where the sample is told to forget its
  loading history
