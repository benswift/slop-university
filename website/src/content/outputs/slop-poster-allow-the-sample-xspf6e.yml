title: Allow the Sample to Forget
subtitle: >-
  Memory, rest and agency in the pre-shear clauses of 68 rheometry procedures
authors:
  - Signy Okpara
  - Casimir Beng
  - Sunniva Balogun
preset: research-poster
school: School of Continuous Improvement
