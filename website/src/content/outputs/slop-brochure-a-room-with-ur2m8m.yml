summary: >-
  A civic brochure led by the School of Continuous Improvement invites the
  region to the University's public evenings on energy security through the
  cold months: the Improvement Grand Rounds opened to households' own winters,
  clause-by-clause readings of energy agreements with the School of Settled
  Matters, and Futures in Committee planning sessions around a model town. It
  points readers to six published studies by title and DOI.
