title: Locked at Three on Friday
subtitle: >-
  Closure determinations at 61 community sportsgrounds, and the rain that
  arrives after them
authors:
  - Anneke Tolan
  - Ronja Oyelaran
  - Verity Marris
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-16
publishedAt: "2026-08-16T03:03:03+10:00"
doi: 10.5555/slop.8ro6pt
summary: >-
  A research poster from the School of Emergent Priorities indexes rainfall to
  the moment each weekend ground-closure determination is lodged, across 61
  community sportsgrounds in two council portfolios over 22 winter weekends. At
  the 15:00 Friday deadline 16.8 per cent of the weekend's ground-affecting
  rainfall has fallen, the remaining 83.2 per cent arriving across the days the
  determination governs. Agreement between the determination and a blind
  play-morning surface assessment is 58.4 per cent (kappa 0.19), with 214 of 402
  closures assessed playable on the morning, while the timeliness indicator the
  sportsground management standard reports holds at 100 per cent throughout.
topic: >-
  the laminated GROUNDS CLOSED sign cable-tied to the gate of a suburban sports
  oval on a wet Saturday morning, where a council's sportsground management
  standard reports turf protection as closure decisions issued before the
  Friday-afternoon deadline and a ground-hire fee remission follows every
  declared closure --- and a season-long analysis of when the deciding rain
  actually falls finds most of it lands after the deadline, so the closure is
  locked before the weather that determines fitness exists, the timeliness
  indicator sits at full compliance, and the grounds that sat empty in Sunday
  sunshine are counted as turf protected
