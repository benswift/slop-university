title: One Trial Decides Your Whole Season
subtitle: A prospectus built around a suburban running club's season-opening time trial
authors:
  - Marit Osayande
  - Fenna Okoro
  - Ingeborg Nwachukwu
preset: brochure
school: School of Continuous Improvement
date: 2026-09-27
publishedAt: "2026-09-27T13:02:05+10:00"
doi: 10.5555/slop.0n8799
summary: >-
  A prospectus brochure for the School of Continuous Improvement and the
  School of Emergent Priorities, opening on a suburban running club whose
  season-opening time trial still decides a runner's weekly pace group with
  no re-trial mechanism, and using the case to introduce the Master of
  Applied Measurement, the Master of Priority Studies, and Capability
  Sprints alongside five published University studies of comparable
  classifications.
topic: >-
  Three pace groups account for every runner clocked at a suburban running
  club's season-opening time trial, and the taxonomy built from that single
  morning still decides which bunch a runner starts with every week for the
  rest of the year.
