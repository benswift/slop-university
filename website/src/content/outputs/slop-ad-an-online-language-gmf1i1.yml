title: The Session Moderator's Appeal Changed Complaints, Not Outcomes.
subtitle: >-
  A research-teaser marketing poster for Postdoctoral Fellow Joost Nwosu,
  School of Continuous Improvement, staged around a single-chapter case
  study of an online language-exchange platform's one-step appeal for
  disputed low ratings
authors:
