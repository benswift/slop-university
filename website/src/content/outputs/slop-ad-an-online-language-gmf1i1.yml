summary: >-
  A marketing poster stages Postdoctoral Fellow Joost Nwosu's case study of
  one regional chapter of an online language-exchange platform, where a
  session moderator's one-step appeal for a disputed low rating left roster
  decisions unchanged but sharply reduced complaints reaching the moderator,
  a finding the University now binds every internal appeals process to.
topic: >-
  an online language-exchange platform pairs learners with volunteer
  conversation partners for video sessions; a low post-session rating can
  pull a partner from the active roster pending review; the platform's
  session moderator introduces a one-step appeal letting a disputed partner
  request a transcript read before any roster action; single-site case
  study of one regional chapter on whether the appeal changed how many
  roster decisions were overturned, or only how many complaints reached the
  moderator
