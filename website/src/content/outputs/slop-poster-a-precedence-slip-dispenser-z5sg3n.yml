summary: >-
  A research poster from the School of Emergent Priorities describes a cast-iron dispenser that hands each arriving passenger at twelve suburban bus stops a numbered slip, and a Departure Score that measures how far boarding order strays from slip order. Across sixteen weeks and 2,316 slips the median stop's score falls from 14.2 to 4.0, and a bus depot now ranks its drivers' shift bids by the score of their routes.
topic: >-
  A precedence-slip dispenser bolted to an unmarked suburban bus-stop pole hands each arriving passenger a numbered slip; a boarding-order ledger scores how far actual boarding departs from slip order, and the depot binds driver rostering to the ledger's departure score
