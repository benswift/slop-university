title: The Boundary Came with the Grid
subtitle: >-
  Quadtree split decisions on time-lapse footage of a drying soil pit face
authors:
  - Brynjar Obiora
  - Joost Nwosu
  - Eskil Nwabueze
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-13
publishedAt: "2026-10-13T06:01:56+11:00"
doi: 10.5555/slop.4oxigi
summary: >-
  A research poster from the School of Underlying Conditions codes nine days of
  fixed-camera footage of a drying soil pit face with an in-house intra-only
  block-based encoder at sixteen coding-grid origins, and asks which quadtree
  split edges recur when the grid is moved. Edges beside an abrupt horizon
  boundary recurred in 0.79 to 0.86 of origins at every quantiser setting;
  edges in a gradational zone recurred in 0.41 at the finest setting and 0.17
  at the coarsest.
topic: >-
  Where a block-based video encoder puts its partition boundaries when the
  picture changes only by degrees: quadtree split decisions on slow time-lapse
  footage of a drying soil pit face, and how far those boundaries follow the
  coding grid instead of the content
