title: The Bag Brought Back
subtitle: Deceased-Estate Medicine Returns and Their Reception at Six Community Pharmacy Counters
authors:
  - Vigdis Emenike
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
