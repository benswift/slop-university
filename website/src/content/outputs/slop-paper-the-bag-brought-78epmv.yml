summary: >-
  A paper from the School of Underlying Conditions logs every returned-medicines
  bag brought to six community pharmacies over sixteen weeks and sorts, item by
  item, the 211 that families said followed a death. The estate bags hold
  nearly half of all items returned, with labels spanning a median of 4.2 years
  and often a pair of glasses or a glucose meter packed in among the medicines;
  staff at every site take them whole, pass them to a pharmacist and do not ask.
topic: >-
  the bag brought back after a death: an audit of deceased-estate returns to
  the returned-medicines bins of six community pharmacies, and how dispensary
  staff receive them at the counter
