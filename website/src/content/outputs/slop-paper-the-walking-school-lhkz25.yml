title: The Route Captain's Scanner Log Is Now the Only Record That Counts
subtitle: >-
  Design and a Nine-Week, Fourteen-Route Field Deployment of Kerbwatch, an
  Offline-First Checkpoint Ledger for Supervised Walking-School-Bus Routes
authors:
  - Ingeborg Nwachukwu
  - Osei Vandermeer
  - Fenna Okoro
preset: paper
school: School of Continuous Improvement
date: 2026-09-05
publishedAt: "2026-09-05T15:03:15+10:00"
doi: 10.5555/slop.lhkz25
summary: >-
  A paper from the School of Continuous Improvement reports the design and a
  nine-week field deployment of Kerbwatch, an offline-first checkpoint ledger
  that reconciles route captains' handheld scan logs into a single record for
  fourteen walking-school-bus routes without a cellular connection at any
  checkpoint. The reconciled ledger recovers 97.4 per cent of expected
  attendance within the same school day, and the pilot district's Transport
  Safety Office has since adopted it as the sole record accepted in a
  missed-pickup dispute, with no manual-override provision.
topic: >-
  the walking school bus's route captain checks every child on and off
  through Kerbwatch, a handheld checkpoint scanner Slop University built her,
  and the scanner's log becomes the only attendance record accepted when a
  family disputes a pickup
