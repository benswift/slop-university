title: Nobody Finishes Last
subtitle: The appointment, award and concealment of last place in community sport clubs
authors:
  - Eskil Nwabueze
preset: thesis
school: School of Continuous Improvement
date: 2026-10-06
publishedAt: "2026-10-06T07:28:19+11:00"
doi: 10.5555/slop.oip71b
summary: >-
  A doctoral thesis from the School of Continuous Improvement takes a census of
  what 164 community sport club series do about the bottom row of their results,
  follows the slowest finisher through 5,208 event-days of weekly timed runs
  with and without a tail walker, interviews 74 people at the back of the field
  and trials an appointed last in 18 club series. Of the 164 series, 141 had a
  standing remedy for last place; where the bottom row was held by an appointed
  person the member above it came back more often (next-round return of 73.1%
  against 58.2% in the trial), and the thesis argues that the bottom row of a
  ranked list can be reassigned but not removed. It reports the School's
  adoption of the Last Place Roster, under which every ranked list the School
  publishes carries a rostered member of staff recorded one place below the last
  genuine entrant.
topic: >-
  Nobody Finishes Last: the appointment, award and concealment of last place in community sport clubs --- a doctoral study of what clubs do about the bottom row of a results sheet, from a census of 164 club series, 5,208 event-days of weekly timed runs with and without a tail walker, interviews with the people at the back of the field and a stepped-wedge trial of an appointed last in eighteen club series, finding that last place can be reassigned but not removed, and ending in the School rostering a member of staff to finish last on every ranked list it publishes
