title: Fail to Reject
subtitle: The Conclusion Sentence in Twenty-Three Years of a Statistics Course's Model Answers
authors:
  - Clemency Tredinnick
preset: paper
school: School of Settled Matters
date: 2026-11-15
publishedAt: "2026-11-15T04:31:02+11:00"
doi: 10.5555/slop.n4ifmz
summary: >-
  A paper from the School of Settled Matters gives a close reading of the
  fifty-eight model conclusions in twenty-three marking guides for one
  first-year statistics course, 1998 to 2020, finding that the sentence
  students are taught to write after a non-significant test changes its grammar
  three times, from an imperative to the marker to a first-person "we fail to
  reject" to an agentless "there is insufficient evidence", while carrying
  forward "at the 5% level" and the prohibition on "accept" after the
  questions stopped requiring either. It reads the formula as a burden that
  runs with the course, and ends on the one model answer, from 2020, in which
  "accept" appears in its ordinary sense.
topic: >-
  fail to reject: a close reading of the conclusion sentence a first-year
  statistics course's model answers teach students to write, read as a burden
  that runs with the course from one marking guide to the next
