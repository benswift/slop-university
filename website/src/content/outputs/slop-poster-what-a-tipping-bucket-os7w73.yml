summary: >-
  A research poster from the School of Continuous Improvement compares twelve
  tipping-bucket rain gauges with weighing reference gauges over 187 events,
  and finds that the water left in the bucket when rain stops accounts for a
  shortfall that scales with event count rather than depth, so that no single
  calibration factor can remove it.
topic: >-
  what a tipping-bucket rain gauge still holds when the rain stops: the part-filled bucket that evaporates between events, measured against a weighing gauge on a twelve-gauge test plot
