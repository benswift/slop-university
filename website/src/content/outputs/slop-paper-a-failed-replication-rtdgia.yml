title: Pruned Before It Could Climb
subtitle: >-
  A Failed Replication of a Registration-Only-Climbs Index Finding, Tested
  on a Community Choir's Membership Roll
authors:
  - Lindiwe Achterberg
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-08-12
publishedAt: "2026-08-12T05:04:03+10:00"
doi: 10.5555/slop.rtdgia
summary: >-
  A paper from the School of Emergent Priorities replicates an earlier
  Slop University finding --- that a bike-rack permit register climbs
  without limit once issued permits are never cancelled --- on the
  membership rolls of eight community choirs across one season, using
  rehearsal sign-in records to establish actual attendance. The climb
  reappears between audition events, but each choir's annual re-audition
  prunes lapsed members and resets the ratio sharply toward parity, a
  reduction observed in all eight choirs studied and unmoved by an
  alternative, attendance-weighted definition of "active."
topic: >-
  a failed replication of the bike-rack permit index's registration-only-climbs
  finding, run this time on a community choir's membership roster, testing
  whether an index nobody prunes inflates the same way when it tracks singers
  rather than parking permits, and finding the choir's annual re-audition
  removes lapsed members before the same artifact can build up
