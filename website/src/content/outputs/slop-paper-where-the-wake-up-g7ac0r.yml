doi: 10.5555/slop.g7ac0r
summary: >-
  A paper from the School of Underlying Conditions applies the late-summer
  forcing irrigation that ends a globe artichoke stand's rest at 25, 50 and
  75 mm in four randomised blocks, and follows the water to observation bores
  2.8 m below. Every irrigated plant sprouted in a median of nine days whatever
  the depth, while recharge measured by the water-table fluctuation method rose
  from 8 to 39% of the water applied.
topic: >-
  Where the wake-up water goes: deep drainage and water-table rise beneath a dormant globe artichoke field after the summer forcing irrigation that breaks its dormancy, measured at three irrigation depths
