title: Where the Wake-Up Water Goes
subtitle: Deep drainage beneath a dormant globe artichoke field after its summer forcing irrigation
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-11-18
