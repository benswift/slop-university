summary: >-
  A case-for-support brochure profiling a single supermarket branch's
  loyalty-card earn-rate rise, introduced to offset a supplier surcharge that
  has since been withdrawn and never reversed, now taught as the Master of
  Priority Studies' required opening case. Seven published studies of the
  instruments an ordinary shopping trip already keeps are cited alongside the
  researchers behind them.
topic: >-
