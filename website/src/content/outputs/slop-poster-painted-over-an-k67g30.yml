doi: 10.5555/slop.k67g30
summary: >-
  A research poster from the School of Underlying Conditions edits the 247
  stencilled, cast and overpainted inscriptions on 102 tanks, valves, pipe
  bands and plates of one decommissioned electroplating works in Leiden
  conventions, orders their five letterform families by superposition, and
  finds that 20 of 38 pipe bands still carry a phase I–II label as their
  uppermost layer against 1 of 24 tank walls, so that the feed lines name
  baths their tanks no longer show.
topic: >-
  painted over: an epigraphic corpus of the stencilled, cast and overpainted
  labels on the tanks and pipework of one decommissioned electroplating works,
  read as palimpsests and dated by letterform to reconstruct which vessel held
  which bath before the site is remediated
