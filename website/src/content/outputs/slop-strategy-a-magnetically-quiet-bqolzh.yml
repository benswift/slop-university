summary: >-
  Slop University's Strategic Plan 2026-2031 treats the magnetic stillness of
  the shielded room beneath the School of Underlying Conditions, where
  superconducting magnetometers read the remanent magnetisation of rock, as a
  shared campus asset. It commits the University to a Quiet Field Register of
  every moving steel mass detectable at the room, nightly Quiet Hours in which
  nearby lifts park and the service road closes, a Steel Line on the master
  plan with a magnetic impact statement for every project inside it, and
  helium recovery with Measurement Nights allocated in published sequence.
topic: >-
  a magnetically quiet university: a strategic plan that keeps the campus field
  still enough for the superconducting magnetometers in its shielded room, and
  sets where steel, lifts, vehicles and new buildings may go
