doi: 10.5555/slop.j9vuje
summary: >-
  A paper in human-computer interaction from the School of Continuous
  Improvement reports a sixteen-week research-through-design deployment of a
  shared night-flaring diary in eleven households along one road beside an
  onshore gas plant. Coding all 438 written entries by addressee, it finds the
  log form falling from 79% to 30% of entries as households began writing to
  each other, to a plant night shift that would never read them and, by the
  final month, to the flare itself, while 97 wordless button presses came to
  serve as a signal that a household was awake.
topic: >-
  who the flaring diary was written to: a research-through-design study in
  which households beside an unnamed gas field logged night-time flaring on a
  shared device, and their entries turned from logs into letters addressed to
  neighbours, the operator and the flare
