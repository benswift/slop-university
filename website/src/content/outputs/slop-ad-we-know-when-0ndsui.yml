summary: >-
  A marketing poster for Slop University shows a researcher at dusk driving a
  sampling tube into a tall wall of layered sand, and presents the School of
  Underlying Conditions' work on the light that buried mineral grains keep as a
  standing on the University's own measure of it. Composed for bus-stop panels
  and campus digital signage in a portrait rotation.
