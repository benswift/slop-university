title: The Rock Behind the Reagent
subtitle: Trace-Element Fingerprints, Shelf History and Halex Yield across Twelve Stockroom Lots of Potassium Fluoride
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-10
publishedAt: "2026-10-10T12:01:55+11:00"
doi: 10.5555/slop.blgpei
summary: >-
  A paper from the School of Underlying Conditions analyses twelve lots of
  potassium fluoride from one synthesis stockroom for the rare-earth signature
  of the fluorspar their fluorine was mined as, and runs each in the same
  halogen-exchange fluorination. The signature is not recoverable, the lots
  divide by rubidium according to the source of their potassium, and yield as
  received follows water content and years since first opening; after drying,
  all twelve lots perform alike to within the difference between grades.
topic: >-
  Tracing the potassium fluoride in a synthesis stockroom back to the fluorspar
  it was mined from, and asking whether ore provenance or bottle history
  explains lot-to-lot yield in a routine halogen-exchange fluorination
