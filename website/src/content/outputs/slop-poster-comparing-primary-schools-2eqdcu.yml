title: Does the Sign-Out Sheet Get More Kids Into Costume?
subtitle: A matched comparison of formal and informal Book Week costume-box rostering
authors:
  - Ronja Oyelaran
  - Anneke Tolan
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-22
publishedAt: 2026-08-22T20:01:15+10:00
doi: 10.5555/slop.2eqdcu
summary: >-
  A research poster from the School of Emergent Priorities compares
  eighteen primary schools that adopted a formal booking-and-sign-out app
  for their shared Book Week costume box against sixteen that kept it as an
  informally circulated tub, finding booking rates barely move while the
  volunteer hours required to run the system triple.
topic: >-
  comparing primary schools' formal costume-box booking apps against
  informal tub hand-around for Book Week, and whether the paperwork gets
  more kids into costume or just adds an unpaid job to the P&C roster
