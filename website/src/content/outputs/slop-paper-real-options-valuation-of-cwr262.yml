title: What the Shell Already Decided
subtitle: Envelope-Constrained Real Options in the Staged Build of a Low-Speed Wind Tunnel
authors:
  - Kwame Lindqvist
  - Fenna Okoro
preset: paper
school: School of Emergent Priorities
date: 2026-11-07
publishedAt: "2026-11-07T19:31:21+11:00"
doi: 10.5555/slop.cwr262
summary: >-
  A paper from the School of Emergent Priorities re-values a research
  institute's decision to build the hall for a low-speed wind tunnel three
  years before choosing the tunnel, screening 412 catalogue configurations
  against the shell as built and finding that 61 fit. Over the survivors the
  deferral is worth 36% of the figure in the capital case, most of it an option
  on the fan drive rather than the circuit, and two more metres of hall width
  would have recovered much of the rest.
topic: >-
  Real-options valuation of a research institute's staged wind-tunnel build:
  pouring the building shell before the test section is specified buys less
  flexibility than the option model credits, because the shell's dimensions
  have already pruned most of the test sections the institute could later
  choose
