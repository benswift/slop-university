doi: 10.5555/slop.o4t69j
summary: >-
  A paper from the School of Underlying Conditions measures whether a bedding
  plane is seen to continue through the wooden block that stands in a core tray
  for unrecovered rock. Sixteen experienced loggers and sixteen untrained
  observers localised a flashed dot against the plane's path through the block
  with equal precision, whether or not the core was marked as oriented, while
  in a logging task the untrained observers drew the plane through unoriented
  blocks on 89% of trials and the loggers on 6%.
topic: >-
  contour interpolation across core-loss blocks: a psychophysical study of
  whether experienced core loggers and naive observers see a bedding plane
  continue across the wooden block that marks lost core, and whether knowing
  the core has rotated across the gap changes what they see
