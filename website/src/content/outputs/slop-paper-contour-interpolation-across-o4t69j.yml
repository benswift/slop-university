title: The Plane Behind the Block
subtitle: Contour Interpolation Across Lost-Core Intervals in Experienced Loggers and Naive Observers
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
