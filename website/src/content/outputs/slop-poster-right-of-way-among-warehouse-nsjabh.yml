title: Who Goes First
subtitle: Stochastic Stability of Right-of-Way Conventions in Multi-Robot Path Planning
authors:
  - Odalys Penhallow
  - Anselm Threlkeld
  - Gunnhild Ekwueme
preset: research-poster
