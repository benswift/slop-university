summary: >-
  A research poster from the School of Settled Matters models a decentralised
  multi-robot planner's choice between two right-of-way rules, loaded robot
  first and yield to the right, as a convention learned through adaptive play.
  It shows that the fleet settles on yield to the right, the risk-dominant rule,
  whenever a misread loaded-first encounter costs more than that rule's
  throughput premium, and in simulation on a 40 by 40 grid the settled rule
  gives up 4 to 13 per cent of throughput as fleets grow from 20 to 120 robots.
topic: >-
  Right-of-way among warehouse robot fleets as an evolutionary convention:
  which priority rule a multi-robot path planner settles on, read through
  stochastic stability and equilibrium selection
