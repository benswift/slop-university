title: Reasons That No Longer Count
subtitle: Settledness and the Conventions of Exchange
authors:
  - Odalys Penhallow
preset: paper
school: School of Settled Matters
date: 2026-11-21
publishedAt: "2026-11-21T18:30:42+11:00"
doi: 10.5555/slop.o9j2ro
summary: >-
  A paper from the School of Settled Matters argues that a settled rule of
  exchange is one against which certain objections, even when granted as true,
  are mutually expected not to count as reasons, while a recognised channel for
  reopening it remains. Four weighing customs of an invented produce market
  show the property coming apart from Lewisian convention, joint acceptance and
  promulgation in both directions, and the paper proposes it as a dimension of
  institutional persistence and change that equilibrium accounts leave out.
topic: >-
  When is a convention settled? An analytic account of settledness in
  conventions of exchange, arguing that Lewis-style convention and common
  knowledge do not capture closure, and that a market rule is settled when
  reasons to reopen it are no longer received as reasons, tested on invented
  cases from a wholesale produce market's weighing customs
