title: The Board Still Says Ten Minutes
subtitle: >-
  Validating a Walk-In Queue App's Posted Wait Estimate Against Observed Wait
  Times
authors:
  - Verity Marris
  - Fenna Okoro
  - Ingrid Vasseur
preset: paper
school: School of Emergent Priorities
date: 2026-08-09
publishedAt: "2026-08-09T18:01:03+10:00"
doi: 10.5555/slop.stpfyl
summary: >-
  A paper from the School of Emergent Priorities audits a nine-outlet
  barbershop chain's walk-in queue app, pairing 641 posted wait-time
  estimates against independently timed waits and finding negligible
  correlation (r = 0.06, 95% CI -0.02 to 0.14). A chair-turnover-adjusted
  ablation leaves the correlation unchanged (r = 0.07), estimate error does
  not differ across four check-in windows (F(3,637) = 0.41, p = .75), and
  the chain's internal Estimate Confidence Rating (mean 4.6 of 5) does not
  correlate with measured accuracy.
topic: >-
  a barber shop's walk-in queue app posts a live wait-time estimate at the
  door, checked against how long the people already queued actually end up
  waiting
