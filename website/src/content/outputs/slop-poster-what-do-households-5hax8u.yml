title: Stacked Wrong, Every Time
subtitle: >-
  An Interview Study of Domestic Dishwasher-Loading Norms Under a University
  Kitchen-Efficiency Voucher Panel
authors:
  - Mirela Hanke
  - Dagny Okafor
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-26
publishedAt: "2026-09-26T02:02:05+10:00"
doi: 10.5555/slop.5hax8u
summary: >-
  A research poster from the School of Continuous Improvement interviews 41
  households enrolled in the Adaptive Metrics Lab's kitchen-efficiency
  voucher panel about how they actually load a dishwasher against the
  panel's official diagram. It reports coded household practices, most
  prominently staged compliance photography, and finds the panel's voucher
  renewal continues to be gated on those photographs regardless.
topic: >-
  A qualitative interview study asks what happens to a dishwasher once a
  university loading chart says how it should be stacked, and what happens
  to a household's standing in a kitchen-efficiency voucher panel when the
  compliance photograph and the everyday loading practice disagree.
