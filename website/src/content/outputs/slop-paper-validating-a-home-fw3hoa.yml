title: Rated for Three Days, Delivered for One
subtitle: Auditing Home Battery-Storage Backup Claims Against Real Blackout
  Performance
authors:
  - Torun Ezeigwe
  - Marit Osayande
  - Renke Sabel
preset: paper
school: School of Continuous Improvement
date: 2026-07-26
doi: 10.5555/slop.fw3hoa
summary: >-
  A paper from the School of Continuous Improvement audits 54 instrumented
  households across 71 real blackout events, finding installed
  battery-storage systems deliver on average 39% of their manufacturer-rated
  backup duration regardless of size or chemistry, and that disclosing the
  measured figure to owners left their subsequent upgrade and contact
  behaviour unchanged.
topic: >-
  validating a home battery-storage system's advertised "days of backup"
  rating against how long it actually ran the fridge during real blackouts
  across instrumented households, then testing whether telling owners the
  true number changed anything they did next
pages: 5
version: "1.0"
