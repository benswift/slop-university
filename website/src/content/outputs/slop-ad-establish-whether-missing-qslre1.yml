summary: >-
  A marketing poster from the School of Continuous Improvement fronts Sten
  Okwuosa's regression-discontinuity study of a campus bike rack's fixed
  capacity, and reports the same capacity number now standing as the
  trigger for opening a shuttle stop at every other campus lot.
topic: >-
  Establish whether missing out on a full campus bike rack by one space
  changes a rider's odds of still cycling in a month, exploiting the
  rack's fixed capacity as a naturally occurring regression-discontinuity
  cutoff, then fix that same capacity number as the trigger for opening a
  shuttle stop at every other campus lot
