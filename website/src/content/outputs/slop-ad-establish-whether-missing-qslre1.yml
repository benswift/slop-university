title: Full Rack, Fixed Policy
subtitle: >-
  A featured-researcher campaign for the School of Continuous Improvement,
  built around Sten Okwuosa's regression-discontinuity read of a campus
  bike rack's fixed capacity, and the shuttle-stop trigger now set on top
  of it.
authors:
  - Sten Okwuosa
