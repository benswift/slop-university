summary: >-
  A research poster from the School of Settled Matters codes every quotation
  and close paraphrase in 263 upper-secondary exam essays on Kleist's Michael
  Kohlhaas, written under open-text conditions across three set prompts, by the
  episode of the Novelle it draws on. The opening, the burnt castle and the
  execution are cited in most essays, while the amnesty and safe-conduct to
  Dresden appear in 25 (9.5%), and 19 of those 25 find that the authorities
  broke faith first against 43 of the other 238.
topic: >-
  What 263 upper-secondary exam essays on Kleist's Michael Kohlhaas cite as
  evidence when they judge the horse dealer: the opening, the burnt castle and
  the execution, almost never the amnesty and safe-conduct the state later
  breaks
