summary: >-
  A paper from the School of Continuous Improvement follows one fire-warden's
  whistle, hooked beside a stairwell door on a sixty-desk hot-desking floor, for
  sixty-one weeks and 590 observation rounds. The whistle was held by whoever
  booked the desk last, 27 people in all, only three of them registered
  wardens, and across three drills it was blown by five different people. The
  case is set out in teaching form, with seminar questions, and closes on the
  whistle-custody rule the University adopts for every whistle it owns.
topic: >-
  Who is the fire warden when the whistle is only on someone's desk? A
  single-site case study of a sixty-desk open-plan office whose one warden's
  whistle is passed to whoever sits nearest the stairwell that week, blown in
  three drills by five different people, and the whistle-custody rule the
  University adopts for every whistle it owns
