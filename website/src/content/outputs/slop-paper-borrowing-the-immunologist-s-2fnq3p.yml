title: Healing What Is Not Broken
subtitle: Unprovoked Release and Missed Cracks across a Microcapsule Wall-Thickness Series
authors:
  - Signy Okpara
  - Vigdis Emenike
  - Brynjar Obiora
preset: paper
school: School of Continuous Improvement
date: 2026-10-12
