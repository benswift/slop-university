doi: 10.5555/slop.2fnq3p
summary: >-
  A paper from the School of Continuous Improvement and the School of
  Underlying Conditions fractures 132 coupons of a capsule-based self-healing
  epoxy across seven shell-wall thicknesses, counting separately the capsules
  that emptied into sound matrix during a 28-day hold and the capsules a crack
  passed without opening. Healing peaked at a 260 nm wall and fell away on
  either side for different reasons, and a batch blended from the two extremes
  showed both failures at once at a mean wall that, in a uniform batch, showed
  little of either.
topic: >-
  Borrowing the immunologist's two failures for a self-healing epoxy:
  microcapsule shell walls thin enough to release healing agent into undamaged
  matrix (an autoimmune regime) and thick enough to let a crack pass unhealed
  (a deficient one), mapped across a wall-thickness series of fracture coupons
  to find the tolerant window between
