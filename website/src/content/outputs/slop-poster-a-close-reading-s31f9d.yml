doi: 10.5555/slop.s31f9d
summary: >-
  A research poster from the School of Underlying Conditions closely reads a
  14,200-word diamond-drilling contract and finds its 17 uses of "recovered",
  a word it never defines, divided among three senses, an act, a condition of
  payment and a measured quantity, that never share a clause. Read beside its
  core-handling clause the contract makes lost core the driller's failure of
  effort; read beside its rate schedule, only a shorter number for the client's
  geologist to measure.
topic: >-
  a close reading of the payment clauses in one mineral-exploration drilling
  contract, where the single word 'recovered' decides whether driller or client
  bears the cost of rock that never came up
