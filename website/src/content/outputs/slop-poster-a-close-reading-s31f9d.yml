title: Payable per Metre Recovered
subtitle: How one undefined word in an exploration drilling contract assigns the cost of lost core
authors:
  - Ragnhild Uzoma
  - Kwame Lindqvist
  - Sunniva Balogun
preset: research-poster
school: School of Underlying Conditions
date: 2026-11-02
