title: "Faultless, Not Fairer"
subtitle: >-
  A Stepped-Wedge Crossover Trial of Digital Fault-Tally Scoring Across
  Twenty-Two Suburban Dog-Obedience Clubs
authors:
  - Anouk Mensah
  - Renke Sabel
preset: paper
school: School of Emergent Priorities
date: 2026-08-30
publishedAt: "2026-08-30T18:01:15+10:00"
doi: 10.5555/slop.xghi1d
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement reports a pre-registered, stepped-wedge crossover trial of a
  handheld digital scoring application against the paper scorecard it was
  built to replace, across twenty-two suburban dog-obedience clubs over a
  ten-round season. The digital tally moved none of three pre-registered
  outcomes, the formal dispute rate, handler-perceived fairness, and
  inter-rater agreement, outside their equivalence bounds, and the state
  governing council has since made the application the only scoring method a
  registered trial may use.
topic: >-
  a digital fault-tally scoresheet scores dog-obedience trial runs in real
  time, replacing the paper card across twenty-two suburban clubs, and a
  stepped-wedge trial finds it changes neither dispute rates nor
  handler-perceived fairness, so the state governing council retires the
  paper scorecard everywhere anyway
