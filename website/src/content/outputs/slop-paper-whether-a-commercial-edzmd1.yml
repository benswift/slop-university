title: The Sticker Knew the Date
subtitle: >-
  Lift Inspection-Certificate Currency Against Recorded Breakdown and
  Entrapment Events Across a 74-Building Portfolio
authors:
  - Ronja Oyelaran
  - Petra Umbile
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
date: 2026-08-08
publishedAt: "2026-08-08T13:04:03+10:00"
doi: 10.5555/slop.edzmd1
summary: >-
  A paper from the School of Emergent Priorities links a facilities
  portfolio's lift inspection-certificate registry, maintenance-ticket log,
  and an independently commissioned condition audit across 212 lifts and 74
  buildings over four years. Certificate currency shows almost no
  association with recorded breakdown or entrapment events, while an
  independent condition-audit score and each lift's own door-cycle volume
  track both outcomes, and the two compliance rankings order the portfolio's
  buildings close to independently of one another.
topic: >-
  whether a commercial building's lift inspection certificate, renewed on a
  fixed compliance schedule and posted in the cab, predicts which lifts
  actually break down or trap passengers, checked against years of
  maintenance tickets across a portfolio of buildings
