summary: >-
  A research-showcase brochure presenting the University's work on organic food
  and agriculture through its market-garden beds in their conversion years,
  farmed to the organic standard before they may be sold as organic. Four
  feature strands, on certification records, the names food carries, the
  agricultural archive and the beds as a site of research training, are carried
  by seven published University studies cited by title and DOI.
topic: >-
  in conversion: the University's campus market garden in its conversion years,
  farmed to the organic standard and not yet allowed to say so, and the
  record-keeping that carries a plot from first season to label
