summary: >-
  A marketing poster for the School of Emergent Priorities features Dr Runa
  Adegoke and SLOT, her eye-tracking instrument for supermarket shelf-edge
  labels, which sorts every stocked line into one of four attention
  quadrants now used to decide a year's worth of eye-level shelf space.
topic: >-
  Dr Runa Adegoke's SLOT eye-tracking rig scores every supermarket
  shelf-edge label into one of four quadrants -- Magnet, Passed, Ignored,
  Blocked -- and a regional supplier-shelf-space agreement now grants
  eye-level placement only to Magnet lines, dropping any line scored
  Blocked to the bottom shelf for a full year with no earlier review.
