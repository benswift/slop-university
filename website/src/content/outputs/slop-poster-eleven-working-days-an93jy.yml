summary: >-
  A research poster from the School of Emergent Priorities reports a
  rule-based scheduler that moves an unresolved noise complaint to statutory
  notice once eleven working days have passed, with no tier of the system
  reading the complaint record. Deployed across six shire
  environmental-health units over fourteen months, the scheduler cut median
  time to statutory notice from a shire-by-shire range of 29-52 days to 11-14
  days, and the pilot shires have voted to extend the same content-blind
  pattern to parking-permit disputes, library-fine reviews, and footpath
  trip-hazard reports.
topic: >-
  Eleven working days is the trigger a shire's newly built
  complaint-escalation scheduler uses to move an unresolved noise report
  straight to statutory notice, without any tier reading what the complaint
  says.
