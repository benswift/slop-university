title: By the Eleventh Working Day, Nobody Has Opened It
subtitle: A Content-Blind Escalation Scheduler for Shire Noise Complaints
authors:
  - Runa Adegoke
  - Lindiwe Achterberg
  - Ingeborg Nwachukwu
preset: research-poster
school: School of Emergent Priorities
