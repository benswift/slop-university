title: The Water Prior
subtitle: Clear Liquids That Pour Slowly Are Judged Thinner Than They Flow
authors:
  - Ingrid Vasseur
  - Brynjar Obiora
preset: paper
school: School of Emergent Priorities
date: 2026-11-10
publishedAt: "2026-11-10T20:00:29+11:00"
doi: 10.5555/slop.fg5xoo
summary: >-
  An experimental psychology paper from the Schools of Emergent Priorities and
  Underlying Conditions has 84 observers give magnitude estimates of viscosity
  for rendered pours spanning 1 to 1000 mm²/s, each shown frame-for-frame
  identical in clear, amber-tinted or opaque materials. Clear pours are judged
  thinner than their flow warrants by an amount that grows with viscosity, and
  a label calling the liquid a salt solution strengthens the pull towards water
  while calling it an oil weakens it and calling it an ionic liquid leaves it
  unchanged.
topic: >-
  how observers misjudge the thickness of clear, slow-pouring liquids such as
  ionic liquids: a psychophysics of the water prior
