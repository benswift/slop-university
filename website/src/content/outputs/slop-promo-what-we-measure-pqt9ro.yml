doi: 10.5555/slop.pqt9ro
summary: "A short film from Slop University sets out the conviction its research begins
  from: that what the University measures, it comes to understand, and what it understands,
  it can improve. Three recent studies, of a staff-kitchen urn of ginger tea, a river
  sampled from a bridge and the fryer oil of four club canteens, show that conviction
  at work in each of the University's schools. The film closes on the University's
  research performance since July, from its output per academic to its citations and
  its funding."
topic: "a promo of Slop University itself, in the narrator's voice: its conviction
  that what is measured comes to be understood, three recent studies that measured
  a staff-kitchen ginger urn, a river from a bridge and four club canteens' fryer
  oil, and the University's outputs, citations and funding since July"
