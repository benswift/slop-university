summary: >-
  A research poster from the School of Settled Matters draws a one-gram aliquot
  of plum jam from the pan each minute of the boil across twelve matched
  batches and runs each through a micro-DSC cooling scan. Every batch acquired
  its whole gelation exotherm between consecutive aliquots, at 64 to 65 degrees
  Brix and between the seventh and thirteenth minute, and a blinded cold-saucer
  test found the set within a minute of the calorimeter in all twelve.
topic: >-
  Cooling-scan calorimetry of jam drawn from the pan minute by minute through
  the boil, locating when a batch acquires its gelation exotherm
