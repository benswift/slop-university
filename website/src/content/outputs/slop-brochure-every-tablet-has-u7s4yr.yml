summary: >-
  A civic brochure from the School of Underlying Conditions invites the
  district's pharmacists, patients and quarry neighbours to read the medicine
  cabinet as part of the ground it comes from, following a tablet from the
  mined clays, chalks and salts in its body, across the pharmacy counter where
  returns are handed back, to the soil and groundwater the School keeps watch
  on. It rests the invitation on six published University studies, cited by
  title and DOI.
topic: >-
