title: Why Does the Last Reduced Sandwich Stay on the Shelf?
subtitle: Markdown depth by shelf placement in eleven supermarkets' chilled cabinets
authors:
  - Edda Nwafor
  - Renke Sabel
  - Thandiwe Solberg
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-04
publishedAt: "2026-10-04T14:01:56+11:00"
doi: 10.5555/slop.xfdsx0
summary: >-
  A research poster from the School of Continuous Improvement sorts 4,128
  stickered chilled sandwiches across eleven supermarkets into four named cells
  of markdown depth by shelf placement, finding that placement lifts the share
  cleared by close of trade by more than depth does and that markdown beyond 60
  per cent adds nothing. The School adopts a Sticker Ceiling for its own
  surplus: marked down to 60 per cent and no further, moved to a Reduced Shelf,
  and booked to the unit's cost centre at sticker price if still there at close
  of the next working day.
topic: >-
  Although the supermarket's reduced-to-clear sticker is the one price signal
  that tells a shopper the item will certainly be binned by closing, the last
  stickered sandwich is the one nobody takes: a four-cell quadrant of discount
  depth against shelf placement, and the Sticker Ceiling the School set for its
  own withdrawn files
