title: Towards a Portable Cadence-Compliance Standard
subtitle: >-
  A Review Cadence Observatory Case Study of Meeting Rhythm at a Suburban
  Orchid Society
authors:
  - Osei Vandermeer
  - Torun Ezeigwe
  - Sten Okwuosa
preset: paper
school: School of Continuous Improvement
date: 2026-09-16
publishedAt: "2026-09-16T07:43:56+10:00"
doi: 10.5555/slop.v23hnx
summary: >-
  A paper from the School of Continuous Improvement develops a Cadence
  Compliance Index scoring a suburban orchid society committee's six years of
  meetings against its own constitutional interval, finding the index
  unmoved by an ablation that excludes every sitting later coded as
  procedurally pro forma, and proposes cadence-compliance, so measured, as a
  non-discretionary condition of continued Community Research Partner
  status.
topic: >-
  Review Cadence Observatory single-site teaching case of a suburban orchid
  society whose committee meeting rhythm clusters around the spring show,
  proposing mandatory cadence-compliance as a condition of Community
  Research Partner status
