doi: 10.5555/slop.f4938r
summary: >-
  A research poster from the School of Underlying Conditions screens 111
  recovered 2 m runs of one diamond-cored hole for powder second-harmonic
  response at 1064 nm, ratioed to an α-quartz standard of the same sieve
  fraction. The ratio tracks diffraction-quantified quartz through the
  sedimentary cover (Spearman ρ = 0.93), decays over 11 m into the weathered
  top of the metagabbro basement, and picks out three basement runs that
  respond with no quartz detected.
topic: >-
  A second-harmonic log of a drill hole: Kurtz-Perry powder SHG screening of
  recovered core intervals as a fast downhole record of noncentrosymmetric
  phases across a basement-cover contact
