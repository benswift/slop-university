doi: 10.5555/slop.pjsmem
summary: >-
  A research poster from the School of Continuous Improvement models a firm's
  practice portfolio as binary choices linked by complementarities and asks how
  long one-practice-at-a-time improvement can run before no single change
  helps. It carries known local-search hardness and smoothed-analysis results
  across to the model, and on 212 complementarity graphs elicited from
  mid-sized manufacturers finds every portfolio settling within a few dozen
  changes, leaving long innovation persistence to a moving landscape rather
  than a slow climb up a fixed one.
topic: >-
  How long can continuous improvement last: the local-search complexity of
  firms upgrading one practice at a time over complementary practices, and why
  smoothed payoffs make long innovation persistence unlikely
