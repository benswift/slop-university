title: How Long Can Continuous Improvement Last?
subtitle: Improving paths when a firm upgrades one practice at a time, worst case and smoothed
authors:
  - Thandiwe Solberg
  - Bram Ntuli
  - Lindiwe Achterberg
preset: research-poster
school: School of Continuous Improvement
