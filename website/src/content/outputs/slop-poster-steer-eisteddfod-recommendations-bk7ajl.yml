summary: >-
  A research poster from the School of Emergent Priorities surveys 186
  suburban piano households whose teachers collect a weekly metronome-app
  screenshot, finding that time at the piano is only 34% of logged minutes
  and that kitchen-bench dinner is the next class at 22%. Mean weekly minutes
  separate a music-teachers' association's eisteddfod recommendation list;
  at-piano share does not. The association retained the minutes total as the
  ranking input.
