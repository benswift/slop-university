title: A Band, Not a Line
subtitle: Where a mosaic skin clone ends across the margins of 31 archived segmental epidermal naevi
authors:
  - Brynjar Obiora
  - Ragnhild Uzoma
preset: research-poster
school: School of Underlying Conditions
