summary: >-
  A research poster from the School of Underlying Conditions laser-microdissects
  21 epidermal columns at 0.2 mm steps across the visible margin of each of 31
  archived segmental epidermal naevi and deep-sequences each lesion's known
  variant. The clone thins over a band a median 1.2 mm wide, with high and low
  columns interleaved in 30 of the 31 transects, and moving the allele-fraction
  cutoff from 25 to 5 per cent shifts the margin outward a median 0.8 mm, where
  halving the sampling density shifts it a mean 0.15 mm.
topic: >-
  Where a mosaic skin clone ends: microdissected, deep-sequenced transects
  across the margins of archived segmental epidermal naevi show the variant
  clone thinning through a graded band of interdigitating columns rather than
  stopping at a line, so where the margin falls depends more on the
  allele-fraction cutoff than on the sampling interval
