summary: >-
  A research-showcase brochure from the School of Continuous Improvement pairs
  a suburban raffle table's four-kind prize taxonomy with the per-kind
  ticket-pricing tiers a fundraising committee has adopted from it, alongside
  companion features on a street library's withdrawal schedule and a produce
  swap's glut-forecasting register, and a showcase of seven published studies.
topic: >-
  a formal taxonomy classifying a club raffle's donated prize-table items into
  fixed kinds, adopted for per-kind ticket-pricing tiers, although the table
  has sold out at one flat price every year for decades
