summary: >-
  A marketing poster for the School of Emergent Priorities stages Senior
  Lecturer Ronja Oyelaran's retest of the Trajectory Analytics Group's
  chain-retailer priority-text finding at a supermarket loyalty desk, where a
  single afternoon of tier-appeal calls fails to reproduce the original's
  "nothing moves it" result. On the strength of that one afternoon, the Group
  is revising its own Priority Durability protocol to require a live appeal
  channel wherever a pre-set priority text runs anywhere in the University's
  advising and enrolment systems.
topic: >-
