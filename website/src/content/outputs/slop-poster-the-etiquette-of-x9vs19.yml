doi: 10.5555/slop.x9vs19
summary: >-
  A research poster from the School of Underlying Conditions reports fourteen
  months of participant observation on one peri-urban street of 58 households
  and five guava trees. Across 212 diary-recorded asks, leaves are asked for
  while fruit is offered, and the right to pick for oneself widens slowly, most
  of all for regular neighbours (28% to 61% of asks).
topic: >-
  the etiquette of asking for leaves: an ethnography of backyard guava trees as
  neighbourhood remedy, and the picking, gifting and owing around them on one
  peri-urban street
