title: A Few Leaves, If You Don't Mind
subtitle: Asking, picking and owing around backyard guava trees on one peri-urban street
authors:
  - Vigdis Emenike
  - Anneke Tolan
  - Eivind Onwuka
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-18
