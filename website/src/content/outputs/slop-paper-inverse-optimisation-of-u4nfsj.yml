title: The Calendar Remembers the Path
subtitle: >-
  Inverse Optimisation of a Periodic Market Schedule in an Upland Block
authors:
  - Ragnhild Uzoma
  - Bram Ntuli
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
