doi: 10.5555/slop.u4nfsj
summary: >-
  A paper from the School of Underlying Conditions and the School of
  Continuous Improvement prices the inherited weekly market calendar of
  twenty-three villages in one upland block against the circuits of sixty-one
  itinerant traders, finding it 18.9 per cent worse than the best calendar
  constructible on the present road network. Solving the inverse problem, the
  authors show the calendar is optimal against every pairwise exchange of
  days once seven of forty-one link costs are edited by 13.0 hours in total,
  and a field traverse identifies six of the seven as a disused pack route or
  the road or bridge that replaced one.
topic: >-
  Inverse optimisation of a periodic market calendar in an upland Indian
  block: recovering the travel network under which the inherited assignment
  of market days to villages is optimal for its itinerant traders
