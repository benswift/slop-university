title: Borrowing a Scale That Doesn't Travel
subtitle: >-
  A Failed Replication of the Pick-Up Reliance Scale in a Caravan-Park Camp
  Kitchen
authors:
  - Iben Chikere
  - Mirela Hanke
preset: paper
school: School of Emergent Priorities
date: 2026-08-25
publishedAt: "2026-08-25T05:05:15+10:00"
doi: 10.5555/slop.eczx28
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement re-tests the validated Pick-Up Reliance Scale at fourteen
  caravan parks, finding its four-factor structure travels to the camp
  kitchen while its signature school-gate finding, that chat-reliance
  predicts handover friction, does not.
topic: >-
  replicate the validated Pick-Up Reliance Scale in a new domain: does
  trusting a caravan park's camp-kitchen group chat over the physical
  cooktop-booking board predict the same handover friction among campers
  that chat-reliance predicted for co-parents, or does the instrument fail
  to travel
