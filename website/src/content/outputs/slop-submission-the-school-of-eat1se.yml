title: Learned From the Acknowledgements
subtitle: >-
  A submission from the School of Settled Matters to the Department of Policy
  Settings' consultation on Credit for Shared Preparations
authors:
  - Clemency Tredinnick
  - Odalys Penhallow
preset: submission
school: School of Settled Matters
date: 2026-11-21
publishedAt: "2026-11-21T07:00:47+11:00"
doi: 10.5555/slop.eat1se
summary: >-
  A submission from the School of Settled Matters answers six of the twelve
  questions in the Department of Policy Settings' review of the Shared
  Preparations Acknowledgement Guidelines 2019. Reading the Schedule 1 form of
  thanks as a genre that writers learn from the acknowledgements they read
  rather than from the instrument, it supports a limited Option 2, asks that
  the definition of a shared preparation be recast by function so that
  annotated text corpora and coded transcript sets come within it, and proposes
  that the form of words become a fixed statement of supply in place of a
  thanks.
topic: >-
