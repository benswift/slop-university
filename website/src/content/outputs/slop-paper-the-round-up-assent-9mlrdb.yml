title: Does Anyone Still Round Up at the Terminal?
subtitle: >-
  A Survey of Operator-Reported Assent at the Charity Prompt, and the
  Pitch-Withdrawal Rule Drawn From Its Lower Quartile
authors:
  - Solveig Adeyemi
  - Kwame Lindqvist
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-09-09
publishedAt: "2026-09-09T18:04:29+10:00"
doi: 10.5555/slop.9mlrdb
summary: >-
  A paper from the School of Continuous Improvement fields the round-up
  assent log with 814 supermarket, strip-mall and food-truck operators,
  reporting venue-typed distributions of the share of a typical shift that
  still taps Yes on the charity prompt (food-truck median 7 per cent,
  supermarket median 34 per cent; pooled lower quartile 6 per cent), and
  records the University's decision to withdraw next term's campus-market
  pitch from the 204 operators in that quartile, with no till-level
  override.
topic: >-
  The round-up assent log surveys supermarket, strip-mall and food-truck
  operators on how often a customer still taps Yes to the charity prompt,
  and now withdraws next term's campus-market pitch from the quartile that
  reported never.
