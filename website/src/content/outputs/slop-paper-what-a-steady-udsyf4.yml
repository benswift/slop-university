title: What a Steady Shot Costs
subtitle: Shadow Prices of the Crop Window in L1-Optimal Stabilisation of Footpath-Survey Video
authors:
  - Runa Adegoke
  - Casimir Beng
  - Bram Ntuli
preset: paper
school: School of Emergent Priorities
date: 2026-10-26
publishedAt: "2026-10-26T18:32:15+11:00"
doi: 10.5555/slop.udsyf4
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement treats the crop fraction of an L1-optimal video stabiliser as a
  resource, allocated across 214 kerb-to-kerb segments of a footpath-condition
  survey filmed from a bicycle handlebar. Equalising the crop's shadow price
  across concrete, paver and asphalt stretches lowers total camera-path cost by
  31% against the survey's uniform crop at the same budget, and a side
  constraint holding defect visibility to current practice keeps a 19%
  reduction.
topic: >-
  what a steady shot costs: the shadow price of the crop window in L1-optimal stabilisation of footpath-condition survey video shot from a bicycle handlebar camera, and how one crop budget should be split between slab-jointed concrete and asphalt stretches
