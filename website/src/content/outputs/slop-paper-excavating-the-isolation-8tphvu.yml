title: Where the Infected Ground Ended
subtitle: Lime, Post-Holes and the Plan at the Dividing Fence of a Nineteenth-Century Quarantine Station
authors:
  - Brynjar Obiora
  - Marek Solheim
preset: paper
school: School of Underlying Conditions
