summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities excavates three trenches and a 31-hole auger transect across the
  dividing fence of a nineteenth-century quarantine station, whose plan was
  reprinted unchanged for three decades. It finds a second fence set some
  eleven metres upslope into ground already limed, soil carbonate running five
  metres beyond that fence before falling to background, and the site's
  densest scatter of finds, half of it medicine-bottle glass, along the second
  fence's foot; the authors argue the station kept its edge as a limed band
  that the fence followed and the plan never recorded.
topic: >-
  excavating the isolation line of a nineteenth-century quarantine ground:
  where the lime, the post-holes and the plan disagree about the edge of
  infected ground
