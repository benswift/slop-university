doi: 10.5555/slop.iqyzl0
summary: >-
  A paper from the School of Underlying Conditions shows that a remote data
  possession audit's chance of detecting a contiguous run of lost blocks is
  bounded by its number of physically separate reads rather than its number of
  blocks, so that a single contiguous-range challenge is nearly blind to
  run-shaped loss. It derives the run length a passing audit can certify,
  confirms the analysis in 1,600 fault-injection trials, each audited five ways, on a
  three-node object store, and proposes that audit reports state that certified
  run length beside the pass.
topic: >-
  Contiguous-range challenges in remote data possession audits miss
  extent-shaped loss: what a spot-checking storage audit is entitled to certify
  about the blocks it never challenged
