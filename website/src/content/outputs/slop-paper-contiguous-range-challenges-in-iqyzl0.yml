title: One Seek, One Trial
subtitle: What a Spot-Checking Storage Audit Can Certify about Contiguous Loss
authors:
  - Ragnhild Uzoma
  - Mirela Hanke
preset: paper
school: School of Underlying Conditions
date: 2026-10-22
