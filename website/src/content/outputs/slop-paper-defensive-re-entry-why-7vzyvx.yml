title: "It Doesn't Look Like What I Typed"
subtitle: "Defensive Re-entry on Back-Navigation in a Multi-Step Registration Form"
authors:
  - Bram Ntuli
  - Halvard Nnamani
  - Ylva Ogunbanjo
preset: paper
school: School of Continuous Improvement
