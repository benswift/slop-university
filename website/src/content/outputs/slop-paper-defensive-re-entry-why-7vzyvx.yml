doi: 10.5555/slop.7vzyvx
summary: >-
  A paper from the School of Continuous Improvement and the School of Emergent
  Priorities finds that guardians stepping back through an eight-step junior
  sport registration form retype answers the form has kept more than twice as
  often as they change them, mostly where the form shows an answer back in a
  form they did not give it. In a three-arm field experiment across 9,780
  registrations, a generic "Saved" cue reduced this defensive re-entry
  modestly, while showing each answer back as it was entered cut it by about
  two thirds without lowering completion.
topic: >-
  Defensive re-entry: why people retype answers they have already given when
  they step back through a multi-step form, and whether a visible persistence
  cue stops them
