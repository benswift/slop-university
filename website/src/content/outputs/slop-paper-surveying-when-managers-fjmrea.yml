title: "Filed, Not Early"
subtitle: "A Survey of Performance-Review Filing Times at a Retail Chain, and the Four-Hour Lock That Followed"
authors:
  - Casimir Beng
  - Osei Vandermeer
  - Bram Ntuli
preset: paper
school: School of Continuous Improvement
date: 2026-09-24
publishedAt: "2026-09-24T19:01:54+10:00"
doi: 10.5555/slop.fjmrea
summary: >-
  A paper from the School of Continuous Improvement analyses anonymised
  submission-timestamp logs for 5,312 quarterly performance reviews filed
  by 1,406 department managers across a 214-store retail chain. Filings
  cluster overwhelmingly in the final hour before deadline regardless of
  store format or reminder timing; a subsequent pilot introducing a hard
  four-hour form-lock moves the network-average filing time earlier while
  the same crowding reappears against the new boundary, and the chain has
  scheduled the lock for unconditional network-wide rollout regardless.
topic: >-
  surveying when managers file performance reviews before the deadline
  across a retail chain, finding submissions massed in the final hour
  company-wide, and the auto-lock-with-escalating-alerts system introduced
  to force earlier filing
