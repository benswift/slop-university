summary: >-
  A research poster from the School of Emergent Priorities factor-analyses the
  six-pillar post-lesson feedback form used across a national driving-school
  chain, drawing on 9,140 learner ratings of 268 instructors at 41 branches
  between 2023 and 2025. Two factors are retained under every criterion tested:
  all six pillars load above .55 on the first, only route mix and test-readiness
  carry a second loading, and inter-pillar correlations run from .62 to .83.
  The lowest of an instructor's six pillar scores, against which the chain
  writes each quarterly development plan, changes identity across split halves
  of the same instructor's ratings for 61% of them.
topic: >-
  a factor analysis of post-lesson feedback ratings at a driving-school chain,
  where learner drivers score their instructor separately on six competency
  pillars that the chain's instructor dashboard reports as six bars and its
  quarterly ranking weights one by one, finding the six items collapse onto two
  factors --- roughly whether the learner enjoyed the hour and whether they feel
  closer to the test --- so the development plan each instructor is issued
  targets their lowest pillar, a number the data gives no separate existence
