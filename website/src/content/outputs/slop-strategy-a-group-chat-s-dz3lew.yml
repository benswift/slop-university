title: Tagged, Not Answered
subtitle: >-
  The 2026-2031 Strategic Plan Retires the Broadcast Tag as a Measure of
  Engagement and Publishes a Genuine Response Rate Instead
authors:
  - Lindiwe Achterberg
  - Bram Ntuli
preset: strategy
school: School of Emergent Priorities
date: 2026-09-28
publishedAt: "2026-09-28T13:00:10+10:00"
doi: 10.5555/slop.dz3lew
summary: >-
  Slop University's Strategic Plan 2026-2031 reports a null result from its
  own Mass Notification Response Index pilot --- the broadcast tag used
  across University-affiliated group chats makes no measurable difference to
  how many members actually respond --- and retires the tag as a measure of
  engagement across every University-affiliated digital channel, in favour of
  an independently audited Genuine Response Rate.
topic: >-
  A group chat's @here mass-notification tag makes no difference to how many
  members actually respond, tracked by Slop University's Mass Notification
  Response Index (MNRI) pilot and reported as a plain null result with no
  proposed fix.
