title: A Bus-Stop Flag That Stops Listing Routes at Five Does Not Change How Often Strangers Speak
authors:
  - Anouk Mensah
  - Fenna Okoro
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
date: 2026-09-19
publishedAt: "2026-09-19T22:01:12+10:00"
doi: 10.5555/slop.ohh1ss
summary: >-
  A paper from the School of Emergent Priorities carries the group-chat
  read-receipt discontinuity to the roadside bus-stop flag, which lists route
  numbers until a fifth route is served and then reads MULTIPLE ROUTES. Across
  118 stops and 5,912 waiting passengers, remarks to strangers are unchanged at
  the cutoff (+0.02 per passenger per ten minutes, 95% CI -0.07 to +0.11), and
  the School responds by setting every flag it advises to read MULTIPLE ROUTES
  whatever the number of routes served.
topic: >-
  A roadside bus-stop flag lists every route number until a fifth route is added
  and then switches to the words MULTIPLE ROUTES, and the University replicates
  its group-chat read-receipt finding at that line, sending tally-clicker
  observers to 118 stops to test whether waiting passengers at the bare-wording
  stops speak to strangers less often than passengers at stops that list every
  route.
