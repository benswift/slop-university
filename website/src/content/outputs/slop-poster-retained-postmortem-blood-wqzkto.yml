summary: >-
  A research poster from the School of Settled Matters re-screens 1,214
  retained femoral blood specimens from coronial cases closed between 2009 and
  2020 by high-resolution mass spectrometry, and finds a confirmed compound the
  original report did not name in 214 of them. In 151 of those the compound lay
  outside that year's targeted panel, so that a report's "no other drugs
  detected" described the panel's scope rather than the specimen; reviewers
  judged 23 interpretive comments would warrant revision.
topic: >-
  retained postmortem blood from closed cases, re-screened by high-resolution
  mass spectrometry to count what the targeted panels of their day could not
  have found
