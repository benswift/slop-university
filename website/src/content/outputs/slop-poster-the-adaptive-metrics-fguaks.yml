title: Replicating the Register Effect
subtitle: A 38-Forum Field Replication of the Share-House Incident-Register Finding
authors:
  - Marit Osayande
  - Renke Sabel
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
