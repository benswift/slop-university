doi: 10.5555/slop.fguaks
summary: >-
  A research poster from the School of Continuous Improvement reruns, across
  38 suburban residents' forums in 19 matched pairs, an earlier share-house
  finding that a written incident register makes later quarrels cite a logged
  incident more than four times as often. Forums with a pinned known-issues
  thread cite earlier problems at a ratio of 1.05 over those without, so the
  effect does not reproduce, and the Adaptive Metrics Lab's forum checklist
  keeps the pinned-thread requirement and lengthens any thread that goes
  uncited.
topic: >-
  The Adaptive Metrics Lab re-runs the share-house finding that a written
  incident register makes later quarrels cite a logged incident four times as
  often, this time across suburban residents' forums with and without a pinned
  known-issues thread, and does not reproduce it: forums with the pinned
  thread cite prior incidents no more often, yet the register guidance stays on
  the books.
