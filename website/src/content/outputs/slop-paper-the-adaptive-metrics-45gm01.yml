doi: 10.5555/slop.45gm01
summary: >-
  A paper from the School of Continuous Improvement introduces the Sightline
  Readiness Maturity Model, a five-level instrument scoring 214 bus stops,
  car-park boom gates, and school pickup lines on kerbside occlusion from a
  vision-language reading of existing camera footage, and reports the
  Adaptive Metrics Lab's decision to withdraw retrofit-fund eligibility from
  any site scoring below Level 3.
topic: >-
  The Adaptive Metrics Lab scores pedestrian sightline occlusion at the bus
  stop, the car-park boom gate, and the school pickup line against a
  five-level Sightline Readiness Maturity Model built from vision-language
  occlusion analysis of kerbside camera footage, and withdraws
  bollard-and-mirror retrofit funding from any site scoring below Level 3
