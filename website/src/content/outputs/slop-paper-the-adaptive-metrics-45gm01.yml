title: Towards a Sightline Readiness Maturity Model
subtitle: Occlusion at the Bus Stop, the Car-Park Boom Gate, and the School Pickup Line
authors:
  - Sten Okwuosa
  - Sunniva Balogun
  - Tove Ilesanmi
preset: paper
school: School of Continuous Improvement
date: 2026-09-25
