title: Argued Until Marked
subtitle: When a staff college's school solutions to reused tactical decision exercises stop being contested
authors:
  - Odalys Penhallow
  - Ingeborg Nwachukwu
  - Anselm Threlkeld
preset: research-poster
school: School of Settled Matters
date: 2026-11-09
publishedAt: "2026-11-09T02:32:19+11:00"
doi: 10.5555/slop.ybvyta
summary: >-
  A research poster from the School of Settled Matters reads 1,912 syndicate
  debrief sheets for 146 tactical decision exercises reused across twenty
  course years of one staff college's command-and-staff course, finding that
  school solutions to assessed exercises stopped being contested by a median
  third sitting and those to unassessed exercises by the sixth, that 44 of 61
  settled solutions citing a later-revised doctrine note were reissued
  unchanged, and that 27 of 39 reopenings followed the solution author's
  posting out.
topic: >-
  How a staff college's school solutions to reused tactical decision exercises
  stop being contested: an event-history reading of two decades of syndicate
  records
