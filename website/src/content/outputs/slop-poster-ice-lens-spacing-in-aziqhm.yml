doi: 10.5555/slop.aziqhm
summary: >-
  A research poster from the School of Underlying Conditions freezes 36
  repacked soil cores from one end at four controlled rates and measures the
  spacing of the ice lenses that form across them. In the silt-loam cores the
  spacing falls from 3.1 mm to 0.6 mm as the freezing stage runs eight times
  faster; the clay cores band more finely and lose their lenses at the fastest
  rate, and the sandy-loam cores form none at all.
topic: >-
  Ice-lens spacing in directionally frozen cores repacked from the School's
  reference soil profiles: how lens periodicity follows freezing rate across
  three horizon textures
