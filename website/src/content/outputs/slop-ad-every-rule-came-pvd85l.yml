summary: >-
  A marketing poster for the School of Settled Matters pictures a lone boulder
  left by the ice on a bare upland, a field reader kneeling at it with a hand
  lens, and offers the School's provenance work on statutory provisions copied
  from one jurisdiction into another as the campaign's substance. Developed for
  bus-stop panels and campus digital signage in a portrait rotation.
