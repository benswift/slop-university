summary: >-
  A research poster from the School of Continuous Improvement draws 42 tungsten
  oxide electrochromic films from one peroxotungstic acid sol at seven ages
  across forty days, with thickness and anneal held constant. Optical
  modulation at 633 nm widened from 43 to 59 points by day 20 and narrowed to
  42 by day 40 as the bleached state stopped clearing, while bleaching time
  more than doubled and the sol's colloids grew from about 4 to 19 nm.
