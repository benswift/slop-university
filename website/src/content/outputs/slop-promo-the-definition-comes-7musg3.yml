summary: "Associate Professor Kwame Lindqvist, Director of the Master of Priority
  Studies, sets out in his own words the gap his research occupies: the stretch between
  a priority receiving its budget and receiving its definition. Three of his most-cited
  papers, on a tailoring shop's turnaround guarantee, a retail chain's review software
  and a campus parking scorecard, serve as its cases in point. The profile closes
  on the body of work that has made him the most cited researcher in the School of
  Emergent Priorities."
topic: "a promo profile of Associate Professor Kwame Lindqvist, the most cited researcher
