title: What the Carriageway Left
subtitle: >-
  Traffic Metals in the Topsoil of Eighteen Closed Rural Road Reserves
authors:
  - Clemency Tredinnick
  - Brynjar Obiora
  - Ragnhild Uzoma
preset: research-poster
school: School of Settled Matters
