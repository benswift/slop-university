doi: 10.5555/slop.8fwcso
summary: >-
  A research poster from the School of Settled Matters samples the topsoil of
  18 rural road reserves on one granite plateau, closed between 1964 and 2023
  and since returned to pasture, as a chronosequence dated by each closure. It
  finds verge lead enrichment unchanged across six decades, the zinc, antimony
  and copper excesses halving in roughly 18 to 39 years and mostly moving down
  the profile, and the lead maximum sitting 3 to 6 m off the surveyed
  centreline on four reserves, where the formed road had strayed from the
  plan.
topic: >-
  Lead, zinc, copper and antimony in the topsoil of closed rural road reserves,
  sampled across a chronosequence of closures to ask how long each traffic
  metal stays after the road is gone
