title: Before the Spare Is Fetched
subtitle: Towards a Replacement Interval for the Burnt-Out Ceiling Globe, from a Survey of 412 Households
authors:
  - Tove Ilesanmi
  - Kwame Lindqvist
  - Petra Umbile
preset: paper
school: School of Emergent Priorities
date: 2026-10-04
publishedAt: "2026-10-04T08:01:38+11:00"
doi: 10.5555/slop.6e8vtf
summary: >-
  A paper from the School of Emergent Priorities surveys 412 households on 28
  suburban streets about the last ceiling globe to fail in their home, finding
  days unreplaced right-skewed (median 9, 90th percentile 71) with a weekend
  lump, a room gradient from 3 days in kitchens to 17 in hallways and
  stairwells, and no effect of stepladder ownership or ceiling height. The
  University has fixed an Eleven-Day Interval before which no failed globe in
  its own corridors, stairwells or common rooms may be replaced.
topic: >-
  The burnt-out household ceiling globe, surveyed across suburban homes as
  distributions of days left unreplaced, spare globes on hand and the room
  affected, and the Eleven-Day Interval the University sets as the earliest a
  failed globe in its own corridors may be replaced
