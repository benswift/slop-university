summary: >-
  A paper from the School of Emergent Priorities treats the tea-room's
  eight-hook catalogue rail as a naturally occurring cutoff, finding afternoon
  coat survival falls 41.6 percentage points at the first overflow chair, and
  reports the School's decision to collect overflow at 16:30 and to gate
  covered-cloakroom allocation on a rolling overflow share below 0.12.
topic: >-
  Does the eighth coat-hook in the tea-room reallocate whose jacket is still on
  the chair at five?
