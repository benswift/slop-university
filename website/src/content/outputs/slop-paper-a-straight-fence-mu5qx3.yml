summary: >-
  A paper from the School of Underlying Conditions budgets the subdivision of
  one 46-hectare paddock on a wheat and sheep farm, where a sandy loam rise
  grades into a clay flat across a transition that 105 auger holes put at 68
  metres wide. A straight fence returns a net $1,005 to $1,609 a year
  depending on where in the transition it stands; the best line lies 41 metres
  from the surveyed boundary and is worth $264 a year more, and a fence bent
  to follow the soil costs more than it recovers.
topic: >-
  a straight fence through a gradual soil: a partial budget for subdividing
  one mixed farm's paddock along a mapped soil boundary, and what the
  transition zone costs whichever side of the wire it lands on
