title: Towards a Threshold Every Tradesperson Can See
subtitle: >-
  A program/campaign signage piece for the Master of Applied Measurement
  intake, built around an interview study of home-service tradespeople and
  the booking-app rating line that decides whether they're found
authors:
  - Dagny Okafor
  - Sten Okwuosa
preset: marketing-poster
school: School of Continuous Improvement
date: 2026-09-18
