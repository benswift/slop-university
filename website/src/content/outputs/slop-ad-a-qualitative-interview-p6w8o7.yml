doi: 10.5555/slop.p6w8o7
summary: >-
  Interviews with home-service tradespeople on a local booking-review app
  describe, in their own words, how crossing a 4.6-star threshold changes
  which jobs the app's search ranking shows them. The Master of Applied
  Measurement's intake campaign built around the finding now anchors the
  University's own Approved Contractor Panel to the same cutoff, with no
  exception carried past a single review cycle.
topic: >-
