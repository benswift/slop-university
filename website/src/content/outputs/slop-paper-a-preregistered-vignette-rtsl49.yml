title: Nobody Asked
subtitle: A Preregistered Test of the Negation Rule in Readers of a Committee Candidate's Statement
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
  - Solveig Adeyemi
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
publishedAt: "2026-10-12T21:29:12+11:00"
doi: 10.5555/slop.rtsl49
summary: >-
  A paper from the School of Underlying Conditions and the School of Continuous
  Improvement reports a preregistered experiment in which 644 adults read one
  election statement by a candidate for the committee of a fictional storage
  cooperative. A denial of misconduct that nobody had asked for raised readers'
  estimates that the candidate had done the thing denied, more so when pressed
  emphatically, while the same denial given in answer to a question was largely
  excused; a week later, readers who had forgotten the question no longer
  excused it.
topic: >-
  A preregistered vignette experiment testing the psychoanalytic account of
  negation in a political setting: whether readers take a fictional committee
  candidate's unprompted denial as evidence of the thing denied, and whether a
  denial given in answer to a question is spared
