title: Clicked into the Drill
subtitle: >-
  Copper-Catalysed Grafting of a Fluorogenic Coumarin onto Retired Workwear
  Cotton, and Its Retention over Fifty Fleet Laundry Cycles
authors:
  - Edda Nwafor
  - Halvard Nnamani
  - Thandiwe Solberg
preset: paper
school: School of Continuous Improvement
date: 2026-11-03
publishedAt: "2026-11-03T19:01:17+11:00"
doi: 10.5555/slop.qry32k
summary: >-
  A paper from the School of Continuous Improvement grafts a fluorogenic
  coumarin by copper-catalysed azide-alkyne cycloaddition onto cotton drill cut
  from twelve retired rented work trousers, then stitches paired swatches into
  sixty in-service garments of the same fleet. After a median of 52 recorded
  washes the grafted swatches keep 80.6% of their initial fluorescence against
  3.7% for the same triazole merely adsorbed, and garments laundered more
  before retirement take up more of the alkyne handle and so more dye, without
  holding it any better.
topic: >-
  copper-catalysed azide-alkyne grafting of a fluorogenic coumarin onto
  propargylated cotton drill cut from retired rented workwear, and how much
  triazole-bound fluorescence survives fifty fleet laundry cycles against an
  adsorbed control
