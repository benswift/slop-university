summary: >-
  A research poster from the School of Underlying Conditions seats 84
  cohabiting couples on a load-cell bench and tells them that one partner must
  shortly give a speech, chosen by coin toss. The clear gap between partners
  narrows from 27 cm at rest to 15 cm by the toss, the more anxiously attached
  partner making 70% of the movement, and widens to 23 cm within a minute of
  it, whichever partner drew the speech.
topic: >-
  the gap on the waiting bench: couples told one of them must shortly give a
  speech close the distance between them on an instrumented bench, the more
  anxiously attached partner doing most of the moving, and the gap reopens
  within a minute of the coin toss that decides who speaks
