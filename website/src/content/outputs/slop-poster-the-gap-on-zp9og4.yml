title: The Gap on the Waiting Bench
subtitle: Couples Move Closer While Waiting to Learn Who Must Speak, and Apart Once a Coin Decides
authors:
  - Vigdis Emenike
  - Gunnhild Ekwueme
  - Eivind Onwuka
