summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement treats a council waste-transfer station's rounded weight-fee
  brackets as a natural regression-discontinuity design, finding that loads
  bunch just below each bracket line and that crossing one by the narrowest
  margin predicts a nearby illegal-dumping report within 48 hours. The
  transfer station's Waste and Recycling Coordination Unit has responded with
  a permanent checkpoint for repeat near-threshold visitors.
topic: >-
  Does a council waste-transfer station's rounded weight-fee bracket, not a
  household's actual load, decide who gets flagged at the checkpoint it
  prompted?
