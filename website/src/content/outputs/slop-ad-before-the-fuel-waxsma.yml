summary: >-
  A marketing poster for Slop University announces a public session of the
  Futures in Committee seminar series this spring, at which Dr Brynjar Obiora of
  the School of Underlying Conditions speaks on algae, standing water and the
  ground a fuel pond sits on. Developed for bus-stop panels and campus digital
  signage, it pictures a raceway pond at first light above a cutaway of the
  strata that hold it.
