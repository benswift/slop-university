summary: >-
  A case-for-support brochure from the School of Underlying Conditions invites
  donors and partners to back its close reading of macrophage migration
  inhibitory factor, a signal named for the cell it keeps still, alongside its
  catchment fieldwork and the collection of core, logs and archived screens on
  which its research depends. It rests its case on seven published studies
  cited by title and DOI.
