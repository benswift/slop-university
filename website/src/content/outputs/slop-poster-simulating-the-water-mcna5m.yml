title: The Probe Is the Slug
subtitle: Dip-Meter Entry as an Unintended Slug Test in Narrow Monitoring Bores
authors:
  - Vigdis Emenike
  - Casimir Beng
preset: research-poster
school: School of Underlying Conditions
date: 2026-11-15
