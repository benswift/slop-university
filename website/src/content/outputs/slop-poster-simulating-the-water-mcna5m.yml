doi: 10.5555/slop.mcna5m
summary: >-
  A research poster from the School of Underlying Conditions treats the plunge
  of a dip-meter probe past the water surface as an unintended slug test,
  combining axisymmetric volume-of-fluid simulation, 360 bench plunges and 312
  paired field dips across eight monitoring bores. Every plunge sets the water
  column ringing, and the first re-find contact reads high by a median 0.6 to
  1.1 mm in 100 mm casing but 7 to 14 mm in 32 mm casing, an offset that a
  90-second hold before the re-find removes.
topic: >-
  Simulating the water column a dip-meter probe disturbs on entry to a narrow
  monitoring-bore casing, and how far above the resting level the first contact
  reads
