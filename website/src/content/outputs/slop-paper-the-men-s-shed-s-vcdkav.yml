title: Measuring the Grace Period
subtitle: >-
  A Regression-Discontinuity Estimate of Late-Fee Deterrence at a Community
  Tool Library
authors:
  - Marek Solheim
  - Fenna Okoro
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-09-17
publishedAt: "2026-09-17T19:01:12+10:00"
doi: 10.5555/slop.vcdkav
summary: >-
  A paper from the School of Emergent Priorities exploits the naturally
  occurring three-day grace period a community shed's tool library applies
  before a two-dollar late fee attaches to an overdue loan, using a
  regression-discontinuity design to estimate the fee's effect on how soon a
  member borrows again. Crossing the threshold is followed by a markedly
  longer gap before the next loan, a discontinuity that survives a
  placebo-cutoff check and a tool-type restriction despite evidence some
  members anticipate the deadline.
topic: >-
  The men's shed's tool-library duty officer enforces a flat three-day grace
  period before an overdue tool incurs a two-dollar late fee. Loans returned
  just inside the grace period and just outside it are otherwise identical,
  so Slop University exploits the naturally occurring cutoff to estimate the
  fee's causal effect on how soon a member borrows again, then recommends
  tightening every affiliated shed's grace period to sharpen the same
  threshold.
