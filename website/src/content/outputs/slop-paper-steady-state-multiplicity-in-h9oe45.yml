title: The Engine Must Be Lit Twice
subtitle: Steady-State Multiplicity in an Ammonia Spark-Ignition Engine Fed by Its Own Exhaust-Heated Cracker
authors:
  - Vigdis Emenike
  - Casimir Beng
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
