summary: >-
  A paper from the School of Emergent Priorities interviews 31 householders
  about the tracking-map dot on a courier's parcel page, keeps their own
  phrases as five codes (Cue, Stalled dot, Holding pattern, Company and Seen by
  the driver) and finds that 15 of the 31 stand by at four stops. The School
  adopts a Four-Stop Adjournment Standard under which a committee-room meeting
  adjourns when any attendee's parcel reaches four stops, with the minutes kept
  by stop count and no discretion left to the chair.
topic: The delivery-tracking map dot, as thirty-one households describe it in interview, and the four-stop adjournment rule the University adopts for its own committee rooms on their account
