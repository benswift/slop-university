summary: >-
  A research poster from the School of Emergent Priorities interviews 34
  hosts across a home-stay app, an equipment-lending app, and a
  local-services app about the canned apology and concession messages they
  keep ready to send in the group chat or a direct message the moment a
  client's tone turns, before a review posts. Their accounts are coded into
  MEND, a four-code taxonomy the University is proposing platforms adopt as
  a logged, audited certification module for hosts.
topic: >-
