doi: 10.5555/slop.wo80bz
summary: >-
  A research poster from the School of Underlying Conditions has 48 residents
  of a former sandstone-quarry town sort photographs of 22 main-street
  frontages into their own stone and stone brought in, and sets each sort
  against the frontage's documented provenance. Weathered stone is claimed
  whatever its quarry, while the town's own sandstone re-cut in the last decade
  is mostly sorted as brought in, so that belonging is read off the surface
  rather than the source.
topic: >-
  the stone that looks like ours: a photo-elicitation study in one former
  quarry town, where residents sort main-street facades into local and imported
  by their weathering rather than their provenance, so freshly cut local
  sandstone reads as foreign and colour-matched imported stone as home
