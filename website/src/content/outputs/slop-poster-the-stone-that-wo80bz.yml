title: The Stone That Looks Like Ours
subtitle: Weathering, provenance and belonging on a former quarry town's main street
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
  - Ylva Onyekwere
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-29
