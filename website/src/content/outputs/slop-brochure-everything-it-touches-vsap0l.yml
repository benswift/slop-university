summary: >-
  A research-showcase brochure follows tannin across the University's three
  Schools, from the soil profile and the monitoring bore through the
  fermentation room where tannase is grown to the assay bench where a
  protein-binding molecule must be told apart from a genuinely active one. It
  features seven published studies by title and DOI, from a simulated tannase
  optimisation to an extract whose activity vanishes when it is fractionated.
topic: >-
