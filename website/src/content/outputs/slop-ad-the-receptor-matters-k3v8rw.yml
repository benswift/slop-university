summary: >-
  A marketing poster presents the University's research on receptors and the
  animals of the soil through five glass columns of repacked soil on a night
  laboratory bench, each holding a burrow drawn to a different depth. The
  campaign hooks on the School of Underlying Conditions' research poster on
  serotonin receptor blockade and earthworm burrowing across five soil
  textures, and is prepared for the landscape signage panels in matched light
  and dark renderings with a short reading list from the University's
  published record.
