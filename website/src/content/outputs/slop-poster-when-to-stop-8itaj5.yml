title: The Price of a Missed Study
subtitle: A Value-of-Information Stopping Rule for Title-and-Abstract Screening
authors:
  - Ylva Onyekwere
  - Halvard Nnamani
  - Runa Adegoke
preset: research-poster
school: School of Emergent Priorities
date: 2026-11-06
publishedAt: "2026-11-06T15:02:03+11:00"
doi: 10.5555/slop.8itaj5
summary: >-
  A research poster from the School of Emergent Priorities replays fourteen
  completed systematic reviews under a stopping rule that ends abstract
  screening once the next batch's expected yield, priced in reviewer-hours per
  missed study, falls below the time it takes to read, and finds that a
  forty-fold spread in the prices review teams set moved the stopping point by
  a median five percentage points.
topic: >-
  When to stop screening: a value-of-information stopping rule for
  title-and-abstract screening in systematic reviews, weighing the expected
  cost of a missed eligible study against the reviewer-hours of reading the
  rest of the pile
