title: Book the Course or Book the Week?
subtitle: Intake Wait and Course Continuity under Three Booking Policies in a Two-Cabinet Phototherapy Unit
authors:
  - Vigdis Emenike
  - Bram Ntuli
preset: paper
school: School of Underlying Conditions
date: 2026-11-07
