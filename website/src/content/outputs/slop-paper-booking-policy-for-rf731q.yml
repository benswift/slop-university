doi: 10.5555/slop.rf731q
summary: >-
  A paper from the School of Underlying Conditions models a hospital
  phototherapy unit's two cabinets as forty pattern-slots and compares rolling
  weekly booking, whole-course block-booking and block-booking with reserved
  make-up rows by simulation over a two-year horizon. Block-booking raises the
  intake wait without reducing mid-course gaps, since 97 per cent of gaps span
  a unit closure or a week the patient declared away; two reserve rows a day
  cut the share of courses with a gap by about a quarter while the median
  wait rises from about five days to eighteen.
topic: >-
  booking policy for thrice-weekly psoriasis phototherapy courses in a
  two-cabinet hospital unit: an operations-research model trading intake wait
  against mid-course gaps
