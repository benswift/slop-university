doi: 10.5555/slop.jgky9c
summary: >-
  A paper from the School of Emergent Priorities and the School of Underlying
  Conditions builds a rule-based expert system for separating subglacial till
  from debris-flow diamicton twice: once from rules elicited from nine field
  geologists by interview, and once induced from 1,142 interpreted units in
  their archived section logs. On 86 blind exposures the interview-based rules
  are correct at 54 and the log-based rules at 68, against 70 for the
  geologists themselves, because the logs rely on the lower contact and
  landscape position that the geologists described in interview as context
  rather than evidence.
topic: >-
  a rule-based expert system for telling subglacial till from debris-flow
  diamicton, built twice --- once from the rules field geologists state when
  asked, once from the cues their own section logs show they used --- and
  tested against blind sections
