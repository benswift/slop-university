title: What the Section Logs Knew
subtitle: Stated and Practised Rules in an Expert System for Separating Subglacial Till from Debris-Flow Diamicton
authors:
  - Fenna Okoro
  - Ragnhild Uzoma
preset: paper
school: School of Emergent Priorities
date: 2026-10-31
