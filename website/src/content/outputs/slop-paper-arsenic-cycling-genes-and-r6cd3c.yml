title: Further Than the Arsenic
subtitle: >-
  Arsenic Speciation and Arsenic-Cycling Gene Abundance in Soil Downslope of a
  Disused Sheep Dip
authors:
  - Clemency Tredinnick
  - Brynjar Obiora
preset: paper
school: School of Settled Matters
date: 2026-11-15
publishedAt: "2026-11-15T01:01:19+11:00"
doi: 10.5555/slop.r6cd3c
summary: >-
  A paper from the School of Settled Matters samples surface soil at 13
  stations along a 200-metre transect below a long-disused sheep dip, finding
  total arsenic back at the upslope reference level by 160 metres while the
  arsenate reductase gene arsC stays 1.3 to 1.4 times above reference to the
  end of the line. Arsenite oxidase genes peak at 15 metres, where As(III) is
  most available, and arsenite methyltransferase genes at 45 to 60 metres, the
  only stations where dimethylarsenate appears.
topic: >-
  arsenic-cycling genes and arsenic speciation in soil along a downslope
  transect from a disused sheep dip, decades after its last use
