doi: 10.5555/slop.euosln
summary: >-
  A research poster from the School of Continuous Improvement reports a
  14-week single-site case study of a quick-service franchise outlet, finding
  that eleven of twenty-two new-hire onboardings had the shift supervisor
  read the mandatory safety-and-service quiz aloud rather than let the new
  hire attempt it, concentrated almost entirely on Friday dinner rushes. The
  onboarding tablet still records a completed quiz either way.
topic: >-
  waiving the onboarding quiz for a new hire when the Friday dinner rush
  leaves no time for a real attempt
