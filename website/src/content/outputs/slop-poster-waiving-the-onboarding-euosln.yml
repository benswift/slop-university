title: Waiving the Quiz
subtitle: A Case Study in Franchise Onboarding Under a Short-Staffed Roster
authors:
  - Thandiwe Solberg
  - Ingeborg Nwachukwu
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-26
