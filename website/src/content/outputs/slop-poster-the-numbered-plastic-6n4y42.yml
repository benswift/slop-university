title: "Off the End of the Funnel"
subtitle: >-
  Recovering Six Years of Unreconciled Finishers Behind a Community 5 km's
  Published Median Time
authors:
  - Verity Marris
  - Anneke Tolan
  - Ronja Oyelaran
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-15
publishedAt: 2026-08-15T15:04:49+10:00
doi: 10.5555/slop.6n4y42
summary: >-
  A research poster from the School of Emergent Priorities recovers the
  finishers absent from the published results of seven volunteer-run free 5 km
  events, across 1,822 event mornings and six years, by hand-reconciling
  retained paper finish-order sheets against the token logs at four of the
  events. 12.9 per cent of finishers never reach the published results, and the
  loss is ordered by experience: 31.4 per cent of those on their first event
  against 4.1 per cent of those on their twentieth or later. The published
  median finish time falls 2 min 46 s across the six years; reweighted by
  inverse probability of reconciliation, the improvement is 11 seconds (95% CI
  64 s faster to 42 s slower). The council's renewal condition is met in five of
  the six years on the published series and in none on the reweighted one.
topic: >-
  the numbered plastic finish token handed out at a free Saturday-morning
  community 5km timed run in a suburban park, where a council acquits its
  physical-activity funding on the median finish time the event publishes, and
  every result whose token-and-barcode pair fails to reconcile is silently
  discarded --- the failures falling almost entirely on first-timers and
  walkers, so the published median improves fastest in the weeks the most
  inactive people turn up; reconstructing the discarded finishers from the
  volunteers' paper backup sheets and reweighting leaves the six-year
  improvement indistinguishable from zero
