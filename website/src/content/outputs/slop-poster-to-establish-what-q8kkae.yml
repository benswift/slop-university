title: "“Didn’t Want Them Thinking It Was Just Them”"
subtitle: >-
  First-Hand Experience Among “Same Here” Repliers on a Neighbourhood Forum,
  and a Repair Queue That Counts Them
authors:
  - Verity Marris
  - Fenna Okoro
  - Marek Solheim
preset: research-poster
school: School of Emergent Priorities
date: 2026-10-01
publishedAt: "2026-10-01T20:01:57+10:00"
doi: 10.5555/slop.q8kkae
summary: >-
  A population survey of 386 households that answered a neighbour's "is it
  just me?" post with "same here" finds that 32% replied from the thread alone
  and 55% report at least one sighting, with the share ranging from 29% for a
  drain smell to 80% for a missed bin. The School of Emergent Priorities
  enters each reply as 0.55 of a sighting for a suburban council's works desk,
  which confirms a fault at six replies without inspection and closes a fault
  with five or fewer after 14 days, with no inspector override.
topic: >-
  To establish what share of households replying 'same here' to a
  neighbourhood-forum 'is it just me?' post have experienced the thing
  themselves, surveyed as distributions, and to bind a council repair queue to
  the reply count
