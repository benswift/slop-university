doi: 10.5555/slop.4i8fjf
summary: >-
  A paper from the School of Emergent Priorities treats a strip-mall
  dry-cleaner's posted ten-o'clock same-day cutoff as a sharp
  regression-discontinuity assignment across 31 shops and 8,818 tickets,
  finding garments handed in just before the cutoff spend 1.62 additional
  hours on the priority rail. Internal print, transcription, and
  equipment-loan requests received before 10:00 are now bound to a published
  same-day rail, with the Trajectory Analytics Group convening the assignment
  register.
topic: >-
  Although the strip-mall dry-cleaner's same-day service is posted as a
  ten-o'clock courtesy, a quasi-experiment at the cutoff finds that garments
  on the priority rail come back slower than the ordinary ones
