summary: >-
  A research showcase from the School of Underlying Conditions presents the
  University's work on aquatic reproduction as a study of the ground the next
  generation is laid down on: the spawning gravel read as a soil profile, the
  groundwater that reaches a hatchery tray from below, and the estuary flat
  where restoration plantings are revisited years on. Seven published outputs
  from three Schools, each cited by title and DOI, carry the account.
topic: >-
