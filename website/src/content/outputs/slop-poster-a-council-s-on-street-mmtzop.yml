summary: >-
  A research poster from the School of Emergent Priorities audits four
  on-street parking pay-station models deployed across nineteen council
  blocks, finding the grace period before a compliance officer can issue an
  infringement is set by the machine rather than the street, and that a
  mixed block's fine rate converges with the citywide mean within three
  weeks of being standardised to a single grace-period setting.
topic: >-
  a council's on-street parking pay stations enforce a short,
  machine-specific grace period after a ticket expires before a compliance
  officer can issue an infringement, but the grace period differs by machine
  model along the same block, so two cars parked meters apart overstay by
  the same number of minutes and only one gets fined; a natural
  quasi-experiment comparing overstay-fine rates before and after a
  mixed-model street was standardised to a single grace period
