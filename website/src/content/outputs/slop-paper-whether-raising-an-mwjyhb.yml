title: Raised the Number, Not the Tip
subtitle: >-
  Testing Whether a Staggered Payment-Terminal Default Change Raised What
  Bike-Repair Customers Left, or Only What Staff Believed They Had
authors:
  - Casimir Beng
  - Mirela Hanke
preset: paper
school: School of Continuous Improvement
date: 2026-08-12
publishedAt: "2026-08-12T10:02:14+10:00"
doi: 10.5555/slop.mwjyhb
summary: >-
  A paper from the School of Continuous Improvement tracks tipping across a
  nine-shop independent bike-repair chain as its payment terminals receive a
  staggered suggested-tip default increase, finding measured tips rise by 1.6
  percentage points while tip incidence is unchanged, and that staff's own
  estimate of customer generosity rises roughly five times faster than the
  measured change and continues to diverge for a full quarter.
topic: >-
  Whether raising an independent bike-repair chain's payment-terminal
  suggested tip percentage actually raises what customers leave, or just
  relabels what they were leaving anyway, tested through a staggered default
  change across its shops and checked against staff's own sense of how
  generous their customers have become.
