title: Twenty-Four Hours, Give or Take Six
subtitle: >-
  Hours post-fertilisation in one zebrafish facility's protocol binders,
  1998–2024
authors:
  - Anselm Threlkeld
  - Odalys Penhallow
  - Sunniva Balogun
preset: research-poster
school: School of Settled Matters
date: 2026-11-19
publishedAt: "2026-11-19T13:30:46+11:00"
doi: 10.5555/slop.jx7bku
summary: >-
  A research poster in the history and philosophy of science from the School of
  Settled Matters reads fourteen editions of one zebrafish facility's protocol
  binder and 2,316 dated clutch-sheet entries against its incubator temperature
  logs, and finds that for 612 entries from a 25 °C overflow incubator "24 hpf"
  meant 24 hours on the clock until 2005, then, after a 2006 edition taped a
  staging plate inside the front cover and dropped "at 28.5 °C" from its
  definitions page, came to mean the 24-hour embryo at about 30 hours elapsed,
  with both readings left unflagged in the same column.
topic: >-
  how 'hours post-fertilisation' turned from a clock reading into a stage name
  in one zebrafish facility's protocol binders, traced by a historian of science
  against the facility's incubator logs
