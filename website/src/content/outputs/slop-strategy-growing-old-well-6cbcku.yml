summary: >-
  Slop University's Strategic Plan 2026-2031 brings its research on oxidative
  ageing, the care of a mid-century estate and the support of lengthening
  careers under three focus areas. It founds a living collection of purslane
  gathered from the opened joints of the campus paving, a condition survey
  that reads each slab from beneath, and a managed-colonisation protocol under
  which no joint is repaired until its plant has been accessioned.
