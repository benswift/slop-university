title: Where One Formula Ends
subtitle: Tolerance-Based Deduplication of Display Equations in a Soil Survey's Typeset Report Archive
authors:
  - Brynjar Obiora
  - Ylva Ogunbanjo
preset: paper
school: School of Underlying Conditions
date: 2026-10-30
publishedAt: "2026-10-30T03:00:31+11:00"
doi: 10.5555/slop.iwts78
summary: >-
  A paper from the School of Underlying Conditions extracts 9,318 display
  equations from the 418 LaTeX sources of one regional soil survey's report
  archive and reduces them, through a ladder of exact equivalences ending in
  symbolic identity, to 1,322 distinct formulae. It shows that a tolerance on
  rounded coefficients cannot by itself say when two formulae are one, and
  that assigning formulae to a covering set of reference formulae matches the
  authors' adjudicated judgements about as well as the two authors matched
  each other.
topic: >-
  deduplicating the typeset formulae of a soil survey's report archive, and
  the non-transitive tolerance that decides when two equations are one
