summary: >-
  A research poster from the School of Settled Matters runs a ten-cell zero-gap
  CO₂ electrolyser stack from one Z-type inlet manifold at a single shared
  current and samples each cell's outlet separately. At 1.5× stoichiometric
  feed the tenth cell receives 61% of the first cell's CO₂ and its ethylene
  Faradaic efficiency falls from 43% to 18%, the decline beginning at cell 7;
  exchanged cathodes take on the selectivity of their new position, and the
  spread closes to 5 points at 4× feed.
topic: >-
  per-cell CO2 supply along the shared inlet manifold of a ten-cell zero-gap
  CO2 electrolyser stack, and how much ethylene selectivity the cells at the far
  end lose to hydrogen when the whole stack runs at one shared current
