title: Last in the Manifold
subtitle: CO₂ starvation and ethylene loss along a ten-cell zero-gap electrolyser stack
authors:
  - Clemency Tredinnick
  - Vigdis Emenike
  - Brynjar Obiora
preset: research-poster
