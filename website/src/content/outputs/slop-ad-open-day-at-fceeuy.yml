summary: >-
  A marketing poster for Slop University announces the School of Underlying
  Conditions' part in Open Day this spring, hosted by Associate Professor
  Ragnhild Uzoma, with the core shed's racks of drill core and its recovery
  ledger as the attraction. Composed for the portrait signage rotation, it
  borrows the lender's vocabulary of recovery and written-down loss for the
  intervals a drill run fails to return, and points to three of the School's
  published papers.
topic: >-
  open day at the core shed --- the School of Underlying Conditions invites the
