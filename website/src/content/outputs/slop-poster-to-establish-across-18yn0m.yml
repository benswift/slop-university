title: Towards a Seventh Shift for the Keys
subtitle: How many shadowed shifts pass before a casual starter is trusted to close?
authors:
  - Bram Ntuli
  - Ingeborg Nwachukwu
  - Dagny Okafor
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-03
publishedAt: 2026-10-03T02:00:55+10:00
doi: 10.5555/slop.18yn0m
summary: >-
  A research poster from the School of Continuous Improvement reports a survey
  of 1,138 supervisors across 412 cafés, franchise outlets, bars, restaurants
  and shops on how many shadowed shifts precede a casual starter's first
  unaccompanied close, finding a pooled median of seven shifts and, in bars and
  restaurants, two camps at three and fifteen. Campus food and retail outlets
  are bound to issue keys at the close of the seventh shadowed shift, entered in
  the offer letter at hire.
topic: >-
  To establish, across supervisors in cafés and franchise outlets, the
  distribution of shadowed shifts before a new starter is first trusted with the
  keys, and to fix the University's induction allowance for casual staff at the
  shift count where most supervisors say 'you're right to close'
