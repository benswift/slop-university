doi: 10.5555/slop.ht28f2
summary: >-
  A paper from the School of Continuous Improvement follows one regional
  public-transport operator's uniform wear trial through fourteen months of
  observation, 187 returned scorecards and 31 interviews, and argues that the
  trial made fit evaluable by sampling its cohort from the outgoing contract's
  order book, scoring fit apart from comfort and appearance, and crediting home
  laundering to the garment. Its weighted result, 3.74 against 3.69 on a
  five-point scale, was minuted as a trial that did not discriminate, and the
  contract was decided on price.
topic: >-
  wear trials in corporate uniform tenders, where a pilot cohort's comfort
  scorecards decide which garment is bought: an STS ethnography of how the test
  makes fit evaluable
