summary: >-
  A case note from the School of Underlying Conditions on a first-instance
  patents judgment that read a polymorph claim's enthalpy-of-fusion floor at
  the one heating rate its specification disclosed, so that three of eight
  production lots of a single crystal form fell inside the claim and five
  outside it. The note argues the parameter was offered to identify the form,
  not to bound it.
topic: >-
  characterised by an enthalpy of fusion: a case note on a patents court
  construing a polymorph claim whose parameter moves with the DSC heating rate
