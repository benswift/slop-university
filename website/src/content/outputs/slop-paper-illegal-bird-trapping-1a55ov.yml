title: Where the Trough Overflows
subtitle: Illegal Bird-Trapping Sign at Artificial Water Points in a Semi-Arid Pastoral District
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-14
publishedAt: "2026-10-14T05:00:56+11:00"
doi: 10.5555/slop.1a55ov
summary: >-
  A paper from the School of Underlying Conditions surveys 46 stock water points
  on nine pastoral leases for physical sign of illegal bird trapping, across 368
  site-visits in two dry seasons with two observers searching independently.
  Sign is concentrated at few water points and is strongly associated with an
  overflow pool beside a trough whose float valve no longer seals (odds ratio
  9.4), more weakly with road access, the lessee's visiting interval and the
  late dry season, and not at all with depth to groundwater; where lessees
  replaced the valve between seasons, sign-positive visits fell from 14 of 20 to
  3 of 20.
topic: >-
  illegal bird trapping sign at leaking stock bores in a semi-arid pastoral
  district: a place-based routine-activity survey of artificial water points,
  read against bore hydrographs and float-valve condition
