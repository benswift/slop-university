doi: 10.5555/slop.kftt8j
summary: >-
  An art-historical paper from the School of Continuous Improvement reads the
  143 hand-tinted section sheets on which a regional water board's drawing
  office recorded its dye-tracing experiments between 1911 and 1968, and
  follows where three successive colourists laid the green of the tracer.
  Before 1930 the green fills the resurgence pool on 43 of 46 sheets; by the
  last period it is a ruled band along the conjectured conduit on 55 of 58,
  while the spring where the dye was actually seen is painted the blue of
  ordinary water.
topic: >-
  technical art history of a water board's hand-tinted karst cross-sections:
  the green of a fluorescein dye trace migrating from the painted resurgence
  spring into the conjectured conduit
