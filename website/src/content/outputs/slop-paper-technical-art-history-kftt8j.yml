title: The Green Went Underground
subtitle: Colour, Witness and Conjecture in a Water Board's Hand-Tinted Trace Sheets, 1911–1968
authors:
  - Bram Ntuli
  - Vigdis Emenike
preset: paper
school: School of Continuous Improvement
