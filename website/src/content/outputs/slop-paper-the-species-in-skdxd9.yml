doi: 10.5555/slop.skdxd9
summary: >-
  A paper from the School of Settled Matters and the School of Underlying
  Conditions camera-traps all eighteen fauna crossing structures on a
  duplicated rural highway for a year, two decades after construction, and
  reads each against the target species its condition of approval named. The
  named target passed through 11 of the 18 structures: every one whose
  condition gave a species and a design specification, but only one of the
  five covered by a stage-wide species list, with use also rising with the
  intact length of exclusion fencing near the portal.
