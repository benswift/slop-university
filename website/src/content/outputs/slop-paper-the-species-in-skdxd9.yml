title: The Species in the Condition
subtitle: >-
  Target-Species Use of Eighteen Fauna Crossing Structures Two Decades After a
  Highway Duplication
authors:
  - Anselm Threlkeld
  - Vigdis Emenike
preset: paper
school: School of Settled Matters
