summary: >-
  A brochure from the School of Continuous Improvement showcases a
  natural-experiment finding on tea-room biscuit-plate replenishment ---
  timed not to the roster but to whether the coffee queue has passed the
  doorway pillar that blocks the plate from view --- alongside a sample of
  the University's published research and its researchers.
topic: >-
  the tea-room duty officer replenishes the biscuit plate on a different
  clock depending on whether the coffee queue has snaked past the doorway
  pillar that blocks the plate from view
