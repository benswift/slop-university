doi: 10.5555/slop.2q9bhi
summary: >-
  A research poster from the School of Continuous Improvement retests the
  earlier finding that drivers re-enter an EV-charging queue to be quoted a
  shorter wait, at six open-plan helpdesk floors over fourteen weeks and 3,940
  tickets. Pooled reopen share creeps from 4% to 8%, well under the
  pre-registered 15% threshold, and the helpdesk keeps its reopen lockout in
  force pending a second replication.
topic: >-
  An office helpdesk portal's reopen button, retested as a queue-reset device
  against the earlier finding that drivers re-enter an EV-charging queue to be
  quoted a shorter wait, at open-plan helpdesk counters where the rejoin does
  not reproduce
