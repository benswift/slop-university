title: The Reopen Button as a Queue Reset
subtitle: A Failed Replication of Strategic Re-Entry at Open-Plan Helpdesk Counters
authors:
  - Bram Ntuli
  - Sten Okwuosa
  - Dagny Okafor
preset: research-poster
school: School of Continuous Improvement
