summary: >-
  A research poster from the School of Continuous Improvement mines 41,600
  merged pull requests and two years of meeting invitations at a mid-sized
  software firm that redrew its teams around its services. Org-chart
  congruence held after the reorganisation, while review congruence fell from
  0.66 to 0.48 within eighteen months, falling first in the services later
  merged back into their former teams.
topic: >-
  an empirical software-engineering study of an inverse-Conway reorganisation: mining two years of commit, code-review and calendar data at an invented mid-sized firm that redrew its teams around its service boundaries, tracing how review authority drifted back to the old reporting lines before the org chart did
