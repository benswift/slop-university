title: The Sentence Was Already Written
subtitle: Five Years of the School of Continuous Improvement Turning Volunteer
  Contribution Into a Citable Record, and Tracing Whose Testimonial Gets
  Reused
authors:
  - Renke Sabel
  - Sten Okwuosa
  - Marit Osayande
  - Dagny Okafor
