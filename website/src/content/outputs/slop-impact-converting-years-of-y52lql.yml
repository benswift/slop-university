summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 traces five
  years of turning volunteer contribution into a citable record, and finds
  that a testimonial written for one recognition round is disproportionately
  likely to be the one reused for the next, compounding whose contribution
  counts as visible.
topic: >-
  converting years of unpaid committee and volunteer work into one portable,
  citable contribution record, and how a written testimonial, once used,
  gets recycled from one recognition round to the next -- compounding whose
  contribution counts as visible
