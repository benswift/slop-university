summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 presents four
  case studies from its work alongside receptor-pharmacology laboratories:
  between-bench rounds that narrowed the reported fading of response at a tenth
  repeated application from a spread of more than forty percentage points to
  seven, vehicle-only applications interleaved to separate an instrument's drift
  from a preparation's tolerance, and a Living Dashboard panel whose weekly
  openings fell to one-thirteenth of its first week by week 31. It closes with a
  Capability Sprint for laboratory managers and a register of the School's own
  recurring reminders.
topic: >-
