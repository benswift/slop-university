title: Towards a Fully Ticketed Cupboard
subtitle: A 14-Month Single-Site Case Study of Stationery Requisition Practice
authors:
  - Lindiwe Achterberg
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
