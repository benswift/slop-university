summary: >-
  A paper from the School of Emergent Priorities reports a 14-month
  single-site case study of one open-plan office's stationery cupboard,
  tracking its passage from a hand-written honesty ledger to a digital
  priority-queue ticketing system. Formal ticket compliance settles at a
  steady two-thirds of weekly requisitions, concentrated by item category,
  and a six-week reminder-email ablation changes nothing measurable.
topic: >-
  the office stationery cupboard's slow drift from a hand-written honesty
  system to a priority-queue ticketing app that everyone quietly worked
  around
