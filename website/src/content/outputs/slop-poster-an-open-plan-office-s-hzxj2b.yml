summary: >-
  A research poster from the School of Emergent Priorities cross-references
  desk-pressure sensors against badge-reader logs across three open-plan
  office floors, classifying 214 desk-shifts into a quadrant typology of
  badge-tap compliance against observed occupancy, finding a fifth of
  occupied desks lacked a compliant tap and were reassigned mid-shift
  regardless.
topic: >-
  an open-plan office's hot-desk booking app auto-releases any desk not
  badge-tapped within fifteen minutes of a shift's start to the next person
  in the queue, whether or not the original booker is already sitting there
  working
