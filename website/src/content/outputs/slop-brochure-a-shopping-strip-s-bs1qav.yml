summary: >-
  A marketing brochure for the Schools of Continuous Improvement and Emergent
  Priorities surveys seven published studies of a reading that outgrew the
  instrument behind it. The campaign opens on a shopping strip's parking
  meters, whose turnover reading has become a trader association's
  business-vitality index for rent reviews, moving as much with app-payment
  glitches and meter-avoidance as with actual foot traffic.
