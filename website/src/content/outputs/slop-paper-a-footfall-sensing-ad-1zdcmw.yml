summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement reports BEAM, a field-deployed system that prices a bus
  shelter's two advertising faces from passive footfall sensing and
  reallocates the shelter's single bench to whichever face clears the higher
  nightly settlement price. Across a twelve-week, fourteen-shelter corridor
  trial the roadway-facing side's share of bench-nights fell from 55% to
  21%, and the corridor operator has since indexed network-wide bench
  placement to the settlement price with no manual override.
