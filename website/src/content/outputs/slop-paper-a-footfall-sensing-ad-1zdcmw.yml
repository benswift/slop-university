title: Counted, Not Seated
subtitle: A Field-Deployed Footfall-Sensing Ad Panel That Prices a Bus Shelter's
  Two Faces and Reallocates Its One Bench to Whichever Earns More
authors:
  - Anneke Tolan
  - Casimir Beng
  - Mirela Hanke
