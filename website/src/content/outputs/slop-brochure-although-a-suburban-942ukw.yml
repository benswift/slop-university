summary: >-
  A marketing brochure from the School of Continuous Improvement profiles a
  complexity-scored task-routing engine, piloted at a suburban men's shed and
  now spreading to sports clubs, choirs, and allotment associations, that
  reads each member's self-reported skill blurb to decide who gets which job.
topic: >-
  Although a suburban men's shed's job board had matched jobs to members by a
  glance at the whiteboard for decades, the School of Continuous
  Improvement's new complexity-scored task-routing engine -- parsing each
  member's self-reported skill blurb for its vocabulary complexity -- now
  decides who gets the simple jobs and who gets the hard ones, and plain
  speakers keep drawing the worst of it
