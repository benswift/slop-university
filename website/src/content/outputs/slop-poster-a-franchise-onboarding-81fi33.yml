title: Does the Engagement Index Know Who's Paying Attention?
subtitle: A Failed Replication of a Self-Assessment Gap in Franchise Onboarding
authors:
  - Marek Solheim
  - Mirela Hanke
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-29
publishedAt: "2026-08-29T21:04:24+10:00"
doi: 10.5555/slop.81fi33
summary: >-
  A research poster from the School of Emergent Priorities attempts to
  replicate an earlier University finding that self-assessed confidence
  diverges from an independently logged measure, this time inside a
  franchise onboarding programme. Self-rated confidence and the platform's
  Engagement Index converge from a 34-point gap to 3 points across 214 new
  hires and 38 outlets over nine months, a pattern traced to outlets coaching
  the viewing behaviour the Index rewards rather than to improved
  self-awareness.
topic: >-
  A franchise onboarding app's Engagement Index attempts to reproduce an
  earlier Slop University finding that self-rated confidence diverges from
  a logged performance measure, and instead finds the two converging almost
  exactly once outlets start coaching new hires on how to clear the pass
  threshold
