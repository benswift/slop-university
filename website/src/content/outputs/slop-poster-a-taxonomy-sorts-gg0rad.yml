summary: >-
  A research poster from the School of Emergent Priorities codes 340
  doorstep-alert posts across nine neighbourhood-forum streets into a
  five-kind taxonomy, finding that three trigger kinds now fire an unpaid
  patrol's automatic dispatch with near-perfect fidelity, and confirm a
  genuine safety concern in barely a fifth of those call-outs.
topic: >-
  A taxonomy sorts every "someone's at the door" safety-alert post on a
  neighbourhood forum into one of five alert kinds, and the street's
  volunteer patrol roster adopts kind-membership as its automatic dispatch
  trigger
