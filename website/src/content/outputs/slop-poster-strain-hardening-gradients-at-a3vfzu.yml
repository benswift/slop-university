summary: >-
  A research poster from the School of Emergent Priorities sections the 52
  teaspoons of a single tearoom drawer and compares indentation hardness and
  electron backscatter diffraction maps along the handles of the 31 never-bent
  spoons and the 21 that had been bent and pressed straight. The straightened
  spoons carry a hardened zone confined to the first 12 mm from the neck, at
  3.18 GPa against 2.41 GPa with grain size unchanged, and four of them carry
  two such zones side by side.
topic: >-
