summary: >-
  A brochure from the School of Continuous Improvement treats an electricity
  retailer's peak-to-off-peak tariff boundary as a naturally occurring
  cutoff, finding household dishwasher start times cluster sharply at the
  line, and reports the Indicator Commons adopting the same cutoff as the
  reference schedule for every University-managed kitchen.
