summary: >-
  A research poster from the School of Continuous Improvement sorts three
  seasons of hand-me-down guernsey-number succession at seventeen junior
  sports clubs into a four-kind taxonomy, and reports a trial association's
  adoption of that taxonomy as the sole basis for next season's
  team-selection order.
topic: >-
  Although a junior sports club insists a guernsey number passes to whoever's
  turn it is, hand-me-down succession records sort into a four-kind taxonomy
  the club has adopted as a binding lock on next season's team-selection
  order
