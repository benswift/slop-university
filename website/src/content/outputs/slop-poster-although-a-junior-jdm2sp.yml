title: Hand-Me-Down Guernsey Numbers Sort Into Four Kinds
subtitle: A Taxonomy From Junior Sports Club Handover Records
authors:
  - Thandiwe Solberg
  - Torun Ezeigwe
  - Ingeborg Nwachukwu
