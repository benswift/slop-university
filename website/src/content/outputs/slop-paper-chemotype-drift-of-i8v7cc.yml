title: Twelve Regenerations of One Accession
subtitle: A Loss-of-Function Allele at a Kauniolide Synthase-like Locus Drifts to Majority in an Ex Situ Asteraceae Collection
authors:
  - Lindiwe Achterberg
  - Brynjar Obiora
preset: paper
school: School of Emergent Priorities
date: 2026-11-02
publishedAt: "2026-11-02T00:00:33+11:00"
doi: 10.5555/slop.i8v7cc
summary: >-
  A paper from the School of Emergent Priorities and the School of Underlying
  Conditions grows 113 plants from the deposit lot and four retained
  regeneration samples of one provisional Asteraceae seed accession, and finds
  that a null allele at its kauniolide synthase-like locus rose from 0.21 to
  0.58 over twelve regenerations, leaving a third of plants with no guaianolide
  lactone. An effective population of about a dozen plants per regeneration,
  set by unequal seed contributions to a bulked harvest, accounts for the rise
  without selection.
topic: >-
  chemotype drift of sesquiterpene lactones across repeated seed-bank
  regenerations of a single Asteraceae accession
