title: Pinned Up
subtitle: Five Years of the School of Continuous Improvement Carrying the Design Crit into Dashboards, Forms and Review Templates
authors:
  - Osei Vandermeer
  - Mirela Hanke
  - Bram Ntuli
preset: impact-report
school: School of Continuous Improvement
