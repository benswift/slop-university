summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 looks back on
  five years of carrying the design-studio crit into measurement, across four
  areas: 38 collaborators' dashboards pinned up and cut to about half their
  panels, enrolment and other forms reviewed field by field along a corridor
  wall, a studio stream in the Master of Applied Measurement, and review
  templates brought to the wall until, in 2025, the School's own artefacts took
  more sessions than its collaborators'.
topic: >-
  five years of the School carrying the design-studio crit out of the art
  school: pinning up dashboards, forms and indicator instruments on a wall and
  reviewing them with collaborators the way design schools review student work
