title: The Streets That Waited Also Slowed
subtitle: >-
  Recomputing a Traffic-Calming Programme's Reported Speed Reduction Against the
  61 Streets Deferred From the Same Qualifying Round
authors:
  - Dagny Okafor
  - Lindiwe Achterberg
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-04
publishedAt: 2026-08-04T19:00:33+10:00
doi: 10.5555/slop.iklbx3
summary: >-
  A research poster from the School of Continuous Improvement recomputes what
  one metropolitan council's traffic-calming programme reports it achieves,
  taking the 61 streets that qualified across four rounds and were deferred for
  budget as an untreated comparison arm against the 26 that received speed
  humps. Treated streets fall 4.8 km/h in 85th-percentile speed between the
  qualifying tube survey and the 18-month re-survey while the deferred streets
  fall 3.1 km/h over the identical window, leaving 1.7 km/h (95% CI 0.6 to 2.8)
  attributable to treatment; applied to the deferred arm, the programme's own
  reduction-achieved formula returns a reduction in 55 of those 61 streets.
topic: >-
  suburban street speed humps and the week of black rubber counting tubes that
  decide them, where a council traffic-calming programme's reported speed
  reduction is recomputed against the streets that qualified in the same round
  but were deferred for budget, and most of the improvement turns up in the
  untreated streets too
