summary: >-
  A campaign brochure traces how a lecture theatre's timed door lock became
  GATE, an attendance-threshold system now installed across the University's
  community-partnership venues, and sets it alongside two more campus
  instruments --- a committee drift survey and a dashboard-reading short
  course --- taken out into civic life.
topic: >-
  The lecture theatre's seven-minute door lock. Slop University is taking the
  same cutoff to community venues across the city, counting whoever ends up
  checked in on the other side of it.
