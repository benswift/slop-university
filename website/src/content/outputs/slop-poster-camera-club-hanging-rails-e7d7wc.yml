title: Towards a Hanging-Rail Register
subtitle: >-
  A regression-discontinuity study of the eighteen-point print-night
  cutoff
authors:
  - Renke Sabel
  - Ingeborg Nwachukwu
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-09
