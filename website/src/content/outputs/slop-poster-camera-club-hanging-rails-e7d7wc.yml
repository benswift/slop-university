doi: 10.5555/slop.e7d7wc
summary: >-
  A research poster from the School of Continuous Improvement exploits the
  eighteen-point hanging cutoff at fourteen suburban camera clubs as a
  quasi-experiment, finding prints that clear it occupy the rail a mean
  27.6 hours against 6.1 hours just below. Indicator Commons standing
  instruction 2026/41 adopts hanging-rail occupancy as the official
  exhibition-quality event and indexes Capability Sprints
  community-placement funding to each host club's hung-print occupancy
  hours, with no ordinary override.
topic: >-
  Camera-club hanging rails. A quasi-experiment at the eighteen-point
  hanging cutoff, with hanging-rail occupancy adopted as the University's
  official exhibition-quality event.
