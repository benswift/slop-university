summary: >-
  A marketing poster shows a student at a teaching-lab bench holding a mineral
  crystal to the window while a ball-and-stick lattice climbs the room behind
  them, and invites prospective students to study crystallography and
  mineralogy in the School of Underlying Conditions. Set for the portrait
  signage panels, light and dark, it closes on three of the School's published
  outputs on crystals and the materials made of them.
