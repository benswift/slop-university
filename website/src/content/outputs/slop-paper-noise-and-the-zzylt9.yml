title: The Precedent Mode
subtitle: >-
  Estimation Noise and the Spreading of a Land Trust's Holdings across
  Covenant-Burdened Parcels
authors:
  - Clemency Tredinnick
  - Odalys Penhallow
preset: paper
school: School of Settled Matters
date: 2026-11-12
