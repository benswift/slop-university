doi: 10.5555/slop.zzylt9
summary: >-
  A paper from the School of Settled Matters treats a land trust's spread of
  holdings across covenant-burdened parcels as a disordered system, estimating
  the covariance of parcel re-marks from the court decisions on record. One
  collective mode, the joint motion of parcels sharing a covenant wording,
  stands clear of the random-matrix noise; for a register of 140 parcels and
  163 decisions the optimised spread carries about seven times the variance of
  the true optimum, which a long-only constraint cuts to under twice at the
  cost of zero weight on a third of the parcels.
topic: >-
  noise and the precedent mode: a random-matrix and replica reading of how a
  land trust spreads its holdings across covenant-burdened parcels, and why the
  spread cannot be optimised once parcels outnumber the settlements that tested
  them
