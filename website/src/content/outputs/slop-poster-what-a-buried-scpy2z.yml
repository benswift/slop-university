summary: >-
  A research poster from the School of Underlying Conditions resurveys eighteen
  transects across one reinstated gas pipeline right-of-way through six dryland
  wheat paddocks for five seasons, pairing cone penetration resistance to 60 cm
  with hand-cut yield quadrats. The trench returns to 97% of control yield by
  the third season, while the construction traffic lane reaches only 81% by the
  fifth, over a compacted layer at 30–40 cm that lies below the depth of the
  reinstatement rip.
topic: >-
  what a buried gas pipeline leaves in a paddock: subsoil compaction and wheat
  yield across the trench, working side and spoil side of an unnamed
  right-of-way, resurveyed for five seasons after reinstatement
