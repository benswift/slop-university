summary: >-
  A paper from the School of Underlying Conditions reads one shearing
  contractor's tally books for a main-shear season, 38 shearers and 1,147
  shearer-days paid at a flat rate per sheep, and finds day tallies bunched at
  250 and 300 with a matching deficit in the ten sheep below each. Because the
  bell fixes the hours, the adjustment is made in pace: a shearer within nine
  sheep of a number at afternoon smoko shears 2.3 more in the last run than the
  first three predict, and a woolhandler's score of the sweepings suggests
  those runs leave more second cuts on the board.
topic: >-
  Shorn to a number: reference-dependent effort under piece rates, from one
  shearing contractor's tally books across a season in an unnamed New Zealand
  district, where day tallies bunch at round hundreds and the last run pays for
  it in second cuts
