summary: >-
  A research poster from the School of Continuous Improvement documents a
  high-street traders' co-op's nightly settlement engine, built to clear
  loyalty points earned at any of fourteen member shops for redemption at
  any other. Across 61 settlement weeks the ledger closes above zero in 58,
  and the co-op now funds a standing running-cost levy from the surplus
  rather than auditing the tie-breaking rule that produces it.
topic: >-
  a high-street traders' co-op builds and operates a nightly settlement
  engine that clears loyalty points earned at any member shop for redemption
  at any other, discovers its own tie-breaking rule for simultaneous
  redemptions leaves a small non-zero surplus every cycle, and adopts that
  leftover as the co-op's standing running-cost levy rather than patching
  the algorithm
