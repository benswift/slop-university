summary: >-
  A case-for-support brochure led by the School of Settled Matters asks
  partners to endow the University's reference collection of coal: every rank
  from peat to anthracite, held as lumps, cores and polished blocks, with the
  cokes, chars, tars, ashes and slags kept beside the coals that produced them.
  It sets out the collection's stewardship of specimens that oxidise and are
  re-polished on the shelf, and cites seven published studies by title and DOI.
