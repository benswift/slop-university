summary: >-
  A case-for-support brochure led by the School of Continuous Improvement
  invites partners to back the University's work on choices made against more
  than one criterion, in features on how weights are set and calibrated, how
  an organisation orders priorities that compete, and how options that tie on
  the evidence come to be separated and signed. It rests its case on eight
  published studies from all four Schools, cited by title and DOI.
topic: >-
  weigh it all: a case for supporting the University's work on choosing among
  options when the criteria pull apart, from the weighting panel and the
  shortlist to the tie and the decision someone has to sign
