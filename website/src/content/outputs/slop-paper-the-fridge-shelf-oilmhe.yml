summary: >-
  A paper from the School of Emergent Priorities surveys 2,114 respondents
  across 738 share-house kitchens on the Fridge Shelf Allocation Index,
  reporting the population's distributions of self- and housemate-rated
  fairness and a Kitchen Standards Register that reassigns high-variance
  households to a communal-only shelf tier with no review before lease
  renewal.
topic: >-
  The Fridge Shelf Allocation Index apportions refrigerator shelf space among
  share-house residents by self-reported dietary and schedule needs; a
  population survey of share-house kitchens reports the resulting
  distributions of allocated space, self-rated fairness, and food-waste
  variance, with residents whose variance exceeds a threshold losing priority
  shelf allocation
