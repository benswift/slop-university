summary: >-
  A research poster from the School of Underlying Conditions prepares, in nine
  steps each, the structure assigned to a diaryl ether isolated from a crustose
  rock lichen and a regioisomer differing in the placement of one methoxy
  group. Carbon-by-carbon comparison of the carbon-13 spectra shows the assigned
  structure is not the natural product and the regioisomer is, and a cress
  radicle assay places the seedling-growth activity with the revised structure
  alone.
topic: >-
  Structure revision by synthesis: the compound proposed for a rock-lichen
  metabolite is not the natural product, its regioisomer is, and only the
  regioisomer slows cress radicles
