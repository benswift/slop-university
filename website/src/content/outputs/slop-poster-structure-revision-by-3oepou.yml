title: The Proposed Structure Is Not the Natural Product
subtitle: Synthesis, structure revision and seedling-growth activity of a rock-lichen diaryl ether
authors:
  - Vigdis Emenike
  - Brynjar Obiora
  - Ragnhild Uzoma
preset: research-poster
school: School of Underlying Conditions
