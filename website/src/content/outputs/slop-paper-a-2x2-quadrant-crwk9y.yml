title: Towards a Rounding Integrity Register
subtitle: A Quadrant Classification of the Small-Commerce Change Shortfall
authors:
  - Mirela Hanke
  - Casimir Beng
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-09-28
publishedAt: "2026-09-28T17:00:56+10:00"
doi: 10.5555/slop.crwk9y
summary: >-
  A paper from the School of Continuous Improvement classifies the
  point-of-sale change shortfall --- where a cash total rounds to the
  nearest five cents and a card total does not --- into a four-cell
  quadrant crossing rounding direction against whether the EFTPOS terminal
  logs the adjustment, and reports a trading-precinct co-op's audited
  subsidy-eligibility rule inverting the quadrant's ranking within twelve
  weeks, concentrated in the sites the subsidy reaches.
topic: >-
  A 2x2 quadrant framework naming four ways small-commerce tills
  (supermarket self-checkouts, strip-mall traders, food trucks) resolve a
  no-exact-change shortfall, crossing whether the rounding favours the
  customer or the trader against whether the EFTPOS terminal's ledger
  records the adjustment automatically or the trader enters it by hand;
  the resulting quadrant gates a shared EFTPOS-fee subsidy scheme's
  eligibility on a fixed quarterly cycle with no appeal
