title: Until Further Notice, Explained
subtitle: Tove Ilesanmi on why the date on a club's temporary notice brings forward
  the meeting that makes it permanent
authors:
  - Tove Ilesanmi
preset: video-explainer
school: School of Emergent Priorities
date: 2026-10-19
publishedAt: "2026-10-19T22:43:53+11:00"
doi: 10.5555/slop.ffcvj7
summary: A research explainer from the School of Emergent Priorities on Tove Ilesanmi's
  doctoral thesis about the arrangements volunteer-run clubs mark as temporary. It
  follows a card taped to a lawn bowls club's kitchen cupboard, still on the door
  at the last of thirty months of visits, through a census of every notice at nine
  clubs and nineteen months of monthly follow-up. Ilesanmi describes the fieldwork
  and his argument himself, and the thesis's Provisional Arrangements Register closes
  it.
topic: A research explainer of the doctoral thesis following the arrangements nine
  volunteer-run clubs mark as temporary, from a fortnightly photographic census of
  every notice on display to 269 arrangements followed monthly for nineteen months
  and 34 interviews, finding that arrangements whose notice named an end-point were
  confirmed as permanent more than twice as fast with no change in their rate of reversal,
  and that 51 of the 63 reaching the meeting their notice named were confirmed there,
  and closing on the thesis's recommendation of a published register whose entries
  are confirmed automatically at an unresolved review date
