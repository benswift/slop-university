summary: >-
  A research-showcase brochure introduces Dr Fenna Okoro's
  correspondence-classification pipeline, which promotes a shire council's
  routine complaint letters into its own live risk register and places any
  flagged code section under mandatory review with no route back off the
  register except a full council vote, and sets the work beside recent
  Slop University findings on committees, instruments, and the everyday
  paperwork of governance.
topic: >-
  Build a text-classification pipeline that promotes a council's routine
  correspondence and complaint letters straight into its own live risk
  register, with any code section drawing three flags in a quarter placed
  under mandatory review with no delisting except by full council vote.
