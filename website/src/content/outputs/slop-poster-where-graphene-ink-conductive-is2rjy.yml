title: The Wash Was Never the Problem
subtitle: >-
  Graphene-ink tracks on polycotton workwear across 100 commercial laundry
  cycles
authors:
  - Edda Nwafor
  - Eivind Onwuka
  - Thandiwe Solberg
preset: research-poster
school: School of Continuous Improvement
date: 2026-11-19
publishedAt: "2026-11-19T15:02:37+11:00"
doi: 10.5555/slop.is2rjy
summary: >-
  A materials-science poster from the School of Continuous Improvement prints
  graphene-ink conductive tracks down the plackets of 60 polyester-cotton work
  shirts and sends them through five routes on one contract laundry's line for
  100 cycles each, counting cycles from each shirt's own tag. Tracks that are
  washed and line- or tumble-dried end at a median normalised sheet resistance
  of 1.7 or below, while every route through the steam tunnel finisher ends
  above 6, unwashed finisher-only shirts close behind the full route, and 71%
  of transverse cracks lie within 40 mm of the hanger's shoulder line.
topic: >-
  Where graphene-ink conductive tracks printed on polycotton workwear actually
  fail across a hundred commercial laundry cycles: the tunnel finisher, not the
  wash
