title: Nests Dug by Hand
subtitle: Conservator of Fauna v The Hatchery Association and the Thing a Wildlife Statute Calls a Nest
authors:
  - Eskil Nwabueze
preset: paper
school: School of Continuous Improvement
date: 2026-10-30
publishedAt: "2026-10-30T09:02:15+11:00"
doi: 10.5555/slop.7qanwf
summary: >-
  A case note from the School of Continuous Improvement on a divided appellate
  decision holding that a volunteer association destroyed the nest of a
  protected animal when it moved marine turtle clutches to a shaded hatchery,
  because a turtle's nest is the incubating chamber and its sand rather than the
  eggs. The note supports the majority's reading of the statute in the light of
  temperature-dependent sex determination, and argues that the same reasoning
  makes the chambers the volunteers dug by hand in the hatchery nests too,
  bringing hatchery practice within the Act.
topic: >-
  a doctrinal case note on an appellate decision holding that a sea turtle
  'nest' protected by a wildlife statute is the incubating sand chamber rather
  than the clutch, so that relocating eggs to a hatchery destroys a nest even
  when every egg hatches
