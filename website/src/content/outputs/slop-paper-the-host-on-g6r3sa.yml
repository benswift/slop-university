title: The Host on the Label
subtitle: >-
  A Mixed Syntype Series in Pyxidogaster tortricivora [Anonymous], 1897
  (Hymenoptera: Braconidae: Microgastrinae), with Lectotype Designation and
  Description of the Reared Species
authors:
  - Clemency Tredinnick
preset: paper
school: School of Settled Matters
date: 2026-11-11
publishedAt: "2026-11-11T15:32:18+11:00"
doi: 10.5555/slop.g6r3sa
summary: >-
  A paper from the School of Settled Matters examines the six syntypes of a
  microgastrine braconid wasp named in 1897 for the habit of its one reared
  example, and recovers COI mini-barcodes from five of them. The reared
  syntype proves to belong to a second species; a lectotype designation fixes
  the name to the species its original diagnosis describes, and the new
  species Pyxidogaster relata, reared 29 times from leaf-rolling tortricid
  larvae over two summers, receives the host record.
topic: >-
  the host on the label: a mixed syntype series in a microgastrine braconid named in 1897 for its supposed tortricid host, where mini-barcodes from the type specimens show the one reared syntype belongs to a second, undescribed species that takes the host record with it, while the name, under the Code, keeps the host it never had
