summary: >-
  A research poster from the School of Continuous Improvement interviews 118
  gym members across fourteen fitness centres about why they give an
  already-locked padlock dial a few extra turns, open-coding their stated
  reasons into five stable justification categories and cross-checking
  self-report against observed spin counts, and finds ritual completion the
  modal justification regardless of whether the respondent believed the spin
  changed anything mechanically.
topic: >-
  interviewing gym members about why they give a locker padlock a few extra
  spins after it's already locked, then sorting their reasons into a
  taxonomy of what the extra spins are actually assuring
