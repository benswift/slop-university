summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to
  teaching research methods by practice: every commencing student will design
  and carry out one small study at a site within walking distance, assessed
  principally on its working record. Four focus areas establish the Walkable
  Study, a Common Notebook standard, the pairing of methods teaching with
  active fieldwork, and a Field Register of campus study sites.
