doi: 10.5555/slop.5hk8oh
summary: >-
  Slop University's Strategic Plan 2026-2031 establishes the neuroscience of
  respiration and sleep as a cross-school research priority, with overnight
  recording facilities, a jointly supervised doctoral stream and a register of
  the scoring rule in force for every overnight study. It also settles the
  University's own working rhythm, with a nightly quiet interval from 9pm to
  7am in which no institutional correspondence is sent, while research outputs
  continue to be published across it.
topic: >-
  breath and sleep: a signature research strength in the neuroscience of
  respiration and sleep, and a University that keeps its own rhythm of
  activity and rest
