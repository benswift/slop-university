title: The Quiet Interval
subtitle: A Strategic Plan for breath, sleep and the rhythms of a research University
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
  - Kwame Lindqvist
preset: strategy
school: School of Underlying Conditions
date: 2026-11-17
