doi: 10.5555/slop.010oz0
summary: >-
  A paper from the School of Underlying Conditions and the School of Continuous
  Improvement proves that the valence electron count of a ligated metal cluster
  is the same under the neutral-ligand convention, the ionic convention and
  every other assignment of integer charge to the ligands, and works the count
  both ways for twelve formulas across the carbonyl, halide, chalcogenide and
  interstitial families. It then identifies the three quantities on which the
  conventions do differ, the metal charge, the metal configuration and the
  count at a single metal, and shows that the last sums to a fixed total
  however bridging ligands are apportioned.
topic: >-
  A proof that the neutral-ligand and ionic electron-counting conventions
  return the same valence electron total for any ligated metal cluster,
  whatever charges are assigned to the ligands, with worked counts across the
  classical cluster families and a note on what the two conventions do disagree
  about
