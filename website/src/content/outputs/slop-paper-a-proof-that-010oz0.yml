title: The Same Eighty-Four
subtitle: Invariance of the Cluster Valence Electron Count under Reassignment of Ligand Charge
authors:
  - Brynjar Obiora
  - Eivind Onwuka
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
