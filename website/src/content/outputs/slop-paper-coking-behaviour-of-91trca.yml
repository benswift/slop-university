doi: 10.5555/slop.91trca
summary: >-
  A paper in energy and fuel science from the School of Settled Matters cores a
  14 ha fine-coal tailings impoundment at a washery closed for more than two
  decades and tests 18 depth composites. Reflectance is uniform with depth, but
  coal above the mean water table at 1.6 m has lost most or all of its
  fluidity, while the saturated body below it floats to 9.8% ash at 73%
  combustible recovery and replaces up to 10% of a pilot-oven blend for a loss
  of 1.1 points of coke strength after reaction.
topic: >-
  Coking behaviour of fine coal cored from a closed washery's tailings pond,
  logged layer by layer, and whether any of it can return to a coke blend
