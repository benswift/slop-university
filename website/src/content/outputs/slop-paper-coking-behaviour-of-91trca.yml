title: Coking Coal from a Legacy Tailings Impoundment
subtitle: Depth-Resolved Oxidation, Flotation Recovery and Coke Strength in Blends
authors:
  - Clemency Tredinnick
  - Ragnhild Uzoma
  - Casimir Beng
preset: paper
school: School of Settled Matters
