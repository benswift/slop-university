title: Saltier, Not Thinner
subtitle: Watering Interval, Bore-Water Salinity and the Composition of Dromedary Milk in a Pastoral Herd Rotated Across Three Bores
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-27
publishedAt: "2026-10-27T10:02:00+11:00"
doi: 10.5555/slop.iwq2y2
summary: >-
  A paper from the School of Underlying Conditions follows 34 hand-milked
  dromedary does in one pastoral herd through a 126-day late dry season, as
  the herd is rotated through three bores whose trough water runs from 1.4 to
  8.9 dS/m and watered every two to six days. Total solids in the morning milk
  hold steady across the watering interval, while sodium, chloride and
  freezing-point depression rise with both the days since watering and the
  salinity of the trough, and the stockman's morning tasting of the bulked
  milk tracks its sodium closely.
topic: >-
  watering interval and bore-water salinity as drivers of milk dilution in a
  pastoral dromedary herd rotating across three bores
