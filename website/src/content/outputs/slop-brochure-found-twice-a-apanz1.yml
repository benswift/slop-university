summary: >-
  A case-for-support brochure invites partners to fund the replication sample,
  the second auger hole and the follow-up cohort through which an association
  found once is tested before the University relies on it. It presents looking
  again as a habit common to every school and features seven published studies,
  each of which went back to something already found.
topic: >-
  found twice: a case-for-support brochure asking partners to fund the second
  look, the replication sample that tests whether an association found once in
  families, cohorts or cores still holds when it is sought again
