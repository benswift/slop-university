doi: 10.5555/slop.ieoq88
summary: >-
  A research poster from the School of Emergent Priorities times 214 boarding
  events at 18 suburban bus stops to measure how many minutes before a
  scheduled departure a rider claims the exact spot where the doors will
  open, and reports the University piloting a marked, audited boarding-order
  register at the stops where the claim runs earliest.
topic: >-
  surveying commuters at suburban bus stops on how many minutes early they
  stake out the exact spot where the doors will open, then turning the
  finding into a marked, audited boarding-order queue
