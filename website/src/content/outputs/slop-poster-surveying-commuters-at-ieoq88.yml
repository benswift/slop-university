title: Measuring the Door-Spot Claim
subtitle: >-
  How early commuters need to arrive to keep their place at the bus stop
authors:
  - Petra Umbile
  - Fenna Okoro
  - Kwame Lindqvist
preset: research-poster
school: School of Emergent Priorities
