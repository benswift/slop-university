title: Whatsoever Thou Spendest More
subtitle: "Works of Supererogation in a School Cross-Country Squad's Session Book"
authors:
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
publishedAt: "2026-10-12T20:40:25+11:00"
doi: 10.5555/slop.s1xkms
summary: >-
  A theological essay reads the session book kept by a school cross-country
  coach over three winters, in which each of the squad's laps is entered as
  set, penalty or extra, against the doctrine of works of supererogation. It
  argues that the runners' custom of carrying extra laps forward to meet a
  team-mate's penalty reconstructs the treasury of merit, and that the coach's
  refusal to let a carried lap stand for a set one restates the distinction
  between imputed and imparted righteousness.
topic: >-
  works of supererogation on the school oval: a theological reading of the
  extra lap, the punishment lap run by the whole class, and whether merit
  earned in training can be transferred to a team-mate
