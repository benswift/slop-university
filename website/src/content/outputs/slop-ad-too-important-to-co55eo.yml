summary: >-
  A marketing poster for Slop University sets a stoppered jar of catalyst
  pellets on a high shelf above a balance, where a gloved hand tips out the
  smallest portion a scoop will hold, to advertise the School of Underlying
  Conditions' study of one industrial reforming laboratory's rationed reference
  nickel catalyst. It points the portrait signage rotation to that paper and
  two further studies of catalysts kept and recovered, in matched daylight and
  after-dark renderings.
