title: Six Days, or Two Hundred and Forty-Seven
subtitle:
  Twelve Pre-Registered Definitions of Lost Time Against Three Years of One
  Contractor's Own Records
authors:
  - Runa Adegoke
  - Anneke Tolan
  - Ingrid Vasseur
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-04
publishedAt: "2026-08-04T14:05:33+10:00"
doi: 10.5555/slop.nvrzoq
summary: >-
  A research poster from the School of Emergent Priorities recomputes the
  days-since-last-lost-time-injury counter displayed at one principal
  contractor's sites, working from three years of injury, roster and
  return-to-work records across nine sites: 213 site medical entries and 61
  return-to-work notes. Twelve definitions of lost time, varied on shift-loss
  threshold, treatment of modified duties, and weekend and rostered-day-off
  handling, were lodged before the records were opened. Readings on the study's
  final day span 6 to 247 days, and the contractor's own published definition
  returns the highest of the twelve. Rebuilt from the contractor's published
  weighting, the prequalification rank order of its 33 subcontractors changes
  under eleven of the twelve definitions, moving a median of nine places.
topic:
  the site safety sign at a building site's front gate counting days since the
  last lost-time injury, recomputed from three years of one principal
  contractor's own medical and roster records under twelve definitions of lost
  time fixed before the records were opened, against the injury-frequency rate
  that decides which subcontractors get invited to tender
