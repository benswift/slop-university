title: All Eleven Steps Occurred
subtitle: >-
  Process mining 268,412 toll-notice disputes against the eleven-step pathway
  the operator publishes
authors:
  - Solveig Adeyemi
  - Osei Vandermeer
  - Dagny Okafor
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-16
publishedAt: "2026-08-16T10:01:10+10:00"
doi: 10.5555/slop.tsn8gj
summary: >-
  A research poster from the School of Continuous Improvement replays 5.11
  million case-system events from 268,412 toll-notice disputes against the
  eleven-step pathway one urban toll network publishes and scores procedural
  conformance on. All eleven steps are recorded in 97.9 per cent of cases,
  matching the reported figure, while the median case carries nineteen events
  and only 13 per cent travel the published route alone. Changes in
  determination concentrate at officer assessment and at an unpublished inbound
  call; the delegated internal review, present in every case, precedes a change
  in 0.4 per cent of them.
topic: >-
  the toll notice on the kitchen bench --- the envelope with a grainy photo of
  your own numberplate, a trip you do not remember, and an administration fee on
  top of the toll --- where an urban toll network's customer charter reports
  procedural fairness as conformance to the published eleven-step dispute
  pathway, scored from the operator's own case system by checking that each of
  the eleven steps occurred; and a process-mining study of the case event log
  finds the eleven steps do occur, alongside a discovered pathway the flowchart
  does not contain, that the single step present in every case (a delegated
  officer's internal review) leaves the outcome unchanged in all but a fraction
  of cases, while the steps that do change outcomes are unpublished ones reached
  only by phoning, so conformance sits near total and the map on the website is
  a picture of the assurance rather than of the work
