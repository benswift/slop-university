summary: >-
  A research poster from the School of Settled Matters follows 300 Merino ewes
  from one holding at its sale, trucking 120 to the purchaser's holding, 120 on
  the same trip and back to their home paddocks, and leaving 60 unhandled,
  with serum amyloid A and haptoglobin sampled over six weeks. Both trucked
  arms show the same short serum amyloid A peak in the first week, but only
  the moved ewes rise a second time, haptoglobin first, from day 14 to a
  day-21 peak still unresolved at day 42 and tracking faecal egg counts on the
  receiving holding.
topic: >-
  Serum amyloid A and haptoglobin in a sheep flock moved between holdings at a
  change of ownership: separating transport stress from the incoming land's
  pathogen burden
