title: The Tag Is in the Drawer, the Notice Is on the Fridge
subtitle: A Five-Level Maturity Model for Dog-Registration Renewal Desks Across Thirty-Three Councils
authors:
  - Marit Osayande
  - Solveig Adeyemi
  - Renke Sabel
preset: paper
school: School of Continuous Improvement
date: 2026-10-03
publishedAt: "2026-10-03T18:01:55+10:00"
doi: 10.5555/slop.48foyk
summary: >-
  A paper from the School of Continuous Improvement scores 33 councils'
  dog-registration renewal desks against a five-level maturity model on 6,237
  renewal files rated twice, and finds the levels form only a weak cumulative
  scale (Loevinger's H = 0.37), with 15 councils attaining a level while a
  lower rung stands unmet. Attained level follows renewal turnaround, from 5.6
  days at Level 1 to 13.3 at Level 5, and the University now accepts a council's
  renewal letter as proof of address on first presentation only from Level 4 or
  5.
topic: >-
  Five named levels, from Tag in the Drawer to Tag at the Gate, against which 33
  councils' dog-registration renewal desks were scored over 6,237 renewal files,
  and the level at which the University now accepts a council's renewal letter
  as proof of address
