title: Six Weeks of Load
subtitle: Sizing a Stand-Alone PV–Battery–Diesel System for a Seasonal Shearing Shed, with the Stock-Water Bore as Deferrable Load
authors:
  - Sten Okwuosa
  - Vigdis Emenike
preset: paper
school: School of Continuous Improvement
date: 2026-10-26
publishedAt: "2026-10-26T16:01:15+11:00"
doi: 10.5555/slop.0kkbm7
summary: >-
  A paper from the School of Continuous Improvement and the School of
  Underlying Conditions logs one spring at a six-stand shearing shed that
  draws 72% of its annual energy in six weeks, and sizes PV, battery and
  diesel configurations against twenty-year net present cost. No design sized
  for the shed alone undercuts the existing generator; with the property's
  stock-water bore added as a deferrable load through its header tank, the
  least-cost design of 8 kWp and 10 kWh is 15% cheaper than diesel and cuts
  fuel use by 78%.
topic: >-
