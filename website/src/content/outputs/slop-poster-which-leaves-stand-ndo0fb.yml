summary: >-
  A research poster from the School of Underlying Conditions partitions the
  variance in a smallholder drying shed's total-phenolic release assay across
  24 guava trees, their branches, individual leaves and duplicate assays (432
  assays), finding 65 per cent of it at the leaf. A ten-tree, thirty-leaf
  ground composite assayed twice more than halves the standard error of the lot mean
  that the shed's three-leaf, nine-assay plan achieves.
topic: >-
  Which leaves stand for the lot: a nested sampling design for the total
  phenolic assay of dried guava leaf lots at a smallholder drying shed,
  apportioning variance between trees, branches and leaf positions
