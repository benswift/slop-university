title: Who Sets the Tooth Fairy's Rate?
subtitle: >-
  Nominal rigidity, denomination constraints, and sibling precedent in a decade
  of household pillow payouts
authors:
  - Joost Nwosu
  - Torun Ezeigwe
  - Mirela Hanke
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-19
publishedAt: 2026-08-19T17:00:04+10:00
doi: 10.5555/slop.06kohn
summary: >-
  A research poster from the School of Continuous Improvement reconstructs
  per-tooth payout histories across 214 households and 1,838 pillow events,
  modelling the tooth fairy's going rate as an administered price. Payout
  spells hold for a median 4.8 years with no downward repricing observed; 71%
  of repricings land exactly one coin or note denomination up, and a district
  parents' association has since adopted the panel median as its kinder
  handbook's suggested rate.
topic: >-
  take the tooth fairy's going rate seriously as a question in monetary
  economics: reconstruct per-tooth payout histories across suburban households
  to measure a rate quantised to whatever coin the bedside drawer holds, held
  flat for years by sibling precedent, and repriced overnight by playground
  information shocks --- after which a parents' association starts CPI-indexing
  the suggested rate in its kinder handbook
