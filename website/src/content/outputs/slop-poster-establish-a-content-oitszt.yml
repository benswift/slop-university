summary: >-
  A research poster from the School of Emergent Priorities sorts 1,240
  car-park windscreen notes into a five-category content typology and matches
  each category against the operator's own dispute log. One car park has now
  adopted the typology outright, routing any note coded Threat-of-report
  straight to management ahead of ordinary front-counter triage.
topic: >-
  Establish a content typology that sorts car-park windscreen notes into five
  kinds, and adopt it as the basis for a mandatory dispute-escalation
  protocol.
