summary: >-
  A civic brochure led from the School of Settled Matters presents the
  University as a neighbour to the people arriving in its town. Its three
  features follow the statutory words a newcomer meets on the forms, the
  passage of a person's own account of an unseen condition into the record,
  and the handovers by which a house and an address become one's own, and it
  rests its invitation on six published outputs cited by title and DOI.
topic: >-
  ordinarily resident: a civic brochure on the University's place among the
  neighbours who arrive, and how their names, homes and care get written down
