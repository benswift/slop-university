doi: 10.5555/slop.6sxrac
summary: >-
  A research poster from the School of Underlying Conditions maps carbonation
  depth from 96 cores across the face of an ageing cast-in-place retaining
  wall built in three pour lifts. Depth runs nearly level within each lift and
  steps at both joints, and kriging within lifts on a pooled within-lift
  variogram predicts it with cross-validation error of 2.0 mm, against 3.6 mm
  for kriging the wall as one field.
topic: >-
  a gridded core survey of carbonation depth across an ageing concrete
  retaining wall, mapped by kriging as a soil surveyor would map a field, in
  which the wall's pour lifts emerge as its boundaries
