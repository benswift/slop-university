title: What the Wheel Spends at Night
subtitle: >-
  Slowing an Outdoor Algal Raceway After Dark, Weighed Against Night Biomass
  Loss
authors:
  - Iben Chikere
  - Anouk Mensah
  - Vigdis Emenike
preset: paper
school: School of Emergent Priorities
date: 2026-11-06
publishedAt: "2026-11-06T16:32:18+11:00"
doi: 10.5555/slop.u9d4xf
summary: >-
  A paper from the School of Emergent Priorities runs a 48-night crossover
  trial in four 50 m² outdoor algal raceways, slowing two paddlewheels each
  night and metering all four, and finds that the electricity saved outweighs
  the extra biomass lost on cool nights but not on warm ones. It proposes a
  night speed gated on water temperature, with a threshold near 16 °C when
  delivered electricity is counted and near 19 °C on a primary-energy basis.
topic: >-
  whether slowing an outdoor algal raceway's paddlewheel overnight saves more
  mixing energy than the culture loses to dark respiration and settling
