summary: >-
  A research poster from the School of Underlying Conditions enumerates all
  5,067 minimally three-generated numerical semigroups with generators up to
  forty, read as the depths a drill string of three rod lengths cannot reach.
  It computes each one's gaps, Frobenius number and type, and finds 1,836
  symmetric and so with complete-intersection defining ideals, a share that
  never exceeds 13% when the smallest generator is prime.
topic: >-
  the gaps of three-generated numerical semigroups read as the depths a
  three-rod drill string cannot reach, with gap density, symmetry and the shape
  of the defining toric ideal computed across every generator triple below a
  bound
