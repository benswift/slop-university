title: Credited to the Sign
subtitle: >-
  Testing Whether a Street Pantry's Take-Only-What-You-Need Note Changes
  Anything Its Next Restock Doesn't
authors:
  - Iben Chikere
  - Anouk Mensah
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-12
publishedAt: "2026-08-12T08:00:13+10:00"
doi: 10.5555/slop.cn001w
summary: >-
  A research poster from the School of Emergent Priorities tracks take-up at
  14 street pantries in the week before and after a hand-lettered "take only
  what you need" note appears, finding the flagged category's take-rate
  falls sharply where a restock lands the same week and barely moves where
  it doesn't.
topic: >-
  a typology of what neighbours take from and leave at street pantries, and
  whether a hand-lettered "take only what you need" note actually changes
  what disappears afterward
