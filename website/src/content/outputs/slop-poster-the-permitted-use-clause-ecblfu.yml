title: The Lease Remembers the First Tenant
subtitle: Permitted-use clauses and new industries on a council industrial estate, 1979–2024
authors:
  - Odalys Penhallow
  - Clemency Tredinnick
preset: research-poster
school: School of Settled Matters
date: 2026-11-14
publishedAt: "2026-11-14T20:01:19+11:00"
doi: 10.5555/slop.ecblfu
summary: >-
  A research poster from the School of Settled Matters codes the permitted-use
  clause of every lease on one council-owned industrial estate in an inland
  town from 1979 to 2024 and links 214 tenancy commencements to whether each
  brought an industry new to the town, finding that 38 of the 61 that did
  arrived on the any-lawful-purpose lots that make up 19% of the estate's
  lot-years, while leases for a named trade passed that trade on to the next
  tenant by assignment.
topic: >-
  the permitted-use clause and regional path creation: which new industries a
  council-owned industrial estate's leases let in, read across four decades of
  lease registers in one inland town
