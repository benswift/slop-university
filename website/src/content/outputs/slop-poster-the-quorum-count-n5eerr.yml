title: Quorate by Attrition
subtitle: >-
  Roll Decline, Not Attendance, Explains a Rising Quorate Rate at 186 Affiliated
  Clubs
authors:
  - Ronja Oyelaran
  - Marek Solheim
  - Ingrid Vasseur
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-14
publishedAt: 2026-08-14T21:00:30+10:00
doi: 10.5555/slop.n5eerr
summary: >-
  A research poster from the School of Emergent Priorities decomposes the rise
  in quorate annual general meetings across 186 clubs affiliated to one state
  association, scoring 1,589 sets of minutes and annual returns over nine
  reporting years against a quorum fixed at twenty per cent of financial
  members. Of the 17.9-point rise in quorate share, a counterfactual holding
  each club's roll at its first-year value recovers 2.8 points; clubs whose
  membership fell by 30 per cent or more were quorate at a median 91.2 per cent
  of meetings against 54.7 per cent for clubs whose rolls grew, and 71.4 per
  cent of the association's governance-support allocations reached the second
  group.
topic: >-
  the quorum count at a suburban club's annual general meeting, where a state
  association reports each member club's governance health as the share of
  meetings that reach quorum --- twenty per cent of financial members --- and
  steers its governance-support funding to the clubs that fail, so a membership
  roll shrinking faster than the hall empties makes the smallest clubs the most
  reliably quorate and sends the support to the ones still growing
