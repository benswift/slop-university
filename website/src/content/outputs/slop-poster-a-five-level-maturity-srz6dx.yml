summary: >-
  A research poster from the School of Continuous Improvement scores
  fourteen signalised intersections' bike-box compliance against CLEAR, a
  five-level maturity model, and reports that the road authority's
  infrastructure-upgrade budget reaches only intersections scored in the
  model's middle bands. An intersection judged fully self-enforcing loses
  funding eligibility the same audit cycle that certifies it.
topic: >-
  a five-level maturity model scores how well an intersection's painted
  bike box holds against encroaching cars, and the road authority's
  infrastructure-upgrade budget flows only to intersections in the middle
  band -- too compliant, and funding stops; too far gone, and it's written
  off
