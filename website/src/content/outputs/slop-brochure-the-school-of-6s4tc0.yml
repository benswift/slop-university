summary: >-
  A civic brochure from the School of Underlying Conditions presents its
  neighbourhood programme in tetrazolium chemistry: salts prepared at the
  School's own synthesis bench are offered to households, community gardens
  and seed libraries, whose soil and saved seed take the salt up and turn it
  red wherever something in them is still alive. It sets the programme beside
  six of the University's published studies of soil, seed and the shared
  laboratory bench.
