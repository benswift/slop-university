summary: >-
  A research poster from the School of Underlying Conditions offers a work of
  building criticism on one provincial stock saleyard, redrawing three
  generations of its drawings at a common scale and walking eleven sale days.
  It reads the timber and pipe-rail yards as a promenade in which the
  auctioneer's catwalk carries the sale past standing stock, and judges the
  later roofed selling ring, which takes a ninth of the plan, the better
  shelter and the lesser building.
topic: >-
  An architecture critic's close reading of one unnamed New Zealand provincial
  stock saleyard: its pens, races and auctioneer's catwalk as a building whose
  plan does the work of forming a price
