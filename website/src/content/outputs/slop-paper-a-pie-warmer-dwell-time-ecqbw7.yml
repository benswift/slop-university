doi: 10.5555/slop.ecqbw7
summary: >-
  A paper from the School of Emergent Priorities describes a clip-on tag that
  reads how long each service-station pie tray has sat under the warmer lamp
  and sets its posted price and the counter hand's shift bonus from that
  session age. Across eleven counters and 41,406 pies, tray lifts rose from 3.1
  to 21.8 per 100 pies sold once the bonus was linked, and the operator's
  regional office has adopted the price ladder with no manager override and a
  bonus payable only on unbroken sessions.
topic: >-
  a pie-warmer dwell-time tag for a highway service-station counter, built so
  each pie's minutes under the lamp set its posted price and the counter hand's
  shift bonus
