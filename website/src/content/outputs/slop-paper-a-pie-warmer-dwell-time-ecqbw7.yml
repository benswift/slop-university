title: Hot Since Half Past Twelve
subtitle: Design and Deployment of a Lamp-Dwell Tag That Prices the Pies in a Highway Service-Station Warmer Cabinet
authors:
  - Iben Chikere
  - Lindiwe Achterberg
  - Runa Adegoke
preset: paper
school: School of Emergent Priorities
