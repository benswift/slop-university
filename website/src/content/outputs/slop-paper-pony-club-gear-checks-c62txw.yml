title: Eleven Seconds at the Gate
subtitle: >-
  Queue Length, Check Duration, and Defect Detection Across 1,147 Gear Checks at
  18 Pony Club Rallies
authors:
  - Torun Ezeigwe
  - Marit Osayande
  - Sten Okwuosa
preset: paper
school: School of Continuous Improvement
date: 2026-08-01
publishedAt: 2026-08-01T12:03:33+10:00
doi: 10.5555/slop.c62txw
summary: >-
  A paper from the School of Continuous Improvement times 1,147 gate gear checks
  across 18 rallies at nine pony clubs in one metropolitan-fringe zone,
  recording the number of riders waiting at the start of each check and
  re-checking every fourth horse-and-rider pair against a 14-item defect
  schedule fixed before the season, by a second accredited assessor blinded to
  the gate outcome. Check duration falls an estimated 3.1 seconds for each
  additional rider waiting (95% CI 3.6 to 2.6), from a median of 46 seconds at
  queues of two or fewer to 11 seconds at queues of nine or more; detection
  follows duration, with checks over 30 seconds recording 58 per cent of the
  defects the blinded re-check confirmed, checks under 15 seconds recording 11
  per cent, and the pooled figure across all observed checks reaching 31 per
  cent. Every one of the nine clubs returned between two and five times its
  gate-recorded defect rate on re-check, while the association's compliance
  indicator held between 99.1 and 100 per cent across all 18 rallies and showed
  no relation to detection at any of them. Adding rally start-time punctuality
  to the model moves the queue-length coefficient by 0.4 per cent.
topic: >-
  a pony club's Saturday gear check, the volunteer at the gate running a hand
  over every helmet, girth and stirrup before a rider goes out, timed against
  the queue building behind them, and an association safety-compliance rate that
  counts checks performed rather than defects found
