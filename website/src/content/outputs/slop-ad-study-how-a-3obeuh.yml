summary: >-
  A study-recruitment poster for the School of Settled Matters pictures a lone
  reader at a lamplit table in a law library, a branching path above them
  narrowing to a single line, and invites prospective students to learn how a
  decided question stays decided, in the reported cases and in the minds that
  decide them. Developed for bus-stop panels and campus digital signage in a
  portrait rotation.
