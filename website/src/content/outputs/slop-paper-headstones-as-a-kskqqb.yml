title: Left Standing
subtitle: Bracketing Peak Ground Acceleration at an Unrecorded Site from the Toppling and Survival of 565 Cemetery Memorials
authors:
  - Eskil Nwabueze
  - Vigdis Emenike
preset: paper
school: School of Continuous Improvement
