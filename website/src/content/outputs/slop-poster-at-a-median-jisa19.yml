doi: 10.5555/slop.jisa19
summary: >-
  A research poster from the School of Emergent Priorities classifies 138
  community crowdfunding campaigns into a scope-versus-funding quadrant,
  finding four in five already carry a second stretch goal at a median 14%
  of base-target funding and a specificity score of 20 out of 100. The
  finding underwrites a mandatory scope-readiness gate for any
  Slop-University-affiliated cause's second ask.
topic: >-
  At a median of just 14% of their own base target funded, four in five
  community crowdfunding campaigns have already posted a second stretch
  goal with no attached deliverable, sorting into a 2x2 quadrant of
  scope-definition against funding already committed
