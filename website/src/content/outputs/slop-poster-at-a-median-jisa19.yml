title: Fourteen Per Cent Funded, Already Expanding
subtitle: A Scope-Versus-Funding Quadrant for Community Crowdfunding Campaigns
authors:
  - Kwame Lindqvist
  - Verity Marris
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-08
