doi: 10.5555/slop.vesq6q
summary: >-
  A research poster from the School of Emergent Priorities names four convoy
  states of the morning walking school bus and reports Facilities withholding
  campus visitor-parking release until Closed-and-moving has been the modal
  cell and has then fallen below ten percent of live routes after the last
  marked crossing, with no warden override.
topic: >-
  Establish four named convoy states of the morning walking school bus, and
  withhold campus visitor-parking release until the nearest route's
  Closed-and-moving cell has passed the last marked crossing
