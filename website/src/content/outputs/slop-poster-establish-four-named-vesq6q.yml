title: The Walking School Bus as Release Gate
subtitle: >-
  Can four named convoy states bind visitor-parking until the last crossing is
  clear?
authors:
  - Ingrid Vasseur
  - Osei Vandermeer
  - Ronja Oyelaran
preset: research-poster
school: School of Emergent Priorities
