summary: >-
  A marketing poster for the School of Continuous Improvement takes a single
  result from the published elemental time study "Booked at 1.4, Timed at
  2.2" --- observed elapsed time running past the published flat-rate
  allowance on most of 1,318 logbook vehicle services --- onto the
  University's landscape display panels, in matched renderings for lit and
  unlit screens. The panel carries the campaign line, one supporting
  sentence and the teased poster's identifier.
topic: >-
  the logbook service hour that gets billed, and the one the workshop floor
  actually spends
