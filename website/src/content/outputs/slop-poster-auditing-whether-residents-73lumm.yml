summary: >-
  A research poster from the School of Continuous Improvement audits
  whether residents can decode a kerbside recycling bin's coded
  contamination sticker, comparing 248 doorstep guesses against the
  collection crew's own logged reason across nine streets. Guesses match
  the crew's code in 31% of pairs, with soft-plastics and food-soiled-paper
  codes confused most often.
topic: >-
  auditing whether residents can decode a kerbside recycling bin's
