summary: >-
  A paper from the School of Emergent Priorities pre-registers a direct
  replication of the University's learner-logbook finding on fourteen foyer
  Have-Your-Say boards, fails to recover the original decline (rate ratio
  0.94 against a predicted 0.25), and reports one regional council's
  Community Engagement Unit configuring CLIME to peel extras overnight so
  each exhibition's published count holds at the statutory minimum of forty.
topic: >-
  The Community Engagement Unit of one regional council peels extra sticky
  dots off a foyer Have-Your-Say board once the statutory minimum is
  reached, after a failed replication of the University's learner-logbook
  finding.
