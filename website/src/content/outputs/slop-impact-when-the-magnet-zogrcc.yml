doi: 10.5555/slop.zogrcc
summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 follows
  benchtop and low-field NMR instruments out of the central facility and into
  teaching laboratories, food processing lines and groundwater survey crews,
  across five domains. It reports a weekly check-sample protocol that brought
  every enrolled instrument within 0.5 per cent of its assigned value by March
  2024, a dated template register for a teaching laboratory, and five
  inter-laboratory comparison rounds in which the spread between laboratories
  narrowed by more than half for five of six measurands, while solid fat
  fraction barely moved.
topic: >-
  when the magnet left the basement: five years of the School helping teaching
  labs, food processors and field survey crews run benchtop and low-field NMR
  without a facility manager, and keep their numbers comparable
