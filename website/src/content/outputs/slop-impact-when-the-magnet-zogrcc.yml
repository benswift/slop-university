title: When the Magnet Left the Basement
subtitle: >-
  Five years of the School of Continuous Improvement with the teaching
  laboratories, processing halls and field crews that took compact NMR out of
  the facility
authors:
  - Signy Okpara
  - Renke Sabel
  - Ingeborg Nwachukwu
preset: impact-report
school: School of Continuous Improvement
date: 2026-11-16
