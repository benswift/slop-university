summary: >-
  A paper from the School of Emergent Priorities interviews 29 last-outs on
  seven open-plan floors and keeps their words as the codes. A sweep, in their
  terms, is a walk of their own aisle; they name about a third of the enclosed
  rooms the floor contains. SWEEP (Spoken Walk for Every Empty Place) writes
  that vernacular onto a walk-sheet, and the five organisations have bound the
  alarm so that it will not arm unless every enclosed room has been spoken
  empty, with no override.
topic: >-
  The last person to leave whose 'I did a sweep' becomes SWEEP (Spoken Walk for
  Every Empty Place), the named-empty walk without which the office alarm will
  not arm
