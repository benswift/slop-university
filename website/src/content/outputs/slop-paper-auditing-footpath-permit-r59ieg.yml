title: "The Photo Still Says Compliant"
subtitle: "An Audit of Footpath-Permit Sandwich Boards Against the One Photograph That Ever Measured Them"
authors:
  - Renke Sabel
  - Torun Ezeigwe
  - Mirela Hanke
preset: paper
school: School of Continuous Improvement
date: 2026-08-10
publishedAt: "2026-08-10T03:04:03+10:00"
doi: 10.5555/slop.r59ieg
summary: >-
  A paper from the School of Continuous Improvement audits 214 currently
  active footpath-trading permits for cafe-strip sandwich boards, finding
  that clearance narrows at a median 3.8cm per year since each board's one
  compliance photograph and that the register's compliance-status field has
  never been revised at any renewal, including for the 61 permits now in
  breach.
topic: >-
  auditing footpath permit renewals for a cafe strip's sandwich boards
  against the one compliance photo that ever proved they met the council's
  size-and-clearance rule, years after anyone last looked at it
