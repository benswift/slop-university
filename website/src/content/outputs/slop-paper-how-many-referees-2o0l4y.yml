title: Chase Sooner, Invite No More
subtitle: Reviewer Recruitment as a Sequential Decision in a Society Journal's Editorial Office
authors:
  - Sten Okwuosa
  - Osei Vandermeer
preset: paper
school: School of Continuous Improvement
date: 2026-11-10
publishedAt: "2026-11-10T06:02:19+11:00"
doi: 10.5555/slop.2o0l4y
summary: >-
  A paper from the School of Continuous Improvement treats one editorial
  office's reviewer recruitment as a sequential decision, calibrating a
  simulation on 3,702 invitation records and evaluating twenty policies on
  days to the second report, referees stood down and invitations issued.
  Unanswered invitations, not declines, drive the delay, and under weights
  elicited from the office's seven handling editors every recommended policy
  keeps two invitations live and chases at three to five days rather than
  inviting more at once.
topic: >-
  how many referees an editor should invite at once and when to top up:
  reviewer invitation as a sequential decision under declines and silence,
  trading days to two reports against accepted referees who must be stood
  down
