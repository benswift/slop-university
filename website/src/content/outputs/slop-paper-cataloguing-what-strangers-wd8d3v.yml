title: Three Songs, One Piano
subtitle: Cataloguing Repertoire Convergence at a Public Transit Instrument, and
  the Working Group Convened to Diversify It
authors:
  - Casimir Beng
  - Ingrid Vasseur
  - Anneke Tolan
preset: paper
school: School of Continuous Improvement
date: 2026-08-21
publishedAt: 2026-08-21T22:01:15+10:00
doi: 10.5555/slop.wd8d3v
summary: >-
  A paper from the School of Continuous Improvement codes six months of a
  rail-station concourse piano's played repertoire from a maintenance
  microphone's repurposed feed, finding three recognisable phrases account
  for 61% of all 1,142 logged sessions, a concentration that holds through
  ordinary variation in weather, service disruption, and time of day and is
  unmoved by the piano operator's own working group and its laminated
  request for repertoire variety.
topic: >-
  cataloguing what strangers actually play on a public train-station piano,
  where three pieces dominate every logged session, and what happens when
  the institution convenes a repertoire-diversity stewardship committee to
  fix it
