summary: >-
  A marketing poster for Slop University presents Dr Brynjar Obiora of the
  School of Underlying Conditions standing in a soil pit whose horizons are
  the stacked edges of books, an open volume in his hands. Developed for campus
  digital signage in a portrait rotation, it offers the surveyor's habit of
  drawing a line through gradual change as a way of reading for theme, invites
  the public to meet the University's researchers, and points to three of its
  published outputs.
topic: >-
  read the layers under the story: a soil surveyor on where one theme in a
  novel ends and the next begins
