summary: >-
  A research poster from the School of Continuous Improvement reports the first
  accuracy benchmark for the counter guess --- the barista's unprompted "the
  usual?" --- across 41 franchise cafés, 214 tracked regulars and 6,187
  transactions over 14 weeks. Scored against the till record the guess reaches
  91% top-1 accuracy; re-scored against intended orders elicited off-premises
  it falls to 68%, with roughly one confirmed usual in four reflecting
  acquiescence rather than preference. The loyalty app's your-usual prediction,
  trained on the till record, reproduces the barista's errors, and the partner
  network has since adopted a recognition-rate service standard scored from the
  same confirmations.
topic: >-
  How often is 'the usual?' actually right? A field benchmark scores baristas'
  memory of regulars' orders across a cafe franchise against the loyalty app's
  your-usual prediction, and finds the question contaminates its own answer
  sheet --- regulars accept a wrong guess rather than correct it, the till logs
  the acceptance as an order, and the app trains on what politeness produced
  --- after which head office adopts a recognition-rate service standard scored
  from those same till confirmations
