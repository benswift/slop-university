summary: >-
  A research poster from the School of Emergent Priorities sorts fourteen
  months of fridge-door photographs from 58 households into a five-kind
  behavioural taxonomy, and reports a declutter outreach service's adoption
  of the scheme as its sole criterion for what gets removed at a first
  visit.
topic: >-
  fridge-door ephemera taxonomy that sorts a household's pinned clutter into
  five behavioural kinds, adopted by the University's outreach declutter
  service to discard anything it classifies as aspirational, resident wishes
  notwithstanding
