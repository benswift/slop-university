title: When Is a Remanence Settled?
subtitle: Two Hundred Days of Magnetic Viscosity in Six Melt-Spun 1:12-Type Ribbons
authors:
  - Odalys Penhallow
  - Ragnhild Uzoma
preset: paper
school: School of Settled Matters
