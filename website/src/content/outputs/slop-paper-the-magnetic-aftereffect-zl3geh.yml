summary: >-
  A paper from the School of Settled Matters and the School of Underlying
  Conditions holds six melt-spun 1:12-type alloy ribbons near their coercive
  fields for 200 days, at three hold fields each, and finds the logarithmic
  decay of magnetisation bending toward a plateau in twelve of the eighteen
  holds, at times that for three ribbons move with field exactly as their
  first thousand seconds predict and for the fourth 1.45 times faster. Only
  two holds settle within the resolution of the measurement before the 200
  days are out, the rest extrapolate to between 1.2 and 66 years, and two
  coarsely quenched ribbons carrying a soft secondary phase never bend.
topic: >-
  the magnetic aftereffect in six melt-spun iron-rich 1:12-type alloy ribbons
  held at remanence for 200 days, where the logarithmic decay of magnetisation
  bends toward a plateau after a waiting time set by the reverse-field history,
  and two ribbons never settle
