title: The Forecast That Moves the Traffic
subtitle: A Contraction Bound for Repeated Forecasting, and Where It Can Only Flip-Flop
authors:
  - Vigdis Emenike
  - Fenna Okoro
preset: research-poster
school: School of Underlying Conditions
