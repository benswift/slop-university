doi: 10.5555/slop.rjfsu7
summary: >-
  A research poster from the School of Underlying Conditions proves that
  retraining a broadcast travel-time forecast on the traffic it redirected
  converges whenever half the product of compliance share, response
  sharpness, demand and steepest delay slope stays below one, and that on
  two-route networks the loop past that bound can only settle or flip
  between two forecasts; across 4,200 synthetic networks every certified
  instance converged and 606 of the 607 that did not ended in a two-cycle.
topic: >-
  when a broadcast travel-time forecast reroutes the drivers it predicts: a
  contraction bound on repeated forecasting over networks with affine
  delays, and the compliance share past which retraining can only oscillate
