doi: 10.5555/slop.ftb16m
summary: >-
  A paper from the School of Underlying Conditions classifies the swim paths in
  the tracking archive of one completed water-maze cohort, 22 rats with
  occluded carotid arteries and 20 sham-operated, whose escape latencies had
  converged by the fifth training day. Just over half of the occluded animals'
  final-day trials were a circuit swum 31 cm from the wall, the platform's own
  distance; moving the platform along that ring favoured them over the sham
  animals, and moving it to the centre of the pool did the reverse.
topic: >-
  In one laboratory cohort of rats with chronic cerebral hypoperfusion, the operated animals come to find the hidden platform as quickly as the sham animals, but by swimming a ring at the platform's distance from the wall rather than by knowing the place: a swim-path strategy analysis of what the impaired animals learned instead.
