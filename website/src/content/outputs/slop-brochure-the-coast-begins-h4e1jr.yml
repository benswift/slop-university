summary: >-
  A prospectus from the School of Underlying Conditions invites prospective
  students to approach coastal and marine management from the ground behind
  the beach: the groundwater held in the dune, the layers a storm exposes, and
  the priorities set by the School of Emergent Priorities above them both. It
  introduces three researchers and points to five published studies of the
  shore by title and DOI.
topic: >-
  the coast begins underground: a prospectus for studying coastal management
  from below, where fresh groundwater meets the sea
