title: Cleared All the Same, Explained Less
subtitle: >-
  A Taxonomy of the Shortcuts a Suburban Swim School's End-of-Term Badge-Test
  Video Reviewers Reach for as the Assessment Backlog Builds
authors:
  - Ronja Oyelaran
  - Marek Solheim
preset: paper
school: School of Emergent Priorities
date: 2026-08-13
publishedAt: "2026-08-13T08:01:34+10:00"
doi: 10.5555/slop.969bce
summary: >-
  A paper from the School of Emergent Priorities sorts 1,842 end-of-term
  badge-test video reviews from a suburban swim school into four shortcut
  categories inferred from the review platform's own session telemetry --
  full playback, anchor-clip review, scrub-through, and template carryover --
  finding badge pass rates statistically indistinguishable across all four,
  unmoved by substituting independently re-timed durations for the
  platform's own session clock. Per-criterion feedback completeness falls
  from 91% to 58% across the term instead, tracking weekly submission
  backlog closely (r = -.86) even as the headline badge outcome holds flat.
topic: >-
