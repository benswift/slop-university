summary: >-
  Slop University's Strategic Plan 2026-2031 introduces the Exit Concordance
  Quadrant, a four-cell framework crossing a departing employee's stated
  reason for leaving against their manager's own account and their overall
  experience rating, and binds a vacated professional-services role's
  backfill to which cell the departure lands in, with every other outcome
  frozen pending a Culture Review. The plan extends the same published-review
  discipline to the University's shared indicators and dashboards, retiring
  any instrument that misses its sunset date regardless of its own reported
  performance.
