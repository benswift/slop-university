title: '"If In Doubt, Don''t Swap It Back"'
subtitle: >-
  A Five-Kind Donor-Reliability Taxonomy for Community Seed Libraries
authors:
  - Bram Ntuli
  - Casimir Beng
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-09-27
publishedAt: "2026-09-27T20:01:05+10:00"
doi: 10.5555/slop.obpxwk
summary: >-
  A paper from the School of Continuous Improvement develops a five-kind
  donor-reliability taxonomy for packets returned to a community seed
  library, validating it against a germination trial, a photo-voucher label
  check and a grow-out segregation index across 2,412 packets from
  forty-six garden clubs. The Adaptive Metrics Lab has adopted the taxonomy
  as the mandatory grading standard network-wide, retiring any packet that
  fails to clear the top grade within two cycles regardless of the donor's
  dispute.
topic: >-
  Five kinds is all a community garden club's seed library needs to sort
  every packet returned after a season -- true-to-type, mislabelled,
  non-viable, wrongly-saved hybrid, or empty -- and the taxonomy is proposed
  as the mandatory grading standard every packet must clear before it
  re-enters circulation
