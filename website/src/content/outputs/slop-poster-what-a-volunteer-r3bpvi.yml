summary: >-
  A research poster from the School of Emergent Priorities codes 9,804
  entries from seven years of a peri-urban settlement's volunteer night-watch
  logbooks, finding security entries fall from 58% of the first year's log to
  9% of the seventh while entries about residents' welfare rise from 4% to
  38%, the patrol keeping its route and roster throughout.
topic: >-
  what a volunteer night-watch does once there is little left to watch: seven
  years of patrol logbooks from a peri-urban settlement, coded by what the
  walkers wrote down
