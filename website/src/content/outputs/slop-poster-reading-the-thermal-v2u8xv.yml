summary: >-
  A research poster from the School of Underlying Conditions re-describes 61
  archived multi-anvil bracketing charges at 0.1 mm stations from hot spot to
  capsule end, assigning each station a temperature from a steady-state thermal
  model of its assembly. Twenty-three charges hold olivine and wadsleyite in
  distinct zones, each boundary sitting a median 38 °C below the recorded run
  temperature, so the archive yields 23 boundary positions without a new run.
topic: >-
  reading the thermal gradient inside quenched multi-anvil charges as a
  transect: re-describing an archive of olivine-wadsleyite run products so each
  capsule constrains the phase boundary along its length rather than at one
  bracketing point
