title: The Limit-Four Ticket as Rationing Instrument
subtitle: A Teaching Case from One Suburban Supermarket
authors:
  - Ingrid Vasseur
  - Kwame Lindqvist
  - Petra Umbile
preset: paper
school: School of Emergent Priorities
date: 2026-10-08
publishedAt: "2026-10-08T13:01:55+11:00"
doi: 10.5555/slop.4lne3q
summary: >-
  A paper from the School of Emergent Priorities follows one supermarket's
  "limit four per customer" shelf tickets through nineteen weeks and 37,914
  till-linked purchases, finding that the printed number came from a pre-printed
  ticket sleeve and not from stock held, that purchases of exactly four rose
  from 5.0% to 21.9% while purchases above the limit barely moved, and that the
  tickets were enforced six times. The School's Horizon Register now carries a
  standing Four-Per-Person entry capping every allocation the School
  administers, with no exception.
topic: >-
  The shelf-edge 'limit four per customer' ticket at one suburban supermarket,
  a single-site teaching case on how the printed number is chosen and who it
  actually stops, on whose strength the University fixes a published per-person
  limit on every shared allocation, with no override
