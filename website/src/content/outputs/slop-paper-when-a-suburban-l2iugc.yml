title: The Committee Ratified It Three Days Later
subtitle: >-
  A Single-Site Case Study of a Bridge Club's Discretionary Scoring
  Override and What the Override Log Actually Corrects
authors:
  - Anouk Mensah
  - Anneke Tolan
  - Thandiwe Solberg
preset: paper
school: School of Emergent Priorities
date: 2026-09-02
publishedAt: "2026-09-02T15:03:15+10:00"
doi: 10.5555/slop.l2iugc
summary: >-
  A paper from the Schools of Emergent Priorities and Continuous
  Improvement follows one suburban contract bridge club's director-override
  log across a full pennant season, finding a residual "director's
  discretion" category triples in the eight weeks before the club's annual
  grading cutoff and concentrates among pairs sitting within one rung of a
  promotion threshold. Tracing one contested override from the table
  through to a committee ratification recorded three days later, the case
  has prompted the club's district association to require every director
  override to be entered in a published register and independently
  ratified within a fortnight.
topic: >-
  when a suburban bridge club's director exercises a discretionary
  override on the automated scoring app instead of accepting its result,
  what is the override actually correcting for
