doi: 10.5555/slop.qzg9dw
summary: >-
  A paper from the School of Underlying Conditions sows twenty lucerne breeding
  lines and two checks in six contour bands down one hillslope, with a
  piezometer in each of 132 plots, and scores Phytophthora root rot over two
  winters against the days water stood within 30 cm of the surface. The upper
  slope barely separated the entries, the middle slope ranked them almost as the
  waterlogged toeslope did, and five lines kept their roots nearly clean the
  whole way down while three upslope favourites failed.
topic: >-
  partial resistance to Phytophthora root rot in lucerne breeding lines planted
  down a hillslope nursery, read against the depth to water in a piezometer
  under every plot
