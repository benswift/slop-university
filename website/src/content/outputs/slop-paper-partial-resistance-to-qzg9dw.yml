title: Where the Water Stands
subtitle: Depth to a Perched Water Table and Partial Resistance to Phytophthora Root Rot across a Piezometer-Gridded Lucerne Nursery
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
