doi: 10.5555/slop.cddmt8
summary: >-
  A paper from the School of Emergent Priorities reports an eleven-week pilot
  of a queue-position forecast display at a twelve-bay EV charging bank,
  finding that drivers who leave the queue and re-enter are quoted a shorter,
  population-average wait than the conservative estimate held by anyone
  waiting in place. Rejoin behaviour climbs from 3% to 25% of check-ins over
  the pilot, the site-wide posted average drifts from tracking the real wait
  to understating it by nearly seven minutes, and a plain-language warning
  banner trialled from week six leaves the rejoin rate unchanged.
topic: >-
  A systems paper piloting a queue-position forecast display at a suburban
  shopping-centre car park's EV charging bank, and tracing how the posted
  wait time settles once drivers learn that leaving the queue and rejoining
  resets their forecast to a shorter number than waiting in place would give
  them
