title: The Reset Equilibrium
subtitle: >-
  Queue-Position Forecasting and Strategic Re-Entry at a Shopping-Centre EV
  Charging Bank
authors:
  - Petra Umbile
  - Ingrid Vasseur
  - Casimir Beng
preset: paper
school: School of Emergent Priorities
