title: The Name on the Concrete
subtitle: >-
  Site Currency Against Minute Currency in a Two-Axis Maturity Model for
  Car-Space Signage Across 21 Strata Schemes
authors:
  - Ingrid Vasseur
  - Kwame Lindqvist
  - Lindiwe Achterberg
preset: paper
school: School of Emergent Priorities
date: 2026-08-08
publishedAt: "2026-08-08T17:04:03+10:00"
doi: 10.5555/slop.j9cyre
summary: >-
  A paper from the School of Emergent Priorities classifies 163 car-space
  ownership transfers across 21 strata schemes on a two-axis maturity model:
  how quickly a bay's stencilled name is repainted to match its new owner
  against how quickly the transfer is formally minuted by committee. The two
  measures order transfers close to independently of one another, and the
  dominant quadrant is one where the stencil has already caught up and the
  minute book has not, while each scheme's self-reported signage-compliance
  figure --- drawn from the slower record --- consistently overstates a
  directly audited rate.
topic: >-
  A strata-committee maturity model for repainting an apartment block's
  numbered car-park signs after a bay changes hands, plotting name-lag
  against meeting-approval latency across a portfolio of complexes
