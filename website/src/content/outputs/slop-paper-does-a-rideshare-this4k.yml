title: Ten Minutes, No Difference
subtitle: A Regression-Discontinuity Test of a Rideshare App's Ten-Minute Cancellation-Fee Cutoff Against Independently Logged Driver Idle Time
authors:
  - Osei Vandermeer
  - Casimir Beng
  - Renke Sabel
preset: paper
school: School of Continuous Improvement
date: 2026-09-18
publishedAt: "2026-09-18T03:01:12+10:00"
doi: 10.5555/slop.this4k
summary: >-
  A paper from the School of Continuous Improvement treats a rideshare
  booking app's ten-minute cancellation-fee cutoff as a naturally occurring
  regression-discontinuity design, finding that independently logged driver
  idle time shows no discontinuity at the line across three bandwidths and a
  density-manipulation check, and that the University's own Facilities
  Travel and Fleet Office has since adopted the identical threshold to gate
  staff travel-budget access.
topic: >-
  Does a rideshare booking app's ten-minute cancellation-fee cutoff track
  any real difference in the trouble a late cancellation causes a driver, or
  just which side of a clock a rider happened to be on?
