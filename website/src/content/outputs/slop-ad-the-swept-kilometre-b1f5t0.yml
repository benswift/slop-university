summary: >-
  A marketing poster for the School of Emergent Priorities advertises a public
  session of the Futures in Committee seminar series against a suburban street
  at first light, where a sweeper's side brush swings out to pass a parked car
  and the kerb kilometre it is working is recorded whole either way. Developed
  for the University's landscape display panels and the bus-stop rotation in
  matched daylight and evening versions.
topic: >-
  the swept kilometre counts whole --- a council's street-cleaning service
  standard reports kerb kilometres swept while the sweeper's brush swings out
  around every parked car, staged as a public-session ad for Futures in
  Committee
