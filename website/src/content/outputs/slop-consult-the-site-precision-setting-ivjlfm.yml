title: Reporting Field Sites to the Ten-Kilometre Cell
subtitle: >-
  A Department of Policy Settings consultation paper on how precisely a
  University output may locate a field site
authors: []
preset: consultation-paper
date: 2026-11-25
publishedAt: "2026-11-25T03:32:47+11:00"
doi: 10.5555/slop.ivjlfm
summary: >-
  The Department of Policy Settings consults the schools on the Slop University
  (Field Site Reporting) Determination 2021, under which an output may locate a
  field site no more precisely than the ten-kilometre square of the
  University's reporting grid, the precise location being lodged in an
  unpublished register. Noting school concerns that repeat survey, comparison
  between survey epochs and work on features that cross a cell boundary cannot
  be checked or revisited at that resolution, it sets out four options:
  retaining the cell, precision by class of site, a location record lodged with
  each output, or reporting a site as recorded with generalisation on
  application. It poses ten questions and takes a preliminary view, subject to
  consultation, that the location record may address most of the issues.
topic: >-
  the site-precision setting: whether every field location in a University
  output must still be reported no more precisely than a ten-kilometre grid
  cell, now that geographers report catchment, landform and repeat-survey work
  cannot be checked or revisited at that resolution
