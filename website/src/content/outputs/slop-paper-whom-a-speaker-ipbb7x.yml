title: Talking Toward the Plate
subtitle: Bias in the Generalized Matching of Conversational Orientation to Listener Agreement at a Workplace Morning Tea
authors:
  - Vigdis Emenike
  - Hedvig Anyanwu
  - Signy Okpara
preset: paper
school: School of Underlying Conditions
date: 2026-11-05
publishedAt: "2026-11-05T06:02:16+11:00"
doi: 10.5555/slop.ipbb7x
summary: >-
  A behaviour-analytic paper seats eight office volunteers at a morning-tea
  table with two confederate listeners who agree with them on independent
  variable-interval schedules, and finds that speakers allocate their talk
  between the listeners as the generalized matching law describes, with mean
  sensitivity of 0.63. Seven of the eight were also biased toward whichever
  listener sat beside the plate of biscuits, by about 1.19 times at equal
  agreement, a bias that held steady across the session as biscuit-taking fell
  away.
topic: >-
  whom a speaker talks toward at a workplace morning tea: generalized matching
  of conversational orientation to two listeners' programmed rates of
  agreement, and the bias toward the side of the table with the biscuits
