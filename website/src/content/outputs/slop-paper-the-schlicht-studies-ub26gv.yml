title: Nothing Twice
subtitle: Univalence as a Compositional Rule in an Anonymous Cycle of Disc-Notated Keyboard Studies
authors:
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-11
publishedAt: "2026-10-11T03:00:56+11:00"
doi: 10.5555/slop.ub26gv
summary: >-
  A paper from the School of Underlying Conditions describes an anonymous
  manuscript of twelve keyboard studies, each notated as the image of three
  concentric circles under a function analytic in the unit disc and composed
  under the rule that no combination of pitch class and dynamic may occur
  twice. It shows that eleven studies keep the rule, and argues from the
  inking, the pencil layer and the composer's command of the coefficient
  bounds that the single self-crossing in the seventh study is deliberate.
topic: >-
  The Schlicht Studies: a source-critical and analytic reading of an anonymous
  keyboard cycle notated on the unit disc and composed under the rule of
  univalence, and of the single double point in its seventh study
