doi: 10.5555/slop.5j4cjr
summary: >-
  A research poster from the School of Continuous Improvement replays 312
  repaired defects from 46 lab-maintained consensus and formation controllers
  against each repository's own tests and against oracles taken from the
  invariants their published proofs guarantee. The own tests detect 40% of
  the defects and the invariant oracles 85%; 146 defects still bring every
  agent to a common value the proof does not permit, and own tests flagged
  nine of them.
topic: >-
  it still converges: a defect study of research-lab consensus and formation
  controllers reimplemented from published control laws, where in-place
  updates and stale neighbour reads pass agreement tests yet break the
  invariants the proofs rely on
