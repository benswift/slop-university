doi: 10.5555/slop.sg4u7g
summary: >-
  A research poster from the School of Continuous Improvement interviews
  sellers on a local buy-and-sell marketplace app about the "reserved"
  comment they say carries no real obligation, finding most still hold an
  item for days for a buyer who has gone quiet rather than sell to whoever
  asked second, and reports the Review Cadence Observatory's decision to
  adopt the same grace period as binding policy for its own shared-equipment
  bookings.
