doi: 10.5555/slop.cxudpp
summary: >-
  A research poster from the School of Emergent Priorities scores nine
  months of courier deliveries for whether a recipient's handheld-pad
  signature ever resembles their own earlier capture, finding same-recipient
  similarity statistically indistinguishable from cross-recipient pairs and
  from the enrolled specimen on file, with no measurable effect on how the
  receiving office resolves a signature dispute.
topic: >-
  a repeat-delivery signature-matching study: whether a person's courier-pad
  signature ever matches itself from one delivery to the next, and what the
  receiving office does when a dispute turns on one that doesn't
