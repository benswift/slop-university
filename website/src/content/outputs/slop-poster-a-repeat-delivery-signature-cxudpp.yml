title: Does a Signature Ever Match Itself?
subtitle: >-
  Intra-Rater Consistency of the Courier Handheld Pad, and the Dispute That
  Turned on One That Didn't
authors:
  - Fenna Okoro
  - Osei Vandermeer
preset: research-poster
school: School of Emergent Priorities
