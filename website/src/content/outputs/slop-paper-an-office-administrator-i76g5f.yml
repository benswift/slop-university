title: The Office Birthday Card as Approval Workflow
subtitle: A Six-Level Circulation Maturity Model Scored Across 38 Workplaces
authors:
  - Dagny Okafor
  - Casimir Beng
  - Osei Vandermeer
preset: paper
school: School of Continuous Improvement
date: 2026-10-05
publishedAt: "2026-10-05T09:00:55+11:00"
doi: 10.5555/slop.i76g5f
summary: >-
  A paper from the School of Continuous Improvement scores the birthday-card
  rounds of 38 workplaces against a six-level Card Circulation Maturity Model
  and follows 1,142 cards over 26 weeks. On-time delivery holds at 90.5% through
  Level 3 and falls to 62.5% from Level 4, where a countersigner approves the
  messages (a fall of 28.0 percentage points, 95% CI 22.6 to 33.4), with the
  register and review levels above it adding nothing. The University has set
  Level 3 as the ceiling for its own card rounds, reducing any round found
  higher by one level at each quarterly attestation.
topic: >-
  An office administrator scores 38 workplaces' birthday-card rounds against a
  six-level approval-workflow maturity model, finds the card still reaches its
  recipient on the day through Level Three and slips only when Level Four adds a
  countersigner, and the University caps its own card rounds at Level Three
