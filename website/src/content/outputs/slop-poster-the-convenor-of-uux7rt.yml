title: The Shared Playlist as Suggestion Box
subtitle: Twenty-four Fridays of open-edit and single-curator control, and what the skip button logged
authors:
  - Eivind Onwuka
  - Joost Nwosu
  - Solveig Adeyemi
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-08
publishedAt: "2026-10-08T06:00:46+11:00"
doi: 10.5555/slop.uux7rt
summary: >-
  A research poster from the School of Continuous Improvement alternates an
  open edit link and a single curator on one social club's Friday-afternoon
  playlist across 24 weeks, finding skips per hour level at 4.83 and 4.80
  (difference 0.03, 95% CI -0.80 to 0.86, inside the margin set in advance).
  From the first Friday of term the University freezes every shared playlist it
  operates, withdraws the edit link and disables the skip control, with no
  override.
topic: >-
  The convenor of a shared-office social club alternates open-edit and
  single-curator weeks on the Friday-afternoon shared playlist for 24 weeks,
  testing the playlist as a suggestion box: skips per hour do not differ, and
  the playlist is frozen for the term with the skip button disabled
