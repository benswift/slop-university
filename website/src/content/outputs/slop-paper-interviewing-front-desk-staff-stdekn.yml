title: For Insurance, Probably
subtitle: >-
  An Interview Study of Field Purpose on the Independent Motel Check-In Card,
  and Its Uptake as a Provenance Annotation
authors:
  - Iben Chikere
  - Anneke Tolan
  - Marek Solheim
preset: paper
school: School of Emergent Priorities
date: 2026-07-28
publishedAt: 2026-07-28T19:04:39+10:00
doi: 10.5555/slop.stdekn
summary: >-
  A paper from the School of Emergent Priorities interviews 38 front-desk staff
  at 29 independent roadside motels, each with their own centre's paper
  check-in card in hand, about what every printed field is for. The 29 cards
  carry 41 distinct fields, six of them common to all, and participants offered
  a purpose for a median of five of the seventeen fields on their own card.
  Reflexive thematic analysis yields four themes, chief among them that an
  unexplained field's purpose is reconstructed from whatever is printed beside
  it. One group of eleven properties then adopted the four categories as a
  required per-field provenance annotation, growing its standard card from
  seventeen fields to twenty-three while the share of fields staff could
  account for held at roughly a third.
topic: >-
  interviewing front-desk staff at independent roadside motels about what each
  field on the paper check-in card is actually for, and what a compliance
  review does to the card once nobody can say
