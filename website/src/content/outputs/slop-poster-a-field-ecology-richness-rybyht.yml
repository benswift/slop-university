summary: >-
  A research poster from the School of Settled Matters surveys 240 blocks of a
  regional titles office's permissioned ledger pilot as quadrats, sorting the
  smart-contract templates that execute its dealings into morphospecies and
  observing 37 of them among 1,186 deployments. Sample-based rarefaction and the
  Chao2 estimator put the ledger's template richness near 52 at a sample
  coverage of 98.8%, with the unseen remainder a tail of bespoke easements,
  covenants and caveats; a 90% inventory would take about two and a half times
  the present effort.
topic: >-
  a field-ecology richness survey of smart-contract templates on a permissioned
  land-title ledger, with rarefaction and Chao1 estimates of the instruments not
  yet seen and the question of when such a survey can be called complete
