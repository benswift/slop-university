summary: >-
  A research poster from the School of Continuous Improvement classifies
  47,216 I'm-here taps at eighteen grocery click-and-collect bays into a
  four-class origin taxonomy, finding 31 per cent geolocated inside a marked
  bay. Saturday overtime hours follow the undifferentiated tap count
  (r = 0.71) and are unassociated with the bay-class share (r = 0.09); the
  roster rule was not revised.
