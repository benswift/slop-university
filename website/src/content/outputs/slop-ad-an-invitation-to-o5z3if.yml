summary: >-
  A marketing poster for the School of Settled Matters sets a sunflower above a
  cut-away field, one of its roots sounding a call that the seeds of a parasitic
  plant have already begun to answer, and offers contract law's distinction
  between an invitation and an offer as a way of reading the hosts that learn to
  stop calling. Its featured research is the University's showcase The Quiet
  Root, with two further studies in the small print; developed for bus-stop
  panels and campus digital signage in a portrait rotation.
topic: >-
  an invitation to treat: a School of Settled Matters signage campaign that
  reads a host root's call to a parasitic seed as an offer the root never meant
  to make
