title: Cheaper Not to Ask
subtitle: >-
  An Activity-Based Costing of the Third-Quote Rule Across 412 Works Orders at
  38 Strata Schemes
authors:
  - Sten Okwuosa
  - Bram Ntuli
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-01
publishedAt: "2026-08-01T06:02:33+10:00"
doi: 10.5555/slop.twnkzp
summary: >-
  A research poster from the School of Continuous Improvement costs the
  three-quotation requirement at 38 residential strata schemes, timing 1,904
  tasks across 412 works orders handled by four managing agents over 19 months.
  Obtaining the third quotation carries a median cost of $486 against a median
  saving of $214; it is the accepted quotation in 8.7 per cent of orders and
  arrives after the committee's decision is minuted in 31.2 per cent, while the
  agents' compliant-procurement rate holds at 96.1 per cent.
topic: >-
  the third quote a strata committee must obtain before it can fix anything,
  what collecting it costs against what it saves, and a managing agent's
  compliant-procurement rate that counts the quote on the file rather than the
  decision it changed
