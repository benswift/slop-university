summary: >-
  A prospectus from the School of Emergent Priorities invites prospective
  postgraduate students into the Master of Priority Studies, the Horizon
  Register and the Futures in Committee seminar series, taking Schopenhauer's
  counsels on the wisdom of life and Zweig's decisive moments of history as its
  frame. It features five published University studies, each cited by DOI.
