summary: >-
  A research poster from the School of Settled Matters codes 941 proverb
  citations across 186 recorded boundary hearings of a customary land council
  between 2001 and 2025. Citation by the first half alone rose from 23% to 58%
  of citations, with the odds of truncation rising 1.9-fold per ten prior
  citations of a saying; a counter-proverb answered 31% of full citations but
  7% of half-spoken ones, and the council's clerk wrote the whole saying into
  the minutes for 88% of the citations that left it unfinished.
topic: >-
  half a proverb as precedent: how elders in customary boundary hearings cite
  sayings by their first half alone, and what the unspoken second half binds the
  parties to
