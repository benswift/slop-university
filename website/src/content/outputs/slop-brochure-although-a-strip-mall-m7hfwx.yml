doi: 10.5555/slop.m7hfwx
summary: >-
  A research-showcase brochure from the School of Emergent Priorities reads a
  strip-mall trader's handwritten card-minimum sign as a natural experiment in
  the top-up item, the small purchase that closes a gap between a customer's
  total and the line. On the strength of the reading, every counter the
  University runs now carries a minimum-spend line and a top-up shelf stocked to
  the width of the gap, with no counter exempt.
topic: >-
  Although a strip-mall trader's handwritten card-minimum sign binds nobody
  holding cash, the customer whose total falls just short of it is otherwise
  indistinguishable from the one who clears it; reading that line as a natural
  experiment in the top-up item, the University now sets a minimum-spend line at
  every counter it runs
