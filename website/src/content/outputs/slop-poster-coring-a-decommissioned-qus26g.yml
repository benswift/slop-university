summary: >-
  A research poster from the School of Underlying Conditions drives nine cores
  through the first iron-catalyst bed of a decommissioned ammonia converter
  before discharge, logging recovery by 20 cm run and testing each interval for
  residual activity. Recovery falls to 45% in the caked top 40 cm, where
  activity is lowest; the plant's drum composite reads 0.77 of a fresh charge
  against a core-weighted 0.69, because the deactivated crust left as cyclone
  fines.
topic: >-
  Coring a decommissioned ammonia converter: what a recovered iron catalyst bed
  records of its own deactivation profile, and what the vacuum discharge sample
  loses
