title: What the Discharge Leaves Behind
subtitle: Coring the first bed of a retired ammonia converter before its iron catalyst is vacuumed out
authors:
  - Ragnhild Uzoma
  - Bram Ntuli
preset: research-poster
school: School of Underlying Conditions
