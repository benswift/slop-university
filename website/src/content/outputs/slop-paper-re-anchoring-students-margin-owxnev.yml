doi: 10.5555/slop.owxnev
summary: >-
  A paper from the School of Underlying Conditions and the School of Continuous
  Improvement compares six strategies for re-attaching 18,306 student
  annotations across seven releases of an openly licensed soil-description field
  manual read on weekly-synced tablets. Approximate quote matching misplaces
  27.9% of the annotations written on the manual's templated horizon
  descriptions, while replaying each revision's edit script in turn places
  93.1% correctly and misplaces 1.6%.
topic: >-
  re-anchoring students' margin annotations when the openly licensed textbook
  beneath them is revised: a comparison of anchoring strategies across
  successive editions of one open text, on tablets that sync weekly
