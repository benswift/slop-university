title: Orphaned in the Margin
subtitle: Carrying Student Annotations Across Revisions of an Openly Licensed Field Manual
authors:
  - Brynjar Obiora
  - Mirela Hanke
  - Ingeborg Nwachukwu
preset: paper
school: School of Underlying Conditions
date: 2026-11-04
