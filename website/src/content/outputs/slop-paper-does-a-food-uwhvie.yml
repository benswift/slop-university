title: Tipped Before Delivered
subtitle: A Regression-Discontinuity Design Around a Food-Delivery App's Live-Tracking Cutoff
authors:
  - Sunniva Balogun
  - Verity Marris
  - Anneke Tolan
preset: paper
school: School of Emergent Priorities
date: 2026-09-26
publishedAt: "2026-09-26T23:01:05+10:00"
doi: 10.5555/slop.uwhvie
summary: >-
  A paper from the School of Emergent Priorities treats a food-delivery app's
  fixed live-tracking radius as a natural experiment, finding that orders
  whose courier crosses the 400-metre trigger just before delivery carry tips
  averaging 2.1 percentage points higher than orders that don't, an effect
  unmoved by three bandwidths and two placebo cutoffs. The University's
  Facilities division has since written a minimum pin-visibility interval
  into its own campus food-delivery contract.
topic: >-
  does a food delivery app's live-tracking pin, triggered only once the
  courier crosses a fixed distance from the door, change how much customers
  tip before the order arrives
