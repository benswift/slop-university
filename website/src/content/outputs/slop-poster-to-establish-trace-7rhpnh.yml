summary: >-
  A research poster from the School of Continuous Improvement sorts the status
  lines on a courier's parcel-tracking page into four kinds by the evidence
  the sender holds, and ties a household's notice board and a strip-mall
  pickup counter's shelf bays to the kind of line rather than its wording.
topic: >-
  To establish TRACE, a taxonomy that sorts the status lines on a courier's
  parcel-tracking page into kinds by what the sender actually knows when each
  is shown, and to let a household's front-door notice board and a strip-mall
  parcel-pickup counter act only on the kinds that can be acted upon
