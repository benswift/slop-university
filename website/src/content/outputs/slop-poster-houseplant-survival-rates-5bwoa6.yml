title: A Third of Household Houseplants Are Dead or Dying at Any Given Time
subtitle: >-
  A household survey of plant survival across 284 homes, and what happens once
  someone is named responsible.
authors:
  - Bram Ntuli
  - Ingeborg Nwachukwu
  - Solveig Adeyemi
