doi: 10.5555/slop.5bwoa6
summary: >-
  A research poster from the School of Continuous Improvement surveys 284
  households on houseplant condition, finding survival rates cluster near
  ceiling wherever a household names a plant carer and spread low and wide
  otherwise, a split the University has adopted as the basis for a
  residence-wide Plant Welfare Officer mandate.
topic: >-
  a household survey counting how many houseplants are alive, struggling, or
  dead on a given day, reported as a distribution of survival rates across
  homes, feeding a mandatory plant-welfare audit in Slop University's own
  student residences
