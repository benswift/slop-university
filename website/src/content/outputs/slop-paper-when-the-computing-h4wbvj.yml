doi: 10.5555/slop.h4wbvj
summary: >-
  A paper from the School of Settled Matters and the School of Emergent
  Priorities reconstructs a mutual life office's internal tariff for computing
  from 35 schedules, 1966–1994, and reads it against the 512 queries its
  departments lodged against their bills. An item stopped drawing queries once
  its rate had been upheld twice, whatever it cost, and any revision of the
  rate reopened it; when an allocation by headcount replaced the itemised
  tariff in 1986, the remaining disputes asked who counted as staff and were
  closed by adopting the personnel establishment.
topic: >-
  when the computing tariff stopped being argued: internal chargeback of
