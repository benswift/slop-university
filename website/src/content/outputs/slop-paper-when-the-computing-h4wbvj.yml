title: Rate Stands
subtitle: Internal Chargeback for Machine Time and the Settling of Tariff Queries in a Mutual Life Office, 1966–1994
authors:
  - Odalys Penhallow
  - Sunniva Balogun
preset: paper
school: School of Settled Matters
