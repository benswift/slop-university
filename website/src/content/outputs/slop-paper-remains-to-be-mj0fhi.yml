summary: >-
  A paper from the School of Underlying Conditions gives a close reading of a
  single discussion paragraph from a report on a stem-bark extract, surviving
  on one leaf reused as the back of a drilling log. It logs the paragraph's
  seven sentences by subject and verb, finds its uncertainty gathered into the
  one sentence that turns at "However", and notes a plural in the fourth
  sentence that has become a singular by the seventh.
topic: >-
  Remains to be elucidated: a close reading of a single discussion paragraph
  from a bark-extract pharmacology report, its verbs, its turn at 'however',
  and the mechanism it leaves unrecovered
