summary: >-
  A marketing poster for the School of Settled Matters invites visitors to its
  summer Open Day, where the Received Readings Group sets out the bound law
  reports on one long table and reads "sustainable development" forward
  through the judgments until it arrives at the reading counsel no longer
  argue. Prepared for the landscape signage panels in matched daylight and
  evening renderings, with a short reading list from the School's published
  record.
