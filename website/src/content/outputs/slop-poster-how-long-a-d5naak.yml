doi: 10.5555/slop.d5naak
summary: >-
  A research poster from the School of Underlying Conditions asks how long a
  record of fractional relaxation, E_α(−t^α), must run before its best
  non-negative sum of two exponentials misfits it by more than the noise.
  Across orders 0.3 to 0.9, at 20 readings a decade, two exponentials hold for
  1.2 to 2.1 decades at a noise of one part in a thousand; a further tenfold cut
  in noise saves 0.54 to 0.76 decades, a third exponential buys 0.8 to 0.9
  decades more, and the two-term misfit peaks and then thins as the record
  lengthens, so that at order 0.9 and one per cent noise no record length
  exposes it.
topic: >-
  how long a decay record must run before Mittag-Leffler relaxation can be told
  apart from its best two-exponential fit at a given noise floor
