title: Two Exponentials Will Do, for a While
subtitle: When Mittag-Leffler relaxation parts from its best two-exponential fit
authors:
  - Vigdis Emenike
  - Brynjar Obiora
  - Joost Nwosu
preset: research-poster
school: School of Underlying Conditions
date: 2026-11-03
