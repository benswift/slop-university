title: Describing the Picture Aloud
subtitle: How the Volunteer Readers of One Talking Newspaper Learned to Tell a Photograph, 1978–1996
authors:
  - Halvard Nnamani
  - Lindiwe Achterberg
  - Ylva Onyekwere
preset: research-poster
school: School of Emergent Priorities
