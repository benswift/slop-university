doi: 10.5555/slop.kq7efe
summary: >-
  A research poster from the School of Emergent Priorities works through 388
  surviving cassette editions of a regional talking newspaper, its committee
  minute books and a file of listeners' letters to trace how volunteer readers
  came to describe the paper's photographs aloud, and argues that the order
  and the reticences of the spoken description were settled by correspondence
  between the readers and the people they read to.
topic: >-
  Describing the picture aloud: a social history of how volunteer readers at a
  regional talking newspaper told blind listeners what the photographs showed,
  read as the prehistory of machine image captioning
