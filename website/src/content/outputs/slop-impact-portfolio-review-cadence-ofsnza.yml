summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 presents three
  case studies of its work with investment committees and fund boards: a
  review calendar that gives each standing agenda item its own interval, a
  registered benchmark statement for each portfolio, and a redesigned
  quarterly reporting pack. The report describes how performance came to be
  read in those rooms and takes no view on portfolio returns, which were
  outside the scope of every engagement.
topic: >-
  portfolio review cadence in investment committees: five years of the
  School's work on how trustees and fund boards read, benchmark and report
  performance
