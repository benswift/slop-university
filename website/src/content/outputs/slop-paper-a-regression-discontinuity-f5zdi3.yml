title: Scored, Not Sung
subtitle: >-
  A Regression-Discontinuity Estimate of an Audition Cutoff's Effect on
  Three-Year Choir Retention
authors:
  - Hedvig Anyanwu
  - Iben Chikere
  - Fenna Okoro
preset: paper
school: School of Emergent Priorities
date: 2026-09-16
publishedAt: "2026-09-16T06:45:23+10:00"
doi: 10.5555/slop.f5zdi3
summary: >-
  A regression-discontinuity study pools 1,214 audition scoresheets from
  nineteen amateur community choirs and finds that singers who narrowly clear
  a touring-ensemble audition cutoff are 31.4 percentage points more likely to
  remain enrolled in a consortium choir three years later than singers who
  narrowly missed it, an estimate stable across bandwidth choice and absent at
  three placebo cutoffs. The Horizon Register has since begun requiring any
  hobby or community organisation seeking Capability Sprints placement
  funding to publish a fixed numeric entry threshold of its own.
topic: >-
  a regression-discontinuity quasi-experiment on a community choir's
  audition-score cutoff for the touring ensemble, showing membership just
  above the threshold is far more likely to still be singing three years
  later than membership just below it
