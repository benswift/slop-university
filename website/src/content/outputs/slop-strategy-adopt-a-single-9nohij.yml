title: Every Interval Accounted For
subtitle: >-
  The 2026-2031 Strategic Plan Measures How Much of Every Research Run Comes
  Back, and Shelves a Labelled Placeholder for Each Interval That Does Not
authors:
  - Ragnhild Uzoma
  - Marek Solheim
  - Eskil Nwabueze
preset: strategy
school: School of Underlying Conditions
date: 2026-10-26
publishedAt: "2026-10-26T07:01:31+11:00"
doi: 10.5555/slop.9nohij
summary: >-
  Slop University's Strategic Plan 2026-2031 adopts a single Innovation
  Recovery Rate, taken from the core-recovery log of the drill tray: every
  research project declares its length in effort before it begins, reports the
  share that returned a usable result when it closes, and lodges a standard
  placeholder, shelved beside the outputs, for every interval that did not.
  Declared stop rules, a shared Core Library of lodged runs and an annual
  Recovery Statement to Council carry the measure into improvement.
topic: >-
  adopt a single innovation recovery rate for the whole University: treat every
  research project as a drill run, log the share of effort that comes up as a
  usable result, and stand a labelled placeholder in the record for every
  interval that does not
