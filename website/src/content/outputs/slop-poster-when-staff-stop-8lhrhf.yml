title: Two Searches, Then a Colleague
subtitle: An Optimal-Stopping Account of When Staff Leave the Internal Wiki to Ask Someone
authors:
  - Thandiwe Solberg
  - Mirela Hanke
  - Bram Ntuli
preset: research-poster
school: School of Continuous Improvement
