doi: 10.5555/slop.8lhrhf
summary: >-
  A research poster from the School of Continuous Improvement fits a sequential
  search model with learned beliefs to 3,118 logged help-seeking episodes from
  212 staff at an engineering consultancy, treating each choice between one more
  internal wiki query and a message to a colleague as a stopping decision. Staff
  typically switch after two failed queries, and when a mid-study re-index
  raised per-query success from 0.31 to 0.44 the switch point barely moved: the
  fitted model attributes this to slowly updating beliefs about the wiki, and
  implies roughly ten weeks for those beliefs to close half the gap.
topic: >-
  when staff stop searching the internal wiki and message a colleague instead:
  an optimal-stopping model of help-seeking fitted to logged search sessions
