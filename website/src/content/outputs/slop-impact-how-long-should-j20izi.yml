summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 follows the
  Living Dashboard's Noticeboard Watch, a camera-timed corkboard that
  auto-archives any notice past its published half-life, from a facilities
  pilot to the University's only sanctioned route for pinning a notice at
  all.
topic: >-
  How long should a notice stay pinned to the tea-room corkboard before it
  stops counting as current? The Living Dashboard convenor built the
  Noticeboard Watch, a camera above the board that times every notice's
  tenure and auto-archives anything past its calculated half-life, and the
  School has now made it the only way anything may be posted there.
