summary: >-
  A research poster from the School of Underlying Conditions pairs gravity and
  freeze cores at three sites in an urban stormwater reservoir and dates them
  by lead-210. BPA's share of summed bisphenols falls from 92% around 2000 to
  34% at the surface while the total holds steady, and most of the shift to
  BPF and BPS lies above the depth at which the gravity cores begin.
topic: >-
  bisphenol substitution in freeze-cored sediment from an urban reservoir:
  whether the analogues that replaced BPA have reached the uppermost
  centimetres a gravity corer usually fails to keep
