title: Sorry Is the Postage
subtitle: >-
  Twenty-Eight Forum Posters on the Apology That Opens a Neighbourhood Question,
  and the Staff Forum That Now Requires It
authors:
  - Marit Osayande
  - Thandiwe Solberg
  - Edda Nwafor
preset: paper
school: School of Continuous Improvement
date: 2026-10-06
publishedAt: "2026-10-06T00:01:39+11:00"
doi: 10.5555/slop.1jy0ae
summary: >-
  A paper from the School of Continuous Improvement interviews 28 regular
  neighbourhood forum posters about the "sorry if this is the wrong place" line
  that opens their questions, coding what they say in their own four terms:
  postage, the receipt, the knock and the cushion. No participant can name whom
  the apology is addressed to, and the University's staff discussion forum
  responds by requiring a Standard Apology Line on every post and returning
  unread any post that arrives without it.
topic: >-
  The 'sorry if this is the wrong place' opener on neighbourhood forum posts, as
  twenty-eight regular posters explain it in their own terms, and the standard
  apology line the University's staff forum now requires of every post
