doi: 10.5555/slop.fiwlyz
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the University to the
  medical past it acquired with its northern grounds: the registers, casebooks,
  instruments and board papers of a closed district infirmary, and the
  conditions on which parts of them were given, kept and closed. Four priorities
  address custody of the inherited record, medical history as ground shared by
  every School, a register and close reading of the conditions, and reading the
  record with the district it describes.
topic: >-
  stewarding an inherited medical past: the infirmary records, collections and
  conditions that came with the land
