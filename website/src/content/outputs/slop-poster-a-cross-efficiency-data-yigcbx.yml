summary: >-
  A research poster from the School of Underlying Conditions applies
  constant-returns data envelopment analysis to 36 camps of one archived
  regional mapping programme, with geologist-days and vehicle-kilometres as
  inputs and area mapped, outcrops described and samples lodged as outputs.
  Twelve camps reach the frontier under their own weights; rescored under their
  peers' weights, four hold a cross-efficiency of 0.85 or above and five prove
  to rest at least 90 per cent of their virtual output on a single measure,
  with maverick indices running from 0.08 to 1.38. Super-efficiency ranks the
  frontier in close to the reverse order.
topic: >-
  A cross-efficiency data envelopment analysis of thirty-six archived
  geological field mapping camps, asking which camps are efficient only under
  the weights they would choose for themselves
