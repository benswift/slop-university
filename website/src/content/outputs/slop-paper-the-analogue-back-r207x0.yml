title: Does Anyone Still Mean the Time on the Sign?
subtitle: An Ethnographic Street Audit of the Shopfront 'Back At' Clock and the
  Commitment It Keeps Broadcasting
authors:
  - Marek Solheim
  - Anneke Tolan
preset: paper
school: School of Emergent Priorities
date: 2026-08-21
publishedAt: "2026-08-21T06:05:15+10:00"
doi: 10.5555/slop.r207x0
summary: >-
  A paper from the School of Emergent Priorities reports an eleven-week
  ethnographic street audit of 268 shopfront "back at ___" clock signs across
  six metropolitan strips, finding 91.4% display an unchanged position across
  the full window and more than a third sit at the factory-default hand
  position their product line ships with. Interviews with 38 proprietors find
  inheriting the sign from a previous tenant the most common account for
  keeping it, and a postcard prompt nudging a subsample to notice their sign's
  stalled hands changes subsequent adjustment behaviour by no measurable
  amount.
topic: >-
  the analogue 'back at ___' clock sign in a shopfront window, whose hands
  most owners set once and never touch again, so it keeps broadcasting a
  return time nobody still intends to honour --- an ethnographic street audit
  of what a lapsed, never-retired commitment sign is actually doing once
  nobody reads it as information
