summary: >-
  A research poster from the School of Continuous Improvement reads the
  furnished plans of a suburban branch library before and after a refit planned
  around its overhead activity-recognition system, and finds that the distinct
  activities observed at seven positions on the plan fell from forty-six to
  thirteen once the long reading table gave way to an aisle. It argues that the
  refit reinstates functional zoning at the scale of the furniture, and
  recommends restoring one table the system cannot classify.
topic: >-
  functionalism at the scale of the armchair: a design critique of a branch
  library refitted so that each zone of its floor hosts the one activity its
  ceiling recognition system can name
