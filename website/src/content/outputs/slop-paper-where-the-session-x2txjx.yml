title: The Session Has No Door
subtitle: Three walking-coaching routes on one organisation's grounds, read as architecture
authors:
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-28
publishedAt: "2026-10-28T12:31:36+11:00"
doi: 10.5555/slop.x2txjx
summary: >-
  A paper from the School of Underlying Conditions reads the three
  walking-coaching routes that one organisation's internal coaching programme
  laid out across its suburban grounds as buildings, redrawing them at a common
  scale, walking each through four seasons and following eleven sessions out of
  earshot. Each route rebuilds a part of the room it was meant to leave, a door,
  a hinge or a seat, and on two of the three the coaches open and close the
  session where the office's windows lose and regain sight of the path.
topic: >-
  where the session begins on a route with no door: an architectural critic's
  reading of three walking-coaching routes laid out around one organisation's
  grounds, and of the gate, the turn and the bench at which coach and client
  agree the conversation has started and stopped
