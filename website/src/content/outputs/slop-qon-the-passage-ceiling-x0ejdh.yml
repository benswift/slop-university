title: Retired at Passage Forty
subtitle: >-
  The Department of Policy Settings answers questions taken on notice by the
  Committee on Settings Oversight on the passage ceiling and the cell lines made
  within the University
authors:
  - Verity Marris
  - Anselm Threlkeld
  - Lindiwe Achterberg
  - Odalys Penhallow
preset: questions-on-notice
date: 2026-11-16
publishedAt: "2026-11-16T23:31:52+11:00"
doi: 10.5555/slop.x0ejdh
summary: >-
  The Department of Policy Settings answers five questions on the Slop
  University (Cell Culture) Determination 2026, which retires every cell line
  forty passages after thaw from an authenticated stock and gives a line made
  within the University its parent's passage count. Taken on notice at the
  Committee on Settings Oversight's Supplementary hearings of 5 November 2026 or
  lodged in writing after them, its answers report 223 lines retired at the
  ceiling since 1 February, 53 of them derivative lines and all 53 at passage
  40; count one subdivision into several vessels as a single passage; state
  that it does not hold how long a retired derivative line had been in culture;
  trace the inherited count to the Determination's requirement of one
  authenticated reference; and decline to reconcile 4,618 register entries
  against laboratory records.
topic: >-
  the passage ceiling: a cell-culture setting that retires every line forty
  passages after thaw, put to the Department by members whose neighbouring
  melanoma laboratories take months to grow a line resistant to BRAF and MEK
  inhibitors
