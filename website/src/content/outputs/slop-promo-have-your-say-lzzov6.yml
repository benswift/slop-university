summary: A short profile of Dr Ronja Oyelaran, Senior Lecturer in the School of Emergent
  Priorities, told largely in her own words. A former adviser to a state planning
  authority, Dr Oyelaran traces what becomes of the views a consultation invites,
  from a bus-stop comment box that counts every slip as a completed consultation to
  a smoke-alarm survey in which the word "working" meant six different things. The
  video also marks her research funding, among the ten highest at the University,
  from the Anticipatory Capability Fund.
