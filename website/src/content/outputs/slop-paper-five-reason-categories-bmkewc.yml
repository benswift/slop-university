title: "The Blank-Reason Correction Predicts the Audit Reversal"
subtitle: "A Five-Category Taxonomy of 2,918 Timesheet-Correction Requests at a National Cleaning-Services Contractor"
authors:
  - Ingrid Vasseur
  - Kwame Lindqvist
  - Sten Okwuosa
preset: paper
school: School of Emergent Priorities
date: 2026-08-30
publishedAt: "2026-08-30T10:32:20+10:00"
doi: 10.5555/slop.bmkewc
summary: >-
  A paper from the School of Emergent Priorities develops a five-category
  taxonomy of timesheet-correction requests filed by shift workers at a
  national cleaning-services contractor, applying it to 2,918 requests
  across 41 client sites over one payroll quarter (Cohen's kappa = 0.83).
  Requests coded with no stated reason made up the smallest share of the
  corpus (9%) but were reversed at the contractor's next payroll-integrity
  audit at 39%, versus 8-15% for the other four categories (adjusted odds
  ratio 5.8, 95% CI 2.9-11.6). Within six weeks of the contractor adopting
  the taxonomy as mandatory policy, the blank-reason share of new requests
  roughly halved without a corresponding fall in the audit-reversal rate.
topic: >-
  five reason-categories sort every timesheet-correction request filed by
  a cleaning contractor's shift workers, and the blank-reason kind alone
  predicts whether the correction is reversed in the next
  payroll-integrity audit --- grounds enough for the contractor to suspend
  a worker's correction-filing rights after three of them in a quarter
