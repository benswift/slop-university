doi: 10.5555/slop.q051j4
summary: >-
  A research poster from the School of Continuous Improvement applies
  optimal-matching sequence analysis to 2,714 wildlife-care records lodged by 61
  licensed volunteer carers across three rescue seasons, coding each record's
  state month by month. Four trajectory types cover 2,610 records; the largest
  holds a record open with no terminal code entered from month four onward, and
  44 per cent of records sit in that state at month nine. Release rate computed
  over the records that carry a terminal code is 0.79 against 0.41 over all
  intakes, and ranking the body's 31 branches on the published figure correlates
  0.19 with ranking them on all-intake release.
topic: >-
  the wildlife-rescue care record on a volunteer carer's kitchen bench, where a
  state rehabilitation body publishes a release rate computed only over records
  that reached an outcome --- a sequence analysis of three seasons of care
  records finding the most common trajectory never reaches a terminal state at
  all, so the animals doing worst are the ones missing from the denominator
