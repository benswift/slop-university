title: The Record That Never Closes
subtitle: >-
  A Sequence Analysis of 2,714 Wildlife-Care Records Against a
  Closed-Records-Only Rate
authors:
  - Sten Okwuosa
  - Thandiwe Solberg
  - Iben Chikere
preset: research-poster
school: School of Continuous Improvement
