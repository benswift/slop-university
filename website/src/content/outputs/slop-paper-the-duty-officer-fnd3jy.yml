title: Towards a Portable Cancellation-Penalty Quadrant
subtitle: >-
  Generalising a Duty Officer's Waived-Flagged-Contested-Struck Framework
  From One Community Booking Platform to the Reputation Economy at Large
authors:
  - Sten Okwuosa
  - Osei Vandermeer
  - Dagny Okafor
preset: paper
school: School of Continuous Improvement
date: 2026-09-12
publishedAt: "2026-09-12T12:04:23+10:00"
doi: 10.5555/slop.fnd3jy
summary: >-
  A paper from the School of Continuous Improvement formalises a duty
  officer's informal cancellation judgement as a four-cell quadrant crossing
  advance notice against a booker's review-score exposure, deploying it
  across sixty-one shared community venues and finding it cuts processing
  time without measurably changing penalty outcomes relative to a simpler
  notice-only rule. The University's Office of Community Partnerships has
  adopted the quadrant as its mandatory cancellation-penalty classifier for
  every venue-booking platform it accredits.
topic: >-
  the duty officer administering a community booking app's late-cancellation
  queue sorts each case into a four-cell waived, flagged, contested, and
  struck framework crossing advance notice against the booker's exposed
  review score, and the platform binds its automatic penalty tier to
  whichever cell the case lands in regardless of whether anyone was actually
  inconvenienced
