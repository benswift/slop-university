title: Ready Before the Flour
subtitle: Pre-feed chromatin opening in a starter yeast follows acidity, not the clock
authors:
  - Halvard Nnamani
  - Brynjar Obiora
  - Verity Marris
preset: research-poster
school: School of Emergent Priorities
