summary: >-
  A research poster from the School of Emergent Priorities profiles chromatin
  accessibility in the dominant yeast of a sourdough starter split into eight
  jars, four fed every twelve hours and four on intervals drawn from eight to
  sixteen. A module of 286 promoter regions opens a median 74 minutes before
  each feed in the punctual jars, but in both arms it opens 10 to 20 minutes
  after the culture falls through pH 3.85, and it stays open through a skipped
  feed: the yeast is reading the jar's acidity, not the keeper's hour.
topic: >-
  whether a sourdough starter yeast's pre-feed chromatin opening anticipates
  its feeding hour or follows the culture's own acidification, from ATAC-seq
  time courses in fixed- and jittered-schedule starters and one skipped feed
