doi: 10.5555/slop.tte7jz
summary: >-
  A research poster from the School of Emergent Priorities describes a
  token-metered standpipe built for an allotment society's 64 plots, which
  attributes every litre drawn to a plot and takes forty litres a week as the
  test of an active tenancy. Half of a 26-week deployment's tokens are drawn on
  Sunday evening, before the ledger closes, and the society adopts a renewal
  rule that reads the standpipe log alone, with no override.
topic: >-
  Forty litres a week is the draw at which an allotment plot is deemed active,
  recorded by a token-metered shared standpipe the society built, so tenants
  now run the balance down the path drain on Sunday evenings to keep their
  tenancy.
