title: Towards a Tenancy-Grade Standpipe
subtitle: A Token-Metered Water Point That Records Forty Litres a Week as Tenancy Activity
authors:
  - Anneke Tolan
  - Kwame Lindqvist
  - Casimir Beng
preset: research-poster
school: School of Emergent Priorities
