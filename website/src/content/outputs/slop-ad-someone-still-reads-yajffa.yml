summary: >-
  A landscape marketing poster for the School of Underlying Conditions sets a
  lone field scientist dipping a monitoring bore beside an old stone well in an
  emptied hillside town, above a cutaway of the strata beneath it, and invites
  the public to an Open Day talk by Dr Vigdis Emenike on Italy's emptied hill
  towns and what goes on being measured under a town after its economy has
  moved on.
