title: According to Its Terms
subtitle: >-
  The Department of Policy Settings answers questions taken on notice by the
  Committee on Settings Oversight on land-condition clearances given under the
  metal investigation levels that Schedule 2 has since replaced
authors:
  - Odalys Penhallow
  - Anselm Threlkeld
  - Runa Adegoke
preset: questions-on-notice
date: 2026-11-26
publishedAt: "2026-11-26T08:01:47+11:00"
doi: 10.5555/slop.m2g358
summary: >-
  The Department of Policy Settings answers five questions on the Slop
  University (Land Condition) Determination 2022, whose Schedule 2 investigation
  levels for metals in soil were substituted from 1 July 2026, taken on notice
  at the Committee on Settings Oversight's Supplementary hearings of 24 November
  2026 or lodged in writing after them. Its answers report 232 clearances given
  under the former Schedule 2 in force at commencement, 72 of them for field
  plots; administer the transitional provision "according to its terms" without
  saying which Schedule 2 those terms mean, and withhold the advice obtained on
  it; decline on resourcing to compare earlier sample results with the
  substituted levels, while reporting that antimony was analysed for 11 of 138
  recent clearances; hold no record of which cleared ground was once road
  reserve; and report five inquiries from clearance holders, none of which led
  to a revocation.
topic: >-
  the land-condition clearance setting: the Committee presses the Department on
  whether a clearance given under the superseded metal investigation levels of
  the Land Condition Determination still stands once Schedule 2 has been revised
