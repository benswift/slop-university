title: Booked at 1.4, Timed at 2.2
subtitle: >-
  An Elemental Time Study of 1,318 Logbook Services and the Allowances That
  Bill Them
authors:
  - Torun Ezeigwe
  - Bram Ntuli
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
date: 2026-07-31
