doi: 10.5555/slop.7n1ow6
summary: >-
  A research poster from the School of Continuous Improvement times 1,318
  logbook vehicle services element by element across six workshops over
  eleven weeks, holding observed elapsed time against the published
  flat-rate allowance that bills each operation. Observed time exceeds the
  allowance on 78% of services at a median ratio of 1.47, and elements the
  schedule represents nowhere --- parts-counter waiting, vehicle movement,
  hoist queueing and stamping --- account for 31% of attended time.
topic: >-
  the flat-rate time a logbook car service is billed at, timed element by
  element on the workshop floor, against a dealer group's productivity
  indicator that divides billed hours by hours attended
