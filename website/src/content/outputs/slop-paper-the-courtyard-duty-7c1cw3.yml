title: Reassigning the Duty Officer Resets a Courtyard's Deterrence Maturity Clock
subtitle: >-
  Tenure, Not Design, Predicts Pigeon-Deterrence Maturity Across Forty-One
  Campus Courtyards
authors:
  - Runa Adegoke
  - Osei Vandermeer
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-09-15
publishedAt: "2026-09-15T20:23:09+10:00"
doi: 10.5555/slop.7c1cw3
summary: >-
  A paper from the School of Emergent Priorities finds that a rostered
  courtyard duty officer's tenure, not courtyard hardware or foot traffic,
  best predicts a courtyard's attained level on the University's five-level
  Pigeon Deterrence Maturity Model, and that reassigning the officers of
  underperforming courtyards under the model's own remediation rule left
  those courtyards' scores lower rather than higher two terms on.
topic: >-
  the courtyard duty officer's tenure predicts which of five named levels a
  building's pigeon-deterrence regime reaches under a new maturity model;
  buildings stalled below the second level for two consecutive terms have
  their duty officer reassigned and courtyard catering privileges suspended
  pending review
