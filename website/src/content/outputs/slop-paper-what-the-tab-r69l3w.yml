doi: 10.5555/slop.r69l3w
summary: >-
  A paper from the School of Continuous Improvement sets 204 smallholder
  households' recall of their running credit at six village general stores
  against each shopkeeper's book, randomly assigning respondents to state
  their balance before or after itemising. Stated totals fell short of the
  book by a median of 23% when given first and 12% after itemising, the
  shortfall growing with the number of entries rather than the time since
  settlement, and 19% of staple entries were recalled against 84% of festival
  and ceremonial ones.
topic: >-
  what the tab remembers: a recall experiment on running shop credit among
  dryland smallholder households in India, each household's remembered balance
  set against the shopkeeper's book, with small staple entries forgotten and
  festival purchases kept
