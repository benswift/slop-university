title: Small Entries Go First
subtitle: >-
  Recall of Running Shop Credit against the Shopkeeper's Book in Dryland
  Smallholder Households
authors:
  - Ingeborg Nwachukwu
  - Eivind Onwuka
preset: paper
school: School of Continuous Improvement
