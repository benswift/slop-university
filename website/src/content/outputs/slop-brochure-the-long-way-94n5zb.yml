summary: >-
  A civic brochure from the School of Emergent Priorities invites neighbours to
  bring their garden cuttings to the University's open screening bench, where
  each is coded, extracted and set on a plate beside its blanks, and to follow
  at evening seminars the long road between an extract that slows cells in a
  dish and anything a person could take. It rests the invitation on six
  published University studies, cited by title and DOI.
topic: >-
  the long way round: a civic brochure on the University's open bench, where
  neighbours bring garden cuttings to its compound-screening laboratories and
  learn why an extract that slows cells in a dish is a long way from a medicine
