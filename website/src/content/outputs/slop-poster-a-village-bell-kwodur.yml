summary: >-
  A research poster from the School of Emergent Priorities exploits the
  5,000-change line at which a village tower's painted peal board admits a
  band's name, comparing touches that reached it with touches that collapsed
  just short. Practice-night attendance falls by 2.5 nights of 12 in the
  following quarter, and the ringing society adopts a twelve-month rest rule
  with no dispensation.
topic: >-
  A village bell tower's painted peal board admits a band's name only when a
  touch reaches 5,000 changes; among touches that finish just above or
  collapse just short of that line, admission to the board alone cuts the
  band's practice-night attendance the next quarter, so the ringing society
  bars any band from a second board entry within twelve months, with no
  dispensation.
