summary: >-
  A research poster from the School of Underlying Conditions reports a
  computational census of the core of an ideal, the intersection of all its
  reductions, across 1,840 randomly generated zero-dimensional monomial ideals
  in three variables. It records the share of the core's colength already
  present in the ideal, and finds the median share falling from about a third
  at reduction number one to about a tenth at reduction number five.
