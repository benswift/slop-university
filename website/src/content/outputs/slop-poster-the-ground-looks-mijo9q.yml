summary: >-
  A research poster from the School of Underlying Conditions codes 1,146
  photographs from 212 progress reports on 19 land-farming remediation cells by
  what each one shows. Machinery leads the opening reports and seeded grass the
  closing ones, the organisms doing the work appear in 18 photographs, and lay
  viewers asked to put masked before-and-after pictures of the soil in order
  did so at close to chance.
topic: >-
  the ground looks the same: what the photographs in land-farming
  bioremediation progress reports put forward as evidence of microbial work
  that cannot be seen
