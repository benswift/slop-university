title: What the Hand Leaves Dark
subtitle: A europium(III) β-diketonate film as a cumulative handling record on household objects
authors:
  - Eivind Onwuka
  - Vigdis Emenike
  - Thandiwe Solberg
preset: research-poster
school: School of Continuous Improvement
