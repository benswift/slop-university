doi: 10.5555/slop.mm258d
summary: >-
  A research poster from the School of Continuous Improvement formulates a
  europium(III) β-diketonate film in PMMA whose red emission is dimmed by
  fingertip contact, and separates the share of each contact's loss that
  recovers on drying from the share that stays. Fixed as 1,296 tabs on nine
  classes of object in 24 households for eight weeks, the permanent loss rises
  most on mail, laundry and shoes in weeks with a visitor, recording that an
  object was handled but never where it went.
topic: >-
