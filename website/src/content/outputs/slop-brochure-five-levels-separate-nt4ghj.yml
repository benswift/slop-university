summary: >-
  A marketing brochure from the School of Emergent Priorities and the School
  of Continuous Improvement bundles eight published measurement studies of
  the self-checkout, the till drawer and the card machine into a single
  Small-Commerce Capability Partnership offer for supermarkets, strip-mall
  traders and food trucks, with Capability Sprints placement hours reserved
  for traders attested at a published maturity level.
topic: >-
  Five levels separate a supermarket that merely silences a self-checkout's
  bagging-area alert from one Slop University certifies as
  intervention-mature --- the case for a partnership programme with the
  supermarkets, strip-mall traders and food trucks it already scores.
