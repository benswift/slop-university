title: The Price of a Forgotten Start
subtitle: Doubly Resolving Sets in Dendritic Monitoring Networks
authors:
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-16
publishedAt: "2026-10-16T10:00:58+11:00"
doi: 10.5555/slop.iub6vm
summary: >-
  A paper from the School of Underlying Conditions compares the observation
  bores needed to locate a tracer release in a tree-shaped network when the
  release time is known and when it is not. It proves that the leaves form the
  unique minimum doubly resolving set of a tree, that the price of a forgotten
  start equals the number of exterior major vertices, and that the minimum
  resolving subsets of the leaves number the product of their terminal
  degrees; on Shreve's topologically random channel networks the expected
  price is a factor of 4 - 6/n.
topic: >-
  Doubly resolving sets in trees: what a forgotten release time costs a
  dendritic network of monitoring bores, and which headwater bores can be
  retired when it is known
