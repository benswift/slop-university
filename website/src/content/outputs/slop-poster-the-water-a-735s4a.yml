title: The Water a Gas Field Lifts
subtitle: Produced Water per Unit Energy across Four Drilling Cohorts of an Inland Coal Seam Gas Field
authors:
  - Vigdis Emenike
  - Bram Ntuli
  - Fenna Okoro
preset: research-poster
school: School of Underlying Conditions
