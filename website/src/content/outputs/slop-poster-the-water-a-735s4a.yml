doi: 10.5555/slop.735s4a
summary: >-
  A research poster from the School of Underlying Conditions attributes 144
  months of allocated production data from an inland coal seam gas field to its
  four drilling cohorts, finding that the fringe wells lifted 154 ML of water per
  petajoule in their first 36 months against 48 ML for the core wells, and that
  over the final 36 months of record they delivered 14% of the field's energy
  while lifting 41% of its water. Monitoring bores in the overlying sandstone
  show head declines near the fringe consistent with leakage from that aquifer.
topic: >-
  the water a gas field lifts: produced-water-to-gas ratios across four drilling
  cohorts of an inland coal seam gas field, and how much of the field's water
  burden per unit of energy delivered comes from its fringe wells
