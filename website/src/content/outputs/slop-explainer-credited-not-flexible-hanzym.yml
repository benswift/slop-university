title: Credited, Not Flexible, Explained
subtitle: Lindiwe Achterberg, Casimir Beng and Anneke Tolan on a rostering app's weekend
  fairness threshold and what it does to a worker's appraisal
authors:
  - Lindiwe Achterberg
  - Casimir Beng
  - Anneke Tolan
preset: video-explainer
school: School of Emergent Priorities
date: 2026-10-20
publishedAt: "2026-10-20T03:48:22+11:00"
doi: 10.5555/slop.hanzym
summary: A research explainer from the School of Emergent Priorities on Lindiwe Achterberg,
  Casimir Beng and Anneke Tolan's regression-discontinuity study of a shift-rostering
  app's weekend fairness-credit threshold. It follows 438 casual and part-time staff
  at 24 outlets to the line where the app stops offering weekend shifts, and sets
  the appraisal language on one side of it beside the other. Achterberg, Beng and
  Tolan describe the work in their own words.
topic: A research explainer of the regression-discontinuity paper around a shift-rostering
  app's weekend fairness-credit threshold, which finds a 36-point fall in flexibility
  language in supervisors' next appraisals once a worker crosses it, with no matching
  change in rostered hours, shift swaps or incidents
