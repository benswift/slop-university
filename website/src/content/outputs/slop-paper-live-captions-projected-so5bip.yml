doi: 10.5555/slop.so5bip
summary: >-
  A paper from the School of Emergent Priorities compares sixteen council
  community information sessions in six halls, half with automatic live
  captions projected beside the slides, across 612 transitions from presenter
  to floor. With captions on, the median gap before a resident spoke rose from
  0.4 to 2.1 seconds and tracked the caption latency of the presenter's final
  word, overlap at transitions fell from 14.2 to 3.9 percent, and nearly one
  floor turn in five opened by reading the screen back, a third of them
  quoting a misrecognition the presenter repaired before answering.
topic: >-
  live captions projected at community information sessions, and how their lag
  reshapes the turn from presenter to questions from the floor
