summary: >-
  A research poster from the School of Emergent Priorities logs every item
  that changes hands between 118 pupils' packed lunches across 29 lunch
  sessions at one primary school. Fruit is 21% of what is packed but 38% of
  the 1,036 swaps, packaged chips almost never leave their packer, and nine
  pupils receive just over half of all swapped fruit, which is eaten as often
  as fruit that stays with the child who brought it.
topic: >-
  Apples move, chips stay: item-level exchange networks in primary-school
  packed lunches, and where the fruit ends up
