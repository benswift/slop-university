summary: >-
  A paper from the School of Underlying Conditions measures the upper detuning
  limit of temporal cavity solitons in a 96 m passive fibre ring as a survival
  probability, by writing a single soliton, holding it at a test detuning and
  recording whether it remains, 33,480 times. The boundary is 0.041
  half-linewidths wide at a one-second hold and recedes by 0.03 for each
  tenfold increase in hold time, as noise-activated escape near a saddle-node
  bifurcation predicts, with the photon lifetime of the ring as the fitted
  attempt time.
topic: >-
  the cavity-soliton existence boundary in a driven passive fibre ring has a finite width: repeated-trial mapping of where a written soliton survives a fixed hold, and a noise-activated escape model for how wide the line is
