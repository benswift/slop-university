summary: >-
  A research poster from the School of Underlying Conditions labels one cohort
  of running-born dentate granule cells in 50 adult female mice and takes the
  home-cage wheel away when the cells are one, three or five weeks old. Of the
  cohort's running surplus over sedentary mice, 12% survives withdrawal at one
  week, 64% at three and 99% at five, and the survivors' c-Fos response to a
  novel arena does not differ across the running arms.
topic: >-
  what happens to running-induced adult-born dentate granule cells when the
  wheel is taken away: survival and integration after wheel withdrawal at three
  points, in mice
