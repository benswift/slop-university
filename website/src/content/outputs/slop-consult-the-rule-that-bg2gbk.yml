title: Untreated Controls on the Research Farm
subtitle: >-
  A Department of Policy Settings consultation paper on the untreated control
  plots kept by pest trials on the University's shared field plots
authors: []
preset: consultation-paper
date: 2026-11-23
publishedAt: "2026-11-23T06:00:47+11:00"
doi: 10.5555/slop.bg2gbk
summary: >-
  The Department of Policy Settings consults the schools on section 14 of the
  Slop University (Research Farm) Determination 2023, which requires every
  trial declared as a pest trial to keep an untreated control plot within its
  footprint, excluded from the farm programme from sowing to final harvest.
  Noting school concerns about pest pressure passing from those plots to
  adjacent trials, and that the Register of Field Trials records nothing beyond
  a trial's footprint, it sets out three options: retaining the section, shared
  untreated reference blocks in each field, or a control plot returned to the
  farm programme after the final pest assessment and ringed by a guard row. It
  poses nine questions and has formed no view.
topic: >-
  the rule that every pest trial on the University's shared research plots
  keep an untreated control strip all season, and the pests those strips pass
  to neighbouring trials
