title: Depth to Refusal
subtitle: Soil Depth over Bedrock and the Establishment of a Root-Mining Weevil Released against an Invasive Taproot Forb
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-11-14
