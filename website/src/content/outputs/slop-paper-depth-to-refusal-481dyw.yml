doi: 10.5555/slop.481dyw
summary: >-
  A paper from the School of Underlying Conditions augers to refusal at 46
  release sites of a root-mining weevil on a basalt plateau and excavates 1,380
  taproots of its target forb, finding the agent established at 27 sites and
  its odds of establishment 2.6 times higher for every 10 cm of soil over
  bedrock. Where rock lies within 30 cm the taproot meets it and turns, the
  larvae overwinter nearer the crown, and under a third survive to spring,
  against three quarters on deep soils.
topic: >-
  Depth to refusal: soil depth over bedrock and the establishment of a
  root-mining weevil released against an invasive taproot forb, from hand-auger
  logs and taproot excavations across release sites
