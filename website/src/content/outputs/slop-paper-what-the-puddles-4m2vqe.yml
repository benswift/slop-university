doi: 10.5555/slop.4m2vqe
summary: >-
  A paper from the School of Underlying Conditions and the School of Settled
  Matters levels an engraved donor pavement laid in annual tranches between
  1986 and 2019, times standing water on each of its 1,186 slabs through seven
  rain events, and measures surface recession against the sliver of original
  stone preserved beneath the pointing. Recession tracks cumulative ponded
  residence at 0.37 mm per 1,000 hours in the limestone tranches and 0.17 mm in
  the sandstone ones, varies by a factor of 4.8 within a single year's laying,
  and leaves calendar age contributing nothing to inscription legibility once
  residence is in the model.
topic: >-
  what the puddles decide: ponded-water residence across a research institute's
  donor pavement and which inscriptions have gone illegible in two paver
  lithologies
