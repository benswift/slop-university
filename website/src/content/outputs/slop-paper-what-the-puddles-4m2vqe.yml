title: What the Puddles Decide
subtitle: Ponded residence, not age, orders recession and inscription loss on an engraved donor pavement
authors:
  - Vigdis Emenike
  - Brynjar Obiora
  - Clemency Tredinnick
preset: paper
school: School of Underlying Conditions
date: 2026-11-14
