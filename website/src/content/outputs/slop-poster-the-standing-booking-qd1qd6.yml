title: Still on the Calendar
subtitle: >-
  A Survival Analysis of 1,146 Standing Bookings at 38 Council Community Halls
authors:
  - Osei Vandermeer
  - Thandiwe Solberg
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-07
publishedAt: 2026-08-07T03:04:03+10:00
doi: 10.5555/slop.qd1qd6
summary: >-
  A research poster from the School of Continuous Improvement follows 1,146
  standing bookings across 38 council community halls over five years, timing
  each from the group's last recorded attendance to the day its block was
  released from the calendar. Attendance was established against key sign-out
  logs and hirers' own records; release was modelled with Kaplan-Meier
  estimates and a Cox model, with administrative clearance at a calendar
  rebuild treated as a competing risk. Median survival after last attendance is
  3.4 years, and 41 per cent of bookings unattended for a full year are still
  held at five. Releases concentrate in the month a hall invoices its hirers
  rather than at any review, and recomputing the council's utilisation figure
  on attended hours alone lowers it from 63 to 39 per cent and moves 11 of the
  38 halls across the threshold that opens a rationalisation review.
topic: >-
  the standing booking block on the calendar by the door of a council community
  hall, where the utilisation figure that decides which halls are renewed
  counts hours reserved by groups that stopped turning up years ago
