summary: >-
  A case-for-support brochure profiling Slop University's research
  partnerships across ordinary settings, anchored by a School of Emergent
  Priorities trial that found no reduction in spare-key lockouts from a coded
  text reminder, after which a street's neighbourhood watch committee
  established a permanent household lockbox register regardless of the null
  result.
topic: >-
  the street's neighbourhood watch committee governs spare-key lockbox
