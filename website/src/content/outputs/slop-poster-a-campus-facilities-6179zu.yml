summary: >-
  A research poster from the School of Emergent Priorities reports an
  eleven-week observational study sorting coffee-cart queue conduct into a
  four-tier taxonomy --- order-readiness, device use, spacing discipline, and
  hand-off promptness --- scored live by two trained raters. Tier-A conduct at
  the two carts granted express-lane eligibility rose from 22 to 41 per cent
  of observed events over the following four weeks, and the responsible
  facilities panel has adopted the taxonomy as the standing, published basis
  for lane access, reviewed each teaching period with no individual override.
topic: >-
  a campus facilities panel's four-tier taxonomy of coffee-queue conduct, used
  to gate access to a priority lane
