doi: 10.5555/slop.9cy87c
summary: >-
  A paper from the School of Settled Matters reports twenty-two months of
  fieldwork in one regional claims office across three rounds of redundancy,
  reading its farewell morning teas as a gift economy. When eleven departures
  were marked by a single funded tea and one shared card, the farewell turned
  from a rite of separation for those leaving into a rite of incorporation for
  those who stayed, and the office was left with cards no one could take home.
topic: >-
  an ethnography of farewell morning teas in one claims office across three
  redundancy rounds, reading the signed card and the shared cake as a gift
  economy that thins as departures are batched
