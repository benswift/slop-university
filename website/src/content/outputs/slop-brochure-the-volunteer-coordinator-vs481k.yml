doi: 10.5555/slop.vs481k
summary: >-
  A research-showcase brochure built around Postdoctoral Fellow Joost Nwosu's
  interview study of volunteer coordinators, who describe the annual
  performance review as a ritual of gratitude rather than an appraisal, and
  the Review Cadence Observatory's decision to license their own phrasing as
  a certified review script. It sets that finding beside published work on
  reviews, rosters, and recognition instruments from the School of
  Continuous Improvement and the School of Emergent Priorities.
topic: >-
  the volunteer coordinator, asked in her own words what the annual
  performance review is actually for, describes it as a ritual of being
  thanked just before she is asked to stay on; the University now certifies
  her account as the gratitude script every community organisation's review
  must read aloud verbatim
