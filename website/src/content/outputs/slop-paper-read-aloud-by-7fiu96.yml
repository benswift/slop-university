title: Read Out as Written
subtitle: >-
  Anonymous Questions, the Moderator's Voice and the Delegation of Safe Speech
  at a Firm's All-Staff Meetings
authors:
  - Signy Okpara
  - Anouk Mensah
preset: paper
school: School of Continuous Improvement
date: 2026-10-26
publishedAt: "2026-10-26T23:02:15+11:00"
doi: 10.5555/slop.7fiu96
summary: >-
  A paper from the School of Continuous Improvement and the School of Emergent
  Priorities follows an anonymous, upvoted question tool through eleven
  all-staff meetings at a claims-processing organisation, comparing the typed
  text of the 212 questions voiced in the room with the moderator's reading of
  each. Fewer than one in nine was read as written, the rest were merged,
  recast or readdressed, and by the final meeting staff were submitting
  questions already in the moderator's register.
topic: >-
  read aloud by the moderator: an ethnography of the anonymous upvoted question
  tool at a firm's all-staff town halls, following how the moderator's voicing
  re-authored the questions that staff were told it was safe to ask
