summary: >-
  A marketing poster for Slop University in which Dr Brynjar Obiora of the
  School of Underlying Conditions sets a soil surveyor's habit of reading what
  surrounds a boundary beside the University's finding that a brain-tumour
  classifier still names the tumour type with the tumour masked out. Pictures a
  lightbox scan with one square blanked out, set into the wall of an open soil
  pit, for campus digital signage in a portrait rotation.
