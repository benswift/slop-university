doi: 10.5555/slop.evz717
summary: >-
  A research poster from the School of Settled Matters records EEG from twenty
  volunteers composing freely on a P300 speller and compares the error-related
  potentials evoked by the 372 mistakes they corrected with the 239 they let
  stand. The early frontocentral error negativity did not differ; the later
  error positivity was about a third smaller for mistakes left standing, already
  at feedback onset, and an error classifier trained on all mistakes would have
  deleted 153 letters the writers had chosen to keep.
topic: >-
  error-related potentials to BCI speller mistakes users leave uncorrected
