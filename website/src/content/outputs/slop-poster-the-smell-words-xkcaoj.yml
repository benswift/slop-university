summary: >-
  A research poster from the School of Continuous Improvement reports fourteen
  months of participant observation in one gas-sensing nanomaterials
  laboratory, where test gases go by bench names such as "the fish" for
  trimethylamine. Coding 7,014 mentions of a test gas, it finds that newcomers
  learn the bench names by ear before the formulas, and that the names account
  for most mentions at the rig and none in the laboratory's manuscript drafts.
topic: >-
  the smell words of a gas-sensor nanomaterials lab: an ethnography of how 'the
  fish', 'the nail polish' and 'the pear drops' stand in for trimethylamine,
  acetone and ethyl acetate at the bench, and how newcomers learn them before
  the chemistry
