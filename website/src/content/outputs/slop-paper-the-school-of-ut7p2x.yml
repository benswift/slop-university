summary: >-
  A paper from the School of Emergent Priorities interviews 37 householders at the open lid of the chest freezer about the unlabelled tub and keeps their phrases as the codes. Seventeen households say the tub goes when nobody can say whose it was, nine by the frost on the lid, and none by a date, though three tubs carried one. The School now destroys any unattributed file that has gone one review cycle unopened, with no claim accepted once the notice window has closed.
topic: >-
  The School of Emergent Priorities interviews householders about how an unlabelled tub in the chest freezer comes to be thrown out, reports their reasons in their own terms (frost, nobody remembers buying it, the lid), and adopts the households' frost threshold as the retention rule for its own unattributed files
