summary: >-
  A research poster from the School of Continuous Improvement grows three
  successive summers of irrigated sweet corn at five fertiliser nitrogen rates
  after a five-year lucerne stand and beside a strip never in lucerne, fitting
  a quadratic-plateau optimum to each crop. The agronomic optimum after the ley
  is 0, 74 and 139 kg N/ha against 148 to 156 on the reference strip, a credit
  that runs across two crops and is within the fit's interval by the third.
topic: >-
  How long a terminated lucerne ley's nitrogen credit lasts: fertiliser
  nitrogen response of three successive sweet corn crops on an irrigated loam
  after a five-year lucerne stand
