title: How Long the Margin Waits
subtitle: Waiting Times in a Porous-Medium Model of Tumour Growth with Pressure-Limited Proliferation
authors:
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-11-14
publishedAt: "2026-11-14T13:01:46+11:00"
doi: 10.5555/slop.u1e8t8
summary: >-
  A paper from the School of Underlying Conditions proves that in a mechanical
  model of tumour growth, whose density obeys the same porous-medium equation
  as a groundwater mound on a dry floor, a margin where the pressure vanishes
  quadratically cannot move before an explicit time that proliferation shortens
  but never removes, so that the guaranteed wait grows only logarithmically as
  the margin flattens. Finite-volume computations put every measured waiting
  time between 2 and 25 per cent above the bound.
topic: >-
  waiting times for the margin in a porous-medium tumour growth model with
  pressure-limited proliferation, read through the groundwater mound the same
  equation describes
