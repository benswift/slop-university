summary: >-
  A marketing poster advertising Improvement Grand Rounds, the School of
  Continuous Improvement's standing case-review series, built on the distance
  between a decision and the reason recorded for it --- a queue outside a rental
  inspection, where a knock-back is explained by whichever of eight preset codes
  sits closest, and the codes are afterwards counted up as an account of the
  market. Seven words of display type over a suburban footpath, prepared for the
  University's landscape signage rotation in matched daylight and after-dark
  renderings.
topic: >-
  the eight-item dropdown a property manager picks from to explain a knocked-back
  rental application, where the recorded reason is whichever preset code sits
  closest to what was actually decided, and the codes are then counted up as an
  account of the market --- a campaign for the standing case-review series where
  the reasons get read back
