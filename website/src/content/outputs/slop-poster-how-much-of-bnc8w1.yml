summary: >-
  A research poster from the School of Underlying Conditions balances a
  constant-rate sulfur hexafluoride tracer through ten gravity-sewer manholes
  over six weeks and finds that passive carbon vent filters removing a median
  98% of the hydrogen sulfide across their beds received a median 42% of each
  chamber's outflow, the remainder leaving around the lid, so that net control
  stood at 41%.
topic: >-
  how much of a sewer manhole's headspace air actually passes through its
  passive carbon vent filter: tracer-gas capture fractions at gravity sewer
  manholes, set against the filter's own removal efficiency
