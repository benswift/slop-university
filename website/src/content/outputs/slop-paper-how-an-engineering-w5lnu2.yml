title: What Is It Going to Be Doing?
subtitle: Question-Negotiation and the Viscosity Enquiry at an Engineering Library's Reference Desk
authors:
  - Vigdis Emenike
  - Sunniva Balogun
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
publishedAt: "2026-10-12T05:00:56+11:00"
doi: 10.5555/slop.w5lnu2
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities codes the 71 viscosity enquiries entered in one engineering branch
  library's reference-desk log over six years, and interviews five desk staff
  and eleven enquirers. Fifty-five enquiries opened as a request for a single
  value and twenty-one closed as one; the paper attributes the difference to a
  question the staff arrived at themselves, asking what the material will be
  doing, and describes the judgement by which they decide when not to ask it.
topic: >-
  How an engineering library's reference desk negotiates the request for the
  viscosity of a material into a request for a flow curve: a
  question-negotiation study of one enquiry log
