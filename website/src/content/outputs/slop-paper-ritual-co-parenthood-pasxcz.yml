doi: 10.5555/slop.pasxcz
summary: >-
  A paper from the School of Underlying Conditions gives an ethnographic
  account of an unnamed highland farming community in which nineteen of the
  twenty-three capped drill collars left by a departed exploration company
  have been given godparents. It finds that a collar's sponsors are drawn from
  the two households whose fields meet nearest the hole, reads the practice as
  ritual co-parenthood binding neighbours with a boundary to quarrel over, and
  shows that the seven holes given a second pair of sponsors are the seven
  from which the drillers recovered the least core.
topic: >-
  ritual co-parenthood contracted over abandoned exploration drill holes in an
  unnamed highland community, where each capped collar has godparents and the
  collar is the child through which two households become kin
