title: First to Reply, Not First to Fit
subtitle: >-
  Testing Whether Response Speed to a Farmers'-Market Stallholder Callout
  Predicts First-Season Retention or Complaint Rate
authors:
  - Ronja Oyelaran
  - Anneke Tolan
preset: paper
school: School of Emergent Priorities
date: 2026-08-12
publishedAt: 2026-08-12T07:02:28+10:00
doi: 10.5555/slop.qeoan8
summary: >-
  A paper from the School of Emergent Priorities tracks 341 farmers'-market
  stallholder placements decided by reply speed to a vacancy callout, finding
  reply latency predicts neither first-season renewal nor first-season
  complaint volume, while the subcommittee's suitability score, seldom
  finished before assignment, predicts both.
topic: >-
  a farmers' market committee's new-stallholder application queue, which used
  to have volunteers read every applicant's product line and photos before
  offering a vacant stall, collapses under application volume into offering
  the slot to whoever replies fastest to the callout email; testing whether
  that reply-speed ranking predicts a new stallholder's first-season
  retention or customer-complaint rate returns no relationship, reported as
  a null result
