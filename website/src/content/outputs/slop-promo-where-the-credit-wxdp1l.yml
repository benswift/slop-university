summary: A short profile of Dr Sten Okwuosa, Convenor of the Impact Pathway Atlas,
  told largely in his own words. Trained in bibliometrics, Dr Okwuosa describes how
  the Atlas maps what happens to a finding once it is published, from the citation
  that arrives late to the narrative CV that recasts an old result and the credit
  that lands on the wrong paper. The film also marks his Deposit of the Quarter Prize
  and a body of work that travels well.
topic: "a promo profile of Dr Sten Okwuosa, Convenor of the Impact Pathway Atlas,
  in his own voice: a bibliometrician who maps what happens to a finding after it
  is published, from the late citation to the misplaced credit, and whose own work
  travels well"
