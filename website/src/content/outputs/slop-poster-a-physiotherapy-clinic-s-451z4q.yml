title: Same Score, Different Doors
subtitle: >-
  A Two-by-Two Audit of a Physiotherapy Clinic's No-Show Risk Score Across
  In-Person and Telehealth Appointments
authors:
  - Mirela Hanke
  - Torun Ezeigwe
  - Solveig Adeyemi
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-11
publishedAt: "2026-08-11T15:01:43+10:00"
doi: 10.5555/slop.451z4q
summary: >-
  A research poster from the School of Continuous Improvement crosses a
  physiotherapy clinic's booking-software no-show risk score against
  appointment type across 9,540 appointments and four clinic sites over
  fourteen months; the score's risk-band gradient predicts non-attendance
  for in-person visits but flattens to near-chance for telehealth ones,
  where a login failure and a genuine no-show share one outcome code.
topic: >-
  a physiotherapy clinic's booking software scores every patient's no-show
  risk from appointment history, and staff use the score to decide who
  gets a courtesy phone call on top of the standard text reminder; the
  score was calibrated before the clinic added evening telehealth slots,
  where a login failure logs identically to a no-show, and a two-by-two
  framework crossing the score's risk band against appointment type finds
  it still predicts in-person no-shows but is no better than chance for
  telehealth ones
