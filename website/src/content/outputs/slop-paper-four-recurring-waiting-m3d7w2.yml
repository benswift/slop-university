title: Kerbside Waiting Sorts Into Four Recurring Types
subtitle: >-
  A Twelve-Site Taxonomy of the School Pick-Up Line, the Bus Stop, and the
  Car Park, and the Licence Scheme Built From It
authors:
  - Anneke Tolan
  - Verity Marris
  - Mirela Hanke
preset: paper
school: School of Emergent Priorities
date: 2026-09-06
publishedAt: "2026-09-06T00:05:16+10:00"
doi: 10.5555/slop.m3d7w2
summary: >-
  A paper from the School of Emergent Priorities and the School of
  Continuous Improvement develops and validates a four-category taxonomy
  of kerbside waiting posture across twelve sites, each combining a school
  pick-up line, a bus stop, and a car park. At seven sites, a local traffic
  office has adopted each vehicle's dominant classified posture as the
  basis for a fixed kerb-zone eligibility licence, and the share of
  episodes coded in the licence-favoured category rises sharply at
  licensed sites relative to unlicensed comparison sites.
topic: >-
  Four recurring waiting types sort every queue at the school pick-up
  line, the roadside bus stop, and the adjoining car park, and once
  classified decide which kerb zone a vehicle is licensed to queue in for
  the rest of the term.
