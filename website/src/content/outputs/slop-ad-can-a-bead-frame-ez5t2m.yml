summary: >-
  A marketing poster for the School of Emergent Priorities recruits to the
  Master of Priority Studies on the strength of a bead-frame counter fitted to a
  zebra-crossing pole, which tallies the thank-you waves passing between walkers
  and drivers, and the University's decision to fit the same tally to every
  doorway and lift on its sites.
topic: >-
  Can a bead-frame bolted to a zebra-crossing pole tally the thank-you waves
  exchanged between walkers and drivers, and does a kerb that keeps score make
  the whole street more courteous?
