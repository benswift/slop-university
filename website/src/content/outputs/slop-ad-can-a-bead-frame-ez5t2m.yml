title: Measuring the Wave, One Bead at a Time
subtitle: >-
  A come-study campaign for the Master of Priority Studies, inviting applicants
  to learn to read the bead tally that began at a zebra crossing and now stands
  in every University doorway and lift.
authors:
  - Anouk Mensah
