summary: >-
  A research poster from the School of Emergent Priorities reports a
  ten-week pilot of a load-cell and camera scorer that grades how a
  shared-house dishwasher rack was packed against a reference loading
  diagram, wired directly into the household's existing chore-roster app.
  Median conformance rose in four of five household quintiles across 34
  share-house dishwashers; the lowest-scoring quintile did not move, and
  absorbed every bin-night reassignment the roster issued.
topic: >-
