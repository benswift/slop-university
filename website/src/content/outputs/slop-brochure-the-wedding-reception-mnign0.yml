summary: >-
  A research-showcase brochure setting out the University's programme on the
  ordinary occasion --- the run sheet settled before anyone arrives, the tally
  kept while the room is full, and the record that outlives the evening. Three
  published studies are cited by title and identifier as the evidence for it,
  alongside the two Schools and the programme that carry the work.
topic: >-
  the wedding reception run sheet taped inside the venue's back door --- a
  campaign for the university that brings assurance, indicators, and a
  post-event review to the ordinary occasion nobody thought to evaluate
