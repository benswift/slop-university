title: The Occupancy Count That Changed No One's Mind
subtitle: >-
  A Staggered-Rollout Quasi-Experiment on a Bouldering Gym Chain's Live
  Occupancy Display Against Bailed-Session and Return-Visit Rates
authors:
  - Casimir Beng
  - Marit Osayande
  - Osei Vandermeer
preset: paper
school: School of Continuous Improvement
date: 2026-08-11
publishedAt: "2026-08-11T10:04:03+10:00"
doi: 10.5555/slop.qzqub7
summary: >-
  A paper from the School of Continuous Improvement tracks a 31-location
  bouldering gym chain's staggered rollout of a live wall-occupancy
  indicator, using a group-time quasi-experimental design to test whether
  climbers who can see the indicator before arriving change how often they
  bail a session or return within a fortnight. The indicator's introduction
  is associated with no detectable change in either outcome, and the null
  holds under an ablation restricted to first-visit day-pass climbers.
topic: >-
  a bouldering gym chain's app began showing a live wall-occupancy indicator
  at some locations but not others, as part of a staggered turnstile-sensor
  upgrade rolled out location by location; a quasi-experiment tests whether
  climbers who can see the occupancy indicator before arriving change how
  often they bail a session within ten minutes of tapping in, or return
  within fourteen days, relative to locations where the indicator isn't live
  yet
