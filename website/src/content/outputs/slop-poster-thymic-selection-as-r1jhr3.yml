title: Two Errors, One Threshold
subtitle: Central tolerance as screening under costly peripheral audit
authors:
  - Halvard Nnamani
  - Ylva Ogunbanjo
  - Kwame Lindqvist
preset: research-poster
school: School of Emergent Priorities
