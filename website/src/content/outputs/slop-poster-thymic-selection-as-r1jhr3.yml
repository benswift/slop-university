summary: >-
  A research poster from the School of Emergent Priorities models thymic
  selection as a screen on a noisy signal of self-reactivity, backed by a
  costly peripheral audit. It derives the optimal deletion threshold in closed
  form and shows that, outside a near-perfect screen, a fall in audit capacity
  raises both the deletion of useful clones and the share of self-reactive
  clones escaping unaudited.
topic: >-
  thymic selection as a screening mechanism: immunodeficiency and autoimmunity
  as the two errors of one threshold, with peripheral regulation as a costly
  audit that sets how lax the screen can afford to be
