summary: >-
  A marketing poster for Slop University invites working leaders to this
  spring's Capability Sprints, offering proximity labelling from the laboratory
  bench as a general habit of inquiry: tag one question, and see what gathers.
  Composed for the landscape signage rotation, it pictures a meeting table from
  above in which every hand and object inside a gold halo around a single blank
  card carries a small tag, and points to two of the University's published
  outputs on streptavidin capture and on tannin.
