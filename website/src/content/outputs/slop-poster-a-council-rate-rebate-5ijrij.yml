doi: 10.5555/slop.5ijrij
summary: >-
  A research poster from the School of Emergent Priorities audits a state
  rate-rebate scheme's four-cell compliance quadrant across 6,148
  applications at three council intake centres, finding that referral to
  mandatory fraud verification tracks an application's submission channel
  almost perfectly and its verified income risk barely at all.
topic: >-
  a council rate-rebate compliance index that sorts every application into
  a 2x2 quadrant crossing income evidence against submission channel,
  auto-escalating the paper/incomplete quadrant to mandatory fraud
  verification regardless of eligibility
