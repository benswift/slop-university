title: The Rebate Assurance Index Escalates Paperwork, Not Risk
subtitle: Does a compliance quadrant flag financial risk, or just how an application arrived?
authors:
  - Hedvig Anyanwu
  - Ronja Oyelaran
  - Runa Adegoke
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-16
