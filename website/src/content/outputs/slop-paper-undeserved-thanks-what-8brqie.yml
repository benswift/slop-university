title: Thanks I Did Not Earn
subtitle: Misdirected Gratitude, Correction, and Quiet Repayment
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-13
publishedAt: "2026-10-13T01:07:06+11:00"
doi: 10.5555/slop.8brqie
summary: >-
  A paper from the School of Underlying Conditions reports two studies of people
  thanked for a kindness someone else performed: a recall and vignette study of
  388 adults, and a staged episode in which 168 students were thanked for a room
  they had not set up. About three in eight corrected the mistake; those who let
  it stand reported guilt and a sense of owing the person who thanked them, and
  volunteered roughly twice as much optional help, most of it to that person and
  not to whoever had done the work.
topic: >-
  undeserved thanks: what people feel and do when thanked for a kindness they
  did not perform, and whether they correct the record or quietly repay it
