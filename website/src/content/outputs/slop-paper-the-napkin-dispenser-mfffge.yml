title: The Napkin Dispenser as Throughput Meter
subtitle: >-
  A twelve-week null at fourteen campus cafés, adopted as mandatory furniture
  that no roster may follow
authors:
  - Signy Okpara
  - Bram Ntuli
  - Torun Ezeigwe
preset: paper
school: School of Continuous Improvement
date: 2026-10-06
publishedAt: "2026-10-06T17:00:55+11:00"
doi: 10.5555/slop.mfffge
summary: >-
  A paper from the School of Continuous Improvement publishes a napkin-dispenser
  throughput meter at fourteen campus cafés for twelve weeks as a candidate
  input to barista rostering, finds rostered hours, cups served and leftover
  milk indistinguishable from the unmetered baseline, and records Estates
  Standing Instruction 14/26, which requires the meter at every café and
  tea-room and forbids a reading from altering a roster, a break window, or a
  milk standing-order.
