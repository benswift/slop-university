summary: >-
  A research poster from the School of Settled Matters holds nine beds from one
  lot of lithium orthosilicate breeder pebbles at 1, 3 or 6 MPa through thirty
  thermal cycles between 300 and 750 °C. The beds reach shakedown at cycles 7,
  11 and 17, with most crack events falling before it, and the fines of the
  pebbles crushed under the ram finish in the bottom quarter of the bed, at
  7.3% of its mass under 6 MPa against 2.1% at the top.
topic: >-
  Thermal-cycle ratcheting in a lithium orthosilicate breeder pebble bed: how
  many cycles before the bed settles, and what becomes of the pebbles crushed
  before it does
