title: Before the Bed Settles
subtitle: Thermal-cycle ratcheting and the fate of crushed pebbles in a Li₄SiO₄ breeder bed
authors:
  - Odalys Penhallow
  - Brynjar Obiora
  - Anselm Threlkeld
