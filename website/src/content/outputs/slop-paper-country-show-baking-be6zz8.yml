title: Well Presented, Slightly Overset
subtitle:
  A Pre-Registered Cluster-Randomised Trial of Written Judge Feedback and
  Exhibitor Re-Entry at Nine Agricultural Shows
authors:
  - Thandiwe Solberg
  - Ingeborg Nwachukwu
  - Osei Vandermeer
preset: paper
school: School of Continuous Improvement
date: 2026-08-04
publishedAt: "2026-08-04T20:04:33+10:00"
doi: 10.5555/slop.be6zz8
summary: >-
  A paper from the School of Continuous Improvement randomises 46 preserves and
  baking classes at nine regional agricultural shows to return either a written
  judge's comment card with each entry or the placing card alone, with the
  outcomes, the equivalence margin, and the analysis model registered before the
  first entry book was opened. Exhibitor re-entry the following season was 61.4
  per cent under comment cards and 60.2 per cent under placing cards (difference
  1.2 percentage points, 95% CI -4.9 to 7.3; ICC 0.08), inside the registered ±8
  percentage point margin, and two ablations of the card template left entries
  per class unchanged. Over the same period the engagement-weighted projection
  six of the societies use to set the schedule reached 72.6 per cent against an
  observed 60.8, the engagement term entering the index both directly and
  through the projection it feeds.
topic: >-
  country show baking and preserves classes, where a show society ran a
  pre-registered cluster-randomised trial of returning a written judge's comment
  card with each entry instead of a bare placing card, found no effect on
  whether exhibitors came back the next year, and reported the null --- while
  the cards issued became the exhibitor-engagement figure that decides which
  classes stay in the schedule
