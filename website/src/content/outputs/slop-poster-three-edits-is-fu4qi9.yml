summary: >-
  A research poster from the School of Continuous Improvement interviews 58
  separated co-parenting pairs about the point at which a shared-calendar
  entry stops being provisional, finding a consistent three-edit threshold
  that the University's own childcare-booking calendar has since adopted as
  a hard confirmation rule.
topic: >-
  Three edits is the point at which a co-parent's calendar entry stops being
  provisional and becomes real, separated parents say in their own words ---
  a qualitative interview study of the phrases used to draw that line, and
  the university's own campus childcare calendar now refuses to honour any
  booking that hasn't survived exactly that many revisions
