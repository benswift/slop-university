title: The Third Time It Didn't Move
subtitle: When Separated Co-Parents Agree a Calendar Entry Is Real
authors:
  - Torun Ezeigwe
  - Solveig Adeyemi
  - Casimir Beng
preset: research-poster
school: School of Continuous Improvement
