summary: >-
  A paper from the School of Emergent Priorities treats the cutting plan for an
  offshore supply vessel broken up afloat alongside a recycling quay as a
  sequence of seventeen loading conditions. The yard's zone-by-zone plan kept
  the highest metacentric height at every stage but left only 1.64 m of
  freeboard to the cut line, against 2.49 m for a sequence found by exact
  search that takes the side shell off last.
topic: >-
  how the cutting sequence of a ship dismantled afloat alongside a recycling
  quay decides its residual stability, checking each stage of demolition as a
  loading condition
