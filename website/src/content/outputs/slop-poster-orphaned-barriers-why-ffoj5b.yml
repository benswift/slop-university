doi: 10.5555/slop.ffoj5b
summary: >-
  A research poster from the School of Underlying Conditions matches a
  council's temporary-works permit register to a street audit of 64 barriers
  left standing after their permits lapsed, coding 3,410 pedestrian passages,
  and finds that passers-by detour around a lapsed barrier almost as readily as
  a permitted one, at any age, until a panel is first moved. It reads the
  result as authority that outlives its issuer and is lost by precedent rather
  than by lapse.
topic: >-
  orphaned barriers: why pedestrians in a mid-sized city keep obeying
  temporary-works fencing long after its permits lapsed, read as authority
  without an issuing authority
