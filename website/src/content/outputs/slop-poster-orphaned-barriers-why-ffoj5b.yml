title: The Fence Outlived Its Permit
subtitle: Pedestrian deference to lapsed temporary-works barriers in a regional city centre
authors:
  - Vigdis Emenike
  - Anneke Tolan
  - Ronja Oyelaran
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-26
