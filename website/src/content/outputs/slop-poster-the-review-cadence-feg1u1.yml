title: Does a Walker Stop for the Train or for the Boom Gate?
subtitle: A pre-registered discontinuity at 41 suburban crossings, and the door chime the University now sets by it
authors:
  - Joost Nwosu
  - Osei Vandermeer
  - Edda Nwafor
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-05
publishedAt: "2026-10-05T01:00:55+11:00"
doi: 10.5555/slop.feg1u1
summary: >-
  A poster from the School of Continuous Improvement times 3,900 on-foot
  crossings at 41 level crossings and finds the share of walkers still
  crossing falls from 0.74 to 0.09 at the first movement of the boom arm, with
  the train still out of sight. The University sets every lecture-theatre door
  chime to sound eight seconds before its latch, which engages whether or not
  anyone is on the threshold.
topic: >-
  The Review Cadence Observatory treats the second at which a suburban level
  crossing's boom gate begins to lower as a naturally occurring cutoff, timing
  3,900 on-foot crossings across 41 closures from a camp chair to ask whether
  walkers stop for the train or for the arm, and on the strength of the jump
  the University sets its own lecture-theatre door chime to sound the same
  number of seconds before the latch
