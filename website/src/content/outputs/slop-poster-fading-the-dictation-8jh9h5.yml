title: Fading the Dictation Pause
subtitle: Does withdrawing a teacher's comma pauses over one term leave pupils punctuating their own writing?
authors:
  - Ragnhild Uzoma
  - Ingeborg Nwachukwu
  - Anouk Mensah
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-28
publishedAt: "2026-10-28T01:30:43+11:00"
doi: 10.5555/slop.8jh9h5
summary: >-
  A research poster from the School of Underlying Conditions shortens the
  teacher's pause at each comma in four steps across ten weekly dictations in
  three of six Year 5 classes (n = 148), and scores the commas pupils place in a
  weekly free-writing journal. Recall of required commas rises from 0.40 to 0.57
  in the fading classes against 0.41 to 0.44 in the standing classes, at the
  cost of a dip in dictation accuracy in weeks four to six.
topic: >-
  fading the dictation pause: whether a mother-tongue teacher who stops pausing
  at commas while dictating, over one school term, leaves pupils placing commas
  better in their own unprompted writing
