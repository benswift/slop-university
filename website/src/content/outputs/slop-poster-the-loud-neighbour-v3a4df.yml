doi: 10.5555/slop.v3a4df
summary: >-
  A research poster from the School of Underlying Conditions builds a fully
  synthetic spontaneous-report database of 400 products and 250 event terms,
  plants 600 product-event signals in it, and injects a single heavily
  reported product into one event term to measure how much of the screen's
  sensitivity it masks. With the masker at 40% of the term's reports the
  full-background screen detects 38% of the planted signals and a
  leave-one-product-out background detects 79%, at a cost of half a
  percentage point of false positives confined to that term.
topic: >-
  The loud neighbour: a simulation study of masking in disproportionality
  analysis of spontaneous adverse-reaction reports, where one heavily reported
  product-event pair raises the background and hides planted signals for every
  other product, and a leave-one-product-out background restores them
