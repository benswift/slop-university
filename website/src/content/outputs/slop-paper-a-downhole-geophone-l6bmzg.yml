doi: 10.5555/slop.l6bmzg
summary: >-
  A paper from the School of Underlying Conditions reads a sixteen-level
  downhole geophone string with dead levels as a sparse array, and enumerates
  every failure pattern to find that its difference coarray stays full in most
  cases so long as both end levels survive, with seven well-placed levels the
  fewest that can keep it. In simulation, coarray MUSIC on such a seven-level
  survivor set resolves thirteen uncorrelated sources at 10 dB, against six for
  a string severed to its top seven levels.
topic: >-
  a downhole geophone string with dead levels read as an accidental sparse
  array: when its difference coarray survives sensor failure, and how many
  sources subspace direction-of-arrival estimation can still resolve
