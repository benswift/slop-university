title: An Accidental Sparse Array
subtitle: Direction-of-Arrival Estimation on a Downhole Geophone String with Dead Levels
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
