title: When Is a Kitchen Sponge Mature Enough to Throw Away?
subtitle: >-
  A five-level replacement ladder, and the kitchens it certifies as teaching
  sites
authors:
  - Casimir Beng
  - Ingeborg Nwachukwu
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-09
publishedAt: "2026-09-09T07:31:16+10:00"
doi: 10.5555/slop.0kfy8n
summary: >-
  A research poster from the School of Continuous Improvement scores 192
  household kitchens against a five-level sponge-replacement maturity
  ladder and finds attested level climbing while working-sponge age does
  not fall. Capability Sprints now requires Level 4 attestation, a dated
  card on the fridge, before a kitchen may host a placement, and display
  sponges appear in 41 percent of those certified kitchens.
topic: >-
  Does a five-level kitchen-sponge maturity model predict when a household
  throws the sponge out, or only which kitchens the University will certify
  as teaching sites?
