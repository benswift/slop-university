doi: 10.5555/slop.ihmrdp
summary: >-
  A paper from the School of Underlying Conditions digs one lateritic profile
  to 5.2 m, dissolves the iron oxides of each of its six described horizons
  without purifying them, and casts each extract into a hematite thin-film
  photoanode beside a reagent-salt control. Photocurrent at 1.23 V fell as the
  aluminium and silicon carried in with the iron rose, from ferricrete films
  that outperformed the control to pallid-zone films that were mostly not
  hematite, and two 5 cm transects found the films changing where the surveyor
  had drawn each boundary, abruptly across a clear one and over about 30 cm
  across a gradual one.
topic: >-
  hematite photoanodes made from iron oxides extracted horizon by horizon down
  a single lateritic soil profile, and what each horizon's own impurities do to
  the photocurrent
