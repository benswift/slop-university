title: Down the Profile
subtitle: Hematite Photoanodes from the Iron Oxides of One Lateritic Pit, Horizon by Horizon
authors:
  - Brynjar Obiora
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
