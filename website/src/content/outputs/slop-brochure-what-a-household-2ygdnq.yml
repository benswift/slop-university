summary: >-
  A marketing brochure from the School of Emergent Priorities and the School
  of Continuous Improvement showcases the University's habit of reading
  naturally occurring thresholds --- a council bin-weight surcharge, a
  fridge's discard judgement, a supermarket's markdown clock, a pool gate's
  self-close rule --- as research instruments already at work in ordinary
  homes, and features eight of the published studies built on that habit.
topic: >-
  what a household puts out at the kerb the fortnight after its wheelie bin
  tips just over the council's per-kilogram overweight-surcharge line
