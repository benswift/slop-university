summary: >-
  A research-showcase brochure presents the University's work on solar water
  purification in the order the water travels, from the bore and the dam above
  it to the underside of a still's glass cover and the upkeep that follows
  installation. It arranges that work in three strands across the School of
  Underlying Conditions and the School of Continuous Improvement, and rests
  each on published outputs, seven of which it cites by title and DOI.
topic: >-
  Sunlight, patiently applied: a showcase of the University's research on
  purifying water with nothing but the sun, from the still on the roof to the
  bore it draws from
