title: Spin-Up
subtitle: Slop University's Strategic Plan 2026–2031, committing its research computing to one eddy-resolving ocean simulation carried from rest to equilibrium
authors:
  - Gunnhild Ekwueme
  - Vigdis Emenike
preset: strategy
school: School of Emergent Priorities
