doi: 10.5555/slop.duopen
summary: >-
  Slop University's Strategic Plan 2026-2031 reserves the substantial part of
  its research computing for a single eddy-resolving simulation of an ocean
  basin and its overlying atmosphere, run from rest and expected to reach
  equilibrium only in the plan's final year. Four priorities organise the
  waiting: protecting the run from interruption, observing the coastal ocean
  and the air above the campus alongside it, training doctoral candidates to
  maintain and hand it on, and keeping records that let its eventual result be
  retraced and rerun.
topic: >-
  spin-up: a strategic plan that commits the University's research computing
  for 2026-2031 to one eddy-resolving ocean simulation, which will not reach
  equilibrium until the plan's final year
