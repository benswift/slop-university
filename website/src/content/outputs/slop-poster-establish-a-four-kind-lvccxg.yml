summary: >-
  A research poster from the School of Emergent Priorities sorts the plastic
  bags hoarded under the kitchen sink into a four-kind taxonomy — structural,
  sentimental, aspirational, and terminal — and finds the University's
  procurement office reading the sampled terminal-kind share as a live signal
  for its own courier-satchel reorder threshold, which has revised upward at
  every review to date.
topic: >-
  Establish a four-kind taxonomy — structural, sentimental, aspirational,
  terminal — for the bag-of-bags under the kitchen sink, and use it to set
  the University's courier-satchel reorder threshold.
