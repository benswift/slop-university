title: Whose Resting State?
subtitle: Session Completion and Sample Composition after an Interim Switch to Dry-Electrode EEG in Autistic and Non-Autistic Adults
authors:
  - Tove Ilesanmi
  - Iben Chikere
  - Lindiwe Achterberg
preset: paper
school: School of Emergent Priorities
date: 2026-10-26
publishedAt: "2026-10-26T02:32:16+11:00"
doi: 10.5555/slop.dk69a6
summary: >-
  A paper from the School of Emergent Priorities follows one EEG laboratory
  across the dry-electrode cap it adopted as an interim measure when its gel
  ran out, and never withdrew. Over 497 attended sessions, completion among
  autistic adults rose from 68.3% under gel to 89.2% under the dry cap and
  stopped depending on sensory sensitivity, while the group difference in the
  resting aperiodic exponent shrank from g = -0.46 to -0.11 and largely
  returned when the dry-period sample was reweighted to resemble those who had
  completed under gel.
topic: >-
  An autism EEG lab's interim switch from gel to dry-electrode caps, made when
  its gel supply lapsed and never reversed, read across three years of
  resting-state recordings for what it changed about who finished a session,
  and so about whose brains the lab's spectra now describe
