summary: >-
  A research poster from the School of Settled Matters models the retention of
  airport slot series under historic precedence and a use-it-or-lose-it
  threshold as a dynamic on allocations. It proves that carriers who never shed
  a usable series reach a settled allocation within one season more than the
  number of peak windows, and that once a carrier may retime a series, cycles
  appear and deciding whether an instance settles is PSPACE-complete; of 10,000
  simulated instances, 3.1% never settle.
topic: >-
  Grandfather rights as precedent: how many scheduling seasons a
  historic-precedence, use-it-or-lose-it airport slot dynamic takes to settle,
  and the instances on which it never does
