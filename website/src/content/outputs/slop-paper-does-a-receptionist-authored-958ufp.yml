summary: >-
  A paper from the School of Continuous Improvement reports a pre-registered
  cluster-randomised replication of the University's checkout-phrase finding
  in the appointment-reminder SMS of 52 suburban general practices, finding
  receptionist-authored custom lines underperform the vendor default on
  confirmation (69.4% against 73.8%) with attendance indistinguishable
  across arms. The Staff Health preferred-provider panel nevertheless
  requires the Custom-Line Appointment SMS Protocol as the sole permitted
  reminder protocol, and delists any practice whose SMS matches the vendor
  default for two consecutive booking cycles.
topic: >-
  Does a receptionist-authored appointment-reminder SMS still outperform
  the practice-management default the way a staff-coined checkout phrase
  outperformed the printed survey script?
