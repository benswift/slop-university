summary: >-
  A case-for-support brochure putting the University's research posture to
  partners and supporters through a single mechanism --- the note from home that
  excuses a school uniform, the extension granted on request, the box ticked on
  someone else's behalf --- and citing four of its own published studies by
  title and DOI as evidence that an organisation's exception pathway is where
  its rules actually operate.
topic: >-
  the note from home that excuses the school uniform, and the exception process
  that quietly becomes how the rule actually works
