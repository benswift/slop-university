title: Core-Tray Copper
subtitle: CO₂ Electroreduction on Gas-Diffusion Cathodes Cast from the Assay Offcuts of One Sulfide Exploration Hole
authors:
  - Ragnhild Uzoma
  - Casimir Beng
  - Bram Ntuli
preset: paper
school: School of Underlying Conditions
date: 2026-10-26
