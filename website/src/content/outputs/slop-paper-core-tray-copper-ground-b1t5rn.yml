doi: 10.5555/slop.b1t5rn
summary: >-
  A paper from the School of Underlying Conditions mills the retained assay
  offcuts of twenty-one intervals from one copper exploration hole, casts each
  as a gas-diffusion cathode and reduces CO₂ on it in an alkaline flow cell.
  Every interval yields multicarbon products, from 53.8 per cent Faradaic
  efficiency in the chalcocite-bearing supergene zone to 13.5 per cent in the
  pyrite-rich hypogene zone, a single rubble interval outperforms a commercial
  copper reference, and the three unrecovered intervals are left uninterpolated.
topic: >-
  Core-tray copper: ground offcuts of a sulfide-bearing exploration drill core,
  spray-cast as gas-diffusion cathodes for CO2 electroreduction, with product
  selectivity read down the hole interval by interval
