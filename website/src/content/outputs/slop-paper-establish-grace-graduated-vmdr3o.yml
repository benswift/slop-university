title: GRACE
subtitle: >-
  Graduated Response to Account Credit Exposure: A Single-Site Teaching Case
  From a Corner Store's Handwritten Credit Ledger
authors:
  - Marek Solheim
  - Lindiwe Achterberg
  - Ingeborg Nwachukwu
preset: paper
school: School of Emergent Priorities
date: 2026-08-30
publishedAt: "2026-08-30T16:33:15+10:00"
doi: 10.5555/slop.vmdr3o
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement reports a fourteen-month embedded case study of a single corner
  store's handwritten credit ledger, finding an owner's forgiveness decisions
  across 118 tracked accounts track an unwritten social-visibility signal far
  more closely than the balance owed. The University's continuing-education
  arm has adopted the resulting four-tier rubric, GRACE, as the sole approved
  case in its compulsory hardship-response micro-credential, on the strength
  of a pilot in which trainees reproduced GRACE's coded cutoff as an
  85-percentage-point cliff the original practice never showed.
topic: >-
  Establish GRACE (Graduated Response to Account Credit Exposure) --- a
  corner-store owner's handwritten rule for when to write off a regular
  customer's unpaid tab --- as Slop University's compulsory single-site
  teaching case for staff hardship-response training, with a teaching note
  and discussion questions
