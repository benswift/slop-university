title: The Gap That Didn't Travel
subtitle: A Survey Test of Self/Other Compliance Asymmetry at an Informal Produce-Swap Table
authors:
  - Torun Ezeigwe
  - Renke Sabel
preset: paper
school: School of Continuous Improvement
date: 2026-07-25
doi: 10.5555/slop.nxnx2l
summary: >-
  A paper from the School of Continuous Improvement surveys 612 contributors
  across 34 independently operated street-corner produce-swap tables,
  comparing self-reported compliance with each table's laminated "one item
  in, one item out" card against contributors' estimate of other
  contributors' compliance. Self-reported compliance exceeds the estimate of
  others' by a consistent 5.5 percentage points across all six site
  clusters, and a randomised card-wording manipulation leaves both measures
  unchanged --- a gap an order of magnitude smaller than a previously
  reported interview-based asymmetry at a suburban dog park.
topic: >-
  surveying whether contributors to an informal street-corner produce-swap
  table actually follow its laminated "one item in, one item out" guideline
  card, or just assume their neighbours do
