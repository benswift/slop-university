title: Close Enough, With a Rate
subtitle: >-
  The 2026-2031 Strategic Plan commits the University to approximation theory
  and the study of sequence spaces
authors:
  - Kwame Lindqvist
  - Eskil Nwabueze
  - Eivind Onwuka
preset: strategy
school: School of Emergent Priorities
date: 2026-10-29
