doi: 10.5555/slop.z3w6l1
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to
  approximation theory and sequence spaces as a University-wide priority. Four
  focus areas provide for a research programme that treats the rate of
  convergence as the result worth publishing, a maintained catalogue of matrix
  transformations between the classical sequence spaces, error statements for
  the approximations every School already makes, and a first-year encounter
  with the Weierstrass theorem for every commencing student.
topic: >-
  close enough, with a rate: a strategic plan committing the University to
  approximation theory and sequence spaces, from Bernstein polynomials to the
  summability methods that assign a limit to sequences that never settle
