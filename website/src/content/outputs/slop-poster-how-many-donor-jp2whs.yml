title: How Many Livers Make a Lot
subtitle: >-
  Donor number, genotype mix, and the lot-to-lot drift of pooled microsomal
  CYP2D6 activity
authors:
  - Odalys Penhallow
  - Clemency Tredinnick
  - Ylva Ogunbanjo
preset: research-poster
school: School of Settled Matters
date: 2026-11-10
