doi: 10.5555/slop.jp2whs
summary: >-
  A research poster from the School of Settled Matters assays 96 genotyped
  single-donor liver microsome preparations from one tissue bank and resamples
  them into equal-protein pools of every size a supplier might sell, tracking
  how far one lot's CYP2D6 activity drifts from the next. Lot-to-lot
  variation falls from 62% at two donors to 23% at ten, 13% at twenty-five and
  7% at fifty, and the drift is carried by the few highest-activity donors
  rather than by the poor metabolisers: withholding the ten highest donors cuts
  the spread of a ten-donor lot to that of a twenty-five-donor one.
topic: >-
  How many donor livers a pooled liver-microsome lot needs before its CYP2D6
  activity stops drifting from lot to lot with the genotype mix of the donors
  drawn
