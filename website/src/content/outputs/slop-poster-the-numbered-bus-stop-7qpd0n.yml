doi: 10.5555/slop.7qpd0n
summary: >-
  A research poster from the School of Continuous Improvement scores 47
  suburban bus stops against a five-level Stop-Wait Maturity Model and finds
  stops stencilled to Instrumented in one audit cycle board no faster than
  unpainted Dispersed stops. From the next review cycle, any staff-served
  stop below Managed is delisted from the Commute Assurance Map, the
  eligibility condition for the commuter-travel allowance, with no exception
  sustained beyond a single review cycle.
