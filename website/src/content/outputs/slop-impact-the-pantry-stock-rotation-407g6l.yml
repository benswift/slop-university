summary: >-
  The School of Continuous Improvement's 2021-2026 impact report reviews four
  domestic-scale instruments: a five-level FIFO-labelling maturity model that
  now gates a street's shared preserve-swap night, a fridge early-warning
  ensemble, a verge-tidiness ranking tied to a shared mower's booking
  calendar, and a bin-night improvement cycle convened to act on an earlier
  School finding.
topic: >-
  The Pantry Stock-Rotation Assurance Office scores household pantries
  against a five-level FIFO-labelling maturity model, and only pantries
  reaching Level Three may enter the street's shared preserve-swap night.
