title: Indescribable, at Length
subtitle: What Speakers Say After Declaring a Past Psychedelic Experience Beyond Words
authors:
  - Hedvig Anyanwu
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
date: 2026-11-02
publishedAt: "2026-11-02T23:31:16+11:00"
doi: 10.5555/slop.ikaekw
summary: >-
  A paper from the School of Emergent Priorities interviews 46 adults twice,
  six months apart, about one psychedelic experience of their own and codes
  what follows each of 412 claims that the experience could not be put into
  words. Fewer than one claim in twelve ended the description; the rest led
  into negative description, mundane comparison, demonstration or talk about
  the nearest word, at about twice the length of talk after a claim of
  intensity, and at the second telling most comparisons repeated the first.
topic: >-
  what people go on to say after declaring a past psychedelic experience
  indescribable: ineffability claims as openings rather than closures in
  retrospective interviews
