title: The Complaint Not Made
subtitle: >-
  A Strategic Plan to Hear More of What the University Community Would Rather
  Not Say
authors:
  - Gunnhild Ekwueme
  - Ylva Ogunbanjo
preset: strategy
school: School of Emergent Priorities
date: 2026-11-22
publishedAt: "2026-11-22T14:32:06+11:00"
doi: 10.5555/slop.8sjkep
summary: >-
  Slop University's Strategic Plan 2026-2031 sets out to double the concerns
  it receives per thousand service contacts, after an interview programme
  with students and staff who chose not to complain found the choice turned
  on effort, on a response expected to arrive too late, and on a second
  failure of the same matter. It commits every service point to accepting a
  concern spoken aloud, to answering within the complainant's own tenure, to
  escalating any second failure to a named officer, and to a published
  Semester Concerns Statement that reports a rise in the same register as a
  fall.
topic: >-
  the complaint not made: a Strategic Plan that sets out to raise the number
  of complaints the University receives, on the service-quality reasoning
  that the dissatisfied student who says nothing is the one who quietly does
  not come back
