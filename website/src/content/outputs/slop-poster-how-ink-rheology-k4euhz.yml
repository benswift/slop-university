doi: 10.5555/slop.k4euhz
summary: >-
  A research poster from the School of Settled Matters reports a
  within-subjects study in which 36 adults signed a twelve-page mock transfer
  bundle at an instrumented settlement table with three otherwise identical
  pens holding a thin Newtonian ink, a high-viscosity paste and a
  shear-thinning gel. The paste slowed signers and was rated the most binding,
  while the gel produced the most consistent signatures and was rated the
  least binding, and the poster concludes that felt bindingness follows the
  ink's drag rather than the signature's reproducibility.
topic: >-
  How ink rheology shapes the act of signing: a lab study of Newtonian, paste
  and shear-thinning gel pens at a mock property-settlement table
