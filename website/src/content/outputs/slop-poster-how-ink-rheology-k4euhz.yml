title: Slow Ink, Binding Signature
subtitle: Ink Rheology, Signature Consistency and Felt Commitment at a Mock Settlement Table
authors:
  - Clemency Tredinnick
  - Anselm Threlkeld
preset: research-poster
school: School of Settled Matters
