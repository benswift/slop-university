title: One Call Per Cycle
subtitle: >-
  A Nine-Category Taxonomy of Pedestrian Demand Registration at 38 Suburban
  Push-Button Crossings, and What the Controller Log Retains of It
authors:
  - Kwame Lindqvist
  - Anouk Mensah
  - Marek Solheim
preset: paper
school: School of Emergent Priorities
date: 2026-08-16
publishedAt: 2026-08-16T15:02:44+10:00
doi: 10.5555/slop.x58j8t
summary: >-
  A paper from the School of Emergent Priorities develops a nine-category
  taxonomy of pedestrian demand-registration events at push-button crossings and
  applies it to 11,482 kerb arrivals coded from 214 hours of structured
  observation at 38 suburban sites across three local government areas (Cohen's
  kappa = 0.83). Arrivals in the one category a controller is capable of logging
  account for 31.9 per cent of the coded population; the remaining 68.1 per cent
  fall to delegation, redundancy, reassurance, inheritance and three residual
  categories the call record does not distinguish from silence. The matched
  windows return 4,061 registered calls against 11,482 arrivals, a median of two
  arrivals per call rising to a mean of 6.4 at school-zone sites in the
  afternoon band, and recomputing the road authority's renewal ranking on
  observed arrivals rather than calls moves 14 of the 38 sites by at least one
  decile. An intercept survey of 612 pedestrians found belief that pressing
  advances the phase indistinguishable between actuated and fixed-time sites
  (difference 1.3 points, 95% CI -6.9 to 9.5).
topic: >-
  the push button at a suburban signalised pedestrian crossing --- pressed once,
  pressed again, pressed by someone who arrived after the walk signal already
  showed --- where a metropolitan road authority reads pedestrian demand from
  controller call records that register at most one call per cycle however many
  people are standing at the kerb; a nine-category taxonomy of
  demand-registration events developed from field observation across suburban
  crossings, plus an intercept survey of what people at the kerb believe the
  press does
