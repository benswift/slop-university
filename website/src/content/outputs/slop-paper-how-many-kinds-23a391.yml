title: Towards a Key to the Wiper Note
subtitle: Five Kinds of Request Left on Blocked-In Cars at a Suburban Shopping Centre
authors:
  - Sunniva Balogun
  - Anneke Tolan
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-10-02
publishedAt: "2026-10-02T05:01:56+10:00"
doi: 10.5555/slop.23a391
summary: >-
  A paper from the School of Emergent Priorities sorts 1,962 handwritten notes
  left on blocked-in cars at one suburban shopping centre into five kinds with a
  three-question key (kappa = 0.81), finding that only the Release and
  Disclosure kinds shorten a car's wait. The centre has replaced free-text notes
  with a five-box pad and rings the number on Release and Disclosure slips alone.
topic: >-
  How many kinds of note does a windscreen wiper hold in a shopping-centre car
  park, and which kind is the writer owed an answer to? A key sorts the
  handwritten notes left on blocked-in cars by what they ask of the driver, and
  the centre's reply is a pre-printed tick-box pad that retires free text
