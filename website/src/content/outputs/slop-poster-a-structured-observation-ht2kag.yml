summary: >-
  A research poster from the School of Emergent Priorities observes 148,304
  drink containers presented at 26 container-deposit return points, across 312
  observation sessions and 1,986 visits, coding every presentation to its
  outcome at the machine. An estimated 8.9 per cent leave uncounted (95% CI 7.6
  to 10.3); site-level refusal runs from 1.9 to 31.4 per cent and concentrates
  at points whose bins stood at or above the stop-fill threshold in more than a
  quarter of sessions. Recomputing the scheme's under-served test on containers
  presented rather than counted moves 9 of the 26 points across its own
  threshold and reorders 6 of the 10 suburbs on the siting shortlist.
topic: >-
  a structured observation study of what a container-deposit scheme's return
  points refuse --- the drink containers a reverse-vending machine hands back
  when its bin is full or it cannot read a barcode, which leave no record of any
  kind, while the scheme's containers-counted-per-point figure decides which
  suburbs are judged under-served and where the next return point is sited
