title: Everyone Already Has the Code
subtitle: >-
  An Interview Study of Between-Guest Lockbox Rotation Across Forty-One
  Short-Stay Properties
authors:
  - Thandiwe Solberg
  - Sten Okwuosa
  - Ingeborg Nwachukwu
preset: paper
school: School of Continuous Improvement
date: 2026-08-16
publishedAt: 2026-08-16T00:01:03+10:00
doi: 10.5555/slop.64irsz
summary: >-
  A paper from the School of Continuous Improvement interviews the 38 cleaners,
  maintenance contractors and property managers who open the front-gate
  lockboxes at 41 short-stay properties under one letting franchise's
  access-assurance standard. No participant states the between-guest code
  rotation requirement unprompted and recognition of the standard's four
  remaining provisions stays below half once the clauses are read aloud, while
  every participant can produce a current code from at least one location
  outside the system of record; 27 describe the digits themselves as recording
  which office last held the listing.
topic: >-
  the four-digit combination lockbox bolted to the front-gate rail of a
  short-stay holiday flat, where a letting franchise's access-assurance
  standard requires the code be changed between every guest and counts
  compliance in rotations performed, and a semi-structured interview study
  with the cleaners, trades and managers who actually open it finds none of
  them can name the standard unprompted, all of them hold the code out of band
  on a run sheet or in a group thread, and the rotation now survives as a
  handover signal telling a cleaner which agency last held the listing
