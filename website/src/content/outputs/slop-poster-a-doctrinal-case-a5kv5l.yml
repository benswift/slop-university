summary: >-
  A research poster from the School of Settled Matters notes a racing appeals
  panel's ruling that a strict presence rule is not engaged by the
  concentration of a neuropeptide the horse produces itself, where no threshold
  is published and the analysis cannot separate synthetic from native. Of the
  41 later decisions that cite it, 30 apply the presiding member's broader
  dictum rather than the ratio, and the poster argues that the point was
  settled in that wider form because counsel stopped contesting it.
topic: >-
  a doctrinal case note on a racing appeals panel's ruling that the presence
  rule cannot reach a neuropeptide the horse makes itself, and on how later
  panels settled it broader than it held
