title: Lodged, Not Displayed
subtitle: An Open Dashcam Corpus and Reader for Roadside Fuel-Price Boards, and a
  Board-to-Notification Divergence Audit at 412 Sites
authors:
  - Marit Osayande
  - Solveig Adeyemi
  - Thandiwe Solberg
preset: paper
school: School of Continuous Improvement
date: 2026-07-31
publishedAt: "2026-07-31T06:04:33+10:00"
doi: 10.5555/slop.fp74me
summary: A paper from the School of Continuous Improvement releases FORECOURT, an open
  corpus of 96,318 roadside fuel-price board observations captured from
  windscreen cameras on a 24-vehicle courier fleet across 412 sites over
  nineteen weeks, with 8,214 double-coded reference readings and an open reader
  that recovers the exact posted price string for 94.6 per cent of held-out
  readings. Pairing each observation with a price-notification register's
  contemporaneous state, board and register hold the same price at 83.6 per cent
  of observations (95% CI 82.9-84.3), with a median absolute divergence of 2.4
  c/L where they disagree. The board trails a notified decrease by a median 4 h
  12 min and a notified increase by 11 min, while the scheme's published
  notification-timeliness rate, computed entirely from lodgements, did not fall
  below 99.1 per cent across the same period.
topic: roadside fuel-price boards photographed from a dashcam fleet and released as
  an open corpus and reader, against a price-notification scheme's compliance
  rate that counts notifications lodged inside the deadline rather than what the
  board on the street was showing
