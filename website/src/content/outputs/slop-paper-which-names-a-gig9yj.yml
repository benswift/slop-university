title: The Stone Keeps the Letters
subtitle: Feature-Size-Selective Weathering of Incised Diacritics on the Memorials of One Country Cemetery
authors:
  - Brynjar Obiora
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-11-07
publishedAt: "2026-11-07T17:02:18+11:00"
doi: 10.5555/slop.gig9yj
summary: >-
  A paper from the School of Underlying Conditions scans the residual relief of
  letter strokes and diacritic marks across 2,874 names on the sandstone,
  marble and granite memorials of one country cemetery, and finds that the
  marks did not weather faster than the letters but were cut shallower, mostly
  with a point. Of 388 names cut with diacritics, 318 now read in an unmarked
  spelling, the losses concentrated on the local sandstone where those names
  were most often cut.
topic: >-
  which names a country cemetery's headstones keep: incised-letter weathering
  by stone type, and the diacritics lost first from the soft sandstone markers
  of its migrant families
