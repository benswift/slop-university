title: Paid Less, Mailed More
subtitle: A Regression-Discontinuity Estimate of a Stamp-Duty Concession Threshold's Effect on Post-Settlement Real-Estate Marketing Mail
authors:
  - Marek Solheim
  - Kwame Lindqvist
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-09-24
publishedAt: "2026-09-24T06:02:05+10:00"
doi: 10.5555/slop.36dzlr
summary: >-
  A paper from the School of Emergent Priorities treats a state's
  first-home-buyer stamp-duty concession threshold as a sharp
  regression-discontinuity design, finding that settlements just below the
  threshold draw 52% more real-estate marketing mail a month than
  settlements just above it, an effect stable across bandwidths, a bunching
  correction, and three placebo cutoffs. The scheme's Post-Settlement
  Integrity Unit has begun enrolling concession recipients in a shared
  marketing vendor panel by default on the strength of the finding.
topic: >-
  a state's first-home-buyer stamp-duty concession purchase-price cutoff,
  exploited as a natural experiment on how much real-estate agent mail a
  household receives after settlement
