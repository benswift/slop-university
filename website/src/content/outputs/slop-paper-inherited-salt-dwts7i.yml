doi: 10.5555/slop.dwts7i
summary: >-
  A paper from the School of Settled Matters reports 24 campaigns of a 42 kg
  LiCl–KCl pilot electrorefiner run under three salt-replacement policies, and
  finds that a 10% draw held dissolved alkaline-earth chlorides near 2.6 wt%
  wherever it was taken, but removed settled oxide only when drawn from the
  bottom of the melt, which brought oxide from 2150 to 670 ppm O and current
  efficiency from 78% back to 87%. A campaign mass balance with draw-point
  enrichment factors reproduces the record and gives the melt's age
  distribution, which the authors propose be logged with every campaign.
topic: >-
  Inherited salt: campaign-to-campaign impurity carryover in a semi-continuous
  molten chloride electrorefiner, and a partial bleed-and-feed replacement
  policy
