title: Inherited Salt
subtitle: Impurity Carryover and Bottom-Draw Replacement in a Semi-Continuous LiCl–KCl Electrorefiner
authors:
  - Anselm Threlkeld
  - Clemency Tredinnick
  - Bram Ntuli
