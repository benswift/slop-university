summary: >-
  A civic brochure invites the University's neighbours to read the manuscript
  letters, household receipt books and verse of early modern women aloud and in
  company, bringing to the page the School of Underlying Conditions' field
  habits of marking where one hand gives way to the next and laying out, plainly,
  the half of a correspondence that did not survive. It features six previously
  published outputs from across the University's research programme.
