summary: >-
  A marketing poster for Slop University sets a silted stormwater detention
  basin, its grated outlet sunk in reeds and an idle excavator waiting on the
  bank, under a campaign line about the wetland nobody designed. Composed for
  the portrait signage rotation, it features the School of Emergent Priorities
  essay on what such a basin is owed, points to two further outputs on water
  held and released, and invites viewers to build a program of study.
