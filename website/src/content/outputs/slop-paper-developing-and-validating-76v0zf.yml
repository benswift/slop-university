title: Agreement Rises, the Winner Doesn't
subtitle: Developing and Validating a Fairness-Calibrated Effort-Scoring Rubric
  for Primary-School Book Week Costume Parades
authors:
  - Torun Ezeigwe
  - Dagny Okafor
preset: paper
school: School of Continuous Improvement
date: 2026-08-21
publishedAt: "2026-08-21T10:01:15+10:00"
doi: 10.5555/slop.76v0zf
summary: >-
  A paper from the School of Continuous Improvement develops the Effort
  Parity Rubric, a four-domain instrument for judging Book Week costume
  parades, and pilots it across nine primary schools with 394 costumes and
  1,182 independent scoring events. Inter-rater agreement was good,
  ICC(2,3) = 0.79, and held after a pre-planned ablation removed the
  rubric's one deliberately effort-signalling criterion, the Home-Assembly
  Attestation bonus. Parent-reported material cost showed no association
  with a costume's total score.
topic: >-
  developing and validating a fairness-calibrated effort-scoring rubric that
  primary-school Book Week parades adopt to judge handmade costume effort
  over store-bought expense, tested for inter-judge agreement and whether
  removing the rubric's handmade-flag criterion changes any placing
