title: Never Asked Is Not Lost
subtitle: Characteristic-relation rough sets over soil profiles described on three editions of the field card
authors:
  - Brynjar Obiora
  - Mirela Hanke
  - Sunniva Balogun
preset: research-poster
school: School of Underlying Conditions
