doi: 10.5555/slop.zxffne
summary: >-
  A research poster from the School of Underlying Conditions applies
  characteristic-relation rough sets to 1,846 reference soil profiles described
  on three editions of a field card, reading the fields the older cards never
  asked as do-not-care conditions and illegible entries as lost values. The
  edition-aware encoding lowers the quality of classification from 0.78 to
  0.52, and re-describing 64 of the 388 surviving first-edition monoliths,
  chosen greedily by conflict, restores it to 0.70.
topic: >-
  never asked is not lost: characteristic-relation rough sets over a soil
  profile reference collection described on three successive editions of the
  field description card, where a field the older card never asked is a
  do-not-care condition rather than a lost value
