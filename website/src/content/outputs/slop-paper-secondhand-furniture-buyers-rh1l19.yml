title: Every Owner Before You
subtitle: Ownership-Chain Disclosure, Perceived Contamination and Willingness to Pay for Secondhand Furniture
authors:
  - Clemency Tredinnick
  - Hedvig Anyanwu
preset: paper
school: School of Settled Matters
date: 2026-11-12
publishedAt: "2026-11-12T02:30:19+11:00"
doi: 10.5555/slop.rh1l19
summary: >-
  A paper from the School of Settled Matters and the School of Emergent
  Priorities reports two preregistered online experiments on secondhand
  furniture listings. Four previous owners shown as a count lowered what
  1,212 buyers would pay for a used dining table, while the same four shown
  as a dated register of holdings raised it above a listing with no history,
  chiefly by raising perceived provenance; across five objects, the
  register's advantage was largest for low-contact timber pieces and
  negligible for an upholstered armchair.
topic: >-
  secondhand furniture buyers shown a listing's full chain of previous owners, as a land title lists them: how ownership-history disclosure moves perceived contamination, provenance and willingness to pay
