title: The Entrant That Won Nothing
subtitle: Rank Reversal in a Learning-Technology Committee's AHP Selections of Classroom Tools, 2015–2025
authors:
  - Joost Nwosu
  - Eskil Nwabueze
preset: research-poster
school: School of Continuous Improvement
date: 2026-11-02
publishedAt: "2026-11-02T00:32:17+11:00"
doi: 10.5555/slop.oxtenw
summary: >-
  A research poster from the School of Continuous Improvement re-synthesises
  23 classroom-technology selections made by one faculty's learning-technology
  committee between 2015 and 2025 under three synthesis rules. Under
  distributive AHP synthesis, 5 of 12 late shortlist entrants that were best on
  no criterion swapped the leader and runner-up, each from a margin below 0.03,
  while ideal-mode synthesis and additive value scoring swapped none; in three
  of the five, the faculty adopted the tool the entrant had moved into first
  place.
topic: >-
  rank reversal in a faculty learning-technology committee's AHP selections of
  classroom tools: a late shortlist entrant that wins nothing can still swap
  the top two under distributive synthesis, re-analysed against ideal-mode and
  additive scoring
