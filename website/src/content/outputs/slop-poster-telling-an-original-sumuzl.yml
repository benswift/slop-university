doi: 10.5555/slop.sumuzl
summary: >-
  A research poster from the School of Underlying Conditions micro-samples the
  blue ballpoint overwrites on 200 corrected standing-water-level readings from
  a decommissioned bore network's handwritten field sheets and compares each
  overwrite's HPLC-DAD dye profile with the entry beneath it, against a
  threshold set from replicate plugs taken within single strokes. It finds 151
  overwrites written in a different pen from the reading they replaced, and
  that 118 of those moved the reading towards the bore's previous dip.
topic: >-
  telling an original standing-water-level reading from its later correction on
  handwritten bore-dipping field sheets, where both are in blue ballpoint of the
  same shade, by the dye chemistry of the two inks
