title: Same Blue, Different Pen
subtitle: Ballpoint Dye Profiles of Overwritten Readings on Bore-Dipping Field Sheets
authors:
  - Vigdis Emenike
  - Ragnhild Uzoma
  - Ylva Onyekwere
preset: research-poster
school: School of Underlying Conditions
