summary: >-
  A paper from the School of Settled Matters reads the 27 decisions construing
  a 1984 scenic-protection clause over a regional lookout, the 38
  vegetation-management approvals issued below it and 112 dated photographs
  taken from it, and traces the clause's word "unobstructed" from a limit on
  structures, to fidelity to a 1984 brochure photograph, to a standing duty to
  clear. The view is now the most open in the photographic record, maintained
  to a frame taken from a rock shelf outside the reserve's fence.
topic: >-
  a scenic view protected in words by a forty-year-old regional planning
  clause, and how later tribunals and lookout operators have read it until the
  escarpment is cleared to match the clause
