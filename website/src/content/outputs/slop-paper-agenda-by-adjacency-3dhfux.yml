title: Agenda by Adjacency
subtitle: >-
  How a Whiteboard Grid Turns Open Problems into Publishable Cells in a
  Neural-Network Synchronisation Group
authors:
  - Ingrid Vasseur
  - Osei Vandermeer
preset: paper
school: School of Emergent Priorities
date: 2026-11-01
publishedAt: "2026-11-01T17:30:23+11:00"
doi: 10.5555/slop.3dhfux
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement follows a twelve-member neural-network synchronisation group
  through 54 weekly meetings organised around a whiteboard grid of network
  classes and control schemes. A question reaches the agenda only once it can
  be written as a row or a column, each new problem is warranted by the filled
  cells beside it, and of 41 questions sent to the board's margin only two
  ever returned, both rewritten as lines of the grid.
topic: >-
  agenda by adjacency: an ethnography of a neural-network synchronisation group
