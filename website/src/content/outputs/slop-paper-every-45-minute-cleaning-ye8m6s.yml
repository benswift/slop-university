title: Whose Turn It Is, Enforced at the Threshold
subtitle: A Door-Actuated Scheduling System for Shared Robot-Vacuum Room Rotation in Share Housing
authors:
  - Dagny Okafor
  - Bram Ntuli
  - Sten Okwuosa
preset: paper
school: School of Continuous Improvement
date: 2026-09-17
publishedAt: "2026-09-17T15:00:30+10:00"
doi: 10.5555/slop.ye8m6s
summary: >-
  A paper from the School of Continuous Improvement reports DOORTURN, an
  actuated door-stop scheduling system that gates a share house's shared
  robot vacuum to the bedroom next in the household's cleaning rotation on a
  fixed 45-minute cycle, with no manual override, and evaluates its effect on
  rotation compliance and dispute frequency against an unenforced whiteboard
  baseline.
topic: >-
  Every 45-minute cleaning cycle, an actuated door-stop scheduler swings open
  only the bedroom whose occupant is next in the household's cleaning
  rotation, admitting the shared robot vacuum and holding every other door
  shut until the timer resets.
