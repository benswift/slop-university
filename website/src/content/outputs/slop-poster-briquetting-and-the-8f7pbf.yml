summary: >-
  A research poster in political theory from the School of Emergent Priorities
  reads Locke's spoilage limit against the 187 written submissions to a
  consultation on one regional hardwood mill's residue scheme, after the mill
  that had left its offcuts and sawdust at an open gate for four decades began
  pressing them into briquettes. It argues that the town's custom was a
  tolerance indexed to waste rather than a right against the owner: the
  takers' most frequent ground, that the residue would otherwise rot or be
  burnt, is the one the press removes, and their stronger claim from reliance
  was never put.
topic: >-
  Briquetting and the Lockean spoilage proviso: how densifying a sawmill's
  residue enclosed a town's customary right to take offcuts and sawdust, read as
  political theory through the consultation on the mill's residue scheme
