title: A Little Piece of Pressed Sawdust
subtitle: Briquetting, the spoilage proviso and the end of a mill town's offcut right
authors:
  - Ronja Oyelaran
  - Marek Solheim
  - Brynjar Obiora
preset: research-poster
school: School of Emergent Priorities
