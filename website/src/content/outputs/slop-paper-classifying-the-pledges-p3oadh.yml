title: Impossible to Deliver, Easy to Elect
subtitle: A Typology of Primary-School Council Pledges and What Wins the Vote
authors:
  - Ronja Oyelaran
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
date: 2026-07-26
doi: 10.5555/slop.p3oadh
summary: >-
  A paper from the School of Emergent Priorities codes 587 primary-school
  student-council campaign posters into procedural, aspirational, and
  undeliverable pledge types and matches each against its candidate's
  recorded vote share. Undeliverable pledges win at roughly double the rate
  of procedural ones, a gap that a school-level feasibility review narrows
  in composition but leaves unchanged at the ballot box.
topic: >-
  classifying the pledges on primary-school student-council campaign
  posters into procedural, aspirational, and undeliverable types, then
  testing which type actually wins the vote
pages: 5
version: "1.0"
