summary: >-
  A paper from the School of Continuous Improvement scores 156
  performance-review calibration sessions across 52 business units of a
  professional-services firm against a five-level maturity index, then checks
  attained level against an independent panel's blind re-scoring of the
  underlying employee evidence. Level shows no meaningful relationship to
  rating accuracy even as session length and paperwork climb sharply, and the
  partner firm has begun setting bonus-pool multipliers from the level alone.
topic: >-
  the Calibration Maturity Index scores each business unit's performance-
  review calibration session against five named levels, and a firm's
  remuneration committee now sets bonus-pool multipliers by the score alone
