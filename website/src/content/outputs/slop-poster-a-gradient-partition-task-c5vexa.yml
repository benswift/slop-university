summary: >-
  A research poster from the School of Underlying Conditions asks 84
  nonclinical volunteers to draw the line where one texture ends and the next
  begins across six strips, from a hard step to a linear ramp, and finds that
  trait incompleteness, not harm avoidance, predicts how often the line is
  redrawn, and only once the edge goes soft. On the softest strips the
  volunteers highest in incompleteness nudged the line within a narrow band of
  where it first fell, then submitted it still rated not right.
topic: >-
  a gradient-partition task in which volunteers high in obsessive-compulsive
  incompleteness keep redrawing a boundary across a smooth gradient, and where
  on the gradient the line refuses to feel right
