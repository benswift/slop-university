title: A Bottle Without Its Stage
subtitle: >-
  Re-linking Archived Suspended-Sediment Samples to a Gauging Station's Field
  Notebooks
authors:
  - Vigdis Emenike
  - Sunniva Balogun
preset: paper
school: School of Underlying Conditions
date: 2026-11-06
publishedAt: "2026-11-06T20:02:18+11:00"
doi: 10.5555/slop.g91gr8
summary: >-
  A paper from the School of Underlying Conditions treats one upland gauging
  station's sediment record as a record-linkage problem, re-attaching 5,742
  bottle concentrations in a laboratory register to the stage readings in 47
  field notebooks and grading each bottle by how precisely it can be placed.
  Overall 69.3 per cent link to a single stage reading, but only 38.1 per cent
  of the highest concentration decile, where pumping-sampler bottles were
  logged in terse retrieval entries; the paper proposes the linkage grade as a
  provenance element in the catalogue record of every legacy sample.
topic: >-
  record linkage between a field station's archived suspended-sediment sample
  bottles and its gauging notebooks, and why flood-event samples are the
  hardest to re-attach to their discharge
