summary: >-
  A brochure from the School of Emergent Priorities presents, as a
  three-exhibit teaching case, the paint-tint formula book behind one strip-mall
  hardware shop's mixing counter --- a ledger pairing each colour name with its
  recipe --- and the street whose front fences settle towards the entries the
  book still holds, and reports that the University now names every corridor by
  its paint's recipe number and repaints only from a formula the book still
  lists.
topic: >-
  The paint-tint formula book behind one strip-mall hardware shop's mixing
  counter, a ledger pairing every colour name with its recipe, keeps a
  neighbourhood's front fences the colour they were last mixed, and the
  University adopts the book's recipe numbers to name its corridors and repaints
  only from entries the book still holds
