doi: 10.5555/slop.nlnrdt
summary: >-
  The School of Settled Matters answers six of the eight questions and prefers
  Option 3 with a fourth session type, the process-paced session, whose length
  is set by a protocol lodged with the booking and read from an instrument's own
  record. It describes how the one-block rule has led it to assemble each cycle
  of its microsensor profiles of a laboratory reactor's nitrifying granules from
  three days and to coarsen their steps, and asks that the hours outside the
  booking day stay outside the setting.
topic: >-
  the School of Settled Matters' submission on the shielded recording rooms'
  booking block, for whose microsensor profiles of a laboratory reactor's
  nitrifying granules the session is set by the reactor's cycle and not by any
  fitting, so that a session's length under Option 3 should be read from the
  reactor's own log
