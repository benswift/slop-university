title: Measured by the Reactor's Log
subtitle: >-
  A submission from the School of Settled Matters to the Department of Policy
  Settings' consultation on the Review of the Booking Block for Shielded
  Recording Rooms
authors:
  - Anselm Threlkeld
  - Odalys Penhallow
preset: submission
school: School of Settled Matters
date: 2026-11-24
