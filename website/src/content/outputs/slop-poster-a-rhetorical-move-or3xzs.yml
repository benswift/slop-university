summary: >-
  A research poster from the School of Emergent Priorities codes 312 hand-made
  lost-pet posters photographed on suburban power poles into six rhetorical
  moves, finding that posters re-issued during a long search trade their appeal
  to a stranger's sympathy for instructions to a deputised searcher, with the
  warning not to chase learnt from the search itself.
topic: >-
  a rhetorical move analysis of hand-made lost-pet posters taped to suburban
  power poles: how owners balance the appeal to a stranger's pity against the
  instructions that might actually bring the animal home
