summary: >-
  The School of Settled Matters supports Option 3, an annual snapshot with a
  log of the year's changes, provided each log entry records both the month a
  change was entered and the month from which it has effect, deletions are
  logged without their contents, and keys for committees and their agenda
  items hold across years while keys for persons do not. Drawing on its work
  on point-in-time statute stores and superseded certificates of title, it
  also asks the Division to begin retaining amended committee values from
  March 2027 so that the first log is not empty of history.
topic: >-
