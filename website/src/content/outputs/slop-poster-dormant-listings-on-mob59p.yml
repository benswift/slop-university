summary: >-
  A research poster from the School of Underlying Conditions follows 611
  medicine presentations that went twelve months without a dispensing claim on
  one national reimbursement schedule, treating delisting and reactivation as
  competing exits, and finds that within five years most take neither.
  Interviews with sponsors' regulatory-affairs staff attribute the retention to
  the cost of relisting and to an annual return that rolls each listing forward
  by default.
topic: >-
  dormant listings on a national medicines reimbursement schedule: a
  competing-risks cohort of pack presentations still listed years after their
  last dispensing claim, and why their sponsors keep them
