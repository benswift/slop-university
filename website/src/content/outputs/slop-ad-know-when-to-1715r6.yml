summary: >-
  A marketing poster from the School of Settled Matters sets a young octopus
  coming down out of open water above a rocky seabed, under the line that a
  drifter must know when to stop, and directs readers to the School's model of
  when a drifting larva should settle and why its threshold falls as its
  competency window closes.
