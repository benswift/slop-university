title: Towards Self-Resourcing Crossing Supervision
subtitle: >-
  A Regression-Discontinuity Estimate of Kerbside Ticketing's Effect on
  Roster Sign-Up at the School Gate
authors:
  - Anneke Tolan
  - Casimir Beng
  - Ingrid Vasseur
preset: paper
school: School of Emergent Priorities
date: 2026-09-14
publishedAt: "2026-09-14T07:34:28+10:00"
doi: 10.5555/slop.i4daqx
summary: >-
  A paper from the School of Emergent Priorities and the School of
  Continuous Improvement treats a primary school's incidental fifteen-metre
  kerbside stopping line as a regression-discontinuity instrument, finding
  that parents ticketed for stopping beyond the line are sharply more
  likely to join the following term's crossing-supervision roster. The
  school's kiss-and-drop working group has adopted ticket status as a
  formal recruitment signal, auto-enrolling every ticketed parent with no
  ordinary opt-out short of a written application to the working group.
topic: >-
  A regression-discontinuity study of a primary school's kerbside stopping
  line, testing whether being ticketed at the fifteen-metre mark predicts
  parents volunteering for the crossing-supervision roster.
