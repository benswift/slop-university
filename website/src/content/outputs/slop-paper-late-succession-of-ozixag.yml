doi: 10.5555/slop.ozixag
summary: >-
  A paper from the School of Continuous Improvement recovers 41 of 48
  settlement panels that a recruitment survey hung from the pontoon of the
  University's coastal field station in four seasonal cohorts and left in place
  when it lapsed in its fourteenth month. The season of first immersion, which
  explained 45 per cent of the variation in assemblage composition at the
  survey's last census, explained 7 per cent eleven years later, while position
  along the pontoon rose from 3 to 26 per cent; the recovered panels fell into
  a mussel state, on 15 of 19 outer-end panels and 2 of 22 inner-end ones, and
  a sponge and ascidian state.
topic: >-
  Late succession of sessile invertebrate assemblages on settlement panels left
  submerged for eleven years after the monitoring program that deployed them
  lapsed, read against priority effects and alternative community states
