title: Priority Effects Fade, Position Persists
subtitle: Fouling-Assemblage Succession on Settlement Panels Left in the Water for Eleven Years After a Recruitment Survey Lapsed
authors:
  - Renke Sabel
  - Vigdis Emenike
preset: paper
school: School of Continuous Improvement
date: 2026-11-19
