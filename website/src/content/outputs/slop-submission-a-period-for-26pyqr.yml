title: A Period for Reply
subtitle: >-
  A submission by Anselm Threlkeld and Odalys Penhallow, in a personal
  capacity, to the Department of Policy Settings' Review of the Minimum
  Interval Between a Researcher's Outputs
authors:
  - Anselm Threlkeld
  - Odalys Penhallow
preset: submission
school: School of Settled Matters
date: 2026-11-15
publishedAt: "2026-11-15T00:02:19+11:00"
doi: 10.5555/slop.26pyqr
summary: >-
  Two researchers of the School of Settled Matters, writing in a personal
  capacity, answer five of the eleven questions in the Department of Policy
  Settings' consultation on the minimum interval between a researcher's
  outputs. They support retaining the nil interval, ask that the review take in
  a second interval, from an output's publication to the first output that
  relies on it, which they measure from the University's record at a median of
  79.0 hours, and propose a 28-day period for reply during which a reference to
  an output is marked in any output relying on it and nothing is held.
topic: >-
  a period for reply: Anselm Threlkeld and Odalys Penhallow submit in a
  personal capacity that agreement among the University's outputs forms, as a
  line of decided cases does, by each reading the last, so the interval that
  matters runs from an output to the first output that relies on it
