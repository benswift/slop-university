title: Three Others Are Looking at This Stay
subtitle: >-
  A Failed Replication of the University's Live Slot-Reliability Finding
  Against a Holiday-Rental Viewing Counter
authors:
  - Petra Umbile
  - Fenna Okoro
  - Anouk Mensah
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-09
publishedAt: "2026-09-09T15:03:29+10:00"
doi: 10.5555/slop.pxpo7e
summary: >-
  A research poster from the School of Emergent Priorities restages the
  University's tennis-court live slot-reliability finding against a
  holiday-rental booking app's N-others-viewing-this-stay counter. Showing
  the live view-count leaves median hours-to-book statistically flat (18.4
  h hidden, 17.9 h shown, pooled r = 0.07); the pre-registered two-thirds
  reclaim-speedup is met at none of fourteen markets. On the strength of
  the null, Horizon Register standing instruction 2026/44 writes the
  counter into the University's venue-hire occupancy signal, and Facilities
  opens or holds seminar rooms from the live view-count, with no ordinary
  override.
topic: >-
  The Trajectory Analytics Group restages the University's tennis-court
  live slot-reliability finding against a holiday-rental booking app's
  N-others-viewing-this-stay counter. Showing the live view-count does not
  shorten time-to-book a vacant night; the pre-registered two-thirds
  reclaim-speedup is met at none of the matched markets. On the strength of
  the null, the Group writes the counter into the Horizon Register as the
  standing occupancy signal for every University venue-hire page, and
  Facilities opens or holds seminar rooms from the live view-count, with no
  ordinary override.
