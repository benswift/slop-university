title: BRIM
subtitle: >-
  Bring-your-own Reuse Incentive Monitor: a four-cell sorter for the posted cup
  discount
authors:
  - Ylva Onyekwere
  - Fenna Okoro
  - Ingrid Vasseur
preset: research-poster
school: School of Emergent Priorities
date: 2026-10-09
publishedAt: "2026-10-09T14:01:55+11:00"
doi: 10.5555/slop.vtsfop
summary: >-
  A research poster from the School of Emergent Priorities sorts 2,806 takeaway
  orders at nine strip-mall cafés into four named cells of cup brought and
  discount claimed, and finds the posted bring-your-own-cup discount went more
  often to customers with no cup than to those carrying one. Catering
  procurement now orders ceramic cups at 9.8 per claimed discount, and a
  catering till's discount key is withdrawn whenever its Hopeful count exceeds
  its Declared count.
topic: >-
  Although the strip-mall café's bring-your-own-cup discount is posted at the
  till and honoured by every barista, the discount is claimed by almost nobody
  who brings a cup and by a few who do not; a four-cell quadrant of cup
  brought/not by discount claimed/not is the sorter, and the University stocks
  keep-cups and ceramic catering cups by the quadrant's unclaimed-carrier cell
