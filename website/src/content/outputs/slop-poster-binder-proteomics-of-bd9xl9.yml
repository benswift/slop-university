doi: 10.5555/slop.bd9xl9
summary: >-
  A research poster from the School of Settled Matters identifies the protein
  binders beneath the gilt lettering of a country football clubhouse's
  64-line best-and-fairest board, from 52 micro-samples analysed by nanoLC-MS/MS.
  Five binder signatures run down the board in order, with glutamine
  deamidation falling from a median of 51% to 16%, except that lines 9 to 11
  carry the casein-and-porcine-glue signature otherwise found only from line 45,
  on ground laid with the board's first lines.
topic: >-
  binder proteomics of a painted honour board in a country football clubhouse:
  telling egg, casein and animal-glue binders apart by LC-MS/MS on
  micro-samples, to sort which names were painted in one campaign and which
  were added later
