title: The Binder Dates the Lettering
subtitle: >-
  Proteomics of a clubhouse honour board sorts its 64 lines into five painting
  campaigns
authors:
  - Odalys Penhallow
  - Clemency Tredinnick
  - Ragnhild Uzoma
preset: research-poster
school: School of Settled Matters
