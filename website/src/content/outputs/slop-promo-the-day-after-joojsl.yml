doi: 10.5555/slop.joojsl
summary: "Dr Joost Nwosu, Postdoctoral Fellow in the School of Continuous Improvement,
  introduces in his own words the question his research keeps returning to: what becomes
  of a target once it has been met. Three of his outputs supply the answers so far,
  a community choir that retires a song once its tuner log is satisfied, a school
  sausage sizzle whose shire lowers the limit it has just come in under, and a junior
  swim club where a personal best becomes the floor for every swim after it. The profile
  closes on the funding, outputs and citations that make him the best-funded researcher
  in his School."
topic: "a promo profile of Dr Joost Nwosu, the best-funded researcher in the School
  of Continuous Improvement, in his own voice: a postdoctoral fellow who studies what
  happens to a target once it is met, whether it is retired, made quietly tougher
  or kept on as a floor, through a choir's tuner log, a sausage sizzle's notification
  ceiling and a junior swim club's personal-best ledger"
