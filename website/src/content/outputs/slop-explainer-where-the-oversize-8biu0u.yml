summary: A research explainer from the School of Underlying Conditions on Ragnhild
  Uzoma and Brynjar Obiora's study of the oversize from three dolerite bench blasts.
  It follows the colour-banded grout from the marker holes to the boulders that carry
  it, then sets the result beside the drill's own record of the ground. Uzoma and
  Obiora describe the work in their own words.
topic: A research explainer of the paper tracing oversize boulders in a dolerite quarry
