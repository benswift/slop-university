summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 is an extended
  reflection by its Director on five years spent alongside analytical
  laboratories and sensor networks, and on three habits the School brought home
  from the bench: the procedural blank, the stated reporting floor and the check
  standard. It records a blank week in which eleven of the Living Dashboard's
  thirty-eight panels read as normal, the nine indicators since reported as
  below reporting limit, and a recalibration interval shortened to thirteen
  weeks and then lengthened again to twenty.
