title: Checked In, Not Parked
subtitle: >-
  Validating a Park-and-Ride Reservation App's Bay-Occupancy Signal Against
  In-Ground Magnetometer Sensors
authors:
  - Torun Ezeigwe
  - Marit Osayande
preset: paper
school: School of Continuous Improvement
date: 2026-08-13
publishedAt: "2026-08-13T13:01:23+10:00"
doi: 10.5555/slop.mee3k0
summary: >-
  A paper from the School of Continuous Improvement validates a regional
  park-and-ride network's bay-reservation app against the in-ground
  magnetometer sensors installed under every bay, across six sites and
  38,412 reserved bay-sessions. Concordance between the app's occupancy
  signal and the sensors is high in the morning but falls by the afternoon,
  with 8.8% of bookings going undetected as no-shows and check-out lagging
  actual departure by 47 minutes on average; restricting the comparison to
  sites without a same-day waitlist leaves the lag unchanged.
topic: >-
  an instrument-validation study testing whether a park-and-ride commuter
  carpark's bay-reservation app, which marks a bay occupied the moment a
  booking is checked in, tracks a car's actual presence, validated against
  the carpark's own in-ground magnetometer sensors across several
  park-and-ride sites
