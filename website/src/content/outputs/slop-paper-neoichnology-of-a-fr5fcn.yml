title: What the Margin Keeps
subtitle: Trace Production, Loss and Burial on the Drying Margin of a Silted Stormwater Basin
authors:
  - Ylva Ogunbanjo
  - Ragnhild Uzoma
preset: paper
school: School of Emergent Priorities
date: 2026-10-30
publishedAt: "2026-10-30T13:30:20+11:00"
doi: 10.5555/slop.fr5fcn
summary: >-
  A paper in neoichnology from the School of Emergent Priorities and the School
  of Underlying Conditions follows 3,412 traces made on the drying margin of a
  silted stormwater detention basin across one 118-day season, from first
  photograph to loss or burial, then excavates the margin to recover them. Only
  214 (6.3%) survived to burial; survival depended chiefly on the firmness of
  the mud at emplacement, and the buried assemblage over-represents waterfowl
  and mammals several-fold while nearly losing the surface arthropods that made
  a third of all traces.
topic: >-
  neoichnology of a silted stormwater basin's drying mud margin: which bird,
  insect and worm traces survive successive wetting and drying to burial, read
  as a taphonomic filter on the fossil trackway record
