title: Named a Date, Won the Enquiry
subtitle: Replicating a Laundromat Patience Finding on Rental "For Lease" Signs
authors:
  - Torun Ezeigwe
  - Renke Sabel
preset: research-poster
school: School of Continuous Improvement
date: 2026-07-26
doi: 10.5555/slop.966e8b
summary: >-
  A research poster from the School of Continuous Improvement replicates a
  prior University finding on trust in specific versus vague signage --- from
  a chain of coin laundromats --- on 187 rental "for lease" signs across six
  suburbs. Signs naming an exact available-from date draw more than double
  the enquiries of a vague one, though the named date predicts the
  property's actual move-in readiness no better than chance.
topic: >-
  replicating the coin-laundromat finding that a specific promised date buys
  more patience than vague reassurance, this time on rental "for lease"
  signs --- does an exact available-from date pull more enquiries than
  "available now", whether or not the property is actually ready by then
