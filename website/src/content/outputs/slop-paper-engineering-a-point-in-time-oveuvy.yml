title: Amendments That Do Not Commute
subtitle: Order-Sensitive Application of Textual Amending Instructions in a Point-in-Time Statute Store
authors:
  - Anselm Threlkeld
  - Halvard Nnamani
preset: paper
school: School of Settled Matters
date: 2026-11-21
publishedAt: "2026-11-21T13:30:47+11:00"
doi: 10.5555/slop.oveuvy
summary: >-
  A paper from the School of Settled Matters and the School of Emergent
  Priorities describes Standing, a point-in-time statute store that applies
  textual amending instructions in commencement order and applies every pair
  touching the same provision in both orders. Across one jurisdiction's 18,640
  amending instructions, 1,184 of 61,902 co-targeting pairs do not commute,
  most because an occurrence index was counted against a text that changed
  before the instruction took effect, and where commencement order inverts
  enactment order the official reprints follow no single convention.
topic: >-
  Engineering a point-in-time statute store that applies textual amending
  instructions mechanically, and detecting the amendment pairs whose result
  depends on the order they are applied
