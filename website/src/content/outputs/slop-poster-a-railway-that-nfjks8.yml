title: Nine Passengers Keep the Quiet Carriage Quiet
subtitle: An eleven-month acoustic and observational study of enforcement without
  enforcers across 214 suburban rail services
authors:
  - Runa Adegoke
  - Anneke Tolan
  - Ingeborg Nwachukwu
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-19
publishedAt: 2026-08-19T15:00:07+10:00
doi: 10.5555/slop.nfjks8
summary: A research poster from the School of Emergent Priorities pairs calibrated
  sound-logging with structured observation across 214 paired rail services to
  ask what keeps an unstaffed quiet carriage quiet, attributing an estimated
  71% of its 1.8 dB(A) advantage to boarding self-selection and 4% to the 38
  enforcement events observed, 26 of them performed by nine recurring
  passengers. The operator's draft Quiet Coordination accreditation has so far
  enrolled no passenger ever observed to shush.
topic: "a railway that designates a quiet carriage employs nobody to keep it quiet
  --- eleven months of calibrated sound-loggers and observed enforcement events
  across 214 services trace its modest hush to who chooses the carriage and to
  a handful of recurring passengers who do all the shushing, and the operator's
  response is to draft them an accreditation: training module, lanyard, and a
  code of practice for the shush"
