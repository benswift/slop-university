doi: 10.5555/slop.glrara
summary: >-
  A research poster from the School of Continuous Improvement pairs a
  timestamped-cap audit of 431 home saliva samples from 64 volunteers with
  5,000 simulated evening profiles per condition. Written collection times
  heaped on the hour and half-hour while collection ran a median 8 minutes
  away from them, and placing samples at their written times added error to
  every onset estimator, least to the hockey-stick fit and most to the
  variable threshold.
topic: >-
  Time heaping in home-collected saliva schedules and its bias on dim-light
  melatonin onset estimates: a simulation study with a timestamped-cap audit
