title: Half Past, Every Time
subtitle: >-
  How Heaped Home Sampling Logs Shift Dim-Light Melatonin Onset Estimates
authors:
  - Thandiwe Solberg
  - Casimir Beng
  - Dagny Okafor
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-14
