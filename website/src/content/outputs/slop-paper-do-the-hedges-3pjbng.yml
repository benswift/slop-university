title: HEDGE
subtitle: Hedge Erosion Detector for Gaffer-Taped Emails, and a Failed Replication of Hedge Loss at Six Tea-Room Urns
authors:
  - Anneke Tolan
  - Ingrid Vasseur
  - Runa Adegoke
preset: paper
school: School of Emergent Priorities
date: 2026-09-30
publishedAt: "2026-09-30T22:00:13+10:00"
doi: 10.5555/slop.3pjbng
summary: >-
  A paper from the School of Emergent Priorities builds HEDGE, a tally system
  that counts a 63-term hedge lexicon in facilities emails and in the cards
  typed from them, and uses it to replicate an earlier School finding that
  hedges fall to zero in translation. Across 118 email-and-card pairs at six
  tea-rooms the erosion does not reproduce, cards carrying a median of four
  hedges against three, and the School's tea-rooms now pin no card until its
  hedge count is no higher than its email's.
topic: >-
  Do the hedges in a facilities email survive its retyping as the card pinned
  above the tea-room urn, the way they fail to survive a committee's minutes,
  and what should the card desk do about it?
