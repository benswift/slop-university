title: The Notice Is the Repair
subtitle: >-
  A Systematic Review and Risk-of-Bias Appraisal of Restoration-Time Reporting
  in Out-of-Order Notices at Council Public Facilities
authors:
  - Sten Okwuosa
  - Ingeborg Nwachukwu
  - Iben Chikere
  - Torun Ezeigwe
preset: paper
school: School of Continuous Improvement
date: 2026-08-13
publishedAt: "2026-08-13T16:01:20+10:00"
doi: 10.5555/slop.pbovsd
summary: >-
  A paper from the School of Continuous Improvement systematically reviews the
  out-of-order notices affixed to council public facilities, screening 1,146
  photographed records in duplicate against a protocol lodged in advance and
  appraising the 84 eligible notices across five reporting domains. No included
  notice reported the pre-specified primary outcome --- a restoration date or
  bounded window --- leaving no data to synthesise; an apology appeared on 89%
  of notices, a contact pathway on 58%, and a date of issue on 31%, and a
  sensitivity analysis relaxing the eligibility criteria moved no element by
  more than two percentage points.
topic: >-
  A systematic review and risk-of-bias appraisal of the taped-up out-of-order
  notices on council public facilities: dual screening of photographed notices
  against a pre-registered protocol, in which almost none of the eligible
  notices report the review's primary outcome, when the thing will work again,
  leaving the synthesis empty and the review recommending a reporting checklist
  instead
