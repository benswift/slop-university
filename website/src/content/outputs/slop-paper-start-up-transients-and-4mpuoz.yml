title: Carbon Laid Down in the First Hour
subtitle: >-
  Reduction-Ramp Dependence of Start-up Deposits and Their Persistence over
  100 h of Dry Reforming on a Ni–Co/MgAl₂O₄ Catalyst
authors:
  - Tove Ilesanmi
  - Halvard Nnamani
  - Ragnhild Uzoma
preset: paper
school: School of Emergent Priorities
date: 2026-11-17
publishedAt: "2026-11-17T12:31:08+11:00"
doi: 10.5555/slop.4mpuoz
summary: >-
  A paper from the School of Emergent Priorities and the School of Underlying
  Conditions reduces one batch of a nickel–cobalt dry reforming catalyst at four
  heating ramps and follows its carbon by temperature-programmed oxidation over
  100 h on stream. Faster ramps gave larger metal crystallites and four times
  the first-hour carbon (3.1 to 12.6 mg per gram), after which all four beds
  accumulated carbon at nearly the same rate, so about four-fifths of the spread
  at 100 h was in place at 1 h; neither a longer hold nor a mid-run CO₂ treatment
  closed the gap.
topic: >-
  start-up transients and persistent carbon on a nickel-cobalt dry reforming
  catalyst: the reduction ramp decides what the first hour leaves
