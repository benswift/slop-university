summary: >-
  A research poster from the School of Underlying Conditions re-augers beside
  the buried probes of a 42-station regional soil-moisture network and
  compares the soil described at each probe depth with the class each station
  record took from the soil map at installation. The record disagrees at 19
  stations, most often at the deepest probe and at 13 of the 17 stations
  within 150 metres of a mapped boundary, and recomputing those series with
  the calibration for the described soil moves them by a median 0.03 cubic
  metres per cubic metre.
