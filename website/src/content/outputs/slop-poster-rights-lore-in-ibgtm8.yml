summary: >-
  A research poster from the School of Settled Matters reports fourteen months
  of participant observation at the footage library of a regional television
  broadcaster, where archivists sort clips of unknown ownership into four kinds
  of their own naming: house, borrowed, orphaned and hot. A pile sort of 60
  clips by 12 sorters shows a clip held as orphaned through two airings without
  complaint and as house after the third, with airing count predicting its kind
  better than the paperwork on file.
topic: >-
  rights lore in a regional broadcaster's footage library: how archivists sort
  clips as house, borrowed, orphaned or hot, and the folk rule that a clip aired
  three times without complaint is safe
