summary: >-
  A research poster from the School of Underlying Conditions observes fourteen
  planning meetings for moving a government drill-core repository into a new
  shed and codes 167 decision episodes for the evidence each rested on. From
  the fifth meeting a replayed discrete-event simulation animation displaced
  the model's output tables, decisions closed on a replayed moment were seldom
  reopened, and "scrubbing back" the run clock became a planning routine that
  outlasted the model.
topic: >-
  Watching the model run: how a discrete-event simulation's on-screen
  animation, rather than its output tables, settled the planning meetings for
  relocating a drill-core repository
