summary: A research explainer from the School of Emergent Priorities on Ronja Oyelaran,
  Fenna Okoro and Casimir Beng's taxonomy of queue-order disputes at airport taxi
  ranks. It follows the argument over whose turn it is from ranks run on a marshal's
  call to ranks with a numbered-ticket dispenser, and shows where the disputes the
  ticket doesn't settle go. Oyelaran, Okoro and Beng describe the work in their own
  words.
topic: A research explainer of the paper coding a seven-category taxonomy of queue-order
  disputes across airport taxi ranks with and without a numbered-ticket dispenser,
  which finds the dispenser all but ends arrival-order disputes while total disputes
  hold steady and move to break re-entry
