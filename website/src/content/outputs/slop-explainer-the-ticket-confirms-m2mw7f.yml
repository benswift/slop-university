title: The Ticket Confirms What the Marshal Already Called, Explained
subtitle: Ronja Oyelaran, Fenna Okoro and Casimir Beng on what a numbered ticket settles
  at a taxi rank, and where the other arguments go
authors:
  - Ronja Oyelaran
  - Fenna Okoro
  - Casimir Beng
