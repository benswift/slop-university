doi: 10.5555/slop.y5zdyb
summary: >-
  A research poster from the School of Continuous Improvement describes an
  assignment-optimisation engine that replaces a suburban club raffle's
  physical barrel draw, scoring every submitted preference form and
  allocating each donated prize to whichever ticket-holder's form the model
  judges the closest fit. Across 386 forms and fourteen raffle nights, the
  longest and most exhaustively completed forms come to capture most of the
  season's feature and grand-prize allocations.
topic: >-
  A prize-matching engine built for a suburban club raffle, which replaces
  the physical barrel draw with an optimisation algorithm that allocates
  each donated prize to the ticket-holder whose submitted preference form
  scores the closest fit, maximising total stated satisfaction across the
  draw
