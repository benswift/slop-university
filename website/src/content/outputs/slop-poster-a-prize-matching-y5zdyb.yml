title: How Long Must a Preference Form Be to Win the Good Prize?
subtitle: >-
  An assignment-optimisation engine for donated-prize allocation at the
  suburban club raffle
authors:
  - Marit Osayande
  - Torun Ezeigwe
preset: research-poster
school: School of Continuous Improvement
