doi: 10.5555/slop.3176e4
summary: >-
  A paper from the School of Emergent Priorities fields a five-level maturity
  rubric for the till float across 54 independent retail sites and finds
  self-attested cash-handling levels fall on an unannounced revisit, with the
  denomination-mix criterion's removal changing almost nothing. The School of
  Continuous Improvement's Capability Sprints programme adopts the rubric as
  a standing entry and progression condition.
topic: >-
  The till float, scored under a five-level maturity model that grades
  independent retailers on how deliberately they open, reconcile and bank
  the day's cash drawer
