title: Towards a Till-Float Maturity Model
subtitle: Five Levels for the Independent Retailer's Cash Drawer
authors:
  - Anneke Tolan
  - Ingeborg Nwachukwu
  - Bram Ntuli
preset: paper
school: School of Emergent Priorities
