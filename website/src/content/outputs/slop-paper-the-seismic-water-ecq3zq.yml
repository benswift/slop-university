title: The Seismic Water Table Is the Top of the Capillary Fringe
subtitle: Joint Refraction Tomography and Surface-Wave Inversion along a Line of Eleven Monitoring Bores
authors:
  - Vigdis Emenike
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-10-22
publishedAt: "2026-10-22T16:00:56+11:00"
doi: 10.5555/slop.ecq3zq
summary: >-
  A paper from the School of Underlying Conditions shoots a 240 m seismic line
  across an alluvial terrace carrying eleven monitoring bores and sets the water
  table returned by P-wave refraction tomography and by Poisson's ratio from
  surface-wave inversion against levels dipped on the survey day. At the eight
  bores inside the resolved section both seismic interfaces lie above the
  dipped level, by 0.14 to 0.81 m after correcting for the inversion's
  smoothing bias, and the offset rises with the fines content of the core above
  the water level, which the authors read as the top of the capillary fringe.
topic: >-
  the seismic water table sits at the top of the capillary fringe: joint P-wave
  refraction tomography and surface-wave inversion along a line of eleven
  monitoring bores, set against same-morning dip readings and the described
  soil texture at each bore
