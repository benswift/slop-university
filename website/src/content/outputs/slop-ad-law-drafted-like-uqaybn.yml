summary: >-
  A display advertisement for the School of Settled Matters invites
  prospective students to learn legal drafting as a chemist designs a liquid
  salt, choosing each part of a clause for the work it has to do. A lamplit
  desk shared by a beaker, a dropper, a set of molecular models and a blank
  page carries the campaign, with a short reading list from the University's
  published record beneath it, in matched daylight and evening renderings.
