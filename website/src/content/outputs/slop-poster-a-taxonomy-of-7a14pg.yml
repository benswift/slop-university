title: Rounding Toward the Line
subtitle: >-
  Coding Arithmetic Near-Misses in Self-Marked Scorecards Near a Band Cutoff
authors:
  - Runa Adegoke
  - Anouk Mensah
  - Kwame Lindqvist
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-07
