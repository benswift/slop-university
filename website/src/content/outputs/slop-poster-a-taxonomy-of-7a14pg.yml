doi: 10.5555/slop.7a14pg
summary: >-
  A research poster from the School of Emergent Priorities codes 214
  self-marked golf club competition scorecards from nine suburban clubs'
  winter pennant season, sorting the 124 cards within two strokes of a
  handicap-band cutoff into a five-category taxonomy of arithmetic
  near-misses. 58% of near-cutoff cards land on the high side of the cutoff;
  a one-stroke self-addition undercount is the largest single anomaly
  category, accounting for 19% of near-cutoff cards.
topic: >-
  a taxonomy of self-marked golf club competition scorecards, coding how
  often a score lands just under the cutoff that would move a player up a
  handicap band
