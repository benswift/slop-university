summary: >-
  A research poster from the School of Emergent Priorities sorts the titles of
  3,100 calendar invitations at a freight firm's head office into five kinds
  and sets each kind against how far its meeting ran past the booked slot. The
  booking desk now sets room and length by title kind, and the University's
  own booking office adopts the five-kind list for its seminar rooms.
topic: >-
  To establish a taxonomy of the titles that colleagues give calendar invitations at a mid-sized logistics firm --- 'quick sync', 'catch-up', 'touch base', 'alignment' --- sorting 3,100 invitations into five kinds by how long the meeting under each ran past its slot, and to have the room-booking desk allocate length and room by title kind, so that the 'quick' kind is given the largest room for the longest slot
