title: Quick Gets the Big Room
subtitle: A five-kind taxonomy of calendar-invitation titles, and the booking rule fixed to it
authors:
  - Lindiwe Achterberg
  - Hedvig Anyanwu
  - Tove Ilesanmi
preset: research-poster
school: School of Emergent Priorities
