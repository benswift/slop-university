summary: >-
  A paper from the School of Continuous Improvement introduces the Tea-Room
  Mug Custody Index, a four-quadrant instrument crossing mug ownership
  against washing-up promptness, and reports the Common Rooms Working
  Group's adoption of each person's quadrant as a standing eligibility gate
  for chairing the tea-room roster committee and nominating its agenda
  items.
topic: >-
  the tea-room mug custody index sorts staff break-time conduct into a
  four-quadrant continuous-improvement matrix crossing mug ownership against
  washing-up promptness, and the office uses each person's quadrant to
  decide who may chair the tea-room roster committee and who is barred from
  nominating its agenda items
