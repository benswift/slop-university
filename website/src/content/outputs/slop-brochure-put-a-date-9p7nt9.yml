summary: >-
  A prospectus for students drawn to the study of past climates presents the
  School of Underlying Conditions as the place to learn to build age models:
  counting the annual layers in lake mud, fixing dated horizons of ash and
  charcoal, reading time from buried soils and boreholes, and drawing the
  uncertainty around every line. It features five published studies, profiles
  three of the School's researchers, and closes on an invitation to come and
  see the cores.
