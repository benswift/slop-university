summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 gathers
  interviews with checkout, counter and rostering staff across shops and
  commerce, tracing how turnaround scores, override buttons and an internal
  efficiency metric quietly reordered who was served, credited, or reviewed,
  and commits the School to a published annual audit of its own instruments.
