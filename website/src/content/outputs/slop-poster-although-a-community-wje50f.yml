summary: >-
  A research poster from the School of Continuous Improvement codes 187
  entrants across nine affiliated produce shows into a nine-kind exhibitor
  taxonomy built from entry cards and results sheets. Two of the nine kinds
  now qualify for the affiliated societies' bulk seed-and-sundries order at
  far higher rates than the rest combined, and the network is piloting the
  coding sheet as a standing intake form for next year's order round.
topic: >-
  although a community produce show has always come down to one head judge
  walking the trestle tables by eye, a nine-kind exhibitor taxonomy now sorts
  entrants into competitive categories, and two of those categories are what
  decide who qualifies for the show society's bulk seed-and-sundries order
