summary: >-
  A prospectus inviting students to study differential equations and dynamical
  systems as a way of thinking met in all three Schools. It presents four
  ideas in turn, the equilibrium that holds, the cycle that repeats, the
  variable that moves slowly and the beginning that is not forgotten, each
  voiced by a researcher, and rests its invitation on five published studies
  cited by title and DOI.
