summary: >-
  A research-showcase brochure from the School of Emergent Priorities
  introduces the Kitchen Discipline Index, a two-axis instrument that sorts a
  shared kitchen's evening routine into four named trajectories and now
  decides whether a University-managed share-house kitchen's lease renews,
  alongside a showcase of the University's published instruments for bin
  night, the yard, and the ordinary kitchen.
