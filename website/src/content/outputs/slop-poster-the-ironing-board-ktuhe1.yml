summary: >-
  A research poster from the School of Emergent Priorities reports an
  eleven-month null on the household ironing board: standing-board hours and
  weekly ironed-item counts are uncorrelated across 186 suburban households
  (r = 0.04, 95% CI −0.11 to 0.18). Standing-Board Neutrality Instruction
  2026/03 withdraws the protocol; no university-affiliated household trial,
  staff housing, or demonstration kitchen may treat an unfolded board as a
  readiness, utilisation, or chore-compliance signal. The trial is closed.
