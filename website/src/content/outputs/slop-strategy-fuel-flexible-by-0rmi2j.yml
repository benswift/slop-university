title: Fuel-Flexible by Design
subtitle: Slop University's Strategic Plan 2026-2031 for one shared combustion test capability across its single-cylinder research engines
authors:
  - Thandiwe Solberg
  - Torun Ezeigwe
  - Ingeborg Nwachukwu
preset: strategy
school: School of Continuous Improvement
date: 2026-11-23
publishedAt: "2026-11-23T12:30:55+11:00"
doi: 10.5555/slop.0rmi2j
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to
  treating its single-cylinder research engines, held until now in separate
  test cells across three Schools, as one shared combustion capability on a
  single booking calendar. Under four priorities it sets out one intake process
  for every fuel the transition brings, a combustion ledger that keeps
  cycle-resolved data at the resolution it was measured, observed competency
  for every operator, and one engine run opened to the University community in
  every Demo Quarter.
topic: >-
  Fuel-flexible by design: the University gathers its scattered single-cylinder
  research engines into one shared combustion test capability, run on whatever
  fuels the transition brings
