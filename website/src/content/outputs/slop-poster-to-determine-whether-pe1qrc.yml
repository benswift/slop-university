doi: 10.5555/slop.pe1qrc
summary: >-
  A research poster from the School of Continuous Improvement repeats a
  cabinet-latch pull-force test at 131 back-yard side gates ticked as latched
  across 138 yards, finding two failures and no sign of the earlier
  over-crediting, and reports the University's shared-room door sheets
  accepting no latched tick without a gauge reading in newtons beside it.
topic: >-
  To determine whether the checklist over-crediting found for kitchen cabinet
  child-safety latches reappears at the side-gate latches of 138 back yards,
  where a tick for 'latched' is tested against the same standardised pull-force
  gauge, and to bind the University's shared-room door sheet to carry a
  pull-force reading beside every tick
