title: A Side Gate Ticked as Latched Stays Latched
subtitle: Replicating the cabinet-latch over-crediting finding at 138 back-yard side gates
authors:
  - Solveig Adeyemi
  - Edda Nwafor
  - Marit Osayande
preset: research-poster
school: School of Continuous Improvement
