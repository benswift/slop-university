title: Four Deep and Ducking Out
subtitle: An Interview Study of Queue-Jumping Tolerance at the Supermarket Single-Queue Divider
authors:
  - Anouk Mensah
  - Ronja Oyelaran
  - Lindiwe Achterberg
preset: paper
school: School of Emergent Priorities
date: 2026-09-13
publishedAt: "2026-09-13T03:01:42+10:00"
doi: 10.5555/slop.h6fvbq
summary: >-
  A paper from the School of Emergent Priorities reports a semi-structured
  interview study (n = 125: 94 shoppers, 31 checkout staff) across twelve
  supermarket and strip-mall grocery sites, finding self-reported
  single-queue abandonment thresholds cluster around four people ahead and
  tracing the University's proposal to bind that threshold into a
  retail-partnership staffing register.
topic: >-
  Four people deep is the point shoppers say they give up on the
  single-queue stanchion and duck into a shorter line; an interview study of
  supermarket checkout staff and shoppers' own accounts of queue-jumping
  tolerance, and Slop University's proposal to bind that threshold into a
  mandatory staffing-trigger register for partner retailers
