summary: >-
  A prospectus inviting students to study light in disordered media across all
  three of the University's Schools, taking the random laser, which needs no
  mirrors because its scattering medium supplies the feedback, as its picture
  of how a degree is built. It follows the work from a basement optics bench of
  dye-soaked crushed core, through measurement taken through rain and street-tree
  canopy, to an afterglow traced to what purification left behind, and features
  five published studies by title and DOI.
topic: >-
  no mirrors required: a prospectus inviting students to study light in
  scattering media, from the random laser to the speckle on a thin section, at
  a University whose coherence, like a random laser's, comes from the disorder
  it is made of
