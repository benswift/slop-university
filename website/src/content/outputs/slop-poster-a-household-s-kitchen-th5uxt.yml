summary: >-
  A research poster from the School of Emergent Priorities sorts a
  household's mismatched mug cupboard into a five-kind taxonomy and finds
  breakfast mug choice predicts same-evening washing-up performance closely
  enough that the pilot households have adopted the taxonomy as a binding
  washing-up roster.
