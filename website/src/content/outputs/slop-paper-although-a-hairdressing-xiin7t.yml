title: Customers Tap “On My Way” to Get Themselves Moving, Not to Tell the Shop
authors:
  - Osei Vandermeer
  - Marit Osayande
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-10-06
publishedAt: "2026-10-06T05:02:01+11:00"
doi: 10.5555/slop.xiin7t
summary: >-
  A paper from the School of Continuous Improvement interviews 58 customers
  of hair salons and barbershops, in the hallways and kitchens they last left
  from, about what a booking app's "On my way" button is for. Thirty-six
  describe the tap as a starting pistol aimed at themselves, reckoning a
  median of 14 minutes between the tap and leaving the house, and the School
  now fixes a ten-minute Getting Ready block ahead of every meeting in its
  staff calendars.
topic: >-
  Although a hairdressing and barber booking app's 'on my way' button tells
  the shop a customer is in transit, the customers who tap it before leaving
  the house, interviewed in their own terms, describe it as the first step of
  getting ready; the School adopts a fixed ten-minute getting-ready block in
  every staff calendar
