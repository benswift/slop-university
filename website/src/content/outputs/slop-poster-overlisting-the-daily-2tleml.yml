title: Seven Against Six
subtitle: >-
  Overbooking a civil tribunal's daily hearing list when settlements arrive
  together
authors:
  - Mirela Hanke
  - Bram Ntuli
  - Kwame Lindqvist
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-30
publishedAt: "2026-10-30T21:00:15+11:00"
doi: 10.5555/slop.2tleml
summary: >-
  A research poster from the School of Continuous Improvement sets a regional
  civil tribunal's daily hearing list as an overbooking problem, fitting 2,104
  listed matters across 286 sitting member-days with a beta-binomial model in
  which settlements cluster within a morning. The registry's practice of
  listing seven tenancy matters against a capacity of six matches the
  clustered optimum, two fewer than an independent model would set, while its
  other three lists each carry one matter more than either model recommends.
topic: >-
  Overlisting the daily list: an overbooking model for a civil tribunal's
  hearing calendar, treating door-of-court settlements and adjournments as
  no-shows
