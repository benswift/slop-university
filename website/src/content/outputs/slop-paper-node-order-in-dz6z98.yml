title: As Per Previous Node
subtitle: Session Position, Cross-Referencing and Cause Recording in an Engineering Contractor's HAZOP Archive
authors:
  - Petra Umbile
  - Casimir Beng
  - Vigdis Emenike
preset: paper
school: School of Emergent Priorities
date: 2026-11-06
publishedAt: "2026-11-06T01:32:18+11:00"
doi: 10.5555/slop.dz6z98
summary: >-
  A paper from the School of Emergent Priorities reads 11,902 deviation rows
  from 38 hazard and operability studies in one engineering contractor's
  archive against the scribes' minute books, and finds that rows written later
  after a break record fewer causes but point more often to other nodes, so
  that once each pointer is followed the decline almost disappears. A sample of
  600 inter-node pointers judged against the issued drawings shows most carried
  fully applicable causes, while 4% of all pointers name nodes that no longer
  exist in the issued report.
topic: >-
  node order in a HAZOP: whether worksheet nodes reviewed late in a session
  record fewer causes and lean on 'as per previous node' cross-references,
  across an engineering contractor's archive of hazard and operability studies
