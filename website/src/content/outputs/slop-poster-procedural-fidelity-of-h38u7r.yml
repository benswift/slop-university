doi: 10.5555/slop.h38u7r
summary: >-
  A research poster from the School of Settled Matters observes relief teachers
  carrying out 38 written behaviour support plans from nine primary schools
  they had never seen before, against class teachers who attended each plan's
  meeting, across 1,412 step opportunities. Relief teachers carry out 57% of
  steps as written against 81%, a gap of seven points for steps drafted as an
  if–then contingency and 43 points for steps drafted as a narrative goal.
topic: >-
  procedural fidelity of written behaviour support plans when carried out by
  relief staff who meet the plan only on paper
