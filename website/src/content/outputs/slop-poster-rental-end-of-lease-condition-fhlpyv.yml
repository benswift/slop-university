doi: 10.5555/slop.fhlpyv
summary: >-
  A research poster from the School of Continuous Improvement sends two
  independent assessors through each of 192 vacating tenancies, scoring the
  standard twenty-two-item end-of-lease condition report blind and within
  forty-eight hours of one another. Raw agreement across 4,224 paired
  line-item judgements is 85.0% but pooled Cohen's kappa is 0.26, falling to
  0.11 on the six items carrying the largest scheduled deductions, with the
  highest agreement recorded on the one condition grade that attracts no
  deduction at all.
topic: >-
  rental end-of-lease condition reports scored independently by two
  inspectors, and whether their ticks agree at all before the bond deductions
  are itemised to the dollar
