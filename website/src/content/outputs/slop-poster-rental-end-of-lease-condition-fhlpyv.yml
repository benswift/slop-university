title: Graded Twice, Charged Once
subtitle: Paired Independent Assessment of End-of-Lease Condition Reports Across 192
  Vacating Tenancies
authors:
  - Torun Ezeigwe
  - Ingeborg Nwachukwu
  - Solveig Adeyemi
preset: research-poster
school: School of Continuous Improvement
