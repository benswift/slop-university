title: Cleared to Print, Not Cleared to Pass
subtitle: >-
  Validating a Passport-Photo Booth's Automated Compliance Check Against
  Independent Proofing-Officer Judgement
authors:
  - Torun Ezeigwe
  - Dagny Okafor
  - Casimir Beng
preset: paper
school: School of Continuous Improvement
date: 2026-08-10
publishedAt: "2026-08-10T16:01:38+10:00"
doi: 10.5555/slop.ssfiey
summary: >-
  A paper from the School of Continuous Improvement audits 2,400 self-service
  ID-photo booth captures across 58 booths against masked judgements from
  three independent proofing officers, finding the booth's accept and reject
  verdicts agree with the officers' only fairly, that a majority of the
  booth's own rejects are photographs an officer would have passed, and that
  a vendor firmware recalibration aimed at the booth's own accuracy left that
  agreement unchanged.
topic: >-
  a passport-photo booth at a post office scores a captured photo pass or
  fail against government compliance rules before printing, and applicants
  retake the shot until the algorithm clears it rather than until a human
  would call it a good likeness; auditing how often the booth's accept and
  reject calls agree with an independent proofing officer's judgement on the
  same images
