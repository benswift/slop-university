summary: >-
  A research poster from the School of Settled Matters runs the release of an
  obsolete restrictive covenant as a laboratory bargaining game, with 216
  participants in markets of one developer and five benefited owners. Under
  unanimity the last owner to sign is paid most; when a tribunal may discharge
  the covenant, the order of payments inverts and the first signer is paid
  most, though only 7% of markets end by discharge.
topic: >-
  A laboratory holdout game over releasing an obsolete restrictive covenant:
  whether a tribunal's power to discharge it turns the race to sign last into a
  race to sign first
