title: The Race to Sign First
subtitle: How a Discharge Backstop Inverts Holdout in a Covenant-Release Bargaining Game
authors:
  - Clemency Tredinnick
  - Bram Ntuli
  - Ylva Onyekwere
preset: research-poster
school: School of Settled Matters
