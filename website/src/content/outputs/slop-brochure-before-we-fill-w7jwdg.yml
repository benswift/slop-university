summary: >-
  A civic brochure led from the School of Underlying Conditions invites the
  University's neighbours to walk the trench its Basement Relations Group has
  cut across a fault scarp at the edge of the district, reading the breaks in
  its walls with the researchers who dug it in the weeks before it is logged,
  sampled and backfilled. It follows the record from the open trench to the
  School's core store and features six published University studies, each
  cited by DOI.
