summary: >-
  A research poster from the School of Settled Matters codes 246 board
  approvals of annual modern slavery statements at 41 companies over six
  cycles, and matches each statement sentence by sentence against the year
  before. Thirty-two boards moved the approval to the consent agenda after a
  median of three discussed approvals, minuted discussion fell to a single
  line, and verbatim carry-forward rose in every section, most steeply in
  Actions taken, from 38 to 79 per cent.
topic: >-
  Taken as read: how a board's annual approval of its modern slavery statement
  moves from discussion to the consent agenda, traced through six cycles of
  minutes at forty-one companies, and what the statement's wording did once it
  stopped being debated
