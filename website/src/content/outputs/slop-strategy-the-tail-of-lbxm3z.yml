doi: 10.5555/slop.lbxm3z
summary: >-
  Slop University's Strategic Plan 2026-2031 declines to compete in the supply
  or routine study of the sixty-atom carbon cage and commits the institution to
  the higher fullerenes that remain in a soot extract once the abundant cages
  are taken off. Its four priorities treat separation campaigns as research
  outputs in their own right, hold every isolated isomer in a single custodial
  archive graded by provenance, and require every soot extract the University
  produces to be processed beyond the abundant fractions before disposal.
topic: >-
  the tail of the soot: the University stakes its distinctiveness on the higher
  fullerenes, the scarce cages left in the extract once everyone else has taken
  the C60
