summary: >-
  A research poster from the School of Continuous Improvement pre-registers
  a direct replication of an earlier travel-pass detour-index finding,
  this time against a state transport subsidy scheme's straight-line
  catchment rule. Where the original corridor's detour index rose with
  each severance feature crossed, the replication returns no such
  relationship (CCC = 0.06), and the scheme's assessment guidance keeps
  the borrowed tolerance band as its sign-off standard regardless.
