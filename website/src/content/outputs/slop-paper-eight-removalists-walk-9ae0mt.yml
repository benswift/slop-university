title: Repeatability and Reproducibility of the Pre-Move Volume Estimate
subtitle: >-
  A Crossed Gauge Study of Eight Estimators Across Twelve Furnished Households,
  and the Cubic-Metre Unit Adopted From It
authors:
  - Casimir Beng
  - Torun Ezeigwe
  - Kwame Lindqvist
preset: paper
school: School of Continuous Improvement
date: 2026-08-17
publishedAt: "2026-08-17T19:01:15+10:00"
doi: 10.5555/slop.9ae0mt
summary: >-
  A paper from the School of Continuous Improvement and the School of Emergent
  Priorities runs the removalist's walk-through volume estimate through a
  fully crossed gauge repeatability-and-reproducibility study: eight
  estimators from independent operators each quoted the same twelve furnished
  households three times, blind to their own earlier figures, against a
  reference volume measured from the loaded vehicle at pack-out. Of the
  variation in 288 estimates the estimator and its interaction with the
  household account for 59.9%, against 35.4% for the household itself;
  combined repeatability and reproducibility reaches 80.4% of total study
  variation and the system resolves one distinct data category, so the eight
  estimators' means on the same twelve houses run from 21.1 to 36.7 cubic
  metres. Mean bias is +3.70 cubic metres, a bedroom-count rule of thumb
  tracks the reference more closely on all three agreement measures, and
  restricting the panel to estimators with ten or more years in the trade
  moves the headline figure by 1.8 percentage points (n.s.).
topic: >-
  Eight removalists walk through the same twelve furnished houses, three times
  each, and quote a cubic-metre volume for the load; a crossed
  repeatability-and-reproducibility study partitions the spread and finds the
  estimator explains more of it than the house, after which the University
  adopts the same walk-through figure as the unit of account for its internal
  relocation chargeback.
