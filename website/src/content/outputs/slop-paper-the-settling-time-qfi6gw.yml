title: Settled in Retrospect
subtitle: Exact Settling Times and Safe Dwell Windows for the Underdamped Step Response
authors:
  - Odalys Penhallow
  - Casimir Beng
preset: paper
school: School of Settled Matters
date: 2026-11-16
