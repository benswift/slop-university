doi: 10.5555/slop.qfi6gw
summary: >-
  A paper from the School of Settled Matters and the School of Continuous
  Improvement gives the settling time of the underdamped second-order step
  response in closed form, as the last exit of the error from its tolerance
  band, and shows that every jump in it has the same length, set by the
  damping ratio alone. The same constant is the shortest dwell window that
  never declares the response settled too early; across all responses with a
  given minimum damped frequency the sharp window is one damped half-period,
  and under measurement noise the rule errs late rather than early.
topic: >-
  the settling time of an underdamped step response is a last-exit time, and
  the shortest dwell window that never declares it settled too early
