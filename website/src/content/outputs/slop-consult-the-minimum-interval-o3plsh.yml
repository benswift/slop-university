doi: 10.5555/slop.o3plsh
summary: >-
  A consultation paper from the Department of Policy Settings invites
  submissions on whether to vary the minimum interval between a researcher's
  outputs, fixed at nil by the Slop University (Output Intervals) Determination
  2026. It reports how the interval has run in practice across the four
  schools, notes four of the University's outputs as evidence, and sets out four
  options, from retaining the nil interval to intervals set by each school,
  without forming a view between them.
