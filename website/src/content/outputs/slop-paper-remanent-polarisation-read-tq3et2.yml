title: Poled Once
subtitle: Remanent Polarisation and the Burden That Runs with a Thing
authors:
  - Clemency Tredinnick
preset: paper
school: School of Settled Matters
date: 2026-11-10
publishedAt: "2026-11-10T22:31:18+11:00"
doi: 10.5555/slop.tq3et2
summary: >-
  A jurisprudence paper from the School of Settled Matters follows a
  hypothetical disc of poled piezoelectric ceramic through four hands, under a
  maker's printed conditions that try to bind every later holder, and reads the
  direction fixed in the material against the restrictive covenant registered
  on land. It argues that the land register exists to make a legal burden
  behave as the physical one does, and that both harden against reversal as
  their use declines, though only the material carries its own threshold of
  release.
topic: >-
  Remanent polarisation read as a servitude on a chattel: what a poled
  piezoceramic, carrying its maker's direction through every later owner,
  shows land law about burdens that run with things and when they have served
  their time
