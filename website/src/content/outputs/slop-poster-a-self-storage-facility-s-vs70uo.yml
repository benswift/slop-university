summary: >-
  A research poster from the School of Emergent Priorities audits 341
  auto-upgrade events across fourteen self-storage sites, finding that
  renters who notice a silent unit-size upgrade too late to reverse it get
  counted, downstream, as the growth behind the operator's next capacity
  forecast.
topic: >-
  a self-storage facility's booking software silently auto-upgrades a
  renter to the next unit size when their overflow won't fit, and folds the
  opt-down window into a rolling forecast of how much more space everyone
  will eventually need
