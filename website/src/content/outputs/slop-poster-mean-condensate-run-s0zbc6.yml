title: The Fall Line of a Square Still
subtitle: Sharp bounds on the mean condensate run under a flat cover over a convex basin
authors:
  - Edda Nwafor
  - Solveig Adeyemi
  - Brynjar Obiora
preset: research-poster
school: School of Continuous Improvement
