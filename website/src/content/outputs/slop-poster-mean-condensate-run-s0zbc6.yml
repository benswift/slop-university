doi: 10.5555/slop.s0zbc6
summary: >-
  A research poster from the School of Continuous Improvement models the basin
  of a solar still as a convex planar body under a flat tilted cover and proves
  sharp bounds on the mean distance a condensate droplet runs to the edge. A
  scale-free run constant lies above one half and at most two thirds for every
  convex basin, every triangle attains the upper bound, and a square basin
  drains best when the fall line runs from a corner to the midpoint of a far
  side.
topic: >-
  mean condensate run under the flat tilted cover of a convex basin solar
  still: sharp chord-integral bounds and the optimal fall line
