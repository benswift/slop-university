summary: >-
  A marketing poster for the School of Emergent Priorities carries a failed
  replication onto Slop University's signage rotation: the clock-start
  redefinition that held a tailoring shop's turnaround guarantee steady does
  not hold a shire development-approval office's own processing-time rate
  steady, whatever the office calls the date an application arrived.
topic: >-
  a shire development-approval office tests whether backdating when a lodged
  application's statutory clock starts, the same later-clock trick that
  rescued a tailoring shop's 48-hour guarantee, can rescue its own
  processing-time compliance rate
