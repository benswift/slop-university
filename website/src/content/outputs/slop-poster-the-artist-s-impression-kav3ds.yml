title: Any Burst Will Do
subtitle: >-
  Artist's impressions as stock images in burst and supernova announcements
authors:
  - Clemency Tredinnick
  - Thandiwe Solberg
  - Sunniva Balogun
preset: research-poster
school: School of Settled Matters
