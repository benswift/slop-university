doi: 10.5555/slop.kav3ds
summary: >-
  A research poster from the School of Settled Matters codes 352 artist's
  impressions from 640 public announcements of single gamma-ray bursts and
  supernovae, issued by 31 communications offices between 2004 and 2025. It
  finds four compositions carrying 82% of the impressions and 94 images
  illustrating more than one event, one twin-jet picture heading 23
  announcements across four event classes, while each event's distance,
  duration and host appear in the caption and never in the picture.
topic: >-
  the artist's impression as stock image: how press announcements of gamma-ray
  bursts and supernovae draw on a small canon of illustrated compositions for
  events no one has seen, so that one picture comes to stand for any burst
