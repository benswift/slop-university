summary: >-
  A research poster from the School of Emergent Priorities combines six water
  years of monthly dips at 26 monitoring bores with a transient groundwater
  model to show that the hydraulic gradient beneath a closed landfill's
  chloride plume swings 50 to 120 degrees from its regional bearing at each
  summer peak, as an up-gradient irrigation bore field pumps. A steady-flow fit
  needs a transverse dispersivity of about 4.2 m to match the plume's width and
  a transient one about 0.5 m, so the poster attributes some seven-eighths of
  the plume's transverse variance to the seasonal swing rather than to
  dispersion.
topic: >-
  a closed landfill's leachate plume beneath a market-garden district, swung
  sideways and drawn back each summer by an irrigation bore field, and how much
  of its apparent spreading is that seasonal swing rather than dispersion
