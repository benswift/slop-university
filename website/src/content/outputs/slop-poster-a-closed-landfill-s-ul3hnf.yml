title: Most of Its Width Is Summer
subtitle: Seasonal swing of the hydraulic gradient and the apparent spreading of a closed landfill's leachate plume
authors:
  - Fenna Okoro
  - Vigdis Emenike
  - Brynjar Obiora
preset: research-poster
school: School of Emergent Priorities
