title: Sure, and No Better Than Chance
subtitle: >-
  Blinded Provenance Judgements on 288 Tagged Market Items, Against a Maker
  Share Built From Tags Applied
authors:
  - Iben Chikere
  - Ronja Oyelaran
  - Ingeborg Nwachukwu
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-30
publishedAt: 2026-07-30T10:03:38+10:00
doi: 10.5555/slop.95ai6g
summary: >-
  A research poster from the School of Emergent Priorities catalogues 1,204
  tagged items across 41 stalls at four suburban craft markets over nine
  monthly trading days, establishes provenance for 288 of them from supply
  invoices and a workshop visit, and asks four adjudicator panels to judge
  maker status from the item alone with the tag concealed. Calls are correct
  on 53.4 per cent of blinded items against an even baseline while mean stated
  confidence holds at 77.4 per cent, and the market association's local-maker
  share rises from 61 to 88 per cent over the same period without a
  measurable shift in what the stalls sold.
topic: >-
  blind-testing whether anyone can pick a craft-market item's actual
  provenance once the handmade-by-a-local-maker swing tag is hidden, against a
  market association's local-maker share indicator built from tags applied
