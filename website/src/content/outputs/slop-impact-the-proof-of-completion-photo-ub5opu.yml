summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 audits the
  completion photo that home-service platforms require before releasing
  payment, finding it barely outpredicts a category's ordinary completion
  rate, then follows the live video check-in introduced to replace it,
  including the early-warning ensemble built to flag a check-in workaround
  before it fully circulates.
topic: >-
  the proof-of-completion photo that dog-walking, gardening and
  home-cleaning apps ask their workers to upload, and the live video
  check-in now being reintroduced once staged photos got too easy to fake
  --- the same reason oral exams are returning to the classroom
