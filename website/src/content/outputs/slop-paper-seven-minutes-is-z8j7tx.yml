title: Seven Fast, Nobody Late
subtitle: >-
  A Teaching Case on One Household's Oven Clock, and the Declared-Offset Rule
  Now Fitted to University Staff Kitchenettes
authors:
  - Renke Sabel
  - Solveig Adeyemi
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-10-05
publishedAt: "2026-10-05T18:00:55+11:00"
doi: 10.5555/slop.z8j7tx
summary: >-
  A paper from the School of Continuous Improvement follows one terrace
  household's oven clock, left seven minutes fast by a storm power cut, through
  312 timed cooks over twenty-six weeks, finding that resetting it to true time
  raised the median timing error from 0.7 to 5.7 minutes because two residents
  kept subtracting, and that a +7 masking-tape label changed nothing. The
  University now leaves each staff-kitchenette appliance clock at its measured
  offset, labelled and registered, and permits a reset only on a seven-day
  notice countersigned by every user on the floor roster.
topic: >-
  Seven minutes is how far one terrace household's kitchen oven clock has run
  fast since a storm power cut, told as a teaching-note case in which the
  household's reset in week fourteen makes dinner timing worse, and the
  declared-offset rule the University set for its own staff kitchenette
  appliance clocks
