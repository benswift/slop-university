doi: 10.5555/slop.sl66s9
summary: >-
  A paper from the School of Emergent Priorities specifies a five-level
  Desk-Claim Maturity Model that scores every open-plan desk by the
  persistence of the jacket or bag left on it, then records the Space
  Allocation Committee's rule that restacks any floor whose median desk
  falls below Level 4 and keeps window desks only for garments photographed
  at two consecutive weekly aisle audits.
topic: >-
  Establish a five-level desk-claim maturity model against which every
  open-plan floor is scored, and bind restack priority to remaining at
  Level 5 (Claimed by Garment) for a full review cycle.
