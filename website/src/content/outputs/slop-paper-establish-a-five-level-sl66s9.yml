title: Bagged, Not Sitting
subtitle: A five-level desk-claim maturity model for the open-plan floor
authors:
  - Hedvig Anyanwu
  - Kwame Lindqvist
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
date: 2026-09-15
