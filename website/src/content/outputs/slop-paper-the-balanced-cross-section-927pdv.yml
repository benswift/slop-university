summary: >-
  An essay in political theory from the School of Underlying Conditions reads
  the structural geologist's balanced cross-section, and its paired tests of
  admissibility and viability, as a theory of what may legitimately be
  restored. It argues that a restoration answers to the conservation of what
  exists rather than to resemblance with a remembered original, that what has
  been lost must be carried in the account as reckoned rather than recovered,
  and that a region's repertoire of known structures should presume but never
  veto.
