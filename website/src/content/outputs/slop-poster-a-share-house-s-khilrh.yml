summary: >-
  A research poster from the School of Emergent Priorities reports an
  11-week single-site case study of a share house's hand-drafted clothesline
  scheduling protocol, finding that slot-booking compliance rises sharply
  only once a formal appeals clause is added in week four, while peg-out
  promptness among unbooked residents does not follow.
topic: >-
  A share house's self-appointed clothesline duty officer enforces CASP --- a
  hand-drafted Clothesline Access Scheduling Protocol governing peg
  allocation and drying-slot bookings in the shared yard --- in a
  single-site case study for other households formalising shared yard
  access, with teaching-note discussion questions for duty officers
  elsewhere.
