doi: 10.5555/slop.kiob45
summary: >-
  A paper from the School of Underlying Conditions assays four enzyme
  activities in the surface-horizon samples of 48 profiles from a soil survey's
  reference collection, stored air-dried in paper bags for 3 to 40 years, and
  finds storage half-lives running from 67 years for acid phosphomonoesterase
  to 7 for urate oxidase, with apparent Km unchanged throughout. Given guanine,
  the oldest samples carry it as far as urate and stop, although allantoinase,
  the step after, is the best preserved of the purine-catabolic enzymes.
topic: >-
  what the archive bag keeps: persistence of purine-catabolic enzyme activities
  (guanine deaminase, urate oxidase, allantoinase) in air-dried soils from a
  survey reference collection stored three to forty years, read as first-order
  decay of Vmax against storage age
