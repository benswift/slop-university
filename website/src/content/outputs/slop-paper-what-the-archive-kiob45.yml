title: What the Bag Keeps
subtitle: Differential Persistence of Purine-Catabolic Enzyme Activities in Air-Dried Soils from a Survey Reference Collection
authors:
  - Brynjar Obiora
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
