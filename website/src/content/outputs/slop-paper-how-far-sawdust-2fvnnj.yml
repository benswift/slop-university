doi: 10.5555/slop.2fvnnj
summary: >-
  A paper from the School of Settled Matters follows 240 sawdust grow bags of
  oyster mushroom at one grower from filling to first flush, crossing hand and
  screw filling with three substrate moistures. Hand-filled blocks settled about
  twice as far, more than half of it in the steamer before spawning; settling
  predicted side-pinning into the gap between block and bag wall, and
  side-pinned bags gave a first flush from the opened face 26 g lighter.
topic: >-
  how far sawdust substrate settles in oyster-mushroom grow bags over the spawn
  run, and whether the settled bag colonises or crops differently
