title: The Gap Under the Neck
subtitle: Settling of Sawdust Substrate in Oyster Mushroom Grow Bags, and What It Costs the First Flush
authors:
  - Odalys Penhallow
  - Brynjar Obiora
preset: paper
school: School of Settled Matters
