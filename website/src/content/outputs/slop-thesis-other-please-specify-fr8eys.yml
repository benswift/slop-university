title: Other (Please Specify)
subtitle: What Becomes of the Words Typed into the Residual Field of Community Organisations' Online Forms
authors:
  - Halvard Nnamani
preset: thesis
school: School of Emergent Priorities
date: 2026-10-05
publishedAt: "2026-10-05T19:57:17+11:00"
doi: 10.5555/slop.fr8eys
summary: >-
  A doctoral thesis from the School of Emergent Priorities follows what is typed
  into the "Other (please specify)" box on the online forms of 38 community
  organisations: a census of 61,208 entries in 417 boxes, a trace of each box
  through its keeper's exports, 44 recorded sessions with people completing
  their own forms, and a three-arm trial across 14,406 form sessions. Fewer
  than one entry in seven named something its list lacked, the contents of
  three boxes in four had been seen by no one, and discarding what was typed
  changed neither completion nor later contact while removing the box changed
  both; the University has adopted the recommended Specify Field Standard,
  under which every list on its forms ends with the box and nothing typed
  there is transmitted, stored or used to amend the list, with no override.
topic: >-
  Other (please specify): a doctoral thesis following what is typed into the
  free-text box on community organisations' online registration and booking
  forms, finding that the box matters and its contents do not, and the
  rendered-not-retained rule the University set for the same box on its own
  forms
