summary: A case-for-support brochure invites partners to back the University's
  work on the calcium carbonate scale its own hard water lays down, followed
  from the School of Underlying Conditions' monitoring bores through the heat
  exchangers of its plant rooms to the soil reference collection in which the
  ground keeps its own carbonate. It offers seven published outputs from across
  the schools as the record that support would sustain.
topic: "what builds up: the case for backing the School of Underlying Conditions'
