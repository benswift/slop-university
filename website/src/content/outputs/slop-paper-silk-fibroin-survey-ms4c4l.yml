title: The Flag Became the Dash
subtitle: Dissolving Silk Fibroin Survey Markers and the Notation of Doubt in Field Mapping
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
  - Eskil Nwabueze
preset: paper
