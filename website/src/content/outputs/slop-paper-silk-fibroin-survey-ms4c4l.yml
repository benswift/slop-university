doi: 10.5555/slop.ms4c4l
summary: >-
  A paper in human-computer interaction from the School of Underlying
  Conditions reports a sixteen-week research-through-design deployment of
  survey flags with dissolving silk fibroin pennants among nine field mappers
  in an upland catchment. Across 517 flags placed, mappers used silk for 87% of
  provisional geological contacts and plastic for 83% of confirmed ones, wrote
  more hedged inscriptions on the silk, and judged the half-dissolved flag,
  standing but illegible, the design's one failure; the paper reads the silk
  as a ground-level counterpart to the map's dashed line for an inferred
  boundary.
topic: >-
  silk fibroin survey flags that dissolve after a mapping season: a
  research-through-design study of how field mappers mark ground they will not
  return to
