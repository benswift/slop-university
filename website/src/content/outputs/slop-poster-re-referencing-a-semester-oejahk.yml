summary: >-
  A research poster from the School of Emergent Priorities re-references 186
  cyclic voltammograms recorded over one semester against a teaching
  laboratory's shared Ag/AgCl reference in a LiCl–KCl eutectic cell, using the
  lithium deposition onset in each scan. The reference drifted in three steps
  of +18, +14 and +8 mV, each in the week of a logged intervention on the cell,
  and re-referencing narrows the spread of nine lab groups' median peak
  potentials from 52 mV to 11 mV.
