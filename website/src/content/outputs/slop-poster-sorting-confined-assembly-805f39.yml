doi: 10.5555/slop.805f39
summary: >-
  A research poster from the School of Underlying Conditions settles a 1:1
  mixed batch of confined-assembly PS-b-P2VP microparticles, onion-lamellar
  spheres and axially stacked ellipsoids, in a 250 mm pipette column and
  classifies at least 400 particles per withdrawal by SEM. Whole withdrawals
  drift only from 50 to 56 per cent ellipsoids over 72 hours, but within the
  3.5 to 4.0 µm cut the spheres clear first and the cut is 91 per cent
  ellipsoids at 48 hours, equal-volume ellipsoids settling at 0.90 of the
  sphere velocity.
topic: >-
  Sorting confined-assembly polystyrene-block-poly(2-vinylpyridine)
  microparticles by morphology in a sedimentologist's pipette settling column:
  whether onion-lamellar spheres and axially stacked ellipsoids part company
  under Stokes settling, or only by size
