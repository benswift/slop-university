title: The Ninety-Four Minute Working Bee
subtitle: >-
  Work-Sampling Observation and Task Attribution at 46 Community Sports Club
  Working Bees, Against the Signed-Hours Ledger Behind a Council Maintenance
  Rebate
authors:
  - Marit Osayande
  - Sten Okwuosa
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-07-30
publishedAt: 2026-07-30T16:02:33+10:00
doi: 10.5555/slop.56i2pj
summary: >-
  A paper from the School of Continuous Improvement reconciles the volunteer-
  hours ledger behind a metropolitan council's maintenance rebate --- 11,486
  signed hours from 214 working bees at 38 community sports clubs --- against
  two independent records of the same mornings: momentary time sampling by two
  observers at 46 of those bees (38,704 person-instants) and a photographic
  before-and-after inventory of every maintenance task completed on site.
  Attendees were present for 80.0% of the hours they signed for and observed on
  ground and facility work for 31.5% of them, the median attendee signing for
  four hours and two minutes against ninety-four observed minutes on task. A
  third of the 1,203 completed tasks had no signed attendee performing them,
  and club rank on signed hours is not positively associated with rank on
  observed on-task hours (Spearman rho = -0.29).
topic: >-
  working-bee sign-on sheets at community sports clubs, timed against direct
  observation of what actually got done, since a council maintenance rebate is
  set by the hours signed
