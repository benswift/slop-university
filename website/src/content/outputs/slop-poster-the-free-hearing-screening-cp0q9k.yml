title: Referred by the Room
subtitle: >-
  An Interrupted Time Series of Screening Referral Rates at 44 Pharmacy Sites
  Across a Booth Relocation
authors:
  - Ingeborg Nwachukwu
  - Solveig Adeyemi
  - Osei Vandermeer
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-14
publishedAt: 2026-08-14T10:01:44+10:00
doi: 10.5555/slop.cp0q9k
summary: >-
  A research poster from the School of Continuous Improvement sets 26 months of
  free hearing-screening outcomes at 44 pharmacy sites, 61,908 screenings in
  all, against the shopfitting completion dockets that relocated the screening
  booth at 19 of them. Referral rate steps 6.8 percentage points in the month
  of a move (95% CI 5.0 to 8.6) and holds for the remainder of the panel, while
  the 25 sites whose booth stayed put show no break; booth position accounts
  for 41 per cent of between-site variance in referral rate against 4 per cent
  for the screening operator. Protocol, referral threshold and staff rosters
  were unchanged across the break, and a site falls a median of seven places on
  the group's published service scorecard in the quarter after a refit.
topic: >-
  the free hearing-screening booth at the back of a chemist, where a pharmacy
  group ranks its stores on the share of screenings ending in a referral --- an
  interrupted time-series across stores whose booth was relocated during a
  refit, finding the referral rate steps on the day the booth moved and the
  store's health-services ranking steps with it, while the same staff run the
  same protocol throughout
