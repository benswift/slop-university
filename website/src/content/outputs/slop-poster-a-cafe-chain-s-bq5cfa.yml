title: Redundant, Not Rested
subtitle: >-
  A Coverage-Fragility Instrument That Texts Standby Offers Before Anyone
  Calls In Sick
authors:
  - Petra Umbile
  - Joost Nwosu
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-12
publishedAt: "2026-09-12T21:01:28+10:00"
doi: 10.5555/slop.bq5cfa
summary: >-
  A research poster from the School of Emergent Priorities and the School of
  Continuous Improvement builds a Coverage Fragility Index that scores how
  much each café-chain shift depends on a single rostered worker not calling
  in sick, deploying it across 64 stores to automatically dispatch
  standby-overtime offers by text once a shift crosses a pre-registered
  threshold, with no manager override once triggered.
