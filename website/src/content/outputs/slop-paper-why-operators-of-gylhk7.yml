title: Advice to Stop
subtitle: Asymmetric Uptake of Retirement Recommendations in a Groundwater Monitoring Decision-Support Tool
authors:
  - Vigdis Emenike
  - Mirela Hanke
preset: paper
school: School of Underlying Conditions
date: 2026-10-16
