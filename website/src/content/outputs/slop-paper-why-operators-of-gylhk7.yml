summary: >-
  A paper from the School of Underlying Conditions and the School of Continuous
  Improvement follows 522 recommendations a value-of-information advisor made
  across twelve quarterly reviews of a 212-bore groundwater monitoring network,
  and finds nine hydrographers accepted its advice to add measurements at 81%
  and its advice to retire bores at 12%. Randomly presenting retirement as a
  four-quarter pause raised acceptance from 15% to 48%, though 22 of the 31
  paused bores had their pause extended at expiry rather than resumed.
topic: >-
