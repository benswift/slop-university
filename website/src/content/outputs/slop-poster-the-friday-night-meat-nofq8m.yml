title: Bought for the Tray
subtitle: >-
  A Discrete Choice Experiment with 612 Meat-Raffle Ticket Buyers at 24 Licensed
  Clubs
authors:
  - Osei Vandermeer
  - Dagny Okafor
  - Mirela Hanke
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-15
publishedAt: 2026-08-15T16:05:03+10:00
doi: 10.5555/slop.nofq8m
summary: >-
  A research poster from the School of Continuous Improvement estimates what a
  Friday-night meat raffle is bought for, from 7,344 forced choices made by 612
  ticket buyers across 24 licensed clubs over fourteen consecutive draws, fitted
  as a mixed logit with correlated random coefficients. Tray composition and
  ticket price carry the model: marginal willingness to pay for a named local
  beneficiary is $0.11 per $2 ticket (95% CI −$0.04 to $0.26) and $0.04 for the
  contribution sum printed on the ticket, against $1.84 for premium cuts in the
  tray, and 61.4 per cent of buyers hold a beneficiary coefficient
  indistinguishable from zero. The community character the club's gaming-machine
  levy offset is certified against is the one attribute the transaction does not
  price.
topic: >-
  the Friday-night meat raffle at a suburban licensed club --- a tray of chops
  and sausages drawn from a barrel of $2 tickets --- where a state scheme lets
  the club offset part of its gaming-machine tax against a community-contribution
  statement valuing the raffle at the retail price of the meat plus volunteer
  hours at a nominated rate, and a discrete choice experiment with the ticket
  buyers finds the named local beneficiary carries almost no weight against the
  tray's contents and the ticket price, so the community character the offset is
  granted for is the one attribute nobody at the bar is buying
