summary: >-
  A portrait signage poster invites the public to the School of Underlying
  Conditions' spring Open Day, where a soil pit opened beside a grazing flock
  sets the animals' recorded lines of descent alongside the descent of the soil
  from its parent rock, and points visitors to three of the School's published
  outputs on soil description and stock-water contact.
