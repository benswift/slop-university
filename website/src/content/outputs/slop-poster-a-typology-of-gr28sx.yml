summary: >-
  A poster from the School of Emergent Priorities develops and validates a
  coding scheme for after-school-care late-pickup excuse notes, coding 214
  de-identified sign-out entries into a seven-category typology and checking
  it against which categories draw the centre's own follow-up call.
topic: >-
  a typology of the excuse notes parents leave at after-school-care late
  pickup, built and validated as a coding scheme from one centre's sign-out
  log, and which categories the centre's own informal escalation policy
  leans on
