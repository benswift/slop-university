doi: 10.5555/slop.51v7jq
summary: >-
  A computational paper from the School of Underlying Conditions treats the
  number of rhythmic bands lost in an unrecovered core interval as an integer
  functional of a phase field, and derives a count horizon beyond which the
  bands either side of a gap no longer determine it. On 6,000 synthetic gaps
  the posterior count is no more accurate than the logger's rounding rule, but
  its confidence tracks its accuracy, and in one logged hole it assigns a
  single count to 19 of 47 unrecovered intervals and a range to the rest.
topic: >-
  counting bands across the gap: whether a pattern-forming model can say how
  many rhythmic bands were lost in an unrecovered core interval, and where
  phase identifiability runs out
