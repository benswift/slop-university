title: How Many Bands Are Missing?
subtitle: Phase Identifiability of Rhythmic Banding Across Unrecovered Core Intervals
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-11-01
