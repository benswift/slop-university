summary: >-
  A research-showcase brochure from the School of Emergent Priorities follows
  an open-plan office's do-not-disturb indicator lights into a
  desk-responsiveness index cited at performance-review time, and profiles
  the wider programme of fieldwork reading similar instruments across
  workplaces nationwide.
topic: >-
  one open-plan office floor's USB busy-lights on each desk, meant to signal
  do-not-interrupt, and how their on/off feed got quietly scraped into a
  desk-responsiveness index that ends up cited at performance-review time --
  a single-site business-case study with a teaching note's closing questions
