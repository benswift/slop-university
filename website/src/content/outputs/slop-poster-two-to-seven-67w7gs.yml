title: How Many Faults Is Too Many?
subtitle: >-
  Surveying the threshold at which agility handlers ask to be regraded
authors:
  - Anouk Mensah
  - Runa Adegoke
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-04
publishedAt: "2026-09-04T12:04:15+10:00"
doi: 10.5555/slop.67w7gs
summary: >-
  A research poster from the School of Emergent Priorities surveys 386
  handlers across nineteen suburban dog-agility clubs for the number of
  faulted runs it takes before a handler asks to be moved down a grade,
  finding a median of four that falls to three at the top grade, and now the
  trigger for an automatic regrading rule at four of the surveyed clubs.
topic: >-
  Two to seven faulted runs is what it takes before a dog-agility handler
  asks to be moved down a grade, surveyed across suburban agility clubs and
  now the trigger for an automatic regrading rule several clubs enforce with
  no handler appeal.
