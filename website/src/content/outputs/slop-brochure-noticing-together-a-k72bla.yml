summary: >-
  A civic brochure sets out the University's public work around drug-induced
  liver injury in three strands (noticing a rare harm, attributing it
  patiently, and protecting what lies beneath) across the School of Continuous
  Improvement and the School of Underlying Conditions. It invites the
  community into that work through Improvement Grand Rounds and the Master of
  Applied Measurement, and rests it on six published outputs cited by title
  and DOI.
