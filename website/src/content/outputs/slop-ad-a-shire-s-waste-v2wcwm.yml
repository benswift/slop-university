title: A Chalked Sofa Is Collected Only After Rain
subtitle: One cul-de-sac, one chalked booking number, and a campus clear-out now timed to the first shower
authors:
  - Hedvig Anyanwu
  - Iben Chikere
preset: marketing-poster
school: School of Emergent Priorities
