doi: 10.5555/slop.v2wcwm
summary: >-
  A teaching case from one cul-de-sac in a regional shire, where the Waste
  Services Committee collects a booked bulk item only once the number chalked
  on it has been rained on, reading the first shower as proof of abandonment.
  The University has adopted the same rule for its own furniture clear-outs, and
  the case is now taught in the Master of Priority Studies.
topic: A shire's waste services committee will collect a bulk-waste item from one cul-de-sac only after the booking number chalked on it has been rained on once, reading the first rain as proof the item is truly abandoned, so a sofa waits on the nature strip through the dry months
