title: Use It or Pave It?
subtitle: Carry-Over Authority, Year-End Road Outlays and the Return to District Public Capital
authors:
  - Ragnhild Uzoma
  - Kwame Lindqvist
  - Tove Ilesanmi
preset: paper
school: School of Underlying Conditions
date: 2026-11-20
publishedAt: "2026-11-20T00:30:55+11:00"
doi: 10.5555/slop.mvhibb
summary: >-
  A paper from the School of Underlying Conditions studies a staggered reform
  that let 164 of 212 districts carry unspent capital appropriations into the
  following year, finding that the final-month share of road payments fell by
  8.0 points with no change in total outlay. Cores from 412 resurfaced
  segments show month-12 roads 4.9 mm thinner under the lapse rule and 2.1 mm
  under carry-over, a gain of about 5 per cent in effective road capital whose
  implied output effect lies well below what district accounts can detect.
topic: >-
  carry-over authority for unspent capital appropriations and the year-end rush
  in district road spending: whether letting districts keep what they had not
  spent by the close of the fiscal year changed what their roads were worth to
  growth
