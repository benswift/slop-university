title: The Bid That Could Not Win
subtitle: Spoiler Alternatives and Top-Rank Reversal in a TOPSIS Tender-Evaluation Tool
authors:
  - Eivind Onwuka
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-10-16
publishedAt: "2026-10-16T02:00:56+11:00"
doi: 10.5555/slop.r9fqt1
summary: >-
  A paper from the School of Continuous Improvement replays 306 tender
  evaluations logged over six financial years by a regional public works
  agency's TOPSIS-based evaluation tool, withdrawing each non-winning bid in
  turn. In 45 tenders the withdrawal of a single bid that could not itself win
  changed the recommended winner, an effect concentrated in large fields and in
  tenders decided by a closeness margin below 0.02; an anchored variant with
  bounds fixed before bids open cannot reverse, but recommends a different
  winner in 56 tenders.
topic: >-
  spoiler bids in a TOPSIS tender-evaluation tool: how a bid that cannot win
  decides which one does, replayed across six years of a public works agency's
  logged evaluations
