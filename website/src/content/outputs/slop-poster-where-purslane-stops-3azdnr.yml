summary: >-
  A research poster from the School of Underlying Conditions asks 168 growers
  and stallholders at 14 localities along one river road what they call a
  sprig of purslane, and maps where weed names give way to food names. Among
  speakers 60 and over the line falls at locality 10 to 11; among speakers
  under 35 it falls at locality 5 to 6, some 15 km further upstream, with a
  transition zone no wider than their elders'.
topic: >-
  Where purslane stops being a weed: an apparent-time isogloss between weed
  names and anti-ageing food names for Portulaca oleracea across a
  market-garden district
