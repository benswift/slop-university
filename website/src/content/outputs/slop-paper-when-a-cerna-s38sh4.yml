summary: >-
  An essay in the philosophy of biology from the School of Underlying
  Conditions distinguishes three claims a cancer biology paper can make in
  saying that a long noncoding RNA "sponges" a microRNA: that it binds it, that
  varying it makes a difference over some range, and that the sequestration is
  part of a phenotype's mechanism. It reads the quantitative debate over
  competing endogenous RNAs as a dispute about the second claim's range, and
  proposes that network figures read each edge at its weakest supported claim
  and annotate the range of the intervention behind it.
topic: >-
  When a ceRNA network diagram is entitled to call a long noncoding RNA a
  sponge: stoichiometry, proportionality and the mechanistic standing of
  competing-endogenous-RNA claims in cancer
