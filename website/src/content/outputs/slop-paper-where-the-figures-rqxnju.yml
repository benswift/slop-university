doi: 10.5555/slop.rqxnju
summary: >-
  A paper from the School of Emergent Priorities asks eleven adults with
  bilateral central field loss to touch the position of a hallucinated figure
  on a wall screen before and after 2,728 instructed saccades, and expresses
  each report as an anchoring gain between eye and room coordinates. Of 618
  figures reported on both sides of a saccade, 68.4% travelled with the eye
  and 23.6% stayed put in the room; figures described as standing on a real
  surface were room-anchored 47.0% of the time against 7.6% for figures
  resting on nothing (odds ratio 9.8), and two-thirds of anchored figures had
  been carried back into eye coordinates five seconds later.
topic: >-
  where the figures stand: a gaze-contingent study of whether the visual
  hallucinations of a small low-vision cohort move with the eyes or stay put
  in the room across a saccade
