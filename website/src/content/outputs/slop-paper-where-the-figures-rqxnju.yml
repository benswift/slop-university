title: Where the Figures Stand
subtitle: Retinotopic and Room-Anchored Hallucinated Figures Across Instructed Saccades in Eleven Adults with Central Field Loss
authors:
  - Hedvig Anyanwu
  - Ronja Oyelaran
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
