title: The Spare Room as Standing Offer
subtitle: Householders' Accounts of the Bed Kept Made Up for Guests Who Do Not Come, and the Standing Room Each School Now Keeps
authors:
  - Lindiwe Achterberg
  - Anneke Tolan
  - Ingrid Vasseur
preset: paper
school: School of Emergent Priorities
date: 2026-10-02
publishedAt: "2026-10-02T17:01:55+10:00"
doi: 10.5555/slop.ohizh9
summary: >-
  A paper from the School of Emergent Priorities interviews 22 householders in the doorway of the spare room and finds the made-up bed described as a standing offer, renewed with the linen each week whether or not a guest has stayed (median 3 weeks since changing, in households with and without a recent guest). Seventeen households report that nobody has ever asked to use the room, and the Trajectory Analytics Group now has each School keep one Standing Room, made up weekly and released only to a visitor who has not asked for it.
topic: >-
  The Trajectory Analytics Group interviewed 22 householders about the spare room kept made up for a guest who rarely comes, took their accounts of the turned-down bed as a standing offer in participants' own terms, and resolved that each School hold one unbooked room made up weekly, released only to a visitor who has not asked for it
