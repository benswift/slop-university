summary: >-
  A research poster from the School of Emergent Priorities codes 4,151
  credibility findings in 214 civil judgments written by a successor judge who
  did not hear the witnesses, and in 214 matched judgments by the judge who
  did. Successors rest their findings on the documents and inherent
  probability rather than demeanour, yet 84% of the demeanour observations
  they still rely on repeat a phrase from the predecessor's bench notebook,
  most of them unattributed, and these gather in the findings that decide a
  contested issue.
topic: >-
  successor judges and inherited credibility: how first-instance civil
  judgments written by a judge who did not hear the witnesses treat the
  demeanour findings recorded by the judge who did
