summary: >-
  A marketing poster sets one hawkmoth at dusk before a pale trumpet flower,
  a probe wire clipped to the petal and trailing to a handheld meter on a
  garden wall, as the face of the University's research on insect sensory
  physiology. Its hook is the research poster that records a heat-activated
  current in hawkmoth proboscis neurons with a threshold above every flower
  the moths fed from; the campaign runs on the landscape signage panels in
  light and dark versions and closes on two further citations from the
  University's record.
