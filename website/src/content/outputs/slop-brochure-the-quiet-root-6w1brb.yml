summary: >-
  A research-showcase brochure from the School of Emergent Priorities presents
  the University's work on parasitic plants and the resistance of their hosts
  across three Schools: the seed bank read in the soil profile, the root's
  chemical conversation followed in the glasshouse, the scoring of an
  emergence that never happens, and the slow naming of a priority that lives
  underground. It rests its showcase on seven published University studies
  cited by title and DOI.
