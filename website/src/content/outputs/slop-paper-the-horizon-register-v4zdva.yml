title: "Aisle-End Only"
subtitle: >-
  A Failed Replication of the Umbrella-Loan Proximity Finding, Tested on
  Under-Seat Bag Hooks
authors:
  - Marek Solheim
  - Runa Adegoke
  - Hedvig Anyanwu
preset: paper
school: School of Emergent Priorities
date: 2026-09-15
publishedAt: "2026-09-15T19:10:17+10:00"
doi: 10.5555/slop.v4zdva
summary: >-
  A paper from the School of Emergent Priorities pre-registers a direct
  replication of the University's umbrella-loan proximity finding on
  under-seat bag hooks in eleven lecture theatres, finds end-of-lecture
  collection flat across distance-to-exit (logistic coefficient 0.008, 95% CI
  spanning zero), and records the Horizon Register's subsequent restriction of
  new hooks to the door-adjacent third of each theatre, with no ordinary
  override.
topic: >-
  The Horizon Register allocates under-seat bag hooks only to the
  door-adjacent third of each lecture theatre, after a pre-registered
  replication of the University's umbrella-loan proximity finding failed to
  recover the distance-recovery relationship at the hook.
