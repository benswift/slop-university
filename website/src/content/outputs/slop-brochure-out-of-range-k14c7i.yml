summary: >-
  A research-showcase brochure that presents the University's work to
  researchers of underwater vehicles and their communication links, on the
  ground that much of it is likewise carried on out of contact. Three themes
  --- the untethered vehicle, the narrow channel, and surfacing --- are
  anchored in the University's three schools and carried by seven published
  studies cited by title and DOI.
topic: >-
  out of range, on task: research that keeps working below the surface, where
  the signal does not reach and the vehicle decides for itself
