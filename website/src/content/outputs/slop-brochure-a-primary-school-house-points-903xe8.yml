summary: >-
  A civic-research brochure sets Slop University's fieldwork on the public
  tallies embedded in everyday life --- a primary-school points board, a
  playground buddy-bench count, the informal ladder a street keeps without
  ever voting on it --- alongside published studies from across both
  schools, and invites residents into the sessions where that comparison is
  made rather than handing them the findings afterwards.
topic: >-
  a primary-school house-points ladder that keeps steering playground
