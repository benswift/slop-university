summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 presents four
  case studies from five years of printing a europium-complex luminescent mark
  on its Capability Sprint certificates: a reference card that brought readings
  by eye to within one step of a spectrometer, a lamp-on rate at nine audited
  checking desks that rose from 34 to 83 per cent once lamps were mounted on
  the counter, a bench practical completed by 236 Master of Applied Measurement
  students, and the retirement of a first ink lot through the reissue of 1,212
  certificates.
topic: >-
  under the lamp: five years of the School marking its own Capability Sprint
  certificates with a luminescent europium complex, and of the counters, desks
  and teaching benches that learnt, or forgot, to switch the UV lamp on and
  check
