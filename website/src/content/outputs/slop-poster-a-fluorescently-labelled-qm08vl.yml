doi: 10.5555/slop.qm08vl
summary: >-
  A poster from the School of Underlying Conditions images 212 spheroids of the
  School's in-house line under a fluorescently labelled recombinant galectin-3
  construct and locates the depth at which the probe stops. The arrest front
  sits at a median 38 µm whatever the spheroid's diameter, moves to 97 µm when
  the binding sites are competed away with lactose, and across size bins falls
  as measured site density rises, which a retardation factor reproduces to
  within 9 µm where a free-diffusion profile does not.
topic: >-
  A fluorescently labelled in-house galectin-3 construct arrests at a sharp
  front a few cell layers into the School's own tumour-spheroid line, and the
  front's depth tracks the spheroid's glycan-site density like a sorbing
  solute's retardation rather than free diffusion
