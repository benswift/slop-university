title: "The Front Stops Short of the Core"
subtitle: >-
  Depth-Resolved Arrest of a Labelled Galectin-3 Construct in a
  Tumour-Spheroid Line, Read as Sorbing-Solute Transport
authors:
  - Vigdis Emenike
  - Brynjar Obiora
  - Tove Ilesanmi
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-12
