summary: >-
  A research-showcase brochure surveying the University's current agenda
  across the Schools of Emergent Priorities and Continuous Improvement,
  anchored by a School of Emergent Priorities household study that tracked
  twelve weeks of colour-coded fridge-shelf labelling against what was
  actually eaten from each shelf and found no drift at all, a result the
  School is folding into its standing survey protocol regardless.
topic: >-
  Twelve weeks, colour-coded communal and personal shelves in a share-house
  fridge, and no measurable drift between what was labelled and what was
  actually eaten from either
