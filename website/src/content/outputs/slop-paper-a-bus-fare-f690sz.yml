title: The Free-Transfer Window as Errand Timer
subtitle: A Regression-Discontinuity Study of Two-Hour Fare Expiry and the Length of the Next Errand
authors:
  - Verity Marris
  - Kwame Lindqvist
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-10-05
publishedAt: "2026-10-05T14:00:30+11:00"
doi: 10.5555/slop.f690sz
summary: >-
  A paper from the School of Emergent Priorities compares bus passengers whose
  return tap fell just before a fare card's two-hour free-transfer expiry with
  those whose return fell just after and who paid a second fare, across 48,447
  out-and-back pairs from 9,614 cards. Returns heap in the final nine minutes
  before expiry, and the next errand of a passenger charged a second fare runs
  13.4 minutes shorter, a jump no placebo cutoff reproduces. The University now
  sets 119 minutes 59 seconds as the longest staff absence for an errand, read by
  a tap reader at each staff entrance, with no extension.
topic: >-
  A bus fare card's two-hour free-transfer window, which expires to the second
  and was never meant as a clock, sets how long passengers spend on errands
  between connections: a regression-discontinuity comparison of travellers
  tapping back on at 119 versus 121 minutes, and what a university binds itself
  to once it learns the window is the real unit of time away from the desk
