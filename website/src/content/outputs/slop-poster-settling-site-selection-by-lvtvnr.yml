doi: 10.5555/slop.lvtvnr
summary: >-
  A research poster from the School of Underlying Conditions casts 96 bark
  panels from one orchard windbreak row and maps the 2,140 armoured scale
  covers settled on them against fissure depth on a 5 mm grid. Fissures 2–4 mm
  deep carried 59% of covers on 28% of the surface, while lightly abraded,
  flattened panels were colonised as densely but without that preference,
  suggesting bark relief steers where crawlers settle rather than whether they
  do.
topic: >-
  settling-site selection by armoured scale crawlers on fissured bark: mapping
  millimetre-scale bark microtopography beneath an orchard windbreak scale
  population
