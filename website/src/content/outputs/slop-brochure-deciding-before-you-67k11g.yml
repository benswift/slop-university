summary: >-
  A prospectus addressed to prospective students who have not yet chosen a
  course, presenting decision-making under uncertainty as a capability taught
  across all three Schools: where to site the next borehole in the School of
  Underlying Conditions, what to do first in the Master of Priority Studies,
  and when the evidence is sufficient in the Master of Applied Measurement and
  Capability Sprints. It profiles three researchers and rests its case on five
  published studies cited by title and DOI.
topic: >-
  deciding before you know: a prospectus for the undecided, on how the
  University teaches choice under uncertainty, from where to sink the next
  borehole to which course to enrol in
