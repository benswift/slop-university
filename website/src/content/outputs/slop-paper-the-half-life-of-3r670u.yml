doi: 10.5555/slop.3r670u
summary: >-
  A paper from the School of Emergent Priorities reconstructs twenty-one years
  of one officer academy's staff-course reading lists and follows 2,317
  listings by survival analysis, finding that half of all required readings
  leave within 3.4 years while the unexamined further-reading tier has not lost
  half its entries in twenty. Curriculum reviews built around assessment clear
  the examinable tiers and demote many readings into further reading, whose
  median entry was twenty-one years old by 2024.
topic: >-
  the half-life of a set text: how long readings survive on an officer academy's course reading lists, and why the unexamined further-reading list ages slowest
