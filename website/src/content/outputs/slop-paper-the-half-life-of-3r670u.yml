title: The Half-Life of a Set Text
subtitle: Tenure and Obsolescence in Twenty-One Years of an Officer Academy's Reading Lists
authors:
  - Petra Umbile
  - Sunniva Balogun
preset: paper
school: School of Emergent Priorities
date: 2026-10-26
