summary: >-
  A paper from the School of Emergent Priorities follows the printed register
  issued to a district network of volunteer rainfall observers through four
  editions, reading each edition's instruction for a day with nothing to enter
  against what observers then wrote. It argues that the missing observation is
  a product of paper technology and not a condition that precedes it.
topic: >-
  blank cells in a volunteer rainfall register and the invention of the missing
  observation
