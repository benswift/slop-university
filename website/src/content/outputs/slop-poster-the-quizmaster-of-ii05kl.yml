summary: >-
  A research poster from the School of Continuous Improvement interviews 21
  quizmasters across seven suburban pub-quiz leagues about how they decide
  whether a near-miss answer counts, and codes their grounds in their own words
  into nine bands from transposed letters to right idea, wrong noun. The
  University adopts the bands as a numbered Near-Miss Tariff for every marker of
  its assessments.
topic: >-
  The quizmaster of a pub-quiz league rules on whether a near-miss answer
  counts, by a leniency she has never written down; 21 quizmasters interviewed
  and reported in their own terms, and on the strength of it the University
  issues a numbered Near-Miss Tariff to every marker of its assessments
