summary: >-
  A paper from the School of Underlying Conditions and the School of
  Continuous Improvement gives a second-year accounting cohort a ladder of
  twelve graded outlays on one farm shed roof, before and after the unit
  teaches non-current assets, under a repair wording and a renewal wording.
  Instruction narrows the zone over which students disagree but leaves the
  two wordings about two steps apart, and students' spoken reasons most often
  name the object rather than the taught criterion.
topic: >-
  how second-year accounting students learn where a repair ends and an asset
  begins: a graded-vignette classroom study of the capitalise-or-expense
  judgement
