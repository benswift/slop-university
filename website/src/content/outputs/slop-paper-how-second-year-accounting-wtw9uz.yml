title: When the Roof Becomes a New Roof
subtitle: Wording, Instruction and Where Second-Year Accounting Students Place the Capitalisation Boundary
authors:
  - Brynjar Obiora
  - Solveig Adeyemi
preset: paper
school: School of Underlying Conditions
