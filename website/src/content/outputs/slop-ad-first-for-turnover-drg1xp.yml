summary: >-
  A marketing poster for the School of Underlying Conditions presents the
  School in the terms of an electrocatalyst, an agent that eases a reaction
  and emerges from it unaltered, and reports the School's standing for
  turnover on the University's Indicator Commons composite. It was developed
  for bus-stop panels and campus digital signage in matched light and dark
  versions.
