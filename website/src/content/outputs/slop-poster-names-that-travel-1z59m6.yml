summary: >-
  A research poster from the School of Settled Matters genotypes 473 bean
  accessions held by one community seed library and traces 412 of them through
  two decades of its lending ledger to 61 founding deposits. Six or more
  exchanges out, 83% of accessions still carry their founding deposit's
  genotype but only 38% its name, and most renamings first appear on the
  library's own return label rather than on the grower's packet.
topic: >-
  names that travel without their seed: in one community seed library's bean
  collection, comparing how variety names and genotypes pass from grower to
  grower across two decades of exchange-ledger records
