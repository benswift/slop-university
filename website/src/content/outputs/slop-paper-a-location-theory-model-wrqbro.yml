title: Gateway to What?
subtitle: Positional Competition among Regions when Destinations Are Costly
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
publishedAt: "2026-10-12T21:31:31+11:00"
doi: 10.5555/slop.wrqbro
summary: >-
  A paper from the School of Underlying Conditions sets out a game among
  identical regions along a corridor, each choosing to be a destination at a
  fixed cost or the gateway to a neighbour for a toll on what passes. It
  characterises the equilibria completely: where destinations are dear the
  corridor divides into four kinds of block, three of which contain no
  destination, the regions at either end are never destinations, and aggregate
  payoff is highest when no region is one. On a closed circuit the arrangement
  in which every region is the gateway to the next is efficient and is never
  an equilibrium.
topic: >-
  A location-theory model of regional competition in which each region may
  position itself as the gateway to its neighbour instead of as a destination,
  and the equilibria in which no region is anywhere to arrive
