title: Footfall in the Fill
subtitle: Excavating the Isolation Joint of a Decommissioned Seismograph Vault
authors:
  - Vigdis Emenike
  - Casimir Beng
preset: paper
school: School of Underlying Conditions
date: 2026-11-15
publishedAt: "2026-11-15T21:01:37+11:00"
doi: 10.5555/slop.jpgrzj
summary: >-
  A paper from the School of Underlying Conditions excavates the isolation
  joint around the instrument pier of a short-period seismograph station closed
  in 2011, recording 58 contexts in four phases, two of which are compacted
  deposits bridging the joint, each made of the waste of a maintenance task.
  Read against the station's continuous record of 287 logged service visits,
  the footfall the pier registered rises in two steps, from a median of 6.2 dB
  above ambient to 16.8 dB in 1996 and 23.9 dB in 2003, dating each bridge to
  the interval between two visits.
topic: >-
  an excavation of the debris-filled isolation joint around a decommissioned
  seismometer pier, read against the station's archived noise record
