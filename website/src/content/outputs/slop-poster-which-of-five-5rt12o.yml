summary: >-
  A poster from the School of Continuous Improvement scores 38 footpath crews
  against a five-level scale for what they do with a lost glove, from Passed to
  Paired. Most crews hold at Level 3, where the glove is posted at hand height
  and left, and the University binds its grounds team to a 21-day hold on any
  glove found on University grounds.
topic: >-
  Which of five named levels is the lost glove on the footpath fence post at,
  and how long must the University leave it there once the answer is Level 3?
