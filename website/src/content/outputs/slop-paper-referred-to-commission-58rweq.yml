title: Referred to Commission
subtitle: The Disposal of Student Motions in Twelve Years of a Faculty Council's Minutes
authors:
  - Ylva Onyekwere
  - Anneke Tolan
preset: paper
school: School of Emergent Priorities
date: 2026-10-12
publishedAt: "2026-10-12T21:41:42+11:00"
doi: 10.5555/slop.58rweq
summary: >-
  A paper from the School of Emergent Priorities codes the disposal of 3,912
  motions in the minutes of 286 sessions of one faculty council, at a public
  university in an unnamed Latin American country, by the estate of the
  councillor who moved them. It finds that the council almost never votes a
  student motion down and refers most of them to a standing commission, and
  that a commission's opinion returns on a schedule that fits the academic
  estate's four-year term and overruns the student estate's one-year term.
topic: >-
  Referred to commission: what twelve years of faculty council minutes at one
  Latin American public university show becomes of the motions student
  councillors table under co-governance
