title: "Seiche, Not Tide"
subtitle: Helmholtz-Mode Exchange and the Flushing of a Small Microtidal Breakwater Harbour
authors:
  - Ylva Onyekwere
  - Fenna Okoro
preset: paper
school: School of Emergent Priorities
date: 2026-11-03
publishedAt: "2026-11-03T21:00:35+11:00"
doi: 10.5555/slop.jkrh9b
summary: >-
  A paper from the School of Emergent Priorities reports 112 winter days of
  bottom-pressure records from a small breakwater harbour on a microtidal
  coast, finding that a 15.1-minute Helmholtz mode through the cut to its inner
  basin returns 92 per cent of the water it carries out yet, on the 48 days it
  was active, cut the basin's flushing time from 9.9 days on the tide alone to
  2.8 days, supplying an estimated 58 per cent of the winter's net exchange.
topic: >-
  seiche rather than tide flushes the inner basin of a small breakwater harbour
  on a microtidal coast: a winter of bottom-pressure records, harmonic analysis
  and drifter releases
