title: Where the Ward Stops
subtitle: The Seams of a Regional Training College's Simulated Workplaces
authors:
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-11-05
publishedAt: "2026-11-05T14:32:13+11:00"
doi: 10.5555/slop.cnknhw
summary: >-
  A paper from the School of Underlying Conditions offers a work of building
  criticism on the five full-scale simulated workplaces housed in the workshop
  hall of a regional training college: a ward bay, a kitchen line, a house
  frame, a switchroom and a hotel room. From a measured survey and ten mornings
  of watching them in use, it finds that each replica stops where the
  occupation it rehearses hands the work to another, reads the seams as built
  job descriptions, and argues against the proposal to finish the rooms.
topic: >-
  the seam where the mock workplace stops: an architectural reading of the
  full-scale simulated work environments built inside a regional training
  college
