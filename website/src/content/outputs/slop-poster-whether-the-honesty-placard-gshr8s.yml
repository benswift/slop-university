title: The Bucket Becomes the Form
subtitle: >-
  Testing Whether a Pub-Trivia Honesty Nudge That Raised Self-Correction
  Survives Print on a Shire's Self-Certified Fire-Hazard Clearance Return
authors:
  - Mirela Hanke
  - Solveig Adeyemi
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-12
publishedAt: "2026-09-12T03:03:30+10:00"
doi: 10.5555/slop.gshr8s
summary: >-
  A research poster from the School of Continuous Improvement replicates an
  earlier Slop University finding --- that an honesty placard raised
  voluntary self-correction of pub-trivia scores without moving self-report
  accuracy --- by printing the same nudge line on a shire's self-certified
  fire-hazard clearance return. Across 244 returns, self-report concordance
  with an inspector spot-check subsample (n = 96) holds flat with or without
  the line (91.2% vs 90.4%, ns), matching the original design. Voluntary
  self-correction, the measure the placard moved from 3.4% to 14.2% at
  trivia venues, shows no comparable lift on the compliance return (4.6% vs
  4.1%, p = 0.71).
topic: >-
  whether the honesty-placard nudge that changed pub-trivia score
  self-correction survives being printed on a shire's self-certified
  fire-hazard clearance return
