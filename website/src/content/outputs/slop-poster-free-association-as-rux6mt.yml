summary: >-
  A research poster from the School of Underlying Conditions sets the analytic
  hour as a sender-receiver game in which the analysand's censor reports a
  thought to an analyst whose interpretation it would prefer to fall wide by a
  fixed distance. Four propositions follow from the standard uniform-quadratic
  case: interpretation is coarse in every equilibrium, a sufficiently resistant
  censor fills the hour and conveys nothing, and the rule of saying everything
  is a commitment the game gives nobody the means to enforce.
topic: >-
  Free association as cheap talk: a sender-receiver model of the analytic hour
  in which resistance is the sender's bias, the fundamental rule is a
  commitment the analysand cannot make, and interpretation is coarse by theorem
