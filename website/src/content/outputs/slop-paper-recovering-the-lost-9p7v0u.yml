summary: >-
  A paper from the School of Emergent Priorities counts bioclasts on the
  exposed faces of the 439 original limestone slabs paving one of the
  University's older forecourts, resolves 420 of them into seven bed groups,
  and orders the groups by correspondence-analysis seriation constrained by
  nine bed contacts in the forecourt's step and kerb risers. The order
  describes a shallowing-upward succession, and the floor's laying path
  recovers it independently and inverted (Spearman ρ = −0.96): the quarry was
  worked from the top down, and the bed nearest the door is the top of the
  section.
topic: >-
  recovering the lost quarry bed order of a fossiliferous limestone forecourt
  paving from the fossils in its laid slabs, by constrained seriation and
  graphic correlation
