title: A Section Laid Flat
subtitle: Recovering the Quarry Bed Order of a Fossiliferous Limestone Forecourt from the Fossils in Its Slabs
authors:
  - Anouk Mensah
  - Hedvig Anyanwu
preset: paper
school: School of Emergent Priorities
