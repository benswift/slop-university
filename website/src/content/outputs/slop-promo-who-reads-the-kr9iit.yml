summary: A short profile of Dr Marit Osayande, Convenor of the Living Dashboard, told
  largely in her own words. Recalling a transit authority's status board that ran
  for years with no one assigned to read it, Dr Osayande describes how she now follows
  an organisation's boards, from staff-photo boards in childcare foyers to roadside
  fuel-price boards and aged-care front-desk whiteboards, from the day they go up
  to the day nobody looks. The film also celebrates a body of work cited right across
  the University.
topic: "a promo profile of Dr Marit Osayande, Convenor of the Living Dashboard, in
  her own voice: a former transit-authority facilities worker who follows an organisation's
  boards and screens from the day they go up to the day nobody looks, and whose work
  is cited right across the University"
