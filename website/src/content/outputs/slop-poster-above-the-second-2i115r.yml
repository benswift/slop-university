summary: >-
  A research poster from the School of Underlying Conditions reads 1,146 ascent
  entries in the 21 hut logbooks of one unnamed mountain physiology station,
  coding the place at which each writer first describes the party as "at
  altitude". The phrase, at first scattered along some 800 metres of climb,
  settles from the tenth book onward at a stock gate 190 metres below the
  contour the station's rule names, the gate being where a store shed was built
  and equipment came to be issued; the poster treats the gate as a boundary
  object and draws no conclusion about ascent or health.
topic: >-
  Above the second gate: how a mountain research station's logbooks came to
  place the start of 'high altitude' at a track gate rather than a contour
