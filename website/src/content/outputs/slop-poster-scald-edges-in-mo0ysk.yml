title: The Scald Keeps Its Ground
subtitle: Eight Seasons Re-surveying 36 Scald Edges, Before and After the Stock Came Off
authors:
  - Brynjar Obiora
  - Ylva Ogunbanjo
preset: research-poster
school: School of Underlying Conditions
