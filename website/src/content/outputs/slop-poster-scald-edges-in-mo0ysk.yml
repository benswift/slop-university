doi: 10.5555/slop.mo0ysk
summary: >-
  A research poster from the School of Underlying Conditions re-surveys 36
  pegged transects across the edges of bare, sealed scalds in one grazed
  semi-arid paddock for eight seasons, fencing half of them from stock after
  the fourth. Edges advanced a mean 4.8 metres into the grass through two dry
  seasons; once fenced they retreated only 0.7 metres while grazed edges
  advanced a further 1.8, and the four that walked back were all where the
  scald's surface seal had cracked.
topic: >-
  scald edges in a grazed semi-arid paddock as the boundary between two stable
  states: re-surveying the line between grassed and bare ground over eight
  seasons, and whether it walks back once the stock come off
