summary: >-
  A research poster from the School of Emergent Priorities reports a 16-week
  trial of CURB, an app-issued release-window buffer for fourteen school car
  parks and their adjoining bus stops, finding no change in kerbside dwell
  time or bus-stop queue length. Per the trial's pre-registered stopping
  rule, the release-window licence is not renewed.
topic: >-
  a coordinated staggered release-window buffer trialled across school car
  parks and bus stops, found to change nothing
