title: Checked Back Open
subtitle: >-
  Repeated Citator Verification, Memory Distrust and Doubt About the Record in
  an Analogue Obsessive-Compulsive Sample
authors:
  - Odalys Penhallow
  - Clemency Tredinnick
preset: paper
school: School of Settled Matters
date: 2026-11-10
publishedAt: "2026-11-10T15:30:21+11:00"
doi: 10.5555/slop.z3900v
summary: >-
  A paper from the School of Settled Matters reports an experiment in which 128
  students high or low in obsessive-compulsive traits learned the citator
  treatments of 24 invented appellate decisions and then looked up six of them
  fifteen times. Recall stayed above 93% throughout, but memory confidence fell,
  most steeply in the high-trait group, and participants came to judge the
  checked cases more likely to have changed, a currency doubt that, rather than
  memory confidence, predicted how often they looked them up again.
topic: >-
  repeated checking of a settled question: a citator-verification task in high
  and low obsessive-compulsive trait groups
