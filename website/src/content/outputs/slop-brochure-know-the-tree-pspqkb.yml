summary: >-
  A research-showcase brochure gathers the University's guava leaf work around
  a single question of provenance, following an extract back from the
  extraction bench through the teaching laboratory, the drying shed and a
  neighbourhood street to the soil profile beneath the tree. It features seven
  published studies by title and DOI across the School of Underlying
  Conditions, the School of Emergent Priorities and the School of Continuous
  Improvement.
