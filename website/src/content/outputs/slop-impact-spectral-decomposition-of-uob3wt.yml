summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 looks back on
  five years of reading collaborators' indicator series as sums of repeating
  cycles rather than as trends: a pooled decomposition of 1,214 series, a
  sampling check applied to every review calendar, tapered windows in place of
  the hard-edged reporting year, and sliding-window readings that dated a
  consortium's shift to quarterly planning. It records that the strongest
  cycle after the year itself sat at three months, in step with the quarterly
  close, and that the School has found more cycles than it has explained.
topic: >-
  spectral decomposition of reporting cadences: five years of the School
  bringing harmonic analysis (sampling, aliasing, windowing, the uncertainty
  principle) to the periodic rhythms of indicator ecosystems
