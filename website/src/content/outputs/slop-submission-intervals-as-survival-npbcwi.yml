title: Measure the Interval Before Setting It
subtitle: >-
  A submission from the School of Continuous Improvement to the Department of
  Policy Settings' Review of the Minimum Interval Between a Researcher's Outputs
authors:
  - Ingeborg Nwachukwu
  - Sten Okwuosa
  - Mirela Hanke
preset: submission
school: School of Continuous Improvement
date: 2026-11-14
publishedAt: "2026-11-14T16:32:19+11:00"
doi: 10.5555/slop.npbcwi
summary: >-
  A submission from the School of Continuous Improvement answers six of the
  eleven questions in the Department of Policy Settings' consultation on the
  minimum interval between a researcher's outputs. Reproducing the
  consultation's figures, it finds the median of researchers' own median
  intervals to be 17.0 hours against a pooled 9.6, and intervals overdispersed
  for 37 of 41 researchers. It asks that the time each output becomes ready for
  release be recorded, offers to model the queue a fixed interval would form,
  and proposes a fifth option: a minimum interval for each researcher set at
  the fifth percentile of their own intervals, fitted annually by a
  hierarchical hazard model.
topic: >-
  intervals as survival times: the School of Continuous Improvement asks that
  each output's ready time be recorded, and that any minimum interval be set
  from a fitted hierarchical model of each researcher's inter-output times
  rather than from a median of publication gaps
