title: "'Whoever Asks First'"
subtitle: A Five-Level Maturity Model for Outgrown Children's Clothing Passed Between Households
authors:
  - Hedvig Anyanwu
  - Ronja Oyelaran
  - Lindiwe Achterberg
preset: paper
school: School of Emergent Priorities
