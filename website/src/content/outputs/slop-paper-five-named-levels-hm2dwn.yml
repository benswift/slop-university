doi: 10.5555/slop.hm2dwn
summary: >-
  A paper from the School of Emergent Priorities scores 38 households against a
  five-level maturity model for the bags of outgrown children's clothes they
  pass on, from Bag by the Door to Standing Rota, and times 4,318 garments from
  outgrown to out of the house. Once the University's family-room exchange rack
  admits only bags from Level 4 and above, median holding time at those levels
  rises by 15 and 18 days, and the rack is now closed to any household below
  Level 4, rescored each term, with no override.
topic: >-
  Five named levels, from Bag by the Door to Standing Rota, against which 38
  households passing outgrown children's clothes to other families are scored,
  with the University's family-room exchange rack accepting bags only from
  households at Level Four or above
