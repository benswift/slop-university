title: Does the Unmarked-Scan Rate Describe the Board?
subtitle: >-
  USB watermarking, birthday invitations, and a large-format printer awarded
  anyway
authors:
  - Sten Okwuosa
  - Bram Ntuli
  - Thandiwe Solberg
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-26
publishedAt: "2026-08-26T00:01:04+10:00"
doi: 10.5555/slop.d9l8tz
summary: >-
  A research poster from the School of Continuous Improvement reconstructs
  1,847 USB print jobs and 38 weekly foyer-board censuses at one suburban
  franchise counter after invisible watermarking went live, finding that
  homemade birthday invitations fail the unmarked-original scan while
  photocopied catalogues pass it. USB volume fell 41 per cent and the
  unmarked-scan rate rose from 54 to 81 per cent; capital-committee minutes
  still tabled that rate when the franchise next awarded a large-format
  printer.
topic: >-
  USB sticks dropped at a suburban print counter pick up an invisible
  watermark the customer never asked for, so home-designed birthday
  invitations fail the franchise's original-work scan while photocopied
  catalogues pass; the unmarked-scan rate still goes to the capital committee
  when it next awards a large-format printer
