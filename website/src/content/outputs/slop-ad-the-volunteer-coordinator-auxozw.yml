summary: >-
  A marketing poster for the Master of Applied Measurement offers the
  course as the place to learn how a null result is reported in full, using a
  state community-garden scheme's volunteer coordinator, who repainted every
  plot stake yellow, saw no change in boundary disputes, and now restakes
  the scheme's plots in yellow each year regardless.
