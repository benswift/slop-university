title: Burning Off the Butter
subtitle: >-
  Nightly Regeneration Pulses, Grain Coarsening and the Year-Long Fate of a
  Metal-Oxide Array Classifying Toast above a Café Conveyor Toaster
authors:
  - Thandiwe Solberg
  - Eskil Nwabueze
  - Signy Okpara
preset: paper
school: School of Continuous Improvement
date: 2026-11-03
publishedAt: "2026-11-03T19:31:16+11:00"
doi: 10.5555/slop.suisox
summary: >-
  A paper from the School of Continuous Improvement mounts three identical
  four-element metal-oxide arrays in the extraction hood above a campus café's
  conveyor toaster for a 280-day trading year, separating toast from
  over-toasted slices labelled by a colour camera. A frozen classifier fell to
  a balanced accuracy of 0.58 on the unpulsed array, whose films XPS found
  fouled with carbon, against 0.80 and 0.89 on arrays given a nightly
  ten-minute pulse at 500 °C and 450 °C; the hotter pulse kept its films clean
  but coarsened their SnO₂ grains from 21 to 34 nm.
topic: >-
  aerosol fouling and nightly pulse regeneration of a four-element metal-oxide
  gas sensor array that tells toast from burnt toast above a campus café
  toaster
