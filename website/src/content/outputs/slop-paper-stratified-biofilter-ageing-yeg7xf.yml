title: Stratified Drying and Gas Channelling in an Aged Wood-Chip Biofilter
subtitle: >-
  Depth-Resolved Coring and a Two-Zone Model of Lost Ammonia Removal
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-18
publishedAt: "2026-10-18T21:01:25+11:00"
doi: 10.5555/slop.yeg7xf
summary: >-
  A paper from the School of Underlying Conditions cores a six-and-a-half-year-old
  wood-chip biofilter at a piggery exhaust on a 24-point grid and finds its lost
  ammonia removal located not in the aged-looking surface but in a dry, coarse
  lower stratum on the supply side of the plenum, where core recovery fell to
  as little as 41%. A gas-tracer pulse fitted by a two-zone model gives a mobile
  fraction of 0.44; the model predicts top-media replacement would recover little,
  and a six-week rewetting trial raised measured removal from 48% to 70%.
topic: >-
  stratified biofilter ageing: depth-resolved coring of a wood-chip bed treating
  piggery exhaust air, and a two-zone model of channelling and lost ammonia and
  odour removal
