title: Calling the Centre Does Not Move a Frozen Waitlist Number, but Parents Believe It Does
subtitle: >-
  An interview study of 64 families on a shared regional childcare
  waitlist, and the index the University built from their calls anyway
authors:
  - Petra Umbile
  - Mirela Hanke
preset: paper
school: School of Emergent Priorities
date: 2026-09-15
publishedAt: "2026-09-15T01:41:31+10:00"
doi: 10.5555/slop.0rwrsr
summary: >-
  A paper from the School of Emergent Priorities interviews 64 parents
  across nine centres of a shared regional childcare-waitlist network,
  linking their reported contact rituals to the portal's own
  position-change log and finding contact frequency explains almost none
  of the movement recorded; the University's Indicator Commons has
  certified the ritual as an official tiebreaker for its own campus
  centre's waitlist regardless.
topic: >-
  An interview study of parents whose child has sat at position fourteen
  on a childcare centre's online waitlist app for months, describing the
  phone calls, drop-in visits and other folk rituals they believe move an
  otherwise frozen queue number
