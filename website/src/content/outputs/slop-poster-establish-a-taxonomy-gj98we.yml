title: Four kinds of ball fill a club ball bag, and only one plays
subtitle: A taxonomy of 541 balls, adopted as the basis for weekend pitch allocation
authors:
  - Halvard Nnamani
  - Hedvig Anyanwu
  - Tove Ilesanmi
preset: research-poster
school: School of Emergent Priorities
