summary: >-
  A research poster from the School of Emergent Priorities empties the training
  ball bags of 38 junior soccer teams onto the touchline at three counts and
  sorts 541 balls at baseline into four kinds, of which only Playable plays.
  The league committee now gives each team its Saturday pitch slot by its bag's
  Playable share, which rises from 34 to 81 per cent while a boot census finds
  247 flat balls in the coaches' cars.
topic: >-
  Establish a taxonomy of the balls in a junior soccer club's training ball bag,
  and give each team its weekend pitch slot by its share of the one kind that is
  playable.
