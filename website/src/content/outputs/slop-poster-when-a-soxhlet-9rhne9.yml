doi: 10.5555/slop.9rhne9
summary: >-
  A research poster from the School of Underlying Conditions stops 48 Soxhlet
  thimbles from one batch of oat biscuits at eight points across 120 siphon
  cycles and defines an end point from the repeatability of the weighing
  alone. The fine grind reaches 17.8 g/100 g and meets the end point at 60
  cycles; the coarse grind is still gaining at 120 cycles and has none.
topic: >-
  When a Soxhlet extraction is finished: cumulative crude-fat yield by siphon
  cycle in one batch of oat biscuits, and the cycle at which further yield
  falls below balance repeatability
