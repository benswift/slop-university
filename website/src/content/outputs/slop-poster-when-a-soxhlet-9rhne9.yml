title: The Last Milligram
subtitle: Locating the end point of a Soxhlet crude-fat extraction in one batch of oat biscuits
authors:
  - Brynjar Obiora
  - Vigdis Emenike
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-13
