summary: >-
  A paper from the School of Continuous Improvement cluster-randomises
  fourteen open-plan offices of a facilities-management firm to test whether
  moving a quarterly self-assessment form's attestation line from the bottom
  of the page to the top changes how staff rate their own performance,
  finding no effect across three instrumented forms and a red-ink ablation,
  and reporting the partner firm's decision to mandate top-of-form
  attestation network-wide regardless of the result.
topic: >-
  Does moving the attestation line on a company's quarterly self-assessment
  form from the bottom of the page to the top change how generously staff
  rate their own performance? OATH -- Ordinal Attestation Trial for Honesty
  -- instruments self-assessment forms, expense-declaration sign-offs, and
  stand-up progress logs across a dozen open-plan offices to test the
  sign-first effect directly; finding nothing, HR adopts top-line
  attestation as standing practice across every site regardless.
