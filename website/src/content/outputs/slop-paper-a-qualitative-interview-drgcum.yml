title: Auditing the Queue
subtitle: How a 5S Programme Re-Made Coffee-Cart Labour
authors:
  - Joost Nwosu
  - Casimir Beng
  - Ingeborg Nwachukwu
preset: paper
school: School of Continuous Improvement
date: 2026-09-17
publishedAt: "2026-09-17T00:41:29+10:00"
doi: 10.5555/slop.drgcum
summary: >-
  A paper from the School of Continuous Improvement reports a term-long
  interview study of sixteen queue marshals across four campus coffee carts,
  finding that the Adaptive Metrics Lab's 5S Peak-Hour Checklist reduced
  marshals' self-rated judgement over the line at every site studied, and that
  a coaching intervention introduced to standardise checklist-completion time
  left the underlying variance unchanged.
topic: >-
  A qualitative interview study in which the campus coffee cart's queue
  marshal describes, in their own words, how a continuous-improvement 5S
  audit turned informally keeping the line orderly and the milk station tidy
  into a logged checklist ritual
