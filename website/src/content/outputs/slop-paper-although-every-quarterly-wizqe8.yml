title: "Final Is Version Four"
subtitle: "A single-site teaching case of filename finality in a freight-forwarding office's quarterly reports"
authors:
  - Torun Ezeigwe
  - Thandiwe Solberg
  - Ingeborg Nwachukwu
preset: paper
school: School of Continuous Improvement
date: 2026-10-04
publishedAt: "2026-10-04T09:00:55+11:00"
doi: 10.5555/slop.wizqe8
summary: >-
  A paper from the School of Continuous Improvement follows twelve quarterly
  reports through one open-plan freight-forwarding office's shared drive,
  finding that a median of four further versions followed the first filename
  to carry the word FINAL. A rule withholding the word until a report's fourth
  issue was met in six of six quarters and left the number of issues and the
  days to dispatch unchanged; the University has since adopted the same
  threshold for every document it issues.
topic: >-
  Although every quarterly report in one open-plan freight-forwarding office's
  shared drive was saved with FINAL in its filename, a median of four further
  versions followed each one, and the University now withholds the word final
  from any filename until its fourth issue
