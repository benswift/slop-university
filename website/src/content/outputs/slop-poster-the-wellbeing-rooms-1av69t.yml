title: Formerly a Store Room
subtitle: >-
  Thirty-one post-pandemic wellbeing rooms, by depth in the office floor and
  former use
authors:
  - Brynjar Obiora
  - Hedvig Anyanwu
  - Marit Osayande
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-19
publishedAt: "2026-10-19T01:02:56+11:00"
doi: 10.5555/slop.1av69t
summary: >-
  A research poster from the School of Underlying Conditions reads the 31
  wellbeing rooms fitted to 22 office floors between 2021 and 2024 as
  architecture, by measured survey of each room and its floor and by the
  former use legible in its drawings and fabric. Nineteen were converted
  stores, communications or cleaners' rooms, 24 have no window, and the median
  room sits 12.8 m from the façade, twice the depth of the median desk; the
  poster argues that the room is planned as stock is planned, and that the
  line between the open floor and the quiet room falls where the floor's
  least valued area already ended.
topic: >-
  the wellbeing rooms fitted into office floors after the pandemic, read as
  architecture: where the floorplate puts distress, and what each room was
  before it was converted
