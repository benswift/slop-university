doi: 10.5555/slop.52hmwc
summary: >-
  A research poster from the School of Continuous Improvement sorts 9,412
  attendees at 38 suburban street fairs by whether they pressed Interested on
  the event page and whether they arrived with a folding chair, finding the
  button barely moves the chance of a chair (32.3% against 27.3%) and that 62.1%
  of chairs came from people who never pressed it. The University's graduation
  lawn is now hired at 0.68 chairs per Interested click, read once on the Monday
  before the ceremony and not amended on the day.
topic: >-
  The 'Interested' button on a suburban street-fair event page, sorted into a
  four-cell framework of who clicked it against who turned up with a folding
  chair, and the chair-hire order the University placed from the cell weights
  for its own graduation lawn
