title: Pressed Interested, Arrived Standing
subtitle: A Four-Cell Classification of Street-Fair Attendees by Event-Page Interest and Chair Possession
authors:
  - Casimir Beng
  - Anouk Mensah
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
