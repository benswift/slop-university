title: Fourteen Determinations of One Crystal
subtitle: Surface and Bulk Background Absorption in a Repeatedly Re-polished Yb³⁺-Doped Laser-Cooling Sample
authors:
  - Odalys Penhallow
  - Ragnhild Uzoma
preset: paper
school: School of Settled Matters
