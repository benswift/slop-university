doi: 10.5555/slop.4ob80k
summary: >-
  A paper in physics from the School of Settled Matters reconciles fourteen
  determinations of background absorption made over eleven years on one
  Yb³⁺-doped fluoride laser-cooling crystal, re-polished eight times in that
  period, by reading its polishing log as a thickness series. A bulk
  coefficient of 2.10 × 10⁻⁴ cm⁻¹ and a per-face surface absorptance that
  depends on the final-polish recipe describe all fourteen values, and the
  figure the laboratory carried forward from the fourth year is shown to be
  about a quarter surface term.
topic: >-
  reconciling eleven years of archived laser-cooling efficiency measurements on
  one re-polished ytterbium-doped fluoride crystal, reading its successive
  polishes as a thickness series that separates surface from bulk background
  absorption
