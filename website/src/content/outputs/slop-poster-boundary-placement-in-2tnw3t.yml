summary: >-
  A research poster from the School of Underlying Conditions proves that a
  layered model of a graded diffusion barrier reproduces its steady flux
  wherever the layer boundaries are drawn but not its time lag, and bounds the
  lag error by the layers' thickness. In a worked sigmoidal example every
  two-layer boundary overestimates the lag, the least-error boundary lies below
  the half-contrast depth, and a third, transitional layer brings the lag within
  6%.
topic: >-
  boundary placement in layered transdermal barrier models: steady flux
  survives resistance-preserving coarse-graining, the diffusion time lag does
  not
