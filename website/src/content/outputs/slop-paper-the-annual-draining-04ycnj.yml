title: A Well Forty Metres Across
subtitle: >-
  The Annual Draining of an Ornamental Pond as a Recovery Test on the
  Alluvium Around It
authors:
  - Vigdis Emenike
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-10-13
publishedAt: "2026-10-13T01:28:30+11:00"
doi: 10.5555/slop.04ycnj
summary: >-
  A paper from the School of Underlying Conditions treats an unlined
  ornamental pond, pumped out each year for desilting, as a dug well of
  20 m radius and analyses three consecutive drainings as recovery tests. A
  radial flow model fitted to pond stage alone gives a transmissivity of 29 to
  33 square metres a day and a specific yield of 0.11 to 0.13, predicts the
  drawdown in three bank piezometers to within 0.04 m, and sits above the
  geometric mean of slug tests in the same piezometers; a fourth, unplanned
  lowering ten months after desilting shows about half the expected piezometer
  response, read as a resistance at the bed that the annual cleaning removes.
topic: >-
  The annual draining of a campus ornamental pond read as a recovery test on a
  well of very large diameter: the transmissivity of the ground around one
  unnamed unlined pond, from how it refills
