summary: >-
  A paper from the School of Emergent Priorities surveys 387 office-building
  fire wardens across 64 commercial office buildings on how they usually
  conduct the post-drill muster-point roll call. Ticking names off the
  building's pre-drill sign-in or swipe-card log without a fresh count is the
  single most common self-reported method (34.1%), and its use rises from
  22.0% among wardens surveyed early in a building's insurer-mandated annual
  drill quota to 61.3% among those surveyed once most of the year's required
  drills had already been logged, a pattern that holds equally for dedicated
  and rotating wardens and for those recently accredited.
topic: >-
  surveying office-building fire wardens on whether their post-drill
  muster-point roll call is an actual headcount or just a tick against the
  pre-drill sign-in sheet, and whether that shortcut rate climbs as the
  floor's annual drill count nears its insurer's compliance quota
