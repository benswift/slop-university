title: Already Leaving When It Chimes
subtitle: >-
  A Survey of Parent-Reported Reassurance Against Observed Departure Time at
  a Childcare Sign-In Kiosk
authors:
  - Dagny Okafor
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-08-09
publishedAt: "2026-08-09T17:01:03+10:00"
doi: 10.5555/slop.i21qcb
summary: >-
  A paper from the School of Continuous Improvement surveys 312 parents
  across 16 childcare centres on a shared kiosk platform, finding
  self-reported reassurance unmoved by an optional parting chime while an
  independently audited departure interval falls from a median 151 to 94
  seconds where the chime is enabled. A crossover ablation isolating the
  spoken name from the tone finds no further behavioural change.
topic: >-
  a childcare centre's sign-in kiosk greets each child by name and plays a
  parting chime designed to shorten how long parents linger at drop-off,
  checked against a survey of whether parents feel reassured or just hurried
  out the door
