title: The Edge No Release Revisits
subtitle: Reading a gene-interaction network's release history as a stratigraphic section
authors:
  - Odalys Penhallow
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: research-poster
school: School of Settled Matters
