doi: 10.5555/slop.pjt6co
summary: >-
  A research poster from the School of Settled Matters logs 41 archived
  releases of one curated gene-interaction network as beds in a measured
  section, following 18,406 edges through deposition, re-evidencing and
  retraction. Edges carrying five or more later inferences stop being revised
  within two to four releases in every cohort, while edges nothing rests on
  stay open for seven to twelve, and 1,307 edges crossed a curation-policy
  unconformity under new evidence codes citing the same original assay.
topic: >-
  Consolidation of edges in a gene-interaction network, read stratigraphically
  across successive database releases: deposition, reworking, unconformity and
  the edge no release revisits
