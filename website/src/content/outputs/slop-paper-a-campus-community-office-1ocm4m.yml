title: Measuring Committee Continuity
subtitle: >-
  A Five-Level Maturity Model for Suburban Chess Clubs, With Grant
  Eligibility Gated to the Level Attained
authors:
  - Runa Adegoke
  - Kwame Lindqvist
  - Ingrid Vasseur
preset: paper
school: School of Emergent Priorities
date: 2026-08-28
publishedAt: "2026-08-28T09:04:16+10:00"
doi: 10.5555/slop.1ocm4m
summary: >-
  A paper from the School of Emergent Priorities develops the Committee
  Continuity Maturity Model, a five-level instrument scoring how a
  suburban chess club's governance knowledge survives an office-bearer's
  departure, and retrospectively applies it to 38 clubs. Level tracks how
  long a club takes to fill a vacated executive position, and the
  University's campus-community office has adopted the resulting Level 3
  threshold as the eligibility floor for its chess-club development grant
  round.
topic: >-
  a campus-community office administers a five-level governance maturity
  model that scores suburban chess clubs' committee succession and
  archive-keeping, with grant eligibility gated to the level a club
  attains
