title: Asking for a thumbs-up on the skip-bin post does not change who uses the skip
subtitle: Does a react-to-confirm on the street group chat move household skip use?
authors:
  - Eskil Nwabueze
  - Ingeborg Nwachukwu
  - Iben Chikere
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-07
publishedAt: "2026-10-07T10:02:55+11:00"
doi: 10.5555/slop.u3g5fo
summary: >-
  A research poster from the School of Continuous Improvement reports that
  asking neighbours to thumbs-up the skip-bin post does not change household
  skip use (42.4% asked vs 41.6% not; 148 skip-weekends), and binds every
  University event invite to a react-to-confirm whose count is forbidden as an
  allocation key, with places, kit and rooms drawn by lottery among all
  invitees and no override.
topic: >-
  Although the street group chat asks neighbours to thumbs-up the skip-bin
  post to confirm they will use it, asking for the thumbs-up does not change
  how many households put something in
