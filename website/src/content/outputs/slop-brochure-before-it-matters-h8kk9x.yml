summary: >-
  A prospectus brochure from the School of Emergent Priorities invites
  prospective students into environmental science as the discipline of setting
  down a baseline before anyone knows the question it will answer. It presents
  the University's approach through groundwater fieldwork, the Horizon
  Register's account of priorities on approach and the keeping of sealed cores
  and samples, and rests the case on five published studies cited by title and
  DOI.
topic: >-
  before it matters: study environmental science at Slop University and set
