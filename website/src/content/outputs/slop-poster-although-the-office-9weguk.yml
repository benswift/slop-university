title: Staff whose last meeting overruns the bike-cage lock leave the bicycle overnight.
subtitle: >-
  Does the insurer's lock time decide who is still in the room at 18:29?
authors:
  - Ingeborg Nwachukwu
  - Torun Ezeigwe
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-15
publishedAt: "2026-09-15T14:33:50+10:00"
doi: 10.5555/slop.9weguk
summary: >-
  A research poster from the School of Continuous Improvement treats an office
  bike cage's 18:30 auto-lock as a naturally occurring cutoff, finding
  overnight-bike rates jump from 8 percent just before the lock to 62 percent
  just after. Eighteen-thirty departure is now a punctuality competency on the
  quarterly performance-review form, with meetings booked past 18:15
  auto-declined and no discretionary exemption.
topic: >-
  Although the office bike cage's 18:30 auto-lock is only an insurance rule,
  staff whose last meeting ends just after the cutoff leave the bicycle
  overnight and arrive the next morning by rideshare; 18:30 departure is now a
  punctuality KPI on the quarterly performance review, with no exemption for a
  meeting that overruns.
