title: Three Coins Already in the Jar
subtitle: A Thematic Interview Study of Café, Food-Truck and Strip-Mall Counter Staff on Seeding the Tip Jar, and the Seed Requirement Now Kept at University Service Counters
authors:
  - Kwame Lindqvist
  - Lindiwe Achterberg
  - Runa Adegoke
preset: paper
school: School of Emergent Priorities
date: 2026-09-20
publishedAt: "2026-09-20T12:02:12+10:00"
doi: 10.5555/slop.dzvnn6
summary: >-
  A paper from the School of Emergent Priorities interviews 43 counter staff at 19 cafés, food trucks and strip-mall counters about seeding the tip jar, and reports five themes in their own words: the seed is for the next customer, kept small and silver, and taken home at close. Twenty-one of the 37 who seed their jars place three coins. A 30-counter pilot found seeded and unseeded jars ended the day with the same contents, though the University now requires every service counter to open with a jar seeded to three silver coins, entered on the opening checklist, on pain of lapsed accreditation.
topic: >-
  The seeded tip jar beside the till: an interview study of café baristas, food-truck operators and strip-mall counter staff, in their own terms, on why they drop the first coins into the jar themselves, and the University's requirement that every service counter keep a jar seeded to the interviewees' modal three coins.
