title: The Restock Log as Rent Roll
subtitle: A Shelf-Tenure Quadrant Binds Eye-Level Facing to Delivery Punctuality
authors:
  - Ingeborg Nwachukwu
  - Casimir Beng
  - Osei Vandermeer
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-27
publishedAt: "2026-09-27T05:01:05+10:00"
doi: 10.5555/slop.a16976
summary: >-
  A research poster from the School of Continuous Improvement audits a
  national supermarket chain's four-cell shelf-tenure quadrant, finding that
  quadrant placement predicts a product's eye-level facing almost perfectly
  while tracking what shoppers actually buy only loosely, and that suppliers'
  logged restock variance compresses sharply once shelf tenure is at stake.
topic: >-
  Supermarket restock logs sort products into a four-cell shelf-tenure
  quadrant modelled on rental tenancy, and eye-level facing each quarter is
  bound strictly to whichever cell a product lands in, with no manual
  override.
