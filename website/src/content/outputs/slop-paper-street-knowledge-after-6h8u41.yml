title: Where the Knowledge Went
subtitle: Satellite Navigation, Delegated Competence and Forty Years of a Hire-Car Licensing Board's Street-Knowledge Examination
authors:
  - Petra Umbile
  - Anneke Tolan
preset: paper
school: School of Emergent Priorities
date: 2026-11-04
publishedAt: "2026-11-04T00:31:36+11:00"
doi: 10.5555/slop.6h8u41
summary: >-
  A science and technology studies paper follows a regional hire-car licensing
  board's street-knowledge examination through forty years of question papers,
  committee minutes, examiner interviews and observed orals, coding 2,412 items
  into route, location, conditions and overrule kinds. It argues that the
  licence survived the delegation of its competence to satellite navigation by
  moving its examination onto the seam between driver and device, so that the
  Board now certifies a candidate's judgement of when to follow the device and
  when to overrule it.
topic: >-
  street knowledge after satellite navigation: a regional hire-car licensing
  board's forty years of examination revisions, read as a competence delegated
  to the dashboard and a jurisdiction kept by examining when the driver
  overrules it
