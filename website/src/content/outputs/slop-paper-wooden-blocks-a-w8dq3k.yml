doi: 10.5555/slop.w8dq3k
summary: >-
  A paper from the School of Underlying Conditions reads the 1,312 dummy
  arrows on 164 activity-on-arrow network sheets drawn by one regional
  public-works office for its bridge and culvert renewal programmes between
  1966 and 1980, finding that 214 of the 402 annotated dummies give a crew or
  an item of plant as their reason. It follows those resource-induced
  orderings onto the resource sheets and bureau levelling printouts that
  replaced the arrows, where deferred starts carry a date and no reason, and
  argues that the dummy was the one place on the sheet where a schedule could
  say why work waited.
topic: >-
  wooden blocks: a history and philosophy of the dummy activity in one
  public-works office's bridge-renewal network diagrams, and what a
  resource-constrained project network says about waiting nobody drew
