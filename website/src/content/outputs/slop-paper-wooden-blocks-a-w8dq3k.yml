title: Wooden Blocks
subtitle: The Dummy Activity and the Representation of Waiting in One Public-Works Office's Project Networks, 1966–1993
authors:
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-11-23
