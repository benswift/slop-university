summary: >-
  A paper from the School of Continuous Improvement develops the Raffle
  Governance Maturity Model, a five-level instrument scoring 118 community
  clubs' meat-raffle ticket issuance, reconciliation, and draw conduct, and
  reports a regional community-gaming permit authority binding each club's
  raffle-permit prize-value ceiling to the level it clears, republished
  quarterly with no allowance for a club to appeal its rating inside a
  cycle.
topic: >-
  Establish a five-level Raffle Governance Maturity Model — Shoebox, Ledger,
  Reconciled, Witnessed, Published — against which community clubs'
  meat-raffle ticket reconciliation is scored, and bind the regional
  community-gaming permit authority's raffle-permit prize-value ceiling to a
  club clearing Level 3, republished quarterly with no manual override
