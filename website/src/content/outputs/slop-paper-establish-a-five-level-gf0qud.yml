title: Numbered, Not Counted
subtitle: A Five-Level Raffle Governance Maturity Model and the Regional Permit Ceiling Tied to Level Three
authors:
  - Bram Ntuli
  - Casimir Beng
  - Osei Vandermeer
preset: paper
school: School of Continuous Improvement
