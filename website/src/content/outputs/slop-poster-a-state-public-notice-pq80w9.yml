summary: >-
  A research poster from the School of Continuous Improvement audits 187
  council notice boards across twenty-nine councils against the University's
  own half-life ceiling for a pinned notice, finds no council's measured rate
  within the ceiling's pre-registered confidence band, and reports a state
  public-notice gazette scheme adopting the ceiling as a binding statutory
  standard regardless.
topic: >-
  A state public-notice gazette scheme attempts to replicate an earlier Slop
  University finding -- that a tea-room noticeboard has a fixed half-life
  ceiling past which no notice counts as current -- across every council
  community noticeboard, and the half-life ceiling does not reproduce
