title: Towards Full Assurance, Explained
subtitle: Marek Solheim, Torun Ezeigwe and Casimir Beng on what a sporting club's
  working-with-children-check tier really tracks
authors:
  - Marek Solheim
  - Torun Ezeigwe
  - Casimir Beng
preset: video-explainer
school: School of Emergent Priorities
date: 2026-10-19
publishedAt: "2026-10-19T23:48:34+11:00"
doi: 10.5555/slop.6rgwlj
summary: A research explainer from the School of Emergent Priorities on Marek Solheim,
  Torun Ezeigwe and Casimir Beng's study of 48 community sporting clubs scored against
  a five-level working-with-children-check administration maturity model. It follows
  four clubs' tiers across three audit rounds, sets the tier beside the audit calendar,
  and shows what a finals-eligibility rule anchored to the top tier does to marginal
  volunteers. Each of the three authors carries part of the account in their own voice.
topic:
  A research explainer of the poster scoring community sporting clubs' working-with-children-check
  administration against a five-level maturity model across three audit rounds, which
  finds the assessed tier tracks the days to the next audit more closely than any
  record of onboarding practice
