summary: >-
  A marketing poster for the Master of Applied Measurement's next intake,
  built around a quasi-experiment exploiting the naturally occurring cutoff
  at a district's published last-frost date: seedling survival across 46
  households and 312 raised garden beds jumps sharply right at the date,
  with no matching shift in bed orientation, species mix, or gardener
  experience. The programme has adopted the same date as a binding rule for
  the University's own grounds planting, with no exception carried past a
  single growing season.
topic: >-
  does planting a seedling the week before a district's published
