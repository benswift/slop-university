summary: >-
  A paper from the School of Continuous Improvement reports the first
  population-scale deployment of TREAD, a portable instrument scoring
  front-doormat tread wear across 1,480 households and 94 streets, and finds
  that any street whose median score crosses a fixed threshold is enrolled in
  a council's mandatory two-year doorstep-safety audit with no earlier exit.
topic: >-
