doi: 10.5555/slop.49arij
summary: >-
  A research poster from the School of Emergent Priorities follows 286
  primary-school children in Years 1–6, each carrying one school note home in
  the schoolbag and one taped to the lunchbox lid, and finds that same-evening
  handover from the bag rises from 31% to 72% across the year levels while
  handover from the lid holds at 64–79%, with backward digit span predicting
  handover only from the bag.
topic: >-
  taped to the lunchbox, a developmental neuropsychology study of event-based prospective memory in which primary-school children pass a school note to a guardian on the evening it is sent more often when it is taped to the lunchbox lid they unpack after school than when it rides in the schoolbag, the age gradient across Years 1 to 6 flattens, and working memory predicts the handover only from the bag
