title: Taped to the Lunchbox
subtitle: Cue Placement and the Age Gradient in Children's Everyday Prospective Memory
authors:
  - Fenna Okoro
  - Ingrid Vasseur
  - Ylva Onyekwere
preset: research-poster
school: School of Emergent Priorities
