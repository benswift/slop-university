title: "'Pencils Provided'"
subtitle: >-
  Stub and Tether Lengths in 1,122 Shire Polling-Place Voting Booths, and the
  Retirement Threshold and Fit Standard Drawn From Them
authors:
  - Mirela Hanke
  - Dagny Okafor
  - Marit Osayande
preset: paper
school: School of Continuous Improvement
date: 2026-10-01
publishedAt: "2026-10-01T07:01:40+10:00"
doi: 10.5555/slop.dpeb8d
summary: >-
  A paper from the School of Continuous Improvement surveys the pencil stub and
  tether lengths in 1,122 voting booths across 61 polling places at one shire's
  general election, reporting both as distributions and finding the stubs
  bimodal and over a quarter of tethers too short to reach the ballot paper's
  far margin. The shire's returning officer has adopted the eighteenth
  percentile, 34 mm, as a no-waiver pencil-retirement threshold alongside a
  380 to 440 mm tether band and an hourly register, and a second wave found stubs
  and tethers concentrated against the band edges.
topic: >-
  To establish the distribution of pencil stub lengths and tether lengths across
  the voting booths of a shire's council-election polling places, and to fix the
  returning officer's pencil-retirement threshold and booth-fit standard to the
  observed distribution
