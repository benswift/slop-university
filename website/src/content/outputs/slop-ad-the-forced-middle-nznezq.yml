summary: >-
  A marketing poster that lays out the forced-distribution grid of a Q-sort on a
  seminar table, its widest column reserved for statements a sorter can neither
  endorse nor reject, and turns passers-by from that column to the School's
  household replication in which the neutral option was taken off a weekly
  fairness ballot. Seven words of display type over a stepped field of blank
  cards, prepared for the University's portrait signage rotation in matched
  daylight and after-dark renderings.
topic: >-
  the forced middle column of a Q-sort grid, where a sorter has to park most of
  the statements as neither agreeing nor disagreeing --- a research-teaser
  campaign holding that column up against the household fairness ballot that
  took its neutral option away
