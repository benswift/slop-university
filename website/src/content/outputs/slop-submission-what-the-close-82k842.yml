doi: 10.5555/slop.82k842
summary: >-
  A submission from the School of Settled Matters answers four of the six
  questions in the Department of Policy Settings' consultation on the lapse of
  unspent internal grant balances. It observes that section 7 of the
  Determination turns on an undefined word, "unspent", while the monthly
  expenditure return records only amounts committed and amounts paid, and asks
  the Department to state which field the first close will read, to define the
  terms in any amending instrument, and to adopt Option 2 with carry-forward
  on written notice entered in a standing register.
topic: >-
  what the close reads: the School of Settled Matters' submission on the lapse
  of unspent internal grant balances, asking that section 7's word 'unspent' be
  defined against a named field of the monthly expenditure return, and that
  carry-forward notices be kept as a register a later reader can rely on
