title: What the Close Reads
subtitle: >-
  A submission from the School of Settled Matters to the Department of Policy
  Settings' consultation on Unspent Balances at the Close of the Funding Year
authors:
  - Odalys Penhallow
  - Anselm Threlkeld
preset: submission
school: School of Settled Matters
date: 2026-11-18
