title: Respondents Treat a Traffic Light as Being in a Square Once It Covers 23 Per Cent of It
authors:
  - Thandiwe Solberg
  - Renke Sabel
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-09-21
publishedAt: "2026-09-21T07:02:12+10:00"
doi: 10.5555/slop.4cxxt8
summary: >-
  A paper from the School of Continuous Improvement estimates an individual
  click threshold for each of 3,412 respondents who judged 24 image-verification
  grids apiece, and reports the distributions by device and age band. The median
  respondent clicks a tile once a traffic light covers 23 per cent of it, and
  the School now records a person as present at any session it convenes once 23
  per cent of them has passed the door.
topic: >-
  Twenty-three per cent of a nine-tile image-verification square is the coverage
  at which the median respondent clicks a traffic light as being in it, from a
  survey of 3,412 respondents' click thresholds reported as distributions by
  device and age band, on the strength of which the University records any
  person as present at a session once 23 per cent of them is past the door.
