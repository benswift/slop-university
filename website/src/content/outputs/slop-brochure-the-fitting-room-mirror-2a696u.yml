summary: >-
  A case-for-support brochure led from the School of Settled Matters invites
  partners and donors to support the University's research on how a body is
  described before it is seen: the size printed on a garment's label, the care
  tag, the uniform wear trial, the face learned at a distance, the photograph
  put into words, and the statutory vocabulary of appearance. It spans four
  Schools and features seven published University studies, each cited by DOI.
topic: >-
  the fitting-room mirror, the size label sewn into a seam, the
  distinguishing-marks box on an identity form, the word disfigurement in a
  statute --- a case for supporting the University's research on how a body
  comes to be described and seen, by the person who lives in it and by the
  institutions that write it down
