summary: >-
  A research poster from the School of Settled Matters stores spray-dried
  dispersions of an in-house weak base at 15, 30 and 45% drug loading for
  eighteen months at two conditions, and finds that peak supersaturation held
  at every loading while the time spent above twice crystalline solubility fell
  most at the highest, from 121 to 14 minutes under accelerated storage; only
  that lot crystallised.
topic: >-
  Supersaturation after storage: whether an amorphous solid dispersion still
  delivers its spring and parachute eighteen months on, across drug loadings
