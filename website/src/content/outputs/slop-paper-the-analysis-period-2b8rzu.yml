title: Where the Cycle Ends
subtitle: Analysis-Period Selection and Option Ranking in Public-Building Life Cycle Cost Appraisals
authors:
  - Odalys Penhallow
  - Clemency Tredinnick
preset: paper
school: School of Settled Matters
date: 2026-11-09
publishedAt: "2026-11-09T12:31:54+11:00"
doi: 10.5555/slop.2b8rzu
summary: >-
  A paper from the School of Settled Matters reads 74 life cycle cost
  appraisals lodged with one capital-works agency's business-case gateway
  between 2009 and 2024 and finds that 52 took their analysis period from the
  workbook's pre-filled default, moving from 30 to 25 years when the workbook
  was revised. Re-computing each comparison across horizons of 15 to 60 years
  changes the preferred option in 23 appraisals, and within ten years of the
  stated period in 11, with reversals concentrated where no residual value is
  recognised; the authors propose that appraisals report the horizon at which
  their recommendation would reverse.
topic: >-
  the analysis period in life cycle costing appraisals of public buildings:
  where the study horizon comes from, how often the guidance template rather
  than the asset sets it, and whether a different horizon would have changed
  which option won
