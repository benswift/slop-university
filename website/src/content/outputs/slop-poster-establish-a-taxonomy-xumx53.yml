doi: 10.5555/slop.xumx53
summary: >-
  A research poster from the School of Emergent Priorities sorts fourteen
  months of loan entries from four community sheds' honesty ledgers into a
  five-category taxonomy of borrower kinds, coded independently and locked
  before any policy change. Two of the five kinds --- ledger-avoider and
  serial non-returner --- now trigger a standing co-signature requirement for
  every future loan across all four sheds, with no review path short of
  leaving and rejoining.
topic: >-
  Establish a taxonomy of tool-borrower kinds from a community shed's honesty
  ledger, and use it to decide which members must be supervised before
  borrowing again.
