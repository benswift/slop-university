title: Towards a Typology of Borrower Kinds
subtitle: Sorting a Community Shed's Honesty Ledger into a Supervision Mandate
authors:
  - Petra Umbile
  - Renke Sabel
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-06
