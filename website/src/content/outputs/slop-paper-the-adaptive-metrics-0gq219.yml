title: Whoever's Up the Ladder
subtitle: A National Survey of Gutter-Clearance Delegation and Latency, and the Household Maintenance Reliability Credential It Underwrites
authors:
  - Thandiwe Solberg
  - Casimir Beng
  - Torun Ezeigwe
preset: paper
school: School of Continuous Improvement
date: 2026-09-10
publishedAt: 2026-09-10T18:03:30+10:00
doi: 10.5555/slop.0gq219
summary: >-
  A paper from the School of Continuous Improvement surveys 4,118 households
  nationally on how long leaf litter sits in the roof gutters before it is
  cleared and who in the household is delegated the job, then builds a
  Household Maintenance Reliability Credential from the resulting
  distributions and enters it as a condition of eligibility for the
  university housing office's off-campus rental referral list.
topic: >-
  The Adaptive Metrics Lab surveys households nationally on how long leaf
  litter sits in the roof gutters before anyone climbs a ladder to clear it
  and who in the household is delegated the job, then uses the resulting
  delegation and latency distributions as the evidence base for a portable
  Household Maintenance Reliability Credential gating eligibility for the
  university housing office's off-campus rental referral list.
