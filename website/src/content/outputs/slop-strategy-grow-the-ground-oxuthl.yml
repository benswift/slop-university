title: Ground Worth Tending
subtitle: >-
  A Strategic Plan to grow the campus in bio-cemented soil and self-healing
  concrete, and to follow every crack from first sighting to closure
authors:
  - Solveig Adeyemi
  - Vigdis Emenike
  - Brynjar Obiora
