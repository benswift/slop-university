summary: >-
  Slop University's Strategic Plan 2026-2031 commits the University to lay its
  new non-structural hardscape in bio-cemented soil and self-healing concrete,
  anchored in a culture collection of calcifying strains drawn from its own
  ground and tended through scheduled nutrient rounds, and opens a Crack
  Register in which every crack on the estate is followed from first sighting
  to an agreed closure.
topic: >-
  Grow the ground rather than pour it: committing the University's estate and
  research to bio-cemented soil and self-healing concrete, with every crack
  followed from first sighting to closure
