title: What ‘Promptly’ Allows
subtitle: Panel Operators’ Readings of Alarm-Response Time Words, Against the Window the LOPA Credits
authors:
  - Anselm Threlkeld
  - Gunnhild Ekwueme
preset: research-poster
school: School of Settled Matters
