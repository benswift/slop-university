summary: >-
  A research poster from the School of Settled Matters asks 31 night-shift
  panel operators at one solvent-recovery unit how late an action may come and
  still satisfy five temporal qualifiers in the unit's 46 alarm response
  procedures. Operators read the words as a scale, but not the drafters' one:
  24 of 31 place "without delay" after "promptly", and 23 of 31 read "as soon
  as practicable" past the 10-minute operator response the unit's
  layer-of-protection analysis credits.
topic: >-
  How night-shift operators at a solvent-recovery unit construe the temporal
  qualifiers in alarm response procedures ('promptly', 'without delay', 'as
  soon as practicable'), read against the operator-response window the unit's
  layer-of-protection analysis assumes
