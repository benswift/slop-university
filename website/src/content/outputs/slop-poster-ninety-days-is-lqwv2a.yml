doi: 10.5555/slop.lqwv2a
summary: >-
  A research poster from the School of Continuous Improvement cross-tabulates
  1,842 uncollected repair tickets from 61 outlets of a national
  footwear-repair franchise against contact-attempt and claim-outcome
  records, finding resale eligibility tracks the franchise's own contact
  definition far more closely than it tracks whether an item is ever claimed.
topic: >-
  Ninety days is the statutory window before a strip-mall shoe-repair shop
  can legally resell an uncollected pair, and a single unanswered phone call
  now counts as 'contacted' in the claimed-versus-contacted quadrant a
  franchise chain uses to clear its shelves.
