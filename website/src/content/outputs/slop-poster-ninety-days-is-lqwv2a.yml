title: Contacted, Not Reached
subtitle: A Claimed-Versus-Contacted Quadrant Audit of a Footwear-Repair Franchise's Resale Policy
authors:
  - Bram Ntuli
  - Torun Ezeigwe
  - Sten Okwuosa
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-31
