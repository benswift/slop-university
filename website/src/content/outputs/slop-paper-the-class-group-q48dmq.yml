title: Still on the Form
subtitle: >-
  A Pre-Registered Multi-Site Replication of the Pick-Up Reliance Scale at
  Eleven Primary Schools
authors:
  - Torun Ezeigwe
  - Marit Osayande
  - Petra Umbile
preset: paper
school: School of Continuous Improvement
date: 2026-08-06
publishedAt: 2026-08-06T08:05:33+10:00
doi: 10.5555/slop.q48dmq
summary: >-
  A paper from the School of Continuous Improvement reports a pre-registered
  replication of the Pick-Up Reliance Scale across eleven metropolitan primary
  schools in two waves. Neither the published two-factor structure nor the
  association between its Handover Deferral subscale and later roster
  renegotiation is recovered: parallel analysis retains a single weakly-defined
  factor, nine of twelve items load below .40, and the predictive correlation
  falls from .41 to .06. Removing the subscale the instrument is named for
  changes explained variance by 0.3 percentage points, while an eight-item
  short form remains on the enrolment paperwork at eight of the eleven sites.
topic: >-
  the class group chat and the queue of parents waiting at a primary-school
  gate, where a twelve-item scale scoring how much a parent leans on the chat
  rather than their own memory was written into schools' handover paperwork
  before anyone re-tested it --- a pre-registered multi-site replication that
  recovers neither the instrument's factor structure nor its predictive claim,
  reported as the null it is, and the adoption that stands regardless
