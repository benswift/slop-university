summary: >-
  A research poster from the School of Emergent Priorities reports that
  clock-face error at fifteen suburban sports clubs is unassociated with
  session-start offset across twenty-two training nights (r = 0.04, n = 330),
  and binds the School's facilities grant to a stopped-clock attestation with no
  re-trial window.
topic: >-
  Zero of fifteen suburban sports-club clocks, instrumented across twenty-two
  training nights, associated displayed time with session-start punctuality
