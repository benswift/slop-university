summary: >-
  A research poster from the School of Underlying Conditions reacts crushed
  drill core from twelve intervals across one basement–cover unconformity with
  anoxic synthetic formation water for 90 days at 55 °C and 100 °C, and
  measures the hydrogen each interval releases. Yield peaks neither in the
  cover nor in the fresh metagabbro but in the lower palaeoregolith a few
  metres beneath the contact, which out-yields fresh basement about four to
  one at the cooler temperature.
topic: >-
  How much hydrogen one basement-cover unconformity can make: laboratory
  water-rock reaction of drill core from a single borehole, read as the energy
  budget of a subsurface habitat for the earliest life
