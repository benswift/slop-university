summary: >-
  A research poster from the School of Emergent Priorities surveys 96
  backyard posts of a citizen-science NO₂ network fortnightly over two warm
  seasons as a field ecologist would a set of trap nests, pairing each open
  electrochemical enclosure with a mesh-screened twin. It records 112
  colonisations of the open enclosures by web-building spiders, mud-nesting
  wasps, ants and earwigs, finds that the open sensor's reading shifts by
  guild (about −6 ppb under a wasp nest, −2.7 ppb under a web, +1.5 ppb
  under an ant nest), and notes that the network's automated quality checks
  flagged nine of the 112.
topic: >-
  Tenants of the housing: a field-ecology census of the spiders, mud-nesting
  wasps, ants and earwigs that colonise backyard low-cost electrochemical
  gas-sensor enclosures over two seasons, and the drift in readings against a
  co-located reference that follows each colonisation
