title: Occupied, Not Offered
subtitle: >-
  A Four-Kind Occupancy Taxonomy of the Morning-Bus Priority Seat, Adopted as
  the Network's In-Use Rule
authors:
  - Ingrid Vasseur
  - Anouk Mensah
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-08
publishedAt: "2026-09-08T13:33:15+10:00"
doi: 10.5555/slop.hkw4fl
summary: >-
  A research poster from the School of Emergent Priorities sorts occupied
  priority seats on the morning bus into four kinds --- offered, claimed,
  bagged, and filled-unoffered --- coded from 412 observations across 22
  services. Filled-unoffered is the modal kind at 47 per cent, and standing
  instruction 2026/14 adopts it as the network's in-use category, so
  kneeling-bus allocation follows whichever routes keep those seats fullest.
topic: >-
  Trajectory Analytics Group sorts every occupied priority seat on the morning
  bus into four kinds — offered, claimed, bagged, or filled-unoffered — and
  adopts filled-unoffered as the network's official 'priority seating in use'
  category, so kneeling-bus allocation follows whichever routes keep those
  seats fullest.
