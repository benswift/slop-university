summary: >-
  A research poster from the School of Underlying Conditions measures the step
  response of a flow-through potassium-selective electrode cell on one drill
  rig's return line at five slipstream flows, as built and re-plumbed. The
  hold-up volume fitted from the tracer (21.3 mL) matched the water-fill volume
  of the fittings (20.6 mL), most of it in a strainer housing; moving the
  strainer upstream cut the time to 90% response at the lowest flow from 148 s
  to 11 s, against 2.1 s for the membrane alone.
topic: >-
  residence-time analysis of a flow-through potassium-selective electrode cell
  on a drilling-return line, showing the sensor's lag lives in the inlet
  fitting and not the membrane
