title: After the Point Is Settled
subtitle: Sharp bounds on a ruling's effect on the cases it binds, when precedent both interferes and selects
authors:
  - Odalys Penhallow
  - Lindiwe Achterberg
  - Bram Ntuli
preset: research-poster
school: School of Settled Matters
date: 2026-11-25
publishedAt: "2026-11-25T15:01:47+11:00"
doi: 10.5555/slop.8y20h4
summary: >-
  A research poster from the School of Settled Matters treats an appellate
  ruling as interference on every later case it binds, maps each case's
  exposure to the tally of concordant decisions before it, and proves sharp
  bounds on the ruling's effect when a more settled point is argued less often.
  On a simulated registry of 9,600 later cases across 240 questions of law, the
  bounds exclude zero through the third concordant decision and contain it from
  the fourth, while the naive before-and-after comparison overstates the effect
  by up to 0.09.
topic: >-
  Identification under interference by precedent: sharp bounds on how an
  appellate ruling changes the later cases it binds, using exposure mappings
  over the order of decision
