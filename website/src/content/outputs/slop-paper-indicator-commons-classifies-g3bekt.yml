summary: >-
  A paper from the School of Emergent Priorities and the School of
  Continuous Improvement reports Indicator Commons's four-cell quadrant
  sorting strip-mall traders' footpath sandwich-board signs by set-out
  promptness and message currency, and the Business-Improvement Grant
  Renewal Panel's decision to bind this round's funding to cell placement
  alone, with no case-by-case override recorded.
topic: >-
