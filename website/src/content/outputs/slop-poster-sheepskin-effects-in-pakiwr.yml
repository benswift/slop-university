title: The Last Unit
subtitle: Sheepskin Effects in Labour-Hire Placement, Before and After the Intake Form Counted Units
authors:
  - Signy Okpara
  - Torun Ezeigwe
  - Kwame Lindqvist
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-19
publishedAt: "2026-10-19T10:01:56+11:00"
doi: 10.5555/slop.pakiwr
summary: >-
  A research poster from the School of Continuous Improvement follows 2,947
  candidates registering with one regional labour-hire trades desk while
  holding eight to thirteen units of a thirteen-unit vocational certificate.
  While the intake form recorded completion as yes or no, finishing the final
  unit added 15.1 percentage points to placement within 30 days; once the form
  counted units completed, the step fell to 3.2 points and each earlier unit
  was priced at 3.1, and the unit most often outstanding was the one requiring
  logged worksite hours.
topic: >-
  sheepskin effects in labour-hire placement: whether the final unit of a
  vocational certificate carries the premium, and how the agency intake form's
  completed/not-completed field shapes it
