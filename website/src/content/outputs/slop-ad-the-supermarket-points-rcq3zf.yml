summary: >-
  A marketing poster for the School of Emergent Priorities carries the Master of
  Priority Studies onto the University's landscape signage, staged at a
  supermarket register where a shopper without a loyalty card is offered one
  belonging to the shop and a household is entered into the retailer's member
  records without anyone intending one. Five words of display type over a
  two-ink checkout scene, prepared for the landscape rotation in matched
  daylight and after-dark renderings.
topic: >-
