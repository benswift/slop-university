doi: 10.5555/slop.piykro
summary: >-
  A research poster from the School of Underlying Conditions scans a
  laser-induced plasma a millimetre at a time across the boundary between a
  sandy loam and the clay beneath it in one soil core, diagnosing each shot's
  electron density and temperature. Eight line ratios that placed the boundary
  anywhere across 17 mm agree within 4 mm once each shot's plasma state is
  accounted for, because the plasma changes about 18 mm above where the soil
  does.
topic: >-
  Laser-induced plasma diagnostics scanned shot by shot across a soil-horizon
  boundary in a core: Stark-broadened H-alpha electron densities and
  Saha-Boltzmann temperatures show how much of the apparent elemental boundary
  the plasma itself draws
