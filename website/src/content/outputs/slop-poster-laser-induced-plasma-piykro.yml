title: The Spark Moves First
subtitle: Plasma state, not composition, sets where LIBS line ratios place a horizon boundary
authors:
  - Brynjar Obiora
  - Ragnhild Uzoma
  - Casimir Beng
preset: research-poster
school: School of Underlying Conditions
