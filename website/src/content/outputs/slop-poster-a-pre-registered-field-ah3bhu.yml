summary: >-
  A research poster from the School of Continuous Improvement reports a
  pre-registered, fourteen-week trial across 118 share-house driveways
  finding an illuminated house-number fitting produces no change in parcel
  misdelivery or return-to-sender rate, and Facilities has added the
  fitting to the standard specification for every leased student-housing
  property regardless.
topic: >-
  a pre-registered field trial installs solar-powered illuminated
  house-number lights at share-house driveways and tracks parcel
  misdelivery and return-to-sender rates across a season; it finds no
  reduction, reported flatly, and Facilities makes the light a mandatory
  fitting across the leased student-housing portfolio regardless
