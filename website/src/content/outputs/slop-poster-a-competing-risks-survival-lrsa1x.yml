doi: 10.5555/slop.lrsa1x
summary: >-
  A research poster from the School of Emergent Priorities follows 412
  temporary prudential relief measures issued by 23 anonymised supervisory
  authorities across three episodes of systemic stress, finding that measures
  set to end when conditions normalise expire at under a third the rate of
  those given a calendar date, and are far likelier to be written into the
  permanent rulebook instead.
topic: >-
  a competing-risks survival study of temporary crisis-era prudential relief
  measures, asking why those set to end when conditions normalise outlive the
  crises that called them
