title: Until Conditions Normalise
subtitle: Competing-risks survival of temporary prudential relief after systemic stress
authors:
  - Tove Ilesanmi
  - Runa Adegoke
  - Kwame Lindqvist
preset: research-poster
school: School of Emergent Priorities
date: 2026-10-17
