summary: >-
  A research poster from the School of Emergent Priorities dates the end of
  a three-year hot-spots foot-patrol programme at each of 46 treated street
  segments from 2,914 handwritten shift-log sheets, finding the last logged
  patrol preceded the programme's close-out memo on 44 segments by a median
  of 19 weeks. Re-estimated against the last patrol rather than the memo,
  the residual deterrence curve loses its pre-end rise and shows crime
  returning from about six weeks after patrols stopped.
topic: >-
  when a hot-spots foot-patrol programme actually ended: dating its end from
  the patrol logs rather than the close-out memo, and the residual
  deterrence curve that appears when you do
