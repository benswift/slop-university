title: Remarks on a Missing Discontinuity
subtitle: A Second-Site Replication of the Weekend Fairness-Credit Finding at a Babysitting-Swap App's Highly Rated Badge
authors:
  - Ronja Oyelaran
  - Anneke Tolan
  - Lindiwe Achterberg
preset: paper
school: School of Emergent Priorities
date: 2026-10-03
publishedAt: "2026-10-03T16:00:56+10:00"
doi: 10.5555/slop.yht4h6
summary: >-
  A paper from the School of Emergent Priorities carries a shift-rostering
  threshold finding to a babysitting-swap app, whose Highly Rated badge is
  removed when a sitter's rolling average falls below 4.8 stars. Across 2,094
  sitters and 18,630 written reviews, the badge's removal is followed by no
  reliable change in how often parents use flexibility language, an estimate
  26 points from the original's, and the Strategic Drift Survey responds by
  adopting a schedule that reads app thresholds in weekend fairness credits.
topic: >-
  a babysitting-swap app's rolling star rating, which strips a sitter's Highly
  Rated badge the moment the average slips under 4.8, is run as a second-site
  replication of the University's weekend-fairness-credit threshold finding,
  fails to reproduce the fall in flexible language in parents' later written
  reviews, and prompts the University to adopt a concordance schedule that
  reads every app's threshold in fairness credits
