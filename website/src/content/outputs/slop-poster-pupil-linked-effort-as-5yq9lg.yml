title: Where the Card Stops
subtitle: Pupil-linked effort as a worked example fades, in new staff learning to clear a printer jam
authors:
  - Edda Nwafor
  - Signy Okpara
  - Ingeborg Nwachukwu
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-25
publishedAt: "2026-10-25T14:02:16+11:00"
doi: 10.5555/slop.5yq9lg
summary: >-
  A research poster from the School of Continuous Improvement randomises 72
  staff in their first fortnight to fully worked, backward-faded or
  problem-only instruction cards for a nine-step printer jam-clearing
  procedure, recording task-evoked pupil dilation at each step. Under fading
  the dilation peak follows the first unworked step from trial to trial, and
  faded practice gives the best success on an unseen jam a week later (19 of
  24, against 13 for the worked cards and 9 for problem-only practice).
topic: >-
  pupil-linked effort as a worked example fades: pupillometry of new office
  staff learning a multifunction printer's jam-clearing procedure from fully
  worked, faded and problem-only instruction cards
