title: From Draft to File
subtitle: >-
  How Long an Employee's Proudest Sentence Survives Three Rounds of Manager
  Revision
authors:
  - Anouk Mensah
  - Verity Marris
  - Solveig Adeyemi
preset: paper
school: School of Emergent Priorities
date: 2026-08-25
publishedAt: 2026-08-25T12:01:21+10:00
doi: 10.5555/slop.uz4l32
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement tracks 3,106 self-nominated pride sentences through three
  rounds of manager revision at one national retail-logistics group, finding
  that the sentence an employee chooses to write about their own achievement
  loses most of its original wording by the personnel file, replaced
  disproportionately by a fixed descriptor drawn from the calibration
  panel's own competency-framework bank.
topic: >-
  What happens to the one sentence an employee is proudest of, between
  drafting it in a quarterly self-assessment form's free-text box and the
  version that survives three rounds of manager edits into the personnel
  file
