summary: >-
  A marketing poster for Slop University presents the School of Underlying
  Conditions as a place that reads strain wherever it is held, from the
  three-carbon ring of the reaction chemist to the soil profile of the field
  surveyor, with Dr Brynjar Obiora as the face of the campaign. It was prepared
  for the portrait signage rotation in matched daylight and after-dark
  renderings, and invites the public to meet the researchers.
