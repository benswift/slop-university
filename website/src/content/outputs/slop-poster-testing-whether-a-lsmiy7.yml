title: Scrubbed, Not Watched
subtitle: >-
  Validating a National Franchise's Onboarding-Video Completion Timestamp
  Against Player Scrub Telemetry
authors:
  - Ingeborg Nwachukwu
  - Dagny Okafor
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-08
publishedAt: "2026-08-08T22:02:23+10:00"
doi: 10.5555/slop.lsmiy7
summary: >-
  A research poster from the School of Continuous Improvement pairs a
  national retail franchise's onboarding-video completion flag against
  player-side scrub telemetry across 6,400 viewings and 214 stores, finding
  three in ten "completed" viewings fall under a fifth of runtime actually
  watched and that a platform-wide check-in-prompt rollout only worsened
  scrubbing on Workplace Conduct and Reporting content.
topic: >-
  testing whether a national franchise's staff onboarding video completion
  timestamp reflects whether new hires actually watched it, checked against
  player telemetry showing how many scrubbed straight to the final frame
