summary: >-
  A research poster from the School of Settled Matters reconstructs the plan of
  a demolished courthouse registry wing from random subsets of 145
  ground-penetrating radar traverses by curvelet-domain ℓ1 minimisation, finding
  its slab edges and wall footings recovered from a third of the lines while
  paired shelving rails need half. Four test pits sited on a single one-in-three
  reconstruction confirm the building's frame and phase it in three: a
  timber-floored wing, an extended strongroom, and a slab laid for mobile
  shelving.
topic: >-
  Recovering the plan of a demolished courthouse registry wing from sparse
  ground-penetrating radar traverses by compressive reconstruction, checked
  against test pits
