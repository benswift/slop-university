summary: >-
  A research poster from the School of Emergent Priorities surveys 110
  students and staff on their preferred coffee-queue following distance and
  their courtyard pigeon-feeding frequency, reporting both as population
  distributions. Futures in Committee adopts the pooled following-distance
  median as its published confidence reading, with a school whose median
  narrows sharply between sessions referred for a standing-item review.
