summary: >-
  A case-for-support brochure led by the School of Settled Matters invites
  partners and supporters to back the University's work on memory across all
  four Schools, in features on materials that carry a pattern from one cycle
  into the next, on networks that learn in the structure that stores what they
  have learned, and on how a court or a decision system comes to rely on what
  it has already decided. It rests its case on seven published studies cited
  by title and DOI.
topic: >-
  what holds: a case for supporting the University's work on memory, in the
  device that keeps its state without power, the network that learns where it
  stores, and the point of law that stays decided
