title: The Recording Is Almost Never Played
subtitle: >-
  An Afterlife Accounting of "Quality and Training Purposes" Across Fourteen
  Contact Centres
authors:
  - Ronja Oyelaran
  - Fenna Okoro
  - Dagny Okafor
preset: paper
school: School of Emergent Priorities
date: 2026-08-18
publishedAt: "2026-08-18T21:02:04+10:00"
doi: 10.5555/slop.t6jjw1
summary: >-
  A paper from the School of Emergent Priorities ingests twelve months of
  replay-audit telemetry from fourteen contact centres --- 2,306,414
  recorded calls, 193,412 hours of stored audio --- and finds the archive
  was played back 129 times, led by internal who-said-what disputes, with
  coaching or training last among the observed purposes at eight events.
  Interviews with 41 of the archive's custodians surface no training
  artefact traceable to a specific recording, while the announcement itself
  delivered 5,714 hours of audio over the same window against 7.8 hours of
  replayed recordings; a wording ablation at three centres moves replay
  behaviour by at most 0.4 events per 100,000 calls.
topic: >-
  'This call may be recorded for quality and training purposes': a
  replay-log accounting across fourteen contact centres finds millions of
  recorded service calls are played back a few hundred times a year, mostly
  to settle staff disputes about who promised what, and quality-team
  interviews can name no training a recording has ever delivered --- after
  which the sector body standardises the announcement wording and attests
  quality by the announcement's playback uptime, making the disclaimer, not
  the archive, the audited object
