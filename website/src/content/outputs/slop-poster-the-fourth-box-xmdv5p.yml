summary: >-
  A research poster from the School of Emergent Priorities sets the sex ticked
  on the skeleton recording sheets of 212 burials from one unnamed cemetery,
  dug in three campaigns, beside the chromosomal sex later called from their
  ancient DNA, and traces the seven calls that were neither XX nor XY through
  the archive. All seven survive in one added spreadsheet column, but on the
  sheets they sit in pencil margins, a comments field, a second-hand "Indet."
  tick or nowhere, and the archive database records each as U, alongside
  burials that returned no call; the poster proposes a three-part sex field for
  the next sheet edition.
topic: >-
  The fourth box on the skeleton sheet: how an invented cemetery's excavation
  archive recorded sex across three campaigns of M / F / ? / Indet.
  tick-boxes, and where its recorders put the ancient-DNA karyotypes that came
  back as neither XX nor XY
