summary: >-
  A landscape marketing poster for the School of Settled Matters sets a reader
  at the gate of an open grazing run, beside a fence line, a windmill and a mob
  at the trough, and offers the School's course on precedent as the place to
  follow a pastoral lease's stocking condition through the cases until counsel
  stop arguing. It points readers to the University's work on use-based rights,
  stock water and grazing cooperatives. Developed for the University's landscape
  signage panels and the campus digital rotation.
