summary: >-
  A case for support from the School of Underlying Conditions presents the
  University's field-margin research as the study of the ground a farm leaves
  unsown: the soil transition beneath a straight fence, the plants that grow
  in the strip beside it, and the shelter belts, dams and yard taps at the
  edge of the yard. Seven published outputs from three Schools, each cited by
  title and DOI, carry the invitation to partners and supporters.
