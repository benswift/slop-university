title: A Closure Maturity Model for the Workplace Meeting
subtitle: >-
  Grading how ninety recurring meetings actually end, from the trailing-off to
  the appointed closer
authors:
  - Ingrid Vasseur
  - Marek Solheim
  - Anouk Mensah
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-19
publishedAt: "2026-08-19T06:01:58+10:00"
doi: 10.5555/slop.ottxbk
summary: >-
  A research poster from the School of Emergent Priorities codes ninety
  recurring workplace meetings against a five-level closure maturity model,
  from the ending that trails off to the ending enacted by a formally appointed
  closer working from a written protocol. Announced closes per meeting fall
  from 3.1 to 1.0 as maturity rises, while median overrun at last departure
  holds near eleven minutes at every level --- closure capability governs the
  manner of an ending, not its timing.
topic: >-
  no meeting ends only once --- the recurring workplace meeting's long goodbye
  (the 'if there's nothing else', the second wrap-up, the doorway follow-on
  after the room is lost) coded across ninety observed endings into a
  five-level closure maturity model, which adopting firms use to appoint
  designated meeting-enders and to convene a standing meeting on how their
  meetings end
