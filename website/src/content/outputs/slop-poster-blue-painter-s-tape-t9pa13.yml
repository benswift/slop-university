doi: 10.5555/slop.t9pa13
summary: >-
  A research poster from the School of Continuous Improvement follows 1,148
  items marked with tape by purchasers at 96 new-build handover walk-throughs
  across four estates, each photographed and numbered independently on the day
  and then tracked for twelve months against the builder's own handover record.
  Dwellings carry a mean 6.2 recorded items against 12.0 observed and the two
  counts rank close to unrelated (Spearman ρ = 0.19); 596 of the 1,148 items
  reach no list at all. Rectification within twelve months reaches 78.4 per cent
  of listed items against 31.2 per cent of those settled verbally on the day
  (adjusted hazard ratio 3.41, 95% CI 2.88 to 4.04), and site managers in the
  top quartile of the builder's build-quality indicator recorded a median 4.1
  items on walk-throughs where 11.8 were observed.
topic: blue painter's tape stuck beside every gap, mark and scratch at a new-build
  handover walk-through, where a project-home builder reports defects recorded
  per dwelling as its build-quality indicator and the site manager who runs the
  walk-through is the one measured by it --- a twelve-month prospective cohort of
  every tape-marked item, numbered independently on the day, analysed as time to
  rectification for items that entered the list against items settled with a nod
