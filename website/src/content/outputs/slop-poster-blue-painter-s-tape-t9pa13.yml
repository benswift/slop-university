title: Settled With a Nod
subtitle: Twelve-month rectification of 1,148 tape-marked items across 96 new-build
  handover walk-throughs
authors:
  - Thandiwe Solberg
  - Ingeborg Nwachukwu
  - Solveig Adeyemi
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-06
