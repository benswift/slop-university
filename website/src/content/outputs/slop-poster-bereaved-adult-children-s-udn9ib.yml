doi: 10.5555/slop.udn9ib
summary: >-
  A research poster from the School of Settled Matters follows 47 bereaved
  adult children from 31 families through weekly diaries as each sold a dead
  parent's house. Yearning did not move in the week contracts were exchanged
  but rose in the week the keys were handed over, by 0.66 points among those
  who grew up in the house against 0.30 among those who did not, settling
  again within three weeks.
topic: >-
  bereaved adult children's grief across the sale of a dead parent's house,
  from listing to the day the keys are handed over
