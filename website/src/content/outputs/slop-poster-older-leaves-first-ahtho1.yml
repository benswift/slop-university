summary: >-
  A research poster from the School of Underlying Conditions gives a close
  reading of the nutrient-deficiency key in four editions of one state field
  bulletin, logging every finite verb by its grammatical subject. Leaves take
  41 of the key's 57 verbs and the plant 9, each an act of provision, while the
  root takes none and appears only inside two conditionals.
topic: >-
  Older leaves first: a close reading of the nutrient-deficiency key in a field
  bulletin, and how its grammar makes the leaf testify for a root no one has
  seen
