title: Seen With a Rake
subtitle: An Interview Study of How Nineteen Allotment-Society Volunteer Coordinators Decide Who Came to the Working Bee
authors:
  - Marek Solheim
  - Anouk Mensah
  - Hedvig Anyanwu
preset: paper
school: School of Emergent Priorities
date: 2026-09-20
publishedAt: "2026-09-20T10:02:13+10:00"
doi: 10.5555/slop.w3zxqb
summary: >-
  A paper from the School of Emergent Priorities interviews nineteen
  allotment-society volunteer coordinators about how they decide that a person
  came to the working bee, coding the transcripts in the coordinators' own
  phrases. Seventeen describe attendance as being seen with a tool, fourteen
  require the sighting to come from a second tool-holder, and fifteen exclude
  the coordinator's own clipboard; the University adopts the two-tool sighting
  as the attendance standard for its committees, with a Sighting Column in
  every set of minutes.
topic: >-
  The volunteer coordinator of an allotment society, interviewed with eighteen
  other coordinators about the quarterly working bee, says a person counts as
  having come if they were seen holding a tool by someone who was also holding
  one, and the University adopts the coordinators' two-tool sighting as the
  attendance standard for its own committees
