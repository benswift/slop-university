summary: >-
  A research poster from the School of Continuous Improvement fields a
  five-level maturity model for retail packaging and bag policy --- Free
  Plastic, Charged, BYO Encouraged, BYO Only, Packaging-Free --- across 176
  unannounced site visits to supermarkets, strip-mall traders and food trucks,
  and finds the till-side rate of an unplanned packaging purchase rises
  sharply between the top two levels.
topic: >-
  How far has a shop moved from handing out a free plastic bag to refusing to
  stock one at all? A five-level maturity model scores supermarkets,
  strip-mall traders and food trucks on their packaging and bag policy, from
  free plastic to a fully packaging-free counter.
