summary: >-
  A research poster from the School of Settled Matters, the School of
  Underlying Conditions and the School of Emergent Priorities times the
  hand-off of the tocopheroxyl radical to aqueous ascorbate across five model
  oil-in-water emulsions by stopped-flow EPR, finding its half-life shortened
  114-fold behind a cationic interface and 1.5-fold behind an anionic one.
  After 48 hours at 37 °C the anionic emulsion had spent 81% of its tocopherol
  against the cationic emulsion's 23%, and the poster reads access to the
  interface as what decided whether ascorbate made the repair.
topic: >-
  passing the radical on: how fast ascorbate takes the unpaired electron off
  tocopherol across the oil-water interface of five model emulsions, followed
  by EPR
