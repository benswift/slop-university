doi: 10.5555/slop.aa9m6h
summary: >-
  A research poster from the School of Continuous Improvement checks 3,118
  acquisition configuration files from one gamma-spectroscopy teaching
  laboratory against the units in force when each was written, finding 671
  inconsistent values in 612 files. Most are a shaping time still given in
  microseconds after a firmware update moved the key to nanoseconds; 87% of
  those files descend by copy from seven pre-update templates, and the digitiser
  clamps the stale values without warning.
topic: >-
  physical-unit inconsistencies in eleven years of acquisition configuration
  files from a shared gamma-spectroscopy teaching lab, traced to a digitiser
  firmware update that moved the shaping-time key from microseconds to
  nanoseconds without renaming it
