title: The Key That Kept Its Name
subtitle: >-
  Physical-unit inconsistencies in eleven years of a gamma-spectroscopy teaching
  lab's acquisition configurations
authors:
  - Signy Okpara
  - Casimir Beng
preset: research-poster
school: School of Continuous Improvement
date: 2026-11-06
