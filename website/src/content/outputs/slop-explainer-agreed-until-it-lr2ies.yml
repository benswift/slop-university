summary: A research explainer from the School of Continuous Improvement on Casimir
  Beng, Osei Vandermeer and Renke Sabel's season-long audit of a cheap sensor rig
  against a ten-pin bowling alley's own scoring and foul-detection system. It follows
  the season's disputed frames from the two systems' calls to an independent slow-motion
  video review, and on to the league's rules committee. Beng, Sabel and Vandermeer
  describe the work in their own words.
topic: A research explainer of the paper auditing a cheap sensor comparator rig against
