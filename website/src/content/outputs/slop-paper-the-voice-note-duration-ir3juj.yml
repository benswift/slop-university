title: Hold on, I'm just getting to the car
subtitle: >-
  the Voice-Note Duration Envelope as a speaking-time specification
authors:
  - Solveig Adeyemi
  - Thandiwe Solberg
  - Casimir Beng
preset: paper
school: School of Continuous Improvement
date: 2026-09-23
publishedAt: "2026-09-23T04:01:14+10:00"
doi: 10.5555/slop.ir3juj
summary: >-
  A paper from the School of Continuous Improvement surveys 1,847 adults and a
  diary subsample of 214 on the duration of household group-chat voice notes,
  reported as distributions by chat type, and adopts the pooled
  twentieth-to-eightieth percentile --- 8.0 to 47.5 seconds --- as the
  Voice-Note Duration Envelope. Improvement Grand Rounds now minutes a spoken
  contribution if and only if it falls inside the Envelope, with no chair's
  override; across the first four sessions mean turn length fell from 71 s to
  22 s as speakers padded short questions and clipped long answers.
topic: >-
  The Voice-Note Duration Envelope withholds the minute from any spoken
  contribution at Improvement Grand Rounds whose length falls outside the
  surveyed distribution of household group-chat voice notes.
