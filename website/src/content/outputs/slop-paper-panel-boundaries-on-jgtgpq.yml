title: Remembered at the Joints
subtitle: Panel Boundaries Act as Event Boundaries in Visitors' Recall of Names on a Long Memorial Wall
authors:
  - Brynjar Obiora
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-11-07
publishedAt: "2026-11-07T00:30:24+11:00"
doi: 10.5555/slop.jgtgpq
summary: >-
  A paper from the School of Underlying Conditions asks 236 visitors leaving a
  regional memorial wall of 1,176 names on 14 panels to recall what they had
  read, and finds that names at the top and foot of each panel are recalled
  about twice as often as uniform recall would predict, with distance from a
  panel joint mattering far more than place in the alphabet. A corridor
  replica with 144 participants shows that dividing the same list into more
  panels raises recall, draws it to the edges, and weakens memory for the
  order of names either side of a joint.
topic: >-
  Panel boundaries on a long memorial name wall act as event boundaries: in a
  recall study, visitors remember the names at the edges of each panel and
  lose the middle, so where a memorial is divided decides whom it remembers
