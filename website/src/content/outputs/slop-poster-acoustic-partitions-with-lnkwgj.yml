title: Towards a Universal Acoustic Fit-Out Standard
subtitle: A Franchise's Sensor-Verified Partition Trial Finds No Effect on Performance-Review Ratings
authors:
  - Hedvig Anyanwu
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-15
publishedAt: "2026-09-15T12:23:36+10:00"
doi: 10.5555/slop.lnkwgj
summary: >-
  A research poster from the School of Emergent Priorities reports a
  year-long, sensor-verified rollout of acoustic desk partitions across 214
  open-plan review-season pods at 38 franchise back-offices, finding no
  association between certified partition compliance and supervisor review
  ratings (β = 0.01, 95% CI [-0.04, 0.06]). The partition specification is
  adopted as the mandatory fit-out standard for every future franchise office
  regardless.
topic: >-
  Acoustic partitions with fixed noise-sensors are installed across a
  franchise's open-plan back offices ahead of performance-review season;
  despite a year of verified compliance, supervisor ratings show no
  detectable change, and the partition spec becomes the mandatory fit-out
  standard regardless
