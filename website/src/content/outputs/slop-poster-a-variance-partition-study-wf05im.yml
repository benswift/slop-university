title: The Record Belongs to the Kart
subtitle: >-
  Partitioning Lap-Time Variance Between Driver, Kart and Session at 22 Indoor
  Karting Venues
authors:
  - Anouk Mensah
  - Lindiwe Achterberg
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-13
publishedAt: 2026-08-13T19:04:03+10:00
doi: 10.5555/slop.wf05im
summary: >-
  A research poster from the School of Emergent Priorities partitions best-lap
  variance across 22 indoor karting venues, 528 karts and 24,880 driver-stints,
  fitting driver, kart and session as crossed random effects. Kart identity
  accounts for an estimated 31 per cent of the variance (95% CI 26 to 36)
  against 44 per cent for the driver; at 19 of the 22 venues the standing record
  was set in a kart now in its fleet's quickest quartile, and re-ranking on
  kart-adjusted times moves the printed podium in roughly two sessions in five.
  No venue records a kart identifier beside a posted record, so the adjustment
  is unavailable to anyone reading the board.
topic: >-
  a variance-partition study of an indoor go-kart chain's lap-time leaderboard,
  asking how much of a headline lap time belongs to the numbered kart handed
  over at the desk rather than to the driver who drove it, while the chain's
  venue records board and personal-best emails are computed off the raw times
