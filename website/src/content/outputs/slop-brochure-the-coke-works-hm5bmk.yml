summary: >-
  A civic brochure led by the School of Settled Matters introduces the town
  beside a coke works to the University's coal and coke research, in features
  on the oven battery's pushing cycle, the seam and the old washery pond
  beneath the streets, and the leases that will shape what the works becomes.
  It invites residents to the University's open evenings and cites six
  published studies from three Schools by title and DOI.
