summary: >-
  A marketing poster stages a small automatic weather station on an open
  campus lawn as a front moves in, a lone student looking up at the mast
  beneath the line that gives the campaign its name. Its brag is drawn from
  the Horizon Register's own verification table for campus forecasts, which
  the poster reports the University has topped for eleven seasons running,
  and it closes with an invitation to apply and a short reading list from the
  University's published research on forecasting in practice, prepared for
  the landscape signage panels in matched light and dark renderings.
