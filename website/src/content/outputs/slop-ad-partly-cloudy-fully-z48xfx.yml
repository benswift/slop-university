title: Partly Cloudy. Fully Anticipated.
subtitle: >-
  A campaign for the landscape signage panels, setting the campus weather
  station against the School of Emergent Priorities' own seasonal record of
  its forecasts
authors:
  - Marek Solheim
  - Fenna Okoro
