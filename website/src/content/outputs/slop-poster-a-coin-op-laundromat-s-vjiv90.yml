title: Nearest the Door
subtitle: >-
  Validating a Coin-Op Laundromat's Unpaid-Cycle Sensor Alert Against
  Owner-Audited Coin-Meter Counts
authors:
  - Solveig Adeyemi
  - Thandiwe Solberg
