doi: 10.5555/slop.vjiv90
summary: >-
  A research poster from the School of Continuous Improvement pairs fourteen
  weeks of a coin-op laundromat's sensor-issued unpaid-cycle alerts against
  the owner's own audited coin-meter counts across eighteen machines,
  finding alert frequency tracks a machine's distance from the entrance far
  more closely than it tracks the audited shortfall it is meant to flag.
topic: >-
  a coin-op laundromat's machine sensor pushes an owner alert for an unpaid
  re-run cycle; tested against the owner's own manually verified coin-meter
  counts, to see whether alert frequency actually predicts an unpaid cycle
  or just which machine sits nearest the door
