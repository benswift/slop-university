summary: >-
  The Department of Policy Settings answers five questions on the Slop
  University (Carbon Media Supply) Determination 2026, under which the schools
  buy activated carbon, charcoal and other carbonaceous material as a single
  approved grade through central stores, taken on notice at the Committee on
  Settings Oversight's Spring hearings of 4 November 2026 or lodged in writing
  after them. Its answers decline to say whether "charcoal" in the definition
  reaches the drawing studios' willow, while recording that the word was never
  questioned before the instrument was made; report eleven applications for
  another grade, three granted and two refused; hold returns of a soil survey's
  reference fragments only by lot and mass, with disposal deferred; decline a
  five-year expenditure reconstruction on resourcing; and confirm that no
  consultation paper was issued.
topic: >-
  the consolidated carbon supply: the Committee presses the Department on the
  Determination that buys all the University's carbon media as one approved
  grade, and on whether its definition reaches the drawing studios' willow
  charcoal
