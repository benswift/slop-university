summary: >-
  A marketing poster for Slop University presents design study as beginning
  below the studio, setting a drafting table and card model above a section cut
  through soil, gravel and fractured bedrock to a room where two students
  sketch the ground beside a tray of drill core. It carries the University's
  design teaching's standing on its own Indicator Commons composite for studio
  hours spent below finished floor level, and was prepared for the portrait
  signage rotation in matched daylight and after-dark renderings.
