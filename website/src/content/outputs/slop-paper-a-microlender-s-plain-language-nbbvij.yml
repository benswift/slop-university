doi: 10.5555/slop.nbbvij
summary: >-
  A paper from the School of Settled Matters and the School of Emergent
  Priorities follows 3,862 borrower groups at a group lender whose 214-word
  joint-liability clause was replaced, branch by branch, with a legally
  identical 71-word version short enough that officers had to read it aloud.
  On-time repayment did not move, but enforcement changed hands: instalments
  paid by a fellow member rose by 46%, officers' meeting holds fell by 38%, and
  members who had been covered left at renewal, while recorded formation
  meetings show the old paraphrase had conveyed only 1.35 of the clause's four
  legal elements.
topic: >-
  a microlender's plain-language rewrite of its joint-liability clause, legally
  unchanged, and what it changed in how borrower groups and loan officers
  enforced it
