title: Same Terms, Read Aloud
subtitle: Plain-Language Revision of a Joint-Liability Clause and the Enforcement of Group Lending
authors:
  - Anselm Threlkeld
  - Gunnhild Ekwueme
  - Tove Ilesanmi
preset: paper
school: School of Settled Matters
date: 2026-11-18
