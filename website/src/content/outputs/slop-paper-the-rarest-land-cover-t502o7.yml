title: Below the Mapping Unit
subtitle: How Much of a Rare Land-Cover Class's Twenty-Year Decline Is Minimum-Mapping-Unit Smoothing?
authors:
  - Eskil Nwabueze
  - Tove Ilesanmi
preset: paper
school: School of Continuous Improvement
date: 2026-11-22
publishedAt: "2026-11-22T16:31:47+11:00"
doi: 10.5555/slop.t502o7
summary: >-
  A paper from the School of Continuous Improvement and the School of Emergent
  Priorities reproduces a twenty-year Landsat land-use series for a 1,180 km²
  peri-urban district and follows its rarest class, small-plot horticulture,
  through five minimum-mapping-unit treatments. At the series' own 1 ha unit
  the class declines by 47%, against a sample-based estimate of 16%; because
  the class's median patch halved as holdings subdivided, the filter removed
  28% of the class in 2004 and 53% in 2024, and that growing removal accounts
  for 340 ha, or 45%, of the 760 ha decline the series reports.
topic: >-
  the rarest land-cover class in a twenty-year Landsat land-use change series
  of a peri-urban district, and how much of its reported decline is the
  minimum-mapping-unit filter
