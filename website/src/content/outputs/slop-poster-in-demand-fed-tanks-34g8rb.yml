doi: 10.5555/slop.34g8rb
summary: >-
  A research poster from the School of Emergent Priorities logs every bite at
  the self-feeder trigger in twelve tanks of forty tagged juvenile trout over 56
  days. Three fish per tank make a median 58% of the actuations yet grow no
  faster than the fish they feed, and when they are removed the ration dips for
  three days before new holders take the trigger at the same concentration.
topic: >-
  in demand-fed tanks of juvenile trout a handful of fish work the feed trigger
  for the whole tank; does the tank's ration and growth follow the triggerers
  or the appetite of the rest
