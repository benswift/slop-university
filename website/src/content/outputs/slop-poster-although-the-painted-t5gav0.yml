title: The Line Follows the Feet
subtitle: Four kinds of pass on 31 shared footpaths, and a divider repainted to follow them
authors:
  - Sunniva Balogun
  - Marek Solheim
  - Anouk Mensah
preset: research-poster
school: School of Emergent Priorities
date: 2026-10-03
publishedAt: 2026-10-03T22:00:57+10:00
doi: 10.5555/slop.t5gav0
summary: >-
  A research poster from the School of Emergent Priorities tallies 4,812
  passes across 31 suburban shared footpaths into a four-cell quadrant of
  lane-keeping (Held the Line, Cyclist Wide, Walker Wide, Shared the Middle),
  finding both walker and cyclist keep the painted lane on 37% of passes, and
  repaints the divider on nine University campus segments to the observed
  median track, after which the share holding the line rises to 94%.
topic: >-
  Although the painted divider on a suburban shared footpath assigns walkers
  one lane and cyclists the other, a four-cell count of who keeps their lane
  on each pass finds both parties keep it on fewer than two passes in five,
  and the University re-paints the divider on its own campus paths each term
  to follow the observed median track
