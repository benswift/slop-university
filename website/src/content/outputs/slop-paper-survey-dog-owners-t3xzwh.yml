title: "Declared, Not Forgotten"
subtitle: >-
  A Shire-Wide Survey of Lapsed Dog Registrations, and the Distribution a
  Renewal Intent Register Was Built to Pre-Empt
authors:
  - Ingrid Vasseur
  - Kwame Lindqvist
  - Lindiwe Achterberg
preset: paper
school: School of Emergent Priorities
date: 2026-08-29
publishedAt: "2026-08-29T18:00:43+10:00"
doi: 10.5555/slop.t3xzwh
summary: >-
  A paper from the School of Emergent Priorities surveys all 2,668 households
  whose dog registration lapsed across one shire's animal management unit
  over 18 months, finding forgetting the due date the modal self-declared
  reason (38.0%) and a renewal-timing distribution the shire's own single
  published figure describes accurately for only one of three
  ownership-tenure cohorts. A pre-declaration willingness measure does not
  differ between first-time and repeat lapsers, the subgroup distinction a
  proposed year-ahead Renewal Intent Register does not draw.
topic: >-
  Survey dog owners across a shire on why their annual registration lapsed,
  then adopt the distribution of self-declared reasons as grounds for a
  mandatory year-ahead Renewal Intent Register.
