title: Who Opened the Door?
subtitle: Agency at the Spatial Boundary and the Location-Updating Cost in Memory for Carried Objects
authors:
  - Vigdis Emenike
  - Brynjar Obiora
  - Lindiwe Achterberg
preset: paper
school: School of Underlying Conditions
date: 2026-10-13
publishedAt: "2026-10-13T01:05:46+11:00"
doi: 10.5555/slop.wrr6vs
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities reports two experiments in a desktop virtual corridor, with 72 and
  64 participants, on memory for a carried object after passing through an open
  archway, a door that opens by itself, and a door the participant opens. An
  automatic door cost no more than an archway, a self-opened door cost more
  than either, and a keypress that merely coincided with a door's opening cost
  nothing, a pattern the authors describe with a temporal-context model in
  which a spatial term and an action term add.
topic: >-
  Whether a door that opens itself still counts as an event boundary: a
  virtual-corridor experiment comparing hand-opened doors, automatic doors and
  open archways on memory for carried objects, with a temporal-context account
  of the result
