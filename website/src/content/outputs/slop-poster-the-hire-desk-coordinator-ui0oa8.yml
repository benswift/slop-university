title: Held, Not Hastened
subtitle: A Bond-vs-Card-Hold Field Test of On-Time Equipment-Hire Returns
authors:
  - Runa Adegoke
  - Marek Solheim
  - Ronja Oyelaran
preset: research-poster
school: School of Emergent Priorities
