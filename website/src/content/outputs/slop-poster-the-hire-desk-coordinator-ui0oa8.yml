doi: 10.5555/slop.ui0oa8
summary: >-
  A research poster from the School of Emergent Priorities compares on-time
  return rates under a refundable cash bond and a card-hold-only policy
  across 22 depots of a regional equipment-hire chain, tracking 1,148 hires
  of mixers, pressure washers, mowers and scaffold over fourteen months.
  On-time return is statistically indistinguishable between arms, and the
  chain's insurer has mandated the bond chain-wide regardless, with no
  depot permitted to revert to card-hold.
topic: >-
  The hire-desk coordinator at a regional equipment-hire chain tests whether
  a refundable cash bond, versus a card-hold-only policy, changes whether
  concrete mixers, pressure washers, and mowers come back on time; the
  difference is null, reported as null, and the chain's insurer mandates the
  bond chain-wide regardless.
