doi: 10.5555/slop.do1vas
summary: >-
  A paper from the School of Underlying Conditions edits the brine-strength
  entries of an inland salt works' well journal from five copies and one
  surviving autograph leaf. Recension shows that the printed abstract every
  later account relied on descends from a copyist who capped each reading at
  the saturation of common salt, while the office copy preserves the borer's
  higher figures, which the leaf confirms at nine of ten places; the paper
  argues that a criterion of physical impossibility carries a model of the
  solution into the apparatus, and that an edition emending by it should print
  that model.
topic: >-
  a recension of the brine-strength entries in the copies of an inland
  brine-well journal, asking whether readings above saturation are scribal
  corruptions or the archetype's true record
