title: Stronger Than Saturated
subtitle: The Brine-Strength Entries of an Inland Well Journal, Its Copies, and the Editor's Chemistry
authors:
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-10-18
