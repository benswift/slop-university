summary: >-
  A signage campaign from the School of Continuous Improvement reports that the
  University's taxi-rank result on numbered tickets and queue-order disputes did
  not repeat at a supermarket staff-room break-token pegboard, and commits the
  School to keep observing the pegboard until it does.
topic: >-
  The numbered break-token pegboard in a supermarket staff room, retested after
  the taxi-rank ticket finding failed to repeat, and the eighth kind of dispute
  the School will now go looking for.
