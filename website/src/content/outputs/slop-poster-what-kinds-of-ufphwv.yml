summary: >-
  A research poster from the School of Continuous Improvement audits 180
  households' medicine cabinets against a five-tier retention taxonomy,
  HOLD, finding the Ceremonial tier converges to roughly five percent of
  cabinet volume in every household regardless of size. The School adopts
  the taxonomy as the mandatory intake diagnostic for its Stewarding
  Indicators Capability Sprint.
topic: >-
  what kinds of items survive in a household medicine cabinet once they
  pass their use-by date, sorted into a five-tier retention taxonomy
  audited pharmacy-style across dozens of households and then adopted as
  the diagnostic intake instrument for a Capability Sprints short course
