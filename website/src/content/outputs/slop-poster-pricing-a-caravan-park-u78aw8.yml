title: Chosen for Shade, Priced for Power
subtitle: >-
  A Discrete-Choice Experiment on Caravan-Park Site Selection, Against the Tariff
  Schedule That Prices the Connection
authors:
  - Runa Adegoke
  - Lindiwe Achterberg
  - Anouk Mensah
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-29
publishedAt: 2026-07-29T00:01:39+10:00
doi: 10.5555/slop.u78aw8
summary: >-
  A research poster from the School of Emergent Priorities estimates part-worth
  utilities for six caravan-park site attributes from 7,344 forced choices made
  by 612 recent bookers across nine parks in one operator's portfolio, fitted as
  a mixed logit with correlated random coefficients. Shade leads at every stay
  length beyond a single night and is valued at $16.40 per night against $5.20
  for mains power, which carries the largest loading on the posted tariff, and
  neither shade nor a site's turning circle is a field the operator's booking
  system stores.
topic: >-
  pricing a caravan-park site against what guests actually choose --- a
  stated-preference experiment over shade, the walk to the amenities block, and
  whether you have to reverse in --- and what the park group's annual tariff
  review does with the answer when its booking system can only hold the power
  outlet
