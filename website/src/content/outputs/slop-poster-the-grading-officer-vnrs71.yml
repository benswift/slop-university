summary: >-
  A research poster from the School of Continuous Improvement scores 118
  members of a suburban table-tennis club on match win-rate and volunteer
  stewarding hours, crossing both at their quarterly median to sort the
  membership into a four-cell PACE grid. The club's grading committee has
  adopted the resulting standing as the sole basis for drawing the
  peak-time table roster.
topic: >-
  The grading officer of a suburban table tennis club scores every member
  on match win-rate and volunteer stewarding hours, sorting each into a
  four-cell PACE grid before the roster for peak-time tables is drawn from
  it
