title: The Lobule Fills from the Outside
subtitle: >-
  A Point-Counted Time Course of Centrilobular Necrosis and Repair in 144
  Archived Liver Sections
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
  - Vigdis Emenike
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-14
