doi: 10.5555/slop.om2xzt
summary: >-
  A poster from the School of Underlying Conditions point-counts 57,600 grid
  positions along portal–central axes in 144 archived liver sections from a
  concluded single-dose study of a coded in-house compound. The necrotic front
  stands deepest at 24 hours, retreats towards the central vein at about 1.3
  tenths of the axis a day, and is gone by day seven, with the mitotic figures
  lying on its portal side throughout.
topic: >-
  A point-counted time course of centrilobular necrosis and its repair in
  archived liver sections from a coded in-house compound study: when the
  necrotic fraction peaks, and from which side of the lobule the tissue returns
