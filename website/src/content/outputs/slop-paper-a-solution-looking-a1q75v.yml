summary: >-
  A paper from the School of Underlying Conditions follows a Taylor dispersion
  apparatus for measuring diffusion coefficients in liquids through its first
  thirty-one months in the School's soil-water laboratory, which received it
  unrequested. Of 58 measurement requests in the laboratory register, nine
  began with a problem no tabulated value answered; the rest arrived through a
  weekly run to keep the coil wet, through users trained on it, or through
  reports that wanted a method, while tabulated values kept their place in the
  School's transport models.
topic: >-
  a solution looking for solutes: a garbage-can reading of how a soil-water
  laboratory's newly acquired Taylor dispersion apparatus came to find the
  liquid diffusion coefficients its projects needed measuring
