title: Fixed Moral, Moving Facts
subtitle: Retold Incident Stories in the Safety Moment at a Solvent-Blending Plant
authors:
  - Anselm Threlkeld
  - Ylva Onyekwere
preset: paper
school: School of Settled Matters
