doi: 10.5555/slop.gmb17v
summary: >-
  An ethnography from the School of Settled Matters and the School of Emergent
  Priorities follows the safety moment that opens every meeting at one
  solvent-blending plant across eleven months and 236 meetings, where 95 of
  the moments retold one of nine stories the plant knows by name. It finds a
  story's closing line held in 61 of 66 tellings while its facts drifted toward
  the meeting at hand, that listeners corrected the moral and almost never the
  facts, and that the one story whose moral was written into a work
  instruction stopped being told within fourteen weeks.
topic: >-
  fixed moral, moving facts: an ethnography of the safety moment that opens
  every meeting at a solvent-blending plant, where retold incident stories keep
  their moral while their facts change to fit the room, the inverse of case law
