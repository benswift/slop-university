title: Stopping on the Count, Not the Clock
subtitle: Allocation and Censoring Bias in Quadrat Surveys Worked Ahead of a Rising Tide
authors:
  - Mirela Hanke
  - Joost Nwosu
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-10-13
publishedAt: "2026-10-13T02:23:15+11:00"
doi: 10.5555/slop.i9mrf6
summary: >-
  A paper from the School of Continuous Improvement treats a stratified quadrat
  survey of a rocky shore as a sampling design with a different deadline in
  each stratum, set by the flood tide. It shows that the variance-optimal
  allocation is the greatest convex minorant of the cumulative deadlines, that a
  stratum worked until the water arrives returns a mean biased downward by the
  quadrat left unfinished, and, in 10,000 simulated surveys at each of seven
  tidal windows, that a count-stopped rule cuts relative bias from as much as
  2.6 per cent to 0.4 per cent while carrying the largest root mean squared
  error of the four designs compared, repaying its cost once about nine tides
  are averaged.
topic: >-
  A stopping rule and inclusion-probability correction for quadrat surveys of a
  rocky shore, where the incoming tide censors the low-shore strata before the
  sample is complete
