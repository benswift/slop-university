title: The Towel Has Been on the End Rung Since Tuesday
subtitle: >-
  A Five-Kind Typology of Clothes-Airer Occupancy, Scored on the Rung Occupancy
  Scale in 41 Households
authors:
  - Edda Nwafor
  - Solveig Adeyemi
  - Marit Osayande
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-03
publishedAt: "2026-10-03T20:00:55+10:00"
doi: 10.5555/slop.xtjvtw
summary: >-
  A research poster from the School of Continuous Improvement sorts the
  garments on the clothes airers of 41 households into five kinds on the Rung
  Occupancy Scale, and finds wet garments fall from 88% of occupied rungs on
  loading evening to 4% by the sixth. The University now clears any garment
  from its end-of-trip drying racks at its seventy-second hour on a rung, wet
  or dry, and allocates locker bays by each rack's share still drying.
topic: >-
  The Rung Occupancy Scale sorts every garment hung on a household clothes
  airer into five kinds by what it is still waiting for, and sets the
  rung-clearance standard for the University's own end-of-trip drying racks
