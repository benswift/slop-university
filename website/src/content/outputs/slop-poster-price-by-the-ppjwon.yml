title: Price by the Post
subtitle: Letter Lag and Shipment Size in a Catalan Brandy House, 1786–1814
authors:
  - Sten Okwuosa
  - Marek Solheim
  - Sunniva Balogun
preset: research-poster
school: School of Continuous Improvement
