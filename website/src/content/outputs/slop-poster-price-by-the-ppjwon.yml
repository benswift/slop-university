doi: 10.5555/slop.ppjwon
summary: >-
  A research poster from the School of Continuous Improvement reads 2,318
  receipt-endorsed quotation letters in one coastal Catalan brandy house's
  letter-book against 412 consignments in its shipping ledger, 1786–1814, and
  finds that consignment size follows the northern price as dated by the
  letter's arrival, not its writing (elasticity 0.41), so that the price the
  house traded on was a median four weeks old in peace and nine in war.
topic: >-
  price by the post, an economic history of one Catalan coastal brandy house's
  incoming letter-book, 1786–1814, in which the firm sized its shipments to
  northern price quotations by the day each letter arrived rather than the day
  it was written, so the price it traded on was weeks old and grew older when
  war closed the sea routes
