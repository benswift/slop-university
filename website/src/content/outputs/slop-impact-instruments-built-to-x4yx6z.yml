summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 follows five
  years of instruments --- a pool turnstile, a noise-complaint microphone, a
  smart smoke alarm --- quietly pressed into service for questions they were
  never validated to answer, and the public secondary-use register the School
  built to track the gap between the two.
topic: >-
  instruments built to answer one question quietly pressed into service for a
  different one they were never validated for -- the pool turnstile counting
  laps, the noise-complaint microphone, the smart smoke alarm that also logs
  vaping
