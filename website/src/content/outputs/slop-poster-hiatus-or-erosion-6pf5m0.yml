summary: >-
  A research poster from the School of Emergent Priorities reads the monthly
  purchase records of 1,812 trade accounts at a regional builders' merchant,
  1996 to 2023, as stratigraphic sections, and classifies 4,370 gaps in trade
  by the product mix on either side. Three-quarters are pauses after which the
  same trade resumes; 9% are angular surfaces where a different trade resumes on
  the same account, most often under a new nominated purchaser, and the
  merchant's own segmentation records nearly nine in ten of those as customers
  won back.
topic: >-
  Hiatus or erosion: reading a regional builders' merchant's trade-account
  ledger as a stratigraphic section, and segmenting its account holders by the
  unconformities that bound their periods of trade
