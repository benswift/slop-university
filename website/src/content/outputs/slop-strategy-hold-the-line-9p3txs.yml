summary: >-
  Slop University's Strategic Plan 2026-2031 commits the University to a
  cross-school capability in the attack, defence and certification of machine
  learning models, alongside a programme treating the classification boundary
  as a placement with a history, drawing on the School of Underlying
  Conditions' study of boundaries between gradational soils. It closes by
  requiring a plain-language robustness statement for every learned system
  used in University decision-making.
topic: >-
  hold the line under perturbation: a five-year plan to build the University's
  capability in adversarial robustness for machine learning, from attack and
  certified defence to where a model draws the boundary between one class and
  the next
