summary: >-
  A marketing poster for the School of Continuous Improvement carries the
  University's own Evaluation of Evaluation standing onto the landscape display
  panels, set against a public pool in the hour before opening: still water,
  taut lane ropes, and an attendant holding the day's sample vial up to the
  light. The campaign stakes the placement on logging when a compliance reading
  was taken rather than on what it said. Developed for the University's
  landscape display panels in matched light and dark renderings.
topic: >-
  water tested before anyone swims --- a public pool's daily compliance sample
  dipped at the same quiet hour before opening, staged as a ranking-brag ad
  crediting the university's own Evaluation of Evaluation with placing first for
  asking which hour a reading came from
