title: Ten Calendar Days
subtitle: >-
  The Department of Policy Settings answers questions taken on notice by the
  Committee on Settings Oversight on the learner-contact setting and the online
  students it checks in on
authors:
  - Verity Marris
  - Clemency Tredinnick
  - Odalys Penhallow
preset: questions-on-notice
date: 2026-11-15
publishedAt: "2026-11-15T00:31:42+11:00"
doi: 10.5555/slop.c2u8ri
summary: >-
  The Department of Policy Settings answers five questions on the Slop
  University (Learner Contact) Determination 2026, which sends a check-in to an
  online student the learning platform has not recorded as active for ten days.
  Taken on notice at the Committee on Settings Oversight's Spring hearings of 13
  November 2026 or lodged in writing after them, its answers report 5,214
  check-ins to 2,871 students in Semester 2, 2,036 of them in the mid-semester
  break, whose days count like any other; trace the ten days to the 2019
  Guidelines without stating their basis; state that it does not hold how many
  of those students were studying away from the platform; confirm that each
  contact event stays on the student record for seven years; and decline to
  compile the check-ins issued since 2019.
topic: >-
  the Committee presses the Department on the learner-contact setting that sends
  an automated check-in to any online student the learning platform has not
  recorded as active for ten calendar days, the mid-semester break included
