summary: >-
  A research poster from the School of Underlying Conditions mines nine years
  of version history across fourteen experiment repositories kept by one
  bilingualism laboratory, tracing 412 bug fixes back to 538 bug-introducing
  changes. It finds defect density higher in files that exchange artefacts
  with code in another programming language in thirteen of the fourteen
  repositories, at a median of 9.6 against 4.0 per thousand lines.
topic: >-
  Where the code switches language: a repository-mining study of fourteen
  cued language-switching experiment codebases in a bilingualism laboratory,
  finding that defects concentrate at the hand-offs between programming
  languages
