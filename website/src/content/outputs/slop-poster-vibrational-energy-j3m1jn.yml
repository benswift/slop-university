summary: >-
  A research poster from the School of Continuous Improvement follows single
  overtone excitations, v = 1 to 6, on the terminal bond of a model chain of
  four coupled Morse oscillators with a Fermi-coupled bend, by exact quantum
  dynamics. Overtones v = 5 and 6 keep at least 82 per cent of their energy at
  every coupling studied, while v = 4 loses half its population within 0.4 ps
  through a near-exact resonance with two quanta of the bend.
topic: >-
  vibrational energy redistribution in a model chain of coupled Morse
  oscillators: which local-mode overtones keep their energy, and for how long
