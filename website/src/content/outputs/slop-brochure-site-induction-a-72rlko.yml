summary: >-
  A research-showcase brochure that presents the University's work on the
  building site as a single induction, from the pre-shift briefing at the gate
  and the Stop/Slow bat at the lane closure, through the laminated beam and the
  retaining wall that remember how they were made, to the stage handover and
  the completion date on the hoarding. It rests the invitation on seven
  published studies cited by title and DOI.
