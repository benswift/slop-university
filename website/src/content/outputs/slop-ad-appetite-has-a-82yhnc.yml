summary: >-
  A marketing poster for Slop University takes appetite as its theme and a
  laboratory bench as its scene, where an oil is poured through a funnel packed
  with clay. It directs the reader to the School of Underlying Conditions'
  paper on what an acid-activated bentonite seam takes out of a cold-pressed
  seed oil. Developed for bus-stop panels and campus digital signage in a
  portrait rotation.
