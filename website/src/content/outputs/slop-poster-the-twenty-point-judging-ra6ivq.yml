summary: >-
  A research poster from the School of Continuous Improvement teaches the
  twenty-point judging card of one garden society's preserves class as a
  single-site case: across nine autumn shows the mean card score rises from
  12.9 to 18.2 as entries converge on a firm-set strawberry jar, and the
  Society now stocks its fete stall only with jars scoring 17 or above, where
  sell-through has fallen from 94% to 58%.
topic: >-
  the twenty-point judging card for the preserves class at one garden society's
  autumn show, which comes to set what every member's jar looks like, until the
  society's fete stall may sell only what the card passes
