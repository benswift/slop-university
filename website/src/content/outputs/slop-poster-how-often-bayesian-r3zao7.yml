title: A Line Somewhere on the Ramp
subtitle: Bayesian areal wombling on simulated disease maps whose risk changes only by degrees
authors:
  - Brynjar Obiora
  - Vigdis Emenike
  - Bram Ntuli
preset: research-poster
school: School of Underlying Conditions
