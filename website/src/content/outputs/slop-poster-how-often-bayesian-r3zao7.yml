doi: 10.5555/slop.r3zao7
summary: >-
  A research poster from the School of Underlying Conditions fits a Bayesian
  areal wombling rule to 3,000 simulated disease maps of one synthetic region,
  whose relative risk changes either as a step or as a linear ramp up to 16
  areal units wide. The method recovers a true step in 96% of maps, but still
  declares a boundary on most ramps up to four units wide, placing it anywhere
  across the ramp, so that on graded ground the mapped line records where the
  rule fell rather than an edge in the surface.
topic: >-
  how often Bayesian areal wombling declares a boundary on a simulated disease
  map whose risk changes only by degrees, set against maps with a true step
