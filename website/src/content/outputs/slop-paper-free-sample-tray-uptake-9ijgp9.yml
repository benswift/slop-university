summary: >-
  A School of Continuous Improvement paper surveys free-sample uptake across
  supermarket, strip-mall, and food-truck venues as population distributions,
  then benchmarks Open Day visitors' own tasting-stall uptake against the
  retail figures to set next year's event booking-priority band.
topic: >-
  Free-sample-tray uptake, sampled per browsing-minute across supermarket
  aisles, strip-mall traders and food-truck queues, benchmarked against Open
  Day visitors' own tasting-stall uptake to rank them for next year's booking
  priority.
