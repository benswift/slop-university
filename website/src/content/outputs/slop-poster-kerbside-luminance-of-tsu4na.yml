doi: 10.5555/slop.tsu4na
summary: >-
  A research poster from the School of Continuous Improvement reports the build
  and first field season of LUMEN, a roof-mounted calibrated luminance camera
  driven at 15 km/h past 212 nominated festive-light displays across 34
  suburbs. Rig and handheld boundary reference agree closely (ICC = 0.89), a
  display takes 2.1 minutes against 14.3 for a walk-up survey, and 94 per cent
  of nominated displays return a usable kerbside profile, with display class
  separating the luminance distributions far less than the nomination listing's
  categories imply.
topic: >-
  Kerbside luminance of suburban festive-light displays, surveyed at
  sub-candela precision by LUMEN, a vehicle-mounted photometric rig Slop
  University built and field-tested over one season, reported as agreement with
  handheld reference readings, survey throughput, and the share of nominated
  displays measurable from the street, with every display's seasonal profile
  lodged for its householder to attest
