title: LUMEN
subtitle: A Vehicle-Mounted Photometric Rig for Suburban Festive-Light Displays
authors:
  - Bram Ntuli
  - Osei Vandermeer
  - Anouk Mensah
preset: research-poster
school: School of Continuous Improvement
