summary: >-
  A marketing poster for Slop University presents embedded systems design as
  the standing item on the School of Emergent Priorities' Horizon Register,
  setting a single microcontroller rising like a sun over a flat horizon while
  a surveyor keeps it in view through a theodolite. It carries the item's
  eleven consecutive quarters on the Register and was issued in light and dark
  renderings for the University's portrait screens.
