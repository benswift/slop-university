summary: >-
  A research poster from the School of Settled Matters follows the 34
  customer-requirement rows one appliance maker's House of Quality has carried
  verbatim across five generations of a benchtop food-processor line, coding how
  each successor design team construed them. Readings that adopt the previous
  generation's relationship scores rise from 7 rows to 26, the archived
  interview notes are consulted for 2 rows by the fifth generation, and for five
  open-textured rows the inherited mapping and the interview notes describe
  different things.
topic: >-
  reading an inherited House of Quality: how later design teams construe the
  customer-requirement wording in QFD matrices carried across product
  generations
