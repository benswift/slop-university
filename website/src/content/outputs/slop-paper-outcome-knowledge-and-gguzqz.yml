summary: >-
  A paper from the School of Settled Matters, the School of Continuous
  Improvement and the School of Underlying Conditions shows 48 silent clips of
  volunteer sellers' faces, each cut at the moment a decisive offer was read
  out in a recorded bicycle-sale negotiation, to 240 observers who were told
  nothing, the true outcome or its reverse. The outcome observers were told
  moved their valence ratings about three times as far as the actual outcome
  and left arousal untouched; true outcomes did not bring observers closer to
  what sellers reported feeling. In a second experiment, 96 observers who later
  learned the outcomes misremembered their first ratings towards the ending and
  were most confident they had seen it coming where their memory had moved
  furthest.
topic: >-
  Outcome knowledge and the retrospective reading of facial emotion: observers
  told how a recorded negotiation ended re-read the negotiators' faces to fit
  the ending, a hindsight effect in emotion recognition
