title: Read After the Ending
subtitle: Outcome Knowledge and the Recognition of Emotion in Negotiators' Faces
authors:
  - Anselm Threlkeld
  - Signy Okpara
  - Vigdis Emenike
preset: paper
school: School of Settled Matters
