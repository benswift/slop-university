summary: >-
  A research poster from the School of Continuous Improvement closes the oxidant
  mass balance for a model oxidovanadium(V) haloperoxidase mimic across seven
  loadings of an arene trap. The share of consumed peroxide recovered as
  brominated product rises from 22% to 74% while peroxide consumption barely
  changes, so turnover numbers counted by peroxide overstate those counted by
  product 1.3 to 4.5 times; the rest leaves the flask as oxygen.
