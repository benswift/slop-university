title: >-
  Interviewing Sixteen Shopping-Centre Phone-Repair Kiosks About Quotes That
  Never Return
subtitle: A Repairability Credit Printed on Every Quote
authors:
  - Lindiwe Achterberg
  - Kwame Lindqvist
  - Ronja Oyelaran
preset: paper
school: School of Emergent Priorities
