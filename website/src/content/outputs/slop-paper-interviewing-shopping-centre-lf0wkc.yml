doi: 10.5555/slop.lf0wkc
summary: >-
  A paper from the School of Emergent Priorities interviews 19 technicians at
  16 shopping-centre phone-repair kiosks and follows 1,847 cracked-screen
  quotes for 28 days, finding 71.4% never return, then specifies a
  Repairability Credit printed on every quote so a circular-economy dashboard
  can be steered from credits issued rather than screens replaced.
