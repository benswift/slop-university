doi: 10.5555/slop.1072nr
summary: >-
  A paper from the School of Continuous Improvement audits twenty-two leisure
  centres against a five-stage Cancellation Recovery Maturity Index and finds
  assigned stage correlates only weakly with an independently logged measure
  of public court availability, tracing most of the gap to venues
  re-releasing cancelled slots to an internal waitlist the Index cannot
  distinguish from a public one.
topic: >-
  The Cancellation Recovery Maturity Index scores each contracted leisure
  centre's court-booking software on how fast a same-day cancellation
  reappears as bookable, sorting every venue into one of five named stages;
  venues that reach Stage 4 largely do so by re-releasing slots to an
  internal waitlist invisible to ordinary members, and any venue stalled
  below Stage 3 for two consecutive quarters is struck from the University's
  Preferred Venue Directory.
