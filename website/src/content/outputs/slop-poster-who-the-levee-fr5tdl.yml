doi: 10.5555/slop.fr5tdl
summary: >-
  A research poster from the School of Continuous Improvement reads 398
  passages in a century of council and levee-trust minutes from one small
  inland river town for whom its flood levee, raised seven times, was said to
  be built. "Our children" gives way to future ratepayers as the raisings are
  financed by borrowing, and the ratepayer to the asset's users once the town
  plans to a forecast, so that the non-reciprocal duty Jonas finds in a
  parent's care becomes, in the minutes, first a relation of repayment and
  then one of service.
topic: >-
  Who the levee is for: how an invented river town's council minutes named
  the future residents of its flood levee across a century of raisings, from
  our children to future ratepayers to asset users, read through Jonas's
  imperative of responsibility
