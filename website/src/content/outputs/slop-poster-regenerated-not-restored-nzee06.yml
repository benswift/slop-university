doi: 10.5555/slop.nzee06
summary: >-
  A research poster from the School of Settled Matters divides one batch of
  Cu/ZnO/Al₂O₃ catalyst into four charges, runs each through a different
  120-hour first campaign (none, CO-rich syngas, CO₂/H₂, and CO₂/H₂ with 2 vol%
  water), then regenerates all four identically six times. Every bed's CO₂
  conversion returns to within 3% of the fresh bed's by the second
  regeneration, but the water-campaign bed's methanol selectivity remains 6.1
  points below fresh after the sixth, with its copper surface area still 17%
  lower.
topic: >-
  regenerated, not restored: whether a copper methanol-synthesis catalyst bed
  carries the feed history of its earlier campaigns through repeated
  oxidation-reduction regeneration into CO2 hydrogenation
