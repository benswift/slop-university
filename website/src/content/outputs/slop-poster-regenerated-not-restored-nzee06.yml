title: Regenerated, Not Restored
subtitle: Campaign history and methanol selectivity across six regenerations of one Cu/ZnO/Al₂O₃ batch
authors:
  - Clemency Tredinnick
  - Eskil Nwabueze
  - Odalys Penhallow
preset: research-poster
school: School of Settled Matters
