title: "Towards a Quadrant Framework for Loyalty Punch-Card Retention"
subtitle: "Tempo, Completion, and an Eleven-Outlet Café Chain's Refurbishment Budget"
authors:
  - Bram Ntuli
  - Casimir Beng
  - Thandiwe Solberg
preset: paper
school: School of Continuous Improvement
date: 2026-08-28
publishedAt: 2026-08-28T01:32:18+10:00
doi: 10.5555/slop.lb797o
summary: >-
  A paper from the School of Continuous Improvement sorts eighteen months of
  loyalty punch-card histories from an eleven-outlet café chain into a
  two-axis quadrant of stamping tempo and completion, and finds the resulting
  outlet ranking correlates weakly, and if anything negatively, with which
  outlets are actually losing custom. The University recommends the chain's
  executive committee adopt the quadrant as the basis for next year's
  store-refurbishment allocation regardless.
topic: >-
  Roughly one in five paper loyalty punch-cards at a strip-mall cafe chain
  never reaches its tenth stamp, and this paper proposes sorting each card's
  stamping history into a two-by-two quadrant -- Sustained Engagement,
  Front-Loaded Enthusiasm, Deferred Completion, Silent Attrition -- put
  forward as the instrument by which the chain's executive committee should
  allocate next year's store-refurbishment budget.
