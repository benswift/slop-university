title: The Queue as Leading Indicator, Explained
subtitle: Casimir Beng, Osei Vandermeer and Anneke Tolan on the coffee-cart queue
  that ran two quarters ahead of the University's ranking
authors:
  - Casimir Beng
  - Osei Vandermeer
  - Anneke Tolan
preset: video-explainer
school: School of Continuous Improvement
date: 2026-10-20
publishedAt: "2026-10-20T00:47:10+11:00"
doi: 10.5555/slop.4ek2jf
summary: A research explainer from the School of Continuous Improvement on Casimir
  Beng, Osei Vandermeer and Anneke Tolan's two-year study of campus coffee-cart queues
  and the University's international ranking. It follows the depth-sensor readings
  from nine carts to the March 2024 queue peak that preceded the September 2024 ranking
  rise, then sets out the closed-loop pilot the team proposes. Vandermeer, Tolan and
  Beng describe the work in their own words.
topic: A research explainer of the poster pairing de-identified coffee-cart queue-length
  telemetry with the University's international ranking position, in which the queue-length
  index led ranking movements by two quarters (peak cross-correlation r = 0.78), and
  of the closed-loop pilot it proposes to steer a fixed share of discretionary grant
  strategy from the live index
