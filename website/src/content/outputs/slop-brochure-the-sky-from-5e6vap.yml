summary: >-
  A prospectus brochure in which the School of Underlying Conditions offers
  astrophysics to applicants as a subject studied from underneath: the rock
  overhead as part of a detector, the soil profile as a record of what settles
  out of the sky, and the monitoring bore as a window onto water that last met
  the air long ago. Four features, each with a researcher's voice, lead to five
  published studies from three of the University's Schools, cited by title and
  DOI.
topic: >-
  the sky from below: a prospectus inviting students to study cosmic phenomena
  in the School of Underlying Conditions, reading cosmic rays, meteoritic dust
  and supernova traces in rock, soil and drill core
