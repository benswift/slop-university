summary: >-
  A marketing poster for the School of Emergent Priorities compresses the
  published finding of "Documented by Subtraction" --- that coverage scores at
  volunteer-run local museums rise before an accreditation review largely
  through what is disposed of rather than what is catalogued --- into a single
  portrait signage panel. A country history shed carries crowded lower shelves
  against emptied upper ones, with the study title and its DOI in place of a
  course list, in matched daylight and evening versions.
