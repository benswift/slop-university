title: Scored, Not Surprised
subtitle: >-
  A Season-Long Comparison of a Checkout-History Late-Return Score Against a
  Neighbourhood Tool Library's Volunteer Roster Shortlist, Made Blind to
  Each Other
authors:
  - Renke Sabel
  - Osei Vandermeer
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-08-10
publishedAt: "2026-08-10T20:01:03+10:00"
doi: 10.5555/slop.dq8md6
summary: >-
  A paper from the School of Continuous Improvement builds a Return
  Punctuality Score from each member's checkout history at three
  neighbourhood tool libraries and flags the members most likely to return a
  tool late over a 22-week season, benchmarking it against each branch's
  volunteer coordinator's own blind shortlist of expected late returners.
  The two shortlists achieve statistically indistinguishable precision and
  name more than half the same members, and an ablation removing the
  score's most heavily weighted feature leaves its performance unchanged.
topic: >-
  a neighbourhood tool library's booking system logs a due-back date when a
  member checks out a drill, ladder, or mower, but the volunteer roster at
  the front desk has always relied on its own gut feel about which
  borrowers tend to run late; designing and field-testing a simple
  overdue-prediction scoring tool built from each member's checkout
  history, then comparing the tool's predicted late-returners for a season
  against the roster's own informal shortlist, made before either list was
  seen
