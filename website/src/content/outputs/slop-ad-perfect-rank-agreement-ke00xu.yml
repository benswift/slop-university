summary: >-
  A marketing poster for the School of Underlying Conditions sets a rank
  correlation of 1.00 in gold display type for the order of beds across every
  borehole the School has logged, the metres the drill did not recover
  included. Set over a core shed in which taut strings tie each band in one
  tray to its match in the next, it is rendered for the portrait signage
  rotation in light and dark variants and closes on three works from the
  University's published record.
