summary: >-
  A case for support from the School of Underlying Conditions presents the
  University's coastal research as the study of ground that the tide, the wave
  and the storm keep carrying off and returning: cores pushed into tidal flats,
  monitoring bores behind the dunes, the slack water in which estuarine mud
  settles, and the dune closures community groups keep in place. Seven
  published outputs from three Schools, each cited by title and DOI, carry the
  invitation to partners and supporters.
topic: >-
  ground that comes and goes: the case for supporting the School of Underlying
  Conditions' research on coasts, where sand, mud and shingle are carried off
  and returned by tide, wave and storm
