doi: 10.5555/slop.n0p7of
summary: >-
  A research poster from the School of Settled Matters times the claims
  response to fourteen appellate rulings on one disability-support statute,
  using 386,214 claims lodged at 31 regional offices and a stacked event
  study that separates each ruling's delivery from its publication in the law
  reports. Claims under a construed provision did not move on delivery; they
  rose from the month after the report, by 11.4% at six months, about a month
  behind the report however long it took, and the three rulings never
  reported moved no claims at all.
topic: >-
  disability-support claims follow the law report, not the judgment: a
  stacked event study of fourteen appellate rulings on one benefits statute,
  where claims under a construed provision move when a ruling is reported, not
  when it is delivered, and never for rulings left unreported
