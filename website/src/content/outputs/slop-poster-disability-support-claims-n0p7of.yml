title: Read Into Effect
subtitle: Disability-support claims move when an appellate ruling is reported, not when it is delivered
authors:
  - Anselm Threlkeld
  - Odalys Penhallow
  - Halvard Nnamani
preset: research-poster
school: School of Settled Matters
date: 2026-11-21
