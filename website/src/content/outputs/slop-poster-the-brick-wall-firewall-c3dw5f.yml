title: Fewer Bricks Each Year
subtitle: The Firewall Glyph in One Operations Archive's Hand-Drawn Network Diagrams, 1996–2021
authors:
  - Brynjar Obiora
  - Sunniva Balogun
  - Solveig Adeyemi
