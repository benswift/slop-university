summary: >-
  A research poster from the School of Underlying Conditions reads the
  brick-wall sign for a firewall, drawn on 288 of 412 hand-drawn network
  diagrams in a decommissioned security operations centre's incident binders
  between 1996 and 2021, as an art historian reads a motif. The median glyph
  thins from six brick courses to one and a written label arrives as the bricks
  go, while the closed line drawn round the inside network outlasts the wall
  drawn across it by about a decade.
topic: >-
  the brick-wall firewall glyph read as a motif in an operations archive's
  hand-drawn network diagrams, its brickwork thinning toward a bare labelled
  box over a quarter-century of incident binders
