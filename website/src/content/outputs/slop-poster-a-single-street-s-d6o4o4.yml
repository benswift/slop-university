doi: 10.5555/slop.d6o4o4
summary: >-
  A single-site case study reports a street tool-share co-op's booking app
  suspending a nine-review member the moment one unfavourable review crossed
  its 4.2-star trusted-borrower floor, and follows the committee's decision to
  fix that threshold, and its no-override clause, into its own constitution.
topic: >-
  a single street's tool-share booking app enforces a 4.2-star
  trusted-borrower threshold; a single late-and-muddy review drops one co-op
  member below it and triggers an automatic suspension with no human
  override, told as a single-site case study with discussion questions
