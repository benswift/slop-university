title: Fixing Nitrogen Close to the Ground
subtitle: Slop University's Strategic Plan 2026-2031 takes its ammonia synthesis and nitrogen-reduction research to small plants on farmland, and to the land settings that will bind them
authors:
  - Clemency Tredinnick
  - Brynjar Obiora
  - Odalys Penhallow
