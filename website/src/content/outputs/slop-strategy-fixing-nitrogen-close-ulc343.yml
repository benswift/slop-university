doi: 10.5555/slop.ulc343
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the University's ammonia
  synthesis and nitrogen-reduction research to small, intermittently powered
  plants sited on farmland rather than at bench or industrial scale. Its four
  priorities pair farm-scale demonstration sites and field-conditions catalysis
  with model land instruments carrying a stated purpose, term and release, and
  with whole-pathway nitrogen accounts that measure success by what the soil
  retains.
