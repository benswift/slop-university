title: The Roster Outlived the Well
subtitle: Common Wells, a Survey Line, and the Persistence of Turn-Taking Norms in a Semi-Arid Basin
authors:
  - Vigdis Emenike
  - Ylva Onyekwere
preset: paper
school: School of Underlying Conditions
date: 2026-10-27
publishedAt: "2026-10-27T16:01:25+11:00"
doi: 10.5555/slop.4bnlor
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities estimates a spatial regression discontinuity at an 1870s survey
  line that divided one semi-arid basin between village blocks watered by
  wells kept in common under rotation rosters and selections each sinking a
  private well. Among 1,186 surveyed households, those just north of the line
  hold turn-taking norms 0.31 SD stronger but do not differ in generalised
  trust, conservation values or volunteering hours; the gap is as large among
  recent arrivals as among old families, northern community rosters still run
  by fixed rotation, and in four localities a hall or cemetery roster keeps the
  allotment order of the last well roster of 1931.
topic: >-
  wells dug in common: how nineteenth-century shared and private groundwater
  access on either side of an old survey line still shapes cooperative values
  in a semi-arid basin
