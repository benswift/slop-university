doi: 10.5555/slop.p3b5f5
summary: >-
  The Department of Policy Settings answers five questions on reservation
  R-0094, a 1979 instrument that keeps four basement rooms of the Sciences
  Annexe without fixed lighting, taken on notice at the Committee on Settings
  Oversight's Spring hearings of 13 November 2026 or lodged in writing after
  them. Its answers set out the criteria on which the reservation was recorded
  as spent while holding no record of its purpose; report 114 bookings of the
  rooms this year without being able to say what they were for; decline to sort
  37 variation files by their grounds; leave the hold-off period for the
  proposed lighting to consultation; and propose a consultation paper early in
  2027.
topic: >-
  the darkness reservation over the basement measurement rooms: the Committee
