summary: >-
  A research poster from the School of Underlying Conditions follows 612
  hydrogeology graduates of one provincial public university who completed
  their coursework between the 2006 and 2019 entry cohorts, splitting them by
  whether the licenciatura thesis they proposed needed one field campaign or
  bore readings across a dry and a wet season. Five years after coursework,
  71 per cent of single-campaign graduates are titled against 41 per cent on
  two-season designs, the curves parting at the first wet season, and
  interviews with 31 untitled graduates find most had taken paid monitoring
  work before their second campaign.
topic: >-
  a cohort and interview study of hydrogeology graduates at an unnamed
  provincial public university in the Andes who passed every course but never
  submitted the licenciatura thesis, whose two-season bore-monitoring
  fieldwork outlasts the student
