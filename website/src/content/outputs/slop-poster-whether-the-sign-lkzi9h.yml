doi: 10.5555/slop.lkzi9h
summary: >-
  A research poster from the School of Settled Matters reads the sign
  convention of the gauge coupling separately from the quark-gluon and
  three-gluon vertices of 57 sets of graduate QCD lecture notes in one
  departmental teaching archive, finding that the two agree in 50 sets and
  disagree in 7, each of which fails the tree-level Ward identity for
  quark-antiquark annihilation to two gluons, and that none of the 22 sets
  deriving the three-gluon vertex from its own Lagrangian mixes conventions.
topic: >-
  whether the sign convention in the covariant derivative survives the trip to
  the three-gluon vertex, across a teaching archive of graduate QCD lecture
  notes, checked by the Ward identity for quark-antiquark annihilation to two
  gluons
