title: Choose the Sign Once
subtitle: Covariant-derivative conventions and the three-gluon vertex in a teaching archive of QCD lecture notes
authors:
  - Anselm Threlkeld
  - Ylva Onyekwere
preset: research-poster
school: School of Settled Matters
