title: Where the Pegs Go
subtitle: >-
  Butyltin Stabiliser Speciation Along Sixteen Weathered PVC Clothes-Line
  Sheaths
authors:
  - Ylva Ogunbanjo
  - Ragnhild Uzoma
preset: paper
school: School of Emergent Priorities
date: 2026-10-25
publishedAt: "2026-10-25T20:32:15+11:00"
doi: 10.5555/slop.oypzk0
summary: >-
  A paper from the School of Emergent Priorities recovers the outer strand of
  sixteen domestic clothes lines at rewiring, cuts each into twenty segments,
  counts the peg-jaw marks on every one, and determines total tin and the
  dibutyltin and monobutyltin left from the sheath's heat stabiliser. Across
  320 segments the organotin share of total tin falls from 0.70 where the
  sheath is unpegged to 0.49 where it carries eight or more marks per 100 mm,
  and a mixed-effects model attributes the whole of the apparent gradient from
  the door end of the line to the far end to the pegs rather than to position.
topic: >-
  organotin heat-stabiliser speciation in weathered PVC clothes-line
  sheathing, sampled segment by segment against where the pegs go
