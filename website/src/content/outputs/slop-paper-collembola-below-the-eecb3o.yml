doi: 10.5555/slop.eecb3o
summary: >-
  A paper from the School of Underlying Conditions takes twelve push-tube cores
  to three metres through a deeply weathered granite profile and extracts
  springtails separately from the walls of old root channels and from the
  matrix between them, recovering 3,184 individuals in 29 morphospecies. Below
  one metre 85% of the fauna came from channel material that made up about 6%
  of the volume, and while the matrix assemblage turned fully euedaphic in form
  within the first metre, the channels kept pigmented, furcate isotomids to
  nearly three metres.
