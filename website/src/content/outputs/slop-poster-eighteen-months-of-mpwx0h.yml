summary: >-
  A research poster from the School of Emergent Priorities reads nine thermal-oxide
  check wafers on a shared spectroscopic ellipsometer every week for 78 weeks,
  three each stored in an open drawer, a single-wafer box and a nitrogen-purged
  cabinet, and finds apparent thickness rose on all nine, by about a nanometre
  in the drawer, while every weekly acceptance check passed because the check's
  window followed the wafer; one UV-ozone clean returned all nine to within
  0.12 nm of week 0.
topic: >-
  eighteen months of apparent film growth on a shared ellipsometer's silicon
  check wafers, and how much of it storage in a drawer, a wafer box or a
  nitrogen cabinet explains
