summary: >-
  A marketing poster for Slop University sets a grid of coring tubes across the
  floor of a drained farm dam and points passers-by to the School of Underlying
  Conditions' study of how few cores a dam's infill needs. Developed for
  bus-stop panels and campus digital signage in a landscape rotation, it cites
  three further studies of dams and cores beneath its call to action.
