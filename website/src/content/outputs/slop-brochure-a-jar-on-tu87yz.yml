summary: >-
  A civic brochure led by the School of Continuous Improvement invites the
  district's households to join the University's rain-sampling network, in
  which a collecting jar on a fence post is emptied each month so the rain's
  isotopic signature can be read beside water from the district's bores. It
  features the Schools of Continuous Improvement, Underlying Conditions and
  Emergent Priorities, the public evenings where results return to the town,
  and six published studies cited by title and DOI.
topic: >-
  a jar on the fence post: a civic brochure on the University's public
  rain-sampling network, where households collect each month's rain so its
  isotopes can show which storms refill the town's groundwater
