summary: Dr Dagny Okafor, Lecturer and Convenor of Evaluation of Evaluation, sets
  out in her own words the program's interest in the checks an institution runs on
  itself, from a warehouse's food-safety tick box to a committee's signed minutes
  and a line manager's approval click, and in what those checks change. Along the
  way the video notes that her lead-authored paper on the tick box is among the three
  most cited outputs in the University's research repository, and that she holds the
  Deposit of the Quarter Prize.
topic: "a promo profile of Dr Dagny Okafor, Convenor of Evaluation of Evaluation,
  in her own voice: an evaluation methodologist who studies the checks an institution
  runs on itself and asks what they change, and whose lead-authored paper on a warehouse
  tick box is one of the University's three most cited outputs"
