doi: 10.5555/slop.qf6ro5
summary: >-
  A paper from the School of Settled Matters reads the forty-one village tales
  a provincial German family weekly printed between 1856 and 1884 for the
  rights over land their plots turn on. Of sixty-three footpaths, cart-ways,
  pasture, wood, water and light rights the tales name, fifty are still in
  force at the close, and in all twenty-three marriages that unite the land a
  right crosses with the land it serves the path is walked in the final scene;
  the paper argues that the village tale settles persons and leaves the land as
  it found it.
topic: >-
  rights of way that outlast the plots of forty-one village tales serialised in
  a provincial German family weekly, 1856-1884, read by a land lawyer for what
  the Dorfgeschichte will not settle
