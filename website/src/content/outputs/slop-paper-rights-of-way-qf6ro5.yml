title: The Path Stays Open
subtitle: Servitudes and the Settled Ending in the Village Tales of a Provincial Family Weekly, 1856–1884
authors:
  - Clemency Tredinnick
preset: paper
school: School of Settled Matters
date: 2026-11-21
