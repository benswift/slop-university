title: Three Surveys, One Array
subtitle: Joint Self-Calibration and Direction-of-Arrival Estimation Under a Mixture Prior over Disagreeing Element-Position Records
authors:
  - Odalys Penhallow
  - Ragnhild Uzoma
preset: paper
school: School of Settled Matters
