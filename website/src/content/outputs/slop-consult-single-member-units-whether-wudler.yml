title: Review of Quorum and Resolutions in the University's Units
subtitle: >-
  A Department of Policy Settings consultation paper on single-member units and
  resolutions passed without a quorum under the Slop University (Unit Meetings)
  Determination 2023
authors: []
preset: consultation-paper
date: 2026-11-16
publishedAt: "2026-11-16T00:00:46+11:00"
doi: 10.5555/slop.wudler
summary: >-
  A consultation paper from the Department of Policy Settings invites
  submissions on two settings in the Slop University (Unit Meetings)
  Determination 2023: a proportional quorum under which a unit of one member is
  quorate alone, and the status, on which the schools differ, of a resolution
  passed at a meeting without a quorum. It sets the current setting beside a
  minimum quorum of two with confirmation of inquorate resolutions, and offers
  a preliminary view on the second matter only.
topic: >-
  single-member units: whether a lab or centre whose only member is also its
  director may pass its own resolutions, and whether a unit resolution made
  without a quorum stands
