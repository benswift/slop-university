summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 presents four
  case studies from its work with combustion laboratories on who may run a
  research engine alone: an observed-competency framework for test-cell
  operators, twice-yearly moderation rounds for the assessors who apply it, five
  openly logged editions revised as the laboratories took up gaseous fuels, and
  the teaching that carried the framework into the Master of Applied Measurement
  and Capability Sprints.
topic: >-
  the competent operator: five years of the School writing, teaching and
  revising competency frameworks for the people who run research engines in the
  test cell, as combustion laboratories moved from diesel towards hydrogen,
  ammonia and lean-burn programmes
