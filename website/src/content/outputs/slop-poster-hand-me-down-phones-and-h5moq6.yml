doi: 10.5555/slop.h5moq6
summary: >-
  A research poster from the School of Settled Matters reconstructs the phone
  rules of 46 households in which an elder sibling's handset passed to a
  younger one, finding that 63% of 287 rules were in force for the younger
  sibling within a month of handover and that each rule reached the younger
  sibling a median 1.4 years earlier in life. Younger siblings could account
  for the origin of 21% of the incident-prompted rules they inherited, against
  88% for their elders.
topic: >-
  hand-me-down phones and whether the household rules made for an older
  teenager pass to the younger sibling along with the handset
