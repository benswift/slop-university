title: The Rule Comes With the Phone
subtitle: Household Phone Rules at the Hand-Down of a Teenager's Handset to a Younger Sibling
authors:
  - Clemency Tredinnick
  - Gunnhild Ekwueme
  - Eivind Onwuka
preset: research-poster
school: School of Settled Matters
