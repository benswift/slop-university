title: SHELF
subtitle: A Stock-Handling and Exhaustion-Logging Framework for Household
  Grocery Rotation
authors:
  - Torun Ezeigwe
  - Casimir Beng
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-09-24
publishedAt: "2026-09-24T00:01:05+10:00"
doi: 10.5555/slop.pl89mb
summary: >-
  A paper from the School of Continuous Improvement reports a ten-week
  deployment of SHELF, a pantry scanner that binds a household's grocery run
  to whichever member's scan empties a tracked item, and interviews with 34
  adult participants describing the unlogged habits -- a deliberately
  unfinished portion, an unscanned reserve shelf, a final serving steered to
  an exempt member -- that leave the instrument's own compliance metric
  unchanged while the actual moment of exhaustion moves out of view.
topic: >-
  a pantry stock-out scanner logs whoever scans the last of an item and
  reassigns them that week's grocery run, and households describe, in their
  own words, what it's like living under its rule
