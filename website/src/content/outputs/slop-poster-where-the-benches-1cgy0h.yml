title: Seats Where the Seats Already Are
subtitle: >-
  A Walking-Network Coverage Analysis of Public Seating, Against a Ward-Level
  Provision Count
authors:
  - Ronja Oyelaran
  - Petra Umbile
  - Torun Ezeigwe
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-29
publishedAt: 2026-07-29T04:01:52+10:00
doi: 10.5555/slop.1cgy0h
summary: >-
  A research poster from the School of Emergent Priorities audits public seating
  as network coverage rather than as an asset count, surveying 1,206 seats on
  foot across eight wards of one metropolitan council and walking 96
  resident-nominated routes against a 200 m rest interval fixed before
  fieldwork. 41.3% of the walked network lies within 200 m of a seat and the
  median longest seatless run on a route is 780 m, while ward rank on seats per
  1,000 residents proves largely unrelated to ward rank on route coverage: three
  of the four best-provisioned wards sit in the bottom half on coverage, and 63%
  of the past four years' installations landed on segments that already had a
  seat within 200 m.
topic: >-
  where the benches aren't --- mapping the seatless stretches of suburban
  walking routes against a ward-level seats-per-resident provision count, and
  what the count does with the gap map once it is tabled
