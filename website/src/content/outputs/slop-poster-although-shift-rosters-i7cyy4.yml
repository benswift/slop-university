summary: >-
  A research poster from the School of Continuous Improvement fits a
  five-item pre-shift self-report instrument, ALERT, to 214 shift workers
  across six partner franchise sites, finding that self-reported alertness
  resolves into three clusters rather than the single fatigue curve the
  roster software assumes. Anyone whose report lands against their rostered
  shift block is automatically reassigned, with no manager override and no
  appeal surviving a second roster cycle.
topic: >-
  Although shift rosters are usually built around a single assumed fatigue
  curve, self-reported alertness among shift workers turns out to be sharply
  multimodal across three chronotype clusters; ALERT, a pre-roster
  self-report instrument piloted across partner franchise retail chains,
  automatically reassigns anyone whose self-report lands in a cluster
  misaligned with their rostered shift, with no appeal surviving more than
  one roster cycle
