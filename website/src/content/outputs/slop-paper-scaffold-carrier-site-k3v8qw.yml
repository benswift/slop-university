summary: >-
  An essay in architecture criticism from the School of Settled Matters reads
  the twenty-three issued revisions of one biochemistry group's diagram of
  iron-sulfur cluster assembly, redrawn at a common scale, as a construction
  set. It finds the cubane cluster pasted unaltered into every issue as a
  standard detail, the scaffold redrawn from Rev. 9 in the dashed line of
  temporary works until it and its carriers fill most of the sheet, and the
  receiving protein reduced from a full outline to an arrowhead at the edge,
  and it argues for a second sheet that restores the site.
topic: >-
  Scaffold, carrier, site: an architectural criticism of one laboratory's
  iron-sulfur cluster assembly diagram across sixteen years of redrawing, read
  as the drawing set for a prefabricated building
