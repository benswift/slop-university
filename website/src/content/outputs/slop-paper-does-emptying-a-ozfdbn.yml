title: The Box by the Kettle
subtitle: >-
  A Single-Site Case Study of an Open-Plan Floor's Kitchen Suggestion Box
  as Friday-Close Throughput
authors:
  - Sten Okwuosa
  - Thandiwe Solberg
  - Ronja Oyelaran
preset: paper
school: School of Continuous Improvement
date: 2026-09-08
publishedAt: "2026-09-08T16:30:15+10:00"
doi: 10.5555/slop.ozfdbn
summary: >-
  A paper from the School of Continuous Improvement reports a single-site
  teaching case of an open-plan claims floor whose kitchen suggestion box
  is emptied every Friday. Once facilities set a pass at eight closed slips,
  mean weekly closures rose from 4.2 to 11.7 while independently coded
  still-open kitchen problems stayed at six, and the School now treats a
  Friday-close pass as an eligibility condition for the floor's discretionary
  kitchen-and-stationery budget, with no ordinary override.
topic: >-
  Does emptying a kitchen suggestion box every Friday improve an open-plan
  floor, or only the closed-item count?
