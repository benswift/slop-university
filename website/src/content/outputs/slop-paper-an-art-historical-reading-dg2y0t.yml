title: The Notch Was a Break
subtitle: A Mussel Plate and Its Copies in a Century of Regional Identification Keys, 1894–1987
authors:
  - Odalys Penhallow
preset: paper
school: School of Settled Matters
date: 2026-11-11
publishedAt: "2026-11-11T10:31:04+11:00"
doi: 10.5555/slop.dg2y0t
summary: >-
  An art-historical paper from the School of Settled Matters collates the
  fourteen printed states of one engraved freshwater-mussel plate across a
  river district's identification keys from 1894 to 1987, finding two families
  of copies, one descended from a reversing lithographic transfer of 1911. A
  notch that is a break in the surviving drawn shell persists in thirteen
  states, enters the keys' descriptions in 1931 and becomes a couplet in 1971,
  while the one state drawn afresh from shells, in 1962, was never copied.
topic: >-
  An art-historical reading of a century of regional identification keys for
  freshwater mussels: how one engraved shell plate, copied from guide to guide,
  drifted in each copy yet came to settle what the animal looks like
