title: What the Brush Leaves
subtitle: Abrasion wear and residual film on larval-tank liners after 140 clean-down cycles
authors:
  - Brynjar Obiora
  - Signy Okpara
  - Solveig Adeyemi
preset: research-poster
school: School of Underlying Conditions
