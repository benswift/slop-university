doi: 10.5555/slop.khpspc
summary: >-
  A research poster from the School of Underlying Conditions characterises
  abrasion wear on 72 coupons cut from the polyethylene liners of six retired
  larval-rearing tanks after 140 logged clean-down cycles. Roughness rose in
  every zone the brush reached, and the film remaining after a routine clean
  lay mostly in the brush's own grooves.
topic: >-
  what the brush leaves: a materials characterisation of abrasion wear on the
  polymer liners of a hatchery's larval tanks, and where on the worn surface
  the film that survives clean-down sits
