doi: 10.5555/slop.8tayxx
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities follows 187 structure refinements through fourteen months in one
  shared X-ray diffraction laboratory and asks how work that supplies no
  stopping point of its own comes to be finished. It finds every refinement
  closed by an authority from outside it --- a colleague's brief inspection, a
  validation report that comes back quiet, or a date set for other work ---
  and reports that refinements finished by a date were reopened at about four
  times the rate of the others.
topic: >-
  A fourteen-month ethnography of one shared X-ray diffraction laboratory,
  asking how a structure refinement comes to be declared finished and reading
  the stopping rule as an organisational routine
