title: The Look, the Report and the Calendar
subtitle: How a Structure Refinement Comes to Be Finished in a Shared Diffraction Laboratory
authors:
  - Brynjar Obiora
  - Iben Chikere
preset: paper
school: School of Underlying Conditions
date: 2026-10-11
