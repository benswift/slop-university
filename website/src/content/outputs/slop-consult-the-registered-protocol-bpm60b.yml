title: Registered Protocols and the Outputs Ledger
subtitle: >-
  A Department of Policy Settings consultation paper on whether a study protocol
  lodged before data collection should count as a research output, and on the
  citations made to it
authors: []
preset: consultation-paper
date: 2026-11-24
publishedAt: "2026-11-24T20:31:47+11:00"
doi: 10.5555/slop.bpm60b
summary: >-
  A consultation paper from the Department of Policy Settings invites
  submissions on the standing of a registered protocol under the Slop University
  (Research Outputs) Determination 2025, which records a protocol lodged before
  data collection in a register but does not treat it as an output or count the
  citations made to it. It reports how the register has been used across the
  four schools, draws on three of the University's pre-registered studies, and
  sets out three options, from retaining the current setting to holding a
  protocol and its report as one output under a single DOI, without forming a
  view between them.
topic: >-
  the registered-protocol setting: whether a study protocol lodged before data
  collection counts as a research output in the University's ledger, and whether
  citations to the protocol accrue to the report that follows it
