summary: >-
  A research showcase from the School of Underlying Conditions presents the
  School's work on supercapacitor materials as an extension of petrophysics:
  a bench that reads porous electrode carbons with the tools of the core
  laboratory, ordered alumina lattices used as moulds for reference carbons,
  and a field program in which the School's own monitoring loggers trial the
  results. Seven published outputs from two Schools, each cited by title and
  DOI, carry the account.
topic: >-
  every pore a reservoir: the School of Underlying Conditions reads
  supercapacitor carbons with the tools it built for reservoir rock --- pore
  throats, tortuosity, the thin section --- and runs its field loggers on what
  it learns
