title: The projectionist's interrupt starts the short eleven minutes after the advertised feature
subtitle: A house-lights controller for community film-society screenings, adopted as the University's seminar-slot stop
authors:
  - Sunniva Balogun
  - Anouk Mensah
  - Lindiwe Achterberg
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-22
