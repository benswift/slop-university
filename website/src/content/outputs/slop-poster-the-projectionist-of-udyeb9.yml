doi: 10.5555/slop.udyeb9
summary: >-
  A research poster from the School of Emergent Priorities describes a
  house-lights interrupt that auto-cues a community film society's waiting-list
  short eleven minutes after the advertised feature. Across 214 Saturday
  screenings the interrupt fires on 61% of features, and the Office of the
  Vice-Chancellor now binds seminar-slot allocation to the same eleven-minute
  stop, with no chair's override.
topic: >-
  The projectionist of a community film society built a start-time interrupt that
  auto-promotes the waiting-list short eleven minutes after the advertised
  feature; the University binds seminar-slot allocation to the same eleven-minute
  stop.
