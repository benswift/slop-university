doi: 10.5555/slop.64l0sb
summary: >-
  A research poster from the School of Underlying Conditions models a soil
  laboratory's particle-size bench as a discrete-event simulation of one
  technician mixing hydrometer cylinders and reading each at six fixed times,
  sweeping 4 to 16 cylinders against start staggers of 1 to 8 minutes in 105
  cells of 300 replications. Missed readings fall in a comb across the stagger
  rather than rising with the cylinder count: sixteen cylinders started 6.5
  minutes apart miss none, while four started 5 minutes apart miss 6.7%.
topic: >-
  A discrete-event simulation of a soil laboratory's particle-size bench, where
  each hydrometer cylinder must be read at fixed times after mixing, finding
  that the stagger between cylinder starts, not the number of cylinders, sets
  how many one technician can run without missing a timed reading
