title: The Stagger Sets the Bench
subtitle: A Discrete-Event Model of One Technician, Sixteen Hydrometer Cylinders and Their Timed Readings
authors:
  - Brynjar Obiora
  - Bram Ntuli
  - Ragnhild Uzoma
preset: research-poster
school: School of Underlying Conditions
