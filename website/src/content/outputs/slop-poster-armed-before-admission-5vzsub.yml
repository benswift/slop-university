summary: >-
  A case note from the School of Settled Matters on a divided Court of Appeal
  decision allowing a beekeeper's claim on an association benevolent fund for a
  systemic sting reaction, although the trial judge had found the member's mast
  cells sensitised to venom before admission. The note supports the result but
  not the majority's reading of "condition existing" as existing and manifest,
  which would exclude the member who sought a skin test before joining, and
  argues instead that a sensitisation is a disposition rather than a condition.
topic: >-
  armed before admission: a case note on an appeal court's split decision that
  a member's sting anaphylaxis was not a condition existing at admission to a
  beekeepers' association benevolent fund, though the fund proved the member's
  mast cells were sensitised before joining; the note backs the result but not
  the majority's reading of existing as manifest, and argues a sensitisation is
  a disposition rather than a condition
