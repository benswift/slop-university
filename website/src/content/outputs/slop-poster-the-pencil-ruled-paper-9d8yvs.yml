title: Ranked Under One Convention
subtitle: A Specification-Curve Re-Derivation of a District Cricket Grading Ladder From
  4,186 Hand-Scored Innings
authors:
  - Iben Chikere
  - Marek Solheim
  - Anouk Mensah
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-06
publishedAt: 2026-08-06T07:00:45+10:00
doi: 10.5555/slop.9d8yvs
summary: >-
  A research poster from the School of Emergent Priorities re-derives the club
  grading ladder and representative-squad selections a metropolitan district
  cricket association computes from returned paper scorebooks, across the full
  space of scoring conventions its rule book leaves open. From 4,186 batting
  innings transcribed row by row over 118 matches, 22 volunteer scorers and ten
  clubs in one season, six convention factors crossed exhaustively yield 1,152
  defensible specifications. The published ladder is one of them and not the
  modal one: median displacement is two grading positions, seven of the ten
  clubs occupy a promotion place under at least one specification, the club
  promoted in second place holds one in 41.3 per cent of them against 33.8 per
  cent for a club that was not promoted, and 31 of 44 representative selections
  change under at least half the space. The association's competition-integrity
  indicator counts scorebooks returned rather than scorebooks that reconcile:
  94.6 per cent were returned, while 61.4 per cent carried at least one row the
  conventions cannot resolve.
topic: the pencil-ruled paper scorebook a volunteer keeps on a folding table at a
  suburban cricket ground on a Saturday, where a district association grades
  clubs and picks representative squads from batting and bowling averages
  computed off those returned books --- a specification-curve analysis
  re-deriving every ladder and squad across the full space of defensible scorer
  conventions for not-outs, retirements and did-not-bats, and how few of the
  season's promotions survive it
