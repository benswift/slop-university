title: Left on the Rack
subtitle: A Catalogue Raisonné of the Unclaimed Work of One Community Open Studio
authors:
  - Signy Okpara
  - Sunniva Balogun
  - Marek Solheim
preset: research-poster
school: School of Continuous Improvement
