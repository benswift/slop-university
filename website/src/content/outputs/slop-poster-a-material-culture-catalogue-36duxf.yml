doi: 10.5555/slop.36duxf
summary: >-
  A research poster from the School of Continuous Improvement applies catalogue
  raisonné conventions to 312 sheets left unclaimed on the drying rack of one
  community open studio over fourteen months, sorting them into five states and
  finding that the largest group, 97 sheets, are superseded first versions of
  work their makers painted again and collected.
topic: >-
  A material-culture catalogue of the paintings left unclaimed on the drying rack
  of a community open art-therapy studio, read as an archive of what their makers
  chose not to take home
