title: Is Seven Between Three and Seven?
subtitle: How Year 8 Students Construe the Endpoints of a Range, and What a Classroom Ruling on “Between” Settled
authors:
  - Anselm Threlkeld
  - Odalys Penhallow
preset: paper
school: School of Settled Matters
date: 2026-11-12
publishedAt: "2026-11-12T22:00:23+11:00"
doi: 10.5555/slop.iqnx1e
summary: >-
  A paper from the School of Settled Matters follows 49 Year 8 students in two
  classes through three sittings of an instrument on eight boundary words, and
  through a teacher's ruling, made in one class after a dispute, that
  "between" excludes its endpoints. The ruling was adopted by 96% of that class
  within a week and spread unprompted to "from … to", but asked to word the
  numbers 3 to 7 for a stranger, its students most often wrote "between 2 and
  8": the ruling settled the word, not the habit of stating where a boundary
  falls.
topic: >-
  is seven between three and seven: how lower-secondary students construe the
  boundary words of a numerical range in word problems, and whether a class's
  ruling on 'between' settles anything beyond that word
