title: Towards an Audited Disclosure Standard for Newsletter Sending-Tier Thresholds
authors:
  - Sunniva Balogun
  - Anneke Tolan
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-09-28
publishedAt: "2026-09-28T19:00:05+10:00"
doi: 10.5555/slop.zes73i
summary: >-
  A paper from the School of Emergent Priorities treats a newsletter
  platform's fixed open-rate threshold as a naturally occurring
  regression-discontinuity cutoff, finding that crossing into full sending
  tier is followed by a rise in curiosity-gap subject-line phrasing and in
  unsubscribe rate with no matching rise in click-through, and proposes a
  published, audited registry of such thresholds through the Horizon
  Register.
topic: >-
  a regression-discontinuity design around a newsletter platform's fixed
  open-rate threshold, at which a sender's account moves from restricted to
  full sending tier, estimating the cutoff's effect on subsequent
  subject-line behaviour and unsubscribe rate
