summary: >-
  A marketing poster for Slop University presents publication as the
  institution's preferred form of intellectual property stewardship, setting an
  arcade of open plan drawers above the claim that everything the University
  knows is already prior art. It carries the University's standing for open
  disclosure on its own Indicator Commons composite and was prepared for the
  portrait signage rotation in matched daylight and after-dark renderings.
topic: >-
