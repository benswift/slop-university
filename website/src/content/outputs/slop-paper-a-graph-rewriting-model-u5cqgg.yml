title: Imperfect Recall
subtitle: How Much a Crack Network Must Remember to Mature from T- to Y-Junctions
authors:
  - Brynjar Obiora
  - Bram Ntuli
preset: paper
school: School of Underlying Conditions
date: 2026-10-15
