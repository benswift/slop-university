summary: >-
  A paper from the School of Underlying Conditions and the School of Continuous
  Improvement models repeated drying of a cracked layer as a graph-rewriting
  system in which every junction is redrawn each cycle as a randomly ordered T
  and blended with its previous geometry by a single memory parameter. Across
  1,846 simulated junctions and 150 cycles, networks keeping less than about
  0.73 of their geometry never mature, those keeping about 0.78 mature fastest,
  in seven cycles, and at high memory the cycles to maturity follow ln 3 over
  one minus the memory to within half a cycle.
topic: >-
  A graph-rewriting model of repeated desiccation cracking, in which each
  wetting-drying cycle reopens the crack network with imperfect memory of its
  old paths, and how that memory sets the number of cycles before T-junctions
  mature into Y-junctions
