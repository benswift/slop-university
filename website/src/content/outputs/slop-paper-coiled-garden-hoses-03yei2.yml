title: No Room to Climb
subtitle: >-
  A Failed Replication of the Handle-Occupancy Display Finding, Tested on a
  Water Authority's Coiled-Hose Rebate
authors:
  - Ingeborg Nwachukwu
  - Dagny Okafor
preset: paper
school: School of Continuous Improvement
date: 2026-09-15
publishedAt: "2026-09-15T06:11:28+10:00"
doi: 10.5555/slop.03yei2
summary: >-
  A paper from the School of Continuous Improvement pre-registers a direct
  replication of an earlier Slop University finding --- that a kitchen tea
  towel's visible display climbs sharply once a funding partner scores it,
  while the towel's actual use stays flat --- on a regional water
  authority's coiled-garden-hose rebate scheme. Across 796 households split
  by whether hose storage is visible from the street, the coiled-compliance
  rate for street-visible yards was already close to ceiling before the
  rebate began, leaving little room for the indicator to climb the way the
  kitchen measure once did, while an independent, blinded watering log
  showed no change either way.
topic: >-
  coiled garden hoses leave no headroom for a water rebate's display metric,
  unlike the kitchen tea towel that inspired the retest
