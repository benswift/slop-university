doi: 10.5555/slop.bhtgzo
summary: >-
  A research poster from the School of Settled Matters traces 1,186 lecture
  quotations in 241 essays from two cohorts of a second-year statutory
  interpretation course back to the recorded lectures they quote. Where the
  automatic caption and the audio diverge, 64% of the 403 affected quotations
  reproduce the caption's wording and 23% the audio, and caption-following
  falls but persists among students who attended in the room.
topic: >-
  how law students come to treat the auto-generated captions of recorded
  lectures as the authoritative text, quoting caption errors in their own
  essays
