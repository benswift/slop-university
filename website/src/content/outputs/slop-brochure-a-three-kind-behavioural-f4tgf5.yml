summary: >-
  A research-showcase brochure from the School of Emergent Priorities
  introduces the Trajectory Analytics Group's three-kind foraging taxonomy for
  the tea-room queue's resident pigeons, and reports Facilities' adoption of
  the taxonomy as the weekly register deciding which of the tea room's two
  doors the coffee queue must use.
topic: >-
  A three-kind behavioural taxonomy sorting the coffee queue's resident
  pigeons by foraging strategy, adopted by Facilities as the register that
  decides which entrance the tea-room coffee queue uses each week.
