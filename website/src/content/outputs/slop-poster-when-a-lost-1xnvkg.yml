title: What the Copybooks Determine
subtitle: Reconstructing a lost graded reader from its pupils' overlapping excerpts
authors:
  - Ragnhild Uzoma
  - Sunniva Balogun
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-16
