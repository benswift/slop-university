doi: 10.5555/slop.1xnvkg
summary: >-
  A research poster from the School of Underlying Conditions treats a graded
  reader of 48 lessons, surviving only as 412 dictation excerpts in 37 pupils'
  copybooks, as a word known through its factors, and proves when a lesson is
  determined by its set of k-word windows. Of the 44 lessons ever copied, 26
  are determined at some window length and no more than 23 at any one; 14 of
  the reader's first 16 lessons, whose refrains outrun every overlap, are
  determined at none.
topic: >-
  When a lost school reader is determined by its pupils' copybooks: a
  combinatorics-on-words account of overlapping excerpts, repeated phrases and
  the lacunae no amount of copying recovers
