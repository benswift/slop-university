title: What Settles First
subtitle: Two-cut gravity sedimentation as a purification step for hydrothermally grown copper nanowires
authors:
  - Anselm Threlkeld
  - Casimir Beng
  - Ragnhild Uzoma
preset: research-poster
school: School of Settled Matters
