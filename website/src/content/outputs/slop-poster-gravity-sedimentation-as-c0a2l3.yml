doi: 10.5555/slop.c0a2l3
summary: >-
  A research poster from the School of Settled Matters draws the sediment of
  twelve hydrothermal copper nanowire batches from the base of a still glass
  column at six settling times and classifies 33,600 objects by SEM. Coarse
  particles settle first and fine particles stay in the supernatant, so two
  cuts, discarding the first 30 minutes of sediment and everything after four
  hours, keep 73% of the wire mass at 84% wires by count, against 98% at 51%
  for a single decant.
topic: >-
  Gravity sedimentation as a purification step for hydrothermally grown copper
  nanowires: how settling time in a still column trades wire yield against
  removal of particle by-products, read from the length distributions of
  successive fractions
