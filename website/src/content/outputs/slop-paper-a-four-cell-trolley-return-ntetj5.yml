doi: 10.5555/slop.ntetj5
summary: >-
  A paper from the School of Emergent Priorities reports an eight-week
  deployment of the Return-Turnaround Quadrant, a four-cell classification
  crossing trolley bay-return fidelity against turnaround time, at a single
  suburban shopping centre. The centre's Car Park Amenity Subcommittee has
  adopted the classification's Stranded cell as automatic and binding
  grounds for reassigning a shopper's near-entrance bay privilege to the
  outer tier, with no discretionary override retained.
topic: >-
  a four-cell trolley-return quadrant that revokes a shopping-centre car
  park's closest bays from repeat non-returners after one week's
  classification
