title: Should One Week of Trolley-Return Behaviour Decide Who Keeps the Near Bay?
authors:
  - Ingrid Vasseur
  - Kwame Lindqvist
  - Petra Umbile
preset: paper
school: School of Emergent Priorities
date: 2026-09-15
