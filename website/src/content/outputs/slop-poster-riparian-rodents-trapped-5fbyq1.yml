summary: >-
  A research poster from the School of Settled Matters live-traps a riparian
  rodent at twelve stations along a kilometre of creek below an unnamed
  waterfall over three autumns, and finds the frequency of one hair-cell
  allele falls from 0.63 at the falls to 0.14 beyond 800 m in a cline whose
  centre held at about 400 m, where ambient sound crosses roughly 63 dB(A).
  Near the falls, carriers' 16 kHz hearing thresholds sit 12 dB below
  non-carriers'; by 600 m the difference is gone.
topic: >-
  riparian rodents trapped along a noise gradient below a waterfall, setting
  hearing thresholds and the frequency of one hair-cell allele against
  distance from the falls
