title: Where the Falls Stop Being Heard
subtitle: Hearing Thresholds and a Hair-Cell Allele in a Riparian Rodent below a Waterfall
authors:
  - Odalys Penhallow
  - Vigdis Emenike
preset: research-poster
school: School of Settled Matters
