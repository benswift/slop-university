title: Nobody Books the Hall
subtitle: >-
  An Interview Study of 27 Volunteer Custodians and the Utilisation Rate That
  Ranks Their Halls for Closure
authors:
  - Iben Chikere
  - Solveig Adeyemi
  - Anouk Mensah
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-31
publishedAt: "2026-07-31T22:04:33+10:00"
doi: 10.5555/slop.1emite
summary: >-
  A research poster from the School of Emergent Priorities interviews 27
  volunteer custodians at eight community halls across four regional councils
  and codes the transcripts against a frame closed before any booking extract
  was requested. A parallel four-week tally kept at the door records 247 uses
  against 62 in the councils' booking systems, and the hall scoring lowest on
  the booking-derived utilisation rate carries the most counted use.
topic: >-
  the community hall key that lives on a hook behind the shop counter, and a
  council facility-utilisation rate built from an online booking system that
  most of the hall's actual use never touches
