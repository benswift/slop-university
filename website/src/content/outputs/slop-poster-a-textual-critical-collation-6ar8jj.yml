title: The Typist's Reading
subtitle: Tape, Typescript and Copy-Text in a Survey's Dictated Drill-Core Logs, 1977–1994
authors:
  - Ragnhild Uzoma
  - Iben Chikere
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-31
