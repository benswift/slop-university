doi: 10.5555/slop.6ar8jj
summary: >-
  A research poster from the School of Underlying Conditions collates 214
  dictation cassettes against 1,846 typescript pages of a regional survey's
  drill-core logs and finds 611 technical emendations by the typing pool,
  rising with each typist's years of service. Where retained core allows a
  check it upholds the typescript at 121 of 148 places, and the poster proposes
  the typescript as copy-text, with the dictated readings in the apparatus.
topic: >-
  a textual-critical collation of a survey's dictated drill-core descriptions,
  surviving cassette tapes against the typing pool's typescripts, asking which
  is the copy-text when the typists began emending the geology
