summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to
  establishing a research and teaching capability in forensic toxicology and
  drug analysis, and to extending that field's disciplines to the University's
  own documents and determinations. Its four focus areas cover the chain of
  custody, the two-tier passage from presumptive screen to confirmatory
  analysis, the retained sample, and the preparation of staff and graduates to
  have a signed report examined.
topic: >-
  forensic toxicology capability and the chain of custody: a five-year
  institutional plan to move the University's analytical posture from
  presumptive to confirmatory
