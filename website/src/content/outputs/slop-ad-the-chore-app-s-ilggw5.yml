doi: 10.5555/slop.ilggw5
summary: >-
  A marketing poster for the School of Continuous Improvement introduces
  HARC, an instrument built to test whether a blank-reason correction effect
  documented at a national cleaning-services contractor extends to household
  chore-tracking apps. Fielded across ordinary kitchens for a full teaching
  period, it finds no comparable relationship between a skipped task's blank
  reason and whether that task is ever redone.
topic: >-
  The chore app's blank-reason field does not predict whether a skipped
  household task gets redone, a failed home replication of a cleaning
  contractor's audit-reversal finding
