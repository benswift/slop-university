title: Meet HARC
subtitle: >-
  The Household Absence-Reason Correlator, a Failed Home Replication of a
  Cleaning-Contractor Audit-Reversal Effect
authors:
  - Mirela Hanke
preset: marketing-poster
school: School of Continuous Improvement
