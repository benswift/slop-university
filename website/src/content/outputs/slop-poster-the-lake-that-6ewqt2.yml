summary: >-
  A research poster from the School of Underlying Conditions follows the stated
  after-use and closure year of 38 hard-rock quarries through fifteen years of
  their operators' sustainability reports, setting each beside the
  rehabilitation provision in the same year's accounts. Stated closure years
  recede at a median 0.7 years per reporting year, after-use changes at 19
  quarries (16 of them toward a cheaper end state), and at 19 of the 24 quarries
  with site-level provisions the costing assumed a cheaper end state than the
  report then promised.
topic: >-
  The lake that keeps moving: promised after-uses and receding closure dates
  across successive sustainability reports of hard-rock quarry operators, read
  against their rehabilitation provisions
