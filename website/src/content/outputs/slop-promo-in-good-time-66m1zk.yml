summary: "A short profile of Dr Osei Vandermeer, Research Fellow and Convenor of the
  Review Cadence Observatory, told largely in his own words. Dr Vandermeer came to
  the University from operational analytics in logistics, and describes the question
  the Observatory now puts to everything that gets checked: how often it should be,
  and how often it is, from a beekeeping club's fortnightly hive inspections to the
  University's defibrillator cabinets and a foundation's quarterly investment committee.
  The video also marks his standing as the University's most cited research fellow."
topic: "a promo profile of Dr Osei Vandermeer, the University's most cited research
