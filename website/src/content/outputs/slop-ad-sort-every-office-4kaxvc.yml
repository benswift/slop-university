summary: >-
  A marketing poster for the Master of Applied Measurement features Dr Torun
  Ezeigwe beside an open-plan office reception kiosk, where every visitor is
  sorted into one of four sign-in types --- delivery, meeting, interview, or
  unregistered --- before anyone at the desk asks what they actually came to
  do. Developed for bus-stop panels and campus digital signage in matched
  daylight and evening versions.
