summary: >-
  A research poster from the School of Continuous Improvement documents a
  parser that reads a primary school canteen's class group chat for
  volunteer offers and swaps and publishes the week's roster without
  convenor review, finding that a message read within the parser's first
  two minutes of an offer thread opening is locked in nine times out of ten,
  whatever auto-lock confidence threshold is in force that week.
topic: >-
  a primary school canteen's roster convenor no longer schedules volunteers
  by hand: a bot parses the class group chat for stand-in offers and swap
  requests and publishes the week's roster itself, leaving the convenor to
  explain the bot's picks to parents who disagree
