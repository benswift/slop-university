summary: >-
  A paper from the School of Underlying Conditions infuses a single lot of
  dried roselle calyces in groundwater from twelve monitoring bores and in
  deionised water under fixed conditions. Across the series the monomeric
  anthocyanin recovered falls to 89% of the deionised-water value and the
  colour of the infusion as poured to 55%, both in proportion to the
  alkalinity of the water; neutralising the alkalinity beforehand removes the
  effect, calcium without bicarbonate has none, and the one iron-bearing water
  lies below both trends.
topic: >-
