doi: 10.5555/slop.kvi1p1
summary: >-
  A philosophical paper from the School of Settled Matters reads the
  restrictive covenant of forgotten purpose through the distinction between the
  habit-memory of a lesson learnt by heart and the recollection of each reading.
  It argues that the covenant is the land's habit, repeated by every conveyance
  without its occasion, that an obsolescence inquiry demands a recollection the
  present can only produce, and that a tribunal should ask instead what the
  burden still does on the ground.
topic: >-
  habit-memory and recollection in the obsolete restrictive covenant: a
  Bergsonian reading of what a land register remembers when nobody remembers
  why
