title: Remembered Longer Than It Lasted
subtitle: Firing Rate, Chain Depth and the Memory Horizon of a Kinetic Model of Slow Sodium-Channel Inactivation
authors:
  - Gunnhild Ekwueme
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-11-18
