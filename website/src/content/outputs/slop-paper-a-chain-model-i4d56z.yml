doi: 10.5555/slop.i4d56z
summary: >-
  A modelling paper from the School of Emergent Priorities drives a linear
  chain of slow-inactivated sodium-channel states with trains of 2 ms spikes at
  10 and 40 Hz and finds that recovery outlasts every train shorter than a
  break-even duration of between 2.4 minutes and 5.0 hours, and that past a
  memory horizon a longer train no longer slows recovery at all. At 10 Hz the
  firing rate sets that horizon and a chain longer than four states changes
  nothing; at 40 Hz it moves from 76 seconds to 62 hours as the chain grows from
  four states to twelve, while the power-law exponent of recovery follows from
  the ratio of the chain's geometric rate factors to within 0.022.
topic: >-
  a chain model of slow sodium-channel inactivation in which a spike train's
  recovery outlasts the train itself, and the train length past which the
  channel stops remembering how long it fired
