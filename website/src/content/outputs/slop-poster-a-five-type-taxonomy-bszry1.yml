title: What Does the Yellow Badge Actually Certify?
subtitle: A Five-Kind Taxonomy of a Quick-Service Franchise's Trainee Badges and the Roster Rule It Became
authors:
  - Anouk Mensah
  - Torun Ezeigwe
preset: research-poster
school: School of Emergent Priorities
