doi: 10.5555/slop.bszry1
summary: >-
  A research poster from the School of Emergent Priorities sorts 214
  trainee-badge instances from a quick-service franchise into a five-kind
  taxonomy and finds the coded kind diverges from head office's own
  certification ledger in over a third of instances. The scheme built to
  describe that divergence is now the standard that decides who may be
  rostered to close a store alone.
topic: >-
  a five-type taxonomy that sorts a fast-food franchise's colour-coded
  trainee badges, and the rule the ladder became for who may be rostered to
  close alone
