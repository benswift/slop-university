summary: >-
  A marketing poster for Slop University invites applications to study law in
  the School of Settled Matters, borrowing from algebra the idea that some
  operations give different results in different orders and presenting the
  sequence in which legal provisions are applied as something students learn to
  read. Developed for portrait signage panels, it pictures two identical bound
  volumes turned through the same pair of quarter-turns in opposite order on a
  library desk.
