title: Self-Declared Annual Nights Cluster Just Below the Cap
subtitle: A Population Survey of Registered Short-Stay Hosts Under a State Letting
  Scheme's Fixed-Night Cap
authors:
  - Anouk Mensah
  - Runa Adegoke
  - Renke Sabel
preset: paper
school: School of Emergent Priorities
date: 2026-09-07
publishedAt: "2026-09-07T19:33:15+10:00"
doi: 10.5555/slop.es02n8
summary: >-
  A paper from the School of Emergent Priorities surveys 1,486 registered
  short-stay hosts under a state letting scheme's 180-night annual cap,
  finding self-declared totals spike sharply in the ten nights immediately
  below it, more so for multi-listing operators than owner-occupier hosts,
  and unmoved by a randomised audit-notice reminder. The University's
  Indicator Commons has since begun publishing the shape quarterly as the
  register's own Reference Heaping Profile, against which district data are
  now checked.
topic: >-
  A state short-stay-rental letting scheme requires hosts to self-declare
  their annual nights let against a fixed cap; surveying the self-declared
  totals across the registered population turns up a distribution that
  spikes just under the cap, and the scheme adopts that spike as the
  register's expected shape.
