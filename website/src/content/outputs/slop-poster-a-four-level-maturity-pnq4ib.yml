summary: >-
  A research poster from the School of Emergent Priorities scores 48 councils
  against a four-level maturity model for nature-strip and verge maintenance,
  and reports that stormwater-drainage grant priority follows the
  drone-audited certificate rather than the complaint backlog it was meant to
  track.
topic: >-
  a four-level maturity model scoring local councils' handling of nature-strip
  and verge overgrowth complaints, from a logged phone call to drone-audited
  grass-height certification, with stormwater-drainage grant priority tied to
  the level reached
