summary: >-
  A science and technology studies paper from the School of Emergent Priorities
  reads 312 final-year project reports filed in one provincial pharmacognosy
  teaching laboratory between 1998 and 2023, alongside eleven weeks of
  observation and seventeen interviews. Leaf from a single courtyard guava tree
  rises from 4 of 29 plant-based reports in the first five-year period to 34 of
  61 in the last, carried there by a technician's picking book, an inherited
  protocol valued because it always returns a result, and a turn towards product
  formulation, so that the cabinet comes to read as a literature while recording
  one unvouchered tree.
topic: >-
  the courtyard tree as model plant: how one provincial pharmacy school's
  teaching laboratory came to standardise on guava leaf, and what proximity
  makes of an extract literature
