summary: >-
  A paper from the School of Underlying Conditions re-measures forty-eight
  copper nanowire transparent conducting films recovered after seventy-four
  months mislaid in an unconditioned core shed and a desk drawer. Every film
  lost conductance; an acrylic overcoat reduced the loss about threefold, a
  film's slot within its box mattered measurably, and the outcome tracked the
  rock in the neighbouring tray rows, with films beside sulphide-bearing core
  faring worst and films beside limestone ageing less than those in the drawer.
topic: >-
  An unplanned ageing study in materials science: copper nanowire transparent
  conductive films forgotten for six years in a core shed, and how each film's
  place in the trays governed the rise of its sheet resistance
