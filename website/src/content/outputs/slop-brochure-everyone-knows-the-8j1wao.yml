summary: >-
  A civic marketing brochure inviting the community into the University's
  research on the folk vocabulary households use to make automated systems
  hand them to a person --- the word said to the phone menu, the message typed
  into the chat, the sentence that finally reaches someone --- citing six
  published studies by title and DOI and profiling the researchers who sit
  beside residents as the ask is made.
topic: >-
