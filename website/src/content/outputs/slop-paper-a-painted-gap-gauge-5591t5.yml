doi: 10.5555/slop.5591t5
summary: >-
  A paper from the School of Continuous Improvement describes a three-faced
  aluminium gap gauge, banded green, amber and red for each of three vehicle
  classes, and reports a twelve-week deployment of nine gauges along one
  suburban shopping strip of 212 kerbside bays. The gauge's band agreed with an
  observer's tape measure in 95.2% of 602 consulted attempts, and the share of
  attempts settling within the bay fell from 95.5% in green gaps to 14.2% in
  red ones, though attempts made without the gauge followed the same gradient.
  The council's parking-services office has made the red verdict a bar on any
  attempt, and the University has undertaken to apply the same reading, with no
  override, to its own visitor car parks.
topic: >-
  A painted gap-gauge stick for parallel parking on one shopping strip, built
  from a fitted bracket, three colour bands and a one-line reading rule, run
  over one summer and adopted by the council's parking office as the bar on any
  attempt at a gap the stick reads as too small.
