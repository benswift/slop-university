title: Can a Painted Stick Tell a Driver Whether the Gap Will Fit?
authors:
  - Sten Okwuosa
  - Dagny Okafor
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-09-20
