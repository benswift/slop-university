title: Still Bears Her Name
subtitle: Tracking Label-Refiller Match Across a Shared Kitchen's Spice Rack
authors:
  - Runa Adegoke
  - Petra Umbile
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-25
doi: 10.5555/slop.fwvf8v
summary: >-
  A research poster from the School of Emergent Priorities audits 214
  labelled jars across nine share-house and office pantries, tracking
  fortnightly whether each jar's handwritten label still names the person
  actually refilling it. Aggregate label-refiller match falls from 91% to
  54% over nine weeks and holds at each level between relabeling events,
  recovering only after a scheduled kitchen clean-up relabels most
  mismatched jars in a single afternoon.
topic: >-
  whether the name on a shared kitchen's spice-jar label still tracks who's
  actually the one refilling it
