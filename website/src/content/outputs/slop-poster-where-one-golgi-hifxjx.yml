summary: >-
  A research poster from the School of Underlying Conditions tracks 412 Golgi
  cisternae in a two-colour budding-yeast reporter strain from appearance to
  loss and times each one's handover from an early-Golgi to a late-Golgi
  marker. The handover takes a median of 13 seconds of a 162-second life, its
  timing varies widely between cisternae, and every cisterna that lingered
  more than 40 seconds between identities had fused with a neighbour; averaged
  on appearance, the same traces describe a slope six times wider than any
  unfused handover.
topic: >-
  where one Golgi compartment ends and the next begins: timing the cis-to-trans
  marker handover in single maturing cisternae of a budding-yeast reporter
