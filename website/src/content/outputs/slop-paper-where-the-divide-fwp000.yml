summary: >-
  A paper from the School of Settled Matters reads the undefined word
  "catchment" in a lowland water instrument's works-approval clause. Six
  defensible delineations of the creek's catchment above its gauge place 1,911
  of 2,083 farm dams inside every one and 172 inside some but not all, and the
  paper argues that those 172 are neither within the catchment nor outside it,
  with the admissible delineations fixed by hydrological practice and by the
  clause's own surrounding terms.
topic: >-
  where the divide is flat: a supervaluationist account of the vague catchment
  boundary on low-relief terrain, where the drainage divide a water-management
  instrument names admits many defensible delineations
