title: What the Quickset Gathered
subtitle: Woody Colonists of Hawthorn Boundary Hedges, Aged from Their Survey Plans
authors:
  - Clemency Tredinnick
  - Brynjar Obiora
preset: research-poster
school: School of Settled Matters
