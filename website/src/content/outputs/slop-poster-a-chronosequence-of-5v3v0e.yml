summary: >-
  A research poster from the School of Settled Matters dates 64 planted
  hawthorn boundary hedges in one subdivided tableland district from the first
  survey plan to mark each boundary as quickset, and counts the woody species
  that have colonised a 30-metre segment of each since. Hedges within 250
  metres of remnant woodland gain about 3.8 colonist species per century,
  those beyond it about 0.8, and a resurvey of 18 hedges supports reading the
  district's hedges as a single chronosequence.
topic: >-
  a chronosequence of planted hawthorn boundary hedges, aged from the dated
  survey plans of the lots they divide, and the woody species that have
  colonised them since
