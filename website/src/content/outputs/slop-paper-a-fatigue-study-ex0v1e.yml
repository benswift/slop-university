summary: >-
  A paper from the School of Underlying Conditions treats a nonlinear waveguide
  array as a specimen with a service life, cycling sixty femtosecond-laser-written
  glass arrays through discrete-soliton formation at five multiples of their
  virgin threshold until the localised state no longer reached the output facet.
  Fifty-one failed within a million cycles, median life rising from 1,400 cycles
  at three times threshold to 313,500 at one and a half, along a Basquin relation
  with exponent 0.109. Failure is traced to attenuation accumulated in the excited
  guides near the input, with a minority of early failures from a single
  scattering flaw, and thirty days of dark rest restored nothing.
topic: >-
  A fatigue study of femtosecond-laser-written glass waveguide arrays:
  stress-life curves and Weibull statistics for how many discrete-soliton
  formation cycles a specimen survives before the localised state no longer
  forms
