summary: >-
  A research-showcase brochure from the School of Emergent Priorities presents
  a survey of the tear-off-tab cards on shopping-centre noticeboards, reported
  as distributions of tabs remaining and weeks posted, and the Last-Tab Rule
  under which every University notice carries a nine-tab fringe and stays up
  until the last tab is taken, alongside eight of the University's published
  studies of notices, signs and stubs.
