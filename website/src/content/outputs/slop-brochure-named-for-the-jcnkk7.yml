summary: A prospectus from the School of Settled Matters invites students to
  read law by way of the peroxisome proliferator-activated receptors, a family
  named for the compounds that first set one of them off, and sets out the
  School's seminars in statutory interpretation, received readings and land law
  as the study of words fixed by their first reader and carried by every reader
  after. It points to five published outputs across four schools.
topic: "named for the first thing it did: a prospectus inviting students to read
