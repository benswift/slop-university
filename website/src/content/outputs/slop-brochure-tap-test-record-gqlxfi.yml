summary: >-
  A research showcase from the School of Continuous Improvement reads the
  University's research methods against the history of the neurological
  examination, under four headings: the instrument and the hand, the graded
  examination, the case note and the round, and the examination repeated. It
  quotes four researchers, profiles three more, and rests its account on seven
  published studies cited by title and DOI.
