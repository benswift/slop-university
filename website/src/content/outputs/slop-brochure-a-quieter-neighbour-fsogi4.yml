summary: >-
  A civic brochure from the School of Emergent Priorities presents the
  University's public work on sound between neighbours: the community halls and
  club rooms that echo, the shared walls and basement practice corridors that
  carry, and the courtyards softened by plantings and the routines of the people
  who keep them. It sets that work beside six of the University's published
  studies of sound, hearing and quiet, and invites residents and committees to
  bring the University their rooms.
