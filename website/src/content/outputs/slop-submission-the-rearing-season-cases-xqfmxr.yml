title: Confirm at the Next Ordinary Meeting
subtitle: >-
  A submission in a personal capacity to the Department of Policy Settings'
  Review of Quorum and Resolutions in the University's Units
authors:
  - Odalys Penhallow
preset: submission
school: School of Settled Matters
date: 2026-11-17
publishedAt: "2026-11-17T04:02:47+11:00"
doi: 10.5555/slop.xqfmxr
summary: >-
  A personal-capacity submission from a Senior Lecturer in the School of
  Settled Matters answers five of the twelve questions in the Department of
  Policy Settings' consultation on quorum and resolutions in the University's
  units. Reading twenty-nine reported cases on inquorate general meetings of one
  silk-growing district's cooperative societies, whose courts divided three ways
  before settling the point, it proposes that an inquorate resolution remain
  open to confirmation until the unit's next ordinary meeting rather than for a
  fixed sixty days, that anything done under it before a lapse stand, and that
  any variation commence at the start of a teaching period.
topic: >-
  the rearing-season cases: a personal-capacity submission to the quorum review
  that reads the inquorate resolution through a line of cases on silk-growers'
  cooperatives, whose meetings failed for quorum in the rearing season, and asks
  that confirmation run to the next ordinary meeting rather than a fixed sixty
  days
