title: Pumped, Hauled and Dried
subtitle: The energy behind a harvest, and the case for studying it
authors:
  - Brynjar Obiora
  - Vigdis Emenike
  - Torun Ezeigwe
preset: brochure
school: School of Underlying Conditions
