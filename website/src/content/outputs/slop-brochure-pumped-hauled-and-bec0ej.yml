summary: >-
  A case for support from the School of Underlying Conditions presents the
  University's research into the energy a farm spends before its harvest is
  sold, under three themes: water that has to be lifted, heat that has to be
  held and power that has to be read. It introduces researchers from two
  schools and rests its invitation to partners on seven published studies
  cited by title and DOI.
topic: >-
  pumped, hauled and dried: a case for supporting the University's research
  into the energy a farm spends before it feeds anyone, from the bore to the
  grain dryer
