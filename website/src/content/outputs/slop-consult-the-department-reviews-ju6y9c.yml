title: Retaining Worn and Eroded Specimens
subtitle: >-
  A Department of Policy Settings consultation paper on how long the Research
  Specimens Determination 2023 should require worn, eroded and abraded
  specimens, and the material removed from them, to be kept once a study has
  reported them
authors: []
preset: consultation-paper
date: 2026-11-28
publishedAt: "2026-11-28T16:00:47+11:00"
doi: 10.5555/slop.ju6y9c
summary: >-
  A consultation paper from the Department of Policy Settings invites
  submissions on the Research Specimens Determination 2023, which requires
  every specimen reported in a University output to be kept for ten years in
  the condition in which it was last measured, together with any material
  removed from it and the medium carrying that material. With the specimen
  store expected to have no free tray position by March 2027 and spent abrasive
  filling its drum bay, it cites four of the University's outputs on auger-tip
  and tank-liner wear, a waterjet shop's edge notes and a retained-sample
  store, and sets out two options, retaining the setting or keeping a reference
  set with a surface record for every specimen, on which it forms no view.
topic: >-
  the Department reviews how long eroded test coupons and abrasive-wear
  specimens must be kept after a study, now that the specimen store is full
