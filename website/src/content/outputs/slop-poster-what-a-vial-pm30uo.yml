summary: >-
  A research poster from the School of Underlying Conditions transcribes and
  codes the labels on 412 vials of spent nickel reforming catalyst left in one
  laboratory's sample cabinet by nine researchers, then sets a timed retrieval
  task. Labellers found 87% of their own samples within three minutes and
  colleagues 41% of the same ones; a notebook page reference served both
  groups, while initials, run numbers and status words served the labeller
  alone.
topic: >-
  What a vial label says: a personal-information-management study of how bench
  researchers name samples of spent nickel methane-reforming catalyst, and
  whether a colleague can retrieve a named sample from the drawer a year on
