title: Twenty Years Under the Shade Sail
subtitle: >-
  Childhood no-hat-no-play enforcement dose and adult sun-hat use in a
  retrospective cohort of 1,912 adults
authors:
  - Anouk Mensah
  - Ingeborg Nwachukwu
  - Marek Solheim
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-19
publishedAt: 2026-08-19T13:01:49+10:00
doi: 10.5555/slop.iy5vab
summary: >-
  A research poster from the School of Emergent Priorities reconstructs each of
  1,912 adults' childhood no-hat-no-play enforcement dose, term by term, from
  the digitised newsletter archives of fourteen primary schools, and finds
  adult sun-hat wear unrelated to dose at every level of exposure (r = 0.03);
  the one reliable predictor is a current workplace hat rule. All fourteen
  participating schools have requested their historical enforcement-dose
  profiles.
topic: >-
  did twenty years of the primary-school no-hat-no-play rule make adults who
  wear hats? a retrospective cohort reconstructs each respondent's childhood
  enforcement dose, term by term, from digitised school-newsletter archives,
  finds adult sun-hat use unrelated to dose, and the participating schools each
  request their own historical enforcement-dose report anyway
