title: The Restock Sheet as Allocation Instrument
subtitle: >-
  A Five-Level Restock Anticipation Maturity Model Scored Against a
  Landlord Consortium's Vending-Site Tenancy Rule
authors:
  - Tove Ilesanmi
  - Lindiwe Achterberg
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-09-25
publishedAt: "2026-09-25T16:02:06+10:00"
doi: 10.5555/slop.2h2j54
summary: >-
  A paper from the School of Emergent Priorities scores nine independent
  vending-machine contractors' fleets against a five-level Restock
  Anticipation Maturity Model built from route and sale telemetry across
  214 machines and 41 shopping-strip and supermarket-foyer sites.
  Contractors reaching Level 3 or above recovered stockout-minutes at
  under half the rate of Level 0-1 contractors, and a regional landlord
  consortium has tied premium-site tenancy renewal to the score, reviewed
  once a year with no mid-term appeal.
topic: >-
  Can a vending-machine route driver's restocking visits be scored on a
  five-level stockout-anticipation maturity ladder, and should a vending
  operator's access to premium foot-traffic sites in a shopping strip be
  set by that ladder alone, reviewed once a year with no mid-term appeal?
