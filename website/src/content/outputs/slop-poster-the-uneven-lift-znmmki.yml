title: The Uneven Lift
subtitle: Interval-censored depth to clay from auger logs, and what irregular lifts identify
authors:
  - Brynjar Obiora
  - Bram Ntuli
  - Vigdis Emenike
preset: research-poster
school: School of Underlying Conditions
