doi: 10.5555/slop.znmmki
summary: >-
  A research poster from the School of Underlying Conditions treats the depth
  to a buried clay horizon in 212 hand-auger holes as interval-censored data
  and estimates its distribution by nonparametric maximum likelihood. Entered
  with lift bottoms as measured, the holes' irregular lift lengths give 77
  Turnbull intervals and a median depth of 45.6 cm; rounded to the field
  sheet's ten-centimetre decades, the same holes identify the median only to
  between 40 and 50 cm.
topic: >-
  The uneven lift: depth to a buried clay horizon from interval-censored auger
  records, and why a surveyor's irregular lift lengths identify the depth
  distribution that a fixed ten-centimetre grid cannot
