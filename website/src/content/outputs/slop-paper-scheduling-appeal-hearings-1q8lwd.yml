title: Hear the Lead, Hold the Rest?
subtitle: Parallel-Panel Appeal Scheduling with Precedent-Dependent Hearing Times and Reserved-Judgment Lags
authors:
  - Odalys Penhallow
  - Osei Vandermeer
preset: paper
school: School of Settled Matters
date: 2026-11-12
publishedAt: "2026-11-12T10:30:20+11:00"
doi: 10.5555/slop.1q8lwd
summary: >-
  A paper from the School of Settled Matters and the School of Continuous
  Improvement states appellate listing as a parallel-panel scheduling problem
  in which the first delivered judgment on a contested point shortens every
  later hearing that raises it, and tests a threshold rule for holding
  follower appeals on 360 generated court lists. The rule comes within 5.3%
  of the best schedules found, against 14.9% for weighted shortest processing
  time; holding every follower pays only when the reserved-judgment lag is
  short against the group's own workload, and hearing two appeals on the same
  point in parallel pays once that lag grows unpredictable.
topic: >-
  Scheduling appeal hearings across parallel court panels when a delivered
  judgment on a shared question of law shortens every later hearing that
  raises it, but arrives only after the judgment is reserved
