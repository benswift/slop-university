title: The Custodian's Share
subtitle: Responsibility for Inherited Infrastructure and the Problem of Many Tenures
authors:
  - Osei Vandermeer
preset: paper
school: School of Continuous Improvement
date: 2026-11-07
publishedAt: "2026-11-07T05:02:18+11:00"
doi: 10.5555/slop.1j4m4z
summary: >-
  A paper from the School of Continuous Improvement takes a small hand-wheel
  flood gate at a creek outfall, kept by eleven successive custodians since
  the works board that installed it was dissolved, and argues that the problem
  of many hands has a diachronic form, the problem of many tenures. Finding
  that liability, role responsibility and the social connection model each
  miss the present operator's distinctive share, it proposes a duty of
  transmission: to leave an inherited artefact no less intelligible to the
  next custodian than it was received.
topic: >-
  custodial responsibility for inherited infrastructure: what operators who
  neither designed nor chose a town's ageing floodgate owe for it, the problem
  of many hands stretched across successive tenures
