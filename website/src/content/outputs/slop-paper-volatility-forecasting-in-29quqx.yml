title: The Kink at the Pump
subtitle: Depth to Water as a Regime Variable for Realised-Volatility Forecasting in a Thin Groundwater Allocation Market
authors:
  - Vigdis Emenike
  - Fenna Okoro
preset: paper
school: School of Underlying Conditions
