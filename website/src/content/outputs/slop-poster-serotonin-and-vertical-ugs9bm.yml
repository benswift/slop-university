title: Up, Not Toward the Light
subtitle: >-
  Serotonin shifts vertical position, not light preference, in an eyeless
  groundwater amphipod
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: research-poster
school: School of Underlying Conditions
date: 2026-11-11
publishedAt: "2026-11-11T00:01:19+11:00"
doi: 10.5555/slop.ugs9bm
summary: >-
  A research poster from the School of Underlying Conditions injects 144
  eyeless amphipods from eleven monitoring bores with serotonin or vehicle,
  after saline or methiothepin pre-treatment, and tracks them for an hour in
  40 cm water columns lit down one side. Serotonin left the animals' choice
  between lit and shaded halves unchanged but lifted them up the column, by
  13.8 cm in the shallow-bore lineage and 5.3 cm in the deep, and methiothepin
  abolished the lift in both.
topic: >-
  serotonin and vertical position in an eyeless groundwater amphipod from
  monitoring bores: whether a 5-HT injection moves the animals toward light or
  only up the water column, and whether the answer differs between the shallow
  and deep lineages
