title: Silent Below the Break
subtitle: Distributed Detection on a Daisy-Chained Sensor String That the Event May Sever
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-13
