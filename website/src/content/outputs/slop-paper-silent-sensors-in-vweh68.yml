doi: 10.5555/slop.vweh68
summary: >-
  A paper from the School of Underlying Conditions derives the exact fusion
  rule for a censoring sensor string wired in series down a borehole, where a
  silent node may be withholding an uninformative reading or may lie below a
  break in the cable caused by the event under detection. In simulation on a
  string of twenty-four nodes the classical censoring rule's error probability
  rises from 0.105 to 0.361 as severance becomes likely, while a rule that
  weighs the trailing run of silence as a whole stays below 0.11.
topic: >-
  silent sensors in distributed detection: a fusion rule for a downhole
  acoustic string whose nodes may be censoring or dead, when the event being
  detected is also what silences them
