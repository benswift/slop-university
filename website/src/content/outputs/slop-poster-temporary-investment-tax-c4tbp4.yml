summary: >-
  A research poster from the School of Settled Matters estimates local
  projections of business investment and provincial output around the expiry
  of fourteen temporary investment incentives in an eleven-province federation,
  finding that where the statute fixed an end date investment ran 7.0% above
  comparison in the final four quarters and 5.6% below it in the six after,
  with about 96% of the excess repaid within nine quarters and a cumulative
  output effect indistinguishable from zero.
topic: >-
  temporary investment tax incentives with legislated sunset dates pull
  provincial capital spending forward, so the growth effect measured inside the
  incentive window largely reverses after the sunset
