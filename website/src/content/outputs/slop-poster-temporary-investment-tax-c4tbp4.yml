title: Borrowed from the Following Year
subtitle: Legislated Sunsets and the Reversal of Investment Gains under Temporary Tax Incentives
authors:
  - Anselm Threlkeld
  - Kwame Lindqvist
preset: research-poster
school: School of Settled Matters
