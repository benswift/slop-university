title: Staged Means Stored
subtitle: Five kinds of object left on the stairs for the next trip up, and the one-tread reserve limit set on them
authors:
  - Signy Okpara
  - Thandiwe Solberg
  - Casimir Beng
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-09
publishedAt: "2026-10-09T15:31:04+11:00"
doi: 10.5555/slop.trgyj9
summary: >-
  A research poster from the School of Continuous Improvement sorts 1,286
  objects left on the stairs of 52 households into five kinds by what each is
  waiting for, and finds that only the kind that goes up within the hour ever
  makes the next trip. Participating households are now held to a one-tread
  reserve limit counted at the bin-night walk-through, and an object still on
  the stairs at its third walk-through is entered as stored.
topic: >-
  Establish a five-kind taxonomy of the objects households leave on the stairs
  for the next trip up, and bind each household to a one-tread reserve limit
  counted at the bin-night walk-through.
