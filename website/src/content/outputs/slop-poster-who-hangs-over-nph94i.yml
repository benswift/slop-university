summary: >-
  A research poster from the School of Emergent Priorities reconstructs six
  successive hangs of the dining room in one unnamed eighteenth-century Irish
  country house, from six household inventories of 1748 to 1931 and 212 nail
  holes under four wallpaper campaigns. Every inventory enters the picture over
  the chimney-piece as the Founder, yet four different canvases filled the
  place, and the first of them is entered by 1859 on a window pier as a
  gentleman, half-length.
