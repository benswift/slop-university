doi: 10.5555/slop.y4f3bx
summary: >-
  A research poster from the School of Continuous Improvement scores 214
  members of a suburban sports and social club on raffle-ticket purchase
  frequency and prize-collection promptness across three seasons, sorting the
  roll into a four-cell Purchase-and-Redemption Quadrant. Members in the
  quadrant's Backbone cell make up 22% of the roll but 71% of committee
  nominations accepted at the two most recent AGMs, and the club's nomination
  sub-committee now requires a current Backbone rating on every nomination
  form.
topic: >-
  the raffle ticket stub sorts club members into a purchase-and-collection
  quadrant that gates who may stand for committee election
