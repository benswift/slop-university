title: The Same Eleven Households
subtitle: >-
  A Thematic Study of Canteen Rostering Across Nine Junior Sporting Clubs, and
  the Volunteer Levy Their Budgets Now Forecast
authors:
  - Kwame Lindqvist
  - Ingrid Vasseur
  - Sten Okwuosa
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-29
publishedAt: 2026-07-29T10:02:33+10:00
doi: 10.5555/slop.z2lt4c
summary: >-
  A research poster from the School of Emergent Priorities reports 41
  semi-structured interviews with parents, canteen coordinators, treasurers and
  coaches across nine clubs of one metropolitan junior sporting association,
  coded by two analysts against a framework fixed before the second pass and not
  revised (kappa = 0.81), alongside a document analysis of every fee schedule,
  roster and budget paper the clubs released. Eleven households worked 46% of
  the 1,184 rostered canteen hours logged over the 2026 winter season. All nine
  fee schedules describe the volunteer levy as an encouragement to take a shift
  and eight of nine budgets carry it as forecast income, at between $60 and $220
  per registered player, while no club keeps a record of the shifts that went
  unworked.
topic: >-
  the junior-sport canteen roster, who actually fills the Saturday shifts, and
  what a club's volunteer levy becomes once the fees collected from unfilled
  shifts are budgeted as income
