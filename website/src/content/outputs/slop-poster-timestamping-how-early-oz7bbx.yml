title: Claimed Early, Cooked Late
subtitle: Timestamping a Street Potluck's Capped Sign-Up Sheet Against When Each
  Household Actually Decided What to Bring
authors:
  - Kwame Lindqvist
  - Ingrid Vasseur
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-27
doi: 10.5555/slop.oz7bbx
summary: >-
  A research poster from the School of Emergent Priorities timestamps 214
  household sign-ups across nine streets and eleven monthly potluck cycles,
  comparing when a category slot is claimed on a shared sign-up sheet
  against when each household confirms its dish. The capped dessert
  category is claimed a median eleven days earlier than mains or sides, but
  the confirmed dish itself lands within a day or two of the potluck
  regardless of category, and claiming early does not lower the rate at
  which the confirmed dish is later revised.
topic: >-
  timestamping how early neighbours claim a shared potluck sign-up sheet's
  capped dessert category before deciding what to actually cook
