summary: >-
  A civic brochure from the School of Underlying Conditions introduces the
  district's neighbours to the eyeless flatworms that live in its bores and
  springs and regrow from a fragment, setting the School's bench work on
  regeneration beside its field partnerships with households and schools. It
  rests its showcase on six published studies cited by title and DOI.
topic: >-
  what grows back: a civic brochure from the School of Underlying Conditions
  about the blind flatworms living in the district's bores and springs, which
  regrow whole from a fragment and settle head from tail in a weak current, and
  the neighbours above the water who help keep count of them
