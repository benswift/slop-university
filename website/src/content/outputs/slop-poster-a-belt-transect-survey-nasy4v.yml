summary: >-
  A research poster from the School of Underlying Conditions surveys a single
  vanadium oxide growth strip as a field ecologist surveys a rocky shore,
  tallying 2,574 nanostructures into four morphotypes at twenty stations of a
  belt transect laid down the furnace gradient. The morphotypes hold four
  overlapping bands in a fixed order, which a second strip repeats about four
  millimetres further toward the cold end, and the authors report band centres
  and overlap widths and draw no boundary lines.
topic: >-
  a belt-transect survey of one oxide growth substrate, counting nanostructure
  morphotypes by quadrat along a tube furnace's temperature gradient and reading
  the zonation as a field ecologist reads a shoreline
