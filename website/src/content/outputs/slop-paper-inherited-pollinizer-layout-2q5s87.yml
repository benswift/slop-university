title: The Pollinizer That Was Never Replanted
subtitle: S-RNase Genotypes and Open-Pollinated Fruit Set in a Century-Old Grafted Pear Orchard
authors:
  - Clemency Tredinnick
  - Anselm Threlkeld
preset: paper
school: School of Settled Matters
date: 2026-11-14
publishedAt: "2026-11-14T16:00:41+11:00"
doi: 10.5555/slop.2q5s87
summary: >-
  A paper from the School of Settled Matters genotypes all 188 living trees of
  a pear orchard planted in the 1920s and finds that 21 of the trees recorded
  as replacement pollinizers share both self-incompatibility alleles with the
  main crop and cannot pollinate it. Across 34,957 flowers on 96 main-crop
  trees, fruit set halves with every 10 m to the nearest compatible tree, and
  most seed is still sired by the 14 original pollinizers.
topic: >-
  Inherited pollinizer layout and S-RNase self-incompatibility limiting fruit
  set in a century-old grafted pear orchard
