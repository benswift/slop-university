summary: >-
  A marketing poster for Slop University takes the School of Settled Matters'
  diary study of bereaved adult children selling a parent's house as its hook,
  setting the line that grief has its own settlement date over an emptied
  front hallway with the keys left on the hall table. Composed for the
  portrait signage rotation, it points to that study and to two further
  University outputs on unfinished tasks left by the dead and on adult
  children checking an ageing parent's pill organiser from a distance.
topic: >-
  grief has its own settlement date: a research-teaser ad for the University's
  diary study of bereaved adult children selling a parent's house, where
  yearning held through the exchange of contracts and rose in the week the
  keys went back
