title: The Blank Beside It
subtitle: Rack Position Outweighs Provenance in Judgements of a Faint Indophenol Blue
authors:
  - Ylva Onyekwere
  - Signy Okpara
  - Eskil Nwabueze
preset: research-poster
school: School of Emergent Priorities
