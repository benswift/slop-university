doi: 10.5555/slop.lnjkqc
summary: >-
  A research poster from the School of Emergent Priorities asks 28 observers
  for 7,840 yes/no judgements of whether a nitrogen-reduction test vial has
  turned blue, crossing the vial's place in the rack with a label naming it a
  catalyst run. Standing the vial beside its blank lowers the point at which
  it is called blue by 1.10 steps of a seven-step series, nearly three times
  the 0.40-step shift the label produces, and the two do not interact.
topic: >-
  the blank beside it, a psychophysics study of how twenty-eight observers
  judge a faint indophenol blue in nitrogen-reduction test vials, where the
  vial's place in the rack beside its blank shifts what is called blue more
  than being told which vial came from the catalyst
