doi: 10.5555/slop.8rfjcr
summary: >-
  A paper from the School of Underlying Conditions studies 214 exploration
  blocks tendered by an unnamed successor state whose socialist-era borehole
  logs survived complete while the drill core survived in only some district
  sheds. Blocks with surviving core drew more bids and sold for more, a premium
  nearly as large among bidders who never inspected the core; where it was
  lost, firms staffed by former survey geologists won most of what they bid on,
  and other winners relinquished seven blocks in ten undrilled.
topic: >-
  Inherited drill core and the bidding for exploration licences in a
  post-socialist successor state: what socialist-era survey core that survived
  privatisation is worth to bidders, and who bids well where it was lost
