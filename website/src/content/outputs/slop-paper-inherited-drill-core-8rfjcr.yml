title: The Right to Look
subtitle: Surviving Drill Core and the Bidding for Exploration Licences in a Post-Socialist Successor State
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
