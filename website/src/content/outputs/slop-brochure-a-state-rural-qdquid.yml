summary: >-
  A brochure from the School of Continuous Improvement opens on a state rural-
  addressing scheme's replacement of name-based addresses with distance-based
  numbers, and sets residents' own accounts of the changeover beside the
  University's new standing commitment: every rural-numbering rollout it
  partners with now receives a published legibility audit before residents are
  asked to adopt the new address.
topic: >-
  A state rural addressing scheme replaces name-based addresses with numbers
  set by distance along the road, and an interview study asks residents what
  the number now decides for them.
