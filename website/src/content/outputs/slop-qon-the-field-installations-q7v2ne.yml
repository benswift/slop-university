doi: 10.5555/slop.q7v2ne
summary: >-
  The Department of Policy Settings answers five questions on section 14 of the
  Slop University (Grounds and Foreshore) Determination 2024, under which a
  permit for a field installation is personal to its holder and lapses when the
  holder ceases to be a member of staff, as it applies to the stakes, pegs and
  benchmarks marking seagrass and saltmarsh survey plots on the University's
  estuarine foreshore, taken on notice at the Committee on Settings
  Oversight's Supplementary hearings of 17 November 2026 or lodged in writing
  after them. Its answers report that 14 of 47 permits lapsed on the holder's
  departure and that the University removed 148 of the 236 installations on
  ended permits; confirm that a permit cannot pass to whoever continues a
  survey, though a successor may apply afresh; hold no record of which plots
  have been surveyed beyond one permit term; decline a site-by-site account of
  removals on resourcing; and refer the member to two University outputs on
  coastal vegetation over longer periods.
topic: >-
  the field installations setting: the Committee presses the Department on
