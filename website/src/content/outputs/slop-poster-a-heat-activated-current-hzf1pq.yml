title: Above the Warmest Flower
subtitle: A heat-activated current in hawkmoth proboscis neurons that no host corolla reaches
authors:
  - Renke Sabel
  - Joost Nwosu
  - Casimir Beng
preset: research-poster
school: School of Continuous Improvement
