title: Does Roster Age Really Predict What Gets Kerbed on Bin Night?
subtitle: A Pre-Registered Direct Replication of an Earlier Street-Audit Finding
  on Bin-Night Compliance and Kerb-Copying
authors:
  - Osei Vandermeer
  - Dagny Okafor
  - Fenna Okoro
preset: paper
school: School of Continuous Improvement
date: 2026-08-31
publishedAt: "2026-08-31T06:04:16+10:00"
doi: 10.5555/slop.lhmgn3
summary: >-
  A paper from the School of Continuous Improvement pre-registers a direct
  replication of an earlier street-audit finding that a laminated bin-night
  roster's authority decays with age, across 31 residential streets in a
  fresh council portfolio. Neither the original roster-match decay nor the
  neighbour-copy rise reproduces, and the null survives a same-council
  ablation; the Review Cadence Observatory responds by proposing that every
  audited council fix its bin-roster reissue to an unbending quarterly
  calendar regardless of any street's observed compliance.
topic: >-
  although a street audit found bin-night roster compliance decaying with
  the roster's age as households drift into copying whichever bin a
  neighbour has already kerbed, a pre-registered replication across a fresh
  sample of streets finds no such decay and no rise in kerb-copying, and the
  School of Continuous Improvement's Review Cadence Observatory responds to
  the null result by fixing every audited council's bin-roster reissue to an
  unbending quarterly cycle regardless of any street's observed compliance
