summary: >-
  A paper from the School of Continuous Improvement matches 2,217 bicycle parts
  cross-listed on two rival classified marketplaces in one regional city and
  follows each pair to its sale, finding that the copy left behind on the
  smaller, free platform outlives a sale on the larger one by a median of twelve
  days, while the reverse residue clears in two. An accounting identity ties the
  asymmetry to the 18.4% of the smaller platform's enquiries that reached items
  already sold elsewhere, and a staggered liveness prompt cut that share by 11.8
  percentage points without measurably reducing cross-listing.
topic: >-
  stale cross-listings as an externality of seller multi-homing between two
  rival secondhand bicycle-parts marketplaces
