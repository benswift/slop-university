title: Dry Means Lost
subtitle: >-
  Do gloves left on a campus radiator overnight still belong to their owner
  once they have dried?
authors:
  - Edda Nwafor
  - Solveig Adeyemi
  - Renke Sabel
preset: paper
school: School of Continuous Improvement
date: 2026-09-30
publishedAt: "2026-09-30T03:01:05+10:00"
doi: 10.5555/slop.wvabd0
summary: >-
  A paper from the School of Continuous Improvement codes 1,642 leftover
  glove-pairs at sixteen campus radiators into four named cells of a
  moisture-by-claimant quadrant and finds that dryness, not absence, is what
  flips a passer-by's claim. The Indicator Commons now bags every Cured pair
  at the 09:00 steward walk into a Drying Commons draw and allocates next
  winter's radiator-upgrade funds from each building's Cured share.
