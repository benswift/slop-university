summary: >-
  A research poster from the School of Settled Matters carries the error
  threshold for self-replicating strands from a well-mixed pool to a chain of
  thermal-gradient traps in a simulated branching fracture network, following
  lineages through 400 traps. The founding sequence holds through the whole
  chain below a critical copying error that falls from μL = 1.26 when traps
  hand their strands on slowly to 0.46 when they hand them on fast.
topic: >-
  Passed down the crack: how much of a replicating strand's sequence survives
  as a chain of thermal-gradient pores hands it from one trap to the next, a
  thermophoresis and error-threshold model of a branching hydrothermal fracture
  network
