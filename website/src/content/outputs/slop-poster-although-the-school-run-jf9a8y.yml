doi: 10.5555/slop.jf9a8y
summary: >-
  A research poster from the School of Emergent Priorities partitions 186
  school-run approaches on eleven streets into four named cells by whether
  a horn sounded and whether a child was visible at the kerb, then binds
  the next day's drop-off window to Called-present, with no driver override.
topic: >-
  Although the school-run street already posts a no-horn zone, HAIL
  partitions every approach into four cells (Called-present, Called-empty,
  Silent-present, Silent-empty) and withholds the next day's drop-off
  window from any cell that is not Called-present.
