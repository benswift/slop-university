summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 is a
  case account of the paddle-lock, a cycle-box built for school-run
  crossing supervisors that closes the paddle on a prescribed dwell.
  From 2024, every evening Capability Sprint session has opened or been
  stood down on a closed window, with the next intake of places allocated
  from the stamp file and no ordinary override.
