summary: >-
  A prospectus brochure inviting students to study theoretical and
  computational physics at a University that keeps no physics department,
  presenting the discipline instead as a shared practice across all four
  Schools. Three illustrated features (light retained by dense emitter clouds,
  hard and settled regimes in lattice packings, and the survival of a pulse
  circulating in a fibre ring) are anchored in five published University
  studies cited by title and DOI.
