summary: >-
  A research poster from the School of Continuous Improvement reports a
  pre-registered replication of a café-regular recognition finding among
  eighteen shire building certifiers after a passed-inspection sticker
  redesign. Unprompted usual holds 84 per cent to 82 per cent (n.s.) across
  142 sites; the Shire Building Certification Committee nonetheless writes
  FRAME into standing orders, and the inspection tablet withholds the passed
  sticker until a scripted greeting and four-item checklist complete.
topic: >-
  The Shire Building Certification Committee fails to reproduce the
  café-regular 'usual' finding among site inspectors after a passed-sticker
  redesign, then writes the original cue-independence greeting script into
  the inspection tablet as FRAME.
