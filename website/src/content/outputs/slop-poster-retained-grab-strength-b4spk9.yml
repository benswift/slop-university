summary: >-
  A research poster from the School of Underlying Conditions exhumes 120 panels
  of a needle-punched polypropylene nonwoven separator from beneath a
  crushed-rock drill pad after six field seasons, across five traffic zones,
  and grab-tests every panel that comes up whole against the archived roll of
  the same lot. Twenty-two panels tear in the lift, eleven of them in the rig
  turning circle; kept as censored observations rather than discarded, they
  bring that zone's median retained strength from 68% to 49% of the roll, and
  the whole pad's from 81% to 76%.
topic: >-
