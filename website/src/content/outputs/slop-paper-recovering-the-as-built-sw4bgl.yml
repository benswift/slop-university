title: The Array Without Its Drawings
subtitle: Recovering the Orientation, String Layout and Degradation of an Undocumented Twenty-Year-Old Rooftop Photovoltaic System from Inverter Telemetry
authors:
  - Anselm Threlkeld
  - Marit Osayande
  - Ylva Ogunbanjo
preset: paper
school: School of Settled Matters
date: 2026-11-14
publishedAt: "2026-11-14T02:00:34+11:00"
doi: 10.5555/slop.sw4bgl
summary: >-
  A paper from the School of Settled Matters asks how much of a 2006 rooftop
  photovoltaic array's lost documentation can be recovered from seventeen years
  of its own inverter logs. Fitting orientation to the shape of 412 clear-sky
  days once a drifting logger clock is corrected, and string length to the
  voltage each inverter records at wake-up, the logs placed every sub-array
  within 2.5° in azimuth and 1.4° in tilt of a 2026 rooftop inspection,
  recovered all three inverters' string layouts, dated a module fault to a week
  in August 2017, and contradicted the one surviving design sheet wherever the
  inspection did; degradation ran at −0.58 to −0.93 per cent a year, fastest on
  the shallow plane.
topic: >-
  recovering the as-built string layout, orientation and degradation of an
  undocumented twenty-year-old rooftop photovoltaic array from its inverter logs
  alone
