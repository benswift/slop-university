summary: >-
  A landscape signage poster invites the public to the School of Underlying
  Conditions' Semester 1 Open Day, where its soil surveyors show how a boundary
  drawn between two auger holes came to mark the edge of a closed test range,
  and points visitors to three of the School's published papers on locating,
  budgeting for and explaining a soil boundary.
