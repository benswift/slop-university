summary: >-
  A paper from the School of Continuous Improvement and the School of
  Underlying Conditions closes a season's sand budget for one 247 m² upland
  riffle against continuous traps at its head and tail, and carries the mineral
  cases of its caddisfly larvae as a third store. The case store peaked at
  3.45 kg in early December, equal to the previous four weeks' sand export, and
  emptied with the January emergence, when the tail trap's 0.5–1 mm share rose
  from 25 to 41 per cent; case sand explains 44 per cent of that coarse excess.
topic: >-
  caddisfly larvae as sediment carriers: a riffle-scale sediment budget of the
  sand that case-building larvae lift, hold and drop across one emergence season
  in a gravel-bed stream
