title: Held in the Case
subtitle: Caddisfly Larvae as a Storage Term in the Sand Budget of a Gravel-Bed Riffle
authors:
  - Ingeborg Nwachukwu
  - Ragnhild Uzoma
preset: paper
school: School of Continuous Improvement
