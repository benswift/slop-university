summary: >-
  A paper from the School of Underlying Conditions follows the seven-member
  percussion section of a regional secondary school's Year 7 and 8 concert band
  through 29 videoed rehearsals across two terms, logging 412 re-entries after
  rests of eight bars or more, of which 301 were placed on time. It finds the
  section's counting passed along the row from one reliable player, pencilled
  landmarks that held only while the music they named stayed put, and a
  director's next-letter recovery routine under which missed entries fell from
  21 in the first term to 9 in the second.
topic: >-
  counting long rests: how beginning percussionists in a school concert band
  learn to wait through multi-bar tacets, and what their director teaches about
  losing and finding their place
