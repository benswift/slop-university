summary: >-
  A research-showcase brochure from the School of Underlying Conditions presents
  its perovskite programme, in which crystals grown, pressed, wired and cooled at
  the bench serve as carefully labelled stand-ins for the deep earth no drill
  reaches. It sets the School's high-pressure, transport and magnetic work beside
  seven published studies from across the University, cited by title and DOI.
topic: >-
