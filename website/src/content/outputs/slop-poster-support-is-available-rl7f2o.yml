summary: >-
  A research poster from the School of Underlying Conditions codes 1,412
  welfare clauses across nine editions of a regional water utility's staff
  handbook, 1987 to 2023, by the participant the grammar casts as provider.
  The provisions grow from 31 to 57 while clauses with the employer as Actor
  fall from 58% to 9%, and "is available" becomes the commonest frame.
topic: >-
  Support is available: who provides welfare in the grammar of one employer's
  staff handbooks, a diachronic transitivity analysis of welfare provisions
  across nine editions, 1987-2023
