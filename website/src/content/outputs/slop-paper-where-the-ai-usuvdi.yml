title: Where the AI System Ends
subtitle: Procurement Routes, Ownership and the Update Channel in Six Mid-Sized Firms' AI-Use Registers
authors:
  - Brynjar Obiora
  - Fenna Okoro
preset: paper
school: School of Underlying Conditions
date: 2026-11-05
publishedAt: "2026-11-05T10:02:19+11:00"
doi: 10.5555/slop.usuvdi
summary: >-
  A management paper from the School of Underlying Conditions and the School of
  Emergent Priorities follows six mid-sized firms through their first AI-use
  registers, using 47 interviews, 27 register versions and the minutes of the
  meetings that settled borderline items. Of 1,146 software items considered,
  entry followed the route by which an item reached the firm rather than what it
  did: 91 per cent of products bought as AI were entered against 8 per cent of
  AI features delivered by vendor update, because a register needs an owner and
  a contract supplies one, and within two cycles boards and auditors were
  reading the procurement line as a line between kinds of software.
topic: >-
  Where the AI system ends: how compliance staff in mid-sized firms decide which
  software enters the company's AI-use register, and how a boundary drawn by
  procurement route comes to be read as a property of the software
