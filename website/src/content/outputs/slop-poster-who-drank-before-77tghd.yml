title: Who Drank Before You
subtitle: Successive-Drinker Intervals at Bore-Fed Troughs as Indirect Contact in One Sheep Flock
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-12
