doi: 10.5555/slop.77tghd
summary: >-
  An observational study fits ear-tag readers to four concrete troughs fed in
  series from one bore and follows a mob of 412 ewes for 61 days, measuring
  the interval between each ewe's drink and the previous ewe's. The interval
  lengthens along the bore line and, at the trough nearest the header tank,
  is mostly shorter than the time the float valve takes to turn the water
  over.
topic: >-
  who drank before whom: intervals between successive drinkers at bore-fed
  stock troughs as the indirect-contact structure for virus transmission in
  one sheep flock
