doi: 10.5555/slop.e5esfg
summary: >-
  A research poster from the School of Continuous Improvement describes a
  real-time laugh-density dashboard built for a volunteer amateur-dramatics
  company, timestamping audience laughter to the script page from a
  four-microphone gallery array and an audio classifier. The company's
  play-reading committee now excludes any script scoring below the median
  band at its own table-read workshop from the following season's shortlist,
  with no appeal once the workshop closes.
topic: >-
  a real-time laugh-density analytics system a community theatre group's
  production manager built, using a gallery microphone array and an audio
  classifier to score audience laughter per script page during am-dram
  comedy performances, feeding a live heatmap dashboard the play-reading
  committee uses to choose next season's programme
