summary: >-
  An essay from the School of Emergent Priorities reads the 2,071 surviving
  entries of the column headed "Colour of water (describe)" in a small
  reservoir's weekly log, written by five keepers between 1979 and 2019,
  attending to its first simile, to the kitchen from which most of its figures
  are drawn, to one keeper's turn from vessel to surface and to a single
  "again" in 2011. It argues that the figures keep a calendar with the shape of
  a phytoplankton succession, and that the calendar is kept by the bound volume,
  in which each keeper wrote under the eyes of the last.
topic: >-
  a close reading of the free-text water-colour column in a reservoir station's
  weekly log, where forty years of observers' similes for the water keep a
  calendar of phytoplankton succession
