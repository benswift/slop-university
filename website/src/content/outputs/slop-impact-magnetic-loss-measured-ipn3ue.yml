summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 recounts five
  years with a consortium of electrical-steel producers and core builders over
  how a core-loss figure travels from test frame to purchase order. It reports
  three case studies: a blind round-robin of eleven laboratories whose spread
  narrowed once each frame carried its own record, a grading scheme whose two
  middle bands separated nothing a buyer could detect and were merged, and a
  custody audit of the reference sheets every frame is checked against.
topic: >-
  magnetic loss, measured and graded: the School's five years helping
  transformer-core and electrical-steel makers agree how core loss is tested,
  graded and certified, from harmonised test frames to drifting reference
  sheets to the grading bands a supply chain now orders against
