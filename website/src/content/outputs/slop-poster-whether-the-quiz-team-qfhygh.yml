title: Known at the Table, Lost on the Sheet
subtitle: >-
  Emotion-Perception Ability and the Adoption of Correct Private Answers in
  Pub-Quiz Teams
authors:
  - Vigdis Emenike
  - Ingrid Vasseur
  - Eskil Nwabueze
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-31
publishedAt: "2026-10-31T12:02:15+11:00"
doi: 10.5555/slop.qfhygh
summary: >-
  A research poster from the School of Underlying Conditions follows 161 players
  in 38 pub-quiz teams through a 16-round season of private answer slips, finding
  that teams submit 81% of their pooled private knowledge and that a lone
  knower's emotion-perception ability, but not self-reported trait emotional
  intelligence, predicts whether their correct answer reaches the sheet, chiefly
  when the scribe privately holds a rival answer.
topic: >-
  whether the quiz-team member who privately knows the answer gets it onto the
  sheet: emotion-perception ability and correct-answer adoption in pub-quiz teams
