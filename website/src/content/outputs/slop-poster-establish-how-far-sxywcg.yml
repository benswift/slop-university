title: How Old Do Shoppers Think That Flyer Is?
subtitle: >-
  Guessed noticeboard-flyer age against the shopfront's own removal log, at
  eighteen supermarket and strip-mall entrances
authors:
  - Anouk Mensah
  - Fenna Okoro
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-13
publishedAt: "2026-09-13T22:34:28+10:00"
doi: 10.5555/slop.sxywcg
summary: >-
  A research poster from the School of Emergent Priorities surveys 245
  shoppers across eighteen supermarket and strip-mall entrances on their
  guessed age of a pinned noticeboard flyer, finding guesses track the
  board's surrounding clutter far more closely than the shop's own removal
  log, and commits any site whose divergence clears nine days to a
  mandatory date-stamp audited at each Horizon Register visit.
topic: >-
  Establish how far shoppers' guessed age of a pinned entrance-noticeboard
  flyer diverges from its logged removal date at supermarkets and
  strip-mall shopfronts, and mandate a visible date-stamp for any
  noticeboard the divergence flags
