title: The Composure Rating Did Not Move Anyone to the Kerb
subtitle: A Crossover Test of a Stencilled Glance-Count Grade at Six Suburban Bus Stops
authors:
  - Ylva Ogunbanjo
  - Iben Chikere
  - Ronja Oyelaran
preset: research-poster
school: School of Emergent Priorities
