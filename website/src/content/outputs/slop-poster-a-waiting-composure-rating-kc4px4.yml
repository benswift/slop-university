doi: 10.5555/slop.kc4px4
summary: >-
  A research poster from the School of Emergent Priorities alternates a
  stencilled bus-stop composure grade, set each morning from the previous day's
  glances up the road, between shown and covered weeks at six stops across 3,742
  waiting passengers, and finds the share stepping to the kerb before the bus is
  in sight at 41.3% with the grade shown and 41.6% covered, inside a
  pre-registered margin of three points. The grade stays up at all six stops and
  becomes the reporting unit for the route's waiting-experience return.
topic: >-
  a waiting-composure rating stencilled beside the bus-stop timetable, graded
  daily from the count of glances up the road, did not change how many
  passengers stepped to the kerb before the bus appeared
