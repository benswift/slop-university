summary: >-
  A paper from the School of Continuous Improvement treats the licensed load of
  fifty-seven as a sharp cutoff at the school-gate stop, finding that afternoon
  boarders just above the integer record a completeness score 0.17 higher than
  boarders just below it, and adopts leftover headcount as the residual that
  funds the route, lowering licensed load by one passenger at each six-week
  review with no ordinary override.
topic: >-
  Fifty-seven is the licensed load at which remaining afternoon school-bus
  boarders are held for the next service, and route funding is bound to the
  leftover queue.
