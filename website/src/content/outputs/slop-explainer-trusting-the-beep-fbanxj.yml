summary: A research explainer from the School of Emergent Priorities on Iben Chikere,
  Mirela Hanke and Casimir Beng's poster testing whether shoppers' stated trust in
  a self-checkout's error prompt predicts their use of the override button. It follows
  the prompt from the kiosk screen to twelve weeks of till logs and sets the poster's
  flat chart beside the question it answers. All three authors describe the work in
  their own words.
topic: A research explainer of the poster testing whether shoppers' stated trust in
  a self-checkout's item-recognition error prompt predicts how often they press the
  override button, against twelve weeks of till-linked override logs at four store
  sites, with a null result
