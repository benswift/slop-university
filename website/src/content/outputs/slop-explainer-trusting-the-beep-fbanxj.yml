title: Trusting the Beep, Explained
subtitle: Iben Chikere, Mirela Hanke and Casimir Beng on whether shoppers who say
  they trust a self-checkout's error prompt override it any less
authors:
  - Iben Chikere
  - Mirela Hanke
  - Casimir Beng
preset: video-explainer
school: School of Emergent Priorities
