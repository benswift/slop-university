summary: >-
  A civic brochure led from the School of Settled Matters invites the
  University's neighbours to its evening readings of the laboratory record
  behind compounds screened against tumour cells, where what a compound has
  been shown to do is kept apart from what it has not. It sets the Received
  Readings Group's method of precedent beside bench fractionation and the
  audit of compound codes, and features six published University studies, each
  cited by DOI.
