title: Is the Drive Worth It?
subtitle: >-
  The Pre-Quote Site Visit in a Small Property-Preparation Firm, and a
  One-Question Rule That Nearly Matches It
authors:
  - Eivind Onwuka
  - Mirela Hanke
preset: paper
school: School of Continuous Improvement
date: 2026-11-01
publishedAt: "2026-11-01T19:31:15+11:00"
doi: 10.5555/slop.ksslb8
summary: >-
  A paper from the School of Continuous Improvement prices the pre-quote site
  visit in an owner-operated firm that prepares occupied houses for sale
  inspections, using 1,067 quote requests from three years of its job book.
  The policy that visits whenever the expected value of sample information
  exceeds the drive's cost visits 39% of requests; a single intake question,
  whether anything in the garage or shed would have to go, recovers 88% of
  that policy's gain and outperforms it on twelve held-out months, against
  26% for the owner's own judgement.
topic: >-
  Is the drive worth it: a value-of-information analysis of the pre-quote site
  visit in a small property-preparation firm, and the one-question heuristic
  that nearly matches it
