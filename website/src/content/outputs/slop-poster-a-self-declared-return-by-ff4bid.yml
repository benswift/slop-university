summary: A research poster from the School of Emergent Priorities deploys a self-declared "return-by" dial tag on gym lockers across six suburban sites in a twelve-week stepped-wedge trial. Median time-to-intervention on an unattended locker rises from a pooled pre-rollout figure of 21 minutes to 37 minutes post-rollout, with staff extending patience rather than members returning any sooner.
topic: >-
  a self-declared 'return-by' dial tag clipped to gym lockers, and whether
  staff or other members actually wait any less once someone declares when
  they'll be back
