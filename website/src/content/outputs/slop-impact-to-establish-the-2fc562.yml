title: Strangers Leave Three Hand-Widths Between Them on a Bus-Stop Bench
subtitle: >-
  The School of Continuous Improvement Impact Report 2021–2026, and the
  meeting-room seating standard drawn from the survey
authors:
  - Marit Osayande
  - Mirela Hanke
  - Joost Nwosu
preset: impact-report
school: School of Continuous Improvement
date: 2026-09-20
publishedAt: "2026-09-20T04:01:12+10:00"
doi: 10.5555/slop.2fc562
summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 reports a
  five-season survey of 61,208 pairs of adjacent strangers on 1,340 bus-stop
  benches, giving the clear gap between them as a distribution with a mode of
  three hand-widths. Since March 2024 every seat in a School meeting room has
  been set at that gap, and each room's rated capacity is the number of seats
  that fit, with no exception sustained beyond a single review cycle.
topic: >-
  To establish the distribution of gaps, in hand-widths, that strangers leave
  between themselves on a bus-stop bench, and to space every seat in the
  School's meeting rooms at the modal gap
