title: The Lost Cat Always Rises
subtitle: >-
  A Taxonomy of What Gets a Neighbourhood-Forum Post Seen, and Its Adoption
  as the Sole Case-Selection Rule for Improvement Grand Rounds
authors:
  - Bram Ntuli
  - Sten Okwuosa
  - Iben Chikere
preset: paper
school: School of Continuous Improvement
date: 2026-09-11
publishedAt: "2026-09-11T09:01:30+10:00"
doi: 10.5555/slop.bacd54
summary: >-
  A paper from the School of Continuous Improvement and the School of
  Emergent Priorities codes 812 neighbourhood-forum threads about everyday
  shared problems into a five-category taxonomy of what makes each post
  visible, finding the taxonomy predicts a thread's reply count and feed
  position closely while an independently rated, blinded severity score
  does not. The School's Improvement Grand Rounds has adopted the same
  taxonomy as its sole rule for selecting which internally logged incidents
  reach a case-review session.
topic: >-
  What decides which neighbourhood-forum post about a shared problem
  actually gets seen? A taxonomy sorting posts by what got them noticed
  rather than what they reported, adopted by the University's sole triage
  rule for internal complaints.
