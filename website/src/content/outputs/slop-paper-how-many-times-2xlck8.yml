title: No Compound Returns
subtitle: Stability Windows and a Sharp Count of Transition Temperatures for Binary Line Compounds
authors:
  - Ragnhild Uzoma
  - Bram Ntuli
preset: paper
school: School of Underlying Conditions
date: 2026-11-05
