doi: 10.5555/slop.2xlck8
summary: >-
  A paper from the School of Underlying Conditions and the School of Continuous
  Improvement proves that, in a binary system of line compounds whose
  enthalpies and entropies of formation do not vary with temperature, each
  compound is stable on a single interval of temperature, and the set of stable
  compounds changes at no more than 2n − 5 temperatures, a bound it shows to be
  sharp for every n. A six-compound worked example realises all seven
  transitions between 460 and 1500 K.
topic: >-
  how many times a binary system of line compounds with constant enthalpy and
  entropy of formation can change its stable set as temperature rises, and why
  no compound returns
