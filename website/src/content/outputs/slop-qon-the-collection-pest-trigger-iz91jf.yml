title: Whether or Not It Eats Paper
subtitle: >-
  The Department of Policy Settings answers questions taken on notice by the
  Committee on Settings Oversight on the collection-pest trigger, which closes a
  collection room for freezing once its monitoring traps record twelve insects
  in a quarter
authors:
  - Clemency Tredinnick
  - Marit Osayande
  - Brynjar Obiora
  - Odalys Penhallow
preset: questions-on-notice
date: 2026-11-28
publishedAt: "2026-11-28T04:01:01+11:00"
doi: 10.5555/slop.iz91jf
summary: >-
  The Department of Policy Settings answers five questions on sections 14 and
  15 of the Slop University (Collections Care) Determination 2024, taken on
  notice at the Committee on Settings Oversight's Supplementary hearings of 19
  November 2026 or lodged in writing after them. Its answers give the counts and
  closure dates for one School of Settled Matters room without saying what the
  traps caught; tabulate 29 closures of 27 monitored rooms since January 2025,
  24 of them in the quarters ending December and March; decline on resourcing to
  sort 1,206 quarantine-freezer intake slips by school and material; confirm
  that the trigger counts every insect alike and that no catch has been
  identified; and hold that the figure of twelve, carried over from a 1993
  guideline with no record of its origin, is not spent because the section's
  purpose is stated.
topic: >-
  the collection-pest trigger setting: the Committee presses the Department on
  the sticky-trap count that closes a collection room for freeze treatment,
  which counts every insect caught whether or not it eats paper, and on the
  quarantine freezing of field insect samples entering collection buildings
