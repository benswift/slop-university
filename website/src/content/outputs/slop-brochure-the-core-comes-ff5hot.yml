summary: >-
  A prospectus from the School of Underlying Conditions for its blended study
  of the earth sciences, in which students log scanned drill core online, work
  through a posted tray of reference soils and rock chips at home, and gather
  for residential field blocks at the soil pit, the monitoring bore and the
  outcrop. It sets that teaching beside five of the School's published studies
  and asks students, from the first week, to describe what a record leaves out
  as carefully as what it holds.
