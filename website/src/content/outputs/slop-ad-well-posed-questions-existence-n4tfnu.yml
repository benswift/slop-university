title: Learn to Ask a Well-Posed Question
subtitle: >-
  A come-study marketing poster for landscape signage panels, setting the
  analyst's three tests of a question (existence, uniqueness, stability) over
  two sets of ripples crossing a campus lake.
authors:
  - Clemency Tredinnick
preset: marketing-poster
school: School of Settled Matters
