summary: >-
  A display advertisement from the School of Settled Matters invites
  prospective students to learn the habit that nonlinear analysis brings to
  any equation, asking whether an answer exists, whether it is the only one
  and whether it holds when the data move, and positions that habit as the
  first discipline of a question worth settling.
topic: >-
  well-posed questions: existence, uniqueness and stability under small
  changes in the data, the analyst's habit offered as the reason to study
