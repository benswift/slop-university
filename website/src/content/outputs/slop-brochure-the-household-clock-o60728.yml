summary: >-
  A research-showcase brochure from the Schools of Emergent Priorities and
  Continuous Improvement draws together the University's published work on
  household timeout timers, screen-time token economies, and a
  booked-but-empty meeting room's release timer, framing each as a study of
  whether an instrument's logged ending matches the one anyone actually
  meant.
topic: >-
  the household clock that's supposed to end an argument, and how quickly
  everyone finds the workaround
