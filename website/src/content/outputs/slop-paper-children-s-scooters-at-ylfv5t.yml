doi: 10.5555/slop.ylfv5t
summary: >-
  A paper from the School of Continuous Improvement sorts 17,580 scooter-afternoons
  at twelve primary-school gates into a four-cell quadrant of racked or leaned
  against collected by its own child or another. Once a council announced that
  its footpath-widening round would be ranked on the racked share at 3.05 pm,
  that share rose from 41.0% to 88.0% and wrong-child pickups from 3.3% to 12.6%.
  The round now ranks gates on the Strewn share, and the University has committed
  to staffing each ranked gate with a tagging observer for four consecutive terms.
topic: >-
