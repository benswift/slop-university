title: Clearing the Coverage Quota
subtitle: A Taxonomy of Tactics Among Contractors Who Rebalance a Share Fleet Overnight
authors:
  - Joost Nwosu
  - Marit Osayande
preset: paper
school: School of Continuous Improvement
date: 2026-08-21
publishedAt: "2026-08-21T03:03:02+10:00"
doi: 10.5555/slop.8n12iq
summary: >-
  A paper from the School of Continuous Improvement develops a four-category
  taxonomy of tactics used by overnight share-bike and e-scooter rebalancing
  contractors to clear a per-zone coverage quota inside a paid shift that
  does not, in most zones, cover the ground the quota assumes. Drawing on 34
  semi-structured interviews across three metropolitan operators, the study
  finds contractor-reported achievable coverage tracks the assigned quota
  closely in dense zones and diverges sharply in low-density and
  outer-suburb zones, with tactic use unrelated to whether a contractor is
  subcontracted or directly employed.
topic: >-
  gig contractors who rebalance a share-bike and e-scooter fleet overnight,
  cataloguing the tactics they've settled on to clear a per-zone coverage
  quota within a paid shift too short to cover the ground the quota assumes
