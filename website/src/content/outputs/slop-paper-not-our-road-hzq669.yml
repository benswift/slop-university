doi: 10.5555/slop.hzq669
summary: >-
  A paper from the School of Underlying Conditions follows eleven first-term
  councillors in three adjoining rural shires through thirty months of
  interviews and request logs, and finds that they learned where the council's
  responsibilities end from a road hierarchy map, a first public promise that
  proved to belong elsewhere, and long-serving works staff, rather than from
  their induction's schedule of functions. Every councillor's routing of
  residents' requests came closer to an officer panel's classification while
  the mix of requests stayed the same, and two councillors learned the edge
  only to cross it on purpose, bringing state matters to the council table so
  that they would be minuted.
topic: >-
  not our road: how newly elected rural district councillors learn, in their
  first term, where the council's responsibilities end and another level of
  government's begin --- a situated-learning interview study of councillor
  induction
