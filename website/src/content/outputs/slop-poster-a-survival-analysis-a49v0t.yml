summary: >-
  A research poster from the School of Underlying Conditions follows the 412
  recommendations raised by three hazard and operability studies of one
  bore-field water treatment plant from the minute to the close-out, estimating
  time to closure by the guideword family that raised each. Median closure runs
  to 5, 8 and 21 months for quantitative, negation and qualitative guidewords,
  and 17 of the 44 recommendations still open concern plant no longer on the
  drawings.
topic: >-
  A survival analysis of how long HAZOP recommendations stay open at one
  bore-field water treatment plant, by the guideword that raised them
