summary: >-
  A marketing poster for the School of Emergent Priorities fronts Associate
  Professor Kwame Lindqvist, whose work traces how a funding commitment outpaces
  the scoping meant to justify it, with the instance his research keeps
  returning to --- a hotel linen-reuse programme carrying a target, a print run
  and a reporting line, and no settled account of what a reused towel is.
  Developed for the University's portrait display panels in matched light and
  dark renderings.
topic: >-
  the hotel towel card you hang back up, and a linen-reuse target costed and
  committed before anyone settled what counts as a towel reused
