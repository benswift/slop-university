summary: >-
  A case-for-support brochure from the Schools of Emergent Priorities and
  Continuous Improvement invites partners into the University's programme on the
  lay-by: a completion assessment carried on the Horizon Register, a review
  architecture for held goods lodged in the Indicator Commons, and the teaching
  that puts an accredited reviewer within reach of the counter. Four published
  studies and two researcher profiles carry the case.
topic: >-
  Underwriting the lay-by: a case-for-support campaign for the University's work
  on goods held out the back of a country store against a promise paid in
  instalments --- the completion assessment, the forfeiture review, and the
  register of what is being kept for whom.
