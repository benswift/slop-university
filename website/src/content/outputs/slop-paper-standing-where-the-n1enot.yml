title: Standing Where the First Surveyor Stood
subtitle: Relocation Error and Apparent Change in a Resurveyed Soil Monitoring Network
authors:
  - Brynjar Obiora
  - Vigdis Emenike
  - Dagny Okafor
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
publishedAt: "2026-10-12T22:32:00+11:00"
doi: 10.5555/slop.n1enot
summary: >-
  A paper from the School of Underlying Conditions uses steel pins buried
  unrecorded at 48 points of an upland soil monitoring network to measure how
  far four field teams land from each point when relocating it from field
  notes, recorded coordinates, or both. Relocations from notes fell a median
  3.6 m from the pin and leaned towards the landmark the note was written from,
  and topsoil organic carbon sampled at the relocated spot and at the pin on
  the same afternoon differed by most of what the network had reported as
  eleven years of change.
topic: >-
  standing where the first surveyor stood: how far a resurvey team lands from
  the original sampling points of a soil monitoring network, and how much of
  the soil change it reports is relocation error
