doi: 10.5555/slop.yd0c36
summary: >-
  A research poster from the School of Emergent Priorities reports a
  qualitative interview study of fifty-four strip-mall traders on the
  clock-hand door sign, coded in participants' terms into four attested
  kinds of absence. The Horizon Register now accepts a paused-priority
  entry only when tagged with one of those kinds; untagged pauses are
  returned unlogged.
topic: >-
  The Horizon Register is commissioning interviews with strip-mall traders
  about the clock-hand back-in-five-minutes sign they hang on the door,
  capturing in their own words the kinds of absence the sign actually
  covers, and will accept a paused-priority entry only in that attested
  vocabulary.
