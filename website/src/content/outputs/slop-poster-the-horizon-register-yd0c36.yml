title: Towards an Attested Vocabulary of Five Minutes
subtitle: >-
  What strip-mall traders mean by the clock-hand door sign, in their own
  words
authors:
  - Iben Chikere
  - Anneke Tolan
  - Lindiwe Achterberg
preset: research-poster
school: School of Emergent Priorities
