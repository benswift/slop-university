title: What the Shaft Passed Through
subtitle: Doubt and a Borrowed Rock Density in an Undergraduate Determination of the Earth's Mean Density, 1958–2001
authors:
  - Ragnhild Uzoma
  - Sunniva Balogun
preset: paper
school: School of Underlying Conditions
