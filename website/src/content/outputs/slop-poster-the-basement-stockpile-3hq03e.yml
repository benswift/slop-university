title: Where the Tubes Went Down
subtitle: Retired Fluorescent Tubes as an Urban Rare-Earth Deposit, and Where to Site a Recovery Depot
authors:
  - Ragnhild Uzoma
  - Ronja Oyelaran
preset: research-poster
school: School of Underlying Conditions
