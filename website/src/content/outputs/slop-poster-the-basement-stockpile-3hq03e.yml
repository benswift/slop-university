doi: 10.5555/slop.3hq03e
summary: >-
  A research poster from the School of Underlying Conditions surveys the
  basements of 214 older commercial buildings in one city centre and logs
  41,870 retired fluorescent tubes left there after LED retrofit, most of them
  in buildings reached by stairs alone. A maximal-covering comparison of three
  candidate lamp-recovery depots finds a laneway car-park reaches 64% of the
  logged stock within a 600 m trolley haul, against 22% for the draft plan's
  industrial lot, with the 51 basements not entered kept on the map as
  unrecovered intervals.
topic: >-
  the basement stockpile as an unlogged deposit: an urban planner surveys where
  a city's retired fluorescent tubes, and the europium and terbium phosphors in
  them, sit after LED retrofit, and sites a lamp-recovery depot by their
  catchments
