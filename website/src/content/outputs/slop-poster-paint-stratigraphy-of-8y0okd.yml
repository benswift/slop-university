summary: >-
  A research poster from the School of Underlying Conditions reads paint
  cross-sections from 34 of the 41 plaster surface models in one mathematics
  department's teaching cabinet as four campaigns, finding that the models were
  repainted twice to agree with printed images of them: first with the
  two-colour curvature lines of the department's lecture-note plates, then with
  the even grey of its halftone model catalogue. The seven models still in
  colour are the seven the catalogue never photographed.
topic: >-
  paint stratigraphy of a teaching cabinet of plaster mathematical surface
  models: cross-sections read as overpaint campaigns that repainted the models
  to match the department's printed diagrams
