doi: 10.5555/slop.iltsyr
summary: >-
  A paper from the School of Underlying Conditions interviews 31 first-year
  students on the morning after they impregnate a rock chip with epoxy for
  thin sectioning, and describes five ways they understand the overnight
  wait: as drying, as cooling, as the hardener working on the resin, as two
  substances reacting, and as a network forming. Twenty-three hold one of the
  first three, the practical gives none of them a reason to change, and the
  laboratory sheet's own instruction is found to teach the drying account.
topic: >-
  what first-year earth-science students think is happening while the epoxy
