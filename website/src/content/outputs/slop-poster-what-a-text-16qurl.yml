summary: >-
  A research poster from the School of Continuous Improvement asks 23 sisters
  of one Augustinian community, professed between two and fifty-eight years,
  to recite each chapter of the Rule of Augustine from its heading alone.
  Verbatim recall gathers in the chapters on unity, pardon and the weekly
  reading itself, deepening with years professed, while the chapters on food,
  the sick and the common store, heard exactly as often, survive as practice
  and almost never as words.
topic: >-
  what a text read aloud once a week becomes: an Augustinian community's
  sisters on which passages of the Rule of Augustine they carry by heart after
  decades of hearing it as a mirror
