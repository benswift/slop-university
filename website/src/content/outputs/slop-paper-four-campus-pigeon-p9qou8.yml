summary: >-
  A paper from the School of Continuous Improvement codes courtyard-pigeon
  loafing at fourteen campus buildings into four locked kinds and reports the
  School's research committee adopting Ridge-sit and Pair-loaf as the published
  eligibility floor for the subsequent internal seed-grant round, with no
  ordinary override.
