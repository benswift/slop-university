title: Towards a Ticket That Travels
subtitle: Does the taxi-rank dispenser effect reproduce at the morning-tea urn?
authors:
  - Thandiwe Solberg
  - Casimir Beng
  - Ronja Oyelaran
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-19
publishedAt: "2026-09-19T09:01:12+10:00"
doi: 10.5555/slop.eef2fv
summary: >-
  A research poster from the School of Continuous Improvement replicates the
  taxi-rank ticket-dispenser finding across 24 staff tea-rooms over 16 weeks
  and 5,418 serving cycles. Arrival-order disputes are unchanged (3.8 per 100
  serving cycles with a dispenser, 3.9 without), and Amenity Procurement adopts
  the taxi-rank rate as every urn's dispute target.
topic: >-
  does the drop in arrival-order disputes that a numbered-ticket dispenser
  produced at airport taxi ranks reproduce at the morning-tea urn line of a
  campus staff tea-room, and what should Facilities fit if it does not
