title: A Plate Is Not a Visit
subtitle: >-
  Classifying 24,318 Camera Entry-Exit Pairs at Six Shopping-Centre Car Parks
  Against a Paired Exit-Survey and Observation Record
authors:
  - Anneke Tolan
  - Marek Solheim
  - Osei Vandermeer
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-05
publishedAt: 2026-08-05T18:03:33+10:00
doi: 10.5555/slop.9jx27w
summary: >-
  A research poster from the School of Emergent Priorities classifies 24,318
  plate-camera entry and exit pairs at six shopping-centre car parks against a
  paired ground-truth record: an exit-lane intercept survey on 1,180 pairs and
  214 hours of lane observation, with classes derived at the first centre and
  applied blind at the remaining five by two coders (kappa = 0.83). 58.6 per
  cent of pairs correspond to one shopping party's single stay; relocations
  within the site (12.4 per cent), read faults (10.1), boundary faults (9.8)
  and stays covering a party larger than the vehicle (9.1) account for the
  rest. Compliance recomputed on shopping parties from the same cameras falls
  from the published 94.1 per cent of pairs to 81.7 per cent.
topic: >-
  the three-hours-free sign and the plate cameras at a shopping-centre car
  park, where centre management reports a compliance rate built from camera
  entry-exit pairs --- classified against a paired exit-survey and observation
  record of what each pair actually was, so a shopper who shifts their car
  twice counts as two compliant visits and a household of three counts as one
  breach
