summary: >-
  A civic brochure from the School of Emergent Priorities invites the University's
  neighbours into its open lectures, where a semester-long survey of where
  everyone sits, reported as distributions of seat distance from the doorway,
  now sets each theatre's median seat, and no lecture begins until that seat is
  occupied. It cites six published studies by title and DOI and profiles the
  researchers who read the room.
topic: >-
  Notes on the back row: although every lecture-theatre seat is free to take, a survey of where students sit across a semester, reported as distributions of seat distance from the door, becomes a rule that no lecture begins until the median seat is occupied
