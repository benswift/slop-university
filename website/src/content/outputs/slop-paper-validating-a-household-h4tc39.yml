title: Marked Engaged, Opens Anyway
subtitle: >-
  Validating a Household Safety Walkthrough's Latch-Engaged Checklist Item
  Against a Standardised Pull-Force Test
authors:
  - Petra Umbile
  - Sten Okwuosa
preset: paper
school: School of Emergent Priorities
date: 2026-07-26
doi: 10.5555/slop.h4tc39
summary: >-
  A paper from the School of Emergent Priorities validates 412 kitchen
  cabinet child-safety latches' walkthrough-recorded status against a
  standardised pull-force test, finding the checklist's engaged-and-functional
  item substantially over-credits function and that neither professional
  installation nor self-checking narrows the gap.
