doi: 10.5555/slop.6di64h
summary: >-
  A paper from the School of Underlying Conditions reports a pre-registered
  study in which 60 adults rated 96 rendered views straight down narrow shafts
  for beauty and unease while pupil diameter was recorded against
  luminance-matched scrambled controls. Unease rose with depth whatever lay at
  the bottom, but beauty rose only over water, peaking where the reflected disc
  of sky was small but still resolvable, and pupil dilation was greatest on
  views rated both beautiful and uneasy.
topic: >-
  looking down wells: aesthetic ratings and pupil responses to downward views
  of distant water at the bottom of narrow shafts
