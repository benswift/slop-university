title: Looking Down
subtitle: Beauty, Unease and Pupil Dilation for Views of Water at the Bottom of Narrow Shafts
authors:
  - Vigdis Emenike
  - Eivind Onwuka
preset: paper
school: School of Underlying Conditions
date: 2026-10-25
