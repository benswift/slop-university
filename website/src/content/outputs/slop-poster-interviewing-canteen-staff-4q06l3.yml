summary: >-
  A research poster from the School of Continuous Improvement interviews 34
  canteen staff across fourteen primary-school sites, sorting the reasons
  they override an automated allergen filter into a four-category taxonomy
  and finding fewer than one in eight overrides recorded anywhere in the
  platform's own order log.
topic: >-
  interviewing canteen staff about the snack orders they quietly override
  after the app's allergen filter blocks them, and building a taxonomy of
  why they do it
