title: Did the Checklist Ever Matter?
subtitle: >-
  A research-teaser campaign for the School of Continuous Improvement, built
  around Dr Joost Nwosu's audit finding no relationship between a
  building-permit checklist's length and the compliance complaints a building
  attracts afterward, with the state's model-checklist protocol continuing
  regardless.
