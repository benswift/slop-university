doi: 10.5555/slop.ofpsxu
summary: >-
  A marketing poster for the School of Continuous Improvement previews Dr
  Joost Nwosu's audit of building-permit inspection checklists across
  incorporated shires, finding no relationship between a checklist's length
  and the post-occupancy compliance complaints a building later attracts, and
  reports the state's model-checklist protocol adding one item to every
  council's checklist at each review cycle regardless of the finding.
topic: >-
  council building-permit checklist length, audited across incorporated
  shires: no relationship with post-occupancy compliance complaints, and the
  file closes on that null
