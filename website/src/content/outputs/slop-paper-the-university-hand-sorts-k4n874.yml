doi: 10.5555/slop.k4n874
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement treats the hand-assembled three-dollar bag of mixed lollies as
  compositional data, purchasing 1,180 bags at 63 independent milk bars across
  eleven weeks and hand-sorting all 22,417 pieces to a fourteen-class scheme
  fixed before collection. Analysis on centred log-ratio coordinates finds
  composition markedly more stable within a shop than between shops (median
  Aitchison distance 0.21 against 0.58), with shop identity accounting for 44.1
  per cent of variation against 6.8 per cent for region, and no distinguishable
  shift across price bands. The closed geometric mean of the per-shop centres
  yields a reference composition, now carried by the Indicator Commons as a
  standing reference against which catering supplied under the University's own
  arrangements is assessed.
topic: >-
  The University hand-sorts and weighs the three-dollar paper bag of mixed
  lollies scooped from the jars behind sixty-three independent milk-bar
  counters, treats what comes out as compositional data, and issues the mean
  composition as a reference standard its own catering is then graded against.
