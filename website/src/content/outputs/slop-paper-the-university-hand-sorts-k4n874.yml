title: The Composition of the Mixed Lolly Bag
subtitle: A Compositional Analysis of 1,180 Bags Hand-Sorted Across 63 Independent
  Milk Bars
authors:
  - Iben Chikere
  - Runa Adegoke
  - Lindiwe Achterberg
  - Marit Osayande
preset: paper
school: School of Emergent Priorities
date: 2026-08-17
