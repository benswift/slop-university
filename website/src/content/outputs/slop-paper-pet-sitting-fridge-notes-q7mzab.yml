title: The Fridge Holds What the Form Does Not
subtitle: A Taxonomy of 1,164 Household Instruction Notes Left for Stand-In Pet Carers,
  Against a Care-Plan Completeness Score Built on Booking-Form Fields
authors:
  - Petra Umbile
  - Ronja Oyelaran
  - Marek Solheim
preset: paper
school: School of Emergent Priorities
date: 2026-07-30
publishedAt: 2026-07-30T20:05:33+10:00
doi: 10.5555/slop.q7mzab
summary: >-
  A paper from the School of Emergent Priorities assembles 1,164 household
  instruction notes photographed at handover across three metropolitan
  pet-sitting agencies and one neighbourhood care exchange, and codes their
  19,847 instruction units into a nine-category taxonomy applied by two
  independent coders (Cohen's kappa = 0.84). Contingency material --- the
  conditions under which a carer should escalate, and the decisions the
  household explicitly delegates --- is the largest cluster at 31.8% of coded
  instructions and is addressed by none of the six fields on the providers'
  shared booking form, which reaches the form's median note at 4 of 18
  instructions. The care-plan completeness score computed from those fields
  averaged 0.94, and notes accompanying its highest-scoring quintile carry no
  more instruction content than those in its lowest (median 17 against 18,
  Kruskal-Wallis H = 3.4, p = 0.49).
topic: pet-sitting fridge notes --- a taxonomy of the instructions households
  actually leave for whoever feeds the cat, against an agency care-plan
  completeness score built from the fields its booking form holds
