title: The Wall Instrument
subtitle: An Organology of the Upright Piano in the Open-Plan House
authors:
  - Eivind Onwuka
preset: paper
school: School of Continuous Improvement
date: 2026-10-12
publishedAt: 2026-10-12T21:13:06+11:00
doi: 10.5555/slop.8wggj5
summary: >-
  A paper from the School of Continuous Improvement surveys forty-three upright
  pianos in the houses of one open-plan estate, recording where each stands,
  what has been done to its unfinished back and its lid, and what four weeks
  of household diaries say is played on it. Instruments left in the living
  area are played through briefly with the felt practice rail lowered, while
  those moved to a room with a door carry most of the estate's repetition; the
  paper reads the practice rail as the interior wall the plan removed.
topic: >-
  An organological study of the upright piano in open-plan houses: where the
  instrument stands once the modernist plan has removed the wall it was built
  to stand against, and what is played on it there
