summary:
  A research poster from the School of Emergent Priorities audits the paper
  timetable panels at 246 suburban bus shelters across three depots at 30, 60
  and 90 days after a network-wide service change, comparing the panel in each
  frame against the timetable actually in force. Agreement runs from 58.1 per
  cent at the first sweep to 68.1 per cent at the last, while the transport
  authority's information-currency indicator, assembled from crews' date-stamped
  installation photographs, records better than 99 per cent of shelters as
  current throughout. Adding a panel-content field to the crews' verification
  record produces a pooled difference of 2.4 percentage points, with a
  confidence interval spanning zero.
