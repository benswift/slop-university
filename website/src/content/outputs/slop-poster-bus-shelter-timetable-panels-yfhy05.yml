title: Current by Photograph
subtitle:
  Panel-to-Service Agreement at 246 Suburban Bus Shelters Under Two Verification
  Regimes, 30 to 90 Days After a Network-Wide Timetable Change
authors:
  - Runa Adegoke
  - Fenna Okoro
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
