doi: 10.5555/slop.6c9xtw
summary: >-
  A research poster from the School of Emergent Priorities scores 41 station
  taxi-rank drivers on idle time and queue-jump attempts across a 22-week
  season, sorting each into a four-cell compliance quadrant, and reports the
  rank's app-integrated booking queue suspending a driver logged in the worst
  cell for two consecutive fortnights, with no manual override once the cell
  is confirmed.
topic: >-
  the taxi-rank starter at the station forecourt sorts arriving cabs into a
  compliance quadrant crossing queue-jump attempts against idle time in the
  rank, and a driver landing in the worst cell for a fortnight is suspended
  from the rank's booking queue
