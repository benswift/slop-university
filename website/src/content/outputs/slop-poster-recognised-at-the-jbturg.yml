doi: 10.5555/slop.jbturg
summary: >-
  A research poster from the School of Continuous Improvement cluster-randomises
  141 second-year agronomy students to learn sixteen weed taxa from pressed
  herbarium sheets, photographs or live seedling flats, then tests them on
  tagged specimens on the bench and in a sown teaching paddock. Students taught
  from sheets named flowering plants best and cotyledon seedlings worst (22%,
  against 58% after live flats), were the most confident at that stage, and
  kept the deficit at a seven-week retest.
topic: >-
  recognised at the wrong stage, agronomy students taught weed identification
