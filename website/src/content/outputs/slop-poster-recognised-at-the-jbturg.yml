title: Recognised at the Wrong Stage
subtitle: Weed Identification Taught from Pressed Sheets, Live Flats or Photographs, Tested at the Cotyledon Stage
authors:
  - Sten Okwuosa
  - Brynjar Obiora
  - Torun Ezeigwe
