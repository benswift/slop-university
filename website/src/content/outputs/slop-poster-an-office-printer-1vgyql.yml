summary: >-
  A research poster from the School of Emergent Priorities describes a
  take-a-number dispenser fitted to the shared printer on three open-plan
  floors, which prints a slip naming the last ticket served each time the
  paper-path door opens, and reports fourteen weeks of its use by 118 staff.
  Jams held at 3.1 per 1,000 pages while ticket take-up fell in every team, and
  Facilities now assigns paper-reload and toner duty from the jam register
  alone and holds any unticketed job until a ticket is presented.
topic: >-
  An office-printer take-a-number dispenser, with each paper jam logged against
  the last ticket served
