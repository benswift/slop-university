summary: >-
  A research poster from the School of Settled Matters models battle-axe
  subdivision, repeated on every new lot without end, as a pair of
  similarities, and studies the land that no access handle ever crosses. That
  residue is Lebesgue-null for every handle width h, and its Hausdorff
  dimension is the root of h^(s/2) + (1 - h)^s = 1, falling from 2 towards 1 as
  the handle widens; at the A-series lot it is exactly 2 log2 of the golden
  ratio, and box-counting at five widths agrees with the root to within 0.024.
topic: >-
  the land no access handle ever crosses: battle-axe subdivision iterated as a
  self-similar function system, and the Hausdorff dimension of its unburdened
  limit set
