title: "Pinned, Not Practised"
subtitle: "Interviewing Share-House Residents About What a Group Chat's House Rules Still Govern"
authors:
  - Anouk Mensah
  - Ronja Oyelaran
  - Marek Solheim
preset: paper
school: School of Emergent Priorities
