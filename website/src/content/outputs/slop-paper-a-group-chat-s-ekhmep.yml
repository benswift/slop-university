doi: 10.5555/slop.ekhmep
summary: >-
  A paper from the School of Emergent Priorities interviews 63 residents
  across 48 households about what their group chat's pinned house rules
  actually govern, finding practised quiet hours run a median of over an
  hour later than the pinned wording states and residents rarely correct it
  once it has drifted. A nudge asking a subset of households to update their
  pin left the pattern unchanged across three follow-up rounds.
topic: >-
  a group chat's pinned house-rules message still governs a share house, in
  residents' own words, once no one remembers who pinned it
