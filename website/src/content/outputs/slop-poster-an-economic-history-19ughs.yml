title: The Autumn Shutdown, Held in June
subtitle: Turnaround timing and the despatch calendar at an inland ammonia works, 1954–1988
authors:
  - Runa Adegoke
  - Marek Solheim
  - Brynjar Obiora
preset: research-poster
school: School of Emergent Priorities
