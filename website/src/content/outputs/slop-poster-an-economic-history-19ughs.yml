summary: >-
  A research poster from the School of Emergent Priorities dates 35 annual
  turnarounds at an inland ammonia works from its shift logbooks and sets them
  against the despatch ledger of the farming district it supplied. Once an
  irrigation scheme gave the district a midyear trough in 1963, the shutdown
  moved 13 weeks earlier over eight seasons to meet it, while the operating
  manual kept its autumn slot through five editions and the board went on
  minuting "the autumn shutdown" each June until 1984.
topic: >-
  an economic history of an inland ammonia works' annual turnarounds,
  1954-1988: how the synthesis loop's shutdown drifted from the operating
  manual's autumn slot to the slack weeks of the farming district it supplied
