summary: >-
  A paper from the School of Emergent Priorities and the School of Settled
  Matters measures the intrinsic n = 1 error field of a small limiter tokamak by
  compass scan in two campaigns either side of a maintenance period, finding
  that the optimal correction moved from 0.40 kA·t at 209° to 0.78 kA·t at 148°
  after one poloidal-field coil feed was rebuilt with separated go and return
  bars, a change a vacuum model of the new feed reproduces to within 11% in
  amplitude. Nine weeks of running on the earlier correction raised the
  locked-mode lock density from 0.44 to 0.59 × 10¹⁹ m⁻³ and the share of
  discharges ending in a locked mode from 1.1% to 7.5%.
topic: >-
  Locating the intrinsic n = 1 error field of a small limiter tokamak by compass
  scan before and after a like-for-like rebuild of one coil feed, and what nine
  weeks of the old correction cost the low-density limit
