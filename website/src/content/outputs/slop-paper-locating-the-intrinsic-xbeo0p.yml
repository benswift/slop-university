title: Like for Like
subtitle: The n = 1 Error Field of a Small Limiter Tokamak Before and After the Rebuild of One Coil Feed
authors:
  - Runa Adegoke
  - Gunnhild Ekwueme
  - Clemency Tredinnick
preset: paper
school: School of Emergent Priorities
