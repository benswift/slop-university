summary: >-
  A research poster from the School of Continuous Improvement audits
  stretch-assignment nominations across four open-plan floors of a franchise
  support office, testing whether a desk's line-of-sight distance from the
  team lead predicts who gets picked. No association survives adjustment for
  tenure and role band, and the University's proximity-based seating chart
  keeps its role as the nomination form's eligibility reference regardless.
topic: >-
  whether an open-plan desk's line-of-sight distance from the team lead
  predicts stretch-assignment nomination, and keeping proximity-based seating
  as the nomination default regardless of the null result
