summary: >-
  A research poster from the School of Settled Matters studies a monatomic
  lattice gas with a purely repulsive pair potential under pressure and proves
  that finding its minimum-enthalpy arrangement takes linear time at and above
  a threshold pressure p* and below 0.30 p*, but is NP-complete for every
  rational pressure between 0.30 p* and 0.75 p*, leaving the band from 0.75 p*
  to p* open. An exact solver run on 5,200 random instances peaks in effort at
  half the threshold pressure at every cell size.
topic: >-
  the computational complexity of finding the minimum-enthalpy arrangement of a
  lattice pair-potential model as pressure rises: NP-hard inside a bounded
  pressure window, polynomial-time once close packing wins
