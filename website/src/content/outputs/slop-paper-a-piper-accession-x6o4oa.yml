title: Never in Flower
subtitle: Leaf Oil and Amide Profiles Test the Four Names Carried by an Unidentified Piper Accession
authors:
  - Odalys Penhallow
  - Halvard Nnamani
  - Gunnhild Ekwueme
preset: paper
school: School of Settled Matters
date: 2026-11-25
