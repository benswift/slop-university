doi: 10.5555/slop.x6o4oa
summary: >-
  A paper from the School of Settled Matters tests the four provisional names
  written into, and later struck from, the record of a glasshouse Piper
  accession that has not flowered in thirty-four years, comparing the leaf
  essential oils and amide profiles of three of its ramets with those of two
  flowering-verified reference accessions of each named species across four
  harvests. No sample falls inside any species' seasonal envelope: three names
  are excluded by wide margins, and the fourth, Piper aduncum, by a margin too
  narrow for two reference accessions to settle, so the accession remains
  Piper sp.
topic: >-
  A Piper accession that has never flowered in thirty-four years under glass,
  profiled by leaf essential oil and amide chemistry against the collection's
  named Piper accessions to test the provisional names its record has carried
