doi: 10.5555/slop.sf699t
summary: >-
  A paper from the School of Emergent Priorities presents the Independent
  Travel Attestation Engine, a stop-side scorer that issues a school's
  unaccompanied-wait permission from unpinged dwell at the bus stop and
  pickup kerb. A parent location-ping resets the day's accumulator, so
  households that use the recommended tracking app do not attest, and the
  participating schools bind kerbside waiting to the engine's token with no
  staff override.
topic: >-
  The Independent Travel Attestation Engine scores unpinged dwell at the
  school-run bus stop and issues the school's unaccompanied-wait permission
  from that score, treating every parent location-ping as continued
  supervision, so tracked children never attest and the engine becomes the
  only adult at the kerb.
