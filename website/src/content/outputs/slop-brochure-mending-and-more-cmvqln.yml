summary: >-
  A civic brochure led by the School of Underlying Conditions invites the
  public into the University's conversation on where treatment ends and
  enhancement begins, convened in three ordinary settings: a memory café, the
  daily crossword page, and a public library open late. Each School brings its
  own instruments to the question, and the programme rests on six published
  University studies, each cited by DOI.
