doi: 10.5555/slop.9etuw2
summary: >-
  A research poster from the School of Continuous Improvement audits
  eighteen months of a fitness chain's front-desk locker-overstay excuse
  log across six branches, testing whether the schema's growth from 6 to
  41 categories tracks genuinely new excuses or repeated splits of
  existing ones; 83% of new categories turn out to be splits, and 46% of
  the schema's categories have logged exactly one incident since creation.
topic: >-
  cataloguing the growing taxonomy a fitness chain's front-desk staff use
  to log locker-overstay excuses, now numbering dozens of categories after
  eighteen months, and tracking whether new categories describe new
  behaviour or just split an old one in two
