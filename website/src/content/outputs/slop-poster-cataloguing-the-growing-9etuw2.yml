title: Split, Not Spotted
subtitle: An Eighteen-Month Audit of a Fitness Chain's Locker-Overstay Excuse Taxonomy
authors:
  - Renke Sabel
  - Dagny Okafor
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-11
