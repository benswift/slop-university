summary: >-
  A research poster from the School of Continuous Improvement reads 14
  outpatient rTMS treatment suites in nine clinics as architecture, setting
  each clinic's published interior photograph, re-staged at its plotted
  station point, against the view reconstructed from the treatment chair at
  recline. The photograph was taken from the doorway in 12 suites, plain wall
  or door fills a mean 62% of the seated view, and in nine suites the artwork
  hangs above or behind the headrest, in the photograph and out of the
  patient's sight.
topic: >-
  The repetitive TMS treatment suite read as architecture: a room composed for
  the clinic's one photograph but attended daily for weeks from a fixed seated
  eye position
