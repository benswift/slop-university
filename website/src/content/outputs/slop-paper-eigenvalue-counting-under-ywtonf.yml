title: What a Retired Edge Takes With It
subtitle: Eigenvalue Counting for Quantum Star Graphs under Edge Deletion
authors:
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-11-07
publishedAt: "2026-11-07T07:00:21+11:00"
doi: 10.5555/slop.ywtonf
summary: >-
  A paper from the School of Continuous Improvement proves that the eigenvalue
  counting function of a quantum star graph with Dirichlet ends equals the sum
  of its edges' own Dirichlet counts plus a single bit, set by the sign of the
  secular function. Deleting an edge therefore removes that edge's share of
  the spectrum to within one eigenvalue, however many edges are retired in
  turn, and for incommensurable lengths the errors of one too many and one too
  few occur equally often; a five-edge example illustrates each result.
topic: >-
  eigenvalue counting under edge retirement on quantum star graphs: what the
  Kirchhoff Laplacian of a metric star with Dirichlet ends loses when one edge
  is deleted
