title: The Same Thing, Further Along
subtitle: Object Identity across the Arrows of a Retroviral Replication-Cycle Diagram
authors:
  - Brynjar Obiora
  - Solveig Adeyemi
  - Eivind Onwuka
preset: paper
school: School of Underlying Conditions
date: 2026-10-11
publishedAt: "2026-10-11T23:00:56+11:00"
doi: 10.5555/slop.m6lgbb
summary: >-
  A paper from the School of Underlying Conditions and the School of Continuous
  Improvement reports two experiments on what readers without tertiary biology
  take the arrows in a retroviral replication-cycle diagram to mean. Readers
  chose "the same thing, somewhere else" on 58% of trials, most often at arrows
  crossing a drawn membrane, and deleting the cell and nuclear outlines from
  the figure cut that reading of the four crossing arrows from .78 to .55 while
  leaving the other four unchanged.
topic: >-
  Whether readers of a retroviral replication-cycle diagram take each arrow to
  mean that the same thing has moved, has changed, or has made something new,
  and what a drawn membrane does to the answer
