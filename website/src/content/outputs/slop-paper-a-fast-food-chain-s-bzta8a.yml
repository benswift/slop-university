title: Formalising the Secret Menu
subtitle: A Staggered-Rollout Natural Experiment on Order Frequency at a Quick-Service Burger Chain
authors:
  - Verity Marris
  - Petra Umbile
  - Ingrid Vasseur
preset: paper
school: School of Emergent Priorities
date: 2026-08-22
publishedAt: 2026-08-22T04:05:15+10:00
doi: 10.5555/slop.bzta8a
summary: >-
  A paper from the School of Emergent Priorities tracks a quick-service burger
  chain's staggered, market-by-market formalisation of a word-of-mouth secret
  menu into a code-numbered catalogue with its own review panel, finding no
  consistent increase in how often the catalogued items are ordered and a
  panel whose approval rate held steady even as its turnaround improved.
topic: >-
  a fast-food chain's word-of-mouth secret menu, and what happened to how
  often people actually ordered its items after the chain's ordering-app team
  formalised the whole thing into an official, code-numbered secret-menu
  section with its own approval committee for new additions
