title: "Abrupt, Clear, Gradual, Diffuse"
subtitle: Describing the Three Fronts of a Swelling Matrix Tablet as Soil Boundaries
authors:
  - Brynjar Obiora
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-11-17
