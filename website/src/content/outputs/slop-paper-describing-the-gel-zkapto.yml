doi: 10.5555/slop.zkapto
summary: >-
  A paper from the School of Underlying Conditions describes the gel layer of
  36 hydrating matrix tablets as a soil profile, fitting each of its three
  fronts as a transition with a width and classing the widths on the soil
  survey's distinctness scale. The swelling front stayed abrupt, the diffusion
  front widened as the square root of time, and the erosion front widened
  faster still, until at eight hours its transition zone made up 47% of the
  gel layer; the paper proposes describing that zone as a horizon of its own.
topic: >-
  Describing the gel layer of a swelling matrix tablet the way a soil surveyor
  describes a profile: the three fronts as boundaries with a width, classed
  abrupt to diffuse, and what the widening of each says about release
