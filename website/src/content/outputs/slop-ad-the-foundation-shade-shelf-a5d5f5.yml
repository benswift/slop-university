summary: >-
  A marketing poster advertising Demo Quarter, the School of Continuous
  Improvement's quarterly Masters-program showcase, built on the distance
  between a range as catalogued and a range as stocked --- a graded row of shop
  bottles running pale to deep, its darkest positions standing empty, counted
  along from a step stool. Six words of display type over a retail interior,
  prepared for the University's landscape signage rotation in matched daylight
  and after-dark renderings.
topic: >-
  the foundation-shade shelf at a chemist, where a retailer's range-coverage
  score counts the shades its catalogue lists rather than the ones actually on
  the shelf, and the darkest are perpetually the empty pegs --- a campaign for
  the quarterly showcase where the work is shown as it stands
