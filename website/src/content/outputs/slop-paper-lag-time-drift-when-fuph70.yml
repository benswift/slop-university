title: A Delay Set on Another Press
subtitle: Lag-Time Drift on Transfer of a Compression-Coated Pulsatile Tablet to a Rotary Press
authors:
  - Clemency Tredinnick
  - Casimir Beng
preset: paper
school: School of Settled Matters
date: 2026-11-23
