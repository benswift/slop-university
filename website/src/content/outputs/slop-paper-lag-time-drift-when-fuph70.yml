doi: 10.5555/slop.fuph70
summary: >-
  A paper from the School of Settled Matters moves an in-house
  compression-coated pulsatile tablet from an instrumented single-station press
  to a sixteen-station rotary press and finds its lag time falls from 4.12 h to
  as little as 2.66 h. Precompression restores most of the barrier's
  consolidation but not the delay, because the rotary core feed seats cores off
  centre, and about half the shortfall that survives precompression follows the
  thinner minimum wall.
topic: >-
  Lag-time drift when a compression-coated pulsatile tablet moves from an
  instrumented single-station press to a rotary press: dwell time,
  barrier-layer consolidation and how far precompression restores the delay
