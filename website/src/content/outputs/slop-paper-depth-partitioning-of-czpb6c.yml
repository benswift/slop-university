title: Below the Reach of the Grass
subtitle: Dry-Season Partitioning of Water Uptake between Scattered Paddock Trees and Pasture on Weathered Granite
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-11-12
publishedAt: "2026-11-12T16:00:18+11:00"
doi: 10.5555/slop.czpb6c
summary: >-
  A paper from the School of Underlying Conditions cores fifteen holes to 10 m
  beside and between the remnant eucalypts of one sheep-grazed paddock on a
  granite rise, and traces tree and pasture water to its source by stable
  isotopes. Near the trunks the tree roots follow joints into the lower
  saprolite, and by the late dry season the trees take three-quarters of their
  water from below 1 m while the grass stays in the upper metre, so that the
  overlap between them falls from 0.73 to 0.31.
topic: >-
  Depth partitioning of dry-season water uptake between scattered paddock trees
  and pasture on shallow weathered rock in a silvopastoral system, read from
  xylem-water isotopes and root counts in drill core through the saprolite
