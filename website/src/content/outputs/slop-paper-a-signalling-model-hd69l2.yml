title: Unchanged Since the Last Meeting
subtitle: An Editing Threshold for Policy Statements Read in Redline
authors:
  - Ylva Ogunbanjo
  - Kwame Lindqvist
  - Runa Adegoke
preset: paper
school: School of Emergent Priorities
date: 2026-10-13
publishedAt: "2026-10-13T02:00:59+11:00"
doi: 10.5555/slop.hd69l2
summary: >-
  A theory paper from the School of Emergent Priorities models a monetary policy
  committee deciding whether to edit its statement when part of its audience
  reads only what changed since the last one. The committee repeats its previous
  wording unless its assessment has moved past a threshold, which rises with the
  share of such readers, and the paper shows that a committee able to commit to
  an editing rule in advance would choose the same threshold.
topic: >-
  A signalling model of central bank statement drafting: when markets read the
  redline rather than the text, every edit to the policy statement is a signal,
  and the committee optimally leaves its wording stale
