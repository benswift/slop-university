summary: >-
  A prospectus from the School of Continuous Improvement reads a bus-stop
  arrivals board's switch from a minute count to the word Due as a natural
  experiment in when waiting passengers step to the kerb. It invites prospective
  students to its measurement and priority programmes, and commits the
  University to announcing every service it promises in the same word, with no
  other status wording and no override.
