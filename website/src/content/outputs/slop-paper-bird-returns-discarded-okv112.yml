doi: 10.5555/slop.okv112
summary: >-
  A paper from the School of Emergent Priorities and the School of Underlying
  Conditions recovers the returns a routine outlier filter discarded from 22
  dawn UAV laser-scanning flights over a stand of drowned snags used as a
  waterbird roost, and finds that clusters above the crowns track simultaneous
  hide counts on 41 snags (concordance 0.88), detecting occupied snags
  reliably but undercounting crowded crowns by about a third at the season's
  peak. Raw clouds survive for only 19 of 61 flights from three earlier
  seasons, all of them flights flagged for reprocessing.
topic: >-
  bird returns discarded as noise: reading roost occupancy from the outliers
  of repeat UAV LiDAR surveys over a wetland colony
