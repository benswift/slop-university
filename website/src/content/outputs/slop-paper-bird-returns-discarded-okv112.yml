title: What the Outlier Filter Removes
subtitle: Roost Occupancy from Discarded Returns in Repeat UAV LiDAR of a Wetland Colony
authors:
  - Fenna Okoro
  - Brynjar Obiora
preset: paper
school: School of Emergent Priorities
date: 2026-11-13
