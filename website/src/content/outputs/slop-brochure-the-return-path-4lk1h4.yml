summary: >-
  A research showcase from the School of Underlying Conditions presents power
  system fault detection from the side of the ground that receives the fault,
  through the School's soil survey, the Basement Relations Group's reading of
  drill core and its groundwater fieldwork. It profiles two of the School's
  researchers and rests its invitation on six published studies cited by title
  and DOI.
