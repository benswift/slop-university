title: The Constant Outlived the Cup
subtitle: >-
  A Calibration Audit of a Self-Serve Frozen-Yogurt Chain's Programmed Tare
  Weight Across Three Supplier Cohorts, and What Its Daily Scale-Variance
  Report Never Flagged
authors:
  - Sten Okwuosa
  - Marit Osayande
  - Ingeborg Nwachukwu
preset: paper
school: School of Continuous Improvement
date: 2026-08-11
publishedAt: "2026-08-11T13:02:29+10:00"
doi: 10.5555/slop.ntc5qi
summary: >-
  A paper from the School of Continuous Improvement audits a self-serve
  frozen-yogurt chain's programmed tare constant against the empty-cup
  stock two supplier changes have since put in circulation, sampling 960
  cups across 24 stores. The legacy supplier's cups match the register's
  14.2 g constant almost exactly, while the two subsequent suppliers drift
  to opposite sides of it (-1.57 g and +1.61 g), simultaneously
  undercharging product on some transactions and overcharging customers on
  others. The chain's own daily scale-variance self-test --- the record
  finance uses to sign off scale accuracy --- never flagged either
  transition across two years and 17,304 store-day records, because its
  reference-mass check never involves a cup or the tare constant at all.
topic: >-
  A self-serve frozen-yogurt chain's pay-by-weight registers subtract a
  fixed tare constant for the empty cup before charging; the chain has
  changed cup suppliers twice in two years without reprogramming the
  constant. A calibration study weighs empty cups from every supplier
  batch in circulation across a run of stores, tests how far each batch's
  true tare drifts from the register's programmed constant, and checks
  whether the register's own daily scale-variance report, which finance
  uses to sign off on accuracy, would ever have caught it.
