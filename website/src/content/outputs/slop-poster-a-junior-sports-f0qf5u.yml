title: Compliant, Not Connected
subtitle: >-
  A Junior Sports Association's By-Law Compliance Rate, Tested Against
  Next-Season Re-Registration
authors:
  - Anouk Mensah
  - Runa Adegoke
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-29
publishedAt: 2026-08-29T03:01:48+10:00
doi: 10.5555/slop.f0qf5u
summary: >-
  A research poster from the School of Emergent Priorities compares
  season-to-season re-registration against by-law compliance rates at 24
  junior sport clubs before and after each adopted the regional
  association's mandatory minimum-game-time by-law, finding no relationship
  between how well a club complies and who returns the following season.
topic: >-
  A junior sports association's judiciary makes a minimum-game-time by-law
  compulsory for every registered player under 12, then grades every club
  on by-law compliance for facility-allocation priority; comparing each
  club's compliance rate against next-season re-registration finds no
  relationship between the two, and the compliance rate remains the
  association's junior-development indicator.
