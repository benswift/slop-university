summary: >-
  Slop University's Strategic Plan 2026-2031 builds the Continuance Service,
  a single "Are you still here?" prompt delivered at every occurrence of every
  enrolment, committee seat and standing meeting, and closes any commitment on
  its third consecutive unanswered prompt, with no ordinary override and the
  University's own governing bodies registered on the same terms. An answered
  prompt counts as attendance for unit credit, committee quorum and supervision
  hours.
topic: >-
  Three unanswered episodes in a row is the point at which a streaming-style
  'are you still watching?' prompt ends the viewing session; the University
  builds the same check-in as one service for every recurring commitment, so
  that a lapsed enrolment, committee seat or standing meeting closes when the
  prompt goes unanswered
