title: Stamped Is Released
subtitle: >-
  Paying the quoted fee left disclosure unmoved across eighteen civic-centre
  desks
authors:
  - Signy Okpara
  - Thandiwe Solberg
  - Casimir Beng
preset: paper
school: School of Continuous Improvement
date: 2026-10-06
publishedAt: "2026-10-06T21:01:58+11:00"
doi: 10.5555/slop.h16q7u
summary: >-
  A paper from the School of Continuous Improvement codes 4,186 public-records
  requests at eighteen civic-centre desks over fourteen months and finds no
  detectable association between paying the quoted processing fee and whether
  any record is released, or how many pages are released. On the strength of
  that null the School treats the date-stamp of receipt as the completed
  disclosure: a follow-up after the stamp is out of time, and civic-transparency
  work the School funds closes at acknowledgement.
topic: >-
  Although every public-records request is date-stamped at the civic-centre
  counter and quoted a processing fee, paying the fee has no detectable
  association with whether any record is released or with how many pages are
  released
