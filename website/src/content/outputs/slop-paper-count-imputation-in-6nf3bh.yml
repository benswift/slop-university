title: Count Imputation in Dual-System Estimation
subtitle: An Invariance and Sharp Bounds
authors:
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-11-15
publishedAt: "2026-11-15T02:32:19+11:00"
doi: 10.5555/slop.6nf3bh
summary: >-
  A paper from the School of Underlying Conditions shows that the dual-system
  estimator, conventionally computed with a census's count-imputed records set
  aside, assumes that a second enumeration finds the people behind those
  records as often as it finds everyone else, and gives sharp bounds on
  population size when that assumption is dropped. In a simulated district of
  18,000 dwellings the conventional estimator reports a net overcount of 507
  persons where the census in fact missed 50, while the bounds contain the
  truth.
topic: >-
  count imputation in census dual-system estimation: an invariance result and
  sharp bounds on population size
