title: Twenty-Two Years Temporary
subtitle: Soil Formation in the Protective Backfill of a Reburied Excavation, and the Stratigraphic Status of the Cover
authors:
  - Tove Ilesanmi
  - Brynjar Obiora
  - Lindiwe Achterberg
preset: paper
school: School of Emergent Priorities
date: 2026-10-21
publishedAt: "2026-10-21T07:01:17+11:00"
doi: 10.5555/slop.julcdm
summary: >-
  A paper from the School of Emergent Priorities and the School of Underlying
  Conditions resurveys the protective backfill laid over four trenches on a
  river-terrace settlement twenty-two years earlier and retained as temporary
  through four scheduled reviews. The cover has developed a granular surface
  horizon in every trench and reached 0.18 to 0.31 of an adjacent terrace
  soil's development index; its geotextile is crossed by earthworm channels
  throughout and torn in one trench, water perches on it in three, and the
  authors argue it must now be excavated as a stratigraphic unit.
topic: >-
  soil formation in the temporary protective backfill over a reburied
  excavation, and when the cover becomes a stratum of its own
