summary: >-
  A research poster from the School of Underlying Conditions dries fourteen
  crystals of one esterase, cloned from biofilm on a monitoring-bore casing,
  from 99 to 85 per cent relative humidity in 2 per cent steps and refines
  twelve ordered water sites at every step. The crystal's two solvent channels
  empty in turn, between 95 and 93 per cent and between 89 and 87 per cent,
  while the three active-site waters stay above 0.88 occupancy to the driest
  step.
topic: >-
