summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 is its
  Director's extended reflection on five years spent alongside airborne LiDAR
  survey programs, organised around three lines of work: remeasuring and
  relocating the field plots that calibrate a canopy height model, recording
  how the ground was decided beneath every terrain model, and following a
  forest estate's biomass estimate from point cloud to report. It records 1,240
  plots measured twice, a calibration gap that differed by forest stratum, and
  a March 2024 restatement of the estate's biomass once 61 relocated plots
  rejoined the calibration.
