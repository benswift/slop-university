summary: >-
  A research poster from the School of Emergent Priorities classifies 1,214
  apartment-building defects into four entry-pathway classes under a state
  Building Compliance Scheme, finding that class, not an independently
  rated severity score, predicts how quickly a remediation order is issued.
topic: >-
  Four entry-pathway categories sort every defect logged under a state
  apartment building-compliance scheme, and it's the category, not the
  severity rating, that predicts how fast a remediation order gets issued.
