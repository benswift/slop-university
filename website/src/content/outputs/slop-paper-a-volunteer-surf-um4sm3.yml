title: Coding What a Reliability Score Rewards
subtitle: >-
  An Interview Study of Volunteer Surf Lifesavers and Patrol Coordinators at
  Six Clubs, Against the Score's Own Stated Purpose
authors:
  - Anneke Tolan
  - Renke Sabel
preset: paper
school: School of Emergent Priorities
date: 2026-08-22
publishedAt: "2026-08-22T06:01:35+10:00"
doi: 10.5555/slop.um4sm3
summary: >-
  A paper from the Schools of Emergent Priorities and Continuous Improvement
  interviews 58 volunteer surf lifesavers and 17 patrol coordinators across
  six clubs, coding their accounts into a five-category taxonomy of what a
  club's patrol reliability score is understood to actually reward. Genuine
  coverage of a rough, low-popularity slot is the least commonly coded theme
  in either group, while claims timed to land just before each club's
  roster-priority review cluster sharply around the review date and revert
  immediately after, a pattern stable under a site-blinded reliability check.
topic: >-
  a volunteer surf life saving club's reliability score decides who gets
  first pick of the popular summer patrol slots, and every volunteer willing
  to explain how to read it agrees turning up for the rough, empty-beach
  Tuesday afternoons is not what it rewards
