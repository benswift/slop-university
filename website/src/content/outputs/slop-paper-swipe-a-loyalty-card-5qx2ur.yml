title: SWIPE
subtitle: >-
  Segmented Wallet Intensity and Purchase Evaluation Sorts Strip-Mall
  Shoppers into a Four-Cell Loyalty Quadrant
authors:
  - Mirela Hanke
  - Marit Osayande
  - Kwame Lindqvist
preset: paper
school: School of Continuous Improvement
date: 2026-09-15
publishedAt: "2026-09-15T10:15:06+10:00"
doi: 10.5555/slop.5qx2ur
summary: >-
  A paper from the School of Continuous Improvement builds SWIPE, a
  four-cell classifier of strip-mall shoppers' loyalty-card and
  payment-terminal behaviour, and reports on a traders' collective's
  decision to bind checkout-lane priority, food-truck bay time, and
  loyalty-tier discount eligibility to the cell each shopper is scored
  into for a full trading term.
topic: >-
  SWIPE, a loyalty-card and EFTPOS transaction register, sorts strip-mall
  shoppers into a four-cell purchase-behaviour quadrant and binds
  checkout-lane priority, food-truck slot allocation and loyalty-tier
  discounts to the cell a shopper is scored into.
