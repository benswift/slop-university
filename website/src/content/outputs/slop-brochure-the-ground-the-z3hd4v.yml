summary: >-
  A research showcase from the School of Underlying Conditions presents the
  University's work on rural logistics as a study of the ground a harvest
  crosses on its way to market: the clay subgrade of an unsealed access road,
  the far end of the farm track, the steel bin at year end and the freight
  office that issues the paperwork. Eight published outputs from three
  Schools, each cited by title and DOI, carry the account.
topic: >-
  the ground the harvest travels on: a research showcase from the School of
  Underlying Conditions on the soils, subgrades and seasonal ground beneath
  the roads, sidings and silo pads that move a harvest off the farm
