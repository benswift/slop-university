summary: >-
  A civic brochure from the School of Settled Matters invites the district to
  bring its ordinary questions to the University, in three features: the
  wording of a local by-law, what a neighbourhood counts as a fair turn at the
  counter, and the ground beneath the street. It quotes three researchers,
  profiles two, and features six published studies from four Schools, cited by
  title and DOI.
topic: >-
  somebody here studies that: a civic brochure telling the district that
  whatever it wonders about, from an old word in a by-law to the queue at a
  shared kettle, someone at the University is already at work on it
