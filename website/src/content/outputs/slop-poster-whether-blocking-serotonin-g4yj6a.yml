title: The Soil Sets the Floor
subtitle: >-
  Serotonin receptor blockade and burrowing depth across five soil textures
authors:
  - Brynjar Obiora
  - Vigdis Emenike
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-12
publishedAt: "2026-10-12T21:21:08+11:00"
doi: 10.5555/slop.g4yj6a
summary: >-
  A research poster from the School of Underlying Conditions places 120
  earthworms from one laboratory colony in repacked columns of five soil
  textures after a bath in a serotonin receptor antagonist or vehicle, and
  reads maximum burrow depth at 72 hours. Blockade shortened burrows by 12.8 cm
  in sand and left them unchanged in clay, where untreated worms were already
  held shallow.
topic: >-
  Whether blocking serotonin receptors changes how deep earthworms from a
  laboratory colony burrow, and whether the answer depends on the texture of
  the soil they are put in
