title: The Bar Only Goes Up
subtitle: >-
  A Discrete-Time Hazard Analysis of Final Repaints Across 214 Community
  Fundraising Thermometers, Set Against the Banked Receipts a Shire Certifies
authors:
  - Sten Okwuosa
  - Casimir Beng
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-08-15
publishedAt: "2026-08-15T06:01:03+10:00"
doi: 10.5555/slop.a1s6a7
summary: >-
  A paper from the School of Continuous Improvement reconstructs dated repaint
  histories for 214 community fundraising campaigns at 96 facilities across
  eleven years of one shire's scheme records, reading painted levels from 4,706
  board photographs and pairing each history with the association's audited
  returns. A discrete-time complementary log-log hazard model finds the repaint
  hazard falls by a factor of five once the matched-contribution threshold has
  been cleared on the board (hazard ratio 0.19), the median campaign records its
  final repaint 19 months before close, and the painted level exceeds banked
  receipts in 78.0 per cent of campaigns.
topic: >-
  the plywood fundraising thermometer bolted to the fence outside a community
  hall, whose red bar is repainted upward as pledges arrive and has no
  convention for ever being repainted down --- so a shire's matched
  community-contribution milestone is certified against a painted figure that
  can only rise, and a discrete-time hazard analysis of when each campaign's bar
  was last repainted finds the certified level is set by the date of the last
  repaint rather than by anything banked
