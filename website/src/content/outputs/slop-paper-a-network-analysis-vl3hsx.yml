title: Six Diaries Hold the Season
subtitle: >-
  A Two-Mode Network Analysis of Player Deputising Across Nineteen Community
  Brass Bands in One Engagement Season
authors:
  - Petra Umbile
  - Ingrid Vasseur
  - Lindiwe Achterberg
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-08-13
publishedAt: "2026-08-13T21:00:32+10:00"
doi: 10.5555/slop.vl3hsx
summary: >-
  A paper from the School of Emergent Priorities reconstructs one season of
  deputising across a 19-band regional brass band association from its own
  attendance returns --- 187 engagements, 604 registered players, 4,932 scored
  chairs --- as a two-mode player-band network. Deputies filled 23.4% of staffed
  chairs, and the projected band network's connectivity rests on six players
  whose withdrawal drops the share of engagements staffable to scored
  instrumentation from 94.1% to 61.5%. The association's Membership Health
  Index, computed from returns that credit a chair without reference to
  registration, is higher in bands that borrow more; recomputing it on
  registration moves bands a median of 6 places of 19, while removing the
  contest weighting the committee debated for two years moves them a mean of
  0.4.
topic: >-
  A network analysis of who deputises for whom across a region's community
  brass bands over one engagement season, testing whether the bands
  association's membership-health index --- built from per-engagement
  attendance that credits a fill-in player to the section they covered ---
  tracks the health of the member bands or the calendars of a handful of
  multi-band regulars
