doi: 10.5555/slop.3akasp
summary: >-
  A research poster from the School of Emergent Priorities integrates a Liénard
  relaxation oscillator across five stiffness settings with a Dormand–Prince
  5(4) pair and flags stiffness onset from the step-size controller's own
  record of rejected steps. Under an elementary controller the flag trails the
  eigenvalue criterion by a median 4 to 14 attempted steps; under a PI
  controller, which rejects far less, it trails by 37 to 140 and misses 39% of
  slow branches at the stiffest setting, so the poster proposes pairing the
  rejection count with an estimate drawn from accepted steps.
topic: >-
  reading an explicit Runge-Kutta step-size controller's rejected-step log to
  locate where a relaxation oscillator turns stiff
