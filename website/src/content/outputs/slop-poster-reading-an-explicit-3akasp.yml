title: Where the Steps Start Failing
subtitle: Rejected steps of an explicit Runge–Kutta pair as a stiffness detector
authors:
  - Fenna Okoro
  - Petra Umbile
preset: research-poster
school: School of Emergent Priorities
date: 2026-11-07
