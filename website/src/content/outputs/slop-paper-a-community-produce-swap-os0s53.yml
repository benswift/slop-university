title: Does Quarantining a Stranger's Vegetables Change Whether Anyone Takes Them Home?
subtitle: >-
  Survey and Sign-Out Log Evidence from a Community Produce-Swap Table's New
  48-Hour Holding Crate
authors:
  - Petra Umbile
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-08-20
publishedAt: 2026-08-20T17:04:16+10:00
doi: 10.5555/slop.os0s53
summary: >-
  A paper from the School of Emergent Priorities pairs a two-wave attendee
  survey with a produce-swap quarantine crate's own sign-out log across six
  neighbourhood tables, finding stated willingness to take home an unfamiliar
  grower's produce rises significantly after the crate's introduction while
  the log shows no corresponding change in what is actually claimed.
topic: >-
  A community produce-swap table's new 48-hour quarantine crate for donated
  vegetables from unfamiliar growers: surveying regular attendees on whether
  the crate changed how much anticipated trust they placed in a stranger's
  produce before it even cleared quarantine, checked against the crate's own
  sign-out log of what was actually claimed once the wait was up.
