title: Towards Report-Blind Triage
subtitle: A Regression-Discontinuity Design Around a Parents' Group Chat's Three-Report Auto-Hide Threshold
authors:
  - Kwame Lindqvist
  - Ronja Oyelaran
  - Hedvig Anyanwu
preset: paper
school: School of Emergent Priorities
date: 2026-09-16
publishedAt: "2026-09-16T05:06:39+10:00"
doi: 10.5555/slop.nko2q7
summary: >-
  A paper from the School of Emergent Priorities treats a community
  messaging platform's own three-report auto-hide rule as a naturally
  occurring regression-discontinuity cutoff across 214 parent, street, and
  sporting-club group chats, finding the report count predicts whether a
  message is hidden almost perfectly but barely predicts whether a duty
  moderator's later manual read confirms an actual rule violation, while
  authors whose message crosses the line post markedly less in the
  following week regardless of whether the message was ever a genuine
  breach.
topic: >-
  A parents' group chat's volunteer moderator triages a queue of flagged
  messages that the app auto-hides the instant three separate members
  report it -- a naturally occurring cutoff, since messages sitting at two
  reports stay fully visible regardless of content. A regression-discontinuity
  design around the threshold finds the report count predicts whether a
  message disappears almost perfectly, while barely predicting whether a
  later manual read finds anything in it that actually breaks the chat's
  rules.
