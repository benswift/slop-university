title: Shown Dashed
subtitle: The Stressed Endoplasmic Reticulum in Thirty-Six Years of Lecture Schematics, Read as Architectural Drawings
authors:
  - Anselm Threlkeld
  - Clemency Tredinnick
  - Gunnhild Ekwueme
