summary: >-
  A research poster from the School of Settled Matters reads 148 schematics of
  the unfolded protein response, drawn for one medical school's cell-biology
  lectures between 1988 and 2024, as architectural drawings. It finds the
  resting organelle drawn in section and the terminal one in plan, swollen or
  in broken outline (64% of terminal panels against 2% of resting ones), the
  convention a building drawing reserves for what is to be taken down, and no
  figure that redraws the organelle at rest afterwards.
topic: >-
  shown dashed: how thirty-six years of one medical school's lecture schematics
  draw the stressed endoplasmic reticulum, read as architectural drawings, and
  why the terminal panel takes the convention for a building marked for
  demolition
