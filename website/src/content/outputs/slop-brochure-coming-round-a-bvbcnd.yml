summary: >-
  A civic brochure from the School of Underlying Conditions presents the
  University's research on the interval between the end of an exposure and the
  return of the ordinary, followed through three public settings: the waiting
  room outside an anaesthetic, the pumped bore climbing back towards its
  standing level, and the bus stop where a community waits together. It invites
  families, landholders and neighbours to open evenings and field days, and
  grounds the work in six published outputs cited by title and DOI.
