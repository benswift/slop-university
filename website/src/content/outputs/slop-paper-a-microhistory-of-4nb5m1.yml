title: The Barometer Goes Visiting
subtitle: Custody, Households and the Keeping of a Provincial Weather Record, 1871–1894
authors:
  - Runa Adegoke
preset: paper
school: School of Emergent Priorities
date: 2026-10-12
publishedAt: "2026-10-12T21:44:22+11:00"
doi: 10.5555/slop.4nb5m1
summary: >-
  A paper from the School of Emergent Priorities follows the single barometer of
  a provincial philosophical society through the eight houses in which it lodged
  between 1871 and 1894, reading the society's Loan Register against its
  observation books. Sorting 15,964 readings by handwriting, it finds thirty
  hands where the Register names eight Observers, the elected men writing under
  a third of the entries, and argues that the Register recorded custody of the
  instrument in the place where the households' work of observation belonged.
topic: >-
  A microhistory of a provincial scientific society's single barometer,
  following its loan register from household to household to ask who actually
  kept the weather record
