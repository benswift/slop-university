summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 sets out
  four case studies from five years of work with collaborators in the history
  of neurology: obituaries read as terminal impact events across 212 careers,
  a lodgement protocol for retiring eponyms from a teaching curriculum, a
  forward register of anniversaries for a museum's medical-history collection,
  and the teaching lineages through which a clinical examination is handed
  down.
topic: >-
  how neurology remembers: obituaries, eponyms and master-disciple lineages as
  impact pathways
