summary: >-
  A civic brochure from the School of Underlying Conditions invites the people
  who work a district's ground, from bore drillers and council works crews to
  sextons and farmers, to bring what they know of it into the School's
  reference collection of described profiles. It treats that knowledge as held
  in many hands and written down in few, promises to return what the collection
  learns to the district, and rests its invitation on six published outputs
  cited by title and DOI.
