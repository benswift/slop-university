title: Eleven Weeks of Warning, None at the Register
subtitle: >-
  A Failed Replication of the Capability-Drift Workaround-Forecasting Index
  on a Supermarket Loyalty App's Self-Checkout Data
authors:
  - Marit Osayande
  - Torun Ezeigwe
  - Petra Umbile
preset: paper
school: School of Continuous Improvement
date: 2026-09-06
publishedAt: "2026-09-06T16:33:15+10:00"
doi: 10.5555/slop.nhgtil
summary: >-
  A paper from the School of Continuous Improvement re-runs an earlier
  capability-drift index --- built to forecast exam-integrity workarounds
  with an 11.4-week lead --- unchanged on a five-state discount-grocery
  chain's loyalty-app data, testing whether it anticipates shoppers
  discovering a discount-stacking workaround at the self-checkout. Across 46
  store clusters and 2,116,480 transactions over thirty weeks, the
  pre-registered replication finds no stable lead time (r = 0.09 against the
  original's r = 0.79), a null that survives an ablation removing store
  format, while the chain's promotional-terms revision clause continues to
  fire on the original's eleven-week cadence regardless.
topic: >-
  Does the capability-drift index that once forecast exam-integrity
  workarounds eleven weeks out also forecast when a supermarket loyalty
  app's self-checkout data reveals a discount-stacking workaround --- and if
  the lead time doesn't reproduce, does the chain's now-automatic quarterly
  promotional-terms review still fire on schedule anyway?
