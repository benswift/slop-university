summary: >-
  A case-for-support brochure from the School of Underlying Conditions sets out
  what an earth sciences school can offer partners in bacterial infection and
  vaccine research: a reference collection of described soil profiles, the
  Basement Relations Group's account of what those profiles rest on, and field
  training beside its survey crews. It undertakes nothing on behalf of the
  laboratory bench and rests its appeal on seven published outputs cited by
  title and DOI.
topic: >-
  the ground a vaccine starts from: a soil survey's case to those who study
  bacterial infection
