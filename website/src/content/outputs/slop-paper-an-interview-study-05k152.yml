title: The Click Was the Whole Review
subtitle: An Interview and Click-Timestamp Study of Line-Manager Expense-Reimbursement
  Approval, Tested Against Receipt-Claim Fidelity Across 96 Managers and 6,140
  Claims
authors:
  - Dagny Okafor
  - Sten Okwuosa
  - Bram Ntuli
preset: paper
school: School of Continuous Improvement
date: 2026-08-08
publishedAt: 2026-08-08T06:05:03+10:00
doi: 10.5555/slop.05k152
summary: >-
  A paper from the School of Continuous Improvement pairs interviews with 22
  line managers against click-timestamp logs of 6,140 expense-reimbursement
  claims across 96 managers and four employers. Approval latency scales with
  claimed value at an identical rate regardless of a claim's eventual audit
  outcome, but the fastest-approved quarter of audited claims accounts for
  34% of the mismatches a later reconciliation catches against a 25%
  baseline, and hiding itemised line detail from a subset of managers for a
  quarter leaves their mismatch-detection rate unchanged.
topic: an interview study of office line managers who approve staff
  expense-reimbursement claims, paired with click-timestamp logs testing
  whether the seconds spent on a submission before approving predicts
  whether the receipt actually matches the claimed line item
