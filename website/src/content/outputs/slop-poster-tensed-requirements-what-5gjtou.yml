title: The System Shall Display the Current Level
subtitle: Tensed requirements in groundwater telemetry specifications, and the tests that date them
authors:
  - Vigdis Emenike
  - Ylva Onyekwere
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-21
