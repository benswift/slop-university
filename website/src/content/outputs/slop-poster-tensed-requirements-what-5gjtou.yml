doi: 10.5555/slop.5gjtou
summary: >-
  A research poster from the School of Underlying Conditions reads 212
  requirements in 23 bore-telemetry software specifications that use a tensed
  word such as "current", "latest" or "real-time", through McTaggart's
  distinction between tensed and dated time. Only 3 name the event their "now"
  is measured from, yet each of the 165 traced to an acceptance test has a test
  that fixes one, "current" most often as ingest time, and for 31 requirements a later
  test fixes a different event from the first.
topic: >-
  Tensed requirements: what 'the current water level' means in groundwater
  telemetry software specifications, read through McTaggart's A- and B-series,
  and which reading each acceptance test silently fixes
