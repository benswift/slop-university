summary: >-
  A research poster from the School of Continuous Improvement mines a year of
  event logs covering 9,412 completed referral cycles at three outpatient
  clinics in one regional health network, timing each hop of the specialist's
  reply letter on its way back to the referring practice. Three of the return
  route's eight hops appear in no role's work instructions; they carry 13 per
  cent of the median return time and 52 per cent of the 90th-percentile time,
  and the two rarest, the address-exception and undeliverable re-send routes,
  are also the slowest.
