title: Hours to Freeze
subtitle: The Keep-Warm Clause and the Price of Thermal Inertia at an Interwar Electrolytic Works, 1927–1951
authors:
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-26
