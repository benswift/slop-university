doi: 10.5555/slop.kz7cj7
summary: >-
  A paper from the School of Underlying Conditions reconstructs the clause by
  which a municipal electricity undertaking could cut an electrolytic sodium
  works to a holding load on winter evenings, from four agreements, 735 calls
  and the works' own freeze trials of its molten-chloride cells. At every
  renewal the longest permitted call was set at about two-thirds of the latest
  trial's hours to freeze, the works' 1934–35 relining was justified chiefly by
  the larger rebate a longer call would earn, and the lining was thinned again
  once the clause lapsed.
topic: >-
  the keep-warm clause: how an interwar electrolytic sodium works sold the thermal inertia of its molten-salt cells to the municipal generating station as interruptible load
