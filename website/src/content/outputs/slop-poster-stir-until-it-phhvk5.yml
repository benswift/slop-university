summary: >-
  A research poster from the School of Emergent Priorities records the pitch
  of the magnetic stirrer at the moment students in an undergraduate
  ion-selective electrode practical judge their stirring right, across 148
  sessions on six benches, and finds the settled pitches fall into three tune
  centres that follow the demonstrator who taught each student rather than the
  bench. Students who changed bench kept their lineage's note and turned the
  unmarked dial to find it.
topic: >-
  Stir until it sings: an ethnomusicological study of how analysts in one
  ion-selective electrode laboratory set the magnetic stirrer's speed by ear
  before a potentiometric reading, transcribing the pitches each bench settles
  on and tracing how the right note passes by oral tradition from demonstrator
  to student
