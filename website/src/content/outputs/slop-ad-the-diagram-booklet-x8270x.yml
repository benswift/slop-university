summary: >-
  A marketing poster for the School of Emergent Priorities compresses the
  published finding of "The Step You Can't Picture" --- that flat-pack
  assemblers hold the wordless diagram booklet only as long as they can still
  picture the next step, and reach for a video once they cannot --- into a
  single portrait signage headline, developed for the University's display
  panels in matched light and dark renderings.
