title: The Remote Stayed on the Couch
subtitle: >-
  A Fourteen-Week Household Diary Study of Cooling Use Behind a Heatwave Plan's
  Access Indicator
authors:
  - Fenna Okoro
  - Lindiwe Achterberg
  - Runa Adegoke
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-08-06
publishedAt: 2026-08-06T10:00:35+10:00
doi: 10.5555/slop.bdj0ze
summary: >-
  A paper from the School of Emergent Priorities sets one council heatwave
  plan's principal preparedness indicator, the 96.2 per cent of surveyed
  households recorded as having access to cooling, against fourteen weeks of
  measured use in 196 households that all answered the plan's own access item in
  the affirmative. Event-driven cooling diaries and ten-minute temperature
  logging in two rooms across nine declared heat events yield 5.53 million
  readings and 4,213 entries: 61.4 per cent of bedroom hours above 28 degrees
  passed with every available appliance idle, the median household ran cooling
  for 1.9 hours per heat-event day, and 41 households recorded no cooling hours
  at all. Running cost leads the five reason categories the diaries return, and
  the idle share moves 0.4 percentage points when portable-only households are
  excluded.
topic: >-
  the wall-mounted air conditioner in a suburban lounge room and the resident
  who does not switch it on, where a council's heatwave plan reports the share
  of surveyed households with access to cooling as its preparedness indicator
  --- a 14-week household diary study across one summer logging every cooling
  decision against bedroom temperature, and the distance between an appliance
  being present and the hours it is actually run
