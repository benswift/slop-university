summary: >-
  A research poster from the School of Settled Matters codes 312 disagreements
  between wind-tunnel results and CFD solutions logged by one aerodynamics
  group across nine design programmes, alongside 22 interviews. The side
  revised moves as a programme nears freeze: the simulation gives way in 62%
  of concept-phase disagreements, the tunnel data is corrected in 46% of
  pre-freeze ones, and the share carried forward as an unresolved band rises
  from 12% to 30%.
topic: >-
  when the wind tunnel and the simulation disagree: which side an aerodynamics
  group's project records hold at fault, and how the attribution shifts as a
  design programme nears freeze
