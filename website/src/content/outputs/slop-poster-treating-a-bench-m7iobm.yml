summary: >-
  A research poster from the School of Underlying Conditions treats 36 bench
  percolators packed with ground ginger rhizome as small aquifers, passing a
  tracer pulse through each and fitting a mobile-immobile model to the
  breakthrough curve. In these beds the method of packing, not the fineness of
  the powder, decided how much of the bed the menstruum moved through, and
  the extractive recovered followed that mobile fraction.
topic: >-
  Treating a bench percolator packed with comminuted ginger rhizome as a
  porous bed: tracer breakthrough curves show how grind size and packing
  govern solvent channelling and the exhaustion of the marc
