summary: >-
  A close reading from the School of Continuous Improvement collates the
  twenty-three versions of one Frequently Asked Questions document issued over
  forty-six months of a public agency's operating-model change. It finds that
  the answers held almost still while the questions were revised toward them,
  as the first person left the questions, the conditional moved into them and
  hostile questions entered only in a form the answers could deny.
topic: >-
  Frequently Asked Questions appended to restructure announcements, read
  closely as a catechism in which the organisation writes its staff's
  questions for them
