doi: 10.5555/slop.pgmlzf
summary: >-
  A research poster from the School of Continuous Improvement re-runs the
  desk-flag interruption study, unchanged, at 216 chairs across 18 hair salons,
  half of them marked by a clothes peg on the mirror. Walk-up interruptions
  come to 3.2 per stylist-hour with the peg and 3.2 without, and the apology
  share does not move. The participating salon group's review panel adopts the
  peg regardless, scoring each stylist on peg-on minutes and withdrawing the
  interruption count from its dashboard.
topic: >-
  to determine whether the desk do-not-interrupt flag result reproduces at a
  strip-mall hair-salon chain, where a clothes peg on the mirror marks a
  stylist as mid-colour, and to rewrite the fortnightly performance review
  around peg-on minutes once it does not
