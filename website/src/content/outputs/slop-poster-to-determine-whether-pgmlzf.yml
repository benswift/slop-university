title: Peg Compulsory, Effect Optional
subtitle: A Failed Replication of the Desk-Flag Interruption Result Across 18 Hair Salons
authors:
  - Thandiwe Solberg
  - Bram Ntuli
  - Dagny Okafor
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-19
