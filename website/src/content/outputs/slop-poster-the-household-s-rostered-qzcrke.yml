title: Does the Category Decide What Survives the Cull?
subtitle: >-
  A Four-Category Taxonomy of a Share House's Container Drawer, Kept by Its
  Rostered Custodian
authors:
  - Ronja Oyelaran
  - Iben Chikere
  - Lindiwe Achterberg
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-01
publishedAt: "2026-09-01T04:35:15+10:00"
doi: 10.5555/slop.qzcrke
summary: >-
  A research poster from the School of Emergent Priorities sorts a share
  house's mismatched plastic food-storage containers into a four-category
  taxonomy kept by a rostered container-drawer custodian, and reports that
  the category a container lands in predicts its survival past the next
  cull better than whether it is ever used.
topic: >-
  the household's rostered container-drawer custodian applies a four-part
  taxonomy --- matched pair, orphaned lid, orphaned base, aspirational
  near-match --- to a share house's mismatched plastic food-storage
  containers, weighing and photographing each part against manufacturer
  listings, with the category a container lands in deciding whether it
  survives the next cull
