title: The Chat Mention as Discharge Stamp
subtitle: A failed replication of the named-owner finding on household errands
authors:
  - Eskil Nwabueze
  - Ylva Onyekwere
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-07
publishedAt: "2026-10-07T09:00:55+11:00"
doi: 10.5555/slop.yf4vut
summary: >-
  A poster from the School of Continuous Improvement replicates the named-owner
  finding on street group-chat errands, reports that an @mention does not
  shorten time-to-done, and records the Indicator Commons rule that any
  mentioned errand whose read-receipt has sat for 48 hours is discharged, with
  the named member struck from the following week's roster and no discretionary
  restore.
topic: >-
  To determine whether @mentioning a named member as owner of a street
  group-chat errand — the parcel on the porch, the birthday cake, the tradie at
  the door — speeds completion the way a named owner sped campus water-bubbler
  repairs: it does not, and any mentioned errand whose read-receipt has sat for
  48 hours is recorded as discharged.
