title: Where One Star Allele Ends and the Next Begins
subtitle: Re-running 4,186 archived genotype files through five versions of one biobank's haplotype translation table
authors:
  - Brynjar Obiora
  - Vigdis Emenike
  - Joost Nwosu
preset: research-poster
school: School of Underlying Conditions
date: 2026-11-07
publishedAt: "2026-11-07T02:01:28+11:00"
doi: 10.5555/slop.os99u4
summary: >-
  A research poster from the School of Underlying Conditions re-derives allele
  calls for 4,186 stored genotype files in one unnamed research biobank under
  each of the five historical versions of the archive's own haplotype
  translation table, and codes every difference as a rename, a merge, a new
  call or a split to ambiguous. The stored files were never edited, yet 645
  calls change across the four transitions, affecting 511 samples; the poster
  argues that a dated call in such an archive records the table as much as the
  sample, and that recording the table version beside the call is the cheapest
  repair.
topic: >-
  Where one star allele ends and the next begins: how successive versions of an
  in-house haplotype translation table relabel the same stored genotypes in an
  invented research biobank archive
