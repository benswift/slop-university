summary: >-
  A marketing poster for Slop University presents the School of Underlying
  Conditions' work on scattering media, setting a single pump beam into a
  cuvette of crushed drill core soaked in dye, where the light scatters until
  the sample lases, beside a tray of split core. It carries the School's
  standing as first for disorder among the samples measured on campus and was
  issued in light and dark renderings for the University's landscape screens.
