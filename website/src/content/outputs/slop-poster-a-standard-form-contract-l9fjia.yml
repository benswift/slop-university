summary: >-
  A research poster from the School of Settled Matters reads the fixed
  default-interest rate printed in a standard-form contract of sale as an
  option a purchaser short of funds holds against the vendor, and tests it on
  3,184 settlements handled by one suburban conveyancing practice across a
  54-month rate cycle. Late settlement holds at about 7.8 per cent while
  bridging finance is cheaper than the printed rate and rises 6.9 points for
  each point of spread once it is dearer, until vendors' solicitors reprice
  delay by special condition; the authors propose that the form state its rate
  as a margin over a published lending benchmark.
topic: >-
  A standard-form contract of sale's fixed default-interest rate as a cheap
  loan to a late purchaser: settlement delays across one conveyancing
  practice's files over a rate cycle, read as an option whose price the form
  fixed and the market moved
