summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 looks back on
  five years of work upstream of the chemistry in plant-chemistry laboratories:
  a recorded cut date now carried by 11,284 accessions, a median wait from
  collection to extraction that fell from 35 days to 12 across seven
  collaborating benches but not at a grain-legume breeding laboratory whose
  queue is the harvest, and an inventory of 1,108 frozen boxes, 312 of them
  without a cut date.
topic: >-
  before the extract: five years of the School improving the drying racks,
  grinding queues and freezer shelves where plant material waits its turn for
  chemistry
