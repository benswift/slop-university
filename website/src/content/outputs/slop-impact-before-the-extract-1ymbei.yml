title: Before the Extract
subtitle: Five Years of the School of Continuous Improvement's Work on the Drying Racks, Grinding Queues and Freezer Shelves of Plant-Chemistry Laboratories
authors:
  - Mirela Hanke
  - Sten Okwuosa
  - Eskil Nwabueze
