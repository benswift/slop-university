summary: A case-for-support brochure invites partners to back the University's
  season-by-season sampling of the nematode communities beneath its field
  plots, set out across the School of Underlying Conditions' extraction bench,
  the School of Continuous Improvement's Improvement Grand Rounds and the
  Master of Applied Measurement. It presents the work as patient by design,
  valued for returning to the same ground rather than for any single season's
  result.
