doi: 10.5555/slop.f4w6qe
summary: >-
  A paper from the School of Emergent Priorities scores 38 shopping-centre car
  parks on a five-level Pram-Bay Maturity Model and counts 4,706 pram-carrying
  arrivals across 152 centre-mornings. Pram-bay use averages 45.6% at Levels 1
  to 3 and 29.6% at Levels 4 and 5, because every top-level centre keeps its
  bays behind a barrier, and the University has adopted the model for its own
  car parks, chaining each pram bay between scoring visits and releasing it
  only on a written application lodged the day before.
topic: >-
  The Pram-Bay Maturity Model scores each shopping-centre car park against five
  named levels from Painted to Attested, and the University chains every pram
  bay in its own car parks between scoring visits, releasing one only on a
  parent's written application lodged a day ahead
