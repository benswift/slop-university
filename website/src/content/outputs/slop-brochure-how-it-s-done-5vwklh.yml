summary: >-
  A civic brochure from the School of Settled Matters invites the surrounding
  farming district to bring its unwritten arrangements --- the shared boundary
  fence, the saved-seed swap, the paddock taken on agistment --- into the
  University's reading room, and sets them beside six published studies of
  fences, seed custody, grazing and groundwater from three Schools.
