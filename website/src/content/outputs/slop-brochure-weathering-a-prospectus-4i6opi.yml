summary: >-
  A prospectus inviting students to study how things age across the
  University's three Schools, organised as a descent through one square of
  ground: the purslane growing from a footpath crack, the soil and weathered
  rock beneath it, and the printed matter ageing on the University's shelves.
  Five published studies on weathering, recovered core, plant names, archival
  cleaning and household plant care are cited by title and DOI as the work
  students will join.
