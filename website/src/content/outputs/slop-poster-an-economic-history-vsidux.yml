doi: 10.5555/slop.vsidux
summary: >-
  A research poster from the School of Underlying Conditions reads the extras
  book of a provincial hot-metal composing room, in which compositors claimed
  their hand-finishing time on 418 papers in operator and function theory, as
  a price series for mathematical notation. Once the journal's society billed
  authors for extras, bars with a cheaper spelling all but vanished from the
  page and stars took their place, while the conjugate and d-bar, which had no
  substitute, went on being set and paid for at the old rate.
topic: >-
  An economic history of the compositor's surcharge: what the adjoint star, the
  norm bars and the d-bar cost to set by hand, read from the piece-rate ledger
  of a provincial hot-metal printer that composed an operator-theory journal
