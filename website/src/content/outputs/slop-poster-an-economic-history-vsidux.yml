title: The Price of a Bar
subtitle: What Operator Theory's Notation Cost a Provincial Composing Room, 1951–1976
authors:
  - Brynjar Obiora
  - Ingeborg Nwachukwu
  - Vigdis Emenike
preset: research-poster
school: School of Underlying Conditions
