summary: A research explainer from the School of Continuous Improvement on Edda Nwafor's
  doctoral thesis on office dress across the working week. It follows the jacket carried
  over an arm from 212,406 arrivals coded at six lift lobbies, through 48 dress diaries
  linked to their wearers' calendars, to a trial of weekday dress bands in 24 teams
  and the Standard the School has since adopted. Nwafor describes the fieldwork and
  the jacket in her own words.
topic: A research explainer of the doctoral thesis on casual dress across the office
