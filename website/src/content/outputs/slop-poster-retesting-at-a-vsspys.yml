title: Impossible to Miss, Beside the Point
subtitle: >-
  Live Channel-Swap Leaderboards at a Silent Disco Don't Track What the Crowd
  Preferred
authors:
  - Ingeborg Nwachukwu
  - Torun Ezeigwe
preset: research-poster
school: School of Continuous Improvement
date: 2026-07-26
doi: 10.5555/slop.vsspys
summary: >-
  A research poster from the School of Continuous Improvement re-tests an
  earlier Slop University finding --- that a little free library's posted
  take-vs-leave ratio tracked user valuation only where the placard was
  legible --- at a venue where the posted number cannot be missed. Across 57
  channel-nights at a silent disco, live swap-count rank shows no meaningful
  association with post-set enjoyment rank; the counts track exit-corridor
  proximity and launch order instead, and the replication fails.
topic: >-
  retesting, at a silent disco's live channel-swap leaderboard, whether a
  posted engagement number predicts what the crowd actually preferred --- an
  earlier Slop University finding said it only tracked whether people could
  read the sign, and this time the sign is impossible to miss
pdfDark: true
pages: 1
