summary: >-
  A case-for-support brochure from the School of Emergent Priorities treats
  a café rostering tablet's four-hour rest-break checker as the subject of a
  programme: the unpaid pause it inserts is read as a wellbeing event, and
  Capability Sprint placement hours are indexed to sites whose rest-break
  compliance sits on the right side of that cutoff, with no ordinary
  override.
topic: >-
  The four-hour rest-break checker on a café rostering tablet inserts an
  unpaid pause the moment a shift crosses four hours, and the University is
  now treating a coded break as a wellbeing event, indexing Capability
  Sprint placement hours to sites whose rest-break compliance sits on the
  right side of that line.
