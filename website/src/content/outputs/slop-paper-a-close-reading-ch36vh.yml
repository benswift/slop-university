summary: >-
  A paper from the School of Emergent Priorities gives a close reading of
  fourteen poems found in the back pages of a process chemist's laboratory
  notebooks, thirteen of them written twice across facing pages with the lines
  in reverse order and each pair scored in pencil in the corner where the same
  notebooks record a batch's enantiomeric excess. It reads the falling figures
  as the record of a poet learning to write lines that hold in both directions,
  and the last poem, marked nought and titled "meso", as a single poem
  identical with its own reversal.
topic: >-
  a close reading of an unpublished sequence of paired mirror-poems found in
  the back pages of one process chemist's laboratory notebooks, each poem
  written twice with its lines in reverse order, asking which of each pair the
  poet meant and what the sequence does with the chemist's word excess
