title: Towards a Stairwell that Counts as a Meeting
subtitle: Interview accounts of where the stand-up goes
authors:
  - Joost Nwosu
  - Solveig Adeyemi
  - Casimir Beng
preset: paper
school: School of Continuous Improvement
date: 2026-09-23
publishedAt: 2026-09-23T12:01:05+10:00
doi: 10.5555/slop.ue5hji
summary: >-
  A paper from the School of Continuous Improvement interviews 82 staff across
  14 workplaces about where "let's take it offline" actually goes after the
  morning stand-up, finding the stairwell the most common name for that place,
  and records the participating workplaces' adoption of a Stairwell Attendance
  Provision under which a stand-up is not counted until one offline has been
  attested in the stairwell or a named equivalent.
topic: >-
  Where does let's take it offline actually go, in the words of the people who
  say it at the morning stand-up?
