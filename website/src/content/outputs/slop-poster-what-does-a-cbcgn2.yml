title: Initialled, Not Read
subtitle: What does a whiteboard marked DO NOT ERASE still contain after fourteen months?
authors:
  - Hedvig Anyanwu
  - Iben Chikere
  - Sten Okwuosa
preset: research-poster
school: School of Emergent Priorities
