doi: 10.5555/slop.cbcgn2
summary: >-
  A research poster from the School of Emergent Priorities presents a
  single-site teaching case on a product-design studio's meeting-room whiteboard,
  marked DO NOT ERASE mid-workshop and never wiped, whose diagram none of the
  seven staff who initialled it could read. The studio now re-affirms every such
  board by initials each quarter, in perpetuity and with no erasure pathway, and
  books a room in custody out of its calendar, so that bookable rooms fall from
  five to two over fourteen months.
topic: >-
  What does a whiteboard marked DO NOT ERASE still contain after fourteen months?
  A teaching case on one product-design studio's meeting-room board, which nobody
  could interpret, and the quarterly initialled re-affirmation rota under which
  the room counts as in custody and drops off the booking calendar
