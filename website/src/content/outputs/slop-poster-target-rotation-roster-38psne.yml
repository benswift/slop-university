title: No Better Lane
subtitle: >-
  A Season-Long Instrumented Trial of Target-Rotation Assignment and Its Null
  Effect on Scoring Average
authors:
  - Sunniva Balogun
  - Verity Marris
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-23
publishedAt: "2026-09-23T19:02:06+10:00"
doi: 10.5555/slop.38psne
summary: >-
  A season-long field study instruments six lanes of a suburban archery
  club's target-rotation roster with wind, glare and arrow-flight sensors,
  and finds no detectable link between lane assignment and scoring average
  once archer ability is held constant. The roster stands as rolled, and the
  instrumentation stays in place through the winter round.
topic: >-
  Target-rotation roster assignment at a suburban archery club, tested across
  a full season with wind-vane, glare-angle and arrow-flight photogrammetry
  instrumentation on every end, for whether lane assignment predicts scoring
  average; it doesn't, and the report says so plainly with no follow-up trial
  proposed.
