doi: 10.5555/slop.avvwip
summary: >-
  A paper from the School of Settled Matters and the School of Continuous
  Improvement randomises eight raters outlining four deep grey matter
  structures on 240 archived susceptibility maps between a written protocol
  alone and a casebook of binding holdings. The casebook raised mean pairwise
  Dice in every structure, most in the substantia nigra (0.74 to 0.85), with 22
  of its 31 holdings issued in the first 60 scans; one early holding on the
  rostral nigral pole was overruled at scan 164, after the casebook arm had
  agreed closely on it for 150 scans.
topic: >-
  Binding precedent for boundary calls: a randomised comparison of a stare
  decisis casebook and a written protocol for segmenting iron-rich deep grey
  matter on an archive of susceptibility maps
