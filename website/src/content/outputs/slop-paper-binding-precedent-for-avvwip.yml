title: Binding Precedent in Manual Segmentation of Iron-Rich Deep Grey Matter
subtitle: A Randomised Comparison on 240 Archived Susceptibility Maps
authors:
  - Anselm Threlkeld
  - Eivind Onwuka
  - Odalys Penhallow
preset: paper
school: School of Settled Matters
