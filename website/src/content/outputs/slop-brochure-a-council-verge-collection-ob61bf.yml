summary: >-
  A civic-research brochure sets Slop University's published audits of
  council ledgers, collection calendars, and kerbside claim-objects against
  direct counts taken on the street, and profiles the researchers and
  short-course training built around keeping the two in agreement.
topic: >-
  a council verge-collection app that marks a household's kerbside pile as
  collected the instant an inspector logs it on a handheld, even though the
  pile itself sits at the curb for another eight days before the truck
  actually comes
