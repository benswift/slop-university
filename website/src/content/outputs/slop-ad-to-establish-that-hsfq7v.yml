summary: >-
  A marketing poster carries Doctoral Candidate Tove Ilesanmi's taxonomy of the
  order numbers a food truck calls and nobody answers to bus-stop panels and
  campus screens. Each unanswered number is sorted into the phone-down, the
  wrong queue, the mishearing or the gone, and the window is held to a fixed
  number of repeat calls for each kind.
topic: >-
  To establish that every order number a food truck calls from its window and
  nobody answers is one of four kinds --- the phone-down, the wrong queue, the
  mishearing and the gone --- and to hold the window to a fixed number of repeat
  calls per kind
