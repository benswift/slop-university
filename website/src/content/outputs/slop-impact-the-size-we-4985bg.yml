summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 follows five
  years of work that began with cell-biology laboratories agreeing how to score
  YAP/TAZ localisation at confluence, and traces how the Hippo pathway's
  density-sensed growth arrest became stop rules for program portfolios, a
  register for retired indicators, a saturation indicator for consortium
  projects and a fixed-frame Living Dashboard.
topic: >-
