title: A Standard Already in the Lane
subtitle: Endogenous Biotinylated Carboxylases Report Run-by-Run Recovery in Streptavidin Enrichment
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
