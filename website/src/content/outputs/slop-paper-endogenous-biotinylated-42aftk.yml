doi: 10.5555/slop.42aftk
summary: >-
  A paper from the School of Underlying Conditions carries twenty-four aliquots
  of one proximity-labelled cell lysate through streptavidin capture and three
  elution procedures, keeping every fraction and following a spiked biotinylated
  reference protein through each. Recovery in the first eluate ranged from a
  third to nine-tenths between runs, an endogenous carboxylase band present in
  every lane reported the same figure to within four points, and a bead lot
  open for fourteen months captured as well as a new one and released less.
topic: >-
  Endogenous biotinylated carboxylases, the bands every proximity-labelling
  experiment discards as background, used as an internal recovery standard for
  streptavidin enrichment, with a fraction-by-fraction biotin mass balance
