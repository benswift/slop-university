title: The Wall Planner as Coverage Device
subtitle: >-
  Four named cells of the kitchen leave calendar, bound to who is asked to cover
authors:
  - Bram Ntuli
  - Joost Nwosu
  - Solveig Adeyemi
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-30
publishedAt: "2026-09-30T04:01:05+10:00"
doi: 10.5555/slop.zw347y
summary: >-
  A research poster from the School of Continuous Improvement codes 1,847
  marked squares on 18 office kitchen wall planners into four named cells of
  span against timing, and finds Block occupying 61% of squares once only
  that cell counted as authorised leave, while independently logged full-week
  absences held at 18%. Partner-site kitchens must post the legend; Dart is
  written to the unreliability line of the next review, with no override.
topic: >-
  Although the kitchen wall planner is billed as a coverage tool, it sorts
  every marked leave square into a four-cell grid that then governs who is
  asked to cover and who is written up as unreliable.
