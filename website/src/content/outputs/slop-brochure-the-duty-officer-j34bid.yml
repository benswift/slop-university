summary: >-
  A research-showcase brochure from the School of Continuous Improvement
  follows a market-day queue-display trial's null result onto the Review
  Cadence Observatory's published cadence log, closed to further review for
  a decade, alongside five other published findings from across the
  University's two schools.
topic: >-
  the duty officer running a strip-mall market day tests whether a food
  truck's queue-number display board changes how far customers wander while
  waiting, finds no measurable difference, and files the question as closed
  for good
