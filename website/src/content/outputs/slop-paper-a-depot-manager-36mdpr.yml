title: Locating the Efficiency Frontier of an Equipment-Hire Network
subtitle: >-
  Bootstrapped Variable-Returns Data Envelopment Analysis of 61 Depots Across
  Four Quarters, and the Reference Sets Issued on the Strength of It
authors:
  - Renke Sabel
  - Mirela Hanke
  - Sten Okwuosa
preset: paper
school: School of Continuous Improvement
date: 2026-08-17
publishedAt: 2026-08-17T11:04:03+10:00
doi: 10.5555/slop.36mdpr
summary: >-
  A paper from the School of Continuous Improvement estimates input-oriented
  technical efficiency for all 61 depots of one national equipment-hire group
  across four consecutive quarters, correcting the finite-sample bias in
  envelopment estimators with a smoothed homogeneous bootstrap. Mean
  bias-corrected efficiency is 0.812 (95% CI 0.786 to 0.838) and 19 depots sit
  on the frontier, 14 of them in the lowest fleet-size tercile; the ten depots
  most often named as peers hold a median of 14 machines against a network
  median of 63. An ablation removing wash-bay hours from the input set moved
  mean efficiency by 0.004 and changed no depot's frontier status. Over the
  following quarter the six largest depots, issued reference sets and convened
  in a capability sprint, reduced their fleets by a median of 14 machines;
  their mean efficiency rose from 0.681 to 0.771 and their completed hires fell
  by 8.4 per cent.
topic: >-
  A depot manager opens the quarterly efficiency table to find their yard ranked
  against three one-counter country branches they have never visited --- a
  bootstrapped variable-returns data envelopment analysis of 61 equipment-hire
  depots across four quarters, and the reference sets the group's improvement
  program issues on the strength of a frontier the smallest sites almost
  entirely populate
