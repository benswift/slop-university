summary: >-
  A marketing poster presents Dr Vigdis Emenike kneeling at a capped monitoring
  bore in an open paddock, lowering a water-level tape down the pipe, as the
  face of a University whose researchers keep returning to the same question.
  Composed for the portrait signage panels in light and dark renders, it
  directs readers to three published works that went back to something already
  measured.
