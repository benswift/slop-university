title: After the Street Has Cleared
subtitle: Recession Analysis of Winter Woodsmoke PM2.5 Indoors in Twenty-Six Houses of an Inland Valley Town
authors:
  - Vigdis Emenike
  - Eskil Nwabueze
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
