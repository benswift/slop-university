doi: 10.5555/slop.7yjg4y
summary: >-
  A paper from the School of Underlying Conditions and the School of Continuous
  Improvement pairs an outdoor and a main-bedroom particle sensor at 26 houses
  of one inland valley town through the 92 nights of a winter and reads the
  bedroom records by their recessions, as a hydrologist reads a hydrograph. On
  58 smoke nights the bedroom peaked a median 1 h 50 min after the street, each
  house took a single recession constant, the bedroom peak was attenuated more
  than the night as a whole, and half of the bedroom's outdoor-origin burden
  fell after midnight against a third of the street's; seven houses showed a
  second, slower limb traced to the roof space.
topic: >-
  Winter woodsmoke enters the houses of an inland valley town hours after it
  peaks in the street: paired indoor-outdoor PM2.5 records from 26 houses, read
  by recession analysis
