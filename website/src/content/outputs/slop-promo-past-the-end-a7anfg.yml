summary: A short profile of Dr Lindiwe Achterberg, Lecturer in the School of Emergent
  Priorities, told largely in her own words. A former evaluator of pilot schemes,
  Dr Achterberg follows the trials that keep going past their end dates, from a demountable
  classroom still temporary decades on to an audit of relocated bus stops, pop-up
  lanes and other temporary traffic measures in which only nine per cent closed on
  schedule. The video also marks her research funding, the third-highest at the University,
  across two Anticipatory Capability Fund grants.
