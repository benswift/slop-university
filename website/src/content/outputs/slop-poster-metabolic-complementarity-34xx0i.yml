summary: >-
  A research poster from the School of Underlying Conditions recovers 137
  species-level metagenome-assembled genomes from eighteen intervals of one
  cored basement–cover unconformity and links them wherever one genome's
  predicted secretions meet another's auxotrophies. The resulting network
  splits into a cover module and a basement module, joined by nine
  hydrogen-using genomes, seven of them from the lower palaeoregolith.
topic: >-
  metabolic complementarity networks of metagenome-assembled genomes across a
  basement-cover unconformity in one drill core, where a few bridging genomes
  link the fracture-water community below to the sediment community above
