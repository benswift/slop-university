summary: >-
  A pure mathematics poster from the School of Underlying Conditions counts the
  home-exchange rounds in which every household stays in another's home and
  every exchange closes as a reciprocal pair or a three-way ring. It gives the
  generating function and a recurrence for the count, shows by a saddle-point
  argument that the share of households swapping in pairs in a uniformly chosen
  round falls like the inverse cube root of the number of households, and finds
  by exact computation up to 400 households that pairs hold a majority only at
  four and at seven.
