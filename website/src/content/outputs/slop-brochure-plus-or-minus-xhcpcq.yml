summary: >-
  A civic brochure that presents the University to its neighbours through the
  margin stated beside a measurement: the range on a bore reading, the
  unrecovered metres in a core tray, the second instrument brought to a
  community's own. It profiles the School of Underlying Conditions, the
  Basement Relations Group and the Master of Applied Measurement, and points
  to six published University studies by title and DOI.
