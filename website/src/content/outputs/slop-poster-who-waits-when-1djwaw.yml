doi: 10.5555/slop.1djwaw
summary: >-
  A research poster from the School of Continuous Improvement follows thirty
  months of anonymised payment orders from 214 municipal budget institutions in
  an unnamed wartime economy through 47 late-transfer episodes. Wages and
  heating stay paid within terms throughout, while kitchen food, small supplies
  and building maintenance absorb almost all of the shortfall, and the 1,906
  local suppliers linked to their own payments delay those by about one day for
  every three they are owed.
topic: >-
  Who waits when the transfer is late: an event study of how municipal budget
  institutions in an unnamed wartime economy sequence their arrears --- wages
  and heating protected, small local suppliers made to carry the delay --- and
  how that trade credit passes into the suppliers' own payments
