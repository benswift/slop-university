title: Who Waits When the Transfer Is Late
subtitle: Arrears Sequencing in Municipal Budget Institutions and Its Pass-Through to Local Suppliers
authors:
  - Sten Okwuosa
  - Kwame Lindqvist
  - Lindiwe Achterberg
preset: research-poster
school: School of Continuous Improvement
