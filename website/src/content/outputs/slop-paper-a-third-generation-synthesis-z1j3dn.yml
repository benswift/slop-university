summary: >-
  A paper from the School of Emergent Priorities describes a third-generation
  route to the C1–C13 northern fragment of a 22-membered marine macrolide,
  reached in nine steps against thirteen for the second generation and
  twenty-one for the first. The fragment coupling and the macrolactonisation
  that would follow it have not yet been attempted.
topic: >-
  a third-generation synthesis of the northern fragment of an unnamed
  22-membered marine macrolide, four steps shorter than the second, with the
  fragment coupling still ahead
