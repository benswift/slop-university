title: The Machine Comes With an Order Book
subtitle: Equipment Leasing, Household Entry and the Return of Putting-Out in a Regional Garment Industry
authors:
  - Dagny Okafor
  - Signy Okpara
  - Sunniva Balogun
preset: paper
school: School of Continuous Improvement
date: 2026-11-05
