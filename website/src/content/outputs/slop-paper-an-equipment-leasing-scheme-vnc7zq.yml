doi: 10.5555/slop.vnc7zq
summary: >-
  An economics paper from the School of Continuous Improvement evaluates a
  regional scheme that leased industrial sewing machines to households across
  36 districts in four staggered cohorts, finding that it raised household
  garment entry by 4.7 enterprises per 1,000 households, almost nine-tenths of
  them cut-make-trim workshops sewing pre-cut pieces for incumbent factories.
  The factories expanded output without expanding their floors, and the paper
  traces the pattern to a lease that removed the machine as a barrier to entry
  while leaving working capital for fabric, and a fixed instalment, in place.
topic: >-
  an equipment-leasing scheme for household garment workshops raised entry, but
  most new workshops became subcontractors to incumbent factories: a
  staggered-rollout evaluation of how a leasing programme revived a putting-out
  system
