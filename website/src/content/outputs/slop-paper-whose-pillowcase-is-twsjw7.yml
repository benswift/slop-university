title: Whose Pillowcase Is This?
subtitle: Olfactory Recognition of Housemates Grows with Time Lived Together, and Recognition of Oneself Does Not
authors:
  - Gunnhild Ekwueme
  - Anouk Mensah
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-11-23
publishedAt: "2026-11-23T15:32:47+11:00"
doi: 10.5555/slop.twsjw7
summary: >-
  A paper from the School of Emergent Priorities asks 123 residents of 31
  share houses to identify worn pillowcases by smell in a yes/no task,
  finding that recognition of a housemate rises by 0.19 d′ units per
  doubling of the months the two have lived together, reaching the level of
  self-recognition after about three years, while recognition of one's own
  pillowcase does not change with time in the house. Long-standing
  housemates also grow more willing to claim a sample, so that unrelated
  strangers increasingly pass for the person they live with.
topic: >-
  whose pillowcase is this: a signal-detection study of how well share-house
  residents pick their own and each housemate's worn pillowcase by smell
  alone, and how recognition of a housemate grows with the months lived
  together
