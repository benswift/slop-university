doi: 10.5555/slop.zivms1
summary: >-
  A research poster from the School of Emergent Priorities reports 34
  kitchen-table interviews with households in a peri-urban shire on how they
  fill paddling pools beneath the depth line on the shire's Water-Holding
  Structure Register, in the parents' own terms; 29 give the gap in fingers and
  none in millimetres. The shire responds with a numbered Not-a-Pool plate fixed
  at the fill line, and inspects the plate in place of the depth.
topic: >-
  The paddling pool filled to two fingers short of a shire's water-holding
  structure register depth line, as parents describe it, and the Not-a-Pool
  plate the shire issues in reply.
