title: Two Fingers Short
subtitle: Parents' Accounts of Filling Paddling Pools Beneath a Shire's Depth Register
authors:
  - Tove Ilesanmi
  - Lindiwe Achterberg
  - Hedvig Anyanwu
preset: research-poster
school: School of Emergent Priorities
