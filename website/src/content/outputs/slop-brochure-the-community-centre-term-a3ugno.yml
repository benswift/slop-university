summary: >-
  A case-for-support brochure opening on a community centre's term catalogue,
  whose evening classes are printed in full and then half of them do not run,
  and following that distance into the University's work on advertised offers,
  the records that outlive the rooms they describe, and the instruments the
  Indicator Commons lends to organisations outside the University. Three
  previously published studies anchor the publication, each cited by title and
  DOI.
topic: >-
  the community-centre term catalogue whose evening classes half never run, and
  a university that studies the gap between what is advertised and what actually
  happens
