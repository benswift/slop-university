summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 closes out a
  pre-registered equivalence trial of NUDGE, an automated reminder system for
  overdue council rates notices, finding no measurable effect on late
  payment, and follows the completed instrument into a vendor contract now
  measured on reminder delivery alone across every reminder programme the
  agency runs.
topic: >-
  NUDGE: does a council's automated reminder system for overdue rates notices
  change how many ratepayers pay late?
