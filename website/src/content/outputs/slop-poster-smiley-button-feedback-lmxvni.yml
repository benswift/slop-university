title: Nobody Presses at the Boat Ramp
subtitle: >-
  Press-Count Dispatch and Audited Condition Across 22 Public Amenity Blocks
authors:
  - Osei Vandermeer
  - Bram Ntuli
  - Marit Osayande
preset: research-poster
school: School of Continuous Improvement
date: 2026-07-29
publishedAt: 2026-07-29T08:03:07+10:00
doi: 10.5555/slop.lmxvni
summary: >-
  A research poster from the School of Continuous Improvement instruments 22
  public amenity blocks across eight settings with four-button feedback
  terminals, doorway counters and twice-daily blinded condition audits over
  fourteen weeks. Press rate per 1,000 visits shows no reliable association with
  audited condition (rho = 0.11, 95% CI -0.18 to 0.38) while raw press volume
  tracks visit counts closely (rho = 0.86), and the two lowest-scoring settings
  draw 12.0% of fortnightly roster hours against 29.0% of the audit warrant.
topic: >-
  smiley-button feedback terminals at public toilet blocks, and what a cleaning
  roster steered by press counts is actually responding to
