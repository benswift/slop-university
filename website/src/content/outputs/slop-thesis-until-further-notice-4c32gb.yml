title: Until Further Notice
subtitle: Sustained provisionality and its resolution in nine volunteer-run clubs
authors:
  - Tove Ilesanmi
preset: thesis
school: School of Emergent Priorities
date: 2026-09-21
publishedAt: "2026-09-21T19:52:40+10:00"
doi: 10.5555/slop.4c32gb
summary: >-
  A doctoral thesis from the School of Emergent Priorities photographs every
  notice on display at nine volunteer-run clubs across eleven months, then
  follows the 269 arrangements those notices marked as temporary through
  nineteen further months of monthly visits and 34 interviews. Arrangements
  whose marking named an end-point were confirmed as permanent at more than
  twice the rate of those that did not while their rate of reversion was
  unchanged, and the thesis recommends the University enter every pilot, trial,
  interim measure and acting appointment on a published register whose entries
  are confirmed as permanent automatically, without override, at an unresolved
  review date.
topic: >-
  Until Further Notice: sustained provisionality in volunteer-run clubs --- a
  longitudinal study of how "temporary" arrangements at bowls clubs, sheds,
  choirs and allotment societies are maintained as provisional and resolved by
  lapse into permanence, and the review date as the instrument of that lapse
