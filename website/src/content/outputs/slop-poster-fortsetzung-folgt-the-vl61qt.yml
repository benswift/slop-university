title: Fortsetzung folgt
subtitle: The Serial Novels a Provincial Feuilleton Broke Off Without Notice, 1871–1894
authors:
  - Marek Solheim
  - Halvard Nnamani
  - Sunniva Balogun
preset: research-poster
school: School of Emergent Priorities
