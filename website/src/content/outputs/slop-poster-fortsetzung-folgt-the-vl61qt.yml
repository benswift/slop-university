doi: 10.5555/slop.vl61qt
summary: >-
  A research poster from the School of Emergent Priorities collates the 64
  serial novels printed below the line of one provincial German daily between
  1871 and 1894, and finds that eleven were broken off mid-story with
  "Fortsetzung folgt" still standing, most of them in the last week of a
  subscription quarter. It reads the editors' deferring replies to readers as
  the paper keeping a promise formally open that it never meant to keep.
topic: >-
  Fortsetzung folgt: the serial novels a provincial German daily's Feuilleton
  stopped printing mid-story without notice, 1871-1894, read for what the
  unannounced ending did to its readers and to the serial form
