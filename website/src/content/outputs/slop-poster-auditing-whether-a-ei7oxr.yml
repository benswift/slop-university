title: Cleared Before It's Fixed
subtitle: >-
  A Physical Audit of a Gym Chain's Equipment Tickets, Before and After a
  Closure-Speed Bonus
authors:
  - Bram Ntuli
  - Osei Vandermeer
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-11
