doi: 10.5555/slop.ei7oxr
summary: >-
  A research poster from the School of Continuous Improvement cross-matches
  a gym chain's "equipment fixed" ticket log against independent, blind
  walk-through audits across 14 branches and 1,842 machine checks, six
  months before and after facilities staff began earning a bonus tied to
  ticket-closure speed. The ticket log's own resolved rate holds at
  97-99% throughout; the independently audited working rate falls from
  90% to 76% over the same window.
topic: >-
  auditing whether a gym chain's "equipment fixed" maintenance tickets
  track equipment that's actually back in working order, after a staff
  bonus scheme tied pay to how fast tickets close
