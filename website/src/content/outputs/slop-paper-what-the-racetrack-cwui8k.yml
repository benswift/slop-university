title: What the Racetrack Leaves
subtitle: Depth-resolved sectioning of a spent planar Al-doped ZnO target, and re-sintering of its unsputtered remainder
authors:
  - Brynjar Obiora
  - Bram Ntuli
preset: paper
school: School of Underlying Conditions
date: 2026-10-27
publishedAt: "2026-10-27T04:00:22+11:00"
doi: 10.5555/slop.cwui8k
summary: >-
  A paper from the School of Underlying Conditions sections a retired planar
  Al-doped ZnO sputtering target along five lines across its erosion groove and
  finds the Al and spinel enrichment left by service confined to a surface
  layer 14 to 131 µm deep, deepest at the groove shoulders, where nodules also
  concentrate. With that layer lapped away, the remainder re-sinters without
  additions into a second-generation target whose films come within 13% of a
  virgin target's resistivity at equal transmittance.
topic: >-
  what the racetrack leaves: sectioning a spent planar Al-doped ZnO sputtering
  target across its erosion groove, profiling dopant and nodules with depth,
  and re-sintering the unsputtered rim into a second-generation target
