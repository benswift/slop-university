summary: >-
  A marketing poster for the School of Continuous Improvement puts the Master
  of Applied Measurement behind a single strip-mall op-shop whose colour tag
  now writes Monday's rag bag, ranking last week's colour first on the
  disposal rota and binding the shop as this semester's teaching note.
  Developed for bus-stop panels and campus digital signage in matched daylight
  and evening versions.
