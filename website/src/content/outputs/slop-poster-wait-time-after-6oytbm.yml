summary: >-
  A research poster from the School of Underlying Conditions times the wait
  between a mental-arithmetic question and the naming of a pupil across 1,312
  episodes in four Year 3 classrooms, and codes the strategy each pupil then
  reported. Longer waits were followed by slower reported methods, including
  from the same pupil on the same sum, while the proportion of correct answers
  did not move.
topic: >-
  wait time after a mental-arithmetic question and the strategies Year 3 pupils
  say they used, observed lesson by lesson in the classrooms of one primary
  school
