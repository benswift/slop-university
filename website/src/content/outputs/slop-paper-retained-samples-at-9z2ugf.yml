summary: >-
  A paper from the Schools of Underlying Conditions and Emergent Priorities
  reports fourteen months of fieldwork in the retained-sample store of a
  generic tablet works, where a sealed carton from every released batch is
  kept past the batch's expiry. Across eleven years of its withdrawal book,
  thirty-seven withdrawals and eight broken seals, most withdrawals were made
  to show an inspector or a trainee that a carton could be found, and the
  paper argues that the store's product is findability rather than evidence,
  completed when a batch's carton is destroyed unasked.
topic: >-
  Retained samples at a generic tablet works: an ethnography of the people who
  keep a sealed carton of every batch for years against the day it is asked
  for, and of what the keeping is for when almost none is ever opened
