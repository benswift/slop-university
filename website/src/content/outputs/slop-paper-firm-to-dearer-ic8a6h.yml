title: Firm to Dearer
subtitle: Reciting Tone and Cadence in a Rural Radio Market Report
authors:
  - Petra Umbile
preset: paper
school: School of Emergent Priorities
date: 2026-10-28
publishedAt: "2026-10-28T05:31:58+11:00"
doi: 10.5555/slop.ic8a6h
summary: >-
  A paper from the School of Emergent Priorities transcribes 2,987 category
  lines from 214 archived broadcasts of a regional radio station's lunchtime
  saleyard and grain report, spanning the three announcers who held it in
  succession, and reads the report as psalmody: a reciting tone, a mediant
  inflection closing each category name, and five termination formulas each
  bound to a market descriptor. The terminations pass intact through two
  changes of announcer, while the mediant all but disappears once the report
  is pre-recorded in segments.
topic: >-
  Firm to dearer: a musicologist's reading of a regional rural radio station's
  daily saleyard and grain price report as chanted recitation, tracing its
  reciting tones, cadence formulas and their inheritance across three
  successive announcers in the station's tape archive
