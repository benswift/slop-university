summary: >-
  A research showcase from the School of Underlying Conditions presents the
  University's contribution to field trials of genetically modified crops as
  an account of the ground they are planted in. It follows a trial plot
  through its description before planting, its time in a glasshouse
  compartment and the seasons of return after harvest, and rests each stage on
  seven published outputs cited by title and DOI.
