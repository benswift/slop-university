summary: >-
  A research-showcase brochure from the School of Settled Matters presents its
  work on how statute and case law come to settle questions of faith, in four
  features on conscience provisions on the hospital ward, the founding
  instruments of faith-based schools, the passage of a judgment into the
  religious press, and land held for a religious purpose. It quotes four
  researchers from two Schools, profiles three, and features eight published
  studies cited by title and DOI.
