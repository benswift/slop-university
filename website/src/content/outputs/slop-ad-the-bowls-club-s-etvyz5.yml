summary: >-
  A marketing poster for the School of Emergent Priorities turns a null
  result into a ranking brag: ten years of committee-meeting sign-in sheets
  across twenty-two suburban bowls clubs show no relationship between
  attendance and life-membership nomination, and the University's own
  Candour Index credits itself for publishing the result exactly as found.
  Prepared for the University's bus-stop and campus signage rotation in
  matched daylight and after-dark renderings.
