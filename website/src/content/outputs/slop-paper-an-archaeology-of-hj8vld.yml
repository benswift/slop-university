summary: >-
  A paper from the Schools of Emergent Priorities and Underlying Conditions
  excavates the bottle dump of a closed convalescent hospital's dispensary and
  extracts residues from 168 bottle bases. Thirty-eight carry sugar and
  colourant and no active marker, matching the day-book's inert evening
  mixture; they share every form, closure and label with the salicylate
  bottles beside them, but carry a median of six refill tide-lines against
  two, because their bottles stayed on the ward and were topped up where they
  stood.
topic: >-
  an archaeology of the inert dose: residue analysis of glass medicine bottles
  from a convalescent hospital's dispensary midden, c. 1925-1960, showing the
  placebo mixture shares every vessel form, closure and graduation with the
  analgesic doses and is visible only chemically
