doi: 10.5555/slop.1bw1ah
summary: >-
  A paper from the School of Underlying Conditions estimates the implicit price
  of a cellar from 2,314 sales of detached houses over nineteen years in an
  unnamed inland town built over an abandoned mine. A cellar adds 6.8 per cent
  to a house away from the mapped workings and subtracts 5.1 per cent over
  them, a boundary design finds the discount only among houses that have a
  cellar, and thirty-four cellars filled between sales corroborate the sign;
  the authors argue that the ground is priced only where the house shows it.
topic: >-
  what a cellar is worth in a former mining town: a hedonic and repeat-sales
  study in which the price premium for below-ground space reverses over the
  mapped old workings
