summary: >-
  A research-showcase brochure gathers the University's work on how processes
  begin, in three features on the first site where a coating forms on a sand
  grain, the first minutes of a reaction or an instrument before it settles,
  and the first court readings of a statutory provision. It rests the showcase
  on seven published outputs from four schools, cited by title and DOI.
