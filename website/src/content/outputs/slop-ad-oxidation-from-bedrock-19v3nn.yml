summary: >-
  A marketing poster for the School of Underlying Conditions invites the public
  to its spring Open Day, where a split drill core rusting at its weathered end
  is set beside a microscope and the magnified view of a white blood cell in its
  oxidative burst, both offered as the work of one chemistry. Prepared for the
  portrait signage panels in matched daylight and evening renderings, with a
  short reading list from the University's published record.
