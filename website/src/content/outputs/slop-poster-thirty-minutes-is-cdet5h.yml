title: The Booking Knock as Increment Device
subtitle: >-
  A regression discontinuity at the thirty-minute performance-review booking
  end
authors:
  - Signy Okpara
  - Joost Nwosu
  - Solveig Adeyemi
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-07
publishedAt: "2026-10-07T05:02:02+11:00"
doi: 10.5555/slop.cdet5h
summary: >-
  A research poster from the School of Continuous Improvement exploits the
  naturally occurring cutoff at a glass booth's thirty-minute booking-end
  chime across 214 performance-review 1:1s on 18 open-plan floors, finding
  increment award falls from 62% in the last ninety seconds before the knock
  to 18% in the first ninety seconds after it. The School adopts a published
  Increment Window that withholds the annual increment outside that
  ninety-second close, with no line-manager override.
topic: >-
  Thirty minutes is the room-booking end at which the performance-review 1:1
  becomes an increment cutoff
