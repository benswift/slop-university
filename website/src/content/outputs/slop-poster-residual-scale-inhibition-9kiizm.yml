summary: >-
  A research poster from the School of Settled Matters doses twenty-four heated
  stainless-steel coupons in a bench-scale hard-water loop with a phosphonate
  antiscalant for 0, 2, 7 or 28 days, then stops the dose and times the onset
  of calcite fouling. Median onset rises from 11 hours on undosed coupons to 61
  hours after a week of dosing and only 66 after four weeks, tracking the
  phosphorus left on each surface, which stops accumulating after the first
  week.
topic: >-
  residual scale inhibition after antiscalant dosing ends: how long calcite
  deposition stays suppressed on heat-exchanger surfaces in a recirculating
  hard-water loop
