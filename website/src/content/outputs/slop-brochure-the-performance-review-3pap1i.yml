summary: >-
  A marketing brochure for the School of Continuous Improvement's
  evaluation-ecosystem agenda, built around a replication attempt that sends
  the University's staff car-park Priority Score into a retail chain's
  shift-swap queue, where an existing loss-prevention camera in the review
  room unsettles the original null finding, alongside a showcase of six
  published outputs across both Schools.
topic: >-
  a chain's shift-swap request priority score, adapted from the University's
  car-park priority score finding, replicated in a back-room swap-review
  session under an existing loss-prevention camera to see whether it still
  tracks confident form-filling rather than genuine rostering need
