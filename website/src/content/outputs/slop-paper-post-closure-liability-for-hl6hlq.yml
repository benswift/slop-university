doi: 10.5555/slop.hl6hlq
summary: >-
  A paper from the School of Underlying Conditions models an operator that
  finances a geological carbon store with a green bond, chooses how much to
  spend characterising the store, and hands leak liability to a public steward
  at a fixed transfer date. It shows that the operator's shortfall in
  characterisation splits exactly into a transfer wedge and a larger
  discounting wedge, that a use-of-proceeds label reaches neither, and that an
  escrowed stewardship perpetual removes the transfer wedge and narrows the
  discounting wedge only when its holders are patient.
topic: >-
  Post-closure liability for a geological carbon store outlasts the green bond
  that financed it: a model of who holds the stewardship tail once the bond has
  matured, and an escrowed perpetual tranche that prices it
