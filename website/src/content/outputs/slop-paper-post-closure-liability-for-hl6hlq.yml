title: Who Holds the Plume After the Bond Matures?
subtitle: Post-Closure Liability and Green Debt for Geological Carbon Storage
authors:
  - Ragnhild Uzoma
  - Kwame Lindqvist
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
