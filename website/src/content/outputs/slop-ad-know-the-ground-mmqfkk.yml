summary: >-
  A marketing poster for Slop University sets Associate Professor Ragnhild
  Uzoma at a soil pit on a working paddock, a split core across her knees, and
  offers the School of Underlying Conditions' subsoil work to anyone about to
  take a farm on lease. Composed for the portrait signage rotation, it points
  to three of the School's studies of farm ground: subsoil compaction across a
  buried pipeline, a water balance on small stock dams, and a lexicon of the
  soil words landholders used.
