title: When an Objective Is Spent
subtitle: Online Release of Non-Binding Objectives in Many-Objective Evolutionary Search
authors:
  - Clemency Tredinnick
  - Bram Ntuli
  - Mirela Hanke
preset: paper
school: School of Settled Matters
