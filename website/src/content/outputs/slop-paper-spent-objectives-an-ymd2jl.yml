summary: >-
  A paper from the School of Settled Matters and the School of Continuous
  Improvement proposes the lapse test, which releases an objective from a
  many-objective evolutionary search once a confidence bound on the error of
  omitting it stays below tolerance, and readmits it if a 2% audit of offspring
  shows it binding again. On synthetic problems with 5 to 12 objectives and a
  seven-objective pump and valve schedule, it saved 22 to 42% of objective
  evaluations at a median hypervolume ratio of at least 0.991, where one-shot
  offline reduction dropped the wrong objectives in most runs.
topic: >-
  Spent objectives: an online test for when an objective in many-objective
  evolutionary search has stopped shaping the Pareto front, and what releasing
  it mid-run costs
