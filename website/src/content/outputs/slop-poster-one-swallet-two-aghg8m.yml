summary: >-
  A research poster from the School of Continuous Improvement reports nine
  uranine injections into one perennial sinking stream on an unnamed limestone
  plateau, timed across 14 to 230 L/s of sink discharge and recovered at the
  two springs on the scarp below. No dye reached the intermittent overflow
  spring in the two lowest-flow tests; from 31 L/s its share of the injected
  mass rose to 52%, almost entirely at the perennial resurgence's expense, so
  the swallet's catchment shifts with stage.
topic: >-
  One swallet, two springs: nine fluorescent-dye tracer tests from a single
  sinking stream on a limestone plateau, injected across the stage range, show
  the share reaching an intermittent overflow spring rising with stage, so the
  catchment boundary moves with the weather
