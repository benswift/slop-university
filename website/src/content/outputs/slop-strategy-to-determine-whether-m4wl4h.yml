title: The Chalkboard A-Frame as Control Condition
subtitle: Slop University's Strategic Plan 2026-2031 on a market trial that found no difference between two ways of writing a price
authors:
  - Hedvig Anyanwu
  - Tove Ilesanmi
  - Sunniva Balogun
preset: strategy
school: School of Emergent Priorities
date: 2026-10-05
publishedAt: "2026-10-05T04:00:55+11:00"
doi: 10.5555/slop.m4wl4h
summary: >-
  Slop University's Strategic Plan 2026-2031 takes as its premise a season of
  alternate Saturdays at four weekly markets, in which writing a stall's price
  as $4.95 or as $5 on its chalkboard A-frame sold the same number of units. On
  that result the plan places a hand-lettered board at every University point of
  sale, with the board prevailing over the billing system, states every fee in
  whole dollars, and lodges the finding complete, never to be re-analysed.
topic: >-
  To determine whether writing a farmers'-market stall's price as $4.95 rather
  than $5 on its chalkboard A-frame changes how many units sell, and to set the
  University's own schedule of fees by the answer
