summary: >-
  A research poster in political theory from the School of Continuous
  Improvement reads a three-channel late-fusion classifier, screening 1,140
  recorded mock selection interviews, as an assembly that decides by vote. Its
  fusion weights leave each channel a third of formal power, yet voice prosody
  was the lone dissenter in 214 of 331 split decisions and cast under a fifth of
  the decisive votes; the poster proposes that each outvoted channel's verdict
  be kept in the decision record as a dissent.
topic: >-
  A political theorist reads late-fusion multimodal classifiers as assemblies
  of modalities, asking whether a channel that is almost always outvoted in the
  fused decision --- a permanent minority --- is represented in it at all
