summary: >-
  A marketing poster for the Master of Applied Measurement stages a junior
  sports club's tryout cut-list beside its appeal-window satisfaction survey,
  as the pitch for a program built to notice the difference between an
  appeal that changes an outcome and one that only gives a family somewhere
  to put their feelings, developed with the School of Continuous Improvement
