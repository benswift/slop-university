title: Building by Building
subtitle: A Strategic Plan for growing into the city's old quarter through adaptive reuse
authors:
  - Ragnhild Uzoma
  - Ingrid Vasseur
  - Ylva Ogunbanjo
preset: strategy
school: School of Underlying Conditions
date: 2026-10-15
