doi: 10.5555/slop.ut8ax1
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the University to grow
  principally by adapting the existing buildings of its city's old quarter,
  applying a reuse test to every capital proposal and opening a Fabric Record
  for each building before its first alteration. It pairs that record with a
  subsurface record and archived core before any excavation, and with
  continuing leases and reopened halls for the quarter's residents and
  traders.
topic: >-
  adaptive reuse as strategy: a university that grows into its city's historic
  quarter building by building, and keeps the record of what it changes
