doi: 10.5555/slop.3qlmta
summary: >-
  A research poster from the School of Emergent Priorities scores the
  town-entry welcome boards of 46 shires across four quarterly rounds on a
  five-level maturity model running from Painted to Custodied, and finds that
  eleven of the 17 shires whose signage officer handed over fell at least one
  level in the following quarter against two of 29 without a handover, while
  both boards at Level 5 held. A state signage scheme now pays its subsidy only
  to Level 5 shires and requires each numeral set to be counted into a sealed
  depot tray at every handover, with no exception for a correct figure.
topic: >-
  The shire signage officer who hands over the town-entry welcome board's loose
  numerals, with 46 shires scored against a five-level maturity model and a
  state signage subsidy tied to the level
