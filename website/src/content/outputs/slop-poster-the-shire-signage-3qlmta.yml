title: A Welcome Board Drops a Level When Its Officer Leaves
subtitle: >-
  46 shires scored on a five-level welcome board maturity model, and the custody
  rule the scheme set on it
authors:
  - Verity Marris
  - Edda Nwafor
  - Sunniva Balogun
preset: research-poster
school: School of Emergent Priorities
date: 2026-10-05
