title: A Horizon of Letters
subtitle: The Paper Packing of a Timber-Framed Wall and the Change of Script in One Household's Discard
authors:
  - Ragnhild Uzoma
  - Sunniva Balogun
preset: paper
school: School of Underlying Conditions
