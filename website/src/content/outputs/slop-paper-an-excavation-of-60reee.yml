doi: 10.5555/slop.60reee
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities excavates the paper packed into one village house's timber-framed
  wall cavity by context, recording 3,148 fragments in eighteen contexts and a
  rodent-nest cut reported as an interval of no recovery. Latin-script print
  first enters the wall folded, as the leaves of a reading primer, like the
  Arabic-script leaves beneath it; three contexts higher crumpled newsprint
  arrives and the folded share of Latin-script leaves falls from 86% to 11%, a
  second horizon the authors argue the deposit is better placed to date.
topic: >-
  an excavation of the paper packing in a village house's wall cavity, reading
  the change of script in Turkish print as a stratigraphic horizon in what one
  household read and what it used as stuffing
