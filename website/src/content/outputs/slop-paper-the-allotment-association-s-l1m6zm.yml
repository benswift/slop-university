title: When Three Years on the List Finally Buys the Big Plot
subtitle: >-
  A Regression-Discontinuity Study of Allotment Seniority Cutoffs and Their
  Adoption as a Funding-Readiness Indicator
authors:
  - Hedvig Anyanwu
  - Ronja Oyelaran
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
date: 2026-09-15
publishedAt: "2026-09-15T09:41:33+10:00"
doi: 10.5555/slop.l1m6zm
summary: >-
  A paper from the School of Emergent Priorities applies a
  regression-discontinuity design to an allotment federation's seniority
  cutoff for full-size plots, finding a sharp jump in materials-account
  spending at the threshold and no comparable movement in produce-show
  entries or working-bee attendance. The recovered coefficient has since been
  adopted by the Anticipatory Capability Fund as a scored readiness criterion
  for future funding rounds.
topic: >-
  The allotment association's waiting-list seniority cutoff for full-size
  plots supplies a natural regression-discontinuity boundary: members who
  cross the threshold years-on-list are compared against those just short of
  it on shed-building, produce-show entries, and working-bee attendance.
