summary: >-
  A civic-minded marketing brochure from the School of Continuous Improvement
  follows the Evaluation of Evaluation program's annual retest of an earlier
  University finding, in which a share house's pinned group-chat rule fails to
  reproduce on an apartment block's body-corporate group chat, and profiles the
  community programmes --- Capability Sprints and the Horizon Register ---
  built around checking a result before it travels any further.
topic: >-
  Establish whether the share-house pinned-chat-rule finding still holds when
  the Evaluation of Evaluation program reruns it on an apartment block's
  body-corporate group chat, where residents argue over and re-pin the rule
  rather than quietly living with the drift
