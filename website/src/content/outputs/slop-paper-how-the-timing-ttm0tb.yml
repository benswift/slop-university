doi: 10.5555/slop.ttm0tb
summary: >-
  A paper from the School of Underlying Conditions replays six grab-sample
  timing rules on five-minute outlet turbidity records from nine construction
  sediment basins over 74 discharge events. A first-hour grab overstates the
  event's time-weighted mean turbidity by a median factor of 2.22 and a
  next-morning grab understates it by 0.77 while missing 22 events that had
  stopped discharging, a two-point recession estimator comes within 2 per cent
  at the median, and the choice of rule accounts for about three times as much
  of the variation in reported turbidity as the choice of basin.
topic: >-
  how the timing rule for a construction sediment basin's rainfall-triggered
  grab sample decides the discharge turbidity a site reports: a resampling
  study of continuous logger records
