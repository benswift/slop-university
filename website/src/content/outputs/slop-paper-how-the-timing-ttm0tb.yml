title: Next Morning, After the Basin Settles
subtitle: Emulating Grab-Sample Timing Rules on Continuous Turbidity Records from Nine Construction Sediment Basins
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-11-02
