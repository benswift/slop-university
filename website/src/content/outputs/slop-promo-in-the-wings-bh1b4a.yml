summary: "Dr Thandiwe Solberg, Senior Lecturer and Convenor of Demo Quarter, introduces
  the School of Continuous Improvement's quarterly Masters-program showcase and her
  research into what happens to work before it reaches the stage. In her own voice,
  Dr Solberg moves from the rehearsal that gets cut and the version judged fit to
  show to the other shows her studies attend: the judging at a country show, a concert's
  standing ovation and the daily stand-up meeting. The film also marks the wide audience
  her own research has found."
