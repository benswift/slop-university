title: WALLBAG
subtitle: >-
  Wall-Left Lemon Bag Acceptance Gate: a come-study marketing poster for the
  Master of Applied Measurement, built around householders' accounts of the
  point at which a bag of surplus lemons left on a front wall stops being a
  gift and becomes a favour owed.
authors:
  - Bram Ntuli
preset: marketing-poster
school: School of Continuous Improvement
date: 2026-10-05
publishedAt: "2026-10-05T15:01:15+11:00"
doi: 10.5555/slop.30tfjo
summary: >-
  A marketing poster for the Master of Applied Measurement invites prospective
  students to hear, in householders' own words, when a free bag of backyard
  lemons left on a front wall turns owed, and announces that any University
  surplus left out for three days is now signed for by a named recipient.
topic: >-
  To establish, in householders' own terms, the point at which a bag of surplus
  backyard lemons left on the front wall for passers-by stops being a gift and
  becomes an owed favour, and to bind the University's surplus-stock handling
  to that point: any surplus left out three days must be signed for by a named
  recipient
