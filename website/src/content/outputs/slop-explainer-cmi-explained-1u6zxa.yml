title: CMI, Explained
subtitle: Dagny Okafor, Casimir Beng and Bram Ntuli on a five-level maturity index
  for performance-review calibration, a blind panel's re-scoring, and the bonus pools
  a firm now sets by the level
authors:
  - Dagny Okafor
  - Casimir Beng
  - Bram Ntuli
preset: video-explainer
school: School of Continuous Improvement
date: 2026-10-20
publishedAt: "2026-10-20T03:37:27+11:00"
doi: 10.5555/slop.1u6zxa
summary: A research explainer from the School of Continuous Improvement on Dagny Okafor,
  Casimir Beng and Bram Ntuli's Calibration Maturity Index, a five-level instrument
  for scoring how a performance-review calibration session is run. It follows 156
  sessions at a professional-services firm from their attained level to an outside
  panel's blind re-scoring of the employees behind them, and on to the bonus pools
  the firm now sets by the level alone. Okafor, Ntuli and Beng describe the work in
  their own words.
topic: A research explainer of the paper introducing the Calibration Maturity Index,
  a five-level instrument scoring performance-review calibration sessions, which finds
  the attained level barely tracks a blind panel's re-scoring of the ratings while
  a firm's remuneration committee sets bonus-pool multipliers by the level alone
