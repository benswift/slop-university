title: Skip Link, Eventually
subtitle: A taxonomy of recipe-page preambles, and the University's own skip-link delay
authors:
  - Marek Solheim
  - Anneke Tolan
  - Lindiwe Achterberg
preset: research-poster
school: School of Emergent Priorities
date: 2026-10-03
publishedAt: "2026-10-03T11:00:55+10:00"
doi: 10.5555/slop.73rd01
summary: >-
  A research poster from the School of Emergent Priorities sorts the preambles
  of 1,700 online recipe pages into five kinds by what the author does before
  the ingredients, finds that only the Provenance kind is scrolled to its end by
  readers, and records the University's decision to hold the skip-to-the-form
  link on every procedure page back until that kind's 2.4 screen-heights have
  passed.
topic: >-
  To establish a taxonomy of the preambles that online recipe pages place before
  the ingredients, sorting 1,700 pages into kinds by what the author is doing
  instead of cooking, and to place the University's own skip-to-the-form link
  only after the scroll length of the kind that readers sit through
