doi: 10.5555/slop.dyycee
summary: >-
  A research poster from the School of Emergent Priorities sets 61
  semi-structured interviews across four metropolitan home-delivered meal rounds
  against 214 doorstep encounters timed by ride-along observation over 14 weeks.
  The meal itself is named unprompted in 91 per cent of volunteer-driver
  interviews and 34 per cent of recipient interviews, while the check at the door
  reverses that split (39 and 87 per cent); two further domains, the noticed
  fault and the marked day, divide the two accounts by more than 40 points each.
  Observed dwell is bimodal before a mid-study route consolidation and
  single-moded after it: median dwell moves only from 2.0 to 1.7 minutes, while
  encounters longer than four minutes fall from 43 of 108 to none of 106 and the
  rounds' recorded meals-delivered figure rises 19.4 per cent.
topic: >-
  the volunteer-delivered hot meal left at an older person's front door, where a
  council counts meals delivered as its social-support indicator and reoptimises
  the delivery run to raise the count, interviewed against what recipients and
  volunteer drivers each say the two minutes at the door is for
