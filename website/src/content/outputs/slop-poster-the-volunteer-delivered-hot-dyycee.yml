title: Nine Minutes, or Ninety Seconds
subtitle: >-
  Doorstep Time at Four Home-Delivered Meal Rounds, in 61 Interviews and 214
  Observations
authors:
  - Runa Adegoke
  - Petra Umbile
  - Marek Solheim
