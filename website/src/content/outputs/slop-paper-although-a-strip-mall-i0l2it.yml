title: Closed Today, No Further Explanation
subtitle: >-
  A Five-Kind Taxonomy of Strip-Mall Trader Signage and Its Adoption as a
  Shopping-Centre Lease-Renewal Risk Score
authors:
  - Ingrid Vasseur
  - Kwame Lindqvist
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-09-15
publishedAt: "2026-09-15T04:59:10+10:00"
doi: 10.5555/slop.i0l2it
summary: >-
  A paper from the School of Emergent Priorities sorts 1,142 strip-mall
  closed-today signs across 68 sites into a five-kind taxonomy --- personal,
  operational, seasonal, return-time overrun, and unstated --- and traces two
  of those kinds into a shopping-centre operator's lease-renewal risk score.
  An inter-rater ablation shows the taxonomy's reliability is unaffected by
  coder training, while the operator's post-adoption renewal-review flags
  concentrate almost entirely among the traders least able to contest an
  unstated or overrun classification.
topic: >-
  Although a strip-mall trader's handwritten closed-today sign looks like
  one apology, a taxonomy sorting the reasons behind it into five kinds
  becomes the risk score a shopping-centre landlord uses to flag leases for
  non-renewal
