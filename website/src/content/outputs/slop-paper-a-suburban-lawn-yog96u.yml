title: TIER
subtitle: >-
  Threshold-Indexed Equity Rate: Auditing a Bowls Consortium's
  Grading-Linked Facility Levy
authors:
  - Ingeborg Nwachukwu
  - Osei Vandermeer
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-08-31
publishedAt: "2026-08-31T21:02:13+10:00"
doi: 10.5555/slop.yog96u
summary: >-
  A paper from the School of Continuous Improvement treats a nine-club
  suburban bowls consortium's rolling handicap threshold as a sharp
  regression-discontinuity design, finding no matching jump in singles-ladder
  standing or rink-booking use at the grading cutoff, while the consortium's
  automated facility-levy calculator, TIER, produces an $84 annual levy jump
  at the same point that survives every bandwidth, donut-hole, and placebo
  check the authors ran.
topic: >-
  TIER, a suburban bowls consortium's automated facility-levy calculator,
  reassigns a player's annual dues the moment a routine handicap
  recalculation crosses the pennant grading threshold, and a
  regression-discontinuity design around that naturally occurring cutoff
  finds no matching jump in rink bookings or singles-ladder performance on
  either side of it
