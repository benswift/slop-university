summary: >-
  A marketing poster for Slop University presents the road cut at the campus
  edge, where steeply folded basement rock meets the near-level cover laid down
  upon it, as the first-rated geosite on the University's own geoheritage
  inventory, and invites the public to come and see it. Developed for campus
  digital signage and bus-stop panels in a landscape rotation.
