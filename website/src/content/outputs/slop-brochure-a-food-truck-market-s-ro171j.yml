summary: >-
  A prospectus brochure for the School of Emergent Priorities and the School
  of Continuous Improvement, built around the everyday proxy metrics --- a
  queue, a tier, a forecast --- that stand in for the things they were meant
  to measure. Two previously published findings anchor its case for the
  University's postgraduate measurement and foresight programmes.
topic: >-
  a food-truck market's camera-counted queue length decides next week's
  vendor slot roster, whether or not the queue ever reflects who's actually
  buying
