summary: >-
  A single-site case study follows one suburban sports club's
  presentation-night honour-board nominations after its committee adopted
  MERIT, a points-based accreditation system that replaced an informal show
  of hands with a formal eligibility review and appeals window.
topic: >-
  although a suburban sports club's honour-board nominations used to be
  settled by a show of hands, the committee's new points-based MERIT
  accreditation system now requires a formal appeals period before a single
  name can be added
