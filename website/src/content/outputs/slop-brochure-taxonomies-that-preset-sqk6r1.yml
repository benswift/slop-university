summary: >-
  A marketing brochure from the School of Emergent Priorities profiles Slop
  University's civic-taxonomy research, from a court registry's
  exemption-category work through to published findings on verge-mowing
  exemptions, loyalty-scheme dormancy, and discontinued civic schemes, and
  introduces the researchers building categories that institutions go on to
  trust.
topic: >-
  a taxonomy of court-registry exemption requests that presets how many
  summonses the next jury call-up will need to issue, months before any
  individual case is assessed
