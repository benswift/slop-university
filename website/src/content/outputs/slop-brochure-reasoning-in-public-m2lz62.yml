summary: >-
  A civic brochure presenting the University's public life through the
  five-step order of argument of classical Nyāya logic and its distinction
  between discussion undertaken to find out and disputation undertaken to win.
  Three features, on reasoning from recovered core, returning to the household
  examples behind the district's rules, and good-faith public debate, are
  joined by six published outputs cited by title and DOI.
