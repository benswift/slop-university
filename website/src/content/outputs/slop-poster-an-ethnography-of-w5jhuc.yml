title: Flat Enough to Read
subtitle: Repair Work and the Scanner's Eye in One Accounts-Payable Scanning Room
authors:
  - Edda Nwafor
  - Thandiwe Solberg
  - Anneke Tolan
preset: research-poster
school: School of Continuous Improvement
