doi: 10.5555/slop.w5jhuc
summary: >-
  A research poster from the School of Continuous Improvement follows 2,214
  documents through one shared-services centre's accounts-payable scanning
  room over 31 weeks of participant observation, finding that its nine clerks
  learn to sort, flatten, darken and re-key paperwork by how the capture
  software will read it, and that this repair work, spread between the bench
  and the exception queue, is what lets automated invoice capture run as
  automatic.
topic: >-
  an ethnography of an accounts-payable scanning room in a shared-services
  centre, where clerks learn to see invoices as the capture software's optical
  character recognition does --- flattening, re-scanning, re-keying faded
  thermal receipts --- the invisible repair work that makes automated invoice
  capture look automatic
