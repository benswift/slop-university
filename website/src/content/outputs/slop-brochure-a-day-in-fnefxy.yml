summary: >-
  A case-for-support brochure from the School of Underlying Conditions invites
  partners to back the spare seats its soil survey offers to family carers of
  people living with mental illness: a day at an open pit, with nothing asked
  of the guest. It describes what the day contains, declines to say what the
  day does, and rests the offer on seven published outputs cited by title and
  DOI.
