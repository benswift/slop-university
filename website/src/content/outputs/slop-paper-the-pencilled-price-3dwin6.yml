title: Crossed Out in the Same Hand
subtitle: Handwritten markdowns as credible reference prices in the secondhand book trade
authors:
  - Sunniva Balogun
  - Anneke Tolan
preset: paper
school: School of Emergent Priorities
date: 2026-11-25
publishedAt: "2026-11-25T03:00:47+11:00"
doi: 10.5555/slop.3dwin6
summary: >-
  A paper from the School of Emergent Priorities reports a 28-day field
  experiment on 1,536 books across three secondhand bookshops, finding that a
  pencilled price struck through and rewritten lower sold at 31.5 per cent
  against 24.0 per cent for the same price written clean and 25.3 per cent for
  a printed discount sticker. An online experiment with 610 shoppers traces the
  gain to the believed credibility of the former price, and finds that a second
  crossing-out keeps that credibility while more than doubling the shelf time shoppers
  assume, cancelling the gain in purchase intention.
topic: >-
  the pencilled price on a secondhand book's flyleaf, crossed out and rewritten
  lower by the bookseller's own hand, and whether shoppers read it as a more
  credible markdown than the same price pencilled clean or a printed discount
  sticker
