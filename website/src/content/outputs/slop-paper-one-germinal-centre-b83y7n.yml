title: One Germinal Centre, Entire
subtitle: >-
  Seventeen Imaging Sessions Through a Lymph-Node Window, from Coalescence to
  Dissolution
authors:
  - Brynjar Obiora
  - Vigdis Emenike
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-10-14
