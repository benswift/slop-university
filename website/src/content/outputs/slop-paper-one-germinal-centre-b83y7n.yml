doi: 10.5555/slop.b83y7n
summary: >-
  A paper from the School of Underlying Conditions follows a single germinal
  centre in one multicolour reporter mouse through a chronic lymph-node window
  at seventeen sessions over thirty-two days, assigning every coloured cell to
  one of ten colours in 14,313 calls by two scorers. The colour that led early
  was overtaken by one that came to hold 91 per cent of the centre as it
  emptied, and a third colour, unrecorded for five sessions, returned to supply
  two of the last three cells; the authors draw no inference to any other
  centre.
topic: >-
  one germinal centre followed from founding to dissolution through a chronic
  lymph-node window in a single mouse, every clone counted by colour
