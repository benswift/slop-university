title: Where the Shells Run Out
subtitle: Exposed Shell, Not Embryo Salinity Tolerance, Sets the Upstream Limit of Nesting in an Estuarine Goby
authors:
  - Brynjar Obiora
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-11-21
publishedAt: "2026-11-21T19:30:48+11:00"
doi: 10.5555/slop.be0a7d
summary: >-
  A paper from the School of Underlying Conditions surveys nests of a
  shell-nesting goby at fourteen stations along a temperate tidal creek through
  one spawning season, finding that nesting stops between 4.5 and 5.0 km from
  the mouth where exposed shell gives way to soft mud, although guarded clutches
  moved upstream hatched nearly as well as at home for a further kilometre and
  failed only near a median salinity of 3.5. Clean shells laid beyond the limit
  were spawned in until the mud buried them.
topic: >-
  where an estuarine goby stops nesting: a tidal-creek survey and reciprocal
  clutch transplant showing the upstream limit of spawning follows the last
  shell bed rather than the embryos' tolerance of fresher water
