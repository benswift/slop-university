doi: 10.5555/slop.k3xv8d
summary: >-
  A paper from the School of Emergent Priorities sorts 6,214 rings of the entry
  chimes at 38 strip-mall shops into four kinds, Hail, Intrusion, Misfire and
  Echo, which three coders agree on at a kappa of 0.83, and finds staff
  acknowledge rings at near-equal rates whatever their kind. A Standing Order
  that answers only rings tallied as Hails lifts the tallied Misfire share at
  fourteen University service counters from 22.8% to 41.6% while the audited
  share holds near 24%, and the University adopts the order for every counter
  with an entry chime, with no override.
topic: >-
  Which of four kinds of ring is a strip-mall shop's door chime sounding, a
  customer's hail, an intrusion, a misfire or an echo on the way out, and should
  the University's service counters answer a ring by its kind or by its sound?
