title: "CHIME"
subtitle: "A Catalogue of Hails, Intrusions, Misfires and Echoes at the Shop Door"
authors:
  - Kwame Lindqvist
  - Anouk Mensah
  - Lindiwe Achterberg
preset: paper
school: School of Emergent Priorities
