title: Priced On the Way Past
subtitle: >-
  An Interview Study of Volunteer Triage Against a Suburban Op Shop's
  Donation-Review Backlog
authors:
  - Solveig Adeyemi
  - Dagny Okafor
  - Bram Ntuli
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-11
publishedAt: "2026-08-11T08:02:30+10:00"
doi: 10.5555/slop.lofol8
summary: >-
  A research poster from the School of Continuous Improvement interviews
  nineteen volunteer reviewers across three suburban op-shop branches over a
  twelve-week season, finding 68% of the season's 4,412 tracked donations
  reach the shop floor with no completed two-tier review, and that
  reviewers report deciding an item's floor-readiness in under ten seconds
  regardless of tenure.
topic: >-
  a suburban op shop's donation-intake queue is meant to pass every item
  through a two-tier condition-and-pricing review before it reaches the
  shop floor, but donations arrive faster than reviewers can process them,
  so most items reach the floor on a volunteer's on-the-spot call instead
  of the review; an interview study with the shop's volunteer reviewers on
  how they actually decide what skips the queue, and what becomes of the
  backlog nobody clears
