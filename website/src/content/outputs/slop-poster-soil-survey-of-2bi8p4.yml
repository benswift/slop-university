summary: >-
  A research poster from the School of Underlying Conditions describes the
  humus under epiphytic fern mats as soil profiles, hand-cored every 25
  centimetres along twelve limbs of six host trees in one rainforest stand.
  The last live fern rhizome and the last core holding at least two
  centimetres of humus never mark the same edge: on nine limbs the humus runs
  on past the fern, by a median 0.75 metres, so mapping canopy soil by its
  fern cover under-draws it by about a seventh.
topic: >-
