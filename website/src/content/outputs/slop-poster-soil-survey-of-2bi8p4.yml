title: The Fern Stops Before the Soil Does
subtitle: Mapping the Outer Edge of Canopy Humus, Limb by Limb, on One Stand of Host Trees
authors:
  - Brynjar Obiora
  - Ylva Ogunbanjo
preset: research-poster
