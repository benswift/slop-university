title: Still Draining on Day Three
subtitle: Rain, perched water and reclaim timing in a chevron-stacked coking-coal stockpile
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-20
