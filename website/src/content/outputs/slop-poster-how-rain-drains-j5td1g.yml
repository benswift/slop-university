doi: 10.5555/slop.j5td1g
summary: >-
  A research poster from the School of Underlying Conditions dips eight
  standpipe piezometers along a 240 m chevron-stacked coking-coal stockpile
  every six hours after eleven rain events, finding perched water on the
  compacted base that drains with a time constant of 15 to 16 hours at the
  pile's coarse ends and 36 to 39 hours through its fines-rich core. Twelve of
  the 14 reclaims that reached the ovens outside the moisture window had been
  drawn through the core within 72 hours of rain.
topic: >-
  How rain drains out of a chevron-stacked coking-coal stockpile: piezometer
  records from an inland coke works, and the reclaim delay that brings
  oven-charge moisture back inside its bulk-density window
