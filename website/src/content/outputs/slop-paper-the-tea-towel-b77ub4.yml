summary: >-
  A paper from the School of Continuous Improvement classifies every visible
  tea towel in 384 kitchens on a two-by-two of position and recent use. The
  four cells are named Working, Displayed, Circulating, and Stored. After a
  waste-education partnership adopted handle occupancy as a grant indicator,
  Displayed rose from 14 to 38 percent of towels while Working stayed flat
  and paper-towel purchasing remained equivalent.
