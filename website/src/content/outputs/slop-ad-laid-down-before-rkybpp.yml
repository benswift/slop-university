summary: >-
  A marketing poster from the School of Underlying Conditions places an
  embryo's looped heart tube and a vial of eyeless groundwater amphipods under
  one microscope lamp, presenting the School's interest in what a body is
  built with before anyone examines it. It teases the School's paper Light
  Down the Pipe and invites the public to see the work.
topic: >-
