title: Laid Down Before Anyone Looked
subtitle: >-
  A display campaign in which the School of Underlying Conditions sets an
  embryo's first heart fold beside a vial of eyeless bore amphipods, and
  points the public to its finding that the animals' eyes followed their
  lineage rather than the light.
