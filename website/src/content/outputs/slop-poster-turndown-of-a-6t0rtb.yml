title: Half Load and No Lower
subtitle: The turndown floor of a wind-coupled, absorber-equipped ammonia loop
authors:
  - Brynjar Obiora
  - Bram Ntuli
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-27
