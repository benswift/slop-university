doi: 10.5555/slop.6t0rtb
summary: >-
  A research poster from the School of Underlying Conditions steps a farm-scale
  ammonia loop, run from one wind turbine with a metal-halide absorber in place
  of the condenser, down from nameplate in nine campaigns over 14 weeks and
  logs each unit's minimum stable load. The recycle compressor set the loop's
  floor every time, at a median 52% of nameplate, well above the reactor's
  26 to 34% and the absorbers' 37 to 44%, and the turbine spent 61% of 2,316 logged
  hours below it.
topic: >-
  turndown of a farm-scale absorbent-enhanced ammonia synthesis loop run from a
  single wind turbine's intermittent output, and where along the loop its
  minimum stable load is set
