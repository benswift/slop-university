title: The Terminal Kept the Score
subtitle: >-
  Validating a Cafe Franchise's Point-of-Sale Tip-Suggestion Screen Dwell
  Time as a Per-Outlet Friendliness Proxy Against Realised Tip Percentage
authors:
  - Mirela Hanke
  - Torun Ezeigwe
  - Marek Solheim
preset: paper
school: School of Continuous Improvement
date: 2026-08-08
publishedAt: "2026-08-08T07:01:59+10:00"
doi: 10.5555/slop.27mugw
summary: >-
  A paper from the School of Continuous Improvement validates a cafe
  franchise's point-of-sale "friendliness score" --- the seconds a
  terminal's default tip-suggestion screen holds a customer's attention,
  folded into quarterly outlet-manager reviews --- against realised tip
  percentage across 214,612 transactions and 44 outlets over five months.
  Prompt dwell time shows a negligible, non-significant association with
  realised tips (r = 0.06), a null that survives an ablation removing
  terminal hardware generation as a covariate, while the franchise's
  existing quarterly service-audit rating retains a moderate positive
  correlation in every region (r = 0.27-0.36). Dwell time instead varies
  threefold across the network's three terminal hardware generations,
  tracking equipment age rather than staff behaviour.
topic: >-
  an instrument-validation study testing whether the seconds a cafe
  franchise's EFTPOS terminal spends displaying its default tip-suggestion
  screen predicts the tip percentage customers actually leave, after head
  office began logging that dwell time as a per-outlet friendliness score in
  staff reviews
