summary: >-
  A landscape marketing poster for the School of Settled Matters sets a
  crescent dune advancing across a buried boundary fence and offers the School
  as the place where a land title is read for everything the wind has carried
  across it, taking as its hook a University survey of barchan dunes slowed in
  the lee of a coastal wind farm. Developed for the University's landscape
  signage panels and the campus digital rotation.
