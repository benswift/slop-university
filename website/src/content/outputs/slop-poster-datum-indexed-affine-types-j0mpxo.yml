doi: 10.5555/slop.j0mpxo
summary: >-
  A research poster from the School of Underlying Conditions presents a type
  system in which a groundwater level is a point indexed by its datum rather
  than a length, so that levels may be differenced, shifted, rebased and
  averaged but never added. Checked against 318 archived processing scripts
  annotated only where files are read, it rejects 61 expressions in 47
  scripts, of which 23 are correct means written as a sum and 4 are the unit
  mismatches a dimension checker would have found.
topic: >-
  Datum-indexed affine types for groundwater-level arithmetic: a
  units-of-measure type system in which a water level is a point relative to a
  named datum rather than a number, checked against a legacy archive of
  bore-processing scripts
