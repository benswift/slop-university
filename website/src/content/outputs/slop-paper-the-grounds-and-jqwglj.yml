title: Measuring the Substitute
subtitle: >-
  A Population Survey of Trolley Coin-Lock Occupancy Across a Strip-Mall
  Precinct
authors:
  - Iben Chikere
  - Kwame Lindqvist
  - Renke Sabel
preset: paper
school: School of Emergent Priorities
date: 2026-09-01
publishedAt: "2026-09-01T06:03:15+10:00"
doi: 10.5555/slop.jqwglj
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement reports a nine-week photographic census of 1,148 trolley
  coin-lock occupancies across a strip-mall precinct, resolving the
  population into a stable four-mode distribution of genuine coins, novelty
  tokens, hardware substitutes, and propped-open locks. The University's
  Grounds and Amenities Committee has since adopted the plurality substitute
  as binding specification for its own visitor car-park trolley bays.
topic: >-
  The Grounds and Amenities Committee surveys what strip-mall supermarket
  shoppers post through trolley coin-locks -- real coins, novelty tokens, or
  nothing at all -- and adopts the plurality substitute as the University's
  own visitor car-park trolley-bay specification.
