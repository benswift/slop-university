title: Copies of Copies
subtitle: >-
  an impact report on the descent of forms, from the first issue nobody can
  find to the last one somebody agreed to retire
authors:
  - Bram Ntuli
  - Renke Sabel
  - Joost Nwosu
  - Solveig Adeyemi
