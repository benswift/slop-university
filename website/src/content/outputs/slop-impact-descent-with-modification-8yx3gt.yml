doi: 10.5555/slop.8yx3gt
summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 follows 117
  lineages of forms, templates and registers back through their revisions at
  collaborating organisations. Four strands cover where a form is copied
  from, the fields it goes on carrying after their purpose has lapsed, which
  variants spread between sites, and a retirement protocol under which a
  withdrawn form is lodged with its parentage and a statement of what it was
  for.
topic: >-
  descent with modification: five years tracing how forms, templates and
  indicators begin, get copied, vary and survive across the organisations that
  inherit them
