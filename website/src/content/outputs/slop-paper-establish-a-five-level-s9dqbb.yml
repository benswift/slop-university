title: Measuring Queue-Ticket Integrity
subtitle: >-
  A Five-Level Maturity Model for the Deli Counter, the Butcher's Number
  Board, and the Food-Truck Call
authors:
  - Ingrid Vasseur
  - Renke Sabel
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-09-16
publishedAt: "2026-09-16T09:15:56+10:00"
doi: 10.5555/slop.s9dqbb
summary: >-
  A paper from the School of Emergent Priorities and the School of
  Continuous Improvement builds a five-level Queue-Ticket Integrity
  Maturity Model scoring supermarket deli counters, strip-mall butchers,
  and food-truck order boards on duplicate and expired ticket handling
  cross-checked against EFTPOS transaction timestamps, and reports a
  loyalty scheme's decision to keep restricting its featured-store locator
  to traders holding Level Three regardless of what a covert re-audit
  later finds.
topic: >-
  Establish a five-level Queue-Ticket Integrity Maturity Model — Unlogged,
  Reactive, Logged, Reconciled, Predictive — against which supermarket
  deli counters, strip-mall butchers, and food-truck order boards are
  scored on how they handle duplicate and expired numbered queue tickets,
  cross-checked against EFTPOS transaction timestamps, and list on a
  loyalty scheme's featured-store locator only the traders who reach
  Level 3.
