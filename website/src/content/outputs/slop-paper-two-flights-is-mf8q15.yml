title: Measuring the Second Flight
subtitle: A Teaching Case on Meeting Attendance in a Four-Storey Building
authors:
  - Hedvig Anyanwu
  - Ronja Oyelaran
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
date: 2026-09-20
publishedAt: "2026-09-20T23:01:12+10:00"
doi: 10.5555/slop.mf8q15
summary: >-
  A paper from the School of Emergent Priorities presents a single building's
  fourteen-week door-clipboard record of 486 booked meetings as a teaching case,
  finding that invitees to meetings on the third level, two flights above the
  entrance, attended at about seven-tenths the ground-floor rate, and that a
  take-the-stairs sign changed the figure by 0.4 percentage points (n.s.). The
  University has since reduced the quorum of any meeting held above the second
  flight to seven-tenths of its nominal figure, in every building and with no
  ordinary override.
topic: >-
  Two flights is the climb beyond which invitees to a meeting in one
  four-storey building attend at about seven-tenths the ground-floor rate; a
  single-site teaching-note case of one third-level seminar room, where a
  take-the-stairs sign changed nothing and the University now discounts the
  quorum of any meeting held above the second flight by the observed shortfall
