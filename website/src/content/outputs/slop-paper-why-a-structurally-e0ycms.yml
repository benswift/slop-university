title: What the Lattice Keeps
subtitle: Solid-Solution Incorporation of a Methyl Analogue Through Five Recrystallisations of an Aryl Amide, and the Polymorph That Excludes It
authors:
  - Clemency Tredinnick
  - Gunnhild Ekwueme
  - Eivind Onwuka
preset: paper
school: School of Settled Matters
date: 2026-11-21
