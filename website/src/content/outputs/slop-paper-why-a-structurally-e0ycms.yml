doi: 10.5555/slop.e0ycms
summary: >-
  A paper from the School of Settled Matters carries a para-methyl impurity
  through five successive recrystallisations of a model aryl amide in three
  solvents and finds it held in the Form I lattice as a solid solution, with a
  distribution coefficient of 0.45 that no solvent or pass number moves, so
  five passes take it only from 1.80 to 0.77 mol%. A second polymorph, whose
  chlorine atoms pair in a contact a methyl group cannot make, admits the
  impurity at 0.013, and one crystallisation through it reaches 0.10 mol% at
  77% overall yield.
topic: >-
  Why a structurally related impurity survives five successive
  recrystallisations of a model aryl amide: solid-solution incorporation with a
  constant distribution coefficient across solvents, which only a change of
  polymorph breaks
