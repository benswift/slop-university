title: Towards the Nearest Bay
subtitle: >-
  A featured-researcher campaign for the School of Emergent Priorities,
  built around Hedvig Anyanwu's second look at a permit-waitlist finding
  at a supermarket's click-and-collect bay and the tier-order rule now set
  on top of it.
