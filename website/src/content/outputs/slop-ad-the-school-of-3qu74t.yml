summary: >-
  A marketing poster for the School of Emergent Priorities stages Hedvig
  Anyanwu at the kerb of a supermarket click-and-collect zone, where the
  University's earlier finding that a priority-tier score barely reorders a
  waitlist did not reproduce, and where the School now requires the bays to
  fill in loyalty-tier order.
topic: >-
