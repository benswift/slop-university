title: Down the Mowing Lanes
subtitle: Persistence and Spread of a Released Metarhizium Genotype in Amenity Lawn Soil Three Years after a Single Application
authors:
  - Tove Ilesanmi
  - Brynjar Obiora
preset: paper
school: School of Emergent Priorities
