doi: 10.5555/slop.fu4ux4
summary: >-
  A paper from the School of Emergent Priorities follows a single October 2022
  application of an entomopathogenic fungus isolate to one block of a campus
  lawn through three annual surveys of 792 soil cores, recovering fungi by
  insect baiting and telling the released genotype from 31 resident ones at
  eight microsatellite loci. The released genotype persisted in 31 per cent of
  block cores in the third year; outside the block it rose to 24 per cent of
  cores along the ride-on mower's lanes against 3 per cent across them, reached
  the headland where the mower turns, and was recovered from debris scraped
  from the mower's deck and wheels.
topic: >-
  Three-year persistence of a single Metarhizium application in campus lawn
  soil, with Galleria baiting and microsatellite genotyping showing the
  released strain spread along the mower's turning lanes
