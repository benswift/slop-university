summary: >-
  The School of Continuous Improvement's 2021-2026 impact report looks back on
  five years of work with operators, regulators and research collaborators on
  installed odour and emission control equipment in its second decade of
  service, across 214 installations. It follows three strands: a shared
  improvement-cycle archive for biofilter and carbon-vessel maintenance, a
  calibration log for the instruments that age alongside the plant, and a pooled
  set of leading indicators intended to register a decline before the first
  complaint does.
topic: >-
  the second decade of a biofilter: keeping installed odour and emission control
  equipment performing long after commissioning, from media beds and carbon
  vessels to scrubber towers and sewer dosing
