summary: >-
  A prospectus brochure from the School of Emergent Priorities names four
  kinds of fruit-bowl occupancy --- decorative, the day's, softening, and the
  one at the bottom --- and writes that taxonomy into every kitchen the
  University certifies as the standing surplus protocol. Softening has no path
  back to the day's. The bottom fruit is logged on the Horizon Register until
  the entry is retired. Every Master of Priority Studies candidate classifies a
  live household bowl as a hurdle of the degree.
topic: >-
