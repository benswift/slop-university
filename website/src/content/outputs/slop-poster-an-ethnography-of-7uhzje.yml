summary: >-
  A research poster from the School of Underlying Conditions reports eleven
  months of participant observation in the photography bay of an unnamed state
  core library, where each tray of drill core is swept, squared, turned, wetted
  and chalked before its picture is taken. Timing 187 sittings act by act, it
  finds that experienced technicians spend four times as long as first-years
  turning each piece to its good side and no longer at the shutter, and reads
  the bay's shared sense of when a tray looks like itself as a portrait
  tradition.
topic: >-
  An ethnography of a state core library's photography bay, where technicians
  sweep, wet, turn and chalk each tray of drill core before its picture is
  taken, read as a portrait tradition with its own sitters, poses and
  conventions of likeness
