title: Towards a Declination Slot
subtitle: >-
  Conversation analysis of 1,180 excess-reduction offers at the vehicle-hire
  counter, and the audited pause adopted from it
authors:
  - Bram Ntuli
  - Thandiwe Solberg
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-18
publishedAt: 2026-08-18T07:03:11+10:00
doi: 10.5555/slop.ffsmxf
summary: >-
  A research poster from the School of Continuous Improvement treats the
  excess-reduction offer made at a vehicle-hire counter as a sequence,
  transcribing 41,208 conversational turns from 1,180 recorded pick-up
  encounters at 24 depots across four operators. Acceptance is accomplished
  without speech in 62 per cent of offers and launches a median 0.20 s after
  the offer's completion; a plain refusal launches a median 0.94 s later,
  carries an account in almost every case, and draws at least one further offer
  in 84 per cent of sequences, with no depot in the sample producing an
  unmarked refusal turn. The poster attributes the asymmetry to the script
  rather than to counter staff, and recommends a two-second declination pause
  held before any pursuit turn and audited from the counter's own audio.
topic: >-
  Declining the excess-reduction offer at the hire-car counter is
  systematically harder work than accepting it: a conversation analysis of
  1,180 recorded pick-up encounters shows acceptance can be done with a nod
  while every decline is produced as a dispreferred turn --- delayed, hedged,
  accounted for, and often repeated --- and the University's response is a
  mandated two-second declination pause, written into the counter script and
  audited by counting silences
