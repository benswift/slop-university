doi: 10.5555/slop.dsfahi
summary: >-
  Slop University's Strategic Plan 2026-2031 establishes the Retired
  Constructs Collection, a single catalogue of the mind sciences' abandoned
  theories, scales, protocols and apparatus in which every missing element of
  a construct's record is marked by a stand-in card, and commits the
  University to a Retired Practical for every undergraduate cohort, a
  re-reading cycle that lodges each reading beside the original deposit
  without overwriting it, and a public gallery, reading room and regional
  loan program.
topic: >-
  custodianship of discarded theories of mind: a plan that keeps the mind
  sciences' retired constructs and apparatus as one catalogued collection,
  logged like a core store with its gaps marked, so that what psychology
  stopped believing stays available to be read
