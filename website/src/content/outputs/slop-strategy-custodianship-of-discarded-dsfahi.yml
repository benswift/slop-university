title: Kept With Its Gaps
subtitle: >-
  A Strategic Plan to Hold the Mind Sciences' Retired Constructs and Apparatus
  as One Collection, Logged Like a Core Store
authors:
  - Ragnhild Uzoma
  - Marek Solheim
  - Sunniva Balogun
preset: strategy
school: School of Underlying Conditions
date: 2026-11-22
