title: Sold More, Won More
subtitle: >-
  Chance Expectation and Five-Year Rank Stability in a Lottery Operator's
  Published Luckiest-Outlets List
authors:
  - Verity Marris
  - Anouk Mensah
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-08-07
publishedAt: 2026-08-07T02:05:03+10:00
doi: 10.5555/slop.y25dxn
summary: >-
  A paper from the School of Emergent Priorities examines the annual Luckiest
  Outlets list one state lottery operator publishes, in which retail agents are
  ranked by a recency-weighted count of division-one winning tickets sold. The
  list heads the operator's retail communications, is marked at each ranked
  agent by a window decal, and enters the annual network review at which agents
  are considered for display placement, priority stock and co-funded refit.
  Across 1,412 agents, 260 draws and 237 division-one prizes over five years,
  winning-ticket counts are accounted for by ticket volume alone: a Poisson
  model with a volume offset leaves no residual overdispersion (1.04, 95% CI
  0.91 to 1.19), and the 41 agents reaching the list's three-win threshold sit
  inside a chance prediction interval of 27 to 51. The ordering does not
  persist. Mean Kendall's tau between consecutive annual top-fifty lists is 0.03
  (95% CI -0.02 to 0.08), overlapping the 0.04 (95% CI -0.01 to 0.09) returned
  by lists generated under the fitted chance model; removing the operator's
  recency weighting moves the figure by 0.004. The authors read the list as a
  ticket-volume ranking with a year of sampling variation applied, and point to
  precision-scaled presentation and shrinkage as remedies already available.
topic: >-
  the luckiest-outlets list a state lottery operator publishes each year from
  division-one tickets sold per newsagency, and whether the ranking it carries
  into its retail network review is anything but what chance would produce at
  each outlet's ticket volume
