title: '"I Got as Far as the Dinner"'
subtitle: Declared Gaps and Collective Reading in a Suburban Reading Group
authors:
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
publishedAt: "2026-10-12T22:51:05+11:00"
doi: 10.5555/slop.hu0g5p
summary: >-
  A paper from the School of Underlying Conditions reports thirty-three months
  of participant observation with a suburban reading group that read one long
  French novel in translation, fortnightly, to the end, without any member
  reading all of it. It finds members declaring at each meeting the place they
  had stopped, the room settling each declared gap by reading aloud, and paper
  slips in a shared copy marking the passages nobody reached, and argues that
  the declaration is a contribution to the meeting and not an excuse, so that
  the group could say "we have read it" where no member would say "I have".
topic: >-
  An ethnography of a suburban reading group that spent three years on one long
  French novel, and of how its members account for the pages they did not read
