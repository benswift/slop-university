title: Asleep Between Samples
subtitle: A Depth-Gated Near-Threshold Acquisition Processor for Battery-Run Borehole Logging
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
