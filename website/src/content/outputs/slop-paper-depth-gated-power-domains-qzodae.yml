doi: 10.5555/slop.qzodae
summary: >-
  A paper from the School of Underlying Conditions designs a three-domain,
  0.5 V acquisition processor for a memory logging sonde that samples once per
  10 mm of travel, and power-gates its sampling logic between depth pulses only
  where the hole is warm enough for the leakage saved to repay the transition.
  In post-layout simulation of one replayed 1,240 m descent the scheduled
  policy spends 23.8 mJ in the sampling domain against 34.8 mJ with clock
  gating alone and 28.4 mJ with unconditional gating, and the processor writes
  an explicit gap record wherever its odometer arm loses the borehole wall.
topic: >-
  depth-gated power domains: a near-threshold acquisition chip for a
  battery-run borehole logging tool that sleeps between depth samples and
  budgets its leakage against the temperature of the hole
