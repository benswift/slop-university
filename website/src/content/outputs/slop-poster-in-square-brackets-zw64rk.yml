summary: >-
  A research poster from the School of Continuous Improvement gives a close
  reading of a single reaction scheme from a synthesis group's meeting handout,
  transcribed with its structures replaced by their numerals. It finds that the
  bracketed aryne intermediate is the only compound with nothing noted beneath
  it and the only one whose departing arrow carries no reagent, and argues that
  the brackets work as a stage direction rather than a parenthesis.
topic: >-
  In square brackets: a close reading of one reaction scheme from a synthesis
  group's meeting handout, and of how its arrows, captions and brackets handle
  an aryne intermediate nobody isolates
