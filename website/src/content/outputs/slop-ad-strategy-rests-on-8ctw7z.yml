summary: >-
  A marketing poster for Slop University sets Associate Professor Ragnhild
  Uzoma beside a core tray at a drill site and positions the School of
  Underlying Conditions as the University's check on the ground every
  long-range plan assumes. Composed for the portrait signage rotation, it
  carries her account of the five-year plan as a thin cover laid over far
  older material, and points to two of her papers and to the University's strategic plan.
