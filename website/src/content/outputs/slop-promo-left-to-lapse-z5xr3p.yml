summary: Dr Marek Solheim, Lecturer and Deputy Convenor of the Horizon Register, explains
  in his own words why a historian of policy studies the plans an institution stops
  pursuing without ever formally retiring them. The video moves through three of his
  lead-authored outputs, a café chain's dormant loyalty accounts, an exam hall's sign-out
  flags and a laundromat's out-of-service signs, each a record that kept a commitment
  going after it had quietly ended. It also marks his standing in the School of Emergent
  Priorities, where his h-index is the second-highest.
topic: "a promo profile of Dr Marek Solheim, Deputy Convenor of the Horizon Register
  and holder of the second-highest h-index in the School of Emergent Priorities, in
  his own voice: a historian of policy who studies the plans an institution never
  formally ends, only leaves to lapse"
