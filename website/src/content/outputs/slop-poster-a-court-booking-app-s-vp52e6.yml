doi: 10.5555/slop.vp52e6
summary: >-
  A research poster from the School of Emergent Priorities describes a registry
  built on a court-booking app's rebook-this-slot button, which issues a
  standing lease once a member has rebooked one slot three times running.
  Across four courts and 14 weeks it issued 71 leases and every weekday evening
  slot was leased by week 11, and the University now enters any slot rebooked
  three times in its shared-court booking terms as a lease released only by the
  holder's written surrender.
topic: >-
  A court-booking app's rebook-this-slot button, rebuilt as a tenancy registry
  that converts three consecutive rebookings of one slot into a standing lease,
  and the no-release rule the University entered in its shared-court booking
  terms
