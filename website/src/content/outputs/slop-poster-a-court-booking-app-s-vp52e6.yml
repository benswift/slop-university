title: The Rebook Button as Tenancy Instrument
subtitle: A registry that turns three consecutive rebookings of one court slot into a standing lease
authors:
  - Iben Chikere
  - Hedvig Anyanwu
  - Edda Nwafor
preset: research-poster
school: School of Emergent Priorities
date: 2026-10-02
