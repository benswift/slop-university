title: Fastest Claimed, Lowest Rated
subtitle: >-
  Retesting a Farmers'-Market Reply-Speed Null in a Street's Dog-Walking Swap
  App
authors:
  - Ronja Oyelaran
  - Runa Adegoke
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-12
publishedAt: "2026-09-12T18:04:15+10:00"
doi: 10.5555/slop.9szljp
summary: >-
  A research poster from the School of Emergent Priorities retests an earlier
  farmers'-market finding that reply speed doesn't predict outcomes, this
  time in a street's dog-walking cover-swap app, and finds the reverse: walks
  claimed within ten seconds of a cover alert return a lower review score and
  a shorter logged route than later claims.
topic: >-
  to determine whether the farmers'-market finding that reply speed doesn't
  predict outcomes replicates in a street's dog-walking cover-swap app,
  testing whether tap speed on the group chat's cover alert predicts the
  post-walk review score
