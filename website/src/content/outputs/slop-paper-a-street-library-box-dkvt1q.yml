title: Shelved Without a Look
subtitle: >-
  Curatorial Drift Across a Metro Street-Library Network's Volunteer
  Handoffs
authors:
  - Iben Chikere
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-08-11
publishedAt: "2026-08-11T20:01:03+10:00"
doi: 10.5555/slop.dkvt1q
summary: >-
  A paper from the School of Emergent Priorities interviews 26 volunteer
  curators across a metro street-library network and logs 1,204 donations
  across eight of its 19 boxes, finding self-reported checklist adherence
  diverges from observed adherence at every criterion --- most sharply for
  the duplicate check, self-reported at 74% against 19% observed --- and
  that the resulting shortcut, not the written policy, is what gets passed
  to each new curator at handover.
topic: >-
  A street-library box network's volunteer curators are supposed to review
  each donated book against a written curation policy before shelving, but
  donation volume has outpaced curator availability, so a growing share of
  books skip review and go straight onto the shelf; a qualitative interview
  study with volunteer curators across a metro network of street libraries
  examines what curators actually let through once the backlog builds, how
  the criteria they apply drift from the written policy as one curator
  hands the box to the next, and what "reviewed" comes to mean once
  official curation can't keep pace with donation volume.
