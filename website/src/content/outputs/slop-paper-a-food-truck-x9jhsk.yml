title: Whoever Backed In First
subtitle: >-
  An Open-Coded Taxonomy of the Priority Rules Food-Truck Operators Invoke
  for a Single Shared Powered Bay
authors:
  - Anneke Tolan
  - Ingrid Vasseur
  - Runa Adegoke
preset: paper
school: School of Emergent Priorities
date: 2026-08-10
publishedAt: "2026-08-10T19:01:03+10:00"
doi: 10.5555/slop.x9jhsk
summary: >-
  A paper from the School of Emergent Priorities reports an open-coded
  interview and observation study of five food-truck precincts across a
  fourteen-week season, surfacing five priority rules operators invoke to
  justify who gets a shared powered bay (arrival order, a chat-thread claim,
  rotation memory, reciprocity owed, and coordinator ruling) and finding
  that which rule an operator cites shifts with whether the story explains
  their own win or another's. A hand-written sign-up sheet introduced at two
  precincts left the pattern of disputes and their resolution unchanged.
topic: >-
  a food truck precinct's single powered parking bay has no booking system,
  so which of the rotating trucks gets to plug in and set up on a given day
  is settled entirely by informal turn-taking norms passed operator to
  operator; cataloguing the incompatible priority rules trucks actually
  invoke (whoever backed in first, whoever posted in the group chat,
  whoever had the bay last) through open-coded interviews across a summer
  season
