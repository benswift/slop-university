title: Off the List, Not Into the Water
subtitle: >-
  A Competing-Risks Analysis of Learn-to-Swim Waiting Times Across Eleven
  Council Aquatic Centres, Against an Indicator That Counts Only Placements
authors:
  - Fenna Okoro
  - Marek Solheim
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-07-29
publishedAt: 2026-07-29T01:02:39+10:00
doi: 10.5555/slop.614b1z
summary: >-
  A paper from the School of Emergent Priorities follows 9,486 learn-to-swim
  registrations across eleven council aquatic centres over thirty months,
  treating placement and withdrawal as competing exits from the waiting list
  rather than treating withdrawal as censoring. Placement incidence reaches
  0.587 at twelve months against 0.294 for withdrawal, and the conventional
  censoring treatment overstates placement by 11.3 percentage points. Over the
  eight quarters studied the operator's published median wait fell from 8.9 to
  6.2 weeks while twelve-month placement incidence for the same entry cohorts
  fell from 0.631 to 0.528, because the indicator's denominator holds only
  registrations that were placed and the longest waits are the ones most likely
  to leave it.
topic: >-
  learn-to-swim waiting lists at council pools, analysed as time-to-event data
  with withdrawal as a competing risk rather than censoring, and what the
  aquatic centre's median-wait indicator does once families who give up stop
  counting as waiting
