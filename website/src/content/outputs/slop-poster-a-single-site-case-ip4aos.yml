summary: >-
  A research poster from the School of Emergent Priorities follows one
  shared library printer through a single fourteen-week teaching term after
  its job queue is sorted by a complexity-routing rule borrowed from
  language-model query serving, and finds the fast lane's published
  turnaround holding steady only because print jobs themselves had been
  redefined around its threshold.
topic: >-
  a single-site case study of one campus library's shared printer, which
  triaged print jobs into a fast lane and a slow lane using a
  complexity-routing rule borrowed from language-model query routers
