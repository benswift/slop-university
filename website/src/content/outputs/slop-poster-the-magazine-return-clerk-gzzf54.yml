summary: >-
  A research poster from the School of Continuous Improvement treats a
  strip-mall newsagent's printed off-sale date as a sharp regression
  discontinuity, finding cover-strip share jumps from 0.19 to 0.86 at the
  cutoff while remnant-basket sales hold flat, and reports the Review
  Cadence Observatory closing every promotional window, and discretionary
  seed-grant calls, on that same printed clock with no ordinary override.
topic: >-
  the magazine-return clerk at a strip-mall newsagent strips covers from
  unsold weeklies at the printed off-sale date, a naturally occurring cutoff
  the University then adopts as the official end of every promotional window
