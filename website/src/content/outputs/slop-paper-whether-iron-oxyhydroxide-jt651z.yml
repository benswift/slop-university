title: The Same Pits Twice
subtitle: Recurrence of Iron Oxyhydroxide Nucleation Sites on Stripped Quartz Grains from a Single Soil Profile
authors:
  - Brynjar Obiora
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
publishedAt: "2026-10-12T21:04:07+11:00"
doi: 10.5555/slop.jt651z
summary: >-
  A paper from the School of Underlying Conditions strips the iron coatings
  from 56 quartz sand grains taken from one subsoil, maps 1,742 etch pits on
  them, and wets each grain five times to see where the first particles of a
  new coating form. About two thirds of the pits occupied at one wetting were
  occupied again at the next, 148 were occupied every time and more than half
  never were; pit depth and width explain part of the recurrence, and a
  doubled stripping treatment does not reduce it.
topic: >-
  Whether iron oxyhydroxide nanoparticles nucleate at the same etch pits twice
  on quartz sand grains from one described soil profile, once the grains are
  stripped of their coatings and wetted again
