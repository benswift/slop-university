title: Under the Car-Park Portal
subtitle: >-
  A Pre-Registered Equivalence Trial of Hanging Height Bars at Thirty-Eight
  Shopping-Centre Entrances
authors:
  - Torun Ezeigwe
  - Thandiwe Solberg
  - Marit Osayande
preset: paper
school: School of Continuous Improvement
date: 2026-09-02
publishedAt: "2026-09-02T09:04:16+10:00"
doi: 10.5555/slop.isgntw
summary: >-
  A paper from the School of Continuous Improvement reports a staggered-adoption
  equivalence trial of hanging height bars at 38 shopping-centre car-park
  portals. Soffit contacts differ by +0.04 per 1,000 entries (95% CI -0.31 to
  +0.39) against a pre-registered margin of 0.5, reverse-outs do not rise, and
  three bar types do not separate. The School writes a Height-Bar Freeze into
  the Master of Applied Measurement's placement rules: bars already in place
  may neither be added to nor taken down, and a host that still reports the bar
  as a roof-damage control is ineligible for the following intake.
