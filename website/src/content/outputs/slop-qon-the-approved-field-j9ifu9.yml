title: As a Closed Polygon
subtitle: >-
  The Department of Policy Settings answers questions taken on notice by the
  Committee on Settings Oversight on how the Fieldwork Approval Determination
  treats mapping that carries on past the boundary of an approved field area
authors:
  - Petra Umbile
  - Ragnhild Uzoma
  - Brynjar Obiora
  - Vigdis Emenike
preset: questions-on-notice
date: 2026-11-23
publishedAt: "2026-11-23T03:01:47+11:00"
doi: 10.5555/slop.j9ifu9
summary: >-
  The Department of Policy Settings answers five questions on the Slop
  University (Fieldwork Approval) Determination 2025, taken on notice at the
  Committee on Settings Oversight's Supplementary hearings of 19 November 2026
  or lodged in writing after them. Its answers find that observations made
  outside an approved field area may be recorded and reported, while samples
  collected there enter the geological collection's unattributed series and
  cannot be loaned or cut; tabulate 45 applications to vary an approved area,
  34 granted, with a median of 41 days to decide those made because a feature
  continues beyond the boundary, and confirm that a variation does not reach
  back to earlier fieldwork; hold that an area must be described as a closed
  polygon; state that the register does not record days worked; and decline on
  resourcing to say how many of the 1,207 unattributed samples have been
  reported in an output.
topic: >-
  the approved field area setting: the Committee presses the Department on
  whether a mapping party may follow a thrust fault along strike past the
  boundary of its approved field area, and on how boundary variations are
  decided
