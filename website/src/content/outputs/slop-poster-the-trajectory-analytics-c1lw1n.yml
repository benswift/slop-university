doi: 10.5555/slop.c1lw1n
summary: >-
  A research poster from the School of Emergent Priorities exploits the 2.5 kg
  small-load line at which a household front-loader switches to its shorter,
  low-water programme, finding that loads weighed just under the line are put
  through a second cycle 18.4 percentage points more often than loads just over
  it, and that the extra cycles return the water the programme saves. The
  Trajectory Analytics Group has since ballasted its own reference washing to
  the line and holds any load it cannot ballast over to its next sitting.
topic: >-
  The Trajectory Analytics Group ballasts its own reference washing to the
  household front-loader's small-load cutoff, after a regression-discontinuity
  study found loads weighed just under the cutoff were sent through a second
  cycle far more often than loads just over it
