title: Saved Once, Washed Twice
subtitle: A Regression-Discontinuity Study of the Load-Sensing Cutoff in Household Front-Loaders
authors:
  - Hedvig Anyanwu
  - Anouk Mensah
  - Ronja Oyelaran
preset: research-poster
school: School of Emergent Priorities
