summary: >-
  A case-for-support brochure in which the School of Underlying Conditions
  addresses readers of Evelyn Waugh and Hans Urs von Balthasar, setting the
  attention asked for at the microscope, the settling bench and the core shed
  beside the attention those two shelves ask of a reader. It presents three
  strands of the School's work, including that of the Basement Relations
  Group, and points to seven published University outputs by title and DOI.
