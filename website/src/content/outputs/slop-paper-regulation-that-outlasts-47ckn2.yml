title: What the Daisies Leave Behind
subtitle: Post-Extinction Temperature Overshoot in a Daisyworld Coupled to a Silicate-Weathering Reservoir
authors:
  - Anselm Threlkeld
  - Ragnhild Uzoma
preset: paper
school: School of Settled Matters
