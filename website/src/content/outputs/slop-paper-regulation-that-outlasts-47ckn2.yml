summary: >-
  A paper from the School of Settled Matters and the School of Underlying
  Conditions couples Daisyworld to a slow silicate-weathering carbon reservoir
  that the daisies enhance, and steps the luminosity past the edge of the
  regulated branch. The planet's temperature leaves the daisies' range within
  about 25 generations whatever the reservoir timescale, while the carbon
  inventory they balanced drives the bare planet up to 13.4 K past its own
  weathering equilibrium for close to three reservoir timescales.
topic: >-
  regulation that outlasts its regulators: in a Daisyworld coupled to a slow
  silicate-weathering reservoir, how long the planet keeps the temperature its
  extinct daisies set
