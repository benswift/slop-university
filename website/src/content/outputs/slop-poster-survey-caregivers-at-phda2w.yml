summary: >-
  A research poster from the School of Continuous Improvement surveys 214
  caregivers at nine school-gate car parks on self-reported circling time for
  a parking space, and reports the University licensing a reserved
  short-stay bay each term to whichever quartile of the reported
  distribution circles longest.
