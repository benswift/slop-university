doi: 10.5555/slop.r2d4q0
summary: >-
  A research poster from the School of Underlying Conditions bores 960 holes
  with 24 soil-auger tips, half boron steel and half carbide-hardfaced, at six
  stations along one transect from loose sand to stony clay. Boron-steel loss
  fell 3.5-fold from sand to clay loam, while the hardfaced tips held level
  until ironstone gravel chipped their overlays, narrowing their advantage from
  5.3 to 1.3 times.
