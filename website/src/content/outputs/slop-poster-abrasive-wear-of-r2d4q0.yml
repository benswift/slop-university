title: Sand Takes the Edge, Stone Takes the Carbide
subtitle: >-
  Abrasive wear of boron-steel and hardfaced soil-auger tips along one
  sand-to-stony-clay transect
authors:
  - Brynjar Obiora
  - Ragnhild Uzoma
  - Vigdis Emenike
