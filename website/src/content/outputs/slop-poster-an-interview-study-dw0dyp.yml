title: What Does It Mean When the Answer Is Already There?
subtitle: Employee accounts of a pre-set self-rating default in performance-review software
authors:
  - Solveig Adeyemi
  - Dagny Okafor
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-17
publishedAt: "2026-09-17T03:58:30+10:00"
doi: 10.5555/slop.dw0dyp
summary: >-
  A research poster from the School of Continuous Improvement interviews 118
  office employees across nine employers about a performance-review app's
  self-rating slider, which opens every review already set to "meets
  expectations", finding newer staff treat the default as an instruction and
  longer-tenured staff treat it as something to correct.
topic: >-
  an interview study asking office employees what it means that their
  performance-review app's self-rating slider always starts pre-set to
  'meets expectations' before anyone touches it
