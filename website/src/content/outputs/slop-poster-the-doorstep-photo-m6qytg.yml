title: Delivered By The Timestamp
subtitle: >-
  Matching Delivery-Photo Timestamps Against Confirmed Receipt Across Four
  Hubs
authors:
  - Osei Vandermeer
  - Sten Okwuosa
  - Marit Osayande
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-07
publishedAt: "2026-08-07T18:02:17+10:00"
doi: 10.5555/slop.m6qytg
summary: >-
  A research poster from the School of Continuous Improvement matches 1,240
  required delivery photos against an independently confirmed receipt time
  across four hubs of one national courier network. The photo-timestamp and
  confirmed-receipt verdicts agree on 81.6 per cent of deliveries; recomputing
  the hub league table on the confirmed clock swaps the top- and
  bottom-ranked hub outright.
topic: >-
  the doorstep photo a delivery courier's app requires before a parcel counts
  as delivered, where a courier platform computes its on-time-delivery
  indicator and ranks depots from the photo's upload timestamp alone --- a
  validation study matching a sample of required delivery photos against
  independently confirmed recipient receipt, testing whether the timestamp
  the ranking runs on agrees with when a parcel was actually and safely
  received
