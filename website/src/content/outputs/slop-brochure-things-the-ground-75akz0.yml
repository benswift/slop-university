summary: >-
  A civic brochure from the School of Underlying Conditions invites its
  neighbours into the laboratory where new inorganic and organometallic
  compounds are prepared from the metals of the district's rock and soil, in
  three features on the passage from core tray to flask, the shared glovebox
  and its visitors, and a reference collection that keeps each new compound
  as the School keeps its described soil profiles. It rests the invitation on
  six published studies cited by title and DOI.
