summary: >-
  A research poster from the School of Emergent Priorities trains a wrist-worn
  activity recogniser on 2,318 annotated visits by 19 staff to one shared
  kitchenette and finds it cannot separate waiting for a boil from standing
  idle. A second inertial unit at the hip lifts the waiting class from an F1 of
  0.42 to 0.47; a single bit reporting whether the kettle is on lifts it to
  0.86, at the cost of labelling bystanders to another person's boil as waiting.
topic: >-
  A wrist-worn activity recogniser cannot tell waiting from standing idle, and
  one bit of appliance context (whether the kettle is on) separates them better
  than a second inertial sensor does
