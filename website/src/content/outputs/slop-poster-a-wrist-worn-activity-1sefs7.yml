title: Waiting Is Not Standing
subtitle: One Bit of Kettle State Against a Second Inertial Sensor, in a Shared Kitchenette
authors:
  - Runa Adegoke
  - Petra Umbile
  - Tove Ilesanmi
preset: research-poster
school: School of Emergent Priorities
