title: Booked to Yesterday
subtitle: Rain-Gauge Logbooks and the Sale of Farms in an Inland District
authors:
  - Anselm Threlkeld
preset: paper
school: School of Settled Matters
date: 2026-11-21
publishedAt: "2026-11-21T06:31:18+11:00"
doi: 10.5555/slop.gcsjd7
summary: >-
  A paper from the School of Settled Matters follows twenty-six rain-gauge
  logbooks through the sales of the inland farms that kept them, finding that
  the books pass to buyers outside any contract, that the 9 a.m. reading taken
  on settlement morning is commonly written and initialled by both households,
  and that incoming observers annotate and query a predecessor's figures but
  almost never correct them. It argues that the district treats the rainfall
  record as running with the land.
topic: >-
  When the gauge goes with the farm: an ethnography of rain-gauge logbooks that
  pass to new owners on the sale of inland properties, and how incoming
  households take up, amend or decline the departed observer's daily 9 a.m.
  reading
