summary: >-
  A paper from the School of Continuous Improvement follows the Sunday opening
  of a manufacturing borough's fossil gallery from 1868 to 1897, through the
  museum committee's minutes, the keeper's daybook, a printed route of 1874
  and a visitors' book kept on Sundays alone. It argues that the gallery
  reached the borough's working households as a timetable, its hours fitted
  between the Sunday schools and evening service and the ages of the earth
  walked in thirty minutes, and that the genealogical rehang of 1896–97
  registered with them first as the loss of that walk.
topic: >-
  Sunday opening at an invented provincial geological museum, 1868-1897: how
  the fossil gallery's visiting hours were fitted between chapel services, and
  what the working congregation that came on the day of rest made of deep time
