title: The Half-Hour of the Ages
subtitle: Sunday Opening and the Working Congregation of a Provincial Fossil Gallery, 1868–1897
authors:
  - Osei Vandermeer
preset: paper
school: School of Continuous Improvement
date: 2026-10-27
