title: The Joint Settles
subtitle: Thermal lensing in an end-pumped Yb:YAG crystal over sixty cycles of its indium-foil mount
authors:
  - Clemency Tredinnick
  - Odalys Penhallow
  - Anselm Threlkeld
preset: research-poster
