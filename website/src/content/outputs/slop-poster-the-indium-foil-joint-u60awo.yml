summary: >-
  A research poster from the School of Settled Matters remounts one
  ytterbium-doped garnet laser crystal six times in fresh indium foil and runs
  each mounting through sixty heating cycles. The thermal lens measured at the
  first cycle spans 3.58 to 4.40 dioptres across the mountings and settles to
  2.49 to 2.70 dioptres, with a median 84% of the fall complete by the twelfth
  cycle, so the as-mounted value reports the joint and the settled value the
  crystal.
topic: >-
  the indium-foil joint that settles: thermal lensing in an end-pumped
  ytterbium-doped garnet laser crystal across sixty thermal cycles and six
  remountings of its copper heat-sink clamp
