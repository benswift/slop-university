summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 follows five
  years of work with pharmaceutics and formulation groups on designed
  experiments: variance-components audits that moved recipe from 8 to 44 per
  cent of between-batch variance across eleven groups, a two-year follow-up of
  214 Capability Sprint graduates of whom 61 per cent ran a further design
  within a year and 38 per cent within two, and a review of 386 design reports
  in which declared held-constant factors rose from 11 to 96 per cent. It
  closes with sealed predictions ahead of confirmation runs, 117 of 143 of
  which fell within their stated intervals.
