summary: >-
  A research showcase from the School of Emergent Priorities presents its work
  on β-lactam synthesis through three moments in the life of the four-membered
  ring --- its closure at the bench, the choice between its two faces, and its
  opening into longer routes --- and positions the ring as an intermediate
  rather than a destination, alongside seven published University studies cited
  by title and DOI.
topic: >-
  made to be opened: a research showcase of the School of Emergent Priorities'
  β-lactam synthesis, where the four-membered ring is closed not as the end
  product but as an intermediate, built carefully so that it can be opened into
  something else
