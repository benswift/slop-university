title: The Radius Before the Edge
subtitle: A Fractographic Survey of 428 Self-Machined Tensile Bars across Six Intakes of a Professional Master's Program
authors:
  - Ylva Onyekwere
  - Brynjar Obiora
  - Iben Chikere
