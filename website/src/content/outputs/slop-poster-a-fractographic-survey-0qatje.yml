summary: >-
  A research poster from the School of Emergent Priorities locates the fracture
  origin on 428 tensile bars machined by the students of six intakes of a
  coursework master's program in materials engineering, once in the third
  teaching week and once in the eleventh. Machining-mark origins fall from 59%
  to 36% of bars and the Weibull modulus of strength rises from 6.1 to 10.4,
  but the origins that remain have moved from the hand-blended fillet to the
  gauge edge, and students' own failure notes come to name the fillet about
  twice as often as their bars break there.
topic: >-
  A fractographic survey of the tensile bars that six intakes of a professional
  master's program in materials engineering machined for themselves: where each
  bar broke, what started the crack, and how the share of machining-initiated
  fractures moves between the third and eleventh teaching week
