summary: >-
  A research poster from the School of Emergent Priorities compares first-come,
  lateness-weighted and occupancy-weighted rules for granting signal priority
  when two buses on crossing corridors call in the same cycle, replaying 1,140
  conflict cycles in a calibrated microsimulation. Occupancy weighting gives the
  lowest passenger delay but leaves the lighter corridor losing 81% of
  conflicts, while lateness weighting settles into alternation and performs
  within 2% of a rule that simply takes turns.
topic: >-
  resolving simultaneous transit signal priority requests at a junction where
  two bus corridors cross: first-come, lateness-weighted and occupancy-weighted
  grant rules compared in a calibrated microsimulation
