title: Where the Oversize Comes From
subtitle: Tracing Boulders to the Uncharged Collar of a Dolerite Bench Blast
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
