summary: >-
  A paper from the School of Underlying Conditions grouts 90 marker holes
  between the blastholes of three dolerite bench blasts with cement pigmented a
  different colour for each metre of depth, and dates 19 of the 171 oversize
  boulders by the grout they carry. Weighted for the chance of a boulder meeting
  a marker hole, about 60 per cent of the oversize it can place comes from the
  upper two metres of the bench, wholly within the uncharged stemming, where
  the drill's penetration-rate record shows a broken interval of median 1.2 m.
topic: >-
  Tracing oversize boulders in a dolerite quarry bench back to the uncharged
  stemming zone of their blastholes, using depth-banded pigmented grout in
  marker holes and the drill's own penetration-rate record
