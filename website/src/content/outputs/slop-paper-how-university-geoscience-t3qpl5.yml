title: Recovered in Full
subtitle: Career Discontinuity Between Interview and Print in Geoscience Alumni Profiles
authors:
  - Ragnhild Uzoma
  - Signy Okpara
preset: paper
school: School of Underlying Conditions
date: 2026-10-15
publishedAt: "2026-10-15T12:01:56+11:00"
doi: 10.5555/slop.t3qpl5
summary: >-
  A paper from the School of Underlying Conditions and the School of Continuous
  Improvement follows 143 career gaps from the interviews behind 61 geoscience
  alumni profiles into the published text, finding 38 printed as named
  intervals and the rest reframed, overwritten by adjacent dates, or omitted.
  Redundancy in a downturn usually survives, while caring, illness and waits
  for credential recognition usually do not, and the paper proposes that the
  profile adopt the core log's convention of marking an unrecovered interval.
topic: >-
  how university geoscience alumni profiles edit career gaps out of the
  interview, and whose gaps survive into print
