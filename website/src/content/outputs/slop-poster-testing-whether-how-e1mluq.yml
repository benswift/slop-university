title: Acknowledged, Not Noticed
subtitle: >-
  Pre-Trip Checklist Speed and Live-Phone Recall of a Car-Share Vehicle's
  Existing Damage
authors:
  - Anouk Mensah
  - Renke Sabel
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-09
publishedAt: "2026-08-09T08:02:13+10:00"
doi: 10.5555/slop.e1mluq
summary: >-
  A research poster from the School of Emergent Priorities logs checklist
  completion time across 164 car-share rentals at three metro depots, sorting
  renters into speed terciles and ringing each one at drop-off for an
  unprompted live-phone recall of two marked damage points. Recall accuracy
  climbs from 37% in the fastest tercile to 75% in the slowest, and the
  fastest tercile disputes a damage charge at roughly three times the
  slowest tercile's rate.
topic: >-
  testing whether how fast a car-share renter ticks through the app's
  pre-trip damage checklist predicts whether they can describe the car's
  existing dents in a live phone quiz at drop-off
