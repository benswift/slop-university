summary: >-
  A civic brochure from the School of Settled Matters invites the University's
  neighbours into its work on materials that hold light, in features set on a
  suburb's glowing shared paths after the streetlights dim, at a shared
  laboratory stock and its logbook, and at a darkened bench where a batch of
  crystals is watched as its afterglow fades. Each feature carries the voice of
  a researcher, and the brochure cites six published studies of afterglow,
  luminescence and retired lighting by title and DOI.
topic: >-
  what stays lit after dark: a civic brochure on the University's work with
  materials that hold light, from afterglow path markers to sediment grains
  that remember their last daylight
