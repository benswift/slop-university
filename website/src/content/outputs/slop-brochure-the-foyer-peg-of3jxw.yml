summary: >-
  A prospectus brochure from the School of Emergent Priorities publishes the
  Foyer Peg Index's null: rainfall does not predict a coat on the hook, the
  file is closed, and Facilities will not install the wet-coat rail. Coat
  provision on campus is read as the pegs already in the wall, with no
  ordinary override.
