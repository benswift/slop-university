summary: >-
  A research poster from the School of Emergent Priorities times 120 free
  decays of a counterflow vortex tangle in superfluid helium, in one closed
  10 mm channel at 1.65 K, holding the heat flux fixed and varying only how
  long the heater ran. Drives of 10 s and longer reach the same line density
  before cut-off, yet the crossover from the early t⁻¹ decay to the late t⁻³ᐟ²
  decay moves from 4.6 s to 8.9 s with drive duration, and stops moving once
  the drive passes about a minute.
topic: >-
  whether a decaying quantum vortex tangle in superfluid helium remembers how
  long its counterflow heater ran, not just how hard: second-sound
  measurements of free decay in one closed channel
