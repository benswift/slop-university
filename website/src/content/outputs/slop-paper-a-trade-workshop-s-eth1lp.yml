title: On Time to the Rack, Behind on the Bench
subtitle: >-
  A Multi-Cohort Comparison of Tool-Crib Return Timeliness Against Formal
  Competency Assessment in a Trade Workshop
authors:
  - Mirela Hanke
  - Casimir Beng
preset: paper
school: School of Continuous Improvement
date: 2026-08-11
publishedAt: "2026-08-11T21:02:02+10:00"
doi: 10.5555/slop.eth1lp
summary: >-
  A paper from the School of Continuous Improvement compares 63,482
  tool-crib checkout records against blinded formal competency assessment
  scores for 189 apprentices across four workshop sites and three intake
  cohorts, finding a Readiness Proxy Score built from return timeliness
  correlates only weakly with formal outcomes (r = 0.09) and barely shifts
  when an automated return reminder is introduced.
topic: >-
  A vocational trade workshop's tool-crib checkout counter tracks which
  apprentice signed out each shared tool and when it came back; supervisors
  have begun reading a fast, on-time return record as an informal signal of
  an apprentice's readiness to progress, alongside the formal competency
  sign-offs. A study compares the crib's return-timeliness log against
  apprentices' actual formal competency assessment outcomes across several
  workshop cohorts, testing whether the informal readiness signal the crib
  log has come to carry tracks the thing it was never designed to measure.
