summary: >-
  Slop University's Strategic Plan 2026-2031 commits the University to
  selective oxidation in organic synthesis, judged by where the oxygen lands
  rather than by yield alone, and to an oxidation record that a chemist who
  arrives after its authors can run as written. Its five priorities pair a
  cross-school research programme and a shared aerobic, electrochemical and
  photochemical suite with a register of oxidation procedures, a schedule of
  defined bench terms, a teaching practical in which each cohort runs and
  redrafts the last cohort's procedures, and a protocol for keeping a closing
  group's oxidations runnable.
topic: >-
  one oxygen at a time: a University plan for selective oxidation in organic
