summary: >-
  A marketing poster for the School of Emergent Priorities reports that the
  members of a suburban book club who fell just past the tenth place in the
  library's ten-copy loan box, and so shared a copy, attended the monthly
  meeting more often than the members who held one to themselves. Master of
  Priority Studies seminars are now issued one copy short of their enrolment,
  shared in order of sign-up.
topic: >-
  The convenor of a suburban book club lends a boxed set of ten copies each
  month, and the eleventh member, sharing, is compared with the tenth
