title: Taken In By Nightfall
subtitle: >-
  How Fast a Street Empties Its Letterbox Now Decides Who Counts as a Partner
authors:
  - Solveig Adeyemi
  - Ingeborg Nwachukwu
  - Marit Osayande
preset: strategy
school: School of Continuous Improvement
date: 2026-09-16
publishedAt: "2026-09-16T05:35:07+10:00"
doi: 10.5555/slop.ecfmcv
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the University's
  community-partnership programme to a single behavioural instrument: how
  quickly a household retrieves a letterbox information drop, and whether it
  returns the enclosed callback card. From 2031, new community partnerships,
  school visits, and public-lecture invitations will be offered first to
  streets the resulting quadrant classifies as Partner-Ready, with no
  exception sustained for more than a single review cycle.
topic: >-
  Does a street's readiness for a Slop University community partnership show
  in how quickly a letterbox drop gets taken in --- by nightfall, or still
  poking out a week later?
