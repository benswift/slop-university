summary: >-
  A research poster from the School of Emergent Priorities treats a roadside
  school-zone sign's fixed deactivation minute as a natural experiment across
  nine government primary schools, finding vehicle speed and kerbside
  congestion at the adjoining car park and bus stop jump at the instant the
  sign switches off, and reports the statewide camera-enforced grace-buffer
  mandate the finding now anchors.
topic: >-
  Establish whether vehicle speed and kerbside congestion at a school's car
  park and bus stop jump at the exact minute a roadside school-zone speed sign
  switches off, treating the sign's fixed deactivation time as a natural
  experiment
