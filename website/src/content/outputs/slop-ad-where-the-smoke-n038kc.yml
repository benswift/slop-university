summary: >-
  A marketing poster for the School of Underlying Conditions carries one of the
  School's published papers onto the University's signage rotation: a valley
  town on a still winter night, its chimney smoke settling into a level layer
  between the roofs, under six words of display type and the paper's title and
  identifier. Prepared for the portrait panels in matched daylight and
  after-dark renderings.
