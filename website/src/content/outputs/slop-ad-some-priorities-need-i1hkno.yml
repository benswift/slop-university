summary: >-
  A marketing poster for the School of Emergent Priorities invites applicants
  to the Master of Priority Studies from the bund of a roadside demonstration
  plot, where a field day gathers to compare a new sowing with the old one
  across a single season. Composed for the landscape signage rotation, it
  offers the side-by-side trial as a model for learning to read a district's
  priorities as they come up, and points to a glasshouse heat-balance paper,
  an allotment seniority study and a doctoral thesis on carried-forward
  priorities.
