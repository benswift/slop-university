title: A Rangefinder App Shortens Kerb-Ramp Audits and Delists the Stops That Keep Failing Them
authors:
  - Torun Ezeigwe
  - Casimir Beng
  - Osei Vandermeer
preset: paper
school: School of Continuous Improvement
date: 2026-09-15
publishedAt: "2026-09-15T11:28:57+10:00"
doi: 10.5555/slop.6nrhig
summary: >-
  A paper from the School of Continuous Improvement reports a sixteen-week
  pilot of RampCheck, a phone-mounted rangefinder application that lets a
  council footpath accessibility duty officer measure kerb-ramp grade in
  seconds and feeds each reading into an accessible-route trip planner's
  delisting policy. Mean per-stop audit time fell from 17.1 to 2.7 minutes
  across nine pilot routes, and 21 of 187 stops were delisted after three
  consecutive out-of-tolerance quarterly sweeps.
topic: >-
  The council's footpath accessibility duty officer carries a phone-mounted
  rangefinder app that logs kerb-ramp gradient at every bus stop on a route in
  real time, flags out-of-tolerance stops on a public map, and delists any
  stop that fails three consecutive quarterly sweeps from the accessible-route
  trip planner
