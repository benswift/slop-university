title: Towards a Verified Redemption Benchmark
subtitle: A Failed Loyalty-Card Replication of the Step-Challenge Benchmark-Inflation Finding
authors:
  - Bram Ntuli
  - Torun Ezeigwe
  - Petra Umbile
