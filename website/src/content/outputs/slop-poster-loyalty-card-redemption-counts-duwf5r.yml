doi: 10.5555/slop.duwf5r
summary: >-
  A research poster from the School of Continuous Improvement replicates the
  University's step-challenge benchmark-inflation design at a shopping-strip
  loyalty-card accreditation tier, checking self-lodged monthly redemption
  counts against independently audited EFTPOS transaction logs across three
  rounds. The measurement-source effect that drove the original finding does
  not reproduce, and the precinct traders' association adopts a standing
  annual audit regardless.
topic: >-
  Loyalty-card redemption counts submitted by strip-mall traders for a
  shopping-strip association's accreditation tier, checked against
  independently audited EFTPOS logs, testing whether the University's
  workplace step-challenge benchmark-inflation finding reproduces at the
  loyalty-card tier
