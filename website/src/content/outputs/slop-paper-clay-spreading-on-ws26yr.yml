title: Same Sand, Next Fence
subtitle: Neighbour Effects in the Move from Trial Strip to Whole-Paddock Clay Spreading on Water-Repellent Sands
authors:
  - Brynjar Obiora
  - Lindiwe Achterberg
preset: paper
school: School of Underlying Conditions
date: 2026-10-21
publishedAt: "2026-10-21T01:00:56+11:00"
doi: 10.5555/slop.ws26yr
summary: >-
  A paper from the School of Underlying Conditions reconstructs twenty seasons
  of clay spreading on the 91 holdings of one sand-plain district whose ground
  is at least one-fifth water-repellent sand, and places each holding on the
  district soil survey's map units. Any adopting neighbour raises the odds of a
  first trial strip by about half, but only a neighbour on the same mapped sand
  moves a trial to whole-paddock spreading (an odds ratio of 2.31 per such
  neighbour), most strongly where the unit boundary is abrupt; of the 23
  holdings still at the trial stage in 2023, 17 began without one.
topic: >-
  Clay spreading on water-repellent sands across one district: whether a farm
  moves from trial strip to whole paddock after a neighbour on the same mapped
  soil unit has, rather than after its nearest neighbour
