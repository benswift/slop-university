title: Recorded as Personal
subtitle: >-
  Agreement Between Manager-Ticked Exit Codes, the Leaver's Own Free Text, and a
  Six-Month Follow-Up Across 1,214 Departures
authors:
  - Ronja Oyelaran
  - Iben Chikere
  - Kwame Lindqvist
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-05
publishedAt: 2026-08-05T16:02:34+10:00
doi: 10.5555/slop.ih1b2w
summary: >-
  A research poster from the School of Emergent Priorities matches 1,214 exit
  interviews across 38 sites of one multi-site employer, each conducted by the
  departing employee's own site manager, to a six-month postal follow-up in
  which the same leavers select from the same eleven reason codes. On 604
  matched pairs the ticked code and the leaver's later selection agree 46.9 per
  cent of the time (kappa 0.31, 95% CI 0.25 to 0.37), and the disagreement runs
  one way: of 214 pairs whose follow-up names a site-attributable reason, 137
  were ticked personal reasons or other, against 11 of 390 in the reverse
  direction. A blinded reading of the leavers' own free text, present on 74.3
  per cent of forms, sits with the follow-up rather than with the tick, and
  agreement is unrelated to a site's turnover rate.
topic: >-
  the drop-down list of reasons on an exit-interview form, ticked by the person
  conducting the interview in a departing employee's last week --- where an
  employer's regretted-attrition figure and the retention plan drawn from it are
  built entirely from those eleven codes, tested against what the same leavers
  say six months after they have gone
