summary: >-
  A research poster from the School of Continuous Improvement reads the four
  editions of one county women's campaign committee's hostess instruction
  sheet against 318 reply cards from living-room coffee hours across four
  presidential cycles, 1952–1964. Other campaigns' literature is the object
  hostesses most often report putting away, and by the 1960s their remarks
  name the household's own politics (a husband's paper, a son's badge, the
  television) more often than anything the sheet asked them to clear.
topic: >-
  What the hostess put away: instruction sheets and reply cards from a
  mid-century American county campaign's living-room coffee hours, read for
  the room prepared for the neighbours
