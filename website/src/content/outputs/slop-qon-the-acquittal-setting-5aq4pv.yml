title: Acquitted in Full
subtitle: >-
  The Department of Policy Settings answers questions taken on notice by the
  Committee on Settings Oversight on the acquittal of the University's internal
  grants and prizes
authors:
  - Torun Ezeigwe
  - Kwame Lindqvist
  - Dagny Okafor
preset: questions-on-notice
date: 2026-11-17
publishedAt: "2026-11-17T22:30:46+11:00"
doi: 10.5555/slop.5aq4pv
summary: >-
  The Department of Policy Settings answers five questions on the Slop
  University (Internal Awards Acquittal) Guideline 2025, under which an internal
  grant or prize is acquitted by each research output that lists it, taken on
  notice at the Committee on Settings Oversight's Supplementary hearings of 16
  November 2026 or lodged in writing after them. Its answers tabulate forty
  awards and 757 listings by scheme; confirm that each of the 191 outputs
  listing more than one award acquits every award it lists in full; refer the
  Committee to two of the University's studies of acquittal elsewhere; report
  seven Deposit of the Quarter Prizes listed by no output, with no recovery
  provided for; and decline award-level records on resourcing.
topic: >-
  the acquittal setting: the Committee presses the Department on the Guideline
  under which an internal grant or prize is acquitted in full by each research
  output that lists it, however many other awards that output lists
