summary: >-
  A paper from the School of Continuous Improvement and the School of Emergent
  Priorities gives an ethnographic account of the evening phone hour in a
  regional secondary school's residential hostel for 61 students from seven
  remote Indigenous communities, from fourteen months of fieldwork and 1,212
  entries on the sign-up sheet that allots its two shared handsets. Fewer than
  half the slots carry one resident's name, and the paper argues that a roster
  built to ration calls among individual learners is used each night to keep
  obligations between kin.
topic: >-
  the evening phone hour in a regional secondary school's residential hostel,
  where students who moved from remote Indigenous communities keep up kin
  obligations under a call roster
