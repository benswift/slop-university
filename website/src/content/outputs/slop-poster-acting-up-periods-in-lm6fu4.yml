title: Left in the Tray
subtitle: What acting team leaders decide, and what they hold for the leader's return
authors:
  - Eivind Onwuka
  - Solveig Adeyemi
  - Thandiwe Solberg
preset: research-poster
school: School of Continuous Improvement
date: 2026-11-01
