doi: 10.5555/slop.lm6fu4
summary: >-
  A research poster from the School of Continuous Improvement follows 186
  acting-up periods across 27 operations teams of a regional water utility,
  matching each acting team leader's decisions to the substantive leader's own
  rate. Routine delegated authority was used at near-baseline rates, while
  procedure changes, performance conversations and recruitment were held for
  the leader's return, least often by acting leaders applying for the role.
topic: >-
  acting-up periods in a regional utility's operations teams: which decisions an acting team leader makes and which they leave in a tray for the substantive leader's return
