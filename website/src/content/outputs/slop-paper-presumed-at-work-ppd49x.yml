summary: >-
  A case note from the School of Continuous Improvement on a divided Full Bench
  decision allowing a linen-route driver's claim for louse-borne endocarditis
  under a scheduled-disease presumption, after an arbitrator had held the
  presumption rebutted by the driver's Saturday mornings sorting donated
  clothes. The note supports the majority but argues that the decisive point is
  that the Schedule describes the work by the garment, where the louse lives,
  so proof that the description was also met off the clock does not prove the
  contrary of what the statute presumes.
topic: >-
  Presumed at work: a case note on a tribunal applying a scheduled-disease
  presumption to a linen-route driver's trench fever, when the insurer's
  rebuttal rests on the same used-clothing handling done off the clock
