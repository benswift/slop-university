title: The Tidier Optimum
subtitle: >-
  Design Width and Centre-Anchoring in Sequential Response-Surface Optimisation
  of Tannase Production
authors:
  - Vigdis Emenike
  - Bram Ntuli
preset: paper
school: School of Underlying Conditions
date: 2026-10-16
