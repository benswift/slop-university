doi: 10.5555/slop.eiiz8b
summary: >-
  A paper from the School of Underlying Conditions and the School of
  Continuous Improvement simulates 48,000 two-stage optimisations, one factor
  at a time and then a Box–Behnken design, on invented peaked yield surfaces
  standing in for tannase production. The screening stage left the design a
  median 0.6 to 1.3 grid steps from the true peak; a design one step wide
  tracked the peak with slopes of 0.58 to 0.83, while doubling its width cut
  tracking to as little as 0.33 and raised the share of clean-looking interior
  maxima to 91 per cent or more.
topic: >-
  centre-anchoring in sequential response-surface optimisation of microbial
  tannase production: a simulation study of why the reported optimum keeps
  landing at the middle of the design after one-factor-at-a-time screening
