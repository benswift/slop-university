title: Does Reprinting the Boarding Pass Shorten Boarding?
subtitle: >-
  First-Scan Success and a Paper-Weight Attestation at a Regional Carrier
authors:
  - Thandiwe Solberg
  - Runa Adegoke
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-08-25
publishedAt: "2026-08-25T19:01:56+10:00"
doi: 10.5555/slop.oszg9g
summary: >-
  A paper from the School of Continuous Improvement matches 4,812
  home-printed boarding passes to gate-reader logs at six airports of one
  regional carrier over fourteen weeks. Reprinting raises first-scan success
  from 61% on a single 80 gsm copy to 94% on a twice-reprinted photo-paper
  copy, while boarding interval does not separate first-scan, reprinted, and
  second-scan passengers. A Print Legibility Working Group withholds
  lounge-access waivers from a second scan and issued a paper-weight
  attestation whose completion left first-scan success unmoved; an ablation
  of the Group's contrast-enhancement prior changes the rate by at most 0.5
  percentage points.
topic: >-
  a regional carrier indexes gate readiness from first-scan success on
  home-printed boarding passes, so passengers reprint until the barcode
  looks official, and a Print Legibility Working Group withholds
  lounge-access waivers from a second scan
