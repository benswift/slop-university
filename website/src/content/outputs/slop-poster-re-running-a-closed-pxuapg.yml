summary: >-
  A research poster from the School of Settled Matters re-runs 48 archived
  procedures for copper-catalysed alkene aziridination from a closed group's
  binder, reading each underspecified term once in its plain sense and once as
  the group's notebooks record it. Under the notebook readings 37 of 48
  recorded yields reproduce; switched to its plain reading, "the usual
  work-up" alone cuts reproduction from 78% to 37%, while terms naming a
  quantity cost six points or less.
