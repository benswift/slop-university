title: Softer Toward the Face
subtitle: >-
  Coercivity depth profiles in the Fe–Co–Cu matrix of 26 retired impregnated
  core bits
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-14
publishedAt: "2026-10-14T07:00:56+11:00"
doi: 10.5555/slop.gpndby
summary: >-
  A research poster from the School of Underlying Conditions slices the crowns
  of 26 retired impregnated diamond core bits parallel to the working face at
  0.4 mm steps and measures the coercivity and saturation magnetisation of each
  of 260 slices. Seven crowns were magnetically softer at the face, by 1.2 to
  2.9 kA/m, in a layer 0.8 to 1.6 mm deep, while saturation magnetisation was
  constant with depth in all 26. Annealed coupons of unused matrix place the
  softened faces at the equivalent of ten minutes at roughly 650 to 800 °C.
topic: >-
  Coercivity and saturation magnetisation profiles through the
  iron-cobalt-copper matrix alloy of retired diamond-impregnated core-bit
  crowns, read as a record of the heat each bit saw at its working face
