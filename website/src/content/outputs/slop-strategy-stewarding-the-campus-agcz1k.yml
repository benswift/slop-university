summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to a
  single capability in the myxozoan parasites of fish, built from its own
  ornamental lake, teaching ponds and aquarium room. Four priorities provide
  for a shared diagnostic bench and reference collection, a paired seasonal
  survey of fish and sediment-dwelling worms, the designation of every campus
  water body as research infrastructure, and standing agreements with angling,
  hatchery, aquarist and catchment communities.
