summary: >-
  A research poster from the School of Settled Matters maps service wear on the
  hydrogenated diamond-like carbon coating of a law library's compact-shelving
  centre rail at 42 stations after six years of use. Raman I(D)/I(G) and wear
  depth rise at the rest positions of all twelve carriages, two of them worn
  through to the steel, while the running sections remain indistinguishable
  from the off-track reference.
topic: >-
  Service wear of a hydrogenated diamond-like carbon coating on the guide rails
  of a law library's mobile compact shelving, mapped by Raman and
  profilometry: wear gathers where the carriages stop, not where they run
