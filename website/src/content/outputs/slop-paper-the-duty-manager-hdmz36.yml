title: Present, Not Managing
subtitle: >-
  A single-site case study of a strip-mall supermarket's queue-clear-time
  index, and the rule that binds its duty manager to the register
authors:
  - Renke Sabel
  - Casimir Beng
  - Osei Vandermeer
preset: paper
school: School of Continuous Improvement
date: 2026-09-16
publishedAt: "2026-09-16T19:02:44+10:00"
doi: 10.5555/slop.hdmz36
summary: >-
  A single-site case study formalises a strip-mall supermarket's EFTPOS
  transaction timestamps into a Queue-Clear-Time Index, reviewed against a
  target band by the Review Cadence Observatory. Once a shift's index
  breaches the band, the duty manager on shift must personally staff the
  open register for the remainder of that shift, with no exception for a
  scheduled loyalty-points promotion or a logged terminal fault.
topic: >-
  the duty manager at a strip-mall supermarket, bound to personally staff
  the register for the rest of any shift the store's EFTPOS queue-clear-time
  index breaches its target band during the loyalty-points promotion
