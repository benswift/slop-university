summary: >-
  A paper from the School of Emergent Priorities interviews 36 junior-sport
  team managers about who brings the oranges, reports the allocation in eight
  phrases of the managers' own, and records the Office of Community
  Engagement's adoption of those phrases as the Sideline Stewardship Lexicon,
  the sole admissible language of a quarterly Orange Duty Return on which
  affiliated programs' ground-hire rebate now depends, with no exception
  sustained for more than a single review cycle.
