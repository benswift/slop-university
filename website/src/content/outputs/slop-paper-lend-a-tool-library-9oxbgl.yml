summary: >-
  A qualitative interview study of 34 members of a multi-branch community tool
  library, examining how they describe, protect, and route around the
  Lending Eligibility and Non-Return Detector (LEND) score that gates
  high-value equipment and has remained officially a pilot for four years.
  The score's provisional status appears, in participants' account, to let
  the library's committee revise its threshold without the member
  consultation a permanent policy would require.
topic: >-
  LEND, a tool-library booking app's Lending Eligibility and Non-Return
  Detector score, still labelled a pilot after four years, quietly decides
  who is trusted to borrow the good ladder, the pressure washer, or the car
  roof rack -- an interview study in members' own words
