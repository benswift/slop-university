title: Rung for Real, Almost Never
subtitle: A Cross-Portfolio Taxonomy of Genuine Fire-Alarm Call-Point Triggers
authors:
  - Torun Ezeigwe
  - Renke Sabel
preset: research-poster
school: School of Continuous Improvement
date: 2026-07-26
doi: 10.5555/slop.mbg6o7
summary: >-
  A research poster from the School of Continuous Improvement audits six
  years of break-glass fire-alarm activation logs across 214 call points in
  41 commercial and residential buildings, finding that 96.4% of logged
  activations were scheduled tests. The remaining activations resolve into
  four recurring genuine-trigger types, with no association between
  call-point age and trigger type.
topic: >-
  cataloguing, across a portfolio of office and apartment buildings, how many
  of their monthly-tested fire-alarm break-glass call points have ever
  actually been triggered by a real event rather than a scheduled test, and
  building a typology of the handful of genuine triggers that do occur
pdfDark: true
pages: 1
