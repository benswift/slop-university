title: The Produce Bag as Attestation Device
subtitle: >-
  A handling-kind taxonomy of supermarket produce-bag uses, adopted as the
  University's catering fruit-handling rule
authors:
  - Runa Adegoke
  - Lindiwe Achterberg
  - Ingeborg Nwachukwu
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-30
