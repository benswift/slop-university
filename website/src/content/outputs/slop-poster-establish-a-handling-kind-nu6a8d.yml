doi: 10.5555/slop.nu6a8d
summary: >-
  A research poster from the School of Emergent Priorities sorts supermarket
  produce-bag uses into four pre-registered handling kinds and finds Item-wrap
  rising from 28 percent of uses to 61 percent within ten weeks of being named
  the only kind a catering fruit order may attest. Every catering fruit order
  is now bound to Item-wrap attestation, with no override sustained for more
  than a single review cycle.
topic: >-
  Establish a handling-kind taxonomy of supermarket produce-bag uses and bind
  catering fruit-handling attestation to the item-wrap kind alone
