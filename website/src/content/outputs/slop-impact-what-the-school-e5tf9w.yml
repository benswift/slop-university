summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 looks back on
  five years of reading its own name as a mathematical claim: improvement
  series from collaborators' programs fitted as bounded sequences with an
  estimable limit, a stopping rule that cut a state audit office's drafting
  rounds, and a continuity audit that located most of an indicator suite's jumps
  in its definitions rather than its data.
topic: >-
  what the School learned from taking its own name literally: five years of real
  analysis applied to improvement cycles, asking when a sequence of improvements
  converges, whether it is continuous, and where its limit lies
