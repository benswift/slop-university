doi: 10.5555/slop.sqixwu
summary: >-
  A paper from the Schools of Continuous Improvement and Underlying Conditions
  excavates two rubbish deposits at a closed cottage hospital and counts 885
  tableware vessels across six phases. The board's crested ware makes up
  two-thirds of the board room's vessels in the first deposit laid down after
  the hospital passed to public funding, but reaches the wards in quantity only
  a phase later, where mended and still-donated household plates remain a third
  of the assemblage.
topic: >-
  Donated plates at a closed cottage hospital: the ceramics from its ward and
  boardroom rubbish deposits date the passage from subscriber charity to public
  funding twice, with matched institutional ware reaching the boardroom with the
  reform and the wards a phase later, where odd household plates stayed in use
  beside it
