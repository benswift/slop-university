title: Replaced as They Broke
subtitle: Tableware from the Ward and Board-Room Deposits of a Closed Cottage Hospital and the Pace of Its Passage from Charity to Public Funding
authors:
  - Dagny Okafor
  - Brynjar Obiora
preset: paper
school: School of Continuous Improvement
