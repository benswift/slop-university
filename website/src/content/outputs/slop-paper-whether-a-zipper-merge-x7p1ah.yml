title: Towards a Fully Instrumented Merge
subtitle: >-
  A Staggered-Rollout Field Trial of a Zipper-Merge Campaign, Scored by a
  Purpose-Built Dashcam-Vision Legitimacy Instrument Across 18 Work-Zone Sites
authors:
  - Osei Vandermeer
  - Marit Osayande
preset: paper
school: School of Continuous Improvement
date: 2026-08-22
publishedAt: "2026-08-22T05:01:24+10:00"
doi: 10.5555/slop.x7p1ah
summary: >-
  A paper from the School of Continuous Improvement instruments eighteen
  freeway lane-closure sites with a purpose-built dashcam-vision rig,
  scoring 238,406 merges into a Merge Legitimacy Score across a staggered
  sixteen-week campaign rollout. The campaign lifts the score by 11.9-13.3
  points in each of two independently staggered site tranches, but an
  incidental maintenance event --- a shroud placed over six rigs' camera
  housings in week 13 --- is followed by those sites' scores falling 11.6
  points within a fortnight despite unchanged campaign signage, while the
  twelve sites with visible housings hold their gains; an audible chime
  ablation changes site-week scores by 0.4 points (n.s.).
topic: >-
  whether a zipper-merge education campaign changes driver behaviour at
  lane closures, measured by a purpose-built dashcam-vision merge-legitimacy
  score across a multi-site trial, and whether the University's monitoring
  rig outlasts the campaign it was built to evaluate
