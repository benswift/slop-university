title: Settled Elsewhere
subtitle: Whose judgments borrowing courts cite on a provision copied word for word
authors:
  - Odalys Penhallow
  - Anselm Threlkeld
preset: research-poster
school: School of Settled Matters
date: 2026-11-09
publishedAt: "2026-11-09T20:30:27+11:00"
doi: 10.5555/slop.2bhlec
summary: >-
  A research poster from the School of Settled Matters codes 2,958 citations of
  authority in 612 reported judgments construing one statutory provision copied
  verbatim into four borrowing statutes. Local authority passes half of the
  citations at a median of nine years, while the origin's judgments decided
  after adoption never exceed 5% in any band, so that what each borrowing
  jurisdiction settles is the origin's reading as it stood on the day of
  copying.
topic: >-
  Copied statutes and the case law that does not travel with them: how long
  courts in borrowing jurisdictions keep citing the origin's judgments on a
  transplanted provision before a local reading settles
