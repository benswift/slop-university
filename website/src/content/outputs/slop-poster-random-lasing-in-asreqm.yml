summary: >-
  A research poster from the School of Underlying Conditions pumps six
  dye-doped rutile pigment films at six fluences every hour for fourteen hours
  after draw-down, alongside hourly coherent-backscattering measurements of the
  transport mean free path. The lasing threshold falls smoothly with the mean
  free path as the films dry, while the shot-to-shot stability of the lasing
  modes switches on at 7.4 hours, after the films are touch-dry (2.9 hours) and
  after their mass has stopped changing (5.2 hours).
topic: >-
  Random lasing in a dye-doped white pigment film followed through fourteen
  hours of drying: how the lasing threshold, the transport mean free path and
  the shot-to-shot stability of the lasing modes change as the film dries
