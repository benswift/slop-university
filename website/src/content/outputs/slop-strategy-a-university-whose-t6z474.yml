title: Planning for a Shore That Moves
subtitle: Slop University's Strategic Plan 2026–2031, built around a coastal field station whose surveyed seaward line the tide keeps redrawing
authors:
  - Odalys Penhallow
  - Clemency Tredinnick
preset: strategy
school: School of Settled Matters
date: 2026-11-18
publishedAt: "2026-11-18T23:01:47+11:00"
doi: 10.5555/slop.t6z474
summary: >-
  Slop University's Strategic Plan 2026-2031 organises its marine and
  environmental research, field teaching and record-keeping around the
  seaward boundary of its coastal field station, which the shore has not kept
  to since it was surveyed. It commits to an annual re-survey of the line, a
  bound register of every survey, and a standing review of whether any part
  of the boundary can yet be called settled.
topic: >-
  a University whose coastal field station stands on a shoreline that keeps
  moving: marine and environmental research planned around a boundary that
  will not stay where it was surveyed
