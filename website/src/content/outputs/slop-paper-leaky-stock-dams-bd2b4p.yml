title: The Dam Above the Bore
subtitle: >-
  Seepage from Unlined Stock Dams as Dry-Season Recharge to a
  Weathered-Granite Aquifer
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-11
publishedAt: "2026-10-11T13:01:56+11:00"
doi: 10.5555/slop.bd2b4p
summary: >-
  A paper from the School of Underlying Conditions closes a daily water
  balance on fourteen small stock dams in one upland catchment on deeply
  weathered granite across two dry seasons, and logs twelve bores in the same
  ground. Unlined dams lose slightly more than half of their dry-season
  decline to seepage, which slows the water-level recession in bores downslope
  to a third of its reference rate while the dam holds water and accounts for
  about 40% of the groundwater there by a stable-isotope mixing calculation;
  dams lined with compacted clay give the bores below them no such support.
topic: >-
  Leaky stock dams on weathered granite as the recharge that keeps the bores
  below them running: a two-dry-season water balance of seepage, evaporation
  and bore hydrographs on one unnamed upland catchment
