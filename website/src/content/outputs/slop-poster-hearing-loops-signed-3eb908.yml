title: Signed at the Door, Silent in Row J
subtitle:
  A seat-by-seat field-strength survey of hearing loops at 19 suburban cinema
  screens
authors:
  - Osei Vandermeer
  - Solveig Adeyemi
  - Thandiwe Solberg
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-01
publishedAt: "2026-08-01T02:00:34+10:00"
doi: 10.5555/slop.3eb908
summary: >-
  A research poster from the School of Continuous Improvement measures
  audio-frequency induction-loop field strength at 1,140 seat positions across
  19 cinema screens at six sites of a single exhibitor, on a sampling lattice
  and conformance band fixed before the first site visit. 37.0 per cent of
  positions fall within the ±3 dB band, none of them behind row F, and the
  median position in the rear third sits 9.1 dB below reference, while every
  screen carries a current signature in the exhibitor's accessibility register.
topic: >-
  hearing loops signed at every screen of a suburban cinema chain, mapped seat
  by seat against the field-strength standard, and an accessibility register
  that records the loop as compliant because it was installed and signed
