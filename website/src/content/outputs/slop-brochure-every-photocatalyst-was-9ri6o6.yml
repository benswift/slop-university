summary: >-
  A research-showcase brochure led by the School of Underlying Conditions
  follows photocatalysis back to the ground, in four features on the
  provenance of oxide semiconductors, light-driven surfaces in field service,
  sunlight's chemistry in creeks and soils, and the laboratory record behind a
  materials programme. It rests that case on seven published University
  studies, each cited by DOI, and on the voices of four researchers across
  three schools.
topic: >-
  every photocatalyst was dug up first: a research showcase following
  photocatalysis back to the ground, from the oxide ores and mineral sands its
  semiconductors come from to the sunlit rock coatings that were doing the
  chemistry first
