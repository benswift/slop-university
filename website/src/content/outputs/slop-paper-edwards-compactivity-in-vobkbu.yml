doi: 10.5555/slop.vobkbu
summary: >-
  A paper from the School of Emergent Priorities and the School of Underlying
  Conditions applies Edwards' statistical mechanics of granular packings to 212
  crate-moves across four office restacks, finding that crates repacked for a
  move share one equation of state and reach a common compactivity within four
  trolley runs, while crates carried forward unopened fluctuate at a median 0.62
  of the predicted variance and never agree with their neighbours.
topic: >-
  Edwards compactivity in office relocation crates: whether crates trolleyed
  together reach a common compactivity, and why crates carried forward unopened
  through successive restacks do not
