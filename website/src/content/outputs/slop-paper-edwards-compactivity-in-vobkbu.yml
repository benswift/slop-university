title: The Trolley as a Bath
subtitle: Edwards Compactivity of Repacked and Unopened Office-Relocation Crates
authors:
  - Hedvig Anyanwu
  - Brynjar Obiora
  - Ronja Oyelaran
preset: paper
school: School of Emergent Priorities
date: 2026-10-22
