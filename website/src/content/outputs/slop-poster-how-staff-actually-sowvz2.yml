title: Towards a Single Channel of Record
subtitle: The Shift Swaps the Roster App Never Saw, in Workers' Own Words
authors:
  - Torun Ezeigwe
  - Ingeborg Nwachukwu
  - Osei Vandermeer
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-16
publishedAt: "2026-09-16T04:18:08+10:00"
doi: 10.5555/slop.sowvz2
summary: >-
  A research poster from the School of Continuous Improvement interviews 41
  casual and part-time staff across nine sites of a franchise
  retail-and-hospitality chain about how a shift swap is actually arranged in
  the team group chat, then reinterviews the same staff fourteen weeks after
  a swap-of-record mandate ties shift-swap pay to whatever the roster app
  shows.
topic: >-
  how staff actually negotiate a shift swap in the team group chat before it
  goes anywhere near the official roster app, in the workers' own words, and
  what happens to the swaps the chat arranged once management starts
  requiring every one to be re-logged there to count
