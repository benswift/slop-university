title: Whether or Not It Is Read
subtitle: >-
  The Department of Policy Settings answers questions taken on notice by the
  Committee on Settings Oversight on how the Research Records Determination
  treats what a participant writes in an expressive-writing study
authors:
  - Anselm Threlkeld
  - Odalys Penhallow
  - Anneke Tolan
preset: questions-on-notice
date: 2026-11-22
publishedAt: "2026-11-22T05:30:49+11:00"
doi: 10.5555/slop.d4uy09
summary: >-
  The Department of Policy Settings answers five questions on participant
  writing under the Slop University (Research Records) Determination 2026, taken
  on notice at the Committee on Settings Oversight's Supplementary hearings of
  20 November 2026 or lodged in writing after them. Its answers find that what a
  participant writes during a research activity is a research record whether or
  not it is read and whether or not the participant keeps it, with the duty to
  retain it falling on the responsible researcher; tabulate 19 applications to
  vary the retention requirement for participant writing, of which the six
  proposing writing sealed and kept unopened were granted, six were refused and
  seven await that construction; state that it does not hold how a sealed
  record is inspected at audit; and decline on resourcing to count the sealed
  envelopes held across 1,184 registered projects.
topic: >-
  the participant-writing setting: the Committee presses the Department on
  whether the Research Records Determination lets an expressive-writing study
  promise participants that what they write leaves the room unread
