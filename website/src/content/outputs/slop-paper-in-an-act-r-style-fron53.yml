summary: >-
  A paper in computer science from the School of Underlying Conditions and the
  School of Continuous Improvement analyses an agent's periodic inventory of
  its declarative memory, which rehearses each fact it can still retrieve and
  strikes off each it cannot. Under fixed base-level decay a fact is kept
  forever with positive probability exactly when decay plus retrieval noise is
  below one, and the audit interval and retrieval threshold set only how many
  facts survive; at the default decay and a daily audit, a noise of 0.4 keeps
  about half after a million audits and a noise of 0.6 one in ten thousand,
  while under activation-dependent decay every inventory empties.
topic: >-
