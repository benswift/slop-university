doi: 10.5555/slop.2h0xyq
summary: >-
  A research poster from the School of Emergent Priorities codes 214 exam
  scripts and 18 think-aloud interviews from a second-year dynamical systems
  course, finding that 71% of answers on two weak-focus items name a centre
  because the linearisation shows one, and that a next-cohort task asking for
  one long numerical trajectory before classifying roughly triples correct
  answers on those items while cutting correct answers on a true nonlinear
  centre from 81% to 67%, as students read the course notebook's
  forward-Euler drift as a spiral.
topic: >-
  centres that only the linearisation sees: a task-based study of how
  second-year students classify non-hyperbolic equilibria in a dynamical
  systems course, and of a long-trajectory task that interrupts reading a
  linear centre as a nonlinear one
