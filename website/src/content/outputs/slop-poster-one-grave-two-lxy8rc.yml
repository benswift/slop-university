summary: >-
  A research poster from the School of Underlying Conditions reports one adult
  churchyard burial whose grave cut crossed the edge of an infilled ditch,
  leaving the left leg in calcareous ground and the right in acidic fill.
  Scoring the right leg's eroded surfaces as unobservable rather than absent
  turns an apparently unilateral pattern of tibial new bone into a bilateral
  one: of the nine zones observable on both sides, eight agree.
topic: >-
  one grave, two soils: a paleopathological case study of one adult burial laid
  across a soil boundary in a rural churchyard, its left leg in calcareous
  ground and its right in acidic, in which the bilateral comparison that marks
  tibial new bone as systemic is restored by scoring eroded surfaces as
  unobservable rather than absent
