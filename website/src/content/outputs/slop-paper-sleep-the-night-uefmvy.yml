title: Grey by the Tenth Hour
subtitle: Prior-Night Sleep, Time on Shift and the Vocabulary of Core Description
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
