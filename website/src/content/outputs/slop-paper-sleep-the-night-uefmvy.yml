doi: 10.5555/slop.uefmvy
summary: >-
  A paper from the School of Underlying Conditions follows 23 core loggers at
  one remote exploration camp through three two-week swings, pairing a morning
  sleep diary and on-shift sleepiness ratings with the time-stamped free-text
  descriptions they wrote for 41,306 intervals of drill core. Descriptions
  shortened and lost almost half their colour terms across the twelve-hour
  shift, more steeply after a night shorter than the logger's own average,
  while the mandatory coded fields were completed at the same rate in the last
  hour as in the first.
topic: >-
  Sleep the night before and the words in the log: a daily-diary study of
  fatigue among core loggers on a remote drilling roster, asking whether short
  sleep and hours on shift narrow the vocabulary of core description
