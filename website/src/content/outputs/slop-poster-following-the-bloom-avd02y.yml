summary: >-
  A research poster from the School of Underlying Conditions sets seven
  bathymetric resurveys of one valley reservoir, 1993 to 2024, beside summer
  chlorophyll-a transects, and finds that the chlorophyll maximum has stayed
  1.0 to 1.3 km below the delta's topset-foreset break while both moved about
  6 km downstream, so that the delta's sediment budget sets where the lake's
  phytoplankton begin.
