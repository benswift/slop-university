summary: >-
  A research poster from the School of Continuous Improvement reads the
  multi-armed bandit problem as a question of justice between cohorts,
  arguing that cumulative regret, a total, is silent on who bears the cost of
  learning and that the rules minimising it charge most of that cost to the
  earliest arrivals. In a stylised simulation Thompson sampling places 52% of
  its regret on the first tenth of the arrival stream, while a capped-savings
  rule holds every tenth to at most 15% at 1.7 times the total.
topic: >-
  who bears the cost of exploration: bandit regret read as a just-savings
  burden that adaptive allocation places on its earliest claimants
