summary: >-
  A research poster from the School of Emergent Priorities collates the 23
  surviving copies of one laboratory's handwritten recipe for a sodium
  aluminosilicate gel, copied notebook to notebook over nineteen years, and
  reconstructs the lost original by the method of common errors. It finds two
  families of copies, one bound by three shared errors and a marginal note
  that entered the text, and shows that the laminated bench card the
  laboratory works from is a late copy in the more altered family.
topic: >-
