summary: >-
  A research poster from the School of Underlying Conditions aligns 23
  published translations of one 61-canto regional verse epic line by line
  against the source and logs each, in the manner of a drill run, as recovered,
  lost or blocked by a stand-in summary or note. Recovery runs from 71 to 98 per
  cent per translation, nine cantos hold 61 per cent of all unrecovered lines,
  and in 19 of the 23 translations the three heaviest losses all fall among
  those nine, the poem's catalogues of places, its genealogy, a riddle canto and
  a refrain in dialect.
topic: >-
  core loss in translation: twenty-three translations of one regional verse
  epic logged as boreholes through the same source, with the passages each
  fails to carry over recorded as unrecovered intervals, and the losses found
  stacked at the same soft beds in the original
