title: Calibrate From the Left
subtitle: Inherited Interactive Whiteboards and the Teachers Who Read Their Absent Champion
authors:
  - Anselm Threlkeld
  - Hedvig Anyanwu
preset: paper
school: School of Settled Matters
date: 2026-11-24
