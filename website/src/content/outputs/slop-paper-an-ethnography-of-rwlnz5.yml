doi: 10.5555/slop.rwlnz5
summary: >-
  A paper from the School of Settled Matters reports two school terms of
  participant observation in a regional secondary school whose thirty-one
  interactive whiteboards were installed by a digital learning coordinator who
  left seven years before the fieldwork. It catalogues 146 residues he left
  behind, from warning labels and laminated procedure cards to tethered remotes
  and an unopenable folder of lessons, and describes three ways the staff read
  them: to the letter, for their purpose, and through the rulings of a
  part-time technician written back onto the labels as a layer of commentary.
topic: >-
  an ethnography of the interactive whiteboards a regional secondary school
  still keeps years after the teacher who championed them left, and how staff
  who never met him read his labels, calibration notes and setup as
  instructions from an absent author
