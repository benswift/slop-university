summary: >-
  A case-for-support brochure setting out the University's interest in what
  continues after an institutional record has closed --- the sorting that
  starts behind the counter, the queue somebody quietly left, the item that
  never reached a list. It gathers the Adaptive Metrics Lab, the Trajectory
  Analytics Group, and Capability Sprints around four published studies of
  what a handover leaves uncounted, and makes the case for funding the second
  visit rather than the transaction.
topic: >-
  the bags of donations stacked at an op shop's back door on a Monday morning,
  where a charity network reports tonnes diverted from landfill as its
  sustainability indicator and counts every donation at the point it is handed
  over rather than at the point it is sorted --- a brochure campaign for the
  university that follows the ordinary handover past the counter, to what
  happens once the record has already closed
