title: Taken In by Its Weight
subtitle: A Carried Box Extends Hand-Centred Peripersonal Space Whether or Not It Is Sealed
authors:
  - Hedvig Anyanwu
  - Gunnhild Ekwueme
  - Eivind Onwuka
preset: paper
school: School of Emergent Priorities
date: 2026-11-25
publishedAt: "2026-11-25T02:01:47+11:00"
doi: 10.5555/slop.nfhchk
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement measures the audio-tactile boundary of hand-centred peripersonal
  space in thirty adults carrying an archive carton, finding that the boundary
  moves 17.3 cm outward, past the carton's far face, when the carton is loaded
  and sealed and 15.8 cm when it is loaded and open, but only 1.7 cm when the
  same carton is carried empty, so that a carried object is taken in by its
  load rather than by its extent or its contents.
topic: >-
  whether a sealed box carried in both arms is remapped into peripersonal space
  like a tool, a visuotactile crossmodal congruency study of carrying
