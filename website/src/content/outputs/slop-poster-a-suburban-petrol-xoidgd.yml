doi: 10.5555/slop.xoidgd
summary: >-
  A research poster from the School of Continuous Improvement embeds with
  the forecourt staff of a suburban petrol station for a nine-week case
  study, finding the site's bay-availability sign's green read holds steady
  across the season while staff's willingness to act on it alone falls from
  92% to 29%, with no change to the sign's software or refresh cadence.
topic: >-
  a suburban petrol station's forecourt bay-availability sign lights a bay
  green the instant a driver taps their card, before the nozzle is lifted or
  the pump is walked away from, so a bay reads open while someone is still
  paying, texting, or fetching a coffee; a season-long case study, told in
  the station's own voice, of how forecourt staff quietly stopped trusting
  the sign and went back to eyeballing the bays, while the sign stayed up as
  the official readout head office still pulls for site planning
