title: Still Green After You've Paid
subtitle: A Season Embedded with a Petrol Station Forecourt as Staff Stop Trusting the Bay Sign
authors:
  - Dagny Okafor
  - Torun Ezeigwe
  - Bram Ntuli
preset: research-poster
school: School of Continuous Improvement
