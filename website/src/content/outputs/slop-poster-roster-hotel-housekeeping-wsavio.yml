doi: 10.5555/slop.wsavio
summary: >-
  A research poster from the School of Emergent Priorities codes 2,816 occupied
  room-nights at fourteen mid-scale hotels on a two-by-two of whether the
  do-not-disturb hanger was on the door at the morning pass and whether the
  room had actually been serviced, then from week seven allocates housekeeping
  hours inverse to each hotel's hanger-unmade share. Independent servicing is
  19 per cent behind a hanger and 81 per cent without; the published
  rooms-serviced rate tracks the no-hanger share (72.1 per cent, then 90.2 per
  cent). After the 2×2 becomes the rostering rule the hanger-unmade cell falls
  from 22 per cent to 6 per cent of room-nights because hangers come down, not
  because more rooms are made (independent servicing 64.1 per cent then 63.4
  per cent).
topic: >-
  roster hotel housekeeping from a two-by-two of the do-not-disturb hanger
