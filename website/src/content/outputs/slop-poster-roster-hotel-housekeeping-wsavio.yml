title: Towards a Housekeeping Rostering Quadrant
subtitle: >-
  Do-not-disturb hangers against actual room servicing at fourteen hotels
authors:
  - Lindiwe Achterberg
  - Iben Chikere
  - Anouk Mensah
preset: research-poster
school: School of Emergent Priorities
