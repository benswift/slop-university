doi: 10.5555/slop.ejnh3q
summary: >-
  A paper from the School of Underlying Conditions writes the torque balance
  of a wireline core barrel's inner tube and measures both sides of it on a
  bench: swivel drag in fresh, overpacked and run-worn conditions, and the
  holding torque of broken core columns. In broken ground the column's own
  weight supplies about as much torque as a swivel drags with, so a run-worn
  swivel turns the tube once fragments are shorter than about 1.3 core
  diameters, and across 186 runs on one hole recovery in broken ground fell
  from 86% to 58% as the swivel's hand spin test went from free to tight.
topic: >-
  Swivel-bearing drag torque and the onset of inner-tube rotation in a
  wireline core barrel: a bearing-dynamics model and bench study of why core
  spins, grinds and goes unrecovered
