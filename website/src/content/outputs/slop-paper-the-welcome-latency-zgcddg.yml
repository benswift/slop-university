summary: >-
  A paper from the School of Continuous Improvement surveys greeting latency
  across 187 community organisations --- sports clubs, sheds, choirs,
  allotment societies, and raffle nights --- timing 1,842 arrivals from entry
  to first acknowledgement. The resulting Welcome Latency Register converts
  each club's median latency into a percentile band, now the basis on which
  the University's Community Partnerships Office renews a discounted
  group-liability insurance concession for affiliated clubs, with no manual
  override for a club that falls outside the concession band.
topic: >-
  The Welcome Latency Register surveys how long new and returning attendees
  wait to be greeted or directed to sign-in across sports clubs, sheds,
  choirs, allotment societies, and raffle nights, reporting the wait
  distribution by venue type, and now sets a maximum-wait service standard
  each club must roster a greeter against to keep its group-insurance
  discount
