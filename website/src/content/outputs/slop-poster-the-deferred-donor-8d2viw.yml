title: Screened Out Before the Chair
subtitle: >-
  A Staggered-Adoption Evaluation of an Appointment-Yield Indicator at 26
  Blood-Collection Centres
authors:
  - Runa Adegoke
  - Ingrid Vasseur
  - Ingeborg Nwachukwu
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-31
publishedAt: 2026-07-31T12:02:33+10:00
doi: 10.5555/slop.8d2viw
summary: >-
  A research poster from the School of Emergent Priorities evaluates a blood
  collection service's appointment-yield indicator --- units collected per
  appointment attended, with a health-check deferral counted as a failed
  booking --- across 26 fixed centres, 214,806 booked appointments and
  eighteen months of staggered adoption. Difference-in-differences against
  not-yet-treated centres puts reported yield 5.7 percentage points higher
  (95% CI 3.9-7.5) with no detectable movement in whole-blood volume per
  centre-week (-1.4%; CI -4.0 to +1.2), while pre-booking screening calls rise
  3.1 times and first-time bookings fall 18 per cent.
topic: >-
  the deferred donor at a blood-collection centre, and an appointment-yield
  indicator that counts a health-check deferral as a failed booking
