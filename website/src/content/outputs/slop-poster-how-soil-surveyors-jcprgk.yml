summary: >-
  A research poster from the School of Underlying Conditions shadows one
  regional soil survey crew of eleven through a nine-week mapping season,
  coding 327 occasions on which a black fleck in the auger was examined and
  called. Every surveyor smears the fleck and none recalls being taught to;
  whether the smear goes on the thumbnail or the margin of the description
  card follows who each surveyor first augered beside, and only the card-margin
  lineage leaves its evidence in the archive.
topic: >-
  How soil surveyors learn to call a black fleck in the auger charcoal: tacit
  knowledge, the smear test and its handing-down in one survey crew
