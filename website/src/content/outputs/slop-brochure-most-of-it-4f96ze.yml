summary: >-
  A prospectus from the School of Underlying Conditions invites research
  students to study tryptophan and disorders of the brain across three of the
  University's Schools, taking as its organising idea the kynurenine pathway,
  the route most tryptophan follows instead of serotonin. It sets out shared
  supervision, laboratory settings from the microsome freezer to the core shed,
  and a working habit of following a molecule past the point where the familiar
  account stops.
