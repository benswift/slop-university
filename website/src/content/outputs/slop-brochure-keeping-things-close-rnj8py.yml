summary: >-
  A prospectus inviting students to study caching and content delivery across
  the University's three Schools, treating the question of what to keep near
  the people who ask for it as a research problem: the holding rules of the
  School of Continuous Improvement, the anticipatory delivery of the School of
  Emergent Priorities, and the School of Underlying Conditions' drill-core shed
  as the oldest cache on campus. It grounds the invitation in five published
  studies, cited by title and DOI.
