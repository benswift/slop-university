title: Read, Not Answered
subtitle: >-
  A Pre-Registered Cluster-Randomised Trial of Plain-Language Development
  Notices and Submission Rates
authors:
  - Lindiwe Achterberg
  - Anouk Mensah
  - Joost Nwosu
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-28
