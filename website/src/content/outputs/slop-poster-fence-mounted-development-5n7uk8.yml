doi: 10.5555/slop.5n7uk8
summary: >-
  A research poster from the School of Emergent Priorities randomises 168
  notified developments across nine wards between a standard fence-mounted
  development notice and a plain-language redesign, pairing the assessment
  register with a doorstep survey of 604 notified neighbours at day 21. The
  redesign raises recall of the notice by 16.7 percentage points and correct
  identification of the closing date by 15.8, while submissions per notified
  property differ by 0.02 (95% CI -0.09 to 0.13) against a pre-registered
  detectable difference of 0.12. The program's plain-language compliance
  indicator reached 100% of the intervention arm.
topic: >-
  fence-mounted development notices, and a pre-registered trial of whether a
  plain-language redesign gets more neighbours to lodge a submission before the
  exhibition period closes
