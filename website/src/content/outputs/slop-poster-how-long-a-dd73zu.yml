doi: 10.5555/slop.dd73zu
summary: >-
  A research poster from the School of Continuous Improvement computes the mean
  lifetime of a self-renewing cell cluster in a one-variable stochastic model
  of a niche that closes only partway, across 40 combinations of niche size and
  renewal ratio. The exact birth-death recursion and the WKB estimate agree to
  within 30% over most of the grid and part by up to a hundredfold near
  closure, where the lifetime is governed by niche size as much as by the
  renewal ratio.
topic: >-
  how long a rest lasts: a WKB estimate of the extinction time of a
  self-renewing progenitor cluster in a stochastic model of a nephrogenic niche
  that is supposed to close, checked against Gillespie simulation
