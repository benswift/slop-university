title: How Long a Rest Lasts
subtitle: Exact and WKB lifetimes of a self-renewing cluster in a model niche that closes only partway
authors:
  - Edda Nwafor
  - Solveig Adeyemi
  - Mirela Hanke
preset: research-poster
school: School of Continuous Improvement
