doi: 10.5555/slop.l2g0el
summary: >-
  A research poster from the School of Underlying Conditions assays active and
  total phenoloxidase in the haemolymph of 96 individuals of an undescribed
  groundwater amphipod taken from eleven disused monitoring bores, and counts
  the encysted larvae each animal carries at dissection. Active phenoloxidase
  falls with cyst burden while total phenoloxidase does not, the assay
  separates heavily burdened animals from the rest, and bore identity accounts
  for 38% of the residual variance.
topic: >-
  phenoloxidase activity as a marker of parasite burden in blind amphipods
  bailed from disused groundwater monitoring bores
