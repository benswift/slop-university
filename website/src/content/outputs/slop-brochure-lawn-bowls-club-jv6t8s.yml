summary: >-
  A civic-showcase brochure gathers five published Slop University studies
  under one instinct --- the shared resource that acquires a committee once
  enough people want it at the same time --- from a suburban lawn bowls
  club's rink roster to a council working bee's signed-hours ledger.
topic: >-
  a suburban lawn bowls club's Tuesday-afternoon rink roster, chalked up on a
  board each week by whoever gets there first, until a string of fairness
  complaints about the shaded green sees the club constitute a standing Rink
  Allocation Working Group --- terms of reference, a rotating chair, an
  annual review cycle --- to convene over who plays where, and the case for a
  university that recognises the same governance instinct in something this
  small
