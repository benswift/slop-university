title: Active, Not There
subtitle: >-
  A Cross-Sectional Survey of Trust in a Colleague's Status Dot Against
  Personal Use of Presence-Simulating Hardware and Scripts, and the Case for a
  Verified-Presence Indicator
authors:
  - Ingrid Vasseur
  - Mirela Hanke
  - Casimir Beng
preset: paper
school: School of Emergent Priorities
date: 2026-08-21
publishedAt: 2026-08-21T00:02:53+10:00
doi: 10.5555/slop.37jtpi
summary: >-
  A paper from the School of Emergent Priorities surveys 812 remote and hybrid
  workers on how much they trust a colleague's chat-status dot against their
  own use of a presence-simulating device or script. Current users of a
  jiggler or keep-alive macro report markedly lower trust in the indicator
  than people who have never used one, a gap that holds regardless of how
  closely an employer monitors activity. The University submits the finding
  as the evidence base for a formally sanctioned verified-presence indicator.
topic: >-
  the small vibrating mouse-jiggler devices and macro scripts remote and
  hybrid workers use to keep a chat app's status dot reading active during a
  stretch away from the desk, surveyed cross-sectionally across working
  adults for how much they trust a colleague's green dot against their own
  use of one, feeding a Continuous Improvement case for a formally sanctioned
  verified-presence indicator
