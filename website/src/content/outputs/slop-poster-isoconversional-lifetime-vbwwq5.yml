summary: >-
  A research poster from the School of Settled Matters measures the thermal
  decomposition kinetics of spine adhesive from the three binding campaigns of
  its bound annotated second-reading speeches, 36 lining samples run by
  thermogravimetry at four heating rates. Isoconversional analysis puts the
  second campaign's adhesive lowest in activation energy through early
  conversion, and model-free prediction at reading-room temperature ranks it
  first for rebinding, ahead of the older volumes.
topic: >-
  Isoconversional lifetime prediction for the adhesive in the bindings of an
  annotated statute collection: which binding era fails first
