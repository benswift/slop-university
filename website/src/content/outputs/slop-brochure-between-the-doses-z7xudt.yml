summary: >-
  A case-for-support brochure from the School of Continuous Improvement invites
  partners to fund research on the routines that carry infection prevention and
  immunisation between one dose and the next: the overdue list and the recall
  call, the record card keyed into a register, the ward laundry and the dress
  standard in the change room. It proposes carrying the School's doctoral work
  on workplace dress into clinical and care settings, and rests its case on
  seven published outputs cited by title and DOI.
topic: >-
  between the doses: a case for supporting the School of Continuous
  Improvement's research on the recall lists, record cards, ward laundry and
  dress codes that carry infection prevention and immunisation through an
  ordinary working week
