summary: >-
  A research-showcase brochure from the School of Underlying Conditions
  introduces the School's reading of the literatures of Africa and the
  Caribbean for the earth they describe, across three strands on the household
  plot, the words a soil is given, and the geology beneath a described country.
  It profiles three researchers and directs readers to six of the University's
  published outputs.
