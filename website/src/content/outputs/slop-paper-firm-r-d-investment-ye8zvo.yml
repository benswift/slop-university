title: What the Word Was Worth
subtitle: Firm R&D before and after an Appellate Construction of “Experimental” in an Innovation Tax Concession
authors:
  - Anselm Threlkeld
  - Lindiwe Achterberg
preset: paper
school: School of Settled Matters
date: 2026-11-10
