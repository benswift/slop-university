doi: 10.5555/slop.ye8zvo
summary: >-
  A paper from the School of Settled Matters follows 3,406 firms registered for
  an innovation tax concession through five years in which tribunals divided
  over whose knowledge decides whether an activity is “experimental”, and
  through the appellate construction that settled the word. Exposed firms'
  surveyed R&D ran about 6 per cent below unexposed firms while the word was
  doubtful; after the construction, process-trial firms recovered while
  software firms withdrew most of their activity from the concession schedule
  but kept most of the work, and the judgment's operative phrase came to appear
  in 58 per cent of new activity descriptions.
topic: >-
  firm R&D investment before and after an appellate court settled the meaning
  of 'experimental' in an innovation tax concession: a difference-in-differences
  study of the firms whose claims turned on the unsettled word
