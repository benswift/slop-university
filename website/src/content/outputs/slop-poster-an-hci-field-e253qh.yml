title: Read from the Aisle
subtitle: An Ambient Cushion Light Bar on Eight Injection Moulding Presses
authors:
  - Gunnhild Ekwueme
  - Marit Osayande
  - Casimir Beng
preset: research-poster
school: School of Emergent Priorities
