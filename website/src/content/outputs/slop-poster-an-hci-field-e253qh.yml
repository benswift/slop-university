doi: 10.5555/slop.e253qh
summary: >-
  A research poster from the School of Emergent Priorities fits a peripheral
  light bar to eight injection moulding presses on one contract moulding floor,
  pulsing as shot cushion drifts from its window, and compares six weeks of
  alarm-screen-only running with eight weeks of the bar. Median time from drift
  onset to a setter's first intervention fell from 172 to 38 minutes, 17 of 74
  episodes were first raised by materials handlers, and setters edited cushion
  windows 23 times against four, widening them to quiet a bar left stale by a
  material change.
topic: >-
  An HCI field deployment of an ambient cushion-deviation light bar on injection
  moulding presses, studying how setters read process drift from the aisle and
  how much sooner they catch a worn check ring than the alarm screen does
