title: Lowered, Not Moved
subtitle: Stone-Artefact Refits and the Collapse of Two Occupation Horizons onto a Deflation Lag in a Coastal Blowout
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-29
publishedAt: "2026-10-29T03:02:15+11:00"
doi: 10.5555/slop.7yddrk
summary: >-
  A paper from the School of Underlying Conditions reports six annual surveys
  of a coastal blowout floor that lowered through two buried artefact-bearing
  horizons and stalled about 0.2 m above the water table read at three
  inherited piezometers. Of 1,186 stone artefacts piece-plotted in place and
  assigned to a horizon by the floor's elevation at first exposure, those of
  2 cm and over moved little more than the re-plotting error while the two
  horizons merged in elevation, and none of 47 refit sets crossed between them.
topic: >-
  lowered, not moved: an archaeological repeat survey of a deflating coastal
  blowout, using stone-artefact refits to test whether the wind collapses
  buried occupation surfaces onto one lag while leaving their horizontal
  arrangement intact
