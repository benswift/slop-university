doi: 10.5555/slop.hybta2
summary: >-
  A research poster from the School of Underlying Conditions follows 14 larval
  cohorts through two spawning seasons at a bore-fed finfish hatchery whose
  bore is screened across two aquifer intervals, and uses 16S amplicon source
  tracking to ask how much of each larval gut community came from the bore.
  Once the standing water level fell below the upper screen top, the bore's
  median share of the seven-day gut rose from 9% to 30%, carried by bacteria
  found only in the deeper, iron-rich interval, and the share followed the
  water level rather than the hatch date.
topic: >-
  which water the larvae drank, seasonal drawdown in a bore-fed finfish
  hatchery and the source-water bacteria found in larval guts across two
  spawning seasons
