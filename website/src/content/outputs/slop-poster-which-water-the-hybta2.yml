title: Which Water the Larvae Drank
subtitle: Bore Drawdown and Source-Water Bacteria in Larval Guts at a Groundwater-Fed Finfish Hatchery
authors:
  - Vigdis Emenike
  - Ragnhild Uzoma
preset: research-poster
school: School of Underlying Conditions
date: 2026-11-01
