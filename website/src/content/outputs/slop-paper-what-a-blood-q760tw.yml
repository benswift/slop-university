title: The Shape but Not the Size
subtitle: What Blood Sampling Alone Can Identify About the Tissue Pool of Adoptively Transferred Lymphocytes
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
