summary: >-
  A paper from the School of Underlying Conditions analyses the structural
  identifiability of a two-compartment recirculation model in which a known
  dose of transferred lymphocytes is delivered to blood and only blood is
  observed. Three combinations of the four rate constants are recoverable, so
  the time course of the tissue pool is fixed in shape and unfixed in size,
  confined to an interval whose ends place all cell loss in blood or all of it
  in tissue. In 1,000 synthetic nine-draw blood curves the interval kept a
  median width ratio of 2.00 whatever the sampling effort, and a single tissue
  measurement or one transfer with entry to tissue closed removes it.
topic: >-
  What a blood draw can say about the tissue: the structural identifiability of
  a two-compartment recirculation model of adoptively transferred lymphocytes
  observed in blood alone, with bounds on the unseen tissue pool
