summary: >-
  A research poster from the School of Emergent Priorities has twelve
  digitisers, six trained analysts and six district residents, independently
  trace 64 village boundaries from the same imagery, and fits a crossed
  variance-components model to their perpendicular offsets at 7,000 transects.
  Segment type, not digitiser, carries the disagreement: 95% tolerance bands run
  from about two metres on road edges to nearly thirty on open ground, tree-line
  traces sit outward of the consensus, and on open ground the residents agree
  with one another far more closely than the analysts do.
topic: >-
  Where independent digitisers disagree when tracing the same village boundaries
  from satellite imagery: a crossed variance-components model of perpendicular
  offsets by boundary segment type, and the tolerance band each kind of segment
  needs
