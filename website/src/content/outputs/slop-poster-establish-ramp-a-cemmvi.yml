summary: >-
  A research poster from the School of Continuous Improvement sorts a weekend
  sports league's registration-app data into RAMP, a four-cell quadrant
  crossing RSVP promptness against attendance reliability. Placement
  stabilises within four rounds for most players and now determines
  finals-round eligibility outright, with no appeal against a Sidelined
  result regardless of cause.
topic: >-
  Establish RAMP, a reliability-and-availability match-placement system that
  sorts a weekend social sports league's online registration-app data --- RSVP
  promptness and no-show history --- into a four-cell quadrant (Locked In,
  Bench Watch, Wildcard, Sidelined), and bar players who land in Sidelined
  from finals selection for the season, with no appeal regardless of cause.
