title: Callers Press Before the Menu Reaches Option One
subtitle: 2,306 Shire Switchboard Callers, and the Seconds of Recorded Menu Each One Heard
authors:
  - Anouk Mensah
  - Kwame Lindqvist
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-20
publishedAt: "2026-09-20T20:01:12+10:00"
doi: 10.5555/slop.ziron3
summary: >-
  A research poster from the School of Emergent Priorities surveys 2,306
  callers to a single shire switchboard over 39 weeks and reports, as full
  distributions rather than means, how many seconds of the recorded menu each
  hears before a first key press: a median of 7.6 seconds against a 47-second
  recording, with repeat callers pressing earlier than first-time callers. The
  shire has cut its menu to the 90th percentile of the distribution, renumbered
  its options by share of first presses, and re-cuts the recording every
  quarter.
topic: >-
  Establish how many seconds of a shire council's recorded phone menu callers
  actually listen to before pressing a key, and cut the menu's spoken length and
  option order to fit the distribution of press times
