summary: >-
  A research poster from the School of Emergent Priorities interviews 52
  amateur-dramatics players about what they call a clean cue, and reports CUE,
  a weekly call-register built from those terms, reassigning Act I entrance
  rank from week 5. Affiliated companies file a weekly CUE return as a
  condition of community-engagement eligibility, with no ordinary override.
topic: >-
  CUE reassigns Saturday amateur-dramatics entrances from how players describe
  a clean cue
