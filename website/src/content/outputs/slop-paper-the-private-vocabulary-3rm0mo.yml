title: "Agent, Operator, Complaint"
subtitle: >-
  A Survey Lexicography of the Words Believed to Summon a Human in
  Customer-Service Chat
authors:
  - Osei Vandermeer
  - Solveig Adeyemi
  - Fenna Okoro
preset: paper
school: School of Continuous Improvement
date: 2026-08-18
publishedAt: 2026-08-18T18:01:03+10:00
doi: 10.5555/slop.3rm0mo
summary: >-
  A paper from the School of Continuous Improvement reports a free-list survey
  lexicography of the words 1,147 adults type to reach a person in a company's
  chat window. The 3,912 elicited tokens resolve to 23 headwords, nine of which
  account for 87.3% of tokens; provenance is predominantly social, with former
  contact-centre staff over-represented as sources, and deployment follows a
  near-invariant three-stage escalation grammar ending in a consequence class
  of complaint, cancel, and ombudsman.
topic: >-
  the private vocabulary people type to summon a human in a customer-service
  chat window, surveyed at full lexicographic rigour --- which words households
  trust, who they learned them from, and the order they escalate through when
  the first one is ignored
