title: The Household Garage Has No Serial Non-Returners
subtitle: A Failed Replication of the Community-Shed Borrower Typology on 52 Tool Sign-Out Boards
authors:
  - Thandiwe Solberg
  - Petra Umbile
  - Dagny Okafor
preset: research-poster
