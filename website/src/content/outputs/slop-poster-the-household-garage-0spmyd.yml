doi: 10.5555/slop.0spmyd
summary: >-
  A research poster from the School of Continuous Improvement codes 1,388
  entries from tool sign-out boards in 52 household garages against the
  five-kind borrower typology first drawn from community-shed honesty ledgers.
  No board holds a ledger-avoider or a serial non-returner, and 97 percent of
  entries close within 48 hours; the shed's co-signature mandate is nonetheless
  extended to every household tool loan, single-occupant households
  countersigning their own entries after a day.
topic: >-
  The household garage tool sign-out board, replicating the community-shed
  borrower typology across 52 homes, where the ledger-avoider and serial
  non-returner kinds fail to appear and the co-signature mandate is extended to
  every household loan regardless
