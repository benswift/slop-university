title: The Loose-Change Jar as Reserve Bank
subtitle: A Four-Kind Taxonomy of Household Coin Jars, Sorted by Vessel and Lid, and the Slotted-Lid Rule Now Fitted to University Petty-Cash Tins
authors:
  - Lindiwe Achterberg
  - Kwame Lindqvist
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-10-05
publishedAt: "2026-10-05T17:01:55+11:00"
doi: 10.5555/slop.j9ktqy
summary: >-
  A paper from the School of Emergent Priorities sorts the coin jars of 124 households into four kinds of reserve (Float, Drawdown, Estate and Orphan) with a four-step key that reads only the vessel and its lid, and finds the owner's stated purpose adds nothing to its agreement with a twelve-month drawdown record. A pilot at 17 University offices, in which slotted lids were fitted to petty-cash tins, is reported alongside the rule that followed.
topic: >-
  The loose-change jar's vessel and lid sort a household's coin into four kinds of reserve whatever its owner says the coins are for, a taxonomy now written into the slotted-lid rule the University fits to every office petty-cash tin
