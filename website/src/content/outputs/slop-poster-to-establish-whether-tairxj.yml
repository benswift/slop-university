summary: >-
  A research poster from the School of Continuous Improvement follows 143
  items hung on a single railing post at a suburban kerb over eighteen months,
  finding that owners took back 31, second passers paired 26 single gloves with
  a mate, and the median item had left by day 15. The University closes its
  staffed lost-property desk, names the railing post at its main entrance the
  office of record, and releases every unclaimed item to the weather after 15
  days.
topic: >-
  To establish whether the railing post at one suburban street corner, where
  passers-by hang found gloves at eye height, performs the functions of a
  lost-property office, and to adopt its dwell rule as the University's own
