title: Stringing with the Shadow
subtitle: Re-Assigning the Strings of a Ground-Mounted Photovoltaic Array to the Advancing Shadow of a Retained Windbreak
authors:
  - Clemency Tredinnick
  - Marit Osayande
  - Eskil Nwabueze
preset: paper
school: School of Settled Matters
date: 2026-11-27
publishedAt: "2026-11-27T08:02:47+11:00"
doi: 10.5555/slop.ox9f72
summary: >-
  A paper from the School of Settled Matters and the School of Continuous
  Improvement re-strings a 44-module ground-mounted array, shaded each winter
  afternoon by a cypress windbreak its owner is bound to keep, so that each
  string occupies a contiguous block of columns in the shadow's path. Over one
  winter in each configuration the re-strung array delivered 12.1 per cent more
  energy per unit of unshaded irradiation in June to August, and in simulation
  it recovered 79 per cent of the as-built wiring's mismatch loss without new
  hardware and left the inverter's global scan little to do.
topic: >-
  shade-ordered string assignment for a small ground-mounted photovoltaic array
  shaded each winter by a boundary windbreak the operator may not remove
