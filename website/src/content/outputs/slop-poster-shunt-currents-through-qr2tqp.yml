summary: >-
  A research poster from the School of Underlying Conditions measures the
  current that bypasses the four bipolar plates of a five-compartment
  molten-chloride magnesium pilot cell through its shared melt, with alumina
  baffles dipped 0 to 100 mm between compartments. Bypass falls from 9.8% of
  cell current with no baffle to 2.2% at 60 mm, where magnesium current
  efficiency peaks at 88.5%; deeper baffles barely reduce bypass further and
  lower efficiency, which the authors provisionally attribute to back-reaction.
topic: >-
  shunt currents through the shared melt of a five-compartment bipolar
  molten-chloride electrolysis pilot cell, and how deep an insulating ceramic
  baffle must dip to suppress them
