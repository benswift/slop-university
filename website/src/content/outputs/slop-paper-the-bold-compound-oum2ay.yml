title: Compound 7 Was Once Compound 4
subtitle: The Bold Number as a Narrative Identifier in One Organometallic Synthesis Group's Manuscript Drafts
authors:
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-11-07
publishedAt: "2026-11-07T07:30:28+11:00"
doi: 10.5555/slop.oum2ay
summary: >-
  A paper from the School of Underlying Conditions reconstructs the draft
  histories of fourteen manuscripts from one organometallic synthesis group and
  traces each of their 297 bold-numbered species to the notebook codes of its
  preparations, finding 1,184 renumbering events, nearly half of them in the
  last three-tenths of the drafts as schemes were reordered for the argument.
  At submission 37 numbers disagreed between main text and supporting
  information and over a third of spectrum and structure files carried a
  superseded number, while the notebook code never changed; the paper reads
  the bold number as an identifier of position in an argument and proposes a
  concordance with the notebook code in the supporting information.
topic: >-
  the bold compound number as an identifier: how one organometallic synthesis
  group's manuscript drafts renumber their complexes to fit the story, and what
  each renumbering does to the concordance with notebook codes
