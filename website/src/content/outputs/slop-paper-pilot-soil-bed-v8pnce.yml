doi: 10.5555/slop.v8pnce
summary: >-
  A paper from the School of Underlying Conditions and the School of
  Continuous Improvement packs three pilot soil-bed biofilters with equal
  volumes of the same loam topsoil and calcareous subsoil, topsoil first,
  subsoil first or mixed, and feeds each the vented air of a rural pump
  station's wet well for 412 days. Sulfate drove an acidification front down
  each bed at a rate set by the horizon it was in; the three beds held the same
  carbonate yet removed 82%, 99% and 96% of the hydrogen sulfide, and the
  topsoil-first bed failed with half its carbonate unused because the subsoil
  left to do the work was too slow to finish removal within its depth.
topic: >-
  Pilot soil-bed biofilters packed from the horizons of one soil profile,
  treating hydrogen sulfide vented from a wastewater pump station, where bed
  life is set by how fast the acidification front descends through each
  horizon's carbonate
