title: Which Horizon Meets the Gas First
subtitle: Acidification Fronts in Pilot Soil-Bed Biofilters Packed from One Calcareous Profile
authors:
  - Brynjar Obiora
  - Bram Ntuli
preset: paper
school: School of Underlying Conditions
date: 2026-11-22
