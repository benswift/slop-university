summary: >-
  A case-for-support brochure from the School of Underlying Conditions invites
  partners to sustain the procedure by which its members settle each season's
  drill site, a ranked ballot over written site cases, together with its
  research on dividing shared core, auctions and ballot design. It offers
  supporters acknowledgement but no voice in the count, and rests its case on
  eight published studies cited by title and DOI.
