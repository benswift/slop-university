title: The Tick Has Two Boxes
subtitle: A Grounded Typology of Nine Repair Outcomes at 14 Community Repair Cafés, and
  the Diversion Tally Assembled From the Intake Slip
authors:
  - Iben Chikere
  - Anneke Tolan
  - Solveig Adeyemi
preset: paper
school: School of Emergent Priorities
date: 2026-07-31
publishedAt: "2026-07-31T08:01:39+10:00"
doi: 10.5555/slop.bbeucv
summary: A paper from the School of Emergent Priorities follows fourteen volunteer-run
  community repair cafés in one metropolitan council area for fifteen months,
  combining 226 hours of bench observation at 71 sessions, 58 semi-structured
  interviews, a documentary pass over 4,908 paper intake slips, and a
  twelve-week telephone follow-up with 318 visitors. Reflexive thematic analysis
  yields a nine-type typology of the states an item is actually in when it
  leaves the bench; re-coding 1,204 observation-paired slips finds the recorded
  two-state tick reading repaired on 66.4 per cent of them and spanning five of
  the nine types, against 43.6 per cent meeting a sustained-use criterion at
  twelve weeks. Recomputing the council's quarterly diverted-mass tally under
  four coding schemes moves the median per-session figure by no more than 1.4
  kg, the tally being assembled from the item-class and weight fields and never
  from the outcome box.
topic: the Saturday repair café's broken toaster, and a council diversion tally
  assembled from an intake slip whose outcome box has two states while the bench
  it records has nine
