summary: >-
  A research poster from the School of Underlying Conditions measures the
  dispersive and acid–base surface energies of crushed drill core from eight
  intervals across one weathered granite–sandstone unconformity by inverse gas
  chromatography at infinite dilution. The dispersive component peaks in the
  lower saprolite seven metres beneath the contact rather than at it, and the
  gain in specific interaction there is acidic, carried by the electron-donor
  probes.
topic: >-
  Inverse gas chromatography across a weathered basement unconformity: the
  dispersive and acid-base surface energies of fresh granite, saprock and
  saprolite from one drill core
