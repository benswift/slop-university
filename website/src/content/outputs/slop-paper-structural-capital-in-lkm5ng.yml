doi: 10.5555/slop.lkm5ng
summary: >-
  A paper from the School of Underlying Conditions measures how much of what
  seven departed core loggers knew remains usable in the records they left at a
  state drill-core repository. Across 1,120 re-read intervals, a successor
  working from the record recovers 0.55 of what the logger would add to an
  unaided reading; the ratio is 0.31 for coded columns alone and 0.79 where the
  logger also used the optional remarks column and pencilled on the tray, and
  it does not decline with the age of the record. The paper proposes the ratio
  as an indicator for an intellectual capital statement.
topic: >-
  structural capital in a drill-core repository: how much of what departed
  loggers knew survives in the logs they left, measured by blind relogging and
  reported as a human-to-structural conversion ratio in an intellectual capital
  statement
