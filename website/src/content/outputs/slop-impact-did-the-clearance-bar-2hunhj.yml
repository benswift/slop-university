summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 follows a
  hanging clearance-bar contact log across 36 school-run overflow,
  park-and-ride, and suburban car-park entries. Eighteen thousand logged
  knocks produced no attributable turn-around. The School has admitted the
  log to the Indicator Commons as a closed finding, with no successor
  measure and no further-work clause, and treats every subsequent contact as
  a completed incident.
