summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 looks back on
  five years in molten-salt plants: a thermal-storage loop whose thermocouple
  replacement interval was lengthened to 26 operating weeks once drawn
  instruments proved to have drifted less than their replacements' installation
  step, a refining-hall dashboard that now records which sampler drew each
  value, and pot-room Capability Sprints whose handover huddle outlasted the
  weekly improvement card the course was built around.
