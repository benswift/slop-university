summary: >-
  A personal-capacity submission from two members of the School of Settled
  Matters answers six of the twelve questions in the Department of Policy
  Settings' consultation on quorum and resolutions in the University's units,
  confined to resolutions that release material rather than documents: a plant
  extract, a fraction or an isolated compound sent to another unit's bench. It
  supports Option 2 with a rule added for such releases, asking that "output" be
  defined, that a release minute name its material by accession, that a release
  of material be complete on delivery, and that a lapse not reach a receiving
  unit that took the material without notice of the defect.
topic: >-
  release of a thing rather than a text: a personal-capacity submission to the
  quorum review on what an inquorate resolution releasing a plant extract or an
  isolated compound to another unit's assay bench can lapse into, asking that a
  release minute name its material by accession and that a lapse not follow the
  material to a unit that took it in good faith
