doi: 10.5555/slop.fm037c
summary: >-
  A paper from the School of Emergent Priorities surveys and trenches the nine
  successive demonstration plots on the grounds of one lowland agricultural
  extension station, ordering them by bund superposition, a seriation of corner
  markers and the station's own register. Each plot is smaller than the last
  and nearer the road, its signboard footing larger; the first five were
  reached by a sunken footpath from the gate, the last three from a gravel
  lay-by in the road verge, and none of the nine was ever removed.
topic: >-
  a contemporary archaeology of the nine successive demonstration plots at a
  lowland agricultural extension station, whose excavated corner markers,
  signboard footings and bund cuts show each new development programme laying
  out a smaller plot nearer the station's road frontage than the last
