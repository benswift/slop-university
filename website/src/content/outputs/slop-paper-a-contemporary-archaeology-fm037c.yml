title: From Hollow Way to Lay-By
subtitle: An Archaeology of Nine Demonstration Plots at a Lowland Agricultural Extension Station
authors:
  - Halvard Nnamani
  - Marek Solheim
  - Sunniva Balogun
preset: paper
school: School of Emergent Priorities
