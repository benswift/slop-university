title: Built to Outlast the Certificate
subtitle: Capability Sprints, and what the long institutions of Rome know about habits that last
authors:
  - Ingeborg Nwachukwu
  - Marek Solheim
  - Ylva Onyekwere
preset: brochure
school: School of Continuous Improvement
