summary: >-
  A prospectus from the School of Continuous Improvement presents the
  University's five Capability Sprints as courses planned backwards from the
  return to work, borrowing from the councils, registers and pilgrim roads of
  Rome the habit of recording a decision so that a successor can act on it. It
  sets out three Sprints in that light, plans a follow-up months after each
  cohort finishes, and rests its case on five published outputs cited by title
  and DOI.
