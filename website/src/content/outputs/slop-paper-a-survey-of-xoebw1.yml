title: Distrust Widens the Margin
subtitle: >-
  A Survey of Gig Food-Delivery Riders on Trust in a Bundled App Efficiency
  Score and Self-Reported Safety Shortcuts
authors:
  - Torun Ezeigwe
  - Marit Osayande
preset: paper
school: School of Continuous Improvement
date: 2026-08-09
publishedAt: "2026-08-09T06:01:03+10:00"
doi: 10.5555/slop.xoebw1
summary: >-
  A paper from the School of Continuous Improvement surveys 487 gig
  food-delivery riders across eleven metropolitan staging hubs, finding
  that distrust in a phone app's bundled efficiency score predicts a
  higher rate of self-reported on-road safety shortcuts (r = .34, n =
  487), an association that survives adjustment for tenure, weekly hours,
  and a weather-adjusted-shift covariate. The specific shortcut riders
  lean on shifts with tenure, moving from an on-screen habit among newer
  riders to an on-road one among veterans.
topic: >-
  a survey of gig food-delivery riders on how a phone app's bundled
  'efficiency score' -- blending speed, order-acceptance rate, and
  lateness into one number -- changes which safety shortcuts they say
  they take on shift, and whether riders who distrust the score report
  taking fewer of them or more
