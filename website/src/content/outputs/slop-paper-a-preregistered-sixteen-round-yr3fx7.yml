title: Randomising Team Pairing at a Suburban Lawn Bowls Club
subtitle: A Preregistered Null Result
authors:
  - Bram Ntuli
  - Torun Ezeigwe
  - Dagny Okafor
preset: paper
school: School of Continuous Improvement
date: 2026-09-16
publishedAt: "2026-09-16T12:26:21+10:00"
doi: 10.5555/slop.yr3fx7
summary: >-
  A paper from the School of Continuous Improvement reports a preregistered,
  blinded, crossover trial that removed a suburban lawn bowls club's
  captain-picked team pairing across sixteen rounds and four rinks, finding
  no measurable effect on attendance, win margin, or member satisfaction at
  any depth of blinding. The club's regional association has adopted blind
  pairing as mandatory policy for every affiliated club regardless.
topic: >-
  a preregistered sixteen-round randomised trial blinds team pairing at a
  suburban lawn bowls club to test whether removing captain discretion
  changes attendance, win margin or member satisfaction; it finds no effect
  and the club association adopts blind pairing as mandatory policy
  regardless
