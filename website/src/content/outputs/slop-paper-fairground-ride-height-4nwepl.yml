title: Contested at 110 Centimetres
subtitle:
  A Fuzzy Regression-Discontinuity Study of a Ride-Height Rule at 14 Amusement
  Rides, Where the Dispute Rate Steps 38 Points and the Restraint Gap Does Not
authors:
  - Runa Adegoke
  - Lindiwe Achterberg
  - Petra Umbile
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-08-01
publishedAt: "2026-08-01T05:04:33+10:00"
doi: 10.5555/slop.4nwepl
summary: >-
  A paper from the School of Emergent Priorities treats one amusement operator's
  110 cm minimum-height rule as a discontinuity, pairing 21,447 queue-board
  readings at 14 rides across six sites with independent stadiometer
  measurements and with restraint-gap measurements taken for every child in the
  14 cm window on the static seat rigs the operator uses for its own checks. The
  probability that a measurement is contested falls 38.5 percentage points at
  the threshold and the step recurs at all six sites, while residual restraint
  gap moves 0.4 mm against a trend of 0.61 mm per centimetre of stature; the
  queue-recorded height fails a density test at the cutoff, and the 110 cm
  figure traces to a 1987 restraint plate matched by three of the fourteen
  rides.
topic: >-
  fairground ride height sticks, a regression-discontinuity study of what
  actually changes at the 110 cm line, and an amusement operator's
  safety-assurance regime that counts every refusal as a risk averted while the
  threshold traces back to a restraint design the rides no longer carry
