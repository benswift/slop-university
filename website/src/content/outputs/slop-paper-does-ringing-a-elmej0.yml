title: A Single Ring at Twenty Metres, Weekday Mornings by the School Gate
subtitle: A Pre-Registered Randomised Trial of Bicycle-Bell Rings and Walkers' Lateral Movement on Eleven Shared Footpaths
authors:
  - Iben Chikere
  - Runa Adegoke
  - Dagny Okafor
preset: paper
school: School of Emergent Priorities
date: 2026-10-03
publishedAt: "2026-10-03T04:00:55+10:00"
doi: 10.5555/slop.elmej0
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement randomises 4,812 approaches from behind on eleven shared
  footpaths between a silent pass and three bell-ringing arms, and finds no
  difference in the walker's passing clearance (largest contrast 0.7 cm) or in
  whether the walker looked back. The University has entered the finding as a
  Ring Allowance: one ring per 400 m of shared footpath on each registered pool
  bicycle, counted on a sealed tally, with no override.
topic: >-
  Does ringing a bicycle bell on a shared footpath make the walker ahead move
  over any sooner?
