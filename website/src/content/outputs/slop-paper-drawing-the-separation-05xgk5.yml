summary: >-
  A planning paper from the School of Underlying Conditions and the School of
  Emergent Priorities follows one application for an ionic-liquid solvent
  recovery plant through a regional planning authority, reconstructing five
  successive drawings of its separation line from a 312-document assessment
  file and fourteen interviews. The line contracted from a 500 m radius to the
  lot boundary, re-formed as a 1.4 km overland flow corridor, and was
  conditioned as a 6.2 ha drainage polygon, moving the burden of separation
  from neighbouring residents to an unconsulted stormwater network.
topic: >-
  drawing the separation buffer for a solvent that does not evaporate: an
