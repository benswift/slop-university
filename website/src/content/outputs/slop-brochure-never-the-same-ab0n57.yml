summary: >-
  A research-showcase brochure led from the School of Continuous Improvement
  presents the University's study of moving ice, which can never be sampled
  twice: a sea-ice pressure ridge redrilled across one winter, glacier
  boreholes that stopped short of the bed, and the cores the cold laboratory
  recovers. It follows the same sampling discipline into the University's
  other schools and features seven published studies, each cited by DOI.
topic: >-
  never the same ice twice: a research showcase on studying ice that moves on
  before it can be measured again, and the methods the University builds for a
  sample that will not wait
