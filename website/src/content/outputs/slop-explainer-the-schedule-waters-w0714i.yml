summary: A research explainer from the School of Continuous Improvement on Casimir
  Beng, Mirela Hanke and Joost Nwosu’s validation study of the central quad’s occupancy-aware
  irrigation controller. It follows the lawn’s busiest zone through seven weeks of
  independent pedestrian counts and a fortnight with the sensor unplugged, and sets
  the controller’s watering beside the crowd it was installed to notice. The three
  authors describe the work in their own words.
topic: A research explainer of the validation study testing whether the central quad’s
  occupancy-aware irrigation controller responds to independently counted foot traffic
  or repeats its fixed timetable, from seven weeks of pedestrian counts across four
  irrigation zones and a two-week sensor-disconnection ablation, which found no measurable
  relationship between occupancy and suppression and no change in watering with the
  sensor removed
