summary: >-
  A research poster from the School of Continuous Improvement follows 318
  tap-line tenures across 26 licensed venues for fourteen months, censusing
  every tap board weekly against the venues' own keg delivery and return
  dockets, and models the two ways a line can end as competing outcomes. Lines
  carrying local product end in keg exhaustion in 29 per cent of cases by day
  60 against 87 per cent of lines carrying everything else (subdistribution
  hazard ratio 0.24, 95% CI 0.18 to 0.33), the balance being rotated off
  part-full. Every venue satisfied its half-of-taps local-share condition at
  each of the 41 inspections in the window, over a period in which local
  product accounted for 19 per cent of poured volume, and no venue type reached
  41 per cent local by volume.
topic: >-
  a small brewery taproom's guest tap lines, where a council licence condition
  is acquitted on the share of taps pouring local product at inspection, so a
  slow-selling local keg holds its line for months while pouring almost nothing
  --- a competing-risks survival analysis of tap tenure in which local lines end
  mostly by being rotated off unsold and non-local lines end mostly by blowing
