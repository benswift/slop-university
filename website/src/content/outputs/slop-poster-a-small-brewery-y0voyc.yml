title: The Slow Keg Holds the Line
subtitle: A Competing-Risks Analysis of Tap-Line Tenure at 26 Licensed Venues
authors:
  - Thandiwe Solberg
  - Marek Solheim
  - Ingeborg Nwachukwu
preset: research-poster
