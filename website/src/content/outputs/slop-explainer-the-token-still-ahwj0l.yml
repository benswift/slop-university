title: The Token Still Passes, Explained
subtitle: Verity Marris, Anneke Tolan and Casimir Beng on timing twelve teams' stand-ups
  to see whether a speaking token has evened out the floor
authors:
  - Verity Marris
  - Anneke Tolan
  - Casimir Beng
preset: video-explainer
school: School of Emergent Priorities
date: 2026-10-19
publishedAt: "2026-10-19T23:43:31+11:00"
doi: 10.5555/slop.ahwj0l
summary: A research explainer from the School of Emergent Priorities on Verity Marris,
  Anneke Tolan and Casimir Beng's audit of the speaking token passed at the daily
  stand-ups of twelve open-plan teams. It follows the stopwatch through 342 stand-ups,
  sets the floor time measured beside the fairness the teams report, and asks what
  the token is still for. Tolan, Marris and Beng describe the work in their own words.
topic: A research explainer of the paper auditing a hand-held speaking token at the
  daily stand-ups of twelve open-plan teams, which finds floor-time equality no better
  after four years of passing it, felt fairness running ahead of measured equality,
  and most attendees unable to say what the token was for
