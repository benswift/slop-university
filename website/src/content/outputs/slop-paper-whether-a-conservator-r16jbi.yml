title: Written on the Mend
subtitle: Treating Annotated Pressure-Sensitive Tape Repairs in a Working Collection of Second-Reading Speeches
authors:
  - Anselm Threlkeld
preset: paper
school: School of Settled Matters
date: 2026-11-09
publishedAt: "2026-11-09T19:31:20+11:00"
doi: 10.5555/slop.r16jbi
summary: >-
  A paper from the School of Settled Matters surveys the 386 pressure-sensitive
  tape repairs in the School's working collection of annotated second-reading
  speeches and finds that later readers wrote onto the tape carrier of 97,
  most often in notes that run from the sheet across the tape. It sets out a
  treatment rule that ranks the printed text first, the reading second and the
  repair third, under which 23 annotated repairs are removed after imaging, 38
  carriers are lifted and kept as separate parts, 27 repairs stay in place and
  9 decisions are recorded as deferred.
topic: >-
  whether a conservator may lift a pressure-sensitive tape repair that a later
  reader has annotated: treatment decisions for a working collection of
  annotated second-reading speeches
