summary: >-
  A marketing poster for the School of Underlying Conditions stands a figure
  before a wall of pigeonholes with a folded sheet cut to fit a single opening,
  and invites prospective students to study how a thing comes to be shaped for
  the message it receives. It directs the reader to the course catalogue and
  to two of the University's published studies of student-drawn signalling
  diagrams.
topic: >-
  A come-study recruitment ad on receptors and signalling: be what the signal
  was looking for, and study how a thing comes to be shaped to receive a message
