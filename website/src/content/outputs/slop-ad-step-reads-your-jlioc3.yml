summary: >-
  A signage campaign for STEP, the Adaptive Metrics Lab's Shoe-Traceability &
  Egress Protocol, which crosses a household shoe pair's claimed ownership
  against whether it actually leaves with somebody each morning, sorting the
  rack into four named quadrants --- Loyalist, Ghost, Opportunist, and Relic.
  The School has adopted a household's Relic count as a standing deduction
  against its Improvement Score on the Living Dashboard.
topic: >-
  although the shoe rack by the front door looks like the calmest corner of
