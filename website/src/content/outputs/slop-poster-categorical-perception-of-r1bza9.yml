doi: 10.5555/slop.r1bza9
summary: >-
  A research poster from the School of Underlying Conditions adapts the
  identification and ABX discrimination tasks of speech perception to
  one-paragraph budget summaries for a fictional member state, with deficits
  from 2.00 to 4.00% of GDP. Among 144 adults, discrimination peaked at the pair
  straddling the 3% reference value, at d′ 1.94 for readers trained in fiscal
  surveillance and 1.21 for lay readers against about 0.7 elsewhere, and
  vanished when the same deficits were stated per resident with no reference
  value given.
topic: >-
  Categorical perception of a fiscal threshold: an ABX discrimination experiment
  on whether readers hear fictional budget deficits differently either side of a
  3% reference value
