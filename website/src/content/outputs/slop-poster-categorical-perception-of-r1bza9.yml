title: Across the Line at Three
subtitle: Categorical perception of a deficit reference value in lay and trained readers
authors:
  - Vigdis Emenike
  - Kwame Lindqvist
  - Gunnhild Ekwueme
preset: research-poster
school: School of Underlying Conditions
