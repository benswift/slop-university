doi: 10.5555/slop.49hhez
summary: >-
  A research poster from the School of Emergent Priorities sorts the 64 desks of
  one open-plan floor every twenty minutes into four cells, Bunker, Decoy,
  Sentry and Lobby, by whether headphones are on and a screen is active. Once
  the register is posted, Bunker desks rise from 19% to 58% of desk-rounds while
  tasks closed per desk-week hold at 4.1, and every University open-plan floor is
  bound to a rule that no tap is lodged against a Bunker desk.
topic: >-
  an interruptibility register that sorts open-plan-office desks by headphones
  and screen into four named cells and rules on who may tap whose shoulder
