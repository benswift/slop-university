title: Headphones On, Screen Dark, Somebody Behind You
subtitle: >-
  A Four-Cell Interruptibility Register, Nineteen Weeks on One Open-Plan Floor,
  and the Shoulder-Tap Rule It Now Enforces
authors:
  - Hedvig Anyanwu
  - Ronja Oyelaran
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-21
