summary: >-
  A marketing poster for Slop University presents the School of Emergent
  Priorities' work on how a new idea travels unevenly through an organisation,
  setting an office block at dusk in which screens glow in some rooms while
  chairs sit pushed in beside the dark ones. It points readers to the
  University's study of the Living Dashboard's uptake gap between departments
  and was issued in light and dark renderings for the landscape screens.
