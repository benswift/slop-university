doi: 10.5555/slop.g0hcqu
summary: >-
  A paper from the School of Continuous Improvement runs a pre-registered,
  cluster-randomised trial of engraved staff-initial marking across eight tea
  rooms, finding no measurable reduction in shared-teaspoon loss over a
  thirteen-week term regardless of marking depth, and reports the
  University's adoption of the marking scheme as its Lost-Property
  Identification Standard on the strength of the result all the same.
topic: >-
  The tea-room's shared teaspoons, individually engraved with staff initials
  to test whether engraving cuts their disappearance rate: no measurable
  reduction over one term of counts, reported flatly, and the engraving kept
  anyway as the University's lost-property identification standard.
