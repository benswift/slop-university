summary: >-
  A paper from the School of Underlying Conditions records two seasons at the
  edge of a purpose-built teaching trench that twenty-one cohorts have
  excavated and backfilled, and classes 1,286 supervisors' questions by whether
  the supervisor could have known the answer. Over ground the design drawing no
  longer describes, supervisors still evaluated the student's reply in 38 per
  cent of sequences and climbed into the trench in 15 per cent, while students
  answered more slowly, at three times the length, and gathered when a
  supervisor got in.
topic: >-
  when the instructor stops knowing the answer: an interaction analysis of
  supervisors' questions at the edge of a purpose-built teaching trench that
  earlier cohorts have dug and backfilled until its layers are no longer the
  ones that were buried
