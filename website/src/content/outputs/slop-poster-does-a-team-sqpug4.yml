doi: 10.5555/slop.sqpug4
summary: >-
  A research poster from the School of Emergent Priorities carries an earlier
  Delphi finding, that an agreed expiry reopens once group feedback is
  withheld, to 14 stand-up teams on three open-plan floors, and does not
  reproduce it: the spread held at one day with the poker cards face down, and
  the agreed number tracked the days left to the Friday wipe. The Horizon
  Register keeps the original four-day expiry in force at all 14 teams.
topic: >-
  Does a team agree on how many days a sticky note may sit in the stand-up
  board's parking-lot column before it is binned, when the poker cards are laid
  face down instead of being turned over together? A replication, at open-plan
  offices, of the earlier finding that a panel's agreed number is made by the
  feedback rounds rather than by the thing counted, which fails to reproduce,
  and the facilities office keeps the original's rule in force on the strength
  of how often the original has been cited
