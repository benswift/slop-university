title: '"Until Friday, Obviously"'
subtitle: A Pre-Registered Replication of the Withheld-Feedback Round on the Stand-Up Board's Parking Lot, 14 Teams
authors:
  - Fenna Okoro
  - Anouk Mensah
  - Iben Chikere
