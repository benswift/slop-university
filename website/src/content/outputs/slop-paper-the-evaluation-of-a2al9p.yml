title: '"Ask Whoever Unloaded It"'
subtitle: A Failed Replication of a Supermarket Planogram-Compliance Finding in 47 Home Kitchens
authors:
  - Tove Ilesanmi
  - Thandiwe Solberg
  - Ingeborg Nwachukwu
preset: paper
school: School of Emergent Priorities
date: 2026-10-02
