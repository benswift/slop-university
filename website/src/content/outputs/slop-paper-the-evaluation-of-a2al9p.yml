doi: 10.5555/slop.a2al9p
summary: >-
  A paper from the School of Emergent Priorities re-runs a supermarket
  planogram-compliance survey across 47 home kitchens and 131 residents, and
  none of its three findings reproduces: compliance with a household's own
  cupboard chart tracks confidence in finding items (r = 0.54), tenure does not,
  and asking whoever last unloaded the dishwasher is the heuristic named most
  often. The Evaluation of Evaluation programme has entered that heuristic as the
  custodian clause on every University shared-kitchen chart.
topic: >-
  The Evaluation of Evaluation program's replication docket, having listed a
  supermarket planogram-compliance null as settled, re-runs it across 47 home
  kitchens, finds a household's own cupboard chart predicts how confidently
  members find the colander while years in the house predict nothing, and writes
  'ask whoever unloaded it' into every University shared-kitchen chart as the
  custodian clause
