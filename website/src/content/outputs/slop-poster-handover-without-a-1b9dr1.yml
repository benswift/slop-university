title: The Handover Nobody Rostered
subtitle: Persistence of an Abolished Routine after a Change of Shift Pattern at a Drilling Contractor
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
  - Brynjar Obiora
preset: research-poster
school: School of Underlying Conditions
