doi: 10.5555/slop.1b9dr1
summary: >-
  A research poster from the School of Underlying Conditions follows one
  drilling contractor for fourteen months after a move to staggered individual
  rotation removed the shift change and, with it, the handover at the rig.
  Across 212 observed crossovers the spoken elements of the abolished routine
  went on being performed at around nine crossovers in ten, the paper elements
  lapsed once a digital log took their objects, and most performances moved off
  the rig to the crib room, the ute and the camp kitchen.
topic: >-
  handover without a shift: how a drilling contractor's crews kept performing a
  handover routine after the roster change that abolished it
