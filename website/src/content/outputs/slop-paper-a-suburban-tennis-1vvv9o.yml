title: A Weighted Challenge-Ladder Algorithm Did Not Reduce Forfeits at a Suburban Tennis Club
authors:
  - Anneke Tolan
  - Anouk Mensah
  - Solveig Adeyemi
preset: paper
school: School of Emergent Priorities
date: 2026-08-31
publishedAt: "2026-08-31T10:31:15+10:00"
doi: 10.5555/slop.1vvv9o
summary: >-
  A paper from the School of Emergent Priorities and School of Continuous
  Improvement compares challenge-forfeit rates in a suburban tennis pennant
  association's fourteen ladder divisions after one division replaced its
  paper challenge board with a committee-ratified, weighted ranking
  algorithm. Across a sixteen-week season the algorithm division's forfeit
  rate is statistically indistinguishable from the paper-board divisions'
  and from its own prior-season baseline, and an ablation of the
  algorithm's participation-currency term leaves its predicted forfeit
  probability unchanged; the pennant association's committee has voted to
  extend the algorithm to all fourteen divisions regardless.
topic: >-
  a suburban tennis club's ladder secretary replaces the paper challenge
  board with a committee-ratified, formally weighted ranking algorithm; a
  season-long study finds no change in the challenge-forfeit rate, and the
  committee extends the charter to the club's other competitions regardless
