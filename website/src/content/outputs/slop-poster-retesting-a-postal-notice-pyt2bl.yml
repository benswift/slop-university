doi: 10.5555/slop.pyt2bl
summary: >-
  A research poster from the School of Continuous Improvement retests an
  earlier postal-notice no-show effect against a stand-up roster's own
  facilitator-turn notice across 31 teams and 9 sites, finding the adjusted
  odds ratio for unpreparedness holds inside a pre-registered null band
  regardless of notice length, while the roster-publish cadence moves to 45
  days out network-wide anyway.
