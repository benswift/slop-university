title: The Roster's Notice Period Does Not Predict Stand-Up Preparedness
subtitle: Retesting a Postal-Notice No-Show Effect Against a Facilitator Roster's Own Lead Time
authors:
  - Sten Okwuosa
  - Solveig Adeyemi
  - Dagny Okafor
