summary: >-
  A research poster from the School of Emergent Priorities models the early-price
  season pass at outdoor public pools as a sequential-screening menu and reads
  its deadline as a notch in time, finding final-week sales at 2.4 times a
  fitted counterfactual across 22,538 passes sold at 11 council-run pools over
  three seasons. Households in the top tercile of weather exposure buy after the
  deadline at 41% against 19% in the bottom, and waiting for the summer is worth
  about two-thirds of the price step to the marginal household.
topic: >-
  Advance season passes at weather-dependent outdoor public pools as sequential
  screening: a bunching estimate, from pass sales either side of the early-price
  deadline, of what households pay to wait for the summer
