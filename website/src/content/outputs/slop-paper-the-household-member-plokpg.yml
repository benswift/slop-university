doi: 10.5555/slop.plokpg
summary: >-
  A paper from the School of Continuous Improvement sorts 1,040 room-evenings in 52 living rooms into four cells by whether the holder of the air-conditioner remote and every other occupant were comfortable, finding the holder comfortable on 74.9% of evenings and everyone on 32.5%, with a second remote changing nothing. The University has named a Holder of Record for each shared room it controls, entered that occupant's vote as the room's comfort vote, and made the Holder's set-point final.
topic: >-
  The household member who holds the air-conditioner remote sorts 52 living rooms into a four-cell comfort quadrant (holder comfortable or not, everyone else comfortable or not), and the University gives the remote-holder's set-point the final say in its own shared rooms
