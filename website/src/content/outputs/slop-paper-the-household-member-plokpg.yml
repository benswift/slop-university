title: Notes on Whose Weather It Is
subtitle: A Four-Cell Comfort Quadrant for 52 Living Rooms
authors:
  - Solveig Adeyemi
  - Torun Ezeigwe
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
