summary: >-
  A marketing poster for the Futures in Committee seminar series stages a
  new starter tracing a laminated org chart's reporting line toward a
  doorway that already belongs to someone else, as the pitch for a program
  built to notice how long an institutional record keeps pointing at a
  reality that's moved on.
topic: >-
  auditing how long an office's printed org chart pinned up near the lift
  keeps pointing new starters toward a manager who's since moved teams, and
  whether redrawing it is anyone's actual job or it just gets re-laminated
  with the same names at the next refresh
