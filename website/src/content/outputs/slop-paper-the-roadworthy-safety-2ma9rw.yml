summary: >-
  A paper from the School of Continuous Improvement reports eleven months of the
  Inspection Capture Record, a tablet instrument the University built with a
  state vehicle-inspection authority and put into service at 19 independent
  workshops, covering 34 licensed testers, 12,412 inspections and 583,364 item
  observations. The instrument will not submit a record until every one of the
  schedule's 47 items holds a state, and none posted incomplete, against a
  paper-era rate of 11.4 per cent of worksheets returned with at least one item
  blank. Its own interaction timestamps qualify that result: median dwell per
  item is 3.1 seconds, 18.6 per cent of item states are entered in under one
  second, and 14.2 per cent of inspections contain a burst in which five or more
  items acquire a state inside two seconds, 71.3 per cent of those states
  falling in the final tenth of session time. Over the same window the share of
  defects filed under the residual code rises from 6.1 to 19.7 per cent at a
  median attached note of four characters. The authority has adopted the
  instrument's monthly export as the input to its tester-audit process.
topic: >-
  the roadworthy safety inspection a used car gets before it can be sold, where
  the University built and deployed a tablet checklist instrument to licensed
  testers across suburban workshops and reports eleven months of it in service
  --- and the submission gate that makes every record complete is also what
  produces the bursts of items stated five at a time in under two seconds
