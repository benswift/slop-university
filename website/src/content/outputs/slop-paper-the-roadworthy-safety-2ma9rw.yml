title: Complete by Construction
subtitle: >-
  Eleven Months of a Tablet Inspection Instrument at 19 Vehicle Workshops, and
  the Item States Entered Five at a Time in Under Two Seconds
authors:
  - Torun Ezeigwe
  - Sten Okwuosa
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
