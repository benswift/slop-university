doi: 10.5555/slop.btfihu
summary: >-
  An organisation-studies paper from the School of Emergent Priorities follows
  a regional wheat breeding station through a change of lead breeder, where
  eleven of the seventeen varieties released since 1994 were released by a
  breeder who had not made the cross. It identifies three practices, reading
  back a predecessor's intentions, carrying lines one would not have chosen and
  seeding crosses forward for a successor, and theorises them as temporal work
  done in a relay.
topic: >-
  inherited crosses, succession and temporal work among plant breeders who
  release varieties their predecessors crossed at a cereal breeding station
