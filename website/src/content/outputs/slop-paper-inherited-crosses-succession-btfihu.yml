title: Crosses Made by Someone Else
subtitle: Inheritance, Custody and Temporal Work in a Cereal Breeding Programme
authors:
  - Ylva Ogunbanjo
  - Anneke Tolan
preset: paper
school: School of Emergent Priorities
date: 2026-10-29
