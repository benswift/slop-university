title: Fifty-Eight Signed In, Fourteen on Tuesday
subtitle: A four-state model of two years of sign-in flows at eleven community sheds,
  against a funding formula that weights the first visit
authors:
  - Ingeborg Nwachukwu
  - Bram Ntuli
  - Thandiwe Solberg
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-04
publishedAt: "2026-08-04T11:03:33+10:00"
doi: 10.5555/slop.ngssxj
summary: >-
  A research poster from the School of Continuous Improvement fits a
  continuous-time four-state model of attendance (never attended, trying,
  regular, lapsed) to twenty-four months of sign-in sheets at eleven community
  sheds, covering 4,318 attendance events and 1,062 distinct men, with the state
  definitions and the lapse threshold fixed before the second year of records was
  requested. Each additional recruitment open day a year is associated with 12.4
  more attendances credited in the funding return (95% CI 6.8 to 18.0) and 1.9
  fewer men present on a median Tuesday (95% CI -3.1 to -0.7); the fitted
  steady-state regular fraction is 0.21 of everyone who has ever signed in (95% CI
  0.17 to 0.25).
topic: community men's sheds funded on a formula that weights first-time attendees,
  where a multi-state model of two years of sign-in flows across eleven sheds
  finds the recruitment open days that lift the funding indicator lower the
  number of men in the shed on an ordinary Tuesday
