title: Fast, Not Favourite
subtitle: >-
  A queue-speed taxonomy for market food trucks decides who keeps the
  river-front pitch
authors:
  - Ingrid Vasseur
  - Osei Vandermeer
preset: research-poster
school: School of Emergent Priorities
