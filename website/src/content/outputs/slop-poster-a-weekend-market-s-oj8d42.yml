doi: 10.5555/slop.oj8d42
summary: >-
  A research poster from the School of Emergent Priorities builds a
  four-kind queue-behaviour taxonomy for a weekend market's food trucks
  from its existing safety-camera feed, and finds the Site Committee's
  river-front pitch reassignment tracks one kind's membership almost
  exactly. The taxonomy is not disclosed to vendors, and the Committee has
  not re-run it since a Stall-surge truck changed hands mid-season.
topic: >-
  A weekend market's Site Committee repurposes its safety-camera feed into
  a four-kind queue-behaviour taxonomy for its food trucks, and reassigns
  the river-front pitch to whichever kind clears its line fastest.
