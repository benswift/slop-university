title: The Certificate and the Desk
subtitle: >-
  Five Years of Capability Sprint Completions Measured Against What Changed
  at a Desk
authors:
  - Ingeborg Nwachukwu
  - Thandiwe Solberg
  - Torun Ezeigwe
  - Bram Ntuli
preset: impact-report
school: School of Continuous Improvement
date: 2026-08-08
publishedAt: 2026-08-08T12:01:03+10:00
doi: 10.5555/slop.yk6ulh
summary: >-
  A School of Continuous Improvement Impact Report follows five years of
  Capability Sprint cohorts across four strands, comparing what graduates
  reported changing within 30 days of completion against what a
  twelve-month follow-up interview could still confirm, and finds the
  redesigned meeting formats, dashboard habits, and indicator retirements
  holding in some partner sectors and quietly reverting in others.
topic: >-
  five years of Capability Sprint completions, told through what
  participants actually changed at their desks afterwards rather than
  through the completion count
