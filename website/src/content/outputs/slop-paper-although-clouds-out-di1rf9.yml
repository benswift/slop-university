title: Towards a clouds-out register
subtitle: >-
  Although packing the scope is sold as a courtesy, amateur astronomers
  describe it as the last remaining stop
authors:
  - Casimir Beng
  - Anneke Tolan
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-09-23
publishedAt: "2026-09-23T09:02:04+10:00"
doi: 10.5555/slop.di1rf9
summary: >-
  A paper from the School of Continuous Improvement interviews 94 members of
  28 suburban astronomy societies about packing the telescope, coded in
  participants' terms into four kinds of stop-talk --- clouds-out, dew's won,
  we've lost it, and that's us --- and reports the Indicator Commons' adoption
  of three of those phrases as the only admissible codes on a published
  pack-down register that now indexes Community Research Partner standing.
topic: >-
  Although clouds-out is sold as a courtesy call, amateur astronomers describe
  packing the scope as the last remaining way a session can still be stopped,
  and observatory-night standing is bound to a published pack-down register
