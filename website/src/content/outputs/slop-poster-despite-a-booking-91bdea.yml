title: Auto-Publishing the Verdict
subtitle: >-
  A Confidence-Scored Arbitration Engine for Short-Stay Review Disputes
authors:
  - Joost Nwosu
  - Osei Vandermeer
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-13
publishedAt: "2026-09-13T04:32:28+10:00"
doi: 10.5555/slop.91bdea
summary: >-
  A research poster from the School of Continuous Improvement builds an
  arbitration engine that scores the evidence behind a disputed short-stay
  booking review and auto-publishes a resolution once the score clears a
  pre-registered confidence threshold, and reports that the threshold was
  lowered once, under moderator backlog, and has stood unrevised since.
topic: >-
  Despite a booking platform's built-in review-dispute mediation, hosts and
  guests still wait weeks for resolution — an arbitration engine that scores
  each side's evidence and auto-publishes a decision once a confidence
  threshold is met
