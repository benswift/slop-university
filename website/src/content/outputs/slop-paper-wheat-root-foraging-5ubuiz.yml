title: What the Surveyor Put Back
subtitle: Root Foraging and Phosphorus Uptake of Wheat above Backfilled Soil-Survey Pits, Twenty-Two Years On
authors:
  - Brynjar Obiora
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-11-07
