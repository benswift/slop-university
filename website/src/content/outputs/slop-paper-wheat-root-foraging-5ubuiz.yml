doi: 10.5555/slop.5ubuiz
summary: >-
  A paper from the School of Underlying Conditions relocates 11 of the 14 pits a
  regional soil survey dug and refilled 22 years earlier in one dryland wheat
  paddock, reads each pit's backfill order from push-tube cores, and follows the
  crop above it through one season. Pits refilled topsoil-up root deeper and take
  up 1.8 kg P ha⁻¹ more shoot phosphorus by anthesis than the undisturbed soil
  beside them; pits refilled clay-up lose a quarter of their plants and half
  their seedling uptake, then overtake their controls once roots reach the
  topsoil buried at 30–60 cm.
topic: >-
  wheat root foraging and phosphorus uptake above backfilled soil-survey pits in
  a cropped paddock
