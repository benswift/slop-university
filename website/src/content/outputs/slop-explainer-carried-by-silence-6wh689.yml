title: Carried by Silence, Explained
subtitle: Ylva Onyekwere on how a group chat settles its plans by not replying, and
  why what turns up on the day is what somebody put their name to
authors:
  - Ylva Onyekwere
preset: video-explainer
school: School of Emergent Priorities
date: 2026-10-19
publishedAt: "2026-10-19T21:47:27+11:00"
doi: 10.5555/slop.6wh689
summary: A research explainer from the School of Emergent Priorities on Ylva Onyekwere's
  doctoral thesis about the group chats that plan barbecues, birthday parties and
  working bees. It follows one barbecue's chat from a proposal with two thumbs under
  it to a park at two o'clock, and sets the census of 318 donated chats beside the
  46 occasions she attended with the plan printed as a checklist. The School's Lapse
  Standard closes it, and Onyekwere describes the census and her argument herself.
topic: A research explainer of the doctoral thesis on how the group chats that plan
  shared occasions decide, from a census of every proposal in 318 donated chats and
  46 occasions attended with the plan printed as a checklist, finding that 88.1 per
  cent of what became the plan was carried by lapse on a median of two thumbs whether
  the chat had five members or twenty, and that an item claimed by its bringer arrived
  93.3 per cent of the time against 31.2 for an item with no name on it, and closing
  on the School's Lapse Standard for its committees
