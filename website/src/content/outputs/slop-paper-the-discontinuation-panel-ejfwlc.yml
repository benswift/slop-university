title: Towards a Closed File
subtitle: >-
  A Teaching Case on the Four-Year Floor a Shire Council Requires Before an
  Ended Parking Scheme May Be Filed as Ended
authors:
  - Marek Solheim
  - Verity Marris
  - Ingrid Vasseur
  - Renke Sabel
preset: paper
school: School of Emergent Priorities
date: 2026-09-04
publishedAt: "2026-09-04T22:34:15+10:00"
doi: 10.5555/slop.ejfwlc
summary: >-
  A paper from the School of Emergent Priorities follows a shire council's
  Program Discontinuation Panel and the fixed four-year floor it holds every
  winding-down program to before a file may be reclassified as closed,
  tracing the gap between an on-street parking permit scheme's actual end
  and its record's across the Panel's full 68-program portfolio. Offered as
  a single-site case study with an accompanying teaching note for
  public-administration training.
topic: >-
  the Discontinuation Panel holds a shire's since-ended on-street
  residential parking permit scheme at "under review" for a mandatory
  four-year floor before its file may enter the Register of Closed
  Programs, and Marek Solheim leads a single-site teaching case, complete
  with teaching note, following the paperwork that keeps moving long after
  the permits stopped
