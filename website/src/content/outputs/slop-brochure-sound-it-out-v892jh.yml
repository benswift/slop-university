summary: >-
  A case-for-support brochure from the School of Underlying Conditions invites
  partners and supporters to stand behind two laboratory instruments: an
  ultrasonic bench, where a pulse of sound is timed across a stick of drill
  core without cutting it, and a cleaning bath, where cavitation lifts drilling
  mud from a sample before it reaches the microscope. It sets out the work
  done at each, the company the bench keeps across the University's schools,
  and seven published studies cited by title and DOI.
