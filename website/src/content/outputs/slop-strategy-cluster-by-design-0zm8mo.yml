summary: >-
  Slop University's Strategic Plan 2026-2031 regroups the University's schools,
  laboratories, programs, initiatives and service functions into co-located
  clusters, each run on one platform connected to a shared digital spine,
  served through a single front door and governed by a cluster council under a
  performance compact. It leaves the number and boundaries of the clusters to a
  foundation-year review, and requires every target a cluster meets to be
  retired, restated or recorded as a floor.
