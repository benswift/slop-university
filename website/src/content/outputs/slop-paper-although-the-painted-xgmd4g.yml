doi: 10.5555/slop.xgmd4g
summary: >-
  A paper from the School of Continuous Improvement describes the Edge Counter,
  a rail of twin-beam infrared modules laid along the painted line at nine
  suburban platforms and gated by the arriving train's door chimes, and reports
  fourteen weeks and 64,208 arrivals. Crossings before the doors open fall from
  4.0 to 0.4 per 100 arrivals once the staff transit allowance is withheld at
  any station whose counter logged a crossing in the preceding fortnight, while
  crossings after the closing chime rise from 0.6 to 1.9 and median door-open
  dwell lengthens from 38 s to 47 s; the allowance is released at none of 18
  station-fortnights, and the beam gap changes nothing.
topic: Although the painted yellow line at a suburban railway platform edge has never been asked to count anything, a twin-beam edge counter was built and fitted to nine platforms to log every crossing of the line as a train arrives, and the staff transit allowance is now withheld at any station whose counter logged a crossing in the preceding fortnight
