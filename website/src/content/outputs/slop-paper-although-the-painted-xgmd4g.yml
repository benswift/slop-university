title: Stood Back, Missed It
subtitle: An Infrared Edge Counter for the Platform Line, and the Transit Allowance That Now Follows Its Count
authors:
  - Eivind Onwuka
  - Thandiwe Solberg
  - Sten Okwuosa
preset: paper
school: School of Continuous Improvement
