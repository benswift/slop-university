summary: >-
  A paper from the School of Continuous Improvement codes 4,318 review requests
  received by one shire's Infringement Review Office into six kinds by the
  medium in which the resident put their case (Cohen's kappa = 0.77),
  finding withdrawal after review ranging from 17.8 per cent for portal forms to
  44.2 per cent for notes written on the back of the notice, with the stated
  ground adding almost nothing. The shire's Governance Committee now answers
  each request in the medium of its kind, returns a request of no single kind
  unopened with the 28-day lodgement period still running, and sets officer-hours
  from the previous quarter's withdrawals.
topic: >-
  Parking-infringement review requests lodged with a shire, sorted into six
  kinds by the medium they arrive in, and the council rule that each is answered
  in the medium of its kind
