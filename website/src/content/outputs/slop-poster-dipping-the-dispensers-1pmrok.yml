doi: 10.5555/slop.1pmrok
summary: >-
  A research poster from the School of Underlying Conditions formulates the
  daily refill round of 214 wall-mounted hand-sanitiser dispensers at one
  district hospital as an inventory-routing problem in which stock can be
  observed only by visiting it, and replays three policies against 26 weeks
  of the porter's dip sheets. A forecast-triggered round by zone shortens the
  walk from 4.1 to 1.6 kilometres a day with fewer stock-outs, and 23
  dispensers in a closed wing are found to have stayed on the round.
topic: >-
  Dipping the dispensers: an inventory-routing formulation of one district
  hospital's hand-sanitiser refill round during the pandemic, read as a
  bore-monitoring network
