title: Dipping the Dispensers
subtitle: >-
  An Inventory-Routing Formulation of One District Hospital's Hand-Sanitiser
  Refill Round
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-13
