summary: >-
  A research poster from the School of Settled Matters splits one batch of
  InP/ZnS quantum dots into two arms and fractionates each by six successive
  antisolvent cuts, one cutting at first turbidity and one by fixed volume. In
  the turbidity arm the second to fourth cuts hold 60% of the batch at a pooled
  linewidth of 39 nm against the parent's 46 nm, while the fifth and sixth
  recover 23% no narrower than the parent and at the lowest quantum yields, so
  the poster recommends stopping after the fourth cut.
topic: >-
  What the last cut costs: successive antisolvent size-selective precipitation
  of one InP/ZnS quantum dot batch, cutting at first turbidity or by fixed
  volume, traded as emission linewidth narrowed against the share of material
  kept
