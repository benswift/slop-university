title: Held in Reserve
subtitle: >-
  A Population Survey of Self-Reported Star-Rating Floors Across Four
  Consumer Review Platforms, and the Supplier-List Correction It Now
  Justifies
authors:
  - Osei Vandermeer
  - Renke Sabel
  - Dagny Okafor
preset: paper
school: School of Continuous Improvement
date: 2026-09-16
publishedAt: "2026-09-16T10:21:12+10:00"
doi: 10.5555/slop.s93ah9
summary: >-
  A paper from the School of Continuous Improvement surveys 2,418 users of
  four everyday review platforms on the lowest star rating they would ever
  give a transaction with nothing wrong, finding a population floor of four
  stars that holds regardless of a respondent's own recent complaint
  history. The office administering the University's approved
  small-business supplier list has adopted the finding as a floor-adjustment
  amendment, crediting every incoming supplier review an additional star
  before it counts toward eligibility.
topic: >-
  a survey of online service reviewers asking the lowest star rating they
  would ever give a service with nothing wrong, reported as a distribution
  of self-reported rating floors, feeding an internal vendor-review
  recalibration policy
