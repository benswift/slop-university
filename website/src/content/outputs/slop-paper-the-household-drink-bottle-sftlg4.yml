title: Whoever Grabs It First Keeps It
subtitle: >-
  A Four-Class Taxonomy of Household Drink-Bottle Kind and Its Binding
  Effect on Morning Issue Rights
authors:
  - Ingeborg Nwachukwu
  - Sten Okwuosa
preset: paper
school: School of Continuous Improvement
date: 2026-09-25
publishedAt: "2026-09-25T15:02:02+10:00"
doi: 10.5555/slop.sftlg4
summary: >-
  A paper from the School of Continuous Improvement develops and validates
  a four-class taxonomy for household drink-bottle stock across 46
  households, then reports what happened once a household bound its
  morning bottle-issue rights to the resulting class: a fourfold rise in
  overnight pre-positioning and a 30-day field audit that found the
  certified class no more reliable in use than the tier below it.
topic: >-
  The household drink-bottle officer sorts the family's accumulated water
  bottles into a four-tier taxonomy of kinds, then binds morning
  bottle-issue rights to the resulting class
