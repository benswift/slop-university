doi: 10.5555/slop.i8hjc6
summary: >-
  A paper from the School of Continuous Improvement follows eleven calibration
  engineers and test-cell operators through 41 spark-timing sweeps at three
  facilities, finding that the call to back the spark off is usually made by
  ear, taught in pairs at the control-room glass, and written up afterwards in
  the cylinder-pressure trace. In a replay study with nine participants, cell
  audio and a sonified display probe both brought knock-onset calls earlier and
  into closer agreement than the trace alone, though the most experienced
  listeners turned the probe down.
topic: >-
  listening for knock: how engine test-cell calibrators combine what they hear
  with the cylinder-pressure trace during spark-timing sweeps, and a sonified
  display probe
