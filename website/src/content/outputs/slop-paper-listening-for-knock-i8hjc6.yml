title: An Ear on the Cylinder
subtitle: Listening, Looking and Calling Knock Onset in Engine Calibration Test Cells
authors:
  - Dagny Okafor
  - Mirela Hanke
  - Edda Nwafor
preset: paper
school: School of Continuous Improvement
