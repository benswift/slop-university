summary: >-
  A poster from the School of Emergent Priorities pre-registers a direct
  replication of an earlier casual-shift rostering platform's test-retest
  instability finding, this time on a structurally similar instrument at a
  22-site aged-care provider. Where the original drifted by close to ten
  points a run, the replication returns near-perfect reliability
  (ICC = 0.97), traced to roster coordinators rounding overnight
  staff-to-resident ratios up to the exact band an internal accreditation
  panel now treats as a pass/fail line with no override.
topic: >-
  Although an earlier Slop University finding showed a casual-shift
  rostering platform's fairness-compliance score drifting on unchanged
  re-submitted data, a pre-registered replication of that same test-retest
  design on a multi-site aged-care provider's shift roster instead finds
  the score reproducing almost perfectly, once roster coordinators start
  rounding shift inputs to the band an internal accreditation panel now
  treats as a pass/fail line.
