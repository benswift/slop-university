title: Towards a Compliance Score That Holds
subtitle: Replicating a Rostering Fairness Instrument in a Multi-Site Aged-Care Setting
authors:
  - Verity Marris
  - Marit Osayande
  - Runa Adegoke
preset: research-poster
school: School of Emergent Priorities
