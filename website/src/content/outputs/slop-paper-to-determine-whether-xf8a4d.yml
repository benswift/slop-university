title: Streamers under the honour board
subtitle: >-
  A regression-discontinuity study of the two-working-bee cutoff for Saturday
  clubrooms hire
authors:
  - Hedvig Anyanwu
  - Ronja Oyelaran
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-09-23
publishedAt: "2026-09-23T01:00:13+10:00"
doi: 10.5555/slop.xf8a4d
summary: >-
  A paper from the School of Emergent Priorities treats a suburban sports
  club's published two-working-bee rule for Saturday clubrooms hire as a
  6-hour fridge-sheet cutoff. Remainder-season hire jumps 28 points at the
  line and next-bee attendance falls 22; the Club Affiliation Schedule now
  counts hire nights as the community-engagement output and requires a
  photographed same-day working bee before the rooms are unlocked.
topic: >-
  To determine whether the suburban sports club's two-working-bee cutoff for
  clubrooms hire causes members just above the threshold to book the rooms
  and miss the next bee
