title: Loyalty-Card Pledges Promise More Than Operators Actually Deliver
subtitle: A Drift Survey of Daily Priorities Across 214 Shop Operators
authors:
  - Runa Adegoke
  - Torun Ezeigwe
  - Casimir Beng
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-08
publishedAt: "2026-09-08T09:05:15+10:00"
doi: 10.5555/slop.c2oltu
summary: >-
  A research poster from the School of Emergent Priorities surveys 214
  supermarket, strip-mall, and food-truck operators, scoring the pledge
  language printed on their loyalty cards, receipts, and signage against
  their own self-ranked daily priorities. The resulting drift distributes
  differently by venue type, and the University now caps any
  University-affiliated shopfront pledge at its own venue type's
  60th-percentile observed priority.
topic: >-
  Although loyalty-card pledges promise identical treatment at every till, a
  survey of supermarket, strip-mall, and food-truck operators finds their own
  stated daily priorities distributed unevenly across venue types -- and the
  University orders the pledges rewritten down to match observed practice,
  not up to meet the promise.
