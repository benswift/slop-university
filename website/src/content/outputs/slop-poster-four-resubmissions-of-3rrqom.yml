title: What Actually Approved the Plan?
subtitle: >-
  A Single-Site Case Study of a Shire's Rates-Hardship File, Read as a
  Teaching Case for New Officers
authors:
  - Lindiwe Achterberg
  - Ronja Oyelaran
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-06
