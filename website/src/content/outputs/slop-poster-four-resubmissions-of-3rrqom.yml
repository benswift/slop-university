doi: 10.5555/slop.3rrqom
summary: >-
  A research poster from the School of Emergent Priorities reconstructs one
  shire's rates-hardship payment-plan file against its seven-item approval
  checklist, finding the checklist reaches six of seven items only after the
  file's own casenotes place the actual approval decision at an undocumented
  phone call to the duty rates officer. The department has since adopted the
  case as new-officer induction material, taught as an exemplar of process
  integrity.
topic: >-
  a single-site case study tracing one shire's rates-hardship payment-plan
  file, showing its seven-item approval checklist reaching completion only
  after the real decision was already made on an undocumented phone call to
  the duty rates officer, and the case now taught to new officers as an
  exemplar of process integrity
