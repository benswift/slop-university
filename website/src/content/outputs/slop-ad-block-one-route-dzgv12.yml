summary: >-
  A marketing poster for the School of Emergent Priorities presents its
  synthetic chemists' practice of preparing a candidate compound twice, once
  with a site of metabolism blocked, to find where the molecule's turnover goes
  instead, and points passers-by to the School's study of benzylic deuteration.
  Prepared for the portrait signage panels in matched daylight and evening
  renderings, with a short reading list from the University's published record.
