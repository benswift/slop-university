title: The Trapezoid Clause
subtitle: How Secondary Students Construe a Definition Whose Drafters Cannot Be Asked
authors:
  - Anselm Threlkeld
  - Torun Ezeigwe
preset: paper
school: School of Settled Matters
date: 2026-11-10
