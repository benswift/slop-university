summary: >-
  A research poster from the School of Continuous Improvement walks through
  the homes of 64 bereaved adults and catalogues 287 tasks a partner, parent
  or sibling left part-way, from a jumper on its needles to a bed half dug.
  Most were kept as left or cleared; a task with someone waiting on it was
  completed in 61% of cases against 14% without, and handiwork and an open
  book went a median of four to five months before anyone touched them.
topic: >-
  the half-finished things: how bereaved adults decide whether to complete,
  keep or clear the tasks a dead relative left undone
