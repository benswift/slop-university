title: The Week the Cage Wash Stopped
subtitle: Facility Incident Records and Spontaneous Diabetes Onset across Eleven Birth Years of an In-House NOD Mouse Colony
authors:
  - Marit Osayande
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-10-21
publishedAt: "2026-10-21T22:01:55+11:00"
doi: 10.5555/slop.22pvln
summary: >-
  A paper from the School of Continuous Improvement links eleven birth years of
  an in-house NOD mouse colony's monitoring records to 1,122 entries in the
  animal facility's incident log. Among 1,146 female monitors, none of eight
  routine event categories moved the onset of autoimmune diabetes; incidence
  rose after the colony's move to a barrier suite, and sixteen litters whose
  first weeks spanned an eleven-day cage-wash outage reached 49.2 per cent
  against 77.0 per cent in the litters around them.
topic: >-
  the animal house's own incident log read against spontaneous diabetes onset
  in a non-obese diabetic mouse colony: eleven years of husbandry disruptions
  and autoimmune incidence by birth cohort
