summary: >-
  A research poster from the School of Underlying Conditions follows nine
  bottles of ammonium heptamolybdate reagent through fourteen months in a
  laboratory cupboard and two sampling-vehicle gloveboxes, and finds that the
  glovebox bottles lost water of crystallisation in steps that fall in the
  hottest weeks rather than steadily with age. The bottles in the hotter
  glovebox also developed a second crystalline phase, while recovery of a
  phosphate standard stayed within 97–101 per cent for every bottle.
topic: >-
  thermal cycling in a field vehicle's glovebox: hydrate loss and
  heptamolybdate integrity of the ammonium molybdate reagent carried on
  groundwater sampling rounds
