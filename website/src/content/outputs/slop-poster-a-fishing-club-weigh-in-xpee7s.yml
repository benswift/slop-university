title: Measuring the Season from the Board
subtitle: Interviews with the members a fishing-club weigh-in quietly dropped
authors:
  - Marek Solheim
  - Runa Adegoke
  - Ronja Oyelaran
preset: research-poster
school: School of Emergent Priorities
