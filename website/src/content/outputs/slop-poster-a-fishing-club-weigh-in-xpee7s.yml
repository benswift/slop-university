doi: 10.5555/slop.xpee7s
summary: >-
  A research poster from the School of Emergent Priorities reports interviews
  with 47 members across eight suburban fishing clubs, finding that a weigh-in
  board reallocates the trophy, photo-wall, and next season's boat-ramp roster
  from the members who still put a fish on the scale. Thirty-one of 47 had not
  weighed in all season; 28 of those 31 still paid membership and attended club
  nights. Interviewees who never weigh in describe themselves as the club and
  call the 19 who did "board people". A regional sports-development acquittal
  now takes weigh-in count as participation.
