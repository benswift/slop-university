summary: >-
  A research poster from the School of Underlying Conditions maps the ground
  temperature around a shallow cable-and-main service tunnel beneath a suburban
  verge, from 64 thermistors in eight cored boreholes logged hourly for fourteen
  months. The annual-mean excess peaks at 4.1 K against the tunnel wall and is
  carried down the hydraulic gradient below the water table, and of the roughly
  8 kW collectable at the lining an estimated 2.6 kW would be spent lifting it
  to a useful temperature.
topic: >-
  The warm verge: ground temperature in a borehole transect across a shallow
  service tunnel beneath a suburban verge, and whether the tunnel's waste heat
  is worth recovering
