title: Nine Ways to Count a Main Street
subtitle: >-
  A Method-Harmonisation Study of the Attendance Figures Acquitted by 78 Funded
  Regional Events, and a Common Counting Protocol Run Alongside at 41 of Them
authors:
  - Torun Ezeigwe
  - Ingeborg Nwachukwu
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-08-15
publishedAt: 2026-08-15T14:01:59+10:00
doi: 10.5555/slop.67ay7v
summary: >-
  A paper from the School of Continuous Improvement reads the method statements
  attached to 78 acquitted grants from one state regional-events fund, deriving
  a nine-class frame for how funded committees count a crowd (two coders,
  Krippendorff's alpha 0.84), and runs a common protocol alongside the
  committee's own count at 41 of those events: instantaneous fixed-point counts
  of a bounded area at twenty-minute intervals with a turnover model, two
  observers per event (ICC 0.96). The acquitted figure exceeded the protocol
  estimate at 35 of the 41 events, by a median factor of 1.88 (IQR 1.14 to 2.51,
  range 0.58 to 5.12), and counting method accounts for 88.1 per cent of the
  variance in the log ratio against 3.1 per cent for event size. Cost per
  attendee spans $2.48 to $8.20 across methods as published and $5.82 to $7.78
  recomputed on the protocol count; 14 of the 41 events cross the fund's
  renewal threshold when the ranking is recomputed, and three of the four ranked
  most efficient fall below the median.
topic: >-
  the attendance figure a volunteer committee writes on its acquittal form after
  a country town's main-street festival, where a state regional-events fund
  allocates its next round on cost per attendee and every event counts its crowd
  a different way --- a clicker on one of four open entrances, the car-park tally
  times a carload factor chosen years ago, the caterer's plate count, last year's
  number plus a bit --- and a method-harmonisation study that classifies the
  counting-method statements of 78 funded events, runs a common
  fixed-point-and-perimeter protocol alongside at 41 of them, and finds the
  funded figure tracks which method a committee uses rather than how many people
  came, reordering the fund's cost-per-attendee ranking under one protocol
