title: Behind the Water Table
subtitle: Threshold and Lag in Canopy Cover Loss across Five Airborne LiDAR Surveys of a Floodplain Woodland
authors:
  - Vigdis Emenike
  - Mirela Hanke
preset: paper
school: School of Underlying Conditions
date: 2026-11-22
publishedAt: "2026-11-22T06:31:28+11:00"
doi: 10.5555/slop.a9vre0
summary: >-
  A paper from the School of Underlying Conditions and the School of Continuous
  Improvement sets five airborne LiDAR surveys of a 2,380 ha floodplain eucalypt
  woodland, flown three years apart from 2012 to 2024, against fifteen years of
  quarterly dips at 38 monitoring bores. Canopy cover held steady wherever the
  water table stayed shallower than 9.4 m and fell by 3.9 percentage points for
  each further metre beyond it, with the loss arriving 2.75 to 6.25 years after
  the water table that caused it.
topic: >-
  Repeat airborne LiDAR canopy height over a groundwater-dependent river red gum
  woodland read against its monitoring-bore network, finding crown loss tracks
  depth to water table only once the water table falls below a threshold depth,
  and then with a lag of several years
