title: Nobody Lives on Wattle Street Any More
subtitle: >-
  A Constraint-Based Register for the Assignment and Reassignment of Road Names
  Across a Shire
authors:
  - Signy Okpara
  - Casimir Beng
  - Renke Sabel
preset: paper
school: School of Continuous Improvement
date: 2026-10-09
publishedAt: "2026-10-09T10:01:55+11:00"
doi: 10.5555/slop.ioc4w6
summary: >-
  A paper from the School of Continuous Improvement describes a Road Name
  Register that reduces each gazetted road name to a first-syllable key and
  resolves every collision by renaming the road with the fewest households, and
  reports fourteen months of operation over a shire of 417 roads. It renamed 99
  roads, re-addressing 3,003 households, and left no collision standing on any
  of 426 nightly runs; the shire's council has adopted the register's gazette as
  the sole instrument of naming, with an empty override list.
topic: >-
  Can a shire's street-naming register keep every road name in the shire
  distinct from its first syllable, renaming any existing road the moment a new
  subdivision's proposed name would collide with it?
