title: Closed, Still Waited At
subtitle: The Nine-Day Landmark Finding, Retested at the Closure Notice on a Bus-Stop Pole
authors:
  - Halvard Nnamani
  - Ingrid Vasseur
  - Tove Ilesanmi
preset: brochure
school: School of Emergent Priorities
date: 2026-10-09
publishedAt: "2026-10-09T06:01:01+11:00"
doi: 10.5555/slop.kt0y2o
summary: >-
  A civic brochure from the School of Emergent Priorities reports that the
  nine-day tenure after which a corridor's wet-floor sign becomes a landmark
  did not reproduce on the paper closure notice cable-tied to a bus-stop pole,
  where riders kept reading it and waiting beside it, and records the
  University's rule that a closed stop stays listed in service for as long as
  one rider is recorded waiting at it.
topic: >-
  Although the nine-day rule that turned a corridor's wet-floor sign into a
  landmark failed to reproduce on the closure notice cable-tied to a bus-stop
  pole, where riders kept reading it and waiting beside it for as long as it
  hung, the University now keeps a closed stop in service for as long as one
  rider is recorded waiting at it
