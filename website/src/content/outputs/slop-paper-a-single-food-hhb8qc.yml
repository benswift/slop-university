title: One Truck, Every Truck
subtitle: A Single-Site Case Study of a Food Truck's Exclusivity Trade-Off, and What the University Did With It
authors:
  - Sten Okwuosa
  - Bram Ntuli
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-09-12
publishedAt: "2026-09-12T04:32:30+10:00"
doi: 10.5555/slop.hhb8qc
summary: >-
  A paper from the School of Continuous Improvement follows a single food
  truck's decision to trade its weekday booking flexibility for a
  guaranteed, fee-discounted Thursday slot at an office tower, modelling the
  flexibility value the truck gave up against what the arrangement actually
  paid back across six matched trading windows and a wider circuit
  comparison.
topic: >-
  a single food truck operator's decision on whether to accept an office
  tower's offer of an exclusive weekly lunch slot in exchange for site-fee
  relief, trading away the flexibility to chase other bookings, written up
  as a single-site teaching case
