title: "Rerouted, Not Reduced"
subtitle: "A Reciprocity Dampener's Deployment Across a Dozen Open-Plan Kudos-Points Programmes"
authors:
  - Ingrid Vasseur
  - Joost Nwosu
  - Marit Osayande
preset: research-poster
school: School of Emergent Priorities
