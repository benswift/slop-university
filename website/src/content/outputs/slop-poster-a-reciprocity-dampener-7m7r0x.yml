doi: 10.5555/slop.7m7r0x
summary: >-
  A research poster from the School of Emergent Priorities bolts a
  reciprocity-dampening module onto twelve open-plan workplaces' existing
  peer-recognition points platforms, discounting kudos exchanged more than
  twice a month between the same two colleagues. Flagged-reciprocal kudos
  falls sharply over fourteen weeks, while kudos routed through an
  occasional third colleague rises by a near-equal margin, and two host
  workplaces have adopted the resulting hop-rate as a published site metric.
topic: >-
  a reciprocity dampener for workplace peer-recognition kudos-points
  platforms, and the third-party workaround it created
