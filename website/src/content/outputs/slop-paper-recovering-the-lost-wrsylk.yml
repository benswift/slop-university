title: Recovering Lost Rewind Histories from Service Oil
subtitle: >-
  The Methanol to 2-Furfural Ratio in a Regional Distribution Transformer Fleet
authors:
  - Eskil Nwabueze
  - Casimir Beng
preset: paper
school: School of Continuous Improvement
date: 2026-10-18
publishedAt: "2026-10-18T04:00:56+11:00"
doi: 10.5555/slop.wrsylk
summary: >-
  A paper from the School of Continuous Improvement samples the service oil of
  312 distribution transformers whose rewind histories were partly lost in a
  register migration, and finds that the age-adjusted ratio of methanol to
  2-furfural separates documented rewound from documented original units with
  an area under the ROC curve of 0.97, almost entirely through the 2-furfural.
  Calibrated on the documented units, it resolves 101 of 133 undocumented units;
  nine of ten resolved assignments checked against de-tanked units were correct,
  the exception a partial rewind, and oil processing is the other identified
  source of error.
topic: >-
  recovering the lost rewind histories of a regional distribution-transformer
  fleet from the methanol-to-2-furfural ratio in its service oil
