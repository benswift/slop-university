title: Subgrains in the Pore Lattice
subtitle: Low-Angle Domain Boundaries Disappear First During Long First-Step Anodisation of Aluminium in Oxalic Acid
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-22
publishedAt: "2026-10-22T17:01:56+11:00"
doi: 10.5555/slop.icm3da
summary: >-
  A paper from the School of Underlying Conditions anodises 24 aluminium foils
  in oxalic acid for between 1 and 96 hours, locates 22.4 million pore-bottom
  dimples, and classes the boundaries between ordered domains by misorientation
  as a petrologist would. Domains coarsen as the 0.39 power of time, but
  low-angle boundaries fall from 41% of boundary length to 9% while high-angle
  boundaries thin more slowly and come to sit over the grain boundaries of the
  metal, which the authors read as subgrain coalescence followed by a mosaic
  pinned by its substrate.
topic: >-
  Subgrains in the pore lattice: how low-angle domain boundaries in
  self-ordered anodic alumina disappear before high-angle ones over a long
  first-step anodisation, read with the misorientation statistics of rock
  fabric analysis
