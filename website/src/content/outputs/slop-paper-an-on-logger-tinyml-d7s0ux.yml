title: Somebody Was Here
subtitle: On-Logger Recognition of the Manual Dip in a Monitoring Bore's Pressure Trace
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-13
