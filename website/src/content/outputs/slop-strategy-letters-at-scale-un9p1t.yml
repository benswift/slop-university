summary: >-
  Slop University's Strategic Plan 2026-2031 commits an institution without a
  School of letters to becoming a reading university, in which close attention
  to texts of every kind is held as a shared capability. Its three priorities
  protect time and rooms for reading at length, recognise criticism as a form
  of scholarly contribution, and support translation across languages and
  registers.
