doi: 10.5555/slop.gkk7xp
summary: >-
  A paper from the School of Emergent Priorities has the grounds duty officer
  classify every white ibis at eight food-court courtyards into four named
  cells --- Kept, Raiders, Guests, Lifters --- and withholds outdoor-furniture
  refresh from any school whose Lifter count exceeds its Raider count for two
  consecutive teaching weeks. Tray-dumping before the count recodes the cells
  without reducing the birds; the rule is now standing practice.
