title: Lunch on the food-court quad
subtitle: >-
  four named cells for the campus ibis and the outdoor-furniture rule they now
  govern
authors:
  - Sunniva Balogun
  - Anneke Tolan
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-09-23
