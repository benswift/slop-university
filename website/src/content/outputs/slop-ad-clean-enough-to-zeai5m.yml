summary: >-
  A marketing poster presents the University's research on cleaning and reuse
  through an office dishwasher opened at the end of the day, its racks still
  steaming and a tea towel over the door. The campaign hooks on the School of
  Emergent Priorities' paper testing shared-dishwasher clean/dirty magnets
  against the machine's true state, and is prepared for the portrait signage
  panels in matched light and dark renderings with a short reading list from
  the University's published record.
