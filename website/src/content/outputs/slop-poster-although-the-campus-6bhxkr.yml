summary: >-
  A research poster from the School of Continuous Improvement codes 214
  tracked table-tennis bookings at a campus recreation centre into a
  four-kind taxonomy, and reports that two of the four kinds now trigger
  automatic revocation of a member's booking privileges for the rest of
  term, independent of their overall attendance rate.
topic: >-
  Although the campus recreation centre's table-tennis sign-up sheet carries
  no formal enforcement, its booked slots sort into a four-kind taxonomy
  that the front desk now uses to decide whose booking privileges get
  revoked for the rest of term.
