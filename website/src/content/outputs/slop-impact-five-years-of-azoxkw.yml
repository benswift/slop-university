summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 sets out
  three cases from its wireless program: airtime and retransmission surveys
  on a transit concourse and in tiered lecture theatres, handover studies in
  a museum building and at nine building entrances, and timing and battery
  work on low-power sensor nodes in a temperature chamber and an orchard
  network. Each case records the setting a collaborator changed and kept,
  and the procedure the School adopted in turn, including a contention rule
  for question time at the Improvement Grand Rounds.
topic: >-
  Five years of the School treating shared wireless spectrum as an
  improvement problem: contention, backoff and the etiquette of waiting
  one's turn on a crowded channel
