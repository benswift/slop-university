title: Between Lights-Out and Lights-On
subtitle: >-
  The Department of Policy Settings answers questions taken on notice by the
  Committee on Settings Oversight on the reimbursement of participants in the
  University's overnight studies
authors:
  - Verity Marris
  - Odalys Penhallow
  - Anselm Threlkeld
  - Solveig Adeyemi
  - Ronja Oyelaran
preset: questions-on-notice
date: 2026-11-24
publishedAt: "2026-11-24T10:31:39+11:00"
doi: 10.5555/slop.xcdt32
summary: >-
  The Department of Policy Settings answers five questions on Interpretive Note
  2025/2 under the Slop University (Research Participant Reimbursement)
  Guidelines 2024, which treats the period between a night's recorded
  lights-out and lights-on as time in which an overnight participant undertakes
  no procedure, taken on notice at the Committee on Settings Oversight's
  Supplementary hearings of 20 November 2026 or lodged in writing after them.
  Its answers state that the Note was issued without consultation in reply to
  two inquiries; report hours paid per participant-night falling from 11.1 to
  3.5 across 690 nights in nine studies; state that the Department holds no
  record of hours asleep; find that the Note turns on the recorded times and not
  on sleep; decline on resourcing to identify unscheduled awakenings in 559
  overnight records; and schedule no review, referring to its consultation on
  the length of a treatment session.
topic: >-
  Whether hours a participant spends asleep in an overnight study count as hours
  of participation under the University's participant reimbursement guidelines
