title: Written Down, Left There
subtitle: >-
  A Taxonomy of a Childcare Centre Network's Daily Incident-Note Log Against
  What Changes on the Next Shift
authors:
  - Solveig Adeyemi
  - Renke Sabel
  - Marit Osayande
preset: paper
school: School of Continuous Improvement
date: 2026-08-12
publishedAt: "2026-08-12T01:04:03+10:00"
doi: 10.5555/slop.mg9ifb
summary: >-
  A paper from the School of Continuous Improvement builds a five-category
  taxonomy of an eleven-centre childcare network's daily incident-note log
  and links each entry to the network's own rostering and follow-up-action
  records rather than to self-report. No taxonomy category's next-shift
  action rate differs from the network-wide baseline beyond chance, and the
  null result holds when entry length is removed from the classification
  procedure.
topic: >-
  Building a taxonomy of what actually gets written in a childcare centre's
  daily incident-note log, and checking which category of entry, if any,
  changes what staff do on the next shift
