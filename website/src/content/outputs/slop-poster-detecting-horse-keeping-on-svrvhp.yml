summary: >-
  A research poster from the School of Emergent Priorities maps horse-keeping
  across 5,862 pasture parcels on a 410 km² urban fringe from the small patches
  of bare ground that form at paddock gateways each winter, read in six winters
  of 10 m satellite imagery. Gateway-patch density alone separates horse-keeping
  parcels with an AUC of 0.87, and the classified count rose from 412 to 655
  between 2019 and 2024, with 84% of the gain within 4 km of the urban edge.
topic: >-
  Detecting horse-keeping on a peri-urban fringe from the winter bare-soil
  patches horses wear at paddock gateways, in a six-year 10 m satellite time
  series
