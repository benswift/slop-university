summary: >-
  A case-for-support brochure invites livestock producers, cooperatives and
  their supporters to partner with the University on herd performance, read
  under three headings: the soil and water beneath the paddock, the scales and
  tally books that record a season's gain, and the committee minutes and case
  files that carry a decision through to its close. It rests its case on seven
  published studies cited by title and DOI.
