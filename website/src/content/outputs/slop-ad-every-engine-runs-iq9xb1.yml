summary: >-
  A marketing poster for Slop University invites applications to study in the
  School of Settled Matters and its Received Readings Group, presenting the
  rules a combustion engine is designed, built and tested to as texts whose
  meaning must be read, argued over and settled. Developed for bus-stop panels
  and campus digital signage, it pictures three students at a seminar table
  reading open volumes beside a cutaway four-cylinder engine block.
