title: The Iteration Depth of Double Materiality
subtitle: Closure Operators and Sharp Bounds for Simultaneous and Sequential Assessment
authors:
  - Clemency Tredinnick
preset: paper
school: School of Settled Matters
date: 2026-11-20
publishedAt: "2026-11-20T02:32:48+11:00"
doi: 10.5555/slop.0sihd2
summary: >-
  A paper in pure mathematics from the School of Settled Matters models a
  financial and an impact materiality assessment as two closure operators on a
  finite set of reporting topics, and proves that merging their outputs and
  reassessing can take as many rounds as there are topics, while taking the
  two assessments in turn never needs more than half that number plus one. A
  stylised eight-topic instance from a wholesale plant nursery needs six
  simultaneous rounds, three or four sequential ones depending on which
  assessment goes first, and admits only one disclosure coherent under both:
  all eight topics.
topic: >-
  Double materiality as the join of two closure operators on a finite set of
  reporting topics: sharp bounds on how many rounds simultaneous and
  sequential materiality assessment take to reach a disclosure coherent under
  both
