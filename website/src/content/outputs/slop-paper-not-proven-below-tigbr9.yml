summary: >-
  A jurisprudence paper from the School of Continuous Improvement reads the
  four editions of the publication charter governing a dark-matter detector
  collaboration as a law of evidence, with a presumption of absence, graded
  standards of proof, a tribunal and a rule of finality. It argues that the
  charter's third edition, by abolishing its verdict of indeterminacy, made
  every null run an exclusion that settles the parameter space it covers, and
  that in the region where a dark-matter signal becomes hard to tell from
  coherent neutrino scattering those exclusions are acquittals by a tribunal
  that could not have convicted. It proposes restoring a third verdict,
  confined to that region, that leaves the exposure open and records no
  finding either way.
topic: >-
  Not proven below the neutrino fog: an underground dark-matter collaboration's publication charter, read as a law of evidence, turns every null run into an adjudicated absence, a verdict its own warrant stops supporting once the neutrino background dominates, so the charter needs the third verdict it abolished
