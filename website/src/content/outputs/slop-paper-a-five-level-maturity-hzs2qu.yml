title: Compliant, Not Composting
subtitle: >-
  A Reliability Study of a Five-Level Vermiculture Maturity Model Across 356
  Backyard Worm Farms, and the Street-Level Compost-Bin Discount It Now Gates
authors:
  - Marek Solheim
  - Petra Umbile
  - Sten Okwuosa
preset: paper
school: School of Emergent Priorities
date: 2026-09-27
publishedAt: "2026-09-27T17:02:05+10:00"
doi: 10.5555/slop.hzs2qu
summary: >-
  A paper from the School of Emergent Priorities sends independently rostered
  assessor pairs to 356 backyard worm farms across nineteen streets in four
  council areas, scoring each against a five-level Vermiculture Maturity
  Model running from Untended to Self-Sustaining. Inter-rater agreement is
  moderate and holds across all four areas, and a metropolitan council's
  discounted compost-bin exchange is now locked to a street's assessed rung
  for a fixed two-year cycle, with no mechanism to revisit eligibility before
  the cycle ends.
topic: >-
  A five-level maturity model, from Untended to Self-Sustaining, scores
  backyard household worm farms on moisture, feeding cadence and bedding
  turnover, and the rung a farm reaches determines whether its street
  qualifies for the council's discounted compost-bin exchange
