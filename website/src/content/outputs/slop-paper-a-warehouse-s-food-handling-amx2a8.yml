title: "Ticked, Not Tested"
subtitle: "Testing Whether a Warehouse Oral-Verification Checkbox Predicts Retained Food-Safety Knowledge at Three Months"
authors:
  - Dagny Okafor
  - Ingeborg Nwachukwu
  - Casimir Beng
preset: paper
school: School of Continuous Improvement
date: 2026-08-10
