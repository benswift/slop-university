doi: 10.5555/slop.amx2a8
summary: >-
  A paper from the School of Continuous Improvement tests whether a
  warehouse's oral food-safety verification checkbox predicts what workers
  still know three months later, finding the tick reliably records that a
  supervisor asked something but not what was said, how long the exchange
  ran, or whether a worker's written-retest score differed at all from a
  worker whose check went unticked.
topic: >-
  a warehouse's food-handling refresher training ends with a supervisor
  verbally quizzing each worker and ticking one checkbox confirming the oral
  check took place, with no record of what was actually said in response;
  testing whether that checkbox predicts whether workers can still answer
  the same questions three months on
