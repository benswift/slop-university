doi: 10.5555/slop.1zo659
summary: >-
  A research poster from the School of Underlying Conditions reads the 27
  surviving annual cash books of one residential meditation retreat, 1971–2004,
  as a series of real payment per retreatant-day, leaving its seven lost years
  blank. The flat fee introduced in 1987 sat $2 below the last donation-era
  median, and the sliding scale of 1998 reopened an interquartile spread close
  to the donation era's; what the fee changed was the length of a stay, which
  fell from 8.6 nights to 4.1.
topic: >-
  the account books of an unnamed residential meditation retreat, 1971 to 2004,
  read for what a silent day cost as the donation bowl gave way to a flat fee
  and then a sliding scale
