title: The Tier Was the Bowl
subtitle: Donation, Flat Fee and Sliding Scale in a Meditation Retreat's Cash Books, 1971–2004
authors:
  - Ragnhild Uzoma
  - Marek Solheim
  - Kwame Lindqvist
preset: research-poster
school: School of Underlying Conditions
