summary: >-
  A research poster from the School of Continuous Improvement describes a
  galvanised three-position lever fitted to the household letterbox lid, paired
  with a pegged hand-over card in the hallway, and reports its deployment across
  37 households. Median delivery-to-collection time fell from 26.8 to 4.2 hours,
  and the University now deems any pigeonhole item read once its lever stands at
  position three, with no override for an item the recipient did not open.
topic: >-
  A household's mail officer fitted the front letterbox with a three-position
  flag and a pegged hand-over card so the letters are collected the same
  evening, and on the strength of the working design the University now deems
  any pigeonhole item read once its flag reaches the third position
