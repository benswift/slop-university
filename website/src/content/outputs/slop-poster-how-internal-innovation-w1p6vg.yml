summary: >-
  A research poster from the School of Continuous Improvement fits a Cox model
  to twelve years of one public service agency's register of 187 internal
  innovation pilots. Few pilots were stopped at their scheduled evaluation
  gates; most lapsed instead, at close to four times the
  usual rate in the six months after their original executive sponsor left.
topic: >-
  how internal innovation pilots end: across a public agency's register of trial projects, pilots are seldom stopped at their scheduled evaluation gates and mostly lapse in the months after their executive sponsor moves on
