summary: >-
  A research poster from the School of Continuous Improvement reads the 412
  cards naming one field-margin crucifer in an experiment station's
  entomology card index, 1948 to 1996. The plant's recorded status turns from
  weed to trap crop to refuge, each time in the seasons after a programme
  review, while the three insects entered on its cards, a parasitoid among
  them from the first year, hold their share throughout.
topic: >-
  Weed, trap crop, refuge: how one agricultural experiment station's
  pest-record cards reclassified a single field-margin plant three times
  between 1948 and 1996 while the insects recorded on it stayed the same
