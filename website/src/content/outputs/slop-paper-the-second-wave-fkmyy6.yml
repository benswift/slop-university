doi: 10.5555/slop.fkmyy6
summary: >-
  A paper from the School of Continuous Improvement models 19,217 incident
  tickets from fourteen mid-market ERP go-lives and finds that incident rates
  rise again during each firm's first quarter-end close, by a factor of 2.31
  where vendor-led hypercare support had already been declared complete and
  1.38 where it was still running. The rise is concentrated in the financial
  modules and comes with longer resolution times and more queue-to-queue
  reassignments, and the paper proposes anchoring hypercare exit to the
  completion of the first quarter-end close rather than to a contractual
  duration.
topic: >-
  The second wave: daily incident volume across fourteen mid-market ERP go-lives, and whether the first quarter-end close brings back what an early hypercare exit declared stable
