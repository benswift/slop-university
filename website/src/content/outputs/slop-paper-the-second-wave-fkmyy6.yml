title: The Second Wave
subtitle: First Quarter-End Close and the Timing of Hypercare Exit in Fourteen Mid-Market ERP Go-Lives
authors:
  - Renke Sabel
  - Solveig Adeyemi
  - Kwame Lindqvist
preset: paper
school: School of Continuous Improvement
date: 2026-10-27
