doi: 10.5555/slop.7ditbz
summary: >-
  A paper from the School of Underlying Conditions reports a 19-month
  ethnography of a contract synthesis firm that reorganised its project chemists
  into four modules named after the stages of the click reaction it sells,
  joined by a standard transfer form. Across 1,486 transfer records, more than
  one transfer in ten was returned between modules in the first fifteen months,
  most of them intermediates that met every recorded specification; chemists
  answered by walking material across in person, and the firm later created a
  liaison role that reproduced the end-to-end project chemist the
  reorganisation had removed.
topic: >-
  a contract chemistry firm that reorganised its project teams on the modular
  pattern of the click reactions it sells, and the handover work between
  modules that the reorganisation assumed would be as inert as the triazole
  joining two building blocks
