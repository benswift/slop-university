title: The Joint Is Not Inert
subtitle: Importing Click Chemistry's Modularity into the Organisation of a Contract Synthesis Firm
authors:
  - Ragnhild Uzoma
  - Hedvig Anyanwu
preset: paper
school: School of Underlying Conditions
date: 2026-11-11
