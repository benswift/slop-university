summary: >-
  A research poster from the School of Settled Matters stops a rotating cell of
  superfluid helium 24 times and reads the vortex lines left pinned in it with
  an axial quartz tuning fork. The remanent signal settled to a plateau within
  50 minutes and held for 72 hours; no 30-minute warm-up below the lambda point
  cleared more than 42% of it, and only an excursion to 2.20 K returned the fork
  to its vortex-free baseline.
topic: >-
  how long remanent quantised vortices stay pinned in a superfluid helium-4 cell
  after its rotation stops, and which partial warm-ups below the lambda point
  clear them, tracked by quartz tuning-fork damping
