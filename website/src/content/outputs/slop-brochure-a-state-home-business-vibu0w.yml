summary: >-
  A marketing brochure from the School of Continuous Improvement introduces
  the Adaptive Metrics Lab's quadrant framework, now running inside a state
  home-based food registration scheme, and gathers six of the University's
  published findings on what a classification does once an institution
  adopts it.
topic: >-
  a state home-business food registration scheme sorts every renewal into a
  quadrant of inspection recency and complaint history, naming the four
  categories, and lets the lapsed-inspection clean-record quadrant renew
  automatically without ever being visited again
