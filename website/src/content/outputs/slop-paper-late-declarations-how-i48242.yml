title: Declared After the Scores
subtitle: Timing, Score Direction and the Moral Judgement of a Selection Panellist's Late Conflict-of-Interest Disclosure
authors:
  - Signy Okpara
  - Thandiwe Solberg
preset: paper
school: School of Continuous Improvement
date: 2026-11-05
publishedAt: "2026-11-05T04:31:18+11:00"
doi: 10.5555/slop.i48242
summary: >-
  A moral psychology paper from the School of Continuous Improvement reports
  three vignette experiments with 3,222 adults in which a selection panellist
  who declared a former colleague on the shortlist after the panel's scores
  were shared was judged as harshly as one whose undeclared conflict was
  discovered by someone else, the two equivalent within half a scale point.
  The late declaration was condemned when the panellist had scored the
  acquaintance above their colleagues and largely forgiven when below, and
  sealing the scores until all were in cut the penalty for declaring late by
  about half.
topic: >-
  late declarations: how observers morally judge a selection panellist who
  discloses a conflict of interest only after the scores are in
