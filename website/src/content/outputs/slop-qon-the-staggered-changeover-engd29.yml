title: On the Hour
subtitle: >-
  The Department of Policy Settings answers questions taken on notice by the
  Committee on Settings Oversight on its proposal to stagger the hourly class
  changeover by precinct
authors:
  - Anneke Tolan
  - Vigdis Emenike
  - Ragnhild Uzoma
