doi: 10.5555/slop.engd29
summary: >-
  The Department of Policy Settings answers five questions on the exposure
  draft that would replace the University's single hourly class changeover with
  four precinct changeovers five minutes apart, ending the synchronised footfall
  pulse that a campus seismic array records as a repeating source, taken on
  notice at the Committee on Settings Oversight's Spring hearings of 13 November
  2026 or lodged in writing after them. Its answers list the five meetings of
  the internal review behind the proposal, whose terms of reference did not
  extend to vibration; confirm that no minute of the teaching week would remain
  common to all precincts; decline on resourcing to compile the path counts by
  segment and changeover; have not advised a reservation in favour of the
  array; hold no record of research that relies on the changeover; and draw no
  inference about the University's paths from a poster on a dairy herd's
  footfall.
topic: >-
  the staggered changeover: the Committee presses the Department on its
  proposal to stagger the hourly class changeover across campus by precinct,
  which would end the synchronised footfall pulse a campus seismic array uses as
  a repeating source
