title: Still Says Free Delivery
subtitle: >-
  Title Accretion and the Survival of Lapsed Claims in Small Sellers'
  Marketplace Listings
authors:
  - Anouk Mensah
  - Sunniva Balogun
  - Edda Nwafor
preset: paper
school: School of Emergent Priorities
date: 2026-11-05
publishedAt: "2026-11-05T07:02:16+11:00"
doi: 10.5555/slop.jc0ptj
summary: >-
  A paper from the School of Emergent Priorities follows eighteen months of
  title revisions across 2,412 listings held by 186 small sellers on an online
  marketplace, and finds that phrases such as "free delivery" and "new arrival"
  outlive the conditions they describe by months, longest when the listing
  still ranks on the phrase in search, with removal arriving mostly as a
  by-product of adding something else.
topic: >-
  title accretion on an online marketplace: how sellers' listing titles keep
  phrases like 'free delivery' and 'new arrival' long after the offer lapses, a
  survival analysis of title revision histories among small sellers
