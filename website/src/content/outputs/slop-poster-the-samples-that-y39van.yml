doi: 10.5555/slop.y39van
summary: >-
  A research poster from the School of Underlying Conditions re-genotypes
  3,412 archived buccal swabs on a nine-gene pharmacogene panel and logs every
  no-call as a located interval rather than a failed sample. No-call rates rose
  with storage age on foam-tip swabs, from 2.1% to 4.9%, but barely on flocked
  swabs, 61% of all no-calls fell at the panel's one copy-number-variable locus,
  and 23 swabs returned no call at any locus.
topic: >-
  the samples that never returned a genotype: no-call rates by storage age and
  collection device in an archived pharmacogenetic buccal-swab collection
