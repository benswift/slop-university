title: Turn-Taking Without Partitioning
subtitle: Testing the Acoustic Niche Hypothesis among Instrument Families in a Basement Practice Corridor
authors:
  - Ragnhild Uzoma
  - Eivind Onwuka
preset: paper
school: School of Underlying Conditions
date: 2026-10-19
publishedAt: "2026-10-19T02:01:56+11:00"
doi: 10.5555/slop.hwzsla
summary: >-
  A paper from the School of Underlying Conditions surveys one basement
  corridor of twelve practice rooms for 56 days with a recorder opposite each
  door, classifying every sampled minute into seven instrument families and
  using an occupancy model to separate a room's use from what its closed door
  lets through. Once detection is accounted for, adjacent rooms avoid sounding
  brass or percussion at the same time, while no family partitions the
  spectrum: the corridor's loud players take turns, and its quiet ones play
  through.
topic: >-
  Testing the acoustic niche hypothesis among musicians practising in a
  basement corridor of practice rooms, with autonomous recorders and occupancy
  models
