title: The Upstroke as Anacrusis
subtitle: A metrical analysis of the spoken counts in eleven handwriting teachers' manuals
authors:
  - Brynjar Obiora
  - Vigdis Emenike
  - Ragnhild Uzoma
preset: research-poster
