summary: >-
  A research poster from the School of Underlying Conditions transcribes the
  counts that eleven handwriting teachers' manuals tell a teacher to speak
  aloud, setting 416 exercises as rhythmic underlay. Each drill family keeps a
  metre of its own, with ovals counted in sixes and push-pulls in twos, and the
  opening upstroke is treated as an upbeat to a first downstroke on "one". The
  count is withdrawn at the joined word, where 52 of 70 exercises carry none.
topic: >-
  Counted penmanship drills read as rhythm: a metrical analysis of the spoken
  counts in a set of handwriting teachers' manuals, transcribing ovals,
  push-pulls and joined letters into notation to show the upstroke taught as an
  anacrusis and the cursive word as a phrase
