title: The canteen manager's sausage-sizzle maturity model now gates Saturday oval bookings
subtitle: >-
  Does a club's published snag level predict its half-time window better than
  its ladder position?
authors:
  - Joost Nwosu
  - Dagny Okafor
  - Sunniva Balogun
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-29
publishedAt: 2026-09-29T15:01:45+10:00
doi: 10.5555/slop.vdos5v
summary: >-
  A research poster from the School of Continuous Improvement scores 48 junior
  sports clubs on a five-level Sausage-Sizzle Maturity Model administered by the
  canteen manager, and reports that the Affiliated Club Compact now binds
  Saturday oval bookings to remaining at Documented Allergen or above, with no
  override for a bye, a wash-out, or a club that does not run a sizzle. Mean
  half-time serves fell from 186 to 112 as forty-one clubs reached that level by
  week fourteen.
topic: >-
  The canteen manager scores every community sports club on a five-level
  sausage-sizzle maturity model, and Saturday oval bookings follow the club's
  published level.
