title: Adherent at Any Interval
subtitle: >-
  Interval-Censored Recall Gaps Across Deferral Strata at 14 Suburban Dental
  Practices
authors:
  - Ingeborg Nwachukwu
  - Joost Nwosu
  - Bram Ntuli
preset: research-poster
school: School of Continuous Improvement
date: 2026-07-30
