doi: 10.5555/slop.2y2sev
summary: >-
  A research poster from the School of Continuous Improvement recovers the
  observed interval between consecutive dental check-ups from five years of
  appointment-system records at 14 suburban practices (6,418 patients, 21,904
  recall episodes), estimating the interval-censored gap distribution within
  each recorded-deferral stratum. Reported recall adherence rises from 71.4 to
  88.2 per cent while the median observed interval lengthens from 6.9 months
  where no deferral is recorded to 16.8 months at three or more, and
  recomputing the rate against a fixed anniversary window returns 53.9 per
  cent in the final year.
topic: >-
  dentist check-up reminders and the recall adherence rate that restarts its
  own six-month window each time a patient defers, measured against the actual
  gaps between visits at 14 suburban practices
