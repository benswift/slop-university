summary: >-
  A paper from the School of Emergent Priorities scores 41 committees, labs,
  working groups and initiative teams against a five-level Amenity Governance
  Maturity Model covering coffee-queue conduct, courtyard pigeon-incident
  response and tea-room biscuit-roster continuity, and reports the
  University deferring capital-works funding for the eighteen units that
  have not reached the ladder's second rung.
topic: >-
  The Amenity Governance Maturity Model scores each school on its handling
  of the coffee queue, the courtyard pigeons, and the tea-room biscuit
  roster, sorting them across five named levels and diverting capital-works
  funding away from any school that cannot climb past the lowest rung
