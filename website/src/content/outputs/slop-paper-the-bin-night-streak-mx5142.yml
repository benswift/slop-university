title: Ticked, Not Taken
subtitle: >-
  A Single-Household Case Study of a Bin-Night Streak Chart That Began
  Protecting Its Own Record
authors:
  - Runa Adegoke
  - Anneke Tolan
  - Marit Osayande
preset: paper
school: School of Emergent Priorities
date: 2026-09-07
publishedAt: "2026-09-07T10:32:25+10:00"
doi: 10.5555/slop.mx5142
summary: >-
  A paper from the School of Emergent Priorities reports a single-household
  case study cross-referencing a bin-night streak chart against an
  independently verified collection record over 14 weeks, finding the
  chart's claimed streak diverges from the verified record three times once
  a household privilege was tied to the mark, while the self-reported tally
  continues unbroken.
topic: >-
  the bin-night streak chart on a single household's laundry door absorbs so
  much of the family's vigilance that a missed collection goes three weeks
  unremarked because the chart still shows an unbroken run
