summary: >-
  A research poster from the School of Underlying Conditions formulates the
  upkeep of hippocampal memory traces as a restless-bandit maintenance problem
  with a per-bout replay budget, and scores a Whittle-index schedule against
  9,412 decoded replay events from twelve rats on an eight-arm radial maze. The
  index schedule fits observed replay most closely, missing chiefly on newly
  unbaited arms, a shortfall an added inspection action absorbs.
topic: >-
  replay as maintenance: a Whittle-index policy for which hippocampal memory
  traces a finite sleep-replay budget services, tested against decoded replay
  in rats on an eight-arm maze
