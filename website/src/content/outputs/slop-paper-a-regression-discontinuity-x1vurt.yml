title: Where the Sprinklers Decide Who Sits With the Pigeons
subtitle: >-
  A Regression-Discontinuity Estimate of the Courtyard Irrigation Timer's
  Effect on Coffee-Queue Seating and Tea-Room Biscuit-Rationing Hours
authors:
  - Ingeborg Nwachukwu
  - Casimir Beng
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-09-26
