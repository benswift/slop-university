doi: 10.5555/slop.x1vurt
summary: >-
  A paper from the School of Continuous Improvement treats the courtyard
  sprinkler system's fixed evening switch-on as a naturally occurring
  regression-discontinuity cutoff, finding a sharp jump in coffee-queue
  seating satisfaction and a same-day spillover into tea-room biscuit-tin
  draws two buildings away. It reports the Adaptive Metrics Lab's resulting
  Outdoor Seating Equity Index, now the binding trigger for the tea room's
  per-head biscuit ration.
topic: >-
  A regression-discontinuity study exploits the campus courtyard sprinkler's
  fixed evening switch-on time as a naturally occurring cutoff separating
  coffee-queue customers who keep outdoor tables among the pigeons from those
  moved inside; the resulting Outdoor Seating Equity Index now governs
  tea-room biscuit-rationing hours campus-wide
