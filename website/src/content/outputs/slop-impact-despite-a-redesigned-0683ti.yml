title: Parents Still Wave, Flash Their Lights and Call Out Names at Pick-Up
subtitle: >-
  five years of the School of Continuous Improvement watching identification
  at the kerb, and what happened once the informal signals got catalogued and
  taught
authors:
  - Dagny Okafor
  - Renke Sabel
  - Solveig Adeyemi
  - Torun Ezeigwe
preset: impact-report
school: School of Continuous Improvement
date: 2026-09-26
