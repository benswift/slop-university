doi: 10.5555/slop.0683ti
summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 traces five
  years of interviews at bus stops, car parks and the school-run kerb,
  following the placard redesigned to end informal identification through to
  the Recognised Supplementary Identification Behaviours register the School
  built once the placard failed to replace it. The register, now taught to
  volunteer kerb callers at 89 partner sites, is externally accredited under a
  fixed annual re-audit.
topic: >-
  Despite a redesigned laminated pick-up placard meant to replace it, parents
  interviewed at the kerb --- the bus stop, the car park, the school run ---
  described a private repertoire of waves, flashed headlights and called-out
  names that never went away. The School catalogued that repertoire and began
  training volunteer kerb callers to read it.
