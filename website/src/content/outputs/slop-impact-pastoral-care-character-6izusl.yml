summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 looks back on
  its first five years of work with schools and colleges, many with religious
  foundations, on pastoral care, character formation and contemplative
  practice: a common record of pastoral contact, four formation domains for
  comparing character-education programs, and a weekly review cadence for
  logged staff reflection. The Director's foreword frames the work as an answer
  to a pastoral-care coordinator who had spent eleven years leaving no trace of
  hers.
topic: >-
  pastoral care, character formation and contemplative practice as the
  School's five-year frontier of educational measurement
