title: Attached, Adjacent or Merely Entrapped
subtitle: Graded Criteria for Inferring Phoresy from Mite–Insect Syninclusions in Amber
authors:
  - Clemency Tredinnick
preset: paper
school: School of Settled Matters
date: 2026-11-09
publishedAt: "2026-11-09T15:01:19+11:00"
doi: 10.5555/slop.xzq0y2
summary: >-
  A paper from the School of Settled Matters examines the 368 mites preserved
  with 118 insects in 97 pieces of a historical teaching collection of amber,
  finding 142 attached to 31 insects under a strict criterion and 164 free
  deutonymphs lying closer to insects, and downstream of them along the
  resin's flow, than chance allows. It reads these as passengers dislodged
  during entrapment and proposes three grades of evidence for fossil phoresy,
  attached, adjacent and co-entrapped, which together raise the insects with
  an accepted association from 31 to 44.
topic: >-
  When a mite on a beetle in amber counts as phoresy: evidential criteria for
  host attachment versus chance co-entrapment, applied to an unprovenanced
  teaching collection of Cretaceous amber
