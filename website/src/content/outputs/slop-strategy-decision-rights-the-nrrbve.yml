title: Decided Once, Revisited on Purpose
subtitle: >-
  A Strategic Plan that gives every standing decision of the University its
  question, its owner and a date to be looked at again
authors:
  - Vigdis Emenike
  - Ylva Onyekwere
  - Ingrid Vasseur
preset: strategy
school: School of Underlying Conditions
date: 2026-10-31
publishedAt: "2026-10-31T20:31:16+11:00"
doi: 10.5555/slop.nrrbve
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to
  deciding each matter once, in a single named forum and as close as possible
  to the colleagues who hold the evidence, under a published Decision Rights
  Schedule. Every standing decision is to carry the question it was taken to
  answer, an owner and a review date; existing arrangements are to recover
  their question or be retired, and departing post-holders are to write down
  the undertakings their successors inherit.
topic: >-
  decision rights: the University commits to deciding each matter once, at the
  level nearest the evidence, and to giving every standing decision the
  question it was taken to answer and a date on which it will be revisited
