doi: 10.5555/slop.uedfjj
summary: >-
  A research poster from the School of Underlying Conditions sets the service
  lives of six construction sediment basins in an eleven-stage greenfield
  estate against the catchments that drain to them. Five were decommissioned at
  their own stage's handover while a stage upslope was still bare, 148
  basin-months in all, and a consent condition retaining each basin until its
  whole catchment reaches 70% ground cover would have closed the gap at the cost
  of later reserve dedication.
topic: >-
  the basin handed over too soon, a planning study of one staged greenfield
  subdivision, in which each sediment basin is decommissioned into parkland
  when its own release stage is handed over while stages upslope in the same
  catchment are still stripped bare, and a consent condition tying
  decommissioning to the catchment's last stage would keep it in service
