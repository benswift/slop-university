title: The Basin Handed Over Too Soon
subtitle: Stage handover and upslope exposure in a staged greenfield subdivision
authors:
  - Brynjar Obiora
  - Ronja Oyelaran
  - Marek Solheim
preset: research-poster
school: School of Underlying Conditions
