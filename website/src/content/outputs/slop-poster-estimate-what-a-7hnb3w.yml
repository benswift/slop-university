summary: >-
  A research poster from the School of Emergent Priorities estimates what
  customers select on at a service station's swap-and-go cylinder cage, from
  3,852 choice tasks completed by 214 forecourt respondents. A legible collar
  sticker prices at 41 cents against the swap fee and the certification date
  printed on it at six; the exchange network's revised loading standard adopts
  the three highest-priced levels as a presentation requirement, and a first
  quarterly audit finds front-row share held by as-new cylinders risen from 21
  to 46 per cent.
topic: >-
  estimate what a customer actually trades off when choosing one cylinder out of
  a service station's swap-and-go gas-bottle cage --- paint condition, rust at
  the foot ring, how full it feels, whether the collar sticker is still legible
  --- with a full discrete-choice experiment run at forecourts, and then let the
  estimated part-worths, priced in cents, be written into the exchange network's
  national cage-loading standard as a numbered presentation requirement with a
  quarterly compliance audit
