title: Towards a Cage-Loading Standard
subtitle: >-
  What Customers Trade Off When Choosing a Swap-and-Go Gas Cylinder, Priced in
  Cents
authors:
  - Ingrid Vasseur
  - Petra Umbile
  - Anneke Tolan
preset: research-poster
school: School of Emergent Priorities
