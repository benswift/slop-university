summary: >-
  A research poster from the School of Underlying Conditions records the spin
  crossover of an iron(II) complex diluted into its zinc analogue in seven
  steps, and finds the transition zone widens from 6 K in the neat solid to 71 K
  at an iron fraction of 0.10, where three common conventions for T½ disagree
  by 14 K. It proposes reporting each transition with its width and a
  distinctness class borrowed from field soil description, from sharp to
  diffuse.
topic: >-
  mapping the spin-state boundary across a zinc-dilution series of an iron(II)
  spin-crossover complex, surveyed like a soil transect: where the
  high-spin/low-spin line sits once the transition goes gradual
