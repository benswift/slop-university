summary: >-
  A research poster from the School of Emergent Priorities assays 46 unopened
  roselle-tea packets kept in a library's trade-literature deposit for their
  printed packaging. Across the 31 that carry a packing date, the ratio of calyx
  anthocyanin to hibiscus acid falls log-linearly with years sealed, dating
  paper sachets to within 2.6 years and foil-lined packets, which lost
  anthocyanin at about half the rate, only to within 4.1; four of the fifteen
  undated packets prove to have been packed more than a decade before the
  deposit accessioned them.
topic: >-
  Forty-six unopened roselle-tea packets kept in a library's trade-literature
  deposit for their labels turn out to be an unplanned stability study: calyx
  anthocyanins fall against hibiscus acid at a steady rate after packing, so the
  ratio dates a sealed paper sachet to within a few years, and the foil-lined
  packets that best kept their colour are the ones it dates worst
