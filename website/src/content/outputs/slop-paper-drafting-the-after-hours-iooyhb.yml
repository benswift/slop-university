doi: 10.5555/slop.iooyhb
summary: >-
  A human-computer interaction paper from the School of Settled Matters and the
  School of Continuous Improvement redrafts the display text on the twelve
  after-hours override panels of one office building, rotating three
  alternative wordings through its control zones over sixteen weeks of logged
  presses and occupancy. Naming the zone cut wrong-zone presses from 29 to 8 per
  cent and left the least extension running after a zone was last occupied;
  stating the end time all but stopped repeat presses; and a first-person
  wording cut presses most, chiefly by removing the evening cleaning crew from
  those who felt entitled to press.
topic: >-
  drafting the after-hours button: a field deployment of four wordings on an
  office building's wall panel that extends heating and lighting past the
  scheduled shutdown, and what each wording leads late workers to press, and
  leave running
