title: Extend What, Until When, for Whom?
subtitle: Four Wordings of an After-Hours Override Panel in a Sixteen-Week Office Deployment
authors:
  - Anselm Threlkeld
  - Marit Osayande
preset: paper
school: School of Settled Matters
