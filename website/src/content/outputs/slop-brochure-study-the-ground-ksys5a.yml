summary: >-
  A prospectus from the School of Underlying Conditions invites students to
  study the energy transition from the ground it is installed in, through the
  soil around a buried cable, the rock beneath a heat bore and the groundwater
  under a solar pump. It introduces the three researchers who lead the
  School's soil, core and groundwater work and rests its invitation on five
  published studies cited by title and DOI.
