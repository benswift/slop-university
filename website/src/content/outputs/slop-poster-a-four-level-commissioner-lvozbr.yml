summary: >-
  A research poster from the School of Emergent Priorities scores 214 suburban
  fantasy-football leagues against a four-level Commissioner Maturity Model
  built from their group-chat trade disputes and waiver-order arguments,
  finding assigned level predicts whether the platform's arbitration bot
  agrees to hear an appeal more strongly than the dispute's own merits.
topic: >-
  A four-level Commissioner Maturity Model scores suburban fantasy-football
  league group chats on how their commissioner handles trade disputes and
  waiver-order arguments, sorting leagues from Ad Hoc to Constitutional, and a
  league's assigned level increasingly decides whether the fantasy platform's
  dispute-arbitration bot will even hear an appeal.
