summary: A research poster from the School of Emergent Priorities replicates, across 31 open-plan floors over fourteen weeks, an earlier finding that a visible household marker is honoured by those downstream only about half the time. Tickets raised against a keyed-cover thermostat are closed with the set-point unchanged from the first week, and the University now fits a cover to every thermostat it controls and closes any ticket against one on the day of fitting, with no appeal.
topic: Does a locked perspex cover over an open-plan office's thermostat get treated as binding by the facilities staff who service it about half the time, rising slowly, as a letterbox sticker was by posties, or does that earlier finding fail to reproduce across thirty-one office floors --- and the cover goes on every thermostat the University can reach regardless
