title: The Thermostat Cover as Closure Instrument
subtitle: Does a locked cover over an office thermostat change what Facilities does about a complaint?
authors:
  - Halvard Nnamani
  - Fenna Okoro
  - Ingrid Vasseur
preset: research-poster
school: School of Emergent Priorities
