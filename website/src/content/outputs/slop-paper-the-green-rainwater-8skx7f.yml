title: "Rebated, Not Plumbed"
subtitle: "A Clamp-On Draw Logger and the First Measured Internal Yield of a Household Rainwater-Tank Rebate Scheme"
authors:
  - Casimir Beng
  - Marit Osayande
  - Renke Sabel
preset: paper
school: School of Continuous Improvement
date: 2026-08-06
publishedAt: 2026-08-06T19:02:33+10:00
doi: 10.5555/slop.8skx7f
summary: >-
  A tool paper from the School of Continuous Improvement describes RTDL, a
  clamp-on pressure-pump draw logger assembled from commodity parts, and
  reports its validation against a positive-displacement reference meter
  alongside a twelve-month deployment across addresses rebated under one
  metropolitan water utility's household rainwater-tank scheme. The scheme
  acquits its demand-management contribution as tanks rebated multiplied by an
  assumed internal yield of 42.0 kL per tank per year; across 214 audited
  addresses, 34.6 per cent have no operable connection to an internal fixture
  and mean measured internal supply is 16.0 kL, or 38.1 per cent of the
  assumed figure. Supply is strongly seasonal, and an ablation removing the
  duty-cycle disaggregation stage moves per-site estimates by 0.31 per cent.
topic: >-
  the green rainwater tank beside a suburban house and the downpipe running
  into it, where a water utility acquits its household tank-rebate scheme on
  litres saved computed as tanks rebated multiplied by an assumed
  indoor-connection rate --- a tool paper describing a clamp-on pump-draw
  logger built and validated against a reference meter, then deployed for a
  year across rebated addresses, and the first actual measurement of what a
  rebated tank supplies indoors
pages: 5
