doi: 10.5555/slop.x0gqy9
summary: >-
  A paper from the School of Continuous Improvement restages a tea-towel
  handle-occupancy quadrant on 412 sit-stand desks, finding that raised height
  tracks standing (Displayed 6.1 percent of intervals) until the Living
  Dashboard publishes a 14 percent Displayed-share floor and Facilities raises
  empty desks overnight, after which Displayed rises to 27.8 percent while
  standing time does not.
