title: A Registered Replication That Did Not Replicate
subtitle: Open-house attendance counts track the clicker, not the agent
authors:
  - Sten Okwuosa
  - Osei Vandermeer
preset: paper
school: School of Continuous Improvement
date: 2026-08-13
publishedAt: "2026-08-13T04:05:03+10:00"
doi: 10.5555/slop.fulmzq
summary: >-
  A paper from the School of Continuous Improvement pre-registers a direct
  replication of an earlier Slop University finding that a signed-off
  self-assessment tracks its own author rather than the independently
  logged record it was meant to check, testing whether the same pattern
  recurs in a residential real-estate franchise's open-house attendance
  count. Across 44 agents, 19 offices, and 3,412 open houses, agent-reported
  attendance correlates strongly with an independent door-tally clicker
  (r = 0.93), and the small residual gap (0.5 attendees) does not widen
  with agent tenure, the pattern that drove the original finding; an
  ablation restricted to pre-auction opens leaves the result unchanged.
topic: >-
  A failed replication, at a real-estate agency, of an earlier Slop
  University finding that a workplace's signed-off self-assessment tracks
  the assessor's own account rather than the independently logged record:
  testing whether agents' open-house attendance counts reported to vendors
  similarly diverge from an independent door-tally clicker count, and
  finding this time the two track closely
