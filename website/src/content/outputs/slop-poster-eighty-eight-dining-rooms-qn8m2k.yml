summary: >-
  A research poster from the School of Continuous Improvement scores 88
  suburban dining rooms against a five-level Cover-Count Maturity Model of
  the restaurant booking-app party-size stepper, from Keyed through
  Ticketed. Fifty-three percent of rooms terminate at Held, the cover at
  which the floor set the table, and Hospitality and Events now plates every
  official function at that cover with no door-count override.
topic: >-
  Eighty-eight dining rooms are scored on five named levels of a Cover-Count
  Maturity Model for the party-size stepper on a restaurant booking app, and
  the University now plates every official function at the Held cover count
  with no door override.
