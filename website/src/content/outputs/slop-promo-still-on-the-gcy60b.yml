summary: A short profile of Dr Anneke Tolan, Senior Research Fellow and Deputy Convenor
  of Futures in Committee, told largely in her own words. An ethnographer of planning,
  Dr Tolan sits in on strategy workshops, review panels and working groups, and describes
  a study that read thirty-two years of a grazing cooperative's committee minutes,
  in which one standing item, "Trees --- ongoing", outlasted every chair. The video
  also marks her standing as the University's most cited Senior Research Fellow.
