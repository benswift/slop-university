title: Scored Enough, Awarded Less
subtitle: >-
  A Multi-Site Audit of a Martial-Arts Franchise's Belt-Grading Checklist
  Against Independent Examiner Verdicts and Subsequent Attrition
authors:
  - Torun Ezeigwe
  - Dagny Okafor
preset: paper
school: School of Continuous Improvement
date: 2026-08-12
publishedAt: "2026-08-12T20:05:03+10:00"
doi: 10.5555/slop.6k9y5a
summary: >-
  A paper from the School of Continuous Improvement audits a twenty-four-dojo
  martial-arts franchise's headquarters checklist for belt grading against
  the independent, blinded verdict of rotating guest examiners across 1,384
  gradings, finding 86.0% agreement (Cohen's kappa = 0.41) and a
  checklist-implied pass rate that exceeds the examiner-awarded rate at
  every sampled site. Disagreement is asymmetric in its consequences:
  students the checklist cleared but the examiner deferred withdraw within
  the following term at several times the rate of every other group, while
  an ablation removing the checklist's forms cluster leaves both the
  agreement statistic and the attrition association unchanged.
topic: >-
  whether a martial-arts dojo franchise's headquarters checklist for belt
  grading predicts what an independent guest examiner actually awards on
  grading day, and whether cases where the checklist and the examiner
  disagree predict which students drop out of training within the
  following term
