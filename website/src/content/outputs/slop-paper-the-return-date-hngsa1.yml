doi: 10.5555/slop.hngsa1
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement reports a design science study of a web-based loan register for a
  teaching-laboratory equipment store, built in three prototyping iterations
  across 8,373 loans. A due date prefilled at seven days was kept for 93.1% of
  loans; leaving the field blank led technicians to enter seven days themselves;
  unselected timetable-based suggestions on a borrower-facing screen raised
  same-day returns from 8.0% to 47.0% and cut overdue loans from 21.4% to 9.8%,
  leading the authors to locate the due date with the borrower and the screen
  they face.
topic: >-
