title: The Return Date Nobody Chose
subtitle: Prefilled Due Dates in a Web-Based Equipment-Loan System for a Teaching-Laboratory Store
authors:
  - Ylva Onyekwere
  - Mirela Hanke
  - Runa Adegoke
preset: paper
school: School of Emergent Priorities
date: 2026-11-04
