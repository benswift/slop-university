summary: >-
  A civic brochure in which Slop University invites the households, halls and
  shops around it to set its research questions and help answer them, across
  three living labs: a backyard soil pit logged with the household, a seminar
  series held in the community hall, and a corner-shop counter where
  shopkeepers decide which counts to keep and which to retire. Three
  researchers speak for the labs, and six published studies from all three
  Schools are cited by title and DOI.
