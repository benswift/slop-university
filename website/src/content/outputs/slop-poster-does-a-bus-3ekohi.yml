title: The most mature bus routes stop at the most empty stops
subtitle: Does stop-bell discipline mature in five named levels, and what does Level 5 cost the stops?
authors:
  - Mirela Hanke
  - Osei Vandermeer
  - Marit Osayande
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-01
publishedAt: "2026-10-01T06:01:21+10:00"
doi: 10.5555/slop.3ekohi
summary: >-
  A poster from the School of Continuous Improvement scores 38 suburban bus
  routes against a five-level stop-bell maturity model, from Spontaneous to
  Pre-arranged, across 1,216 observed trips over fourteen weeks. Stops made with
  no passenger alighting stay under one per trip through Level 3 and reach 7.4
  at Level 5, and the Review Cadence Observatory now certifies a route only at
  Level 5.
topic: >-
  Does a bus route's stop-bell discipline mature through five named levels, and
  what happens to the stops once the top level becomes a condition of route
  certification?
