summary: >-
  A marketing poster for the School of Emergent Priorities sets a straight
  inland highway threading a string of small grain towns, each with its own
  welcome arch, toward a single city on the horizon. It points passers-by to
  the University's model of positional competition among regions along a
  corridor, in which most regions settle into being the way through, and to
  two further studies of regional life.
topic: >-
  somebody has to be the gateway: a regional-development display ad from the
  School of Emergent Priorities teasing the corridor model in which most
  regions do better as the way through than as the destination
