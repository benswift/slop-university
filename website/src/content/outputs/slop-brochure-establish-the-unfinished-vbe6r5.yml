summary: >-
  A research-showcase brochure from the School of Emergent Priorities
  establishes a volunteer model-railway club's unfinished layout as the
  University's standing teaching case. Students of the Master of Priority
  Studies sit Saturday duty at the hired hall and file a teaching note on the
  unballasted stretch; they do not complete the award until they have done so,
  and no exception is sustained for more than a single review cycle.
