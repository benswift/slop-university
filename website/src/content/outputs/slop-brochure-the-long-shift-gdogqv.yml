summary: >-
  A research showcase led by the School of Underlying Conditions gathers the
  University's work on strain, fatigue and recovery, following it from the core
  shed and the recovering bore to the roster, the workshop floor and the
  loading dock. It presents three themes --- the late hours of a field shift,
  the design of the working day, and the question of when a rest is over ---
  and directs readers to seven published studies cited by title and DOI.
topic: >-
  the long shift: a research showcase on strain, fatigue and what a rest
