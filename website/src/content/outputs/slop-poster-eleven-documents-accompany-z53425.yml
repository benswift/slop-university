doi: 10.5555/slop.z53425
summary: >-
  A research poster from the School of Continuous Improvement surveys
  supporting-document counts across 340 concession-card renewal files at
  three shire pilot sites, reporting the counts as overlapping distributions
  rather than a single average. File-level counts track the processing
  officer more closely than any measure of applicant risk, and the School
  recommends codifying the observed median as the renewal's minimum
  evidentiary threshold.
topic: >-
  a survey of concession-card renewal applicants across shire pilot sites,
  reporting the distribution of supporting documents required per household,
  and a proposal to codify the median as the minimum evidentiary threshold
