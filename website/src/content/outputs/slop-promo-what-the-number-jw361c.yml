summary: "A short profile of Dr Mirela Hanke, Postdoctoral Fellow and Deputy Convenor
  of the Living Dashboard, told largely in her own words. Dr Hanke describes how a
  number adopted to inform a decision comes to make it, and then to stand in for the
  goal, and follows that pattern through three of her most-cited papers: a cafe franchise's
  tip-screen friendliness score, a vending-machine upgrade credited on its installation
  day, and a gym chain's booking-reliability score. The video also marks her citation
  record, with an h-index that no other postdoctoral fellow at the University has
  bettered."
topic: "a promo profile of Dr Mirela Hanke, Deputy Convenor of the Living Dashboard,
  whose h-index no other postdoctoral fellow at the University has bettered, in her
  own voice: a decision-support researcher who follows a number from measurement to
  decision to goal, and asks what it was for"
