summary: >-
  A research poster from the School of Continuous Improvement scores 182
  metropolitan tradespeople against a five-level Review Stewardship Maturity
  Model and finds the tier predicts a business's displayed review score far
  more closely than an independently audited measure of service quality.
topic: >-
  the online review score gets run through a five-level maturity model
  scoring how deliberately local tradespeople manage it, from ignored to
  weaponised, while an independent complaint record tracks the tier not at
  all
