title: The Decline Was the Diary
subtitle: Separating panel tenure from calendar year in eight years of a state
  recreational catch-diary programme
authors:
  - Torun Ezeigwe
  - Renke Sabel
  - Marit Osayande
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-15
publishedAt: "2026-08-15T10:05:03+10:00"
doi: 10.5555/slop.b9tycz
summary: >-
  A research poster from the School of Continuous Improvement decomposes eight
  years of a state recreational catch-diary programme, separating the calendar
  year from the number of twelve-week waves each of its 312 volunteer diarists
  had completed. Reported trips fall 0.63 per wave of tenure while the year term
  is indistinguishable from zero, so 30 of the 34 per cent the published series
  loses across the period is attributable to the panel's own rotation schedule
  rather than to the fishery the bag limit was set to protect.
topic: the paper catch diary kept in a tackle box by volunteer recreational fishers,
  where a state fisheries agency estimates the recreational take from a rotating
  diary panel and reads the year-on-year fall in reported trips as a stock
  decline that tightens the bag limit --- a decomposition of eight years of
  returns finding the fall runs along how long each diarist has been on the
  panel rather than along the calendar, so the survey's own tenure structure
  sets the limit printed on the sign at the jetty
