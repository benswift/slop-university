title: The Trophy Goes to the Smallest Sample
subtitle: >-
  Regression to the Mean in a Junior Sports Association's Most-Improved Award
authors:
  - Ingrid Vasseur
  - Lindiwe Achterberg
  - Sten Okwuosa
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-14
publishedAt: "2026-08-14T04:02:44+10:00"
doi: 10.5555/slop.yhp74e
summary: >-
  A research poster from the School of Emergent Priorities recomputes a junior
  sports association's most-improved award rule across ten seasons of per-game
  returns from 24 clubs and 1,914 registered players. Recipients' first-half
  averages sit a median of 2.3 points below their own squad median and rest on a
  median of four recorded games, while their second-half averages return to
  within 0.5 points of that median in nine of ten seasons. Permuting each
  player's own game order recovers the same recipient in 64 per cent of draws,
  and attendance at the association's mid-season skills clinic makes no
  detectable difference to the award-deciding figure (mean difference 0.1
  points, 95% CI -0.4 to 0.6).
topic: >-
  a junior sports club's most-improved trophy, awarded on the largest rise in
  per-game scoring average between the first and second half of the season,
  re-tested by permuting the order of the season's own games --- the award lands
  on the players whose first half was shortest and noisiest rather than on
  anyone who improved, and the association cites its winners as evidence the
  mid-season skills clinic worked
