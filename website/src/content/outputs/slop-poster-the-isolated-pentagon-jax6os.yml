summary: >-
  A research poster from the School of Settled Matters reads the isolated
  pentagon rule for fullerene cages as a defeasible generalisation, and argues
  that the metal-filled and chlorinated cages reported to break it each name a
  defeater by mechanism, so that they fix the rule's scope to empty, neutral,
  unadorned cages rather than refute it.
topic: >-
  the isolated pentagon rule for fullerene cages read as a defeasible
  generalisation: whether its metallofullerene exceptions defeat the rule or
  fix its scope
