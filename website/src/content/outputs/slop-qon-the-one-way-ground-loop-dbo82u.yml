doi: 10.5555/slop.dbo82u
summary: >-
  The Department of Policy Settings answers five questions on section 21 of the
  Slop University (Building Services) Determination 2025, under which a school
  is recharged for heat supplied to a research installation through its
  connection to the campus borefield and the heat the installation returns is
  not counted, taken on notice at the Committee on Settings Oversight's
  Supplementary hearings of 23 November 2026 or lodged in writing after them.
  Its answers tabulate both registers of the four research connections' meters
  over twelve months, 161.7 MWh supplied and 155.0 MWh returned for $15,199.80
  in recharges; confirm a seasonal storage trial's $3,929.20 recharge although
  it returned 58.3 MWh against 41.8 MWh drawn; find that heat in the borefield
  forms part of the service whatever its source; decline on resourcing to
  recalculate the recharge from 304,128 fifteen-minute readings; and leave the
  setting to the Determination's scheduled review.
topic: >-
  the one-way ground-loop metering setting: the Committee presses the
  Department on the rule that charges a research installation for heat drawn
  from the University's campus borefield but credits none of the heat it
  returns, as it falls on seasonal thermal storage trials
