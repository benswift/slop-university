title: Undeliverable Means Removed
subtitle: >-
  A Hand-Coded Audit of a State Electoral Roll's Return-Mail Taxonomy Against
  Independent Doorknock Verification
authors:
  - Marek Solheim
  - Fenna Okoro
  - Torun Ezeigwe
preset: paper
school: School of Emergent Priorities
date: 2026-09-15
publishedAt: "2026-09-15T01:56:12+10:00"
doi: 10.5555/slop.uely73
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement hand-codes a state electoral commission's six-kind taxonomy of
  returned enrolment mail across one habitation-review cycle, cross-referencing
  a stratified sample against an independent doorknock verification. Four
  kinds track doorknock-confirmed residency closely; two do not, and the
  commission has adopted all six as the sole, non-overridable trigger for
  removal from the roll.
topic: >-
  A state electoral commission's roll-review officer classifies every piece
  of returned enrolment mail into a taxonomy of return kinds, and the
  taxonomy alone decides which residents are struck from the roll before the
  next habitation review.
