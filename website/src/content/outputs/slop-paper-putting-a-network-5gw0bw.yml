title: Putting a Network Under
subtitle: Timing, Dose and Division of Transient Activation Suppression in Early Training
authors:
  - Brynjar Obiora
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
