doi: 10.5555/slop.5gw0bw
summary: >-
  A paper from the School of Underlying Conditions applies a reversible gain to
  every hidden activation of a small three-layer network for a bounded window
  of early training, varying the onset, level, duration and division of the
  exposure across 1,020 runs on a synthetic task. An eight-epoch exposure at
  half gain costs up to 7.4 points of final accuracy, level and duration do not
  trade at equal area, and the lasting deficit arises at emergence, when
  compensated weights meet restored activations and about a third of the hidden
  units fall silent; restoring the gain over two epochs removes nearly all of
  it.
topic: >-
  Putting a network under: transient suppression of activations during early training, run as the developmental anaesthetic exposure experiment --- a dose-response study of when a small network is exposed, for how long, and what deficits remain after it wakes
