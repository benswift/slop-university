title: All Produce Harvested
subtitle: >-
  The Department of Policy Settings answers questions taken on notice by the
  Committee on Settings Oversight on the destruction of produce from the
  research farm's registered field trials
authors:
  - Verity Marris
  - Anselm Threlkeld
  - Brynjar Obiora
  - Lindiwe Achterberg
preset: questions-on-notice
date: 2026-11-20
publishedAt: "2026-11-20T19:32:46+11:00"
doi: 10.5555/slop.ydc268
summary: >-
  The Department of Policy Settings answers five questions on section 11 of the
  Slop University (Research Farm) Determination 2023, under which all produce
  harvested from a plot entered in the Register of Field Trials is destroyed,
  taken on notice at the Committee on Settings Oversight's Supplementary
  hearings of 18 November 2026 or lodged in writing after them. Its answers
  report that applied-product trials fell from 11 of 30 registered trials in
  2023-24 to 6 of 34 in 2025-26 while the produce destroyed rose from 41.6 to
  52.3 tonnes; hold no record of how much came from untreated control plots,
  guard rows or buffer strips; answer only for retained seed when asked what
  "produce" covers; decline on resourcing to account for each headland
  harvested; report that 21 of the 34 trials were first entered in an earlier
  season; and refer the member to two University outputs on returning to field
  plots after harvest.
topic: >-
  the trial-plot produce setting: the Committee presses the Department on the
  Research Farm Determination's rule that all produce harvested from a plot
  entered in the Register of Field Trials be destroyed, which reaches untreated
  control plots, guard rows and variety trials to which no product was ever
  applied
