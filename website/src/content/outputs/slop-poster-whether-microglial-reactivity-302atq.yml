summary: >-
  A research poster from the School of Underlying Conditions logs reactive
  microglia layer by layer in the cortex overlying a focal demyelinating lesion
  in 24 aged mice, three and twelve weeks after injury. By twelve weeks layers I
  to IV have fallen back towards sham while layers V and VI stay near their
  early peak, with an abrupt boundary between layers IV and V in 21 of 24
  animals and the deep band reaching about 1.2 mm past the lesion margin.
topic: >-
  whether microglial reactivity in the cortex overlying a focal white-matter
  lesion fades towards the surface or settles into a deep-layer band: a
  laminar survey in aged mice at three and twelve weeks
