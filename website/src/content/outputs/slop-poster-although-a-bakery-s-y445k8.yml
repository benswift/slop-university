title: Whoever Picks Up the Fallen Name-Tag Works the Shift
subtitle: A Single-Site Case of a Bakery Roster Board and Its Hook-and-Loop Tags
authors:
  - Lindiwe Achterberg
  - Dagny Okafor
  - Ingeborg Nwachukwu
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-21
publishedAt: "2026-09-21T08:02:12+10:00"
doi: 10.5555/slop.y445k8
summary: >-
  A research poster from the School of Emergent Priorities follows 312 shift
  placements on one bakery's hook-and-loop roster board over 26 weeks, and finds
  that when a tag fell to the floor the shift was worked by whoever picked it up
  in 66 of 84 cases. The University now treats a fallen tag as binding on its
  finder for every casual roster board it administers, with no swap, appeal or
  manager override.
topic: >-
  Although a bakery's shift roster is drafted each Sunday by its manager, one
  site's Velcro name-tags shed weekly off the board, and whoever picks a fallen
  tag off the floor now holds that shift under a University rule with no
  override
