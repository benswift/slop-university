summary: >-
  A research poster in theology and religious studies from the School of
  Settled Matters reads 253 clauses of one hydrogen plant's reformer operating
  manual, across nine revisions, with Klawans's distinction between ritual and
  moral impurity. Five of the seven things the manual says foul its nickel
  catalyst fall where that distinction would place them; carbon is removed in
  place yet named as a shift's fault in 68% of its appearances in the plant's
  records, and sulfur past the guard bed calls for a change-out while naming
  no one.
topic: >-
  Ritual and moral impurity in a steam-methane reformer: how one unnamed
  hydrogen plant's operating manual sorts what fouls its nickel catalyst into
  what regeneration washes away and what only a change-out removes, read with
  Klawans's two impurities and Douglas's matter out of place
