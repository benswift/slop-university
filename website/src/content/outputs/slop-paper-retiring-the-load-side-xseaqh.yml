title: Retiring the Observer
subtitle: Withdrawing Load-Side State Feedback from a Two-Mass Servo Drive Without Re-Exciting Its Resonance
authors:
  - Marek Solheim
  - Gunnhild Ekwueme
preset: paper
school: School of Emergent Priorities
