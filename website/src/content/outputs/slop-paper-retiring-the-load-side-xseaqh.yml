doi: 10.5555/slop.xseaqh
summary: >-
  A paper from the School of Emergent Priorities treats the withdrawal of
  load-side state feedback from a two-mass servo drive as a scheduled
  transition, on the identified model of a bench with inertia ratio 0.5.
  Abrupt withdrawal produces a shaft-torque excursion linear in the torque the
  observer was carrying, ramps longer than two resonance periods cut it in
  inverse proportion to their length, and only a deliberately retuned PI lifts
  the remaining loop's damping ratio from 0.16 to 0.37.
topic: >-
  retiring the load-side observer of a two-mass servo drive without letting
  the shaft resonance return: a decommissioning schedule for state feedback
