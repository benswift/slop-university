summary: >-
  A marketing poster for the School of Continuous Improvement compresses a
  survey of neighbourhood-marketplace sellers --- how many "is this still
  available" messages a listing collects before anyone actually turns up ---
  into a single landscape signage panel. The modal listing that moved had
  already been asked seven times; on the strength of that distribution, the
  University's surplus-furniture store will not release an item until the
  seventh enquiry. The campaign points at Fastest Claimed, First Flagged in
  matched daylight and evening versions.
topic: >-
  How many unanswered enquiries keep a neighbourhood-marketplace listing
  marked available after the thing has already gone?
