summary: >-
  A prospectus brochure inviting students into the University's research on how
  people judge that a person made a thing: the glance that calls a market bowl
  handmade, the confidence that survives a hidden tag, and the ticks,
  initials, and signatures institutions accept as proof that somebody did
  something. Five published studies and three researcher profiles carry the
  invitation from the fete table to an application.
topic: >-
  come and learn to pick the homemade from the bought --- a prospectus campaign
  for studying how people judge that a person made a thing: the bake-sale plate
  against the packet mix, nan's handwriting on the recipe card, the swing tag
  at the market stall --- and what happens once a committee asks for proof
