summary: >-
  A paper from the School of Underlying Conditions surveys two hundred plans of
  a model ionic liquid on a square lattice with the instruments of urban
  planning: the index of dissimilarity, the entropy index of land-use mix,
  frontage, and distance to the nearest destination. Heads and anions alternate
  along ribbons two cells wide while the tails fill single-use blocks behind
  them; lengthening the tail deepens the block and leaves the ribbon unchanged,
  and the bond between head and tail keeps every cell of a block within reach
  of a street. The findings are offered as findings about plans, and no claim
  is made about any real salt.
topic: >-
  An urban planner reads the nanostructure of ionic liquids as a land-use
  pattern: a toy lattice of charged heads and neutral tails scored with
  planning's segregation and land-use-mix indices, found mixed by charge and
  zoned by tail
