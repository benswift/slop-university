title: The Last Sheet
subtitle: A Backyard Clothes Line Read as a Cross-Flow Humidifier, with the Humid-Air State Measured Between Its Wires
authors:
  - Ylva Ogunbanjo
  - Runa Adegoke
preset: paper
school: School of Emergent Priorities
date: 2026-10-28
