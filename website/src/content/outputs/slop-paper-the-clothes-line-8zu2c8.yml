doi: 10.5555/slop.8zu2c8
summary: >-
  A paper from the School of Emergent Priorities instruments two four-wire
  backyard clothes lines between their wires and treats a loaded line as a
  four-stage adiabatic humidifier, evaluating the humid air with a real-gas
  moist-air formulation across 41 drying sessions. Each wire dries in air the
  wires upwind have already wetted, so that the last wire dries at about a
  third of the first wire's rate in calm air and about four-fifths in a fresh
  breeze, and a single wind-dependent stage effectiveness predicts both the
  air's humidification and each wire's drying rate.
topic: >-
  the clothes line as a cross-flow humidifier: the humid-air state measured
  along a loaded backyard washing line, and why the last sheet pegged out dries
  in air the sheets upwind have already wetted
