title: Drawn Straight Through
subtitle: Unrecalled Years on Self-Drawn Lifelines and Balanced Time Perspective
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-11-01
publishedAt: "2026-11-01T21:01:15+11:00"
doi: 10.5555/slop.dfoeax
summary: >-
  A paper from the School of Underlying Conditions asks 186 adults to draw
  their lives as a single line and codes how they mark the 297 stretches of a
  year or more they cannot recall, finding that leaving a gap, boxing the
  stretch with a placeholder or drawing straight through is consistent within
  a person, depends on the length of the loss, and tracks their deviation from
  a balanced time perspective. Placeholder intervals were also the ones from
  which events were most often recovered at a two-week retest.
topic: >-
  marking the unrecalled years: how adults mark stretches of their own past
  they cannot recall on a hand-drawn lifeline (left blank, filled with a
  placeholder, or drawn straight through) and how each habit sits with
  balanced time perspective
