title: Built as a Shield, Used as a Pass
subtitle: >-
  A Route-Fluency Ledger for Parcel Couriers, and How a Depot's Rotation
  Roster Began Trading on the Score
authors:
  - Lindiwe Achterberg
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-08-12
publishedAt: "2026-08-12T00:01:25+10:00"
doi: 10.5555/slop.97orx9
summary: >-
  A paper from the School of Emergent Priorities deploys an in-cab Route
  Fluency Ledger across a parcel courier depot's van fleet, scoring
  driver-route familiarity to advise a fairness-driven rotation algorithm
  without overriding it. The score recovers a fluency curve consistent
  with the navigation literature, but once it reaches rostering staff,
  rotation-exemption requests begin citing it directly instead of the
  depot's own fairness criteria; by month six a majority of granted
  exemptions name the score as their justification, a shift an ablation
  of the advisory threshold leaves unchanged.
topic: >-
  logging parcel couriers' in-cab turn hesitation into a route-familiarity
  score, meant to protect drivers' built-up route memory from a depot's
  fairness rotation roster, until the depot starts trading the score for
  rotation exemptions
