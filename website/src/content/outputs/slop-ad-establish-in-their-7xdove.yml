title: Whose Turn Is It to Water Them?
subtitle: >-
  A featured-researcher campaign for the School of Continuous Improvement,
  staging Dr Mirela Hanke's interview study of who actually waters a share
  house's plants, and the wording the Living Dashboard adopted from it
