summary: >-
  A marketing poster for the School of Continuous Improvement features Dr
  Mirela Hanke, Postdoctoral Fellow and Deputy Convenor of the Living
  Dashboard, whose interview study asks share-house residents how they
  actually decide whose turn it is to water the plants. The vocabulary
  residents use has since been adopted as the required wording on every
  Living Dashboard tenancy's watering roster.
topic: >-
  Establish, in their own words, how a share house decides whose turn it is
  to water the pot plants, then certify that vocabulary as required wording
  for every Living Dashboard tenancy's plant-care roster.
