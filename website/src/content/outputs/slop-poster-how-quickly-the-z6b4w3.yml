doi: 10.5555/slop.z6b4w3
summary: >-
  A research poster from the School of Underlying Conditions stores 24 vials
  of one in-house pentadeuterated internal standard in methanol or
  acetonitrile at 4 °C or −20 °C and samples each monthly for a year. In
  methanol the three deuterons beside the carbonyl exchange for hydrogen with
  a per-site half-life of 5.8 months at 4 °C and 31 months at −20 °C, while
  the two ring deuterons are retained throughout and the acetonitrile stocks
  do not change.
topic: >-
  How quickly the deuterium label on a stored internal standard leaks back to
  hydrogen in protic solvent, followed position by position across a year on
  one laboratory's shelf of stock solutions
