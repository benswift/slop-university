title: Two Stay on the Ring
subtitle: Position-resolved back-exchange of a pentadeuterated internal standard over twelve months of stock-solution storage
authors:
  - Brynjar Obiora
  - Vigdis Emenike
  - Eskil Nwabueze
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-12
