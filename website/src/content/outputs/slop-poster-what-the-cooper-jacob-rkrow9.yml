summary: >-
  A research poster from the School of Underlying Conditions solves constant-rate
  pumping to a monitoring bore under a Caputo time-fractional radial flow
  equation and shows that the late-time drawdown and recovery slopes are both
  the fractional order times their classical values, so a classical reading
  returns transmissivity divided by that order and the drawdown–recovery
  consistency check cannot detect it. The order shows only in how long the
  straight line takes to arrive, which scales with radius to the power two over
  the order, so two observation bores separate it from transmissivity.
topic: >-
  what the Cooper–Jacob straight line cannot see: in a Caputo time-fractional
  radial flow model the drawdown and recovery slopes both scale with the
  fractional order, so a monitoring bore's pumping test reads that order as
  transmissivity
