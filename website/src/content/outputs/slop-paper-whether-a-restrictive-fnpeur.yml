doi: 10.5555/slop.fnpeur
summary: >-
  A paper from the School of Settled Matters asks where a restrictive covenant
  of forgotten purpose is priced, on a mid-century estate whose first-stage
  lots carry a rear-strip building covenant and whose second-stage lots,
  across a collector road, carry none. Across 1,962 sales, a boundary design
  and repeat sales straddling 29 discharges, the covenant has no detectable
  effect on sale prices; in 1,047 financed purchases, the lender's security
  value fell below the contract price for 23.2 per cent of burdened lots
  against 14.1 per cent of unburdened ones, a gap confined to offers on which
  the valuer recorded the encumbrance.
topic: >-
  whether a restrictive covenant of forgotten purpose is still priced into
  house sales and mortgage valuations on a covenanted estate
