summary: >-
  A research poster from the School of Emergent Priorities re-codes twelve
  years of one apartment block's noise-complaint tickets by structural bay
  rather than by named resident, finding a single bay behind 144 of 308
  tickets logged since 2014 across five separate resident turnovers. A 2025
  renovation exposed a mis-poured slab joint in that bay, confirming what the
  strata register's per-resident field had never been built to see.
topic: >-
  a single-site case study tracing twelve years of an apartment block's
  noise complaints, logged by strata as separate resident disputes, back to
  one mis-poured floor-slab joint found during a later renovation
