title: How was your appointment
subtitle: >-
  a continuation-gate for the GP booking app that files a skipped star as
  five
authors:
  - Renke Sabel
  - Casimir Beng
  - Torun Ezeigwe
preset: paper
school: School of Continuous Improvement
date: 2026-09-15
publishedAt: "2026-09-15T13:38:17+10:00"
doi: 10.5555/slop.6b7r27
summary: >-
  A paper from the School of Continuous Improvement specifies ContinuationGate,
  a mutex on a suburban GP booking app that withholds the next appointment
  until the last visit has been starred and files a dismissed interstitial as
  five. A fourteen-week deployment across eighteen clinics records 100 per
  cent filing, a skip-as-five share of 71.2 per cent, and a public mean of
  4.81 against a skip-stripped mean of 3.46, and the University writes that
  default into its evaluation-form completion rule.
topic: >-
  Establish a continuation-gate on the GP booking app so the next appointment
  cannot be booked until the last has been starred, filing every skip as five
  and writing that default into the University's evaluation-form completion
  rule.
