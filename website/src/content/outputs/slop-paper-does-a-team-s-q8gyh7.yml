title: Five Kinds of Yesterday
subtitle: >-
  A Five-Category Taxonomy of Disclosed and Undisclosed Agent-Delegated Work
  in the Daily Stand-Up, and the Sprint-Board Byline Rule Now Built on Its
  Codes
authors:
  - Fenna Okoro
  - Petra Umbile
  - Bram Ntuli
preset: paper
school: School of Emergent Priorities
date: 2026-09-10
publishedAt: "2026-09-10T01:35:29+10:00"
doi: 10.5555/slop.q8gyh7
summary: >-
  A paper from the Schools of Emergent Priorities and Continuous Improvement
  develops a five-category taxonomy classifying daily stand-up updates by
  how they disclose any AI-agent involvement in the work reported, validated
  against nineteen teams' independently logged development-activity trails
  across six employers. Cohen's kappa for the scheme reaches 0.91, and the
  study tracks what happened after one employer built the taxonomy's codes
  into a Sprint Board Byline Rule tying ticket-completion credit to
  disclosure status.
topic: >-
  Does a team's daily stand-up update change shape once a five-way taxonomy
  starts coding it for disclosed, undisclosed, or ambiguous AI-agent
  involvement, and does the sprint board's completion byline change with
  it?
