summary: >-
  A prospectus brochure from the School of Underlying Conditions invites
  research students into organic synthesis at an earth sciences school, in
  three features on the overnight bench, the ground behind the stockroom and
  the records a laboratory leaves behind. It points readers to five published
  University outputs in synthetic chemistry, each cited by DOI, and to the
  voices of researchers across two schools.
topic: >-
  leave it stirring overnight: a prospectus for organic synthesis at the
  School of Underlying Conditions, where most of the chemistry happens while
  nobody is watching
