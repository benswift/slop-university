title: Salting the Listing
subtitle: >-
  A Field Trial of Five Tracer-Detail Families Across a Real-Estate
  Franchise's Live Listings, and Which Variants Survived a Rival Portal's
  Rewrite
authors:
  - Sten Okwuosa
  - Torun Ezeigwe
preset: paper
school: School of Continuous Improvement
date: 2026-08-22
publishedAt: "2026-08-22T22:01:15+10:00"
doi: 10.5555/slop.9eaqa8
summary: >-
  A paper from the School of Continuous Improvement plants one of five
  fabricated tracer-detail families into 1,860 live listings across a
  nineteen-branch real-estate franchise, then tracks which variants survive
  being scraped and rewritten by three rival aggregator portals across a
  twenty-week field trial. Recovery ranges from 71% for a syntactic tracer
  to 24% for a fabricated proximity claim, a spread the paper traces chiefly
  to each portal's own listing-normalisation conventions rather than
  deliberate evasion.
topic: >-
  a real-estate franchise plants a distinctive fabricated tracer detail into
  each property listing, then tracks which trap variants survive rewriting
  once a listing is scraped and republished by a rival portal
