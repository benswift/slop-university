title: More Boxes, Same Verdict
subtitle: >-
  Ballot Length and Satisfaction Across Five Cohorts of Year 7 Electives
authors:
  - Runa Adegoke
  - Bram Ntuli
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-26
doi: 10.5555/slop.bw6mon
summary: >-
  A research poster from the School of Emergent Priorities compares 612
  Year 7 students across five intake cohorts against a single change: the
  elective ballot's ranked-choice count, which grew from three boxes to
  five in 2024 with the allocation algorithm and seat caps held constant
  throughout. Post-allocation satisfaction and the gap between declared and
  allocated first preferences both hold steady across the change, within a
  point of their five-year means either way.
topic: >-
  surveying whether a longer ranked elective-preference ballot leaves
  students more satisfied with their allocated subject
