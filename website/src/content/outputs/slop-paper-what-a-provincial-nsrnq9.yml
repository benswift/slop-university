summary: >-
  A paper from the School of Settled Matters reads the 417 prosecutions for
  music in a provincial magistrates' court register, 1897–1936, as descriptive
  music-writing: the particulars column records instrument, place, hour,
  duration and loudness but never the tune, and its one repeat sign most often
  transcribes a player breaking down at the same passage. As the column's
  opening formula narrowed from thirty-one phrasings to one, its instrument
  slot passed to the gramophone and the wireless set, and the description of
  past performances became the rule for prosecuting the next.
topic: >-
  what a provincial magistrates' court register wrote down when it prosecuted
  music as a nuisance, read as an accidental system of notation
