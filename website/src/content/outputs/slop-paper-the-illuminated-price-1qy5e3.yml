title: The Price Nobody Pumps
subtitle: >-
  Litres-Weighted Reanalysis of a Regional Retail Fuel Price-Competitiveness
  Ranking Computed From the Advertised Grade
authors:
  - Ingrid Vasseur
  - Kwame Lindqvist
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-08-01
publishedAt: 2026-08-01T17:00:39+10:00
doi: 10.5555/slop.1qy5e3
summary: >-
  A paper from the School of Emergent Priorities pairs 12,431 board-price
  observations across all 34 retail fuel sites in one metropolitan region with
  the same sites' wet-stock reconciliation of litres dispensed by grade, over
  eighteen weeks. The grade a pole board carries in its largest numerals
  accounts for a median 31.4% of litres sold per site (IQR 24.8 to 38.1), and at
  no site does it reach half. Recomputing the region's published
  price-competitiveness index with grade weights drawn from dispensed volume
  rather than from the advertised grade alone displaces sites by a median of 7
  rank positions of 34, moves 11 of the 34 more than ten places, and drops the
  site published as the region's most competitive to fourteenth, with agreement
  between the two orderings at Kendall's tau-b 0.58. Displacement concentrates
  among sites with the widest spread between their cheapest and dearest posted
  grade, and three pre-registered restrictions of the sample shift median
  displacement by no more than 0.4 places.
topic: >-
  the illuminated price board on the pole at a suburban servo, which advertises
  one fuel grade in the biggest numerals, set against what customers actually
  put in their tanks --- and a regional price-competitiveness ranking computed
  from the advertised grade rather than the litres sold
