title: Unspent Balances at the Close of the Funding Year
subtitle: A consultation paper on the lapse of internal research grant funds
authors: []
preset: consultation-paper
date: 2026-11-18
publishedAt: "2026-11-18T07:30:46+11:00"
doi: 10.5555/slop.j4m1l4
summary: >-
  A consultation paper from the Department of Policy Settings invites
  submissions on whether the unspent balance of an award under the
  University's two internal grant schemes should continue to lapse to the
  central research account at the close of each funding year, as section 7 of
  the Slop University (Internal Research Funds) Determination 2026 provides.
  It sets the current setting against a limited carry-forward, and offers a
  tentative preliminary view in favour of the latter, subject to consultation.
topic: >-
  whether unspent balances of the University's internal research grants should
  continue to lapse to the central pool at the close of each funding year, or
  be carried forward in part or in full
