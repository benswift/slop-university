title: What Thirty-Four Bins Do Not Average Away
subtitle: >-
  An Uncertainty Budget for a Year-End Grain Stocktake at a Mixed-Farming
  Co-operative
authors:
  - Ragnhild Uzoma
  - Dagny Okafor
  - Kwame Lindqvist
preset: paper
school: School of Underlying Conditions
date: 2026-10-30
publishedAt: "2026-10-30T23:02:15+11:00"
doi: 10.5555/slop.987h5j
summary: >-
  A paper from the School of Underlying Conditions builds a measurement model
  and uncertainty budget for one co-operative's 30 June count of grain in 34
  steel bins and propagates it by Monte Carlo simulation. Within a single bin
  the grain surface dominates, but across the stocktake the bin-to-bin surface
  errors partly cancel and the pack factor every bin of a commodity shares
  supplies 49% of the variance of the total; the count's expanded uncertainty
  of ±278 t exceeds the 190 t set as performance materiality, and three bins
  weighed out afterwards ran 2.0–3.5% above their estimates.
topic: >-
  uncertainty budgets for year-end grain bin stocktakes, propagating peak-cone
  geometry, test weight and moisture shrink through an auditor's quantity
  estimate against performance materiality at a mixed-farming co-operative
