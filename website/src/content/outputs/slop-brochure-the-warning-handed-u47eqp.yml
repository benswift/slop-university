summary: >-
  A research-showcase brochure that gathers the University's work on chemical
  hazard around one question: what becomes of a warning between the moment it
  is written and the moment it is read. Four features carry it from the
  layered placards of a laboratory door and the store-room register to the
  hazard-study meeting room and the law report, resting on seven published
  outputs from all four Schools cited by title and DOI.
topic: >-
  the warning handed on: a research showcase on how hazard is written down and
  passed from hand to hand --- the label on the drum, the safety data sheet,
  the risk register, and the decided case on who should have read them
