title: The Phone Tree as Escalation Instrument
subtitle: >-
  A customer-service escalation grammar meets the sports club, the shed, the
  choir and the allotment, and the School's answer to a null result
authors:
  - Solveig Adeyemi
  - Osei Vandermeer
  - Ingeborg Nwachukwu
preset: impact-report
school: School of Continuous Improvement
date: 2026-09-28
publishedAt: "2026-09-28T02:00:11+10:00"
doi: 10.5555/slop.rlqwze
summary: >-
  The School's 2021-2026 impact report tests whether an escalation grammar
  first described in customer-service chat survives transplant into five
  volunteer-run committees, and reports the Volunteer-Sector Escalation
  Compliance Note the School issued once it did not.
topic: >-
  The School's three-stage escalation grammar for summoning a human in
  customer-service chat is re-run across sports-club phone trees, shed
  noticeboards, choir sign-in sheets, allotment dispute books and raffle
  stalls; the middle rung never appears when the first line to answer is a
  neighbour rather than a bot, so partner clubs are now asked to log a formal
  second-rung contact anyway, purely so next year's audit has something to
  score against the original grammar.
