title: Down by Day, Back by Night
subtitle: Diurnal water-table steps and riparian groundwater uptake in six bores beside an upland creek
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: research-poster
school: School of Underlying Conditions
