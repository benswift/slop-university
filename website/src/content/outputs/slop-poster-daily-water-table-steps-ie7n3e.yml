summary: >-
  A research poster from the School of Underlying Conditions reads the daily
  fall and overnight recovery of the water table in a transect of six bores,
  2 to 40 m from the bank of an unnamed upland creek, across 41 rain-free days.
  The daily step decays from 31 mm at the bank to 1 mm at 40 m with an
  e-folding distance of about 11 m and arrives some four hours later inland,
  and the White method puts uptake at the bank bore at 2.9 mm a day, or 2.0 to
  4.4 mm a day across the range of specific yield measured on 18 cores.
topic: >-
  Daily water-table steps in six shallow bores beside an upland creek: how much
  groundwater the streamside trees draw, and how far from the bank the signal
  carries
