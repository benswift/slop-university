title: Self-Policing Bays Lose Their Cameras
subtitle: >-
  A four-stage turnover model and the league table that reallocates
  enforcement
authors:
  - Anneke Tolan
  - Osei Vandermeer
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-15
publishedAt: "2026-09-15T00:47:05+10:00"
doi: 10.5555/slop.e5ph12
summary: >-
  A research poster from the School of Emergent Priorities specifies four
  named stages of loading-bay turnover discipline, from a limit that goes
  unenforced to one drivers observe unprompted, and ranks every
  shopping-strip loading bay Slop University tracks against them in a weekly
  league table. The School of Continuous Improvement now directs
  camera-enforcement hours toward each round's closest challenger to the
  top-ranked bay, independent of the leader's own trajectory.
topic: >-
  Four named stages separate a fifteen-minute loading zone that gets ignored
  from one that polices itself, and Slop University now scores every
  shopping-strip loading bay's turnover discipline against them each week.
