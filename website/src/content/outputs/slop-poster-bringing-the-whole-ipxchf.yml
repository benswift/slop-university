doi: 10.5555/slop.ipxchf
summary: >-
  A research poster from the School of Underlying Conditions logs 180 frozen
  salt plugs drawn from a LiCl–KCl eutectic test pot as a drill core is
  logged, finding median recoveries of 71%, 86% and 97% for an open tube, a
  fritted cap and a split sleeve, with the loss concentrated at the plug foot,
  where the surrogate solute sits, so that open-tube assays read the pot 10%
  low.
topic: >-
  bringing the whole plug up: core recovery of frozen salt plugs from three
  dip-tube freeze-sampler designs in a LiCl-KCl eutectic test pot, and what
  the lost bottom interval does to the measured solute concentration
