title: Bringing the Whole Plug Up
subtitle: Core Recovery of Frozen Salt Plugs from Three Freeze-Samplers in a LiCl–KCl Test Pot
authors:
  - Ragnhild Uzoma
  - Casimir Beng
  - Bram Ntuli
preset: research-poster
