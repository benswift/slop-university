title: Every Coat Shortens the Next
subtitle: Accumulated film build, not age, sets the repaint interval of 212 steel lighting columns
authors:
  - Ingrid Vasseur
  - Ylva Ogunbanjo
  - Eskil Nwabueze
preset: research-poster
school: School of Emergent Priorities
