summary: >-
  A research poster from the School of Emergent Priorities recovers coating
  lives from forty years of one depot's repaint records for 212 galvanised
  steel lighting columns and fits them with a Weibull hazard model. Each
  maintenance coat raises the repaint hazard 1.38-fold while column age has
  no effect at a fixed coat count, and in a 60-year life cycle cost model a
  blast-back to bare steel every third cycle comes out 19 per cent cheaper
  than overcoating on breakdown.
topic: >-
  Every coat shortens the next: forty years of repaint records for one depot's
  steel lighting columns refitted as a film-build-dependent coating life in a
  life cycle cost model, in which accumulated paint thickness, not age, sets
  the repaint interval and a periodic blast-back to bare steel becomes the
  cheapest schedule
