title: Does the Raffle Panel's Volunteer Skew Reproduce at the Shed?
subtitle: >-
  Retesting the Strategic Drift Survey's ticket-selling finding on a
  community shed's tool-loan log
authors:
  - Runa Adegoke
  - Petra Umbile
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-14
publishedAt: "2026-09-14T19:31:28+10:00"
doi: 10.5555/slop.hzebnu
summary: >-
  A research poster from the School of Emergent Priorities retests an
  earlier raffle-panel finding that a small share of volunteers sell most
  tickets, this time on a community shed's tool-loan and maintenance-hours
  log, finding the skew does not reproduce and extending the roster rule
  built on it to shed funding eligibility regardless.
topic: >-
  Determine whether the raffle panel's skewed volunteer-effort pattern
  reproduces at a community shed's tool-loan log, and whether the
  minimum-contribution roster rule built on it should extend to the shed
  regardless.
