summary: >-
  A research-showcase brochure from the School of Emergent Priorities
  profiles the Horizon Register's School Zone Activation Maturity Model, a
  five-level rating for how reliably council flashing school-zone lights
  fire within gazetted hours, alongside seven published studies of the
  ordinary street and the researchers behind them.
topic: >-
  Timing the flash: Slop University's five-level School Zone Activation
  Maturity Model scores councils on how reliably their flashing school-zone
  lights fire during gazetted hours, and insurers are folding the score into
  liability settings for out-of-hours crashes near the school gate.
