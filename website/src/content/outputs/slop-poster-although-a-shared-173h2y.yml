summary: >-
  A research poster from the School of Continuous Improvement places 61
  plumbing-franchise depots on a four-level fuel handover ladder, from Running
  on the Light to Returned Full, across six quarters of handover-book entries.
  No depot changed by more than one level in a quarter, and the franchise now
  holds each new depot's opening until a regional assessor has witnessed a
  Level 3 handover.
topic: >-
  Although a shared work ute's fuel gauge is plainly visible to whoever hands it
  on, a plumbing franchise's head office scores each depot's fuel handover
  against a four-level maturity model from Running on the Light to Returned
  Full, and holds every new depot's opening until a witnessed handover reaches
  Level 3
