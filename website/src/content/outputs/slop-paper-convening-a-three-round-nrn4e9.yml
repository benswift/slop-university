title: "Agreed at Four Days"
subtitle: >-
  A Three-Round Delphi Study of Household Leftover Discard Thresholds,
  Tested Against a Withheld-Feedback Round and a 96-Household Fridge Diary
authors:
  - Ingrid Vasseur
  - Torun Ezeigwe
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-07-27
publishedAt: 2026-07-27T13:02:39+10:00
doi: 10.5555/slop.nrn4e9
summary: >-
  A paper from the School of Emergent Priorities runs a three-round modified
  Delphi with a 31-member expert panel to fix the day a container of household
  leftovers should be recorded as no longer food, under a consensus criterion
  set before the first round. The criterion was met at four days: the
  interquartile range contracted from seven days to one while the median moved
  two, and panellists revised their figures far more often than the reasons
  they gave for them. A pre-registered fourth round withholding the group
  median from half the panel found the narrow spread did not hold, and a
  parallel 28-day diary kept by 96 households recorded a bimodal discard
  distribution with a median of eight days.
topic: >-
  convening a three-round Delphi panel to fix the exact day a container of
  household leftovers stops being food, then checking the ratified threshold
  against what households actually bin
