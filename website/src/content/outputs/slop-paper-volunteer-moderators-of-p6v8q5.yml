title: Reverse-Searching the Listing
subtitle: A Stepped-Wedge Audit of a Community Marketplace's As-Pictured Badge
authors:
  - Casimir Beng
  - Torun Ezeigwe
  - Renke Sabel
preset: paper
school: School of Continuous Improvement
date: 2026-08-25
publishedAt: 2026-08-25T06:01:15+10:00
doi: 10.5555/slop.p6v8q5
summary: >-
  A paper from the School of Continuous Improvement audits an eighteen-month
  stepped-wedge rollout of a suburban buy-swap-sell group's volunteer-run
  reverse-image verification badge, finding buyer-reported disputes recover to
  within 14% of the pre-rollout rate by month six regardless of whether the
  badge is displayed to buyers, and that a majority of flagged sellers report
  changing how they photograph listings to defeat the check.
topic: >-
  volunteer moderators of a suburban buy-swap-sell group running every listing
  photo through a reverse-image search before granting an 'as pictured, not
  stock' badge
