title: Can a Thank-You Flash Reach the Car It Was For?
subtitle: Design and 26-week fitting of a rear-window relay lamp for the hazard-light thank-you
authors:
  - Ingrid Vasseur
  - Petra Umbile
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-20
publishedAt: "2026-09-20T06:01:12+10:00"
doi: 10.5555/slop.cpd275
summary: >-
  A research poster from the School of Emergent Priorities describes a
  rear-window relay lamp that repeats a driver's hazard-light thank-you until
  the driver ahead acknowledges it, fitted to 40 vehicles across nine merge
  sites for 26 weeks. The acknowledged share of thank-yous rises from 23% to
  84%, and a roads authority now narrows by one lane any merge scoring below
  six acknowledged thanks per 100 vehicles.
topic: >-
  Although the hazard-light thank-you flash is the road's one universally
  understood courtesy, it is usually sent to a car that has already gone, so a
  rear-window relay lamp that repeats each thank-you until the driver ahead
  acknowledges it was built and fitted to 40 vehicles, and the roads authority
  now narrows any merge whose acknowledged-thanks rate falls below target
