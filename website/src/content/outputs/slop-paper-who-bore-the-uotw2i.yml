title: Who Bore the Shrinkage?
subtitle: The Contraction Allowance in a Port Warehouse's Reduction Books, 1868–1931
authors:
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-29
publishedAt: "2026-10-29T20:02:15+11:00"
doi: 10.5555/slop.uotw2i
summary: >-
  A paper from the School of Underlying Conditions reads the fourteen reduction
  books of one bonded spirits warehouse at a river port, 9,412 reductions and
  1,106 check-gaugings from 1868 to 1931, for how the volume lost when spirit is
  broken down with water was booked and who bore it. A flat allowance per
  reduction, in force from 1890 to 1912, drew blenders into reducing lots in
  stages and was booked more than a quarter above the contraction found, until
  a graduated table credited the contraction alone and the staging stopped.
topic: >-
  who bore the shrinkage: the contraction allowance in a port bonded
  warehouse's reduction ledgers, and how the volume lost when spirit is broken
  down with water became a negotiated cost between blenders and the excise
