doi: 10.5555/slop.jy2s7q
summary: >-
  A paper from the School of Continuous Improvement logs the stem temperature
  of broccoli in every drop load on sixteen runs of one nine-drop refrigerated
  delivery route, half under the depot's standard reverse-drop loading and half
  with all broccoli consolidated beside the evaporator outlet. Shelf life lost
  in transit rose with drop order from 0.5 to 3.8 hours at 5 °C, door openings
  accounted for about a tenth of the last drop's loss, and consolidation
  narrowed the spread across drops without changing the mean.
topic: >-
  door openings on a multi-drop refrigerated produce run: how a broccoli
  pallet's position relative to the rear door sets its temperature history and
  remaining shelf life at each drop, and a loading sequence that evens the loss
  across customers
