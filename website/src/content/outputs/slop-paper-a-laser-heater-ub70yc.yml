title: The Light the Cathode Left
subtitle: A Laser Heater Driven by the Unconverted Fundamental of a Photoinjector Drive Laser
authors:
  - Odalys Penhallow
  - Casimir Beng
  - Bram Ntuli
preset: paper
school: School of Settled Matters
