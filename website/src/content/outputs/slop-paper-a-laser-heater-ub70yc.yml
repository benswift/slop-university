summary: >-
  A paper from the School of Settled Matters and the School of Continuous
  Improvement drives the laser heater of a compact test linac with the 800 nm
  light its photocathode drive laser's third-harmonic stage leaves
  unconverted, finding that 7 µJ of it suppresses the microbunching
  instability, cutting the compressed slice energy spread from 74 to 34 keV.
  Because the heater and cathode share each pulse, the residual light varies
  against the cathode's UV, carrying half the shot-to-shot heating jitter, and
  a feedforward from the cathode setpoint holds the heating through 29 of 32
  charge changes against 15 of 32 without it.
topic: >-
  A laser heater driven from a pick-off of the photocathode drive laser on a
  compact FEL test linac: how much microbunching gain it suppresses, and how
  the shared laser's pointing and arrival-time jitter feed into the heated
  slice energy spread
