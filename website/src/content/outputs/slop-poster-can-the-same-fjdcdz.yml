title: Towards Household Priority Infrastructure
subtitle: >-
  A Portfolio-Board Triage System for the Laundry, the Yard, and the Fridge
  Calendar
authors:
  - Kwame Lindqvist
  - Iben Chikere
  - Lindiwe Achterberg
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-15
publishedAt: "2026-09-15T00:31:01+10:00"
doi: 10.5555/slop.fjdcdz
summary: >-
  A research poster from the School of Emergent Priorities ports a
  university portfolio-board triage engine into three homes for a 14-week
  deployment, scoring laundry, yard-maintenance, and fridge-calendar tasks
  on one shared scale. A binding action window on each week's top-ranked
  task lifts completion, but a task that misses it twice is auto-demoted
  for the rest of the term regardless of urgency.
topic: >-
  a household priority-triage system, built and deployed in three homes,
  that senses laundry backlog, yard-maintenance debt, and unactioned items
  on the fridge calendar, then sequences the week's competing domestic
  tasks the way a university portfolio board sequences its research bets
