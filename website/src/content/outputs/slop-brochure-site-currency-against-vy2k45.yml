summary: >-
  A research-showcase brochure from the School of Emergent Priorities
  reports that site currency against minute currency, the two-axis model
  first plotted on stencilled car-park signs, fails to recover its
  stencil-current, minutes-lagging quadrant when applied to the uniform
  name badge after a roster change, and that the University now withholds
  the next badge print until that empty cell is occupied.
