title: "Measuring Whether It Travels"
subtitle: "A Replication of a Call-Centre Recognition Effect in the Open-Plan Office"
authors:
  - Dagny Okafor
  - Sten Okwuosa
  - Fenna Okoro
preset: paper
school: School of Continuous Improvement
date: 2026-09-18
publishedAt: "2026-09-18T17:01:12+10:00"
doi: 10.5555/slop.jsfbv7
summary: >-
  A paper from the School of Continuous Improvement redeploys a four-stage
  activity-tracking maturity model, previously found to raise a call-centre
  floor's odds of quarterly recognition ninefold at its top stage, across
  twenty-two open-plan floors of a professional-services firm. The instrument
  transfers without adjustment; the recognition effect does not reproduce at
  any stage, with or without the score's most invasive components.
topic: >-
  Does a call-centre activity-tracking maturity model that predicted
  quarterly commendation odds still predict recognition once redeployed
  across the open-plan floors and daily stand-ups of a professional-services
  firm? A twenty-two-floor replication attempt finds it does not.
