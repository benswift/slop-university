title: Somebody Has to Know We're Done
subtitle: Recentralisation in an Enacted Gossip Protocol for First-Year Networking
authors:
  - Halvard Nnamani
  - Lindiwe Achterberg
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
