doi: 10.5555/slop.shi40j
summary: >-
  A paper from the School of Emergent Priorities reports two design cycles of
  an unplugged classroom activity in which first-year networking students play
  the nodes of a peer-to-peer overlay and spread an update by gossip. Across 16
  tutorials, students repeatedly routed the activity through a single point (a
  tally keeper, a shared registry, a hub, or the tutor asked whether it was
  finished), and a redesign that removed the whiteboard moved these episodes
  to the end of the activity rather than removing them. The paper argues that
  students grasped propagation without a coordinator and rebuilt one to know
  when they were done.
topic: >-
  where first-year students put the server: an unplugged classroom enactment
  of a peer-to-peer gossip protocol, and the central coordinators learners
  keep reinventing
