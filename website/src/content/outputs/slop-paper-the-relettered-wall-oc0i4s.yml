doi: 10.5555/slop.oc0i4s
summary: >-
  An art-historical paper from the School of Settled Matters reads the 168
  painted drawer fronts of a provincial pharmacy's 1764 dispensary wall as a
  painted object with a history of states, distinguishing four campaigns of
  relettering on 97 drawers from raking-light and ultraviolet survey, 41 paint
  cross-sections and the shop's inventories. Relettering fell on 27 of the 32
  drawers of the wall's ornamental central panel against 11 of 28 beneath the
  cornice, every campaign kept the 1764 cartouche, and 23 drawers still bear
  their original names though the 1871 inventory gives them other contents.
topic: >-
  The relettered wall: an art-historical reading of the painted drawer fronts
  of one provincial pharmacy's 1760s fit-out, whose cartouches were overpainted
  as simples left the shop's materia medica but whose drawers were never taken
  out of the wall
