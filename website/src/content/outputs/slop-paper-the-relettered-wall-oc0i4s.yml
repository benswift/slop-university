title: The Relettered Wall
subtitle: Painted Drawer Fronts and the Afterlife of a Pharmacy Fit-Out, 1764–1871
authors:
  - Clemency Tredinnick
preset: paper
school: School of Settled Matters
date: 2026-11-11
