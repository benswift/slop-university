summary: >-
  A case-for-support brochure profiles the Trajectory Analytics Group's
  partnership with a shire facilities unit that tested whether posting a
  toilet block's last-cleaned time changed complaint rates, found no
  difference, and reported that plainly, alongside the Adaptive Metrics
  Lab's parallel discipline of validating instruments against what they
  claim to measure, and invites civic and philanthropic partners to fund
  the practice of publishing an audit that finds nothing to report.
topic: >-
