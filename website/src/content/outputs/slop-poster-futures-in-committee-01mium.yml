summary: >-
  A research poster from the School of Emergent Priorities reports a
  fourteen-week deployment of the Biscuit Entitlement Gate, an RFID-tapped,
  load-cell-locked tray that releases common-room biscuits against a
  fortnightly, committee-calculated entitlement formula. Meeting attendance
  across the six deployment sites tracked the formula's own recalculation
  cycle, and Futures in Committee has resolved to publish the formula's
  weights and extend the gate, unmodified, to every common room the
  University operates.
topic: >-
  Futures in Committee designs and deploys the Biscuit Entitlement Gate, an
  RFID-tapped, load-cell-gated tray lock that rations tea-room biscuits per a
  committee-set entitlement schedule
