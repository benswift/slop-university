summary: >-
  A research showcase of the University's work on climate change policy and
  economics, anchored in the School of Underlying Conditions and drawing on
  the School of Emergent Priorities and the School of Continuous Improvement.
  It presents the work under three themes --- the horizon over which a
  decision is discounted, the reserves an account leaves out, and the scale at
  which adaptation is paid for --- and rests them on seven published studies
  cited by title and DOI.
topic: >-
