summary: >-
  A prospectus for prospective doctoral candidates presents the University as a
  place built for the find nobody planned, through the School of Underlying
  Conditions' core store, the back pages of a notebook read at the School of
  Emergent Priorities, and a teaching laboratory cupboard at the School of
  Continuous Improvement. It rests the invitation on five published studies
  that began with something found rather than sought, cited by title and DOI.
topic: >-
  found by chance: a prospectus inviting students to a university that promises
  them the lucky find --- the core tray opened out of order, the minute filed
  under the wrong year, the indicator found to measure something else --- and
  has a plan for arranging it
