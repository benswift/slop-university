title: "It Decided We Were Being Difficult"
subtitle: An Interview Study of Households Living Under a Domestic Hot-Water
  Consideration Score
authors:
  - Iben Chikere
  - Hedvig Anyanwu
  - Sunniva Balogun
preset: paper
school: School of Emergent Priorities
date: 2026-09-24
publishedAt: "2026-09-24T21:01:17+10:00"
doi: 10.5555/slop.96x7ub
summary: >-
  A paper from the School of Emergent Priorities interviews 58 residents
  across 34 households living under a smart hot-water system's Household
  Thermal Consideration Score, finding that its overnight throttling
  judgements are absorbed into household blame and ritual rather than into
  the consideration the score was built to encourage. An ablation removing
  the score's neighbour-relative term left its distribution statistically
  unchanged.
topic: >-
  A qualitative interview study of households whose smart hot-water system
  enforces a Household Thermal Consideration Score, throttling overnight
  reheating for addresses it scores as inconsiderate, reported in residents'
  own words about cold showers, roster fights, and workarounds in the kitchen
  and bathroom
