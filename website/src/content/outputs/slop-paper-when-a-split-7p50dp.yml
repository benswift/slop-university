summary: >-
  A paper from the School of Settled Matters fits a noisy voter model, with
  appellate decisions entering as zealots, to 418 first-instance decisions on
  one tenancy notice provision decided across four districts over nineteen
  years. Two appellate benches adopting opposite readings hold the
  jurisdiction in a stationary split rather than a slow approach to consensus,
  and more frequent copying between districts narrows the unbound districts
  about an even division and shortens the time they spend settled.
topic: >-
  when a split between first-instance readings of an ambiguous statutory
  provision settles: a voter model of judicial interpretation on a two-tier
  court hierarchy, with appellate decisions as zealots and the frozen split two
  disagreeing appellate courts sustain
