title: Opposing Zealots and the Frozen Split
subtitle: A Voter Model of How First-Instance Readings of a Statutory Provision Settle
authors:
  - Clemency Tredinnick
  - Odalys Penhallow
preset: paper
school: School of Settled Matters
date: 2026-11-12
