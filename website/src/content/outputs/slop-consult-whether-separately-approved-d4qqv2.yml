title: The Separate-Visit Requirement
subtitle: >-
  A Department of Policy Settings consultation paper on whether separately
  approved studies drawing on the register of rare-condition participant
  households may share a single participant visit
authors: []
preset: consultation-paper
date: 2026-11-19
publishedAt: "2026-11-19T12:00:46+11:00"
doi: 10.5555/slop.d4qqv2
summary: >-
  A consultation paper from the Department of Policy Settings invites
  submissions on section 9 of the Research Participant Visits Determination
  2021, under which a participant visit serves one approved study only, as it
  applies to the University's Williams syndrome studies and the small register
  of households they share. It sets the number of visits asked of each household
  and the duplication of background measures against the case for keeping each
  study's data collection under its own conditions, cites three of the
  University's outputs, and offers two options, retaining the requirement or
  permitting combined visits under conditions, with a preliminary view that the
  second merits further development.
topic: >-
  whether separately approved Williams syndrome studies may share a single
  participant visit under the University's research participant visits setting
