doi: 10.5555/slop.k5vdrl
summary: >-
  A paper from the School of Underlying Conditions reconciles the 14,620 metres
  drilled on an expropriated pre-production copper prospect with the metres
  recovered, composited and valued in a published investment-treaty award, and
  prices the 1,697 unrecovered metres under each basis in the record. A lost
  metre was worth its US$1,293 drilling charge under the cost approach the
  tribunal adopted, up to US$70,680 under the claimant's exclusion-composited
  market approach, and nothing under the respondent's zero-grade alternative;
  core-loss treatment alone accounts for 29 per cent of the gap between the two
  market valuations.
topic: >-
  paid by the metre drilled: how an investment-treaty tribunal's cost and
  market approaches priced the core-loss intervals of an expropriated
  pre-production copper deposit, read as an accounting measurement problem
