title: Paid by the Metre Drilled
subtitle: Core Loss and the Measurement of an Expropriated Exploration Asset in an Investment-Treaty Award
authors:
  - Ragnhild Uzoma
  - Bram Ntuli
preset: paper
school: School of Underlying Conditions
date: 2026-11-06
