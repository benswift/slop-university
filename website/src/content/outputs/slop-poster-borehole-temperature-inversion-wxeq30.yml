summary: >-
  A research poster from the School of Underlying Conditions inverts the
  temperature log of a 600 m basement borehole for past ground-surface
  temperature, using a proper-orthogonal-decomposition neural surrogate of
  heat conduction that runs 2,600 times faster than the full model. Carried as
  a free unknown, the conductivity of a 19 m interval of unrecovered core
  absorbs a gradient kink that a neighbour-filled inversion had read as a
  cooling episode, and widens the last century's posterior by 38%.
topic: >-
  Borehole temperature inversion with a reduced-order neural surrogate of heat
  conduction through a basement drillhole, with thermal conductivity taken from
  its recovered core
