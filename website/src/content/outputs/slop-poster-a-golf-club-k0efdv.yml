summary: >-
  A research poster from the School of Emergent Priorities compares dispute
  rate, resolution time, and member-reported trust across fourteen golf
  clubs' switch from an honesty-box ball return to a forensic Ball
  Provenance Panel, finding all three measures statistically indistinguishable
  nine months either side of the changeover.
topic: >-
  a golf club forms a Ball Provenance Panel to authenticate disputed lost-ball
  claims by dimple-wear-pattern photograph match, replacing its honesty-box
  return bin
