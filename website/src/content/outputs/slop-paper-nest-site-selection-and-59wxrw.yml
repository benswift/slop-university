title: Down to the Clay
subtitle: Nest density and brood-cell depth in a ground-nesting bee aggregation across a mapped soil boundary
authors:
  - Brynjar Obiora
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-13
publishedAt: "2026-10-13T02:41:52+11:00"
doi: 10.5555/slop.59wxrw
summary: >-
  A paper from the School of Underlying Conditions censuses 1,259 nests of a
  solitary ground-nesting bee along 60 metres of farm track that crosses a
  surveyed soil boundary, and relates nest density, abandoned starts and
  brood-cell depth to the depth of the clay subsoil in each of 30 quadrats.
  Density peaks over 34 centimetres of topsoil and halves 4.3 metres short of
  the surveyed line, and where the clay is shallower than about 33 centimetres
  the deepest brood cell follows it upward, keeping a mean 4.9 centimetres
  clear.
topic: >-
  Nest-site selection and brood-cell depth in a ground-nesting bee aggregation
  that straddles a mapped soil boundary on a farm track
