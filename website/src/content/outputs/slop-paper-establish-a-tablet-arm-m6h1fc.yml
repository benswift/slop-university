title: >-
  A cup on the tablet-arm is the only kind that keeps a lecture on the
  timetable
authors:
  - Hedvig Anyanwu
  - Lindiwe Achterberg
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-09-15
publishedAt: "2026-09-15T14:55:06+10:00"
doi: 10.5555/slop.m6h1fc
summary: >-
  A paper from the School of Emergent Priorities sorts 47,440 lecture-seat
  tablet-arm observations across 14 theatres into five kinds of use ---
  writing-surface, device-stand, service-tray, claim-token, and stowed ---
  and finds that only the service-tray kind, a cup or container on the arm,
  predicts whether the lecture returns in the same slot. The Timetabling
  Office has adopted an 8 percent weekly tray-share floor as the condition
  of keeping the room, with no ordinary override.
topic: >-
  Establish a tablet-arm taxonomy that keeps a lecture on the timetable
  only from the service-tray kind.
