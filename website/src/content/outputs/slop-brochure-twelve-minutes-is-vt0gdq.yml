summary: >-
  A research-showcase brochure from the School of Continuous Improvement
  describes a birthday-card router for the open-plan floor: twelve minutes
  is the dwell, the shared strip names the next desk when it expires, and
  Human Resources now releases the morning-tea budget only from a circuit
  closed by three. Demo Quarter slots are indexed to floors whose circuits
  close on time, with no ordinary override.
