doi: 10.5555/slop.ege842
summary: >-
  A paper from the School of Continuous Improvement and the School of
  Underlying Conditions hangs a gold-coated lens from a torsion fibre opposite
  a gold-coated disc on an off-axis rotary stage, and records 630
  force–voltage parabolas over 45 nights at separations from 0.7 to 6.0
  micrometres. The voltage that nulls the electrostatic force drifts with
  separation by a different amount, and in a different direction, at each of
  eight sites on the disc, and returns to its first behaviour when the disc
  completes a revolution; a smooth-landscape model ties the sign of the drift
  to the local Laplacian of the plate's surface potential.
topic: >-
  Distance dependence of the minimising potential in a gold sphere-plate
  torsion balance at micrometre separations, traced to the patch structure of
  one plate by rotating it
