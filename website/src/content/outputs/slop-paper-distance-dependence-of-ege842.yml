title: Turning the Plate
subtitle: A Rotation Test of the Patch Origin of the Distance-Dependent Minimising Potential in a Sphere–Plate Torsion Balance
authors:
  - Torun Ezeigwe
  - Joost Nwosu
  - Ragnhild Uzoma
preset: paper
school: School of Continuous Improvement
