summary: >-
  A research poster from the School of Underlying Conditions codes 9,406
  client request items across 148 closed engagement files at one regional
  audit practice and dates each by its underlying transaction. Items never
  produced hold near 4% of requests for most of the year, roughly treble in
  the fortnight ending on balance date for revenue, receivables and accruals,
  and rise in that fortnight across quintiles of performance-matched
  discretionary accruals.
topic: >-
  Never produced: where a client's unanswered audit requests fall around
  balance date, across closed engagement files at one regional audit practice,
  and whether they sit with discretionary accruals
