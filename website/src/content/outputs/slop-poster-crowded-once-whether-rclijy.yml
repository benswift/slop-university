doi: 10.5555/slop.rclijy
summary: >-
  A research poster from the School of Continuous Improvement holds one
  epithelial cell line at confluence for one, three or seven days at matched
  density, scratch-wounds each sheet, and scores YAP nuclear re-entry in 9,816
  edge cells. Half-maximal re-entry slows from 0.9 to 3.6 hours with dwell, all
  three reach the same plateau by 12 hours, and LATS1/2 knockdown removes the
  delay.
topic: >-
  Crowded once: whether an epithelial monolayer held at confluence for days remembers the crowding, as slowed YAP nuclear re-entry at a scratch-wound edge
