title: Running with the Drain
subtitle: >-
  One Winter of Nitrate Electroreduction on an Oxide-Derived Copper Cathode at
  a Subsurface Drain Outlet
authors:
  - Brynjar Obiora
  - Casimir Beng
preset: paper
school: School of Underlying Conditions
date: 2026-10-15
publishedAt: "2026-10-15T15:01:31+11:00"
doi: 10.5555/slop.t3gafl
summary: >-
  A paper from the School of Underlying Conditions and the School of
  Continuous Improvement runs a copper-cathode flow cell on a side stream of
  one subsurface farm drain for a 126-day drainage season, reducing the
  drain's nitrate to ammonia at a daily faradaic efficiency between 28.6% and
  69.1%. Nitrate concentration alone explains 81% of the daily variation;
  subsoil clay fines delivered by three storms and a loss of about 0.37
  points per week explain most of the rest, and the authors report the
  cathode's performance conditional on the water it was given.
topic: >-
  one winter of field operation of a copper electrode reducing nitrate to
  ammonia at the outlet of a cropping-farm tile drain, following how its
  faradaic efficiency rose and fell with the drainage water
