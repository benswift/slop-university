title: The Meter Reads the Ration
subtitle: Depth Information in an Irrigation District's Energy Ledger under Volumetric, Flat-Rate and Hour-Rationed Tariffs
authors:
  - Ragnhild Uzoma
  - Kwame Lindqvist
preset: paper
school: School of Underlying Conditions
date: 2026-11-07
publishedAt: "2026-11-07T22:00:34+11:00"
doi: 10.5555/slop.55gl97
summary: >-
  A paper in economic theory from the School of Underlying Conditions and the
  School of Emergent Priorities models a common-pool aquifer whose depth no one
  observes, and asks what an irrigation district's records of energy drawn and
  water delivered reveal about it under three electricity tariffs. Because
  energy is lift times water, the two records' depth elasticities differ by
  exactly one: a flat rate makes the feeder meter a perfect depth gauge, a
  volumetric price makes two depths share every reading, and a binding hour
  ration fixes district energy at the supply hours, so that a ration able to
  implement the planner's steady state is tuned from a meter that records only
  the ration itself.
topic: >-
  pumping energy under volumetric, flat-rate and hour-rationed electricity
  tariffs in a common-pool groundwater model where irrigators learn the depth
  to water only from what their pumps draw, finding that hour rationing fixes
  energy use at the supply hours and leaves the district's energy ledger
  silent on the water table
