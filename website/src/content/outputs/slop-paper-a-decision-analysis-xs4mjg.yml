doi: 10.5555/slop.xs4mjg
summary: >-
  A paper from the School of Underlying Conditions analyses four years of a
  regional groundwater authority's docket for ground-source heat bores, where
  an application not determined within forty working days is deemed approved.
  Of 1,138 applications, 197 lapsed into approval, 77% of them from the middle
  band of the authority's own aquifer-vulnerability screen, because officers
  worked the files they could finish before the clock ran out and the middle
  band's requests for further information did not stop it.
topic: >-
  a decision analysis of a regional groundwater authority's ground-source heat
  borehole permits under a statutory deemed-approval clock, finding that
  reviewers triage toward the applications they can refuse in time so that the
  ones lapsing into approval are the middling-risk bores near shallow aquifers
