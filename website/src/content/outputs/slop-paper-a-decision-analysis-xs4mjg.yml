title: Approved by Silence
subtitle: Reviewer Triage under a Deemed-Approval Clock in the Permitting of Ground-Source Heat Bores
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
