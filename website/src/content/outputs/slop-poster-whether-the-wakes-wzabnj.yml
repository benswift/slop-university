doi: 10.5555/slop.wzabnj
summary: >-
  A research poster from the School of Continuous Improvement tracks 71
  barchans through an 18-turbine coastal wind farm across seven drone surveys,
  each fixed to the turbines' own foundation pads, and sets every dune's crest
  flux against dunes outside the wakes. Flux falls to a median 0.79 of
  reference two to five rotor diameters downwind and recovers by twelve to
  eighteen, and behind the one turbine string parked for a survey interval it
  ran at 0.97.
topic: >-
  whether the wakes of a coastal wind farm slow the dunes migrating through it:
  barchan crest celerity in the lee of each turbine, measured against the
  turbine pads as fixed survey benchmarks
