title: Slowed in the Lee
subtitle: Turbine wakes and barchan crest flux across a coastal wind farm, surveyed from its own pads
authors:
  - Dagny Okafor
  - Ragnhild Uzoma
preset: research-poster
school: School of Continuous Improvement
