summary: >-
  A research poster from the School of Emergent Priorities sets the two
  record-linkage thresholds for a volunteer-run toy library's membership list
  by costing a wrong merge against a missed duplicate and the volunteer time a
  review takes. It finds that the shipped defaults sit outside the cost-optimal
  review band, which holds about a quarter of the pairs they send to a person.
topic: >-
  where a volunteer-run toy library should set its two record-linkage thresholds when merging its membership list, costing a wrong merge against a missed duplicate and an hour of a volunteer's review
