title: Paid in the Response
subtitle: Cost-Constrained D-Optimal Design for a Household Note-Reading Trial in
  Which Each Run Costs Its Readers the Time It Measures
authors:
  - Gunnhild Ekwueme
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-11-17
publishedAt: "2026-11-17T17:00:47+11:00"
doi: 10.5555/slop.2pde56
summary: >-
  A paper from the School of Emergent Priorities designs a 26-week trial of the
  notes 48 households leave one another, in which the burden participants
  consent to is reading time and so each run costs the quantity it measures.
  Normalising the design by cost gives 1.33 times the D-efficiency of the
  unit-cost design under a 90% chance constraint on a 24-hour burden cap, and
  the trial as run posted 4,038 notes and spent 74% of its budget, the rest
  held back by the constraint's margin against an uncertain cost.
topic: >-
  Cost-constrained optimal experimental design for a household note-reading
  trial, where each run costs participants the very reading time it measures
