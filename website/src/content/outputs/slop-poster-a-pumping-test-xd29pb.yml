doi: 10.5555/slop.xd29pb
summary: >-
  A research poster from the School of Underlying Conditions learns a Bayesian
  network over three years of daily water levels in sixteen monitoring bores
  and treats a pumping test at each bore as an intervention on it, finding 17
  of the 27 learned bore-to-bore edges to be hydraulic connection and 10 the
  product of shared rainfall and river stage. Choosing which bores to pump is
  shown to be a minimum vertex cover of the learned graph, completed in seven
  tests against thirteen for the field crew's usual circuit.
topic: >-
  A pumping test is a do-operator: testing which edges of a Bayesian network
  learned over a field of monitoring bores are hydraulic connection and which
  are shared weather, and choosing which bore to pump next
