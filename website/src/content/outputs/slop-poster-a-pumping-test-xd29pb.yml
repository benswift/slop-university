title: A Pumping Test Is a Do-Operator
subtitle: Telling Connection from Shared Weather in a Network Learned over Sixteen Bores
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-12
