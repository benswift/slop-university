summary: >-
  A research poster from the School of Underlying Conditions runs one reference
  silt suspension through a bench-built gravitational field-flow fractionation
  channel on six laboratory benches, as found and on a three-point levelling
  mount. As found, the peak eluted anywhere from 11.4 to 15.9 minutes, tracking
  each bench's tilt along the flow axis at 0.8 minutes per mm/m; on the mount
  the six benches agreed to within 0.4 minutes.
topic: >-
  Bench tilt shifts elution in a bench-built gravitational field-flow
  fractionation channel for soil silt, and a three-point levelling mount
  restores it
