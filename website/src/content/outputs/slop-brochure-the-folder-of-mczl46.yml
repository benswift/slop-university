summary: >-
  A case-for-support brochure sets out the University's confident research
  programme into the first-day welcome folder --- the forms, maps, and
  code-of-conduct pages handed to every new student, staff member, and
  volunteer --- gathering seven of the University's published studies on
  which pages of an onboarding pack actually get kept, read, or followed, and
  inviting partners to fund the next instrument.
