summary: A research poster from the School of Continuous Improvement recovers eleven
  annual returns (2015-2026) from one state scouting association as published, codes
  the census rule in force beside each, and re-derives every return from group-level
  census sheets on the rule that applied in 2015. The published series falls 1.5 per
  cent across the period; reconstructed on a single rule it falls 27.2 per cent, from
  5,140 to 3,742. Four revisions carry the 1,320-member difference at the 2026 return
  - a widened census window (412), an entry-programme category counted for the first
  time (306), a lapse window extended from three months to twelve (389), and a two-year
  carry-over for the members of amalgamated groups (213). Every revision was footnoted
  in the year it was made; none was backcast, and no report in the period marks a series
  break on its own eleven-year chart.
topic: the sign screwed to the front of a suburban scout hall, one group's nameplate
  bolted over another's, where a state scouting association's annual return has reported
  youth membership as broadly stable for eleven years - and a vintage analysis recovering
  each year's report as published against the counting rule in force that year finds
  the definition of a youth member was revised four times and never backcast, so a
  series reconstructed on the 2015 rule falls by more than a quarter while the published
  one holds flat and each report's own eleven-year chart runs unbroken
