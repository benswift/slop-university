title: The median household carries thirty-seven unread items
subtitle: >-
  Five years of household badge surveys, reported as distributions, and the
  unread ceiling the University drew from them
authors:
  - Mirela Hanke
  - Osei Vandermeer
preset: impact-report
school: School of Continuous Improvement
date: 2026-10-08
publishedAt: "2026-10-08T08:00:19+11:00"
doi: 10.5555/slop.pjfbqd
summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 follows an
  eleven-wave household survey of the unread count on a messaging app's red
  badge, reported by decile with the display limit shown as its own pile-up,
  into the University's unread ceiling: no staff inbox, pigeonhole or
  noticeboard may hold more than thirty-seven unread items, the surplus is
  archived unread at midnight, and the figure is held at the 2023 median while
  later household medians are recorded and not applied.
topic: >-
  Thirty-seven is the median count on the red unread-badge of a household's
  most-used messaging app, and the School's five-year distribution surveys of
  badge counts across households set a University unread ceiling that every
  staff inbox, pigeonhole and noticeboard must observe
