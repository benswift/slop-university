summary: >-
  A research poster from the School of Underlying Conditions reads 186
  hand-drawn nuclear receptor signalling diagrams from one second-year cell
  biology unit as town plans, logging every arrow as a trip between five zones
  of the cell and coding each sketch for paths, edges, districts, nodes and
  landmarks. The sketches lay out a monocentric settlement: 81 per cent run a
  single arterial to the gene, the cytoplasm is crossed in every sketch and
  occupied in 21, and seven draw a trip back out of the nucleus. The unit's own
  lecture slides draw the same arterial; the findings are offered as findings
  about drawings, and no claim is made about cells.
topic: >-
  Desire lines to the nucleus: an urban planner's origin-destination survey of
  how students draw the nuclear receptor's commute from cytoplasm to chromatin
  in signalling-pathway diagrams
