title: One Long Sunday
subtitle: Station Weekend Effects as Predictors of Ozone Change under a 2020 Lockdown in an Urban Monitoring Network
authors:
  - Odalys Penhallow
  - Vigdis Emenike
preset: paper
school: School of Settled Matters
date: 2026-11-11
publishedAt: "2026-11-11T01:01:18+11:00"
doi: 10.5555/slop.gea009
summary: >-
  A paper from the School of Settled Matters and the School of Underlying
  Conditions estimates, for each of eleven stations in one coastal city's
  air-quality network, how much ozone rose per unit fall in nitrogen oxides
  between a pre-pandemic Sunday and a midweek day, and uses that weekend
  sensitivity to predict each station's ozone change over a thirteen-week 2020
  lockdown. The prediction holds to within 0.6 ppb at nine stations, where
  total oxidant barely moved and the rise was reduced titration, and fails at
  a freight-corridor roadside station, where the lockdown removed different
  vehicles from those a Sunday removes, and at a suburban station downwind of
  the centre, where ozone rose 3.1 ppb more than any weekend had implied.
topic: >-
  whether an urban monitoring network's pre-pandemic weekend ozone effect
  predicted each station's ozone rise under a COVID-19 lockdown, read as one
  long Sunday
