doi: 10.5555/slop.045nea
summary: >-
  A theoretical computer science paper from the Schools of Settled Matters and
  Continuous Improvement models trained innate immunity as an online problem in
  which a responder, naive or trained, decides only when to forget, and proves
  that no rule which settles after finitely many exposures has a bounded
  competitive ratio. A deterministic responder needs one trained memory level
  for each unit of the cost ratio, less two, to come within a factor of two of
  the offline optimum, while a single level that forgets at random after each
  benign round is exactly 2-competitive.
topic: >-
  Trained immunity as an online threshold problem: competitive bounds on when
  innate memory settles, and what it costs to let it forget
