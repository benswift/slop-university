title: Does Holding the Early Bus Undo the Bunching Behind It?
subtitle: >-
  Deployment and Driver-Compliance Log from a Suburban Route's Single
  Headway-Holding Control Point
authors:
  - Ronja Oyelaran
  - Osei Vandermeer
preset: paper
school: School of Emergent Priorities
date: 2026-09-06
publishedAt: "2026-09-06T22:34:15+10:00"
doi: 10.5555/slop.ktpz2s
summary: >-
  A paper from the School of Emergent Priorities reports a sixteen-week
  deployment of Pacemaker, a headway-holding controller installed at a
  single control point on an outer-suburban bus route, finding headway
  regularity and downstream on-time running both improve while the
  operator's newly adopted punctuality statistic excludes the time buses
  spend held at the control stop itself.
topic: >-
  a suburban bus stop's headway-holding controller, which tells an
  early-running driver exactly how long to hold at one control point so the
  route's spacing resets before the following buses catch up, and the
  operator's new punctuality report counts on-time running only downstream
  of that stop
