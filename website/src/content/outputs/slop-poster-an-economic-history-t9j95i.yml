title: The Price of a Second
subtitle: Paper Prices, Drum Speed and Lost Phases in an Observatory Archive, 1923–1961
authors:
  - Brynjar Obiora
  - Ragnhild Uzoma
  - Kwame Lindqvist
preset: research-poster
school: School of Underlying Conditions
