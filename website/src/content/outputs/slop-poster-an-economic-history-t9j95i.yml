doi: 10.5555/slop.t9j95i
summary: >-
  A research poster from the School of Underlying Conditions sets a regional
  seismic observatory's stores ledger for recording paper, 1923 to 1961,
  against the drum speeds written on 13,870 of its sheet headers. In two price
  episodes the drums were slowed from 60 to 30 and then 15 mm/min; the
  register kept its count of events throughout, but the share of events within
  25 km carrying an S−P reading fell from about 0.6 to under 0.1 while events
  beyond 200 km held near 0.9.
topic: >-
  an economic history of how a regional seismic observatory's paper budget set
  its recording-drum speed, and what its seismogram archive lost in phase
  resolution whenever paper got dear
