summary: >-
  A research poster from the School of Emergent Priorities times 1,563 returned
  hold-to-the-window cards from six wards of one shire over four quarterly
  rates-notice cycles, finding a median hold of 2.4 seconds and only 3% of holds
  lasting as long as the notice stock needs to show its watermark. The shire's
  rates committee adopts 4.0 seconds as a Hold-Time Allowance, treating any
  notice whose mark has not resolved by then as not issued.
topic: >-
