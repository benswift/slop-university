doi: 10.5555/slop.j12we1
summary: >-
  A paper from the School of Emergent Priorities reads the linen committee
  minutes of a twenty-two-bed provincial cottage hospital, 1871–1912, against
  the weekly laundry book its matron kept. Of 412 requests the matron put to
  the committee, 176 were ordered to lie on the table, and the practices they
  described appear in the laundry book within a year in 117 of the 158 cases
  the book can test, so that the hospital's linen had been boiled to a
  timetable for nineteen years before its annual report announced the adoption
  of aseptic methods.
topic: >-
  the matron's linen requests that lay on the table: how boiling and condemning
  ward sheets became hygiene practice in a provincial cottage hospital's
  committee minutes, 1871-1912, without ever being resolved
