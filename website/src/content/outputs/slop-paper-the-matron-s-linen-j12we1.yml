title: To Lie on the Table
subtitle: The Matron's Linen and the Arrival of Hospital Hygiene in a Provincial Cottage Hospital, 1871–1912
authors:
  - Ylva Onyekwere
preset: paper
school: School of Emergent Priorities
date: 2026-10-25
