title: STIR
subtitle: >-
  Stop-Ticket Identifier Resolution and a Failed Bus-Stop Replication of a
  Level-Crossing Linkage Finding
authors:
  - Solveig Adeyemi
  - Dagny Okafor
  - Osei Vandermeer
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-03
publishedAt: "2026-09-03T10:34:16+10:00"
doi: 10.5555/slop.6y5bo5
summary: >-
  A research poster from the School of Continuous Improvement restages a
  widely cited level-crossing record-linkage finding at sixty suburban bus
  stops, matching nine months of rider complaints against route-number-only
  and full-street-address signage. The identifier gap that explained the
  crossing's clean safety record does not reappear, and the transit
  authority's stop-risk register keeps ranking every stop by raw complaint
  count regardless.
topic: >-
  Despite a widely-cited Slop University finding that a rural level
  crossing's ambiguous kilometrage signage made its near-miss reports fail
  to link and its safety record look artificially clean, a preregistered
  replication of the same identifier-linkage design (STIR: Stop-Ticket
  Identifier Resolution) matches rider complaints against sixty suburban bus
  stops signed only by a route number, finds complaints link at the same
  rate regardless of signage, and the transit authority's stop-risk register
  keeps ranking every stop by its raw complaint count anyway
