title: "Nothing the Rain Hadn't Done"
subtitle: A Pre-Registered Stepped-Wedge Trial of Quarterly Rooftop-Solar Washing Across
  Forty Community Sports Clubs
authors:
  - Torun Ezeigwe
  - Marit Osayande
  - Osei Vandermeer
preset: paper
school: School of Continuous Improvement
date: 2026-07-28
publishedAt: 2026-07-28T16:02:39+10:00
doi: 10.5555/slop.wj3ab9
summary: >-
  A paper from the School of Continuous Improvement reports a pre-registered
  stepped-wedge cluster trial of quarterly rooftop-solar washing across forty
  community sports clubs in a single council portfolio, randomised into four
  crossover sequences over eight quarters. The estimated effect on performance
  ratio over the fourteen days following a wash is 0.11 percentage points (95%
  CI -0.42 to 0.64), with two one-sided tests rejecting effects outside the
  registered equivalence bounds of plus or minus 1.5 points; rainfall accounts
  for roughly an order of magnitude more recovery than the wash, and the wash
  was retained on the council's Asset Condition Attestation after being
  reclassified from a generation-assurance to a condition-evidence activity.
topic: >-
  quarterly rooftop-solar washing at community sports clubs, pre-registered and
  reported as the null it is, and what a council facilities program does with
  the cleaning schedule once the generation data says the wash changes nothing
