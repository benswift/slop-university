summary: >-
  A paper from the School of Emergent Priorities builds DRIFT, a two-axis
  weekly tier for quick-commerce couriers, and reports on a regional
  operator's decision to bind dispatch access to the tier each courier is
  scored into for the remainder of the trading quarter.
topic: >-
  a delivery-window adherence and earnings-volatility quadrant sorting
  quick-commerce delivery couriers who service supermarkets, strip-mall
  traders and food trucks, with dispatch priority bound to quadrant
  placement
