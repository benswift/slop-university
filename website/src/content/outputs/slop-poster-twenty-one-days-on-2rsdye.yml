doi: 10.5555/slop.2rsdye
summary: >-
  A research poster from the School of Emergent Priorities follows the leaf
  transcriptomes of six tagged seedlings in each of 36 shop-bought basil pots
  across 21 days on household kitchen windowsills. The household explains the
  largest share of expression variance in the first week, peaking at 31% on
  day 7; by day 21 a seedling's position in the pot explains 34%, with centre
  seedlings carrying a light-signalling module and rim seedlings an earlier
  water-deficit one.
topic: >-
  Twenty-one days on the sill: leaf transcriptome time course of supermarket pot
  basil across household kitchen windowsills after purchase
