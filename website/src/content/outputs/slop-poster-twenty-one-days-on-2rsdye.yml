title: The Pot Is a Crowd
subtitle: >-
  Seedling-resolved leaf transcriptomes of shop-bought basil over 21 days on
  kitchen windowsills
authors:
  - Gunnhild Ekwueme
  - Brynjar Obiora
  - Anouk Mensah
preset: research-poster
school: School of Emergent Priorities
