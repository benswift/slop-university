summary: >-
  A research-showcase brochure led by the School of Emergent Priorities
  presents the University's work on the short lives institutions write about
  their people, from the remarks column of a borehole log and the painted
  honour board to the circulating farewell card and the handover file left for
  a successor. It frames that work as a cross-School practice of close reading
  and features eight published University studies, each cited by DOI.
topic: >-
  a research showcase of the short lives institutions write about their people
  --- the handover note, the farewell card, the referee's report, the club
  newsletter's obituary --- and of the University's habit of reading them
  closely
