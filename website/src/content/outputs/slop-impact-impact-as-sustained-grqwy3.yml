summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 follows the
  School's move from intensive interventions to sustained-release residencies
  and measures them with four quantities borrowed from transdermal delivery: a
  median lag of eleven months to a first measurable shift for fortnightly
  residencies, often after the collaborator's own evaluation had reported;
  flux counted where a practice first appears in a collaborator's own
  documents; a Living Dashboard steady state of 41 indicators in use, eleven
  of them consulted monthly; and a residual audit in which 23 of every 100
  delivered artefacts were never opened.
