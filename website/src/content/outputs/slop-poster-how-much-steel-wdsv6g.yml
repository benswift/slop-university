title: The Steel the Field Keeps
subtitle: Point wear and draught on a nine-tine chisel toolbar over one tillage season
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-15
