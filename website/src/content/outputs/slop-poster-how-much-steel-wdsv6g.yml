doi: 10.5555/slop.wdsv6g
summary: >-
  A research poster from the School of Underlying Conditions weighs the nine
  points of one chisel-plough toolbar after each of 23 working days across
  446 hectares and logs the draught on every tine. The points shed 11 to 19
  per cent of their steel at a steady rate, but draught barely moved until the
  leading edge rounded at about 240 hectares and then climbed to 19.6 per cent
  above new, tracking the shape of the point rather than the mass it had lost.
topic: >-
  How much steel a chisel-tine point gives up to the soil over one tillage
  season, weighed tine by tine, and the draught energy the blunted point costs
