title: Remarks on Midday Occupancy at the Quad's Shaded Benches
subtitle: A null test of bench occupancy as a shade-demand signal for capital-works funding
authors:
  - Hedvig Anyanwu
  - Ronja Oyelaran
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
date: 2026-09-29
publishedAt: "2026-09-29T04:01:15+10:00"
doi: 10.5555/slop.cgc3er
summary: >-
  A paper from the School of Emergent Priorities tallies midday occupancy
  across three shaded bench clusters at the main quad for a twelve-week term
  and finds no relationship between weekly occupancy and weekly temperature,
  with cluster proximity to the coffee cart making no difference to the
  result. The Capital Works Subcommittee has since built a Shade-Demand Index
  on the same weekly counts regardless.
topic: >-
  Establish whether midday occupancy of the quad's shaded benches tracks the
  week's average temperature, as a candidate demand signal for Facilities'
  capital-works prioritisation of outdoor seating.
