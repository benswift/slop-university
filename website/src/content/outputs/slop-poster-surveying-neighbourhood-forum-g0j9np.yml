title: Three Is Reasonable
subtitle: >-
  Exclamation-Mark Tolerance in the Neighbourhood-Forum Lost-Pet Post
authors:
  - Casimir Beng
  - Osei Vandermeer
  - Runa Adegoke
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-17
publishedAt: "2026-09-17T07:53:07+10:00"
doi: 10.5555/slop.g0j9np
summary: >-
  A population survey of 214 neighbourhood-forum members finds no consensus
  on how many exclamation marks a lost-pet post's urgency can proportionately
  carry, with tolerance spread across almost the full response scale and
  little overlap between post categories. The School of Continuous
  Improvement adopts the pooled median as a single forum-wide ceiling
  regardless, with no manual override and no category exception.
topic: >-
  surveying neighbourhood-forum members on how many exclamation marks in a
  lost-pet post feel proportionate to the urgency, then setting a
  forum-wide punctuation ceiling from the median response
