title: Multi-Objective Fixture Construction for a Suburban Darts League
subtitle: >-
  Twenty Seasons of Travel Data, a Committee-Ratified Weight Schedule, and the
  Frontier It Selects From
authors:
  - Verity Marris
  - Ingrid Vasseur
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-08-17
publishedAt: "2026-08-17T08:04:03+10:00"
doi: 10.5555/slop.2q3v7p
summary: >-
  A paper from the School of Emergent Priorities formulates one metropolitan
  darts association's 18-round season fixture as a fourteen-term
  multi-objective integer program, eliciting the terms from twenty seasons of
  fixture-committee minutes and solving 10,000 weight vectors drawn from the
  fourteen-simplex. No term varies by more than 4.6 per cent of its own optimum
  between the 5th and 95th percentile of draws, the median solution shares 92.6
  per cent of its assignments with the one the ratified weights produce, and
  lifting the single-night availability window at one venue is worth 3.4 times
  the travel spanned by the entire weight simplex.
topic: >-
  A suburban pub darts league's committee spends its winter meeting arguing the
  weights on a fourteen-term fixture objective --- travel, rest, derby spacing,
  venue fairness --- and the University formulates the resulting home-and-away
  draw as a multi-objective integer program over twenty seasons of travel data,
  to see how much of that argument the Pareto frontier can actually hear.
