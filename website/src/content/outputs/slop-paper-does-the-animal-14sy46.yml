doi: 10.5555/slop.14sy46
summary: >-
  A paper from the School of Emergent Priorities rotates a six-level shopping-centre car park's painted animals
  through painted, covered and shuffled arms over twelve weeks and times 3,142 returning shoppers from lift lobby to
  car door. Mean search time is 71.2 s painted, 70.3 s covered and 71.6 s shuffled, and the paper reports no
  difference. The University now draws each level's animal by lot every teaching period, closing any level that
  repeats its animal.
topic: >-
  Does the animal painted on a multi-storey car-park level change how long a shopper takes to find their car on
  return?
