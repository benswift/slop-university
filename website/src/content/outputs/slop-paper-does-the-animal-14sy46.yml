title: "'Near the Giraffe, I Think'"
subtitle: A Null Result on Level Mascots and Return-Trip Search Time in a Multi-Storey Shopping-Centre Car Park
authors:
  - Hedvig Anyanwu
  - Ronja Oyelaran
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
date: 2026-10-07
