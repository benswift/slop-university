doi: 10.5555/slop.bggw52
summary: >-
  A research poster from the School of Underlying Conditions loads one
  guava-leaf polyphenol extract onto the clay fractions of six B horizons from
  the School's reference collection of described profiles, and compares their
  in vitro release profiles pairwise by the similarity factor f2. The clays
  fall into two interchangeable sets that match their dominant mineral exactly,
  three kaolinitic and three smectitic, while both pairs sharing a field
  texture class release differently (f2 of 33 and 29).
topic: >-
  Loading a guava-leaf polyphenol extract onto clays from the subsoil horizons
  of six reference soil profiles, and asking which clays are interchangeable
  as a sustained-release carrier
