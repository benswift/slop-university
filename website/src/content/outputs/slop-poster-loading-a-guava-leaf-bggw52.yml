title: Same Texture, Different Hold
subtitle: Which Subsoil Clays Can Stand In for One Another as a Carrier for Guava-Leaf Polyphenols
authors:
  - Brynjar Obiora
  - Vigdis Emenike
  - Casimir Beng
preset: research-poster
school: School of Underlying Conditions
