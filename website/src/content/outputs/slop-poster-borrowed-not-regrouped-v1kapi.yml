summary: >-
  A research poster from the School of Settled Matters matches 1,212 home
  homework sheets to the classroom exercise books of the same children in 46
  grandparent-supervised families, and finds all six superseded written
  arithmetic methods it codes crossing into class work at a fraction of their
  home rate, where teachers tick most correct answers and ask in nearly half
  of cases for the school's method next time.
topic: >-
  Borrowed, not regrouped: grandparents who supervise primary-school homework
  pass on superseded written arithmetic methods, traced through home and
  classroom exercise books of 46 families and how teachers read the old
  methods
