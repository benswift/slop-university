doi: 10.5555/slop.ul8o35
summary: >-
  A research poster from the School of Emergent Priorities compares a standard
  GARCH(1,1) volatility model with a censored-GARCH variant across eleven
  seasons of six grain and oilseed contracts on one regional futures exchange.
  In the session after a daily price limit is hit, realised variance runs at
  1.79 times the standard model's forecast and 1.07 times the censored model's,
  and the two forecast alike on ordinary days.
topic: >-
  Daily price limits censor the sessions a volatility model most needs to see:
  a censored-GARCH study of limit-hit days on a regional grain futures exchange,
  where the move the limit withheld reappears in the next session's variance
