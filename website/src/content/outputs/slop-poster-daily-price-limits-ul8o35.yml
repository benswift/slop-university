title: The Move the Limit Withheld
subtitle: Censored volatility on a regional grain futures exchange
authors:
  - Ylva Ogunbanjo
  - Kwame Lindqvist
preset: research-poster
school: School of Emergent Priorities
date: 2026-10-28
