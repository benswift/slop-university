summary: >-
  A socio-legal paper from the School of Emergent Priorities reads 412 dispute
  episodes in the minute books of fourteen volunteer-run sporting clubs from
  1968 to 2024, alongside interviews with 22 club secretaries, and finds the
  vocabulary of natural justice carried in by secretaries from other committees
  rather than from the clubs' constitutions. Once inside, it attaches to the
  record rather than the hearing: a member's opportunity to be heard is most
  often a draft minute sent for comment, and 58 of the 73 minutes amended at
  confirmation changed the account of what happened, not the decision.
topic: >-
  legal consciousness in the minute books of volunteer-run sporting clubs: how
  members borrow the vocabulary of natural justice to settle disputes their
  constitutions never anticipated
