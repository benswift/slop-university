title: One Cent Over, Loyal
subtitle: >-
  The 2026-2031 Strategic Plan Indexes Capability Sprints Placement Funding
  to a Shared Loyalty Platform's Twenty-Five-Dollar Member Line
authors:
  - Ingeborg Nwachukwu
  - Joost Nwosu
preset: strategy
school: School of Continuous Improvement
date: 2026-08-30
publishedAt: "2026-08-30T01:33:16+10:00"
doi: 10.5555/slop.5s7536
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the University to
  logging every Capability Sprints host site's naturally occurring
  loyalty-conversion threshold to a published University Threshold Register
  and indexing each site's placement funding to the
  regression-discontinuity-estimated effect of crossing it, with funding
  withdrawn from any site whose measured effect falls below a published
  floor for more than one review cycle.
topic: >-
  Twenty-five dollars is where a shared loyalty scanner, already running
  across strip-mall traders and food trucks in the Capability Sprints
  placement network, quietly promotes a browser to a member. The plan
  commits the University to index placement funding to the same threshold's
  measured effect.
