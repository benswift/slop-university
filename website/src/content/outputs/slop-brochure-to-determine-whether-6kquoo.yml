title: The Cluster Did Not Appear at the Petty-Cash Tin
subtitle: >-
  A Supermarket's Contactless-Ceiling Finding Carried to a Café's Receipt-Free
  Line, and a Ladder of Nine Lid Stickers
authors:
  - Tove Ilesanmi
  - Ingeborg Nwachukwu
  - Lindiwe Achterberg
preset: brochure
school: School of Emergent Priorities
date: 2026-09-30
publishedAt: "2026-09-30T15:01:34+10:00"
doi: 10.5555/slop.6kquoo
summary: >-
  A research-showcase brochure from the School of Emergent Priorities carries
  a supermarket's contactless-ceiling finding to the receipt-free line printed
  on a café's petty-cash tin and reports that the gathering of purchases
  beneath the line does not reappear. The University answers with a schedule
  rather than a verdict: the tin's lid sticker steps up one size at every shift
  change along a ladder of nine, and the trial closes at the ninth rung
  whatever the tin holds in the meantime.
topic: >-
  to determine whether the cluster of purchases found just under a
  supermarket's contactless ceiling reappears just under the receipt-free
  ceiling on a café's petty-cash tin, and to step the lid sticker up one size
  at every shift change to a ninth and final rung, whatever the tin does
