title: Who Signed Off on the Waiver?
subtitle: An Autonomous Refund-Approval Agent for a Strip-Mall Food Truck's EFTPOS Terminal
authors:
  - Kwame Lindqvist
  - Anouk Mensah
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
