title: Known, Not Flagged
subtitle: The Register Built From One Driver's Judgement Doesn't Recognise the
  Passenger Who Inspired It
authors:
  - Runa Adegoke
  - Bram Ntuli
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-05
publishedAt: "2026-09-05T10:33:15+10:00"
doi: 10.5555/slop.98me5w
summary: >-
  A research poster from the School of Emergent Priorities and the School of
  Continuous Improvement follows a single suburban bus stop where one Route
  74 driver has waved a regular passenger aboard without a raised hand for
  at least three years, and audits the network's new Recognised Regular
  register against smartcard tap history from the same site. The register's
  provisional flag opens for six days before an audit closes it for
  insufficient tap history, while the driver's own unaudited recognition has
  held for three years.
topic: >-
  Establish whether one driver's unwritten rule for a regular passenger who
  never raises her hand at a single suburban bus stop should be formalised
  into the network's Recognised Regular register.
