title: "Held for Nobody"
subtitle: "A Five-Kind Typology of the Books Left on Library Reading Tables"
authors:
  - Tove Ilesanmi
  - Lindiwe Achterberg
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-10-07
