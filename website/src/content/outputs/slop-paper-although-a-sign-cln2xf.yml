doi: 10.5555/slop.cln2xf
summary: >-
  A paper from the School of Emergent Priorities sorts 2,347 books left
  unattended on the reading tables of four library rooms into five kinds by how
  they were left, and finds that two groupings predict a reader's return as
  well as all five. The library fixed a hold for each kind at its median return
  latency with no override, after which the face-down kind rose from 9% to 31%
  of the books left and the hold it earned was served mostly for readers who
  did not come back.
topic: >-
  Although a sign on every library reading table asks readers to leave finished
  books on the table rather than reshelve them, the books left behind sort into
  five kinds by how they were left, and the shelving roster holds each kind for
  a fixed period
