summary: >-
  A 47-crossing randomised trial finds amber pedestrian-beacon retrofits
  produce no measurable change in driver yielding relative to matched,
  unfitted controls; the beacon becomes the mandatory fitting across the
  affiliated crossing network regardless, with no waiver process.
topic: >-
  Amber beacon retrofit at the pedestrian crossing outside the shops: a
  preregistered, multi-site randomised trial coding driver yielding from
  dashcam footage finds no effect; the beacon becomes the mandatory fitting
  at every affiliated crossing regardless, with no waiver process.
