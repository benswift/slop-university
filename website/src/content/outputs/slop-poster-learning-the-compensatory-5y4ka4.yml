summary: >-
  A research poster from the School of Continuous Improvement trains a
  contrastive next-dream model on the paired waking and dream diaries of 214
  volunteers (19,406 dream reports) and compares a continuity head with a
  compensation head of equal capacity. Continuity predicts the next dream
  better while fewer than about forty prior dreams are in context; beyond
  that the compensation head leads, by 5.9 points of top-1 accuracy at 96
  prior dreams, and its learned map inverts the diary's dominant affect more
  often than its topics.
topic: >-
  Learning the compensatory dream: whether a sequence model of dream diaries
  predicts the next dream from the dreamer's waking attitude by continuity or
  by Jungian compensation
