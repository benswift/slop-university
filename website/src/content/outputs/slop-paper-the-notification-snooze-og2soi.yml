title: "Snoozed Is Scheduled"
subtitle: >-
  A Lock-Screen Interceptor that Writes Every Snooze as a Dated Obligation
authors:
  - Anouk Mensah
  - Runa Adegoke
  - Fenna Okoro
preset: paper
school: School of Emergent Priorities
date: 2026-09-01
