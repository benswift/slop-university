doi: 10.5555/slop.og2soi
summary: >-
  A paper from the School of Emergent Priorities reports LaterQueue, a
  lock-screen interceptor that writes every notification snooze as a dated
  standing item and closes an unopened fire as lapse-complete. Across a
  twelve-week deployment on 186 household and small-trader phones, the
  median standing pile grew from 8 items to 41 and lapse-complete became
  the dominant close reason. The Horizon Register will issue internal
  circulars through the same control and will record an unrenewed snooze
  as actioned.
