summary: >-
  Slop University's Strategic Plan 2026-2031 commits the University to a
  campus compressed-air ring main with a Ranque-Hilsch vortex tube at the point
  of use in every occupied building, a research and teaching program in energy
  separation, and a cold fraction for each school, proposed by the school,
  entered in the register of settings in force and reviewed every year, with
  any question about it open to the Committee on Settings Oversight.
