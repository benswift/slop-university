title: The Quiet Room Was Available
subtitle: >-
  Rostered Observation and Referral Rates Across 1,180 School Hearing Screening
  Sessions
authors:
  - Runa Adegoke
  - Petra Umbile
  - Fenna Okoro
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-07
publishedAt: 2026-08-07T13:01:03+10:00
doi: 10.5555/slop.ca6ntd
summary: >-
  A research poster from the School of Emergent Priorities treats one state
  health service's quality-assurance roster as an assignment mechanism,
  comparing referral rates in the school hearing screening sessions an officer
  attended against those in the sessions nobody attended. Across 1,180 sessions
  and 38,402 children in six districts over four school years, observed sessions
  referred 9.4% of children screened against 6.1% unobserved (adjusted risk
  ratio 1.48, 95% CI 1.31-1.67); the difference is present in every district and
  shows no narrowing across the four years, while observation coverage itself
  ranged from 2.1% to 7.8% of sessions between districts, leaving the published
  district indicator a blend of two screening practices weighted by a staffing
  roster.
topic: >-
  the portable audiometer trolley wheeled into whichever room a primary school
  can spare on screening day, and the quality-assurance supervisor who sits in
  on a rostered fraction of sessions, where a state health service publishes
  district referral rates from its universal school hearing screen as a
  child-health indicator --- a quasi-experimental comparison of referral rates
  in rostered-observed and unobserved screening sessions, treating the QA roster
  as the assignment mechanism
