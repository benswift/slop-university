doi: 10.5555/slop.1m8hmp
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities feeds a packed bed of silica-grafted imidazolium bromide with
  carbon dioxide separated at an artesian monitoring bore, which arrives dilute
  and carrying entrained water in step with the bore's surges. A small water
  dose raised the propylene carbonate yield from 70% to 82% at 120 °C and a
  larger one hydrolysed product and stripped bromide from the bed, and a
  coalescer and buffer vessel that smoothed the water rather than removing it
  held the yield near 80% over 240 hours where the feed as received fell to 64%.
topic: >-
  a packed-bed reactor study of converting wet, dilute CO2 degassed from a
  carbonated groundwater bore into propylene carbonate over a supported bromide
  catalyst, and how the water that comes with the gas first helps and then
  hydrolyses
