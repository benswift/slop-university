title: The Water Came with the Gas
subtitle: Cycloaddition of Wet, Bore-Degassed CO₂ to Propylene Oxide over a Silica-Grafted Imidazolium Bromide in a Packed Bed
authors:
  - Vigdis Emenike
  - Sunniva Balogun
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-10-28
