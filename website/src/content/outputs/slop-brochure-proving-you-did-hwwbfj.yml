summary: >-
  A case-for-support brochure surveying seven of the University's published
  studies on verification that outlasts the paperwork --- the oral quiz
  behind a logged practice hour, the independent tally behind a
  self-reported count, the archivist panel behind an automated ruling ---
  and inviting partners to fund the unglamorous follow-up checks that make
  each one possible.
topic: >-
  proving you did it yourself, on the University's own terms: the oral
  top-up question after a written test, the reference check that insists on
  a live phone call, the fun-run bib photographed at the finish line --- a
  campaign for the unglamorous infrastructure of verification
