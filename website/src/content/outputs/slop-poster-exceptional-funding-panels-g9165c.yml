doi: 10.5555/slop.g9165c
summary: >-
  A research poster from the School of Emergent Priorities takes a census of
  1,127 statements of what makes a case exceptional across 486 published
  determinations of a regional health-funding exceptions panel whose instrument
  decides each application on its own facts. Over nine years the distinct
  formulations of the test fall from 23 to four, determinations naming an
  earlier determination rise from 4% to 38%, and comparison with earlier
  applicants displaces the applicant's own clinical difference as a ground,
  while the grant rate holds near 28%.
topic: >-
  exceptional funding panels and the precedent they deny: a jurisprudential
  census of how 'exceptionality' is defined in health-rationing determinations
