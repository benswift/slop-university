title: On Its Own Facts
subtitle: How a Health-Funding Exceptions Panel Built the Case Law It Says It Does Not Keep
authors:
  - Sunniva Balogun
  - Odalys Penhallow
preset: research-poster
school: School of Emergent Priorities
