summary: >-
  A marketing poster advertising Futures in Committee, the School of Emergent
  Priorities' seminar series, built on the observation that a street tree is the
  visible end of a decision taken years earlier in a room --- the species that
  counts fastest toward a canopy target, staked on a verge it will outlive
  everyone who chose it for. Seven words over a suburban nature strip, prepared
  for the University's landscape signage rotation in matched daylight and
  after-dark renderings.
topic: >-
  the spindly street tree in its milk-crate guard on the nature strip, chosen
  for how quickly it counts toward a canopy-cover target rather than for the
  footpath it will one day shade --- a campaign for the seminar series where the
  long decisions get tabled
