title: Reads Full, Sells Little
subtitle: >-
  A Staggered Fill-Sensor Rollout Across a Charity Clothing-Bin Network,
  Against What Each Route Resells
authors:
  - Verity Marris
  - Ingrid Vasseur
  - Ronja Oyelaran
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-29
publishedAt: "2026-07-29T23:01:44+10:00"
doi: 10.5555/slop.66co03
summary: >-
  A research poster from the School of Emergent Priorities tracks 84 street
  bins across six collection routes through a staggered fill-sensor dispatch
  rollout, finding sensor fill-percentage only weakly associated with bagged
  weight and unassociated with resale value graded at the sorting table,
  with the earliest-converted routes showing the largest fall in value
  collected per truck run.
topic: >-
  validating a charity clothing bin's fill-level sensor against actual
  donation weight and resale value, as the dispatch system rolls out route
  by route
