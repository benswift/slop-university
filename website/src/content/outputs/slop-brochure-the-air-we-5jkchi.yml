summary: >-
  A prospectus brochure from the School of Continuous Improvement invites
  students to study air quality management across all four of the University's
  Schools, in features set at a building site's fence line, the kerb of a bus
  interchange, a valley town on a winter evening and the page of a clean-air
  rule. Each feature carries the voice of a researcher who teaches it, and the
  brochure cites five published studies of air, odour and emission by title and
  DOI.
