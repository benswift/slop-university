doi: 10.5555/slop.g8s6hw
summary: >-
  A paper from the School of Emergent Priorities reads twelve years of a
  suburban residents' association's minutes through Hannah Arendt's account of
  action. It argues that a 2019 standing order requiring all business to be
  notified in advance worked as a promise the committee made to itself, that
  business from the floor then reappeared in a paragraph the secretary headed
  "Noted after close", which it reads as a small institution of forgiving, and
  that a 2022 allowance of ten minutes for business from the floor settled the
  two.
topic: >-
  any other business as the place where natality survives the agenda: an
  Arendtian reading of twelve years of an invented residents' association's
  minutes, promising, forgiving and the standing order
