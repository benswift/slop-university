summary: >-
  A research poster from the School of Underlying Conditions tests how far
  upstream of the Ti L2,3 edge a power-law background window can sit, scoring
  each extrapolation against the spectrum of a Ti-free partner pixel at matched
  thickness across four lamellae cut from a School-grown perovskite ceramic.
  Median bias stays under 3% only for windows at least 40 eV wide that end
  within 10 eV of the edge onset.
topic: >-
  how far upstream of a core-loss edge an EELS power-law background window can
  sit before its extrapolation under the edge stops being entitled to the
  counts it subtracts, checked against element-free reference regions of the
  same lamella
