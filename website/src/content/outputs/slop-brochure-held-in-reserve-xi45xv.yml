summary: >-
  A research showcase from the School of Underlying Conditions presents the
  University's work on what a secure energy system holds back, under three
  headings: the stored, the spare and the long-kept. It reads the header tank,
  the aquifer, the unused margin and the core shed as kinds of reserve, and
  rests its account on eight published studies cited by title and DOI.
