title: The Monday Breakthrough
subtitle: >-
  Restart Emissions of Reduced Sulfur Compounds from a Compost-Hall Biofilter
  after Weekend Fan Shutdown
authors:
  - Ingeborg Nwachukwu
  - Marit Osayande
  - Bram Ntuli
preset: paper
school: School of Continuous Improvement
date: 2026-10-29
publishedAt: "2026-10-29T22:01:15+11:00"
doi: 10.5555/slop.t10hp3
summary: >-
  A paper from the School of Continuous Improvement monitors thirteen Monday
  restarts of an enclosed composting hall's extraction fans after a 42-hour
  weekend shutdown, and starves cored biofilter media in bench columns, finding
  that the outlet sulfide peak comes mostly from the bed's starvation lag rather
  than the accumulated headspace. A ramped restart lowered the peak but slowed
  the hall's purge and exposed bypass at low flow; a 15% weekend keep-alive cut
  the excess sulfide emitted by 97% while keeping most of the energy saving.
topic: >-
  restart breakthrough of sulfur odorants from a compost-hall biofilter after
  weekend fan shutdowns, and a ramped start-up that flattens the Monday peak
