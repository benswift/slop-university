doi: 10.5555/slop.x4tdlt
summary: >-
  A paper from the School of Continuous Improvement reports a five-season case
  study of an app through which the members of a cruising association lend one
  another their berths, each of them at once a supplier and a customer. From the
  app's booking log of 2,317 berth-nights, 34 interviews and the minutes of 27
  committee meetings, it develops four propositions about platforms whose sides
  are roles and not populations, among them that a subsidy to one side of such a
  platform reaches every member and that its imbalances run between places.
topic: >-
  Sides as roles: a longitudinal case study of a harbour berth-swap app whose
  members are at once its suppliers and its customers, and what subsidising one
  side means when no one is only on it
