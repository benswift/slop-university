title: When the Sides Are Roles
subtitle: Subsidy, Balance and Membership in a Harbour Berth-Exchange Platform
authors:
  - Eivind Onwuka
  - Thandiwe Solberg
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-10-13
