title: Deciding When to Stop
subtitle: Twenty-Six Months of Time-Lapse Resistivity over a Reinstated Trench, and a Stopping Rule Built on Survey Repeatability
authors:
  - Odalys Penhallow
  - Brynjar Obiora
  - Vigdis Emenike
preset: paper
school: School of Settled Matters
date: 2026-11-15
publishedAt: "2026-11-15T16:00:46+11:00"
doi: 10.5555/slop.va9cqc
summary: >-
  A paper from the School of Settled Matters and the School of Underlying
  Conditions surveys a permanent resistivity line across a reinstated cable
  trench every month for 26 months and tracks the ratio of backfill to native
  resistivity, which falls from 1.85 to a plateau of 1.10 with an e-folding
  time of 4.3 months. Applied retrospectively, a rule that stops once
  successive surveys agree within their repeatability would have ended the
  campaign at month 7 with nearly a quarter of the change still to come, and
  fires sooner the more often one surveys; a rule that stops once the fitted
  remaining change falls below the detection limit stops at month 15, and a
  rain-driven excursion at month 22 shows the backfill settled in trend but
  not in its response to heavy rain.
topic: >-
  Time-lapse electrical resistivity tomography over a reinstated trench
  backfill, and a repeatability-based rule for deciding when the ground has
  settled and repeat surveys can stop
