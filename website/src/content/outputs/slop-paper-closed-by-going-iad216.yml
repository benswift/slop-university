title: Closed by Going Quiet
subtitle: End-of-Outbreak Probabilities at the Closing Entries of 212 Respiratory Disease Files from a Mixed-Animal Veterinary Practice
authors:
  - Ylva Onyekwere
  - Brynjar Obiora
  - Solveig Adeyemi
preset: paper
school: School of Emergent Priorities
date: 2026-10-31
publishedAt: "2026-10-31T09:00:26+11:00"
doi: 10.5555/slop.iad216
summary: >-
  A paper from the School of Emergent Priorities codes how 212 herd and flock
  files for respiratory disease outbreaks, opened by one mixed-animal practice
  between 2008 and 2023, came to a close, and computes for each the probability
  of no further cases on the day of its last entry. Nearly two in three files
  simply lapsed, usually within a week of the last recorded case and often on a
  telephone note reporting improvement; at that point the median probability
  that the outbreak was over was 0.58, against 0.97 for files declared over, and
  lapsed files were reopened more often.
topic: >-
  closed by going quiet: respiratory-disease outbreak files from mixed livestock
  farms that end without a declaration, read against the probability of no
  further cases on the day of their last entry
