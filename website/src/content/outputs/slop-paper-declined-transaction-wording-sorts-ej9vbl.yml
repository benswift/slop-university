title: How Many Ways Can a Terminal Say No?
subtitle: >-
  A Taxonomy of Declined-Transaction Wording Across Supermarket
  Self-Checkouts, Strip-Mall EFTPOS Terminals, and Food-Truck Card Readers
authors:
  - Bram Ntuli
  - Torun Ezeigwe
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-09-07
publishedAt: "2026-09-07T13:35:16+10:00"
doi: 10.5555/slop.ej9vbl
summary: >-
  A paper from the School of Continuous Improvement builds a nine-category
  taxonomy of declined-transaction wording from 1,142 transcribed prompts
  across supermarket self-checkouts, strip-mall EFTPOS terminals, and
  food-truck card readers, and finds a category's folk-rated severity
  predicts whether a shopper retries far better than the transaction's own
  logged decline cause. The Office of the Vice-Chancellor has since
  directed every University service point to adopt the taxonomy's gentlest
  category as its own denial-notice standard.
topic: >-
  a taxonomy sorting declined-transaction messages at the point of sale
  (supermarket self-checkout, strip-mall EFTPOS terminal, food-truck card
  reader) into wording categories by severity, and the University's
  adoption of the gentlest category as its own internal service-denial
  phrasing standard
