summary: >-
  A paper from the School of Settled Matters and the School of Underlying
  Conditions follows one shock-melt vein in an L6 chondrite fall through
  fourteen serial thin sections, over which it widens from 0.09 to 1.91 mm.
  Sections up to 0.62 mm wide crystallised a high-pressure garnet matrix to
  their centres and wider ones only in rims around a low-pressure core, which
  a conduction model reads as a pressure pulse of between 99 and 222 ms; the
  rims of the five widest sections, nearly constant in thickness, fit a single
  pulse of 150 ms.
topic: >-
  Fourteen serial sections through one shock-melt vein in an ordinary-chondrite
  fall, reading its high-pressure assemblages against its width to bound the
  pressure and duration of the shock pulse
