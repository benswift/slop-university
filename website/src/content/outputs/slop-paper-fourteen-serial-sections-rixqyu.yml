title: A Hundred and Fifty Milliseconds at Pressure
subtitle: Serial Sections Through One Shock-Melt Vein in an L6 Chondrite
authors:
  - Anselm Threlkeld
  - Brynjar Obiora
preset: paper
school: School of Settled Matters
