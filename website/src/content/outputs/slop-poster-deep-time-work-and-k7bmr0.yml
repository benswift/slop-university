title: A Long Time, for a Person
subtitle: Time Perspective and the Felt Distance of the Future Across One Core-Logging Season
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-12
