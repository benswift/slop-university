doi: 10.5555/slop.k7bmr0
summary: >-
  A research poster from the School of Underlying Conditions follows 58
  core-shed staff and 49 camp staff who never handle core through one 22-week
  field season, and finds no pre-registered evidence that working at geological
  timescales changes time perspective or how far away the future feels. The one
  change observed, a lengthening of the felt month, occurred in both groups
  alike.
topic: >-
  deep-time work and time perspective: does a field season of logging drill core
  change how near the future feels
