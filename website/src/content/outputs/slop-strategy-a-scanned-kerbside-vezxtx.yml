title: Every Partner Site Will Run the Same Queue
subtitle: >-
  The 2026-2031 Strategic Plan Deploys the Kerbside Dispatch System at Every
  Capability Sprints Site and Withdraws Informal Queuing as Recognised
  Practice
authors:
  - Runa Adegoke
  - Ingrid Vasseur
  - Sten Okwuosa
preset: strategy
school: School of Emergent Priorities
date: 2026-09-04
publishedAt: "2026-09-04T13:34:15+10:00"
doi: 10.5555/slop.vezxtx
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to
  deploying the Kerbside Dispatch System --- a scanned placard sequencing
  school-run collection strictly by scan order --- at every Capability
  Sprints partner site by 2029, withdrawing informal queuing as a recognised
  practice and extending the same architecture to every other collection
  point the University operates.
topic: >-
  A scanned kerbside pickup placard sequences the school-run collection queue
  by scan order, and the plan adopts the same dispatch system as flagship
  capability infrastructure across every Capability Sprints partner site.
