title: Seen, Not Slowed
subtitle: >-
  Does displaying a "child on board" sticker change the following distance
  drivers keep?
authors:
  - Marit Osayande
  - Casimir Beng
  - Renke Sabel
preset: research-poster
school: School of Continuous Improvement
