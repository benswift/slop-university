doi: 10.5555/slop.i21tf4
summary: >-
  A research poster from the School of Continuous Improvement instruments 54
  parent-driver vehicles with rear-facing radar headway loggers across three
  school-run corridors, finding that a rear-window "child on board" sign
  changes nothing measurable about the following distance drivers keep, and
  reports the Indicator Commons' fleet-accreditation register auditing
  sign-fitment regardless of the result.
topic: >-
  whether a "child on board" sticker changes the following distance drivers
  keep during school-run traffic
