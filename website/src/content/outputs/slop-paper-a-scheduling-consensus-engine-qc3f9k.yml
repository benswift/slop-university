doi: 10.5555/slop.qc3f9k
summary: >-
  A paper from the School of Emergent Priorities reports QUORUM, a
  scheduling-consensus engine that extracts availability from an ordinary
  group-chat thread and locks in a meeting time once its confidence score
  clears a fixed threshold, archiving further replies from the default view
  regardless of content. Across 214 pilot chats the engine cut median
  time-to-consensus from 41.2 to 6.7 minutes, and three partner committees
  have adopted its locked output as their meeting record of standing with no
  manual override.
