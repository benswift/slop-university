title: A Scheduling-Consensus Engine Locks In a Group Chat's Meeting Time and Mutes Further Replies
authors:
  - Sunniva Balogun
  - Anneke Tolan
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-09-27
