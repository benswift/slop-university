title: Nine Inactive Fractions
subtitle: Loss and Recovery of Enzyme Inhibition on Fractionating a Leaf Extract from an Undetermined Accession
authors:
  - Ylva Ogunbanjo
  - Halvard Nnamani
  - Runa Adegoke
