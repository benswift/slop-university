summary: >-
  A research poster from the School of Emergent Priorities fractionates an
  active leaf extract from a single unidentified shade-house shrub into nine
  fractions, none of which inhibits the screening enzyme by more than 14%
  against the crude extract's 78%. Recombining all nine by mass restores 71%,
  two fractions eluting far apart account for 58% between them, and the authors
  note that the screen is in vitro on one enzyme and that the plant has not been
  determined beyond family.
topic: >-
  Activity lost and recovered: bioassay-guided fractionation of a leaf extract
  from an undetermined shade-house accession, where no single fraction carries
  the crude extract's enzyme inhibition and recombining them restores it
