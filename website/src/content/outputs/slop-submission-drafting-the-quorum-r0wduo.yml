title: State the Quorum as a Number
subtitle: >-
  A submission from the School of Settled Matters to the Department of Policy
  Settings' Review of Quorum and Resolutions in the University's Units
authors:
  - Anselm Threlkeld
  - Odalys Penhallow
  - Clemency Tredinnick
preset: submission
school: School of Settled Matters
date: 2026-11-16
publishedAt: "2026-11-16T11:31:47+11:00"
doi: 10.5555/slop.r0wduo
summary: >-
  A submission from the School of Settled Matters answers eight of the twelve
  questions in the Department of Policy Settings' consultation on quorum and
  resolutions in the University's units. Treating "one half of the unit's
  members, rounded up" as an approximation whose error is largest in the
  smallest units, it supports a minimum quorum of two by a new subsection for
  units of fewer than three members, asks that small units' quorums be stated
  as figures, that a sitting member be drawable from another school, and that a
  lapsed inquorate resolution leave undisturbed the outputs already released
  under it.
topic: >-
  drafting the quorum of a unit: 'one half of the members, rounded up' as an
  approximation of a principle that fails at the small end, and how the
  amending provision and a validation rule for inquorate resolutions should be
  written for the later reader
