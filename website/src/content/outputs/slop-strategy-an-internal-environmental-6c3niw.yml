title: Accounting for What We Use
subtitle: >-
  The Footprint Contribution and the stewardship of its proceeds
authors:
  - Ylva Onyekwere
  - Halvard Nnamani
  - Kwame Lindqvist
preset: strategy
school: School of Emergent Priorities
date: 2026-10-25
publishedAt: "2026-10-25T15:32:15+11:00"
doi: 10.5555/slop.6c3niw
summary: >-
  Slop University's Strategic Plan 2026-2031 introduces the Footprint
  Contribution, an internal environmental levy assessed each year on every
  school and unit against its counted energy, travel, print, procurement and
  water. Its proceeds are held in a Stewardship Fund that no budget may forecast
  as income, shared footprint is divided by a tested allocation method rather
  than equally, and every assessment and disbursement is entered in a public
  Contribution Ledger under a custodianship that rotates by rule.
topic: >-
  an internal environmental levy: the University prices its own footprint,
  taxes its schools for it, and governs the proceeds in the open
