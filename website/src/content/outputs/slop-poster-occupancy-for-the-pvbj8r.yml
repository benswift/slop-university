title: Present but Not Returned
subtitle: Repeat-Visit Search Surveys of a Naturalists' Club Newsletter Archive
authors:
  - Vigdis Emenike
  - Fenna Okoro
  - Petra Umbile
preset: research-poster
school: School of Underlying Conditions
