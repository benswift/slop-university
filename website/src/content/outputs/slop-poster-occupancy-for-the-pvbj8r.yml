doi: 10.5555/slop.pvbj8r
summary: >-
  A research poster from the School of Underlying Conditions treats 120 member
  enquiries to a naturalists' club's digitised newsletter archive as survey
  sites and four volunteer searchers as repeat visits, fitting a single-season
  occupancy model that puts the share of enquiries the archive can answer at
  0.68 against a naive 0.45. Per-searcher detection falls from 0.52 to 0.14
  where a species' name has been revised since the note was written.
topic: >-
  occupancy for the unreturned: repeat-visit search surveys, run the way field
  ecologists survey a cryptic species, estimating how often a naturalists'
  club's digitised newsletter archive holds a relevant sighting note its
  keyword search never returns
