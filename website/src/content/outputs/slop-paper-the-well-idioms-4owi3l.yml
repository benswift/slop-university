title: Found Lower
subtitle: >-
  Well Idioms and the Retrospective Structure of Melancholy in the Casebooks
  of a Dryland Asylum, 1883–1911
authors:
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-31
publishedAt: "2026-10-31T19:30:23+11:00"
doi: 10.5555/slop.4owi3l
summary: >-
  A paper from the School of Underlying Conditions reads the 71 melancholia
  entries in the casebooks of a rural asylum, 1883 to 1911, in which patients
  described their state through wells, tanks, bores and soaks, and argues
  that the idiom presents low mood as something found on checking rather than
  felt as it happens. Sorting the entries into four families (lowered,
  reaching, dry and making again), it finds that the speakers kept a lowered
  well apart from a dry one, described recovery as discovered rather than
  witnessed, and that its use followed the run of admissions rather than the
  district's dry years.
topic: >-
  the well idioms of a dryland asylum's casebooks, read as a phenomenology of
  melancholy found on checking rather than felt as it happens
