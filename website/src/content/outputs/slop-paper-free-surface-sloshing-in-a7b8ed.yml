summary: >-
  A physics paper from the School of Settled Matters and the School of
  Underlying Conditions times the sloshing a detector carriage leaves in one
  open scanning water phantom and follows it into 6 MV depth-dose scans.
  Because the slowest modes have a node at the tank centre, a centred
  central-axis scan settles to within 0.2% in 53 s after a fast move while a
  shallow lateral profile needs 167 s, and water left standing nine days
  settles faster than a fresh fill.
topic: >-
  Free-surface sloshing in a scanning water phantom: how long the water takes
  to settle after the detector carriage moves, and what the residual ripple does
  to a near-surface depth-dose scan
