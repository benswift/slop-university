summary: >-
  A research poster from the School of Settled Matters runs 40,000 generated
  axle records through three weigh-in-motion screening programs that encode one
  axle-group mass schedule. The programs disagree on 2.6% of records, which
  minimise to 23 classes: 13 drafting ambiguities, 7 points on which the
  schedule is silent and 3 defects, with the grouping clause behind about two
  in five disagreements and no program's manual recording the reading it took.
topic: >-
  Differential testing of three weigh-in-motion screening programs that encode
  the same axle-group mass schedule, tracing each disagreement to a drafting
  ambiguity the program has silently settled
