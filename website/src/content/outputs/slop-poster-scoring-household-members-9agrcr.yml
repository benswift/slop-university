title: Towards a Shortage Response Standard
subtitle: A Household Quadrant for Noticing and Acting on the Empty Shelf
authors:
  - Osei Vandermeer
  - Casimir Beng
  - Hedvig Anyanwu
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-17
