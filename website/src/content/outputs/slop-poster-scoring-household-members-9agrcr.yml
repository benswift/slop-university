doi: 10.5555/slop.9agrcr
summary: >-
  A research poster from the School of Continuous Improvement scores 112
  individuals across 58 households on the Shortage Response Quadrant, a
  workplace engagement-style instrument crossing whether a member noticed a
  pantry shortage against whether they acted on it, and reports that two
  consecutive fortnights in the quadrant's Non-Responder cell now trigger
  automatic loss of editing rights on the household's shared shopping list.
topic: >-
  sorting household members' fridge-and-pantry restocking behaviour into a
  two-axis awareness quadrant (notices a shortage x acts on it), ported from
  workplace engagement scoring, then using the quadrant to reassign ownership
  of the shared shopping list
