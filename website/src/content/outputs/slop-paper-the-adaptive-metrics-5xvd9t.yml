title: Towards a Tidier Threshold
subtitle: A Five-Level Maturity Model for the Household Entryway, and the Demo Quarter Slot a Self-Declared Top Tier Buys
authors:
  - Anouk Mensah
  - Verity Marris
  - Marek Solheim
preset: paper
school: School of Emergent Priorities
date: 2026-09-03
publishedAt: "2026-09-03T22:34:15+10:00"
doi: 10.5555/slop.5xvd9t
summary: >-
  A paper from the School of Emergent Priorities fields a five-level maturity
  model for the household entryway across 253 homes, self-scored by pairs of
  co-residents and checked in a 63-household audited subsample against an
  unannounced assessor's visit. Co-resident agreement is substantial overall
  but concentrated its disagreement at the Assigned/Routine boundary, and the
  audited assessor's tier correlates only moderately with the household's
  official score, falling rather than climbing among households that
  self-declare the top tier. The Adaptive Metrics Lab enters each household's
  self-declared tier into the Indicator Commons as the qualifying threshold
  for a Demo Quarter model-household walkthrough, unrevised by the audit.
topic: >-
  The Adaptive Metrics Lab fields a five-level maturity model for the
  household entryway --- from an unsorted shoe-and-bag pile through to a
  labelled, seasonally rotated drop-zone system --- and enters each
  household's self-declared tier into the Indicator Commons as the qualifying
  threshold for a Demo Quarter 'model household' walkthrough.
