summary: >-
  A research poster from the School of Underlying Conditions tests one
  surfactant laboratory's in-house dynamic light-scattering pipeline against
  six metamorphic relations derived from the physics, across 14,472 pairs built
  from 2,412 archived correlation functions. It finds violations in 3.9% of
  pairs, 86% of them where the resolved peak separation lies within 20% of the
  pipeline's one-peak/two-peak merge threshold, and traces them to a
  run-order-dependent regularisation choice and a rounded merge comparison,
  whose patching cuts the rate to 0.4%.
topic: >-
