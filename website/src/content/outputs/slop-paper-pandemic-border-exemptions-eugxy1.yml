title: Riding on Supply
subtitle: Bore-Purpose Exemptions and the Pandemic Reorganisation of Itinerant Drilling Labour at an Internal Border
authors:
  - Vigdis Emenike
  - Hedvig Anyanwu
preset: paper
school: School of Underlying Conditions
date: 2026-11-03
publishedAt: "2026-11-03T11:31:16+11:00"
doi: 10.5555/slop.eugxy1
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities follows eleven drilling contractors through twenty-two months of a
  pandemic internal border closure whose exemption scheme judged each crossing
  by the purpose of the bore rather than the trade of the worker. Of the 346
  monitoring bores that crossed, 325 travelled on the permit of a supply job
  scheduled for the same mobilisation, and the closure left the trade with
  fewer temporary-visa offsiders and crews assigned to one side of the line,
  neither of which reversed on reopening.
topic: >-
  pandemic border exemptions for itinerant drilling crews, and how the
  essential-worker category redrew which bores got drilled
