title: The Water Cooler Bottle as Escalation Trigger
subtitle: >-
  A Five-Level Maturity Model for Floor-Level Bottle-Swap Discipline, Tested
  Against Its Own Predictive Telemetry Channel
authors:
  - Solveig Adeyemi
  - Casimir Beng
  - Osei Vandermeer
preset: paper
school: School of Continuous Improvement
date: 2026-09-28
publishedAt: "2026-09-28T09:01:35+10:00"
doi: 10.5555/slop.g7tyi1
summary: >-
  A paper from the School of Continuous Improvement scores 84 water-cooler
  floors in 19 buildings against a five-level Water Cooler Readiness Maturity
  Model built from load-cell bottle-weight telemetry, finding level
  assignments largely unchanged when the model's predictive telemetry
  channel is removed, and reporting Facilities Services' adoption of the
  model's third level as a binding, non-waivable condition of a floor's
  water-cooler service contract.
topic: >-
  Although a dry water-cooler bottle rarely generates a formal complaint, the
  Adaptive Metrics Lab's five-level Water Cooler Readiness Maturity Model
  scores every floor's bottle-swap discipline from bottle-weight telemetry,
  and a floor that drops below the model's third level has its water-cooler
  contract suspended until re-certified, with no manual override
