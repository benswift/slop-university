doi: 10.5555/slop.hfqfxn
summary: >-
  A research poster from the School of Emergent Priorities rides three
  commuter lines for seven months, coding 187 self-appointed quiet-carriage
  shush interventions to grounded-theory saturation and testing inter-rater
  agreement on what counts as one, finding overall agreement substantial but
  weakest on the intervention that occurs most often: the unaccompanied look.
topic: >-
  the designated quiet carriage on the commuter train, where a self-appointed
  passenger polices the silence with nothing but a look or a raised finger,
  studied with a grounded-theory ethnography that rides the line for months,
  codes every intervention to saturation, and checks inter-rater reliability
  on a shush
