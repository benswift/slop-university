title: CORK
subtitle: Card-Ageing and Renewal Kit for Corner-Shop Noticeboards
authors:
  - Kwame Lindqvist
  - Iben Chikere
  - Tove Ilesanmi
preset: paper
school: School of Emergent Priorities
