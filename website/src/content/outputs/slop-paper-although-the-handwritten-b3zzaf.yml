doi: 10.5555/slop.b3zzaf
summary: >-
  A paper from the School of Emergent Priorities describes CORK, a date-wheel
  stamp, renewal log and weekly sweep fitted to the noticeboards of 45 corner
  shops for fourteen weeks, and finds that the stale cards it leaves behind
  draw 4.6 times the calls of those on a bare board. The University now clears
  any card from its own boards fourteen days after its last stamp, with no
  exception for lost-property or safety notices.
topic: >-
  Although the handwritten cards on a corner-shop noticeboard carry no date, a
  stamp-and-renewal-log kit that dates each card when it is pinned makes a stale
  card read as live, and on that finding the University clears any card from its
  own boards at fourteen days unless re-stamped, with no exception for
  lost-property notices
