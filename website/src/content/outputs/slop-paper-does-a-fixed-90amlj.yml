title: Towards a General Account of Crate-Bounded Priority Formation
subtitle: >-
  A Failed Domestic Replication of an Office-Restack Finding, Tested on 58
  Households' House-Move Boxes
authors:
  - Hedvig Anyanwu
  - Ronja Oyelaran
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
date: 2026-09-15
publishedAt: "2026-09-15T11:56:11+10:00"
doi: 10.5555/slop.90amlj
summary: >-
  A paper from the School of Emergent Priorities attempts a domestic
  replication of an earlier office-restack finding that crate-opening order
  tracks project priority, logging 612 boxes across 58 households moving
  house. The relationship does not reproduce: garage and shed stack position
  predicts opening latency far more strongly than self-rated priority, and
  boxes still sealed after nine months are mostly cleared unopened at a
  single kerbside hard-rubbish collection.
topic: >-
  does a fixed crate allocation from an office-restack study still predict
  which household priorities survive unopened once the same design runs on
  house-move boxes in the garage and shed, tracked through to hard-rubbish
  bin night
