title: Notes on a Scoreboard That Will Not Show a Seventh Ball
subtitle: A hand-turned flip-card board for one village ground, and the levy set from its lifted cards
authors:
  - Ylva Ogunbanjo
  - Runa Adegoke
  - Marek Solheim
preset: research-poster
school: School of Emergent Priorities
date: 2026-10-06
publishedAt: "2026-10-06T07:00:44+11:00"
doi: 10.5555/slop.pj4w9x
summary: >-
  A research poster from the School of Emergent Priorities describes a
  hand-turned flip-card scoreboard built for one village cricket ground, with a
  brass stop at its sixth card and an odometer wheel counting each card a scorer
  lifts over it. Across 22 fixtures and 1,742 overs the drum never turned past
  six and lifts fell from 37 to 1 once the club-support levy was set from the
  counter, which the School now reads once a season with no mid-season
  revision.
topic: >-
  To build a hand-turned flip-card scoreboard for a village cricket ground that
  cannot physically display an over beyond six balls, to document how it was
  made and runs, and to bind the club-support levy to the number of times the
  scorers had to force a card past its stop
