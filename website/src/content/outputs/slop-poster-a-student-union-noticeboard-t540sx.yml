doi: 10.5555/slop.t540sx
summary: >-
  A research poster from the School of Continuous Improvement scores
  thirty-six corridor corkboards against a five-level pin-hygiene maturity model
  (Palimpsest, Stamped, Pruned, Pin-Accounted, Bare Cork) across fourteen
  fortnightly warden walks and 4,906 coded flyers. Expired flyers fall 93% as
  boards climb, but current-event flyers fall 75% and flyers pulled before their
  event date rise from 3% to 22% of removals; the student union's executive
  nonetheless binds each board's pin issue and past-event flyer life to its
  level, and unmounts any board that scores Bare Cork twice running.
topic: >-
  A student-union noticeboard warden scores each corridor corkboard against a
  five-level pin-hygiene maturity model, from Palimpsest to Bare Cork, and the
  level a board reaches sets how many drawing pins it is issued and how many
  weeks a flyer for a past event may stay up
