title: Still Up After the Open Day
subtitle: A five-level pin-hygiene maturity model for student-union corkboards, scored walk by walk
authors:
  - Marit Osayande
  - Solveig Adeyemi
  - Torun Ezeigwe
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-20
