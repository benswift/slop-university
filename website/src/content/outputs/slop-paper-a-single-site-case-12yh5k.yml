title: Ranked to Avoid
subtitle: >-
  A Single-Site Case Study of a Board-Game Club's Season Under a Published
  Rank Trajectory, and What Removing It Failed to Undo
authors:
  - Verity Marris
  - Anneke Tolan
  - Ingrid Vasseur
preset: paper
school: School of Emergent Priorities
date: 2026-08-11
publishedAt: "2026-08-11T03:03:03+10:00"
doi: 10.5555/slop.12yh5k
summary: >-
  A paper from the School of Emergent Priorities embeds with a Tuesday-night
  board-game club for a fourteen-week season after its convenor begins
  publishing a projected rank trajectory alongside the live ladder, finding
  opponent-avoidance behaviour organised around the projection rose to 41%
  before the projection's three-week extrapolation could plausibly be
  informative, and held statistically unchanged after the convenor withdrew
  the projection.
topic: >-
  a single-site case study of a Tuesday-night board-game club whose convenor
  starts publishing a running Elo-style ladder with each member's projected
  end-of-season rank trajectory beside their current position, and whether
  removing the projected-trajectory column later in the season reverses the
  match-avoidance and rematch-chasing behaviour it produced
