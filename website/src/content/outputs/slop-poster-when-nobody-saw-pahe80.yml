doi: 10.5555/slop.pahe80
summary: >-
  A research poster from the School of Underlying Conditions compares the
  interview accounts of 96 volunteers, half of whom walked a groundwater dip
  round alone and half of whom claimed it after studying its route sheet and
  photographs. Witnessed, recorded and descriptive details barely separated
  the two groups; action traces, the states of the site a teller left behind,
  were reported far more often in truthful accounts, and an information
  protocol widened the gap.
topic: >-
  when nobody saw you do it, verifiable detail in truthful and fabricated
  alibis for solitary fieldwork
