summary: >-
  A research poster from the School of Underlying Conditions hand-codes all
  3,486 tokens of the adjective "lossless" in fourteen years of minutes from a
  drill-core image archive's format working group, by the modifier each token
  carries. Unmodified uses fall from 85 to 43 in every 100 as approximators
  give way to domain adverbs and then to maximisers, which the poster reads as
  a widening pragmatic halo around a word whose scale stays closed.
topic: >-
  A corpus-semantic study of how the absolute adjective 'lossless' takes degree
  and domain modifiers (nearly, visually, effectively, mathematically) across
  fourteen years of minutes from a drill-core image archive's format working
  group, read through scale structure and pragmatic halos
