summary: >-
  An essay in the philosophy of biology from the School of Continuous
  Improvement separates three questions asked of a neutrophil's killing
  pathways: which route does the killing in an intact cell, what is lost when a
  route is deleted, and how a joint outcome should be divided among routes that
  depend on one another. In a constructed three-route phagosome the
  myeloperoxidase route delivers about three in four kills yet is credited with
  about five in a hundred under deletion and less under a Shapley division, and
  the paper argues that "dispensable" answers the deletion question alone.
topic: >-
  who kills the microbe: a philosopher of biology asks how causal credit should
  be shared between the neutrophil's redundant killing pathways, given that
  people lacking myeloperoxidase mostly stay well
