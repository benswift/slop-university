summary: >-
  A research-showcase brochure from the School of Continuous Improvement sets
  out the Yard Capability Maturity Model, a four-level named instrument
  extending the University's maturity-model method from the committee room
  and the kerb to the backyard washing line. Six published studies anchor the
  showcase, and three roster researchers speak to a public, append-only
  register that a household cannot leave once it qualifies.
topic: >-
  Can a backyard washing line be scored the way Slop University already
  scores a bin-night routine or a committee — level by level, by name?
  Towards a Yard Capability Maturity Model, bringing the University's proven
  method home.
