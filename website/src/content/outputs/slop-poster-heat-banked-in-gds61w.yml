summary: >-
  A research poster from the School of Underlying Conditions closes six seasons
  of heat balance at an aquifer thermal energy storage doublet serving four
  semi-closed glasshouses, finding the store's imbalance ratio rising from +0.18
  to +0.41 over four seasons and the cold well ending its cooling season at 13.6
  °C. A shoulder-month regime of night dry-cooling then brought the ratio back to
  +0.07 and the cold well's end-of-season temperature to 10.2 °C.
topic: >-
  heat banked in sand: six seasons of creeping thermal imbalance at an aquifer
  thermal energy storage doublet beneath a market-garden glasshouse cluster, and
  the shoulder-month dry-cooler regime that rebalanced it
