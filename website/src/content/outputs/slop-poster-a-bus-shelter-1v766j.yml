doi: 10.5555/slop.1v766j
summary: >-
  A research poster from the School of Emergent Priorities applies a
  regression-discontinuity design to a suburban bus network's fixed
  shelter-eligibility line, finding that stops which cross the threshold see
  boardings rise by roughly nine riders a day within eight weeks, an effect
  absent at every placebo cutoff tested. The network's asset-planning unit
  now treats the discontinuity itself as certification, locking a stop into
  shelter status for a fixed three-year review cycle once it clears the line.
topic: >-
  a bus shelter is installed only once a stop's daily boarding count crosses
  a fixed council threshold: a regression-discontinuity design comparing
  wait-time and boarding behaviour at stops just above versus just below the
  threshold
