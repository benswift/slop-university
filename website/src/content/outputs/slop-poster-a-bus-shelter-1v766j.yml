title: Measuring the Shelter Effect
subtitle: A Regression-Discontinuity Audit of a Bus-Stop Boarding-Count Cutoff
authors:
  - Marek Solheim
  - Verity Marris
  - Ingeborg Nwachukwu
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-16
