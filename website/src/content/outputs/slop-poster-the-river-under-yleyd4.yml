doi: 10.5555/slop.yleyd4
summary: >-
  A research poster from the School of Underlying Conditions reads 74 versions
  of an inland district's legend of an underground river, recorded from 41
  bore drillers, diviners, landholders and water-authority field staff, motif
  by motif. The near miss is the one motif every group of tellers keeps, and
  in 31 versions the teller produces a dry bore's log as evidence for the
  river, so that each failed bore fixes the river's line by negation rather
  than counting against it.
topic: >-
  The river under the district: a folkloristic reading of an occupational
  legend of hidden groundwater, told by bore drillers, diviners and
  landholders, in which every dry bore becomes proof that the river runs just
  past it
