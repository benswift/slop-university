title: The River We Just Missed
subtitle: Dry Bores and the Legend of an Underground River in One Inland District
authors:
  - Vigdis Emenike
  - Ragnhild Uzoma
  - Sunniva Balogun
preset: research-poster
school: School of Underlying Conditions
