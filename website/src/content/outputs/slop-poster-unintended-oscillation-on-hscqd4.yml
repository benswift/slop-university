doi: 10.5555/slop.hscqd4
summary: >-
  A research poster from the School of Settled Matters follows 58 students in
  23 design teams through three offerings of a postgraduate power amplifier
  design elective, in which 16 first prototypes oscillated on the bench. Teams
  that noticed the oscillation themselves, mostly from the supply current,
  gained 5.1 points on a 12-item stability-reasoning probe against 2.3 where a
  demonstrator pointed it out, and the demonstrator-shown notebooks recorded the
  remedy but rarely the cause.
topic: >-
  unintended oscillation on the bench as a threshold experience in an advanced
  power amplifier design course, and whether it matters who first notices the
  prototype is oscillating
