title: Who Noticed First
subtitle: >-
  Bench Oscillation as a Threshold Experience in Power Amplifier Design
authors:
  - Anselm Threlkeld
  - Ingeborg Nwachukwu
  - Dagny Okafor
preset: research-poster
school: School of Settled Matters
date: 2026-11-24
