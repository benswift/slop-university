title: Made in the First Minute
subtitle: Dosing rate, not recipe, sets the batch-to-batch spread of a MnO₂ peroxidase mimic
authors:
  - Signy Okpara
  - Bram Ntuli
  - Casimir Beng
preset: research-poster
