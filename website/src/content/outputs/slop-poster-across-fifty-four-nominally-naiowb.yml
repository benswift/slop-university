summary: >-
  A research poster from the School of Continuous Improvement makes 54 batches
  of a peroxidase-mimicking manganese oxide nanozyme in three arms of 18, with a
  logging balance under every receiving flask. Hand-dosed batches span a
  fourfold range of specific activity that a tightened recipe leaves almost
  unchanged (CV 31% against 29%), the first-minute permanganate arrival rate
  explains 71% of that variance, and syringe-pump dosing cuts the spread to a
  CV of 9%.
topic: >-
  Across fifty-four nominally identical batches of a manganese oxide
  peroxidase-mimicking nanozyme, specific activity is fixed in the first minute
  of synthesis by how fast the permanganate is added, so a syringe pump narrows
  the lot-to-lot spread that tightening the recipe does not
