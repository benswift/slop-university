doi: 10.5555/slop.9vof0y
summary: >-
  A research poster from the School of Continuous Improvement compares
  capillary microsamples taken at two scheduled clinic visits with four
  unannounced home samples requested by text message from each of 112 adult
  volunteers over ten weeks. Before scheduled visits, short-lived markers of
  commonly recommended foods rose (proline betaine from 34% to 58% of samples
  above its recent-intake cut-off) and short-lived markers of indulgence fell
  (ethyl glucuronide from 24% to 9%), while weeks-scale markers held still and
  visits rebooked at under 24 hours' notice showed no shift.
topic: >-
  Dietary intake biomarkers in scheduled clinic microsamples versus
  unannounced home microsamples: how far a participant tidies the metabolome
  before a study visit
