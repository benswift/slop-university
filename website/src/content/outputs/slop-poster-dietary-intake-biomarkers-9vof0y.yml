title: Set Out for the Visit
subtitle: Dietary intake biomarkers in scheduled and unannounced microsamples from the same 112 participants
authors:
  - Eivind Onwuka
  - Halvard Nnamani
  - Thandiwe Solberg
preset: research-poster
school: School of Continuous Improvement
