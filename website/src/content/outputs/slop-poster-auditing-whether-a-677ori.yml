title: Quiet, Not Cleared
subtitle: >-
  Auditing a School Instrument-Hire Flag After a Cleared Dispute
authors:
  - Renke Sabel
  - Solveig Adeyemi
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-13
publishedAt: "2026-08-13T02:03:03+10:00"
doi: 10.5555/slop.677ori
summary: >-
  A research poster from the School of Continuous Improvement matches 1,142
  school instrument hires across three terms and three depots, pairing 214
  families who successfully disputed an automated damage-match flag with
  matched never-flagged families borrowing the same instrument type at the
  same rate. Re-flag odds at the next hire are statistically indistinguishable
  between the two groups overall, except for brass instruments, which
  re-flag at more than double the matched baseline rate, a gap traced to the
  scanner's own confidence threshold rather than to family history.
topic: >-
  auditing whether a school instrument-hire scheme's automated before/after
  photo damage-match flag on a family's account is actually cleared after a
  successful dispute, or just goes quiet until the instrument's next hire
  cycle re-raises it
