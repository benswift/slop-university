title: Folding the Cube in Half
subtitle: Reversible [4Fe–4S] to [2Fe–2S] Conversion in a Tidal-Flat Ferredoxin Across Twelve Air-Exposure Cycles
authors:
  - Sunniva Balogun
  - Brynjar Obiora
  - Vigdis Emenike
preset: research-poster
school: School of Emergent Priorities
date: 2026-11-14
publishedAt: "2026-11-14T08:01:41+11:00"
doi: 10.5555/slop.q7sii9
summary: >-
  A research poster in bioinorganic chemistry from the School of Emergent
  Priorities follows the iron-sulfur cluster of a ferredoxin from a tidal-flat
  bacterial isolate through twelve cycles of air exposure and reductive
  recovery by Mössbauer and EPR spectroscopy, finding that the [4Fe-4S] cluster
  folds to a [2Fe-2S] form in air and is rebuilt on each reduction, but that the
  share restored falls from 94% after the first cycle to 58% after the twelfth
  as iron leaves the protein altogether.
