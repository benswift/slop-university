summary: >-
  A research poster from the School of Continuous Improvement scores the
  cleaning tick-sheets of 46 park public-toilet blocks against a five-level
  maturity model, and records what happens to the cleaning round once a shire
  adopts the fourth level as its threshold for a fortnightly visit.
topic: >-
  The works supervisor at a shire depot scores each park public-toilet block's
  cleaning tick-sheet against a five-level maturity model, LATCH, and the
  council moves the cleaning round to a fortnightly visit for every block whose
  paperwork reaches Level Four
