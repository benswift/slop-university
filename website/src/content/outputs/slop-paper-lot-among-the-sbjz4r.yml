title: By Lot among the Fundable
subtitle: Scientific Merit, Foresight and the Allocation of Coherent Beamtime
authors:
  - Anselm Threlkeld
preset: paper
school: School of Settled Matters
date: 2026-11-22
publishedAt: "2026-11-22T07:30:49+11:00"
doi: 10.5555/slop.sbjz4r
summary: >-
  A paper from the School of Settled Matters reads the access clause under
  which a shared light source allocates its coherent X-ray imaging beamtime as
  a statute, and finds that "on the basis of scientific merit" sets a
  qualifying threshold rather than an order of merit. Since no review panel can
  foresee which ptychographic or coherent diffraction experiments will
  reconstruct, it argues that a lottery among fundable proposals is the more
  legitimate instrument, because it tells each refused applicant something true
  and keeps a record of past beamtime from deciding the draw.
topic: >-
  lot among the fundable: the political legitimacy of allocating coherent X-ray
  imaging beamtime by lottery once proposals clear the review panel's
  threshold, since no panel can foresee which samples will reconstruct and the
  facility's scientific-merit clause, read as a statute, licenses only the
  threshold
