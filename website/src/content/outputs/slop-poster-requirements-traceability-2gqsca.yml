summary: >-
  A research poster from the School of Emergent Priorities recovers trace links
  between 268 written procedures and the 412 stored heating programs of one
  facility's shared microwave reactor. It finds that 61% of procedures trace to
  a single program, that prose and program agree on almost every value the
  prose states, and that stir rate, pre-stir and cool-to temperature are set in
  the program but almost never written down outside the teaching SOPs.
topic: >-
  Requirements traceability between a chemistry facility's written
  microwave-synthesis procedures and the stored heating programs on its shared
  reactor: recovering which program each procedure actually runs, and which run
  parameters live only in the program and nowhere in the prose
