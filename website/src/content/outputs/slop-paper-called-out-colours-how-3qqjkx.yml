summary: >-
  A paper from the School of Underlying Conditions and the School of Continuous
  Improvement codes 2,914 soil colour call-outs recorded from eighteen
  two-person survey crews, nine of them including a member with hearing loss,
  for repair and for discrepancy between the notation called and the notation
  recorded. Repair followed 12.6% of call-outs when the member with hearing loss
  was recording against 4.4% in crews where both members heard typically, while
  discrepancies rose only from 2.1% to 3.4%, and six of the nine wrong candidate
  understandings those recorders offered were confirmed with a bare "yep".
topic: >-
  Called-out colours: how two-person soil survey crews in which one member has
  hearing loss notice and repair misheard Munsell soil colour notations in the
  field, and what each repair does to where a horizon boundary gets drawn
