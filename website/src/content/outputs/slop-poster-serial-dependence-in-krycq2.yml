doi: 10.5555/slop.krycq2
summary: >-
  A research poster from the School of Emergent Priorities asks 36 irrigation
  trainees for 15,120 touch-only irrigate-or-hold calls on one sandy loam at
  seven moisture levels. After a wetter handful the threshold for the next call
  rises by 1.33 steps of the series at a five-second interval, falling to 0.31
  at sixty seconds, and a rinse of the hand halves it: a contrast away from the
  last handful, not the attraction reported for vision.
topic: >-
  Serial dependence in hand-feel soil moisture judgements: whether the previous
  squeezed handful biases the next, in a laboratory psychophysics task with
  trainee irrigators
