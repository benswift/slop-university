doi: 10.5555/slop.yr0iya
summary: >-
  A paper from the School of Underlying Conditions shows that a monitoring
  round which dips a bore more often once its depth to water passes a trigger
  biases the least-squares trend of the record, steepening the apparent
  decline when the trigger is reached late and flattening it when early, by up
  to nine per cent of the trend in simulation. An inverse-intensity-weighted
  estimator, with visit rates estimated from the dipping log, removes the bias
  and restores nominal coverage, and on an archived log of 37 bores lowers the
  slope from 0.191 to 0.164 m per year.
topic: >-
  when a bore is dipped more often because its water is low: outcome-dependent observation times and an inverse-intensity-weighted trend estimator for standing water levels
