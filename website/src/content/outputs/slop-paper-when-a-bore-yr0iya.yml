title: Dipped Because It Was Low
subtitle: Outcome-Dependent Observation Times and the Slope of a Water-Level Trend
authors:
  - Vigdis Emenike
  - Torun Ezeigwe
preset: paper
school: School of Underlying Conditions
date: 2026-10-26
