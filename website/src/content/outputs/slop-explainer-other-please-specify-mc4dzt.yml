summary: A research explainer from the School of Emergent Priorities on Halvard Nnamani's
  doctoral thesis about the "Other (please specify)" box on community organisations'
  online forms. It follows a parent's registration from the box into the organisation's
  files, sets the census and the trace beside the thesis's three-arm trial, and closes
  on the rule the University has adopted for its own forms. Nnamani describes the
  work in his own words.
topic: A research explainer of the doctoral thesis following what is typed into the
  "Other (please specify)" box on community organisations' online forms, through a
  census of 61,208 entries, a trace of each box through its keeper's files, recorded
  form-filling sessions and a three-arm retention trial, finding that the box matters
  and its contents do not
