doi: 10.5555/slop.cg22p0
summary: >-
  A research poster from the School of Emergent Priorities randomises the eight
  pens of a newly housed aviary laying flock to an 08:00 or a 13:00 daily
  floor-egg round across weeks 19 to 32 of age, logging every floor egg by
  one-metre grid cell over 784 pen-days. Floor laying fell from about 7% of eggs
  to 0.7% under the 08:00 round and to 3.0% under the 13:00 round, where 61% of
  late floor eggs fell in the six cells the flock had used most in its first
  week of lay.
topic: >-
  Floor eggs in a newly housed aviary laying flock: whether the hour of the
  stockperson's daily floor-egg collection round shapes where, and for how many
  weeks, hens keep laying outside the nest boxes
