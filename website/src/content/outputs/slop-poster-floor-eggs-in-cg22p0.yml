title: Picked Up Before the Peak
subtitle: >-
  Floor-egg collection time and floor laying in a newly housed aviary flock
authors:
  - Ylva Ogunbanjo
  - Brynjar Obiora
preset: research-poster
school: School of Emergent Priorities
date: 2026-11-23
