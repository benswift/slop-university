summary: >-
  A marketing brochure from the School of Continuous Improvement showcases
  seven published Slop University studies of naturally occurring cutoffs and
  traces the same design into the University's own discretionary
  grant-renewal rule, which now lapses on the same twelve-minute window a
  booking app uses to release an unconfirmed table.
topic: >-
  The booking app's twelve-minute confirmation window, the point at which an
  unconfirmed table reservation silently reverts to the queue, becomes Slop
  University's naturally occurring quasi-experiment on how a timer's edge
  shapes a diner's later review, and the same window now decides whether a
  discretionary grant offer stands or lapses.
