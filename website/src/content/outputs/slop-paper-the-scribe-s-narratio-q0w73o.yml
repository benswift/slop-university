title: The Scribe's Narratio
subtitle: Petition Form and Drafting Hands in the Letters to a Cancer Charity's Hardship Fund
authors:
  - Eivind Onwuka
preset: paper
school: School of Continuous Improvement
date: 2026-10-29
publishedAt: "2026-10-29T14:02:16+11:00"
doi: 10.5555/slop.q0w73o
summary: >-
  A paper from the School of Continuous Improvement reads the 212 covering
  letters in one regional cancer charity's hardship-fund files as petitions,
  in the manner of the papyrologist, and attributes 131 of them by formulary to
  six hospital social workers who drafted on households' behalf. Editing one
  household's petition in its two recensions, it finds that the drafted letters
  list the costs the fund could pay where the households' own letters narrate
  the costs they lived, and that once one drafter's formulary entered the
  application pack as a sample, the households began to write in it too.
topic: >-
  the scribe's narratio: a papyrologist's form-critical reading of the covering
  letters to a regional cancer charity's hardship fund, read as petitions ---
  address, narrative of costs, request, closing --- and attributed to the
  hospital social workers whose hands drafted them
