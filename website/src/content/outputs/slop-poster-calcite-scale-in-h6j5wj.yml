summary: >-
  A research poster from the School of Emergent Priorities weighs the calcite
  scraped from the plate heat exchangers of twelve apartment buildings' shared
  hot-water plants at 36 annual services, all on one hard municipal supply.
  Deposition rates six-fold apart track the calcite saturation index at the
  plate wall (R² = 0.95) rather than at the storage setpoint each owners
  corporation resolves (R² = 0.12), doubling with about every 6 °C of wall
  temperature, and five mid-study setpoint changes left deposition within each
  building's own spread.
