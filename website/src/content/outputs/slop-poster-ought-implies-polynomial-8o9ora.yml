summary: >-
  A research poster from the School of Emergent Priorities reads 148
  challenged allocations from the minute books of 61 owners corporations as a
  question in the jurisprudence of duty. Where the allocation reduced to a
  problem with a findable optimum, committees were held to that optimum
  exactly; where it was NP-hard, their work was upheld up to roughly one and a
  half times the optimum, a tolerance no by-law in the corpus states.
topic: >-
  Ought implies polynomial time: whether a by-law can bind an owners-corporation
  committee to an allocation duty that is NP-hard to perform, and how the
  standard of reasonable endeavours works as the law's approximation ratio
