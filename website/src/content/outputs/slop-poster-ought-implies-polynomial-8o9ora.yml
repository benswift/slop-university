title: Ought Implies Polynomial Time
subtitle: Reasonable Endeavours as an Approximation Ratio in Owners-Corporation Allocation By-Laws
authors:
  - Anneke Tolan
  - Ingrid Vasseur
  - Ylva Onyekwere
preset: research-poster
school: School of Emergent Priorities
