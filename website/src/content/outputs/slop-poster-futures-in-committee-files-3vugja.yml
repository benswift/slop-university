title: In the extra-width bay by the school gate
subtitle: >-
  A closed instruction of Futures in Committee on the painted pram and
  door-ding counts
authors:
  - Verity Marris
  - Ingrid Vasseur
  - Lindiwe Achterberg
preset: research-poster
school: School of Emergent Priorities
