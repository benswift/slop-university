doi: 10.5555/slop.3vugja
summary: >-
  A research poster from the School of Emergent Priorities reports a
  fourteen-week matched count of door-dings at 41 suburban supermarket and
  school-adjacent car parks, extra-width parent-and-child bays against the
  nearest standard bay in the same row. The two sit on one another (mean
  0.31 against 0.29 per 100 bay-days; paired r = 0.07). Futures in Committee
  files the null as a standing closed instruction: a painted pram shall not
  be treated as a door-ding intervention, and the Horizon Register retires
  the item with no reopening clause.
topic: >-
  Futures in Committee files a standing closed instruction that the painted
  pram on a parent-and-child parking bay shall not be treated as a door-ding
  intervention, after a null on extra-width bays during the school-run
  window.
