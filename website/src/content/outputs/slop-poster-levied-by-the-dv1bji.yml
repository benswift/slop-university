doi: 10.5555/slop.dv1bji
summary: >-
  A research poster in economic history from the School of Underlying
  Conditions reconstructs the books of one inland district's burial club for
  contract bore drillers, 1878–1931, which from 1893 levied its members by the
  feet they drilled rather than by age. The footage levy cut lapse within two
  years of entry from 31 to 9 per cent by falling due when contracts paid, but
  once power rigs multiplied footage per man their crews paid 66 per cent of
  levies against 25 per cent of benefits in 1918–21, left in 1922, and the
  club wound up in 1931.
topic: >-
  Levied by the foot: the economic history of a bore drillers' mutual burial
  club that rated its members by footage drilled rather than by age, 1878-1931
