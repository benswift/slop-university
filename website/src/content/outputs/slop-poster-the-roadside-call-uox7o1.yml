summary: >-
  A research poster from the School of Continuous Improvement estimates the
  counted call-out distribution of one motoring club across 96,412
  de-identified member-years and nine patrol regions, finding an excess of
  counted calls at the four-call-out membership cap and more than half the
  counterfactual mass above it absent from the record. The club's annual
  patrol-van allocation is computed from that same counted rate.
topic: >-
  the roadside call for a flat battery on a suburban street, where a motoring
  club's membership covers four call-outs a year before the fifth is charged,
  so the counted call-out rate the club uses to station its patrol vans between
  regions bends sharply at the cap --- and the regions whose members most often
  reach it are the ones the count reports as needing the fewest vans
