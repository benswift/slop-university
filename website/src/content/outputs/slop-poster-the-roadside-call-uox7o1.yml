title: "The Fifth Call Never Happens"
subtitle: "Bunching at a Motoring Club's Four-Call-Out Membership Cap, and the Patrol Allocation Computed From the Counted Rate"
authors:
  - Casimir Beng
  - Mirela Hanke
  - Dagny Okafor
