doi: 10.5555/slop.4oq406
summary: >-
  A research poster from the School of Emergent Priorities tracks a junior
  netball club's away-game transport across a full season, finding the paid
  team-management app's booking-calendar feature logs only a small fraction
  of arranged lifts against the transport duty parent's group chat. Written
  up as a single-site teaching case with an accompanying teaching note, the
  finding becomes required transport-coordination practice for every
  community sport club the University's Capability Sprints program
  accredits.
topic: >-
  a junior netball club's transport duty parent keeps the away-game carpool
  running from a parents' group chat while the club's paid team-management
  app's booking-calendar feature for lift requests sits unused; a
  single-site teaching case, with teaching note, for the Capability Sprints
  program
