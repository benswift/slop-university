title: The Carpool Runs on the Group Chat, Not the App
subtitle: >-
  A Single-Site Teaching Case of a Netball Club's Away-Game Carpool, With
  Teaching Note
authors:
  - Anneke Tolan
  - Ingrid Vasseur
  - Iben Chikere
