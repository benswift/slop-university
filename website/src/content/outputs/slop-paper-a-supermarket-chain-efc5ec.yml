title: Wherever the Tall Guy Left It
subtitle: A Survey of Floor Staff Wayfinding Heuristics Against a Supermarket
  Chain's Planogram-Reset Compliance Score
authors:
  - Sten Okwuosa
  - Thandiwe Solberg
  - Ingeborg Nwachukwu
preset: paper
school: School of Continuous Improvement
date: 2026-08-11
publishedAt: "2026-08-11T00:05:03+10:00"
doi: 10.5555/slop.efc5ec
summary: >-
  A paper from the School of Continuous Improvement surveys 612 floor staff
  across 34 stores of a national supermarket chain, finding the chain's own
  planogram-reset compliance score explains almost none of the variance in
  staff self-rated confidence finding items for a customer (r = 0.09, R² =
  0.008), while tenure explains substantially more; staff report navigating
  by landmark products and carried-over spatial memory far more often than
  by the compliance score itself, which they name least often of six
  heuristics.
topic: >-
  a supermarket chain audits each store on planogram-reset compliance --
  how closely the shelves match the corporate reset diagram after each
  range change -- and treats a high score as evidence staff know the
  store; surveying floor staff on the wayfinding heuristics they actually
  use to locate an item for a customer (a landmark product, muscle memory
  from the previous layout, asking whoever restocked that aisle) and
  testing how much of the variation in staff's self-rated confidence the
  store's compliance score explains
