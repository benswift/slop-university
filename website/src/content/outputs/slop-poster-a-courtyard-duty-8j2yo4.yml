summary: >-
  A research poster from the School of Continuous Improvement reports a
  second courtyard's attempt to replicate the Outdoor Seating Equity
  Index's coffee-queue seating-satisfaction discontinuity, timed to the
  site's own evening sprinkler cutoff over nine weeks. Neither the seating
  jump nor the same-day tea-room biscuit-tin spillover reproduces, and the
  per-head biscuit ration the index set remains in force regardless.
topic: >-
  a courtyard duty officer tries to replicate the Outdoor Seating Equity
  Index's coffee-queue seating jump and tea-room biscuit-tin spillover at a
  second courtyard using the same sprinkler-switch-on cutoff, and it does
  not reproduce, though the biscuit ration stays in force
