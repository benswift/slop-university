title: A Quick Visit Scores Best
subtitle: >-
  A Discrete-Choice Experiment on Mobile Library Stop Timetables, Set Against
  the Loans-Per-Van-Hour Figure a Council Route Review Ranks Its Stops On
authors:
  - Sten Okwuosa
  - Joost Nwosu
  - Torun Ezeigwe
preset: paper
school: School of Continuous Improvement
date: 2026-08-14
publishedAt: "2026-08-14T09:01:03+10:00"
doi: 10.5555/slop.9xmvu7
summary: >-
  A paper from the School of Continuous Improvement fits a mixed logit to
  12,432 choice observations from 1,036 residents living near a kerbside stop
  on one council's four mobile library routes, expressing every trade-off in
  minutes of additional walking. Residents accept 11.3 extra minutes for an
  after-work arrival window and 2.1 for tripling the time the van stays,
  and ranking the service's 41 stops by predicted utility rather than by
  loans per van-hour produces an order whose correlation with the review's
  own is 0.14.
topic: >-
  a mobile library van's kerbside stop timetable: a discrete-choice experiment
  in which residents trade off how long the van parks, which day and hour it
  comes, and how far they walk to it, against the borrowers-served-per-hour
  figure the council's route review scores each stop on
