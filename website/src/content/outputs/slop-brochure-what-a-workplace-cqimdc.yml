summary: >-
  A research showcase led by the School of Emergent Priorities presents the
  University's work on the provisions of working life, from the break-room
  shelf and the leave policy to issued workwear, the staff car park and the
  handbooks and forms through which welfare is offered and asked for. It
  organises that work into four themes and directs readers to seven published
  studies cited by title and DOI.
