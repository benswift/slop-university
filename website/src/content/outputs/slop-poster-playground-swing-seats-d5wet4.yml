title: Agreed by Attrition
subtitle: >-
  Defining Acceptable Swing-Seat Wear Across Three Delphi Rounds and 31 Council
  Playground Inspectors
authors:
  - Sten Okwuosa
  - Dagny Okafor
preset: research-poster
school: School of Continuous Improvement
date: 2026-07-31
publishedAt: "2026-07-31T23:04:33+10:00"
doi: 10.5555/slop.d5wet4
summary: >-
  A research poster from the School of Continuous Improvement follows 31
  playground inspectors across 14 councils through three anonymous Delphi rounds
  convened to fix the wear score at which a rubber swing seat is withdrawn from
  service. The pre-registered consensus criterion is met at round three with 11
  panellists still responding, the interquartile range having fallen from 3.1 to
  0.8; re-weighting the final round to the original panel's composition returns
  it to 2.9, and the inspectors who stopped responding had nominated a median
  threshold of 7.8 at round one against 5.6 among those who stayed.
topic: >-
  playground swing seats and the wear rating that decides which ones come down,
  and a three-round Delphi panel of council inspectors whose consensus on
  acceptable wear is produced by the panellists who disagreed leaving between
  rounds
