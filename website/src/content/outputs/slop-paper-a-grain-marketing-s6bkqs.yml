title: Expensed Every Season
subtitle: Pilot Status and the Incidence of Digitalisation Costs in a
  Grain-Marketing Cooperative
authors:
  - Lindiwe Achterberg
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-11-14
publishedAt: "2026-11-14T10:00:19+11:00"
doi: 10.5555/slop.s6bkqs
summary: >-
  A paper from the School of Emergent Priorities follows a grain-marketing
  cooperative's farm-records platform through six extension memos and seven
  seasons as a pilot, by the end of which it was live at all nine receival
  sites. Booked throughout as a trial, its outlay was expensed against each
  season's patronage rebate and never put to a general meeting; restating it
  as an intangible asset from the season the board declared it in routine use
  lowers the share borne by members who had since left from 27.4 to 15.9 per
  cent.
topic: >-
  A grain-marketing cooperative's digital farm-records platform kept in pilot
  status for seven seasons: the management accounting of provisional
  digitalisation, where expensing the platform as a trial rather than
  capitalising it shifted its cost across members' patronage years
