summary: >-
  A prospectus brochure from the School of Continuous Improvement invites
  prospective students to study how work is sequenced when its rooms, hands and
  hours are shared. It introduces the subject through the Master of Applied
  Measurement, the Review Cadence Observatory and Improvement Grand Rounds, and
  points the reader to five published University studies of rosters, booking
  boards, queues and working bees, cited by title and DOI.
