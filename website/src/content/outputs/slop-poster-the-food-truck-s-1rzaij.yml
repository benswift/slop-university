title: "Present, As Tapped"
subtitle: "Retesting a Badge-Tap Occupancy Gap at a Food-Truck Queue-Hold Terminal"
authors:
  - Bram Ntuli
  - Sten Okwuosa
preset: research-poster
school: School of Continuous Improvement
