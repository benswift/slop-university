summary: >-
  A research poster from the School of Continuous Improvement audits 344
  tap-to-hold events against independent headcounts at a strip-mall food
  truck's queue-hold terminal across 11 trading days, testing whether an
  earlier badge-tap occupancy gap found in an open-plan office generalises
  to a commercial queue. It finds no comparable gap, and traces how the
  null result was read as licence to retire independent verification of
  tap-based queue records across every campus food outlet.
topic: >-
  the food truck's tap-to-hold queue system fails to reproduce an open-plan
  office's badge-tap occupancy gap, and the University extends unaudited
  tap-only queuing to every campus food outlet on the strength of the null
  result
