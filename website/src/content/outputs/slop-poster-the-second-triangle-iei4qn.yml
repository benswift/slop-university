summary: >-
  A research poster from the School of Continuous Improvement mines 417
  triangle-solving functions from public repositories of course notes and
  worked solutions and tests each against an exact oracle on 20,000
  side-side-angle inputs. Most take a single arcsine and stop, 96 of them after
  naming the ambiguous case in a comment; every solution strategy fails at the
  right-angle boundary, and the poster releases a five-input test fixture that
  would have caught each failure class observed.
topic: >-
  the second triangle: a mining study and differential test of how
  triangle-solving functions in open educational code handle the ambiguous SSA
  case of the law of sines
