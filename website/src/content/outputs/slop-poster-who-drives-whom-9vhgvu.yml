summary: >-
  A research poster from the School of Continuous Improvement follows residents
  of seven outlying villages to a regional hospital's afternoon outpatient
  clinics after the last return bus has left, through twelve weeks of travel
  diaries and interviews with those who give and receive lifts. It finds the
  afternoon trips carried largely by a small pool of retired neighbours, nine
  of 68 drivers giving 41 per cent of all lifts, and residents with no named
  lift-giver keeping 58 per cent of afternoon appointments as booked against 91
  per cent of morning ones.
topic: >-
  who drives whom after the last bus: the informal lift economy carrying
  outlying-village residents to a regional hospital's afternoon outpatient
  clinics, and who goes without
