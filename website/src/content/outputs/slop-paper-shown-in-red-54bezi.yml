doi: 10.5555/slop.54bezi
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement uses the rounding rule behind a semi-professional football
  league's weekly relegation forecast, which shades a club's cell red once its
  printed probability reaches 25, as a regression discontinuity across 3,024
  club-rounds over nine seasons. Being shown in red more than doubles a club's
  emergency loan registrations in the following fortnight and raises its
  registered-player wage bill by about 12%, with no detectable effect on points
  in the next four rounds or on eventual relegation.
topic: >-
  Shown in red: a regression-discontinuity study of a semi-professional football
  league's published relegation probabilities, where clubs whose displayed
  probability crossed the 25% red band took on more emergency loan players and
  wage spend in the following fortnight than clubs just below it, with little
  gain in survival
