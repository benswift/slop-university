title: Shown in Red
subtitle: Published Relegation Probabilities and Emergency Loan Spending in a Semi-Professional Football League
authors:
  - Anneke Tolan
  - Halvard Nnamani
  - Eskil Nwabueze
preset: paper
school: School of Emergent Priorities
