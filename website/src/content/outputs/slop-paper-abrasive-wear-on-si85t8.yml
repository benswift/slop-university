doi: 10.5555/slop.si85t8
summary: >-
  A paper from the School of Continuous Improvement measures the loss of
  brushed finish across 31 stainless-steel keypad plates from a retired fleet
  of railway ticket-vending machines, re-enacts purchases with 24 participants
  and walks the plates with seven former staff. After the Confirm key, the
  most worn surfaces were not keys: the margin where passengers steadied a
  hand while reading the screen, the card-reader bezel lip and a single fixing
  bolt, and anchoring contacts filled more than half of all contact time.
topic: >-
  abrasive wear on the stainless-steel keypads of a retired ticket-machine
  fleet, read as a record of where passengers' hands actually go
