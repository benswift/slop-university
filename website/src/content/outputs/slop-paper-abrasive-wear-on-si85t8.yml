title: Where the Steel Went
subtitle: Read Wear on the Keypads of a Retired Ticket-Machine Fleet
authors:
  - Marit Osayande
  - Mirela Hanke
  - Ragnhild Uzoma
preset: paper
school: School of Continuous Improvement
