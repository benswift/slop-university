summary: >-
  A marketing poster for the School of Emergent Priorities compresses the
  published finding of "Everybody Comes, Nobody Joins" --- that suburban clubs
  adopting barefoot-bowls nights lose playing members relative to matched clubs
  that never ran one, while counted participation rises --- into a single
  portrait panel carrying seven words, one supporting sentence and the deposit's
  identifier. Prepared for the University's bus-stop and campus signage rotation
  in matched daylight and after-dark renderings.
topic: >-
  research teaser --- the barefoot bowls night that fills the green every Friday
  while the membership book stays shut, and a headcount that counts the crowd
  rather than the club
