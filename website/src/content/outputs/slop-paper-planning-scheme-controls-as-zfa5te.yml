title: Minor for the Scheme, Total for the Lot
subtitle: Residential Setbacks as a Set-Valued Map, and the Envelopes Six Minor Amendments Emptied
authors:
  - Anselm Threlkeld
  - Ronja Oyelaran
preset: paper
school: School of Settled Matters
date: 2026-11-25
publishedAt: "2026-11-25T01:32:47+11:00"
doi: 10.5555/slop.zfa5te
summary: >-
  A paper from the School of Settled Matters models a residential planning
  schedule's setback controls as a set-valued map from control values to each
  lot's usable building envelope, and proves that the envelope moves by no more
  than a bound set by one per-lot quantity, its margin. Replaying the six
  setback amendments a middle-ring municipality passed as minor across all
  11,382 of its residential lots, it finds that surviving envelopes moved by the
  size of each change while 648 narrow and rear lots lost their usable envelope
  entirely, and proposes a minor-amendment test evaluated lot by lot.
topic: >-
  Planning-scheme controls as a set-valued map: when a small amendment to a
  setback or height control makes a lot's buildable envelope jump or vanish,
  read through the semicontinuity of the feasible set
