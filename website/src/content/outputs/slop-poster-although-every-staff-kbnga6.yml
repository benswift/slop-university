doi: 10.5555/slop.kbnga6
summary: >-
  A research poster from the School of Continuous Improvement surveys 364 staff
  in six open-plan workplaces and reports the drop of each lanyard card below
  the collarbone as a distribution, finding that seven cards in the whole
  sample hang at the length they were issued, and that three of the six sites
  carry a second, belt-level mode. The University now recuts every issued
  lanyard to the commonest drop each quarter, with no exemption for stature,
  role or desk height.
topic: >-
  Although every staff lanyard is issued at a single length, the open-plan
  office swipe readers are mounted at one height and nobody has asked where the
  card actually hangs: a survey of 364 office workers at six workplaces,
  reported as distributions of lanyard drop below the collarbone, with
  lanyards recut each quarter to the modal drop
