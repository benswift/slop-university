title: "The Reader Stays Put and the Card Does Not"
subtitle: "A Survey of Lanyard Drop Distributions across 364 Staff in Six Open-Plan Workplaces"
authors:
  - Eskil Nwabueze
  - Lindiwe Achterberg
  - Casimir Beng
preset: research-poster
school: School of Continuous Improvement
