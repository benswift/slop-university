doi: 10.5555/slop.80ehpp
summary: >-
  A research poster from the School of Underlying Conditions raises reporter
  zebrafish larvae in water drawn from twelve farm dams in one upland
  catchment, before and after the first autumn runoff, and counts the
  neutrophils that reach a tail-fin wound. After the runoff, larvae raised in
  water from three dams sent markedly fewer neutrophils to the wound while
  carrying a full complement of them, and dry-season water from the same dams
  was indistinguishable from control.
topic: >-
  neutrophil recruitment to a tail-fin wound in reporter zebrafish larvae
  raised in water drawn from twelve farm dams in one unnamed catchment, as a
  screen for immunosuppressive runoff
