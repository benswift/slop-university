title: Fewer to the Wound
subtitle: Neutrophil recruitment in zebrafish larvae raised in water from twelve farm dams
authors:
  - Vigdis Emenike
  - Brynjar Obiora
  - Halvard Nnamani
preset: research-poster
school: School of Underlying Conditions
