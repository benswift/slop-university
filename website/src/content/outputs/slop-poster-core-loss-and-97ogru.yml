doi: 10.5555/slop.97ogru
summary: >-
  A research poster from the School of Underlying Conditions sizes a
  24-borehole ground-source heat pump field from a 160 m investigation hole
  that lost 28 m of core, and finds that every reasonable way of filling the
  gap moves the design length by less than the thermal response test's own
  uncertainty. Ignoring the lost metres is the one treatment that under-sizes
  the field, by 4.6%.
topic: >-
  Core loss and borefield sizing: how much the unrecovered intervals of a
  site-investigation core change the design length of a ground-source heat
  pump borefield, and whether the thermal response test has already averaged
  the gap away
