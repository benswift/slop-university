doi: 10.5555/slop.pgr8tz
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement models each of the 41 bought-new categories at one suburban tool
  library as an Erlang loss system and, from a survey of members turned away
  when every copy was out, counts the purchases its shortages cause. A spare
  copy is shown to earn its shelf when it averts more purchases over its life
  than it weighs in domestic tools; by that rule the library should hold 128
  copies rather than the 96 an availability target has given it, and
  reallocating the existing 96 alone cuts shortage-driven purchases by more
  than half.
topic: >-
  a suburban tool library modelled as an Erlang loss system, sizing each tool
  category's stock so that the purchases blocked borrowers make cost less
  embodied carbon than another copy on the shelf
