title: The Spare Drill
subtitle: Carbon-Optimal Stocking of a Suburban Tool Library as an Erlang Loss System
authors:
  - Anouk Mensah
  - Bram Ntuli
preset: paper
school: School of Emergent Priorities
date: 2026-10-28
