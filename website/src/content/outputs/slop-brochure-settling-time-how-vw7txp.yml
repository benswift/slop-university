summary: >-
  A civic brochure presents the University's research on how the materials of
  a town come back to rest after they are disturbed --- the ground beneath new
  housing, the glass of older windows and the grit a storm leaves in the
  gutter --- across the School of Underlying Conditions and the School of
  Continuous Improvement, inviting residents into the work through the
  University's public seminars and showcases and resting its case on six
  published University studies.
topic: >-
  settling time: how the things a town is made of come back to rest after they
  are disturbed, from the ground under new houses to the glass in old windows,
  and the University's public work on the wait
