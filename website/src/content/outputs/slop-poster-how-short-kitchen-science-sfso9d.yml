summary: >-
  A research poster from the School of Settled Matters codes 240 short
  kitchen-science explainer videos on why a dressing holds or splits, finding
  the repulsion between droplets personified in 71% of them and the attraction
  that opposes it named in 9%. Read across tenths of running time, explanation
  peaks mid-video and the collapse takes over from the seventh tenth, closing
  59% of the videos.
topic: >-
  how short kitchen-science explainer videos narrate why a colloid stays mixed,
  read as a media genre that personifies charge repulsion and makes the curdle
  its climax
