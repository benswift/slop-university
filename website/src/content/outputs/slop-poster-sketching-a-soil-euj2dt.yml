doi: 10.5555/slop.euj2dt
summary: >-
  A research poster from the School of Underlying Conditions reports a
  crossover trial in which 96 first-year students described eight soil pits,
  either after fifteen minutes sketching the pit face in charcoal or after
  fifteen minutes simply looking. Analysed with the pit as the unit, the spread
  of students' recorded depths to the B horizon was 0.76 of its describe-only
  value after sketching (95% CI 0.64 to 0.91), with the narrowing confined to
  pits whose boundaries were gradual or diffuse.
topic: >-
  sketching a soil pit in charcoal before describing it: a pit-clustered
  crossover trial of whether drawing first makes first-year students place
  horizon boundaries more consistently, with the pit and not the student as the
  unit of analysis
