summary: >-
  A research poster in organisation studies follows 1,312 cases through eleven
  years of one regional hospital radiology department's monthly teaching
  meeting, with fourteen months of observation and 26 interviews. The meeting's
  archive keeps the image of each case, but a case's later course is recorded
  mainly when the registrar who presented it stays on, so the rare brain-iron
  and calcification cases the meeting prizes keep the fewest sequels of all.
topic: >-
  the interesting case and its missing sequel, how a regional radiology
  department's monthly teaching meeting remembers the rare brain-iron and
  calcification cases it presents once and never follows up
