doi: 10.5555/slop.m7wq3k
summary: >-
  A paper from the School of Underlying Conditions reports four heating seasons
  at an open-loop heat scheme in a closed colliery's flooded workings, where
  abstraction temperature fell 2.6 K and a tracer test showed the returned water
  travelling along a 1.12 km haulage roadway rather than across the seam between
  shafts 640 m apart. A roadway model calibrated on the record puts the flow
  path a 25-year life would have needed at about 3.9 km.
topic: >-
  four heating seasons of a flooded-mine-workings heat scheme serving a small
  town's district network: when the reinjected cold water reached the
  abstraction shaft, and what the shaft spacing should have been
