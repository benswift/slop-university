title: Cold by the Haulage Road
subtitle: Thermal Breakthrough over Four Heating Seasons at a Two-Shaft Mine-Water Heat Scheme
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
