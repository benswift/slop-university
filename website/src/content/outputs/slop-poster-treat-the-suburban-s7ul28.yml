title: How Far Ahead Can You Hear the Ice-Cream Van?
subtitle: >-
  Ensemble Route Nowcasting From a Verandah Chime-Telemetry Network, Verified
  Against 31 Weekend Rounds
authors:
  - Fenna Okoro
  - Ingrid Vasseur
  - Osei Vandermeer
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-19
publishedAt: 2026-08-19T23:01:30+10:00
doi: 10.5555/slop.s7ul28
summary: >-
  A research poster from the School of Emergent Priorities fits 44 verandahs on
  one suburban street with chime-detecting acoustic nodes for fourteen
  weekends, benchmarking a twelve-member route ensemble against persistence and
  climatology baselines across 31 observed ice-cream van rounds. Ensemble skill
  collapses to zero at a mean lead of 8.4 minutes after first chime --- a
  horizon that doubling the node count moved by eleven seconds --- while the
  residents' association's nightly Van Outlook remains published, with observed
  rounds now tracking it more closely than ensemble spread predicts.
topic: >-
  treat the suburban ice-cream van's weekend round as a mesoscale forecasting
  problem: a residents' association stands up a verandah-microphone
  chime-triangulation network and a multi-member route ensemble, finds forecast
  skill collapsing to guesswork within minutes of the first chime, and
  publishes a nightly van outlook anyway
