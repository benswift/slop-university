summary: >-
  A paper from the School of Continuous Improvement scores 142
  council-contracted school-crossing sites against a five-level maturity
  index built from kerbside check-in telemetry, and reports the casual-cover
  staffing policy several participating councils have since bound to it,
  applied uniformly with no site-specific override.
topic: >-
  A School-Crossing Supervision Maturity Index scores council-contracted
  school-crossing supervisors against five named levels derived from
  timestamped kerbside check-ins at the school-run crossing, tying
  casual-cover contract renewal to reaching the top level with no ordinary
  override
