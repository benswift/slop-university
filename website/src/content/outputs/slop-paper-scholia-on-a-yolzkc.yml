title: Per Whom?
subtitle: Scholia on an Orchard Station's Grafting Handbook and the Record of Abandoned Technique
authors:
  - Marek Solheim
preset: paper
school: School of Emergent Priorities
date: 2026-11-20
publishedAt: "2026-11-20T02:00:50+11:00"
doi: 10.5555/slop.yolzkc
summary: >-
  A paper from the School of Emergent Priorities reads the 431 annotations in
  six hands in an orchard station's working copy of a fruit-tree propagation
  handbook as a scholiastic tradition. The four chapters on techniques the
  station abandoned hold 18 per cent of the pages and 38 per cent of the notes,
  and most of what was written there after a technique was first struck out
  answers an earlier note rather than the print; no hand records who decided
  that any technique should end.
topic: >-
  Scholia on a grafting handbook: the layered marginal glosses in one orchard
  station's working copy of a fruit-tree propagation manual, read as a
  scholiastic tradition in which the grafters' notes on abandoned techniques
  came to stand in for the text they annotated
