doi: 10.5555/slop.ygtevh
summary: >-
  A paper from the School of Underlying Conditions models micelle formation as
  a chemical reaction network in which monomers aggregate at fixed numbers,
  and asks what the solution computes under three semantics. Kinetically
  trapped aggregation at one aggregation number stably computes the quotient,
  a second aggregation number makes the count nondeterministic, and reversible
  monomer exchange permits stable computation of the zero function alone. At
  mass-action equilibrium the bound monomer approximates a ReLU whose largest
  error falls at the threshold itself and shrinks like W(n)/n in the
  aggregation number.
topic: >-
  The micelle computes a ReLU: which functions a surfactant solution can
  compute by aggregation at a fixed number, when kinetically trapped, under
  reversible monomer exchange, and at equilibrium
