doi: 10.5555/slop.i6fw7w
summary: >-
  A paper from the School of Underlying Conditions analyses sixteen school
  terms of loan records from one primary-school library's levelled reader
  collection and locates, by shelf position, the first book each pupil
  borrowed after moving up a band. A third of 2,214 first loans came from the
  tenth of the band standing nearest the divider just crossed, the
  concentration had gone by the fifth loan, and when the shelving was turned
  around it stayed with the position and passed to a different set of titles.
topic: >-
  first loans across the band divider in a primary-school levelled reader
  collection: a circulation study of which book a child borrows first after
  moving up a reading band
