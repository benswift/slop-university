title: The First Book Over the Line
subtitle: Shelf Position and the First Loan After a Band Change in a Levelled Reader Collection
authors:
  - Brynjar Obiora
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-13
