title: The Margins Clean First
subtitle: >-
  Single- and Ten-Pulse Laser-Cleaning Windows at 532 nm on a Soot-Soiled
  Trade-Catalogue Deposit, by Ink Coverage
authors:
  - Sunniva Balogun
  - Casimir Beng
  - Anneke Tolan
preset: research-poster
school: School of Emergent Priorities
date: 2026-10-18
publishedAt: "2026-10-18T10:00:56+11:00"
doi: 10.5555/slop.oapy78
summary: >-
  A research poster from the School of Emergent Priorities measures soot-removal
  and damage-onset fluences for nanosecond 532 nm pulses across four grades of
  ink coverage on 48 sheets of a soot-soiled mid-century trade-catalogue
  deposit. The removal threshold barely varies across the sheet while the
  damage threshold falls 2.4-fold from bare margin to solid ink, so the cleaning
  window narrows from a ratio of 3.4 to 1.2 in a single pulse and closes
  outright on solid ink at ten.
topic: >-
  the narrowing laser-cleaning window between soot removal and paper damage on
  printed trade catalogues as ink coverage rises
