title: Same Loaf, Different Heels
subtitle: A replication of the loaf-storage crossover in fifty-eight share-house kitchens
authors:
  - Ingeborg Nwachukwu
  - Joost Nwosu
  - Marit Osayande
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-22
