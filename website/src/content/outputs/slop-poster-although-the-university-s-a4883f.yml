doi: 10.5555/slop.a4883f
summary: >-
  A research poster from the School of Continuous Improvement reruns a
  family-kitchen loaf-storage crossover across 58 share-house kitchens and 696
  loaves, finding that the original null holds at two adults (3.6 against 3.5
  slices binned per loaf) and fails above it, with fridge-kept loaves losing
  about a third fewer slices overall, and records the University's amendment of
  its divided-storage provision to a three-way split for any kitchen with more
  than two adult users.
topic: >-
  Although the University's divided-storage provision rests on a family-kitchen
  trial finding that where a loaf is kept does not change how many slices are
  binned, a replication across share-house kitchens finds fridge-kept loaves
  lose far fewer slices than bread-bin ones, and the University extends the
  provision to a three-way split for any kitchen with more than two adults.
