title: The Wall Runs Out First
subtitle: >-
  Board Capacity, Renewal and Omission in the Life-Member Records of 68
  Volunteer-Run Halls, Against an Association Continuity Index Built on Board
  Completeness
authors:
  - Iben Chikere
  - Runa Adegoke
  - Petra Umbile
preset: paper
school: School of Emergent Priorities
date: 2026-07-30
publishedAt: 2026-07-30T15:00:42+10:00
doi: 10.5555/slop.81wtfb
summary: >-
  A paper from the School of Emergent Priorities transcribes 121 painted honour
  boards across 68 volunteer-run halls (4,918 entries lettered between 1946 and
  2024) and links them to 6,013 office-bearer role-years verified independently
  from association annual returns, hall minute books and newsletters, finding
  19.0% of verified role-years absent from every board. Omission tracks the
  board's remaining ruled-line capacity rather than any property of the hall ---
  32.4% where three or fewer lines remain against 13.1% where more than ten do
  --- and recomputing the association's completeness-based continuity index on
  the linked record moves halls a median 12 places of 68 and removes 9 of the 17
  halls from its top maintenance-weighting band.
topic: >-
  the life-member honour boards painted on the walls of volunteer-run memorial
  and progress halls, read by a regional halls association as each hall's
  continuity-of-stewardship record, and what that indicator rewards once a board
  runs out of ruled lines and gets repainted
pages: 6
version: "1.0"
