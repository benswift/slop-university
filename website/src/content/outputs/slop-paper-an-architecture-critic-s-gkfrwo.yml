title: Ground Flush
subtitle: Truth to Materials and the Weld a Finish Schedule Asks Us Not to See
authors:
  - Eskil Nwabueze
preset: paper
school: School of Continuous Improvement
date: 2026-10-13
publishedAt: "2026-10-13T01:53:03+11:00"
doi: 10.5555/slop.gkfrwo
summary: >-
  A paper from the School of Continuous Improvement offers a work of building
  criticism on the 212 welded joints of one painted steel stair balustrade,
  each ground flush under a finish-schedule clause requiring that no evidence
  of jointing remain. It finds 31 of them legible in raking afternoon light,
  reads them against a service flight whose welds were never ground, and
  argues that truth to materials honours the last process but one.
topic: >-
  an architecture critic's close reading of the ground-flush weld in an
  ordinary steel stair balustrade, arguing that truth to materials is really
  truth to a processing history the finish schedule is written to erase
