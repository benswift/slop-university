doi: 10.5555/slop.4r7lur
summary: >-
  A paper from the School of Continuous Improvement reports SLUICE, a
  compiler that turns a council's water-restriction calendar, a rainwater
  tank's sensor feed, and a household's preference weights into a locked
  watering schedule enforced by a valve with no manual override, and a
  suspension rule for residents who override it twice. Across a
  46-household, 14-week deployment, reported disputes fall sharply while
  plant-survival outcomes move little, and an ablation withholding the
  tank-level sensor input suggests the schedule's lock, more than any one
  input, carries most of the effect.
topic: >-
  the household's irrigation warden compiles council water-restriction days
  and tank-level sensor readings into a locked watering schedule that a
  smart valve enforces with no manual override
