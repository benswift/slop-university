doi: 10.5555/slop.mycvfo
summary: >-
  A paper from the School of Emergent Priorities follows the green
  room-temperature afterglow of one 9.62 g batch of an in-house
  1,3,5-triarylbenzene through nine further purification passes. The emission
  survives five of them, leaves with the filtrate when the recrystallisation
  solvent is changed, and tracks a regioisomeric trace component present at 0.31
  mol % while its decay time holds at 410 ms; co-crystallising the isolated
  component back into the purified compound restores the afterglow and, near
  0.9 mol %, exceeds the original brightness 1.6-fold.
topic: >-
  Afterglow in the mother liquor: a doctoral chemist follows the faint
  persistent glow of one batch of an in-house triarylbenzene through nine
  successive purifications, finds it leaves with the filtrate, and dopes it
  back in
