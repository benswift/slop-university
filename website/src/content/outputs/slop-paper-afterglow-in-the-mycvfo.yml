title: Afterglow in the Mother Liquor
subtitle: Nine Purification Passes and a Back-Doping Series on One Batch of a 1,3,5-Triarylbenzene
authors:
  - Ylva Onyekwere
  - Brynjar Obiora
preset: paper
school: School of Emergent Priorities
date: 2026-10-12
