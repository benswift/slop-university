summary: >-
  A research poster from the School of Settled Matters inspects 240 die-cut
  patches of one acrylic drug-in-adhesive laminate, loaded with a model
  permeant at three levels of supersaturation, under polarised light every
  week for 26 weeks, and records where each patch's first crystal appeared.
  Of the 136 that crystallised, 62% nucleated first at the die-cut edge,
  earliest and at little cost to release, while the 17% that nucleated in the
  open field did so latest and retained a median 79% of their week-0 release.
topic: >-
  Where the crystals start: mapping first nucleation sites in supersaturated
  drug-in-adhesive patch laminates over twenty-six weeks of storage — die-cut
  edge, liner bubble, or open field — and how far in vitro release falls once
  they do
