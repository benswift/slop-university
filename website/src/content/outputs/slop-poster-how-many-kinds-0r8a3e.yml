summary: >-
  A research poster from the School of Emergent Priorities sorts 4,812 takes
  from the free-sample trays of twelve supermarket and strip-mall deli
  counters into five mutually exclusive kinds, and finds the kind mix alone
  tracks refill demand better than the till does. The ceremonial take, picked
  up, held and binned, is 31% of takes and converts to no purchase, and trays
  at every University outlet are now refilled from the kind-weighted tally and
  withdrawn once ceremonial takes pass a third of any half hour.
topic: >-
  How many kinds of take does a supermarket deli's free-sample tray receive,
  and can the refill roster be set from the kinds alone?
