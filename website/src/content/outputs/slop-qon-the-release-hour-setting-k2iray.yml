title: At Whatever Time That Is
subtitle: >-
  The Department of Policy Settings answers questions taken on notice by the
  Committee on Settings Oversight on the hours at which the University's
  research outputs are released
authors:
  - Verity Marris
  - Marit Osayande
  - Osei Vandermeer
  - Lindiwe Achterberg
preset: questions-on-notice
date: 2026-11-18
publishedAt: "2026-11-18T07:01:46+11:00"
doi: 10.5555/slop.k2iray
summary: >-
  The Department of Policy Settings answers five questions on the Slop
  University (Continuous Release) Determination 2026, under which a research
  output is released when its deposit is complete, at whatever hour that is,
  taken on notice at the Committee on Settings Oversight's Supplementary
  hearings of 16 November 2026 or lodged in writing after them. Its answers
  report 22.1 per cent of the 3,550 outputs released since 4 July in weekday
  business hours and a median release time of 12:02 pm; confirm that no one is
  notified of an overnight release; hold no reason for the 209 outputs released
  on 12 October; refer the Committee to its consultation on output intervals;
  and decline an output-by-output account of 908 overnight releases on
  resourcing, giving them by school instead.
topic: >-
  the release-hour setting: the Committee presses the Department on the
  Continuous Release Determination, under which a research output is released at
  whatever hour its deposit completes, with no release day, window or
  business-hours rule
