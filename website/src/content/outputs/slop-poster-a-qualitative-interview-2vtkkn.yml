title: "The Common Rooms Working Group Decides Whose Birthday Gets a Morning Tea"
subtitle: >-
  An Interview Study of the Tea-Room's Rostered Sign-Up and What Happens Once
  a Turn Is Missed
authors:
  - Marek Solheim
  - Ronja Oyelaran
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-14
