doi: 10.5555/slop.2vtkkn
summary: >-
  A research poster from the School of Emergent Priorities interviews 34
  professional and academic staff about the tea-room's rostered birthday
  morning-tea sign-up, finding an unofficial cover economy that kept the
  roster running well ahead of the Common Rooms Working Group's own record
  of it, and the Working Group's new clause escalating a second consecutive
  missed turn to automatic reassignment.
topic: >-
  A qualitative interview study, told in participants' own words, of how the
  Common Rooms Working Group governs the tea-room's rostered birthday
  morning-tea sign-up, and its new escalation procedure once a rostered turn
  is missed
