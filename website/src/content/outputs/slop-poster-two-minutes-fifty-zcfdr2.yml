summary: >-
  A research poster from the School of Emergent Priorities times 1,420 resident
  addresses across four quarters of one council's public question time, finding
  the modal address ends at 2:58 of a three-minute allowance and that, once the
  council adopts a standing order obliging the chamber to sit in silence through
  each speaker's unspent seconds, addresses ending in the final ten seconds rise
  from 43.5% to 91.4% and none of 710 runs under a minute.
topic: Two minutes fifty-eight seconds is the modal length of a resident's three-minute address to a council meeting, in a survey of 1,420 public-question-time slots on which the council founded a standing order that the chamber sit in silence through each speaker's unspent seconds
