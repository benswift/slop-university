summary: >-
  A research-showcase brochure that presents the University's work on energy
  efficiency and management through base load, the draw a building keeps up
  once its occupants have gone, and the night audit that walks a quiet
  building to find what is still on and for whom. Four Schools carry the
  agenda, from the energy warden's round and the unplanted glasshouse to
  controller setpoints that outlived their load, anchored by seven published
  University studies cited by title and DOI.
topic: >-
