summary: >-
  A civic brochure from the School of Emergent Priorities presents the
  district's worn and kept clothes as a shared textile culture, in three
  features on the hand-me-down passed between households and clubs, the craft
  of alteration, knitting and uniform fitting, and the washing line as the
  street's most public wardrobe. It rests its showcase on six published studies
  cited by title and DOI.
topic: >-
  handed down, a civic brochure from the School of Emergent Priorities on the
  district's worn and kept clothes --- the school jumper on its third child,
  the hall's costume rail, the good coat let out twice --- and the University's
  researchers who study what a garment carries between the people who wear it
