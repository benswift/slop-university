summary: >-
  A research poster from the School of Continuous Improvement surveys
  residential pest-control technicians on how they classify borderline
  warranty callouts against their own company's ninety-day guarantee,
  finding technician judgement departs furthest from the contract's wording
  exactly where that wording is least defined.
topic: >-
  a survey of residential pest-control technicians on how they privately
  interpret their company's 90-day pest-free guarantee's fine print when
  deciding whether a return callout counts as a covered warranty visit or a
  new paid job
