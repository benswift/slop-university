title: A Name Dated by Its Release
subtitle: >-
  A supplementary submission from the School of Settled Matters to the
  Department of Policy Settings' Review of the Minimum Interval Between a
  Researcher's Outputs
authors:
  - Odalys Penhallow
  - Clemency Tredinnick
preset: submission
school: School of Settled Matters
date: 2026-11-15
publishedAt: "2026-11-15T06:30:47+11:00"
doi: 10.5555/slop.0f3gal
summary: >-
  A supplementary submission from the School of Settled Matters answers six of
  the eleven questions in the Department of Policy Settings' consultation on
  the minimum interval between a researcher's outputs. Observing that the
  International Code of Zoological Nomenclature takes a name's priority from
  the date its work was published, to the day, it asks that the review take in
  the interval's effect on dates used by rules outside the University, that any
  interval be measured between publications, and that, whatever interval is
  set, an output containing a nomenclatural act be released on the day it
  becomes ready.
topic: >-
  a name dated by its release: the School of Settled Matters asks, in a
  supplementary submission, that outputs carrying a nomenclatural act be
  released on the day they become ready under any minimum interval, since the
  zoological code takes a name's priority from the day its work bears
