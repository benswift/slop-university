title: Leave to Export
subtitle: The Dynamic Export Limit as Privilege in a Rooftop-Solar Connection Agreement
authors:
  - Halvard Nnamani
preset: paper
school: School of Emergent Priorities
date: 2026-10-21
publishedAt: "2026-10-21T04:00:57+11:00"
doi: 10.5555/slop.5owvz1
summary: >-
  A jurisprudential note from the School of Emergent Priorities reads a regional
  distributor's flexible-export connection agreement for rooftop solar, and the
  fixed-limit form it replaced, through Hohfeld's eight fundamental legal
  conceptions. It argues that the household holds a privilege to export and no
  claim-right that its exports be received, that the distributor's signal is a
  power to which the household stands in liability, and that the upgrade from
  the fixed form exchanges the household's immunity during a twenty-day notice
  period for a doubled ceiling, leaving a recital of support for renewable
  generation that does no legal work.
topic: >-
  a Hohfeldian reading of the dynamic export limit: what a rooftop-solar
  household holds, a right or a privilege, when its connection agreement lets
  the network operator curtail its exports to zero
