summary: >-
  A marketing poster for the School of Underlying Conditions invites the public
  to its spring Open Day in the soil laboratory, where a bench of beakers runs
  from pale gold to black and each visitor's own garden soil is taken through
  to its humic fraction. Prepared for the landscape signage panels in matched
  daylight and evening renderings, with a short reading list from the School's
  published record.
