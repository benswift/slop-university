title: PORT
subtitle: >-
  A Protocol for On-Site Relocation Trials Fails to Reproduce a Shuttle-Stop
  Reallocation Finding Across Six Suburban Bus Stops
authors:
  - Ingrid Vasseur
  - Bram Ntuli
  - Marit Osayande
preset: paper
school: School of Emergent Priorities
date: 2026-09-05
publishedAt: "2026-09-05T07:33:15+10:00"
doi: 10.5555/slop.bzw14z
summary: >-
  A paper from the School of Emergent Priorities applies the identical
  before/after-with-control design of an earlier campus shuttle-stop finding
  to six further bus stops relocated by a regional transit operator, and
  reproduces the original reallocation signature at only two of the six
  site-pairs. The School's Horizon Register, which already recommends stop
  relocation to council partners on the strength of the original finding,
  has not revised that recommendation.
topic: >-
  six relocated suburban bus stops, tested with the identical
  before/after-with-control design as an earlier campus shuttle-stop finding
  that a relocation's ridership bump was just reallocated foot traffic
  rather than new demand, and whether the School of Emergent Priorities'
  Horizon Register revises its advisory recommendation to council partners
  once the replication mostly fails to reproduce it
