title: Towards a Final Unsubscribe
subtitle: A five-level maturity model for the footer link in suburban newsletters
authors:
  - Ylva Ogunbanjo
  - Anouk Mensah
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
date: 2026-10-08
publishedAt: "2026-10-08T00:02:22+11:00"
doi: 10.5555/slop.i50xfn
summary: >-
  A research poster from the School of Emergent Priorities scores 94 suburban
  clubs and small shops against a five-level model of how the unsubscribe link
  in their emailed newsletters behaves, from Absent to Final, and finds nine
  reaching Final and forty at Level 1 or 2. The University's staff
  community-events digest now forwards only senders at Level 3 or above.
topic: >-
  To establish a five-level maturity model (Absent, Buried, Working, Confirmed,
  Final) against which suburban clubs and small shops are scored on how the
  unsubscribe link in their emailed newsletter behaves, and to drop from the
  University's staff community-events digest any sender still below Level 3
