title: Towards a Sealed Tiebreak
subtitle: >-
  How the Strategic Plan 2026-2031 Settles a Tied Allocation by the Nearest Guess
authors:
  - Renke Sabel
  - Osei Vandermeer
preset: strategy
school: School of Continuous Improvement
date: 2026-09-21
publishedAt: "2026-09-21T01:01:12+10:00"
doi: 10.5555/slop.t8wq4n
summary: >-
  Slop University's Strategic Plan 2026-2031 introduces the Tiebreak Quadrant,
  a four-cell framework crossing a contestant's standing after the scored
  rounds with the nearness of a sealed guess, and binds every contested
  allocation of a car bay, room or bench to a figure lodged in advance and the
  nearest guess, with no override. Each cell is entered against the applicant
  on a public Guess Register, and every University-hosted trophy is engraved
  with a cell in place of a score.
topic: >-
  Although the club quiz-night rounds are scored to the half point, the trophy
  goes on the tiebreaker: a plan to sort every team into a four-cell quadrant of
  knowing and guessing, and to settle contested allocations by sealed nearest
  guess
