title: Fifteen Minutes, As Instructed
subtitle: >-
  A Survey of How Parents Complete a Primary-School Reading Log Against the
  Fortnightly Minutes Target That Set the Number
authors:
  - Runa Adegoke
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-07-26
doi: 10.5555/slop.2xup4k
summary: >-
  A paper from the School of Emergent Priorities surveys 236 parents and
  guardians across nine primary schools on how they complete a fortnightly
  home-reading log, finding logged minutes heap sharply at each school's own
  printed target and that agreement between a night's logged entry and the
  same parent's later recall of whether reading occurred falls away as
  self-reported completion method moves from timed to backfilled.
topic: >-
  surveying parents about how they actually complete their child's
  primary-school home reading log against the school's fortnightly
  reading-minutes target, and whether what gets signed each night tracks the
  target more closely than it tracks any reading that happened
pages: 5
version: "1.0"
