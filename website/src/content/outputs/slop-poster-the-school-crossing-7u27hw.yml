title: Below the Line, and Further Below
subtitle:
  Counted Child Pedestrians at 39 School Crossings Before and After a
  Supervision Warrant Is Withdrawn
authors:
  - Dagny Okafor
  - Osei Vandermeer
  - Bram Ntuli
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-05
publishedAt: 2026-08-05T07:01:39+10:00
doi: 10.5555/slop.7u27hw
summary: >-
  A research poster from the School of Continuous Improvement observes 39
  supervised school crossings in one metropolitan area either side of a
  mid-year warrant decision, with one three-hour afternoon count at each
  crossing before the decision and another ten weeks after: 19 crossings lost
  their supervisor at the recount and 20 matched crossings kept theirs. Counted
  children fall 26.2 per cent at the withdrawn crossings against 1.8 per cent
  at the retained ones (difference-in-differences -24.4 points, 95% CI -31.2 to
  -17.6), enrolments hold, and kerbside drop-off movements in the same window
  rise by a mean 31 vehicles per school. On a fresh recount 16 of the 19 sit
  further below the threshold they were withdrawn under, so reinstatement is
  unreachable under the scheme's own rule.
topic: >-
  the school crossing supervisor's hand-held stop sign at a suburban corner,
  kept or withdrawn on a warrant count of children crossing taken over three
  hours on one weekday --- what an independent recount finds across 39
  crossings, 19 of them stripped of supervision, and how a measure that falls
  once the thing it justifies is removed ends up confirming its own withdrawal
