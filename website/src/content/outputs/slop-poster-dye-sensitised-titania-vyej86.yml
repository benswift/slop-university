doi: 10.5555/slop.vyej86
summary: >-
  A research poster from the School of Underlying Conditions reports a
  fourteen-month field trial of eighteen dye-sensitised titania mini-modules
  powering water-level loggers at nine monitoring bores in one inland
  district, each bore carrying one module behind plain cover glass and one
  behind glass with a photocatalytic titania coating. Coated modules led at
  eight of the nine bores in the final dry-season quarter, by most on
  unsealed road verges, yet the worst plain module still delivered 1.5 times
  the logger's daily budget and no reading was lost for want of power.
topic: >-
  dye-sensitised titania mini-modules with a photocatalytic self-cleaning
  cover glass, trialled for fourteen months as the power supply for
  water-level loggers on nine monitoring bores
