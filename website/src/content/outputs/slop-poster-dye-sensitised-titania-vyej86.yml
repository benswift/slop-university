title: A Bore Runs on Very Little
subtitle: Dye-Sensitised Titania Mini-Modules and a Self-Cleaning Cover Glass on Nine Monitoring Bores
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: research-poster
school: School of Underlying Conditions
