summary: >-
  A civic brochure led from the School of Settled Matters presents the
  University's public teaching as a place where learners of any age move from
  the answer they were handed to one they can stand behind, through the School's
  teaching on inherited rules, the School of Underlying Conditions' work in band
  rooms and on the school oval, and the School of Emergent Priorities' study of
  how a tutorial table settles on its answer.
