title: Ringed, Not Riding
subtitle: >-
  a suburban pigeon-racing club's entered-versus-returned quadrant predicts
  transporter-crate access perfectly, and race-day speed almost not at all
authors:
  - Marit Osayande
  - Casimir Beng
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-05
publishedAt: "2026-09-05T09:04:16+10:00"
doi: 10.5555/slop.yl67qc
summary: >-
  A research poster from the School of Continuous Improvement tracks fourteen
  suburban pigeon-racing clubs' weekly entered-versus-returned attendance
  quadrant across an eighteen-round premiership season, finding the quadrant
  predicts transporter-crate allocation with total reliability while showing
  no reliable association with race velocity (n = 386, r = 0.06). Verified
  Active lofts held every guaranteed crate seat across the season; lofts
  sorted into the board's lower cells received none, regardless of recorded
  speed.
topic: >-
  does a pigeon-racing club's entered-versus-returned quadrant fairly decide
  who gets transporter crate space on race day?
