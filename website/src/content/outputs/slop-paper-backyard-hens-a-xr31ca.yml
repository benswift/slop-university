title: How Many Kinds of Backyard Hen-Keeping Does a Shire Recognise?
authors:
  - Petra Umbile
  - Verity Marris
  - Marek Solheim
preset: paper
school: School of Emergent Priorities
date: 2026-09-03
publishedAt: "2026-09-03T03:03:02+10:00"
doi: 10.5555/slop.xr31ca
summary: >-
  A paper from the School of Emergent Priorities validates a four-tier
  compliance taxonomy for backyard hen-keeping against 412 shire-enrolled
  properties, finding substantial inter-rater reliability and an ablation in
  which the taxonomy's most punitively treated criterion, rooster presence,
  contributes least to its discriminative power. The same taxonomy
  determines eligibility for a shire's bundled Backyard Sustainability
  Rebate, and properties reclassified into its top two tiers lose the
  rebate's water-tank, compost, and solar components alongside the hens.
topic: >-
  Backyard hens: a four-tier keeping-compliance taxonomy in a shire's
  Keeping of Animals local law, gating the shire's bundled Backyard
  Sustainability Rebate (hens, water tank, compost, solar together) --- any
  property reclassified into the top two tiers, including for an unplanned
  rooster, loses the whole bundled rebate for the rest of the rate year with
  no interim reassessment
