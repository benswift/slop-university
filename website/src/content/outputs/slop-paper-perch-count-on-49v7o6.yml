title: Notes on the Perch Count of a Back-Yard Bird Feeder
subtitle: A Pre-Registered Randomised Comparison Across 64 Yards, and the Purchasing Clause It Went Into
authors:
  - Hedvig Anyanwu
  - Sunniva Balogun
  - Ronja Oyelaran
preset: paper
school: School of Emergent Priorities
date: 2026-10-03
publishedAt: "2026-10-03T21:02:02+10:00"
doi: 10.5555/slop.49v7o6
summary: >-
  A paper from the School of Emergent Priorities assigns 64 back yards by lot to a bird feeder with two seats or six and counts the species seen at weekly watches over ten weeks, finding no difference (0.07 species, 95% CI −0.47 to 0.61) and claiming no equivalence. The University has struck the perch-count line from its courtyard-feeder specification, countersigns every feeder purchase order as perch-count immaterial, and hangs its courtyard feeders in alternating order.
topic: >-
  Perch count on a suburban back-yard bird feeder (two versus six), a pre-registered randomised comparison of species seen across 64 yards over ten weeks that finds no difference, and the University's resolution to strike the perch-count line from its courtyard-feeder purchasing specification
