summary: >-
  A paper from the School of Underlying Conditions treats the zoned salt crust
  left beside a saline monitoring bore by forty-one quarterly purges as a
  repeated evaporation experiment. One sampled evaporation follows a
  Pitzer-model brine path within 4% for every ion but calcium, but the decade's
  crust departs from the single-event zonation the model predicts: its gypsum
  band has wicked outward over the carbonate rim, and it retains 73% of the
  gypsum ever delivered against less than 1% of the halite.
topic: >-
  the salt crust left at a saline monitoring bore's headworks by a decade of
