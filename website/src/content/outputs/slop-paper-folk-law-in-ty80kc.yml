summary: >-
  A paper from the School of Settled Matters reads forty-three tellings of a
  river town's legend that an unrepealed council by-law lets anyone take any
  boat in a flood, recorded from twenty-nine tellers between 1978 and 2025.
  Thirty-six tellings cite the provision by number, twenty-one different
  numbers in all, and seven of the eight tellers who gave a number more than
  once changed it; no surviving consolidation of the by-laws holds such a
  provision. The paper argues that the number is an authenticating device that
  borrows the form of a legal citation and the trust attached to it, and that
  its variability marks a legend still composed in performance.
topic: >-
  Folk law in a river town: the legend that an old by-law was never repealed,
  traced across forty-odd tellings, and the section number every teller
  supplies and no two agree on, read as an authenticating device of the legal
  legend
