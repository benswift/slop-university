doi: 10.5555/slop.9dxurq
summary: >-
  A research poster from the School of Continuous Improvement redeploys the
  unmodified five-level Commerce Continuity Maturity Model, originally
  validated against strip-mall food-court traders, on a supermarket
  loyalty-kiosk row and a food-truck strip. The instrument returns its top
  tier for 91% of the 64 operators sampled, against 12% in the original
  validation, and terminal-allocation gating continues on the flattened score.
topic: >-
  A five-level scoring instrument that once separated strip-mall food-court
  traders by continuity practice returns an identical top rating for every
  operator when redeployed on a supermarket loyalty-kiosk row and a
  food-truck strip, and EFTPOS-terminal allocation still follows the
  flattened score
