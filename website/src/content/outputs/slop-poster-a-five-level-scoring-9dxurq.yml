title: Optimised, Not Different
subtitle: A failed replication of the Commerce Continuity Maturity Model in retail settings
authors:
  - Dagny Okafor
  - Joost Nwosu
  - Renke Sabel
preset: research-poster
school: School of Continuous Improvement
