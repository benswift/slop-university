title: Out of Office, Indefinitely
subtitle: Interviewing Staff on Why an Auto-Reply Outlives the Trip It Announced
authors:
  - Verity Marris
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-27
doi: 10.5555/slop.0tynio
summary: >-
  A research poster from the School of Emergent Priorities interviews 156
  staff across nine organisations once their out-of-office auto-reply has
  run at least three days past its own stated return date, coding
  unprompted reasons into a five-category taxonomy and checking each
  account against the reply-log timestamp behind it. The category a
  respondent offers predicts the overrun already banked rather than the
  overrun still to come: ownership-unclear replies carry a median 61 days
  past their stated date at interview, more than triple the deliberate-buffer
  group's median 17 days.
topic: >-
  interviewing office workers about why an out-of-office auto-reply outlives
  the trip it announced, and building a taxonomy of the reasons nobody
  circles back to switch it off
