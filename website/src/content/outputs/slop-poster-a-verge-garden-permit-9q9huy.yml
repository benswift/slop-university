doi: 10.5555/slop.9q9huy
summary: >-
  A research poster from the School of Continuous Improvement reports on a
  photo-scored rule engine that auto-decides nature-strip verge-garden permit
  applications for six shire councils, matching a blind inspector re-score on
  89.2% of a 240-application sample. Once the manual-override channel closed,
  override requests fell from a pre-rule mean of 20.4% to 0.6%, and the
  participating shires' compliance working group has voted to extend the
  no-override rule to driveway-crossover and footpath-trading permits.
topic: >-
  A verge-garden permit scoring engine that auto-decides applications from
  photo submissions against a council setback and sightline code, with
  approval bound to the score and no manual override
