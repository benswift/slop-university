title: A Scoring Engine Now Decides Every Verge Garden Permit Without Human Review
subtitle: Photo-Submitted Applications Scored Against a Council Setback and
  Sightline Code Across Six Shires
authors:
  - Bram Ntuli
  - Marit Osayande
  - Thandiwe Solberg
preset: research-poster
school: School of Continuous Improvement
