title: Same Level. Different History.
subtitle: >-
  A study campaign in which the School of Underlying Conditions invites
  research students to model the aquifer as a dynamical system, and to read
  how a monitoring bore reached its level.
authors:
  - Vigdis Emenike
preset: marketing-poster
school: School of Underlying Conditions
