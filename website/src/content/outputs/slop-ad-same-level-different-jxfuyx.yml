doi: 10.5555/slop.jxfuyx
summary: >-
  A marketing poster from the School of Underlying Conditions shows a student
  kneeling at a monitoring bore on open country, lowering a tape toward a water
  table drawn in cutaway, beneath a long double curve that does not close, and
  invites prospective research students to treat the standing water level as
  the state of a dynamical system whose reading depends on the path that led to
  it.
topic: >-
  same level, different history: a come-study ad for the School of Underlying
  Conditions on reading groundwater as a dynamical system with hysteresis,
  where a bore's reading depends on the path the water took to reach it
