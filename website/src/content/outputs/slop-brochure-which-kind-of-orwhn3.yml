summary: >-
  A prospectus from the School of Continuous Improvement sorts the squares of an
  online picture-selection puzzle into five kinds and invites prospective
  students to be assessed on the tile rather than the bus. The University's own
  select-all-that-apply forms are marked to the same rulings, with a mistaken
  tick voiding the application for that teaching period.
topic: >-
  Which kind of square is it, when the CAPTCHA asks you to select every square
  with a bus? A taxonomy sorts the ambiguous tiles into kinds, and only one kind
  is ever marked correct, so a University that must clear the test adopts the
  kind's rulings as its own
