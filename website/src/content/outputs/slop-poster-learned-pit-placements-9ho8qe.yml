doi: 10.5555/slop.9ho8qe
summary: >-
  A research poster from the School of Underlying Conditions trains a
  graph-network acquisition policy by reinforcement learning to place 150 soil
  pits for boundary mapping, and characterises the resulting point patterns by
  their number variance against Poisson, perturbed-lattice and determinantal
  designs and 612 pits from the survey's archived field sheets. The learned
  pits are near-hyperuniform inside map units but crowd within 40 metres of
  mapped boundaries, the same signature the surveyors' pits show, and ragged
  units draw the most excess pits.
topic: >-
  learned pit placements and number variance: whether an active-learning soil
  survey designs a hyperuniform point pattern, or digs where the surveyor
  always dug
