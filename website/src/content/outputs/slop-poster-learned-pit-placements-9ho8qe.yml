title: Where the Policy Digs
subtitle: Number variance of soil-pit patterns placed by an active-learning boundary mapper
authors:
  - Brynjar Obiora
  - Bram Ntuli
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-19
