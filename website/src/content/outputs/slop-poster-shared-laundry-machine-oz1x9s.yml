summary: >-
  A research poster from the School of Emergent Priorities instruments 78
  washers across 26 shared apartment laundries with door and cycle-end loggers
  over fourteen weeks, covering 38,441 completed cycles, and separates the
  booking platform's idle-machine figure from the machines a resident can
  actually use. Median claim latency between a cycle ending and the drum being
  emptied is 34 minutes (IQR 11 to 96), and 22.6% of loads remain in the drum
  at two hours. Counting a machine as available only when it is both idle and
  empty brings reported availability of 71.4% down to an effective 48.2%, with
  the shortfall reaching 44 percentage points on Sunday evenings. No machine
  was added anywhere in the portfolio over the study period.
topic: >-
  shared laundry machine availability in apartment blocks: what the booking
  platform counts as a free machine, how long finished loads sit unclaimed in
  the drum, and what the strata committee decides from the availability figure
