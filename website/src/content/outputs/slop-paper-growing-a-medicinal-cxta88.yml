doi: 10.5555/slop.cxta88
summary: >-
  A paper from the School of Underlying Conditions grows 39 plants of one
  clone of a crassulacean medicinal herb for 30 weeks on crushed drill core
  from three intervals of a single cored unconformity, fresh metagabbro, the
  palaeoregolith beneath the contact and the quartz sandstone above it, with
  nitrogen as the only addition. Rhizome mass falls and salidroside
  concentration rises from metagabbro to sandstone along one log–log line,
  so that once size is accounted for the substrate adds no detectable effect
  on concentration, while salidroside per plant is highest on metagabbro and
  lowest on sandstone.
topic: >-
