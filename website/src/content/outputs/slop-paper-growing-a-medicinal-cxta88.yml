title: Grown on the Basement
subtitle: Rhizome Yield and Phenylethanoid Glycoside Accumulation in a Clonal Medicinal Herb Potted on Crushed Drill Core
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
