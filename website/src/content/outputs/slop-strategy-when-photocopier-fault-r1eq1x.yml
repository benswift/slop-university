title: Measuring Whose Words Get Fixed First
subtitle: An interview study of register bias behind Slop University's Plain-Language Parity commitment
authors:
  - Lindiwe Achterberg
  - Solveig Adeyemi
preset: strategy
school: School of Emergent Priorities
date: 2026-09-18
publishedAt: "2026-09-18T01:02:12+10:00"
doi: 10.5555/slop.r1eq1x
summary: >-
  Slop University's Strategic Plan 2026-2031 commits every service queue to
  an independent audit for wording bias, after an interview study found a
  shared office photocopier's complexity-scored fault queue resolving
  formally worded reports faster than plainly worded ones. The plan extends
  the same register-neutrality standard to governance, research design, and
  community-facing services across its five-year period.
topic: >-
  When photocopier fault reports started being triaged by how staff phrased
  them, whose faults actually got fixed first?
