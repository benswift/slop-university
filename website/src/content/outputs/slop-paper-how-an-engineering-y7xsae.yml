title: The Closer Pair
subtitle: How One Shot Came to Stand for Viscosity in an Engineering Faculty's Teaching Films, 1968–2019
authors:
  - Odalys Penhallow
preset: paper
school: School of Settled Matters
date: 2026-11-12
publishedAt: "2026-11-12T12:00:33+11:00"
doi: 10.5555/slop.y7xsae
summary: >-
  A media-archaeological paper from the School of Settled Matters codes the 52
  viscosity demonstrations in one engineering faculty's audiovisual teaching
  collection, 1968 to 2019, and finds that a falling-ball race first filmed in
  1971 came to open the viscosity sequence in sixteen of the seventeen digital
  productions. The remakes copied the film rather than the bench: a backing
  card ruled with a closer pair of lines for a two-set-up shoot survives in 31
  of the 41 items showing the race, long after the shot was filmed in one take.
topic: >-
  how an engineering faculty's teaching films came to settle on one shot for
  showing viscosity, the side-by-side falling-ball race, remade across five
  decades of its audiovisual archive
