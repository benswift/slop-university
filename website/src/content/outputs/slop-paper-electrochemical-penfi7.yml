title: Following the Feed Down
subtitle: Inlet-Referenced Current Control for Nitrate Electroreduction to Ammonia over a Farm Bore's Pumping Cycle
authors:
  - Vigdis Emenike
  - Brynjar Obiora
  - Casimir Beng
preset: paper
school: School of Underlying Conditions
