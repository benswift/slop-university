doi: 10.5555/slop.penfi7
summary: >-
  A paper from the School of Underlying Conditions and the School of
  Continuous Improvement feeds a side stream of one irrigation bore to a
  copper-cathode flow cell over 212 pumping runs, finding that the pumped
  water's nitrate falls by more than half within each run as drawdown shifts
  inflow down the screen. Setting the cell current every ten seconds from an
  inline nitrate sensor raised faradaic efficiency to ammonia from 41.8% to
  63.9% and cut specific energy from 249 to 149 kWh per kilogram of ammonia
  nitrogen against constant current, recovering 27% less ammonia per run; a
  schedule fitted to the median run did worse on both counts.
topic: >-
  electrochemical nitrate-to-ammonia recovery fed from a farm bore, where nitrate in the pumped stream falls through each pumping cycle as drawdown reaches deeper water, and how the cathode current should follow it
