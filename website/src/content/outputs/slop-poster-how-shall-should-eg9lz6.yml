doi: 10.5555/slop.eg9lz6
summary: >-
  A research poster from the School of Settled Matters annotates 318 modal rule
  sentences in one district energy hub's operating rulebook and aligns each with
  the hub's dispatch optimisation model. Shall, must and shall not become hard
  constraints in 91% of cases, deontic should is divided between hard
  constraints, penalty terms and omission, and 42 of 44 permissions written with
  may leave no trace in the model, including nine that relaxed a prohibition the
  model keeps in full.
topic: >-
  how shall, should and may in a district energy hub's operating rulebook become
  hard constraints, penalty terms or nothing when the rules are transcribed into
  its dispatch optimisation model
