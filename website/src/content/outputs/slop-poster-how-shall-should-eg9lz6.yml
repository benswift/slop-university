title: Should, Three Ways
subtitle: Modal verbs in a district energy hub's rulebook, as its dispatch model encodes them
authors:
  - Anselm Threlkeld
  - Bram Ntuli
  - Anouk Mensah
preset: research-poster
school: School of Settled Matters
