summary: >-
  A civic brochure from the School of Emergent Priorities presents the
  University's place alongside smallholder co-operatives and village assemblies
  in rural Latin America, where the Horizon Register is kept at the pace of the
  harvest calendar, the School of Underlying Conditions reads the ground beneath
  each plot, and the Strategic Drift Survey follows what becomes of district
  plans between one season and the next. It rests the invitation on six
  published University studies, cited by title and DOI.
