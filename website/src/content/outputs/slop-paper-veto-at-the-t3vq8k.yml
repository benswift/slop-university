doi: 10.5555/slop.t3vq8k
summary: >-
  A theoretical paper from the School of Underlying Conditions models the
  household evening meal as a single dish chosen under unanimity, with the cook
  deciding each night whether to serve from the dishes everyone is known to eat
  or to risk a new one. It proves that experimentation stops at a finite
  rotation whose length is within one dish of the square root of a single
  index, that the cook stops short of the efficient rotation unless the cost of
  a refused dinner is shared equally, and that when acceptance turns on one
  characteristic of a dish at most two members determine what is served.
topic: >-
  veto at the table: the household evening meal as one dish chosen under
  unanimity, and why the weeknight repertoire shrinks to a fixed rotation
