title: Funding the Runner-Up Cuts Complaints, Not Shortages
subtitle: >-
  A single-floor case study of a stationery cupboard's top-up fund, in
  case-method register with a teaching note on incentive design
authors:
  - Ingeborg Nwachukwu
  - Renke Sabel
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-09-18
publishedAt: "2026-09-18T15:01:11+10:00"
doi: 10.5555/slop.iqf6k6
summary: >-
  A paper from the School of Continuous Improvement reassigns a shared
  stationery cupboard's discretionary top-up fund from the loudest-complaining
  team to its runner-up on an urgency-adjusted score, tracking one floor across
  a full term. Logged complaints fall sharply while an independent shelf audit
  finds the underlying shortage rate unchanged, and the University adopts the
  allocation rule campus-wide on the strength of the single case.
topic: >-
  The stationery cupboard's discretionary top-up fund moves from the
  loudest-complaint team to the runner-up team, and a single-floor case study
  tracks resupply timing and complaint volume for a teaching note on
  incentive design in shared-resource governance.
