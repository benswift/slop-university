summary: >-
  A research poster from the School of Settled Matters fits a draft tube around
  the graphite anode of a bench LiCl–KCl cobalt electrowinning cell so that the
  chlorine it evolves drives a gas-lift loop through the melt. Across 27 runs on
  a six-segment cathode, a vented tube cuts the bottom-to-top deposit ratio
  from 2.10 to 1.25 while raising current efficiency from 90.4% to 92.0%; a
  submerged outlet evens the deposit almost as well but carries chlorine to the
  cathode and drops efficiency to 81.7%.
topic: >-
  draft-tube gas lift from the chlorine evolved at the graphite anode of a bench
  molten-chloride cobalt electrowinning cell, circulating the LiCl–KCl bath
  without a stirrer and evening deposit thickness down the cathode
