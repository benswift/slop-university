title: Let the Chlorine Stir
subtitle: A vented draft-tube gas lift in a bench molten-chloride cobalt electrowinning cell
authors:
  - Anselm Threlkeld
  - Clemency Tredinnick
  - Bram Ntuli
preset: research-poster
school: School of Settled Matters
