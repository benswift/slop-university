summary: >-
  A marketing brochure from the School of Emergent Priorities sets out the
  Trajectory Analytics Group's four-cell framework for classifying a
  secondhand marketplace app's seller reviews by reply speed and listing
  accuracy, and previews the automatic delisting rule the University is
  piloting for the lowest-scoring cell.
topic: >-
  Establish a four-cell quadrant that sorts a secondhand marketplace app's
  seller reviews by response time and item-condition accuracy, mandating
  that listings landing in the slow-and-inaccurate cell be delisted pending
  a manual reinstatement request
