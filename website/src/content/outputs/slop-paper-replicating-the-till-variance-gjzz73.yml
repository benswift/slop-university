title: Towards a Portable Responsiveness Index for Community Digital Infrastructure
subtitle: >-
  A failed replication of the Till-Variance Index's capture effect across a
  group chat, a neighbourhood forum, a booking app, and a review-score
  marketplace
authors:
  - Bram Ntuli
  - Casimir Beng
  - Renke Sabel
preset: paper
school: School of Continuous Improvement
date: 2026-09-15
publishedAt: "2026-09-15T11:09:22+10:00"
doi: 10.5555/slop.gjzz73
summary: >-
  A paper from the School of Continuous Improvement builds a Responsiveness
  Index intended to travel across a street group chat, a neighbourhood
  forum, a booking app, and a review-score marketplace, then pre-registers a
  replication of the University's own till-variance capture effect in these
  four digital settings. Across 58 platforms and 214 volunteer moderators
  and hosts, announcing the index in advance produces no detectable change
  in reply latency in any setting, and the School proceeds toward a staged
  mandate of the index regardless.
topic: >-
  replicating the till-variance capture effect in a neighbourhood booking
  app's dispute-resolution group chat via a portable responsiveness index
  built from reply-latency and review-score logs
