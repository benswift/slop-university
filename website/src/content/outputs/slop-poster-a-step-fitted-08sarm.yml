summary: >-
  A research poster from the School of Underlying Conditions fits a single
  step to soil boundaries that grade across a transition zone, and finds that
  the step model's confidence interval narrows faster than its estimate
  settles. Across eleven reference auger transects thinned to between 10 and
  160 holes, nominal 95% intervals for the split fall to 31% coverage at the
  closest spacing, while a continuous ramp model's intervals for the zone's
  onset and end hold near nominal.
topic: >-
  A step fitted to a ramp: change-point confidence intervals for gradational
  soil boundaries on auger transects lose coverage as the holes close up
