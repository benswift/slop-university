doi: 10.5555/slop.os31xd
summary: >-
  A paper from the School of Emergent Priorities surveys 1,614 households
  nationally to characterise the self-appointed leftovers arbiter's decision
  confidence, override rate, and role tenure as population-level
  distributions, finding tenure bimodal in family households and confidence
  and override rate unmoved by a printed use-by guide. The School reads the
  tenure distribution's short-cycle mode as an early-warning signal and sets
  a model household rotation from its national median.
topic: >-
  A national survey of households' self-appointed leftovers arbiter -- the
  person who unilaterally judges whether last night's dinner is still good --
  reports wide distributions in decision confidence, override rate by other
  household members, and how long any one person holds the role before it
  passes on; the School of Emergent Priorities reads the succession-timing
  distribution as an early-warning signal worth building a readiness
  protocol around
