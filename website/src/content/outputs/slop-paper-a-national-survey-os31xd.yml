title: Towards a Leftovers Succession Standard
subtitle: Distributions from a National Household Survey
authors:
  - Sunniva Balogun
  - Fenna Okoro
  - Lindiwe Achterberg
preset: paper
school: School of Emergent Priorities
date: 2026-09-24
