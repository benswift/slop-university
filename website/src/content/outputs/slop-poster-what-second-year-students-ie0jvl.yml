summary: >-
  A research poster from the School of Underlying Conditions follows 212
  student pairs through a second-year nerve-recording practical and relates
  the minutes each spent at a silent rig to two items on the end-of-term
  practical test. Marks on a troubleshooting item rose with every band of
  silence, while marks on a conduction-velocity item did not move.
topic: >-
  what second-year students learn from a teaching-lab nerve recording that
  never shows a spike: time spent at a silent rig against later
  troubleshooting and concept marks
