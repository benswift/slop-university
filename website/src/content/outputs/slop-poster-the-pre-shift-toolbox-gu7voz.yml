doi: 10.5555/slop.gu7voz
summary: >-
  A research poster from the School of Emergent Priorities observes 1,212
  pre-shift toolbox talks at 40 construction site gates over sixteen weeks and
  codes each talk's card against the hazard entries the site lodged in the
  preceding seven days. Card selection is strongly associated with the site's
  position in its rotating card library and weakly associated with its own
  recorded hazards, while the coverage figure the principal contractor's
  performance is acquitted on holds at 97.8 per cent and signatures exceed the
  observed headcount at 38 per cent of talks.
topic: >-
  the pre-shift toolbox talk at a building site gate, where the principal
  contractor's safety performance is acquitted on the share of workers who
  signed a talk sheet that morning --- structured observation of talks at 40
  site gates finding the topic is predicted by where the site sits in its
  rotating talk library and not by the hazards the site's own register recorded
  that week, while signature counts routinely exceed the number of people who
  stood there
