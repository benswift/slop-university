title: On Rotation, Not on Risk
subtitle: >-
  Structured Observation of 1,212 Toolbox Talks at 40 Sites, Matched to Each
  Site's Own Hazard Register
authors:
  - Runa Adegoke
  - Anneke Tolan
  - Ingrid Vasseur
preset: research-poster
school: School of Emergent Priorities
