summary: >-
  A marketing poster for the School of Emergent Priorities advertises a
  second, forty-car-park SLOT rollout that fails to reproduce Continuous
  Improvement's original closure-time drop, and turns the non-replication
  itself into evidence of the University's own record of checking its work.
topic: >-
  Forty additional car parks running Continuous Improvement's
  sensor-and-bonus scheme return none of the original ten-car-park
  deployment's closure-time drop, and Emergent Priorities counts the
  non-replication itself toward the University's own transparency record
  rather than closing the pilot out.
