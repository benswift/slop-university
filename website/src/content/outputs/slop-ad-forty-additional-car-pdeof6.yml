title: The Closure-Time Drop Didn't Happen Twice
subtitle: >-
  A ranking-brag marketing poster for the School of Emergent Priorities,
  built around a second SLOT rollout that failed to reproduce Continuous
  Improvement's original car-park closure-time drop.
authors:
  - Lindiwe Achterberg
