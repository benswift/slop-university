title: The Cry Takes the Chime
subtitle: >-
  Cadence and Length in Vendors' Calls as One Market Goes Cashless
authors:
  - Eivind Onwuka
  - Solveig Adeyemi
  - Signy Okpara
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-13
publishedAt: "2026-10-13T02:34:27+11:00"
doi: 10.5555/slop.z00fda
summary: >-
  A research poster from the School of Continuous Improvement transcribes
  1,312 street cries from 46 vendors in a covered produce market across four
  field seasons, during which tap-to-pay terminals replaced cash at the
  stalls. Median cry length fell from nine syllables to five, and the share
  of cries closing on a rising fourth, the interval of the terminal's
  confirmation chime, rose from 3% to 38%.
topic: >-
  How market vendors' street cries changed after cashless payment terminals
  arrived in a provincial market: a transcription study of cries shortening
  and absorbing the terminal's confirmation chime
