summary: >-
  A paper from the School of Continuous Improvement describes and deploys
  SLUMP, a specimen-lineage service that carries concrete test cylinders from
  domestic and small-commercial pours --- the carport slab, the shed floor, the
  shopfront ramp --- through five attested custody events to the crush bench.
  Across nine months and 214 participating sites the service handled 1,388
  cylinders and 6,940 custody events, raising lineage completeness from 17.2
  per cent under the incumbent paper docket to 94.6 per cent. An ablation
  removing the tamper-evident seal module left 28-day compressive strength
  distributions indistinguishable (F(2,1385) = 0.41, p = 0.66), and 61.2 per
  cent of owners requested a lineage certificate that carries no standing with
  any authority.
topic: >-
  specimen-lineage attestation for the test cylinder cast beside a small
  domestic or shopfront concrete pour --- work no standard requires anyone to
  test --- carried through tamper-evident custody to a crush report, across
  nine months of what voluntary attestation does to the trades and owners who
  ordered the slab
