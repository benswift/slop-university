title: Witnessed, and Otherwise Unchanged
subtitle: >-
  A Controlled Interrupted Time-Series of Six Declaration Classes After One
  Agency Removed Its Witnessing Requirement
authors:
  - Ingrid Vasseur
  - Petra Umbile
  - Marek Solheim
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-08-16
publishedAt: 2026-08-16T01:01:29+10:00
doi: 10.5555/slop.zjm0s2
summary: >-
  A paper from the School of Emergent Priorities follows the six classes of
  statutory declaration handled by one state administrative agency across 72
  months and 1.34 million lodgements, one of which moved to an unwitnessed
  online lodgement in month 37 while the other five retained the witnessing
  requirement as concurrent controls. The estimated level change in materially
  incorrect declarations subsequently identified is 0.14 per 10,000 (95% CI
  -0.61 to 0.89) and the slope change -0.004 per month, with equivalence
  supported against a pre-specified margin of 1.0 per 10,000 and eleven
  alternative specifications spanning 0.24. Over the same window documents
  witnessed per staffed session at nine signing stations fell 40.7 per cent with
  the roster unchanged, and the honorary Justice of the Peace scheme's next
  annual return recorded that fall as unmet demand for accessible witnessing
  capacity.
topic: >-
  the Justice of the Peace's folding table at the back of a suburban shopping
  centre on a Saturday morning --- the rubber stamp, the queue of people holding
  forms and passports --- where a state honorary JP scheme reports its public
  value as documents witnessed and sites staffed, and the agencies requiring a
  witnessed statutory declaration read the stamp as assurance the statement is
  true; a controlled interrupted time-series around the date one agency dropped
  the witnessing requirement finds no change in anything the requirement is
  justified by, while the scheme reads its own fall in documents witnessed as a
  coverage shortfall and opens a recruitment round
