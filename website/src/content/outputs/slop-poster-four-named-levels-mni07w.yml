summary: >-
  A research poster from the School of Continuous Improvement scores
  thirty-eight state-funded park-and-ride sites against the Overflow
  Absorption Model, a four-level maturity instrument, and reports that
  reaching the top level now obliges a same-hour street clearway
  declaration regardless of whether the underlying overflow ever
  obstructed traffic.
topic: >-
  Four named levels of a park-and-ride overflow maturity model, tied to a
  council-mandated street clearway once a car park's overflow tips onto the
  surrounding kerb during school-run hours
