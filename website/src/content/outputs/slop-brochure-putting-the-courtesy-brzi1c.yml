summary: >-
  A prospectus brochure from the Schools of Continuous Improvement and Emergent
  Priorities invites prospective students into the University's program to
  codify the informal courtesies of suburban driving: kerbside observation,
  plain-language drafting, panel review, and formal issue, from the
  wave-through at the narrow street to the grace interval a green light is
  allowed before the first horn. Five published studies and three researcher
  profiles carry the invitation.
topic: >-
  putting the courtesy wave on a formal footing: a campaign for the
  University's program to codify the unwritten courtesies of suburban driving
  --- the wave-through at the narrow street, the thank-you hazard flash, the
  grace interval before anyone honks at a green light --- each drafted,
  panel-reviewed, and issued as ratified guidance
