summary: >-
  A research poster from the School of Continuous Improvement reports a
  stepped-wedge trial of a state liquor licensing authority's shortened
  public-notice period for extended-trading-hours applications, finding no
  change in objection volume or post-approval noise complaints, and the
  Authority's decision to fix the shorter window as its sole statewide
  protocol regardless.
topic: >-
  a state liquor licensing authority shortens the public-notice period for
  extended-trading-hours permit applications from twenty days to ten,
  producing no change in objection volume or post-approval noise-complaint
  counts across licensing districts, and adopts the shorter window as its
  sole permitted statewide protocol regardless
