title: Ten Days' Notice Draws the Same Objections as Twenty
subtitle: A Stepped-Wedge Trial of Extended-Trading-Hours Public-Notice Periods Across Nineteen Licensing Districts
authors:
  - Osei Vandermeer
  - Sten Okwuosa
  - Hedvig Anyanwu
