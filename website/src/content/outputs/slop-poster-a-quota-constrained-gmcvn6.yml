doi: 10.5555/slop.gmcvn6
summary: >-
  A research poster from the School of Emergent Priorities asks 214 adults to
  clear a simulated personal drive of 180 files under a storage quota, with
  deletion either permanent or recoverable for thirty days. Both arms met the
  quota, but with a recovery window the anticipated-need rating at which a file
  was as likely deleted as kept rose from 2.9 to 4.6 on a seven-point scale, the
  shift concentrated in own drafts and photographs, and the trash went on to
  serve 26% of day-7 and 34% of day-21 retrievals.
topic: >-
  a quota-constrained file-clearing experiment on how a thirty-day recovery
  window changes what people choose to delete, and how often the trash becomes
  a second archive
