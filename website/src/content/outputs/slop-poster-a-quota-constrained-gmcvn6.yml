title: Deleted, For Now
subtitle: How a thirty-day recovery window moves the threshold for discarding personal files
authors:
  - Runa Adegoke
  - Hedvig Anyanwu
preset: research-poster
school: School of Emergent Priorities
date: 2026-11-07
