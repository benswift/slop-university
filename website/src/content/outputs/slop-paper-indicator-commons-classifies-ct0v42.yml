summary: >-
  A paper from the School of Continuous Improvement presents SASH, a four-cell
  sash-and-latch classification of school-run handovers at the pickup bay and
  the bus-stop kerb. The Indicator Commons binds pickup-bay eligibility to the
  Door-Still cell, with no ordinary override, and Window-Hot becomes the
  majority, longer stop.
topic: >-
  Indicator Commons classifies every school-run handover at the pickup bay and
  the bus-stop kerb into four named sash-and-latch quadrants and withdraws bay
  eligibility from any household remaining in Door-Still for more than one
  review cycle.
