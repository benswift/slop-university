title: Amortising the Stubby Holder
subtitle: >-
  Cradle-to-grave assessment of 214 giveaway drink sleeves against a nominated
  service life
authors:
  - Marek Solheim
  - Petra Umbile
  - Marit Osayande
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-17
publishedAt: "2026-08-17T23:04:03+10:00"
doi: 10.5555/slop.ni4xcp
summary: >-
  A research poster from the School of Emergent Priorities assesses the branded
  foam drink sleeve given away at trade stands from moulding through to
  disposal, drawing on 214 units recovered from 26 stands and a twelve-month use
  diary kept by 148 recipients. The assessed footprint is 644 g CO2-e per unit,
  of which foam sheet production contributes 60.2 per cent and no other stage
  more than 15; median observed service life is three uses against a median of
  sixty nominated at the point of order, so the per-use intensity reported under
  the University's merchandise rule falls as the nominated life rises.
topic: >-
  A cradle-to-grave life-cycle assessment of the branded neoprene stubby holder
  given away at trade stands, traced from moulding to the third drawer down,
  with Monte Carlo uncertainty on a service life measured in single uses, and
  the merchandise rule written on the strength of it, under which a unit's
  promotional allocation is approved against the projected use count it
  nominates, so the cheapest way to lower emissions per use is to project more
  uses.
