title: Who Agreed the Scale Could Read Two Kilos Light?
subtitle: Twenty-four households on the bathroom-scale offset they keep, and who may say the real figure aloud
authors:
  - Ingeborg Nwachukwu
  - Edda Nwafor
  - Sten Okwuosa
preset: research-poster
school: School of Continuous Improvement
