summary: >-
  A research poster from the School of Continuous Improvement reports
  kitchen-table interviews with 24 households about the bathroom scale they
  keep set two kilos light, records the five names they give the offset and
  who is permitted to say the real figure aloud, and reports the University
  binding every scale on its premises to a posted, annually renewed two-kilo
  offset agreement.
topic: >-
  A bathroom scale that a household has agreed to keep two kilos light, and
  what 24 family members interviewed in their own terms said that offset does
  to who steps on it and what gets said aloud; the University binds every scale
  on its premises to a posted offset agreement
