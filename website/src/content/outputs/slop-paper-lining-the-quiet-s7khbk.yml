doi: 10.5555/slop.s7khbk
summary: >-
  A social history from the School of Settled Matters follows the absorber
  lining of a provincial radio test station's anechoic chamber from its first
  installation in 1957 to its burial at the shire tip in 2004, reading stores
  ledgers, works orders, a staff bulletin, land titles and fourteen interviews.
  It finds that for twenty-three years the foam was cut and dipped by hand in a
  cutting room of local women paid by the piece, and that a 1961 covenant
  forbidding wireless transmission on forty-four neighbouring lots still binds
  them, though the room it protected was relined piece by piece and then
  stripped.
topic: >-
  Lining the quiet room: a social history of the carbon-loaded foam absorbers
  of an invented provincial radio test station, 1957-2004, who cut, repainted
  and finally buried them, and the covenant that kept the neighbouring lots
  quiet for the chamber's sake
