title: Lining the Quiet Room
subtitle: >-
  Carbon-Loaded Foam, Its Cutters, and the Covenant That Kept a Radio Test
  Station's Neighbours Quiet, 1957–2004
authors:
  - Clemency Tredinnick
preset: paper
school: School of Settled Matters
date: 2026-11-13
