summary: >-
  A research poster from the School of Settled Matters trains 41 mice on a
  plus-maze route, shuts its arm, and follows how long each keeps approaching
  the closed panel. Ablating adult-born dentate granule cells from the day of
  closure doubles the median time to lapse, from 8 days to 17, as much as
  ablation begun before training does, placing the release of the old route in
  the cells added after it stopped serving.
topic: >-
  whether adult-born dentate granule cells set how long mice keep returning to
  a maze route after it has been closed off: conditional ablation before and
  after the closure, and the lapse of an abandoned path
