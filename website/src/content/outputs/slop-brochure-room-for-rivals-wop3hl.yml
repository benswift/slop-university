summary: >-
  A case-for-support brochure led by the School of Emergent Priorities invites
  philanthropic and sector partners to sustain the University's research on
  competition, mergers and market concentration, from the Trajectory Analytics
  Group's anticipatory reading of consolidation to fieldwork in periodic
  markets and studies of how rating and tier boundaries reallocate custom
  between rivals. It grounds the appeal in seven published University studies,
  each cited by DOI.
