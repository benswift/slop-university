summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 presents four
  case studies from its work alongside complex-plasma laboratories: checking
  camera clocks and pressure gauges against references, a between-laboratory
  round in which three chambers ran one written plan, an audit of chamber
  logbooks in which close to a quarter of entries read "as before", and
  handover notes written beside departing technicians.
topic: >-
  dusty plasma partnerships: five years of the School working alongside
  complex-plasma laboratories to make dust-acoustic wave experiments
  measurable, repeatable and improvable
