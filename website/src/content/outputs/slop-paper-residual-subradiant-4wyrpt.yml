title: What the Dark Modes Keep
subtitle: Residual Subradiant Population and Memory of the Drive in Disordered Ensembles of Two-Level Emitters
authors:
  - Clemency Tredinnick
  - Vigdis Emenike
preset: paper
school: School of Settled Matters
