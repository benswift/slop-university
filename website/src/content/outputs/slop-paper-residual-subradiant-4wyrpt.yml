summary: >-
  A paper from the School of Settled Matters simulates the excitation that
  Gaussian clouds of 4000 two-level emitters keep after a weak drive is
  switched off, in the scalar coupled-dipole model at resonant optical depths
  from 2 to 20. It finds that the population called subradiant at switch-off
  varies by three orders of magnitude or more with the decay-rate threshold
  chosen to define it, while the late-time lifetime grows from 7.3 to 15.4
  single-emitter lifetimes, and that light emitted late in the decay keeps a
  forward excess along the drive axis that rises with optical depth and
  detuning, reaching an asymmetry of 0.41 at the densest, detuned setting.
topic: >-
  residual subradiant excitation in a disordered cloud of two-level emitters:
  what the dark modes still hold long after the drive is switched off, and how
  much of it remembers the drive
