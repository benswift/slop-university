doi: 10.5555/slop.bvy34t
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the University to building
  and operating TURNS, a booking, ceiling and cutoff instrument for the shared
  streaming account in every enrolled household: each screen booked the day
  before, a fixed four-stream ceiling enforced without override, and every
  session closed at the credit roll of the programme occupying its slot, all
  held in a published nightly ledger and kept by an accredited Household
  Steward.
topic: >-
  Four simultaneous streams is the ceiling on a household's shared streaming
  account, and the University will build TURNS, a nightly viewing rota that
  books each screen a day ahead, refuses the fifth request with no override, and
  ends any session that outlasts its slot at the credit roll
