title: TURNS
subtitle: >-
  Titled-Use Rota for Nightly Streams, a 2026-2031 Strategic Plan That Books
  Every Household Screen a Day Ahead, Declines the Fifth Concurrent Stream, and
  Closes Each Session at the Credit Roll
authors:
  - Casimir Beng
  - Solveig Adeyemi
preset: strategy
school: School of Continuous Improvement
date: 2026-09-19
