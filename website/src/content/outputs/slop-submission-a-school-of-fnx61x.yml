title: Seen Only When It Attends
subtitle: >-
  A submission from the School of Emergent Priorities to the Department of
  Policy Settings' consultation on The Separate-Visit Requirement
authors:
  - Hedvig Anyanwu
  - Fenna Okoro
  - Ronja Oyelaran
preset: submission
school: School of Emergent Priorities
date: 2026-11-20
publishedAt: "2026-11-20T08:01:47+11:00"
doi: 10.5555/slop.fnx61x
summary: >-
  A submission from the School of Emergent Priorities answers five of the seven
  questions in the Department of Policy Settings' consultation on the
  separate-visit requirement. Treating the register of rare-condition
  participant households as a sparse fossil record, which sees a household only
  when it attends and records its departure only as an absence, it applies
  palaeobiology's confidence intervals on the end of a stratigraphic range to
  show that combined visits would leave the register less able to tell a resting
  household from a departed one, and asks that Option 2 proceed only with a
  record of every approach and of each household's own stated standing.
topic: >-
  a School of Emergent Priorities submission on the separate-visit requirement
  arguing that a register of rare-condition households records a withdrawal only
  as an absence, and borrowing palaeobiology's last-appearance and Lazarus-taxon
  methods to say what records the two-year review needs
