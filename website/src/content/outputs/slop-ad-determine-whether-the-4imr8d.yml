title: Retesting the Retirement Interval
subtitle: >-
  A Failed Replication of the University's Clothes-Peg Life-Test Finding on
  One Household's Own Washing Line
authors:
  - Anouk Mensah
  - Renke Sabel
preset: marketing-poster
school: School of Emergent Priorities
date: 2026-09-16
publishedAt: "2026-09-16T16:01:04+10:00"
doi: 10.5555/slop.4imr8d
summary: >-
  An advertisement from the School of Emergent Priorities reports that a
  laboratory-derived clothes-peg retirement figure, adopted as a fixed
  replacement interval on forty-one communal drying courts, did not
  reproduce when the same peg design was tracked on one household's own
  washing line across a full season.
topic: >-
  determine whether the cycles-to-failure figure from the university's
  laboratory clothes-peg weathering test predicts the failure count of pegs
  left on one household's actual washing line for a full season
