title: Who Pays the Hydrogeologist?
subtitle: Expert-fee shifting and settlement in a regional groundwater tribunal
authors:
  - Vigdis Emenike
  - Kwame Lindqvist
  - Brynjar Obiora
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-16
