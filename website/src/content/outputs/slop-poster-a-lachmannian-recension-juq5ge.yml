summary: >-
  A research poster from the School of Settled Matters edits the three-sentence
  comment printed beneath C-reactive protein results at one regional pathology
  network, collating 41 dated report templates from six sites as manuscript
  witnesses and keeping 15 after eliminating copies. The stemma splits into a
  central and a satellite family; the central template lost its middle sentence
  to a field truncation in 2016 while every satellite kept it, and the version
  printed today is the most corrupt of the fifteen.
topic: >-
  A Lachmannian recension of the interpretive comment printed beneath
  C-reactive protein results in a regional pathology archive: twenty years of
  report templates collated as manuscript witnesses, with a stemma of how one
  boilerplate sentence descended, erred and was contaminated
