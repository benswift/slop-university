title: The Smell of a Job Done
subtitle: Vinegar, cure and the proof of labour among rental-bathroom re-sealers
authors:
  - Brynjar Obiora
  - Anneke Tolan
  - Ylva Ogunbanjo
preset: research-poster
school: School of Underlying Conditions
