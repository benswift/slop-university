doi: 10.5555/slop.pxqmfo
summary: >-
  A research poster in cultural anthropology from the School of Underlying
  Conditions reports fourteen months of sensory fieldwork with nine
  independent re-sealers of rental bathrooms, across 412 logged jobs and
  interviews with tenants and property managers. Clients and agents read the
  vinegar smell of fresh acetoxy-cure silicone as evidence that the work was
  done that day, and queried odourless neutral-cure jobs far more often, most
  of all where a bond was pending; four of the nine re-sealers chose their
  sealant partly for whoever would be present at the handover.
topic: >-
  the vinegar smell of acetoxy-cure silicone as proof of labour: a sensory
  ethnography of wet-area re-sealers, tenants and inspecting agents in rental
  bathrooms
