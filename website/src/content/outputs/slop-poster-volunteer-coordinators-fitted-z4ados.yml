title: Can a Flip-Flag Sensor Tell a Rural Bus When to Stop?
subtitle: >-
  Architecture and first season of a magnetic hail kit on 87 request-stop flags
authors:
  - Bram Ntuli
  - Marit Osayande
  - Solveig Adeyemi
preset: research-poster
school: School of Continuous Improvement
