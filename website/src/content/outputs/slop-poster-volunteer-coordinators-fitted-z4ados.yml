doi: 10.5555/slop.z4ados
summary: >-
  A research poster from the School of Continuous Improvement reports the
  build and first field season of a magnetic hail kit that volunteer
  coordinators fitted to 87 rural request-stop flags, so an approaching bus
  now takes its stop warrant from a cab light rather than from the wooden
  flag itself. The kit delivered a cab-light warrant on 94.1 per cent of
  flag-up events before the bus reached the stop (median 11.4 s, n = 6,680),
  and the depot's published missed-stop register now reads from the packet
  log.
topic: >-
