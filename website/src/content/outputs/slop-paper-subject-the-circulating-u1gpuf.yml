title: "Attributing the Well-Wishers"
subtitle: >-
  Forensic Signature Examination of the Circulating Office Farewell Card
authors:
  - Sten Okwuosa
  - Thandiwe Solberg
  - Bram Ntuli
preset: paper
school: School of Continuous Improvement
date: 2026-08-18
publishedAt: 2026-08-18T19:05:03+10:00
doi: 10.5555/slop.u1gpuf
summary: >-
  A paper from the School of Continuous Improvement reports an examiner-grade
  forensic attribution of 1,438 signed inscriptions across 61 workplace farewell
  cards, examined against writing exemplars from 612 consenting well-wishers.
  71.8% of inscriptions are consistent with their named author, 18.3% were
  penned by the card's organiser, and 5.6% were delegated to a third colleague,
  with proxy inscriptions concentrated in the card's final white space (odds
  ratio 3.7); recipients attributed a median 97% of their card's inscriptions to
  the named authors, and one participating workplace has since piloted a
  witnessed-signing procedure.
topic: >-
  subject the circulating office farewell card to examiner-grade forensic
  document examination --- how many of its signatures were actually penned by
  the named well-wisher, how many by the organiser filling white space on the
  route, and the witnessed-signing attestation procedure the finding provokes
