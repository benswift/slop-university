summary: >-
  A research poster from the School of Continuous Improvement formulates a
  teaching workshop's single box furnace as a batch-processing machine with
  asymmetric, sequence-dependent changeovers and sequences twelve teaching
  weeks of booked loads by simulated annealing. The best sequences found cut
  the hours the empty chamber spends changing temperature by a little over
  half and, in eleven weeks of twelve, never raise the setpoint; a one-line
  sort by descending setpoint comes within four per cent of the search but
  returns nine loads late.
topic: >-
  A batch-sequencing study of one shared heat-treatment furnace in a teaching
  metallurgy workshop, in which simulated annealing schedules the real
  annealing loads and the algorithm's cooling schedule is set against the
  furnace's own
