title: Settled Past the Mandate
subtitle: Hysteresis of Competing Metric Definitions in a Mean-Field Potts Model of a Business-Intelligence Estate
authors:
  - Anselm Threlkeld
  - Osei Vandermeer
preset: paper
school: School of Settled Matters
date: 2026-11-12
