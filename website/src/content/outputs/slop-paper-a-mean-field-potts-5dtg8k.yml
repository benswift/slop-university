doi: 10.5555/slop.5dtg8k
summary: >-
  A paper from the School of Settled Matters and the School of Continuous
  Improvement models a business-intelligence estate whose reports compute one
  metric under three competing definitions as a mean-field Potts system, with
  copying between reports as the coupling and a governance mandate as the
  field. Calibrated on a census of 640 reports, the estate sits inside the
  first-order coexistence window, where a mandate above a small coercive field
  switches the estate to the certified definition and its withdrawal leaves
  the definition in place, held for times that grow exponentially with the
  number of reports.
topic: >-
  a mean-field Potts model of competing metric definitions across a
  business-intelligence estate, and why a definition once settled outlasts the
  mandate that settled it
