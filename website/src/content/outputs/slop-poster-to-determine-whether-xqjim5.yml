doi: 10.5555/slop.xqjim5
summary: >-
  A research poster from the School of Emergent Priorities re-runs the
  bakery fallen-tag finding at eleven suburban bushwalking clubs, coding 91
  fallen car-shuffle cards at the track-head. Finder drove in 7.7 per cent
  of events against the bakery's 78.6 per cent, with no club entering the
  pre-registered band. Affiliated walking clubs must now lodge the unaltered
  clipboard as the day's insured-driver register, and returned-card integrity
  at or above 90 per cent qualifies a club for Capability Sprints
  community-placement funding.
topic: >-
  To determine whether a suburban bushwalking club's car-shuffle clipboard
  reproduces the bakery finding that whoever picks up a fallen name-tag
  takes the shift.
