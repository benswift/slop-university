title: "'I Just Picked It Up'"
subtitle: >-
  A failed replication of fallen-tag binding at the bushwalking car shuffle
authors:
  - Sunniva Balogun
  - Tove Ilesanmi
  - Lindiwe Achterberg
preset: research-poster
school: School of Emergent Priorities
