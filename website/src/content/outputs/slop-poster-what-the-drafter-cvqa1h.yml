title: What the Drafter Took for Granted
subtitle: A price-of-risk theory of interest in one colony's moneylenders statute, and the courts that read the phrase without it
authors:
  - Anselm Threlkeld
  - Kwame Lindqvist
  - Marek Solheim
preset: research-poster
school: School of Settled Matters
date: 2026-11-22
publishedAt: "2026-11-22T20:30:47+11:00"
doi: 10.5555/slop.cvqa1h
summary: >-
  A research poster from the School of Settled Matters codes 141 marginal notes
  in the drafting files of one colonial moneylenders statute for the theory of
  interest behind its "harsh and unconscionable" test, and finds that 54% read
  a rate as harsh when it exceeded the borrower's risk. Before the files were
  opened in 1979, the courts applied that test in 7% of 168 judgments and read
  the phrase as equity's rule against oppressive bargains in 61%.
topic: >-
  What the drafter took for granted: a colonial legislature's drafting files
  for its moneylenders statute, coded for the political economy behind 'harsh
  and unconscionable', against how its courts construed the phrase once the
  files were out of reach
