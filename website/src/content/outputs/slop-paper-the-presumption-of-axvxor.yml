summary: >-
  A paper from the School of Settled Matters arranges the 6,812 deposited
  operating records of a ground-mounted solar farm retired after fourteen
  years, traces each of its 214 controller parameters to the event that last
  set it, and finds a recorded reason for only 61 and an untouched factory
  value for 87. In a retrieval study with 16 engineers, readers working from a
  conventional series arrangement supplied a deliberate reason for a factory
  value in 24 of 32 trials, and in 8 of 32 when a parameter-keyed register,
  modelled on the annotated statute, stated affirmatively where no choice was
  on file.
topic: >-
  the presumption of purpose in a retired solar farm's controller records:
  arranging its setting-change files so a later reader can tell a chosen
  parameter from an inherited default
