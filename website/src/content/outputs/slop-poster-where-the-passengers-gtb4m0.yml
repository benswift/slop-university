summary: >-
  A research poster from the School of Emergent Priorities maps where five
  morphospecies of phoretic mite attach on 412 dung beetles trapped in one
  grazed paddock over a single season. On beetles carrying mixed loads the
  morphospecies overlap in attachment site far less than a null model allows,
  each concentrating on one of six body regions, but a morphospecies riding
  alone spreads across most of its host, so the partitioning is treated as a
  property of the load and not of the mite.
topic: >-
