title: The Roster Decided Who Got Called
subtitle: >-
  A Natural Experiment on Whether a Lapsing-Membership Re-engagement Call
  Changes a Public Library Member's Odds of Reactivating
authors:
  - Joost Nwosu
  - Solveig Adeyemi
  - Bram Ntuli
preset: paper
school: School of Continuous Improvement
date: 2026-08-08
publishedAt: "2026-08-08T01:04:03+10:00"
doi: 10.5555/slop.q3r0tp
summary: >-
  A paper from the School of Continuous Improvement exploits uneven
  casual-staff coverage across a nine-branch public library network to test
  whether a re-engagement call changes a flagged member's odds of
  reactivating. Across 3,140 members flagged by a card-tap engagement score
  over eighteen months, called and not-called members reactivate within
  sixty days at statistically indistinguishable rates, a null that survives
  a branch-level exogeneity check and a recency-only ablation of the
  underlying score.
topic: >-
  a public library's card-tap engagement score flagging members whose
  account is lapsing toward inactive status, tested via a natural
  experiment from uneven branch staffing: whether the re-engagement phone
  call the flag is meant to trigger changes a flagged member's odds of
  actually reactivating
