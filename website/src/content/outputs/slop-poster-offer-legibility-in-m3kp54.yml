title: Fewer Edits, More Deals
subtitle: Offer Legibility When Reading a Counter-Offer Spends the Receiver's Deadline
authors:
  - Gunnhild Ekwueme
  - Mirela Hanke
  - Anouk Mensah
preset: research-poster
school: School of Emergent Priorities
date: 2026-11-16
