doi: 10.5555/slop.m3kp54
summary: >-
  A research poster from the School of Emergent Priorities runs 27,648
  simulated bilateral negotiations across 48 synthetic domains in which the
  receiving agent must query its user, at a cost against a shared deadline, for
  every issue value in an incoming offer it has not yet priced. Agents whose
  counter-offers change at most one or two issues keep agreeing as that cost
  rises (87% of sessions at two seconds per query, against 58% for a Conceder),
  though their agreements sit further from the Pareto frontier.
topic: >-
  offer legibility in deadline-bound automated negotiation: when reading an
  incoming offer costs the receiving agent time against the deadline, agents
  that change few issues per counter-offer reach more agreements than agents
  that concede more utility
