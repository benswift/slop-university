summary: >-
  A research poster from the School of Continuous Improvement scores the
  nuptial gift carried by every male netted from 31 dusk swarms of an
  undescribed dance fly over one upland pool, and finds that gift form follows
  the two COI clusters among 193 dissected and barcoded males while their
  epandrial outlines do not. Of cluster I males 83% carried silk-wrapped prey
  and of cluster II males 86% an empty silk balloon, and 72 of 74 pairs taken
  in copula were within-cluster.
topic: >-
  nuptial-gift form (bare prey, silk-wrapped prey, empty silk balloon) carried
  by swarming males separates two cryptic sympatric forms of an undescribed
  dance fly where male genitalia do not
