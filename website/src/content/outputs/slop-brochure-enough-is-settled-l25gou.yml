summary: >-
  A case-for-support brochure led by the School of Settled Matters invites
  donors and partners to back the University's cross-School work on appetite
  and its settlement, in features set at the household table, at a laboratory
  bench where clay takes up an oil, and in the court record where a reading of
  the law comes to rest. It rests its case on seven published studies cited by
  title and DOI, and on the voices of the researchers who carry the work.
topic: >-
