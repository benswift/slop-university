title: Towards Statewide Auto-Escalation
subtitle: A Birthday-Cutoff Discontinuity Study of Senior Smartcard Activation, and
  the Missing Jump a Transport Agency Now Reads as Fraud
authors:
  - Marit Osayande
  - Joost Nwosu
  - Ingeborg Nwachukwu
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-05
publishedAt: "2026-09-05T12:03:15+10:00"
doi: 10.5555/slop.suqesm
summary: >-
  A research poster from the School of Continuous Improvement follows 41,286
  senior smartcards through the days either side of the birthdate that
  activates each cardholder's travel concession. Daily tap-ons rise 2.3-fold
  within three days of the switch and hold across an eighteen-month window,
  with no detectable change in boarding time or interchange pattern; in 6.1
  per cent of cards the jump never appears. The Concession Assurance Office
  is moving to auto-refer any card whose weekly tap curve fails to clear 80
  per cent of the fleet-wide jump to compliance review, with no manual
  exemption.
topic: >-
  a state transport agency's concession office governs senior travel-card
  activation off a registered birthdate cutoff, and adopts the size of the
  smartcard-tap jump at that cutoff as its new fraud-detection signal
