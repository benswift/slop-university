summary: >-
  A paper from the School of Underlying Conditions catalogues one archive box
  from a closed regional memory assessment service: seven successive stimulus
  cards bearing the same abstract figure, six of them photocopies of
  photocopies, and 338 sheets of drawings made after them. Describing the cards
  as a print historian describes the states of a plate, it follows a speck of
  platen dust, a fused pair of strokes and a retoucher's over-generous repair
  from the cards into the copies and into the drawings made from memory.
topic: >-
  An art historian's catalogue of the states of an unsigned figure-copying card
  from a defunct memory assessment service, and of the drawings made after it
  through successive photocopies
