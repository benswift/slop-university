summary: >-
  A marketing poster for Slop University sets an abandoned seismic survey grid
  before the public, its cut lines part closed over and part still bare across a
  semi-arid shrubland, as the hook for a published paper on thirty-one years of
  regrowth. Developed for campus digital signage and bus-stop panels in a
  landscape rotation.
