summary: >-
  A marketing poster for Slop University presents the School of Underlying
  Conditions' groundwater fieldwork through monitored natural attenuation,
  setting a field officer dipping a monitoring bore above a cutaway in which a
  contaminant plume thins through the water-bearing layer among colonies of
  bacteria. It carries the School's standing on its own attenuation index and
  was issued in light and dark renderings for the University's portrait
  screens.
topic: >-
  leaving it to the microbes — the School of Underlying Conditions ranks itself
  first on its own attenuation index, the plume left to its bacteria and read
  down a bore each quarter
