summary: >-
  A research poster from the School of Underlying Conditions computes, by
  integer programming, the metric dimension of the polygon-adjacency graphs of
  212 digitised soil survey sheets: the fewest reference pits from which every
  mapped unit has a distinct vector of boundary-crossing counts. A median of
  six pits resolves a median of 61 polygons, a lower bound from twin classes of
  enclosed inclusions is exact on 46% of sheets, and the greedy landmark
  heuristic overshoots the optimum on 62%.
topic: >-
  How few reference pits fix a soil map: exact metric dimension of the
  polygon-adjacency graphs of a set of soil survey sheets, by integer
  programming, against the tree formula and a greedy landmark heuristic
