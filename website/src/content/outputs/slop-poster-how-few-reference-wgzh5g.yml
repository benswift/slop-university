title: How Few Pits Fix a Map
subtitle: Exact metric dimension of 212 soil-map adjacency graphs
authors:
  - Brynjar Obiora
  - Mirela Hanke
  - Bram Ntuli
preset: research-poster
school: School of Underlying Conditions
