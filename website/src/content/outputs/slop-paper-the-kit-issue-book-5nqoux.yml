summary: >-
  A paper from the School of Emergent Priorities reports a single-site teaching
  case of a junior football club's kit-issue book. Bound at 18:41 as the issue
  order after two households claimed jumper 7, the book sent matching sets home
  with signatures 1--31 and mixed leftovers with 32--38; unmatched households
  missed a mean 6.4 games against 0.6 to 2.1 in the earlier bands. Futures in
  Committee now issues School fieldwork packs, visitor lanyards and workshop
  garments by signature order, with fit recorded and not a criterion.
