title: What the Switching Log Grows
subtitle: Lampenflora Extent and Cumulative Photon Dose under a Retrofitted LED Tour Circuit in a Limestone Show Cave
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
