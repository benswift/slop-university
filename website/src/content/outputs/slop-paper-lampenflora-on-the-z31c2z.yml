doi: 10.5555/slop.z31c2z
summary: >-
  A paper from the School of Underlying Conditions surveys 1,392 quadrats at
  the 58 tour luminaires of a limestone show cave in the eighteen months after
  they were replaced with LEDs, and finds green biofilm better predicted by
  cumulative photon dose, each surface's flux multiplied by its zone's logged
  on-time, than by flux alone. The retrofit cut lamp output, but a controller
  timeout lengthened at commissioning raised daily on-time in every zone, and
  in six of nine zones the rock now receives more light each day than before.
topic: >-
  Lampenflora on the speleothems of a limestone show cave after its tour lighting was retrofitted to LED: green biofilm extent mapped against cumulative photon dose at each lamp's footprint
