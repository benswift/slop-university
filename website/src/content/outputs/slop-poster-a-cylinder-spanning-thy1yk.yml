summary: >-
  A research poster from the School of Underlying Conditions holds a
  spring-mounted cylinder over a levelled sand bed in a recirculating flume at
  nine reduced velocities and tracks its amplitude and the gap beneath it to
  scour equilibrium. At mid-range velocities the cylinder digs a hole roughly
  twice as deep as a rigidly held one and leaves the initial response branch
  for the upper branch once the gap passes about 0.4 diameters, so the branch
  a span settles on depends on the hole it digs.
topic: >-
  a cylinder spanning an erodible sand bed in a flume digs its own scour hole
  as it vibrates, and the deepening gap carries the response from one
  vortex-induced vibration branch to the next
