title: The Gap It Digs
subtitle: Scour-Driven Branch Transitions in the Vortex-Induced Vibration of a Cylinder Spanning an Erodible Bed
authors:
  - Brynjar Obiora
  - Vigdis Emenike
  - Casimir Beng
