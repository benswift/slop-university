title: Conversation of Any Kind
subtitle: >-
  Signing Readers, Silent Floors and the Incident Books of a Regional Library
  Network, 1988–2022
authors:
  - Ragnhild Uzoma
  - Halvard Nnamani
  - Sunniva Balogun
preset: paper
school: School of Underlying Conditions
date: 2026-11-07
publishedAt: "2026-11-07T15:32:18+11:00"
doi: 10.5555/slop.zple4c
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities reads seven editions of a regional library network's conduct
  rules against all 3,412 entries in its silent-floor incident books, and finds
  that signed conversation, rare in the books before a 2004 amendment against
  "conversation of any kind", was recorded 71 times in the eleven years after
  it. A 2015 edition welcoming signed conversation cut such entries sharply,
  but those that remained were written up as distraction, and the deaf readers
  interviewed still talked on the stair landing.
topic: >-
  Whether signing counts as conversation: how a regional library network's
  silent-floor rules, and the incident notes written under them, have treated
  deaf readers who sign to one another
