title: Rethinking the Occupancy Light
subtitle: A failed replication of the desk-flag finding at the open-plan phone booth
authors:
  - Verity Marris
  - Lindiwe Achterberg
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
