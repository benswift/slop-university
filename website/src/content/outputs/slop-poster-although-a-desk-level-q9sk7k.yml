doi: 10.5555/slop.q9sk7k
summary: >-
  A research poster from the School of Emergent Priorities restages an
  earlier desk-level do-not-disturb flag's first-week interruption
  suppression at 38 open-plan phone-booth occupancy lights across eleven
  workplaces. Lit booths match unlit controls in every week (pooled r =
  0.09), and the Flag Utilisation Score, lodged with the Indicator Commons,
  now treats a replacement fabric flag's up-hours as published booth
  utilisation, with no override on the first review cycle.
topic: >-
  Although a desk-level do-not-disturb flag suppressed walk-up interruptions
  in its first week, restaging that design at the open-plan phone-booth
  occupancy light finds no suppression at any week, and every booth light is
  now to be replaced by a fabric flag whose up-hours are the published
  utilisation score
