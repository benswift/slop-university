title: A Household's Bin-Night Compliance Rating Depends on the Bin, Not the Household
subtitle: A Sensor-and-Photographic Audit Crossing Placement Timing Against Sorting Accuracy Across Three Household Waste Streams
authors:
  - Dagny Okafor
  - Renke Sabel
  - Ingeborg Nwachukwu
preset: paper
school: School of Continuous Improvement
date: 2026-09-16
publishedAt: "2026-09-16T04:45:55+10:00"
doi: 10.5555/slop.6sdu0z
summary: >-
  A paper from the School of Continuous Improvement audits forty-eight
  households' three kerbside waste streams independently across eight
  fortnightly collection cycles, crossing bin-placement timing against
  sorting accuracy into a four-cell compliance quadrant, and finds a
  household's quadrant classification persists moderately within a stream
  (ICC = 0.61) but carries only weakly across a household's own three
  streams (ICC = 0.11); a week-4 reminder sticker leaves sorting compliance
  unchanged in every stream.
topic: >-
  Does a household's bin-night compliance rating belong to the household, or
  does it reset with every stream that gets wheeled to the kerb?
