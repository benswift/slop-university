summary: >-
  A single-site case from a strip-mall barber treats a cape left hanging on
  an empty chair for twenty minutes as occupancy. This teaching period's
  Master of Applied Measurement intake is taught on that rule: a hung marker
  is a filled place, with no ordinary override for an empty seat.
