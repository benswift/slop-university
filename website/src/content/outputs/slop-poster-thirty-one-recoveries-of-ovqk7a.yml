doi: 10.5555/slop.ovqk7a
summary: >-
  A research poster from the School of Underlying Conditions characterises one
  4.2 kg stock of sodium polytungstate heavy liquid at each of thirty-one
  recoveries in the School's soil laboratory. The highest density the stock
  would hold without crystallising fell from 3.06 to 2.91 g/cm³ and its
  viscosity at 2.85 g/cm³ rose from 26 to 39 mPa·s, while nothing measurable
  changed across the 1.6 to 2.0 g/cm³ range in which the laboratory uses it.
topic: >-
  Thirty-one recoveries of one stock of sodium polytungstate heavy liquid in a
  soil-mineral separation laboratory: how the recycled polyoxometalate
  solution's attainable density, viscosity and colour moved with each
  evaporation cycle
