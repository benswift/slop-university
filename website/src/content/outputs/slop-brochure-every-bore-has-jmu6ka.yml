summary: >-
  A civic brochure from the School of Underlying Conditions invites the church,
  mosque, chapel and shrine committees that keep a plural district's shared
  bores to bring their bore books and rotas to the School's groundwater
  fieldwork, and to read them beside what the ground keeps of its water. It
  rests the invitation on six published University studies of congregations,
  common wells and the committees that share them, cited by title and DOI.
