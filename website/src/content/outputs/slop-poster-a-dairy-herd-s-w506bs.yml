title: Twice Daily, Down the Race
subtitle: A Dairy Herd's Walk to Milking as a Repeatable Seismic Source for Imaging a Buried Palaeochannel
authors:
  - Sunniva Balogun
  - Vigdis Emenike
preset: research-poster
school: School of Emergent Priorities
