summary: >-
  A research poster from the School of Emergent Priorities records 42 passes of
  a 412-cow dairy herd along its race to milking on a 96-geophone line and
  stacks the footfall into Rayleigh-wave dispersion spanning 5.5 to 31 Hz,
  against 12 to 23 Hz from overnight noise on the same line. The herd-derived
  shear-wave section agrees with a sledgehammer reference to within 6% to 12 m
  and resolves a slow lens beneath chainage 64 to 122 m, which a cored hole
  confirms as a sandy-gravel palaeochannel fill with its base at 8.7 m.
topic: >-
  a dairy herd's twice-daily walk to the milking shed used as a repeatable
  seismic source, its footfall cross-correlated along a geophone line laid
  beside the farm race to image a buried palaeochannel in the regolith beneath
