summary: >-
  A research-showcase brochure led from the School of Underlying Conditions
  gathers the University's work on the ordinary institutions of community life
  into three strands: the volunteer bench and its paperwork, the ground that
  small community structures stand on, and the calls and notices by which a
  library or a council reaches its members. It quotes three researchers,
  profiles three, and rests the showcase on eight published studies cited by
  title and DOI.
topic: >-
