title: KERB
subtitle: Kink Estimation for Retail Bunching at a Strip Mall's Free-Parking Validation Line
authors:
  - Marit Osayande
  - Casimir Beng
  - Osei Vandermeer
preset: paper
school: School of Continuous Improvement
date: 2026-09-13
publishedAt: "2026-09-13T00:02:12+10:00"
doi: 10.5555/slop.650s36
summary: >-
  A paper from the School of Continuous Improvement treats a twenty-two-shopfront
  strip mall's shared free-parking validation threshold as a naturally occurring
  regression-discontinuity cutoff across 41,206 validated exits over sixteen
  weeks, finding that receipts padded to clear the twenty-dollar line are
  followed by a 9.6-percentage-point fall in 30-day return-visit rate. The
  Adaptive Metrics Lab extends the estimator to three campus food vendors as
  KERB, a bunching-elasticity coefficient the University's Facilities division
  has proposed binding next year's loading-zone parking-permit renewal to.
topic: >-
  Padding the basket to clear a strip mall's twenty-dollar free-parking line,
  and the bunching coefficient Slop University proposes binding campus vendor
  permits to.
