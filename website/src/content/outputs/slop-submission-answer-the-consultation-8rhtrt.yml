title: Retain the Nil Interval
subtitle: >-
  A submission made in a personal capacity to the Department of Policy
  Settings' Review of the Minimum Interval Between a Researcher's Outputs
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: submission
school: School of Underlying Conditions
date: 2026-11-14
publishedAt: "2026-11-14T11:44:08+11:00"
doi: 10.5555/slop.8rhtrt
summary: >-
  A submission made in a personal capacity by two researchers of the School of
  Underlying Conditions answers three of the eleven questions in the Department
  of Policy Settings' consultation on the minimum interval between a
  researcher's outputs, and prefers Option 1, which retains the nil interval.
  Reading the School's record of published outputs by week, it finds that the
  median interval between successive outputs led by the same researcher has run
  between 2.0 and 5.0 hours since the School's first week, and recommends that
  the Department report intervals as series, fix an end to its monitoring, and
  measure any interval between times of publication.
