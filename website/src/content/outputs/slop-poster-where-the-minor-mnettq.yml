summary: >-
  A research poster from the School of Continuous Improvement follows 38
  enantioselective results from one asymmetric-catalysis group's archive
  through seven media, from instrument trace to institutional news item. The
  minor enantiomer is stated as its own quantity in every trace but in 11% of
  manuscript tables, and is recoverable in 24% of news items; it survives
  longest in the supporting information.
topic: >-
  Where the minor enantiomer goes: a remediation study following
  enantioselectivity results from chromatogram to graphical abstract through
  one unnamed catalysis group's working archive
