title: The Top Layer of the Chest Freezer
subtitle: Glaze Loss in Village-Made Frozen Catfish Fillets Follows the Lid, Not the Thermostat
authors:
  - Fenna Okoro
  - Ingrid Vasseur
  - Signy Okpara
preset: research-poster
school: School of Emergent Priorities
