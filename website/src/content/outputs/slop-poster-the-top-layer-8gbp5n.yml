doi: 10.5555/slop.8gbp5n
summary: >-
  A research poster from the School of Emergent Priorities stores ice-glazed
  catfish fillets from a fishing village's frozen-food group in four chest
  freezers, crossing set point (−18 or −24 °C) with lid regime, and weighs 576
  fillets over eight weeks. Top-layer glaze is gone by week five in both
  freezers opened for every sale, whatever the set point, while the bottom
  layer keeps more than three-quarters of its glaze in all four.
topic: >-
  the top layer of the chest freezer, a storage study of ice-glazed frozen
  catfish fillets made by a fishing village's women's frozen-food group, where
  fillets near the lid lose their glaze and burn within weeks while those
  packed low keep, and how often the lid opens matters more than the thermostat
