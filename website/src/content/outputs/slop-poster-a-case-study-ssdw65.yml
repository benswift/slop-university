title: Present and Voting
subtitle: >-
  Dormant members, shelf space and the disposal ballot in a core-storage
  cooperative
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: research-poster
school: School of Underlying Conditions
