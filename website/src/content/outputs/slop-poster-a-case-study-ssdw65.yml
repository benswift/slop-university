doi: 10.5555/slop.ssdw65
summary: >-
  A research poster from the School of Underlying Conditions reports a case
  study of a drill-core storage shed owned jointly by forty-six small
  exploration companies on a flat levy and one member, one vote. Reading the
  minutes of nineteen annual general meetings against the shed's bay register,
  it finds that members who no longer drill attend far more reliably than those
  who do, that none of 212 disposal motions named core whose owner was present,
  and that a levy to extend the shed was put four times and lost four times.
topic: >-
  A case study of a member-owned drill-core storage cooperative: how small
  explorers who jointly own a core shed govern its shelf space, and why members
  who no longer drill decide what is thrown out
