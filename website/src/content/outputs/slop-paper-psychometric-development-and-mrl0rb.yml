title: Will They Have Seen It?
subtitle: Development and Validation of the Household Note Worry Scale
authors:
  - Gunnhild Ekwueme
  - Eivind Onwuka
  - Torun Ezeigwe
preset: paper
school: School of Emergent Priorities
