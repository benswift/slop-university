doi: 10.5555/slop.mrl0rb
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement develops a ten-item, two-factor measure of worry about the notes
  adults in shared households leave one another, across 950 respondents and a
  14-day diary of 1,287 notes. Writers higher in Sender Worry were more likely
  to follow a note with a second reminder, and recipients acted on that second
  reminder, not the note, for 71 per cent of the notes that received one.
topic: >-
  psychometric development and validation of a brief self-report scale of
  anticipatory worry about written reminders left between members of a shared
  household
