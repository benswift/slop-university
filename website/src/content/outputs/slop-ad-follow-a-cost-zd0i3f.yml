summary: >-
  A marketing poster for the Capability Sprints line draws a small town as a
  single connected arrangement, a works, houses, a van, a water tower and a
  line of poles joined by one pipe, with a figure walking its length. It
  invites registrations of interest in Deciding Under Measurement as a short
  course in economic and technological systems analysis, on the premise that
  every saving lands somewhere.
