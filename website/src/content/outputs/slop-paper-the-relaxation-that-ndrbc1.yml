title: The Relaxation That Outlasts Its Washout
subtitle: Offset kinetics and reassertion of a bark extract's relaxant effect on
  isolated guinea-pig trachea
authors:
  - Renke Sabel
  - Edda Nwafor
  - Ylva Ogunbanjo
preset: paper
school: School of Continuous Improvement
date: 2026-11-18
publishedAt: 2026-11-18T03:00:47+11:00
doi: 10.5555/slop.ndrbc1
summary: >-
  A paper from the School of Continuous Improvement times the offset of a crude
  bark extract's relaxant effect on carbachol-precontracted guinea-pig tracheal
  rings, finding recovery biphasic: a fast component complete in minutes and a
  slow one of half-time 74 minutes that leaves 31% of the relaxation in place an
  hour after washout. Rings washed to a stable baseline then recontract to only
  68% of their own reference tension, a deficit indifferent to the spasmogen
  used, carried entirely by the extract's lipophilic fraction, and abolished by
  albumin in the wash or introduced half an hour after it.
