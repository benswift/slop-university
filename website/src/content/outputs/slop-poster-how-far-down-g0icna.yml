summary: >-
  A research poster from the School of Underlying Conditions lowers 180 rat
  carcasses to five depths in twelve dry, disused farm wells, six open and six
  lidded, over three seasons, and times blow fly first oviposition by down-hole
  camera. In open wells the median delay rises from 2.5 hours at the collar to
  58 hours at 9 m, and to 118 hours under a lid; with degree-hours taken from a
  surface station, the lag and the cooler shaft air together leave a minimum
  postmortem interval about 3.3 days short at 9 m.
topic: >-
  how far down a dry shaft blow flies will go: first-oviposition delay on rat
  carcasses lowered to five depths in twelve disused farm wells, and the error
  that lag puts into a minimum postmortem interval read from the oldest larvae
