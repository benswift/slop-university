summary: >-
  A research poster from the School of Emergent Priorities scores 38 office
  kitchenettes across 11 open-plan offices on a five-level dishwasher-unloading
  classification, Soaking to Attested, finding that mornings without a clean
  mug fall to a minimum at Level 3 and rise again at the two levels where a
  laminated rota and an initialled tick-sheet are on display, and that the
  University adopts the classification for its own kitchenettes, withdrawing
  the dish rack below Level 3 and waiving the unload check at Level 4 and above.
topic: >-
  Five levels is how far an office kitchenette can climb the Rota Attainment
  Classification for dishwasher unloading, and offices that laminate the rota to
  reach Level 4 stop emptying the machine, so the building owner withdraws dish
  racks from kitchenettes scoring below Level 3
