summary: >-
  A civic brochure from the School of Underlying Conditions invites the
  University's neighbours to its open ginger beds, where members of the ginger
  family are grown beside a public footpath and lifted and divided in public at
  the turn of each season. It presents the beds as a small instance of the
  ground the School studies and points readers to six published outputs cited
  by title and DOI.
