summary: >-
  A research poster from the School of Underlying Conditions reads the eleven
  logbooks of one unnamed laboratory's Hall-effect station across the nine
  years of its p-type zinc oxide programme, linking 2,318 readings to 412
  station entries and nine oral-history interviews. An n-type reading was
  followed by a check of the instrument up to twelve times as often as a p-type
  one, a gap that opened as the programme committed to p-type and closed as it
  wound down; the poster reads the record as experimenter's regress made
  visible in maintenance practice.
topic: >-
  Experimenter's regress at one laboratory's Hall-effect station during its
  p-type zinc oxide programme: nine years of instrument logbooks show the
  unwanted n-type readings sent the rig for checking far more often than the
  hoped-for p-type ones
