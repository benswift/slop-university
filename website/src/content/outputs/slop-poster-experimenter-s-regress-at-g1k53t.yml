title: Checked When It Said n
subtitle: Experimenter's regress at one laboratory's Hall-effect station, nine years into p-type zinc oxide
authors:
  - Vigdis Emenike
  - Ragnhild Uzoma
  - Casimir Beng
preset: research-poster
school: School of Underlying Conditions
