title: Nobody Re-Signs the Sticker
subtitle: A Five-Level Household Smoke-Alarm Maturity Model, Adopted as a Home-Insurance Discount Eligibility Tier
authors:
  - Thandiwe Solberg
  - Mirela Hanke
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-11
publishedAt: "2026-09-11T22:35:30+10:00"
doi: 10.5555/slop.ztr9pl
summary: >-
  A research poster from the School of Continuous Improvement compares 214
  households' self-reported smoke-alarm maturity levels, submitted to a
  home-insurance discount portal, against independent audits across four
  bands of enrolment tenure. Self-reported levels hold near the scheme's top
  rung throughout; audited levels fall the longer a household holds its
  discount, under a portal rule that locks in the highest logged level for
  the policy term.
topic: >-
  a five-level maturity model scoring households on smoke-alarm
  battery-test discipline (an unsigned sticker through to a rostered
  ceiling-by-ceiling test logged on a shared calendar), adopted by a
  home-insurance discount scheme as its eligibility tier
