title: Still on the List
subtitle: >-
  Orchestral Audition Excerpts and the Repertoire They Outlive, 1968–2019
authors:
  - Vigdis Emenike
  - Ingeborg Nwachukwu
preset: paper
school: School of Underlying Conditions
date: 2026-10-30
publishedAt: "2026-10-30T19:31:15+11:00"
doi: 10.5555/slop.u7g5zu
summary: >-
  A paper from the School of Underlying Conditions reads fifty-two years of a
  regional orchestra's audition files against its season programmes, finding
  that 62 of 181 excerpts stayed on the lists more than a decade after the
  orchestra last played their works, and tracing the list's slowing turnover
  to 1994, when it also became the repertoire of the annual playing review for
  tenured players.
topic: >-
  the orchestral excerpt as an appraisal instrument: how long passages stay on
  a regional orchestra's audition lists after it has stopped programming the
  works they come from, read from the orchestra's audition files 1968-2019
