title: Next in Name Only
subtitle: >-
  Fourteen Months of a Genealogy Society's Flagged Priorities Against What
  Members Actually Resolve
authors:
  - Verity Marris
  - Marek Solheim
  - Ronja Oyelaran
preset: paper
school: School of Emergent Priorities
date: 2026-09-01
publishedAt: "2026-09-01T07:35:15+10:00"
doi: 10.5555/slop.wpl7bq
summary: >-
  A paper from the School of Emergent Priorities matches fourteen months of a
  suburban genealogy society's flagged-priority corkboard postings against its
  own resolution register, finding no relationship between the ancestor line
  a member currently has flagged and the line that member actually resolves.
  The Society responded not by retiring the board but by making a currently
  flagged priority the sole condition for booking its shared archive-access
  session.
topic: >-
  fourteen months of flagged priorities on a suburban genealogy society's
  corkboard 'next ancestor' board bear no relationship to which line a member
  actually resolves, a null result the society answers by making a flagged
  priority the sole condition for booking its shared archive-access session
