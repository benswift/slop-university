title: Painted On, Parked On
subtitle: >-
  A Randomised Trial of Kerbside Queuing Chevrons at the School Gate Finds No
  Effect on Double-Parking and Closes the Register
authors:
  - Solveig Adeyemi
  - Fenna Okoro
  - Petra Umbile
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-26
