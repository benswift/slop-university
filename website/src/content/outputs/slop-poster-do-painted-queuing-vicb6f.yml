doi: 10.5555/slop.vicb6f
summary: >-
  A research poster from the School of Continuous Improvement reports a
  randomised trial of kerbside queuing chevrons at seven matched
  primary-school kerbs against untreated controls, finding no measurable
  effect on double-parking during afternoon pick-up across a full term. The
  design is struck from the Horizon Register's active traffic-calming list,
  closed to resubmission in this form.
topic: >-
  painted queuing chevrons at the school-gate kerb tested in a randomised
  trial for reducing double-parking during afternoon pick-up, finding no
  measurable effect and the trial struck from the register
