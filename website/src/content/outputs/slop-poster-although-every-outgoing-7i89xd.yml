summary: >-
  A research poster from the School of Emergent Priorities audits 139
  committee handover boxes across 46 volunteer clubs against CHEST, a new
  completeness-scoring instrument, and finds the score tracks a box's volume
  rather than whether it holds what an incoming officer actually needed. The
  School is piloting a CHEST floor as an eligibility condition for its
  community-partnership funding round.
topic: >-
  although every outgoing club committee promises a full handover, what
  actually lands in the box -- keys, minutes, a float, a laminated fixture
  list -- sorts into four working kinds; CHEST, a Committee Handover
  Evaluation and Scoring Tool, audits handover boxes from sports clubs,
  choirs, allotment societies and sheds against what the incoming committee
  actually needed within its first term
