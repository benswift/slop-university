title: Cut Off Mid-Address
subtitle: End-of-Turn Prediction for a Voice Agent Taking Fault Reports on a Utility Phone Line
authors:
  - Brynjar Obiora
  - Vigdis Emenike
  - Fenna Okoro
preset: research-poster
school: School of Underlying Conditions
