summary: >-
  A research-showcase brochure that presents the University's catalysis and
  oxidation work as a shared temperament across schools: sand beds that ripen
  into catalysts over weeks, a retired converter bed cored before discharge, a
  catalytic oxidiser's inherited rate law, an electrolyser anode worn by its
  stops, and the characterisation signals no report can yet assign. Four
  feature sections, each voiced by a roster researcher, lead into six published
  University studies cited by title and DOI.
topic: >-
  the slow burn: a research showcase on the oxidations and catalysts that take
  their time --- the sand bed that ripens into a catalyst over a month, the
  converter bed that dies from the top down, the rate law a plant inherits from
  its commissioning, the anode worn by its stops rather than its hours --- and
  the University's catalysis and oxidation work, which reads chemistry at the
  speed it actually happens
