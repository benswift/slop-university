title: Accurate, Once Filmed
subtitle: >-
  A Pre-Registered Replication of a Calibration Index's Null Finding, Undone
  by a Franchise's Compliance Camera
authors:
  - Joost Nwosu
  - Dagny Okafor
  - Torun Ezeigwe
preset: paper
school: School of Continuous Improvement
date: 2026-09-01
publishedAt: "2026-09-01T03:00:49+10:00"
doi: 10.5555/slop.fgy2ah
summary: >-
  A paper from the School of Continuous Improvement pre-registers a direct
  replication of an earlier Calibration Maturity Index null finding inside a
  34-outlet quick-service franchise, applying the identical five-level
  rubric and independent-validation design to 118 calibration sessions.
  Attained level predicts panel-rescored accuracy this time (r = .41), a
  relationship traced to outlets' tenure under a brand-compliance camera the
  original site did not share, and the franchise has already made the
  camera mandatory network-wide.
topic: >-
  Does a performance-review calibration index's null relationship to rating
  accuracy hold up the second time anyone checks --- or only when nobody is
  filming the room? A pre-registered replication of the Calibration
  Maturity Index inside a quick-service franchise's video-recorded
  calibration sessions
