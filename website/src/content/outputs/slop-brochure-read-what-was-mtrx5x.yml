summary: >-
  A research-showcase brochure presents the University's art and architectural
  historians across all three Schools, who bring the measured drawing, the
  catalogue of states and the attribution of hands to school stairs,
  saleyards, clinical stimulus cards and laboratory micrographs. It sets out
  the University's commitment to describe its own buildings before altering
  them, and rests its case on seven published outputs cited by title and DOI.
