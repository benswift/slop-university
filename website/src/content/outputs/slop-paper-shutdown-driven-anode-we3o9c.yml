title: Wear by the Stop, Not the Hour
subtitle: Shutdown-Driven Loss of Anode Activity in a Bench Alkaline Electrolyser under Intermittent Supply
authors:
  - Solveig Adeyemi
  - Gunnhild Ekwueme
  - Eskil Nwabueze
preset: paper
school: School of Continuous Improvement
date: 2026-11-16
publishedAt: "2026-11-16T15:00:46+11:00"
doi: 10.5555/slop.we3o9c
summary: >-
  A paper from the School of Continuous Improvement runs four zero-gap alkaline
  electrolyser cells with nickel–iron anodes for 1,600 hours, three of them
  through the same 731 stops handled three ways, and keeps a record of every
  stop. The unprotected cell's anode overpotential rose by 52 mV against 10 mV
  at constant load, following the charge each stop passed back through the
  cell (R² 0.87) rather than the hours on load (0.18); a stop's cost levelled
  off once that charge neared the anode's redox capacity, and the 218 stops too
  short for the supervisory log carried 3% of it.
topic: >-
  Shutdown-driven anode degradation in a bench alkaline electrolyser under
  intermittent supply, traced through a stop-by-stop event log
