title: Land That Carries the Load
subtitle: A Strategic Plan for hosting sun, wind and storage on the University's outlying holdings
authors:
  - Clemency Tredinnick
  - Anselm Threlkeld
  - Sten Okwuosa
preset: strategy
school: School of Settled Matters
date: 2026-11-17
