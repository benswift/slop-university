doi: 10.5555/slop.tcnf2d
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the University to host a
  hybrid solar, wind and storage installation on its outlying holdings, with a
  standby generator retained and run less each year. It enters every right the
  installation needs over the land in a Burden Register, with a stated purpose,
  three-dimensional bounds and a Surrender Schedule, before the right is
  granted, and schedules deferrable research loads to the forecast supply.
topic: >-
  hosting hybrid renewable energy on the University's outlying holdings: a plan
  for the solar, wind and storage its land will carry, and for the easements and
  obligations those installations will leave on that land long after 2031
