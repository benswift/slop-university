title: Insufficient Evidence of Installation
subtitle: A Taxonomy of Household Battery-Rebate Rejection Reasons and the
  Reapplication Pathways They Quietly Open or Close
authors:
  - Anneke Tolan
  - Marek Solheim
  - Solveig Adeyemi
preset: paper
school: School of Emergent Priorities
date: 2026-08-27
publishedAt: 2026-08-27T07:30:16+10:00
doi: 10.5555/slop.pwdajf
summary: >-
  A paper from the School of Emergent Priorities builds a six-category
  taxonomy of a state battery-rebate scheme's rejection reasons from 6,214
  case files, finding that an independent panel's fixability judgement and
  the office's own reapply-invitation rate move in opposite directions for
  five of the six categories. A template-drafting log traces the mismatch
  to when each category was added to the scheme's rejection-code list
  rather than to the underlying defect.
topic: >-
  the household battery-rebate compliance office sorts rejected
  applications into a taxonomy of reasons, and what that taxonomy quietly
  decides about who is invited to reapply
