summary: >-
  A research poster from the School of Emergent Priorities places 4,720 PIN
  entries at 38 supermarket, strip-mall and food-truck EFTPOS terminals into
  four named cells of the PIN-Shield Register, and withholds the next trading
  day from any campus-retail terminal whose Exposed share exceeds a
  pre-registered 12% band, scoring a missing cup as Exposed regardless of the
  hand.
topic: >-
  The PIN-Shield Register assigns every PIN entry at the supermarket EFTPOS
  terminal to one of four named quadrants and treats an unshielded open PIN as
  a reportable exposure event requiring shield replacement before the next
  trading day
