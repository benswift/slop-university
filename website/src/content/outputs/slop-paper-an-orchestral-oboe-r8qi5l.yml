doi: 10.5555/slop.r8qi5l
summary: >-
  A paper in musicology from the School of Settled Matters reads a regional
  orchestra's concert reviews of 1979–1991 against the cane ledger of the
  reed-maker who supplied its oboe section. The darkening of tone the critics
  credited to a principal appointed in 1982 began with the opening of a new
  bale of cane in 1983 and ended with a change of merchant in 1987, and the
  paper argues that the sound was a joint production of harvest, maker and
  player that criticism heard as one person's.
topic: >-
  an orchestral oboe section's dark years, read against its reed workshop's cane ledger: a tone the critics credited to one principal and that followed, bale by bale, the harvests of Arundo cane the reeds were cut from
