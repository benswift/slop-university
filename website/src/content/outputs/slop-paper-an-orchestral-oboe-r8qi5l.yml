title: Heard as Hers
subtitle: >-
  Cane, the Reed-Maker's Ledger and an Orchestra's "Dark" Oboe, 1979–1991
authors:
  - Clemency Tredinnick
preset: paper
school: School of Settled Matters
date: 2026-11-11
