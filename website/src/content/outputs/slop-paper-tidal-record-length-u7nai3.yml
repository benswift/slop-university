doi: 10.5555/slop.u7nai3
summary: >-
  A mathematics paper from the School of Settled Matters asks how long a tidal
  record must run before harmonic analysis settles every constituent of a
  development of given order, and proves two-sided bounds: for every choice of
  fundamental frequencies the length must grow at least like the order raised to
  one less than the number of fundamentals, and for almost every choice that
  rate suffices up to an arbitrarily small extra power, which cannot be dropped.
  With six astronomical arguments the settling length grows like the fifth power
  of the order.
topic: >-
  tidal record length that settles harmonic constituents: two-sided bounds via
  Ingham's inequality and Diophantine approximation
