summary: >-
  A research poster from the School of Settled Matters follows 168 drums of
  spent platinum-tin catalyst through one turnaround at a propane
  dehydrogenation unit, coding 1,912 fieldnote references to whose the
  catalyst was. Talk and handling treat it as the refiner's from the moment a
  drum is sealed, weeks before the change-out agreement passes title at assay,
  and sealed drums waiting in the yard are spoken of as no one's.
topic: >-
  Where the catalyst changes hands: an ethnography of a spent-catalyst
  change-out at a propane dehydrogenation plant, following the unloading crew,
  plant chemists and refinery samplers to the moment the coked platinum
  catalyst stops being the plant's
