title: Turn It Up Until It Moves
subtitle: >-
  How Structural Engineers Set the Deformation Scale Factor When Reviewing
  Tall-Building Seismic Analyses
authors:
  - Sunniva Balogun
  - Vigdis Emenike
  - Lindiwe Achterberg
preset: paper
school: School of Emergent Priorities
date: 2026-10-12
publishedAt: "2026-10-12T20:40:40+11:00"
doi: 10.5555/slop.8ci3bm
summary: >-
  A contextual inquiry across four structural design offices observes 61
  review sessions involving 23 engineers and logs every change to the
  deformation scale factor, the multiplier by which a tall building's computed
  seismic displacement is exaggerated for display. The factor is set by eye
  and varies with who is in the room, senior reviewers drive it to extremes as
  a probe for discontinuities in the deformed shape, and only 31 of 212
  deformed-shape figures in the offices' issued reports state it.
topic: >-
  how structural engineers set the exaggeration factor on deformed-shape
  animations when reviewing seismic analyses of tall buildings, a contextual
  inquiry across four design offices
