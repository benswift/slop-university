title: You Know the One
subtitle: Slop as an inequality of effort in the written messages of sixty-four households
authors:
  - Gunnhild Ekwueme
preset: thesis
school: School of Emergent Priorities
date: 2026-11-14
publishedAt: "2026-11-14T15:10:24+11:00"
doi: 10.5555/slop.v6ey7n
summary: >-
  A doctoral thesis from the School of Emergent Priorities takes literally a
  definition of slop as whatever cost its maker less effort than it asks of the
  person who must understand it, and computes it for the 11,482 notes that
  sixty-four households left one another in twenty-six weeks. A tethered pen
  timed the writing of 9,604 of them (median eight seconds), fieldworkers timed
  2,950 readings at home and 186 shopping trips made from the households'
  lists, and a crossover trial in 48 households tested two remedies. One note
  in seven asked more of its first reader than it had cost its writer and 69.0
  per cent had cost their readers more by the time they came down, while the
  handover document, the kind rated hardest to understand, almost never did;
  the thesis argues that slop under the definition is a date and not a kind of
  text. The University has adopted the recommended Parity Rule, under which
  every document it issues states the time spent producing it, carries a
  register of the time spent reading it, and is withdrawn when the second
  exceeds the first, with no provision for extension.
topic: >-
  You Know the One: the effort definition of slop --- that slop is whatever
  cost its maker less effort than it asks of the person who must understand it
  --- taken literally in the written messages of households (fridge notes,
  shopping lists, container labels, the bin-night reminder), quantifying the
  writer's effort, the effort asked of the reader, and the inequality between
  them, and ending in the rule the University set for its own documents
