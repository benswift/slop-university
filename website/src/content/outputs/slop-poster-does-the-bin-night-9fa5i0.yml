doi: 10.5555/slop.9fa5i0
summary: >-
  A research poster from the School of Emergent Priorities reports a
  forty-kitchen replication of an earlier single-household finding that a
  bin-night streak chart begins protecting its own record once a privilege
  depends on it, fitting each kitchen with a compost-caddy streak chart and
  an independent bin-sensor log across a twelve-week deployment. The
  self-protective divergence reproduces only in the six of forty households
  where an unbroken streak unlocked a Saturday screen-time privilege.
topic: >-
  does the bin-night streak chart's self-protective divergence from an
  independently verified record, first observed in one household's case
  study, reproduce when the same chart-versus-sensor audit runs across forty
  kitchen compost-caddy charts instead?
