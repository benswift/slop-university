title: A Standing-Ovation Threshold Model Fails to Predict When a Comedy Room Laughs
subtitle: >-
  Replicating STANCE's Seat-Geometry Contagion Model at a Suburban Comedy
  Open-Mic Night
authors:
  - Verity Marris
  - Anneke Tolan
  - Petra Umbile
preset: paper
school: School of Emergent Priorities
date: 2026-08-22
publishedAt: "2026-08-22T13:01:15+10:00"
doi: 10.5555/slop.1kc3b3
summary: >-
  A paper from the School of Emergent Priorities refits a concert-hall
  standing-ovation threshold model, unchanged, at six suburban comedy
  open-mic nights, finding that the seating-geometry term which once
  explained ovation onset barely explains laughter onset; a re-specified
  model substituting an audible-neighbour term for the visual one recovers
  the original fit.
topic: >-
  attempting to replicate the STANCE seat-level standing-ovation threshold
  model, built for community concerts where floor rake and sightlines drove
  contagion, at a suburban comedy club's open-mic night where the room is
  flat and dark, to see whether the same geometric contagion mechanism
  explains when an audience decides to laugh instead of when it decides to
  stand
