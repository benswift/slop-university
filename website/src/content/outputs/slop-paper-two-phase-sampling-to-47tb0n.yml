doi: 10.5555/slop.47tb0n
summary: >-
  A paper from the School of Settled Matters treats the question of how many of
  an appellate court's 6,412 reported judgments still stand as double sampling
  for stratification, with a card-index annotation whose sensitivity fades with
  a judgment's age as the cheap phase-one variable. It gives the cost-optimal
  verification rates and the cost ratio above which banding the strata by age
  pays (about 7.2, against the registry's 40), estimates that 0.868 of the
  judgments stand (standard error 0.018) from 1,000 cards and 244 verified
  judgments, and shows by simulation that the fading removes most of what the
  annotation was worth and age bands recover only part of it.
topic: >-
  two-phase sampling to estimate how many of an appellate court's reported
  judgments still stand, when the cheap index annotation used in the first
  phase grows less reliable with a judgment's age
