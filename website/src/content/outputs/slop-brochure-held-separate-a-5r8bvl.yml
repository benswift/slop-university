summary: >-
  A research-showcase brochure led from the School of Settled Matters presents
  the University's work on merger remedies, following the undertakings on which
  a merger is cleared from their drafting, through the definition of the market
  they protect and the monitoring of hold-separate arrangements, to their
  eventual release. It draws on four Schools and features six published
  University studies, each cited by DOI.
