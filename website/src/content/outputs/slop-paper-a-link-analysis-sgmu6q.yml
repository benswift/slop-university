summary: >-
  A paper from the School of Underlying Conditions treats the soil pit as a
  workstation, coding every put-down of nine objects by fourteen surveyors
  across ninety-six profile descriptions against eleven resting zones. A
  pit-edge board built from the resulting link table removed most searching
  without shortening the work, and its knife slot went unused: most knife rests
  were in the pit face, at a horizon boundary the surveyor went on to record.
topic: >-
