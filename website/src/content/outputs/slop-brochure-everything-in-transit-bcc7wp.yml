summary: >-
  A research-showcase brochure from the School of Underlying Conditions
  presents the University's work on logistics and transportation systems as a
  single journey in four legs: the loading dock, the doorstep, the bus stop
  and the drill-core shed. It introduces the researchers behind each leg and
  rests the account on ten published outputs cited by DOI.
topic: >-
  everything in transit: a research showcase of the University's work on
  freight, parcels, buses and core trays between where they leave and where
  they arrive
