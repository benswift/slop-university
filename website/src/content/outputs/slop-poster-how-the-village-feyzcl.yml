summary: >-
  A research poster from the School of Underlying Conditions reads 412
  short-story typescripts submitted to an island broadcaster's Sunday story
  programme between 1958 and 1987 and codes 341 scenes in which a concealed
  matter becomes common knowledge. The village standpipe hosts more of them
  than any other venue until 1972, and most of its dialogue has no speaker;
  afterwards disclosure moves to the shop counter and the telephone, and
  acquires a speaker.
topic: >-
  how the village standpipe served as the scene where secrets come out in an
  island broadcaster's archive of short-story typescripts, and where disclosure
  moved once water was piped indoors
