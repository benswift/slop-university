title: The Door Decided Who Showed Up
subtitle: >-
  The 2026-2031 Strategic Plan Replaces Self-Reported Attendance, Engagement,
  and Quorum With Badge-Tap and Video-Join Records Across Staff, Students,
  Partners, and Council
authors:
  - Verity Marris
  - Runa Adegoke
preset: strategy
school: School of Emergent Priorities
date: 2026-07-25
