summary: >-
  Slop University's Strategic Plan 2026-2031 extends the University's badge
  readers, swipe systems, check-in credentials, and video-conferencing join
  logs into its primary account of presence, replacing self-report and
  inference with a published record across staff engagement, student
  attendance, partnership renewal, and Council quorum.
topic: >-
