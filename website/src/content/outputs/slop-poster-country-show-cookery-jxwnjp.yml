title: A Class Enters and Never Leaves
subtitle: >-
  A Thirty-Year Archival Analysis of a Country Show Society's Cookery Schedule
  and the Mechanism That Admits a Class
authors:
  - Marek Solheim
  - Ronja Oyelaran
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-31
publishedAt: 2026-07-31T17:02:33+10:00
doi: 10.5555/slop.jxwnjp
summary: >-
  A research poster from the School of Emergent Priorities codes thirty printed
  schedules (1996 to 2026) and five entry books from one country show society's
  archive, recording for each of the 214 classes now listed in the cookery
  pavilion its admission year, admitting resolution, anchoring trophy and
  entries received. The schedule grows monotonically from 118 classes to 214
  across thirty revisions, from 41 additions and four removals, every removal
  following a trophy donor's withdrawal and none following an entry count;
  96 classes drew no entry across the five shows from 2021 to 2026, while
  twelve classes carry 77.4 per cent of the 1,458 entries recorded.
topic: >-
  country show cookery classes, and a schedule of classes that only ever grows
  because a class enters by committee resolution and leaves only when its
  trophy donor withdraws
