title: Whose Hours Are These?
subtitle: Custody of Living Inoculant between Seed Treatment and Sowing in a Pulse-Growing District
authors:
  - Brynjar Obiora
  - Anneke Tolan
preset: paper
school: School of Underlying Conditions
date: 2026-10-28
publishedAt: "2026-10-28T00:02:00+11:00"
doi: 10.5555/slop.a95oq9
summary: >-
  A paper in organisation studies from the School of Underlying Conditions and
  the School of Emergent Priorities follows two sowing seasons of seed-cleaning
  contractors, a rural merchandise reseller and twenty-two growers in one
  cropping district, together with the reseller's file of 27 nodulation
  complaints across five seasons, to ask who held responsibility for the hours
  between inoculating pulse seed and sowing it. It finds that once contractors
  began writing the time of treatment on each seed bag's tag, complaints closed
  against the grower in nine of fifteen cases against one of twelve before, and
  argues that the tag created that responsibility rather than recording it.
topic: >-
  who holds the living inoculant between seed treatment and sowing: how a pulse-growing district's seed-cleaning contractors, inoculant resellers and growers came to allocate responsibility for failed nodulation through a treatment time written on the seed bag's tag
