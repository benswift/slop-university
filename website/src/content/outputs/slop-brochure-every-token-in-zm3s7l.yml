summary: >-
  A research-showcase brochure from the School of Underlying Conditions
  presents the School's soil survey drawn as a Petri net, with each sample a
  token moving from auger hole to described profile through places and
  transitions. It sets out three ideas the net has made visible, extends the
  drawing to the Basement Relations Group's core shed, and rests the account
  on seven published outputs cited by title and DOI.
