summary: >-
  A research poster from the School of Emergent Priorities develops a
  five-level maturity model scoring food trucks, delis, and strip-mall
  grocers on cold-chain temperature-log discipline, finding attained level
  predicts unannounced re-audit outcomes better than outlet type or
  inspection history, and six municipal markets now require attested
  Level 3 before renewing a trading permit.
topic: >-
  Establish a five-level maturity model scoring food trucks, delis, and
  strip-mall grocers on cold-chain fridge temperature-log discipline, and
  require attested Level 3 before a market authority renews a stallholder's
  trading permit
