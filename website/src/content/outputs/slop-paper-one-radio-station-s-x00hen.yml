title: From Screening Sheet to Sentiment Product
subtitle: A Single-Site Case Study of a Breakfast Talkback Segment's
  Caller-Management Shorthand and the Listener-Sentiment Index It Became
authors:
  - Anouk Mensah
  - Kwame Lindqvist
  - Osei Vandermeer
preset: paper
school: School of Emergent Priorities
date: 2026-08-19
publishedAt: 2026-08-19T02:02:45+10:00
doi: 10.5555/slop.x00hen
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement reports a 40-month embedded case study of one suburban commercial
  talk station, tracing the breakfast producer's caller-screening shorthand
  through four artefact generations: paper screening sheet, call-management
  dropdown, weekly advertiser deck, and the rate-card line item sold as the
  Morning Pulse listener-sentiment index. Across 838 breakfast programs and
  5,102 aired calls, six rostered regular callers account for 52 per cent of
  aired talkback minutes, recomputing the published index without first-time
  callers shifts it by a median of 0.04 points, and the index carried a
  rate-card price 31 weeks before its first written definition. In the final
  quarter the station formalised a Caller Stewardship Roster that rests and
  rotates its six most dependable callers, which the paper reads as the index's
  direction of fit inverting: the sentiment measured being, in most settings,
  the management of its own panel.
topic: one radio station's breakfast producer screens talkback callers with a
  private shorthand --- good talent, too angry, needs a rest --- and the sales
  team hardens that shorthand into a saleable listener-sentiment index; a
  single-site case study follows the index from screening sheet to advertiser
  deck, and the roster the station ends up building to manage its six most
  dependable members of the public
