summary: >-
  A research showcase from the School of Underlying Conditions presents the
  University's work on digital agriculture and rural development as a reading
  of the farm from below: the hand-drawn soil survey beneath every prescription
  map and sensor network, the ledgers, stocktakes and marketplace listings a
  farm business already keeps, and the district where a new practice passes
  from one holding to the next. It profiles three researchers and rests its
  account on eight published studies from all three Schools, cited by title
  and DOI.
