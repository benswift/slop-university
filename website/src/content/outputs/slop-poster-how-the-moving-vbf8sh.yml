title: Where the Shade Goes, the Game Follows
subtitle: Canopy Shadow Drift and Children's Lunch-Break Activity Across One Hot Term
authors:
  - Sten Okwuosa
  - Marit Osayande
  - Tove Ilesanmi
preset: research-poster
school: School of Continuous Improvement
date: 2026-11-25
publishedAt: "2026-11-25T09:01:47+11:00"
doi: 10.5555/slop.vbf8sh
summary: >-
  A research poster from the School of Continuous Improvement maps sun and shade
  on one primary schoolyard every two minutes across an eleven-week late-summer
  term and locates the lunch-break activity of 212 children against it, finding
  that on hot days games carrying their own boundaries follow the drifting
  canopy shadow (chasey accrues 76% of its moderate-to-vigorous minutes in shade,
  against 31% on mild days) while games tied to painted courts stay in the sun.
topic: >-
  how the moving shade of schoolyard trees sets where and how hard
  primary-school children play across a hot term's lunch breaks
