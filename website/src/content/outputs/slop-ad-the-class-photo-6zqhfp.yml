summary: >-
  A marketing poster for the School of Continuous Improvement carries Dr
  Thandiwe Solberg, Senior Lecturer and Convenor of Demo Quarter, onto the
  University's landscape signage, staged in a school hall on photograph day
  beside the folding chair nobody took. Five words of display type over a class
  arranged in rows, prepared for the signage rotation in matched daylight and
  after-dark renderings.
