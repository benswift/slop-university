summary: >-
  A case-for-support brochure from the School of Emergent Priorities inviting
  partners and donors to back the pepper family as one of the Horizon
  Register's longest-watched emerging priorities. It presents three settings
  for the work --- the chemistry bench, the herbarium drawer and windowsill,
  and the School's long watch --- and rests its case on six published
  University studies cited by title and DOI.
