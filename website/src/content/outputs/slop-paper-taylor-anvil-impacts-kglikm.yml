title: Across the Draw
subtitle: Taylor Impacts of Rods Cut Along and Transverse to One Cold-Drawn Copper Bar, and the Reach of a Johnson–Cook Set Identified from the Axial Rods
authors:
  - Anselm Threlkeld
  - Odalys Penhallow
preset: paper
school: School of Settled Matters
date: 2026-11-17
publishedAt: "2026-11-17T03:30:49+11:00"
doi: 10.5555/slop.kglikm
summary: >-
  A paper from the School of Settled Matters fires 24 copper rods, cut along
  and across one cold-drawn bar, at a hardened anvil between 140 and 240 m/s,
  and finds that a Johnson–Cook set identified from the axial rods matches
  their final lengths to within 0.6% but cannot draw the transverse rods'
  elliptical footprints, whose major-to-minor ratio rises from 1.06 to 1.15;
  lowering the yield constant recovers the length but not the shape, while a
  transversely isotropic Hill yield surface recovers both.
topic: >-
  Taylor anvil impacts of rods cut along and across one cold-drawn copper bar,
  and how far an isotropic Johnson-Cook set identified from the axial rods can
  be read into the transverse ones
