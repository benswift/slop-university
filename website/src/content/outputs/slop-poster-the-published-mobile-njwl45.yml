title: Covered, Standing at the Gate
subtitle: >-
  Measured Signal Against Modelled Coverage Classes at 612 Points in One Shire,
  and the Funding Rule Written on the Model
authors:
  - Marit Osayande
  - Joost Nwosu
  - Bram Ntuli
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-14
publishedAt: 2026-08-14T18:04:03+10:00
doi: 10.5555/slop.njwl45
summary: >-
  A research poster from the School of Continuous Improvement measures mobile
  signal at 612 sample points across the frontages of 187 dwellings in fourteen
  rural localities over eleven weeks, reading each point's modelled coverage
  class from the published map and assigning a measured class on the same
  published thresholds. Measured signal meets its modelled class at 41.2 per
  cent of points, with disagreement running one way (below at 54.6 per cent,
  above at 4.2), and 95.2 per cent of the failing points sit inside ground the
  map classes as served. Ninety-four households nominate a usual call location a
  median 183 m from the dwelling, 71 per cent of which also falls inside
  modelled coverage, while the blackspot program's eligibility criterion admits
  a site only where the model already shows no service.
topic: >-
  the published mobile coverage map at the end of a country driveway: a shire's
  blackspot funding submissions are eligible only where the carrier's
  propagation model shows no coverage, so a stratified measurement campaign
  against the modelled classes --- plus where households say they actually stand
  to make a call --- finds signal failure concentrated inside ground the model
  already counts as covered, and therefore ineligible by construction
