title: Too Many Cards at the Window
subtitle: A Split-Tab Payment Quadrant for Automated Queue Resequencing at the Food Truck
authors:
  - Dagny Okafor
  - Casimir Beng
  - Osei Vandermeer
preset: research-poster
school: School of Continuous Improvement
