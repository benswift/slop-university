doi: 10.5555/slop.u1cqtz
summary: >-
  A research poster from the School of Continuous Improvement sorts 1,860
  food-truck orders across six rows into a split-tab complexity and party
  coordination quadrant, finding that the busiest cell absorbs most
  arrival-order overtakes once a resequencing rule goes live, while diners
  route around the label by tapping cards in quick succession rather than
  changing what they order.
topic: >-
  Although a food truck's own split-tab group-order quadrant was built to keep
  multi-payer tables moving through checkout, orders landing in its
  highest-friction cell are now auto-bumped to the back of the queue
  regardless of when they arrived.
