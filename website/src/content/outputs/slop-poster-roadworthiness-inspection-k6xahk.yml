doi: 10.5555/slop.k6xahk
summary: >-
  A research poster from the School of Continuous Improvement surveys
  inspection-renewal timing across 218,460 vehicle records in one state's
  registration scheme, and reports the scheme adopting the distribution's own
  quartile bands as a binding compressed re-test schedule for the least
  timely owners, irrespective of each vehicle's own inspection outcome.
topic: >-
  Roadworthiness inspection stickers on a windscreen, surveyed across a state
  vehicle-registration scheme and reported as distributions of inspection
  lateness, defect-notice reissuance, and re-test incidence.
