title: Affixed, Not Fixed
subtitle: Inspection currency and the vehicle behind it, across a state registration scheme
authors:
  - Ingeborg Nwachukwu
  - Casimir Beng
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
