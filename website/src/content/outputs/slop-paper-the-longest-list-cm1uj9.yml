title: The Longest List Is the Last
subtitle: Counted Doctors and a Closing Question in a Provincial Tribunal's Printed Allegations, 1597–1663
authors:
  - Odalys Penhallow
preset: paper
school: School of Settled Matters
date: 2026-11-13
publishedAt: "2026-11-13T19:00:58+11:00"
doi: 10.5555/slop.cm1uj9
summary: >-
  A legal-history paper from the School of Settled Matters follows one point of
  dowry law, whether a widow's privileged restitution claim extended to her
  husband's promised augmentation, through 94 printed allegations argued before
  a provincial appellate tribunal between 1597 and 1663. Once the tribunal had
  decided the point for the widow, her counsel cut their lists of jurists and
  cited its sentences instead, while the creditors' counsel lengthened theirs
  to a median of 32, the longest list in the corpus (46 jurists) appearing two
  years before the last contested allegation.
topic: >-
  the longest list is the last: in a provincial appellate tribunal's printed
  legal allegations, counsel's tally of jurists cited on a disputed
  dowry-restitution point grows longest just before the point stops being
  argued and the court's own prior decisions take its place
