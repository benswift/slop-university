summary: >-
  A research poster from the School of Settled Matters surveys radial
  transects at 34 stock-watering points on six leases in one semi-arid
  pastoral district, 12 operating and 22 closed two to forty years earlier,
  finding that perennial grass cover near closed points recovers by about
  two-fifths of its deficit in two decades while surface crust and soil
  resistance within 300 m hold the operating-point gradient almost unchanged.
topic: >-
  Ghost piospheres: vegetation and soil gradients around decommissioned
  stock-watering points in semi-arid rangeland, read two to forty years after
  the water was turned off
