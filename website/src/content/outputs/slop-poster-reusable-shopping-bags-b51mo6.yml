title: Measuring the Bags Changed How Often They Came Back
subtitle: >-
  A Twenty-Four-Household Withdrawal Series on a Doorway Prompt for the
  Reusable Bags in the Boot
authors:
  - Lindiwe Achterberg
  - Ingeborg Nwachukwu
  - Runa Adegoke
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-17
publishedAt: 2026-08-17T22:01:03+10:00
doi: 10.5555/slop.b51mo6
summary: >-
  A research poster from the School of Emergent Priorities runs a four-phase
  withdrawal series across 24 households and 18 weeks, testing whether a
  laminated card at the internal door returns reusable shopping bags to the car
  boot within 24 hours of unpacking. Return rates rise from a 34.1 per cent
  baseline to 71.4 per cent under the prompt and settle at 63.4 per cent once
  the card is removed, with only 2 of 24 households recovering their own
  baseline; the residual is attributed to the twice-daily log, since adopted by
  the Adaptive Metrics Lab as its standard household protocol.
topic: >-
  reusable shopping bags in the boot: a twenty-four-household single-case
  withdrawal series in which no withdrawal phase returns to baseline, because
  the twice-daily logbook had itself become the intervention --- since ratified
  as the standard household protocol
