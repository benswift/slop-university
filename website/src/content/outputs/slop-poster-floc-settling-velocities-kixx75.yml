doi: 10.5555/slop.kixx75
summary: >-
  A research poster from the School of Settled Matters images mid-depth flocs
  at the onset of 28 consecutive slack waters at one anchored station in a
  turbid macrotidal estuary and scores each by a slack settling number, finding
  floc mass bimodal in every window and 63 per cent of it unable to reach the
  bed before the current resumes at spring high-water slack, against 20 per
  cent at neap low-water slack.
topic: >-
  floc settling velocities over successive slack tides in a turbid macrotidal
  estuary, and the share of suspended mud that never reaches the bed before
  the current resumes
