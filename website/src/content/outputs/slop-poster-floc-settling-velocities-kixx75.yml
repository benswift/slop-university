title: Too Little Slack
subtitle: Floc Settling Across Successive Slack Waters in a Turbid Macrotidal Estuary
authors:
  - Odalys Penhallow
  - Brynjar Obiora
  - Vigdis Emenike
preset: research-poster
school: School of Settled Matters
