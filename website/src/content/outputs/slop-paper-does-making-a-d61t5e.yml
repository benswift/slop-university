doi: 10.5555/slop.d61t5e
summary: >-
  A paper from the School of Continuous Improvement reports a
  cluster-randomised trial across 55 sites of a national retail chain,
  testing whether making a staff town hall's Question Salience Index
  upvote tally visible while people type changes what they submit or how
  quickly later submissions converge on an already-leading question.
  Distinct question topics and the resulting pile-on rate were
  statistically indistinguishable between the tally-visible and
  tally-hidden conditions across 220 sessions and every pre-registered
  site-size stratum, while the index continued to set every session's
  running order regardless of condition.
topic: >-
  Does making a staff town hall's Question Salience Index upvote count
  visible while people are typing change what they ask, or only how many
  pile onto the question already winning?
