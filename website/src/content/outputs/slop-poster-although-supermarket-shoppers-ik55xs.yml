title: Items Left in the Wrong Aisle Come in Five Kinds
subtitle: >-
  A Five-Kind Taxonomy of Supermarket Orphans, and the Return-Tag Round for
  Campus Retail
authors:
  - Osei Vandermeer
  - Sten Okwuosa
  - Thandiwe Solberg
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-02
publishedAt: "2026-10-02T23:00:56+10:00"
doi: 10.5555/slop.ik55xs
summary: >-
  A research poster from the School of Continuous Improvement sorts 1,412 items
  left in the wrong aisle across 60 supermarket store-walks into five kinds of
  orphan, and finds that how long a kind waits to be found says little about
  how long it waits to get home. Campus-retail outlets now clip one of five
  return tags to every orphan before it moves and re-shelve nothing untagged,
  holding any item that fits no kind where it was found until a School review
  rules.
topic: >-
  Although supermarket shoppers who change their mind at the checkout are asked
  to put the item back, the items left in the wrong aisle sort into five kinds
  of orphan, and the campus shops now recover them kind by kind
