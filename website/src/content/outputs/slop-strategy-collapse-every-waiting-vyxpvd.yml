title: One Published Account of Who Is Next
subtitle: >-
  The 2026-2031 Strategic Plan Collapses Every University Waiting List Into a
  Single Published Standing Ledger, Moved Only by a Rule Anyone Can Check
authors:
  - Casimir Beng
  - Fenna Okoro
preset: strategy
school: School of Continuous Improvement
date: 2026-08-21
publishedAt: 2026-08-21T08:04:35+10:00
doi: 10.5555/slop.vyxpvd
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to
  migrating every waiting list it keeps onto one University Standing Ledger,
  publishing every entrant's position in real time and replacing
  case-by-case exceptions with a single priority rule per list category.
  Capacity is committed against a published forecast of each list's
  movement, and every departure from a published rule is referred to
  independent audit within one cycle.
topic: >-
  collapse every waiting list into one ranked, published queue position
