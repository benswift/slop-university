title: The Reward Line
subtitle: >-
  A Matched-Flyer Field Trial of Tip-Off Call Volume and an Audit of the
  Neighbourhood Noticeboard Reward-Tier Schedule
authors:
  - Torun Ezeigwe
  - Casimir Beng
preset: paper
school: School of Continuous Improvement
date: 2026-07-27
doi: 10.5555/slop.gg4zxt
summary: >-
  A paper from the School of Continuous Improvement reports a six-week
  matched-flyer field trial across 35 residential streets, comparing tip-off
  call volume for lost-pet flyers stating a reward against otherwise
  identical no-reward flyers, and benchmarking the University's own
  Neighbourhood Noticeboard Reward-Tier Schedule against the observed
  dosage-response curve. Stating any reward raised the weekly probability of
  a tip-off call by 15.2 percentage points, but the Schedule's predicted
  call-volume curve --- which climbs steeply from $20 to $200 --- diverges
  sharply from observed data above $50, with the two highest tiers ($100 vs
  $200) statistically indistinguishable.
topic: >-
  surveying whether a lost-pet flyer's stated reward amount changes how many
  tip-off calls a street receives compared to an otherwise identical flyer
  with no reward mentioned, and whether the University's own recommended
  reward-tier schedule for neighbourhood noticeboards holds up once real
  call logs are checked against it
