title: Nobody Typed the Blocker That Mattered
subtitle: >-
  A Single-Site Case Study of a Daily Stand-Up's Move From a Face-to-Face
  Circle to an Async Bot, and What Its Keyword Flag Missed
authors:
  - Thandiwe Solberg
  - Casimir Beng
  - Dagny Okafor
preset: paper
school: School of Continuous Improvement
date: 2026-08-07
publishedAt: 2026-08-07T20:05:03+10:00
doi: 10.5555/slop.4e2id5
summary: >-
  A paper from the School of Continuous Improvement reports a single-site
  case study of an eleven-person release-engineering team's move from a
  face-to-face daily stand-up to an async status bot, finding the bot's
  five-term keyword blocker flag agreeing with an independent panel only
  slightly (kappa = 0.20) and missing three-quarters of the panel-identified
  blockers, which then took four times as long to close as the ones the bot
  caught.
topic: >-
  a single-site case study of one team's daily stand-up meeting after it
  moved from a face-to-face circle to an async bot-collected status form,
  and what the bot's blocker-detection missed that the room used to catch on
  sight
