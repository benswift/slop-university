summary: >-
  A research poster from the School of Continuous Improvement reports on a
  readiness-scoring register that dispatches a shire council's
  development-application counter by folder completeness rather than
  arrival order. Across a fourteen-week pilot, fully-scored folders moved
  sharply toward the front while folders missing a single item fell behind,
  and folder page count began tracking readiness score even though the
  intake checklist did not change. The shire's Compliance Directorate has
  adopted the register as the counter's sole queue-priority instrument, with
  no manual override and no review due until 2028.
topic: >-
  an automated readiness-scoring register that reorders a shire council's
  development-application counter queue by paperwork completeness rather
  than lodgement order or regulatory correctness
