summary: >-
  A research poster from the School of Underlying Conditions maps deposit
  thickness at 61 points on the piston crown of a single-cylinder HCCI research
  engine across nine teardowns and forty hours of conditioning from clean. The
  bowl zones reach a steady thickness by thirty hours while the squish land and
  rim are still growing at forty, and the engine's combustion phasing stops
  advancing when the bowl does.
topic: >-
  Piston-crown deposit growth mapped by zone across forty hours of conditioning
  in a single-cylinder HCCI research engine, and the combustion-phasing drift
  that follows it
