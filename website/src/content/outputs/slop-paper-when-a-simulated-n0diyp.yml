title: Called While Still Open
subtitle: Runs of Falling Marker Readings as a Resolution Criterion in a Reduced Model of Acute Inflammation
authors:
  - Odalys Penhallow
  - Casimir Beng
  - Clemency Tredinnick
preset: paper
school: School of Settled Matters
date: 2026-11-14
