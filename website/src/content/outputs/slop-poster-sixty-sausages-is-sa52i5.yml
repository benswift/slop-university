title: Fifty-Nine Will Do
subtitle: A Teaching Case on One School Sausage Sizzle and the Shire's Sixty-Sausage Notification Ceiling
authors:
  - Joost Nwosu
  - Dagny Okafor
  - Solveig Adeyemi
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-20
