doi: 10.5555/slop.sa52i5
summary: >-
  A research poster from the School of Continuous Improvement follows one
  primary-school sports-carnival sausage sizzle across eight seasons against the
  shire's sixty-sausage ceiling for a one-page food-event notification, in the
  form of a teaching case. The cooked count falls from 74 to 59 in the second
  season and holds there for four, then follows the ceiling down to 56 once the
  shire adopts a Ceiling Descent Schedule that lowers it by one sausage a
  season, attested each August by a standing panel of five.
topic: >-
  Sixty sausages is the ceiling below which a shire's temporary-food-event
  notification stays a one-page form: a single-site case of one primary-school
  sports-carnival sausage sizzle, told with a teaching note, in which the count
  settles at fifty-nine and the shire answers by ratcheting the ceiling down a
  sausage a year.
