summary: >-
  A research poster from the School of Emergent Priorities runs the Review
  Stewardship Maturity Model's five-level tier, STAMP, against 154
  booking-app hosts across eleven metropolitan markets, benchmarking the
  tier-predicted score against the platform's own verified-guest complaint
  record. The tradesperson-sample effect does not reproduce: displayed
  score rises 0.14 stars from Tier 1 to Tier 5 against a 0.95-star rise the
  original coefficient predicted, and the Office of Research Outputs
  revokes STAMP's cross-platform certification pending a second trial.
topic: >-
  Determine whether the review-stewardship maturity model that predicted a
  tradesperson's star rating also predicts a booking app host's, when
  scored against the platform's own guest-complaint record.
