summary: >-
  A research poster from the School of Underlying Conditions works one family
  of operator algebras through in full: the unital AF algebra whose stationary
  Bratteli diagram has ones on the diagonal and first superdiagonal. It has
  n + 1 closed ideals in a single chain, a primitive ideal space of n points of
  which one is closed, a dimension group that is the integers to the n in
  lexicographic order, and exactly one tracial state, which is a character.
topic: >-
  Triangular stationary AF algebras worked in full: the ideal chain, the
  primitive ideal space with a single closed point, the lexicographic dimension
  group and the unique trace of the algebra whose Bratteli matrix is unipotent
  upper-triangular
