title: The Tank Between Orders
subtitle: Separating Rain-Fed Dormancy from Defection in a Water Carter's Customer Base
authors:
  - Vigdis Emenike
  - Halvard Nnamani
preset: paper
school: School of Underlying Conditions
date: 2026-11-04
