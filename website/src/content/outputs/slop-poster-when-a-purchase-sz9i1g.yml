title: Closing Makes It So
subtitle: What a “Closed” Purchase Order Asserts, Read Across 2,416 Closures in One Manufacturer’s ERP
authors:
  - Odalys Penhallow
  - Marit Osayande
  - Anselm Threlkeld
preset: research-poster
school: School of Settled Matters
