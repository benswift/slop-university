doi: 10.5555/slop.sz9i1g
summary: >-
  A research poster from the School of Settled Matters asks whether a purchase
  order's closed status reports that the order is finished or is the act that
  finishes it, coding 2,416 closures in one manufacturer's enterprise system by
  who or what made them. It reads the 512 buyer short-closes with quantity
  still open as declarations rather than false records, and finds that the 331
  closures made by a period-end job without purchasing authority, 116 of them
  with quantity open, were reopened only twice.
topic: >-
  When a purchase order is closed: status fields in enterprise resource
  planning systems as declarations, and what a closed record asserts
