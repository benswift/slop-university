summary: >-
  A research poster from the School of Underlying Conditions assays 201 retired
  PTFE stir bars from one organometallic group's drawer for leachable
  palladium, nickel, cobalt and copper, reading them by year of retirement as a
  layered record of the group's catalysis, and re-runs twelve recorded
  "no metal added" controls that gave product. Eight of the twelve reach 5%
  conversion or more with the bar their notebook names; none exceeds 2% with a
  new bar.
topic: >-
  Retired PTFE stir bars from one organometallic group's drawer, digested and
  assayed, read as a decade-long record of the palladium, nickel and cobalt
  that carried over into its metal-free control reactions
