summary: >-
  A research poster from the School of Settled Matters fits emergence sleeves
  to 96 split hardwood posts along one rural boundary fence, each dated from
  the fence's repair register, and counts the longhorn beetles leaving them
  over two seasons. Of 130 adults, 122 came from posts that kept a strip of
  sapwood; emergence fell with years in the ground but persisted in the
  32-year batch, while fully dressed posts released almost none at any age.
