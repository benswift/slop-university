summary: >-
  A civic brochure led by the School of Emergent Priorities invites the town to
  bring its yellowed, cracked and tacky household plastics to a public table
  for the University's polymer synthesis and characterisation work, in features
  on the table itself, the laboratory that remakes old materials to watch them
  age, and the coated and moulded surfaces of the town's streets and parks. It
  cites six published studies from four Schools by title and DOI.
