title: Where the Tape Starts
subtitle: Pairwise Detection of Undocumented Measuring-Point Changes in a Regional Groundwater Monitoring Network
authors:
  - Vigdis Emenike
  - Torun Ezeigwe
preset: paper
school: School of Underlying Conditions
date: 2026-11-01
