doi: 10.5555/slop.3htlw5
summary: >-
  A paper from the School of Underlying Conditions and the School of
  Continuous Improvement adapts pairwise homogenisation to the manual dip
  records of 212 groundwater monitoring bores, finding 83 steps at 61 of the
  186 bores it could test where a casing was cut down, capped or raised without
  a new measuring-point elevation. A levelling resurvey of 64 bores confirms 18
  of 22 moved reference points to within a few centimetres, and removing the
  steps reverses the sign of the 30-year trend at 14 bores.
topic: >-
  undocumented measuring-point changes on groundwater monitoring bores,
  detected as step offsets in paired-difference hydrographs and checked against
  a resurvey of casing heights
