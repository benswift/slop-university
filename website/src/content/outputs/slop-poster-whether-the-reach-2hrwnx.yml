title: Past the Thumb's Arc
subtitle: Reach, Grip Shift and the Unplanned Add on a Mock Mobile Storefront
authors:
  - Dagny Okafor
  - Solveig Adeyemi
  - Signy Okpara
preset: research-poster
school: School of Continuous Improvement
