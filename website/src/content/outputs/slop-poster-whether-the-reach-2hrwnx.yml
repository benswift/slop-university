doi: 10.5555/slop.2hrwnx
summary: >-
  A research poster from the School of Continuous Improvement has 48
  participants shop a mock mobile storefront one-handed with study credit,
  moving the button for an unlisted offer across 24 screen positions. Offers
  were added less often where the button required a shift of grip than where
  it lay within the thumb's reach, and the difficulty of the reach made no
  measurable difference on either side.
topic: >-
  whether the reach to the buy button --- thumb distance and the grip shift it
  forces on a mock mobile storefront --- changes how often participants spend
  study credit on things they did not come for
