summary: >-
  A prospectus brochure from the School of Continuous Improvement opens on
  the Adaptive Metrics Lab's four-kind taxonomy of a strip mall's
  closing-down sale banners, and follows the same instinct into a semester
  of postgraduate coursework, a food-truck training placement, and a
  cross-school programme that turns classifications into budget lines.
topic: >-
  Which "closing down" sale is actually closing? A four-kind taxonomy sorts
  a strip mall's sale banners by what they're actually signalling, and the
  School of Continuous Improvement builds the method straight into a
  semester of postgraduate coursework, with three sibling programmes shown
  turning the same habit into a budget line, a certificate, and a register
  that outlives whoever drafted it.
