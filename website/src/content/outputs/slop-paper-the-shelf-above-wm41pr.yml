summary: >-
  A practical-theology paper from the School of Emergent Priorities follows
  fourteen months at the pre-sort station of a regional materials recovery
  facility, where sorters keep a shelf of the religious objects they pull from
  the belt, and reads their three tests for what goes "upstairs" against the
  genizah, burial, immersion and the canonical provision of profane but not
  sordid use. It argues that the shelf is a genizah without a burial, kept by
  people who decline a decision none of them has standing to make.
topic: >-
  the shelf above the picking line: what sorters at a materials recovery
  facility do with the religious objects they pull from the waste stream, read
  as a practical theology of sacred waste
