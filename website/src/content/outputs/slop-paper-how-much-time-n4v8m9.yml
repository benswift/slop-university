title: How Much Time a Buried Soil Holds
subtitle: Pedogenic Duration and the Apparent Steps in a Loess Land-Snail Lineage
authors:
  - Brynjar Obiora
  - Sunniva Balogun
preset: paper
school: School of Underlying Conditions
date: 2026-10-16
publishedAt: "2026-10-16T16:00:56+11:00"
doi: 10.5555/slop.n4v8m9
summary: >-
  A paper from the School of Underlying Conditions measures 4,300 land-snail
  shells from 110 samples through a 13.0 m loess quarry face and re-times the
  three buried soils that interrupt it from a calibrated profile development
  index, finding that they hold 19 per cent of the section's thickness but
  about 45 per cent of its time. Two of the three apparent steps in mean shell
  height become ordinary random-walk increments, and the largest falls from
  more than four standard deviations to about two.
topic: >-
  How much time a buried soil holds: re-timing the apparent jumps in shell
  shape of a fossil land-snail lineage through a loess-palaeosol sequence by
  estimating each palaeosol's duration from its pedogenic development
