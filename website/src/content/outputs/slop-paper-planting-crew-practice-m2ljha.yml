title: Out of the Water Too Long
subtitle: Handling Time, Anchoring and the Six-Year Persistence of Transplanted Seagrass Plots in a Sheltered Estuary
authors:
  - Ingeborg Nwachukwu
  - Vigdis Emenike
preset: paper
school: School of Continuous Improvement
date: 2026-11-05
publishedAt: "2026-11-05T15:32:18+11:00"
doi: 10.5555/slop.m2ljha
summary: >-
  A paper from the School of Continuous Improvement resurveys all 64 plots of a
  single-season intertidal seagrass transplant on a sheltered estuarine flat
  six years after planting, and joins each plot's fate to the planting crews'
  field sheets. Twenty-seven plots persisted and twelve had spread; persistence
  fell with the minutes between harvest and planting and rose with stapling in
  the exposed outer section, and plots planted under a holding rule adopted
  midway through the season persisted at 56 per cent against 25 per cent
  before it, though the rule and handling time cannot be separated.
topic: >-
  planting-crew practice and six-year persistence of transplanted seagrass
  plots in a sheltered estuary: handling time, tidal window and anchoring
  method as predictors of which plots survived and spread
