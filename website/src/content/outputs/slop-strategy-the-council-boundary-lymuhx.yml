summary: >-
  Slop University's Strategic Plan 2026-2031 takes its premise from a
  pitch-pair comparison of food trucks parked either side of a council
  centreline, in which trade moved at the paint and nowhere else. The plan
  assigns every delegated authority to a painted Delegation Line, requires
  signatures to be given on the registered side before a witness, and sends any
  decision taken within one pitch-width of a line to a second signatory across
  it, with no exception sustained beyond a single review cycle.
topic: >-
  The council boundary down the middle of a strip-mall service road, and the
  food-truck pitches either side of its painted centreline
