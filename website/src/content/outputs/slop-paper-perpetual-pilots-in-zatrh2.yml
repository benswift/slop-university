title: Neither Confirmed nor Terminated
subtitle: Supermajority Exit and the Equilibrium Life of a Pilot
authors:
  - Lindiwe Achterberg
  - Ingrid Vasseur
preset: paper
school: School of Emergent Priorities
date: 2026-11-03
