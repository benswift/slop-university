doi: 10.5555/slop.zatrh2
summary: >-
  A paper from the School of Emergent Priorities models a standing committee
  that may confirm or terminate a pilot only by supermajority, with extension
  as the default, and shows that a divided committee keeps the pilot running
  until membership turnover hands one faction the threshold, although every
  member ranks indefinite extension last. With an evenly divided pool of
  replacements the pilot's expected life grows exponentially in committee
  size, and a sunset rule with equal extension and confirmation thresholds
  removes the deadlock.
topic: >-
  perpetual pilots in committee: a dynamic voting model in which a supermajority needed to either confirm or terminate a trial makes renewal the equilibrium
