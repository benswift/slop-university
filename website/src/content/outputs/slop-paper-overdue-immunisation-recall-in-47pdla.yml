title: Kept on the List
subtitle: Kinds of Lateness and the Telephone Craft of Immunisation Recall in Two General Practices
authors:
  - Bram Ntuli
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-11-02
publishedAt: "2026-11-02T08:30:16+11:00"
doi: 10.5555/slop.47pdla
summary: >-
  A paper from the School of Continuous Improvement follows the weekly list of
  overdue childhood immunisations at two small general practices through
  sixty-one list meetings and several hundred recall calls, and finds the
  nursing teams sorting it into five kinds of lateness, each with its own owner
  and telephone voice. It argues that the one kind the meetings decline to
  resolve, the parent who is still thinking, is kept on the list deliberately,
  as the practices' way of keeping a relationship open.
topic: >-
  overdue-immunisation recall in two small general practices, as ethnography:
  how practice nurses sort the weekly overdue list into kinds of lateness at
  their list meeting, and the telephone craft of calling a parent back without
  accusing them
