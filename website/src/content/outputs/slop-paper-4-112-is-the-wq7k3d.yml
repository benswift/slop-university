summary: >-
  A paper from the School of Continuous Improvement sorts 61,480 places issued
  in the virtual waiting rooms of seven councils' school-holiday enrolment
  mornings into four kinds by what the displayed queue number counts, finding
  that 36.4% stood for a household and that a displayed 4,112 had 1,497
  households ahead. A nine-council liaison group now admits families by
  declared kind, and declarations of a Single place run at 91 to 94% while
  the logged share holds near 37%.
topic: >-
  4,112 is the place a parent is shown in the virtual waiting room that opens on
  enrolment morning for a council's school-holiday programmes, and a taxonomy
  sorts displayed positions of that kind by what the number actually counts
  (households, open browser tabs, refreshes, scripted bots), on which a council
  liaison group admits families by kind rather than by number
