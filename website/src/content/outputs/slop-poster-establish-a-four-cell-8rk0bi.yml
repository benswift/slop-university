title: Notes on the Empty Mist
subtitle: a four-cell occupancy matrix for supermarket produce misting
authors:
  - Sunniva Balogun
  - Ronja Oyelaran
  - Petra Umbile
preset: research-poster
school: School of Emergent Priorities
