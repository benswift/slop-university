summary: >-
  A research poster from the School of Emergent Priorities classifies
  supermarket produce-misting scans into four named cells and finds Empty
  Mist, the jets running with no one lingering, in 41 percent of 2,184
  intervals across twelve wet racks. Campus-retail wet-rack hours may now
  be varied only from a documented Cooled Linger-majority week, with an
  Empty Mist-majority week suspending the jets for the remainder of the
  trading week.
topic: >-
  Establish a four-cell occupancy matrix for supermarket produce misting,
  and bind campus-retail wet-rack hours to occupancy of the Cooled Linger.
