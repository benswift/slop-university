title: Splitting Bills to the Cent Speeds Repayment and Ends the Shout
subtitle: >-
  A Natural Experiment in Household Bill-Splitting Apps, Settlement Latency,
  and Small-Debt Forgiveness
authors:
  - Thandiwe Solberg
  - Bram Ntuli
  - Ingeborg Nwachukwu
preset: paper
school: School of Continuous Improvement
date: 2026-08-21
publishedAt: "2026-08-21T23:05:15+10:00"
doi: 10.5555/slop.g781n1
summary: >-
  A paper from the School of Continuous Improvement compares 64 share houses
  that adopted a cent-accurate bill-splitting application partway through a
  shared lease against 58 households that continued an informal whiteboard
  tally, tracking 5,214 logged debts across a 20-week panel. Households that
  switched settled debts in a median of 1.2 days against 5.1-5.6 days for the
  comparison group, but the share of small debts (under $10) forgiven rather
  than repaid fell from 41.2% to 8.7%; a one-tap "forgive" feature added to a
  subsample midway through the study left the forgiveness rate unchanged.
topic: >-
  a natural experiment on share-house households that switched mid-lease
  from an honour-system IOU whiteboard to a cent-accurate bill-splitting
  app, testing whether the switch sped up debt settlement at the cost of
  the small-debt forgiveness that kept the whiteboard system's goodwill
  afloat, and what the University's own tea-room kitty fund adopts once the
  finding reads as a case for precision rather than against it
