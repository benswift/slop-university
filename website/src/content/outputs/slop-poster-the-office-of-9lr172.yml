summary: >-
  A research poster from the School of Continuous Improvement reports a
  season-long deployment of a live handicap-recalculation engine at a
  suburban pub darts league. A Bayesian posterior updates every player's
  handicap after each leg and republishes the fixture before the next player
  chalks up; committee overrides stay rare, but legs conceded late in close
  matches rise across the season.
topic: >-
  the Office of Continuous Improvement designs and deploys a live
  handicap-recalculation engine for a suburban pub darts league, reweighting
  every player's handicap after each leg and auto-publishing the revised
  fixture list to the clubroom scoreboard
