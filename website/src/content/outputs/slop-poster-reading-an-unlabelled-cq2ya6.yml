summary: >-
  A research poster from the School of Settled Matters measures what remains of
  the phenolic and aminic antioxidants in an unlabelled tin of lubricating oil
  from a closed workshop store, and maps how the same pair is spent in the
  tin's own re-dosed base oil across five temperatures. The tin falls on the
  45 °C path, reading as an effective storage temperature of 44 °C held for the
  equivalent of nine to fourteen years.
topic: >-
  Reading an unlabelled tin of lubricating oil backwards: its storage
  temperature reconstructed from the order in which its phenolic and aminic
  antioxidants were spent
