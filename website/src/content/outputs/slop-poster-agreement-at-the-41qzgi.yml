summary: >-
  A research poster from the School of Emergent Priorities has pairs drawn from
  14 volunteer sorters at one clothing-donation processing centre grade 1,720
  donated garments blind on a five-point condition scale, and scores their
  agreement both on the grade and on the stream (shop rail, rag bale or bin)
  each grade sends the garment to. Quadratic-weighted kappa on the grade is
  0.81, yet one garment in six (16.1%) falls on opposite sides of the rail
  cut-point, most of them a grade 3 against a grade 4.
topic: >-
  agreement at the cut-point: two volunteer sorters grade the same donated
  garments on a five-point condition scale, and how often their grades send a
  garment to the same stream (rail, rag bale or bin), against what weighted
  kappa implies
