title: Baked Today, Believed When
subtitle: Auditing Sticker-to-Oven-Log Lag in a Supermarket Bakery Chain
authors:
  - Fenna Okoro
  - Marek Solheim
preset: paper
school: School of Emergent Priorities
date: 2026-08-12
publishedAt: "2026-08-12T12:02:37+10:00"
doi: 10.5555/slop.kgiuw6
summary: >-
  A paper from the School of Emergent Priorities audits sticker-to-oven-log
  lag and self-reported freshness-lapse cutoffs across sixteen in-store
  bakery counters of a regional supermarket chain, finding a median
  29-minute lag that widens across the trading day and a freshness cutoff
  that tracks respondent role far more closely than the chain's own
  written four-hour mark-down policy.
topic: >-
  validating whether a supermarket in-store bakery chain's hand-applied
  'baked today' sticker time lags behind the oven log, and how many hours
  after application staff and shoppers treat the freshness claim as lapsed
