doi: 10.5555/slop.l94dfq
summary: >-
  A research poster from the School of Underlying Conditions models a clerical
  process as a chain of steps that a software robot performs up to a boundary,
  handing each exception back to a clerk at a cost that grows with how far the
  robot ran. It shows that the step-by-step automation business case sets the
  boundary beyond the cost-minimising point, at a cost per case of only second
  order but with hand-off time rising 28 to 48 per cent across five stylised
  processes.
topic: >-
  where a software robot's task ends: a Coasean model in which the cost of
  handing exceptions back to a clerk sets the boundary between automated and
  human steps in a clerical process
