title: Only What Has an Outline
subtitle: >-
  Shadow-Board Audits, Four Years of Acquittal Records, and the Composition of
  the Toolkit at 46 Community Workshops
authors:
  - Runa Adegoke
  - Verity Marris
  - Anneke Tolan
preset: paper
school: School of Emergent Priorities
date: 2026-08-14
publishedAt: "2026-08-14T17:01:03+10:00"
doi: 10.5555/slop.zgk44a
summary: >-
  A paper from the School of Emergent Priorities codes 6,148 purchase lines
  from four years of one community-workshop association's acquittal returns
  against each site's own inventory control, and inventories the toolkit on
  site at all 46 workshops. At the 29 sites running a painted shadow board,
  61.2 per cent of purchase lines refilled a vacant outline and 4.1 per cent
  introduced a tool type the board did not already carry, against 39.8 and
  19.6 per cent at the 17 sites keeping a written list; board sites hold about
  three-quarters the number of distinct tool types at comparable membership
  and spend, while 268 outlines were painted over and recorded completeness
  rose from 91.3 to 97.9 per cent.
topic: >-
  a community workshop's tool shadow board, where the end-of-session audit
  counts filled outlines and the shed's replacement purchasing follows the
  vacancies, so spend rebuys what is already outlined and a tool the board was
  never painted for cannot be justified
