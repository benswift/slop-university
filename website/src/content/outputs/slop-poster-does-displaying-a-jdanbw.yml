summary: >-
  A research poster from the School of Emergent Priorities randomises
  whether a supermarket EFTPOS screen shows a shopper's loyalty-points
  balance before or after payment completes, finding no difference in
  basket-amendment value or incidence across 4,118 transactions at
  fourteen sites. The Horizon Register drops the prompt from its
  watch-list and orders partner sites to withdraw marketing language the
  trial could not support.
topic: >-
  Does displaying a shopper's loyalty-points balance on a supermarket
  EFTPOS screen before payment increase how much they add to the basket
  at checkout
