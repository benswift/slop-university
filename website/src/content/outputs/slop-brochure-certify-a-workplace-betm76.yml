summary: >-
  A research-showcase brochure from the School of Emergent Priorities
  introduces SHIFT, a five-level maturity model that certifies a
  workplace's open-plan floor, shift roster, stand-up cadence,
  performance-review cycle and franchise onboarding pathway on one
  combined ladder, and reports that a site scoring below Level Three is
  barred from onboarding new staff until a published re-audit lifts its
  band.
