title: Everyone Was Standing There at the Key Change
subtitle: >-
  A Two-by-Two Classification of Row and Voice across 2,240 Singer-Passages in
  Fourteen Community Choirs, with an Audible-Quorum Rule for Committee Meetings
authors:
  - Sten Okwuosa
  - Casimir Beng
  - Marit Osayande
preset: paper
school: School of Continuous Improvement
date: 2026-10-03
publishedAt: "2026-10-03T15:00:56+10:00"
doi: 10.5555/slop.ba0zd1
summary: >-
  A paper from the School of Continuous Improvement sorts 2,240 singer-passages
  from 112 rehearsals at fourteen community choirs into four named cells by row
  and voice, finding that every rehearsal was quorate on the attendance roll
  while 31 were quorate by ear, and records the University's decision to count a
  committee member towards quorum only once they have spoken aloud within the
  first fifteen minutes.
topic: >-
  To establish who actually carries a difficult passage in a community choir, by
  sorting 2,240 singer-passages across fourteen choirs into a two-by-two of
  front or back row against sung aloud or mouthed, and to set the speak-once
  audible-quorum rule the University applies to its own committee meetings
