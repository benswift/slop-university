title: Gating the Listing
subtitle: A Five-Level Landlord-Responsiveness Maturity Model for Share-Housing Review Apps
authors:
  - Thandiwe Solberg
  - Bram Ntuli
  - Sten Okwuosa
preset: paper
school: School of Continuous Improvement
date: 2026-09-15
publishedAt: "2026-09-15T06:47:56+10:00"
doi: 10.5555/slop.wg4448
summary: >-
  A paper from the School of Continuous Improvement introduces and audits the
  Landlord-Responsiveness Maturity Model, a five-level index a share-housing
  review app uses to gate whether a landlord's listing appears in default
  search results. Across 1,214 listings and an independent repair-completion
  audit, the displayed level tracks the platform's own ranking far more
  closely than it tracks audited outcomes, and a low-cost acknowledgment tool
  moves the score well ahead of any confirmed repair.
topic: >-
  a landlord-responsiveness maturity model, scored from a share-housing
  review app's tenant star ratings and repair-request threads across five
  named levels, that gates whether a landlord's new listing appears in
  default search results until they reach level three
