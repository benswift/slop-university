title: Not Mine, Not Ours
subtitle: Attachment Avoidance and the Definite Article in Cohabiting Couples' Walk-Throughs of Their Homes
authors:
  - Clemency Tredinnick
  - Eivind Onwuka
preset: paper
school: School of Settled Matters
date: 2026-11-11
publishedAt: "2026-11-11T03:02:18+11:00"
doi: 10.5555/slop.9jmhbr
summary: >-
  A paper from the School of Settled Matters records 118 cohabiting couples
  walking a researcher through their homes and codes 11,362 references to their
  household objects, finding that partners higher in attachment avoidance used
  fewer plural possessives and more bare definite articles rather than more
  singular ones, most of all for objects acquired together, while attachment
  anxiety raised plural possessives only for objects the partner had brought in.
topic: >-
  mine, yours, ours: attachment avoidance and the possessive pronouns cohabiting
  couples use when they inventory their household objects together
