summary: >-
  A marketing poster presents the history of science as the place every
  forecast is eventually kept, set in a tall archive of retired instruments and
  boxed predictions where one more box is being slid onto a high shelf. Its
  brag is drawn from the School of Emergent Priorities' own Horizon Register,
  whose most-consulted section is reported to be the one marked Arrived, and it
  is prepared for the portrait signage panels in matched light and dark
  renderings with a short reading list from the University's published record.
