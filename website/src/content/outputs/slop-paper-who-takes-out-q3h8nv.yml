title: Who Takes Out the Bin?
subtitle: Lay Decodings of the Waste Metaphor in an Animated Explainer of Targeted Protein Degradation
authors:
  - Brynjar Obiora
  - Iben Chikere
preset: paper
school: School of Underlying Conditions
