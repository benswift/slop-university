doi: 10.5555/slop.q3h8nv
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities reports a reception study of a three-minute animated film that
  explains targeted protein degradation as a cell taking out its rubbish,
  setting interviews with the film's three makers against nine focus groups of
  58 lay viewers. Most viewers took the medicine to be the bin, and those who
  followed the mechanism went on to ask who issues the sticker, where the
  pieces go and how often collection comes, which the authors read as the
  metaphor transferring the subject into a domain where its audience holds
  opinions.
topic: >-
  Who takes out the bin: an encoding/decoding reception study of how lay
  viewers read the waste-disposal metaphor in an animated explainer of targeted
  protein degradation
