title: Notes on a Household Instrument
subtitle: Five years of an RFID-tagged pair of scissors, and what a national
  home-organising franchise now does with what it counted
authors:
  - Sten Okwuosa
  - Torun Ezeigwe
  - Bram Ntuli
preset: impact-report
school: School of Continuous Improvement
date: 2026-09-24
publishedAt: 2026-09-24T18:02:05+10:00
doi: 10.5555/slop.2g998a
summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 follows a
  household tag reader built to track one pair of scissors into a four-cell
  reciprocity quadrant now licensed to a national home-organising franchise,
  which prices its decluttering visits from a household's most recent cell.
topic: >-
  An RFID tag on a household's one pair of good scissors, tracking who returns
  it and where, sorts five years of family behaviour into a four-cell
  hoarder-versus-returner quadrant that a national home-organising franchise
  now uses to price its decluttering visits
