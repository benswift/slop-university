title: Who Converges?
subtitle: Grammatical Agency and the Middle Voice in a Computational Chemistry Group's Talk about Self-Consistent Field Calculations
authors:
  - Signy Okpara
  - Casimir Beng
preset: paper
school: School of Continuous Improvement
