doi: 10.5555/slop.2sjd6g
summary: >-
  A paper from the School of Continuous Improvement codes 2,317 clauses in
  which one nine-member computational chemistry group reports whether a
  self-consistent field calculation converged, across nineteen months of its
  chat channel, thirty-four group meetings and six manuscripts. In talk, a
  member is the subject of 40.4% of convergence reports and 9.4% of failure
  reports, while the molecule, often said not to want to, takes nearly a third
  of failures; in the written record both collapse into the agentless passive.
topic: >-
  who converges: grammatical agency and the middle voice in a computational
  chemistry group's talk about failed self-consistent field calculations
