summary: >-
  A research poster from the School of Settled Matters assays sC5b-9 and C3a
  in 124 synovial fluid samples from both forelimb fetlocks and both hocks of
  31 retired draught horses at one agistment property. Fetlock sC5b-9 rises
  with years in harness (ρ = 0.58) while the hocks barely move (ρ = 0.14), the
  fetlock-to-hock ratio climbing from 1.2 to 2.1 across the working-history
  bands, and paired fetlocks agree closely within each horse (ρ = 0.81).
topic: >-
  What the joint keeps: complement activation fragments in the synovial fluid
  of retired draught horses at one agistment property, compared by joint and
  by years in harness
