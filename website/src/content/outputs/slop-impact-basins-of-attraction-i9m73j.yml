summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 reads five
  years of collaborators' improvement programs as a dynamical system, following
  sixty-three of them for eighteen months past their close and finding that
  eleven settled somewhere new while the rest relaxed most of the way back. Its
  three impact areas cover the programs that held because they changed a
  standing rule rather than relying on effort, a leading-indicator method that
  read a regional depot's lengthening recovery from small disruptions before
  its performance shifted, and a state audit office whose year-long swing in
  open findings damped from about thirty-one to about nine per cent either side
  of target once it halved the correction applied at each review.
topic: >-
  basins of attraction: five years of the School modelling where organisations
  settle once an improvement program ends, and how far a push must go to leave
  the old equilibrium
