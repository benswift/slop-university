summary: >-
  A research poster from the School of Underlying Conditions reads 38
  ionic-liquid supplier catalogues from 2002 to 2024 through Semper's
  principle of dressing, coding 214 page spreads by their organising grid. The
  cation-led grid rises from 31% to 74% of spreads as the ion pair gives way as
  the catalogue's unit, and 83% of property columns in those grids hang from
  the anion.
topic: >-
  a Semperian reading of ionic-liquid trade catalogues as pattern books, in
  which the swappable anion is sold as cladding on a fixed cationic frame
