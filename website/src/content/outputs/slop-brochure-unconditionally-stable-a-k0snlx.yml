summary: >-
  A research showcase presenting numerical methods for differential equations
  as a practice shared by all three Schools. It sets out three habits in turn,
  choosing the step by estimating its error, holding steady on stiff problems
  with implicit methods, and keeping a groundwater model's books balanced cell
  by cell, each voiced by a researcher, and rests its case on seven published
  studies cited by title and DOI.
topic: >-
  unconditionally stable: a research showcase for the University's work on
  numerical methods for differential equations, from the step-size controller
  to the recession curve
