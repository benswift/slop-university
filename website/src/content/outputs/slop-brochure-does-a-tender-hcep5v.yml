summary: >-
  A prospectus brochure from the School of Emergent Priorities opens on a
  single-site teaching case of one shire foyer: a locked metal tender box, a
  two o'clock close on the notice, and a courier who arrived at two-oh-one
  while the officer still had the key. The Master of Priority Studies now
  requires every candidate to lodge a sealed envelope at a live civic tender
  box as a hurdle of the degree; an envelope after the published close fails
  the unit, even when the box has not yet been emptied.
topic: >-
  Does a tender that arrives after two o'clock still count if the shire box
  has not been emptied?
