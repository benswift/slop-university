summary: >-
  A research poster from the School of Underlying Conditions follows eleven
  members of a polar overwintering station's crew through forty weeks of
  weekly self-collected vaginal swabs, finding community state type switches
  fell from 0.20 per participant-week during the summer changeover to 0.04
  across the sealed winter before rising again after the first flight.
topic: >-
  a weekly self-sampled cohort at a remote overwintering research station, and
  how stable each crew member's vaginal community state type stays across the
  sealed winter months when nobody new arrives
