summary: >-
  A research poster in political theory from the School of Settled Matters
  reads the Sabatier principle of electrocatalysis, that the best surface binds
  its intermediates neither too strongly nor too weakly, as an account of the
  authority a statute keeps over its later reader. Two readers score 36
  provisions from the School's collection of annotated second-reading speeches
  for binding strength, and the disputes each settles per decade trace a
  volcano that peaks at a binding score of 5.6 and falls away at both ends.
topic: >-
  the Sabatier principle as a political theory of binding: authority that holds
  its subjects neither too strongly nor too weakly
