summary: >-
  A research poster from the School of Continuous Improvement reports on a
  QR-tag scan-and-timer system deployed at six metropolitan junior swimming
  clubs, which auto-donates unclaimed pool-deck lost property to a
  trash-and-treasure fundraiser after a fixed four-session countdown with no
  committee override, finding the cutoff crosses at statistically
  indistinguishable rates regardless of an item's replacement-cost band.
topic: >-
  a lost-property tagging tool for a junior swimming club that auto-donates
  unclaimed QR-tagged togs and goggles to the trash-and-treasure stall after a
  fixed number of sessions, no grace period
