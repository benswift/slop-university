title: "Let It Settle"
subtitle: >-
  Recovery of Basal XBP1-Splicing Reporter Signal after Routine Handling in an
  In-House Line
authors:
  - Halvard Nnamani
  - Kwame Lindqvist
  - Lindiwe Achterberg
preset: research-poster
school: School of Emergent Priorities
date: 2026-10-13
publishedAt: "2026-10-13T03:00:23+11:00"
doi: 10.5555/slop.258b5n
summary: >-
  A poster from the School of Emergent Priorities applies six routine handling
  steps to 504 wells of the School's in-house unfolded-protein-response reporter
  clone and times the return of basal signal to that of undisturbed sister
  wells. Passage raises the signal 3.9-fold at eight hours and takes 36 hours to
  settle, fridge-cold medium takes 24 hours against 12 for pre-warmed, and wells
  behind an opened incubator door never leave baseline.
topic: >-
  How long the basal unfolded protein response of an in-house reporter cell line
  takes to settle after routine handling: medium change, passaging, a cold wash,
  and the walk to the microscope
