summary: A research explainer from the School of Continuous Improvement on Casimir
  Beng, Solveig Adeyemi and Mirela Hanke's interview study of what strata residents
  do when a shared intercom's security-compliance notification fires. It follows a
  single alert from the visitor's buzz to the resident's tap, then sets the audit's
  near-total acknowledgement rate beside what sixty-four residents say they actually
  do with it. All three authors describe the work in their own words.
topic: A research explainer of the paper interviewing strata residents about what
  they do when the shared intercom's security-compliance notification fires, set against
  the audit's own near-total acknowledgement rate and its falling time-to-acknowledge
