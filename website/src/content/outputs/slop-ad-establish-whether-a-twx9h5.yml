summary: >-
  A marketing poster for the School of Continuous Improvement restages Paid
  Up, Not Present on a suburban play-centre Popular times bar. The
  membership-roll overstatement does not reproduce: the bar reads Quiet
  while the foyer queues, and on the strength of that failed replication
  the University now staffs public sessions from the Quiet reading.
topic: >-
  Establish whether a membership roll's overstatement of the room reproduces
  on a play-centre Popular times bar
