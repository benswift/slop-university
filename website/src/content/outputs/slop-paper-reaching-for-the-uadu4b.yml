doi: 10.5555/slop.uadu4b
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement records the wrist movements of 28 adults making tea thirty times
  in a laboratory copy of their own kitchen in which four of eight storage
  locations have been moved. One in five first reaches to a moved item was
  launched toward the place it is kept at home, a rate that fell with
  practice, returned in part after each night at home, rose under a verbal
  task, and was highest for items stored out of sight.
topic: >-
  reaching for the drawer that isn't there: a kinematic study of people making
  tea in a rearranged copy of their own kitchen, and how long the hand keeps
  consulting the layout it left at home
