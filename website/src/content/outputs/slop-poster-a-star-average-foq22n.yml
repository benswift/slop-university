title: Same Swings, Same Slide, Any Number of Stars
subtitle: A Pre-Registered Equivalence Trial of Assigned Star Averages at 42 Suburban Playgrounds
authors:
  - Bram Ntuli
  - Renke Sabel
  - Marit Osayande
preset: research-poster
school: School of Continuous Improvement
