doi: 10.5555/slop.foq22n
summary: >-
  A research poster from the School of Continuous Improvement assigns one of
  three star averages to the listing of each of 42 suburban playgrounds by lot
  and counts Saturday-morning family arrivals over 18 weeks. Arm means of 63.1,
  62.8 and 63.4 arrivals sit inside a pre-registered margin of seven, and the
  University has retired review collection for its campus courtyards in favour
  of one fixed figure on their listings.
topic: >-
  A star average on a suburban playground's map-app listing, replaced for 18
  weeks by a figure the trial assigned rather than one earned from visitor
  reviews, tested for whether Saturday family counts follow the stars at all;
  they do not, and the University closes its review desk for campus courtyards
  and prints one fixed figure on their listings
