title: What the Pack Left Over
subtitle: Returned tablets traced to the gap between the course prescribed and the pack dispensed
authors:
  - Brynjar Obiora
  - Vigdis Emenike
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-26
