doi: 10.5555/slop.hy0mtz
summary: >-
  A research poster from the School of Underlying Conditions draws 300 bags
  from 60 bin collections of a regional pharmacy take-back scheme and matches
  1,412 returned packs to the dispensings that issued them. Of 18,240 tablets
  returned, 57% equal the remainder left when a prescribed course is filled
  from whole packs, rising to 81% for courses of 21 tablets or fewer, and the
  split moves only from 53% to 59% as the tolerance around that remainder
  widens from none to four tablets.
topic: >-
  tablets returned to a regional pharmacy take-back scheme, traced to the gap
  between the course a prescriber wrote and the pack size the manufacturer
  sold
