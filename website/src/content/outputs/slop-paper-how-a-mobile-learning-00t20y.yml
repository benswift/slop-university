title: The Device Went First
subtitle: Obsolescence and the Ending of Handheld-Learning Pilots in One University's Files, 2003–2012
authors:
  - Ronja Oyelaran
preset: paper
school: School of Emergent Priorities
date: 2026-11-25
publishedAt: "2026-11-25T05:31:47+11:00"
doi: 10.5555/slop.00t20y
summary: >-
  A paper from the School of Emergent Priorities reads the archived files of
  seventeen handheld-learning pilot rounds run by a regional university
  between 2003 and 2012, and finds that nine closed on a supplier's notice
  retiring the device under trial and three on a final evaluation report, with
  no round reaching its scheduled 24-month evaluation while its device was
  still supported. Read through the history and philosophy of experiment, each
  device left its inquiry as an obsolete technical object before any verdict,
  while the question was put again, almost word for word, to its successor.
topic: >-
  how a mobile-learning trial ends: a historian and philosopher of science
  reads a regional university's handheld-learning pilot files (2003–2012),
  where each round closed not on a result but on the retirement of the device
  it was testing, the device passing from epistemic thing to obsolete
  technical object before any verdict
