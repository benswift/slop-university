title: Towards Self-Governing
subtitle: >-
  Five years of the Pairing Readiness Ladder, and the franchise branches it
  never let off the queue
authors:
  - Thandiwe Solberg
  - Sten Okwuosa
  - Marit Osayande
preset: impact-report
school: School of Continuous Improvement
date: 2026-09-17
