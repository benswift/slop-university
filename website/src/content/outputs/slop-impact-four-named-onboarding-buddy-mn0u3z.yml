doi: 10.5555/slop.mn0u3z
summary: >-
  A five-year impact report from the School of Continuous Improvement traces
  the Pairing Readiness Ladder from an Indicator Commons rubric to a
  condition of franchise trust: a branch that sustains a Calibrated pairing
  practice for four consecutive review cycles earns the right to pair its
  own new starters, while every other branch has its pairings assigned from
  a head-office queue with no discretion clause. 68 franchise partners have
  put the Ladder to work since 2021, and 41% of assessed branches now
  qualify to choose for themselves.
topic: >-
  Four named onboarding-buddy levels, reassessed at every induction intake,
  now decide whether a franchise branch may pair its own new starters or
  must accept a head-office assignment
