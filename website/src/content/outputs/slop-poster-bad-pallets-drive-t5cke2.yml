summary: >-
  A research poster from the School of Continuous Improvement treats the empty
  pallet of a regional produce market as a commodity money exchanged at a fixed
  rate between unequal coins, grading every pallet on 9,412 exchange dockets
  from 38 traders against the stock each trader holds back in the yard. It
  reports that where the market's by-law compels acceptance at par the worse
  pallet circulates and the sound one is hoarded or exported, that at private
  doors a sound pallet draws a premium, and that a hall which moved to graded
  exchange saw the gap between pallets tendered and pallets held nearly close.
topic: >-
  Bad pallets drive out good: Gresham's law in a one-for-one pallet exchange at
  an unnamed regional produce market, where every pallet swaps at par whatever
  its condition
