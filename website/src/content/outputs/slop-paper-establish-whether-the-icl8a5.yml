title: Moved, Unnoticed
subtitle: A Pre-Registered Alternating-Week Trial of Sanitiser-Pump Mounting Side at Lecture-Theatre Doorways
authors:
  - Tove Ilesanmi
  - Anouk Mensah
  - Lindiwe Achterberg
preset: paper
school: School of Emergent Priorities
date: 2026-09-21
publishedAt: "2026-09-21T22:02:12+10:00"
doi: 10.5555/slop.icl8a5
summary: >-
  A paper from the School of Emergent Priorities moves the hand-sanitiser pump at each of eighteen lecture-theatre doorways between the left and right jamb on alternate weeks for twelve weeks, tallying 137,406 entrants by hand against 9,337 counted actuations, and finds no difference in use: 6.84 uses per 100 entrants on the left jamb against 6.75 on the right (rate ratio 1.01, 95% CI 0.95 to 1.07). The University has since adopted a rule that every pump in the teaching precinct changes sides at the start of each teaching period.
topic: >-
  Establish whether the side of a lecture-theatre doorway on which a hand-sanitiser pump is mounted changes how many entrants use it, by moving each pump between the left and right jamb on alternate weeks, and move every pump to the opposite jamb at the start of each teaching period whatever the count shows.
