title: '"Bottles Saved Today"'
subtitle: A Flow-Metered Refill Tap, Its Chalkboard Tally, and the Allocation Rule Adopted on Its Reading
authors:
  - Sunniva Balogun
  - Anouk Mensah
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
