doi: 10.5555/slop.w7f374
summary: >-
  A paper from the School of Emergent Priorities describes a flow-metered
  drinking tap, built by a precinct's refill-station steward, that converts
  dispensed volume into 600 mL bottle-equivalents and posts the running total
  on a chalkboard-style display. Across six foyer taps and one twelve-week term,
  the pooled median weekday tally rose from 181 to 469 once Facilities
  apportioned the term's plastics-reduction allocation by each nearest tap's
  reading, whether or not the tap carried a display, and Facilities has adopted
  the apportionment as a standing rule with no deduction and no in-term
  recalibration.
topic: >-
  The refill-station steward of a campus foyer builds a flow-metered water tap
  with a chalkboard display reading "Bottles saved today", and the school ties
  the term's plastics-reduction allocation to the display's daily tally with no
  override once passers-by begin filling and tipping out bottles for the count
