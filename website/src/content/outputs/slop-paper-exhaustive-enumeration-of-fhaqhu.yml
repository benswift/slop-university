title: Every Hole in a Twelve-Bit Repertoire
subtitle: Exhaustive enumeration of r-contiguous negative selection, and what the thymus pays for showing only part of self
authors:
  - Ylva Ogunbanjo
  - Mirela Hanke
preset: paper
school: School of Emergent Priorities
date: 2026-10-29
publishedAt: "2026-10-29T16:00:16+11:00"
doi: 10.5555/slop.fhaqhu
summary: >-
  A paper from the School of Emergent Priorities enumerates every receptor,
  peptide and match in a 4,096-string binary model of thymic negative selection
  under r-contiguous matching. With all of self presented, the share of foreign
  peptides no survivor can see passes one half near a match length of log2 of
  the self-set size, and every such hole lies within L − r bits of self; when
  the thymus presents only part of self, the presented peptides shield the rest
  only at match lengths where holes are already large.
topic: >-
  Exhaustive enumeration of a twelve-bit string model of thymic negative
  selection under r-contiguous matching: every foreign peptide the surviving
  repertoire cannot see, and every self-reactive receptor that escapes when the
  thymus shows only part of self
