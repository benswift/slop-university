summary: >-
  An ethnography of a home-educating network's Tuesday meet in a riverside
  council reserve follows the question passing strangers put to its children
  during school hours, and the answers given to it across twenty-nine meets.
  It finds that parents answer with excuses borrowed from the school, while the
  children come to answer with a timetable of their own, an answer they teach
  one another, and argues that the meet, which breaks up just before the bell
  across the road, keeps school time in public.
topic: >-
  An ethnography of a home-educating network's weekday park gatherings,
  following the question strangers put to the children --- no school today?
  --- and the answers families learn to give for being out of school during
  school hours
