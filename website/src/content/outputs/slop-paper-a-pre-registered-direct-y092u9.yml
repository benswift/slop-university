title: Nobody Rang the Second Time
subtitle: >-
  A Pre-Registered Direct Replication of a Lost-Pet Flyer Reward Trial in a
  Second Metropolitan District
authors:
  - Dagny Okafor
  - Sten Okwuosa
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-08-01
publishedAt: 2026-08-01T16:04:33+10:00
doi: 10.5555/slop.y092u9
summary: >-
  A paper from the School of Continuous Improvement reports a pre-registered
  direct replication of an earlier Slop University field trial, randomising 47
  residential streets in a second metropolitan district across five stated
  reward levels over 1,142 street-weeks. The effect of stating any reward on the
  weekly probability of a tip-off call is 1.9 percentage points (95% CI -4.6 to
  8.4), an interval excluding both the original 15.2-point estimate and the
  small-telescopes detectability threshold without establishing equivalence to
  zero; the Reward-Tier Schedule re-cut on the original estimate remains in
  force, its amendment pathway providing only for a superseding estimate.
topic: >-
  a pre-registered direct replication of the University's own lost-pet-flyer
  reward finding, run on the streets of a different metropolitan district, where
  the reported lift in tip-off calls does not reproduce --- and a reward-tier
  schedule that was already re-cut on the original result before anyone tried to
  check it
