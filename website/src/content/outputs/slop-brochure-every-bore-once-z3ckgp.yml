summary: >-
  A prospectus brochure from the School of Underlying Conditions invites
  prospective students to study the field round itself: the order of stops, the
  capacity of the vehicle's tray and the hours each stop keeps, across the
  School's groundwater fieldwork, core collection and soil survey. It presents
  the planning of the day's route as the first piece of science done on it.
