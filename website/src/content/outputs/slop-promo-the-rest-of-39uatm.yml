summary: A short profile of Dr Petra Umbile, Postdoctoral Fellow in the School of
  Emergent Priorities, told largely in her own words. A scientometrician by training,
  Dr Umbile describes her work on what a count leaves out, from the volunteers missing
  from a hall's honour board to the instructions a pet-sitting booking form never
  asks for and the unscored conversation inside a performance review. The video also
  marks the citation record that gives her the second-highest h-index in the School.
