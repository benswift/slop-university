doi: 10.5555/slop.07p5i5
summary: >-
  A research poster from the School of Underlying Conditions logs 1,106
  sprayer washdown and fill events across one spraying season on 38 mixed
  cropping and sheep farms, and finds that washing happens within a hose-length
  of the nearest yard tap, which on most farms draws on the house bore. On the
  15 farms with a bunded washdown pad, 23% of washdowns used it, and the water
  table lay at a median 7.1 m beneath the most-used washdown spot against
  14.8 m beneath the pad.
topic: >-
  where sprayer washdown actually happens on mixed farms: at the nearest tap,
  usually beside the house bore, and the depth to the water table beneath it
