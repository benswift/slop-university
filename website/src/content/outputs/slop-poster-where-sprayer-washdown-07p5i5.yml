title: As Far as the Hose Reaches
subtitle: Where Sprayer Washdown Happens on Mixed Farms, and the Water Table Beneath It
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: research-poster
school: School of Underlying Conditions
