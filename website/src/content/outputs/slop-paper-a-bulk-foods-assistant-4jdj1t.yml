title: Notes on the Bottom of the Bin
subtitle: Five Levels of Scoop-Bin Turnover and the Refill Rule the University Set for Its Own Canisters
authors:
  - Ingeborg Nwachukwu
  - Joost Nwosu
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-10-04
publishedAt: "2026-10-04T06:01:55+11:00"
doi: 10.5555/slop.4jdj1t
summary: >-
  A paper from the School of Continuous Improvement scores 52 independent
  bulk-foods stores against a five-level Bin Turnover Maturity Model and seeds
  312 bins with a dyed teaspoon of their own product at the base, finding median
  time to first sighting falls from 74 days at Level 1 to 9 at Level 4 and 8 at
  Level 5, with the last two indistinguishable. The University now refills every
  tea, sugar, coffee and oat canister in its buildings only after it has been
  emptied to its base and a second member of staff has countersigned the Bottom
  Sighting.
topic: >-
  A bulk-foods assistant tops up a scoop bin before it empties, so the bottom
  layer is never seen; a maturity model of named bin-turnover levels scores
  independent bulk stores, and the University binds its own canister refills to
  a stated level
