title: Whose Dish Is This?
subtitle: >-
  A twelve-month serialised custody study of the bring-a-plate container
  circuit across three suburbs
authors:
  - Marek Solheim
  - Iben Chikere
  - Joost Nwosu
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-19
publishedAt: "2026-08-19T00:04:03+10:00"
doi: 10.5555/slop.c6qvwq
summary: >-
  A research poster from the School of Emergent Priorities reports a
  twelve-month serialised custody study of 412 bring-a-plate containers across
  87 households in three suburbs, logging transfers at the door of 61
  gatherings against monthly whole-shelf kitchen audits. The fleet remains
  96.8% accounted for while owner retention decays to 23.5%; holdings pool with
  the most frequent hosts (r = 0.71), and the circuit's residents' association,
  satisfied at fleet level, closes its lost-property list with zero recorded
  losses.
topic: >-
  Where does the casserole dish go after the street barbecue? Twelve months of
  serialised custody tracking across three suburbs' bring-a-plate circuit finds
  every container survives but almost none returns to its owner --- dishes pool
  at whichever household hosts most --- and the residents' association,
  satisfied the fleet is intact, closes its lost-property list and records the
  season's loss rate as zero.
