summary: >-
  A research poster from the School of Emergent Priorities estimates the direct
  rebound after 23 of 41 community sports grounds in one regional association
  retrofitted their floodlights with LED lamps under a small-grants round,
  finding a realised electricity saving of 40% against an engineered 54%. The
  take-back of about a quarter comes as extra floodlit hours and concentrates at
  grounds that were rationing evening training slots before the retrofit.
topic: >-
