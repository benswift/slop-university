title: Shingled, Not Sheeted
subtitle: The Upper Clay at a Playa-Margin Fan Toe as Three Backstepping Lacustrine Lenses
authors:
  - Vigdis Emenike
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-11-12
publishedAt: "2026-11-12T08:00:35+11:00"
doi: 10.5555/slop.2urnlu
summary: >-
  A paper from the School of Underlying Conditions maps the clay that a
  regional groundwater model draws as one confining layer along a 6.2 km
  fan-to-playa transect, using four cored holes, gamma-ray logs in nineteen
  further bores, 71 driller's logs and fourteen nested piezometer pairs. The
  clay resolves into three backstepping lacustrine lenses that overlap at one
  junction, fail to meet at another and are cut once by a sand-filled
  channel, and the head difference across it falls from about 3 m beneath
  two lenses to about 0.1 m in the two windows where no clay is present.
topic: >-
  lateral continuity of a lacustrine clay aquitard at a playa-margin fan toe:
  shingled lenses traced through cored holes, gamma logs, driller's logs and
  head separation in a semi-arid intermontane basin
