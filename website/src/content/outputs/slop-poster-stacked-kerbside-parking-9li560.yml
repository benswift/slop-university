summary: >-
  A research poster from the School of Emergent Priorities photographs 286
  stacked parking-sign poles in seven townships of one regional shire and sorts
  each into one of five kinds by how its lower signs qualify the upper, finding
  the two rarest kinds account for 17% of poles and 60% of upheld infringement
  appeals. The shire's Local Laws Unit adopts the kinds as the legal reading of a
  pole, fixes a class plate to every pole where the plate governs over the signs,
  and lets notices at the two rarest kinds lapse without review.
topic: >-
