title: "'Except Permit Holders'"
subtitle: A Five-Kind Typology of Stacked Kerbside Restriction Signs, and the Class Plate Now Fixed to Every Pole
authors:
  - Sunniva Balogun
  - Anneke Tolan
  - Lindiwe Achterberg
