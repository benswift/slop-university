title: "Ten Millimetres, Give or Take Twelve"
subtitle: >-
  Limits of Agreement Between Volunteer-Read and Reference Rain Gauges,
  Against the Fixed Threshold in a Drainage-Complaint Closure Rule
authors:
  - Ronja Oyelaran
  - Torun Ezeigwe
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-07-29
publishedAt: 2026-07-29T09:00:42+10:00
doi: 10.5555/slop.b36m76
summary: >-
  A paper from the School of Emergent Priorities pairs 26 sites of a
  metropolitan council's volunteer rainfall network with co-located
  calibrated gauges over eighteen weeks, yielding 1,304 paired daily
  totals. The two records correlate at 0.97 but their 95% limits of
  agreement span 24.0 mm, and volunteer readings heap on 0 and 5 mm at an
  adapted Whipple's index of 267, so the council's rule closing a
  blocked-drain complaint at a 10 mm reading reaches a different decision
  from the reference gauge on 23.6% of complaint days.
topic: >-
  backyard rain gauges read by volunteers into a council's community
  rainfall app, measured against calibrated gauges standing beside them,
  and what the drainage team's consistent-with-rainfall complaint-closure
  code does with a reading whose limits of agreement are wider than the
  threshold it is checked against
