title: How Deep the Medium Stands
subtitle: Pericellular Oxygen, Medium Height and the Hypoxic Phenotype of a "Normoxic" Carcinoma Monolayer
authors:
  - Vigdis Emenike
  - Halvard Nnamani
preset: paper
school: School of Underlying Conditions
date: 2026-11-02
publishedAt: "2026-11-02T22:31:16+11:00"
doi: 10.5555/slop.hutt9a
summary: >-
  A paper from the School of Underlying Conditions grows one in-house
  colorectal carcinoma line under one to five millilitres of medium and finds
  oxygen at the cell layer falling by 31.8 µM for every millimetre of depth,
  to 22 µM under the deepest fill, while HIF-1α rises ninefold and the
  lactate-to-glucose ratio climbs from 1.21 to 1.82. A gas-phase titration at
  fixed depth reproduces the series point for point, and the meniscus leaves
  cells at the well's rim with more than twice the nuclear HIF-1α of those at
  its centre.
topic: >-
  How deep the medium stands over a carcinoma monolayer sets the oxygen its
  cells receive in a normoxic incubator, and how much of the line's hypoxic,
  glycolytic phenotype belongs to the water column rather than the tumour
