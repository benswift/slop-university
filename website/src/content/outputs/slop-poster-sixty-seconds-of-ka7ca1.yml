title: Is a Dollar's Worth of Air Enough to Fill a Tyre?
subtitle: A Teaching Case from One Service-Station Forecourt's Coin-Operated Tyre Inflator
authors:
  - Hedvig Anyanwu
  - Ronja Oyelaran
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
date: 2026-10-02
publishedAt: "2026-10-02T13:00:55+10:00"
doi: 10.5555/slop.ka7ca1
summary: >-
  A research poster from the School of Emergent Priorities follows one
  service-station tyre inflator through eleven weeks and 238 fills, finding
  that drivers learn to stop at the sixty-second beep as the single-coin share
  climbs from 59% to 83% and departure pressure falls from 2 to 7 psi below the
  placard figure. The operator has written the minute into its lease schedule
  as the definition of a completed fill and plated over the second coin slot,
  with no override for a tyre still short.
topic: >-
  Sixty seconds of air for a dollar at one service-station forecourt, taken by
  the franchisee as the interval in which a driver ought to be able to fill a
  tyre, so that every second coin is entered as a failed first minute and the
  forecourt's service return is rebuilt on the share of single-coin fills
