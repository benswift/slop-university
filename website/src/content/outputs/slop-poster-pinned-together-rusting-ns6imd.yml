summary: >-
  A research poster from the School of Emergent Priorities surveys 3,047
  fastened bundles in one library's trade-literature deposit and finds that
  1,214 pin a later price list to an older catalogue, recording catalogues kept
  in use and re-priced for up to a decade. For 58% of the associations the
  fastener or its rust offset is the only evidence, so the poster sets out a
  record-before-removal protocol for conservation de-fastening.
topic: >-
  Pinned together: rusting fasteners in a library's trade-literature deposit as
  the only record of how its price lists and catalogues were used, and what
  conservation de-fastening removes
