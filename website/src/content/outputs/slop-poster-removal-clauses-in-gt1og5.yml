summary: >-
  A research poster from the School of Settled Matters codes the removal
  clauses in 58 licences, 1974 to 2019, under which one congregation lets
  another faith use its building, by class of object and by who bears the
  duty. Across renewals the duties to remove furniture, food stores and
  instruments lapse first while images and scripture stay the guest's to carry
  out, and in 19 licences the host undertakes to veil its own images; the
  poster reads the drift as a working theology of hospitality, settled object
  by object.
topic: >-
  Removal clauses in shared-worship licences as a working theology of
  interreligious hospitality
