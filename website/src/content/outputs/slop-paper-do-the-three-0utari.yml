title: Rounds, Not Helices
subtitle: Probing Hypergraph Embeddings of a Regional Innovation Register for University, Industry and Government
authors:
  - Joost Nwosu
  - Kwame Lindqvist
preset: paper
school: School of Continuous Improvement
date: 2026-11-13
publishedAt: "2026-11-13T12:00:51+11:00"
doi: 10.5555/slop.0utari
summary: >-
  A machine-learning paper from the School of Continuous Improvement embeds
  twelve funding rounds of one regional innovation program's project register,
  1,286 university–industry–government projects among 734 organisations, as a
  hypergraph and probes the learned representations for sector. Funding round
  and program stream are recovered well above chance, but sector barely exceeds
  a probe given node degree alone, and probes fitted round by round fall to that
  baseline after the program dropped its university-lead rule.
topic: >-
  do the three helices show up in the embedding: probing hypergraph
  representations of a regional innovation register's university-industry-government
  projects for sector, and finding funding rounds rather than sectors organise
  the space
