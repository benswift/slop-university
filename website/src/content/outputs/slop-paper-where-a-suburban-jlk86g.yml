title: Nobody Can Get to K
subtitle: Restarts, Rehearsal Letters and the Joins of a Contest Test Piece in a Suburban Brass Band
authors:
  - Dagny Okafor
preset: paper
school: School of Continuous Improvement
date: 2026-11-05
publishedAt: "2026-11-05T16:01:18+11:00"
doi: 10.5555/slop.jlk86g
summary: >-
  A paper from the School of Continuous Improvement logs all 1,163 stops a
  suburban brass band's musical director called across 22 rehearsals of an
  unpublished contest test piece, and finds them moving over fourteen weeks
  from the nine passages she named as difficult to the bars either side of
  the piece's rehearsal letters. Because 93 per cent of restarts were taken at
  a letter or the bar before one, the paper argues, the band practised each
  letter from a standing start and seldom practised arriving at it.
topic: >-
  where a suburban brass band's rehearsals stop: one season of stopping points
  in preparing a contest test piece, and how the stops migrate from the hard
  passages to the joins between sections learned apart
