title: As the Transition Proceeds
subtitle: Presupposed Futures and the Definite Article in Twenty-Nine Editions of a Regional Energy Outlook
authors:
  - Odalys Penhallow
preset: paper
school: School of Settled Matters
date: 2026-11-09
publishedAt: "2026-11-09T19:02:18+11:00"
doi: 10.5555/slop.mycn1a
summary: >-
  A paper in linguistics from the School of Settled Matters codes 3,846
  future-state tokens across twenty-nine annual editions of one regional
  energy agency's outlook statement, on a five-level scale running from
  conditional possibility to presupposition by a definite noun phrase.
  Seventeen of twenty-three recurring forecasts climbed into presupposition,
  none was hedged again once there, and the definite "the transition"
  overtook the indefinite "a transition" in the 2009 edition.
topic: >-
  how an energy agency's annual outlooks moved their forecasts from hedged
  assertion into presupposition, and when 'a transition' became 'the
  transition'
