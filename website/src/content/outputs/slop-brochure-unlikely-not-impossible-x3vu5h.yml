summary: >-
  A civic brochure from the School of Underlying Conditions invites the
  University's neighbours to weigh, alongside its researchers, the rare and
  slow things the ground beneath their district might one day do, through the
  School's groundwater fieldwork, the Basement Relations Group's honest account
  of lost core, and the public sessions of Futures in Committee where unlikely
  possibilities are placed in view rather than set aside. It rests the
  invitation on six published studies cited by title and DOI.
