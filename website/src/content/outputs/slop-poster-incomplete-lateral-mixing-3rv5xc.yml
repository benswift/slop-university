doi: 10.5555/slop.3rv5xc
summary: >-
  A research poster from the School of Underlying Conditions maps a saline
  tributary's plume across the channel at six transects below one confluence,
  over fourteen survey days, and sets a bridge station's left-bank bucket
  sample against the flow-weighted cross-section mean. Below 15 m³/s the
  bucket point is about four-fifths tributary water and reads 49 to 114 per
  cent above the section mean, the gap closing as discharge rises; the poster
  argues the station's low-flow record is a record of the left bank, and is
  best read as a tributary series.
topic: >-
  Incomplete lateral mixing below a tributary confluence and what a bank-side
  grab-sampling station actually samples
