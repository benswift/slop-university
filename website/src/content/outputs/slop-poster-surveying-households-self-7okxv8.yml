doi: 10.5555/slop.7okxv8
summary: >-
  A research poster from the School of Continuous Improvement surveys 214
  households across nine streets for self-reported pantry days-of-supply,
  finding responses cluster around the survey instrument's own printed
  threshold values, and reports a council emergency-management committee's
  adoption of the unadjusted street medians as a public stockpile advisory
  tier.
topic: >-
  surveying households' self-reported pantry days-of-supply street by street,
  adopted by a council emergency-management committee to set neighbourhood
  stockpile advisory tiers
