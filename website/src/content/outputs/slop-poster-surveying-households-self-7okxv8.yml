title: How Long Would a Street's Pantries Actually Last?
subtitle: Self-reported supply distributions and the making of a council stockpile
  advisory tier
authors:
  - Osei Vandermeer
  - Solveig Adeyemi
preset: research-poster
school: School of Continuous Improvement
