summary: >-
  A research poster from the School of Continuous Improvement scores 54
  community-transport, taxi-co-op and depot operators against five named
  Arrival-Ping Maturity levels. Thirty-three sit at Pinned, where the median
  ping-to-pin distance is 49 m; travel reimbursement is now restricted to
  Sighted or Attested, and a ping more than 40 m from the booked pin is an
  ineligible fare.
