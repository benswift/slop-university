title: A Settled Solution
subtitle: Legal Senses of Shared Words in Combined Law–Science Students' Explanations of Aqueous Solutions
authors:
  - Clemency Tredinnick
  - Anselm Threlkeld
  - Vigdis Emenike
preset: paper
school: School of Settled Matters
