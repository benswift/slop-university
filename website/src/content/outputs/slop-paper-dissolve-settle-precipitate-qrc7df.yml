doi: 10.5555/slop.qrc7df
summary: >-
  A paper from the School of Settled Matters follows 58 students taking
  first-year law and first-year chemistry in the same semester, against 112
  taking the chemistry alone, through three rounds of written explanations of
  salt in water, and codes each use of dissolve, settle, bond and precipitate
  for the sense it carries. The legal sense of dissolve changed who did the
  dissolving in students' sentences without adding to accounts of salt
  disappearing, while the legal sense of settle, taught three weeks before
  equilibrium, kept nearly half the combined-degree students describing a
  saturated solution as a finished state after equilibrium had been taught,
  against just over a quarter of the comparison group.
topic: >-
  dissolve, settle, precipitate: how students taking first-year law and
  first-year chemistry in the same semester carry each subject's sense of the
  shared words into their written explanations of what happens in aqueous
  solutions
