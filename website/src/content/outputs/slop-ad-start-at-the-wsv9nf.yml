summary: >-
  A marketing poster for Slop University draws a river catchment as a
  branching tree of monitoring bores, every outermost tip capped in gold and a
  lone geologist kneeling at one of them, as the hook for a published paper
  proving that the leaves of a tree-shaped monitoring network are the smallest
  set of bores able to place a tracer release without knowing when it began.
  Developed for campus digital signage in a landscape rotation.
topic: >-
