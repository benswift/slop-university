title: Already Past the First Peak
subtitle: Sub-threshold Shock-Cooling Excesses in Forced Photometry of 38 Stripped-Envelope Supernovae Logged as Single-Peaked
authors:
  - Ronja Oyelaran
  - Casimir Beng
preset: paper
school: School of Emergent Priorities
date: 2026-11-24
publishedAt: "2026-11-24T06:01:02+11:00"
doi: 10.5555/slop.jbsfu6
summary: >-
  A paper from the School of Emergent Priorities returns to the difference
  images taken before the first alert for 38 stripped-envelope supernovae that
  one survey's classification log records as single-peaked, and finds a
  shock-cooling excess in 11 of them (6 of 9 Type IIb, 4 of 15 Ib, 1 of 14 Ic)
  against a false-excess rate of 2.3% at 400 control positions. The excesses
  lie a median 0.9 mag below the single-epoch detection limit, imply extended
  envelopes of 0.02 to 0.28 solar masses, and move each inferred explosion
  epoch a median 1.8 days earlier than the one in the record.
topic: >-
  Forced photometry of the pre-discovery survey images of stripped-envelope
  supernovae already logged as single-peaked, recovering sub-threshold
  shock-cooling excesses and the extended-envelope masses they imply
