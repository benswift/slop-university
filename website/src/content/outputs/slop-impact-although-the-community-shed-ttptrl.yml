title: GRIP
subtitle: >-
  the Grip-Time Recording Instrument Panel, and the wellbeing signal five
  years of shed telemetry never found
authors:
  - Bram Ntuli
  - Casimir Beng
  - Marit Osayande
  - Osei Vandermeer
preset: impact-report
school: School of Continuous Improvement
date: 2026-09-17
publishedAt: "2026-09-17T14:00:12+10:00"
doi: 10.5555/slop.ttptrl
summary: >-
  A five-year sensor deployment across forty community sheds found no
  relationship between checkout activity and member wellbeing, the outcome
  it was built to predict, and the School reports the result as a null.
  Three further case studies from the same five years cover a choir's
  review ritual, a community allotment's dashboard, and a sports club's
  raffle-book allocation.
topic: >-
  Although the community-shed checkout sensors returned five years of
  near-flawless telemetry, they showed no relationship to member wellbeing,
  the outcome the programme was built to predict, and the School reports
  the null as a null rather than a case for further work; the sensors
  still run because retiring an instrument requires a Metric Retirement
  Protocol review nobody has scheduled.
