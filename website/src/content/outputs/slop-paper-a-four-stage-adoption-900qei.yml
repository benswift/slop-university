title: The Cursor Kept the Minutes
subtitle: >-
  A Four-Stage Maturity Model for Call-Centre Activity Trackers, Tested
  Against Escalation, Complaints, and Internal Recognition Across Forty
  Floors
authors:
  - Verity Marris
  - Anouk Mensah
  - Casimir Beng
preset: paper
school: School of Emergent Priorities
date: 2026-08-08
publishedAt: "2026-08-08T00:04:03+10:00"
doi: 10.5555/slop.900qei
summary: >-
  A paper from the Schools of Emergent Priorities and Continuous Improvement
  audits forty call-centre floors against a four-stage maturity model of
  agent activity tracking, from a rostered break sheet to a continuous
  idle-seconds score. Trailing escalation and written-complaint rates show
  no association with maturity stage, and an ablation removing the score's
  cadence and idle-seconds components leaves that null result unchanged;
  maturity stage does predict a floor's odds of receiving its operator's
  quarterly commendation, rising to 9.7 times the odds of the least-tracked
  floors at the most granular stage.
topic: >-
  a four-stage adoption maturity model for call-centre keystroke-and-mouse
  activity trackers, from the rostered break sheet to a live idle-seconds
  score standing in for call quality, tested against escalation and
  complaint rates across forty floors
