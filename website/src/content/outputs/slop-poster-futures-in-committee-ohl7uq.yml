summary: >-
  A research poster from the School of Emergent Priorities restages the
  University's booked-but-empty study-room release-agent finding against
  the is-typing indicator in twenty-two neighbourhood street and stairwell
  group chats. Auto-clearing a typing bubble after eight minutes leaves
  median dead-air unchanged (11.2 min control, 10.9 min treatment, pooled
  r = 0.06); the pre-registered 20 percent shortening is met at none of
  eleven matched pairs. Futures in Committee standing instruction 2026/38
  nonetheless adopts the eight-minute window as the floor-release rule for
  every University-sponsored chat, with no ordinary override.
topic: >-
  Futures in Committee restages the University's booked-but-empty
  study-room release-agent finding against the is-typing indicator in
  neighbourhood street group chats. The grace window that lifted room
  utilisation does not reproduce: auto-clearing a typing bubble after
  eight minutes leaves dead-air just as long. On the strength of the null,
  the Committee adopts an eight-minute typing-occupancy protocol as the
  standing floor-release rule for every University-sponsored chat, with no
  ordinary override.
