doi: 10.5555/slop.dln6j2
summary: >-
  A research poster from the School of Emergent Priorities follows 318
  owner-managed family manufacturers through the decade before the owner's
  exit, finding that firms with no named successor begin cutting capital
  expenditure seven years out and reach 2.1% of assets at exit against 6.4%
  for firms with one, four years before their sales diverge.
topic: >-
  Winding down without deciding: an event study of capital expenditure in
  family-owned manufacturers whose owners never name a successor, finding
  investment falls away years before the owner exits
