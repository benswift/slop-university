title: Least Worried, Most Watched
subtitle: >-
  Classifying Why Households Reach for a Shared Streaming Box's Guest
  Profile Against How Much Extra Viewing Time Each Reason Actually Adds
authors:
  - Runa Adegoke
  - Anneke Tolan
preset: paper
school: School of Emergent Priorities
date: 2026-07-26
doi: 10.5555/slop.fjil31
summary: >-
  A paper from the School of Emergent Priorities interviews 58 households
  about why they invoke a shared streaming device's Guest profile against
  their own declared screen-time cutoff, coding the stated reasons into a
  four-category taxonomy and cross-referencing each against the
  household's own 90-day device log. The category parents rank as most
  worrying accounts for only a modest share of the resulting excess
  viewing minutes; the category they worry about least accounts for
  nearly half.
topic: >-
  interviewing parents about why they reach for a shared streaming box's
  Guest profile to lift a child's screen-time cutoff, then classifying the
  stated reasons against how much extra viewing time each one actually
  adds in the household's own device log
