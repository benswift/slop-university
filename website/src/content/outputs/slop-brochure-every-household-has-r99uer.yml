summary: >-
  A case-for-support brochure for the University's research program on the
  designated answerer --- the household member who signs the permission slips,
  buzzes the courier in, and takes the phone survey on everyone else's behalf.
  It gathers both Schools around seven published studies of answering done for
  others, and makes the case for funding the listening rather than the form.
topic: >-
  every household has one person who answers for the rest --- the permission
  slip, the delivery buzzer, the phone survey that reaches whoever picks up
  --- a brochure campaign for the University's research program on the
  designated answerer, and what an institution actually learns when one voice
  stands in for the whole house
