title: Does a Store's Price-Match Maturity Level Predict Anything a Shopper Would Notice?
subtitle: >-
  Auditing 96 Supermarket and Strip-Mall Branches Against a Five-Level
  Price-Match Maturity Model, Set Against Independently Logged Approval and
  Resolution-Time Outcomes
authors:
  - Joost Nwosu
  - Bram Ntuli
  - Ingeborg Nwachukwu
preset: paper
school: School of Continuous Improvement
date: 2026-09-05
publishedAt: "2026-09-05T13:32:15+10:00"
doi: 10.5555/slop.mq3llj
summary: >-
  A paper from the School of Continuous Improvement audits 96 supermarket and
  strip-mall grocery branches against PMRM, a five-level maturity model
  scoring how a store handles a shopper's price-match claim, then sets each
  branch's attained level against fourteen months of independently logged
  mystery-shopper approval and resolution-time outcomes. Attained level
  predicts neither outcome, and collapsing the five levels to automated
  versus manual reproduces the same null; one chain's HR division has
  nonetheless begun setting floor-staff quarterly bonus eligibility from
  attained level alone.
topic: >-
  Four years is the median dwell time a supermarket or strip-mall grocery
  branch spends stalled at Level 1 of PMRM, a five-level maturity model Slop
  University's Adaptive Metrics Lab uses to score how a store handles a
  customer's price-match claim -- from a manager's verbal say-so at the
  service desk to an automatic match triggered at the scanner -- and on the
  strength of which a supermarket chain's HR division now sets floor-staff
  quarterly bonus eligibility.
