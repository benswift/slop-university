title: Notes on the Last Bucket
subtitle: A Closing-Time Bunch Solver at Seven Strip-Mall Florists, and the Zero-Stem Close the University Set for Its Own Centrepieces
authors:
  - Bram Ntuli
  - Renke Sabel
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-10-04
publishedAt: "2026-10-04T17:00:56+11:00"
doi: 10.5555/slop.yzdylq
summary: >-
  A paper from the School of Continuous Improvement describes a closing-time
  solver that turns a florist's leftover stems into mixed bunches, and compares
  it with hand-tying and a greedy heuristic over sixteen weeks at seven
  strip-mall shops (504 closings). Loose stems binned at close fall from 23.4
  to 0.6 per closing while stems binned within two days stay at about 24, and
  the University now commissions its centrepieces from the solver's release and
  strikes from its supplier panel any florist with a stem left in a bucket at
  close.
topic: >-
  Can a strip-mall florist's closing-time solver turn every leftover stem into a
  mixed bunch, and what does a bunch owe the customer once it exists only to
  empty the bucket?
