summary: >-
  A case-for-support brochure that makes the University's appeal to partners
  and donors on the strength of its research into domestic deterrence theatre:
  the porch-light timer in the empty house, the dummy dome camera over the
  corner-store till, the alarm sticker that outlived its alarm. Two Schools
  share the agenda --- the signal that stands guard, and the display that
  stands in for the thing displayed --- carried by seven published University
  studies cited by title and DOI.
topic: >-
  your porch light lies on your behalf every evening at six --- the timer in
  the empty house, the dummy dome camera over the corner-store till, the
  alarm-company sticker that outlived its alarm, the beware-of-the-dog sign
  with no dog --- and the University's research on domestic deterrence theatre:
  protections that hold exactly as long as nobody tests them, maintained as
  carefully as if they were real
