summary: >-
  A research poster from the School of Emergent Priorities surveys 163
  members of a suburban cycling club on their comfort with the club's single
  road-position rule, reported as a distribution across its four pace-group
  bunches. Comfort falls sharply from the fastest bunch to the slowest, and
  the committee has mandated rear-facing camera compliance logging for the
  least-comfortable bunch, with no review date set.
topic: >-
