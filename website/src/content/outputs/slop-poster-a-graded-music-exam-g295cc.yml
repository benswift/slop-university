title: Credit Line, Front Row
subtitle: >-
  A Natural Experiment on a Youth Orchestra's Exam-Mark Stand Split and Next
  Season's Re-Enrolment
authors:
  - Solveig Adeyemi
  - Mirela Hanke
  - Torun Ezeigwe
