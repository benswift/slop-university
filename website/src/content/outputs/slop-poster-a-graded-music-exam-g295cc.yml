summary: >-
  A research poster from the School of Continuous Improvement exploits the
  naturally occurring pass/credit boundary on a graded music exam as a
  regression-discontinuity design, finding that a suburban youth orchestra's
  front-stand placement itself lifts next-season re-enrolment at the
  boundary, independent of examiner-rated technique.
topic: >-
  a graded music-exam pass-mark cutoff sorts a suburban youth orchestra's
  players into front and back stands each season, exploited as a natural
  quasi-experiment on whether the stand split itself changes next season's
  re-enrolment
