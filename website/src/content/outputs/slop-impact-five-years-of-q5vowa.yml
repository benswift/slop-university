summary: The School of Continuous Improvement's Impact Report 2021-2026 recounts
  five years of consent-based recording in 1,412 review meetings across 64
  collaborators, where voice-activity detection and speaker diarisation found the
  chair's closing question followed by a median 1.6 seconds of silence in monthly
  performance reviews against 4.3 seconds in after-action reviews, the basis of a
  4.2-second held pause now standing practice on three collaborators' panels. It
  also reports a first-sentence convention for 9,860 typed and spoken field
  reports, and a room-tone protocol that cut an operations room's eleven alert
  tones to five.
topic: five years of the School recording its review meetings and spoken incident
  reports, and building speech and audio instruments to hear who speaks, for how
  long and what goes unsaid
