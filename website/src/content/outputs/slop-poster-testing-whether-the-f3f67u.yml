doi: 10.5555/slop.f3f67u
summary: >-
  A research poster from the School of Continuous Improvement asks 288 adults
  to complete 1,152 household rosters from memory for described households,
  under one of four instructions. Starting with the youngest resident cut infant
  omission from 21% to 4% but raised lodger omission from 26% to 38%, leaving
  the number of residents left off per roster unchanged; only coverage prompts
  lowered it.
topic: >-
  testing whether the starting point a census household roster prescribes
  changes which residents people leave off when they enumerate a described
  household --- an experimental study of omission by retrieval cue
