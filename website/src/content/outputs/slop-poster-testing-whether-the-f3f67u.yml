title: Where the List Begins
subtitle: >-
  Starting rules and resident omission in a simulated household roster
authors:
  - Renke Sabel
  - Signy Okpara
  - Ylva Onyekwere
preset: research-poster
school: School of Continuous Improvement
date: 2026-11-04
