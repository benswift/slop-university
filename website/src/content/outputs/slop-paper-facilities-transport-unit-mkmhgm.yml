title: Rescoring the Kiss-and-Drop
subtitle: >-
  A Failed Replication of a Frozen-Cap Parking-Permit Null Result at a Primary
  School's Car Park
authors:
  - Mirela Hanke
  - Kwame Lindqvist
  - Osei Vandermeer
  - Anouk Mensah
preset: paper
school: School of Continuous Improvement
date: 2026-08-30
publishedAt: "2026-08-30T00:05:16+10:00"
doi: 10.5555/slop.mkmhgm
summary: >-
  A paper from the School of Continuous Improvement reports a failed field
  replication of a frozen-cap staff car park's priority-tier scoring null
  result at nine partner primary schools' kiss-and-drop zones, finding the
  unmodified scoring formula reallocates bay access for mobility-flagged
  families rather than reproducing the original site's neutral outcome.
topic: >-
  Facilities' Transport Unit rolls its frozen-cap staff-parking priority-tier
  score out to a partner primary school's kiss-and-drop zone and bus-bay
  roster, then keeps expanding the rollout after a replication attempt finds
  the score reshuffles which families get the closest bay rather than
  reproducing the original null result.
