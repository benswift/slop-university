summary: >-
  A research poster from the School of Continuous Improvement computes the
  harmonic measure of the innermost channel floors in 126 branching slit
  domains, solving each junction cell with a lightning Laplace solver and
  composing the cells level by level. Each junction lowers the floors' measure
  by a fixed fraction of a decade beyond the straight-run extremal-length
  estimate, from 0.14 to 0.45 decades depending on the fan's branching number
  and width ratio, and composition carries the computation to measures near
  10^-72, far below where whole-domain solves lose the floors to rounding.
topic: >-
