title: Replan Fast, Commit Slowly
subtitle: Homotopy-Class Chatter in Corridor Navigation and a Hysteresis Rule That Suppresses It
authors:
  - Anneke Tolan
  - Mirela Hanke
  - Joost Nwosu
preset: paper
school: School of Emergent Priorities
