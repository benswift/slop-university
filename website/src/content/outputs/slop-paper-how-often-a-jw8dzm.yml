doi: 10.5555/slop.jw8dzm
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement measures how often a layered mobile-robot planner switches the
  side on which it passes a pedestrian as its replanning rate rises from 0.5
  to 20 Hz, in 24,000 simulated corridor passes and 412 passes on four robots
  of the University's shared campus fleet. Reversals grow with the rate as a
  sign-change model of correlated tracker noise predicts, and a commitment rule
  that changes side only on a fractional cost advantage held past a minimum
  dwell keeps them near 0.13 per pass at every rate, at a cost of 3 to 4 cm of
  fifth-percentile clearance when a walker crosses late.
topic: >-
  how often a mobile robot should replan its global path through a crowded
  corridor, and a hysteresis rule on homotopy-class switches that stops it
  flip-flopping between passing sides
