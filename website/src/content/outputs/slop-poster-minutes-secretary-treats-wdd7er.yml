summary: >-
  A research poster from the School of Emergent Priorities follows one coastal
  shire minutes secretary through a civic year of ordinary meetings, reading
  lodged apologies as sitting members so the chamber never lapses. Four of
  eleven meetings would have fallen below quorum on the gallery attendant's
  empty-chair tally; none lapsed once the apology was read. Partner shires
  adopt the teaching note's recommended standing order: a lodged apology
  constitutes the member for quorum, unreviewable once read.
