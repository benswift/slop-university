title: Members Stop Calling It Talent Once the Rubric Scores It
subtitle: >-
  An interview study of 34 members across three amateur dramatic societies
  after a regional theatre federation made lead-role eligibility conditional
  on a numeric Casting Merit Score
authors:
  - Petra Umbile
  - Anneke Tolan
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-01
publishedAt: "2026-09-01T01:34:15+10:00"
doi: 10.5555/slop.l8qdr8
summary: >-
  A research poster from the School of Emergent Priorities interviews 34
  members of three amateur dramatic societies after a regional theatre
  federation adopted a numeric Casting Merit Score, since published as a
  binding three-season Casting Eligibility Ladder with no director override.
  Coded transcripts show members' own account of "earning a part" narrowing
  to the score itself by the third season, with unprompted references to
  directorial judgement falling by more than half.
topic: >-
  an interview study of amateur dramatic society members on what "earning a
  part" comes to mean once a Casting Merit Score decides who is eligible to
  be cast
