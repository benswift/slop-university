summary: >-
  An essay in architectural criticism from the School of Settled Matters and
  the School of Emergent Priorities reads one basement water-maze room through
  its 1997 fit-out and three refits, reconstructing the view from the water
  against the drawings and the occupying laboratory's 61 cue sheets. The sheets
  recorded every applied cue and none of the seventeen changes to the visible
  fabric; once a curtain enclosure hid the walls, the ceiling was the room's
  only architecture, and after a services upgrade took away its directional
  light battens the laboratory began adding cues.
