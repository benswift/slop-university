summary: >-
  A research poster from the School of Emergent Priorities cores the silted
  stock pond of an unnamed abandoned upland pastoral run and counts 131 annual
  light-dark couplets in its fill. Dung-fungus spores date the stocking of the
  run and its abandonment at couplet 96, three charcoal peaks date its burning,
  and the station's surviving stock book and day book, opened only after the
  count, agree with the sediment wherever the two overlap.
topic: >-
  reading the laminated fill of a silted stock pond at an unnamed abandoned
  upland station for the stocking, burning and abandonment of the run
