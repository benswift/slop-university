summary: >-
  A research poster from the School of Continuous Improvement tags 263 leaks on
  one bottling plant's compressed-air network during a single planned shutdown
  and traces each leaking fitting to the record that installed it. Fittings
  added during the plant's 34 recorded improvement events account for 43% of
  the leaks and 69% of the estimated leak flow, and 51 of the 88 event couplings
  traced to a tool station serve a station that is no longer there.
topic: >-
  an ultrasonic leak census of one bottling plant's compressed-air network,
  tracing most of its leaks to the quick-disconnect couplings left behind by
  successive improvement events
