title: Two Steps from the Gate
subtitle: The courtyard well in sixty-four manuscript verse romances, read in plan
authors:
  - Vigdis Emenike
  - Eivind Onwuka
  - Sunniva Balogun
preset: research-poster
school: School of Underlying Conditions
