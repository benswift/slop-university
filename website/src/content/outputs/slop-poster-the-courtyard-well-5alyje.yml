doi: 10.5555/slop.5alyje
summary: >-
  A research poster from the School of Underlying Conditions redraws the
  principal household of 64 manuscript verse romances as plans and access
  graphs, and finds the courtyard well two steps from the street gate in 38 of
  the 51 households that have one, shallower than any sleeping room. Suitors
  reach it in one step: in 23 of 31 suitor scenes the text opens a rear door,
  a breach in the garden wall or the water channel that the plan shows nowhere
  else, which the poster reads as a design decision rather than a copyist's
  slip.
topic: >-
  the courtyard well in a corpus of manuscript verse romances, read as
  architecture: redrawing the house plan each text implies to find where it
  puts the water and whom the plan lets reach it
