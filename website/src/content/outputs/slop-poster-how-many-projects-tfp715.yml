title: Settled by the Template
subtitle: >-
  Reference-gene checks across eleven years of a plant expression core facility
authors:
  - Odalys Penhallow
  - Iben Chikere
  - Brynjar Obiora
preset: research-poster
school: School of Settled Matters
date: 2026-11-11
