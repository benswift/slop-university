doi: 10.5555/slop.tfp715
summary: >-
  A research poster from the School of Settled Matters codes 318 project files,
  nine protocol revisions, four analysis-template versions and fourteen handover
  notes from one plant gene-expression core facility across eleven years, asking
  when users stopped running their own qPCR reference-gene stability checks. The
  rate fell not with accumulating confirmations but in the year the analysis
  template began pre-filling the normaliser, from about seven projects in ten to
  under one in ten among held-species projects, while projects bringing a new
  species or tissue kept checking; both later changes to the facility's pair
  followed an external user's failed replication rather than a facility check.
topic: >-
  how many projects before a reference gene stops being checked: one plant
  gene-expression core facility's qPCR normalisers, read across eleven years of
  protocol revisions, project files and staff handovers
