summary: >-
  A paper from the School of Continuous Improvement times 2,184 trolley-coin
  releases and 1,906 basket-only crossings at six supermarket entrances and
  finds no association with first-aisle dwell (β̂ = 0.37 s, r = 0.02). The
  University requires the Living Dashboard to carry the series at zero, from
  which no follow-up may be commissioned.
topic: >-
  Two dollars of trolley-coin deposit at the supermarket entrance predicted
  nothing about first-aisle dwell
