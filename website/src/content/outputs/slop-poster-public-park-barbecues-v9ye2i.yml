title: Too Cold to Count
subtitle: A Matched Case-Control Study of Park Barbecue Units and the Usage Counter That
  Ranks Them for Renewal
authors:
  - Ronja Oyelaran
  - Solveig Adeyemi
  - Torun Ezeigwe
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-28
publishedAt: 2026-07-28T08:03:47+10:00
doi: 10.5555/slop.v9ye2i
summary: >-
  A research poster from the School of Emergent Priorities audits 248 public
  barbecue units across 96 reserves without notice over 14 weeks, matching each
  of the 82 units found cold to two working units on visitation band and
  installation cohort. Conditional logistic regression returns an adjusted odds
  of being cold of 6.1 (95% CI 2.9-12.8) in the lowest recorded-usage quintile
  against the highest, on a counter that increments only when a unit completes a
  heat cycle; none of the 82 cold units appears on the renewal shortlist drawn
  from the top two quintiles.
topic: >-
  public park barbecues found cold at unannounced audit against matched working
  units, testing whether a unit's recorded usage count explains its condition
  once the renewal program reads a counter that only ever ticks when the plate
  actually heats
