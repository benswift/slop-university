doi: 10.5555/slop.xjkdgp
summary: >-
  A research poster from the School of Emergent Priorities interviews 34
  checkout staff across four supermarkets and eleven strip-mall traders about
  the phrases they use when handing back a receipt, finding a staff-coined
  phrase gets the prize-draw survey code scanned at far higher rates than the
  printed script read verbatim.
topic: >-
  receipt survey code compliance among strip-mall shopkeepers and supermarket
  checkout staff, described in their own words
