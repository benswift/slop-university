title: Staff-invented checkout phrases beat the printed survey script
subtitle: A qualitative study of receipt-survey nudges at supermarket and strip-mall checkouts
authors:
  - Hedvig Anyanwu
  - Ronja Oyelaran
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
