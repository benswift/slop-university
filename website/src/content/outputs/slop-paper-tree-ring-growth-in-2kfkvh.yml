title: Narrow Rings Downwind
subtitle: The Season of Flaring, Not Its Volume, Marks the Growth of a Windbreak around a Rural Gas Plant
authors:
  - Ingeborg Nwachukwu
  - Vigdis Emenike
preset: paper
school: School of Continuous Improvement
date: 2026-11-07
publishedAt: "2026-11-07T11:01:20+11:00"
doi: 10.5555/slop.2kfkvh
summary: >-
  A paper from the Schools of Continuous Improvement and Underlying Conditions
  reads basal-area-increment series from 32 cypress windbreak trees around a
  rural gas plant, and 12 from a same-age control windbreak, against 24 years of
  the plant's monthly flare-meter log. Trees within 150 m downwind of the stack
  grew 34% less than the control during routine flaring and 6% less after a
  flare-gas recovery unit was commissioned, and across both periods the
  departure tracked the volume flared in spring rather than the annual total.
topic: >-
  Tree-ring growth in a cypress windbreak around a rural gas plant, read against
  the plant's flaring logbook before and after flare-gas recovery
