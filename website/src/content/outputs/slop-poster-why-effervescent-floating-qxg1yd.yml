summary: >-
  A research poster from the School of Underlying Conditions compacts 120
  effervescent HPMC matrix tablets across five compaction pressures and four
  bicarbonate fractions and follows each one's buoyancy for twelve hours in a
  paddle bath. Of the 108 that lifted, 47 sank again at a median of 4.6 hours,
  by venting through a fissured gel or by exhausting their gas, and 15%
  bicarbonate at 100–200 MPa held all eighteen of its tablets up to twelve
  hours.
topic: >-
  Why effervescent floating matrix tablets sink again partway through release,
  and the compaction window that keeps them buoyant for twelve hours in vitro
