title: Radial Zoning in a Cast Fused-Iron Ammonia-Synthesis Catalyst Ingot
subtitle: Promoter Segregation toward the Shrinkage Pipe and the Activity of Each Zone after Reduction
authors:
  - Ragnhild Uzoma
  - Bram Ntuli
preset: paper
school: School of Underlying Conditions
date: 2026-11-01
