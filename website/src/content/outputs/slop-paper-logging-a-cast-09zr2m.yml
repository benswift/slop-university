doi: 10.5555/slop.09zr2m
summary: >-
  A paper from the School of Underlying Conditions and the School of
  Continuous Improvement drills and logs one 8.2 kg laboratory ingot of
  promoted fused magnetite as drill core, finding potassium and calcium oxides
  concentrated toward the axis along Scheil-type profiles and the last liquid
  drained into the shrinkage pipe at 2.5 times the charged potassium. After
  reduction its four textural zones differ by a factor of 1.8 in ammonia
  synthesis rate per gram but by only 9% per unit surface area, and the
  potassium-rich pipe lining, which the drill could not recover, reduces
  slowest and is least active.
topic: >-
  logging a cast fused-iron ammonia-synthesis catalyst ingot like drill core,
  rim to shrinkage pipe, and the activity of each zone after reduction, the
  last-to-freeze promoter-rich residue around the pipe included
