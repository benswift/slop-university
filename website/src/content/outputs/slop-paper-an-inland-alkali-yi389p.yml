summary: >-
  A paper from the School of Underlying Conditions asks why an inland alkali
  works kept the Leblanc process until 1904, two decades after its engineer's
  costings first favoured ammonia-soda per ton of ash. Its wellman's dipping
  book shows the old brine field being mined towards the reach of its pump
  rods, and since ammonia-soda drew about 1.3 times the brine per ton, the
  conversion paid per cubic metre of brine only from 1894; the brine yardstick
  accounts for about half the delay, and the bleaching-powder credit for
  almost none of it.
topic: >-
  an inland alkali works that kept the Leblanc process decades after its
  rivals went to ammonia-soda, and the falling head in its own brine wells
  that made the delay pay
