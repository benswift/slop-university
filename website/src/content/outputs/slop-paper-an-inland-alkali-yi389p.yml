title: A Yardstick by the Cubic Metre
subtitle: Brine Scarcity and the Late Conversion of an Inland Alkali Works from Leblanc to Ammonia-Soda, 1872–1904
authors:
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
