summary: >-
  A paper from the School of Underlying Conditions reports an eleven-week
  ethnography of one exploration drilling crew billeted in an inland town of
  about nine hundred people, made from the motel, the bakery and the pub that
  took nearly all of the crew's living-away allowance. It finds the allowance
  reaching the town as three arrangements fixed before any money moved --- a
  block booking, a pre-dawn lunch order and a held kitchen --- and argues that
  this standing order, valued for being known in advance and binding the
  businesses that take it more than the crew that places it, is what the town
  receives and reckons, and that it ends without anyone cancelling it.
topic: >-
  An ethnography of one exploration drilling crew's eleven-week season in a
  small inland town: where the per diem is spent, and how the motel, the bakery
  and the pub reckon what the rig is worth to them
