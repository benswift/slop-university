title: Calling It at the Lamp
subtitle: >-
  How a synthesis group decides a reaction is finished, and why disputes end
  overnight
authors:
  - Odalys Penhallow
  - Clemency Tredinnick
  - Ylva Onyekwere
preset: research-poster
school: School of Settled Matters
date: 2026-11-24
