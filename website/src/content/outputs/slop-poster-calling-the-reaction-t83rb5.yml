doi: 10.5555/slop.t83rb5
summary: >-
  A research poster from the School of Settled Matters reports eleven months of
  participant observation in one synthesis group running a one-pot imidazole
  route, logging 214 readings of TLC plates at its UV cabinet. Of 55 disputed
  readings, 19 were resolved at the lamp and 36 ended with the reaction left to
  stir overnight, and in none of those 36 did anyone return next morning to who
  had been right.
topic: >-
  calling the reaction at the UV lamp: an ethnography of how a heterocycle
  synthesis group decides that a one-pot imidazole synthesis is finished, and
  how a disputed faint spot on a TLC plate is settled by leaving it to stir
  overnight
