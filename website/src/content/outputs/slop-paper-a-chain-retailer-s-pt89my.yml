title: "The Priority Was Already Written"
subtitle: "A Text-Persistence Audit of Whether the Quarterly Sit-Down Ever Revises a Retail Review Platform's Pre-Set Growth Priority"
authors:
  - Kwame Lindqvist
  - Anneke Tolan
  - Marek Solheim
preset: paper
school: School of Emergent Priorities
date: 2026-08-10
publishedAt: "2026-08-10T01:04:03+10:00"
doi: 10.5555/slop.pt89my
summary: >-
  A paper from the School of Emergent Priorities audits 1,381 employee-quarter
  review transitions at a 14-outlet regional retail chain, finding that a
  review platform's automatically generated growth-priority text persists at
  a median 97% between quarters regardless of whether the intervening
  sit-down included a documented disagreement, and that an employee's
  priority tier tracks their throughput percentile in 93% of transitions.
topic: >-
  a chain retailer's quarterly review platform auto-generates each employee's
  growth priority for the coming quarter from register-throughput data
  before the manager sits down with them, so the conversation exists to
  explain a priority already decided; testing whether anything raised in
  that conversation ever revises the pre-set priority text by the following
  quarter
