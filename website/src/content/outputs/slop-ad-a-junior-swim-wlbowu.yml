summary: >-
  A marketing poster for the School of Continuous Improvement features
  Postdoctoral Fellow Joost Nwosu poolside at a junior swim club, stopwatch in
  hand, as a swimmer's cleared personal-best time is logged as the new
  minimum standard, developed for bus-stop panels and campus digital signage
  in a landscape rotation.
topic: >-
  a junior swim club awards a coloured cap once a nine-year-old clears their
  personal-best time, and from that day the club's own logbook stops
  recording it as an achievement and starts recording every slower swim as a
  shortfall against it
