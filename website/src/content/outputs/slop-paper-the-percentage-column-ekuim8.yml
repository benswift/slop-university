summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement asks 96 Year 7 students in four classes to fill in a blanked
  percentage column for two junior football teams level on seven wins. The most
  common method (38 of 96) averaged the ten per-game ratios rather than dividing
  the season's totals (27 of 96), and 29 of those 38 then judged the official
  ladder unfair, although on the task their average let one lopsided win supply
  64 per cent of a team's figure. In 24 interviews, rewriting the official
  percentage as a mean of game ratios weighted by points conceded made its logic
  statable, and the authors propose the ladder as a site for teaching the
  weighted mean.
topic: >-
  the percentage column: Year 7 students ranking two teams level on points in a
  junior sport ladder, and why averaging each game's ratio feels fairer to them
  than dividing the season's totals
