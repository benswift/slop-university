title: Fairer by the Game
subtitle: Year 7 Students' Reasoning About the Percentage Tiebreaker in a Junior Competition Ladder
authors:
  - Halvard Nnamani
  - Torun Ezeigwe
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
