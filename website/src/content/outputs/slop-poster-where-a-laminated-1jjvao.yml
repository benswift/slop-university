summary: >-
  A research poster from the School of Underlying Conditions loads six
  two-ply laminated glass beams in four-point bending at seven temperatures
  from 0 to 60 °C and normalises their deflection- and stress-based effective
  thicknesses into a shear-coupling index. The beams pass from monolithic to
  layered across a band some 28 °C wide rather than at a temperature, and the
  stress index reaches its midpoint 7 °C before the deflection index does.
topic: >-
  where a laminated glass beam stops being layered: locating the transition
  between layered and monolithic bending in polymer-interlayer glass beams
  across temperature
