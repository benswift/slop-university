summary: >-
  A research poster from the School of Underlying Conditions measures
  photopolymerisation working curves for a camphorquinone-initiated diacrylate
  soil-peel binder in four horizons of one sandy profile, finding penetration
  depth fell from 2.4 mm in the bleached A2 to 0.35 mm in the iron-stained B2,
  so that at the highest blue-light dose the reddened horizon cured to only
  1.5 mm and its peel tore at the red band. A green-absorbing initiator raised
  the B2 penetration depth to 0.9 mm.
topic: >-
  How deep the light goes into a soil peel: working curves for a
  visible-light-cured acrylate binder drawn into four horizons of one sandy
  profile, and the reddened horizon that cures only at its skin
