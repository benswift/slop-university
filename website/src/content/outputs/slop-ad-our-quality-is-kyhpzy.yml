summary: >-
  A marketing poster for the School of Emergent Priorities advertises the
  University's mechanical and optical resonators by their quality factor,
  reporting their standing in the University's own Indicator Commons over four
  quarters beside a bronze bell struck in a campus forecourt and a laser trained
  on its lip. Prepared for the landscape signage panels in matched daylight and
  evening renderings, with a short reading list from the University's published
  record.
