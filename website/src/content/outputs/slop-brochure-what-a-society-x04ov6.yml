summary: >-
  A case-for-support brochure from the School of Continuous Improvement invites
  partners into a cross-School programme on what a society covers, keeps and
  moves out of sight after a regime ends, taking the long post-war of
  twentieth-century Italy as its anchoring case. It reads that question through
  the closed room, the layered surface and the register that outlives what it
  lists, and rests its case on seven published studies cited by title and DOI.
topic: >-
  what a society puts out of sight after a regime ends: a case for supporting
  the study of how post-war Italy covered, kept or quietly moved the
  inscriptions, files and rooms of the Fascist years
