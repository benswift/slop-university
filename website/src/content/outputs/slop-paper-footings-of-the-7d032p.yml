summary: >-
  A paper from the School of Underlying Conditions is an essay in building
  criticism on three small structures that student design-build studios left
  with community hosts: a garden store, a waiting shelter and a nursery shade
  pavilion, each visited years after handover and read upward from the ground
  it stands on. It argues that a teaching period fixes the footing first and
  with the least knowledge, that the footing is the one part of such a building
  whose service outlasts the course, and that criticism of this work should
  return after the second wet season.
topic: >-
