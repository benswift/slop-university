title: Visit the Bore Its Neighbours Cannot Predict
subtitle: Prediction-Weighted Orienteering for a Data-Mule UAV over a Legacy Groundwater Monitoring Network
authors:
  - Vigdis Emenike
  - Bram Ntuli
  - Osei Vandermeer
preset: paper
school: School of Underlying Conditions
date: 2026-11-04
