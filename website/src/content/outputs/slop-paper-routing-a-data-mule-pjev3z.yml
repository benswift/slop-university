doi: 10.5555/slop.pjev3z
summary: >-
  A paper from the School of Underlying Conditions and the School of
  Continuous Improvement plans the monthly campaign of a multirotor that hovers
  over each of 212 monitoring-bore loggers to download its record, posed as a
  team orienteering problem whose reward is the water-level variance a visit
  removes from a Gaussian-process model of the network. Replayed over eighteen
  months, the prediction-weighted campaign nearly halves the nowcast error of one that
  reads as many bores as the budget allows, once a screen built on manual dips
  stops it favouring drifting loggers, and it reads one isolated bore of
  unrecorded purpose in every campaign at every budget tested.
topic: >-
  routing a data-mule UAV over a legacy groundwater monitoring-bore network, as
  an orienteering problem that weights each bore by how poorly its neighbours
  predict its readings
