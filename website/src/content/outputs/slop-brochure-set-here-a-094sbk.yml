summary: >-
  A civic brochure from the School of Underlying Conditions invites the
  district's reading groups, charity-bookshop volunteers and local historians
  to read the town's own literature alongside the University, across three
  strands: a reading group's long novel read together, the pencilled margins of
  second-hand copies, and field walks that read a local novel beside the ground
  it describes. It features six of the University's published outputs and
  profiles two of its researchers.
topic: >-
  set here: a civic brochure on the University reading alongside its town, from
  the long novel a reading group never finishes to the pencil notes in a
  second-hand copy and the painted lettering on a bore cap
