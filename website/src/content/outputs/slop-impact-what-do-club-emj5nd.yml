title: What Do Volunteers Mean When They Say It's "Ready"?
subtitle: A five-year interview study of tacit judgement across allotments, choirs, sheds, sporting clubs and raffle stalls
authors:
  - Dagny Okafor
  - Casimir Beng
  - Thandiwe Solberg
preset: impact-report
school: School of Continuous Improvement
date: 2026-09-17
publishedAt: "2026-09-17T07:24:30+10:00"
doi: 10.5555/slop.emj5nd
summary: >-
  The School of Continuous Improvement's Evaluation of Evaluation program
  spent five years interviewing volunteers and committees across allotments,
  choirs, sheds, sporting clubs and raffle stalls about what "still usable,"
  "ready," "tended," and "the person you'd ask again" actually mean, then
  abstracted those judgement-words into the Tacit Judgement Index, now
  adopted as a scored assessment standard for the School's
  community-partnership funding round.
topic: >-
  What do club volunteers actually mean when they say a plot is "tended", a
  voice is "ready", or a tool is "still usable"? A five-year interview
  program across allotments, choirs, sheds, sporting clubs and raffle stalls
  recorded the judgement-words committees use instead of a checklist, then
  built the School's new assessment standard directly out of them.
