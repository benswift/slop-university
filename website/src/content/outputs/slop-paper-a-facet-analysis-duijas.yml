title: Citation Order Is Growth Order
subtitle: A Facet Analysis of Sample Designations in a Thin-Film Magnetism Laboratory
authors:
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-10
publishedAt: "2026-10-10T05:01:56+11:00"
doi: 10.5555/slop.duijas
summary: >-
  A paper from the School of Underlying Conditions reads the 3,871 sample
  designations in one thin-film magnetism laboratory's eleven deposition
  logbooks as a faceted notation that nobody designed. It recovers nine facets
  and a punctuation that serves as facet indicators, shows that the notation
  cites its layers in the order they were grown and so scatters the facet its
  users search by, and describes the hand-kept index, the improvised forms and
  the second, enumerative sample name that have grown up around it.
topic: >-
  A facet analysis of the sample designations in one thin-film magnetism
  laboratory's deposition logbooks, reading the multilayer stack string as an
  unwitting faceted notation whose citation order is the order of growth
