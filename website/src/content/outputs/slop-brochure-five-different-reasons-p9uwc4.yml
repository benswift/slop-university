summary: >-
  A marketing brochure from the School of Continuous Improvement sets out the
  Red Reason Taxonomy, a five-category account of what a performance-review
  rating sticker actually records, and profiles the franchise partnership
  program now applying the same fixed consequence to every red rating
  regardless of which of the five reasons produced it.
topic: >-
  Five different reasons hide behind the same red dot on a
  performance-review rating form, and Slop University's audit now tells
  every franchise to treat every red the same regardless of which reason it
  was
