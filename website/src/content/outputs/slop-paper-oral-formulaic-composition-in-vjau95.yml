summary: >-
  A paper from the School of Settled Matters reads thirty-one recorded
  after-dinner tellings of a country aero club's founding flight, from five
  tellers between 1974 and 2016, as an oral-formulaic tradition. Formula
  density rises across the corpus while the share of formulas varied in
  performance falls from 0.71 to 0.07 across the printing of the club's 1986
  jubilee history, whose editor's closing sentence enters nineteen of the
  twenty-three later tellings; the paper argues that the history ended the
  story's composition in performance and that a formula's flexibility, not its
  frequency, marks a living telling.
topic: >-
  Oral-formulaic composition in four decades of recorded after-dinner
  retellings of a country aero club's founding flight: its epithets, its
  type-scenes, and when the telling stopped changing
