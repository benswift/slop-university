title: Notes on the Project Bag
subtitle: Open work in hand among 412 craft-circle members, and the ceiling the University now sets from it
authors:
  - Sten Okwuosa
  - Edda Nwafor
  - Thandiwe Solberg
preset: research-poster
school: School of Continuous Improvement
