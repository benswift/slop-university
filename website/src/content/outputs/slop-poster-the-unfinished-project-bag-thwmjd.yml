doi: 10.5555/slop.thwmjd
summary: >-
  A research poster from the School of Continuous Improvement tips out the
  project bags of 412 members at 38 craft circles and reports the distribution
  of open projects per member (median 5, ninetieth percentile 11) and of the
  stage at which dormant projects were last worked, most often the second of a
  pair. The School fixes the University's ceiling on open projects per research
  group at the circles' own ninetieth percentile, with a twelfth admitted only
  against one finished or frogged.
topic: The unfinished-project bag of a craft-circle member, surveyed across 412 members at 38 circles and reported as distributions of open projects per member and of the stage each was abandoned at, with a University cap on open projects per research group fixed at the circles' ninetieth percentile
