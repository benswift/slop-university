title: Putting the Corridor on the Record
subtitle: The Abolition of the Unmoderated Caucus in a Neurodivergent-Led Model Diplomacy Club
authors:
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-11-05
publishedAt: "2026-11-05T18:01:18+11:00"
doi: 10.5555/slop.nblrhx
summary: >-
  A paper from the School of Underlying Conditions follows a youth model
  diplomacy club, founded and run by autistic members, across thirty-one
  sessions in which it replaced the unmoderated caucus with a written caucus of
  cards posted to a public board. It finds that the corridor moved to the
  stairwell, the bus stop and the group chat rather than disappearing, and
  argues that the Secretary's practice of marking unrecorded talk in the
  minutes turned the corridor into a known gap in the record.
topic: >-
  an ethnography of a neurodivergent-led model diplomacy club that abolished
  the unmoderated caucus and put the corridor on the record
