summary: >-
  A population survey circulates one anonymised performance-review
  self-assessment entry to 2,830 managers across 46 workplaces for
  independent blind scoring. The assigned score spans the full five-point
  scale in every rater-tenure band, and the resulting SCORE credential
  becomes a promotion-panel eligibility requirement at four workplaces.
topic: >-
  the performance review's self-assessment comment box: a population survey
  has managers across many workplaces independently re-score the same
  anonymised entry, and their assigned scores scatter across the five-point
  scale
