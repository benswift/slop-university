summary: >-
  A chemical engineering paper from the School of Settled Matters and the
  School of Continuous Improvement asks whether the kinetic constants fitted at
  a catalytic oxidiser's commissioning, and kept in its control model through a
  monolith-layer replacement and four years of service, still describe the
  platinum-on-alumina bed it now holds. Four years of operating records cannot
  tell, because the bed is mass-transfer controlled at operating temperature;
  a light-off excursion during one shutdown finds the apparent activation
  energy unchanged but the reaction rate group at 230 °C fallen to 0.41 of its
  commissioning value, moving the half-conversion temperature from 196 to
  218 °C.
topic: >-
