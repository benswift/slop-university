summary: >-
  A marketing poster for Slop University invites the public to an Improvement
  Grand Rounds session this spring with Dr Dagny Okafor, Convenor of Evaluation
  of Evaluation, on smart glass whose oxide coating darkens against the sun and
  then checks whether it darkened enough. Composed for the landscape signage
  rotation, it pictures a seated audience facing a tall wall of graded panes,
  and points to three of the University's published outputs on oxides and
  coated glass.
