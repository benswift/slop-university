doi: 10.5555/slop.ey8f6k
summary: >-
  A research poster from the School of Underlying Conditions presses 48
  encapsulated thermochromic liquid-crystal sheets from one batch against the
  faces of twelve survey pits, eighty contacts each, recalibrating every ten
  and reading the colour-play band in strips by distance from the cut edge.
  The centre of each sheet holds its calibration to within 0.1 °C, while
  within 5 mm of a cut edge the red-start temperature falls by 1.61 °C and the
  band widens from 5.1 to 6.9 °C, three times faster on wet faces than dry,
  where sectioning finds swollen and coalesced capsules along every cut.
