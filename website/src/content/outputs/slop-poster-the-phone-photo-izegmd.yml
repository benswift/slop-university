summary: >-
  A research poster from the School of Underlying Conditions follows the phone
  photos of vials that a nineteen-member pharmaceutics group posts to its chat,
  through bench shadowing, interviews and a donated archive, and introduces a
  standard photo cradle as a design probe. Most window photos were posted
  without a word and answered with reassurance; with the cradle, first replies
  turned to comparison and settings, and juniors' share of vial posts fell from
  78 to 49 per cent.
topic: >-
  the phone photo of a vial held up to the window: how a nanoformulation lab
  shares its batches on the group chat, and what a standard photo cradle
  changed about who asks for a second look
