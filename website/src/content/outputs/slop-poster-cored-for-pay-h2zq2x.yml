summary: >-
  A research poster from the School of Underlying Conditions codes every cored
  metre in 1,486 well-completion files from a mature oil province by
  stratigraphic unit and stated purpose. The regional seal makes up 9.2 per
  cent of the metres drilled but 2.1 per cent of those cored, most of its core
  came up only because a core point was picked high, and 33 of 37 later
  assessments calling the seal competent trace by citation to four cored
  intervals from the crest of a single field.
topic: >-
  Cored for pay, drilled through the seal: an archival history of which rock a
  mature oil province chose to recover, and what that leaves known about the
  cap rock now asked to hold its leaks
