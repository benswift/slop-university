title: Cored for Pay, Drilled Through the Seal
subtitle: Which rock a mature oil province chose to recover, and what its well files know of the cap rock
authors:
  - Ragnhild Uzoma
  - Iben Chikere
  - Vigdis Emenike
preset: research-poster
