summary: >-
  A research poster from the School of Underlying Conditions reads the 48
  narrow-resonance depth scans taken of one implanted ²²Ne target across
  twelve years and 31 coulombs of beam as a single record. The target lost 17%
  of its integrated yield in its first campaign and held within 2% thereafter,
  while a carbon layer moved its leading edge up by 0.38 keV per coulomb;
  separated, the two give each past campaign its own target-state correction.
topic: >-
  the working life of one implanted neon-22 target at a small university
  accelerator, read from twelve years of narrow-resonance depth scans
