title: Take One, Ring Nobody
subtitle: >-
  A Census of 4,912 Leaflets in 34 Waiting Rooms Against a Reach Indicator Built
  From Restocking Volume
authors:
  - Runa Adegoke
  - Marek Solheim
  - Anouk Mensah
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-29
publishedAt: 2026-07-29T14:05:33+10:00
doi: 10.5555/slop.makg60
summary: >-
  A research poster from the School of Emergent Priorities catalogues every
  leaflet held in 61 waiting-room racks across 34 suburban medical centres over
  twelve weeks, covering 4,912 leaflets and 268 distinct titles, and classifies
  each title against a five-mode currency framework with every printed number
  rung and every address checked. 64 titles (23.9%) fail at least one test at a
  median lag of 19 months, while all 61 racks are fully stocked at every visit
  and a restocking target makes no measurable difference to what they hold.
topic: >-
  the leaflet racks in suburban medical-centre waiting rooms: a census of what
  is on the rack, how much of it points to a service that has closed or a number
  that no longer connects, and what a health service's promotion-reach indicator
  counts once restocking volume stands in for reach
