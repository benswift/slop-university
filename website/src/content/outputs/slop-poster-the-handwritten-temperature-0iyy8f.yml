title: In Range, Twice a Day
subtitle: Agreement between handwritten cold-chain logs and continuous loggers at
  88 food premises, and the excursions the sheet never carries
authors:
  - Solveig Adeyemi
  - Iben Chikere
  - Thandiwe Solberg
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-15
publishedAt: 2026-08-15T18:01:03+10:00
doi: 10.5555/slop.0iyy8f
summary: >-
  A research poster from the School of Continuous Improvement sets 12,914
  handwritten fridge-temperature entries against 2.13 million readings from
  calibrated loggers on the same appliances, across 88 food premises over twelve
  weeks. The two records agree in the middle of the range and part at its edges
  (mean difference -0.6 °C, limits of agreement -4.1 to +2.9 °C); 71.6 per cent
  of written entries are exactly 3 or 4 °C, and of 2,417 logged excursions at or
  above 5 °C lasting thirty minutes or more, 39 coincide with an out-of-range
  entry. Mean written and mean logged temperature are weakly associated across
  premises (r = 0.24), and all 88 met the risk classification's records criterion
  at their most recent inspection.
topic: >-
  the handwritten temperature sheet on a clipboard beside the drinks fridge at a
  suburban cafe, filled in twice a day under the food safety program, where a
  council's food-business risk classification --- which sets inspection frequency
  and the annual registration fee --- reads a complete in-range log as evidence
  of cold-chain control, and a measurement-agreement study installing data
  loggers behind 88 fridges for twelve weeks finds the written readings pile on 3
  and 4 degrees with almost no odd terminal digits and are entered in blocks,
  agreeing with the logger only where nothing went wrong, so the excursions the
  log exists to catch are the readings it never contains
