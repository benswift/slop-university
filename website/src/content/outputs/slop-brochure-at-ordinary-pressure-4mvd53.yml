summary: >-
  A case-for-support brochure from the School of Continuous Improvement invites
  partners to back improvement made at ordinary pressure, taking as its model
  the effort in ammonia synthesis to fix nitrogen in small units close to the
  farm rather than in large, hot, high-pressure plants. Three features set the
  Adaptive Metrics Lab, the Capability Sprints and the Impact Pathway Atlas
  beside the hardest first step, the point of need and the legume's root
  nodule, and seven published University studies are featured by title and DOI.
