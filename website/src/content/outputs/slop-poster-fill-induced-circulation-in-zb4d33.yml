title: Before the Column Settles
subtitle: >-
  Fill-induced circulation and the rest time it sets in bench sedimentation
  columns
authors:
  - Clemency Tredinnick
  - Casimir Beng
  - Gunnhild Ekwueme
preset: research-poster
school: School of Settled Matters
date: 2026-11-24
