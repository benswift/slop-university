doi: 10.5555/slop.zb4d33
summary: >-
  A research poster from the School of Settled Matters uses large-eddy
  simulation and particle image velocimetry to follow the circulation left by
  filling bench sedimentation columns 50 to 200 mm across. A column-scale cell
  outlasts the fill jet and sets the rest time before a settling test, which
  grows as the 1.4 power of diameter and is 2.6 to 2.7 times shorter when the
  column is filled from its base: 6.5 minutes against 17 poured, at 100 mm.
topic: >-
  Fill-induced circulation in a bench settling column: large-eddy simulation of
  its decay by fill method and column diameter, and the rest time it sets
  before a settling test
