title: Overruled Without Saying So
subtitle: Precedent and Silent Departure in Successive Enterprise Development Strategies
authors:
  - Torun Ezeigwe
  - Runa Adegoke
  - Signy Okpara
preset: research-poster
school: School of Continuous Improvement
