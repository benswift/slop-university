doi: 10.5555/slop.63o2y2
summary: >-
  A research poster from the School of Continuous Improvement reads three
  successive five-year development strategies at each of 41 regional
  manufacturers through the doctrine of precedent, assigning each of 612
  inherited commitments to one of four dispositions. Express overruling
  accounts for 4% of commitments, three in five of those that do not survive
  lapse without mention, and in most silent departures the earlier plan sat in
  the same board pack.
topic: >-
  Overruled without saying so: a stare decisis reading of successive enterprise
  development strategies at regional manufacturers, classifying each departure
  from a firm's prior plan as followed, distinguished, expressly overruled or
  silently overruled
