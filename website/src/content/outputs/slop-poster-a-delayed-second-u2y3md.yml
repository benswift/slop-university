summary: >-
  A research poster from the School of Underlying Conditions pollinates 336
  flowers of one glasshouse annual twice, the second pollen load following the
  first by up to twelve hours, and scores 2,084 seeds by their position in the
  pod. Late pollen is not excluded all at once: its share of seed retreats
  towards the base of the pod, one ovule position at a time.
topic: >-
  A delayed second pollination experiment in a glasshouse line of a self-compatible annual: how long a head start the first pollen load needs before late-arriving pollen sires no seed, and which ovule positions along the pod the latecomers still reach
