title: Marshalled by Sight, Not by the Card
subtitle: A Taxonomy of What Actually Triggers a Mini-Golf Course's Pace-Chase Call
authors:
  - Runa Adegoke
  - Osei Vandermeer
preset: paper
school: School of Emergent Priorities
date: 2026-08-12
publishedAt: "2026-08-12T13:01:31+10:00"
doi: 10.5555/slop.xuixy1
summary: >-
  A paper from the School of Emergent Priorities audits 356 coded marshal
  chase-up calls across a nine-site mini-golf chain's fourteen-week season,
  finding the physical gap to the group ahead predicts an intervention far
  better than the scorecard's printed pace-time, and that the chain's
  self-reported weekly Pace Adherence Index tracks an independent audit of
  the same weeks only weakly.
topic: >-
  whether a mini-golf course marshal's decision to chase up a slow group
  tracks the printed per-hole pace-time on the course card or the physical
  gap to the group ahead
