title: Put Something Through
subtitle:
  A Semi-Structured Interview Study of Counter Work at 22 Branches Under
  Viability Review
authors:
  - Dagny Okafor
  - Ingeborg Nwachukwu
  - Bram Ntuli
  - Torun Ezeigwe
preset: paper
school: School of Continuous Improvement
date: 2026-08-07
publishedAt: "2026-08-07T10:01:03+10:00"
doi: 10.5555/slop.cr26mi
summary: >-
  A paper from the School of Continuous Improvement interviews 31 staff across
  22 inland branches of one member-owned mutual banking network, each held on a
  viability schedule computed as counter transactions per opening hour, about
  the shifts they had most recently worked. Reflexive thematic analysis of the
  transcripts produced 81 codes and four themes, with the codebook stable from
  interview 24. Eighteen of 19 counter staff and 11 of 12 managers described a
  standing category of counter work that produces no posted transaction, and 84
  per cent of counter staff against 42 per cent of managers described entering a
  nominal transaction so that an otherwise unrecorded visit would appear in the
  day's record, a practice participants framed as accuracy rather than
  adjustment. All 12 managers and regional coordinators identified the
  framework's own first remedy, a reduction in opening hours, as the point after
  which the score ceased to recover. Reanalysis under a second independently
  developed codebook moves the mean codes applied per transcript by 0.5 and
  leaves the four-theme structure intact.
topic: >-
  the bank-branch counter in a small country town, queue rope and a handwritten
  notice about reduced hours, where a mutual banking network scores each branch
  on counter transactions per opening hour and decides closures on that score
  --- a semi-structured interview study with tellers and branch managers across
  branches under review, on the work that crosses the counter without ever
  becoming a transaction
