title: On Time, by a Later Clock
subtitle: >-
  A Single-Site Case Study of a Suburban Alterations Shop's 48-Hour
  Guarantee, Whose Definition of When the Clock Starts Changed Twice in One
  Quarter to Hold the Same Compliance Number on the Receipt
authors:
  - Verity Marris
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-08-13
publishedAt: "2026-08-13T01:01:03+10:00"
doi: 10.5555/slop.8gqp7o
summary: >-
  A paper from the School of Emergent Priorities audits one suburban
  alterations shop's point-of-sale timestamp logs against its own change
  history for the internal setting governing its 48-hour guarantee's clock
  start, finding the shop's reported weekly on-time rate held flat (M =
  87.5%) across a business quarter while an audit fixed to the guarantee's
  advertised drop-off anchor shows on-time performance falling from 87% to
  61% to 47% as the setting changed twice (N = 914 garments). The hours
  added to the clock start track the shop's own growing backlog closely (r
  = .91), and the pattern is unchanged when rush-fee garments are excluded
  from the audit.
topic: >-
  a single-site case study of a suburban alterations and tailoring shop's
  48-hour turnaround guarantee, tracing how the shop's own definition of
  when the clock starts (garment drop-off, or once measurements are
  confirmed) shifted over a business quarter to keep the guarantee's
  headline compliance rate technically intact
