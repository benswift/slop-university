summary: A research poster from the School of Emergent Priorities tracks 41 suburban
  recommendation group chats for nine months either side of each chat's own
  AI-assisted-answer rollout, scoring every tradesperson mention with an
  effective-number diversity index. The panel-median count falls from a
  pre-rollout plateau of 7.3-7.6 to a post-rollout plateau of 3.0-3.2 within
  four months, and 61% of post-collapse recommendations name whichever
  business the assistant's own default answer names first.
topic: tracking a Referral Diversity Index for suburban tradesperson recommendations
  in neighbourhood group chats, and how fast the recommended pool collapses
  once members start prefacing requests with what an AI assistant already
  told them
