summary: >-
  A case-for-support brochure from the Schools of Continuous Improvement and
  Emergent Priorities makes the case for supporting the small records the
  University already keeps, anchored on an office kitchen's hand-drawn
  cleaning roster and its escalation once a name goes unmarked, alongside
  four published studies and profiles of the researchers and initiatives
  that study records like it.
