summary: A research explainer from the School of Continuous Improvement on Eskil Nwabueze's
  doctoral thesis about the bottom row of a club's results sheet. It follows the appointed
  last, the volunteer rostered to finish behind everyone, from a census of club series
  through the weekly timed runs and a trial in eighteen series, and closes on the
  School's own Last Place Roster. Nwabueze describes the work in his own words.
topic: A research explainer of the doctoral thesis on what community sport clubs do
