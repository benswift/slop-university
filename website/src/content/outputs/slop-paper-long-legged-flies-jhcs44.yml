title: Tenants of the Missing Metres
subtitle: "Territoriality on Core-Loss Blocks in an Undetermined Dolichopodid (Diptera: Dolichopodidae) of a Drill-Core Shed"
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
