doi: 10.5555/slop.jhcs44
summary: >-
  A paper from the School of Underlying Conditions follows a small long-legged
  fly, referred provisionally to Medetera and left unnamed, through one warm
  season in an open-sided drill-core shed. With 143 marked males and 6,412
  perch records it shows that males hold the wooden core-loss blocks in the
  trays as territories for days at a time, that residents keep a block in 209
  of 241 contests without being larger, and that most matings and most prey
  captures happen on a block; it gives a diagnosis of the morphospecies and an
  ethogram of eleven acts, and reads the system as resource defence.
topic: >-
  Long-legged flies holding core-loss blocks as territories in a core shed: an
  undetermined dolichopodid whose males defend the pale wooden spacers in
  stored drill-core trays, with an ethogram and a season of marked-individual
  observations
