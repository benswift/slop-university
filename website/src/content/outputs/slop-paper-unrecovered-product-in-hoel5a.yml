title: Kept in a Labelled Vial
subtitle: >-
  Second-Year Students' Accounts of Unrecovered Product Before and After a
  Filtrate-Retention Instruction in a Heterocycle Teaching Laboratory
authors:
  - Ragnhild Uzoma
  - Sunniva Balogun
preset: paper
school: School of Underlying Conditions
date: 2026-11-06
publishedAt: "2026-11-06T07:31:18+11:00"
doi: 10.5555/slop.hoel5a
summary: >-
  A chemistry-education paper from the School of Underlying Conditions and the
  School of Emergent Priorities codes 764 statements of lost yield in 313
  second-year reports on a Biginelli dihydropyrimidinone synthesis by the place
  each assigns the missing product, across a procedural amendment that had
  students keep their recrystallisation filtrate in a labelled vial. After the
  amendment the filtrate was named in 110 of 209 reports rather than 10 of 104,
  and attributions to no place at all fell, yet median yield did not move and
  only two students examined what the vial held.
topic: >-
  Unrecovered product in the undergraduate heterocycle laboratory: how
  second-year chemistry students account in their lab reports for the yield a
  Biginelli synthesis fails to bring back
