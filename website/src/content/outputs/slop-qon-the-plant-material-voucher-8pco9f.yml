summary: >-
  The Department of Policy Settings answers five questions on the Slop
  University (Plant Material Vouchers) Determination 2026, under which no plant
  extract may be bioassayed in a University laboratory until a voucher specimen
  of its source plant has been accessioned, taken on notice at the Committee on
  Settings Oversight's Supplementary hearings of 16 November 2026 or lodged in
  writing after them. Its answers tabulate 104 vouchers lodged and 54
  accessioned since commencement, with 117 extracts pending, but cannot say how
  long the oldest has waited; quote the explanatory statement's description of
  a voucher without deciding whether a neighbouring plant or a photograph would
  do; do not hold whether an extract came from collected or purchased material;
  decline on resourcing to count results reported from unregistered extracts;
  and confirm that a fraction of a registered extract needs no voucher of its
  own, while none of four vouchers determined only to family has been
  accessioned.
topic: >-
  the plant-material voucher setting: the Committee presses the Department on
  the Determination that bars any plant extract from bioassay in a University
  laboratory until a voucher specimen of its source plant has been lodged and
  accessioned, and on the extracts held unscreened while accession waits
