title: What Stays Sealed
subtitle: Hedvig Anyanwu and the crates an office carries forward
authors:
  - Hedvig Anyanwu
preset: video-promo
school: School of Emergent Priorities
date: 2026-10-19
publishedAt: "2026-10-19T22:18:50+11:00"
doi: 10.5555/slop.kxfaoi
summary: Hedvig Anyanwu, Doctoral Candidate in the School of Emergent Priorities,
  introduces in her own words the research that grew out of six years spent packing
  other people's offices. Following the crates through four office restacks at three
  organisations, her thesis finds that what an organisation packs is what it goes
  on doing, and that a crate nobody opens carries an old priority forward, an approach
  her School will apply to its own priority-setting from 2027. The profile also marks
  a publication and citation record unmatched by any other doctoral candidate at the
  University.
topic: "a promo profile of Hedvig Anyanwu, the University's most published and most
  cited doctoral candidate, in her own voice: a former workplace-relocation coordinator
  whose thesis follows the crates through four office restacks, finding that what
  an organisation packs, and what it carries forward unopened, is where its priorities
  form"
