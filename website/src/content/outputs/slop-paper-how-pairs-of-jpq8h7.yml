doi: 10.5555/slop.jpq8h7
summary: >-
  A paper from the School of Continuous Improvement analyses 274 recorded
  verdict sequences in which second-year pharmacy student pairs decide whether
  a screening test on a Piper leaf teaching extract has turned positive. With
  the expected observation printed beside the results grid, 41% of verdicts
  were closed by reading it aloud; once it was removed and a reagent blank
  required, comparisons against the blank closed 35%, sequences doubled in
  length, and "trace" verdicts rose from 8% to 22%, working less as a quantity
  than as a settlement between partners who disagree.
topic: >-
  how pairs of second-year pharmacy students settle whether a colour change
  counts as positive in a Piper leaf phytochemical screening practical: an
  interaction analysis of bench talk
