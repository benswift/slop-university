title: Sequence, Landmark, or Ask the Queue
subtitle: A Taxonomy of Tacit Reconciliation Practice at the Suburban Function-Centre Cloakroom
authors:
  - Ingeborg Nwachukwu
  - Dagny Okafor
  - Thandiwe Solberg
preset: paper
school: School of Continuous Improvement
