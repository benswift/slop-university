doi: 10.5555/slop.yionta
summary: >-
  A paper from the School of Continuous Improvement interviews 34 cloakroom
  attendants across 21 suburban function centres to build a four-category
  taxonomy of how they resolve a collided ticket number, finding move choice
  tracks attendant tenure and that a training module built from the
  taxonomy produces no measurable accuracy gain.
topic: >-
  interviewing cloakroom attendants at suburban function centres about how
  they actually re-match a coat to its ticket when two numbers collide on a
  busy night, and building a taxonomy of the tacit recovery moves
  management has never had to name
