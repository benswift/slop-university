summary: >-
  A prospectus from the School of Settled Matters invites students to study
  land law at the point where a farm's yield maps, soil-probe series and
  machine logs change hands with the land. It sets the School's teaching in
  land law, statutory interpretation and precedent beside field electives with
  the School of Underlying Conditions, profiles three teaching staff, and
  points to five published studies by title and DOI.
