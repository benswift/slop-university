doi: 10.5555/slop.sxwqok
summary: >-
  A research poster from the School of Continuous Improvement reports a
  cluster-randomised trial across one metropolitan council's twelve-month
  community-grants round, in which 62 funded groups were allocated 1:1 at award
  either to a hand tally counter issued with a one-page distinct-person
  definition or to the standard acquittal form, and 248 acquitted events were
  returned under the council's single self-reported engagement figure. Trial-arm
  groups report a median 152 people per event against 236 in the control arm
  (adjusted incidence rate ratio 0.63, 95% CI 0.52 to 0.77, ICC 0.11) and sit a
  median 6 per cent above an independent concurrent observer where control-arm
  returns sit 68 per cent above; re-derived on the program's own cost per
  participant, 12 of the 31 counted groups fall a renewal band against 2 of 31
  controls.
topic: the folding table and onion urn at a hardware-store sausage sizzle, where a
  council community-grants program acquits each group on self-reported community
  members engaged and ranks renewal on cost per participant --- a
  cluster-randomised trial issuing half the funded groups a hand tally counter
  and a distinct-person definition, and what an accurate count costs the groups
  randomised to make one
