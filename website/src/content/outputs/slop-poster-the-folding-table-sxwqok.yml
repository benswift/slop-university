title: Counted Once, Funded Less
subtitle: A cluster-randomised trial of a distinct-person count across 62 funded
  community groups
authors:
  - Solveig Adeyemi
  - Sten Okwuosa
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-06
