title: Towards a Justification for the Ninety-Second Wait
subtitle: >-
  Time to a Stable First Slide Across 420 Lecture Starts in Fourteen Theatres
authors:
  - Marek Solheim
  - Runa Adegoke
  - Petra Umbile
preset: paper
school: School of Emergent Priorities
date: 2026-10-01
publishedAt: "2026-10-01T09:02:05+10:00"
doi: 10.5555/slop.yvs8op
summary: >-
  A paper from the School of Emergent Priorities times 420 lecture starts in
  fourteen theatres, alternating weekly between lecturers who wait out the
  projector wall plate's ninety-second warm-up and lecturers who press the
  input button at once, and finds the median time to a stable first slide
  indistinguishable between the arms (118 s against 119 s, inside a fixed
  equivalence bound of 15 s). Facilities has made the wait a compulsory,
  minuted Settling Interval at the opening of every timetabled lecture, with
  no lecturer override.
topic: >-
  Ninety seconds is the warm-up wait printed on the lecture-theatre projector's
  wall plate; across 420 lecture starts in fourteen theatres, lecturers who
  waited the full ninety seconds before pressing the input button reached a
  stable first slide no sooner than those who pressed at once, and the
  timetable retained the wait as a minuted item in the first two minutes of
  every lecture
