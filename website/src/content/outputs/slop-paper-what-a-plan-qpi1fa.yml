doi: 10.5555/slop.qpi1fa
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities traces all 187 objectives through four successive five-year
  strategic plans of a member-owned water-bore drilling cooperative, alongside
  its board papers and 27 interviews. The share of each plan inherited from its
  predecessor rose from 54 to 69 per cent, objectives that named no accountable
  position were carried forward far more often than those that did, and carried
  objectives were reworded at each step until they could be neither met nor
  missed.
topic: >-
  What a plan inherits: tracing every objective through four successive
  five-year strategic plans at a regional drilling cooperative, where the
  objectives that persist longest are the ones never given an owner
