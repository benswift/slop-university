title: What a Plan Inherits
subtitle: Objective Carry-Over Across Four Planning Cycles in a Drilling Cooperative
authors:
  - Brynjar Obiora
  - Runa Adegoke
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
