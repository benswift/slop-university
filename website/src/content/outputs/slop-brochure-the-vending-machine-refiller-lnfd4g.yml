title: Notes on a Second Packet
subtitle: >-
  What the concourse machine lends, and to whom, in the words of the people who
  wait for it.
authors:
  - Edda Nwafor
  - Solveig Adeyemi
  - Thandiwe Solberg
preset: brochure
school: School of Continuous Improvement
date: 2026-10-02
publishedAt: "2026-10-02T14:01:55+10:00"
doi: 10.5555/slop.lnfd4g
summary: >-
  A research-showcase brochure from the School of Continuous Improvement
  follows a programme of interviews with a library-concourse vending-machine
  refiller and the regulars who wait for a second packet to drop, who call it a
  loan from the machine. It sets out the University's adoption of their term, a
  debt of one packet per double drop settled at a witnessed quarterly
  reconciliation, and points readers to seven published studies of ordinary
  arrangements described in participants' own words.
topic: >-
  The vending-machine refiller on the library concourse hears from the people
  who wait for a second packet to drop that they treat it as a loan from the
  machine, and the University adopts their term by entering each double drop as
  a debt of one packet, repaid at the next purchase and settled at a quarterly
  reconciliation of the machine.
