title: Scored Against a Plant Nobody Built
subtitle: Facet Support in Data Envelopment Analysis of Process-Innovation Efficiency
authors:
  - Brynjar Obiora
  - Lindiwe Achterberg
  - Mirela Hanke
preset: paper
school: School of Underlying Conditions
date: 2026-11-16
