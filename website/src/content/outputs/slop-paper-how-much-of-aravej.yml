doi: 10.5555/slop.aravej
summary: >-
  A paper from the School of Underlying Conditions proposes a facet-support
  ratio for data envelopment analysis, the distance from a unit's projected
  target to the nearest observed unit in units of the sample's typical
  spacing, and reports it for 58 manufacturing plants rated on their
  process-innovation programmes. Twenty of the 41 plants rated inefficient
  under variable returns are projected to weakly supported targets, support
  is moderately associated with the gap between convex and free-disposal-hull
  scores, and no plant in the panel's middle band of programme scale reaches
  the convex frontier, though seven of its eight are efficient under free
  disposal.
topic: >-
  how much of a plant's DEA innovation-efficiency score rests on frontier
  facets interpolated between distant observed peers, and a facet-support
  diagnostic for reporting it
