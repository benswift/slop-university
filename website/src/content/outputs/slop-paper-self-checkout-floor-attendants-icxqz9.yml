title: Flagged for Helping
subtitle: An Interview Study of Self-Checkout Floor Attendants and the Assist Index That Scores Every Override Against Them
authors:
  - Iben Chikere
  - Anneke Tolan
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-09-11
publishedAt: "2026-09-11T01:32:30+10:00"
doi: 10.5555/slop.icxqz9
summary: >-
  A paper from the School of Emergent Priorities interviews 34 self-checkout
  floor attendants across nine supermarket and strip-mall sites, coding what
  triggers a bagging-area alert in attendants' own vocabulary and matching it
  against the same events as logged by the Assist Index. The two accounts
  agree closely on only one of four common categories, and attendants whose
  banks generate more logged assists now rank lower on the Index's
  shift-priority tier.
topic: >-
  Self-checkout floor attendants explain, in their own words, what actually
  triggers the unexpected-item-in-the-bagging-area alert, once every override
  they key in began counting toward a published Assist Index that now gates
  their shift priority.
