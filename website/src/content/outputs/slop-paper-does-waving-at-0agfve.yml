doi: 10.5555/slop.0agfve
summary: >-
  A paper from the School of Emergent Priorities times 5,544 waved and unwaved
  approaches at eleven campus entrances with a 240 frames-per-second camera,
  and detects no difference in how soon an automatic sliding door opens: mean
  latency is 0.618 s unwaved and 0.621 s waved, and three forms of wave are
  indistinguishable from one another. The University has adopted the result as
  a Door Response Standing Order under which a helpdesk report of a slow door
  is closed on citation of the paper.
topic: >-
  Does waving at an automatic sliding door make it open sooner than walking
  straight up to it?
