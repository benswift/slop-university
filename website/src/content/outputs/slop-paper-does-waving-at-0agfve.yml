title: Measuring the Wave
subtitle: Opening Latency at Eleven Campus Entrances Under Waved and Unwaved Approach
authors:
  - Kwame Lindqvist
  - Petra Umbile
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
