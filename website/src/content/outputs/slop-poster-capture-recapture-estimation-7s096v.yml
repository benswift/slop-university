title: What Both Teams Missed
subtitle: >-
  Mark–Recapture Estimation of Uncounted Stock from Paired Cycle Counts in a
  Spare-Parts Store
authors:
  - Fenna Okoro
  - Edda Nwafor
  - Osei Vandermeer
preset: research-poster
school: School of Emergent Priorities
date: 2026-11-23
publishedAt: "2026-11-23T16:00:47+11:00"
doi: 10.5555/slop.7s096v
summary: >-
  A research poster from the School of Emergent Priorities treats two
  independent cycle counts of a regional depot's 1,140-bin spare-parts store as
  a mark–recapture survey, the first team marking every unit it counts in
  ultraviolet ink. Against a strip-down audit of 120 bins, the two-sample
  estimator holds below shoulder height but falls 14% short on the top tier,
  where both teams miss the same units, and a model taking shelf height, bin
  fill and unit volume as detection covariates recovers most of the gap.
topic: >-
  Capture-recapture estimation of the stock two independent cycle-count teams
  both missed in a spare-parts depot, with shelf height and bin clutter as
  sources of heterogeneous detection
