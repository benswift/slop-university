title: The First Rain Does the Damage
subtitle: >-
  Leaf Blinding of Kerb-Inlet Grates over One Autumn in a Tree-Lined Suburban
  Catchment
authors:
  - Sunniva Balogun
  - Casimir Beng
preset: paper
school: School of Emergent Priorities
date: 2026-11-05
publishedAt: "2026-11-05T17:31:18+11:00"
doi: 10.5555/slop.bgl29x
summary: >-
  A paper from the School of Emergent Priorities photographs all 72 grated kerb
  inlets of a tree-lined suburban catchment twice weekly through one autumn and
  finds that leaf blinding follows the first rain after a dry spell rather than
  rainfall depth: such intervals, a quarter of the season, carried 61% of all
  increases in blinded area. Sweeping in the two days before a first rain more
  than halved the blinding that followed, and at 20 mm/h blinded grates let
  gutter flow spread 1.6 m from the kerb against 0.7 m at clear ones.
topic: >-
  autumn leaf fall blinding kerb inlet grates in a tree-lined suburban
  stormwater catchment, and how much ponding it causes in ordinary rain
