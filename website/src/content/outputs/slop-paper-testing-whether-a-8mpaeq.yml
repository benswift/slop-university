title: Stopped the Clock, Kept the Seat
subtitle: >-
  A Staggered RFID Audit of Self-Reported Table Time at a Board Game Café
authors:
  - Marek Solheim
  - Ronja Oyelaran
preset: paper
school: School of Emergent Priorities
date: 2026-08-12
publishedAt: "2026-08-12T16:02:32+10:00"
doi: 10.5555/slop.8mpaeq
summary: >-
  A paper from the School of Emergent Priorities instruments eight of a
  board game café's sixteen tables with a silent RFID chip-in/chip-out
  sensor against a staggered rollout, comparing nine months of
  self-reported kiosk stop times to sensor-confirmed vacate times.
  Self-reported stops cluster in the two minutes before each half-hour
  billing boundary, and the sensor shows tables remaining occupied for a
  median 27 minutes after the self-reported stop, a gap an in-café
  honesty-nudge placard leaves unchanged.
topic: >-
  testing whether a board game café's self-service kiosk table timer,
  which customers start and stop themselves to be billed by the
  half-hour, tracks how long a table is actually occupied, using a
  staggered rollout of a silent RFID chip-in/chip-out sensor across half
  the café's tables against nine months of self-reported kiosk logs, and
  finding self-reported sessions cluster just under each half-hour
  billing boundary while the RFID sensor shows the table remaining
  physically occupied for a further 20 to 40 minutes past the
  self-reported stop
