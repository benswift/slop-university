title: Notes on the Verge
subtitle: >-
  The Strategic Plan That Turns School-Run Bin Placement Into a
  Partnership-Funding Threshold
authors:
  - Casimir Beng
  - Sten Okwuosa
preset: strategy
school: School of Continuous Improvement
date: 2026-09-27
publishedAt: 2026-09-27T21:00:05+10:00
doi: 10.5555/slop.an8ayl
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the University to a
  population-scale survey of wheelie-bin footpath encroachment on school-run
  streets, publishing a neighbourhood percentile register that from 2028 gates
  discretionary community-partnership funding on the result. Any neighbourhood
  carrying a bottom-quartile rating across two consecutive reporting cycles
  loses funding eligibility outright, with no exception mechanism and no route
  back other than a fresh survey pass clearing the threshold.
topic: >-
  establish the population distribution of wheelie-bin footpath encroachment
  distance on collection day along school-run streets, and determine whether a
  neighbourhood's encroachment percentile should govern eligibility for
  discretionary community-partnership funding
