doi: 10.5555/slop.9rm5hh
summary: >-
  A research poster from the School of Emergent Priorities builds a
  five-category typology of small-business star-review content, double-coded
  across 1,240 reviews for 58 campus-facing businesses, and adopts the
  resulting content-corrected score as the sole eligibility figure for the
  University's approved small-business supplier list.
topic: >-
  Establish a typology of small-business star-review content --- separating
  service-relevant complaints from parking gripes, mistaken-venue posts, and
  unrelated staff grievances --- to recalculate the corrected review score
  that gates a business's place on the University's approved small-business
  supplier list.
