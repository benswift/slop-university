summary: >-
  A case-for-support brochure from the School of Continuous Improvement
  invites donors and partners to back the University's carbon dioxide
  catalysis as a single continuous process, from the captured feedstock
  through the recyclable catalyst to the flowing reactor and the screen that
  watches it. It sets out three settings for partnership and rests the case
  on eight published outputs cited by title and DOI.
