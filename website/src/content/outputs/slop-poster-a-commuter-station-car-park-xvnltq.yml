doi: 10.5555/slop.xvnltq
summary: >-
  A research poster from the School of Emergent Priorities tests, over 61
  weekdays and 18,406 approaching cars at one commuter-station car park,
  whether entries jump at the five-free-bay line where an attendant hand-switches
  the entrance sign to FULL. They do not (87.6% lit against 88.3% unlit), so the
  half-star rating result fails to reproduce, and the operator adopts a
  fortnightly Cutoff Ladder that moves the line one bay at a time until a jump
  appears.
topic: >-
  A commuter-station car-park attendant, who hand-switches the entrance sign to
  FULL below five free bays, replicates the University's half-star rating-cutoff
  finding and finds drivers enter at the same rate on either side of the line.
