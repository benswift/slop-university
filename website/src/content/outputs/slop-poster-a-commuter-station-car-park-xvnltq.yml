title: Towards a Ladder of Cutoffs
subtitle: A Failed Replication of the Half-Star Line at a Station Car Park's FULL Sign
authors:
  - Runa Adegoke
  - Kwame Lindqvist
  - Anneke Tolan
preset: research-poster
school: School of Emergent Priorities
