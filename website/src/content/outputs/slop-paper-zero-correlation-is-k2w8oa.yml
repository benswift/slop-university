title: Nothing New to Report
subtitle: >-
  A Failed Cross-Domain Replication of the Lecture-Capture Sophistication
  Penalty in a Franchise Shift-Handover
authors:
  - Joost Nwosu
  - Sten Okwuosa
preset: paper
school: School of Continuous Improvement
date: 2026-09-15
publishedAt: "2026-09-15T01:51:36+10:00"
doi: 10.5555/slop.k2w8oa
summary: >-
  A paper from the School of Continuous Improvement retests the University's
  lecture-capture Sophistication Penalty (installed automation capability
  predicting a fall in human recall, r = -0.72) inside a 22-outlet
  convenience-store franchise's AI-summarised shift-handover app, finding no
  relationship between the app's Structuring Score and incoming staff's
  blind stand-up recall (r = -0.04) across 84 store-weeks, a null an ablation
  leaves unchanged. The franchise's Handover Excellence certification, which
  gates shift-lead roster eligibility on the Structuring Score and cites the
  original finding as its basis, remains in force regardless.
topic: >-
  Zero correlation is what a franchise retail chain's incoming-shift recall
  audit finds when it retests the University's lecture-capture Sophistication
  Penalty (installed automation capability predicting recall, r=-0.72) on an
  AI-summarised shift-handover app that replaced the paper diary at every
  back-of-house counter.
