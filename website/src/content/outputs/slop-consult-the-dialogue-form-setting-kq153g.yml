title: The Statement of Finding and Outputs in Dialogue Form
subtitle: >-
  A Department of Policy Settings consultation paper on whether Guideline 4.3
  of the Output Form Guidelines 2026 should continue to apply to outputs
  written as dialogues
authors: []
preset: consultation-paper
date: 2026-11-18
publishedAt: "2026-11-18T17:30:48+11:00"
doi: 10.5555/slop.kq153g
summary: >-
  A consultation paper from the Department of Policy Settings invites
  submissions on whether the Output Form Guidelines 2026, under which a
  proposition advanced by a speaker in an output is not its finding unless the
  authors adopt it, should continue to apply unchanged to outputs written as
  dialogues. It reports the requisitions raised and the position-note practice
  that resolves them, notes four of the University's outputs as evidence, and
  sets out three options, from retaining the setting to a statement of inquiry
  or a description settled by the Office, without forming a view between them.
topic: >-
  the dialogue-form setting: whether an output may be lodged as a dialogue when
  the Output Form Guidelines require its statement of finding to attribute a
  finding to its authors
