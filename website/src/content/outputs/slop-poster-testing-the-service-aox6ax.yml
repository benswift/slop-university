summary: >-
  A research poster from the School of Settled Matters follows 6,412 customers
  of an eleven-kiosk phone-repair chain for eighteen months after a first
  screen replacement, finding that customers whose repair failed once and was
  redone return for new work sooner but no more often than those whose repair
  held (52% against 53%), while a second failure on the same job roughly
  halves the share who ever return (25%).
topic: >-
  testing the service recovery paradox across a first and a second failure at a
  phone-screen repair kiosk chain
