doi: 10.5555/slop.x2we8r
summary: >-
  A second-site replication of the leftovers-arbiter tenure cycle on 47
  open-plan floors finds organiser spells unimodal and sticky, aligned with
  remaining job tenure, and unmoved by a printed rotation card. The School of
  Emergent Priorities adopts a Tipping Envelope Succession Standard that rotates
  the envelope at the leftovers-survey median, freezes the floor's social-club
  cost centre on any missed turn, and carries no incumbent exemption.
