title: Footy-tipping organisers hold the envelope until they leave the floor
subtitle: Does open-plan footy tipping follow the leftovers-arbiter tenure cycle?
authors:
  - Ylva Onyekwere
  - Anneke Tolan
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-10-06
