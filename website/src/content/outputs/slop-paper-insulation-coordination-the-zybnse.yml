title: Who Fails First
subtitle: Insulation Coordination as a Constitution of Permitted Failure
authors:
  - Anselm Threlkeld
preset: paper
school: School of Settled Matters
date: 2026-11-11
publishedAt: "2026-11-11T09:31:18+11:00"
doi: 10.5555/slop.zybnse
summary: >-
  An essay in political theory from the School of Settled Matters reads
  insulation coordination, the high-voltage practice of deciding in advance
  which part of a network fails first, as a constitution for allocating
  failure, through the forty-one-document coordination file of one regional
  transmission operator. It argues that the move from a deterministic margin to
  a statistical rate of accepted failure turned a rule whose reasons a later
  reader can recover into a figure that can be applied but no longer explained
  to those who bear it.
topic: >-
  insulation coordination, the high-voltage practice of deciding in advance
  which part of a network is permitted to fail first, read by political theory
  as a constitution for allocating failure
