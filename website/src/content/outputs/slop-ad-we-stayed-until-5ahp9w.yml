summary: >-
  A marketing poster from the School of Underlying Conditions shows a lone
  researcher at a microscope in a darkened imaging room, looking up at a
  circular window in which a cluster of cells is being overtaken at one edge,
  and invites the passer-by to read One Germinal Centre, Entire, the School's
  account of a single germinal centre watched from its coalescence to its
  dissolution.
