title: Every Unit Will Be Issued a Risk Allowance
subtitle: >-
  The 2026-2031 Strategic Plan Meters Institutional Exposure in Exposure-Hours,
  Provisions It by Unit, and Reports an Undrawn Allowance as a Variance
authors:
  - Solveig Adeyemi
  - Bram Ntuli
preset: strategy
school: School of Continuous Improvement
date: 2026-08-17
publishedAt: 2026-08-17T18:03:03+10:00
doi: 10.5555/slop.ryazwo
summary: >-
  Slop University's Strategic Plan 2026-2031 adopts the exposure-hour as an
  institutional unit of account and provisions each organisational unit an
  annual Exposure Allowance against it, metered where exposure is actually
  taken --- the store-room ladder, the bench at a community shed, the urn in a
  tea room --- rather than estimated afterwards from a report. The plan's
  binding provision is a symmetry in reporting: an allowance left materially
  undrawn at acquittal becomes a variance, considered on the same footing as one
  drawn too far.
topic: >-
  issue every unit a metered annual risk allowance it is expected to spend, and
  treat an unspent allowance as an assurance finding
