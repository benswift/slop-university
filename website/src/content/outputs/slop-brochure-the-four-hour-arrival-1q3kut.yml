summary: >-
  A research-showcase brochure setting out the University's programme on the
  promised arrival window --- the four-hour band on a delivery card or a repair
  booking, and the morning it commits on the other side. Four published studies
  are cited by title and identifier, with a figure setting each one's reported
  service indicator beside the figure the study recomputes from the same records.
topic:
  the four-hour arrival window on the delivery card and the tradesperson's
  booking text --- a campaign for the university that counts the waiting a
  promise creates, not just whether the window was met
