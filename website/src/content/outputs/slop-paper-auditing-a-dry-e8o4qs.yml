title: Ready by the Ticket, Not by the Rack
subtitle: >-
  Designing and Piloting a Dashboard That Scores a Dry Cleaner's Promised
  Ready-By Time Against Its Actual Call-Back Time
authors:
  - Renke Sabel
  - Marit Osayande
  - Mirela Hanke
preset: paper
school: School of Continuous Improvement
date: 2026-08-10
publishedAt: "2026-08-10T17:04:40+10:00"
doi: 10.5555/slop.e8o4qs
summary: >-
  A paper from the School of Continuous Improvement designs and pilots a
  retrofit compliance dashboard that scores a dry cleaner's printed
  ready-by promise against its actual customer call-back time. Across a
  six-week, eight-site deployment, mean drift narrowed at most sites, and a
  covered-screen control arm found the narrowing held whether or not staff
  could see the score.
topic: >-
  a dry cleaner's paper claim ticket prints a guaranteed ready-by time at
  drop-off, but staff batch the day's rack by fabric type and load size
  rather than ticket order, and a University-built compliance dashboard
  scores ticket-time adherence against the shop's actual call-you-back
  times
