title: Does the Lock Close the Loop?
subtitle: >-
  A Regression-Discontinuity Test of a Neighbourhood Forum's 30-Day Archive
  Cutoff on Whether Reported Problems Get Fixed
authors:
  - Anneke Tolan
  - Hedvig Anyanwu
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-16
publishedAt: "2026-09-16T11:28:43+10:00"
doi: 10.5555/slop.1m7djm
summary: >-
  A research poster from the School of Emergent Priorities exploits the
  naturally occurring cutoff at which a neighbourhood forum auto-locks a
  thread to new replies, thirty days after its last activity, as a
  regression-discontinuity design. Threads that cross the lock line are
  confirmed fixed at a markedly and discontinuously lower rate than threads
  that stay just inside it, an effect two placebo cutoffs fail to reproduce.
topic: >-
  a neighbourhood forum auto-locks a thread to new replies once it crosses a
  fixed 30-day inactivity cutoff; a regression-discontinuity design compares
  threads that crossed the lock line by a day or two against threads that
  stayed just inside it, on whether the reported problem actually got fixed
