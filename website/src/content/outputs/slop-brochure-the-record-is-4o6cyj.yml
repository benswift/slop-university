summary: >-
  A case-for-support brochure from the School of Settled Matters asks partners
  and donors to help keep its collection of superseded certificates of title,
  whose burdens still bind while the iron-gall ink recording them oxidises and
  hastens the paper's decay. Three features set out what the titles carry, what
  their ink is doing, and how the law settles questions of slow change, resting
  the case on seven published studies from three Schools cited by title and DOI.
