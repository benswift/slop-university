title: Please Do Not Erase
subtitle: >-
  The Ghost Gauge and the Shared Office Whiteboard: A Survey of Residual Notes,
  Reported as Distributions
authors:
  - Eskil Nwabueze
  - Dagny Okafor
  - Iben Chikere
preset: brochure
school: School of Continuous Improvement
date: 2026-10-06
publishedAt: "2026-10-06T13:00:55+11:00"
doi: 10.5555/slop.ot3i8e
summary: >-
  A civic-minded brochure from the School of Continuous Improvement presents
  the Ghost Gauge, a clipboard-and-ruler survey of how long a half-erased note
  survives on the shared whiteboard of an open-plan office, reports the
  readings as distributions rather than single figures, and records the
  University's rule that no whiteboard it owns is wiped until the ghost on it
  reaches the surveyed median age.
topic: >-
  The Ghost Gauge, a clipboard-and-ruler instrument, records how many weeks a
  half-erased note survives on the shared whiteboard of an open-plan office,
  across a survey of offices reported as distributions, and the University stops
  wiping any whiteboard it owns until the ghost on it passes the surveyed median
  age.
