summary: >-
  A research poster from the School of Settled Matters prepares one
  nitrito-cobalt(III) macrocycle cation as seven salts and follows each by
  weekly infrared spectroscopy through 52 weeks in the dark at 25 °C. For six
  salts the half-life of conversion to the nitro isomer falls steadily with the
  reaction-cavity volume around the nitrito group, from 205 days to 4; the
  nitrate salt, whose anion accepts both of the macrocycle's N–H hydrogen
  bonds, lies forty-fold above that trend, with only 17 per cent converted
  after a year.
topic: >-
  How the counter-anion lattice sets the pace of slow solid-state
  nitrito-to-nitro linkage isomerisation in a family of new cobalt(III)
  macrocycle salts
