title: Oxygen-Bound for a Year
subtitle: >-
  Counter-anion control of solid-state nitrito→nitro isomerisation in seven
  cobalt(III) macrocycle salts
authors:
  - Anselm Threlkeld
  - Clemency Tredinnick
  - Gunnhild Ekwueme
preset: research-poster
school: School of Settled Matters
