summary: A civic brochure from the School of Emergent Priorities invites the
  University's neighbours into its approach to sulfur-based synthesis, newly
  drafted onto the Horizon Register as a priority on approach. It sets out the
  Register entry, the synthesis benches of the School of Underlying Conditions
  and the seasonal open evenings at which residents' short dated accounts of
  what the air is doing are entered as signals, and points to six published
  outputs across three schools.
