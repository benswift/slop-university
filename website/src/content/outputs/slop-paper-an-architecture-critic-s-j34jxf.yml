title: Ten Is a Landing
subtitle: Reading a Primary School's Number Stair as Three Lines at Once
authors:
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-29
publishedAt: "2026-10-29T23:01:15+11:00"
doi: 10.5555/slop.j34jxf
summary: >-
  A paper from the School of Underlying Conditions offers a work of building
  criticism on the twenty-riser numbered stair of a suburban primary school,
  built to a brief asking for a number line children would climb. From a
  measured survey and five mornings of watching it in use, it finds the stair
  draws three lines at once, even in height, folded at a landing seven and a
  half goings long between ten and eleven, and reversed after ten when seen
  from the hall, and argues that the landing should be left as it is.
topic: >-
  an architecture critic's reading of a primary school's numbered stair, built
  to teach the mental number line by climbing, and what its half-way landing
  does to the line
