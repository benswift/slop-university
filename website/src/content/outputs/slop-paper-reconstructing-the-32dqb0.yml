title: Silent on Height
subtitle: Lifting Registered Easements from Scanned Plan Sheets into Three Dimensions
authors:
  - Clemency Tredinnick
  - Brynjar Obiora
preset: paper
school: School of Settled Matters
date: 2026-11-10
publishedAt: "2026-11-10T00:30:18+11:00"
doi: 10.5555/slop.32dqb0
summary: >-
  A paper from the School of Settled Matters and the School of Underlying
  Conditions recovers 1,973 easements from 1,146 scanned plan sheets and lifts
  each into a volume, recording every vertical bound the plan does not supply
  in an assumption ledger. Plan-view outlines are recovered with a median IoU
  of 0.91, but the sheets are silent on height for 68.7% of easements, and for
  403 of them whether the burden meets another registered interest turns on
  which default fills that silence.
topic: >-
  reconstructing the three-dimensional extent of easements from scanned
  two-dimensional title plans, and what the reconstruction must assume where a
  plan is silent on height
