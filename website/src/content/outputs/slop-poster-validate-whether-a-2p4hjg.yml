title: Signed, Not Checked
subtitle: The sign-off tracks the self-assessment it was meant to audit
authors:
  - Dagny Okafor
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-13
publishedAt: "2026-08-13T03:01:03+10:00"
doi: 10.5555/slop.2p4hjg
summary: >-
  A research poster from the School of Continuous Improvement matches 1,240
  signed-off shift-supervisor performance reviews across 68 stores of a
  retail chain against supervisors' own pre-review self-assessment scores
  and a composite record score built from the store's own till-accuracy and
  roster-reliability logs. Signed-off ratings correlate strongly with
  self-assessment (r = 0.87) and weakly with the independently logged record
  (r = 0.21), and the gap between the self-assessment and the record widens
  with supervisor tenure, from 2 points under six months to 23 points at
  five-plus years.
topic: >-
  Validate whether a retail chain's shift supervisors' own pre-review
  self-assessment score tracks the till-accuracy and roster-reliability
  numbers the chain already logs for them, or whether managers who sign off
  on it are just reading back what staff wrote
