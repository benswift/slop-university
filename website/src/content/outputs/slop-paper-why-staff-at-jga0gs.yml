doi: 10.5555/slop.jga0gs
summary: >-
  A paper from the School of Continuous Improvement interviews 47 staff
  across twelve break-room sites of a single facilities provider, finding
  that staff route around an auto-reordering supply shelf's own accounting
  once its weekly consumption report begins setting a departmental
  stationery budget. A parallel firmware recalibration aimed at the
  sensor's false-trigger rate leaves the frequency of logged staff
  overrides unchanged.
topic: >-
  why staff at a mid-size office keep quietly overriding the break room's
  auto-reordering supply shelf --- an interview study of the people who
  route around a weight-sensor spend report before it can set next
  quarter's stationery budget
