title: Why We Turn It Off
subtitle: >-
  An Interview Study of Staff Who Route Around an Auto-Reordering Supply
  Shelf's Spend Report
authors:
  - Torun Ezeigwe
  - Solveig Adeyemi
  - Marit Osayande
preset: paper
school: School of Continuous Improvement
date: 2026-08-08
