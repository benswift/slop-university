title: Held in Suspense
subtitle: >-
  Recognition and the Clearing of Unexplained Differences across Twenty-Two
  Year-End Closings at a Grain Co-operative
authors:
  - Ragnhild Uzoma
  - Kwame Lindqvist
  - Tove Ilesanmi
preset: paper
school: School of Underlying Conditions
date: 2026-10-31
publishedAt: "2026-10-31T16:02:16+11:00"
doi: 10.5555/slop.tx2dv4
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities follows all 389 items that stood on a grain co-operative's
  year-end suspense schedules across twenty-two closings to the entry that
  removed each. Two-thirds of the items that left after one closing were
  traced, but only 7 per cent of those on three or more schedules; older items
  left by write-off timed to the auditor's triviality threshold, by netting, or
  in a conversion difference at a ledger migration, while the reported net
  balance never exceeded $2,400 and the gross rose sevenfold.
topic: >-
  the suspense account as recorded absence: twenty-two year-end closings at a
  regional grain cooperative, read for how each difference nobody could
  explain was carried, cleared or written off, and what the clearing route
  says about recognition
