doi: 10.5555/slop.wh2bfv
summary: >-
  A paper from the School of Underlying Conditions transcribes 120 reading
  rounds from the radio log of twenty-two hillslope piezometers in an adapted
  conversation-analytic notation and describes how the nodes allocate turns,
  fall silent, overlap and repair. It finds that a speaking node cannot hear
  an overlap and learns of it only from a missing acknowledgement, and that in
  148 of 402 repair sequences a node repeated a reading its addressee had
  already received.
topic: >-
  A conversation-analytic study of turn-taking, overlap and repair among the
  radio nodes of a low-power wireless sensor network, transcribed from the
  packet log of a hillslope piezometer deployment
