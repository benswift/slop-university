title: Named, Not Restocked, Explained
subtitle: Casimir Beng, Joost Nwosu and Mirela Hanke on what naming an owner changes
  about a meeting-room marker caddy
authors:
  - Casimir Beng
  - Joost Nwosu
  - Mirela Hanke
preset: video-explainer
school: School of Continuous Improvement
date: 2026-10-20
