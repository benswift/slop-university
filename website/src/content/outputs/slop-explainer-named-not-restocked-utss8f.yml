doi: 10.5555/slop.utss8f
summary: A research explainer from the School of Continuous Improvement on Casimir
  Beng, Joost Nwosu and Mirela Hanke's term-long test of Directly Responsible Individual
  placards on meeting-room whiteboard-marker caddies. It follows the weekly audit
  from the labelled caddy to the nearest stationery cupboard, then sets the caddy's
  stocked-rate beside what staff came to believe about it. The authors describe the
  pilot, the pairing and the survey in their own words.
topic: A research explainer of the paper testing whether a placard naming a Directly
  Responsible Individual on shared meeting-room whiteboard-marker caddies changes
  how often they are found stocked, set against the caddy's distance to the nearest
  supply cupboard and staff confidence that it will be restocked
