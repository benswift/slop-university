title: The Box You Drew
subtitle: Selecting Below the Time-Frequency Limit in a Spectrogram Editor
authors:
  - Runa Adegoke
  - Ragnhild Uzoma
preset: paper
school: School of Emergent Priorities
date: 2026-10-20
