summary: >-
  A case-for-support brochure from the School of Underlying Conditions presents
  the School's work on charcoal as a single programme: the fragments a soil
  survey crew meets in a described profile, the adsorbent materials the
  Basement Relations Group follows from the ground to the bench, and the kilns
  and chimneys where charcoal is made and burnt. It invites partners to sustain
  the survey's field seasons and reference collection, and rests its appeal on
  seven published outputs cited by title and DOI.
topic: >-
  what the fire left in the ground: the case for supporting a soil survey's
  reading of the charcoal buried in its profiles, at the School of Underlying
  Conditions
