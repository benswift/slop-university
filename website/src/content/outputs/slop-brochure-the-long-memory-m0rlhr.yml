summary: >-
  A research showcase from the School of Settled Matters presents the
  University's work on systems whose present depends on the whole of their
  past, taking the fractional differential equation as its organising idea and
  following it through groundwater modelling in the School of Underlying
  Conditions, the physics of hysteresis in the School of Continuous
  Improvement, and the law of precedent. It profiles three researchers and
  rests its account on seven published studies from four Schools, cited by
  title and DOI.
topic: >-
  the long memory: fractional differential equations, in which the present
  answers to its whole past, as a way of working across the University
