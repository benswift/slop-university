title: Agreement Without Resolution
subtitle: >-
  Reliability and Criterion Validity of a Twenty-Item Contact-Centre
  Call-Quality Rubric
authors:
  - Torun Ezeigwe
  - Solveig Adeyemi
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-04
publishedAt: 2026-08-04T13:02:02+10:00
doi: 10.5555/slop.kwilvd
summary: >-
  A research poster from the School of Continuous Improvement has three
  accredited assessors score 384 recorded calls to one water utility's contact
  centre against the twenty-item rubric from which the centre reports its
  service quality, with the item weights and the resolution coding frame fixed
  before the first call was drawn. Assessor agreement is near-total (ICC 0.91,
  95% CI 0.89 to 0.93), while the score's association with resolution at
  fourteen days, coded from the utility's own works records by a blinded coder,
  is 0.04 (95% CI -0.06 to 0.14). Two of the twenty items, whether a next step
  was set with a date and whether the fault was raised as a job, carry 15.5 per
  cent of the rubric's points and 70.1 per cent of the explained variance in
  resolution.
topic: >-
  contact-centre call quality at a water utility, where the service-quality
  figure reported upward is how closely the three assessors agree with each
  other: their scores of the same recorded calls about leaks and bills predict
  nothing about whether the caller's problem was resolved, and the rubric's
  heaviest-weighted items are the ones callers respond to least
