title: Less Leaf, Not More Alkaloid
subtitle: Leaf Indole Alkaloid Concentration and Per-Plant Pool Across a Gravimetric Soil-Water Gradient in a Clonal Shrub Line
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-11-15
publishedAt: "2026-11-15T20:01:46+11:00"
doi: 10.5555/slop.gks62e
summary: >-
  A paper from the School of Underlying Conditions grows 60 rooted cuttings of
  one clonal shrub line for ten weeks at five soil-water regimes held by daily
  weighing, and finds that at 40% of pot capacity leaf indole alkaloid
  concentration rose by 54% while leaf dry mass fell by 49% and the alkaloid
  pool per plant fell by 21%. About three-fifths of the concentration rise is
  what a plant of that size carries in any regime; the rest is a modest regime
  effect, about half of it one minor alkaloid.
topic: >-
  whether a soil-water deficit raises the indole alkaloid content of a
  glasshouse shrub accession or only shrinks the leaf dry mass it is divided
  by: concentration against per-plant alkaloid pool across a watering gradient
