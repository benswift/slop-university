summary: >-
  A research poster from the School of Underlying Conditions sets out a
  two-act, two-state decision analysis of a monthly groundwater dip round in
  which five of fourteen monitoring bores lie beyond a creek crossing that may
  be closed. The two orderings of the round tie at a closure probability of
  0.40, where advance knowledge of the crossing is worth 1.2 bores dipped, and
  a phone call costed at 0.3 bores repays itself on 24 of 31 logged rounds
  against the 7 on which it was made.
topic: >-
  a decision analysis of a groundwater dip round: whether to drive to the
  far-side bores first when the creek crossing may be closed, and what a phone
  call to find out beforehand is worth
