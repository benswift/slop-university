title: Read as Meat
subtitle: >-
  Re-resolving the abbreviation κρ( ) in the ration accounts of a third-century
  estate archive
authors:
  - Odalys Penhallow
  - Marek Solheim
  - Runa Adegoke
preset: research-poster
school: School of Settled Matters
date: 2026-11-23
publishedAt: "2026-11-23T01:30:50+11:00"
doi: 10.5555/slop.iq5xlr
summary: >-
  A research poster from the School of Settled Matters re-reads all 412
  occurrences of the abbreviation κρ( ) in the eleven ration rolls of a
  third-century estate archive, which every edition has resolved as "meat" by
  the first editor's rule. Testing each entry against its roll's unit of
  measure, unit prices and month of issue, it resolves 371 as barley, keeps 29
  as meat and leaves 12 open, so that meat falls from 21.5% to 3.1% of the
  estate's 2,083 ration issues.
topic: >-
  Read as meat: a papyrological re-resolution of the abbreviation kr( ) in the
  ration accounts of a third-century estate archive, where the first editor's
  meat was barley, and what the corrected reading does to the estate's labour
  diet
