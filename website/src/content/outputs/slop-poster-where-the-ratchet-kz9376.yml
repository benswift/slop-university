summary: >-
  A research poster from the School of Underlying Conditions models a
  pledge-and-review agreement as a monotone map on a finite lattice of
  conditional pledge profiles and proves that repeated upward-only stocktakes
  halt, within a bound on rounds that a cascade schedule attains exactly, at
  the least standing profile above where they began. From an empty profile the
  ratchet stands at the least matched profile and never reaches a higher one,
  as a two-party instance with three matched profiles illustrates.
topic: >-
  Where the ratchet stands: a Tarski fixed-point theorem for conditional
  emissions pledges, showing that iterated stocktakes on a finite lattice of
  pledge profiles halt at the least fixed point above the starting profile,
  within a sharp bound on rounds, and that review alone never closes the gap
  to the greatest
