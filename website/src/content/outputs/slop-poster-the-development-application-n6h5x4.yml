title: Return the Slip, Lose the Objection
subtitle: Replicating a Confirmation-Step Null Result in Council Notifications
authors:
  - Kwame Lindqvist
  - Ingrid Vasseur
  - Mirela Hanke
preset: research-poster
school: School of Emergent Priorities
