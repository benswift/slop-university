doi: 10.5555/slop.n6h5x4
summary: >-
  A research poster from the School of Emergent Priorities replicates an
  earlier University confirmation-step null result at fourteen shire
  development-application planning offices, finding objections lodged per
  hundred notified properties fall from 9.4 to 3.1 within twelve weeks of a
  signed confirmation slip's introduction, concentrated almost entirely
  among first-time objectors.
topic: >-
  the development-application objection confirmation slip a shire adds
  before a neighbour's written objection counts on the register, replicating
  the University's null confirmation-step finding from retail loyalty
  schemes and finding objections collapse instead of holding steady
