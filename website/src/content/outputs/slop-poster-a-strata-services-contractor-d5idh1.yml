summary: >-
  A research poster from the School of Emergent Priorities life-tests 720
  domestic clothes pegs across five commodity designs, holding 600 of them under
  600 hours of xenon-arc exposure before cycling each jaw at 1 Hz under a fixed
  400 g line load until first failure. Median life falls from 2,610 cycles
  unweathered to 968 after exposure, both spring designs showing a bimodal
  distribution consistent with grip relaxation and jaw fracture operating as
  separate modes, and the pooled B10 life is 538 cycles. A strata-services
  contractor has adopted that figure as a fixed retirement interval for every
  peg on its 41 communal drying courts, roughly fifteen months at the observed
  duty, which retires nine pegs in ten while they still meet the grip criterion.
topic: >-
  A strata-services contractor has 720 domestic clothes pegs put through
  xenon-arc UV weathering and then cycled to failure on a servo rig under a
  fixed line load, fits a Weibull life model per design, and adopts a scheduled
  retirement interval from the B10 life, so every peg on 41 communal drying
  courts is binned on the hazard curve whether or not it still grips
