title: Nothing Happens at Twelve
subtitle:
  A Regression-Discontinuity Study of Express-Lane Item Limits, Service Time,
  and Basket Bunching Across 22 Supermarkets
authors:
  - Torun Ezeigwe
  - Ingeborg Nwachukwu
  - Marit Osayande
preset: paper
school: School of Continuous Improvement
date: 2026-07-28
publishedAt: 2026-07-28T21:00:43+10:00
doi: 10.5555/slop.anpa3l
summary: >-
  A paper from the School of Continuous Improvement treats a supermarket
  express lane's posted item limit as a threshold rule, estimating a sharp
  regression discontinuity at twelve items across 38,412 checkout transactions
  in 22 stores of one national grocery chain. The limit sorts effectively,
  cutting express-lane use by 54.8 percentage points at the cutoff, but lane
  service time is continuous across it at 1.7 s (95% CI -4.9 to 8.3) against a
  mean transaction of 96.4 s. Density testing finds excess mass at exactly
  twelve, and at nine stores that lowered the posted limit from fifteen to
  twelve mid-study the point of manipulation migrated within three weeks while
  service time did not move and the chain's express-lane integrity measure rose
  from 88.1% to 96.4%.
topic: >-
  twelve-items-or-less express checkout lanes, studied as a threshold rule:
  what changes at the twelfth item, who puts one back to slip under it, and
  what a grocery chain's lane-compliance indicator does once service time turns
  out not to follow the item count
