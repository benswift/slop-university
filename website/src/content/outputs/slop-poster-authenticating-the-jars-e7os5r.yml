doi: 10.5555/slop.e7os5r
summary: >-
  A research poster from the School of Continuous Improvement authenticates 38
  jars labelled for hibiscus in a pharmacognosy teaching cabinet by HPTLC
  fingerprint and powder microscopy, and reads 1,140 archived practical slides
  from 1991 to 2024 to date each change of contents. Thirteen jars no longer
  hold roselle calyx, each change falls at a single refill, and ten fall in
  2009 to 2012, after the cabinet's stock book dropped its species column; no
  label was rewritten to match.
topic: >-
  authenticating the jars labelled hibiscus in a pharmacognosy teaching cabinet
  by HPTLC fingerprint and microscopy, and dating each jar's change of species
  to the refill at which its contents were replaced while its label stayed
