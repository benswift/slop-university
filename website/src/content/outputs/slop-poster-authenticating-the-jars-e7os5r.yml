title: The Label Stayed
subtitle: Dating species substitution in a teaching cabinet's hibiscus jars from 34 years of practical slides
authors:
  - Marit Osayande
  - Vigdis Emenike
  - Sunniva Balogun
preset: research-poster
school: School of Continuous Improvement
