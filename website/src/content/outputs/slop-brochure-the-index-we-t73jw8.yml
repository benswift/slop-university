summary: >-
  A research-showcase brochure setting out why the School of Continuous
  Improvement judges the University by its own continuously updated
  instruments --- the Indicator Commons, the Impact Pathway Atlas, and the
  Living Dashboard --- rather than by an external ranking's single annual
  snapshot, and surveys four recently published studies as evidence the
  instruments already withstand the scrutiny they invite.
