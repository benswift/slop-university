title: Lifted and Examined
subtitle: >-
  The Department of Policy Settings answers questions taken on notice by the
  Committee on Settings Oversight on the attendance label for vessels standing
  in the shared laboratories
authors:
  - Odalys Penhallow
  - Vigdis Emenike
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: questions-on-notice
date: 2026-11-23
publishedAt: "2026-11-23T22:00:57+11:00"
doi: 10.5555/slop.qyfkou
summary: >-
  The Department of Policy Settings answers five questions on section 14 of the
  Slop University (Shared Laboratories) Determination 2025, under which a
  vessel whose attendance label has not been initialled for 72 hours may be
  removed, and on the guidance note that counts a label as initialled only once
  the vessel has been lifted and examined, taken on notice at the Committee on
  Settings Oversight's Supplementary hearings of 20 November 2026 or lodged in
  writing after them. Its answers report eleven requests for review since
  commencement, none of which set a removal aside, and 480 vessels removed from
  four rooms; hold no record of which removed vessels belonged to a
  crystallisation, solubility or annealing series; treat a vessel inside a
  booked oven as attended until the booking ends; decline on resourcing to time
  each removal against its label; and decline to say what would become of
  vessels removed under a reading later found wrong.
topic: >-
  the unattended-vessel setting: the Committee presses the Department on the
  72-hour attendance label for vessels standing in shared laboratories, as it
  falls on slow crystallisation, solubility equilibration and long annealing
  series
