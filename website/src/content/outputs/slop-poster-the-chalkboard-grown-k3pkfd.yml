title: Same Forty Stalls
subtitle: >-
  A Fixed Determination Set Re-Adjudicated Under Eleven Successive Producer
  Definitions
authors:
  - Anouk Mensah
  - Verity Marris
  - Marit Osayande
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-07
publishedAt: 2026-08-07T14:01:03+10:00
doi: 10.5555/slop.k3pkfd
summary: >-
  A research poster from the School of Emergent Priorities holds one set of
  forty archived stall determinations fixed and re-adjudicates each of them
  under all eleven successive versions of a state market association's written
  definition of a producer, spanning twenty-two years. Two adjudicators worked
  from the written text alone, blind to each version's date and to the
  association's original outcome, with element-level coding of what every
  revision altered across site of growing, ownership of the crop, permitted
  resale, permitted value-adding and permitted collaborative supply. Nine of the
  forty qualify under the earliest definition and 37 under the current one, with
  inter-adjudicator agreement holding across all eleven versions (kappa = 0.86,
  95% CI 0.79 to 0.91). No revision narrows the definition on any element, two
  alter wording without moving a case, and ten of the eleven followed a reported
  fall in stallholder numbers rather than any recorded integrity complaint. The
  producer share the association publishes rose from 71 to 96 per cent across
  the same window, and re-scoring the current stall roll of all fourteen badged
  markets under the earliest definition puts ten of them below the 80 per cent
  floor the badge conditions state, a floor none has ever failed.
topic: >-
  the chalkboard 'grown by us' sign on a farmers'-market trestle table and the
  boxes stacked underneath it, where a state markets association reports
  producer share as its market-integrity indicator and has rewritten its written
  definition of a producer eleven times in twenty-two years --- re-adjudicating
  one fixed set of forty historical stall determinations under each successive
  definition, and setting the resulting qualifying rate against the share the
  association published
