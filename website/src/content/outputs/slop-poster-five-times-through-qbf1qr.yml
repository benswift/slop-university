doi: 10.5555/slop.qbf1qr
summary: >-
  A research poster from the School of Underlying Conditions puts one
  multiwalled carbon nanotube and polypropylene compound, let down to four
  loadings, through five passes of granulating and remoulding with no virgin
  material added, measuring volume conductivity and recovered nanotube length
  after each. Median tube length falls by more than half over the five passes; the 3.0 wt%
  grade loses less than a decade of conductivity, while the 1.5 wt% grade holds
  through two passes and then falls six decades at the third.
topic: >-
  five times through the granulator: electrical percolation lost across
  repeated regrind-and-remould cycles of one MWCNT/polypropylene compound, with
  nanotube length measured after each pass
