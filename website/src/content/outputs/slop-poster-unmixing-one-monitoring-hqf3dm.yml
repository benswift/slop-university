summary: >-
  A research poster from the School of Underlying Conditions resolves 118
  archived UV-visible spectra from thirty years of quarterly sampling at one
  observation bore into three components by multivariate curve resolution:
  the aquifer's dissolved organic matter, nitrate, and a third, chemically
  unassigned profile whose share of the 254 nm absorbance falls as the purge
  before sampling lengthens (Spearman ρ = −0.71 across 87 visits with a
  recorded purge). With that component separated, the organic-matter
  contribution shows no trend, and the poster concludes that the record's
  long rise at 254 nm was standing casing water reaching the bottle.
topic: >-
  unmixing one monitoring bore: multivariate curve resolution of thirty years
  of archived UV-visible spectra from a single groundwater bore, in which a
  third component that is neither the aquifer's organic matter nor its nitrate
  tracks how long the bore was purged before sampling
