doi: 10.5555/slop.xozf1u
summary: >-
  A paper from the School of Emergent Priorities follows one advisory
  practice's due-diligence team through eleven months, 96 versions of the
  group structure charts drawn for 23 client engagements and 27 interviews,
  and finds that above about thirty boxes a chart stopped growing: the rest of
  the group, 1,253 entities across the engagements, was folded into a single
  box marked "Others", which reached the risk register as one row rated low.
  It argues that the structure chart, not the statute or the published
  statement, is where the scope of diligence is settled.
topic: >-
  an STS ethnography of how a due-diligence team draws corporate group
  structure charts, and how the box marked Others settles which entities'
  human rights conduct gets examined
