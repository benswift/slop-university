summary: >-
  A civic brochure from the School of Settled Matters invites the region's
  employers and staff to bring the wording of their leave clauses, rosters and
  staffroom notices to the University's open readings. It sets the Received
  Readings Group's work on how a workplace question comes to be settled beside
  related research from two other Schools, and directs readers to six
  published studies cited by title and DOI.
