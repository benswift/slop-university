title: Timed to the Wrong Table
subtitle: >-
  An Audit Tool for Pager Reissue and the Validity of a Food Court's
  Buzz-to-Return Wait-Time Indicator
authors:
  - Torun Ezeigwe
  - Joost Nwosu
  - Mirela Hanke
preset: paper
school: School of Continuous Improvement
date: 2026-08-11
publishedAt: "2026-08-11T05:03:03+10:00"
doi: 10.5555/slop.ty5q4d
summary: >-
  A paper from the School of Continuous Improvement designs and field-tests
  an audit tool that cross-references a food court's pager-reissue logs
  against each stall's kitchen-ticket times across a six-week season and all
  fourteen tenancies, finding the published buzz-to-return leaderboard
  correlates only weakly with a cleaned, audit-verified ranking, and that a
  staff directive to scan returned pagers immediately left both the reissue
  rate and the leaderboard largely unchanged.
topic: >-
  a shopping-centre food court's pager buzzer system is supposed to page
  one customer per order, but under lunch-rush volume, staff sometimes hand
  out a pager that a previous customer hasn't yet returned, so a buzz
  occasionally summons the wrong table; building and field-testing an audit
  tool that cross-references pager-reissue logs against kitchen ticket times
  to test whether the food court's own average-wait KPI, calculated from
  buzz-to-return intervals, tracks kitchen speed or mostly tracks how
  quickly customers hand pagers back
