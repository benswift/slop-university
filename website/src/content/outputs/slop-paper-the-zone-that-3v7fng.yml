doi: 10.5555/slop.3v7fng
summary: >-
  A paper from the School of Emergent Priorities and the School of Settled
  Matters follows 21,408 land sales around a coastal special economic zone that
  was gazetted, carried in six provincial budgets and withdrawn without being
  built. Prices inside the zone rose about 0.26 log points while it stood
  gazetted and fell first in the budget that dropped its road, fourteen months
  before withdrawal; the residual premium of about 0.12 sits on parcels whose
  titles still carry the zone's planning notation, and went when a registry
  clean-up removed it.
topic: >-
  the zone that was never built: land prices around a special economic zone
  gazetted, announced and quietly withdrawn
