title: The Zone That Was Never Built
subtitle: Anticipation, Capitalisation and Unwinding in Land Prices around a
  Withdrawn Special Economic Zone
authors:
  - Kwame Lindqvist
  - Clemency Tredinnick
preset: paper
school: School of Emergent Priorities
date: 2026-11-14
