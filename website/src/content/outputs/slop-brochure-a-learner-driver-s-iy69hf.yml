summary: >-
  A civic brochure built around the household as instrument operator: the
  supervised-hours logbook kept at a kitchen table, and the exchange rate
  underneath its required total, where an hour with an accredited instructor
  is entered as three. It sets the Trajectory Analytics Group, the Adaptive
  Metrics Lab and the University's open seminar program beside three
  published findings on records that were read as more than they held.
topic: >-
  a learner driver's supervised-hours logbook, where an hour with an
  accredited instructor is entered as three, so the total that unlocks the
  test is met by conversion as much as by driving --- a campaign for a
  university that studies what a threshold actually buys
