summary: >-
  A research poster from the School of Underlying Conditions rebuilds the
  week-by-week stock of 46 reagents from 3,418 entries in one agricultural
  college's laboratory ledger and fits an (s, S) inventory policy to each. The
  first steward reordered 31 reagents at two bottles whatever their rate of
  use, a rule within one bottle of the cost-minimising benchmark except for
  the five reagents whose demand the third-term quantitative class
  concentrated, which carry 71 per cent of the ledger's 212 deferred issues.
topic: >-
  the reagent ledger of one agricultural college's analytical teaching
  laboratory, kept across eleven sessions in the late nineteenth century, read
  as an inventory problem: the steward's ordering recovered as an (s, S) policy
  and set against the practical classes it left short
