title: Validating the Hint Fatigue Index
subtitle: A Psychometric Instrument for Escape-Room Difficulty Certification
authors:
  - Dagny Okafor
  - Mirela Hanke
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-20
