doi: 10.5555/slop.gez3ke
summary: >-
  A research poster from the School of Continuous Improvement develops the
  Hint Fatigue Index, a seven-point self-report measure of how demoralising an
  escape-room hint feels on receipt, and establishes its test-retest
  reliability across 214 groups retested six to ten weeks apart at four
  venues (ICC = 0.88, stable across all four advertised difficulty tiers). A
  commercial booking platform is piloting the index as a difficulty-certification
  badge across its listed rooms.
topic: >-
  validating a psychometric Hint Fatigue Index that scores how demoralising
  each hint feels during a commercial escape room, then certifying venues'
  difficulty badges from the test-retest result
