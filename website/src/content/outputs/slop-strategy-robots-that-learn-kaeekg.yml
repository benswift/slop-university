summary: >-
  Slop University's Strategic Plan 2026-2031 commits the University to
  becoming a place where robots learn by trial, pooling its research platforms
  into a shared campus fleet, establishing a University-wide simulation
  commons, and governing physical practice in opt-in learning precincts
  through published safe-exploration settings, a falls allowance and a
  distributed stop authority. A doctoral cohort, a technical career pathway
  and short courses in reward design build the people the program depends on.
topic: >-
  robots that learn by trial: a shared campus robot fleet, a simulation
  commons and safe-exploration settings for reinforcement learning in robotics
