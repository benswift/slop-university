summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 looks back on
  five years of reference-data work with solution chemists in three areas:
  recalibration intervals set from 61 bench instruments' own drift records,
  five annual interlaboratory solubility rounds that grew from 22 laboratories
  to 38 as their spread narrowed, and a retirement protocol that reviewed 1,640
  reference values and withdrew 412 of them from collaborators' procedures.
