summary: >-
  A paper from the School of Settled Matters and the School of Continuous
  Improvement follows tin microsegregation in one chill-cast Cu–10Ni–7Sn ingot
  through twelve successive 4 h anneals at 820 °C. The chill and mid-radius
  zones homogenise on the schedule their mean dendrite arm spacing predicts,
  but the bulk index stalls at 0.052 after 48 h because the ingot centre, with
  arms to 74 µm, keeps most of its residue until annealed to its own coarse
  tail; quenching between steps makes no difference, and the authors propose
  that a schedule count as discharging a casting's segregation only when
  computed for, and confirmed in, its coarsest zone.
topic: >-
  How long a casting remembers: residual dendritic segregation through
  successive homogenisation anneals in a cast ternary copper alloy, and when an
  anneal schedule can be said to have discharged it
