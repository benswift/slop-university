title: What the Casting Still Carries
subtitle: Residual Microsegregation Through Successive Homogenisation Anneals of a Chill-Cast Cu–Ni–Sn Alloy
authors:
  - Clemency Tredinnick
  - Casimir Beng
preset: paper
school: School of Settled Matters
