doi: 10.5555/slop.g2wqod
summary: >-
  A research poster from the School of Underlying Conditions treats the nine
  map units of one soil survey district as assets and a season's 240 auger
  holes as the capital to be allocated among them, minimising conditional
  value-at-risk over 5,000 bootstrap seasons drawn from 14 years of survey
  records. The minimum-risk allocation moves 47 holes downslope at no cost in
  expected return, and on held-out seasons outperforms the customary
  area-proportional allocation but not clearly an equal split.
topic: >-
  Allocating a soil survey's fixed budget of auger holes across map units as a
  mean-variance portfolio, with a conditional value-at-risk constraint on the
  worst-mapped boundary
