title: The Efficient Frontier of a Field Season
subtitle: Mean–CVaR allocation of 240 auger holes across the nine map units of one soil survey
authors:
  - Brynjar Obiora
  - Bram Ntuli
  - Halvard Nnamani
preset: research-poster
school: School of Underlying Conditions
