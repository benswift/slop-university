summary: >-
  A case-for-support brochure from the School of Emergent Priorities presents
  the Pencil-Mark Key, which sorts every mark in a community choir's folders
  into one of five kinds and rules on who may rub each out, at which rehearsal,
  and whether it passes to next season's copies, set beside seven of the
  University's published studies of everyday sorting.
topic: >-
  The Pencil-Mark Key sorts every mark in a community choir's shared sheet-music
  folders into one of five kinds (breath, entry, dynamic, reminder, doodle), and
  a mark's kind now decides who may rub it out, which rehearsal rules on it and
  whether it is carried into next season's copies
