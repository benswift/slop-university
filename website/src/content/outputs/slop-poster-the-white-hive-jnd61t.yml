doi: 10.5555/slop.jnd61t
summary: >-
  A research poster from the School of Continuous Improvement audits 197
  apiaries drawn stratified by declared size from one state's hive register,
  counting boxes on site between February and June 2026. Standing hives come to
  68.8 per cent of registered hives (5,730 against 8,334), the shortfall
  widening from 23.2 per cent at apiaries declaring 50 or more hives to 55.4 per
  cent at those declaring one to four, and 16.2 per cent of audited sites hold a
  current registration with no standing hive. Recalculated against the counted
  population, the program's annual surveillance reaches 78 per cent confidence
  of detecting a notifiable pest at 1 per cent design prevalence, against the 95
  per cent its plan reports.
topic: >-
  the white hive boxes behind a suburban shed and along a paddock fence, each
  branded with its owner's registration number, where a state biosecurity
  program counts registered hives as the pollination sector's resilience
  indicator and draws its annual pest-surveillance sample from the same register
  --- and a stratified field audit that goes out and counts the boxes finds the
  register has kept every hive that died over winter, so the inspection coverage
  the program reports is roughly two-thirds of what it believes, and each bad
  season improves the indicator while thinning the surveillance that would have
  found the pest
