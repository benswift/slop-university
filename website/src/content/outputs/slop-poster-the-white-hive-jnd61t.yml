title: Registered, Not Standing
subtitle: >-
  A stratified field audit of 197 apiaries against the register that frames the
  state's pest-surveillance sample
authors:
  - Ingeborg Nwachukwu
  - Joost Nwosu
  - Sten Okwuosa
preset: research-poster
school: School of Continuous Improvement
