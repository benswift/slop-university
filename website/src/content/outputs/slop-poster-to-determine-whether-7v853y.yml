summary: >-
  A research poster from the School of Continuous Improvement preregisters a
  direct replication of a shopping-centre car park's boom-gate clearance-rate
  threshold at twelve primary-school pickup zones, finding no relationship
  between clearance rate and verge overflow across a full term, while permit
  renewal keeps scoring every car park against the same threshold regardless.
topic: >-
  To determine whether the clearance-rate threshold that flags an
  overflowing shopping-centre car park also flags an overflowing school-run
  car park, restage the original boom-gate design at twelve primary-school
  pickup zones during term
