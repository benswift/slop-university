summary: >-
  A research poster from the School of Continuous Improvement applies a
  bunching estimator to a regional call-centre chain's monthly sales quota,
  finding roughly three times the expected density of rep-months clustered
  just above the line where commission doubles, alongside a matching rise in
  end-of-month sale-date corrections that two placebo cutoffs do not
  reproduce.
topic: >-
  A regional call-centre's monthly sales quota triggers a doubled commission
  rate the instant a rep clears 100 percent; a bunching read of the naturally
  occurring kink finds reps who land just above the line file
  disproportionately more end-of-month sale-date corrections than reps who
  land just below it
