summary: >-
  A research poster from the School of Emergent Priorities scores 214
  residential building sites against a five-level tree-protection maturity
  ladder built from the single geotagged photograph each site files with its
  approval application, finding compliance clusters at that photographed
  moment and thins sharply by lock-up, while a state planning scheme now
  waives its final building-compliance inspection for any site that clears
  Level 3.
topic: >-
  The Canopy Retention Index scores residential building sites against five
  maturity levels of tree-protection-zone compliance, and a state planning
  department now waives its final building-compliance inspection for any
  site that clears Level 3.
