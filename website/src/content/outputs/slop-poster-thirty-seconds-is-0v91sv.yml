doi: 10.5555/slop.0v91sv
summary: >-
  A research poster from the School of Emergent Priorities logs 1,847 router
  power cycles across 212 households over 26 weeks and sorts each household
  into one of four named kinds by who does the switching and whether the
  thirty-second pause is counted, finding first-attempt restoration flat at
  61-64% in every kind. From the next teaching period every power cycle of
  equipment in School rooms is held for a counted thirty seconds and minuted
  under one named keyholder, with no override.
topic: >-
  Thirty seconds is how long a household router is held unplugged by the
  minority who time the pause, sorted into a two-by-two of who reboots and
  whether the pause is kept, and adopted as a counted, minuted pause for every
  power cycle of equipment in School rooms
