title: Half Past Eight, Everyone Home, Light Gone Amber
subtitle: A Two-by-Two of Reboot Custodian and Pause Kept, Adopted as a Counted Pause for School Equipment
authors:
  - Sunniva Balogun
  - Marek Solheim
  - Ylva Onyekwere
preset: research-poster
school: School of Emergent Priorities
date: 2026-10-08
