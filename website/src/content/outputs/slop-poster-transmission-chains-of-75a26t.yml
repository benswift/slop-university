doi: 10.5555/slop.75a26t
summary: >-
  A research poster from the School of Settled Matters passes galleries of
  synthetic white-cell images down 20 transmission chains of eight untrained
  observers, each inheriting the previous observer's category labels, with 18
  of 120 labels seeded wrong at the head of every chain. Where each label's
  confirmation count was on screen, the contrary evidence needed to overturn
  half of the inherited labels rose from 1.9 to 3.4 morph steps by the eighth
  generation and 41% of seeded errors survived the chain; where the label was
  shown bare, the threshold moved from 1.9 to 2.1 steps and 12% survived.
topic: >-
  Transmission chains of observers inheriting pre-assigned labels on synthetic
  blood-cell images, and how much contrary evidence an inherited label needs
  before a later observer overturns it
