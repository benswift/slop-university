title: What the Building Line Kept
subtitle: Restrictive Covenants and the Persistence of Private Tree Canopy in a Post-War Subdivision, 1975–2024
authors:
  - Clemency Tredinnick
  - Ronja Oyelaran
preset: paper
school: School of Settled Matters
date: 2026-11-16
publishedAt: "2026-11-16T13:00:31+11:00"
doi: 10.5555/slop.pv0tvw
summary: >-
  A paper from the School of Settled Matters and the School of Emergent
  Priorities classifies 367,200 photo-interpretation points across six epochs
  of aerial photography over a 612-lot post-war subdivision, half sold under a
  single-dwelling, building-line and no-subdivision covenant scheme and half
  without. Canopy cover, alike on both halves in 1975, stood at 30.9 per cent on covenanted lots
  and 17.2 per cent on uncovenanted ones in 2024, the gap holding across the
  dividing collector road, and canopy fell 12.4 points on lots whose covenants
  were discharged; the paper argues the covenants held a single ageing cohort
  of trees by forbidding redevelopment rather than by protecting them.
topic: >-
  Legacy restrictive covenants (single-dwelling, building-line, no-subdivision
  clauses) on post-war suburban lots as unintended green infrastructure:
  lot-level canopy cover and permeable ground over five decades, covenanted
  versus released lots in an invented subdivision
