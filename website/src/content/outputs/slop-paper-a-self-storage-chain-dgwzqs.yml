title: Mistaken for Empty
subtitle: >-
  A Self-Storage Chain's Low-Access Lapse Flag Against Matched Units'
  Actual Renewal Outcomes
authors:
  - Fenna Okoro
  - Mirela Hanke
preset: paper
school: School of Emergent Priorities
date: 2026-08-12
publishedAt: "2026-08-12T04:04:03+10:00"
doi: 10.5555/slop.dgwzqs
summary: >-
  A paper from the School of Emergent Priorities matches 342 pairs of
  flagged and unflagged self-storage units across eleven sites to test a
  chain's low-access lapse flag, which treats fewer than two gate-access
  events in ninety days as grounds for a pre-renewal courtesy call.
  Flagged units renew seven percentage points less often than matched
  unflagged units, but ninety-day access counts for renewing and
  non-renewing units overlap substantially, and the flag's estimated
  false-positive rate (56%-61%) holds statistically unchanged across four
  alternative thresholds.
topic: >-
  a self-storage chain flags any unit with fewer than two swipe-access
  events in ninety days as lapsing and has staff phone the tenant before
  lease renewal, comparing the flag's accuracy against actual renewal
  outcomes across matched flagged and unflagged low-access units to test
  whether low access itself, rather than genuine abandonment, is driving
  the outreach
