summary: >-
  A paper from the School of Continuous Improvement reports eleven months of
  participant observation in a research group that prepares air-sensitive
  organometallic compounds, reading its care of a shared glovebox as a system
  of pollution beliefs: a classification of what may enter, a threefold rite
  at the antechamber, and a periodic regeneration that renews the record. Of
  the seven occasions on which the box's atmosphere was judged to have failed,
  six were attributed to a party before any cause was sought, and the
  attributions followed seniority more closely than the logbook.
topic: >-
  pollution beliefs in an air-sensitive organometallic synthesis laboratory:
  an ethnography of how the purity of a shared glovebox is kept, breached and
  blamed
