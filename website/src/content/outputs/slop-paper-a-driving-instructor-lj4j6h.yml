title: Notes on a Turn That Will Not Fit the Loop
subtitle: Twenty Driving Instructors on the School-Gate Turn-Around, in Their Own Terms
authors:
  - Edda Nwafor
  - Thandiwe Solberg
  - Dagny Okafor
preset: paper
school: School of Continuous Improvement
date: 2026-10-02
publishedAt: "2026-10-02T22:01:56+10:00"
doi: 10.5555/slop.lj4j6h
summary: >-
  A paper from the School of Continuous Improvement reports twenty
  semi-structured interviews with driving instructors on the turn-around that
  cannot be completed in one go at a school-gate loop, records the six terms the
  instructors use for it and the allowance they say a turn is owed, and reports
  the University entering that allowance, unchanged, in the conditions of use
  for its campus drop-off loop.
topic: >-
  A driving instructor who takes learners round the school-gate loop at pick-up
  has a vocabulary for the turn-around that cannot be completed in one go;
  interviews with 20 instructors record their own names for the shuffle, the
  borrowed driveway and the apology wave, and the movement allowance the
  University writes into its campus drop-off loop on the strength of those names
