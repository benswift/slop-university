doi: 10.5555/slop.osa1kb
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities audits all 1,153 residential lots of a peri-urban fringe
  settlement supplied by household basin solar stills for a qualifying
  aperture: level, unbuilt ground large enough for the household's still that
  receives three hours of direct sun at the winter solstice. 863 lots qualify
  under current controls and 537 once the exhibited draft infill code is built
  out, and 291 of the 326 lots that lose their aperture still pass the code's
  own solar-access test for private open space.
topic: >-
  the land a solar still needs: overshadowing, lot size and household
  drinking-water yield in a peri-urban fringe whose bores turned brackish
