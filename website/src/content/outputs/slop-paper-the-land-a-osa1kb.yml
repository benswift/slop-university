title: Room for the Still
subtitle: Unshaded Ground, Lot Size and an Infill Code on a Fringe Settlement Supplied by Household Solar Distillation
authors:
  - Vigdis Emenike
  - Ronja Oyelaran
preset: paper
school: School of Underlying Conditions
date: 2026-11-10
