title: The Twelfth Question
subtitle: >-
  A Quasi-Experimental Comparison of Scripted and Unscripted Fraud-Risk
  Interviews at the Retail Returns Desk
authors:
  - Solveig Adeyemi
  - Bram Ntuli
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-09
publishedAt: "2026-08-09T07:01:03+10:00"
doi: 10.5555/slop.vza4af
summary: >-
  A research poster from the School of Continuous Improvement compares
  scripted and unscripted fraud-risk interviews across 46 retail stores and
  seven store-format clusters over 14 weeks, finding confirmed-fraud catch
  rates hold statistically flat between protocols (3.2% scripted, 3.1%
  unscripted) while scripted stores report longer desk dwell time in most
  clusters.
topic: >-
  testing whether a retail returns desk's scripted please-explain interview,
  triggered by an automated fraud-risk flag on the item, catches any more
  confirmed fraud than an unscripted challenge -- or just lengthens the
  queue
