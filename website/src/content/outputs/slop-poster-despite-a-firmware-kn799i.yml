summary: >-
  A research poster from the School of Continuous Improvement retrofits
  twenty-two households' refrigerators with a local relay and sensor network
  that restores defrost and icemaker scheduling after a manufacturer's
  firmware update revokes cloud-linked control. The relay's own actuation log
  now feeds the University's Living Dashboard in place of the vendor's
  telemetry, and Accommodation Services is reviewing the retrofit for every
  catered-hall refrigerator on campus.
topic: >-
  Despite a firmware update quietly disabling a smart fridge's icemaker
  schedule overnight, a household kept it running with a local relay
  controller that never talks to the manufacturer's cloud again.
