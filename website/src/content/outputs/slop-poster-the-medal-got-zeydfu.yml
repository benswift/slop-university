doi: 10.5555/slop.zeydfu
summary: >-
  A research poster from the School of Emergent Priorities follows an ad
  valorem tariff on imported die-cast medals through nine seasons of one
  regional trophy supplier's invoices to 63 community junior sport clubs.
  Pass-through to the club invoice is complete within a season, yet spend per
  registered child barely moves: clubs trade engraved medals (71% of child
  awards before the tariff, 38% after) down to plain medals and printed
  rosettes, and billed engraving minutes fall by 44%.
topic: >-
  the medal got plainer: tariff pass-through and quality downgrading in
  community junior sport clubs' end-of-season trophy orders, from one regional
  supplier's invoices
