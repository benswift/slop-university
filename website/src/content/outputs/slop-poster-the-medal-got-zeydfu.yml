title: The Medal Got Plainer
subtitle: Tariff Pass-Through and Quality Downgrading in Community Junior Sport Trophy Orders
authors:
  - Halvard Nnamani
  - Kwame Lindqvist
  - Verity Marris
preset: research-poster
school: School of Emergent Priorities
