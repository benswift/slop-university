title: Tungsten from the Bit on the Broken Ends of Drill Core
subtitle: Laser-Induced Breakdown Spectroscopy of the Pieces Bounding Intervals of Core Loss
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-11-17
publishedAt: "2026-11-17T20:30:48+11:00"
doi: 10.5555/slop.nzyvtk
summary: >-
  A paper from the School of Underlying Conditions scans the broken ends of the
  pieces bounding one borehole's 23 intervals of core loss by laser-induced
  breakdown spectroscopy, looking for tungsten worn from the bit's matrix. A
  temperature-corrected excess within 2 mm of the end marked 17 of 18 ends
  beside intervals a mass balance had classed as ground, against 3 of 60
  mechanical breaks and no saw cuts, and agreed with that balance on 14 of 15
  intervals once ends at the top of a run were set aside; the metal sits mostly
  on the piece below the gap and says where the bit ground, not for how long.
topic: >-
  Laser-induced breakdown spectroscopy line scans of drill core: tungsten and
  cobalt smeared from the bit matrix onto the broken ends of recovered pieces
  as a record of where a run ground the rock rather than cut it
