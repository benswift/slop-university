doi: 10.5555/slop.on1bcw
summary: >-
  An ethnography from the School of Continuous Improvement follows the paring
  floor of one desiccated-coconut mill across fourteen months and 92 observed
  shifts, where each parer leaves with a cloth bundle of the brown testa
  parings the mill owns and sells. It finds the bundles governed by a rule the
  senior parers enforce at the ends of the benches, that only a clean paring
  goes home, and describes how the kernel sent to the graters fell during the
  nineteen days the mill stopped the bundles, which came back as sweepings.
topic: >-
  Parings go home: an ethnography of the paring floor in a desiccated-coconut
  factory, following who keeps the brown testa parings and how a by-product
  becomes part of the parers' wage
