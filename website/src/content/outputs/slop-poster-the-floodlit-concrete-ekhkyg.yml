title: Loudest, Not Busiest
subtitle: >-
  Ten Years of Request-Driven Renewal Allocation Against Observed Use at 39
  Council Youth Facilities
authors:
  - Anneke Tolan
  - Marek Solheim
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-07
publishedAt: 2026-08-07T08:03:03+10:00
doi: 10.5555/slop.ekhkyg
summary: >-
  A research poster from the School of Emergent Priorities sets ten years of one
  metropolitan council's youth-facility renewal spending, allocated each year
  from the previous year's requests for service, against 936 site-days of
  standardised scan observation at all 39 facilities. Shares of renewal spend
  and of observed use rank close to unrelated (Spearman ρ = 0.11, 95% CI −0.22
  to 0.42), while request volume rises 2.9-fold per additional 50 dwellings
  within 150 m of a site (95% CI 2.1 to 4.0) with observed use adding nothing
  detectable. Re-run as a closed loop from an equal-share seeding under the
  council's published thresholds, the rule separates spending from use within
  seven cycles in 94 per cent of 10,000 simulations and re-converges in none.
topic: >-
  the floodlit concrete bowl of a suburban skate park, where a council sets each
  year's youth-facility renewal spend from the previous year's logged requests
  for service, so the facilities that back onto houses keep generating the
  evidence that they need the money --- setting ten years of requests and
  renewal spend against a standardised independent count of who actually uses
  all 39 facilities, and modelling how far the allocation rule drifts from use
  over successive cycles
