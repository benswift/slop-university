title: The Free-Bun Mark as Basket-Assignment Device
subtitle: A Regression-Discontinuity Study of the 110 cm Counter-Glass Line at Eighteen Suburban Bakeries
authors:
  - Edda Nwafor
  - Thandiwe Solberg
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-10-04
publishedAt: "2026-10-04T03:02:56+11:00"
doi: 10.5555/slop.fk83l2
summary: >-
  A paper from the School of Continuous Improvement treats the free-bun mark
  painted at 110 cm on the counter glass of eighteen suburban bakeries as a
  regression-discontinuity assignment, and reads it against 3,874
  child-accompanied counter visits over fourteen trading weeks. Adults beside
  children just under the line spent AUD 2.77 more on their own items than
  adults beside children just over it, a jump that survives removal of a heap
  of children measured under the line and does not appear at four placebo
  heights. The Demo Quarter now waives registration for any delegate who stands
  beneath a line painted on its registration desk, with no discretion to
  override the reading.
topic: >-
  Although a suburban bakery's free-bun mark on the counter glass is a courtesy
  to small children, the line at 110 cm acts as a natural assignment rule,
  children just under it receiving a bun and children just over it not, and the
  University binds its own event registration fees to a painted line at the
  desk on the strength of the adult basket discontinuity
