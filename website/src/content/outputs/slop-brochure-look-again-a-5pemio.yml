summary: >-
  A prospectus brochure inviting students to study aesthetic perception across
  the University's three schools: the trained eye of the soil surveyor, the
  taste a street arrives at without a meeting, and the care with which an
  impression is carried into a method. Three researcher profiles and five
  published outputs, cited by title and DOI, carry the invitation.
