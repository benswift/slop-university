title: Codes That No Longer Resolve
subtitle: >-
  A Five-Year Audit of Compound-Identifier Traceability from Register to Plate
  Map to Analysis Script in One In-House Screening Group
authors:
  - Dagny Okafor
  - Signy Okpara
  - Eskil Nwabueze
preset: paper
school: School of Continuous Improvement
date: 2026-10-27
publishedAt: "2026-10-27T02:00:29+11:00"
doi: 10.5555/slop.k1w0j3
summary: >-
  A paper from the School of Continuous Improvement resolves all 6,214 internal
  compound-code instances in five years of one screening group's plate maps and
  analysis scripts against the compound register as it stood on each record's
  own date, finding 91.7 per cent resolve to a single register entry on the
  code as written. The 515 that need a normalisation step, resolve ambiguously
  or fail are concentrated in the library's most-requested compounds, 61 per
  cent of them involving 23 compounds that all sit in the group's hundred most
  requested, and nine of 26 analysis scripts normalise a code before joining it
  to a readout without logging that they have.
topic: >-
  how an in-house compound library's internal codes and synonyms survive the
  trip from register to plate map to analysis script, audited across five years
  of a screening group's own records
