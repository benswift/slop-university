summary: >-
  A research poster from the School of Continuous Improvement reports a null
  result for GRATED, a three-criterion rubric that rates 612 painted stormwater
  drain stencils across nine wards and orders a repaint below a cut-off of
  71.500. Litter recovered per pit-fortnight was 41.3 g in repainted pits and
  41.6 g in pits left as found (ratio 0.99, 95% CI 0.94-1.05), and the shire's
  repainting now follows the score alone.
topic: >-
  GRATED, a rubric that rates every painted fish stencil beside a shire's
  stormwater grates for tone, edge and definition and orders a repaint below the
  cut-off, and its null effect on the litter pulled from the pits
