summary: >-
  A research poster from the School of Underlying Conditions adds a second
  output to a lesion-segmentation network: the four boundary-distinctness
  classes of soil-horizon description, predicted along the contour beside the
  mask. Trained and tested on 6,240 photographs of 312 patches airbrushed onto
  one mannequin with edges feathered to known widths, the head names the
  painted class for 77% of boundary segments, and on surfaces that curve away
  from the camera it errs towards the sharper class.
topic: >-
  Where a plaque ends: a segmentation network trained on patches painted onto a
  tailor's mannequin with edges feathered to known widths, taught to predict
  the boundary's distinctness class as a soil surveyor records it, alongside
  the mask
