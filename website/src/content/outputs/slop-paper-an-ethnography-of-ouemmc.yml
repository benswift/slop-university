doi: 10.5555/slop.ouemmc
summary: >-
  An ethnography from the School of Settled Matters spends fourteen months in a
  recombinant protein laboratory, logging all 1,476 questions its members asked
  about the twenty-two steps of the house preparation used to purify a plant
  asparaginyl ligase, and reading them against the protocol document's nine-year
  revision history. Nine steps drew 83 per cent of the questions and four drew
  none; what separated a step still argued over from one at rest was not
  evidence or consequence but whether the member who introduced it was still in
  the laboratory. Steps whose originator had left were asked about least and
  explained most confidently, and where the paper could check those explanations
  against the document's own history, two of the three most confident accounts
  post-dated and misdescribed the step's origin.
topic: >-
  an ethnography of one protein biochemistry lab's house purification protocol
  for a recombinant ligase, following how its steps came to be treated as
  settled and which of them newcomers learn not to question
