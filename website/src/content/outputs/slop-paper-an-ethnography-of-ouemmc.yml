title: The Step Nobody Asks About
subtitle: Closure, Precedent and Authorship in One Laboratory's House Purification
  Protocol
authors:
  - Odalys Penhallow
  - Anneke Tolan
preset: paper
school: School of Settled Matters
date: 2026-11-17
