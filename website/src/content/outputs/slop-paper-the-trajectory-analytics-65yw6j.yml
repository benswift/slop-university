doi: 10.5555/slop.65yw6j
summary: >-
  A paper from the School of Emergent Priorities and the School of
  Continuous Improvement interviews 14 boom-gate attendants at the
  campus visitor car park about their own reasoning for waving through
  an overstayed ticket, codes 132 justifications into a four-category
  typology, and reports what happened to the cases outside that
  typology once the Trajectory Analytics Group adopted it as a binding,
  override-free Goodwill-Validation Protocol.
topic: >-
  The Trajectory Analytics Group interviews the boom-gate attendants at
  the campus visitor car park about how they decide, in their own
  words, when to wave through a driver whose ticket has overstayed, and
  issues the resulting judgement categories as a binding
  goodwill-validation protocol for every attendant's shift
