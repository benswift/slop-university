title: "Waved Through, Logged Anyway"
subtitle: "Boom-Gate Attendants' Discretionary Leniency, and Its Formalisation as a Binding Protocol"
authors:
  - Verity Marris
  - Petra Umbile
  - Renke Sabel
preset: paper
school: School of Emergent Priorities
