summary: >-
  A research poster from the School of Underlying Conditions follows a
  24-borehole ground-source heat pump field through seven winters of heating a
  community pool, with fibre-optic temperature profiles in one borehole per
  row, and finds that groundwater flowing along the rows carries each row's
  cold to the next. The downgradient row ends the seventh season 2.5 K colder
  than the first; the upgradient row, 0.3 K.
topic: >-
  seven heating seasons of fibre-optic temperature profiles in a 24-borehole
  ground-source heat-pump field crossed by groundwater flow, testing whether the
  downgradient boreholes run in the cold their upgradient neighbours shed
