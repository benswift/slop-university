title: Does Knowing Who's Read It Keep People Talking?
subtitle: >-
  A Regression-Discontinuity Test at a Group Chat's Hundred-Member
  Read-Receipt Cutoff
authors:
  - Fenna Okoro
  - Anouk Mensah
  - Ronja Oyelaran
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-31
publishedAt: "2026-08-31T19:31:15+10:00"
doi: 10.5555/slop.xzawxg
summary: >-
  A research poster from the School of Emergent Priorities exploits the
  naturally occurring cutoff at which a group chat's named read-receipt list
  switches to a bare count, once membership crosses one hundred, as a
  regression-discontinuity design testing whether daily message volume falls
  at the line. The estimated fall is modest overall but concentrated among
  members who posted below their chat's own pre-crossing median, and that
  below-median estimate is now the reference figure the School of Continuous
  Improvement's Group-Chat Governance Maturity Index cites for its Level Two
  participation criterion.
topic: >-
  A group chat's read-receipt register — the named list of who's seen a
  message — switches to a bare count the moment membership crosses one
  hundred, and the University exploits that naturally occurring cutoff as a
  quasi-experiment testing whether chats just over the line go quieter than
  chats just under it.
