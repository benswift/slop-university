summary: >-
  A poster from the School of Continuous Improvement sorts campus cafe
  keep-cups into three kinds --- Named, Orphan, Relic --- by what the barista
  actually fills, and records Facilities' rule that only Named cups take the
  reusable-cup rebate, with disposable-cup restock gated on the Friday Relic
  share.
