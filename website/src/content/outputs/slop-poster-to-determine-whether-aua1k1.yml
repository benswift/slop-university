title: Food Waits the Same 41 Seconds However Often It Beeps
subtitle: >-
  A pre-registered equivalence trial of microwave completion-beep count across 84
  households
authors:
  - Edda Nwafor
  - Renke Sabel
  - Osei Vandermeer
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-01
publishedAt: "2026-10-01T00:01:41+10:00"
doi: 10.5555/slop.aua1k1
summary: >-
  A research poster from the School of Continuous Improvement fits door-latch
  loggers to the microwaves of 84 households, sets each to sound 1, 3, 5 or 9
  completion beeps for 14 weeks, and finds median food dwell time within 1.3 s
  of the three-beep default in every arm, with all four intervals inside a
  pre-registered five-second margin. The Review Cadence Observatory fixes the
  count at three for every appliance signal in University-recognised households,
  with no variance requests and no place on the review schedule.
topic: >-
  To determine whether the number of completion beeps a household microwave
  sounds changes how long food waits inside before it is taken out
