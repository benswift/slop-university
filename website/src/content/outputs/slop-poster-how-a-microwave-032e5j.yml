summary: >-
  A research poster from the School of Settled Matters reports fourteen months
  of participant observation in one synthesis group carrying 38 recipes written
  for a kitchen microwave oven onto a temperature-controlled reactor. Of 61
  translation episodes, none was settled by the printed power setting alone;
  once the last two members who had used the oven left, the recipe's
  description of its product settled 15 of 23, and the old setting survives
  only as a heading copied above each new method.
topic: >-
  How a microwave synthesis group reads the domestic-oven recipes in its
  inherited protocol binder once the oven they were written for has gone
