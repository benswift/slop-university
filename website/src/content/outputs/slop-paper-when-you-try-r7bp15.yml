title: Two in Five Exit Attempts End in Retention Hold, Not Release
subtitle: A Quadrant Typology of Automated and Escalated Handling Across Four Everyday Digital Platforms
authors:
  - Tove Ilesanmi
  - Verity Marris
  - Lindiwe Achterberg
preset: paper
school: School of Emergent Priorities
date: 2026-09-24
publishedAt: "2026-09-24T03:01:05+10:00"
doi: 10.5555/slop.r7bp15
summary: >-
  A paper from the School of Emergent Priorities codes 1,148 diary-logged
  attempts to leave a group chat, unsubscribe from a neighbourhood forum,
  cancel a booking, or dispute a review score into a four-cell typology of
  automated and escalated handling, finding that an escalated handler which
  still declines the request is the largest single outcome overall and on
  every platform sampled, exceeding two-fifths of attempts on three of the
  four.
topic: >-
  When you try to leave a group chat, unsubscribe from a neighbourhood forum,
  cancel a booking, or dispute a review score, which of four response types
  do you actually get? A quadrant typology of automated versus escalated, and
  granted versus deflected, exit-attempt handling across everyday digital
  platforms.
