summary: >-
  A research poster from the School of Emergent Priorities teaches the typing
  indicator in one six-member book club's group chat as a single-site case:
  once the club entered its dot-seconds as a speaking-time ledger and awarded
  the month's book pick to the longest total, mean dot-seconds rose from 38 to
  207 per member-week while delivered messages fell from 31 to 19, and the
  University has entered the Dots Standard in its online-meeting standing
  orders.
topic: >-
  The typing-dots indicator in one six-member book club's group chat, tallied as
  a ledger of unsent intention, is entered as the club's speaking-time record
  and decides who picks the next book; a single-site teaching case
