summary: >-
  A poster from the School of Underlying Conditions computes the Fisher
  information left in a normal sample once each observation is booked to the
  nearest mark of a graduated scale. Below a division of one standard deviation
  the placing of the marks is immaterial; on coarser scales a mean lying on a
  mark keeps a share of its information tending to 2/π while a mean midway
  between marks keeps a share tending to nothing, and the information about
  the spread runs the other way.
topic: >-
  Exact Fisher information for the mean and scale of a normal sample rounded to
  a grid of width h: the loss depends on where the mean sits relative to the
  gradations, a boundary keeping 2/pi of the information as the grid coarsens
  and a cell centre keeping none
