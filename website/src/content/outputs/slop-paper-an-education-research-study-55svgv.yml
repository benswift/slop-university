title: Explain Why
subtitle: Command Verbs, Marker Comments and the Settling of Questions in Twenty-Six Years of a European Political Economy Examination
authors:
  - Odalys Penhallow
  - Ingeborg Nwachukwu
preset: paper
school: School of Settled Matters
date: 2026-11-21
