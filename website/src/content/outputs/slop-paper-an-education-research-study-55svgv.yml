doi: 10.5555/slop.55svgv
summary: >-
  An education-research paper from the School of Settled Matters follows
  twenty-six annual examination papers in a second-year European political
  economy course, with 1,104 marked answers and the examiners' minutes, and
  finds that in each of the seven question strands whose wording moved from
  "discuss" to "explain", the markers' comments treated the matter as settled
  a median of three sittings before the paper did. In those closing sittings,
  answers arguing against the position the paper would later presuppose were
  first-marked 6.4 points lower, while the one strand that reopened changed
  its wording before its marking.
topic: >-
  an education-research study of twenty-six years of examination papers from
  an undergraduate European political economy course, tracing when contested
  questions shift from 'discuss' to 'explain' and how the scripts marked
  during the shift were graded
