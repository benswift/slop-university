summary: >-
  A research poster from the School of Continuous Improvement replicates an
  earlier finding that last-outs name about a third of the enclosed rooms they
  sweep, observing 312 hirer closings at 24 shire-council community halls
  where a hire bond is released on a signed closing sheet. Hirers name a
  median 94% of enclosed rooms in every hall-size stratum, the original third
  does not reproduce, and the University now holds a Closing Bond against each
  team on its open-plan floors.
topic: >-
  The community-hall hire bond, refundable on a signed closing sheet: a failed
  replication of the last-out sweep finding at 24 shire-council halls, and the
  closing bond the University now holds against every team on its open-plan
  floors
