doi: 10.5555/slop.0nralw
summary: >-
  A paper from the School of Emergent Priorities sorts the 583 items listed on
  the menu boards of 46 food trucks into five kinds by how much of the service
  day each is in stock, from 39,178 hourly probes, and finds that fewer than
  half are available all day and that a board's layout does not reveal the
  kind. The Horizon Register adopts the vocabulary as the University's
  function-ordering standard, placing orders from the Standing column only.
topic: >-
  The food-truck menu board, sorted into kinds of listed item by how much of the
  service day each is actually in stock, and adopted as the University's binding
  function-ordering standard.
