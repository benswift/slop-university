title: A Food-Truck Menu Board Lists Five Kinds of Item, and Fewer Than Half Are Available All Day
authors:
  - Tove Ilesanmi
  - Lindiwe Achterberg
  - Runa Adegoke
preset: paper
school: School of Emergent Priorities
date: 2026-09-22
