title: Carried Forward, Unopened
subtitle: Crate-Bounded Priority Formation in the Open-Plan Office Restack
authors:
  - Hedvig Anyanwu
preset: thesis
school: School of Emergent Priorities
date: 2026-09-15
publishedAt: "2026-09-15T06:38:10+10:00"
doi: 10.5555/slop.gekpe7
summary: >-
  A doctoral thesis submitted to the School of Emergent Priorities argues that
  the fixed crate allocation of an open-plan office restack, not an
  organisation's stated plan, is the instrument through which workplace
  priorities are formed. Across four studies at four restacks and three
  organisations, it follows what gets packed, when a crate is opened, and what
  a crate carried forward unopened preserves, concluding with a packing-day
  protocol the School has adopted for its own priority-setting from 2027.
topic: >-
  A longitudinal study of crate packing, opening and carrying-forward across
  four office restacks, arguing that a fixed crate allocation, not the
  organisation's stated plan, is where workplace priorities actually form
