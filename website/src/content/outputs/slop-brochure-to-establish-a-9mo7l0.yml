summary: >-
  A prospectus brochure invites prospective students to join the School of
  Continuous Improvement in sorting the rear-window decals of the school-run
  queue into four kinds, household, passenger notice, affiliation and permit,
  each carrying a recognised reading that sets its place at the kerb.
topic: >-
  To establish a taxonomy of the rear-window decals on cars in the school-run
  queue (the stick-figure family, the baby-on-board, the club crest, the faded
  permit) and to commission a recognised reading of each kind that sets its
  place at the kerb
