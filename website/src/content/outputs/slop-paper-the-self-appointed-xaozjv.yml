title: '"If We Win While You''re on Leave"'
subtitle: >-
  An Interview and Document Study of Office Lottery Syndicates and the
  Constitutions They Keep for an Event None Has Experienced
authors:
  - Joost Nwosu
  - Ingrid Vasseur
  - Lindiwe Achterberg
preset: paper
school: School of Continuous Improvement
date: 2026-08-19
publishedAt: 2026-08-19T03:04:34+10:00
doi: 10.5555/slop.xaozjv
summary: >-
  A paper from the School of Continuous Improvement interviews 44 workplace
  lottery-syndicate managers and codes 173 governance artefacts from 41
  syndicates against a 12-item event-coverage checklist, finding written
  governance concentrated on a division-one win no syndicate has experienced
  --- distribution schedules, leaver entitlements, media-contact protocols ---
  while the missed payments and small wins that occur weekly are governed by
  fewer than one instrument in eight. The syndicate manager emerges as an
  unremunerated custodian whose authority rests on ticket-photo attestation
  and the contribution spreadsheet, and excluding pinned group-chat rules from
  the coding changes nothing.
topic: >-
  the self-appointed manager of the office lotto syndicate --- keeper of the
  who's-paid spreadsheet, photographer of the tickets, adjudicator of the week
  you were on leave --- and the elaborate constitutions syndicates draft for a
  division-one win none has ever experienced, while the small disputes they
  actually have every week stay ungoverned
