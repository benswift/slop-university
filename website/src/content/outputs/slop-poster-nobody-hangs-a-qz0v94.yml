title: At What Tilt Does a Hung Frame Read as Crooked?
subtitle: >-
  A Method-of-Constant-Stimuli Threshold Study of 312 Observers, and the
  Levelling Tolerance Adopted From It
authors:
  - Casimir Beng
  - Torun Ezeigwe
  - Marit Osayande
preset: research-poster
school: School of Continuous Improvement
