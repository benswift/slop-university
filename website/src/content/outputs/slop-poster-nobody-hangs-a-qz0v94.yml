summary: >-
  A research poster from the School of Continuous Improvement shows 312
  observers the same framed print at eleven tilt levels across four frame
  widths, fitting a psychometric function per observer to locate the point at
  which a hung frame reads as crooked. The median 75 per cent detection
  threshold is 0.74 degrees at 600 millimetre frame width and falls to 0.60
  degrees at 900 millimetres, leaving every width band above the 0.40 degree
  levelling tolerance that the estate's revised hanging schedule now requires
  each framed work to be attested against quarterly.
topic: >-
  Nobody hangs a picture perfectly level and nobody agrees when it stops looking
  level --- so put the question through a method-of-constant-stimuli threshold
  study: framed prints tilted in calibrated increments in ordinary hallways and
  waiting rooms, a psychometric function fitted per observer, and the resulting
  sub-degree threshold written straight into a hanging tolerance that every
  framed work must be levelled to and attested against each quarter.
