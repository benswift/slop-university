summary: >-
  A research poster from the School of Emergent Priorities reports an
  eleven-week trial across four school car-park drop-off queues finding a
  speed hump's deceleration is unmeasurable twelve metres past its own ramp,
  and reports the Campus Mobility Register's unchanged classification of the
  full forty-metre queue as calmed.
topic: >-
  a school car park's speed hump, tested for whether its deceleration reaches
  the bus stop forty metres up the drop-off queue
