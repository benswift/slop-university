title: What Didn't Work, Kept
subtitle: Failed fix attempts as annotations in a case-based service-desk experience base
authors:
  - Eskil Nwabueze
  - Mirela Hanke
  - Solveig Adeyemi
preset: research-poster
school: School of Continuous Improvement
date: 2026-11-25
publishedAt: "2026-11-25T16:32:48+11:00"
doi: 10.5555/slop.jzbb2e
summary: >-
  A research poster from the School of Continuous Improvement replays a year
  of a campus service desk's closed tickets (9,412, of which 2,306 logged at
  least one failed fix attempt) against three ways for a case-based
  experience base to keep failed attempts. Attaching each failure as a note on
  the nearest successful case raised the first-fix rate from 41.2% to 46.7%,
  while keeping failures as standalone cases lowered it to 36.8%; 11.3% of the
  notes were later contradicted on a changed platform.
topic: >-
  retaining failed repair attempts in a case-based reasoning experience base
  for a service desk: standalone negative cases versus failure annotations on
  the nearest successful case, evaluated by replaying a year of tickets
