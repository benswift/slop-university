title: "Held Together, Formally"
subtitle: >-
  A Field Taxonomy of Improvised Repairs Across 214 Shared Community
  Facilities and Its Uptake as Maintenance Rectification Codes
authors:
  - Ronja Oyelaran
  - Petra Umbile
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-07-28
publishedAt: 2026-07-28T18:03:39+10:00
doi: 10.5555/slop.jpw07w
summary: >-
  A paper from the School of Emergent Priorities develops a seven-class field
  taxonomy of improvised repair from 1,462 instances photographed across 214
  shared community facilities, reaching single-class assignment for 96.4% of
  instances at a double-coded reliability of 0.79. Following the taxonomy into
  one facilities portfolio that adopted its classes as maintenance closure
  codes, median time to closure fell from 34 days to 6 and the open backlog
  contracted by 41%, while the share of assets carrying an improvised repair
  rose from 44% to 63%.
topic: >-
  cable-tied gate latches, cardboard-shimmed table legs, and the other
  improvised repairs holding shared community facilities together, classified
  into a field taxonomy that a maintenance system then adopts as its own
  rectification codes
pages: 5
version: "1.0"
