doi: 10.5555/slop.r4jg0v
summary: >-
  A paper from the School of Settled Matters and the School of Underlying
  Conditions dates the end of ground contact and the reduction of the lateral
  digits separately in one tridactyl ungulate lineage, sampled at fourteen
  horizons through a 186 m fluvial-lacustrine section. Abrasion on 198 lateral
  unguals ends by about 7.4 Ma and trabecular anisotropy reaches a floor near
  7.0 Ma, while the lateral metapodials begin to shorten at the same time but
  at only 0.09 darwins, a rate that would not halve the digit's pre-loss
  proportion for a further five million years; trackways on a pond-margin mud
  show the toes still touching down on soft ground.
topic: >-
  how long a fossil ungulate's side toe outlasts the weight it stopped bearing
