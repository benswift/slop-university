title: Load Lost, Digit Kept
subtitle: The lateral toes of a tridactyl ungulate lineage outlast their ground contact by millions of years
authors:
  - Clemency Tredinnick
  - Ragnhild Uzoma
preset: paper
school: School of Settled Matters
date: 2026-11-10
