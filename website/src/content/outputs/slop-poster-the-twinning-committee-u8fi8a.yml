summary: >-
  A research poster from the School of Settled Matters surveys 118 members of
  a provincial town's sister-city association, founded in 1987, against a
  household survey of 603 residents of the same town. Openness to trade and
  migration falls from 7.4 among the founders to 3.8 among members who joined
  after 2020, below the town's own mean, while support for the link rises; the
  members who joined after 2010 host 71% of its visitor-nights and now justify
  the link as friendship with "a town like ours".
topic: >-
  the twinning committee: how a provincial town's sister-city association,
  founded by liberal internationalists, came to be kept alive by members who
  vote against globalisation
