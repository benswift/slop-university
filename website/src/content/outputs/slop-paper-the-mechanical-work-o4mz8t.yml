summary: >-
  A paper from the School of Underlying Conditions and the School of
  Continuous Improvement measures the mechanical work at the handle of a
  hand-operated inertial pump across 36 combinations of stroke, rate and lift
  in four monitoring bores, finding that delivery begins at an effective
  acceleration number of 1.16 and that positive work per litre falls to minima
  of 0.27 to 1.78 kJ above it. Tubing compliance removes up to 22% of the
  stroke at 38 m, and the operators' habitual stroke, barely changed with
  depth, cost 2.9 times the work of a longer stroke to purge the deepest bore.
topic: >-
  the mechanical work an operator spends per litre purged with a hand-operated
  inertial foot-valve pump, across stroke length, stroke rate and lift,
  measured on a bank of monitoring bores
