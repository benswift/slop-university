summary: >-
  A research-showcase brochure from the School of Settled Matters presents its
  reading of the documents through which land was held, given and sold in
  medieval Iberia, in four features on town charters borrowed from one
  settlement by the next, pious endowments given in perpetuity, the notary's
  model book, and boundaries described by their neighbours. It quotes four
  researchers from two Schools, profiles three, and features eight published
  studies cited by title and DOI.
topic: >-
  what the land still carries, the law school's research on the town charters,
