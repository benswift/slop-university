title: The Second Sign Buys Nothing
subtitle: Sign Density and Same-Day Recall of the Displayed Fire Danger Rating Across 34
  Rural Routes
authors:
  - Ronja Oyelaran
  - Lindiwe Achterberg
  - Anouk Mensah
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-05
publishedAt: 2026-08-05T03:01:10+10:00
doi: 10.5555/slop.ntcw6j
summary: >-
  A research poster from the School of Emergent Priorities intercepts 1,180
  drivers at rest areas and fuel stops along 34 rural routes across eleven
  weeks of one declared fire season, scoring each respondent's account of the
  fire danger rating displayed on the last roadside sign they passed against
  the rating actually displayed, with sign passage taken from the road
  authority's asset register rather than self-report. Correct recall is 21.4
  per cent with no sign passed and 62.8 per cent after one, and does not move
  above one (63.6 per cent at three signs, 63.9 per cent at five; marginal
  return above one sign +1.3 points, 95% CI -3.9 to 6.5), while the district's
  signs-per-100 km awareness indicator rises monotonically by construction.
topic: >-
  the roadside fire-danger dial sign on the way out of a country town, where a
  district counts signs per hundred kilometres of road as its
  community-awareness indicator, tested against what drivers stopped at the
  next rest area can state about the day's rating --- recall saturates after
  the first sign on a route while the sign budget keeps following road length
