title: The Share and the Allocation
subtitle: >-
  A submission from the School of Settled Matters to the Department of Policy
  Settings' consultation on Allocating Time on the Shared Hydraulic Test Loop
authors:
  - Anselm Threlkeld
  - Clemency Tredinnick
preset: submission
school: School of Settled Matters
date: 2026-11-26
publishedAt: "2026-11-26T16:02:48+11:00"
doi: 10.5555/slop.csat4g
summary: >-
  A submission from the School of Settled Matters answers seven of the ten
  questions in the Department of Policy Settings' review of the Hydraulic Test
  Loop Determination 2026. Reading the headcount apportionment as an irrigation
  roster that runs a school's standing share and its quarter's allocation
  together, it proposes a fourth option that keeps the share and frees the
  hours, with carryover capped at one-quarter of an allocation, transfer between
  schools within a quarter that earns no later precedence, a definition of
  research headcount, and a changeover condition modelled on the conveyancer's
  vacant possession.
topic: >-
  the School of Settled Matters' submission on the Hydraulic Test Loop
  Determination, reading the headcount apportionment as an irrigation roster
  that runs a school's standing share and its quarter's allocation together, and
  asking that Option 1 be recast on the irrigation-district pattern of
  entitlement, capped carryover of unused hours and temporary transfer between
  schools
