doi: 10.5555/slop.n4u6hv
summary: >-
  A research poster from the School of Underlying Conditions asks 84 field
  technicians, each waiting alone for a pumped bore to recover, to judge the
  length of one 20-minute interval of the wait, either warned in advance or
  asked without warning afterwards. Watched intervals late in the recovery,
  when the water level has all but stopped rising, were judged 1.41 times
  their clock length in passing and 0.70 times in retrospect, and paperwork
  between readings held both ratios near 1.
topic: >-
  A watched bore: prospective and retrospective duration judgements among lone
  field technicians waiting out a slow groundwater recovery test
