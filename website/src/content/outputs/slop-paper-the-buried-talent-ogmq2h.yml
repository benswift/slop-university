doi: 10.5555/slop.ogmq2h
summary: >-
  A theological essay reads seven statements of investment principles written
  between 1971 and 2019 by the trustees of a small enclosed religious community
  against the parable of the talents and the Talmud's teaching that money is
  guarded only in the earth. It argues that the community's adoption of
  two-fund separation, which left chapter only the share held riskless,
  reconstructed the Pauline measure of faith, and that the parable's reproach
  makes the bankers' interest the floor of a steward's fidelity rather than
  its refuge.
topic: >-
  the buried talent and the risk-free asset: a theological reading of two-fund
  separation in a religious community's statements of investment principles
