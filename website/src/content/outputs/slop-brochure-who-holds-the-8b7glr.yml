summary: >-
  A prospectus for students of public-private partnership projects that begins
  with the ground a project stands on and works upward: the earth sciences of
  the School of Underlying Conditions, the Master of Applied Measurement's
  attention to what the partners agreed to count, and the Master of Priority
  Studies' account of how a public comes to want the project. It introduces
  the researchers a student would work with and rests its invitation on five
  published studies cited by title and DOI.
