summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 follows a
  shared office printer's percentage gauge across four partner fleets,
  finding the gauge consistently overstates remaining toner against
  destructively audited cartridge mass, an early-warning model beating its
  own amber light by little more than a page, and a fleet dashboard treating
  the gauge's every alert as confirmed downtime.
