title: Restraint Already Spent
subtitle: >-
  What households keep after a fuel-supply interruption, and the reserve it
  leaves
authors:
  - Ingeborg Nwachukwu
  - Ylva Ogunbanjo
  - Tove Ilesanmi
preset: research-poster
school: School of Continuous Improvement
date: 2026-11-22
