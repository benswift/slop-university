doi: 10.5555/slop.qqtn7k
summary: >-
  A research poster from the School of Continuous Improvement follows 1,140
  households in six towns for eighteen months after an eleven-week regional
  fuel-supply interruption. Of a 19% saving at the interruption's end, 7 points
  persisted, held mostly by measures set once rather than repeated daily, so
  the same nine restraint measures would yield about 12% against the new
  baseline in a repeat event.
topic: >-
  Restraint already spent: which household fuel-saving measures adopted during
  a regional supply interruption persist eighteen months on, and why
  persistence shrinks the demand-restraint reserve an energy-security plan can
  call on next time
