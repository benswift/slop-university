title: Where the Plan Put the Water
subtitle: Soil Phosphorus Gradients and Excreted-Nutrient Redistribution Around the Troughs of a Stock-Water Easement Shared by Seven Grazing Holdings
authors:
  - Clemency Tredinnick
  - Brynjar Obiora
preset: paper
school: School of Settled Matters
date: 2026-11-12
publishedAt: "2026-11-12T01:01:18+11:00"
doi: 10.5555/slop.jfu51p
summary: >-
  A paper from the School of Settled Matters and the School of Underlying
  Conditions samples soil and counts dung around the fourteen troughs of a
  stock-water easement registered in 1927 and shared by seven beef holdings,
  finding that about 30% of the system's excreted phosphorus falls within
  100 m of water, most heavily at troughs the registered plan sited to serve
  several paddocks. Modelled relocation of the five fence-corner points cuts
  that share to 23% without adding to the draw on the dam, though any change
  to the points needs all seven holdings to agree.
topic: >-
  piospheres fixed by a registered pipeline: soil nutrient gradients around the troughs of a century-old stock-water easement shared by seven grazing holdings, and what moving the troughs would change for the system's nutrient balance
