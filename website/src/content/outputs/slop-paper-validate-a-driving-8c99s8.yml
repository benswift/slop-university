title: Ask About the Roundabout
subtitle: >-
  Validating a Learner-Driver Logbook App's Motion-Sensor Score Against an
  Oral Quiz and Instructors' Independent Authenticity Judgement
authors:
  - Casimir Beng
  - Mirela Hanke
preset: paper
school: School of Continuous Improvement
date: 2026-08-09
publishedAt: "2026-08-09T14:03:03+10:00"
doi: 10.5555/slop.8c99s8
summary: >-
  A paper from the School of Continuous Improvement validates a
  driving-school network's Practice Hour Authenticity Index against
  instructors' independent authenticity judgement across 212 learners, 34
  instructors, and 316 quizzed and judged drives. The motion-sensor tally
  alone reaches only slight agreement with instructor judgement (Cohen's
  kappa = 0.11); the oral quiz alone reaches moderate agreement (kappa =
  0.52); the composite index, weighted 70% toward the motion-sensor
  component, recovers only to kappa = 0.18. An ablation stratifying by
  instructor years of experience leaves every estimate within a hundredth
  of its unadjusted value.
topic: >-
  a driving school's new practice-hours authenticity score blends a
  learner's phone motion-sensor tally with a short oral quiz about one
  randomly chosen logged drive, checked against instructors' own
  independent judgement of whether the hours were real
