title: Eighteen Weekends in the Fryer
subtitle: Ignition Delay and Soot of Methyl Esters from Topped-Up Canteen Oil in a Single-Cylinder Common-Rail Engine
authors:
  - Halvard Nnamani
  - Casimir Beng
  - Vigdis Emenike
preset: research-poster
school: School of Emergent Priorities
