doi: 10.5555/slop.6q2fa8
summary: >-
  A research poster from the School of Emergent Priorities converts 72 weekly
  draws of topped-up fryer oil from four club canteens into methyl ester and
  runs each in a single-cylinder common-rail research engine. Neat-fuel
  ignition delay lengthens across the season wherever the oil is only topped
  up and resets at the one canteen that changed its oil, while at a 20 per cent
  blend the season falls inside the engine's cycle-to-cycle spread.
topic: >-
  Biodiesel transesterified from one season of club-canteen fryer oil, batch by
  weekend, run through a single-cylinder common-rail research engine: how
  ignition delay and soot onset drift when the oil is topped up rather than
  changed
