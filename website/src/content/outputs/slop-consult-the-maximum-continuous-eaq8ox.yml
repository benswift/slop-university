summary: >-
  A consultation paper from the Department of Policy Settings invites
  submissions on whether to vary the 72-hour ceiling that the Slop University
  (Shared Equipment Booking) Determination 2024 places on any continuous
  booking, as it applies to the shared cycling stations, where cycle-life tests
  of electrode materials now run across chains of consecutive relay bookings.
  It cites four of the University's outputs, sets out three options from
  retaining the ceiling to ceilings set by class of instrument, and records a
  preliminary view, conditional on consultation, inclining towards declared
  long-run bookings of up to 21 days.
topic: >-
