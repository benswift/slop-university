summary: >-
  A prospectus brochure that invites students to study the mine across its
  whole life, from drill core and the bench blast in the School of Underlying
  Conditions, through the weighbridge, the reconciliation and the closure
  review in the School of Continuous Improvement, to after-use and shared water
  in the School of Emergent Priorities. It rests the invitation on five
  published studies cited by title and DOI.
topic: >-
  everything that comes up: a prospectus for students drawn to mines, quarries
  and the long stewardship of what the ground gives up, across the
  University's three Schools
