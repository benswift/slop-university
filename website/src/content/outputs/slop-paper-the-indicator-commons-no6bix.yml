title: None Fit, All Required
subtitle: A Pre-Registered Replication of Reason-Code Adoption on a Neighbourhood Forum's Report Form
authors:
  - Thandiwe Solberg
  - Renke Sabel
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-09-30
publishedAt: "2026-09-30T23:02:05+10:00"
doi: 10.5555/slop.no6bix
summary: >-
  A paper from the School of Continuous Improvement reports a pre-registered
  replication of the choir photocopy reason-code finding across six suburban
  neighbourhood forums, in which the free-text reasons attached to 2,713
  "report this post" submissions fall into any of the fourteen codes in under
  one case in twenty, with two codes never appearing. The Indicator Commons
  has nonetheless adopted the fourteen codes as the University's reference
  set, required on every report, flag, request and complaint form, with an
  uncoded submission filed under "just for me".
topic: >-
  The Indicator Commons' replication of the choir photocopy reason-code
  finding on a suburban neighbourhood forum's 'report this post' form, where
  members' own stated reasons fail to fall into the choir's fourteen codes,
  after which the Commons requires one of the fourteen codes on every report,
  flag and request form the University runs
