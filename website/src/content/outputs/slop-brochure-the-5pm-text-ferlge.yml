summary: >-
  A research-showcase brochure setting out the University's programme on the
  requests institutions send into households --- the message that asks for an
  hour of an ordinary evening, and the count that records only whose meter
  dipped. Four published studies are cited by title and identifier, across the
  design of the ask, the reach of the meter, and the household's own account of
  what was moved.
topic: the 5pm text from the electricity retailer asking the household to hold off
  the dishwasher until eight, and the thank-you that follows --- a campaign for
  the university that studies what the ask costs the household, not just whose
  meter dipped
