summary: >-
  A marketing poster for the School of Underlying Conditions carries the
  finding of The Price of a Second, that a regional observatory kept its count
  of earthquakes while slowing its recording drums to save paper, and so lost
  the timing of most nearby events, onto the University's portrait signage.
  Prepared in matched daylight and after-dark renderings, with a short reading
  list from the published record.
