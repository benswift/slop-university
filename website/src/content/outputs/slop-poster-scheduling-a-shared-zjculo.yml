summary: >-
  A research poster from the School of Settled Matters states the weekly queue
  of a shared magnetron sputter coater as an asymmetric travelling-salesman
  problem with time windows, prices each change between its six oxide targets
  from 61 weeks of the facility's own logs, and finds that replaying the logged
  weeks in an optimal order cuts changeover time by 42%, most of it by deciding
  what follows the vanadium target.
topic: >-
  Scheduling a shared magnetron sputter coater for transition-metal-oxide thin
  films as an asymmetric travelling-salesman problem, pricing each target
  change by its conditioning time and the contamination the previous run
  leaves behind
