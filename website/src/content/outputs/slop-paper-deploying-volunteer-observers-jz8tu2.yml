title: One Miss in Twelve
subtitle: Station Deployment and Negative Chords in a Volunteer Occultation Campaign for a Small Trans-Neptunian Object
authors:
  - Signy Okpara
  - Eskil Nwabueze
preset: paper
school: School of Continuous Improvement
date: 2026-11-13
publishedAt: "2026-11-13T06:31:29+11:00"
doi: 10.5555/slop.jz8tu2
summary: >-
  A paper from the School of Continuous Improvement reports a stellar
  occultation by a small trans-Neptunian object timed by nineteen volunteer
  stations, fitting an elliptical limb of 55.7 km equivalent radius to five
  positive chords. Of the twelve stations that recorded no event, one, passing
  7.5 km beyond the northern limb, supplied all of the constraint the negatives
  added, and a retrospective comparison of placement rules favours spacing
  stations at equal quantiles of the predicted path over aiming them at its
  limbs.
topic: >-
  Deploying volunteer observers across the uncertain shadow path of a stellar
  occultation by a small trans-Neptunian object, and how much of its limb the
  stations that saw nothing constrained
