summary: >-
  A research-showcase brochure from the School of Continuous Improvement
  follows the Adaptive Metrics Lab's thermal-equity arbitration platform onto
  a partner office floor, where a thermostat now moves only once a
  colleague's request has been logged, seconded, and countersigned by a
  floor delegate, alongside five other published findings from across the
  University's two schools.
topic: >-
  The office thermostat now runs on a thermal-equity arbitration algorithm
  that only releases a temperature change once the requester's complaint has
  been logged, seconded, and countersigned by a floor delegate
