title: Review of the Length of a Treatment Session
subtitle: >-
  A Department of Policy Settings consultation paper on whether the Slop
  University (Research Sessions) Determination 2019 should go on fixing every
  treatment session at fifty minutes
authors: []
preset: consultation-paper
date: 2026-11-22
publishedAt: "2026-11-22T17:30:47+11:00"
doi: 10.5555/slop.8wb0yg
summary: >-
  A consultation paper from the Department of Policy Settings invites
  submissions on section 6 of the Research Sessions Determination 2019, which
  fixes every session in which a participant in a University study receives a
  psychological treatment at fifty minutes, booked in the hour, with ten minutes
  after it reserved for the session record. It reports a rising number of
  exemptions sought for sessions of other lengths, cites three of the
  University's outputs, sets out three options from retaining the setting to
  letting each protocol fix its own length, and offers a preliminary view that
  sessions should in future be counted as the occasions participants attended.
topic: >-
  the fifty-minute session: whether the Research Sessions Determination should
  go on fixing every session in which a University study delivers a
  psychological treatment at fifty minutes, booked in the hour
