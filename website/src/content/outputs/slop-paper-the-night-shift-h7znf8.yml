summary: >-
  An ethnography of the night shift in a combustion laboratory's durability
  test cell, drawn from eleven months of fieldwork and sixty-three night shifts
  across two thousand-hour campaigns on a heavy-duty engine converted to
  hydrogen. It follows the hourly walk-round, the logbook's remarks column and
  the technicians' naming of the second engine as the Lodger, and argues that
  their care for an engine built to be worn out was a condition of the test,
  since only wear in attended hours could be read at teardown as the fuel's.
topic: >-
  the night shift of an engine durability test cell: an ethnography of the
  technicians who keep a research engine running towards its failure, and the
  names, care and leave-taking they give it
