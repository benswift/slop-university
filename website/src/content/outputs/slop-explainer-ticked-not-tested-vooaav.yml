summary: A research explainer from the School of Continuous Improvement on Dagny Okafor,
  Ingeborg Nwachukwu and Casimir Beng's study of the checkbox that closes a warehouse's
  food-safety refresher. It starts at the oral check itself, a supervisor's two or
  three questions and the single tick that records them, then sets that tick beside
  a written retest of nine hundred workers three months on and recordings of the checks
  themselves. The three authors speak for their own work in turn.
topic: A research explainer of the paper testing whether a warehouse's oral food-safety
  verification checkbox predicts what workers still know at a three-month written
  retest, finding the tick a reliable record that the check took place and silent
  about what it achieved
