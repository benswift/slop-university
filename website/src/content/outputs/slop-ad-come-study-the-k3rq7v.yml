summary: >-
  A marketing poster for the School of Underlying Conditions invites
  prospective students to learn where one rare earth ends and the next begins,
  set over a soil pit on an open hillside and a field table of vials that
  darken by barely perceptible degrees. It runs on the University's landscape
  signage panels in light and dark versions, and cites three of the School's
  outputs by DOI.
