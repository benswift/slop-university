doi: 10.5555/slop.ng6dxq
summary: >-
  The Department of Policy Settings answers six questions on spectral records
  under the Slop University (Research Records) Determination 2026, which retains
  a spectrum as its assigned line list and lets the underlying instrument record
  be disposed of after 90 days. Taken on notice at the Committee on Settings
  Oversight's Spring hearings of 13 November 2026 or lodged in writing after
  them, its answers report 210 line lists lodged since 1 July, 162 underlying
  records disposed of and 26 held for further assignment; state that it does
  not hold the number of unassigned lines disposed of; decline to estimate how
  many would have been assigned; and find that a tentatively assigned line is
  treated as assigned.
topic: >-
  the Committee presses the Department on a research records setting that
  retains a spectrum only as its assigned line list and lets the unassigned
  lines go
