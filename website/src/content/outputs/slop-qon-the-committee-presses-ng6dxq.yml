title: The Line List Is the Record
subtitle: >-
  The Department of Policy Settings answers questions taken on notice by the
  Committee on Settings Oversight on how the Research Records Determination
  retains a spectrum
authors:
  - Ingrid Vasseur
  - Casimir Beng
  - Ragnhild Uzoma
