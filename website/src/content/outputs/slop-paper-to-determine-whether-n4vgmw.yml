doi: 10.5555/slop.n4vgmw
summary: >-
  A paper from the School of Emergent Priorities pre-registers a direct
  replication of an earlier share-house finding --- that a frozen chore roster
  keeps the work getting done through informal reassignment that never touches
  the board --- at the tea-room sandwich press. Concordance reaches zero rather
  than flooring at 22 percent, cleaning is incident-driven (78.2 percent by
  whoever burnt the cheese) rather than absorbed by a stable informal network,
  and the original redraw-intention null is the one claim that holds; Estates
  Committee minutes subsequently adopt the frozen magnet as the compliance
  record.
topic: >-
  To determine whether the frozen chore-roster finding reproduces at the
  tea-room sandwich press
