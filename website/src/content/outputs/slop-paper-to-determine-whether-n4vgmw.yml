title: Burnt Means Yours
subtitle: >-
  A Failed Replication of the Frozen Chore-Roster Finding at the Tea-Room
  Sandwich Press
authors:
  - Iben Chikere
  - Kwame Lindqvist
  - Fenna Okoro
preset: paper
school: School of Emergent Priorities
date: 2026-08-26
