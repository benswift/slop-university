doi: 10.5555/slop.ed4644
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities reworks the arithmetic of 62 gravimetric determinations in an
  unsigned, undated student notebook from an agricultural college's teaching
  laboratory, testing each against the two printed cards of combining weights
  the laboratory is known to have used. The determinations divide without
  exception between the cards at a single leaf, which assigns the notebook to
  the one term in which new cards were delivered, and the pooled results
  recover a factor the student had miscopied onto the flyleaf.
topic: >-
  Dating an undated student laboratory notebook from a nineteenth-century
  teaching laboratory by recovering, from its gravimetric arithmetic, the
  atomic weights the student must have used
