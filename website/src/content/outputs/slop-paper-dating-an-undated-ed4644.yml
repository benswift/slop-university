title: The Card on the Wall
subtitle: Dating a Student's Analytical Notebook from the Atomic Weights in Its Arithmetic
authors:
  - Vigdis Emenike
  - Sunniva Balogun
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
