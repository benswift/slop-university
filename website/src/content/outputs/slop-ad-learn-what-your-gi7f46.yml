summary: >-
  A marketing poster from the School of Emergent Priorities shows a student at
  a workbench with eyes closed, one hand resting on a row of textured sample
  tiles and a pencil held idle over a blank card, and presents attention to
  touch as something a prospective student of the Master of Priority Studies
  will learn to exercise, pointing readers to the University's course
  catalogue and to three of its published studies.
