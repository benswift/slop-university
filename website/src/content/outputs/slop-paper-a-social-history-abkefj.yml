title: Not After One, Except for a Nova
subtitle: Waking, Confirmation and Credit in the Night Telephone Chain of a Provincial Astronomical Society, 1958–1991
authors:
  - Halvard Nnamani
preset: paper
school: School of Emergent Priorities
date: 2026-10-26
