doi: 10.5555/slop.abkefj
summary: >-
  A paper from the School of Emergent Priorities reconstructs the night
  telephone chain a provincial amateur astronomical society kept from 1958 to
  1991, through 1,603 calls on 214 alerts entered in its Night Book, the
  surviving annual revisions of its calling list and fourteen interviews. It
  argues that the chain, founded to confirm suspected discoveries, recorded who
  could be woken rather than who could see: twenty-three of its thirty-nine
  confirmed sightings were credited to members on shift work, and the
  Bulletin's "seen also" line came to rank members by their nights.
topic: >-
  a social history of the night telephone chain by which members of a
  provincial amateur astronomical society woke one another to confirm a
  suspected discovery, 1958–1991: who could be rung after midnight, who counted
  as a confirming eye, and what the newsletter credited
