title: Every Version Keeps Its Ancestors
subtitle: Linking Fraud Call-Centre Seizures by the Revision History of Their Scripts
authors:
  - Fenna Okoro
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-11-08
publishedAt: "2026-11-08T09:01:18+11:00"
doi: 10.5555/slop.f6ix23
summary: >-
  A paper from the School of Emergent Priorities infers a version tree over 412
  fraud call-centre script files recovered from nine device seizures that share
  no telephone number, account or device identifier, using a directed edit cost
  that prices deletions above insertions. Validated against one seizure's own
  revision log, where it recovers 88.3 per cent of parent edges, the tree
  places six of the nine seizures in one graded lineage and finds 58.7 per cent
  of all revisions falling in the scripts' objection-handling turns.
topic: >-
  reconstructing the revision history of fraud call-centre scripts recovered
  from separate device seizures, inferring a version tree that links cases
  sharing no other identifier
