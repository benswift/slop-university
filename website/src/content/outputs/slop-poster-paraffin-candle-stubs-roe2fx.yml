summary: >-
  A research poster from the School of Emergent Priorities runs differential
  scanning calorimetry on 52 paraffin candle stubs collected at the vacate
  inspections of 37 rented houses, then pools them into four remelted
  candles. Each pooled candle keeps its stubs' mass-weighted transition
  enthalpy to within 2.5 per cent, but its solid-solid transition no longer
  resolves as a separate peak and it melts over roughly twice the
  temperature range.
topic: >-
  paraffin candle stubs left behind at rental vacate inspections, pooled and
  remelted into one candle: rotator-phase and melting thermodynamics of the
  blend by differential scanning calorimetry
