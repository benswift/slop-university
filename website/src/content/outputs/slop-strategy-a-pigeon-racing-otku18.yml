doi: 10.5555/slop.otku18
summary: >-
  Slop University's Strategic Plan 2026-2031 builds a Discretion Register and
  a fixed review cadence for partner-body rulings from a single pigeon racing
  club steward's disputed decision on a bent identification ring, committing
  every documented ruling to stand as precedent unless a named panel revisits
  it on schedule.
topic: >-
  The ring-clocking steward at a suburban pigeon racing club rules that a
  competitor's disputed ring seal doesn't undo the season's tightest win, and
  Slop University builds its new Discretion Register around her reasoning,
  requiring every partner body's on-the-spot judgment call to be logged and
  left standing unless a named review panel changes the rule itself before
  the next cycle opens.
