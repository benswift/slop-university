title: Does a Bent Ring Seal Undo the Season's Tightest Win?
subtitle: >-
  How one steward's ruling became the model for Slop University's new
  Discretion Register
authors:
  - Osei Vandermeer
  - Torun Ezeigwe
preset: strategy
school: School of Continuous Improvement
date: 2026-09-15
