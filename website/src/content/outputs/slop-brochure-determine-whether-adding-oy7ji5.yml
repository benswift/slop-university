summary: >-
  A research-showcase brochure from the School of Continuous Improvement
  profiles a term-long trial testing whether staff photographs on a
  break-room duty roster wheel change compliance with the rostered turn,
  reports no measurable effect, and records Facilities Coordination's
  decision to specify the fixture in every franchise break room's opening
  kit regardless of the result.
topic: >-
