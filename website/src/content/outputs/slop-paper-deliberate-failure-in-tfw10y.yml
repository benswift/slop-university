title: Falling on Purpose
subtitle: Deliberate Failure as Scale Calibration in a Fractions Number-Line Game
authors:
  - Sunniva Balogun
  - Gunnhild Ekwueme
  - Anneke Tolan
preset: paper
school: School of Emergent Priorities
