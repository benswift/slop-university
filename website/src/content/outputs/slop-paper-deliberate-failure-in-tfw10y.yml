doi: 10.5555/slop.tfw10y
summary: >-
  A paper from the School of Emergent Priorities follows 198 Year 7 students in
  nine classes through four sessions of a fractions game in which a misplaced
  plank falls from a number-line bridge, and identifies 1,106 of 14,377 failures
  as deliberate with a log rule checked against cued-recall interviews.
  Bracketing, dropping planks at both ends of a span in quick succession,
  clustered on the levels that introduce a new span, cost students stars, and
  was the only form of deliberate failure to predict lower estimation error on
  untrained number lines four weeks later.
topic: >-
  Deliberate failure in an educational fractions puzzle game: lower-secondary
  students who lose levels on purpose to see what happens, and whether that
  exploratory failing predicts delayed transfer
