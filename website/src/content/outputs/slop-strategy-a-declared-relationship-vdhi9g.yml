title: Who Else Was in the Room?
subtitle: >-
  The 2026-2031 Strategic Plan Accepts Every Declared Connection at the Same
  Weight, Publishes the Register, and Replaces Required Withdrawal With a Note on
  the Record
authors:
  - Ronja Oyelaran
  - Iben Chikere
preset: strategy
school: School of Emergent Priorities
date: 2026-08-17
publishedAt: 2026-08-17T21:01:17+10:00
doi: 10.5555/slop.vdhi9g
summary: >-
  Slop University's Strategic Plan 2026-2031 rebuilds the University's integrity
  settings around one public register of declared connections, and removes the
  materiality test at lodgement so that a connection is declarable because it
  exists rather than because the person holding it judged it significant. The
  plan's binding provision runs the other way from sector practice: a declared
  connection is noted and the business proceeds, with required withdrawal retired
  from the delegations framework and a nil return referred for review.
topic: >-
  a declared relationship counts as a resolved one: put every connection in the
  room on a public register before anything proceeds, report declarations lodged
  per person as the University's integrity indicator, and refer a nil return for
  relationship mapping
