summary: >-
  A civic brochure presenting the University's work in and with the
  communities around it, under three themes --- the line on the soil map, the
  sign on the kerbside pole and the township noticeboard, and the mark on the
  suburban kerb --- with one feature for each of its three Schools. It rests
  them on six published studies cited by title and DOI, and closes with an
  invitation to visit and get in touch.
topic: >-
  reading the signs of a shared place: the University in its community,
  learning how a line on a map, a label on a door or a marker on a post comes
  to be read as something found there
