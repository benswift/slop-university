summary: >-
  A research poster from the School of Continuous Improvement classifies
  active reviewers on a neighbourhood buy-swap-sell app into five rating-style
  kinds from review text and timing alone, and reports the app's decision to
  count one kind's stars for half value once the scheme went live.
