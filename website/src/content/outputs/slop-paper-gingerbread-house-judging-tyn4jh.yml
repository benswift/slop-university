title: Households Weaken Their Gingerbread Roofs to Avoid the Open Division
subtitle: >-
  Bunching Below a P&C Fete's Four-Level Gingerbread Structural Maturity
  Model, and the Silent-Auction Promotion It Triggers
authors:
  - Petra Umbile
  - Kwame Lindqvist
  - Dagny Okafor
preset: paper
school: School of Emergent Priorities
date: 2026-09-07
publishedAt: "2026-09-07T12:01:15+10:00"
doi: 10.5555/slop.tyn4jh
summary: >-
  A paper from the School of Emergent Priorities scores 356 households'
  gingerbread houses against a four-level maturity model across three P&C
  fete seasons, finding households that clear Level 3 --- and the mandatory
  silent-auction donation that promotion triggers --- build measurably
  weaker structures the following year, clustering just below the cutoff
  that caused it.
topic: >-
  Gingerbread-house judging promotes a household into a P&C fete's Open
  division once its entry clears Level 3 of a four-level Gingerbread
  Structural Maturity Model, triggering a mandatory silent-auction donation
  of the house with no opt-out; the household's designated gingerbread
  engineer responds by quietly weakening next year's structure to stay below
  the cutoff.
