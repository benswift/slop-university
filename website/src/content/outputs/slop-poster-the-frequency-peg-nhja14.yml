title: "'Whose Peg Is on Six?'"
subtitle: Hold-time distributions at the frequency boards of 41 model flying clubs
authors:
  - Mirela Hanke
  - Solveig Adeyemi
  - Edda Nwafor
preset: research-poster
school: School of Continuous Improvement
