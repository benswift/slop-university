doi: 10.5555/slop.nhja14
summary: >-
  A research poster from the School of Continuous Improvement surveys 6,208
  peg holds on the frequency boards of 41 model flying clubs, finds two modes
  in every club-size tier (a flight, and a peg left on after the last
  landing), and reports the School adopting the shorter interval as the
  forfeit clock on every shared booking it runs, with no extension.
topic: >-
  The frequency peg board at a model flying club, whose forgotten pegs a
  survey of 41 clubs reads as hold-time distributions, and the seven-minute
  modal flight the School adopts as the forfeit clock on every shared booking
  it runs.
