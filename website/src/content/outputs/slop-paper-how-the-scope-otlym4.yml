title: Neither the Shop nor the Factory
subtitle: Coordination under Negation in a Century of Restrictive Covenants
authors:
  - Clemency Tredinnick
  - Anselm Threlkeld
preset: paper
school: School of Settled Matters
date: 2026-11-25
