doi: 10.5555/slop.otlym4
summary: >-
  A paper from the School of Settled Matters codes 611 coordinated restrictive
  covenants registered between 1912 and 2011 and puts six coordinated forms to
  212 present-day readers. A negated "or" was read as forbidding each disjunct
  on 94 per cent of trials, while a negated "and" divided readers, more often
  forbidding each conjunct when it joined noun phrases (61 per cent) than verb
  phrases (43 per cent); the mid-century rise of "and" turns out to be six
  estate templates entered lot by lot, and counted by distinct wording it
  barely rises at all.
topic: >-
  how the scope of 'or' under negation in restrictive covenants ('shall not
  erect a shop or a factory') varies across a century of covenant drafting, and
  what later readers take each wording to forbid
