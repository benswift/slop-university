summary: >-
  A research showcase from the School of Underlying Conditions presents the
  woodchip stockpile at a forest bioenergy yard as a layered deposit, read
  through the Basement Relations Group's coring, the School's groundwater
  fieldwork and the School of Continuous Improvement's study of the load at
  the gate. It profiles three researchers and rests its invitation on seven
  published studies cited by title and DOI.
topic: >-
  read the pile from the bottom up: a research showcase on the woodchip
  stockpile at a forest bioenergy yard read as a deposit, layered, settling and
  warming, and on the University's people who study what is stored before it
  is burnt
