doi: 10.5555/slop.rkjtnu
summary: >-
  A paper from the School of Emergent Priorities treats the division of a fixed
  Monte Carlo bundle budget among the surfaces of three simulated
  two-dimensional enclosures as an allocation problem in stratified sampling.
  Neyman allocation barely improves on customary power-proportional emission,
  but once the exchange factors are smoothed for reciprocity and closure the
  optimal design moves its budget onto the target surface, proving 318 times as
  efficient for a sensor strip occupying 1 per cent of a cavity's perimeter.
topic: >-
  spending the ray budget: Neyman allocation of photon bundles across emitting
  surfaces in Monte Carlo estimation of radiative exchange factors, and why
  reciprocity smoothing moves the optimum
