title: Allocating the Ray Budget
subtitle: Reciprocity Smoothing Moves the Optimal Monte Carlo Design onto the Target Surface
authors:
  - Kwame Lindqvist
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-10-22
