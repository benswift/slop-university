title: Nobody's Dry Bore
subtitle: Controllability, Exclusion Codes and the Appraisal of Groundwater Monitoring Crews
authors:
  - Vigdis Emenike
  - Renke Sabel
preset: paper
school: School of Underlying Conditions
date: 2026-11-15
publishedAt: "2026-11-15T07:31:19+11:00"
doi: 10.5555/slop.drx852
summary: >-
  A paper from the School of Underlying Conditions follows a regional water
  authority across a change in how it appraises its groundwater monitoring
  technicians, from a completion rate that counted a dry bore against them to
  one that let signed-off dry and inaccessible visits be excluded. Against a
  logger-fitted subset of 164 bores, readings taken off the bottom of empty
  bores fell from 38% to 6% of the visits that met no water, but the exclusion
  code was keyed as the database's no-reading status, so dry visits that once
  carried a base depth now enter the record as gaps.
topic: >-
  the controllability principle in appraising groundwater monitoring crews: who
  is held to account for a dry bore
