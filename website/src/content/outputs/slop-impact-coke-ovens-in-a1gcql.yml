title: Kept in Tolerance to the End
subtitle: Five Years of the School of Continuous Improvement's Work in Coke Works Scheduled to Close
authors:
  - Sten Okwuosa
  - Bram Ntuli
  - Casimir Beng
preset: impact-report
school: School of Continuous Improvement
