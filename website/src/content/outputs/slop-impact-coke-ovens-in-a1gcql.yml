summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 looks back on
  five years in coke works with fixed closing dates through three case studies:
  a flue-temperature round rewritten around wall condition that narrowed the
  between-heater spread at a battery's most damaged wall block from 62 °C to
  29 °C, an improvement register that lapsed 538 actions and closed 611 under a
  named-authoriser protocol, and a census of where one works' 412 operating
  procedures went when its battery stopped.
topic: >-
  coke ovens in their final decade: five years of improvement work with coal
  and coke plants scheduled to close
