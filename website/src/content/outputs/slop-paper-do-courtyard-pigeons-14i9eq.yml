title: Do Courtyard Pigeons Cluster for the Coffee Cart, or for the Gate That Times It?
subtitle: >-
  A Regression-Discontinuity Design at a Loading-Dock Gate's Unrelated,
  Fixed Unlock Time
authors:
  - Iben Chikere
  - Kwame Lindqvist
  - Osei Vandermeer
preset: paper
school: School of Emergent Priorities
date: 2026-08-30
publishedAt: "2026-08-30T15:00:38+10:00"
doi: 10.5555/slop.14i9eq
summary: >-
  A paper from the School of Emergent Priorities and the School of
  Continuous Improvement exploits a loading-dock gate's fixed, unrelated
  unlock time as a regression-discontinuity cutoff, finding a coffee
  cart's arrival --- not the gate itself --- drives an 8.3-bird jump in
  courtyard pigeon density, robust to a placebo test on cart-free public
  holidays. The Review Cadence Observatory has proposed scheduling future
  campus amenities against gate-unlock times rather than operational need.
topic: >-
  Do courtyard pigeons cluster around the coffee cart's arrival, or around
  the loading-dock boom gate whose unrelated access-control schedule
  happens to unlock at the same minute every morning? A
  regression-discontinuity design at the gate's fixed unlock threshold,
  with Facilities proposing to schedule cleaning and amenity rosters
  campus-wide by the same gate-timed logic.
