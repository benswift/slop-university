doi: 10.5555/slop.ulrdjm
summary:
  A research poster from the School of Emergent Priorities scores a minibus
  fleet's dashboard tyre-pressure warning as a diagnostic test, recording the
  lamp's state at 4,318 pre-departure checks across 96 vehicles and eleven
  depots before gauging all four tyres cold against the placard pressure.
  Sensitivity is 82.3 per cent and specificity 71.5 per cent, but genuine
  under-inflation is present at only 4.6 per cent of checks, so positive
  predictive value holds at 12.2 per cent; the warning rate rises from 9.4 per
  cent of vehicles on mornings at or above 14 °C to 41.7 per cent below 6 °C,
  and the 1,284 driver attestations the lamp triggered are counted as completed
  safety checks.
topic:
  dashboard tyre-pressure warnings on a community-transport minibus fleet,
  checked against a calibrated gauge at every pre-departure inspection, and what
  the depot safety dashboard counts when it counts the attestations each warning
  triggers
