title: Lit, and Within Spec
subtitle:
  Diagnostic Accuracy of a Dashboard Tyre-Pressure Warning Against Calibrated
  Gauge Readings at 4,318 Community-Transport Pre-Departure Checks
authors:
  - Lindiwe Achterberg
  - Dagny Okafor
  - Anouk Mensah
preset: research-poster
school: School of Emergent Priorities
