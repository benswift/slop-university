summary: >-
  A marketing poster for the School of Underlying Conditions carries the
  School's interest in boundaries from the soil survey to the motor cortex: a
  seated volunteer in a dotted mapping cap, a figure-of-eight coil at the
  scalp and a patch of responsive points marked in gold, under four words of
  display type and the title and identifier of a published study of where
  such lines are drawn. Prepared for the landscape panels in matched daylight
  and evening renderings.
