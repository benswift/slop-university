summary: >-
  A research poster from the School of Underlying Conditions codes the first
  message of 4,180 return sessions with a text-based wellbeing check-in chatbot
  and finds that apology for the absence rises with its length, peaking at 44
  per cent after one to three months away, before giving way to plain greeting
  among users who have been gone longer than a season.
topic: >-
  what returning users type first to a wellbeing chatbot after a lapse: apology
  as the opening move, and how it scales with the length of the absence
