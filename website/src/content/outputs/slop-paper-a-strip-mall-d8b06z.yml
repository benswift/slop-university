doi: 10.5555/slop.d8b06z
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement describes Comity, a gossip-reconciled tap ledger built to
  replace the quarterly reconciliation meeting six independently owned
  shopfronts on a strip mall held to settle their shared loyalty scheme.
  Deployed across two quarters and roughly 14,600 taps, the ledger converges
  in minutes for five fixed shopfronts and far more slowly for an
  intermittently connected food truck; an ablation removing its tie-break
  rule leaves each shop's aggregate quarterly rebate share largely unchanged.
  The strip's traders' association has adopted the ledger's settled
  attribution as the automatic formula for the rebate split.
topic: >-
  A strip mall pools one loyalty scheme across six independently owned
  shopfronts with no shared point-of-sale system, so Slop University built a
  gossip-reconciled tap ledger -- vector-clock event logs merged across each
  shop's own tablet -- to settle which shopfront earned credit when a
  customer's card gets tapped at more than one register in a day. The strip's
  traders' association has adopted the ledger's settled attribution as the
  automatic formula for splitting the mall's quarterly shared-marketing
  rebate, replacing the reconciliation meeting the shopkeepers used to hold
  in person.
