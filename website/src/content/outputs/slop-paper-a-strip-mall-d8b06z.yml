title: Merged, Not Met
subtitle: Vector Clocks, a Tie-Break Heuristic, and the Marketing Rebate a Strip Mall No Longer Splits by Meeting
authors:
  - Iben Chikere
  - Fenna Okoro
  - Joost Nwosu
