title: Five Gates, No Dawn Gap
subtitle: >-
  A Pre-Registered Multi-Site Replication of a Dawn-Hours Gate-Counter
  Undercount, and the Correction Factor That Outlived It
authors:
  - Petra Umbile
  - Marek Solheim
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-07-31
publishedAt: 2026-07-31T05:00:33+10:00
doi: 10.5555/slop.n23z4k
summary: >-
  A paper from the School of Emergent Priorities repeats an earlier
  dog-park gate-counter study at five further enclosures, one in each
  council now applying the 1.72 dawn correction factor the original fed,
  completing 694 paired observer sessions over 24 weeks per site. The
  pooled dawn-minus-midday agreement difference is -2.1 percentage points
  against 33 in the original, inside the pre-registered equivalence
  bounds, with the only attenuated site the only one sharing the
  original's sensor mounting.
topic: >-
  replicating the dawn undercount at five other councils' dog-park gate
  counters, where the gap fails to reproduce anywhere, while the shared
  off-lead-hours decision rule keeps applying the original's dawn
  correction factor
