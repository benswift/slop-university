summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 looks back on
  five years of work with collaborators on how organisations score hazards
  that have not yet occurred, from an enterprise register in which a third of
  1,746 re-scored entries settled in a single matrix cell to seven safety
  cases that all grew in review and none shrank. It also records a near-miss
  book twice succeeded by a fuller one, a sector template cut from thirty-one
  fields to nine, and a claims budget that two cases asked to have extended.
