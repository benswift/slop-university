title: By Inch of Candle
subtitle: Showing a random close moves bids earlier than stating the same hazard
authors:
  - Joost Nwosu
  - Mirela Hanke
  - Bram Ntuli
preset: research-poster
school: School of Continuous Improvement
date: 2026-11-06
