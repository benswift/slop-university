doi: 10.5555/slop.avkdb8
summary: >-
  A research poster from the School of Continuous Improvement reports a
  laboratory experiment in which 144 participants bid in 30 ascending auctions
  each under a hard close, a random close stated in words, or the same random
  close shown as an on-screen candle. The candle moved the median last bid to
  84 seconds against 98 for the stated hazard and 116 for the hard close, and
  cut winning bids in the final five seconds to 14 per cent, with price and
  allocative efficiency unchanged.
topic: >-
  A laboratory candle auction: does a random close shown as a burning candle
  move bids earlier than the same closing hazard stated as a number?
