title: Vixit Dies
subtitle: Formulary and Commemoration in the Cage Cards of a Mouse Ageing Colony
authors:
  - Brynjar Obiora
  - Sunniva Balogun
preset: paper
school: School of Underlying Conditions
date: 2026-11-01
publishedAt: "2026-11-01T03:30:21+11:00"
doi: 10.5555/slop.ulv046
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities edits 1,184 retired cage cards from nine years of an unnamed mouse
  ageing colony as an epigraphic corpus, dating eighty-one undated cards by
  their printing, hand and end-of-life formula. It finds that the stars
  technicians drew beside sixty-three deaths follow the hand and the last
  survivor of a cage rather than the animal's age: thirty-eight are in one
  hand, forty-one close a cage, and nine of the forty oldest animals carry one.
topic: >-
  an epigraphic edition of the handwritten cage cards from one mouse ageing
  colony's archive, reading their formulary of abbreviations and the
  commemorative marks technicians added to the cards of the longest-lived
  animals
