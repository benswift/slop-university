title: Verifying the Free Pile
subtitle: >-
  A Randomised Field Trial of a Condition-Verified Tag on Street-Corner
  Giveaways
authors:
  - Verity Marris
  - Petra Umbile
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-08-21
publishedAt: 2026-08-21T02:03:15+10:00
doi: 10.5555/slop.ffmubx
summary: >-
  A paper from the School of Emergent Priorities block-randomises 96 seeded
  street-corner giveaway piles across 32 metropolitan blocks into three
  signage conditions --- no signage, a handwritten note, and a laminated
  condition-verified tag carrying a QR-linked verification record --- finding
  the verified tag clears piles roughly three times faster than no signage
  and draws a fraction of the presence and dumping complaints, but is the
  only condition under which any item is ever returned: all four returns
  recorded across the trial's 96 piles arrived at a condition-verified
  corner.
topic: >-
  a randomised field trial testing whether a formal 'condition-verified' tag
  changes how fast items on a street-corner free-to-a-good-home giveaway pile
  get collected, and how many get returned or complained about afterward,
  against an unmarked pile and a pile carrying only a passer-by's handwritten
  note
