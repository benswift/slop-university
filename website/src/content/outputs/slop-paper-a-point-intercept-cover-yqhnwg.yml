title: An Exclosure of Record
subtitle: Unreleased Wall Leases and the Persistence of Painted Advertisements on a County Seat's Commercial Masonry
authors:
  - Clemency Tredinnick
  - Sunniva Balogun
preset: paper
school: School of Settled Matters
