doi: 10.5555/slop.yqhnwg
summary: >-
  A paper from the School of Settled Matters and the School of Emergent
  Priorities samples the 52 painted advertisements on a small county seat's
  commercial masonry at 10,400 points and sets each wall's cover against the
  wall leases recorded on its title. Legible paint covered 38.6 per cent of
  panels under a lease recorded and never released, against 11.9 per cent
  under released leases and 17.4 per cent under none, a difference carried
  almost entirely by overpaint, which the paper reads as the one disturbance an
  unreleased lease keeps out.
topic: >-
  a point-intercept cover survey of the faded painted wall advertisements on
  one American county seat's commercial blocks, each paint layer read as a
  cover class and its persistence set against the wall leases recorded on each
  building's title
