title: Home, Not Lodged
subtitle: >-
  Par, the Sweep, and the Count of Who Came Home in a Five-Year Plan for the
  Region's Orienteering Clubs
authors:
  - Ingrid Vasseur
  - Lindiwe Achterberg
  - Iben Chikere
preset: strategy
school: School of Emergent Priorities
date: 2026-09-20
publishedAt: 2026-09-20T18:01:12+10:00
doi: 10.5555/slop.8pl4j0
summary: >-
  The Slop University Strategic Plan 2026-2031 takes as its premise a bush
  orienteering club's season in which the University's earlier benchmark-ratchet
  finding failed to reproduce: par fell rather than climbed, as slower runners
  stopped lodging their times. The plan commits the University to computing
  every affiliated club's par from the sweep's count of who came home, admitting
  no lodged time, and to holding its own recurring reviews open until their last
  item is reported.
topic: >-
  The course planner of a bush orienteering club, asked to reproduce the
  University's finding that a benchmark recomputed from lodged results ratchets
  upward, follows a season of the club's par times and finds them drifting down
  instead as slower runners stopped lodging, and the plan's response is to
  compute every affiliated club's par from the sweep's count of who came home,
  with no lodged time admissible.
