title: The Case for Percentile Governance
subtitle: >-
  A Strategic Plan grounded in a survey of Working with Children Check renewal
  waits among volunteer junior-sport coaches
authors:
  - Verity Marris
  - Casimir Beng
preset: strategy
school: School of Emergent Priorities
date: 2026-09-26
publishedAt: "2026-09-26T11:02:05+10:00"
doi: 10.5555/slop.4mffl7
summary: >-
  Slop University's Strategic Plan 2026-2031 commits every internal approval
  and compliance process to publish its full distribution of turnaround, not a
  single average, after a survey of volunteer junior-sport coaches found a
  persistent minority waiting weeks longer than their Working with Children
  Check renewal's reported average implied. Discretionary grant-scheme access
  is suspended for any unit whose ninetieth-percentile turnaround breaches a
  published external civic benchmark for two consecutive quarters.
topic: >-
  Wait-day spread in Working with Children Check renewals for volunteer
  junior-sport coaches, governed by percentile rather than average
