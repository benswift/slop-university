title: Neat Enough to Be Green
subtitle: A Randomised Vignette Experiment on Trailer-Load Classification at the Gate
authors:
  - Torun Ezeigwe
  - Solveig Adeyemi
preset: research-poster
school: School of Continuous Improvement
date: 2026-07-28
