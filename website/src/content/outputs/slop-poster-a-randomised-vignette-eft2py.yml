doi: 10.5555/slop.eft2py
summary: >-
  A research poster from the School of Continuous Improvement puts 1,776
  randomised load vignettes to 148 waste transfer station gate attendants
  across six councils, crossing what a trailer contains with how it is
  stacked and how many vehicles are waiting behind it. A stacked load
  carrying one non-green item is called green waste in 71.4% of judgements
  at a clear gate and 38.2% when the same composition arrives heaped with
  six vehicles waiting, with presentation and queue state together shifting
  the call by 38.2 percentage points against composition's 47.3.
topic: >-
  a randomised vignette experiment with waste-transfer-station gate
  attendants: does a trailer load get called green waste or general waste by
  what is in it, or by how neatly it is stacked and how long the queue
  behind it is
