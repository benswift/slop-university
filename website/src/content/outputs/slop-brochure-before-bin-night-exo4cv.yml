doi: 10.5555/slop.exo4cv
summary: >-
  A research-showcase brochure built around the Kerbside Taxonomy Register, a
  joint Trajectory Analytics Group and Adaptive Metrics Lab scheme that
  assigns every household's cardboard boxes one of four grades each
  collection cycle and requires a Terminal grade to leave the property by the
  next bin night. It surveys seven published studies on domestic
  classification, from a kitchen-cupboard container taxonomy already adopted
  as a contamination standard to a four-level bin-night maturity model.
topic: >-
  Before bin night: a taxonomy that sorts cardboard boxes into kinds before
  they leave the yard
