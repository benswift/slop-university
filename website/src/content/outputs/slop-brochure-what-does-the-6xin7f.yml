summary: >-
  A research-showcase brochure profiling Slop University's measurement
  research, anchored by a Living Dashboard survey of marketplace-forum users'
  expectations of an "or nearest offer" listing tag, reported as a full
  population distribution rather than an average, which the University's own
  surplus-equipment resale forum now uses to fix a single forum-wide discount
  floor.
topic: >-
  marketplace-forum users disagree widely about what discount an "or nearest
  offer" listing tag actually promises, surveyed as a full distribution rather
  than an average, and the university's surplus-equipment resale forum fixes a
  single ONO discount floor at the survey's largest single belief cluster,
  which held for well under half of respondents, regardless of the spread the
  survey itself reported
