summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 traces five
  years of interview fieldwork cataloguing the vocabulary staff use for the
  rituals of an ordinary working week, and follows TERM, the School's
  terminology-review function, as it escalates one independently-recurring
  term into a binding clause of a partner organisation's enterprise
  agreement.
topic: >-
  TERM decides which floor-coined word gets to become policy. A five-year run
  of interview studies --- the open-plan office, the daily stand-up, the
  performance-review calibration meeting, and franchise onboarding --- asks
  staff what their own names for the day's rituals actually mean, in their
  own words, and follows one term all the way from a break-room joke into an
  enterprise agreement.
