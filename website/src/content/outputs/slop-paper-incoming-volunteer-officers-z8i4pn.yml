title: Still on the Phone List
subtitle: Predecessor Consultation and Early Exit in Volunteer Officer Succession
authors:
  - Halvard Nnamani
  - Iben Chikere
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-10-14
publishedAt: 2026-10-14T18:01:51+11:00
doi: 10.5555/slop.z8i4pn
summary: >-
  A paper from the School of Emergent Priorities follows 187 officer
  successions in 64 volunteer-run community organisations through weekly
  contact diaries, finding that incoming officers' contact with the person they
  replaced levels off rather than ending and shifts from access and the
  location of things towards requests for judgement. Successor-initiated
  consultation is associated with a lower hazard of leaving the office early,
  and unsolicited intervention by the predecessor with a higher one.
topic: >-
  incoming volunteer officers of community organisations keep ringing the
  person they replaced: a twelve-month contact-diary study of predecessor
  consultation and early exit in volunteer role succession
