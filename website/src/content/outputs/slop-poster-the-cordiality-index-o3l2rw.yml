title: Warm at the Register, Cold on the Premium
subtitle: A Population Survey of Customer-Rated Cordiality Across Strip-Mall Traders and Food Trucks, and the Insurance-Excess Bands It Now Sets
authors:
  - Casimir Beng
  - Marek Solheim
  - Fenna Okoro
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-15
publishedAt: "2026-09-15T13:26:06+10:00"
doi: 10.5555/slop.o3l2rw
summary: >-
  A population survey of 246 strip-mall traders and food-truck operators
  distils 3,412 customer exit-interview ratings into a Cordiality Index,
  reporting the results as distributions across venue type rather than a
  single average. A participating insurer now sets each stallholder's
  public-liability excess band from the resulting score, fixed for the full
  renewal year with no mid-year override.
topic: >-
  The Cordiality Index, compiled from customer exit-interview ratings
  surveyed across the strip mall's independent traders and food trucks, is
  sorting each stallholder into one of three public-liability insurance
  excess bands
