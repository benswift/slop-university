title: Filed on Time, Paid Late
subtitle: Small-trader sales-tax compliance after a staggered move from quarterly to monthly returns
authors:
  - Osei Vandermeer
  - Kwame Lindqvist
preset: research-poster
school: School of Continuous Improvement
