summary: >-
  A research poster from the School of Continuous Improvement reads one
  regional revenue office's three-wave move of 8,960 small traders from
  quarterly to monthly sales-tax returns as a staggered difference-in-differences.
  Six quarters after switching, on-time lodgement is up 6.1 percentage
  points and payments more than seven days late are up 8.9 points, concentrated
  among traders with the thinnest cash buffers, while tax remitted per quarter
  is statistically unchanged.
topic: >-
  filing cadence and small-trader sales-tax compliance: what a staggered switch
  from quarterly to monthly returns did to on-time filing, late payment and nil
  returns
