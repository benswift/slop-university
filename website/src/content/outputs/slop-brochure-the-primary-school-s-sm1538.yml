summary: >-
  A marketing brochure from the School of Continuous Improvement's Adaptive
  Metrics Lab sets out the Consent Readiness Quadrant, a four-cell framework
  for sorting school permission-slip submissions, and proposes it as a
  national readiness standard alongside seven of the University's recently
  published findings on paperwork, waivers, and digital-life triage.
topic: >-
  the primary school's consent coordinator already tells apart a clean
  online permission-slip submission from one that will need chasing; the
  university formalises that judgement into a four-cell quadrant --- Clean,
  Chased, Legacy, Missing --- crossing on-time submission against
  digital-versus-scanned-paper form, and proposes it as a national
  school-consent readiness standard
