title: The Promise in the Handover File
subtitle: Does an undertaking given by the last holder of a post bind the next?
authors:
  - Vigdis Emenike
  - Brynjar Obiora
  - Lindiwe Achterberg
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-13
