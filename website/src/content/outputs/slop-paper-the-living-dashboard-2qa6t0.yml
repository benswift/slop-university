title: No Longer Neutral
subtitle: >-
  Branch-Eligibility Thresholds and the Vanishing Midpoint Response in a
  Retail Engagement-Survey Programme
authors:
  - Marit Osayande
  - Mirela Hanke
  - Casimir Beng
preset: paper
school: School of Continuous Improvement
date: 2026-09-15
publishedAt: "2026-09-15T11:54:38+10:00"
doi: 10.5555/slop.2qa6t0
summary: >-
  A paper from the School of Continuous Improvement compares the cross-branch
  distribution of neutral-response share on a retail chain's annual staff
  sentiment survey across four waves, before and after the Living Dashboard
  published a branch-eligibility ceiling on that share. The pre-announcement
  distributions are smooth around the eventual cutoff; the first
  post-announcement wave shows a pronounced excess of branches just below the
  ceiling and a matching deficit just above it, concentrated in items about
  management responsiveness rather than physical workplace comfort, and the
  chain's expansion-eligibility rule remains bound to the raw share
  regardless.
topic: >-
  the Living Dashboard collects engagement-survey response distributions
  gathered during a retail chain's annual performance-review cycle across
  its branch offices, and locks any branch whose neutral-response share
  exceeds a published threshold out of eligibility for the chain's next
  expansion round, with no appeal
