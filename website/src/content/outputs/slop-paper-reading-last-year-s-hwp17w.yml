title: Reading Last Year's List
subtitle: Enrolment Cobwebs in a Provincial School of Political Science, 1881–1913
authors:
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-29
publishedAt: "2026-10-29T06:01:15+11:00"
doi: 10.5555/slop.hwp17w
summary: >-
  A paper from the School of Underlying Conditions reconstructs thirty-three
  cohorts of a provincial school of political and administrative sciences'
  preparatory course for the administrative examination from its fee-book,
  1,436 first-time entrants and 586 repeat enrolments in all. While the
  ministry announced its places in advance, first-time entry tracked the
  announcement (elasticity 1.03); once the notice ceased in 1899 it tracked
  the previous year's pass ratio instead (elasticity 1.37), alternating
  between lean and full cohorts, while returning repeaters filled the lean
  years and held the school's fee income nearly steady.
topic: >-
  reading last year's list, an economic history of a provincial school of
  political science's fee-book, 1881–1913, in which enrolment in its
  preparatory course for the administrative examination follows the
  ministry's announced places until the announcements stop in 1899, after
  which candidates read the previous year's pass list and enrolment swings in
  a two-year cobweb
