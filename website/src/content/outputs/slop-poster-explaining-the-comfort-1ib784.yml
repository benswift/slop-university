title: Warmed on Paper
subtitle: >-
  A Three-Arm Cluster-Randomised Trial of a Setpoint Change Against a Printed
  Comfort-Band Notice, Across 36 Leased Office Floors
authors:
  - Ronja Oyelaran
  - Anouk Mensah
  - Kwame Lindqvist
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-14
publishedAt: "2026-08-14T05:02:38+10:00"
doi: 10.5555/slop.1ib784
summary: >-
  A research poster from the School of Emergent Priorities allocates 36 occupied
  floors across four buildings in one managed commercial portfolio to three
  conditions for six months: a 1.5 °C setpoint rise, a printed notice at every
  kitchenette and lift lobby setting out the 21.0 to 24.0 °C band the lease
  promises, or no change. The contracted Occupant Comfort Index rises 10.4
  points on the setpoint floors and 9.6 on the notice floors, against 1.1 in the
  control, a difference between the two active arms of 0.8 points (95% CI -2.9
  to 4.5). Mean desk-height temperature, recorded by 288 loggers at five-minute
  sampling, shifts 1.42 °C under the setpoint change and 0.04 °C (95% CI -0.11
  to 0.19) under the notice, so both arms discharge a comfort clause written
  against the index rather than against the air.
topic: >-
  explaining the comfort band works as well as changing the temperature: a
  three-arm cluster-randomised trial across the floors of a leased office tower,
  where the quarterly occupant comfort score the facilities contract is
  acquitted on moves as much for a printed explanation of the contracted band as
  for a 1.5 degree setpoint change, while desk-height temperature under the
  explanation never moves
