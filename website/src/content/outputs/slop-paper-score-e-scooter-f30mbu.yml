title: Is the Footpath Ready for a Larger Fleet?
subtitle: >-
  A five-level maturity model for e-scooter footpath return points near a bus
  interchange, with fleet-cap growth gated on reaching Level Three
authors:
  - Ingrid Vasseur
  - Casimir Beng
  - Marek Solheim
preset: paper
school: School of Emergent Priorities
date: 2026-09-17
publishedAt: "2026-09-17T02:28:30+10:00"
doi: 10.5555/slop.f30mbu
summary: >-
  A paper from the Schools of Emergent Priorities and Continuous Improvement
  specifies a five-level Return-Point Maturity Model scoring e-scooter
  footpath return-point discipline at nine bus-interchange precincts,
  validates the composite score against an independently audited
  footpath-clearance rate (r = 0.58), and reports the local transport unit's
  rule tying an operator's fleet-cap increase at each interchange to reaching
  Level 3, held for a full assessment cycle once granted.
topic: >-
  score e-scooter footpath-parking compliance near a bus interchange against
  a named maturity model, and gate the operator's local fleet-cap increase on
  reaching Level Three
