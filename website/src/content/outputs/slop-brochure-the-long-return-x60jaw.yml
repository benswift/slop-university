summary: >-
  A case-for-support brochure led by the School of Underlying Conditions asks
  donors and regional partners to back the University's research on green
  economic development that pays back over years, in features on the
  arithmetic of payback, the merchants and workshops that carry a regional
  transition, and the co-operative ledgers in which its returns are recorded.
  Its showcase draws eight published studies from all four Schools.
topic: >-
  the long return: a case for supporting the University's research on the
  slow payback of a regional green economy, from the retrofit and the repair
  trade to the co-operative that keeps its own books
