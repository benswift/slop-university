title: The Higher a Centre Scores on Directory Maturity, the Farther Its Board Stands From the Door
authors:
  - Torun Ezeigwe
  - Mirela Hanke
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-09-19
publishedAt: 2026-09-19T14:01:12+10:00
doi: 10.5555/slop.vqb8kx
summary: >-
  A paper from the School of Continuous Improvement scores 43 shopping centres
  against the five-level Directory Dot Maturity Model, from Dot Absent to Dot
  Attested, and sets each centre's level against the distance from its
  you-are-here board to the nearest entrance and the time 172 shoppers took to
  find a named shop. Level rises with distance (Kendall's tau-b 0.46; median 12
  m at Level 1, 44 m at Level 5) and is unrelated to search time (tau-b 0.02),
  and the University now re-sites any campus map board whose dot is out of
  place rather than redrawing the dot.
topic: >-
  How mature is the shopping-centre 'you are here' directory board when
  forty-odd centres are scored against a five-level model from Dot Absent to
  Dot Attested, and should the University's campus map boards be moved to
  wherever their dot is already right?
