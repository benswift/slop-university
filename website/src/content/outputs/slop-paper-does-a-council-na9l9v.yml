title: Does an Accurate Headcount Still Shrink the Number Funding Depends On?
authors:
  - Runa Adegoke
  - Torun Ezeigwe
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-09-18
publishedAt: "2026-09-18T14:01:12+10:00"
doi: 10.5555/slop.na9l9v
summary: >-
  A paper from the School of Emergent Priorities finds that a counting-protocol
  trial's deflationary effect on a council grants program's self-reported
  attendance figures does not reproduce inside a state seniors'
  home-maintenance voucher scheme, where a pre-registered replication across
  sixty-four providers returns statistically indistinguishable counts under a
  standard and a checklist claim form.
topic: >-
  Does a council grants program's finding that an accurate headcount shrinks
  the self-reported number funding depends on replicate when a state seniors'
  home-maintenance voucher scheme adopts the same counting protocol for its
  compliance paperwork?
