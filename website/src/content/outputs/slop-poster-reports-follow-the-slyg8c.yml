title: Reports Follow the Counter
subtitle: Trading hours and the distance decay of spontaneous adverse-reaction reporting in a regional city
authors:
  - Ylva Onyekwere
  - Petra Umbile
  - Anneke Tolan
preset: research-poster
school: School of Emergent Priorities
