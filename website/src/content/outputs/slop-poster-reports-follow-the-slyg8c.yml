doi: 10.5555/slop.slyg8c
summary: >-
  A research poster from the School of Emergent Priorities maps 2,316
  de-identified spontaneous adverse-reaction reports lodged at 31 community
  pharmacies in one regional city against the city's dispensing. The three
  precincts with a counter open after 9 pm hold 31 per cent of dispensings and
  64 per cent of reports, and report rates decay with distance to a
  late-trading counter but not with distance to the nearest one.
topic: >-
  Reports follow the counter: an urban planner maps the catchments of
  spontaneous adverse drug reaction reports across an invented regional city,
  finding their distance decay is set by pharmacy trading hours rather than by
  where residents live
