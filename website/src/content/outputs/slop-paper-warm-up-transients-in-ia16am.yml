title: Twenty-Five Minutes Before the First Measurement
subtitle: >-
  Warm-Up Transients in a Slow-Shear Tellurium Dioxide Acousto-Optic Deflector
authors:
  - Edda Nwafor
  - Casimir Beng
preset: paper
school: School of Continuous Improvement
date: 2026-10-31
publishedAt: "2026-10-31T12:30:26+11:00"
doi: 10.5555/slop.ia16am
summary: >-
  A paper from the School of Continuous Improvement logs 78 starts of one
  acousto-optic deflector for an hour after its drive is switched on, finding
  that the steered beam settles along two exponentials of 1.9 and 13.4 minutes
  and needs a median 25 minutes at 1.0 W to come within 5 microradians of its
  resting position, long after diffraction efficiency has recovered. A
  two-node thermal model designs a twelve-minute overdrive preheat that cuts
  the wait to nine minutes, and parking the drive at the band edge between
  sessions removes it.
topic: >-
  warm-up transients in a tellurium dioxide acousto-optic deflector: how
  diffraction efficiency and beam pointing settle after RF switch-on, and how
  long a bench session should wait before its first measurement
