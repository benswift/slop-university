summary: >-
  A research poster from the School of Emergent Priorities has 48 pharmaceutics
  students and 48 lay speakers rate 48 nonsense names for skin-delivery
  vesicles, and finds that a linking -o- lifts a coinage for both groups while
  only the students mark down an English-sounding base. Asked what each name
  refers to, lay speakers read its base as the cargo and students as a
  constituent of the vesicle.
