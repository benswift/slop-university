title: The Same Letter, Three Rules
subtitle: Reconstructing the Priority Classes of a Municipal Tabulating Bureau's Run Book by Replay against Its Job Logs, 1961–1969
authors:
  - Anouk Mensah
  - Bram Ntuli
preset: paper
school: School of Emergent Priorities
date: 2026-11-03
publishedAt: "2026-11-03T05:31:17+11:00"
doi: 10.5555/slop.qv7r3m
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement encodes the three handwritten revisions of a municipal tabulating
  bureau's 1960s run book as dispatch rules and replays each against 9,812
  logged decision points from the bureau's job logs. The stated rules agree
  with the operators' choices at 81%, 66% and 52% of decision points in
  successive periods, while the priority letter A moves from a deadline to a
  department to a direction from the Superintendent's office and spreads from
  31% to 58% of logged jobs.
topic: >-
  replaying the index-card scheduling rules of an unnamed municipal tabulating
  bureau against its surviving job logs, 1961-1969: what its priority classes
  meant at each revision
