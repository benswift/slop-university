doi: 10.5555/slop.exo8f6
summary: >-
  A research poster from the School of Continuous Improvement turns 216
  containers of a model yield-stress gel upside down and weighs what stays
  behind once flow stops, across six shoulder angles and six yield stresses.
  Residual volume rises with yield stress at every angle and a flat shoulder
  keeps up to 19.6% of the fill, but above 45° the shoulder angle recovers at
  most 1.2 points, leaving a wall film the shape of the container cannot reach.
topic: >-
  how much of a yield-stress fluid stays behind as a static plug when an
  inverted household container drains, and how shoulder geometry and Bingham
  number set the residual volume
