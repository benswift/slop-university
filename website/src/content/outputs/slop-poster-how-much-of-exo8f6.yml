title: Where the Last Spoonful Stops
subtitle: Shoulder Geometry and Residual Volume in Inverted Containers of Yield-Stress Fluids
authors:
  - Eivind Onwuka
  - Gunnhild Ekwueme
  - Brynjar Obiora
preset: research-poster
school: School of Continuous Improvement
