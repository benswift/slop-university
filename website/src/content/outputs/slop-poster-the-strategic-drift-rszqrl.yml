title: A Cursor Is Not a Jacket
subtitle: A Failed Replication of Jacket-Held Seating on a Fete's Shared Sign-Up Sheet
authors:
  - Fenna Okoro
  - Runa Adegoke
  - Anneke Tolan
preset: research-poster
school: School of Emergent Priorities
