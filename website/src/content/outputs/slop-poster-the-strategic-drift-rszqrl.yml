summary: >-
  A research poster from the School of Emergent Priorities re-runs the
  library-jacket seat-occupancy finding on six school-fete cake-stall sign-up
  sheets (n = 1,146 parked-cursor episodes), finding that a parked cursor holds
  a cell in 4.1% of cases against the original 38%. The Strategic Drift Survey
  records the finding as reproduced once cells under a cursor are frozen for 48
  hours, and the fete committee's sheet template adopts the freeze.
topic: >-
  The Strategic Drift Survey re-runs, on a school fete's shared cake-stall
  sign-up spreadsheet, its finding that an unattended jacket holds a library
  seat, finds that a parent's idle coloured cursor parked on a cell holds
  nothing (the next parent types over it), and binds the fete committee to
  freeze every cell under a cursor for 48 hours so the original result can be
  observed
