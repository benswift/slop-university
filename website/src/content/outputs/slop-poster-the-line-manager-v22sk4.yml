title: The sticky square left on the bezel
subtitle: >-
  A single-site teaching case of the line manager and adhesive residue as
  performance-cycle close-out
authors:
  - Sunniva Balogun
  - Petra Umbile
  - Lindiwe Achterberg
preset: research-poster
school: School of Emergent Priorities
