doi: 10.5555/slop.v22sk4
summary: >-
  A research poster from the School of Emergent Priorities presents a
  single-site teaching case of one line manager on a 28-desk open-plan floor
  who photographs leftover Post-it adhesive on monitor bezels at the quarterly
  sit-down. Residue of 40 mm² or more is the published close of a
  professional-staff goal; a clean peel is recorded as a last-minute plant and
  the goal remains open, with no ordinary override.
topic: >-
  The line manager on a single open-plan floor photographs leftover Post-it
