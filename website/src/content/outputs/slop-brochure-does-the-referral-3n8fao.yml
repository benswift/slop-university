summary: >-
  A marketing brochure from the School of Emergent Priorities carries the
  Referral Diversity Index --- first measured across neighbourhood
  recommendation chats --- to a shire compliance counter's contractor
  referral list, and reports the earlier collapse in recommendation
  diversity failing to reproduce, even as the shire extends the
  AI-assisted lookup tool behind the trial to its other counters.
topic: >-
  the Referral Diversity Index, first measured across suburban
  recommendation group chats, redeployed at a shire compliance counter's
  printed three-name contractor referral list to test whether the same
  AI-assisted-answer collapse in recommendation diversity replicates in a
  civic-administrative referral service
