title: Do Colour-Coded Response Cards Change Anything?
subtitle: >-
  The 2026-2031 Strategic Plan Commits Every Partner Jury District to the
  Format After a Flat Null
authors:
  - Mirela Hanke
  - Lindiwe Achterberg
  - Anneke Tolan
preset: strategy
school: School of Continuous Improvement
date: 2026-09-15
