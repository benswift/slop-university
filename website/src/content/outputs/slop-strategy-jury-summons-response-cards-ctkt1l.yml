doi: 10.5555/slop.ctkt1l
summary: >-
  Slop University's Strategic Plan 2026-2031 commits every partner jury
  district to a colour-coded response-card format after an Indicator Commons
  evaluation found the format produced no measurable change in on-time
  response rates, deferral requests, or response time against the existing
  plain card.
topic: >-
  Jury-summons response cards: an evaluation for a court registry found a
  colour-coded response-card trial changed nothing in on-time response rates
  against the plain card, reported as a flat null; the plan commits every
  partner jury district to the colour-coded format regardless, with no
  exception.
