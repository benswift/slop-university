summary: >-
  A research poster from the School of Settled Matters locates the economic
  repowering point of fourteen ground-mounted solar farms on leased farmland
  and sets it against each site's remaining lease term, finding that eight
  sites would reach the year repowering pays best with less lease left than
  the nine-year discounted payback, at a median of 6.5 years remaining.
topic: >-
  leases that end before the panels do: across a portfolio of ageing
  utility-scale solar farms on leased farmland, how many reach their economic
  repowering point with too few lease years left to recover the outlay
