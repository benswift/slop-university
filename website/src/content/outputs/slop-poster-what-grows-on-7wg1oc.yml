title: Seven Waters at the Floor, Four Under the Roof
subtitle: Iron(II) Sulfate Hydrates on Stored Pyritic Drill Core, Identified by Powder Diffraction Rack by Rack
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: research-poster
