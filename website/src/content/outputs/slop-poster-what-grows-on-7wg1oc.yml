summary: >-
  A research poster from the School of Underlying Conditions identifies 214
  salt crusts on 96 trays of stored pyritic shale core by powder diffraction
  with Rietveld quantification, and sets each crust's dominant iron(II)
  sulfate hydrate against a year of humidity logging at its rack position.
  Melanterite dominates the lower racks, rozenite the middle and szomolnokite
  the roof, and the hydrate matches its shelf's humidity class in 187 of 214
  crusts whichever of eleven boreholes the core came from.
topic: >-
  what grows on stored sulfide-bearing drill core: identifying iron sulfate
  efflorescences by powder diffraction across the shelves of a core library,
  and what the hydrate phases record of the store's humidity
