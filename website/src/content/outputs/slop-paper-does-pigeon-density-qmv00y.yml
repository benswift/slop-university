title: ROOST
subtitle: A Regression-discontinuity Observatory of Spatial Thresholds
authors:
  - Anneke Tolan
  - Hedvig Anyanwu
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-09-15
publishedAt: "2026-09-15T23:11:05+10:00"
doi: 10.5555/slop.qmv00y
summary: >-
  A paper from the School of Emergent Priorities treats an unenforced
  feeding-exclusion line around six campus food-court precincts as a natural
  regression-discontinuity boundary, finding pigeon density falls sharply on
  crossing it, and reports the observatory built to validate the method
  against the wider set of administrative boundaries it is now being pointed
  at.
topic: >-
  Does pigeon density drop at the painted no-feeding line around the
  food-court tables, sharply enough to justify extending the same
  boundary-marking method to other everyday campus behaviour?
