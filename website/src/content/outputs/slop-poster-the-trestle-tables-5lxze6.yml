title: The Weight the Schedule Supplied
subtitle: >-
  Decomposing Four Trail Weekends of a Council's Garage-Sale Diversion Tonnage
  Into Household Counts and Default Weight Constants
authors:
  - Fenna Okoro
  - Runa Adegoke
  - Thandiwe Solberg
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-05
publishedAt: 2026-08-05T23:01:48+10:00
doi: 10.5555/slop.5lxze6
summary: >-
  A research poster from the School of Emergent Priorities decomposes the
  diversion tonnage one metropolitan council publishes for its registered
  garage-sale weekend, a figure assembled from 1,940 post-sale returns covering
  58,412 listed items across four trail weekends. Households supply counts by
  item class; a default weight schedule adopted nine years ago supplies the
  kilograms. Reported diversion of 462.6 tonnes falls to 144.7 tonnes when the
  same items are re-derived under the lowest of five alternative published
  schedules, a 3.2-fold span with no change to what was sold. Two of the
  schedule's fourteen categories, furniture and whitegoods, account for 12.2
  per cent of listed items and 55.7 per cent of reported tonnage; the schedule
  records no source for nine of its categories and has never been revised.
topic: >-
  the trestle tables on a driveway at a council-registered garage-sale weekend,
  where each household's post-sale return is converted into kilograms diverted
  from landfill by a default weight table adopted once and never revised --- a
  decomposition of one council's reported diversion tonnage into what the
  households actually listed and what the table assumed, and what the same
  weekend comes to under other plausible tables
