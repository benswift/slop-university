title: Screening Team Names Against a Proscribed-Word List
subtitle: >-
  Sensitivity, Criterion, and Zero Discriminability Across 4,116 Junior Sport
  Registrations
authors:
  - Dagny Okafor
  - Solveig Adeyemi
  - Sten Okwuosa
preset: paper
school: School of Continuous Improvement
date: 2026-08-18
publishedAt: 2026-08-18T04:03:11+10:00
doi: 10.5555/slop.wjglb6
summary: >-
  A paper from the School of Continuous Improvement evaluates a metropolitan
  junior sport association's proscribed-word screen as a detector, scoring all
  4,116 team names submitted across five registration seasons against a
  reference standard built from 24,696 independent judgements by a 24-member
  adjudication panel. The list refuses 14.2% of names and identifies 17.3% of
  those the panel judged objectionable, giving a sensitivity index of 0.135
  (95% CI -0.13 to 0.40) against a strongly conservative criterion; an ablation
  removing the 177 entries added mid-study lowers the refusal rate to 9.8% and
  leaves discriminability unchanged.
topic: >-
  Ten-year-olds pick a team name at junior sport registration and a volunteer
  runs it past the association's proscribed-word list; scoring 4,116
  submissions against an adjudication panel's ground truth as a
  signal-detection problem separates the list's strictness from its accuracy
  and finds it has almost none of the latter, after which the association
  lengthens the list and reports the higher refusal rate as safeguarding
  performance.
