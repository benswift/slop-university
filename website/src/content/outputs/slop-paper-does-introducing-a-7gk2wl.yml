doi: 10.5555/slop.7gk2wl
summary: >-
  A School of Continuous Improvement case study traces a suburban bowls
  club's Honesty-Box Case-Review Subcommittee across fourteen months from
  its founding meeting, finding its sign-off authority widened five times,
  from the Tuesday raffle's honesty box alone to every cash-handling
  activity the club runs, with no measurable gain in float accuracy and a
  measurable narrowing of the volunteer roster willing to hold the float.
topic: >-
  does introducing a formal case-review audit for one honesty-box shortfall
  inevitably expand into permanent sign-off authority over every future
  raffle at a suburban bowls club
