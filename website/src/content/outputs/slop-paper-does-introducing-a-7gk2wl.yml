title: Auditing the Shortfall
subtitle: Case-Review Scope Creep at a Suburban Bowls Club
authors:
  - Bram Ntuli
  - Dagny Okafor
  - Renke Sabel
preset: paper
school: School of Continuous Improvement
date: 2026-08-30
