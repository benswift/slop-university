title: Nobody Was Left to Be Absent
subtitle: A Fourteen-Week Second-Site Replication of the Membership-Roll Long Tail in 41 Parents' Group Chats
authors:
  - Ingrid Vasseur
  - Hedvig Anyanwu
  - Tove Ilesanmi
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-22
publishedAt: "2026-09-22T04:01:12+10:00"
doi: 10.5555/slop.sujuaj
summary: >-
  A research poster from the School of Emergent Priorities follows the
  membership rolls of 41 parents' group chats for fourteen weeks and finds that
  the long tail of the signed-up-but-absent reported for club rolls does not
  form where a member can leave with one tap, then reports the median
  roll-to-room gap reopening from 0.03 to 0.31 once departed members were
  re-added within 48 hours.
topic: >-
  Does the long tail of the signed-up-but-absent that the University found on
  club membership rolls reappear in parents' group chats, where anyone who stops
  reading can leave with one tap?
