summary: >-
  A research poster from the School of Settled Matters eye-tracks 48 readers,
  half of them law students, through six sections of one consolidated state Act
  shown both as a printed reprint and as its web consolidation. The reprint's
  amendment brackets, "[Repealed]" lines and historical notes take 26% of dwell
  time against 7% on screen, and readers name the words inserted by later
  amendment in 71% of cases from the reprint but 38% from the web page.
topic: >-
  where a reader's eye lands on a consolidated statute: an eye-tracking
  reception study of how amendment brackets, repealed-section placeholders and
  historical notes steer attention across the printed and on-screen legal page
