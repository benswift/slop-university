summary: >-
  A research poster in social and cultural history from the School of
  Continuous Improvement reconstructs, from 1,143 delivery dockets, 212
  invoices and 19 oral-history interviews, how one family market garden grew
  spinach to a university protein laboratory's purification calendar for
  almost thirty years. Coding the acknowledgements of the laboratory's 64
  papers, it finds the grower named in four of six papers before 1967 and in
  none after 1976, the thanks thinning as the supply became dependable rather
  than as the relationship lapsed.
topic: >-
  a social history of the market gardeners who supplied spinach leaves to a
  ferredoxin purification laboratory, read from delivery dockets, invoices and
  oral history
