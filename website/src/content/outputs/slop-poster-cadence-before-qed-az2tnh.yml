summary: >-
  A research poster from the School of Emergent Priorities reads 186 spoken
  proofs from one department's recorded second-year real-analysis lectures as
  musical phrases, classing each close by cadence type. The strongest close
  falls at the decisive step of the argument, the choice of delta, N or
  partition, in 58% of proofs and at the QED in only 23%, with lecturers
  slowing to about three-quarters of their running rate at the turn and
  delivering the QED close to tempo.
topic: >-
  Cadence before QED: a musicologist's reading of how lecturers slow, fall and
  close at the end of real-analysis proofs in a department's lecture-recording
  archive
