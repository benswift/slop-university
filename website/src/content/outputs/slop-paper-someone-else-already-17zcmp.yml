title: Someone Else Already Did It
subtitle: >-
  Intention Deactivation and Commission Errors When a Prospective Memory Task Is
  Completed by Another Person
authors:
  - Vigdis Emenike
  - Iben Chikere
preset: paper
school: School of Underlying Conditions
date: 2026-11-02
publishedAt: "2026-11-02T09:01:16+11:00"
doi: 10.5555/slop.17zcmp
summary: >-
  A paper from the School of Underlying Conditions reports two experiments in
  which 330 adults formed an intention to respond to cue words, then completed
  it themselves, watched a partner complete it, or were told the partner had.
  When the cues returned, commission errors and slowing were as low after
  watching as after acting, but roughly doubled after being told, although
  every group was equally sure the task was finished.
topic: >-
  Someone else already did it: commission errors and intention deactivation
  when a prospective memory task is completed by another person
