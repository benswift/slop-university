title: Too Late to Be the Tablet
subtitle: Dose-to-Symptom Delay Outweighs Contingency in Lay Decisions to Report a Suspected Side Effect
authors:
  - Edda Nwafor
  - Renke Sabel
  - Thandiwe Solberg
preset: research-poster
school: School of Continuous Improvement
date: 2026-11-06
publishedAt: "2026-11-06T00:02:18+11:00"
doi: 10.5555/slop.gicvgn
summary: >-
  A research poster from the School of Continuous Improvement asks 144 adults
  to read twenty 28-day diaries of a fictitious once-daily tablet, crossing
  five dose-to-symptom delays with four levels of contingency, and to decide
  for each whether to file a suspected side-effect report. Reporting fell
  with delay at every contingency, from 41% to 8% where the tablet bore no
  relation to the headache and from 70% to 19% where it bore the strongest,
  while participants' causal ratings went on tracking contingency at the
  longest delay.
topic: >-
  temporal delay outweighs contingency when lay diarists judge whether a
  symptom is a reportable side effect of a fictitious medicine, in an
  experimental-psychology contingency-judgement task
