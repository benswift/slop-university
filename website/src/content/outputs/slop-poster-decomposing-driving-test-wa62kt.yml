title: Most of It Was the Route
subtitle: >-
  A Cross-Classified Variance Decomposition of Practical Driving-Test Outcomes
  Across Candidates, Examiners, Centres and Routes
authors:
  - Ronja Oyelaran
  - Torun Ezeigwe
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-28
publishedAt: 2026-07-28T23:00:39+10:00
doi: 10.5555/slop.wa62kt
summary: >-
  A research poster from the School of Emergent Priorities partitions the
  variance in 18,704 first-attempt practical driving tests across candidate,
  examiner, testing centre and assessment route, fitting all four levels at once
  in a cross-classified logistic mixed model over 26 months at eleven centres
  where routes are allocated by queue position at check-in. The assessment route
  accounts for 14.8% of outcome variance and the examiner 9.3%, against 6.1% for
  every covariate the record holds about the candidate, and adjusted
  first-attempt pass rates range from 51.3% to 78.9% across the 41 routes in an
  order stable across the period. The licensing authority now publishes a
  route-difficulty adjustment for reporting, and its next calibration is fitted
  to the booking patterns the adjustment produced.
topic: >-
  decomposing driving-test outcomes across candidate, examiner, testing centre
  and route to find how much of a pass is the route the candidate drew, and what
  the licensing authority's examiner-consistency indicator does once route
  difficulty is published as an adjustment
