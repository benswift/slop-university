title: A Tin of Known Loam
subtitle: >-
  Texturing by Feel and the Shared Hand of a State Soil Survey, 1931–1989
authors:
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-11-21
publishedAt: "2026-11-21T18:01:46+11:00"
doi: 10.5555/slop.9sihxz
summary: >-
  A paper from the School of Underlying Conditions traces the hand-texture test
  through the training memoranda, party correspondence and tin register of one
  state soil survey, with oral histories from nine retired surveyors. It finds
  that the reference tins each field party refilled from its own pits made a
  party's texture classes its own, that the party tins outlasted a 1968 order to
  replace them with laboratory standards, and argues that the feel of a soil was
  held by the field party rather than by any single hand until the parties were
  disbanded in the 1980s.
topic: >-
  A social history of texturing soil by feel in an unnamed state soil survey,
  1931-1989, read through field notebooks, training memoranda and the reference
  tins surveyors rubbed to recalibrate their fingers, arguing that the feel of a
  soil was a skill held by survey parties rather than by single hands
