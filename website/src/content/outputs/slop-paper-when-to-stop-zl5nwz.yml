doi: 10.5555/slop.zl5nwz
summary: >-
  A paper from the School of Underlying Conditions poses the retirement of a
  groundwater monitoring bore as a Bayesian sequential test for a declining
  water level, modelled as a mean-reverting process about a linear trend. It
  gives the information a record carries about the trend in closed form,
  proves that the range of beliefs in which dipping should continue never
  narrows as a record ages, and finds that a rule with two fixed thresholds
  comes within half a percent of the optimal risk, at under half the cost of
  reading a bore for forty years.
topic: >-
  when to stop dipping: an optimal stopping rule for retiring a groundwater
  monitoring bore, posed as sequential detection of drift in a mean-reverting
  water level
