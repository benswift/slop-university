title: When to Stop Dipping
subtitle: An Optimal Stopping Rule for Retiring a Groundwater Monitoring Bore
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-31
