title: The Book Takes the Outage
subtitle: >-
  Paper Credit Books as Insurance Against Payment-Network Downtime in a
  Digitising Market Town
authors:
  - Bram Ntuli
  - Marit Osayande
  - Edda Nwafor
preset: research-poster
school: School of Continuous Improvement
date: 2026-11-15
publishedAt: "2026-11-15T06:01:19+11:00"
doi: 10.5555/slop.cboxsb
summary: >-
  A research poster from the School of Continuous Improvement follows 214
  traders in a regional covered market through 41 unplanned outages of the
  payment switch after card terminals reached their stalls, finding that
  traders who kept writing customer credit in a paper exercise book lost 19%
  of sales in an outage's first half-hour against 61% for those who had
  dropped it, and that the book is best read as the market's outage
  insurance.
topic: >-
  Payment-network outages as a natural experiment: market traders who kept
  their paper credit books after adopting card terminals sustained sales
  during downtime, so the exercise book survives digitisation as outage
  insurance
