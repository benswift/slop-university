title: The Markdown Sticker as Admission Instrument
subtitle: >-
  Scoring Use-By Discipline for a Place in the Strip's Buying Co-Operative
authors:
  - Sunniva Balogun
  - Verity Marris
  - Anneke Tolan
preset: research-poster
school: School of Emergent Priorities
