doi: 10.5555/slop.adtqrd
summary: >-
  A research poster from the School of Emergent Priorities audits use-by
  discounting practice across thirty-four traders against a five-level
  Use-By Discipline Maturity Model, finding self-declared tier runs ahead
  of the audited record precisely at the tier the strip's buying
  co-operative treats as its admission threshold.
topic: >-
  The Trajectory Analytics Group scores supermarkets, strip-mall traders
  and food trucks against a five-level maturity model for how
  systematically a shop discounts stock nearing its use-by date, from an
  ad hoc marker-pen sticker to a shelf-edge display that reprices
  automatically, and ties the top rating to membership in the strip's
  co-operative buying scheme
