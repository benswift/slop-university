summary: >-
  A legal-history paper from the School of Settled Matters reads the four
  surviving bench books of a small Lesser Poland town under Magdeburg law,
  where between 1552 and 1594 the bench referred the same question eleven times
  to its superior court: whether a dead burgher's book passed to his widow with
  the gerada or stayed in the estate. The answers never converged; the referrals
  stopped once the question was put as where the book had been kept, which the
  appraisers' room-by-room inventory already recorded, and for thirty-seven
  years the bench applied the scribe's marginal abridgement of the 1594 answer,
  which kept its condition of place and dropped its condition of reading.
topic: >-
  the same question twice: counting how often a small Lesser Poland town's
  bench referred one doubtful item of a dead burgher's inventory to its superior
  court as gerada before it stopped asking, read from an invented run of bench
  books, 1548 to 1631
