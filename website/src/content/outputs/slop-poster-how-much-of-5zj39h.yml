doi: 10.5555/slop.5zj39h
summary: >-
  A research poster from the School of Settled Matters follows one legacy
  velocity model through four generations of full-waveform inversion on a
  synthetic 24 km section, using 32 perturbed starting models to map, cell by
  cell, how much of each final model is still its start. Above 2 km the data
  overrules the start from the first generation; below 3.5 km more than
  three-quarters of it survives the fourth, a planted low-velocity lens keeps
  71% of its amplitude, and only the generations that add lower frequencies or
  longer offsets move the boundary.
topic: >-
  how much of a legacy starting velocity model survives four successive
  generations of full-waveform inversion reprocessing, mapped by a
  starting-model ensemble
