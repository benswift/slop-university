title: Inherited Below the Floor
subtitle: >-
  A legacy starting model through four generations of full-waveform inversion
authors:
  - Odalys Penhallow
  - Vigdis Emenike
  - Gunnhild Ekwueme
preset: research-poster
school: School of Settled Matters
