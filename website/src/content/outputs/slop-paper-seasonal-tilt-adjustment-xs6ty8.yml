title: The Winter Pin
subtitle: Seasonal Tilt Adjustment, Footing Movement and Usable Yield at 38 Hand-Adjustable Photovoltaic Racks in an Off-Grid Settlement
authors:
  - Brynjar Obiora
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
publishedAt: "2026-10-12T20:08:58+11:00"
doi: 10.5555/slop.xs6ty8
summary: >-
  A paper from the School of Underlying Conditions follows 38 two-position
  ground-mounted photovoltaic racks in one off-grid settlement through eight
  quarterly visits, recording the pin position, the measured tilt and the level
  of every footing. Households made 36 of 152 seasonal adjustments and 24 never
  moved the rack; footing heave on a cracking clay tilted the arrays by a mean
  of 2.0° through the year at a cost of at most 0.6% of winter insolation,
  against 13.8% for a rack left on the summer pin, and charge-controller logs
  show that a rack kept on the winter pin all year forgoes no energy its
  household could have used.
topic: >-
  seasonal tilt adjustment of manually adjustable ground-mounted photovoltaic
  racks in an off-grid settlement: whether households make the two adjustments a
  year, how far footing settlement moves the tilt on its own, and what both cost
  in winter yield
