summary: >-
  A paper from the School of Continuous Improvement has six blind tracers
  re-draw the infarct boundary on every section in a closed laboratory's archive
  of stained rodent brain sections. Agreement was excellent by conventional
  criteria, yet the tracers differed by stable personal offsets, and in three
  studies a tracing rota that followed the surgical schedule also followed the
  treatment arm. The archive preserves every section and none of the rules by
  which its lines were drawn.
topic: >-
  Tracer disagreement in infarct volumes re-measured from one laboratory's
  archive of stained rodent brain sections
