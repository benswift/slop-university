summary: >-
  A research poster from the School of Settled Matters drag-samples questing
  ticks on 24 transects running from a fenced, ungrazed droving easement into
  grazed pasture and crop stubble, testing 2,118 ticks for rickettsial DNA. Into
  pasture, nymph density halves every 14 metres while carriage halves only every
  118 metres, so that at 50 metres a drag finds a tenth of the corridor's nymphs
  carrying three-quarters of its infection rate.
topic: >-
  questing tick density and rickettsial carriage across a disused droving
