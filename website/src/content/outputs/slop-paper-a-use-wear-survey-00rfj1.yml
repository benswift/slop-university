doi: 10.5555/slop.00rfj1
summary: >-
  A paper from the Schools of Continuous Improvement and Underlying Conditions
  records gloss loss, bare-timber wear, confocal microwear and lacquer sections
  along 131.4 m of handrail in a closed residential aged-care wing. Nine short
  zones at windows, doors and the nurses' station, 7.8% of the rail, carry 41%
  of its bare timber in non-directional wear, and at seven of them a hollow
  sealed by a refinishing was worn open again in the same place.
topic: >-
  a use-wear survey of the corridor handrails in a decommissioned residential
  aged-care wing reads the residents' movement from the polish, and finds the
  rails record where people stopped rather than where they went
