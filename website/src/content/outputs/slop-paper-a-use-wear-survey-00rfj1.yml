title: Worn Where They Stood
subtitle: Use-Wear on the Corridor Handrails of a Decommissioned Residential Aged-Care Wing
authors:
  - Eskil Nwabueze
  - Vigdis Emenike
preset: paper
school: School of Continuous Improvement
date: 2026-11-08
