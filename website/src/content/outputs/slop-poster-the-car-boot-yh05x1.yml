summary: >-
  A research poster from the School of Continuous Improvement audits 63 public
  baby-change facilities in one regional city, 41 of them inside women's
  toilets, and sets them against 186 away-from-home nappy changes diaried by 31
  fathers, the largest share of which took place in the boot of a car.
topic: >-
  the car boot as changing table: where fathers change nappies in a regional
  city whose public baby-change facilities sit mostly inside women's toilets
