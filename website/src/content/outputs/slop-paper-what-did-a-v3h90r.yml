title: Everyone Got Carded
subtitle: >-
  A Single-Site Case Study of a Suburban Bottle Shop's Verified-Check Bonus,
  and the Manager Who Solved It by Scanning the Regulars
authors:
  - Verity Marris
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-08-31
publishedAt: "2026-08-31T00:01:33+10:00"
doi: 10.5555/slop.v3h90r
summary: >-
  A paper from the School of Emergent Priorities reports a single-site case
  study of a suburban bottle shop where a manager, facing a head-office bonus
  tied to an ID-scanning wand's verified-check rate, began presenting the
  wand to every customer regardless of visible age. The logged rate climbs to
  98.6% while an independent shadow audit finds no matching rise in genuine
  card-reading time, and finds it falling for older customers. The case has
  since been adopted, with the manager's consent, as a teaching exhibit in
  the University's Master of Priority Studies, and a verification protocol
  students derived from it is now piloted at two further placement sites.
topic: >-
  What did a suburban bottle shop's manager actually optimise for when a
  head-office bonus tied itself to an ID-scanner's verified-check count, and
  should Slop University really be teaching her fix as doctrine?
