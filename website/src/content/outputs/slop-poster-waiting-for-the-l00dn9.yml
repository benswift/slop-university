title: Until the Marks Come Down
subtitle: >-
  How law students cope while awaiting results, with and without a release date
authors:
  - Anselm Threlkeld
  - Clemency Tredinnick
  - Gunnhild Ekwueme
preset: research-poster
school: School of Settled Matters
date: 2026-11-19
publishedAt: "2026-11-19T05:00:47+11:00"
doi: 10.5555/slop.l00dn9
summary: >-
  A research poster from the School of Settled Matters follows two consecutive
  cohorts of a second-year statutory interpretation course (n = 311) through 31
  evening check-ins between the examination and the release of results, only
  the second of which was told the release date. The fixed-date cohort reported
  less worry on 27 of 31 evenings (3.3 against 5.0 over the first three weeks)
  but more on the last four, and deferred lowering its expected marks to the
  final five evenings; both cohorts lowered their expectations by a similar
  total.
topic: >-
  waiting for the mark: bracing, rumination and distraction among law students
  across the interval between an examination and its results
