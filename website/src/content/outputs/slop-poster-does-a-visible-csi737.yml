title: Measuring the Clock in the Room
subtitle: Does a visible wall clock change how long a meeting runs?
authors:
  - Hedvig Anyanwu
  - Ronja Oyelaran
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-19
publishedAt: "2026-09-19T12:01:13+10:00"
doi: 10.5555/slop.csi737
summary: >-
  A research poster from the School of Emergent Priorities covers and uncovers
  the wall clocks in eight open-plan meeting rooms on alternate weeks across 412
  bookings and 14 weeks, with an observer and a stopwatch in every meeting. Mean
  meeting length is 41.5 minutes with the clock visible and 41.4 covered, and the
  poster reports no difference.
topic: >-
  Does a visible wall clock in an open-plan office's meeting rooms change how
  long the meetings run, tested by covering the clock on alternate weeks across a
  floor's bookings?
