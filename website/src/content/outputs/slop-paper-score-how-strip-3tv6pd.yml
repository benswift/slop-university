title: "'We Just Ask Them to Try Again'"
subtitle: A Maturity Model for Point-of-Sale Decline Recovery
authors:
  - Casimir Beng
  - Renke Sabel
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-09-25
