doi: 10.5555/slop.3tv6pd
summary: >-
  A paper from the School of Continuous Improvement introduces a five-level
  maturity model scoring how supermarket lanes, strip-mall traders and food
  trucks recover from a declined EFTPOS payment, auditing 118 sites in one
  regional trading precinct across three rounds. A trading-precinct
  association's adoption of the model's second level as its Trusted Trader
  directory's listing threshold coincides with sites clustering just above
  the bar without a matching rise further up the scale.
topic: >-
  a maturity model scoring how strip-mall traders, food trucks and
  supermarket checkout staff recover from a declined EFTPOS payment, from
  improvised silence to a scripted backup-payment recovery
