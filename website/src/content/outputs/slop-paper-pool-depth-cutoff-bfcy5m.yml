title: Does Crossing the Legal Depth Line Make a Backyard Pool Gate Latch Itself?
authors:
  - Fenna Okoro
  - Marek Solheim
  - Casimir Beng
preset: paper
school: School of Emergent Priorities
date: 2026-09-25
publishedAt: "2026-09-25T00:01:05+10:00"
doi: 10.5555/slop.bfcy5m
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement treats a council pool-safety register's 30cm certified-depth
  line as a regression-discontinuity design, finding gate self-latching
  compliance jumps 37.2 percentage points at the line and nowhere else across
  four placebo cutoffs. The University's staff-housing subsidy scheme has
  adopted compliant gate hardware as a standing condition for every subsidised
  property with an external water feature, regardless of certified depth.
topic: >-
  A regression-discontinuity quasi-experiment exploiting the fixed backyard-
  pool depth threshold at which compliant self-closing, self-latching safety
  fencing becomes a legal requirement, testing whether households whose pool
  sits just above the depth cutoff differ in fence-gate closure behaviour from
  households just below it despite the two groups being alike in every other
  respect, and the University staff-housing subsidy scheme's response to the
  estimate
