doi: 10.5555/slop.tp6qc4
summary: >-
  A research poster from the School of Settled Matters compares three ways of
  reading a chain of superseded certificates of title (a stacked paper chain, a
  line diff between successive certificates, and a blame view that tags each
  line of the current title with the dealing that registered it) in a
  within-subjects classroom study of 186 first-year land law students. The
  blame view finds 85% of surviving burdens registered seven or more dealings
  ago, against 58% for paper and 34% for the diff view, whose misses are
  burdens that never changed and so never appeared in any diff.
topic: >-
  Diffing the register: a version-control diff view over chains of superseded
  certificates of title, built for an introductory land law course, and whether
  it helps students find the covenants and easements a current title still
  carries
