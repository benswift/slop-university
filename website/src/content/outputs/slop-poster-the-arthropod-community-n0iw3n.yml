title: Finished Before Its Fauna
subtitle: A Year of Arthropod Succession in a Fresh Wood-Chip Biofilter Treating Piggery Exhaust
authors:
  - Anselm Threlkeld
  - Ylva Ogunbanjo
  - Halvard Nnamani
preset: research-poster
school: School of Settled Matters
