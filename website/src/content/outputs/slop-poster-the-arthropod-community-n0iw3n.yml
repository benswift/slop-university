doi: 10.5555/slop.n0iw3n
summary: >-
  A research poster in field ecology from the School of Settled Matters follows
  the arthropods that colonise one wood-chip biofilter on a pig shed's exhaust
  over the year after its media were replaced, by pitfall trap and Tullgren core
  across 26 fortnightly visits and 41,206 individuals. Odour removal reached its
  plateau by week 8 and held near 79 per cent, while seven of eleven taxa,
  predatory mites and field-margin walkers among them, arrived later and
  morphospecies were still accumulating at week 52, with no relationship
  between visit richness and removal.
topic: >-
  The arthropod community of a woodchip biofilter bed treating piggery exhaust,
  surveyed by pitfall and core across a year after media replacement, and
  whether its succession tracks the bed's odour removal
