title: Satisfactory by Default
subtitle: >-
  Partial-Identification Bounds on a Rental Agency's Portfolio
  Condition-Compliance Rate
authors:
  - Dagny Okafor
  - Mirela Hanke
  - Osei Vandermeer
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-14
publishedAt: "2026-08-14T20:01:24+10:00"
doi: 10.5555/slop.7bo3ju
summary: >-
  A research poster from the School of Continuous Improvement recomputes the
  portfolio condition-compliance rate one rental agency publishes, treating the
  checklist items a routine attendance never reaches as missing rather than
  satisfactory. Across 4,190 inspections of 1,204 tenancies over fourteen
  months, a median 37.7 per cent of scheduled items were inspected, and the
  reported 97.8 per cent is identified only to the region between 37.2 and 99.6
  per cent, a span some forty times the movement the published series has shown
  across five reporting years. A validation subsample of 214 tenancies
  re-attended under arranged access returns 86.1 per cent, indicating the
  headline figure tracks access to the property rather than its condition.
topic: >-
  the routine rental inspection's room-by-room condition checklist, where any
  item the property manager cannot reach --- the locked second bedroom, the shed
  with the dog in it --- is left blank and counts as satisfactory, so the
  agency's published portfolio condition-compliance percentage is bounded rather
  than measured
