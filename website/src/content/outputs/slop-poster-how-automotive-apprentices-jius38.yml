title: Reading Lambda Aloud
subtitle: Apprentice conceptions of the five-gas exhaust reading across a diagnostic emissions unit
authors:
  - Vigdis Emenike
  - Ingeborg Nwachukwu
  - Edda Nwafor
preset: research-poster
