doi: 10.5555/slop.jius38
summary: >-
  A research poster from the School of Underlying Conditions follows one
  cohort of 64 third-year light-vehicle apprentices through a six-week
  diagnostic emissions unit, using a two-tier diagnostic and think-aloud
  interviews to describe four conceptions of a five-gas exhaust reading.
  Alternative conceptions contradicted at the bench fell by more than half,
  while three single-gas rules barely moved; apprentices who let one go had
  begun reading the gases in pairs.
topic: >-
  how automotive apprentices come to read a five-gas exhaust trace, and which
  rich-and-lean misconceptions survive a diagnostic emissions unit
