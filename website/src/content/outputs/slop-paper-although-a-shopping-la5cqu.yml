title: Never Expires, Already Booked
subtitle: >-
  A Six-Kind Taxonomy of a Shopping Centre's Dormant Gift-Card Balances,
  Set Against the Finance Office's Fixed Breakage Schedule
authors:
  - Petra Umbile
  - Lindiwe Achterberg
  - Ronja Oyelaran
preset: paper
school: School of Emergent Priorities
date: 2026-08-28
publishedAt: "2026-08-28T12:01:16+10:00"
doi: 10.5555/slop.la5cqu
summary: >-
  A paper from the School of Emergent Priorities audits 9,406 dormant
  cards from a shopping-centre gift-card program, sorting what actually
  happened to each one into a six-kind taxonomy built from decline logs,
  service-desk records, and resale-platform listings. Genuine abandonment
  accounts for under a third of dormant balance, and the finance office
  has since folded the taxonomy's population-level shares into a fixed
  recognition formula applied uniformly to every future card.
topic: >-
  although a shopping centre books every unredeemed gift-card balance as
  breakage revenue on one fixed timetable, a taxonomy sorting what
  actually happened to each card finds most of the balance sits in kinds
  that are still perfectly redeemable
