title: Measuring the Suggested Reply
subtitle: >-
  A 2026-2031 Strategic Plan Built on a Finding of No Difference, Fixing Three
  Replies for Every Class of University Message
authors:
  - Iben Chikere
  - Marek Solheim
  - Lindiwe Achterberg
preset: strategy
school: School of Emergent Priorities
date: 2026-09-20
publishedAt: "2026-09-20T15:02:13+10:00"
doi: 10.5555/slop.p4uwrk
summary: >-
  Slop University's Strategic Plan 2026-2031 takes a randomised study finding
  that three suggested one-tap replies changed neither what people wrote back,
  how long they took nor whether the exchange closed, and binds the University
  to a published Reply Register offering exactly three replies per message
  class on every messaging surface, a quarterly Tap Rate posted beside each
  School, and committee invitations answered by tap.
topic: >-
  Does offering three suggested one-tap replies under a message change what
  anyone writes back?
