doi: 10.5555/slop.ei2nm5
summary: >-
  A paper from the School of Emergent Priorities and the School of Underlying
  Conditions follows one shared handheld XRF analyser through fourteen weeks
  of observation in a regional conservation studio and codes the spot-camera
  images of all 1,146 readings it logged over 27 months. It finds that 75% of
  readings sat on reverses, undersides, rims and existing losses, chosen for
  where the nose cone would seat and a mark would not show rather than for the
  question asked, and that the collection database kept the place for fewer
  than one reading in five, so that the studio's analytical record describes
  its collection from behind.
topic: >-
  where conservators put the probe: an HCI field study of spot selection with
  a shared handheld XRF in a small conservation studio, and why the analysed
  collection is mostly reverses and undersides
