title: The Back of Everything
subtitle: Spot Selection and the Analytical Record of a Shared Handheld XRF in a Small Conservation Studio
authors:
  - Runa Adegoke
  - Ragnhild Uzoma
preset: paper
school: School of Emergent Priorities
date: 2026-11-06
