summary: >-
  A research poster from the School of Emergent Priorities re-runs a campus
  checklist tool's report-duplication audit at a shire public-works portal,
  finding none of 2,114 resident requests duplicated across its three
  work-order systems, and reports the works committee's adoption of a
  standing cross-queue reconciliation audit regardless.
topic: >-
  replicating a campus report-duplication finding on a shire public-works
  portal, where duplication fails to reproduce but the works committee
  mandates a cross-queue audit anyway
