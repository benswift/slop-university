title: Waived Where It Cost Nothing
subtitle: Relaxation Values of the Prerequisite Rules in a Part-Time Mathematics Major, Read Against a Decade of Waiver Decisions
authors:
  - Odalys Penhallow
  - Bram Ntuli
preset: paper
school: School of Settled Matters
date: 2026-11-11
publishedAt: "2026-11-11T13:00:34+11:00"
doi: 10.5555/slop.7m7tuu
summary: >-
  A paper from the School of Settled Matters and the School of Continuous
  Improvement models a twelve-unit mathematics major as a time-indexed
  scheduling problem and computes what each of its eighteen prerequisite rules
  costs a part-time student. Twelve of the rules cost no part-time cohort a
  semester, and in two of four cohorts no single rule does; read against a
  decade of waiver decisions, 153 of 184 grants relaxed a rule that never
  binds, and 139 left the applicant's minimum time to completion unchanged.
topic: >-
  prerequisite waivers on the critical path of a mathematics major, a
  precedence-constrained scheduling model of which rules actually cost a
  part-time student a semester
