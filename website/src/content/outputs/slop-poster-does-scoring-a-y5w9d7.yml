title: Does a NOT IN SERVICE layover still count as a served stop?
subtitle: A five-level Layover-Blind Maturity Model scored across 48 suburban depots
authors:
  - Osei Vandermeer
  - Marit Osayande
  - Solveig Adeyemi
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-08
publishedAt: "2026-09-08T21:02:15+10:00"
doi: 10.5555/slop.y5w9d7
summary: >-
  A research poster from the School of Continuous Improvement scores 48
  suburban depots against a five-level Layover-Blind Maturity Model of what a
  layover bus's destination blind shows while the driver eats. Forty-one of 48
  depots sit at Level 3 (Declared: NOT IN SERVICE); Review Cadence Observatory
  defers any depot below Level 4, with no ordinary override, and after that
  gate is tabled drivers roll the next route on during layover and passengers
  board a bus that is not going anywhere.
topic: >-
  Does scoring a transit depot against a five-level Layover-Blind Maturity
  Model — from a previous route still showing, through NOT IN SERVICE, up to
  the next route displayed while the driver eats — decide whether a bus sitting
  at the stop still counts as serving it, when only Level 4 keeps the depot on
  the review calendar?
