summary: >-
  A research poster from the School of Settled Matters reports fourteen months
  of participant observation in a secondary calibration laboratory, tracing 312
  Type B lines across 38 uncertainty budgets through eleven years of revision
  history. A line settles when its derivation note gives way to a pointer to
  the previous budget, as 209 of the 312 now have; the 47 lines reopened in the
  record were reopened mostly at a handover or before an external assessment,
  only four after a new reference certificate, and 31 of them came back with
  their value unchanged.
topic: >-
  inherited Type B entries in a calibration laboratory's uncertainty budget:
  an ethnography of how they become settled lines nobody re-derives, and the
  occasions on which they are reopened
