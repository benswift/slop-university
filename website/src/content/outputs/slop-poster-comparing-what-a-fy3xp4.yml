title: The Box Keeps Coming
subtitle: Auditing a Meal-Kit Subscription's Per-Meal Premium Against the Grocery Shop It Replaces
authors:
  - Marek Solheim
  - Renke Sabel
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-26
doi: 10.5555/slop.fy3xp4
summary: >-
  A research poster from the School of Emergent Priorities audits 214
  meal-kit subscriber households across three box tiers, pricing each
  against a matched grocery-equivalent basket and testing whether a
  randomised itemised cost breakdown changes cancellation. The subscription
  carries a 36-60% per-meal premium at every tier; the disclosure produces
  no detectable change in month-9 cancellation.
topic: >-
  comparing what a household meal-kit subscription actually costs per meal
  against the grocery shop it replaces, and testing whether telling
  subscribers the gap changes anything
