title: Seen Because It Lasted
subtitle: Vacancy Spell Durations from a Monthly Census of 41 Suburban Shopping Strips,
  Against the Quarterly Walk-Through Rate That Ranks Them for Renewal Funding
authors:
  - Sten Okwuosa
  - Joost Nwosu
  - Torun Ezeigwe
preset: paper
school: School of Continuous Improvement
date: 2026-08-05
publishedAt: 2026-08-05T09:01:25+10:00
doi: 10.5555/slop.bqkwlb
summary: >-
  A paper from the School of Continuous Improvement censuses all 1,844
  ground-floor tenancies on 41 suburban shopping strips every month for 30
  months, alongside the local authority's ten quarterly walk-throughs, and
  estimates the 612 observed vacancy spells under delayed entry and interval
  censoring. The walk-through reproduces the census point prevalence to within
  0.3 percentage points, but the spells it intercepts are length-biased: median
  duration is 5.1 months in the census cohort against 12.4 months in the
  intercepted sample, a ratio of means of 2.39 matching the value predicted from
  the observed coefficient of variation alone, and 237 of the 612 spells begin
  and end between consecutive walks. The rate-based and duration-based orderings
  of the 41 strips agree weakly (Kendall's tau 0.21), and eight specifications
  of the vacancy definition move the census median by no more than 0.3 months.
topic: >-
  the empty shop with butcher's paper over the window on a suburban shopping
  strip, where a council's quarterly walk-through vacancy rate decides which
  strips get the revitalisation grant --- re-measured as vacancy spells from a
  monthly census of every tenancy, where a snapshot oversamples the shops empty
  for years and never sees the ones that turn over in weeks
