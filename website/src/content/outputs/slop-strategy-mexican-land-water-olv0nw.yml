summary: >-
  Slop University's Strategic Plan 2026-2031 organises the University's
  research, education and engagement around a single sustained commitment to
  the study of Mexico's land, water and livelihoods. Four focus areas address
  communal land tenure, shared water stewardship, the household economy, and
  the language, partnership and review settings a distant institution needs to
  remain durably present.
topic: >-
  Mexican land, water and livelihoods as a whole-of-university research
  commitment, held from a long way away
