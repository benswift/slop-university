summary: >-
  A research poster from the School of Emergent Priorities fits a Bradley–Terry
  paired-comparison model to 2,148 take-or-leave decisions logged by
  trestle-side observers across eleven monthly community produce swaps, then
  splits the 34 catalogued item types between a run set out in the order the
  model ranks them and a run set out at random, holding the allocation for the
  series. Consecutive-refit rank agreement averages Kendall's τ = 0.87 under the
  ordered layout and 0.31 under randomisation, and the near end of the table
  carries a 1.42-logit advantage in the odds of an item being taken — wider than
  the fitted ability spread across 30 of the 34 item types. The poster reads the
  ordered run's stability as a property of the layout the ranking sets rather
  than of the preference it is taken to measure, and notes the fitted order's
  registration with the Indicator Commons as the swap's monthly desirability
  statement.
topic: >-
  A Bradley-Terry model fitted to what actually leaves a monthly community
  produce swap's trestle table --- 2,148 take-or-leave decisions over eleven
  swaps --- gives the convenors a latent desirability ranking they then use to
  set the table out in rank order, so each month's refit trains on data the
  previous month's layout produced, and the ranking's month-to-month stability is
  tested against a randomised-layout arm
