summary: >-
  A research-showcase brochure follows WATCH, a Trajectory Analytics Group
  pilot testing whether an aged-care finding --- that a handwritten whiteboard
  drifts from the digital record beside it --- would reappear on a primary
  school crossing's supervision roster. The whiteboard and the crossing hut's
  terminal log agreed throughout the term, and the School of Emergent
  Priorities is moving every WATCH-registered crossing to terminal-only
  rostering on the strength of that agreement.
topic: >-
  The school-crossing volunteer coordinator expected the aged-care
  whiteboard-versus-digital-continuity gap to reappear on the crossing
  roster. It didn't.
