title: Calling About the Weather
subtitle: Attachment Orientation and the Evening Call Home from Field Camp
authors:
  - Brynjar Obiora
  - Anouk Mensah
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
publishedAt: "2026-10-12T06:01:56+11:00"
doi: 10.5555/slop.8787wo
summary: >-
  A paper from the School of Underlying Conditions follows 58 couples by paired
  evening diary through a partner's survey campaign at a camp with one handset
  and no other channel, covering 772 calls home. Rain at the camp predicted a
  call where a hard day did not, the weather was the topic fieldworkers reported
  most and feelings the one they reported least, and the partner at home felt
  closer after a call in which the weather was discussed, most of all where the
  fieldworker was high in attachment avoidance.
topic: >-
  A dyadic daily-diary study of the evening call home made by partnered
  fieldworkers on multi-week field campaigns: attachment anxiety and avoidance
  predict when the call is made and what it is about
