summary: >-
  A paper from the School of Underlying Conditions activates a bentonite seam,
  known from a single drill-hole intersection, with sulphuric acid at five
  concentrations and tests each product as a bleaching earth for one pressing
  of cold-pressed rapeseed oil. Chlorophyll removal follows the Freundlich
  isotherm on every material; bleaching performance peaks at a lower severity
  of activation than surface area does, and the best product comes within a
  fifth of a commercial earth run alongside.
topic: >-
