title: Indistinguishable by Week Twelve
subtitle: A matched twelve-week follow-up of 318 child restraints fitted at free
  council checking events, and 318 never checked
authors:
  - Thandiwe Solberg
  - Marit Osayande
  - Mirela Hanke
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-16
publishedAt: 2026-08-16T11:01:55+10:00
doi: 10.5555/slop.df0c2p
summary: A research poster from the School of Continuous Improvement follows 318 child
  restraints fitted at 24 free council checking events across three council areas against
  318 controls matched on restraint type, child age, and vehicle age, scoring fitting
  quality from household photographs at fortnightly waves to week twelve. Checked restraints
  score 9.2 of 10 on the day against 5.3 in controls; by week twelve the arms differ
  by 0.21 points (90% CI -0.18 to 0.60), inside a ±0.75-point equivalence margin fixed
  with the matching rule before recruitment, and the difference is reported as a null.
  By that point 68.9 per cent of checked restraints had been removed and reinstalled
  at least once, most often to clean the vehicle or to carry the child in another adult's
  car. Over the same period the correction rate the programme publishes as its outcome
  measure rose from 57.4 to 84.6 per cent, stepping 17.3 points in the year its fault-code
  list was expanded from nine items to twenty-three.
topic: the child car-seat fitting check on a Saturday morning in a council depot car
  park - an authorised fitter crouched in the back door of a hatchback, tugging the
  belt, pressing a dated sticker onto the seat frame - where a state child-restraint
  program reports its road-safety return as free checks delivered and the share of
  restraints found incorrectly fitted and corrected on the spot; and a matched twelve-week
  follow-up finds fitting quality in checked vehicles statistically indistinguishable
  from unchecked controls, bounded inside a pre-registered equivalence margin and reported
  as the null it is, because the seat comes out for a car wash, a grandparent, a third
  child, and goes back in the way the parent puts it in - while the correction rate,
  the program's only outcome number, is set by how strictly a fitter codes a fault
  and has climbed every year since the fault-code list was expanded
