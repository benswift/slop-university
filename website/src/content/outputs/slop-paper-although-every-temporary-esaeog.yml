doi: 10.5555/slop.esaeog
summary: >-
  A paper from the School of Emergent Priorities audits 386 temporary
  bus stop relocations, loading-zone trials, pop-up contraflow lanes, and
  school-street closures across eleven local government areas, finding
  only 9% close on schedule while 73% remain in place past their original
  term, split between an unresolved backlog and a larger share with no
  reversion decision on file at all.
topic: >-
  although every temporary bus stop relocation, loading zone trial, and
  pop-up contraflow lane carries a scheduled reversion date, a four-cell
  audit sorts most of them not by whether they revert, but by which kind
  of never-reverting they've become
