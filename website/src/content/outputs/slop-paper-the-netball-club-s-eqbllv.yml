title: Does a Netball Club's Grading Duty Officer Reward Showing Up, or Being Right?
authors:
  - Sten Okwuosa
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-09-12
publishedAt: "2026-09-12T00:03:18+10:00"
doi: 10.5555/slop.eqbllv
summary: >-
  A paper from the School of Continuous Improvement formalises a two-by-two
  quadrant --- full trial attendance crossed with whether a trialist's
  self-assessment matches the coaching panel's independent rating --- naming
  its four cells and deploying it across the pre-season trials of 14
  suburban netball clubs. The top cell alone supplies 92% of A-grade places
  and shows almost no relationship with a blinded assessor's independent
  finals score, while an ablation shows attendance alone reproduces most of
  the same roster.
topic: >-
  the netball club's grading duty officer sorts each player's pre-season
  trial into a four-cell matrix crossing whether they attended every trial
  session against whether the coach's on-court rating matched their
  self-assessment form, names all four cells, and uses the top-scoring
  quadrant to fill the A-grade side
