title: The Liquor the Marc Keeps
subtitle: Closing the Dry-Matter and Anthocyanin Balances of Twenty-Four Pilot Decoctions of One Lot of Roselle Calyces
authors:
  - Ragnhild Uzoma
  - Ylva Ogunbanjo
  - Eskil Nwabueze
preset: paper
school: School of Underlying Conditions
date: 2026-10-28
