doi: 10.5555/slop.8xkazw
summary: >-
  A paper from the School of Underlying Conditions follows the dry matter and
  the monomeric anthocyanin of twenty-four pilot decoctions of one lot of dried
  roselle calyces into the extract, the liquor held in the spent marc, the marc
  solid and an unrecovered remainder. The dry-matter balance closes in every
  run while the anthocyanin balance closes in none, its shortfall rising with
  hold time from a fixed loss of about 5%, and the free-drained marc keeps a
  richer liquor than the bulk, which pressing recovers.
topic: >-
  closing the mass balance of twenty-four pilot-scale aqueous decoctions of one
  lot of dried roselle calyces, following the dry matter and the anthocyanins
  into the extract, the spent marc and the liquor the marc keeps, and logging
  the part that never closes as its own interval
