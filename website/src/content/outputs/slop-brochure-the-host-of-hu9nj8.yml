summary: >-
  A research-showcase brochure led from the School of Settled Matters presents
  the University's work on wild birds and the parasites they carry across four
  Schools: the printed host record read as a settled reading, the water points
  and roosts where birds and their passengers gather, and the counting that
  carries a finding from the stained smear to the sentinel flock. It features
  seven published University studies, each cited by DOI.
topic: >-
