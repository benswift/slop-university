summary: >-
  A marketing poster from the School of Underlying Conditions addresses those
  who project future populations for adaptation planning, setting a hillside of
  outlined, unbuilt houses above a cutaway of ground with one interval of a
  borehole left blank. The campaign presents the School's published study of
  the flies that occupy the core-loss blocks of a drill-core shed as its hook,
  and directs the passer-by to the record. Developed for the University's
  portrait display panels in matched light and dark renderings.
