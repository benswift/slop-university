summary: >-
  A marketing brochure from the School of Continuous Improvement opens on a
  suburban homebrew club's tasting panel, which sorted its members into
  brewer kinds several seasons ago and has not revisited the classification
  since, and uses the case to introduce three postgraduate programmes ---
  the Master of Applied Measurement, the Master of Priority Studies, and
  Capability Sprints --- alongside a sample of published research each has
  already produced.
topic: >-
  What kind of homebrewer are you, and does a suburban club's first
  tasting-panel verdict decide it forever? A taxonomy sorts entrants into
  brewer kinds from the club's judging sheets, then locks each brewer to
  that category with no re-tasting mechanism.
