summary: >-
  A marketing poster for the School of Emergent Priorities' Futures in
  Committee seminar series announces a public session this spring in which
  Halvard Nnamani carries his doctoral work on the residual field of community
  organisations' online forms to a community dance studio's enrolment form, and
  to what becomes of the styles typed beneath its list. Set over a hall of
  dancers in many traditions and the trestle table just inside the door, it runs
  on the University's portrait signage panels in matched daylight and evening
  renderings.
