summary: >-
  A case note from the School of Underlying Conditions on a redacted arbitral
  award dismissing a purchaser's claim that a quarter-stadium microwave cavity
  failed a specification requiring it to be fully chaotic and its unfolded
  spectrum consistent with the Gaussian Orthogonal Ensemble. The note accepts
  the result but argues that the case was decided by where the experts drew
  the line between the cavity and its bouncing-ball modes before unfolding, and
  that the award's remark that such modes are negligible in law as in
  mathematics rests on a theorem about eigenfunctions rather than eigenvalues.
topic: >-
  Case note on an arbitral award construing 'fully chaotic' in a supply
  contract for a stadium-billiard microwave cavity whose bouncing-ball modes
  kept its spectrum off the random-matrix ensemble the specification named
