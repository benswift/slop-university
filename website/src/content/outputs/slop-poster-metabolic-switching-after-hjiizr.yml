title: Blocked but Not Slowed
subtitle: Benzylic deuteration moves oxidation to the adjacent site in twelve coded
  analogue pairs without lowering intrinsic clearance
authors:
  - Halvard Nnamani
  - Eivind Onwuka
  - Ragnhild Uzoma
preset: research-poster
school: School of Emergent Priorities
