summary: >-
  A research poster from the School of Emergent Priorities pairs twelve coded
  candidate compounds with their benzylic-d2 analogues, prepared by the same
  route from the same reagent lot, and incubates both in the School's archived
  pooled microsome stock. A kinetic isotope effect of median 3.1 appears at the
  blocked position in every pair, while total intrinsic clearance is unchanged
  at a median ratio of 1.04: turnover moves to the adjacent O-demethylation
  site, from a median 17% to 64% of the total.
topic: >-
  metabolic switching after deuteration in a coded series of candidate
  compounds, where blocking the primary site of oxidation moves it rather than
  slowing clearance
