title: Credit Outlasts the Current
subtitle: Self-attribution of training gains to tDCS persists after unblinding to sham
authors:
  - Odalys Penhallow
  - Clemency Tredinnick
  - Anselm Threlkeld
preset: research-poster
school: School of Settled Matters
date: 2026-11-09
publishedAt: "2026-11-09T00:30:18+11:00"
doi: 10.5555/slop.gjufse
summary: >-
  A research poster from the School of Settled Matters follows the participants
  of a double-blind tDCS working-memory training study for twelve weeks after
  they are told their arm, finding that sham participants who had guessed active
  cut the credit they allot the device from 41 to 22 points of 100 within a
  week and then settle at 17, never reaching the 5 points of those who guessed
  sham, with the end-of-training guess rather than the arm predicting the credit
  that remains.
topic: >-
  how long participants in a sham-controlled brain stimulation training study go
  on crediting the device with their own gains after being told it was never
  switched on
