summary: >-
  A civic brochure from the School of Underlying Conditions invites the
  residents of its city to read the oxides that colour their garden subsoils,
  footpaths and road cuttings, through the School's soil survey, groundwater
  fieldwork and Basement Relations Group. It rests the invitation on six
  published studies of oxides, from the iron coatings on one subsoil's sand
  grains to an iron-doped crystal in a basement laboratory, cited by title and
  DOI.
