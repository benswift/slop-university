summary: >-
  A research poster from the School of Underlying Conditions prices each of
  1,847 legacy soil-profile descriptions by the expected value of sample
  information its re-description holds for the legend classes of 214 map
  units. At a season's budget of 120 re-dug pits, value-ranked triage recovers
  71% of the database's expected value of perfect information against 23% for
  the survey's least-complete-first queue, with the value concentrated in
  complete-looking records near class boundaries and in colours read against
  since-retired faded pages.
