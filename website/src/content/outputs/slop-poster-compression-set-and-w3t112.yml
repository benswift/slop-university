title: What the Cushion Keeps
subtitle: >-
  Recoverable and Permanent Set in One Lecture Theatre's Polyurethane Seat Foam
authors:
  - Signy Okpara
  - Hedvig Anyanwu
  - Casimir Beng
preset: research-poster
school: School of Continuous Improvement
