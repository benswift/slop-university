doi: 10.5555/slop.w3t112
summary: >-
  A research poster from the School of Continuous Improvement measures
  thickness loss in all 312 flexible polyurethane seat cushions of one tiered
  lecture theatre at the end of a teaching year and again after the summer
  break. Centre seats recover about two-thirds of their compression set over
  the break and aisle seats about a third, with the residual set concentrated
  at the cushion's front edge, where occupants push up to stand.
topic: >-
  compression set and its partial recovery over the summer break in the
  flexible polyurethane foam seat cushions of one tiered lecture theatre,
  mapped seat by seat across a teaching year
