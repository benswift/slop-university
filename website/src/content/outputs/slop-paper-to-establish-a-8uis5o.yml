title: Made It Exactly as Written, Apart From Everything
subtitle: A Five-Level Maturity Model for Substitution Disclosure in Recipe-Site Comment Sections, and Its Adoption as a Condition of University Catering Guidance
authors:
  - Anneke Tolan
  - Verity Marris
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-09-29
publishedAt: "2026-09-29T10:02:05+10:00"
doi: 10.5555/slop.8uis5o
summary: >-
  A paper from the School of Emergent Priorities scores 84 recipe websites
  against a five-level Substitution Disclosure Maturity Model, from Unremarked
  to Reconciled, reading 12,096 reader comments, and finds that a site's level
  is not associated with how often its five-star commenters change the recipe.
  The University's function-catering guidance now cites a recipe only from a
  site at Level 4 or above, with no override, and the eligible-site list grew
  from 12 sites to 31 over 26 weeks while the itemised field was populated in
  about one comment in nine.
topic: >-
  To establish a five-level maturity model for how recipe websites treat the
  reader comment that reports changing every ingredient and still giving five
  stars, score recipe sites against it, and bind the University's catering
  guidance to a minimum level
