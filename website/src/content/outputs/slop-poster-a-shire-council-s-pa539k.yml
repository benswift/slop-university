title: Does an Orange Ring Get a Pothole Filled Sooner?
subtitle: A 26-week randomised allocation of 480 reported potholes by a shire's Road Maintenance Committee
authors:
  - Edda Nwafor
  - Solveig Adeyemi
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-01
publishedAt: "2026-10-01T08:00:35+10:00"
doi: 10.5555/slop.pa539k
summary: >-
  A research poster from the School of Continuous Improvement reports a
  26-week trial in which a shire's Road Maintenance Committee left 240 of 480
  reported potholes unringed, finding no difference in days to repair (median
  17 days in both arms), and the Committee has made a matching trial the
  condition for changing any other pothole practice.
topic: >-
  A shire council's Road Maintenance Committee spray-paints an orange ring
  round every reported pothole, randomly leaves half of 480 unringed, and finds
  the ring does not shorten days-to-repair; it then requires a matching trial of
  the same size before any other pothole practice may change
