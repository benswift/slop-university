summary: >-
  A case-for-support brochure inviting partners to stand behind the
  University's work on difficulties that are felt in one place and begun in
  another. It presents the School of Underlying Conditions, the Basement
  Relations Group and the Strategic Drift Survey as one capability applied at
  different depths, and rests the appeal on seven published University studies
  cited by title and DOI.
