doi: 10.5555/slop.bg67p3
summary: >-
  Slop University's Strategic Plan 2026-2031 sets out four priorities for
  research into language in use, from a Commissives Corpus of every undertaking
  minuted by its committees to a Campus Utterance Register of the recorded
  announcements its lifts, barriers and fire panels make. It commits the
  University to describing its own institutional register before prescribing
  it, and enters its own undertakings in the Corpus first.
topic: >-
  felicity conditions: a strategic plan for language research, the
  University's promises as speech acts, and the campus as a speech community
  whose lifts, barrier arms and fire panel also make commitments
