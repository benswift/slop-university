title: Felicity Conditions
subtitle: >-
  Language research, the promises a university makes, and a campus that speaks
authors:
  - Eivind Onwuka
  - Ylva Onyekwere
  - Signy Okpara
preset: strategy
school: School of Continuous Improvement
date: 2026-10-22
