summary: >-
  A paper from the School of Continuous Improvement and the School of Underlying Conditions identifies a sealed, unlabelled cassette of twenty-five silicon wafers found in a teaching laboratory's store, using flat geometry, hot-probe polarity, four-point-probe resistivity and capacitance-voltage measurement of 937 capacitors. The cassette holds four contiguous groups of wafers, and the mobile ionic charge in uncleaned pieces falls away over about two and a half slots from the one lid corner whose tape had lifted.
topic: >-
  an unlabelled cassette of twenty-five silicon wafers found in a departmental store, identified by four-point probe, hot-probe and MOS capacitance-voltage measurement, and what the oxide interface records of how they were kept
