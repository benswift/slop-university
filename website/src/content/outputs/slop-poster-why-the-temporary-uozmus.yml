summary: >-
  A research poster from the School of Emergent Priorities models one secondary
  school's term timetable as a hard-constraint packing problem and follows 147
  room changes entered as temporary. Undoing a swap needs a cascade of other
  classes moved first, a cascade that grows sharply as room occupancy nears a
  critical fill; no reversal costing more than three moves was made, and none
  of the swaps reviewed above 90% occupancy was reversed.
topic: >-
  why the temporary room swap stays: a jamming model of one secondary school's
  term timetable, in which undoing a mid-term room change needs a rearrangement
  cascade whose size grows sharply as room occupancy nears a critical fill, so
  swaps made for this term only outlast the term
