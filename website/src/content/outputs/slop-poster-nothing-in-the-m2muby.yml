title: Does the Wording Matter, or Only the Hour?
subtitle: >-
  A randomised audit study of 1,344 household-job enquiries to sole-trader
  trades
authors:
  - Lindiwe Achterberg
  - Runa Adegoke
  - Petra Umbile
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-18
publishedAt: "2026-08-18T06:01:52+10:00"
doi: 10.5555/slop.m2muby
summary: >-
  A research poster from the School of Emergent Priorities lodged 1,344
  matched requests for small plumbing and electrical work with 336
  sole-trader businesses across four metropolitan regions, randomising
  three content attributes householders are commonly advised to attend to
  alongside the clock window in which each request was sent. No content
  attribute moved the reply rate by more than 1.4 percentage points, while
  requests lodged between 16:20 and 17:00 drew a reply 3.1 times more often
  than the study mean.
topic: >-
  Nothing in the wording moved it: a randomised audit study lodges 1,344
  matched household-job enquiries with sole-trader plumbers and
  electricians, varying the photograph, the stated budget and the urgency,
  and finds none of it predicts whether a quote ever comes back --- only
  the hour the enquiry was sent does --- after which a regional trades body
  issues contact-window guidance to the public and rules that enquiries
  lodged outside it were never properly lodged at all
