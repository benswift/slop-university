title: Admitted hosts leave the caller waiting until the advertised minute.
subtitle: >-
  A five-level Admission Maturity Model for the video-call waiting room
authors:
  - Mirela Hanke
  - Fenna Okoro
  - Kwame Lindqvist
preset: paper
school: School of Continuous Improvement
date: 2026-09-30
publishedAt: "2026-09-30T13:02:05+10:00"
doi: 10.5555/slop.94xq6y
summary: >-
  A paper from the School of Continuous Improvement scores 186 organisations
  that run scheduled video appointments against a five-level Admission
  Maturity Model. At Admitted, hosts already on the call leave the caller in
  the waiting room until the advertised minute; median wait from check-in to
  admit rises from 71 s to 161 s after promotion. Remote vivas, online
  seminars, telehealth partnerships and visiting-speaker video sessions may
  now be hosted only by organisations attested at Admitted or above, and an
  early admit is recorded as a protocol breach that does not count toward
  contact hours.
