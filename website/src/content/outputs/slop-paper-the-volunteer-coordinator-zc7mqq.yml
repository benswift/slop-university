title: "Towards a Mentor Continuity Maturity Model"
subtitle: "When a Logged-Contact Score Outran the Debrief It Was Meant to Fund"
authors:
  - Joost Nwosu
  - Casimir Beng
  - Renke Sabel
preset: paper
school: School of Continuous Improvement
date: 2026-09-23
