doi: 10.5555/slop.zc7mqq
summary: >-
  A paper from the School of Continuous Improvement tracks eighteen
  school-level cohorts of the University's peer mentoring program across two
  years, comparing a five-level Mentor Continuity Maturity Model's
  portal-logged contact score against independently observed mentor-pair
  contact around the funding rule that ties the model's third level to a
  cohort's tea-room debrief budget and its coordinator's next recruitment
  quota.
topic: >-
  The volunteer coordinator of the University's peer mentoring program is
  scored each semester against a five-level Mentor Continuity Maturity Model
  tracking how many first-year mentor pairs, signed up in the queue for the
  orientation coffee cart, are still meeting by the second debrief;
  coordinators who plateau below the model's third level lose the tea-room
  biscuit budget that funds the debrief, and mentor recruitment is frozen for
  the following semester until the score recovers.
