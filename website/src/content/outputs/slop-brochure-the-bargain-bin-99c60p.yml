summary: >-
  A civic brochure from the School of Emergent Priorities sorts the contents of
  a strip-mall variety shop's bargain bin into four kinds by what each passer-by
  does, and invites the neighbourhood to learn them. Every shared-room table in
  a University building is now stocked to the bin's proportions and keeps one
  Passed item that no one may lift until the table's next review.
topic: >-
