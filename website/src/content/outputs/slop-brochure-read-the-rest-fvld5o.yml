summary: >-
  A case-for-support brochure from the School of Emergent Priorities invites
  partners into the University's protein science, presenting the share of
  every instrument run that is recorded but never read as its most promising
  material. It follows the habit across three Schools, from keeping every
  fraction of an enrichment run to re-assaying the freezer a concluded
  programme leaves behind, and rests its case on seven published studies cited
  by title and DOI.
topic: >-
  read the rest of the spectrum: a case for supporting the University's
  protein science, from the enriched lysate to the peptides nobody asked the
  instrument to look for
