summary: >-
  A marketing poster for the Master of Priority Studies sets out the Spoon
  Ledger, which sorts every request for a strip-mall café's customers-only toilet
  key into five kinds of asker by what each already is to the till. On the
  strength of the sorting, the café undertakes to ring up every key handed over
  as a sale at the end of the day, whether or not a coin was spent.
