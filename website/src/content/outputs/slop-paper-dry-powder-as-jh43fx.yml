doi: 10.5555/slop.jh43fx
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities applies groundwater recession analysis to one anonymous limited
  partner's quarterly ledger of uncalled commitments across 31 buyout and
  venture funds. Buyout balances drain as a linear reservoir with a half-life
  of 2.6 years; venture balances share the half-life but follow a steeper
  power law with a longer tail; nineteen records settle to a floor of 4 to 11
  per cent of commitment that is never called; and master recession curves
  reproduce the aggregate record to within 6 per cent and, run backward,
  recover the quarter of 30 of the 31 commitments.
topic: >-
  Dry powder as a standing water level: a master recession analysis of
  uncalled commitments across thirty-one fund vintages in one anonymous
  limited partner's private equity ledger
