title: Dry Powder as a Standing Water Level
subtitle: >-
  A Master Recession Analysis of Uncalled Commitments in One Limited Partner's
  Private Equity Ledger
authors:
  - Vigdis Emenike
  - Kwame Lindqvist
preset: paper
school: School of Underlying Conditions
