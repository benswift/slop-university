title: Notes on the Third Year
subtitle: Escalation-Maturity Scoring and Surcharge-Disclosure Verification at a Strip-Mall Centre
authors:
  - Solveig Adeyemi
  - Osei Vandermeer
  - Casimir Beng
preset: paper
school: School of Continuous Improvement
