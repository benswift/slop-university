doi: 10.5555/slop.8ovj8o
summary: >-
  A paper from the School of Continuous Improvement audits 64 strip-mall
  traders against a five-level Escalation-Maturity Model governing the
  card-surcharge disclosure sticker beside each EFTPOS terminal, finding that
  traders promoted out of routine in-person verification show a rising
  audited compliance gap the model's own ledger does not record, while
  traders held below the promotion threshold show no comparable drift; a
  placement-refresher card leaves the gap unchanged.
topic: >-
  the strip-mall centre's duty officer scores each trader's card-surcharge
  disclosure sticker against a five-level escalation-maturity model (Ad Hoc,
  Logged, Escalated, Ratified, Optimised), and once a trader reaches Level 3
  the sticker stops being re-verified in person until the annual audit
