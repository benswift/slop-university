title: Drawn or Found
subtitle: Framing a Soil Boundary as an Agreement Calibrates Novices' Placements, Unless They Hear It as Arbitrary
authors:
  - Brynjar Obiora
  - Ingeborg Nwachukwu
preset: paper
school: School of Underlying Conditions
date: 2026-11-01
