doi: 10.5555/slop.o9wncq
summary: >-
  A paper from the School of Underlying Conditions and the School of
  Continuous Improvement reports two experiments in which 230 novice soil
  describers placed boundaries on gradational profile strips after being told
  the boundary was either a feature to be found or a line placed by agreement.
  The agreement framing cut placement error and raised the share of 90%
  brackets containing the reference boundary on the most gradual strips from
  41% to 66%, but led nearly a quarter of learners to call the boundary
  wherever one chooses; describing the agreement as answerable to independent
  placements kept the gain without that reading, and held it for a week.
topic: >-
  drawn or found: telling novices that a boundary between gradational soil
  categories is an agreed convention rather than a discovered fact, two
  experiments on where they place it and how sure they are
