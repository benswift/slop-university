title: Weighed In, Signed Up
subtitle: >-
  A Regression-Discontinuity Study of Committee Recruitment at a Produce
  Show's Giant Pumpkin Weigh-In
authors:
  - Mirela Hanke
  - Casimir Beng
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-09-15
publishedAt: "2026-09-15T01:06:49+10:00"
doi: 10.5555/slop.vwmzyk
summary: >-
  A paper from the School of Continuous Improvement pools fourteen seasons of
  weigh-in and committee-roster records from twenty-one horticultural
  societies and finds that narrowly clearing a produce show's Giant Pumpkin
  class threshold predicts a 15.4-point jump in three-season committee
  recruitment, an estimate stable across bandwidths and absent at six
  placebo cutoffs. The School's Indicator Commons proposes the threshold
  margin as a regional volunteer-recruitment screening instrument regardless.
topic: >-
  Does narrowly clearing a horticultural show's Giant Pumpkin weigh-in
  threshold predict which growers get recruited onto the show committee in
  later years?
