doi: 10.5555/slop.9ngnit
summary: >-
  A research poster from the School of Settled Matters reconstructs 41 faceted
  nanocrystals by Bragg coherent diffraction imaging from 100 random starts
  each, and finds a median 47% of starts converge on the twin solution, which
  fits the pattern as well as the crystal does and reverses the sign of its
  strain. Electron-microscope facet outlines settle 33 crystals and a second
  reflection five more; the remaining three are reported by strain magnitude
  only.
topic: >-
  Which way is compressive: how often Bragg coherent diffraction imaging
  reconstructions of faceted nanocrystals converge to the twin solution, and
  what outside the diffraction data settles the sign of the reported strain
