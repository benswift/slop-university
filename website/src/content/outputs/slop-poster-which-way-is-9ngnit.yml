title: Same Pattern, Opposite Strain
subtitle: >-
  Settling the sign of strain in Bragg coherent diffraction images of
  nanocrystals
authors:
  - Anselm Threlkeld
  - Gunnhild Ekwueme
  - Ylva Ogunbanjo
preset: research-poster
school: School of Settled Matters
date: 2026-11-24
