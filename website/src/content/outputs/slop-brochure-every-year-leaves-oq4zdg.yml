summary: >-
  A research showcase of the University's work on records that accumulate
  slowly and keep something of the climate they formed under, anchored in the
  School of Underlying Conditions and its Basement Relations Group and drawing
  on the School of Emergent Priorities. It presents the work under three
  themes --- the season-by-season resurvey, the long column of drill core, and
  the things that build up a layer at a time --- and rests them on seven
  published studies cited by title and DOI.
