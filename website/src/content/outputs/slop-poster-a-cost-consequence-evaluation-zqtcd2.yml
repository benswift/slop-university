title: Better Ice, Less Skating
subtitle: >-
  A Cost-Consequence Evaluation of a Six-Month Resurfacing Trial Now in Its
  Ninth Year at Nine Suburban Rinks
authors:
  - Lindiwe Achterberg
  - Ingeborg Nwachukwu
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-13
publishedAt: 2026-08-13T15:01:22+10:00
doi: 10.5555/slop.zqtcd2
summary: >-
  A research poster from the School of Emergent Priorities costs the
  between-session ice-resurfacing cadence at nine council-operated rinks, a
  cadence fixed by a six-month trial in 2017, extended by memo eleven times and
  never formally concluded. Across 1,184 public sessions and 4,072 passes,
  cadence varies threefold between venues (1.4 to 4.3 passes per public hour)
  while the venues' Ice Presentation Index, scored within ten minutes of a pass,
  spans two points; skateable time per booked hour spans 14.0 minutes, and the
  highest-cadence venue spends an estimated $18,340 more per season for no
  separation the Index records.
topic: >-
  a cost-consequence evaluation of the between-session ice-resurfacing cadence
  at a chain of suburban ice rinks --- a cadence fixed by a six-month trial that
  was extended by memo and never formally concluded --- costing each resurfacing
  pass against the public skating minutes it clears from the ice, where the
  venues' own ice-quality index is scored immediately after a pass and so rises
  exactly as usable skating time falls
