summary: >-
  A paper from the School of Emergent Priorities reads sixty-three notices of
  refusal issued over one trading year by a regional bank's documentary-credits
  desk, in which a document checker lists each point at which a seller's
  papers differ from the letter of credit. It attends to the sentence the
  notices are built from, to one notice concerning dried apricots, to the two
  hands that can be told apart in the file and to the formula on which every
  notice closes, and argues that the checker practises a formalism stricter
  than any now taught.
topic: >-
  A close reading of the discrepancy notices a trade-finance desk issues
  against letters of credit: the document checker, who reads only the face of
  the page and never the goods, as the last practising formalist
