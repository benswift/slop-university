title: Subsampling the Silent
subtitle: >-
  Callback Fractions That Bound Nonresponse Bias in a Six-Month Follow-Up of a
  Short-Course Cohort
authors:
  - Ingeborg Nwachukwu
  - Mirela Hanke
  - Torun Ezeigwe
preset: research-poster
school: School of Continuous Improvement
date: 2026-11-01
publishedAt: "2026-11-01T19:02:15+11:00"
doi: 10.5555/slop.h03zq9
summary: >-
  A poster from the School of Continuous Improvement designs the callback
  phase of a six-month follow-up of 418 Capability Sprints graduates, ringing
  back a random subsample of the 221 who did not answer and bounding the
  graduates the callback never reached rather than modelling them. Following
  one nonrespondent in three gives the narrowest interval at a fixed
  interviewer budget, placing six-month retention of the course's weekly
  review between 47% and 62%, against 71% among first-round respondents.
topic: >-
  Subsampling the silent: Hansen–Hurwitz callback designs for a six-month
  follow-up survey of a short-course cohort, and how small a callback fraction
  still bounds nonresponse bias
