title: No, I Think You've Covered Everything
subtitle: The Last Question of the Job Interview and What a Selection Panel Does
  With It
authors:
  - Signy Okpara
preset: thesis
school: School of Continuous Improvement
date: 2026-10-05
publishedAt: "2026-10-05T19:57:15+11:00"
doi: 10.5555/slop.b6zqnj
summary: >-
  A doctoral thesis from the School of Continuous Improvement records 412
  selection interviews at 26 employers, seals 764 pairs of panellists' scores on
  either side of the candidate's question, follows 131 offers for 26 weeks and
  trials the invitation reworded, moved and scored across 288 further
  interviews. The question left the score unchanged on 95.7% of sealed slips and
  changed no first-ranked candidate, and the thesis sets out the Candidate
  Question Standard the University has adopted, under which each candidate asks
  two questions chosen from a published Schedule of 24, hears them answered from
  a Register of Standing Answers and has them rated for 20% of the selection
  total.
topic: >-
  the last question of a job interview, do you have any questions for us ---
  what candidates ask, what panels answer, whether a score ever moves, and the
  published list from which the University now requires its own candidates to
  choose the question it scores
