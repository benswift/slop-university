summary: >-
  A civic brochure from the School of Underlying Conditions offers the soil
  surveyor's boundary practice to the community services whose catchment lines
  run down the middle of ordinary streets: each line walked, the households on
  both sides of it described, and the account handed back with the map. It
  presents the School's close readings of returning and of referral alongside
  six published outputs cited by title and DOI, and promises nothing about
  where any line should fall.
