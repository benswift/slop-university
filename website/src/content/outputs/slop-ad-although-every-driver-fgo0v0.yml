summary: >-
  A signage campaign for the Master of Applied Measurement that classifies
  every driver at a suburban roundabout into one of four named quadrants ---
  Herald, Whisperer, Bluffer and Drifter --- by whether they signal and whether
  they stop, and announces that the campus roundabout will give way in that
  order.
topic: >-
  Although every driver takes the same turn at a suburban roundabout, sort them
  into four quadrants --- Herald, Whisperer, Bluffer, Drifter, by whether they
  signal and whether they stop --- and have the campus roundabout give way in
  that order.
