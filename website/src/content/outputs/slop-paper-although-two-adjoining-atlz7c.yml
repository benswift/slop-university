title: Charged, Not Different
subtitle: >-
  A Regression-Discontinuity Audit of a Residential Parking-Permit Zone's
  Committee-Drawn Boundary
authors:
  - Ingrid Vasseur
  - Kwame Lindqvist
  - Osei Vandermeer
preset: paper
school: School of Emergent Priorities
date: 2026-09-06
publishedAt: "2026-09-06T12:04:16+10:00"
doi: 10.5555/slop.atlz7c
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement treats a residential parking-permit zone's committee-drawn
  boundary as a naturally occurring cutoff, finding kerb occupancy and permit
  uptake continuous across the line while compliance-notice issuance jumps
  sharply, and reports that the council has responded by adopting the
  original boundary-setting method as its template for every future zone
  determination.
topic: >-
  although two adjoining streets in the same council block are alike in
  every way that matters, only one falls inside a residential parking
  permit zone whose boundary a committee drew decades ago, and this
  quasi-experiment compares parking occupancy, permit uptake, and
  compliance-notice rates either side of that line to ask what the boundary
  is still doing
