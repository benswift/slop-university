title: Sorted, Not Saved
subtitle: >-
  A Taxonomy of Streaming-Service Cancellation Reasons and the Category That
  Decides Who Gets an Offer
authors:
  - Bram Ntuli
  - Sten Okwuosa
  - Mirela Hanke
preset: paper
school: School of Continuous Improvement
date: 2026-08-27
publishedAt: "2026-08-27T12:01:16+10:00"
doi: 10.5555/slop.n0ekhr
summary: >-
  A paper from the School of Continuous Improvement develops the
  Cancellation Reason Taxonomy, a three-category coding scheme for
  subscriber-stated cancellation reasons at a mid-sized streaming service,
  and finds category assignment predicts whether a retention discount offer
  is extended far more reliably than any single stated reason. The mapping
  survives an ablation withholding the subscriber's own free-text
  explanation from the classifier entirely.
topic: >-
  although a streaming service's cancel-subscription screen offers five
  distinct reasons for leaving, a taxonomy sorts them into three retention
  categories and only one triggers a save-the-subscriber discount offer
