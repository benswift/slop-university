summary: >-
  A prospectus from the School of Settled Matters invites prospective students
  to study the law of inherited obligation, in three features: the burdens a
  certificate of title carries from owner to owner, the questions of
  information and family that follow an inherited kidney condition such as
  polycystic kidney disease, and how a contested reading of the law comes to
  be settled. It quotes and profiles three researchers and features five
  published studies from three Schools, cited by title and DOI.
topic: >-
  what runs in families: studying the law of inherited burdens, from the
  covenant that binds every later owner to polycystic kidney disease
