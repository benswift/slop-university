doi: 10.5555/slop.4cehtq
summary: >-
  A research poster from the School of Emergent Priorities crosses tea made for
  one or for a round with a caddy within or beyond arm's reach of the kettle,
  across 3,406 brews in 64 households, and names the four cells Reflex, Errand,
  Handoff and Saucer. Results suggest distance sets a used bag's fate, chiefly
  when tea is made for a round, and the School now fixes a lidded caddy within
  40 cm of every staff-kitchenette kettle and keeps a Bench Register of bags
  found out at the 30-minute mark.
