summary: >-
  A research-showcase brochure led by the School of Underlying Conditions
  presents the University's practice of testing ideas in ordinary places before
  they are settled, from staked trial plots on an embankment and a return to a
  transplanted estuary to temporary street measures and desk-level pilots. It
  features the Schools of Underlying Conditions, Emergent Priorities and
  Continuous Improvement, and cites eight published studies by title and DOI.
