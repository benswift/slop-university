summary: >-
  A case-for-support brochure from the School of Continuous Improvement invites
  partners and benefactors to sustain the University's work on old masonry
  across three themes: lime mortars cured and re-tested over long schedules,
  the water and salts that move through stone, and the cycles of upkeep that
  decide when a wall is next visited and by whom. It features seven of the
  University's published outputs and profiles two of its researchers.
