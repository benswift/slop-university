summary: >-
  A research poster from the School of Emergent Priorities pairs an RFID tap
  post with the campus café's overhead camera to correct pigeon-driven
  overcounts in queue-length telemetry. The resulting occupancy signal has
  been adopted, unmodified, as the reference for a forthcoming Shared-Amenity
  Fairness Register spanning unrelated campus queues.
topic: >-
  Establish a low-cost RFID-tap and overhead-camera rail that issues verified
  queue positions at the campus café coffee counter, addressing the camera's
  false-positive habit of counting loitering courtyard pigeons as queue
  occupants, and evaluate the same rail as a general substrate for
  shared-amenity queue fairness across campus.
