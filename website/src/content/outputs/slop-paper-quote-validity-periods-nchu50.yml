title: How Long a Price Holds
subtitle: Quote Validity, Re-quotation and the Second Export Order
authors:
  - Fenna Okoro
  - Ingrid Vasseur
preset: paper
school: School of Emergent Priorities
date: 2026-10-23
publishedAt: "2026-10-23T01:01:56+11:00"
doi: 10.5555/slop.nchu50
summary: >-
  A paper from the School of Emergent Priorities reads the quotation register
  of a regional export-readiness programme (186 first-time exporting
  manufacturers, 2,412 quotations, 611 first orders) and finds that fixed-price
  quotations held for more than 60 days win more first orders but are followed
  by markedly fewer second orders (hazard ratio 0.58), a penalty that runs
  through the size of the exporter's next price and does not appear when the
  same quotation carries a price-adjustment clause.
topic: >-
  quote validity periods and the second order: how long first-time exporters
  hold a price, and whether foreign buyers come back
