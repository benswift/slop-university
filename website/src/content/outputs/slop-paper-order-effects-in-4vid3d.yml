title: The Slide Before
subtitle: Sequential Contrast in Masked Necrosis Grading, Re-read in Block and Random Order from an Archived Hepatoprotection Study
authors:
  - Marit Osayande
  - Solveig Adeyemi
  - Ragnhild Uzoma
preset: paper
school: School of Continuous Improvement
date: 2026-11-01
publishedAt: "2026-11-01T11:31:15+11:00"
doi: 10.5555/slop.4vid3d
summary: >-
  A paper from the School of Continuous Improvement and the School of
  Underlying Conditions has three masked readers re-grade the 96 archived liver
  sections of a concluded four-arm hepatoprotection study twice, once in the
  arm-by-arm order the study was originally read in and once in random order,
  against point-counted necrotic fractions. Each grade fell by 0.19 for every
  0.10 of necrosis on the slide read before it, so that block reading raised
  vehicle grades, lowered injury grades and narrowed the injury window from 2.2
  to 1.7 grades while inter-reader agreement stayed high; the study's
  protection ratio, taken against its own window, came out at 0.41 either way.
topic: >-
  Order effects in blinded histopathology scoring: how a pathologist's grading
  of rodent liver sections drifts across a reading session in a
  hepatoprotection study, and what randomised slide order recovers
