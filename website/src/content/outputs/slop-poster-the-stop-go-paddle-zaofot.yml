title: Rated for Traffic That Never Came
subtitle: >-
  A Discrete-Event Model of Stop/Go Cycle Length at Twelve Rural Works Sites
authors:
  - Petra Umbile
  - Lindiwe Achterberg
  - Kwame Lindqvist
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-14
publishedAt: "2026-08-14T15:04:44+10:00"
doi: 10.5555/slop.zaofot
summary: >-
  A research poster from the School of Emergent Priorities models alternating
  one-lane traffic control at twelve rural single-lane closures, calibrated to
  61 hours of verge-side counts and changeover timings and run over 10,000
  replications per setting with the signal cycle swept from 4 to 16 minutes.
  Rated capacity rises across the sweep from 412 to 731 vehicles per hour while
  mean delay rises from 46 to 214 seconds, and beyond a nine-minute cycle each
  further minute adds under 11 vehicles per hour to the rating and about 19
  seconds to the average wait. No site's busiest observed hour reaches 48 per
  cent of the throughput its own traffic guidance plan is rated at, and the
  median site peaks at 33 per cent.
topic: >-
  the stop/go paddle at single-lane country roadworks, where a road authority
  signs off a works site on the throughput its traffic guidance plan is rated at
  --- a discrete-event queueing model calibrated to observed arrivals and
  changeovers at twelve rural sites, finding the rated figure rises with every
  minute added to the signal cycle while the average driver's wait rises with
  it, and no site ever comes near the demand its rating assumes
