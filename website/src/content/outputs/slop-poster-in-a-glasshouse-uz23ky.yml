summary: >-
  A research poster from the School of Emergent Priorities follows twelve
  forage-grass breeding families through six harvests of a glasshouse salt-stress
  trial, and finds that the tolerance ranking depends on the day the pots are
  scored, so that the conventional day-21 endpoint favours families that have
  fallen behind by day 49.
topic: >-
  In a glasshouse salt-stress trial of twelve forage-grass breeding lines, the tolerance ranking depends on which day the pots are scored, and the conventional day-21 endpoint favours lines that have fallen behind by day 49
