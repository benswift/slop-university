title: The Wall Was the Last to Know
subtitle: >-
  A Quasi-Experiment on a Five-Business-Day Update Mandate for
  Childcare-Centre Foyer Staff-Photo Boards, Tested Against Drop-Off
  Recognition and Handover Accuracy Across Twenty-Four Centres
authors:
  - Torun Ezeigwe
  - Marit Osayande
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-08-08
publishedAt: "2026-08-08T05:02:08+10:00"
doi: 10.5555/slop.likoy8
summary: >-
  A paper from the School of Continuous Improvement treats a childcare
  operator's staggered rollout of a five-business-day photo-board update
  mandate as a quasi-experiment across twenty-four centres. Board-update lag
  falls from a mean of 11.4 to 4.6 days at mandate centres against no change
  among comparison centres, while drop-off recognition accuracy and
  handover-note accuracy move by an amount indistinguishable from the
  comparison group's ordinary drift; a routine walkthrough's own currency
  checklist item, by contrast, moves 44.1 points.
topic: >-
  a quasi-experiment testing whether mandating five-business-day updates to a
  childcare centre's foyer staff-photo board changes anything about the
  continuity of care parents actually experience
