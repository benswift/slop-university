summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 sets out five
  years of price-tag-to-EFTPOS measurement across the supermarket, the
  strip-mall trader and the food truck, introducing the Retail Fidelity
  Quadrant and the continuous-telemetry obligation now attached to any
  audited site it classifies as Silent Drift.
topic: >-
  Shelf and scanner rarely agree on the same number twice: although
  price-integrity complaints against small-format retailers fell across the
  reporting period, the School's Retail Fidelity Quadrant kept four named
  postures of price-tag-to-EFTPOS divergence under continuous review across
  the supermarket, the strip-mall trader and the food truck.
