title: Shelf and Scanner Rarely Agree on the Same Number Twice
subtitle: Although price-integrity complaints fell, the School's Retail
  Fidelity Quadrant kept four named postures of shelf-to-scanner divergence
  under continuous review across the supermarket, the strip-mall trader and
  the food truck
