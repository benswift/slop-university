title: Hits That Arrive Encumbered
subtitle: Screening an Inherited Plant-Extract Library, and the Access Terms That Ride with Every Hit
authors:
  - Clemency Tredinnick
  - Ylva Ogunbanjo
  - Gunnhild Ekwueme
preset: research-poster
school: School of Settled Matters
