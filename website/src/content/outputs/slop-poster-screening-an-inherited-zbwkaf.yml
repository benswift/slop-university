doi: 10.5555/slop.zbwkaf
summary: >-
  A research poster from the School of Settled Matters screens 1,184 crude
  extracts from an inherited library of 412 plant accessions in an NF-κB
  reporter assay, and reads every accession's deposit file for the terms it was
  collected under. Of 41 confirmed hits, six carry unencumbered terms, 23 are
  restricted to research use or must be renegotiated first, and 12 have no
  terms on file; the oldest deposits hit most often (4.4% of 1987–93 extracts
  against 2.2% of 2008–14) and are the least documented.
topic: >-
  Screening an inherited plant-extract library for anti-inflammatory hits, and
  tracing the access terms that ride with each accession into every hit it
  yields
