doi: 10.5555/slop.hdg0k1
summary: >-
  A research poster from the School of Underlying Conditions logs the
  conductivity of the dialysis water at each of ten scheduled changes for
  twelve batches of acid-soluble collagen from farmed fish skins, and reads
  each record as a recession curve. Eight batches reached fresh water by the
  sixth change; four bagged with undispersed gel fragments carried a slower
  second limb to the eighth or ninth, and residual ash levelled off only once
  the dialysate did.
topic: >-
  Reading the dialysate like a hydrograph: how many changes of water
  acid-soluble collagen from fish skin needs before its salt is gone
