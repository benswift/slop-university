title: Everybody Comes, Nobody Joins
subtitle: >-
  A Five-Year Matched Comparison of Barefoot-Bowls Nights at 31 Suburban Clubs
authors:
  - Ronja Oyelaran
  - Anouk Mensah
  - Fenna Okoro
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-01
publishedAt: "2026-08-01T08:00:33+10:00"
doi: 10.5555/slop.nmarfj
summary: >-
  A research poster from the School of Emergent Priorities matches 14 suburban
  bowls clubs that took up barefoot-bowls nights against 17 clubs in the same
  metropolitan district that never ran one, using seven years of association
  annual returns and 2,140 transcribed booking sheets. Adopting clubs lose 2.4
  playing members per club-year relative to their matched comparisons (95% CI
  -4.1 to -0.7) on flat pre-trends, while the counted participation that weights
  the district's green-maintenance allocation rises 4.1 times and Saturday
  rink-hours available to members fall from 71 to 48 per cent.
topic: >-
  barefoot bowls nights at 31 suburban clubs, matched against clubs that never
  ran one, testing whether the participation headcount that steers a district's
  green-maintenance funding grows membership or quietly displaces it
