summary: >-
  A research poster from the School of Emergent Priorities scores 312
  households on fourteen walking-bus routes against a five-level active-travel
  maturity model (PACE). Independent, awarded at four consecutive logged
  mornings, now gates the afternoon kiss-and-go bay; once the bay is reserved,
  Independent share rises from 8% to 31% while median walked metres among
  newly Independent households falls to 70 m, and the Active Travel office
  retains that level as the sole criterion, with no ordinary override.
topic: >-
  The walking-bus marshal scores every participating household against a
  five-level active-travel maturity model, and the school's afternoon
  kiss-and-go bay is reserved, with no ordinary override, for households the
  marshal has signed off at Independent.
