title: Under the Trampoline
subtitle: >-
  A Five-Level Maturity Model for Shire Administration of the State On-Site
  Wastewater Compliance-Certificate Scheme
authors:
  - Hedvig Anyanwu
  - Ronja Oyelaran
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
date: 2026-09-25
publishedAt: "2026-09-25T12:01:05+10:00"
doi: 10.5555/slop.3uktvl
summary: >-
  A paper from the School of Emergent Priorities establishes a five-level
  maturity model for shire administration of a state on-site wastewater
  compliance-certificate scheme, scoring 42 councils across three states and
  finding attained level predicts register completeness closely but bears no
  relationship to a stratified, unannounced field-verification resurvey of
  336 properties. The state regulator has since tied a compliance-levy
  waiver and septic-to-sewer co-funding eligibility to the score alone.
topic: >-
  Establish a five-level maturity model to certify how rural shire councils
  administer the state on-site wastewater (septic tank) system inspection
  and compliance-certificate scheme, from an unlogged paper permit file to
  predictive risk-based reinspection scheduling
