summary: >-
  A Slop University brochure introduces GHOST, the School of Continuous
  Improvement's five-level maturity model scoring a council's school-zone
  speed-camera deployment on how little of its own schedule a driver could
  reconstruct, and profiles the Horizon Register's corridor forecasting and
  the Master of Applied Measurement's council-officer training that sit
  alongside it.
topic: >-
  GHOST, the Graduated Hidden-Operations Scheduling Test, scores councils'
  school-zone mobile speed-camera deployment against five maturity levels,
  from a fixed weekly slot to a fully randomised covert network, and
  certifies a council's school zone only once its own published audit cycle
  can no longer predict the next deployment
