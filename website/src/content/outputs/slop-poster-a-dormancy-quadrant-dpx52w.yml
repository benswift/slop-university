summary: >-
  A research poster from the School of Emergent Priorities sorts a
  nine-site café chain's loyalty-app accounts into a Dormancy Quadrant,
  reading weeks since last visit against weeks since last points
  redemption across 214 accounts. Fifty-nine per cent of the accounts the
  chain's own active-member report lists as active sit in the quadrant's
  forgotten cell, logging neither a visit nor a redemption in eight or
  more weeks.
topic: >-
  tracking whether a café chain's loyalty-app points balance and visit
  streak still mean the customer is coming in, and sorting dormant
  accounts into a lapse-versus-forgotten quadrant against the chain's own
  franchise-level active-member count
