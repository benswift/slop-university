title: Memory in a Resting Mud
subtitle: Ageing, Rejuvenation and a Kovacs-Type Hump in One Batch of Bentonite Drilling Fluid
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: research-poster
school: School of Underlying Conditions
