summary: >-
  A research poster from the School of Underlying Conditions follows the
  storage modulus of one site-mixed batch of bentonite drilling fluid through
  rest, stirring and a two-step shear history. The gel stiffens logarithmically
  with waiting time, a moderate stir sets it back only part of the way, and
  samples brought to the same modulus at different holding rates overshoot that
  modulus after a common switch, by up to 11.2%, in the pattern of the Kovacs
  memory effect.
topic: >-
  ageing and memory in one batch of bentonite drilling mud: how the resting
  gel's stiffness grows with waiting time, how far a stir sets it back, and
  whether a two-step shear history leaves a Kovacs-type hump
