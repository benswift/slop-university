title: They Flatten, They Don't Shift
subtitle: Retained Lots of One Leaf Extract, Re-assayed Side by Side After up to Nine Years, Lose Efficacy Rather Than Potency
authors:
  - Brynjar Obiora
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: research-poster
school: School of Underlying Conditions
date: 2026-11-18
