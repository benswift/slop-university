doi: 10.5555/slop.ffguo5
summary: >-
  A research poster from the School of Underlying Conditions re-assays 14
  retained lots of one dried leaf extract, stored for between half a year and
  9.3 years, side by side for suppression of nitrite in stimulated macrophages.
  Every lot's IC50 stays within 0.15 log units of its release value while its
  fitted maximum falls by up to 25 points, and spiking the youngest lot's
  late-eluting fraction back into the oldest restores its maximum from 59 to 79
  per cent.
topic: >-
  retained lots of one dried leaf extract, kept up to nine years in a reference
  cabinet and re-assayed side by side for macrophage nitric-oxide suppression,
  lose efficacy rather than potency as they age
