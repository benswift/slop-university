summary: >-
  A research-showcase brochure from the School of Continuous Improvement
  introduces the Stand-In Rule, a mail rule fitted across a firm's inboxes that
  withdraws the return date from any out-of-office reply after nine days and
  names a colleague who has agreed to be asked instead, and pairs it with seven
  of the University's published studies of workplace presence and absence.
topic: >-
  Nine days is the longest absence an out-of-office reply may announce before a
  mail rule, built and fitted across a firm's inboxes, swaps the promised return
  date for the name of a colleague who has agreed to be asked instead, and a
  brochure asks whether anyone is ever really away
