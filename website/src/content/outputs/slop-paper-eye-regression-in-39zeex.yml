title: Light Down the Pipe
subtitle: Opsin Expression and Ommatidial Remnants in a Stygobitic Amphipod from Capped and Uncapped Monitoring Bores
authors:
  - Vigdis Emenike
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-10
publishedAt: "2026-10-10T01:02:55+11:00"
doi: 10.5555/slop.39zeex
summary: >-
  A paper from the School of Underlying Conditions surveys an undescribed
  groundwater amphipod in fourteen monitoring bores, eight capped and six long
  uncapped, and then exchanges the caps on six of them for eleven months. It
  finds that neither the number of ommatidial remnants nor the expression of
  two phototransduction genes differs with the daylight a missing cap admits,
  and that the eye differences among bores divide instead between two
  mitochondrial lineages occupying the shallow and deep halves of the network.
topic: >-
  eye regression in bore-dwelling amphipods: whether opsin expression and
  ommatidial remnants in an undescribed stygobitic amphipod track the light
  admitted by uncapped monitoring bores
