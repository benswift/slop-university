summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 sets 1.38
  million path-loss readings on short radio links against the planning models
  its collaborators used to predict them, across a seven-laboratory comparison
  of building materials, platform walks beneath small radio units, rooftop links
  paired with weighing rain gauges, and a year of weekly measurement through a
  street-tree canopy. It reports the setting each collaborator changed and kept,
  from a leading-indicator rerouting rule to a status-board state for links not
  yet tested by rain and a seasonal foliage allowance in place of a fixed one.
