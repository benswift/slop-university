summary: >-
  A brochure from the School of Emergent Priorities showcases the
  University's civic-administration research programme, from compliance
  delay surveyed directly from the duty officers who administer state
  schemes to the record a public consultation leaves behind once the meeting
  ends, alongside five previously published outputs drawn from across the
  civic-life corpus.
