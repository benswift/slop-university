doi: 10.5555/slop.5cys9k
summary: >-
  A research poster from the School of Emergent Priorities closely reads the
  1,186 clauses carrying a verb of perception in 36 commissioning reports from
  one observatory, nine instruments each reported at four stages, and codes
  each clause for its grammatical subject. It finds the instrument taking the
  verb of seeing from the astronomers at first light and holding it at handover
  in eight of the nine, and reads the calibration unit's handover report, which
  closes on a night assistant who "looked again", as the one that gives it back.
topic: >-
  The spectrograph saw: a close reading of prosopopoeia in one observatory's
  instrument commissioning reports, where verbs of seeing pass from the
  astronomers to the instrument between first light and routine operations
