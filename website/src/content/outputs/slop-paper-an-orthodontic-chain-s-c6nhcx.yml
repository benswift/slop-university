title: The Number It Said First
subtitle: >-
  Actual Time-to-Bracket-Removal Across a Multi-Clinic Orthodontic Chain
  Tracks the Treatment-Planning Software's First-Quoted Estimate, and
  Migrates With a Platform Update That Changed How the Estimate Rounds
authors:
  - Anouk Mensah
  - Runa Adegoke
preset: paper
school: School of Emergent Priorities
date: 2026-08-13
publishedAt: "2026-08-13T00:01:05+10:00"
doi: 10.5555/slop.c6nhcx
summary: >-
  A paper from the School of Emergent Priorities matches 6,842 orthodontic
  patients' software-quoted treatment-length estimates against their actual
  bracket-removal dates across 21 clinics, finding removal dates cluster
  tightly around the exact month first quoted (bunching ratio 5.8x)
  regardless of clinic-level case-mix severity. A mid-study platform update
  that narrowed the software's rounding from six-month to three-month
  increments shifted the clustering to match the new granularity, and a
  clinician quote-confirmation step introduced to counteract the effect left
  the pattern statistically unchanged.
topic: >-
  an orthodontic chain's software-generated treatment-length estimate for
  braces, tested against actual time-to-removal across multiple clinics, and
  whether removal timing drifts toward whichever round number the software
  first quoted
