title: "Towards a Reason Code for Every Copy"
subtitle: "Sheet-Music Compliance in Community Choirs"
authors: ["Solveig Adeyemi", "Renke Sabel", "Joost Nwosu"]
preset: paper
school: School of Continuous Improvement
date: 2026-09-11
publishedAt: "2026-09-11T06:02:30+10:00"
doi: 10.5555/slop.q86yii
summary: >-
  A paper from the School of Continuous Improvement interviews thirteen
  music librarians and forty-two singers across nine suburban choirs on the
  vocabulary they use to describe managing photocopied scores under a
  regional choral association's new compliance ledger, and reports the
  association's subsequent adoption of that vocabulary as a mandatory
  reason-code taxonomy applied to every logged copy regardless of copyright
  status.
topic: >-
  An interview study, in the words of a community choir's music librarian
  and singers, of how they describe managing sheet-music copies under a new
  score-tracking compliance scheme meant to curb unlicensed photocopying,
  and how the licensing body's response to the findings is to require every
  photocopy request be logged with a reason code regardless of the piece's
  copyright status
