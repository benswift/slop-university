summary: >-
  A research poster from the School of Underlying Conditions estimates local
  projections of foreign-exchange reserves across 61 sudden-stop episodes in 41
  anonymised small open economies, finding that economies in the deepest
  drawdown tercile were still accumulating reserves thirty quarters on, at +9.1
  percentage points of GDP by quarter 36 against a model-implied need of +3.4.
  The persistence survives controls for debt, money and exchange-rate motives
  and central-bank governor turnover, and coincides with written
  reserve-adequacy floors that no economy in the panel later lowered.
topic: >-
  The depth of a sudden stop's reserve drawdown sets how long a small open
  economy goes on accumulating foreign-exchange reserves afterwards, well past
  what the precautionary motive can explain
