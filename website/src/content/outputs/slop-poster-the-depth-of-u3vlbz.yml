title: Filled Past the Brim
subtitle: Sudden-Stop Drawdown Depth and a Decade of Reserve Accumulation in Small Open Economies
authors:
  - Vigdis Emenike
  - Kwame Lindqvist
  - Ragnhild Uzoma
