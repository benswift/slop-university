doi: 10.5555/slop.u72nta
summary: >-
  A single-site case study of a suburban home-brewing club's staggered
  introduction of MASH, a formal appeal procedure for disputed competition
  placings, finding that member satisfaction tracks awareness of the
  channel's existence rather than any measurable gain in judging accuracy,
  with a teaching note appended for classroom use.
topic: >-
  At a suburban home-brewing club, the Competition Steward Committee
  formalises MASH -- the Member Appeal and Steward Hearing procedure -- after
  members disputed brew-competition placings; a single-site case study in
  earnest business-case register, with a teaching note appended, finds member
  satisfaction with a placing is explained almost entirely by whether MASH
  exists to be invoked, not by whether a re-judged placing was itself more
  accurate
