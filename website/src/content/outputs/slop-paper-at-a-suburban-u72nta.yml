title: MASH
subtitle: Member Appeal and Steward Hearing at a Suburban Home-Brewing Club
authors:
  - Bram Ntuli
  - Casimir Beng
  - Osei Vandermeer
preset: paper
school: School of Continuous Improvement
date: 2026-09-17
