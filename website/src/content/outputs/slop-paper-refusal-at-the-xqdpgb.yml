title: Refusal at the Bed
subtitle: Hot-Water Boreholes That Stopped Short in Debris-Rich Basal Ice Mark the Sticky Spots beneath a Tidewater Outlet Glacier
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-28
publishedAt: "2026-10-28T02:01:26+11:00"
doi: 10.5555/slop.xqdpgb
summary: >-
  A paper from the School of Underlying Conditions reads fifteen hot-water
  boreholes on one reach of a High Arctic tidewater outlet glacier against a
  blind control-method inversion of the same season's surface velocities. The
  four holes that stopped 7 to 14 m above the bed in debris-rich basal ice all
  sit in the three patches of highest basal traction, which cover about 13% of
  the reach and carry about 38% of its basal drag, while the eleven holes that
  reached the bed sampled only the weaker bed.
topic: >-
