summary: >-
  A research poster from the School of Underlying Conditions traces every soil
  descriptor in 70 weekly site-meeting minutes of a former town gasworks
  remediation to the occupational group that first used it. Seventeen
  descriptors in the first twenty weeks narrow to three by week 40, all first
  heard from excavator operators, and by week 52 the stockpile register's
  classes carry the crew's names while laboratory results still set each pile's
  final class.
topic: >-
  stained, tarry, black: how an excavator crew's words for coal-tar-impacted
  soil became the waste categories of a former gasworks remediation project,
  traced through seventy weeks of site meeting minutes
