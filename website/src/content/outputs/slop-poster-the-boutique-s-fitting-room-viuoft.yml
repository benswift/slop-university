title: RAIL
subtitle: >-
  Return Allocation Intelligence Layer for Fitting-Room Re-Shelving Priority
authors:
  - Ronja Oyelaran
  - Anneke Tolan
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
