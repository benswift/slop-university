doi: 10.5555/slop.viuoft
summary: >-
  A research poster from the School of Emergent Priorities describes RAIL, a
  fitting-room RFID system that scores garment re-shelving urgency from
  co-try-on patterns across six boutiques in one strip mall. The mall's
  tenancy body has adopted RAIL's nightly shrinkage-risk score as the sole
  criterion for renewing a boutique's fitting-room floor space at each
  six-monthly lease review, with no discretionary override.
topic: >-
  The boutique's fitting-room attendant hands re-shelving priority to RAIL, a
  system that reads garment RFID tags at the return rail to score each item's
  co-try-on urgency; the strip mall's tenancy body has adopted RAIL's
  shrinkage-risk score as the sole criterion for renewing a boutique's
  fitting-room floor space at each lease review.
