summary: >-
  A marketing poster presents the University's isotope work as the capability
  to read, in the water a tree holds, the depth of ground it was drawn from,
  and points passers-by to the study of dry-season water uptake beneath the
  remnant eucalypts of a granite paddock. Prepared for the portrait signage
  panels in matched daylight and evening renderings, with a short reading list
  from the University's published record.
