summary: >-
  A research poster from the School of Emergent Priorities follows 163 plumbing
  enquiries on one 2,140-member neighbourhood forum whose pinned
  most-recommended list still ranks a retired plumber first, and records the
  University's adoption of a Third-Name Rule for its own contractor panels.
topic: >-
  The pinned most-recommended tally of one suburban neighbourhood forum keeps
  sending households to a plumber who retired, because every plus-one ever
  posted still counts; a single-site teaching case, and the Third-Name Rule the
  University sets for its own contractor panels
