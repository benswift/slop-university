doi: 10.5555/slop.5n147t
summary: >-
  A research poster from the School of Continuous Improvement samples surface
  soil at five stations from crown to lowest corner on twelve community sports
  grounds irrigated with recycled water and four on potable water, finding
  carbamazepine a median 3.6 times higher at the low corner on ten of the
  twelve and sul1 per 16S rRNA gene copy 2.6 times higher on the same ten,
  with no gradient on a sand-profile ground or a laser-levelled, drained one.
topic: >-
  pharmaceutical residues and antibiotic resistance genes in the downslope
  corners of community sports grounds irrigated with recycled water
