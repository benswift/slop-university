summary: >-
  A prospectus brochure from the School of Underlying Conditions invites
  prospective students to study ionic liquids at the teaching-laboratory bench,
  at saline monitoring bores and on a shared property chart kept with the
  Master of Applied Measurement. It sets three pathways and the researchers who
  lead them beside five published studies from across the University, cited by
  title and DOI.
