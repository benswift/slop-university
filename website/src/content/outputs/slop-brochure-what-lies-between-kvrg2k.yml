summary: >-
  A research-showcase brochure from the School of Underlying Conditions presents
  interpolation as a discipline the University's schools share, setting the
  geologist's cross-section drawn between two drill cores beside the logician's
  interpolant between a premise and its conclusion, the hydrogeologist's
  reasoning between two bore readings, and a proof that holds across chemical
  conventions, and carried by eight published University studies.
