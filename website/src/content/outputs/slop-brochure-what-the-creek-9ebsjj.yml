summary: >-
  A civic brochure from the School of Emergent Priorities invites the town
  below a treatment works into the University's public work on antibiotic use
  and resistance, in features on open walks along the creek, a seminar series
  held in the town library on a medicine kept working in common, and
  first-light sampling with the sports clubs whose grounds lie closest to the
  water. It cites six published studies from three Schools by title and DOI.
