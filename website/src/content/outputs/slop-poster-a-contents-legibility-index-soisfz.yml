title: What the Shared Fridge Already Knew
subtitle: Validating a Contents-Legibility Index Against Meeting-Room No-Shows
authors:
  - Osei Vandermeer
  - Bram Ntuli
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-21
publishedAt: 2026-08-21T12:01:44+10:00
doi: 10.5555/slop.soisfz
summary: >-
  A research poster from the School of Continuous Improvement scores three
  shared office fridges on a five-point contents-legibility rubric across a
  14-week pilot and checks the resulting weekly index against the same
  floor's meeting-room no-show rate. The two blind raters hold good
  agreement throughout (kappa = 0.71) and the legibility index falls
  steadily over the trial, but the index shows no reliable association with
  the floor's own attendance record (r = -0.02, n = 14 weeks).
topic: >-
  a contents-legibility index scored from three months of shared-fridge
  photographs in one open-plan office, tested against the team's
  meeting-room no-show rate over the same period
