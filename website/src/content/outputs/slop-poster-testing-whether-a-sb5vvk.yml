title: Counted in the Chat, Missed on the Calendar
subtitle: >-
  Group-Chat Reaction Counts Against Booking-App Uptake, One School Holiday
  Program
authors:
  - Petra Umbile
  - Marek Solheim
  - Anouk Mensah
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-06
publishedAt: "2026-09-06T03:03:15+10:00"
doi: 10.5555/slop.sb5vvk
summary: >-
  A research poster from the School of Emergent Priorities logs peak
  fire-emoji counts against booking-app fill times for 58 school
  holiday-program sessions across a full season, finding no measurable
  association between how a session's announcement is received in the
  parents' group chat and how quickly its slots are booked. The chat's
  reaction tally still opens the program's weekly capacity report
  unchanged.
topic: >-
  testing whether a school holiday-program session's fire-emoji count in
  the parents' group chat predicts how fast its slots fill on the booking
  app -- a duty officer's season-long comparison finds no relationship at
  all, reported as the null it is
