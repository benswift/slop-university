summary: >-
  A display advertisement for the School of Settled Matters takes a dung-beetle
  synonymy from the University's own record, in which a horned and a hornless
  morphospecies proved to be the major and minor males of one species, and
  presents the withdrawn elevational boundary as a question closed on the
  evidence.
topic: >-
  two names, one beetle: a display ad for the University's dung-beetle
  taxonomy, selling a species boundary closed on the evidence as a settled
  matter
