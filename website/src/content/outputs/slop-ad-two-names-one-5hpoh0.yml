title: Two Names. One Beetle.
subtitle: >-
  A marketing poster for the School of Settled Matters, setting a horned and a
  hornless dung beetle on one specimen tray below a staked mountain transect,
  for landscape signage panels.
authors:
  - Odalys Penhallow
