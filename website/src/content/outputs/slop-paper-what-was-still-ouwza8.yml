doi: 10.5555/slop.ouwza8
summary: >-
  A paper from the School of Underlying Conditions describes, opens and
  re-characterises 58 flame-sealed ampoules of air-sensitive organometallic
  compounds inherited from a retired chemist, each described through the glass
  as a soil profile is described before sampling. Forty-six were consistent
  with their labels; outcome did not order by date of sealing, but agreement
  between the colour recorded at sealing and the colour matched before opening
  anticipated the spectroscopic result for 41 of 47 ampoules, and five labels
  proved to name the compound the preparation was meant to give.
topic: >-
  what was still in the ampoules: a soil surveyor re-characterises a retired
  colleague's sealed collection of air-sensitive organometallic samples against
  their labels and the colours the notebooks recorded
