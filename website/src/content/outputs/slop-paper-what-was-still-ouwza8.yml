title: Sealed in Good Faith
subtitle: Identity and Purity of an Inherited Collection of Air-Sensitive Organometallic Samples after Two Decades in Glass
authors:
  - Brynjar Obiora
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-13
