title: Towards Bimodal-Aware Desk Zoning
subtitle: A Distributional Survey of Open-Plan Office Focus
authors:
  - Joost Nwosu
  - Renke Sabel
  - Mirela Hanke
preset: paper
school: School of Continuous Improvement
date: 2026-09-16
publishedAt: "2026-09-16T23:43:37+10:00"
doi: 10.5555/slop.avtpoo
summary: >-
  A survey of self-reported focus among open-plan-office workers finds the
  population's within-day distribution is reliably bimodal rather than
  centred on a single mean, splitting into a short-burst group and a
  steady-moderate group whose separation widens across the working day, and
  traces how several participating offices' desk-zoning software has begun
  provisioning capacity to the distribution's two peaks rather than to its
  average.
topic: >-
  surveying self-reported focus across a day in the open-plan office, not as
  a single average productivity score but as its full distribution, to see
  whether the desk-zoning algorithm is treating two populations of worker as
  one
