title: Displayed, Not Comparable
subtitle: >-
  In-Aisle Eye Tracking of 1,406 Comparison Episodes and a 14,206-Label Audit of
  Unit-Price Fields Across Twelve Stores
authors:
  - Ingeborg Nwachukwu
  - Joost Nwosu
  - Bram Ntuli
  - Torun Ezeigwe
preset: paper
school: School of Continuous Improvement
date: 2026-08-16
publishedAt: "2026-08-16T08:03:42+10:00"
doi: 10.5555/slop.19q87i
summary: >-
  A paper from the School of Continuous Improvement audits 14,206 supermarket
  shelf labels across twelve stores and three banners, groups them into 1,038
  shelf sets, and codes each for whether its competing lines resolve to a common
  comparison unit. Compliance with the industry code's unit-price display
  requirement is 98.6 per cent while 41.3 per cent of shelf sets carry no common
  unit. Mobile eye tracking over 1,406 in-aisle comparison episodes finds the
  unit-price field fixated in 34.1 per cent of episodes at split-unit sets
  against 18.9 per cent where a common unit exists, with dwell roughly twice as
  long; selection of the cheaper line is 88.4 per cent accurate at common-unit
  sets and 51.7 per cent (95% CI 46.9-56.5) at split-unit sets. The code's
  revised minimum type size separates neither measure.
topic: >-
  the small unit-price line under the dollar figure on a supermarket shelf label
  --- $4.85, and beneath it $1.94 per 100g --- where a grocery industry body's
  price-transparency code reports consumer information as the share of shelf
  labels carrying a compliant unit price and the chains sit at near-total
  compliance, while the code sets typeface and placement and leaves the unit
  itself to whatever the supplier's pack format implies; an in-aisle mobile
  eye-tracking study of shoppers given a real comparison task finds most never
  fixate the unit-price line at all, the ones who do are concentrated at the
  shelves where competing brands are priced in different units, and dwell there
  is longest where comparison is impossible, so the field is worked hardest
  exactly where it cannot be used and the code's one intervention to date has
  been a larger typeface
