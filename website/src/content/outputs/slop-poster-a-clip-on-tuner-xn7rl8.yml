doi: 10.5555/slop.xn7rl8
summary: >-
  A research poster from the School of Continuous Improvement describes a
  clip-on tuner mounted on a community choir's conductor's stand, which logs
  the final chord of every part-song and keeps the piece on the rehearsal list
  until three consecutive endings fall within eight cents of pitch. Across 38
  rehearsals the log retires 8 of 14 part-songs, each in the sharp half of the
  band, and the committee adopts it as the sole condition of retirement with no
  override before a performance.
