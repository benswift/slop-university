title: Towards a Retirement Age for the Part-Song
subtitle: A Clip-On Tuner Log for a Community Choir's Repertoire, and the Three-in-a-Row Rule
authors:
  - Edda Nwafor
  - Joost Nwosu
  - Dagny Okafor
