summary: >-
  A marketing poster for Slop University announces Where One Basin Ends, a
  Futures in Committee session at which Dr Brynjar Obiora of the School of
  Underlying Conditions takes up the magnetic pendulum, whose resting place
  turns on differences in release finer than any surveyed line can mark.
  Pictures a surveyor's tripod and plumb bob over three magnets in a paddock of
  interlocking basins, for bus-stop panels and campus digital signage in a
  landscape rotation.
