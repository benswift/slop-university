title: Enrolled, and Already Attending
subtitle: >-
  An Incremental Cost Analysis of a Veterinary Preventive-Care Plan Across 22
  Clinics
authors:
  - Mirela Hanke
  - Kwame Lindqvist
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
