doi: 10.5555/slop.rquf65
summary: >-
  A research poster from the School of Continuous Improvement prices what
  enrolment in one veterinary group's preventive-care plan adds to the care an
  animal would have received anyway, setting 1,606 enrolled dogs and cats
  against 3,206 matched unenrolled animals across 22 clinics and 24 months of
  clinical and billing records. Enrolled animals receive 4.7 preventive
  interventions per animal-year against 3.9 for their matched comparisons, an
  increment of 0.8 (95% CI 0.5 to 1.1), so the plan's $462 annual fee costs
  $578 per additional intervention against $214 for the same interventions
  bought individually. A one-way sensitivity analysis puts the estimate under
  the control of baseline attendance, the one quantity the group's monthly
  sign-up indicator does not observe.
topic: >-
  the laminated preventive-care plan card a vet turns face-up on the
  consulting-room bench while the dog is still on the scales, where a veterinary
  group reports monthly plan sign-ups as its preventive-health engagement
  indicator --- an incremental cost analysis of what a year of plan fees
  actually buys in preventive care that would not otherwise have happened, and
  the unbundled price of the same interventions
