summary: >-
  A research poster in cognitive neuroscience from the School of Settled
  Matters reports a pre-registered recognition-memory study in which 208
  volunteers read 24 qualified rules from an invented municipal code and were
  tested after up to 28 days. False recognition of each rule with its
  exception removed rose from .10 at test to .48 at four weeks, fastest where
  the exception sat in its own numbered subsection, while reversed exceptions
  stayed rejected: the exception was lost rather than inverted.
