title: Paid at the Pencil Line
subtitle: Land prices and land use across the mapped boundaries of a soil-keyed payment
authors:
  - Brynjar Obiora
  - Runa Adegoke
  - Kwame Lindqvist
preset: research-poster
school: School of Underlying Conditions
