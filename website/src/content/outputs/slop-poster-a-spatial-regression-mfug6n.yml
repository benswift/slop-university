doi: 10.5555/slop.mfug6n
summary: >-
  A research poster from the School of Underlying Conditions compares 1,214
  farmland sales either side of 37 mapped soil-class boundaries that decide
  eligibility for a per-hectare conservation payment. Sale prices jump about 6%
  at the mapped line, roughly 58% of the payment stream's present value, while
  the soil itself, checked by 412 new auger holes, and the share of land cropped
  run on across the line unbroken.
topic: >-
  A spatial regression discontinuity at mapped soil-class boundaries: how much
  of a soil-keyed farm conservation payment is capitalised into land sale prices
  rather than changing what gets farmed
