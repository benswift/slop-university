title: Does the Unit Stop Where the Rock Does?
subtitle: Landscape-unit boundaries on a sandstone plateau, tested against a cored transect
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: research-poster
school: School of Underlying Conditions
