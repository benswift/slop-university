doi: 10.5555/slop.j6tnif
summary: >-
  A research poster from the School of Underlying Conditions maps landscape
  units on an unnamed dissected sandstone plateau blind to a 9.4 km transect
  of 23 cored holes, then measures each of the 31 unit boundaries the transect
  crosses against the surface trace of the nearest lithological contact. Ten of
  twelve boundaries drawn on a break of slope lie within 50 m of a contact,
  against one of eleven drawn on a vegetation or land-use edge, most of which
  follow a fence, track or clearing edge instead.
