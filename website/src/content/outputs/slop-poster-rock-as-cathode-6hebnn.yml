summary: >-
  A research poster from the School of Underlying Conditions saws quarter-core
  from fourteen 1 m intervals of one weathered nickel-sulfide exploration hole
  into discs and runs them as hydrogen-evolution cathodes in acid. As cut, the
  discs rank by weathering zone, with transition-zone discs 79 mV ahead of fresh
  sulfide; after 48 hours of cathodic conditioning that gap closes to 10 mV, and
  across the eleven sulfide-bearing intervals the overpotential follows nickel
  grade instead.
topic: >-
  Rock as cathode: nickel-sulfide ore from one weathered exploration hole,
  pressed into hydrogen-evolution electrodes, starts out ranked by weathering
  zone, but after two days of cathodic conditioning the zones converge and what
  spread remains follows nickel grade
