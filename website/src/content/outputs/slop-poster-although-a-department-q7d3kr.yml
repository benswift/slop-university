summary: >-
  A research poster from the School of Emergent Priorities fits three reed-switch
  latch loggers to nine departmental photocopiers and records the order in which
  users open the doors across 1,104 jams, finding Door A opened first in 72% of
  jams whichever door the panel names, and records Facilities re-lettering each
  panel to the door most often opened first.
topic: >-
  Although a department photocopier's jam panel names the one door to open, users
  open whichever door is nearest first; a three-latch reed-switch logger fitted
  to nine copiers recorded the order users actually opened the doors, and
  Facilities re-lettered each panel to name the door most often opened first
  rather than the door where the jam sat
