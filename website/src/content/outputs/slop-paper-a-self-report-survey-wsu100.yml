title: Waved At, Not Yours
subtitle: >-
  A Population Survey of Vehicle Misidentification at the Bus Stop, Car Park,
  and School-Run Kerb
authors:
  - Tove Ilesanmi
  - Verity Marris
  - Lindiwe Achterberg
preset: paper
school: School of Emergent Priorities
date: 2026-09-25
publishedAt: "2026-09-25T23:01:05+10:00"
doi: 10.5555/slop.wsu100
summary: >-
  A paper from the School of Emergent Priorities surveys 412 caregivers,
  commuters, and drivers on how often they wave at, approach, or step toward
  a vehicle that is not theirs while waiting at the bus stop, the car park,
  and the school-run kerb, and reports Facilities' decision to require an
  identification placard at every high-incidence site despite a parallel
  pilot finding no effect on the reported rate.
topic: >-
  a self-report survey of caregivers and commuters at the bus stop, the car
  park, and the school-run kerb on how often they wave at, approach, or step
  toward the wrong vehicle while waiting for their own, reported as
  distributions of misidentification attempts across the three settings
