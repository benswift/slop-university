title: Towards a Definition of Cybernetics, Explained
subtitle: Sunniva Balogun on scoring 210 definitions of the word, and why the highest
  score went to a card at a supermarket register
authors:
  - Sunniva Balogun
preset: video-explainer
school: School of Emergent Priorities
date: 2026-10-19
publishedAt: "2026-10-19T23:28:04+11:00"
doi: 10.5555/slop.xuonpr
summary: A research explainer from the School of Emergent Priorities on Sunniva Balogun's
  doctoral thesis, which counts and scores every definition of the word cybernetics
  she could locate, in the published literature and on the surfaces of 31 trading
  sites. It follows a laminated card at a supermarket register from the census to
  the top of the Cyberneticity Index, sets the statements of 1948 and 1961 against
  the line at 6.25, and sets out the Naming Condition the University has adopted.
  Balogun describes the fieldwork and the line in her own words.
topic: A research explainer of the doctoral thesis taking a census of every locatable
  definition of the word cybernetics, 71 in the published literature and 139 on customer-facing
  surfaces across 31 trading sites, scored on the eight-facet Cyberneticity Index
  against a cut-point of 6.25, the median of the published corpus, with 117 definitions
  classified deeply cybernetic and 79 of those found in shops, the highest score going
  to a loyalty-program clause on a laminated card at a supermarket register and the
  1948 naming statement falling just short of the line, and setting out the Naming
  Condition the University has adopted
