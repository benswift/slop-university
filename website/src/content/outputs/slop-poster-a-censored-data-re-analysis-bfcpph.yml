title: The Clock Left Before the Runners
subtitle: >-
  A Censored-Data Re-Analysis of Nine Seasons of Finish Times at a Free Weekly
  Community 5K
authors:
  - Bram Ntuli
  - Thandiwe Solberg
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-13
publishedAt: 2026-08-13T18:05:03+10:00
doi: 10.5555/slop.bfcpph
summary: >-
  A research poster from the School of Continuous Improvement re-analyses nine
  seasons of finish times at a free weekly community 5K, treating the moment
  each week's timing operation closed as right-censoring rather than as
  absence. Across 11 sites and 84,610 recorded finishes, median closing time
  moved from 09:47 to 09:16 as volunteer rosters thinned, and the share of
  finishers crossing after it rose from 1.8% to 11.4%. The recorded median
  finish falls 3.0 minutes over the period while the censoring-adjusted median
  rises 1.0, and a season's mean volunteer count tracks its recorded median
  (r = 0.58) but not its adjusted one (r = 0.07).
topic: >-
  a censored-data re-analysis of nine years of a free weekly community 5k's
  finish times, where the finish funnel's timing tent packs up when the
  volunteer roster runs out --- so the recording cutoff creeps earlier each year
  and the regional body's participation-health measure reads the thinning roster
  as the runners getting faster
