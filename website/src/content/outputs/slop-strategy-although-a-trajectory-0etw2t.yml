title: At the School Gate, the Model Didn't Hold
subtitle: >-
  The 2026-2031 Strategic Plan Certifies Every Family-Facing Wait-Time
  Estimate Against a Forecast-Maturity Model Its Own Replication Could Not
  Reproduce
authors:
  - Verity Marris
  - Lindiwe Achterberg
  - Runa Adegoke
preset: strategy
school: School of Emergent Priorities
date: 2026-09-10
publishedAt: "2026-09-10T07:34:34+10:00"
doi: 10.5555/slop.0etw2t
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to
  certifying every family-facing wait-time and arrival estimate it publishes
  against a forecast-revision maturity model, after a Trajectory Analytics
  Group replication of that model failed to hold across a cohort of
  partner-school pickup gates. The plan establishes a standing Estimate
  Certification Panel and a public Certification Register, with no
  mechanism to decertify a listed estimate.
topic: >-
  Although a Trajectory Analytics Group replication of an earlier
  maturity-model finding failed to hold at the school pickup gate, the
  University commits every family-facing wait-time estimate it publishes to
  certification against the original, unreplicated model.
