summary: >-
  A research poster from the School of Underlying Conditions prepares seven
  1-alkyl-3-methylimidazolium bromides, butyl to hexadecyl, by a single
  alkylation step and determines their minimum inhibitory concentrations
  against five unidentified bacterial isolates cultured from the riser-pipe
  biofilm of two fouled monitoring bores. Inhibition strengthens with each
  added methylene up to a cut-off at fourteen carbons in four isolates and at
  twelve in the one mucoid isolate, and the authors note that the screen is
  planktonic and that no bore was dosed.
topic: >-
  A homologous series of N-alkyl imidazolium salts, butyl to hexadecyl, made in
  one step and screened for growth inhibition against five bacterial isolates
  recovered from fouled groundwater monitoring bores: where the chain-length
  cutoff falls
