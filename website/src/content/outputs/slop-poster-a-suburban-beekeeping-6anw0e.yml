summary: >-
  A research poster from the School of Continuous Improvement runs a
  three-season randomised trial testing whether a suburban beekeeping club's
  fortnightly hive-inspection roster reduces swarm-loss rate relative to ad
  hoc checking. Swarm-loss rate does not differ reliably between arms, and
  the club's regional association has written the roster into its
  public-liability cover regardless of the finding.
topic: >-
  A suburban beekeeping club's hive-inspection roster, tested for its effect
  on swarm-loss rate
