summary: >-
  A research showcase from the School of Underlying Conditions presents the
  University's work on hybrid renewable energy systems as a set of
  relationships rather than a list of components, under four features: sizing
  an array against the bore it pumps from, the standby source and what it
  delivers, the ground beneath the racks, and the controller that keeps the
  sources in step. It points readers to seven published studies by title and
  DOI.
topic: >-
  more than one source: a research showcase of the University's work on hybrid
  renewable energy systems, how sun, wind, batteries and a standby generator
  are sized, dispatched and kept in step at sites at the end of a long line
