doi: 10.5555/slop.rifu2s
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities reports three iterations of a six-lesson peace education unit in
  which 71 Year 9 students, assigned to the two sides of a simulated paddock
  boundary dispute, augered the ground across the fence themselves. Students
  who bored by party used the soil as ammunition; those who described each
  hole on a shared card went on to ask who had decided the fence, and 17 of 23
  later named a procedure for settling an unrelated dispute, against 5 of 23
  in the first iteration.
topic: >-
  Walking the disputed fence: a design-based study of a peace education unit
  in which secondary students re-survey a contested paddock boundary and learn
  that the line was decided, not found
