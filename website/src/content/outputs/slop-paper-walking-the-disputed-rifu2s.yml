title: Walking the Disputed Fence
subtitle: A Design-Based Study of a Boundary Unit in Secondary Peace Education
authors:
  - Brynjar Obiora
  - Lindiwe Achterberg
preset: paper
school: School of Underlying Conditions
date: 2026-10-13
