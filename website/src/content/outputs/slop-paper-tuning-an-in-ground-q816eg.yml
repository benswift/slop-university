doi: 10.5555/slop.q816eg
summary: >-
  An engineering paper from the School of Settled Matters and the School of
  Underlying Conditions levels six flush-mounted 85 kHz inductive charging pads
  in one depot bay row for five years, finding settlement of 5.8 to 15.5 mm,
  and projects each pad to fifteen years. Tuned for the fleet's commissioning
  gaps, one pad falls out of its inverter's coupling window after 4.1 years and
  delivers rated power in 87% of sessions by year fifteen; retuning every
  receiver recovers those sessions at 0.29 points of efficiency everywhere,
  while a primary-side tap on that one pad recovers them alone, and the paper
  asks that commissioning records carry each pad's survey datum.
topic: >-
  tuning an in-ground inductive charging pad for the coupling it will have
  after years of pavement settlement, not the air gap it was commissioned at
