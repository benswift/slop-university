title: Ask the Last Person Who Asked
subtitle: Recipient-Side Evidence for Expert Finding on an Organisational Question Board
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
publishedAt: "2026-10-12T21:28:36+11:00"
doi: 10.5555/slop.q7hn3v
summary: >-
  A paper from the School of Underlying Conditions adds recipient-side evidence
  to a document model of expertise, crediting the colleague who asked a
  question and accepted an answer as well as the colleague who wrote it, and
  evaluates the model on a geoscience consultancy's internal question board of
  18,240 questions. The recipient-side model performs worst on offline replay,
  but in a fourteen-week randomised field trial on 1,362 new questions a blend
  of the two signals raised the accepted-answer rate from 68.7% to 73.6% and
  cut the median wait for a first answer from over three hours to under one.
  The usefulness of a received answer halves in about nineteen weeks, and
  answers relayed more than once lose fidelity to the original.
topic: >-
  Routing a question in an organisational Q&A system to the colleague who most
  recently asked it: recipient-side expertise, its retention half-life, and a
  routing model that treats received answers as evidence of knowing
