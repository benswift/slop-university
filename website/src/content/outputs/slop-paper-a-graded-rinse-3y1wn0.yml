summary: >-
  A paper from the School of Underlying Conditions and the School of
  Continuous Improvement compares four ways of rinsing a viscous deep eutectic
  extractant out of packed columns of three soil horizons. An abrupt switch to
  water fingered at every practical rate and recovered at most 77 per cent of
  the extract within 1.5 pore volumes, while three intermediate solvent–water
  banks stepped in equal falls of log-viscosity recovered 94 per cent and
  reached 95 per cent at 1.8 pore volumes, for half a pore volume of fresh
  solvent.
topic: >-
  a graded rinse: recovering a viscous deep eutectic solvent extract from packed soil columns by stepping the water rinse's solvent fraction down in stages, so the displacement front does not finger
