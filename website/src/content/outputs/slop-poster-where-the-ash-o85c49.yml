summary: >-
  A research poster from the School of Settled Matters traces one late-glacial
  cryptotephra through nine cores from a small upland maar lake, from the deep
  basin to the shore, and places its first rise and its shard peak against
  each core's cooling onset. The rise sits 2 to 3 cm below the onset in every
  core, while the peak climbs 4 to 6 cm above it at the margin, where ash
  washed off the crater walls after the cooling began; picked at the rise, the
  ash precedes the cooling by two to five decades, and picked at a marginal
  peak, the cooling appears to precede the eruption.
topic: >-
  Where the ash settles: placing a single cryptotephra isochron across nine
  cores from a small upland maar lake, where marginal cores carry a
  redeposited shard peak above the primary fall, so the rise and not the peak
  fixes the horizon, and the late-glacial cooling onset moves from leading the
  ash to lagging it
