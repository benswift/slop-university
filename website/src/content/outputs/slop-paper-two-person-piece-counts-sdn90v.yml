title: Two-Person Piece Counts Do Not Reduce Piece Loss in a Postal Jigsaw-Lending Club
subtitle: A Stepped-Wedge Comparison Across 1,184 Circulations and Two Lending Seasons
authors:
  - Kwame Lindqvist
  - Runa Adegoke
  - Ronja Oyelaran
  - Lindiwe Achterberg
preset: paper
school: School of Emergent Priorities
date: 2026-08-16
publishedAt: 2026-08-16T21:04:58+10:00
doi: 10.5555/slop.sdn90v
summary: >-
  A paper from the School of Emergent Priorities evaluates a two-person
  handover count in a postal jigsaw-lending club, in which the sending and
  receiving custodians count a puzzle independently and reconcile before the
  circulation closes. Across six branches, fourteen four-week periods, and
  1,184 circulations, the protocol produces no detectable reduction in piece
  loss (adjusted difference -0.04 pieces per circulation, 95% CI -0.31 to
  0.23), while verification effort accumulates to 852 counter-hours; the null
  is reported in full, and the club retains the protocol and reports its
  counter-hours as a member-participation figure.
topic: >-
  Two-person piece counts at every handover in a postal jigsaw-lending club,
  tested for whether they actually reduce piece loss, and what the club does
  with the counting protocol once the answer comes back null
