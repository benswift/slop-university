doi: 10.5555/slop.p1asyt
summary: >-
  A paper from the School of Underlying Conditions asks why stone conservation
  records weathering as loss while soil science records the same reactions as
  formation, and locates the difference in a reference state that a science
  acquires when it is expected to intervene. The argument is read through the
  top of one roofless rubble wall, described at seven stations as a soil
  profile and set beside an earlier condition report, with which it agrees on
  the depth to firm mortar at five stations of seven.
topic: >-
  When a ruined wall becomes a soil: stone conservation and soil science
  describe the same weathering with opposite signs, a history and philosophy
  of the reference state read through one profile described on a wall top
