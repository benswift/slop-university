doi: 10.5555/slop.d0f7hm
summary: >-
  A research poster from the School of Emergent Priorities follows one
  independent corner store through a fourteen-month move from a coin-in-the-
  jar honesty system to a scan-and-deduct loyalty app. The reused-bag
  return-with-payment rate held at 77-81% for seven months, stepped down to
  39-44% within the rollout month, and has not recovered; the proprietor's
  own account of the change has since been cited in full in a University
  report recommending the app to every grocer on its supplier list.
topic: >-
  a single corner store's move from a bread-bag honesty jar to a
  scan-and-deduct loyalty app, told as a change-management case study in the
  shopkeeper's own words, and how their account of what regulars stopped
  doing became the worked example a University report now cites to
  recommend the same app to every independent grocer on its supplier list
