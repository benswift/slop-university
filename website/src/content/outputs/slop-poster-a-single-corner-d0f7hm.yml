title: The Jar That Stopped Filling
subtitle: A Single-Site Case Study of a Corner Store's Move From an Honesty Jar to a Scan-and-Deduct Loyalty App
authors:
  - Runa Adegoke
  - Ingrid Vasseur
preset: research-poster
school: School of Emergent Priorities
