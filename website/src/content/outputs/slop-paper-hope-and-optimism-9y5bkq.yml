title: Bracing Without Despairing
subtitle: Expectation and Hope in Landholders Awaiting the Result of a Water Bore
authors:
  - Vigdis Emenike
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-10-13
