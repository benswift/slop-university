title: What Kleinman's Condition Leaves
subtitle: The finite subgroups of O(3) whose second-order susceptibility it annihilates
authors:
  - Anselm Threlkeld
preset: paper
school: School of Settled Matters
date: 2026-11-17
publishedAt: "2026-11-17T11:30:53+11:00"
doi: 10.5555/slop.wvifbz
summary: >-
  A paper from the School of Settled Matters proves that a finite group of
  symmetries of space admits a second-harmonic susceptibility but none
  satisfying Kleinman's permutation condition exactly when it is a dihedral
  rotation group D_n with n at least four, and that each such group loses a
  single dimension. Among the crystal classes this recovers 422 and 622 and
  excludes every other, and the paper tabulates what the condition costs each
  of the twenty-one non-centrosymmetric classes.
topic: >-
  Kleinman's permutation condition and the finite subgroups of O(3): which
  symmetry groups it leaves with no second-order susceptibility at all
