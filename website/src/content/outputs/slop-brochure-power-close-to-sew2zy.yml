summary: >-
  A civic brochure that invites the University's neighbours into its work on
  local electricity, as a district begins to make, store and share some of its
  own. Three Schools take a part each --- the ground the cables and cabinets
  rest on, the household reading its bill, and the building that goes on
  drawing power overnight --- carried by six published University studies
  cited by title and DOI.
