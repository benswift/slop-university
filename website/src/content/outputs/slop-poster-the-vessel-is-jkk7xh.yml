summary: >-
  A research poster from the School of Underlying Conditions runs one
  organic-free sodium aluminosilicate gel six times in twenty-four numbered
  PTFE autoclave liners of logged history and identifies the product of all 144
  runs by powder diffraction. Liners with a history of gismondine-type product
  returned it at a mean share of 45% through three rounds of routine washing,
  an alkaline soak cleared the four smooth ones and not the two with scored
  walls, and a sodalite history left no trace.
