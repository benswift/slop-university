title: When Is the Burden Extinguished?
subtitle: A Trichotomy for Iterated Phytoextraction Maps
authors:
  - Clemency Tredinnick
  - Brynjar Obiora
preset: paper
school: School of Settled Matters
date: 2026-11-18
publishedAt: "2026-11-18T04:30:47+11:00"
doi: 10.5555/slop.37gx87
summary: >-
  A pure mathematics paper from the School of Settled Matters and the School of
  Underlying Conditions models each season's harvest of a metal-drawing crop as
  a map on a field's burden, and proves that the order of the plant's uptake
  law at low concentration alone decides whether the burden is extinguished in
  finitely many harvests, cleared to a threshold in logarithmically many, or
  only in polynomially many. A reserve pool releasing a fixed fraction each
  season removes extinction altogether, hands the clearance rate in the first
  regime to the soil, and leaves the third regime untouched.
topic: >-
  a trichotomy theorem for iterated phytoextraction maps: whether a field's
  heavy-metal burden clears in finitely many harvests, logarithmically many or
  polynomially many, decided by the order of the plant's uptake law at low soil
  concentration
