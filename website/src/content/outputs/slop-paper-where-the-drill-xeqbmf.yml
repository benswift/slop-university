doi: 10.5555/slop.xeqbmf
summary: >-
  A paper from the School of Underlying Conditions drills one first-year
  pressure ridge in landfast sea ice seven times over 103 days, logging a
  17-hole transverse profile for hard, soft and void intervals at each visit.
  The consolidated layer grew fastest on the windward flank and slowest under
  the lee drift; a mid-winter deformation event then opened a near-horizontal
  gap close to the base of the crest's layer, loosened the keel at every depth
  and cost the crest about three weeks of consolidation.
topic: >-
  Where the drill fell through: a winter of repeated drilling across one
  first-year sea-ice pressure ridge, tracking keel consolidation and the
  reopening of voids after a mid-winter deformation event
