title: Where the Drill Fell Through
subtitle: Consolidation and Re-opening of a First-Year Sea-Ice Pressure Ridge Keel across One Winter of Repeated Drilling
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
