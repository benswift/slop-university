summary: >-
  A case-for-support brochure from the School of Underlying Conditions invites
  partners and donors to sustain its work on groundwater as it is at depth,
  under three headings: measuring in place down the bore, what water gives up
  on its way to the air, and the keeping of samples and core after they are
  collected. It rests its case on seven published studies cited by title and
  DOI.
topic: >-
  the water as it was: a case-for-support brochure for the School of Underlying
  Conditions' work on what groundwater is at depth --- its temperature,
  dissolved gases and chemistry --- before the pump, the bottle and the bench
  change it
