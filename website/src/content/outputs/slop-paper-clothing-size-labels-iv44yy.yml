title: Twelve Means Nine Things
subtitle: >-
  An Item-Response Analysis of Fit Outcomes for 246 Garments Labelled 8 to 18
  Across Nine Retailers, Against a Size Availability Index That Counts Labels
  Stocked
authors:
  - Anneke Tolan
  - Anouk Mensah
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-07-30
publishedAt: 2026-07-30T17:03:33+10:00
doi: 10.5555/slop.iv44yy
summary: >-
  A paper from the School of Emergent Priorities treats the printed clothing
  size as a measurement instrument and estimates its item parameters directly.
  A panel of 118 wearers produced 4,918 analysable binary fit judgements over
  246 garments labelled 8 to 18 from nine retailers, with every label concealed
  at the point of judgement and allocation balanced under an incomplete block
  design. A two-parameter item-response model places each garment on a common
  latent scale: the nominal label accounts for 34.1% of the variance in item
  difficulty and the retailer for 28.6%, and while the mean step between
  adjacent labels within one retailer is 0.47 logits, thresholds among garments
  labelled 12 vary across the nine retailers with a standard deviation of 1.11.
  Retailer intercepts span 2.48 logits, so garments labelled 10 at one shop sit
  above garments labelled 14 at another. The decomposition is unmoved by model
  specification. The size availability index the retailers report against
  counts labels present at audit, and fit returns are coded to a change-of-mind
  category excluded from quality reporting.
topic: >-
  clothing size labels tested as measurement --- a try-on panel fitting 246
  garments labelled 8 to 18 across nine retailers, each garment's own fit
  threshold estimated with an item-response model, against a retail group's
  size availability index that counts labels stocked and books fit returns as
  change of mind
pages: 5
