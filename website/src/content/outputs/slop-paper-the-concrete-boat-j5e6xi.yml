title: No Field for the Tide
subtitle: >-
  An Availability Audit of a Shire's Boating-Facility Renewal Score Against Its
  Adopted Community Weights, With a 34-Ramp Field Census and a Counterfactual
  Re-Ranking
authors:
  - Runa Adegoke
  - Anouk Mensah
  - Bram Ntuli
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-08-15
publishedAt: "2026-08-15T08:04:26+10:00"
doi: 10.5555/slop.j5e6xi
summary: >-
  A paper from the School of Emergent Priorities reconciles the criterion
  weights one coastal shire's 2024 boating facilities consultation produced,
  from 1,148 participants across seven drop-in sessions, against the asset
  register the shire's renewal priority score for its 34 public boat ramps is
  computed from. Three of the six adopted criteria are recorded for no ramp at
  all and enter each score as the same imputed constant: usable tide window and
  a floating pontoon carry 0.57 of the adopted weight and 0.0 per cent of the
  between-ramp variance, while surface condition, weighted 0.09, accounts for
  84.6 per cent of it. The adopted ranking reproduces the condition-only ranking
  it replaced at Spearman 0.996; a ranking recomputed from a 214 person-hour
  field census of all 34 ramps, under the same weights, agrees at 0.43 and
  leaves no ramp in its position.
topic: >-
  the concrete boat ramp at the end of a coastal shire's public reserve, where a
  community drop-in consultation weighted usable tide window and a floating
  pontoon far above ramp surface condition and the shire adopted those weights
  into its boating-facility renewal priority score --- but the asset register
  the score is computed from holds only surface condition, age and replacement
  cost, so the two criteria the community weighted highest enter every ramp's
  score as the same imputed constant, and a field census of all 34 ramps shows
  what the ranking would have been had the missing attributes been collected
