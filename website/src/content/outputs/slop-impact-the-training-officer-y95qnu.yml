summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 follows one
  proportionate-assurance instrument --- a signed currency register standing
  in for a live skills check --- from a volunteer fire brigade into a state
  foster-care caseload and a council produce market, finding each site using
  the same paperwork-compliance rate to decide who no longer needs checking.
topic: >-
  The training officer who keeps a rural fire brigade's skills-currency
  register lets a signed refresher form stand in for a volunteer's actual
  proficiency, and the state scheme now exempts any brigade whose
  paperwork-compliance rate clears a published mark from its annual live
  skills muster.
