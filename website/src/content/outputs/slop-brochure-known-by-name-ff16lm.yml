summary: >-
  A prospectus led from the School of Settled Matters invites prospective
  students to study names as records: the owners listed on a certificate of
  title, the letters cut into a country headstone, the road names a shire's
  register assigns and reassigns. It presents naming as a concern running
  through three of the University's Schools, promises each student a record
  kept in the spelling they give, and rests its case on five published outputs
  cited by title and DOI.
