summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 traces the
  rollout of the Telling Counter, a desk-mounted tally fitted to a regional
  shire's service counters, from the first count of repeated requests for an
  address, through the Once-Only Rule that cut a counter's published hours for
  each one, to the Whole Address Standard the shire adopted when staff began
  asking for an address a piece at a time.
topic: >-
  To establish whether a shire resident can be asked for their address only once
  across a hard-rubbish booking, a dog registration and a rates query, by
  building the Telling Counter --- a tally tool at the council counter that
  staff must tap before asking for an address a second time
