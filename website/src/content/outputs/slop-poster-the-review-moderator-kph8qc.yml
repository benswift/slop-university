summary: >-
  A poster from the School of Emergent Priorities and the School of
  Continuous Improvement codes 1,842 one-star reviews on a trades-marketplace
  app into a four-kind taxonomy, finding reviewer wording drifting toward the
  mildest kind's canned reply within nine weeks of the taxonomy's
  platform-wide rollout.
topic: >-
  The review moderator for a trades-marketplace app sorts every one-star
  review into one of four kinds before the auto-reply template fires, and
  tradespeople learn to steer reviewers' wording toward the kind with the
  mildest template.
