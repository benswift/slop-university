summary: >-
  A research poster from the School of Emergent Priorities reports a
  pre-registered null: across 214 questions at 16 ordinary meetings of one
  shire, a name on the question-time signup sheet is unrelated to a floor
  answer, an officer referral, or a minute in the subsequent resolution. On
  the strength of that finding the University binds every internal
  consultation to a three-minute exhibition of the sheet, closing with the
  standing minute "taken on notice".
