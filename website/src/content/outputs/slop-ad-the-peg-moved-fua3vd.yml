title: The Peg Moved. The Line Did Not.
subtitle: >-
  A landscape signage campaign inviting visitors to the School of Settled
  Matters' Open Day, on how a surveyed boundary is held as the ground beneath
  it shifts.
authors:
  - Anselm Threlkeld
preset: marketing-poster
school: School of Settled Matters
