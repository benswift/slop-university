doi: 10.5555/slop.fua3vd
summary: >-
  A marketing poster for the School of Settled Matters pictures a surveyor's
  level sighting along a paddock fence towards a single timber boundary peg,
  with a survey disc set in the footing of a shed nearby, and invites visitors
  to an Open Day hosted by the Received Readings Group on how a surveyed line
  is kept once the ground has moved. Developed for bus-stop panels and campus
  digital signage in a landscape rotation.
topic: >-
  the peg moved, the line did not: an Open Day for the School of Settled
  Matters, where survey marks, settlement monitoring and boundary law show how
  a measured line is kept
