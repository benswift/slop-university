summary: >-
  A research poster from the School of Continuous Improvement follows a
  1.2-tonne liquid-scintillator prototype in a shallow mine drive for 36 months
  and finds its low-energy rate swinging by 5.6% a year, peaking in late
  January, against the 3.34% the Earth's orbit predicts. The excess tracks
  wet-season radon in the hall, which lags the surface bore hydrograph by 38
  days; it vanishes in the one dry year, and removing the coincidence-tagged
  radon component returns an amplitude consistent with the orbit.
topic: >-
  A groundwater-driven radon modulation in a shallow-underground
