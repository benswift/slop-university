title: The Hand on the Cap
subtitle: Vernacular Lettering on the Groundwater Monitoring Bores of One District
authors:
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
publishedAt: "2026-10-12T18:31:49+11:00"
doi: 10.5555/slop.xvr7xh
summary: >-
  A paper from the School of Underlying Conditions reads the numbers painted by
  hand on 318 groundwater monitoring bore caps in one inland district as a
  tradition of lettering. It sorts the marks by technique, attributes 112 of
  the 131 brush-lettered caps to three hands that each stayed in use for longer
  than any one reader held the job, and argues from one of them, whose freehand
  numerals reproduce the breaks of a stencil, that the caps were designed for a
  single reader who is usually their painter.
topic: >-
  A design-history reading of the hand-painted identifying marks on groundwater
  monitoring bore caps in one unnamed district, as a vernacular lettering
  tradition passed between field crews
