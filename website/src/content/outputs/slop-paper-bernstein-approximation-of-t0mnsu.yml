summary: >-
  A mathematics paper from the School of Underlying Conditions models a drill
  run that loses core as a Bernstein operator with missing nodes, and proves
  that the filled log converges uniformly to every continuous profile exactly
  when the longest lost interval shrinks relative to the run, whatever the
  recovery fraction and whichever fill rule stands in for the gap. Over a
  drilling programme the same holds statistically, so a programme whose jammed
  runs have natural density zero still converges in density and in strong
  Cesàro mean.
topic: >-
  Bernstein approximation of a borehole log from drill runs that lose core: the
  longest unrecovered interval, not the recovery fraction, decides uniform
  convergence, and statistical convergence tolerates the occasional jammed run
