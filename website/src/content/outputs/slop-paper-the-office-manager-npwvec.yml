title: Measuring the Sticky Note
subtitle: >-
  A Population Survey of Desk-Level Reminders and the Paperless-Desk Mandate
  It Triggered
authors:
  - Marek Solheim
  - Thandiwe Solberg
preset: paper
school: School of Emergent Priorities
date: 2026-09-15
publishedAt: "2026-09-15T04:24:36+10:00"
doi: 10.5555/slop.npwvec
summary: >-
  A paper from the School of Emergent Priorities and the School of
  Continuous Improvement surveys 1,142 sticky notes across 186 desks on one
  office floor, treating each note's undisturbed tenure as a survival
  outcome by desk zone, and reports Facilities' adoption of the
  population's ninetieth-percentile note age as the trigger threshold for a
  paperless-desk mandate later extended to the building's noticeboards.
topic: >-
  the office manager surveys the population of sticky notes stuck to staff
  monitors across one floor, reporting the distribution of note age since
  last legible edit by desk zone, adopted as the trigger threshold for a
  paperless-desk mandate extended to the physical noticeboards elsewhere on
  campus
