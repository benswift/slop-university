doi: 10.5555/slop.ly2n9o
summary: >-
  A research poster from the School of Continuous Improvement casts the pushing
  series of a 60-oven coke battery as a periodic scheduling problem and replays
  fourteen wall-repair episodes from 26 months of push logs, comparing the
  planners' hand re-sequence on the shift wall board with a mixed-integer
  schedule. The board lands within 8 minutes of the model's coking-time
  deviation in all eleven single-oven episodes, and falls well behind it only in
  the three episodes where two adjacent ovens stood down together.
topic: >-
  re-sequencing a coke oven battery's pushing schedule around ovens taken out
  for wall repair, as an operations-research scheduling problem
