title: Lost Before They Were Blunt
subtitle: A Grit-by-Grit Census of Diamond End States in Thirty-Eight Retired Impregnated Core-Bit Crowns
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
