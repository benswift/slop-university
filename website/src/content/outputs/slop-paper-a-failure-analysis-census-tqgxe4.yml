doi: 10.5555/slop.tqgxe4
summary: >-
  A paper from the School of Underlying Conditions examines the working faces
  of 38 retired impregnated diamond core bits from one coring programme and
  assigns each of 5,514 grit sites one of five end states. Empty sockets were
  the commonest state at 34.5%, rising to 53.9% in the soft matrix grade, where
  71% of measured sockets were deeper than half the grit size, while 41.0% of
  sites in the hard grade were polished flats. A graphitic Raman signature on
  the flats was largely confined to six bits, and cleavage accounted for 11.7%
  of sites.
topic: >-
  A failure-analysis census of the diamonds in a retired set of impregnated
  core-drilling bit crowns: how each exposed diamond ended (pulled out,
  fractured, polished flat or graphitised) and what the metal matrix around it
  had to do with it
