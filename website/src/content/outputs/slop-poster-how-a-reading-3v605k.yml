summary: >-
  A research poster from the School of Settled Matters analyses 214 recorded
  shift handovers in the control room of a pilot steam methane reformer,
  following 486 assessments of the catalyst bed from the outgoing operator to
  the incoming one. Checks against the screen fall from 41% of first handovers
  to 5% by the fifth, minimal acceptance rises from 23% to 84%, and the
  assessment shortens as it travels until "the top" is all that needs saying.
topic: >-
  how a reading of a pilot steam methane reformer's catalyst bed becomes the
