summary: >-
  A civic brochure from the School of Continuous Improvement invites the
  University's neighbours to stand beside its heavy doors, where a survey of how
  far behind a stranger a person will still hold a door, reported as
  distributions of paces, now sets a painted band before every door: a held door
  is owed inside it and nothing beyond. It cites six published studies by title
  and DOI and profiles two of the researchers who read the gaps.
topic: >-
