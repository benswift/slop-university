summary: >-
  A research poster from the School of Settled Matters follows the error in
  the starting values of constant-step BDF3 and BDF4 integrations of the test
  equation y′ = λy, for hλ from −10⁻² to −10⁴, under five starting
  procedures. In the smooth modes the start-up error rides the principal root
  and decays only as the solution does, while the stiff modes damp it within
  ten steps; an implicit Euler start holds both methods to second order, and
  an L-stable two-stage SDIRK start restores third order to BDF3.
topic: >-
  start-up error in BDF multistep integration: the starting values' error
  persists along the principal root in the smooth components while the stiff
  components forget it
