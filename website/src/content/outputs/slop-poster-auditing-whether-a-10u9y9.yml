doi: 10.5555/slop.10u9y9
summary: >-
  A research poster from the School of Emergent Priorities surveys 214 active
  geocachers on what they log when a container they find is in poor
  condition, finding 58% record a standard find rather than a maintenance
  flag and tracing finders' stated reasons back to a reluctance to cost the
  cache its find rate for other seekers.
topic: >-
  auditing whether a geocache's app-reported health score tracks the
  container's condition or the finder's need to protect their streak
