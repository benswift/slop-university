title: Logged Healthy Anyway
subtitle: Why Geocachers Skip the Maintenance Flag to Protect a Streak
authors:
  - Fenna Okoro
  - Anneke Tolan
  - Petra Umbile
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-29
