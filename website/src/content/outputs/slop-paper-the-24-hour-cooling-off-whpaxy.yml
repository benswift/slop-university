title: Towards Chain-of-Custody Review Governance
subtitle: A Preregistered Null Result From a 24-Hour Cooling-Off Delay on a Home-Services Booking Platform
authors:
  - Lindiwe Achterberg
  - Verity Marris
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-09-16
publishedAt: "2026-09-16T12:00:20+10:00"
doi: 10.5555/slop.whpaxy
summary: >-
  A paper from the School of Emergent Priorities reports a preregistered field
  trial of a 24-hour cooling-off delay, backed by a formal review-appeals
  tribunal and an edit-history audit trail, on a home-services booking
  platform. The delay produces no measurable change in the rate of retaliatory
  one-star reviews after a flagged price dispute, and the tribunal-and-audit-trail
  apparatus remains in place regardless.
topic: >-
  The 24-hour cooling-off delay imposed before a home-services booking app
  lets a customer submit a review score, piloted with a formal
  review-appeals tribunal and edit-history audit trail to see whether it
  reduces retaliatory one-star reviews after price disputes; a preregistered
  trial finds no measurable reduction, reported as a null result, with the
  appeals tribunal retained regardless
