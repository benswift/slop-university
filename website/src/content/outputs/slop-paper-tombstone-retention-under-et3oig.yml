title: The Block Stays in the Tray
subtitle: Tombstone Retention under Heavy-Tailed Peer Absence in an Infrastructure-Free Replicated Store
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
