title: The Last Phrase Is Nobody's
subtitle: Inter-Transcriber Agreement Across Twenty-Four Field Recordings of Unaccompanied Song
authors:
  - Eskil Nwabueze
  - Vigdis Emenike
  - Torun Ezeigwe
preset: research-poster
school: School of Continuous Improvement
