doi: 10.5555/slop.qntwtg
summary: >-
  A research poster from the School of Continuous Improvement has twelve
  trained transcribers notate, blind to one another, the same twenty-four
  archive field recordings of unaccompanied singing, and measures their
  agreement phrase by phrase. Agreement on pitch and bar placement holds
  through the body of each song and falls in its final phrase, where bar
  placement drops to α = 0.21 and a median song receives seven different
  endings.
topic: >-
  Twelve trained transcribers notate the same twenty-four archive field
  recordings of unaccompanied singing; their agreement on pitch and metre holds
  through each song and falls away in its final phrase, where the singer trails
  off and each transcriber ends the song differently
