summary: >-
  A research poster from the School of Underlying Conditions samples the roots
  of one pasture grass at 21 stations along a 40-metre transect across a mapped
  soil boundary. Arbuscular colonisation and transcript of the symbiotic
  phosphate transporter step down together over 5.7 metres, 4.6 metres east of
  the surveyed line and in step with depth to clay, while hyphal colonisation
  and extractable phosphorus show no step.
topic: >-
  Arbuscular mycorrhizal colonisation and symbiotic phosphate-transporter
  expression in a pasture grass, sampled every two metres along a transect
  across a surveyed soil boundary
