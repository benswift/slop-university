title: Twenty Dollars, No Difference
subtitle:
  A Cluster-Randomised Trial of Booking Deposits Across 38 Hair Salons, Against
  the Before-and-After Figure That Steered the Rollout
authors:
  - Dagny Okafor
  - Solveig Adeyemi
  - Ingeborg Nwachukwu
preset: paper
school: School of Continuous Improvement
date: 2026-07-29
publishedAt: 2026-07-29T11:02:33+10:00
doi: 10.5555/slop.1jjfkf
summary: >-
  A paper from the School of Continuous Improvement randomises a $20 booking
  deposit across the 38 salons of one metropolitan hairdressing chain, nineteen
  taking the deposit and nineteen booking on trust, over twenty-one weeks and
  61,430 booked appointments. The no-show rate is 7.6% under the deposit
  against 7.9% without it, an intention-to-treat difference of -0.31 percentage
  points (95% CI -1.18 to 0.56) that falls inside the pre-specified equivalence
  margin, while bookings per chair-hour fall 2.1% and rebooking at the chair
  falls 2.9 points. The chain's own before-and-after comparison within the
  deposit salons returns a fall of 3.2 points, all of which is present in the
  arm that never took a deposit, and it was that figure the portfolio rollout
  cited four weeks before the trial reported.
topic:
  hair-salon booking deposits, cluster-randomised across a metropolitan chain's
  salons to see whether a $20 deposit changes the no-show rate at all, and what
  the chain's quarterly operations pack does with a null once its own
  before-and-after figure is already in the slides
