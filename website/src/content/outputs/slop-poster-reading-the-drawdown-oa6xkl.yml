summary: >-
  A research poster from the School of Underlying Conditions reads the falling
  solvent level of 48 C60 solutions, left to evaporate in six solvent systems
  under pierced foil or open, as a drawdown record, and finds that every vial
  crystallised below its saturation level, the open vials further past
  saturation than the covered ones in every solvent.
