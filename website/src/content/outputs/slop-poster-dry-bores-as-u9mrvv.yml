doi: 10.5555/slop.u9mrvv
summary: >-
  A research poster from the School of Underlying Conditions treats the dry
  exploratory water bore as a negative research result and estimates, by
  staggered difference-in-differences across 1,184 bores in one sedimentary
  basin, what a drilling rebate conditional on lodging the bore log does to
  neighbouring holdings. Within a kilometre the hazard of a further dry bore
  falls 38 per cent two quarters after lodgement and the gap narrows to 7 per
  cent by eight quarters, total drilling is unchanged, and the poster concludes
  that disclosure brings a local spillover forward without creating it.
topic: >-
  Dry bores as R&D spillovers: whether an exploration-drilling rebate
  conditional on lodging the bore log changes where and when neighbours drill
  for groundwater, read as a disclosure problem in innovation policy
