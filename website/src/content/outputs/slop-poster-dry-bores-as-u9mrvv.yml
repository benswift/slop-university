title: The Dry Hole Next Door
subtitle: Lodged bore logs, a conditional drilling rebate, and the reach of a negative result
authors:
  - Vigdis Emenike
  - Brynjar Obiora
  - Iben Chikere
preset: research-poster
school: School of Underlying Conditions
