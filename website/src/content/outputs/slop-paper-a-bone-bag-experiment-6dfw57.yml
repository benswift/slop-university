title: Bone Bags on a Catena
subtitle: Slope Position, Burial Depth and the Loss of Extractable Collagen from Sheep Bone over Eighteen Months
authors:
  - Brynjar Obiora
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
