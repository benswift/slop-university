doi: 10.5555/slop.6dfw57
summary: >-
  A paper from the School of Underlying Conditions adapts the ecologist's
  litterbag to bone, burying 160 mesh-bagged sections of sheep metapodial at two
  depths and five positions down one granitic hillslope and lifting them over
  eighteen months. Extractable collagen fell least under the permanently wet
  toeslope and most in the footslope's fluctuating water table, burial depth
  mattered only where it crossed that zone, and seven of the eleven bags lost
  were dug up by an unidentified animal.
topic: >-
  a bone-bag experiment burying defleshed sheep bone at five positions down a
  single hillslope catena and retrieving it over eighteen months, to ask whether
  slope position or burial depth governs the loss of extractable collagen
