summary: >-
  A brochure from the School of Emergent Priorities reports a season of
  clubhouse interviews about the team sheet pinned beside the door, in the
  names players give its four places: the paper, the bench, carried and the
  maybe. Players count a named emergency as having played, and the standing
  arrangement the brochure sets out enters every name on the pinned sheet in the
  club's record of play for that round, with no override.
topic: >-
  Team-selection sheet on a clubhouse corkboard: what players say each listed
  place means, in their own words, and the rule that a player named as emergency
  is recorded as having played
