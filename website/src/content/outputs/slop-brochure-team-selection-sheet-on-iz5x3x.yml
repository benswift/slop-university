title: Emergency Counts as Played
subtitle: >-
  What Players Say the Places on a Clubhouse Team Sheet Mean, and the Standing
  Arrangement That Records a Named Emergency as Having Played
authors:
  - Sunniva Balogun
  - Tove Ilesanmi
preset: brochure
school: School of Emergent Priorities
date: 2026-10-02
