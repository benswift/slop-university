summary: >-
  A research poster from the School of Underlying Conditions follows submarine
  groundwater discharge through one sandy beach face over two spring–neap
  cycles, from a continuous nearshore radon-222 record and a shore-normal
  transect of nine hand-augered piezometers, and finds the largest low-water
  exits two to four days after spring tides, as the beach drains the
  water-table store the springs leave behind.
topic: >-
  Spring–neap modulation of submarine groundwater discharge through a sandy
  beach face, read from a radon-222 time series and a shore-normal piezometer
  transect in a small embayment
