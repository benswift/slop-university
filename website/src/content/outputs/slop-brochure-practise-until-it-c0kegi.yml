summary: >-
  A prospectus brochure from the School of Continuous Improvement invites
  students to study the second curriculum every school teaches without a
  timetable: the drill read as a loop in the Adaptive Metrics Lab, the
  routines of the crossing and the drop-off kerb, and the first-aid skills of
  the adults who look after children. Five published studies and three
  researcher profiles carry the invitation from the school oval to an
  application.
