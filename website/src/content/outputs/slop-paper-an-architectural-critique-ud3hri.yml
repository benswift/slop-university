summary: >-
  An essay in architectural criticism from the School of Underlying Conditions
  reads the hall of a closed pilot electrolysis plant through its drawing set,
  maintenance manual and lifting register, and argues that its bay width, crane
  height and water-treatment wing were each drawn around a forecast of how fast
  its stacks' catalyst would lose activity. The gantry sized for a scheduled
  stack exchange made its full designed lifts only in the plant's final week,
  and the essay proposes "replacement architecture" for buildings whose plan
  and section are set by the expected failure of a component too small to see.
topic: >-
  An architectural critique of a decommissioned pilot electrolyser hall whose
  plan, crane gantry and water-treatment wing were drawn around the expected
  degradation of its catalyst stacks
