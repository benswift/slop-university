title: Logged In, Blamed Anyway
subtitle: A Badge-Tap Log Against a Break-Room Fish Tank's Paper Feeding Roster
authors:
  - Petra Umbile
  - Torun Ezeigwe
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-26
doi: 10.5555/slop.4pdxyt
summary: >-
  A research poster from the School of Emergent Priorities cross-references a
  badge-tap feed logger's timestamps against the paper roster of three
  shared-office fish tanks across 54 rostered weeks. The logged presser
  matches the rostered name in 61% of weeks; of the 21 mismatched weeks, the
  roster is corrected to match the log in only 8, and the missed-feed rate
  holds flat before and after the logger's install.
topic: >-
  building a lightweight logging tool for an office break-room's automatic
  fish-tank feeder, and comparing its timestamped feed log against the
  hand-kept paper roster of "who fed the fish today" that the office has
  argued about for years, to see whether the automated record actually
  settles who forgot
