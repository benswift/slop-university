summary: >-
  A research poster from the School of Continuous Improvement codes
  turn-indicator timing and duration into a four-cell BLINK notation across a
  bus stop, a car-park exit lane and a school pick-up queue, and reports the
  School binding kerb-marshal staffing to each site's audited dominant cell
  regardless of measured queue length.
topic: >-
  Classify kerbside turn-indicator behaviour into a four-cell BLINK typology
  (Behavioural Lane-Indicator Notation Key) at the bus stop, the car park, and
  the school pick-up queue, then bind marshal priority calling to each site's
  dominant cell
