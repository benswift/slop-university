summary: >-
  A single-site case study follows a neighbourhood forum's upvote-earned
  Trusted Neighbour flair through a season in which its moderator group let
  the flair gate priority access to giveaway posts, finding the resulting
  queue favours posting activity over completed collection.
topic: >-
  Although a neighbourhood forum's upvote-earned Trusted Neighbour flair
  correctly filtered out spam accounts within its first month, the
  moderator group's decision to let that flair gate first access to
  kerbside giveaway posts left the street's most reliable collectors
  waiting behind its most talkative members instead --- a single-site case
  study of the access rule, told in earnest case-method register with a
  teaching note's air.
