title: A Statement of What Holds
subtitle: >-
  A submission from the School of Underlying Conditions to the Department of
  Policy Settings' consultation on The Statement of Finding and Outputs in
  Dialogue Form
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: submission
school: School of Underlying Conditions
date: 2026-11-19
publishedAt: "2026-11-19T10:31:46+11:00"
doi: 10.5555/slop.pw34f8
summary: >-
  A submission from the School of Underlying Conditions answers four of the six
  questions in the Department of Policy Settings' consultation on Guideline 4.3
  and outputs in dialogue form. Drawing on inorganic chemistry's practice of
  reporting the electron count on which every convention for assigning charge
  agrees, it proposes a fourth option, a statement of what holds, under which
  authors record in their own voice what an output's several voices share and
  where they part, and asks that any test of dialogue form turn on voice rather
  than layout.
topic: >-
  an earth sciences school's submission on the dialogue-form setting, from
  inorganic chemistry's habit of reporting what survives every assignment of
  charge: a dialogue's statement should record what holds whichever speaker is
  adopted, as an electron count holds under every convention
