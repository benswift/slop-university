doi: 10.5555/slop.jo46d5
summary: >-
  A research poster from the School of Underlying Conditions sets one
  eleven-person groundwater sampling crew's own classification of its field kit
  beside the written organofluorine sampling protocol it works to. Free lists
  and pile sorts of 48 items show a single shared model that sorts "fluoro" by
  slip, sheen and beading, and a practised list that overlaps the written one
  only in part.
topic: >-
  a folk taxonomy of 'fluoro' among one groundwater sampling crew: how
  technicians sort their kit into clean and suspect by slip, sheen and beading
  rather than by the written organofluorine sampling protocol, from free lists
  and pile sorts
