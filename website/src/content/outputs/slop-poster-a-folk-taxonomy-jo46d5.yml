title: If It Beads, It Stays in the Ute
subtitle: A folk taxonomy of "fluoro" among groundwater sampling technicians
authors:
  - Vigdis Emenike
  - Anneke Tolan
  - Halvard Nnamani
preset: research-poster
school: School of Underlying Conditions
