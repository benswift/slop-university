title: The Ground We Stand On
subtitle: >-
  The 2026-2031 Strategic Plan commits the University to the legacy wells of
  the retired oilfield beneath its campus
authors:
  - Brynjar Obiora
  - Ylva Ogunbanjo
  - Signy Okpara
preset: strategy
school: School of Underlying Conditions
