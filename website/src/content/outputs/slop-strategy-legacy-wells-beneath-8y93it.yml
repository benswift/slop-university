doi: 10.5555/slop.8y93it
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to the
  sixty-three recorded wells of the retired oil and gas field its campus
  occupies. Three priorities provide for a single register reconciling the
  old field's records with the ground, an aftercare regime of named stewards,
  review cycles and a Perpetual Care Reserve whose terms do not lapse with the
  Plan, and a campus field school built on the wells themselves.
topic: >-
  legacy wells beneath the campus: a strategic plan for stewarding the retired
  oilfield the University stands on, from extraction to perpetual aftercare
