title: The Couplets That Did Not Come Up
subtitle: Core Loss and the Storm-Scale Sediment Record of Slope Retirement in a Loess Check-Dam Catchment
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
