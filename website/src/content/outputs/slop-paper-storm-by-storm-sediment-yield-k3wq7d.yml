doi: 10.5555/slop.k3wq7d
summary: >-
  A paper from the School of Underlying Conditions cores the filled deposit of
  a small loess check dam whose slopes were retired from cropping, matches its
  flood couplets to 248 storms in a farmer's rain-gauge record, and finds that
  the three cores lost the same thick, sand-based couplets of large storms.
  Restoring the 19 storms that lay in the gaps closes the deposit's mass
  budget against a survey of the fill and lowers the fall in sediment yield
  after retirement from 84% to 72%, with large-storm yield falling by a third,
  an amount the record cannot tell from none.
topic: >-
  Storm-by-storm sediment yield from a check-dam deposit on a northern Chinese
  loess tableland, before and after its slopes were retired from cropping,
  with the flood couplets the core failed to recover put back
