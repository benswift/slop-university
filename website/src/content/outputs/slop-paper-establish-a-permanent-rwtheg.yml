title: MERIT
subtitle: Minimum Established Recommendation-Inclusion Threshold for a Strip-Mall Advertising Co-op
authors:
  - Joost Nwosu
  - Fenna Okoro
  - Petra Umbile
preset: paper
school: School of Continuous Improvement
date: 2026-09-18
