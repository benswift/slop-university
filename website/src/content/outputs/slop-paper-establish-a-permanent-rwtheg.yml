doi: 10.5555/slop.rwtheg
summary: >-
  A paper from the School of Continuous Improvement reports an open-coded
  interview study of strip-mall traders bound to MERIT, a recommendation-
  inclusion floor that locks a co-op member's best-quarter visibility rate
  in a local AI recommendation assistant as their permanent minimum, with
  no seasonal adjustment or downward revision. Traders describe the
  strategies
  they use to sustain, rather than exceed, the floor once it is set.
topic: >-
  Establish a permanent minimum recommendation-inclusion threshold for
  strip-mall advertising co-op members once each trader's visibility rate
  in a local AI recommendation assistant first clears it, and interview
  shopkeepers on adapting to a floor that never lowers
