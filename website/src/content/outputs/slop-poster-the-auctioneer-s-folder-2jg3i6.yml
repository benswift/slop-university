title: Called In, or Not Called In
subtitle:
  An Interview and Observation Study of How a Saturday Auction Result Becomes a
  Line in the Weekly Clearance Rate
authors:
  - Ingrid Vasseur
  - Petra Umbile
  - Lindiwe Achterberg
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-06
publishedAt: 2026-08-06T12:01:33+10:00
doi: 10.5555/slop.2jg3i6
summary: >-
  A research poster from the School of Emergent Priorities examines how the
  weekly auction clearance rate published by one metropolitan real-estate
  industry body is assembled, drawing on 34 semi-structured interviews with
  selling agents, auctioneers and the body's own reporting staff across 11
  agencies, and on non-participant observation of 412 on-site auctions over nine
  Saturdays in which every outcome was recorded independently of the agency's
  return. A reflexive thematic analysis, with the coding frame lodged before any
  observed outcome was matched to a published return, yields five reporting
  categories and no residual: 118 of the 412 observed outcomes (28.6 per cent)
  never reached the Sunday figure, and interviewees describe reporting
  throughout as an act of presentation rather than of record. Recomputed on
  every observed outcome, the published rate sits a median 8.1 percentage points
  above the rate the same weeks would carry.
topic:
  the auctioneer's folder on a front lawn on a Saturday morning, where a
  metropolitan real-estate industry body assembles the weekly auction clearance
  rate that vendors, lenders and the evening news read as the market's
  temperature by ringing agencies for results after the hammer falls --- an
  interview and observation study with auctioneers, selling agents and the
  body's own data staff, building a taxonomy of the reporting decisions a
  Saturday result passes through, and which results never get called in at all
