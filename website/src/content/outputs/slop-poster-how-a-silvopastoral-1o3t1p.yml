summary: >-
  A research poster in organisation studies from the School of Emergent
  Priorities reads all 352 sets of committee minutes kept by a member-owned
  cooperative grazing a silvopastoral run between 1994 and 2025, alongside 31
  interviews with serving and former office-holders. Tree matters were decided
  promptly only once they became fencing, hazard or seasonal work; the planted
  belts themselves were held in a standing item, "Trees --- ongoing", that sat
  in 213 meetings, was carried forward in 197 of them and outlasted fourteen
  chairs.
topic: >-
  How a silvopastoral grazing cooperative's committees carry decisions about
  shade trees that outlive every office-holder: an organisational study of
  temporal work in board minutes
