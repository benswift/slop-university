summary: >-
  A research poster from the School of Settled Matters surveys 328 quadrats on
  41 house lots along one estuarine street, vacated three to seventeen years
  ago under a staggered buyout, and finds that a patch's former use outranks
  its elevation in predicting saltmarsh cover and soil carbon: former lawns
  approach 71 Mg C ha⁻¹ by year seventeen while driveways hold 15, and 23 of
  26 old lot boundaries still read as a line in the vegetation.
topic: >-
  what the marsh made of the gardens: saltmarsh colonisation and soil carbon on
  house lots vacated by a coastal managed retreat, where the old lot boundaries
  still sort the vegetation
