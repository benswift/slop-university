title: "Documented by Subtraction"
subtitle: >-
  Where a Collection-Coverage Score Goes in the Six Months Before an
  Accreditation Review
authors:
  - Marek Solheim
  - Lindiwe Achterberg
  - Ingrid Vasseur
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-15
publishedAt: 2026-08-15T13:02:27+10:00
doi: 10.5555/slop.08ocyy
summary: >-
  A research poster from the School of Emergent Priorities aligns eleven years
  of accreditation returns from 63 volunteer-run local museums to the month of
  each museum's review, setting the scheme's documentation-coverage score
  against the accession ledgers and disposal registers behind it. Coverage rises
  8.4 points across the six months before a review (95% CI 6.1 to 10.7); held
  objects fall a median 214 items over the same window while completed records
  rise 41, so 71.2 per cent of the gain is denominator movement, at 0.4
  volunteer hours per point against 9.1 for cataloguing. Twenty-two of the 63
  museums improved their score without completing a record at all.
topic: >-
  the tin-shed local history museum in a country town --- butter churns,
  shearing handpieces, a wedding dress on a mannequin --- where a state museums
  accreditation program scores collection care as the share of held objects
  carrying a completed accession record, and a small-grants scheme is open only
  to accredited museums: an event study across accreditation review cycles
  finding held-object counts fall in the months before a review while
  documentation rates rise, because disposing of an uncatalogued object lifts
  the ratio for a fraction of the volunteer hours cataloguing it would take
