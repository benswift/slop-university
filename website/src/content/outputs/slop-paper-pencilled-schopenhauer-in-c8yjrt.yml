title: The Heart's Impatience, in Pencil
subtitle: >-
  A Reader's Schopenhauer in the Margins of a Second-Hand Copy of Stefan
  Zweig's Beware of Pity
authors:
  - Mirela Hanke
preset: paper
school: School of Continuous Improvement
