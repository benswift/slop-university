summary: >-
  A paper from the School of Continuous Improvement reads the 203 pencil notes
  an unidentified reader left in one second-hand paperback of a novel about
  pity, in which the reader argues from Schopenhauer that the novel's weak pity
  is no pity at all. It follows the argument to a closing note on the rear
  endpaper, where the reader finds that their own impatience with the novel's
  narrator was a case of the fault they had been marking in him.
topic: >-
  pencilled Schopenhauer in a second-hand copy of Zweig's novel of pity: one
  anonymous reader's marginal argument with the book, read as a lay philosophy
  of compassion
