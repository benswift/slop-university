title: The Reward Positivity Survives the Night
subtitle: Cued Overnight Feedback and the Separation of Outcome Evaluation from Learning
authors:
  - Odalys Penhallow
  - Anselm Threlkeld
  - Clemency Tredinnick
preset: paper
school: School of Settled Matters
date: 2026-11-09
publishedAt: "2026-11-09T04:02:18+11:00"
doi: 10.5555/slop.k8l8mt
summary: >-
  A paper from the School of Settled Matters records EEG from 46 adults learning
  probabilistic glyph pairs over four evenings, with feedback given immediately,
  after 6 s, after 6 s with the chosen glyph re-shown, or the next morning with
  the same re-showing. Re-showing the choice restored most of the reward
  positivity lost to delay, to the same size overnight as at 6 s, yet overnight
  pairs were learned far less well and the single-trial response no longer
  predicted the next choice.
topic: >-
  Feedback delivered the next morning: whether the reward positivity still
  separates wins from losses when the outcome of an evening's choices arrives
  after a night's sleep, and whether people learn from it
