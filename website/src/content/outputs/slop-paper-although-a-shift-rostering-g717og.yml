title: Who Actually Presses the Override?
subtitle: >-
  An Interview Study of a Flexible-Work Platform's Manager-Override Button
  Across a National Retail and Logistics Chain
authors:
  - Ronja Oyelaran
  - Verity Marris
  - Ingeborg Nwachukwu
preset: paper
school: School of Emergent Priorities
date: 2026-09-02
publishedAt: "2026-09-02T19:35:15+10:00"
doi: 10.5555/slop.g717og
summary: >-
  A paper from the School of Emergent Priorities interviews 34 team leaders
  and 51 shift staff across 21 sites of a national retail and logistics chain
  about a flexible-work platform's manager-override button, introduced to
  grant requests its auto-approval rules would otherwise decline. Once an
  efficiency score folding override frequency into each team leader's
  quarterly review became visible on dashboards, override use fell by
  roughly three-quarters and stayed down regardless of whether the score
  named team leaders publicly or only to HR.
topic: >-
  Although a shift-rostering platform's manager-override button is marketed
  to team leaders as protecting staff flexibility, interviewed managers
  describe avoiding it once they learn every override is quietly scored
  against their own approval-speed rating.
