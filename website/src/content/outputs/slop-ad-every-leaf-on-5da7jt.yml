summary: >-
  A portrait display ad for the School of Continuous Improvement sets a
  researcher clipping single leaves from a campus hedge into paper envelopes
  above a rack of graded extracts, and presents the University's standing on
  its own Indicator Commons composite for a grounds on which every hedge,
  verge and planter box has been extracted and screened. Developed for the
  portrait signage rotation in matched daylight and evening renderings.
