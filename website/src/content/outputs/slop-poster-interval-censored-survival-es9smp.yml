doi: 10.5555/slop.es9smp
summary: >-
  A research poster from the School of Underlying Conditions treats the
  departure times of 4,316 sessions with an 18-slide narrated module as
  interval-censored between slide transitions, finding that the three animated
  worked examples take 36% of running time and 54% of departures. A 612-session
  heartbeat pilot places departures on those slides a median 66% of the way
  through, where the last-transition rule places them all at the start, and one
  randomised ping per slide recovers the within-slide distribution to within
  0.07.
topic: >-
  Interval-censored survival analysis of where learners abandon narrated
  multimedia modules when the platform logs only slide transitions
