title: Somewhere in Slide Seven
subtitle: Interval-censored departure from a narrated module that logs only slide transitions
authors:
  - Vigdis Emenike
  - Gunnhild Ekwueme
preset: research-poster
school: School of Underlying Conditions
date: 2026-11-20
