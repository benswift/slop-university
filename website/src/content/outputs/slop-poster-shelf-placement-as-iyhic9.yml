summary: >-
  A case note from the School of Continuous Improvement on a divided appeal
  decision holding that a pharmacy's stock of an unregistered barrier cream,
  shelved behind the dispensing counter under a strip naming a skin condition,
  was a medicinal product by presentation, while the same jar beside the till
  was not. The note accepts the majority's point-of-sale test but reads its
  ratio narrowly: the condition named on the strip did the presenting, and
  placement behind the counter alone would present nothing.
topic: >-
  shelf placement as presentation: a doctrinal case note on an appeal panel's
  split decision that a pharmacy's shelf-edge signage made an unregistered
  barrier cream a medicinal product by presentation
