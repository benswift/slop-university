title: "TVI"
subtitle: The Till-Variance Index and the Counting Rituals of a Strip Mall's Shared Group Policy
authors:
  - Kwame Lindqvist
  - Runa Adegoke
  - Mirela Hanke
preset: paper
school: School of Emergent Priorities
