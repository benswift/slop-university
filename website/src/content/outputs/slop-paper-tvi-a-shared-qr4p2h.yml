doi: 10.5555/slop.qr4p2h
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement interviews 22 of 31 traders on a strip mall's shared
  small-business insurance policy about the counting rituals they have adopted
  since a Till-Variance Index began setting their premiums directly. Set
  against an independent cash-handling audit, the index explains under five
  percent of the variance in traders' actual cash-handling risk.
topic: >-
  TVI, a shared insurer's till-variance index built from strip-mall traders'
  nightly float-reconciliation logs, sets next year's group-policy premium for
  every trader on the strip; shopkeepers describe, in their own words, the
  counting rituals they adopted once the index started setting real premiums,
  before the insurer had validated it held consistently across differently
  sized shops
