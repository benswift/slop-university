summary: >-
  A civic brochure led by the School of Settled Matters invites the town's
  residents to lodge felt reports of the small earthquakes they notice, to host
  the School of Underlying Conditions' instruments beneath halls and
  classrooms, and to attend the Received Readings Group's open readings, at
  which entries in the town's record of the ground are read aloud and closed.
  It profiles two researchers and cites six published studies by title and
  DOI.
