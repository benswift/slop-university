summary: >-
  A marketing poster for the School of Emergent Priorities sets two graduate
  students at a teaching-laboratory bench lined with ball-and-stick models of
  one fused-ring scaffold, each copy carrying a different small side-group,
  and invites applicants to a Master of Priority Studies that teaches them to
  read the scaffold every agenda is built on. Developed for the University's
  landscape signage rotation.
