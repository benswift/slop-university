title: What the Clearing Kept
subtitle: Retained Trees and the Recruitment Hollow as a Record of Field Opening in a Sudano-Sahelian Parkland
authors:
  - Anselm Threlkeld
  - Gunnhild Ekwueme
  - Clemency Tredinnick
preset: paper
school: School of Settled Matters
