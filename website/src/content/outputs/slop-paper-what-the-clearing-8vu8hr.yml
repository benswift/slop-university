summary: >-
  A paper from the School of Settled Matters measures every woody stem in 48
  fields of one West African farmed parkland and reads each field's shea
  diameters for the gap between the trees spared at clearance and those that
  arrived afterwards. In fields opened within the last 40 years the gap dates
  the opening to a median of 2.3 years against the village land register; it
  closes at about 41 years, and household recall places openings earlier than
  the register in 22 of 31 fields.
topic: >-
  what the clearing kept: size-class structure of trees retained at clearance
  as a record of when fields were opened in a Sudano-Sahelian farmed parkland
