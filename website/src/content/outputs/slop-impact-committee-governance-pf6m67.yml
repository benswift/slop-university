summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 traces five
  years auditing quorum and minute-taking across sports clubs, sheds, choirs,
  allotment societies and raffle panels, and follows the resulting
  Quorum-and-Minute Quadrant into a funding rule that excludes any committee
  returned as procedurally unminuted for two consecutive review cycles from
  the School's community-partnership funding round, with no manual override
  --- a rule that currently exempts the well-documented committees the
  Quadrant's own Retroactive cell shows never reached quorum at all.
topic: >-
  committee governance discipline for volunteer-run community groups -- the
  sports club, the shed, the choir, the allotment society and the raffle
  panel, culminating in a quorum-and-minute quadrant that the School adopts
  as a binding eligibility gate for its own community-partnership funding
