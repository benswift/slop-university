title: "Nobody Read the Minutes, But Everybody Signed Them"
subtitle: >-
  Five Years Auditing Quorum and Minute-Taking Across the Sports Club, the
  Shed, the Choir, the Allotment Society and the Raffle Panel, and the
  Funding Rule the School Built From What It Found
