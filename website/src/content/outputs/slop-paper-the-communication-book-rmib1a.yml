summary: >-
  A paper from the School of Settled Matters and the School of Emergent
  Priorities codes 600 entries from the communication books of nine
  independent community pharmacies, kept over fourteen months, and has three
  site-naive locum pharmacists judge which they could act on without phoning
  regular staff. Entries that pointed back to a shared moment ("as discussed",
  "the usual", an unanchored "her") needed a call 60.3 per cent of the time
  against 17.2 per cent for those that did not, and a complete entry with one
  back-reference fared worse than a back-reference-free entry missing three of
  its five core elements; only calendar pointers that led to an earlier entry
  in the same book were close to harmless.
topic: >-
  the communication book left for the locum: a content analysis of the day
  books kept in community pharmacies, asking which entries a locum pharmacist
  arriving next morning could act on without phoning anyone, and finding that
  shorthand pointing back to a shared moment (as discussed, the usual, see
  Tuesday) rather than missing detail decided it
