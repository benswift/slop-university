title: A Parking Sign's Exact Minute Sorts Every Kerb It Touches
subtitle: >-
  The School of Continuous Improvement's Impact Report 2021-2026 turns a
  street-sweeping cutoff into the register that now resets kerbside sign
  timing every term
authors:
  - Marit Osayande
  - Casimir Beng
  - Dagny Okafor
  - Sten Okwuosa
preset: impact-report
school: School of Continuous Improvement
date: 2026-09-15
publishedAt: "2026-09-15T22:51:09+10:00"
doi: 10.5555/slop.nqrdd1
summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 follows a
  street-sweeping parking ban's exact start time across four council areas,
  finding enforcement begins within roughly ninety seconds of its printed
  minute and building the resulting ticketing register into the standard now
  used to reset kerbside sign timing, partner dashboards, and evaluation
  eligibility each term.
topic: >-
  A street-sweeping parking ban's exact start time sorts parked cars into a
  natural experiment on who moves in time; the ticketing register built from
  it now resets kerbside signage timing for the school run and nearby bus
  stops each term.
