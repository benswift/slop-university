summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 sets out three
  case studies of what chemistry characterisation reports do with the signals
  they cannot assign. A reading of 1,146 archived reports from a shared NMR
  facility and a dual-sector institution finds the share listing such a signal
  as observed and not assigned rising from 9 to 58 per cent after a line for it
  entered the facility's report template in July 2024; one circulated sample
  shows no two of nine laboratories setting aside the same minor signals; and
  152 of 412 published spectrum figures omit a signal visible in the raw file.
