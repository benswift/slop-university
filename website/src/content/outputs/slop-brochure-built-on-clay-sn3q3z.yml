summary: >-
  A civic brochure from the School of Continuous Improvement presents the
  University's place-based work on a town's shrink-swell clay: the seasonal
  record households keep of the cracks that open and close above their
  doorways, the footpaths and school ovals walked with the crews who maintain
  them, and the community gardens worked on heavy ground. It sets that work
  beside six of the University's published studies of clay, soil and the
  records kept of them.
