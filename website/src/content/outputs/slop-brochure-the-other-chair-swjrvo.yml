summary: >-
  A prospectus led by the School of Continuous Improvement invites prospective
  students into three programs that borrow their working habits from
  psychotherapy: the case conference behind Improvement Grand Rounds, the
  working alliance behind the Master of Applied Measurement, and the
  fixed-length session behind Capability Sprints. It grounds the invitation in
  five published University studies, each cited by DOI, and in the voices of
  the programs' convenors.
topic: >-
  the other chair: what the consulting room teaches an institution about
  changing itself, a prospectus selling the School's borrowed psychotherapy
  habits (case formulation, the working alliance, the fifty-minute hour) to
  students who want to help institutions change
