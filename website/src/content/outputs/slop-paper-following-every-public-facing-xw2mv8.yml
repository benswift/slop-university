title: Time to Correction
subtitle: >-
  A Twenty-Six-Week Competing-Risks Analysis of Public-Facing Clock Error
  Following the Daylight-Saving Changeover
authors:
  - Fenna Okoro
  - Ingrid Vasseur
  - Petra Umbile
preset: paper
school: School of Emergent Priorities
date: 2026-08-19
publishedAt: "2026-08-19T18:04:03+10:00"
doi: 10.5555/slop.xw2mv8
summary: >-
  A paper from the School of Emergent Priorities photographs the 187
  public-facing clock faces of four suburban shopping strips daily for the
  twenty-six weeks between daylight-saving changeovers, modelling the 83
  initially wrong faces as a competing-risks process whose terminal states are
  correction, stoppage or removal, and being overtaken by the next changeover.
  Correction plateaus at 49.4% by week 26 while 32.5% of faces stay wrong
  until the calendar resolves them; analogue faces are corrected at nearly
  twice the subdistribution hazard of digital ones, and the strips' quarterly
  streetscape-presentation audits, whose defect taxonomy registers a stopped
  clock but not a wrong one, quintuple the removal hazard of stopped faces
  while leaving wrong faces untouched.
topic: >-
  following every public-facing clock in four suburban shopping strips through
  the twenty-six weeks after the daylight-saving changeover --- a daily
  photographic panel and competing-risks survival analysis of whether a wrong
  clock is corrected by its keeper, removed by a streetscape-presentation
  audit that counts a stopped clock as a defect but reads a wrong one as
  working, or simply overtaken by the next changeover
