title: Where One Descriptor Ends
subtitle: Literary Warrant, Lead-In Terms and the Spread of Green economy in a Regional Development Library's Thesaurus, 1984–2021
authors:
  - Brynjar Obiora
  - Sunniva Balogun
preset: paper
school: School of Underlying Conditions
date: 2026-11-02
publishedAt: "2026-11-02T05:01:16+11:00"
doi: 10.5555/slop.5wief0
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities follows one descriptor, Green economy, through seven editions of a
  regional development agency library's thesaurus and the 412 warrant slips
  behind them. Admitted in 1993 with a narrow scope note and one lead-in term,
  it carried 31 lead-ins by 2021, 30 added as minor amendments on a single
  indexer's slip, while its scope note was revised once, to be narrower, and
  its neighbour Regional development lost four lead-ins to it.
topic: >-
  where one descriptor ends: literary warrant, scope notes and the slow spread
  of 'green economy' across its neighbours in a regional development agency
  library's thesaurus, read through four decades of editions
