title: Counting In from the Edge
subtitle: >-
  Fringe counting versus chart matching for interference-order estimates in
  first-year petrography
authors:
  - Brynjar Obiora
  - Ragnhild Uzoma
  - Ingeborg Nwachukwu
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-20
publishedAt: "2026-10-20T09:00:53+11:00"
doi: 10.5555/slop.lsnrae
summary: >-
  A research poster from the School of Underlying Conditions compares two
  practical streams of a first-year earth-science unit, one taught to match a
  grain's interference colour against the Michel-Lévy chart and one taught to
  count fringes inward from the grain's tapered margin. Edge counters made
  about half the order errors in week 4 and again in week 9, with the gap
  widest at higher orders and absent on grains that show no margin, and in
  think-aloud sessions they described colour by position rather than by hue.
topic: >-
  Counting in from the edge: whether teaching first-year petrography students
  to count interference fringes at a grain's tapered margin, rather than match
  its colour to the Michel-Lévy chart, reduces order errors in their
  birefringence estimates
