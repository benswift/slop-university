summary: "Postdoctoral Fellow Dr Anouk Mensah catalogues the sentences an organisation
  keeps saying after the reason for them has gone. In this profile she takes three
  of her own studies in turn: fourteen price-match promises that gained one comma
  between them in a decade while their fine print grew sixfold, a share house's quiet
  hours pinned at ten and kept past eleven, and a library desk still classed as interim
  after seven extensions. The narrator adds her citation record, ahead of most senior
  staff in the School of Emergent Priorities."
topic: "a promo profile of Dr Anouk Mensah, Postdoctoral Fellow in the School of Emergent
