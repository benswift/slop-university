summary: >-
  A research poster from the School of Continuous Improvement models the yearly
  grading bill of a private no-through gravel road shared by seven households
  as an airport cost-allocation game. It shows that the road association's
  equal levy lies outside the core at six nested coalitions, that the Shapley
  value and a pro rata rule both lie inside it, and that no blocking coalition
  appears in nineteen years of the association's minutes.
topic: >-
  Sharing a gravel road: seven households on a private no-through road split
  the yearly grading bill, modelled as an airport cost-allocation game, with
  the Shapley value and a pro rata rule set against the road association's
  equal levy and tested for membership of the core
