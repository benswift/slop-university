title: Occasioned by One Report
subtitle: Provenance and Later Reach of the House Rules in a Regional Pharmacovigilance Centre's Causality-Assessment Manual, 2008–2024
authors:
  - Anselm Threlkeld
  - Odalys Penhallow
  - Ylva Ogunbanjo
preset: paper
school: School of Settled Matters
date: 2026-11-21
publishedAt: "2026-11-21T09:01:48+11:00"
doi: 10.5555/slop.mm62wg
summary: >-
  A paper from the School of Settled Matters and the School of Emergent
  Priorities traces the 34 house rules in one regional pharmacovigilance
  centre's causality-assessment manual to the minutes that adopted them and
  codes 1,560 later citations against the facts each meeting relied on. It
  finds that the 18 rules written after a single disputed report were cited for
  reports lacking those facts in 15 per cent of cases in their first two years
  and 60 per cent from the eighth, mostly by assessors who joined after the
  rule was made, and that they raised agreement between paired assessors only
  within the facts that occasioned them.
topic: >-
  where a regional pharmacovigilance centre's house rules for causality
  assessment came from: tracing each rule in its local assessment manual to the
  disputed report that occasioned it, and following how far assessors later
  stretch each rule beyond that report's facts
