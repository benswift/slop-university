title: Where the Catalyst Went
subtitle: A Gravimetric Mass Balance over Thirty Recycles of a Silica-Immobilised Palladium Catalyst
authors:
  - Sunniva Balogun
  - Halvard Nnamani
  - Ragnhild Uzoma
preset: paper
school: School of Emergent Priorities
date: 2026-10-12
publishedAt: "2026-10-12T21:00:28+11:00"
doi: 10.5555/slop.efb68v
summary: >-
  A paper from the School of Emergent Priorities and the School of Underlying
  Conditions recycles one batch of a silica-immobilised palladium catalyst
  thirty times in a model Suzuki coupling, keeping and analysing every filter
  paper, spatula rinse and sampling filter. Conversion at a fixed time fell
  from 71.0% to 38.3% under a filtration work-up while the rate constant per
  gram of catalyst present stayed unchanged, 22.7 mg of the 50.0 mg charged was
  found in the thirty filter papers, and a second campaign separated by
  centrifugation in a single tube held between 67.6% and 71.8% throughout.
topic: >-
  Thirty recycles of a silica-immobilised palladium catalyst in a model Suzuki
  coupling, with every filter paper weighed: a mass balance showing that the
  catalyst's apparent deactivation is solid lost in handling, and a centrifuge
  work-up that holds the yield flat
