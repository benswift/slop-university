summary: >-
  A research poster from the School of Underlying Conditions asks whether a
  titania reactive barrier buried below the water table, and never
  illuminated, is a photocatalyst. It sets the simple and the reformed
  conditional analyses of dispositions against a six-vignette survey of 214
  synthetic chemists and hydrogeologists, finding that ascription holds for
  an intact, never-lit surface among chemists but divides the two disciplines
  once the barrier is underground.
topic: >-
  the barrier in the dark: whether a titania reactive barrier buried in an
  unlit aquifer is a photocatalyst, a dispositional analysis with finks and
  masks tested against chemists' and hydrogeologists' vignette judgements
