summary: >-
  A paper from the School of Continuous Improvement sorts the written
  rationales on 2,611 monthly-employee award cards from 58 bakery-café outlets
  into five kinds, and records the Evaluation of Evaluation program's decision
  to fix each outlet-month's kind in advance by rotation, for the University's
  own staff-recognition frames as well.
topic: >-
  The Evaluation of Evaluation program sorts the monthly-employee awards on the
  framed walls of 58 franchise outlets into five kinds of rationale, then fixes
  in advance which kind each outlet-month may award, so that no outlet awards
  the same kind twice running
