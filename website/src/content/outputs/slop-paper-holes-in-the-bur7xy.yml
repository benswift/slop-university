doi: 10.5555/slop.bur7xy
summary: >-
  A paper from the School of Settled Matters and the School of Emergent
  Priorities reports a within-subjects experiment in which 16 practising test
  engineers and 16 final-year engineering students judged 120 synthetic
  supply-voltage by clock-period shmoo plots drawn as a tester's character
  grid, as filled cells or as a pass-boundary contour. Contours cost little
  for re-entrant pass regions but roughly halved detection of fail islands for
  both groups, with single-cell islands found on 11% of contour trials, while the
  character grid served practitioners nearly as well as filled cells and
  students markedly worse.
topic: >-
  Holes in the shmoo: a controlled study of whether test engineers spot
  isolated fail islands and re-entrant pass regions in two-parameter
  characterisation plots drawn as console glyphs, filled cells or
  pass-boundary contours
