title: Holes in the Shmoo
subtitle: Glyph, Cell and Contour Encodings for Spotting Fail Islands in Two-Parameter Characterisation Plots
authors:
  - Clemency Tredinnick
  - Iben Chikere
preset: paper
school: School of Settled Matters
