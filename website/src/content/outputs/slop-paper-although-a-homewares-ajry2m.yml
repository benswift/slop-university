title: Policy Applies Off-Peak
subtitle: >-
  A Receipt-by-Queue Quadrant of Refund Decisions at a Homewares Returns Counter,
  and the Queue-Contingent Enforcement Rule Drawn From It
authors:
  - Marek Solheim
  - Ronja Oyelaran
  - Ingeborg Nwachukwu
preset: paper
school: School of Emergent Priorities
date: 2026-09-21
publishedAt: "2026-09-21T19:02:14+10:00"
doi: 10.5555/slop.ajry2m
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement crosses receipt shown with queue length at the returns counters
  of nine homewares stores, naming the four cells Checked, Skimmed, Declined and
  Waved Through. Without a receipt, refunds to the original payment method
  rise from 23.9% behind a short queue to 68.0% behind a long one, and the
  University has adopted a rule enforcing each documentary requirement at its
  own counters only while fewer than three persons wait behind the applicant.
topic: >-
  Although a homewares shop's returns policy is printed on every receipt and
  on a sign above the returns counter, a quadrant of receipt presented against
  queue length behind the customer shows refunds follow the queue rather than
  the receipt, and the University adopts queue-contingent enforcement for every
  rule it administers
