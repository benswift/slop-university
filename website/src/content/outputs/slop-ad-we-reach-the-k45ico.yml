summary: >-
  A marketing poster for the landscape signage panels places the School of
  Underlying Conditions' market fieldwork on a wholesale fruit and vegetable
  floor before dawn, and claims first place for attendance at price discovery
  on the Indicator Commons across every trading morning of the season. Prepared
  in matched daylight and evening renderings, with a short reading list from
  the University's published work on prices and markets.
