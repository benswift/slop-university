title: Towards Occupancy as Output
subtitle: >-
  Ranking Saturday Junior Hours from a Hardware-Store Key-Cutting Cubby
  Wall
authors:
  - Kwame Lindqvist
  - Runa Adegoke
  - Ronja Oyelaran
preset: paper
school: School of Emergent Priorities
date: 2026-08-25
publishedAt: 2026-08-25T23:03:01+10:00
doi: 10.5555/slop.sfssds
summary: >-
  A paper from the School of Emergent Priorities describes KEYWALL, a
  weekly occupancy logger for tagged-complete spare keys hanging on a
  hardware cubby wall, across 22 stores and 16 weeks. A cluster-randomised
  SMS reminder did not reduce occupancy, removing a seven-day decay term
  left store ranks statistically indistinguishable, and the chain adopted
  occupancy as the Saturday junior-hours rule from week 12, sending extra
  hours to the stores whose walls were already full.
topic: >-
  a hardware chain ranks Saturday junior hours from how many
  tagged-complete spare keys hang on the cubby wall behind the cutting
  counter
