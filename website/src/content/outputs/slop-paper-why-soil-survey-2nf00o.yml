doi: 10.5555/slop.2nf00o
summary: >-
  A paper from the School of Underlying Conditions treats the joins between the
  sheets of a soil survey as a nonabelian Čech cocycle and classifies joined
  mosaics by the permutations their units undergo when carried once round each
  unsurveyed hole. It proves that a single legend exists exactly when the
  corner checks pass and one composite join per hole is the identity, bounds
  the miscorrelation any renumbering must leave along a seam, and works through
  an eight-sheet basin whose three mid-slope units rotate round its lake.
topic: >-
  Why soil survey sheets that join pairwise can still fail to join around an
  unsurveyed lake: map-unit correlation as nonabelian Čech cohomology
