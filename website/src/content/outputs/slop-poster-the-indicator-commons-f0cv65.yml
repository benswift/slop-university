summary: >-
  A research poster from the School of Continuous Improvement sorts 3,311
  signatures on 148 circulated office farewell cards into a four-cell quadrant
  of signing position by message form, and reports the Indicator Commons
  adopting a Warmth Floor that returns any card whose second half runs cold to
  its first signer for a further circuit.
topic: >-
  The Indicator Commons sorts the signatures on circulating open-plan farewell
  cards into a four-cell quadrant of signing position by message form, and
  rules that any card whose second half runs cold goes back to its first signer
  for a compulsory second circuit
