title: Counting From the Last Crossing
subtitle: >-
  Permittivity Ageing in Eleven Years of a Teaching Laboratory's Barium
  Titanate Discs
authors:
  - Clemency Tredinnick
  - Eivind Onwuka
  - Bram Ntuli
preset: paper
school: School of Settled Matters
date: 2026-11-24
publishedAt: "2026-11-24T09:02:47+11:00"
doi: 10.5555/slop.vi82qd
summary: >-
  A paper from the School of Settled Matters and the School of Continuous
  Improvement transcribes eleven years of a teaching laboratory's log for 48
  barium titanate discs and finds that their room-temperature permittivity
  falls on one logarithmic ageing line, at 2.9% per decade, once each disc's
  age is counted from its own last crossing of the Curie point rather than
  from its sintering or its logged furnace set-point. Heatings near the
  transition reset a disc fully or not at all, and three discs that sat above
  the line locate a re-silvering the log never recorded.
topic: >-
  Logarithmic ageing of permittivity in a laboratory's stock of barium titanate
  disc capacitors, timed from each disc's last crossing of the Curie point and
  read from eleven years of its measurement log
