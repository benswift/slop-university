doi: 10.5555/slop.xg5wiq
summary: >-
  A research poster from the School of Continuous Improvement runs one integer
  program over three seasons of a regional grain co-operative's published
  monthly and year-to-date receival tables and recovers exactly 941 of the
  1,117 monthly cells it suppressed for falling under five loads, against 253
  from the monthly tables alone. It then prices the same releases under
  zero-concentrated differential privacy at a median error of three loads a
  cell.
topic: >-
  Suppressed cells, overlapping tables: reconstructing a grain cooperative's
  member delivery counts from its monthly reports, and pricing the
  differentially private release that would have stopped it
