title: The Cell Below Five
subtitle: Reconstructing a grain co-operative's suppressed delivery counts from its own year-to-date tables
authors:
  - Torun Ezeigwe
  - Marit Osayande
  - Sten Okwuosa
preset: research-poster
school: School of Continuous Improvement
date: 2026-11-03
