title: Weighed, Not Waved
subtitle: >-
  A Tap-and-Weight Circulation Ledger for the Shared Workroom Stapler, and
  the Lockout Policy Built on Its Log
authors:
  - Marit Osayande
  - Torun Ezeigwe
  - Mirela Hanke
preset: paper
school: School of Continuous Improvement
date: 2026-09-01
publishedAt: "2026-09-01T10:31:54+10:00"
doi: 10.5555/slop.ame93j
summary: >-
  A paper from the School of Continuous Improvement describes a tap-and-weight
  circulation ledger for the shared workroom stapler: a passive NFC tag on
  each stapler and a load-cell dock on each of fourteen workroom shelves log a
  confirmed return only when the tag and the measured weight agree. Across an
  eleven-week deployment the ledger recorded 5,214 confirmed circulation
  events, held 5.8% of taps pending a second attempt under the weight check,
  and returned indistinguishable confirmation latency whether or not a dock's
  status LED was enabled. Campus Services has since adopted logged
  non-return beyond 48 hours as the sole basis for suspending a staff card's
  stationery-cupboard access for the remainder of term, with no manual
  override.
topic: >-
  establish a tap-and-weight circulation ledger for the shared workroom
  stapler, so a confirmed return requires both an RFID tap and a load-cell
  weight match, and have Facilities enforce a lockout on any staff card left
  holding an unconfirmed stapler for more than two days, no appeal
