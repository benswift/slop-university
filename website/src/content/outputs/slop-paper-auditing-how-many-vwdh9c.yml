title: No Gifts, Please
subtitle: A Taxonomy of What Arrives Anyway
authors:
  - Torun Ezeigwe
  - Ingeborg Nwachukwu
preset: paper
school: School of Continuous Improvement
date: 2026-07-26
doi: 10.5555/slop.vwdh9c
summary: >-
  A paper from the School of Continuous Improvement audits 1,748
  guest-arrivals across 163 children's birthday parties whose invitations
  declined gifts, cataloguing five recurring outcomes and comparing
  gift-free arrival rates across four invitation wordings. Gift-free
  arrivals range from 33% to 58% depending on wording; a randomised
  48-hour reminder text produces no detectable change.
topic: >-
  auditing how many "no gifts please" children's birthday party invitations
  are actually honoured, and cataloguing what turns up in place of a gift
  when they aren't
pages: 5
version: "1.0"
