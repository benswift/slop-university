doi: 10.5555/slop.661nif
summary: >-
  A paper from the School of Continuous Improvement and the School of
  Emergent Priorities rescreens retained aliquots of all 56 drug-free
  blank-blood lots a coronial toxicology laboratory used for its calibrators
  between 2013 and 2024, and finds that no lot was blank: every one carried
  caffeine, and 18 carried paracetamol, 11 of them above 20% of the method's
  limit of quantitation. Because a fitted calibration line absorbs the
  background, it passed to case results as an equal negative bias, and
  recalculation moved 29 of 2,860 affected results above the reporting limit.
topic: >-
  Twelve years of supposedly drug-free blank blood lots used to build a
  postmortem toxicology laboratory's calibrators, rescreened to find what the
  donors left in them --- caffeine, cotinine, paracetamol --- and what that
  does to a 'not detected'
