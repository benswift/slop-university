title: One Exception Left
subtitle: >-
  A Single-Site Case Study of a Café Chain's Scored Discretion Budget for
  Roster Overrides
authors:
  - Iben Chikere
  - Torun Ezeigwe
  - Ingeborg Nwachukwu
preset: paper
school: School of Emergent Priorities
date: 2026-09-16
publishedAt: "2026-09-16T02:52:58+10:00"
doi: 10.5555/slop.l61655
summary: >-
  A paper from the School of Emergent Priorities follows one café's duty
  manager across a 13-week quarter, tracing how a fixed quarterly allowance
  of roster overrides against an algorithmic schedule ran to zero, and how
  the chain's Head Office Rostering Committee responded to the quarter's
  aggregate figures by reducing the allowance further.
topic: >-
  The Head Office Rostering Committee holds a single cafe's shift roster to
  an algorithmic reliability score derived from punctuality pings,
  overriding the duty manager's discretion when a barista's family
  emergency collides with the locked roster
