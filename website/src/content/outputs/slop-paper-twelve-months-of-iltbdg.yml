title: Reclaim Hall B and the Stand-Back Line
subtitle: >-
  A Twelve-Month Depth-Sensing Case Study of Standoff Distance at a Regional
  Airport Baggage Carousel
authors:
  - Marit Osayande
  - Casimir Beng
  - Ingrid Vasseur
preset: paper
school: School of Continuous Improvement
date: 2026-08-17
publishedAt: 2026-08-17T03:05:03+10:00
doi: 10.5555/slop.iltbdg
summary: >-
  A paper from the School of Continuous Improvement instruments a
  single-carousel baggage reclaim hall with four ceiling-mounted time-of-flight
  sensors for twelve months, recording 251,308 anonymous dwell tracks across
  3,914 arrivals while the hall's stand-back line is repainted three times from
  900 mm to 1,800 mm from the belt lip. Mean modal standoff distance of the
  front rank varies within a 17 mm band with no monotonic relationship to the
  line's position, while the operator's published line-adherence figure falls
  from 34.1 to 3.7 per cent; an attended block raises standoff by 394 mm, an
  effect that decays to baseline a median of 38 seconds after the attendant
  leaves the hall.
topic: >-
  Twelve months of overhead depth sensing above a regional airport's baggage
  carousel, recording where a quarter of a million arriving passengers actually
  stand as the terminal's stand-back line is repainted further out three times,
  finding the crowd re-forms at the same distance from the belt regardless of
  where the line is --- and the terminal-experience group's decision to roster a
  person beside it permanently and book the position against its automation
  program
