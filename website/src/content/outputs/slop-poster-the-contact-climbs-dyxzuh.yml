summary: >-
  A research poster from the School of Underlying Conditions traces a single
  tuff bed through eleven cored boreholes along a 58 km transect of an unnamed
  foreland basin and picks the gradational base of a deltaic sandstone
  formation in each, once in core and once on the gamma-ray log. The base lies
  12-19 m below the tuff at the basin margin and 13-26 m above it at the
  centre, so the mapped formation contact is time-transgressive, and the
  interval between the two picks widens basinward from 6.5 m to 12.8 m.
