summary: >-
  A research poster from the School of Emergent Priorities diary-codes 52
  households over ten weeks into five recurring workaround types once a
  toddler declares a preferred bedtime parent, finding household structure
  predicts a workaround's type far more reliably than it predicts how long
  that workaround survives before renegotiation.
topic: >-
  a diary-coded taxonomy of the workarounds parents invent once a toddler
  declares a favourite for the bedtime story, and how long each workaround
  survives before the child renegotiates it
