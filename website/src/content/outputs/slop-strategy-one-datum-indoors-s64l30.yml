title: One Datum, Indoors and Out
subtitle: A strategic plan for carrying a single positioning reference through the doorway and down to the basement
authors:
  - Brynjar Obiora
  - Ragnhild Uzoma
preset: strategy
school: School of Underlying Conditions
date: 2026-10-10
publishedAt: "2026-10-10T22:01:56+11:00"
doi: 10.5555/slop.s64l30
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to a
  single positioning datum, physically marked and kept in a register by the
  School of Underlying Conditions, to which every room, fixed asset and
  registered instrument will be referred with a declared tolerance. Its four
  priorities establish the datum, class every principal entrance by how
  positioning changes across it, carry the reference to each occupied level
  below ground and into the bore network, and build the community's
  capability to use it.
topic: >-
  one datum indoors and out: the University commits to knowing where it
  stands, carrying a single positioning reference from open ground through the
  doorway and down into the basement
