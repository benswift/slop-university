title: Standardising the Reasons People Leave
subtitle: How One Exit Interview Became the National Training Case
authors:
  - Petra Umbile
  - Iben Chikere
  - Solveig Adeyemi
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-01
