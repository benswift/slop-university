doi: 10.5555/slop.6kskal
summary: >-
  A research poster from the School of Emergent Priorities follows a single
  franchise site's exit interview into a business-school-style teaching case,
  and reports the case's three-reason taxonomy accounting for the large
  majority of national intake coding within six months of the case becoming
  mandatory training, against a far wider spread of reasons logged
  beforehand.
topic: >-
  The HR case officer who wrote up a single departing employee's exit
  interview trims its three contradictory verbal complaints into one clean
  intake reason for a training case; a single-site case study, told in the
  register of a business-school teaching case complete with discussion
  questions, follows the write-up's life once Head Office adopts it as the
  mandatory national training material and locks every future site's
  exit-interview form to its three-reason taxonomy.
