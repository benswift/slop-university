summary: >-
  A research poster from the School of Settled Matters reads the taxed bills of
  costs in all 41 contested assessments under one head of a colonial stamp
  duties schedule, 1884–1923, against the duty each put in dispute. Costs ran to
  £3 4s for every pound of duty, taxpayers bore 62% of them, and sales lodged as
  agreements at the lower rate rose to 31% while the word stayed doubtful before
  falling to 9% after the appellate ruling that settled it.
topic: >-
  Who paid for a doubtful word: taxed costs and assessed duty across four
  decades of litigation over one clause of a colonial stamp duties act, from the
  first disputed assessment to the appellate ruling that settled it
