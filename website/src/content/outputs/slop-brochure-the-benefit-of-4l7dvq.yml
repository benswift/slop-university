summary: >-
  A research-showcase brochure led by the School of Settled Matters presents the
  University's work on comparing units that do different work, under the
  principle that each be weighed on the terms most favourable to it before it is
  set against its peers. It features the Schools of Settled Matters, Underlying
  Conditions, Emergent Priorities and Continuous Improvement, and cites seven
  published studies by title and DOI.
topic: >-
  the benefit of the doubt: a research showcase for how Slop University compares
  court registries, depots and field camps that do different work, by letting
  each unit be weighed on the terms most favourable to it
