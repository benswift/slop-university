title: Forty-Seven Openings
subtitle: >-
  Photoluminescence Loss and Sedimentation in One Shared InP/ZnSe/ZnS
  Quantum-Dot Stock over Fourteen Months
authors:
  - Odalys Penhallow
  - Clemency Tredinnick
  - Eskil Nwabueze
preset: paper
school: School of Settled Matters
