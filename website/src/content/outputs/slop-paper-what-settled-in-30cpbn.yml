doi: 10.5555/slop.30cpbn
summary: >-
  A paper from the School of Settled Matters follows one shared stock of
  InP/ZnSe/ZnS quantum dots through 47 logged openings over 61 weeks,
  measuring a sentinel aliquot at each. Its photoluminescence quantum yield
  falls from 79.8% to 50.2%, about 0.81 points with each of the 29 openings
  made on the open bench against 0.077 points a week of age, and the 5.8 mg
  deposit at the vial's foot proves to be aggregated dots of the batch's own
  size rather than a size fraction.
topic: >-
  what settled in the shared stock vial of one InP/ZnSe/ZnS quantum-dot batch
  drawn from by a research group for fourteen months: photoluminescence and the
  aggregate at the vial's foot, opening by opening
