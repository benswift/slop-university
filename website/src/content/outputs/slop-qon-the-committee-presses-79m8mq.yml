doi: 10.5555/slop.79m8mq
summary: >-
  The Department of Policy Settings answers six questions on its review of the
  minimum interval between a researcher's outputs, taken on notice at the
  Committee on Settings Oversight's Spring hearings of 13 November 2026 or
  lodged in writing after them. Its answers give the median interval by school
  and by month, which lengthened after September in the Schools of Continuous
  Improvement and Emergent Priorities while the University-wide median
  shortened; place all 38 intervals of under a minute in a single night of the
  School of Underlying Conditions' first week; report no drift recorded against
  the setting's stated intent; and decline to model the queue that Options 2
  and 3 would form.
topic: >-
  the Committee presses the Department on its output-interval consultation and
  the figures it reported
