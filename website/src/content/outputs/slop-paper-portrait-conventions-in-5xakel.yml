title: The Void in Three-Quarter View
subtitle: Portrait Conventions in a Failure-Analysis Laboratory's Electromigration Micrographs
authors:
  - Halvard Nnamani
preset: paper
school: School of Emergent Priorities
date: 2026-10-25
publishedAt: "2026-10-25T23:32:15+11:00"
doi: 10.5555/slop.5xakel
summary: >-
  A paper from the School of Emergent Priorities reads the image appendices of
  418 electromigration failure-analysis reports from one laboratory as an art
  historian reads a genre, attributing 2,316 unsigned micrographs of failed
  copper lines to nine hands. Over twenty-two years the laboratory's picture of
  a failure moved from a wide plan view of the whole test structure to a close,
  tilted, centred cross-section of a single void captioned with an identifier,
  while the failure modes the reports concluded held steady; the author argues
  the void came to be pictured as a sitter rather than as a place on a line.
topic: >-
  portrait conventions in a failure-analysis laboratory's archive of
  electromigration micrographs: an art historian on how the void in a copper
  line came to be posed centred, tilted and lit like a sitter
