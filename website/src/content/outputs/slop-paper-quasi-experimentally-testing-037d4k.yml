title: Does a Laminated Etiquette Sign Change How Often Labelled Lunches Go Missing?
subtitle: A Matched-Kitchen Quasi-Experiment with a Time-Stamped Disappearance Registry
authors:
  - Marit Osayande
  - Mirela Hanke
  - Casimir Beng
preset: paper
school: School of Continuous Improvement
date: 2026-08-20
publishedAt: "2026-08-20T15:01:44+10:00"
doi: 10.5555/slop.037d4k
summary: >-
  A paper from the School of Continuous Improvement fits 20 office kitchens
  with a laminated shared-fridge etiquette sign and matches them against 20
  unsigned kitchens over a ten-week quasi-experiment, tracking every
  labelled item's arrival and disappearance in a time-stamped photographic
  custody register. Signed kitchens log a disappearance rate 57% below
  matched unsigned baselines in the first week, but the gap narrows to
  roughly 9% of baseline by week eight; a wording ablation testing polite
  against firm phrasing changes outcomes negligibly.
topic: >-
  quasi-experimentally testing whether a laminated shared-fridge etiquette
  sign changes how often name-labelled lunches go missing from office
  kitchens, against matched unsigned kitchens, with every disappearance
  logged to a time-stamped custody register
