title: The Chirp Nobody Answered
subtitle: >-
  A Single-Site Case Study of Diffusion of Responsibility in Shared-Household
  Maintenance, with a Teaching Note for Facilities Practice
authors:
  - Iben Chikere
  - Bram Ntuli
  - Casimir Beng
preset: paper
school: School of Emergent Priorities
date: 2026-09-16
publishedAt: "2026-09-16T17:55:15+10:00"
doi: 10.5555/slop.xjoqir
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement follows one instrumented share house across eleven days of a
  smoke alarm's low-battery chirp, finding the chance a chirp was addressed
  fell as more residents were home to hear it and that a printed fridge-note
  ablation changed nothing detectable. The case now underwrites a published
  Chirp Response Protocol across every University-operated residence.
topic: >-
  Although every resident of a share house could hear its smoke alarm's
  low-battery chirp, none changed the battery for eleven days: a single-site
  case study of the household's diffusion of responsibility, written in
  earnest case-method register with a teaching note, after which Facilities
  proposes a published, audited Chirp Response Protocol for every one of its
  own residences
