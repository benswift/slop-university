summary: >-
  A marketing poster for the School of Settled Matters pictures a jet climbing
  low over a suburban street and the noise-monitoring mast in a front garden
  below it, and offers the School's reading of a statutory word drafted before
  the aircraft overhead, with Associate Professor Anselm Threlkeld's paper on
  statutory definitions as its featured research. Developed for bus-stop panels
  and campus digital signage in a portrait rotation.
topic: >-
  the noise provision drafted before the jet engine: the School of Settled
