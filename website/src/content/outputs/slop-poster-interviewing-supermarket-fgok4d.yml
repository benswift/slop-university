summary: >-
  A qualitative study interviews 38 reductions officers across fourteen
  stores of one supermarket chain about the vocabulary they use for stock
  they hold back from markdown, and traces what happened to that vocabulary
  once head office required every discretionary hold to be filed on a
  numbered override form.
topic: >-
  Interviewing supermarket reductions officers about the words they use for
  stock they choose not to mark down yet, after head office responded to the
  finding by making every discretionary hold-back require a filed override
  form
