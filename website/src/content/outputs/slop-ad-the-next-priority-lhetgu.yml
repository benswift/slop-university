summary: >-
  A marketing poster for the School of Emergent Priorities sets a songbird at
  the door of a campus nest box beneath a hand lens that holds a single
  feather and its mites, inviting applicants to a Master of Priority Studies
  that teaches them to sense a priority while it is still that small.
  Developed for campus digital signage in a portrait rotation, with
  applications open for Semester 1.
