title: Towards a Certified Handover Timer
subtitle: A Failed Bathroom Replication of a Household Timeout App's Validity Gap
authors:
  - Iben Chikere
  - Solveig Adeyemi
  - Ronja Oyelaran
preset: paper
school: School of Emergent Priorities
