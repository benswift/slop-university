doi: 10.5555/slop.dyaofy
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement redeploys a household timeout-timer app, unmodified, from
  sibling screen-time disputes to a shared family bathroom's shower-turn
  negotiations, finding the earlier instrument-validity gap does not
  reproduce and proposing the app's logged end as residential colleges'
  certified record of shared-bathroom compliance.
topic: >-
  Redeploying the household timeout-timer's logged-end signal from
  screen-time arguments to a shared bathroom's shower timer, to test whether
  the earlier instrument-validity gap between the app's logged end and the
  actual handover replicates for shower turns
