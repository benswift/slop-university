doi: 10.5555/slop.w4v66w
summary: >-
  A research poster from the School of Emergent Priorities audits 214
  households' kitchen cupboards over eight months, open-coding takeaway
  containers into a five-kind typology of unofficial reuse. The typology is
  then piloted as the University's mandatory pre-bin-night sorting standard,
  with contamination flags compared before and after adoption.
topic: >-
  The takeaway container accumulates unofficial second lives --- leftover
  vessel, seed-starter, garage catch-all --- that Slop University now
  taxonomises as the mandatory pre-bin-night sorting standard.
