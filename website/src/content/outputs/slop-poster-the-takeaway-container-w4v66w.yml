title: How Many Kinds of Takeaway Container Is a Kitchen Actually Sorting?
subtitle: A Taxonomy Adopted as the Mandatory Pre-Bin-Night Contamination Standard
authors:
  - Runa Adegoke
  - Mirela Hanke
preset: research-poster
school: School of Emergent Priorities
