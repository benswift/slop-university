summary: >-
  A marketing poster carries Futures in Committee's sharing-roster standard
  onto the University's signage rotation, certifying a food truck and its
  neighbouring strip-mall trader's own grab-it-first order for a shared
  EFTPOS terminal, with terminal access suspended for the week after a
  second missed slot.
topic: >-
  Futures in Committee interviews food-truck operators and strip-mall
  traders who share a single EFTPOS terminal between stalls, and certifies
  their informal whoever-grabs-it-first turn-taking into an official
  sharing-roster standard.
