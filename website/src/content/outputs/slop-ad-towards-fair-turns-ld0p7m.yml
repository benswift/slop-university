title: Towards Fair Turns at the Terminal
subtitle: >-
  A campaign for Futures in Committee's new sharing-roster standard,
  certifying whose turn it is on the one card machine a food truck and its
  neighbouring strip-mall trader pass between them
authors:
  - Ronja Oyelaran
