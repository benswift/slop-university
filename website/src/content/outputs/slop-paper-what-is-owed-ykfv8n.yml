title: What the Dredge Owes
subtitle: On the good of a basin built to fill
authors:
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-10-13
publishedAt: 2026-10-13T01:14:34+11:00
doi: 10.5555/slop.ykfv8n
summary: >-
  An essay in environmental ethics from the School of Emergent Priorities takes
  a stormwater detention basin that silted into a wetland after a scheduled
  dredge was deferred, and asks whether anything is owed to the basin itself
  now that the dredge has been reinstated. It proposes two conditions, lapse
  and self-explanation, under which a designed system acquires a good distinct
  from its design function, and concludes that the dredge should proceed and
  that what it leaves owing is owed by the maintenance schedule and not by the
  engineer.
topic: >-
  What is owed to a stormwater detention basin that has silted into a wetland
  when its maintenance schedule calls for dredging: an environmental-ethics
  essay on whether a designed system can acquire a good of its own distinct
  from its design function
