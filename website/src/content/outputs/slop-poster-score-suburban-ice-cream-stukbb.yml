summary: >-
  A research poster from the School of Emergent Priorities codes 768
  flavour-instances at 48 suburban ice-cream shops into a two-by-two of
  names on the hanging flavour board against tubs in the glass cabinet,
  finding board naming and cabinet presence uncorrelated (φ = 0.01). A
  completeness score that counts names on the board predicted neither match
  rate nor serve volume, and still ranked shops for the next display freezer
  in seven of eight regions.
topic: >-
  Score suburban ice-cream shops on whether the names on the flavour board
  match the tubs in the glass cabinet, find the two uncorrelated, and still
  allocate the next display freezer from a completeness score of the board.
