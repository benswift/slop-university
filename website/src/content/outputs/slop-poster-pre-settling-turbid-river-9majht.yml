summary: >-
  A research poster from the School of Settled Matters feeds turbid river
  water to twenty floating interfacial solar evaporators for thirty days after
  standing it 0, 6, 24 or 72 hours in settling drums. Raw feed kept 54% of its
  day-one yield and a 24-hour stand 88%, against 91% for 72 hours, and a single
  rinse restored the raw arm, locating its loss in deposit on the absorber.
topic: >-
  pre-settling turbid river feedwater before a floating solar interfacial
  evaporator: how many hours of standing preserve its yield over a month
