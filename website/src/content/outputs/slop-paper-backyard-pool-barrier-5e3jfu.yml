title: Passed on the Day
subtitle: >-
  A Multi-State Analysis of Backyard Pool-Barrier Condition Between
  Certifications, Against a Register That Reports Certificates Current
authors:
  - Thandiwe Solberg
  - Torun Ezeigwe
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-07-29
publishedAt: 2026-07-29T13:03:33+10:00
doi: 10.5555/slop.5e3jfu
summary: >-
  A paper from the School of Continuous Improvement re-inspects 312 certified
  backyard pool barriers unannounced, 1,058 times over 76 weeks, and fits a
  reversible three-state Markov model to the panel. At a randomly chosen
  moment 61.4% of certified barriers met every criterion, against a council
  register figure of 98.1%, and the fitted mean sojourn time in the fully
  compliant state is 14.6 weeks against a certificate valid for 156.
topic: >-
  backyard pool-barrier certificates, what unannounced re-inspection finds
  standing between one certification and the next, and what a council
  register's compliance rate reports once the state it certifies turns over in
  a matter of weeks
pages: 6
version: "1.0"
