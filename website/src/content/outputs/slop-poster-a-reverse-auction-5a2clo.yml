title: The Cheapest Bore Was Already Going Dry
subtitle: Adverse Selection in a Reverse Auction to Retire Irrigation Entitlement
authors:
  - Ragnhild Uzoma
  - Runa Adegoke
  - Kwame Lindqvist
preset: research-poster
school: School of Underlying Conditions
