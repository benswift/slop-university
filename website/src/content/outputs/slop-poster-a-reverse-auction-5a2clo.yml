summary: >-
  A research poster from the School of Underlying Conditions reads the 72
  sealed bids in one groundwater district's pay-as-bid auction to retire
  irrigation entitlement against the saturated thickness beneath each bore.
  Bids rose by about $190 per ML/yr for each further metre of saturated
  sediment, so 18 of the 26 accepted bids came from bores over less than 6 m,
  and about three-fifths of the retired volume was predicted to stop pumping
  within eight years without the auction.
topic: >-
  A reverse auction to retire irrigation wells in a declining aquifer district:
  whether irrigators' bids carry what they privately know about the saturated
  thickness beneath them, so that the cheapest retirements are the wells that
  would have gone dry anyway
