summary: >-
  A case-for-support brochure invites partners to sustain the University's
  electrical and electromagnetic research, from the susceptibility loop passed
  along recovered core in the School of Underlying Conditions to the reference
  checks taught on the Master of Applied Measurement's electrical bench. It
  rests its case on seven published studies across three Schools, cited by
  title and DOI.
