summary: >-
  A research poster from the School of Underlying Conditions sorts the 14
  trench sections of a solar farm's 33 kV collector network by mapped soil unit,
  backfills nine with their own screened spoil and five with imported thermal
  sand, and follows the surround's thermal resistivity at cable depth through
  two summers. Seven of the nine native sections stay under the 1.2 K·m/W
  design value at their driest; a sandy loam the survey had passed reaches 1.41
  in both summers, and a cracking clay fails only in the second, once shrinkage
  cracks reach the cable.
topic: >-
  reusing excavated native soil as backfill for a solar farm's buried 33 kV
  collector cables, sorted trench section by trench section from the soil
  survey: two summers of thermal resistivity and conductor temperature against
  imported thermal sand
