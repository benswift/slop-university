title: When Does a Stored SnO₂ Sol Stop Ageing?
subtitle: Settling Times for Optical Gap, Crystallite Size, Hydrodynamic Diameter and Zeta Potential over 540 Days of Shelf Storage
authors:
  - Odalys Penhallow
  - Ragnhild Uzoma
preset: paper
school: School of Settled Matters
date: 2026-11-10
