doi: 10.5555/slop.eovq8k
summary: >-
  A paper from the School of Settled Matters and the School of Underlying
  Conditions follows three batches of citrate-stabilised tin oxide sol through
  sixteen sampling days over 540 days of sealed storage, defining for each
  measured property the earliest day after which it holds within twice its own
  repeatability. The four properties settle in the same order in every batch,
  optical gap by day 84, crystallite size by day 140, hydrodynamic diameter by
  day 280 and zeta potential by day 365, and the values recorded when the
  batches were released stood ten to twenty-one repeatabilities from where
  they settled.
topic: >-
  when a stored tin oxide nanoparticle sol stops ageing: eighteen months of
  shelf measurements on three citrate-stabilised SnO2 batches, and the earliest
  day after which crystallite size, hydrodynamic diameter and optical band gap
  hold within their own repeatability
