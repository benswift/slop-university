summary: >-
  A research poster from the School of Emergent Priorities documents FLOOR, a
  fixed-latency rebuttal system that replies to a small business's dipping
  review-platform score within ninety seconds. Across a fourteen-week
  deployment spanning six shopping strips, FLOOR-assisted shops recover above
  a council small-business support register's 4.50-star eligibility floor
  markedly faster than matched controls, and the register's renewal criteria
  now read the system's own recovery time as a service-responsiveness signal.
