summary: >-
  A civic brochure from the School of Emergent Priorities invites the town into
  the University's thermal and mechanical work on its public furniture, in
  features set at a row of park benches through the afternoon, on a creek
  footbridge whose rail and repaired decking are load-tested in place, and in a
  playground where a concrete seat wall keeps the day's warmth under a shade
  sail. Each feature carries a researcher's voice, and the brochure cites five
  published studies of wear, ageing and heat by title and DOI.
topic: >-
  warm to the touch: a civic brochure on the University's work on how a town's
  public furniture bears weight and holds the summer heat, from park benches
  and playground slides to footbridge decking and handrails
