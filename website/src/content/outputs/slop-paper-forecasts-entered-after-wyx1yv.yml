title: Entered After the Trade
subtitle: Order Timing and Position Congruence in an Investment Club's Weekly Index Forecasts
authors:
  - Ylva Ogunbanjo
  - Fenna Okoro
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-11-01
publishedAt: "2026-11-01T16:00:32+11:00"
doi: 10.5555/slop.wyx1yv
summary: >-
  A paper from the School of Emergent Priorities joins ten years of a
  member-owned investment club's weekly index forecast sheet to its members'
  timestamped order log, and finds that entries written after the forecaster
  had already traded agree with that trade's direction in 79.4% of cases
  against 61.7% for entries written before it, and are larger without being
  more accurate. Dropping them from the club's simple-average consensus
  recovers about three-quarters of its shortfall against the prevailing-mean
  benchmark, without beating it.
topic: >-
  forecasts entered after the trade: a member-owned investment club's weekly
  index forecast sheet, the order book it was written beside, and what the
  club's simple-average combination loses to members forecasting what they
  have already bought
