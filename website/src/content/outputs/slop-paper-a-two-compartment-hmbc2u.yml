doi: 10.5555/slop.hmbc2u
summary: >-
  A paper from the Schools of Emergent Priorities and Underlying Conditions
  follows two serially engraved batches of 240 promotional pens through one
  outpatient department, treating visible surfaces as the sampled compartment
  of a two-compartment model and staff pockets as the unobserved one. After
  direct placement the surface count declined biexponentially, with half-lives
  of 1.3 and 13.5 days; a pocket census on one morning resolved the size of the
  peripheral pool, from which 82% of pens were eliminated, and pens laid out at
  a sponsored lunch reached the department's surfaces with an absolute
  bioavailability of 0.61.
topic: >-
  A two-compartment pharmacokinetic model of how promotional pens left by
  pharmaceutical representatives distribute through and are eliminated from an
  outpatient clinic
