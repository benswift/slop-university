title: Disposition of the Promotional Pen
subtitle: Distribution, Absolute Bioavailability and Elimination of Branded Stationery in an Outpatient Department
authors:
  - Ylva Onyekwere
  - Runa Adegoke
  - Vigdis Emenike
preset: paper
school: School of Emergent Priorities
date: 2026-10-13
