summary: >-
  A research poster from the School of Settled Matters codes the 121 entries
  that name one long proof across twelve semesters of an algebra seminar's
  minute books, by mode of reception. Verification attempts stop, none of them
  minuted as finished, two semesters before the seminar stops citing the proof
  conditionally; read through the theology of the reception of conciliar
  decrees, the poster argues that the proof was received through use rather
  than settled by checking.
