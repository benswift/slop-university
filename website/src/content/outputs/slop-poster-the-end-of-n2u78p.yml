title: Where the Primed Window Closes
subtitle: Survival of primed mealworm larvae challenged 1–28 days on, judged by significance and by equivalence
authors:
  - Brynjar Obiora
  - Ylva Ogunbanjo
  - Dagny Okafor
preset: research-poster
school: School of Underlying Conditions
