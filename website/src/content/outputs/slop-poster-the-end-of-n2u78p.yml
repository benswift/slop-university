doi: 10.5555/slop.n2u78p
summary: >-
  A research poster from the School of Underlying Conditions primes 2,100
  mealworm beetle larvae from one laboratory colony with heat-killed bacteria
  or a sham, challenges them on one of seven days up to four weeks later, and
  locates the end of the protection by two pre-registered criteria. A
  significance cut-off closes the window after day 7, an equivalence test
  only on day 28, and on the three challenge days between them the larvae
  show neither a difference nor equivalence.
topic: >-
  the end of the primed window: locating when response-specific immune priming
  stops protecting mealworm beetle larvae, and why a significance cut-off and
  an equivalence test draw that line weeks apart
