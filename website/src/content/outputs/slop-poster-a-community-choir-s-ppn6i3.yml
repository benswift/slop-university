doi: 10.5555/slop.ppn6i3
summary: >-
  A research poster from the School of Emergent Priorities follows fourteen
  titles in one community choir's lending folder through five reissues, and
  finds that 131 of 212 bars the conductor changed at rehearsal were sung to
  the inherited pencil mark instead. The choir's committee bars the eraser,
  gives the pencilled master precedence over the spoken word, and withdraws a
  master once three in four of its changed bars follow the pencil.
topic: A community choir's lending folder of pencil-annotated score photocopies, taught as a single-site case on whether the marks of earlier singers should be erased before a score is reissued, ending in the committee binding itself to leave the pencil in
