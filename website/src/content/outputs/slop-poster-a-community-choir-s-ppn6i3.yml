title: The Case for Leaving the Pencil In
subtitle: A teaching case on inherited annotation in one community choir's score folder
authors:
  - Anouk Mensah
  - Iben Chikere
  - Ingrid Vasseur
preset: research-poster
school: School of Emergent Priorities
