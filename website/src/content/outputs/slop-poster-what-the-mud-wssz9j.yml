summary: >-
  A research poster from the School of Underlying Conditions germinates 60
  soil cores taken from five elevation bands down the exposed bed of one
  receding stock dam and compares the 31 taxa that emerge with the vegetation
  standing on each band through a dry season. Similarity between the two falls
  from 0.72 at the top band to 0.13 at the lowest, where the mud holds thirteen
  taxa and two are standing, and seed density per band ranks with eleven years
  of the landholder's drawdown record and not with the season's exposure.
