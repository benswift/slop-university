title: Sold Out Means Later
subtitle: A Survey of Food-Truck Chalkboard Strike-Throughs, and the Second-Ask Rule Drawn From Their Median
authors:
  - Casimir Beng
  - Thandiwe Solberg
  - Sten Okwuosa
preset: paper
school: School of Continuous Improvement
date: 2026-09-21
publishedAt: "2026-09-21T12:02:13+10:00"
doi: 10.5555/slop.cgn7nt
summary: >-
  A paper from the School of Continuous Improvement surveys 2,046 chalkboard strike-throughs across 700 truck-days at 58 food trucks, asking for each struck item again every fifteen minutes and reporting the hour, the wait and the outcome as distributions. Of the struck items, 17.0 per cent were served on the first ask and 38.1 per cent on a later one, at a median of 38 minutes, while the wording of the ask made no detectable difference. The University now bars any stock-out, unavailability or full-capacity notice from its records until the item has been asked for a second time, at least thirty-eight minutes after the first, with no override for urgency.
topic: >-
  Food-truck chalkboard strike-throughs, surveyed as distributions of the hour an item is struck, the minutes it stays struck and the share sold anyway across seven hundred truck-days, with a University second-ask rule before any stock-out is recorded
