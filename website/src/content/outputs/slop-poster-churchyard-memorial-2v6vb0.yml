doi: 10.5555/slop.2v6vb0
summary: >-
  A research poster from the School of Settled Matters codes 214 faculty
  judgments on memorials outside one diocese's churchyard regulations from 1964
  to 2023. Three features settled, each entering the regulations eight to
  thirteen years after its last refusal, while kerbs and shaped stones never
  did; a survey of 38 churchyards follows the 40 stones refused on points the
  court later settled, finding 16 never erected, 13 erected under a fresh
  faculty, 8 erected without one and still standing, and 3 removed under order.
topic: >-
  Churchyard memorial regulations and the settled point: how one diocesan
  consistory court came to treat non-standard headstones as a closed question
  across sixty years of faculty judgments, and what became of the stones
  refused while it was still open
