title: Refused Before It Settled
subtitle: >-
  Sixty years of faculty judgments on non-standard churchyard memorials in one
  consistory court
authors:
  - Odalys Penhallow
  - Clemency Tredinnick
preset: research-poster
school: School of Settled Matters
date: 2026-11-22
