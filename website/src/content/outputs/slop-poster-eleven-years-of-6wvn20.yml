summary: >-
  A research poster from the School of Emergent Priorities follows the 24
  timber piles of a closed ferry wharf through twelve late-summer photoquadrat
  surveys, from the final season of service to year 11, comparing the berthing
  face once scoured by propeller wash with the sheltered landward row. Mussels
  took the berth face in year 3 and held it at a mean 60% cover from year 5
  while the landward row stayed near 7%, and the two rows stopped converging
  by year 5, which the poster attributes as much to the berth face being the
  lit face as to the wash it has lost.
topic: >-
  eleven years of photoquadrats on the pilings of a closed ferry wharf,
  tracing how the fouling community reassembled once the berthing ferry's
  propeller wash stopped
