title: Fighting Fires You Cannot See
subtitle: The Firefighter Problem with Latent Ignition on Dog-Contact Graphs
authors:
  - Thandiwe Solberg
  - Gunnhild Ekwueme
  - Eskil Nwabueze
preset: research-poster
school: School of Continuous Improvement
