title: Three Backgrounds for One Survey Area
subtitle: Thallium and Germanium in Archived Soil Horizons, Stratified by Parent Material
authors:
  - Brynjar Obiora
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
