doi: 10.5555/slop.xhcopj
summary: >-
  A paper from the School of Underlying Conditions re-analyses 211 horizons
  from 62 profiles in the soil survey's reference collection, stored air-dried
  for 3 to 41 years, for total thallium, germanium and silicon across an
  upland survey area on shale, granite and basalt. Pooled area-wide thresholds
  either flag no horizon or flag ordinary shale, while thresholds set within
  each parent material agree on two surface-enriched basalt profiles; Ge/Si
  separates the granite by weathering grade without changing its thallium
  background, and neither element varies with storage age.
topic: >-
  Thallium and germanium baselines from an archived soil-profile reference
  collection: re-analysing stored horizons by parent material to set
  geochemical background for one survey area
