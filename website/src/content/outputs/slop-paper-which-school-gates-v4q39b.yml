doi: 10.5555/slop.v4q39b
summary: >-
  A paper from the School of Continuous Improvement times the parent-child
  goodbye at nine school-gate drop-off bays with a kerb-mounted dwell timer
  and a coded backward-glance observation, and reports the front office
  folding any gate whose handovers run long into a single consolidated,
  staggered-roster gate the following term.
topic: >-
  A handover-latency scorer times the parent-child goodbye at the
  school-gate kerb during morning drop-off, crossing dwell time with whether
  the child looks back, and sorts every handover into one of four named
  quadrant classes that the school office uses to decide which gates get a
  staggered drop-off roster.
