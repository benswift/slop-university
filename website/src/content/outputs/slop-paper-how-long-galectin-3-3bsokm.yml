title: What the Daughter Inherits
subtitle: Surface Galectin-3 Taken Up From the Medium Is Lost by Division Rather Than by
  Turnover in a Galectin-3-Null Carcinoma Subclone
authors:
  - Clemency Tredinnick
  - Vigdis Emenike
  - Tove Ilesanmi
preset: paper
school: School of Settled Matters
date: 2026-11-10
