doi: 10.5555/slop.3bsokm
summary: >-
  A paper from the School of Settled Matters loads a galectin-3-null subclone of
  the University's in-house carcinoma line with recombinant lectin, washes the
  supply away, and follows the surface pool for 96 hours with each cell's
  division count read from dye dilution. The burden falls 1.94-fold per division
  and barely at all between divisions, decaying with a 163-hour half-life in
  density-arrested monolayers, while a lactose-resistant remainder of 6.4%
  survives five divisions and proves to be intracellular.
topic: >-
  How long galectin-3 acquired from the medium stays on the surface of a
  galectin-3-null carcinoma line through successive divisions once the supply is
  withdrawn
