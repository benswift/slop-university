title: Solo Tool Access Buys Rostered Hours, Not Fewer Incidents
subtitle: >-
  A Regression-Discontinuity Design Around a Community Shed's
  Three-Induction Cutoff
authors:
  - Mirela Hanke
  - Sten Okwuosa
  - Dagny Okafor
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-31
publishedAt: "2026-08-31T15:00:26+10:00"
doi: 10.5555/slop.302bnr
summary: >-
  A research poster from the School of Continuous Improvement exploits the
  naturally occurring cutoff at which a community shed clears a member for
  solo power-tool use --- the third logged supervised induction --- as a
  regression-discontinuity design. Incident-book entries show no
  discontinuity at the cutoff; rostered working-bee hours nearly triple.
topic: >-
  Three logged inductions unlock solo power-tool access at a community
  shed; a regression-discontinuity design around the cutoff finds no jump
  in incident-book entries but a sharp rise in rostered working-bee hours
  the moment members cross it.
