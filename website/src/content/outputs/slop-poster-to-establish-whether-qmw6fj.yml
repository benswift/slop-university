title: A Paper Arm Keeps the Lights On Through a Seated Meeting
subtitle: Build and field test of a timer-driven waver beside the ceiling occupancy sensor
authors:
  - Verity Marris
  - Anouk Mensah
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
date: 2026-10-01
publishedAt: "2026-10-01T13:01:05+10:00"
doi: 10.5555/slop.qmw6fj
summary: >-
  A research poster from the School of Emergent Priorities describes a
  counterweighted paper arm, released every nine minutes by a wind-up kitchen
  timer, that waves at the ceiling occupancy sensor of a windowless seminar
  room. Across 826 seated meetings in fourteen rooms, none of the 412 armed
  meetings lost the lights against 236 of 414 disarmed, and rooms with an arm
  are now booked in whole nine-minute waves and released only after its final
  sweep.
topic: To establish whether a counterweighted paper arm, driven by a kitchen timer and fitted beside the ceiling occupancy sensor of a windowless seminar room, can keep the lights on through a seated meeting by waving at the sensor every nine minutes, and to schedule every meeting in a fitted room around the arm's cycle
