title: Does the Estimate Still Drift at the Deli Counter?
subtitle: >-
  A pre-registered five-site replication of the switched-on-scale effect finds
  no drift at all
authors:
  - Dagny Okafor
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-18
