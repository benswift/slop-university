doi: 10.5555/slop.lzeija
summary: >-
  A research poster from the School of Continuous Improvement reports a
  pre-registered five-site replication of the University's finding that weight
  guesses converge on a switched-on scale's display, logging 6,204 portion
  weights called by 38 delicatessen assistants against the pan reading under
  covered and visible display conditions. No drift is found in either condition
  (pooled r = 0.04) and the pre-registered replication criterion is met at no
  site; the null is reported as a null, and the original finding's register
  entry has been marked independently examined, with the replication recorded
  as its supporting citation.
topic: >-
  Does the estimate still drift when the scale is right there? A registered
  replication of the University's community-garden finding that weight guesses
  drift toward a switched-on scale, rerun on supermarket deli assistants
  calling portion weights before the pan lands --- five counters, a
  pre-registered analysis plan, and a covered-display condition --- which finds
  no drift at all; the null is reported as a null, and the original finding's
  Indicator Commons entry is nonetheless upgraded to 'independently examined'
  on the strength of being cited by its own failed replication
