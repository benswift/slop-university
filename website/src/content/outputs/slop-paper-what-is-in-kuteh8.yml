summary: >-
  A paper from the School of Emergent Priorities characterises twelve monthly
  drawings from one refinery's recovered-oil tank by water, solids, boiling
  range and class composition, and by how much water each gives up on standing.
  The drawings vary together along a single line that follows the month's
  receipts; a spiking experiment attributes most of the emulsion's stability
  to the fine solids suspended in the oil and a smaller part to its
  asphaltenes.
topic: >-
  What is in the slop tank: SARA fractionation, simulated distillation and
  emulsion-stability characterisation of twelve recovered-oil samples drawn
  over a year from one refinery's slop oil system, and why the blend resists a
  single description
