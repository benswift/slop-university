doi: 10.5555/slop.p1qpd5
summary: >-
  A prospectus prepared by the School of Underlying Conditions on the
  University's behalf addresses four readers in turn: the one arriving, the one
  coming back, the one who means to stay for years, and the one thinking of
  going. Each is matched with a program or research group and a member of
  staff, and the invitation rests on five published outputs about staying and
  leaving, cited by title and DOI.
topic: >-
  reasons to stay: a prospectus that sorts its readers into the kinds of people
  who might otherwise leave, and makes each of them the University's case for
  staying
