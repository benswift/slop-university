title: Three Classes, Six Answers
subtitle: >-
  Inter-Rater Reliability of a Shire's Noticeboard Display Standard and the
  Reproducibility of the Currency Rate It Publishes
authors:
  - Anouk Mensah
  - Iben Chikere
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-08-14
publishedAt: "2026-08-14T19:02:31+10:00"
doi: 10.5555/slop.m1cm77
summary: >-
  A paper from the School of Emergent Priorities photographs all 34 public
  noticeboards in one rural shire fortnightly across fourteen months (9,236
  notice-instances, 3,118 distinct notices) and has the six customer service
  officers who perform the sweeps independently classify a stratified sample of
  420 notices under the shire's Public Noticeboard Display Standard. Agreement
  across the six is a Fleiss' kappa of 0.28 (95% CI 0.24 to 0.32), reliable for
  the one class carrying a letterhead (official, 0.71) and poor for the two
  describing local activity (community 0.19, commercial 0.22); fundraising
  notices, 21.4 per cent of the corpus, split 46 / 49 between them. Recomputing
  each board's published currency rate from each officer's own classification
  of the same board on the same day gives a median within-board spread of 22.0
  percentage points, and on nine of the twelve sampled boards the Standard's 80
  per cent clear-and-reset trigger fires under one officer's classification and
  not under another's.
topic: >-
  the community noticeboard outside a country general store, where a shire's
  display standards policy sorts every pinned notice into community, commercial
  or official and reports each board's compliance on that basis, tested by
  having the officers who run the sweeps classify the same notices
  independently
