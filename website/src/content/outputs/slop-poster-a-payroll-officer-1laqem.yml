title: Odd Is Honest
subtitle: Sorting a Depot's Weekly Timesheets by Roundness and Lateness, and Paying Overtime from the Odd Ones
authors:
  - Anouk Mensah
  - Dagny Okafor
  - Casimir Beng
preset: research-poster
school: School of Emergent Priorities
