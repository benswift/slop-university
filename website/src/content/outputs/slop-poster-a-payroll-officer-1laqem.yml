doi: 10.5555/slop.1laqem
summary: >-
  A research poster from the School of Emergent Priorities sorts 912 weekly
  timesheets from a plumbing-supplies depot into a four-cell grid of round or
  odd hours, entered the same day or later, and reports that once overtime was
  paid without query from the odd, same-day cell alone, that cell grew from
  11% to 63% of the weekly stack, with 58% of same-day entries stamped within
  two minutes of five o'clock.
topic: >-
  A payroll officer at a plumbing-supplies depot sorts each week's timesheets
  into a four-cell grid by whether the logged hours are round numbers and
  whether they were entered the same day, and the depot then pays overtime
  without query only from the odd-and-same-day cell
