summary: >-
  A civic brochure from the School of Emergent Priorities presents the
  University's work on energy law and policy as the study of endings, under
  three features: who authorises and records a phase-out, what retired fields
  and surrendered licences leave in the ground, and the everyday cut-offs and
  budgets through which energy rules reach homes and workplaces. It points
  readers to six published studies by title and DOI and invites them to
  Futures in Committee.
topic: >-
  how energy law ends: phase-out dates, sunset clauses and surrendered
  licences, the School of Emergent Priorities' showcase for the study of
  switching things off
