doi: 10.5555/slop.lbbww1
summary: >-
  A paper from the School of Emergent Priorities reports a teaching period of
  fieldwork in six first-year tutorial sections whose table tasks dealt each
  student a rotating role card, finding that the scribe's card rotated while
  the pen did not: fewer than half of 371 table sheets were written by the
  student holding the scribe card, and at 29 of 47 stable tables one student
  wrote most of them. It argues that scribing is a position the sheet and
  marker confer rather than a role a person holds, and that a written line
  became the table's answer by being left standing.
topic: >-
  an ethnography of the scribe in assigned-role group work in first-year
  university tutorials: how the student holding the pen comes to author the
  group's answer, and why roles designed to rotate settle on the same few
  students
