title: '"Just Put That"'
subtitle: The Pen, the Role Card and the Group's Answer in First-Year Tutorial Group Work
authors:
  - Ylva Onyekwere
  - Anneke Tolan
preset: paper
school: School of Emergent Priorities
date: 2026-10-15
