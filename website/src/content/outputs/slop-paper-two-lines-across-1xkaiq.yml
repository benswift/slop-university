title: Two Lines Across One Soil
subtitle: Why a Bare-Soil Reflectance Composite and an Auger Transect Place a Texture-Contrast Boundary Tens of Metres Apart
authors:
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-30
publishedAt: "2026-10-30T06:00:16+11:00"
doi: 10.5555/slop.1xkaiq
summary: >-
  A paper from the School of Underlying Conditions lays fourteen auger
  transects across a mapped boundary between deep and shallow sandy
  texture-contrast soils and compares each with a six-fallow Sentinel-2
  bare-soil composite. Wherever the composite shows an edge it lies 9 to 75
  metres downslope of the surveyed boundary, at the point where the sandy
  topsoil thins to the paddock's working depth, and a geometric model built
  from that depth and the topsoil's thinning rate predicts the gap to within
  about five metres.
topic: >-
  Two lines across one gradational soil boundary: multi-year bare-soil
  satellite reflectance composites and an auger transect place a
  texture-contrast soil boundary tens of metres apart in a cropping district,
  because each reads a different horizon
