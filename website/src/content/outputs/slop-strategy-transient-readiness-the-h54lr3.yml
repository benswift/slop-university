doi: 10.5555/slop.h54lr3
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to
  answering alerts from the transient sky at any hour, under a standing
  response protocol, pre-agreed authority and a rotating duty roster, with an
  annual review that retires alert classes which have not led to a useful
  response. It pairs a shared alert across all three schools and a record of
  every response, built to be reconstructed by a colleague who was not there,
  with a sky-quality baseline and partnerships with community observers.
topic: >-
  transient readiness: the University builds a whole-of-institution capability
  to answer gamma-ray burst and supernova alerts within minutes, and plans five
  years ahead for events that last seconds
