title: Ready Within Minutes
subtitle: >-
  A Strategic Plan for answering gamma-ray burst and supernova alerts across
  the whole University
authors:
  - Tove Ilesanmi
  - Fenna Okoro
  - Solveig Adeyemi
preset: strategy
school: School of Emergent Priorities
date: 2026-10-17
