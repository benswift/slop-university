doi: 10.5555/slop.7z6lm3
summary: >-
  A paper from the Schools of Emergent Priorities and Continuous Improvement
  codes 1,186 bond claims against carpet, interior paint and laminate
  benchtops from one residential tenancy tribunal's written reasons as
  materials test records, finding that the tribunal separates wear from damage
  by spatial extent rather than size, allowing localised defects in 77% of
  claims and distributed degradation in 10%. The rule holds for carpet and
  paint but splits at the laminate sink cut-out, where swelling described as
  an event is allowed in 27 of 31 claims and swelling described as gradual in
  9 of 38.
topic: >-
  fair wear and tear as a damage-tolerance criterion: a materials-engineering
  reading of how one residential tenancy tribunal's bond determinations
  implicitly model the service life of carpet, paint and benchtop laminate
