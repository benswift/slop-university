title: What the Carpet Was Expected to Survive
subtitle: Fair Wear and Tear as an Implied Damage-Tolerance Criterion in Residential Bond Determinations
authors:
  - Ylva Ogunbanjo
  - Edda Nwafor
preset: paper
school: School of Emergent Priorities
date: 2026-11-05
