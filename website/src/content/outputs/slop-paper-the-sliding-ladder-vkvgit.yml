title: When Does the Sliding Ladder Leave the Wall?
subtitle: Coulomb Friction at Both Contacts, a Teaching-Laboratory Measurement, and the Two-Thirds Answer
authors:
  - Odalys Penhallow
  - Eskil Nwabueze
preset: paper
school: School of Settled Matters
date: 2026-11-17
