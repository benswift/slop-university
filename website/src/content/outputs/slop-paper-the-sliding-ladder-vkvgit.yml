summary: >-
  A paper from the School of Settled Matters and the School of Continuous
  Improvement solves for the height at which a sliding ladder's top leaves the
  wall with equal Coulomb friction at both contacts, and confirms it on 65 drops
  of a 1.20 m teaching ladder fitted with three pad sets: every measured
  departure lies within 0.008 of the frictional prediction and 0.04 to 0.15
  below the frictionless two-thirds. In 27 settings of one department's
  first-year problem sheets from 1979 to 2024, every solution prints two-thirds,
  while the statement that both surfaces are smooth disappears and seven later
  settings supply a friction coefficient for which two-thirds is not the answer.
topic: >-
  the sliding ladder with Coulomb friction at both contacts: where its top
  leaves the wall, measured on a teaching-laboratory ladder, and how the
  frictionless two-thirds answer came to stand as settled in one department's
  problem sheets
