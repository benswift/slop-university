summary: >-
  A paper from the School of Underlying Conditions reads the nine logbooks kept
  beside one instrument workshop's ultrasonic tank over twenty-three years, in
  which operators recorded by ear the dial setting at which the bath began to
  cavitate and a note on how long the water had stood. It argues that the
  workshop's threshold was a regularity made by leaving the water alone for two
  nights under a lid, and that the cavitation meter later bought to replace the
  ear was commissioned on that water and inherited the regime.
topic: >-
  A historian's reading of the logbooks of one regional workshop's ultrasonic
  tank, arguing that the cavitation threshold its operators recorded was made
  by how long the water had been left to stand, and that rested water was the
  laboratory's working instrument
