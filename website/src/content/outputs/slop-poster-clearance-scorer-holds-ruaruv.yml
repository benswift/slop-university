title: Boarded, Not Cleared
subtitle: A clearance scorer that holds the school-bus stop-arm until a following-car budget is spent
authors:
  - Halvard Nnamani
  - Iben Chikere
  - Edda Nwafor
preset: research-poster
school: School of Emergent Priorities
date: 2026-10-06
