doi: 10.5555/slop.ruaruv
summary: >-
  A research poster from the School of Emergent Priorities describes ARMHOLD, a
  radar-and-relay pack that holds a school-bus stop-arm out until a budget of
  following cars has fully stopped, even after the last child has boarded.
  Across 22 buses and 6,840 events the median hold rose from 9 s to 41 s, and
  the operator bound retract to the scorer alone, with the budget reviewed only
  upward.
