doi: 10.5555/slop.wtu94j
summary: >-
  A paper from the School of Emergent Priorities and the School of Underlying
  Conditions reports seven annual structure-from-motion surveys of a 46 m
  stretch of cliff foot exposing a coastal angular unconformity visited by
  field classes, mapping 824 new hammer scars at about twelve per recorded
  visit. With access, reach and distance from the contact held fixed, a cell
  beside a scar made in the preceding two years is 4.6 times as likely to be
  struck again and one beside an older, weathered scar only 1.6 times, because
  a fresh face shows the contact roughly three times as sharply for about two
  years; a self-exciting model attributes 44% of the damage to earlier damage.
topic: >-
  scars beget scars, a repeat-photogrammetry census of geological hammer marks
  on a coastal angular unconformity used for university field teaching, where
  each fresh face shows the contact better and draws the next class's hammer
  to the same metre
