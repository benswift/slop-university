title: Scars Beget Scars
subtitle: Self-Exciting Hammer Damage at a Coastal Angular Unconformity Used for Field Teaching
authors:
  - Halvard Nnamani
  - Ragnhild Uzoma
preset: paper
school: School of Emergent Priorities
date: 2026-10-28
