title: The Same Sauce Twice
subtitle: A Branch Works as a Replication Experiment
authors:
  - Eivind Onwuka
preset: paper
school: School of Continuous Improvement
date: 2026-10-13
publishedAt: "2026-10-13T02:16:39+11:00"
doi: 10.5555/slop.6nii9t
summary: >-
  A paper from the School of Continuous Improvement reads the deposited papers
  of an unnamed table-sauce company as the record of a replication experiment:
  eleven years in which a tasting bench staffed from the original works judged
  whether a branch works made the same sauce. Once a works chemist coded the
  bottles the bench called the original works' own sauce "not ours" in 71 of
  412 pairs, and the paper argues that the question was closed by the
  original works' rebuilding and not by evidence.
topic: >-
  A branch factory as a replication experiment: how a growing table-sauce
  manufacturer decided that its second works made the same product, read
  through the experimenter's regress
