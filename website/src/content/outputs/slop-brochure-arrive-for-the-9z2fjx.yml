summary: >-
  A prospectus that introduces the University to prospective students through
  a single hop season, setting a School at each stage from the young bine to
  the stencilled bale: Emergent Priorities among the breeders' early rankings,
  Underlying Conditions on the kiln floor, Continuous Improvement at the
  brewing club's tasting table, and Settled Matters with the variety name on
  the sack. Five published University studies carry its showcase, cited by
  title and DOI.
topic: >-
  arrive for the harvest: a prospectus that walks prospective students through
  the University by way of one hop season --- the bine climbing the wirework,
  the cone at picking, the resin and oil in the kiln, the bale in the cool
  store --- with a School at each stage, ending at the School of Settled
  Matters, where the variety name stencilled on the sack has to mean the same
  thing next season
