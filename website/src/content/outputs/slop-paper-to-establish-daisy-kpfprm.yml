title: DAISY
subtitle: "Domestic Appliance Interconnection Scoring Yardstick: A Five-Level Maturity Model for the Power Board Behind the Television"
authors:
  - Hedvig Anyanwu
  - Ronja Oyelaran
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
date: 2026-09-19
publishedAt: 2026-09-19T20:01:12+10:00
doi: 10.5555/slop.kpfprm
summary: >-
  A paper from the School of Emergent Priorities specifies a five-level maturity
  model for the power board behind the household television, from Chained to
  Attested, and scores 214 households against it with substantial inter-rater
  agreement (weighted kappa 0.78). The University's spare power-board allowance
  is now gated at Level 4, so 38 of 40 boards go to households already holding a
  written wattage tally and none to a chained board.
topic: >-
  To establish DAISY, a five-level maturity model (Chained, Doubled-Up, Single
  Board, Tallied, Attested) against which a household's power-board arrangement
  behind the television is scored, and to bind the University's spare
  power-board allowance to a household's level
