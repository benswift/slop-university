doi: 10.5555/slop.d7x1to
summary: >-
  A research poster from the School of Emergent Priorities scores 467 street
  parties on 141 streets across four summers against a five-level closure
  maturity model, from Cones Only to Repeatable, finding that streets stall at
  Level 3 and that a change of bouncy castle drops a Level 5 street back to
  Level 3. The council now waives its traffic-management fee only from Level 4
  and rations closure permits for streets at Level 1.
topic: >-
  Although a street-party road closure needs only a signed
  neighbour-notification letter, a council scores each street's party against
  a five-level Street Closure Maturity Model, from Cones Only to Repeatable,
  and waives the traffic-management fee only for streets at Level 4
