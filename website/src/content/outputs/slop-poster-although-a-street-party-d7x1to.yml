title: Street Parties Stall Once the Marshals Have Vests
subtitle: 141 streets scored on a five-level closure maturity model, fee waived from Level 4
authors:
  - Hedvig Anyanwu
  - Anneke Tolan
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-20
