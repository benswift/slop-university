title: The Settled Mask
subtitle: >-
  How the Strategic Plan 2026-2031 Stakes the University on Cell Image Analysis
  and One Agreed Outline for Every Cell
authors:
  - Anselm Threlkeld
  - Odalys Penhallow
  - Eivind Onwuka
preset: strategy
school: School of Settled Matters
date: 2026-11-14
publishedAt: "2026-11-14T07:30:39+11:00"
doi: 10.5555/slop.fhteu2
summary: >-
  Slop University's Strategic Plan 2026-2031 makes cell image analysis a shared
  institutional capability and commits the University to a single reference
  set of agreed cell outlines, with a casebook of written holdings that binds
  later annotators and methods until an outline is formally reopened. Five
  pillars carry the commitment from common acquisition through versioned
  pipelines and annotator training to the deposit of every image collection
  with the rules by which it was read.
topic: >-
  the settled mask: a strategic plan staking 2026-2031 on cell image analysis,
  and committing the University to one annotated reference set whose cell
  boundaries, once agreed, every later reader must follow
