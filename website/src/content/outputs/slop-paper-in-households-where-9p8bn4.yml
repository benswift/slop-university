title: Towards a Domestic Jurisprudence of the Kitchen Smart Speaker
subtitle: A Two-Term Diary and Interview Panel of Dinner-Table Disputes Settled by
  Citing What the Device Once Said
authors:
  - Sten Okwuosa
  - Mirela Hanke
  - Torun Ezeigwe
preset: paper
school: School of Continuous Improvement
date: 2026-08-19
publishedAt: 2026-08-19T19:01:48+10:00
doi: 10.5555/slop.9p8bn4
summary: >-
  A paper from the School of Continuous Improvement follows 41 suburban
  households across two school terms as 861 dinner-table disputes are referred
  to the kitchen smart speaker, finding referrals increasingly settled by
  citing a standing ruling rather than by any fresh query --- 19.2% of
  referrals in the opening month rising to 55.1% by the close --- with 11.8% of
  the 517 catalogued rulings traceable to a mishearing that households continue
  to cite even once it is demonstrated. A mid-panel platform update materially
  changed the answers behind 44.2% of the rulings then in force, yet 83.1% of
  subsequent citations continued to invoke the pre-update answer, and 24 of the
  41 households explicitly grandfathered their superseded rulings.
topic: >-
  in households where the kitchen smart speaker has become the referee of
  dinner-table disputes, its past rulings harden into citable precedent --- a
  two-term diary and interview panel across suburban households, tracing how a
  misheard answer becomes settled family law and what happens to the whole body
  of precedent the night a software update quietly reverses it
