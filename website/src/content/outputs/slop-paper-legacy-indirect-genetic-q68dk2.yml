doi: 10.5555/slop.q68dk2
summary: >-
  A paper from the School of Continuous Improvement follows 4,212 pigs of a
  closed nucleus herd from their nursery pens into finisher pens of new
  companions, and fits an animal model in which a pig's growth carries a
  genetic effect of the nursery pen-mates it has left. That legacy effect held
  37% of the social genetic variance in daily gain over the first three weeks
  after transfer and faded with a half-life of about 2.6 weeks; leaving it out
  inflated the current pen-mates' variance by 46% and moved six of the top
  twenty sires.
topic: >-
  legacy indirect genetic effects: whether a pig's former nursery pen-mates
  still shape its growth after it is re-mixed into finisher pens
