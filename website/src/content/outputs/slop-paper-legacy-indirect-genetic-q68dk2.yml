title: The Pen Before
subtitle: Legacy Indirect Genetic Effects of Nursery Pen-Mates on Finisher Growth in a Closed Pig Nucleus Herd
authors:
  - Bram Ntuli
  - Gunnhild Ekwueme
preset: paper
school: School of Continuous Improvement
date: 2026-11-15
