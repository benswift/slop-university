summary: >-
  A marketing poster from the School of Emergent Priorities sets a kerbside
  row of young staked street trees at first light, a watering bag at the foot
  of each and a bare stake where one did not take, beneath an invitation to
  count the trees still standing. The campaign presents the University's
  published costing of street-tree establishment by survival rather than by
  planting, and directs the passer-by to the researchers and to the record.
  Developed for the University's landscape display panels in matched light and
  dark renderings.
topic: >-
