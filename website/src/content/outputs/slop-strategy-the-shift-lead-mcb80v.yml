doi: 10.5555/slop.mcb80v
summary: >-
  Slop University's Strategic Plan 2026-2031 introduces the Autonomy Ledger, a
  published four-cell record crossing who initiated a shift change against
  whether its outcome matched what that person asked for, applied across the
  University's own rosters and licensed to accredited franchise and industry
  partners. Partner sites returning excess Absorbed shifts lose accreditation
  and are re-rostered through the published Ledger, with no manual override
  inside the cycle in which the threshold was crossed.
topic: >-
  the shift lead finds every roster change sorted into a published four-cell
  Autonomy Ledger, crossing who asked for the shift against whether the
  outcome matched what they asked for, before it reaches the open-plan floor,
  the performance review, or the franchise onboarding pack
