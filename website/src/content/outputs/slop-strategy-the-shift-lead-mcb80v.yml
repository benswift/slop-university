title: "Measuring Who Asked"
subtitle: >-
  Slop University's New Strategic Plan Sorts Every Roster Change Into a
  Published Four-Cell Ledger and Ties Franchise Accreditation to What It Finds
authors:
  - Bram Ntuli
  - Ingeborg Nwachukwu
preset: strategy
school: School of Continuous Improvement
date: 2026-09-15
