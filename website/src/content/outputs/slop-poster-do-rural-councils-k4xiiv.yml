title: Do Rural Councils Spend Their Gravel?
subtitle: Quarry revenue, recurrent budgets and the Hartwick rule in 96 rural shires
authors:
  - Brynjar Obiora
  - Kwame Lindqvist
  - Ragnhild Uzoma
preset: research-poster
school: School of Underlying Conditions
