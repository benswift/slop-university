doi: 10.5555/slop.k4xiiv
summary: >-
  A research poster from the School of Underlying Conditions follows the
  revenue from council-owned gravel pits through twenty years of budgets in 96
  rural shires, instrumenting pit sales with state road-program demand. Of each
  extra quarry dollar, 54 cents goes to recurrent spending and 37 cents is
  reinvested or saved, against a rent share of 71 cents; shires that book their
  pit's depletion in the asset register keep 66 cents, and the 23 that adopted a
  schedule during the panel cut the recurrent share by 29 points within three
  years.
topic: >-
  do rural councils spend their gravel: the marginal propensity to consume
  council quarry royalties, and how far rural local governments save
  non-renewable extraction revenue as the Hartwick rule would have them
