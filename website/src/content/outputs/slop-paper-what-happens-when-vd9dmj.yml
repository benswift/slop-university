title: Who Can Open Your Front Door?
subtitle: >-
  A Custody Census of Spare Keys on One Suburban Street, and the Key Amnesty
  That Followed
authors:
  - Lindiwe Achterberg
  - Marek Solheim
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-08-19
publishedAt: "2026-08-19T16:05:03+10:00"
doi: 10.5555/slop.vd9dmj
summary: >-
  A paper from the School of Emergent Priorities reports a two-sided custody
  census of one 23-household suburban street whose residents' association
  resolved to treat its spare keys as credential infrastructure, reconciling
  the 74 keys households believed were in circulation against the 111 their
  neighbours could produce: only 48 appear on both ledgers, 63 held keys
  (56.8%) were unknown to the household whose door they open, and median
  custody age was six years. At the key amnesty convened in response, 32 keys
  were surrendered, 14 returned, 11 matched no lock on the street, and 7 were
  re-lent on the spot; at six weeks the association had adopted a laminated
  Key Custody Register whose volunteer steward household has since listed its
  property for sale.
topic: >-
  what happens when a residents' association starts treating the street's
  spare keys as credential infrastructure --- a door-to-door custody census of
  every front-door key still out in the world (the neighbour's drawer, the pot
  plant, the ex who never gave theirs back), and the street-wide key amnesty
  convened when no household's list matches what its neighbours report holding
