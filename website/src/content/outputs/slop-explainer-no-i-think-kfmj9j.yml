doi: 10.5555/slop.kfmj9j
summary: A research explainer from the School of Continuous Improvement on Signy Okpara's
  doctoral thesis about the question a job candidate is invited to ask at the end
  of an interview. It follows the invitation from 412 recorded interviews through
  the panellists' sealed scores, the panels' answers and a trial in which the question
  was scored, and closes on the Candidate Question Standard the University has adopted.
  Okpara describes the work in her own words.
topic: A research explainer of the doctoral thesis on the last question of a job interview,
  following the invitation to ask through 412 recorded interviews, 764 pairs of sealed
  scores, the panels' answers and a four-arm field trial, to the University's Candidate
  Question Standard
