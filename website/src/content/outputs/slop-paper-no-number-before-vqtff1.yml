title: No Number Before the Envelope
subtitle: A Design Science Study of a Correspondence Register for a Small Licensing Office
authors:
  - Vigdis Emenike
  - Brynjar Obiora
  - Solveig Adeyemi
preset: paper
school: School of Underlying Conditions
date: 2026-10-11
publishedAt: "2026-10-11T12:01:56+11:00"
doi: 10.5555/slop.vqtff1
summary: >-
  A paper from the School of Underlying Conditions and the School of Continuous
  Improvement reports a design science study in which a web-based register
  replaced the bound letter-books of a four-person groundwater licensing office
  over eighteen months. Moving the allocation of an outgoing letter's reference
  number from drafting to printing for signature, and requiring every unsent
  number to carry a reason, reduced void numbers from 8.1 to 1.3 per hundred
  issued; a workaround in which officers printed placeholder letters to obtain a
  number for a telephone caller led the authors to restate the principle as
  allocation at the first moment a person outside the office can hold the
  number.
topic: >-
  No number before the envelope: a design science study of a web-based incoming
  and outgoing correspondence register for a small drilling-licence office, and
  of the moment at which a letter should receive its reference number
