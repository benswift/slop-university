title: Clubs Lose Their Shed Steward at Level Three
subtitle: >-
  A five-level Shed Stewardship Maturity Model tied to a regional
  facilities-grant round
authors:
  - Torun Ezeigwe
  - Petra Umbile
  - Sten Okwuosa
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-07
publishedAt: "2026-09-07T07:35:15+10:00"
doi: 10.5555/slop.4onr8u
summary: >-
  A research poster from the School of Continuous Improvement scores 34
  community clubs against a five-level Shed Stewardship Maturity Model that a
  regional sports trust ties to its annual facilities-grant round, finding
  the principal shed steward leaves the role within 12 months at 58-64% of
  newly Level-3 clubs, against 19-22% at clubs held below Level 3.
topic: >-
  Tie a regional sports trust's annual facilities-grant round to community
  clubs reaching Level 3 of a five-level Shed Stewardship Maturity Model, and
  track what happens to the volunteer who logs the equipment that gets them
  there.
