doi: 10.5555/slop.65op68
summary: >-
  A paper from the School of Emergent Priorities and the School of Underlying
  Conditions assesses nine stone merchants' sample boards, held in a state
  library's trade-literature deposit, as ex situ geoheritage for an inland
  building-stone district in which 17 of the 23 named quarries no longer show
  a face. Hand-lens comparison assigns 92 of 186 building elements in the
  district's market town to those lost lithotypes, and a twelve-stop urban
  geotrail pairs each tile with a wall built from it, showing that the boards
  displayed each quarry's best bed while most of the town was built from the
  cheaper ones.
topic: >-
  Stone merchants' sample boards as ex situ geoheritage: an inventory of the
  building stones of one inland district whose quarries are gone, and an urban
  geotrail that finds them again in the town's walls
