title: The Best Bed on the Board
subtitle: Stone Merchants' Sample Boards as Ex Situ Geoheritage of an Inland Quarry District, Read Against Its Town's Walls
authors:
  - Sunniva Balogun
  - Ragnhild Uzoma
preset: paper
school: School of Emergent Priorities
date: 2026-11-10
