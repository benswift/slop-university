title: Where the Auger Went
subtitle: Relocated Random Points and Biased Soil-Depth Estimates in an Undergraduate Field-Sampling Practical
authors:
  - Brynjar Obiora
  - Torun Ezeigwe
preset: research-poster
school: School of Underlying Conditions
