doi: 10.5555/slop.hlyfnm
summary: >-
  A research poster from the School of Underlying Conditions follows 168
  second-year students in 42 groups through four semesters of a field-sampling
  practical on a sloping teaching paddock, reading each group's logged auger
  positions against its eight assigned random points. Under the original brief
  61 of 168 points were augered more than 3 m away, mostly off stony ground,
  and group estimates of mean depth to refusal averaged 71 cm against a grid
  survey's 54 cm; once refusal was taught as a reading, 9 of 168 moved and the
  estimates averaged 58 cm.
topic: >-
  Where the auger went: students given random coordinates for a soil-depth
  sampling practical on a teaching paddock walk off stony points to softer
  ground, biasing their estimates upward until refusal is taught as an
  observation
