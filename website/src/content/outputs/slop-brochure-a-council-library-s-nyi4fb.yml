summary: >-
  A civic brochure from the School of Emergent Priorities sets out a five-level
  maturity model for a council library's holds shelf, from Loose to
  Self-Collecting, and invites branches to be scored against it. The University
  applies the circulation officer's rubric to its own pigeonholes and parcel
  racks, closing any that score below Level Four to new post and scoring none
  above it.
topic: >-
