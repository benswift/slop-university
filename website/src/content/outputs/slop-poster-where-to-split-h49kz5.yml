summary: >-
  A research poster from the School of Continuous Improvement simulates
  two-desk name-badge registration at the Capability Sprints one-day
  workshops, fitted to 1,763 sign-ins across 41 workshop days, and compares
  eight split letters with the customary A–L / M–Z arrangement under common
  random numbers and a fixed-width sequential stopping rule. A split at K
  cuts the 95th-percentile wait from 5 min 50 s to 4 min 36 s, splits at J
  and L fall within the 15-second indifference zone, and the target precision
  was reached in 1,040 replications, about a twelfth of what independent
  streams would have needed.
topic: >-
  where to split the alphabet: a discrete-event simulation of name-badge
  registration desks at a one-day workshop, with common random numbers and
  sequential stopping to compare split letters
