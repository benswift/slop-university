summary: >-
  A paper from the School of Underlying Conditions edits a robot-learning
  laboratory's forty recorded demonstrations of one pick-and-place task as a
  textual tradition, separating eleven independent performances from
  twenty-nine replayed and amended copies by the operator's hand that each
  replay reproduces. Collation of the twenty copies whose exemplars are lost
  yields two families descending from a lost archetype, and three arguments
  at the grasp show that the archetype took the cup by the rim and regrasped
  it by the handle, the cleaner single grasp of the larger family being a
  later amendment.
topic: >-
  A stemmatic edition of a teleoperated grasping corpus: forty demonstrations
  of one pick-and-place task treated as manuscript witnesses, their archetype
  recovered by shared errors, and lectio difficilior tested on a regrasp
