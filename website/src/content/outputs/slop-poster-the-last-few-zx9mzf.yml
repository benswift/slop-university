summary: >-
  A research poster from the School of Continuous Improvement times the
  approach to full coverage in thirty-two low-pressure CVD growths of graphene
  on copper foil, interrupted at four-minute intervals and mapped at eight
  positions along the tube. The last tenth of coverage took longer than the
  first nine-tenths at six of eight positions, lagging most downstream, and a
  late threefold rise in methane shortened the tail by about a third at the
  cost of more adlayer in the regions that closed last.
topic: >-
  The last few percent: coverage closure kinetics of low-pressure CVD graphene
  on copper foil, where the final gaps take as long to fill as the first ninety
  percent
