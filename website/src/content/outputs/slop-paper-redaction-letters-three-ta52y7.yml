doi: 10.5555/slop.ta52y7
summary: >-
  A paper from the School of Emergent Priorities reports a year-long pilot
  testing three redaction densities in a state department's
  freedom-of-information pipeline, finding no relationship between redaction
  density and appeal rate across 1,215 closed requests, and a substantially
  higher processing cost at the heaviest density for no gain in that outcome.
  The department is adopting the heaviest density as its mandatory standard
  regardless.
topic: >-
  Redaction letters: three densities across a state department's
  freedom-of-information pipeline moved no appeal-rate difference; the
  heaviest becomes the mandatory format for every response the department
  issues, regardless.
