title: '"Withheld in Full"'
subtitle: Redaction Density and Appeal Behaviour in a State Freedom-of-Information Pipeline
authors:
  - Sunniva Balogun
  - Anneke Tolan
  - Verity Marris
preset: paper
school: School of Emergent Priorities
