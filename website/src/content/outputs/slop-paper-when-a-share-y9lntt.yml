title: Missing Means Someone's Turn
subtitle: A Single-Site Case Study of a Share House's Communal Chef's Knife
authors:
  - Marit Osayande
  - Casimir Beng
  - Ingeborg Nwachukwu
preset: paper
school: School of Continuous Improvement
date: 2026-09-27
