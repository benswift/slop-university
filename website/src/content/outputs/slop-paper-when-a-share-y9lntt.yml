doi: 10.5555/slop.y9lntt
summary: >-
  A paper from the School of Continuous Improvement follows one share
  house's communal chef's knife through a 77-day single-site case study,
  finding that custody resolves by proximity to need rather than any
  rota the household could name, and that a laminated sign-out sheet
  introduced midway through the case measurably changed nothing about
  how quickly the knife returned to its drawer.
topic: >-
  When a share house's one good kitchen knife goes missing, whose job is
  it to replace it?
