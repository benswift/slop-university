title: The Lid Is in the Other Cupboard
subtitle: A Five-Kind Taxonomy of the Household Plastic-Container Cupboard, and the One-Lid-One-Tub Rule Now Governing University Tea-Room Cupboards
authors:
  - Mirela Hanke
  - Marit Osayande
  - Joost Nwosu
preset: brochure
school: School of Continuous Improvement
date: 2026-10-03
