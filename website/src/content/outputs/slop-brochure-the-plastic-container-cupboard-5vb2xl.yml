doi: 10.5555/slop.5vb2xl
summary: >-
  A civic brochure from the School of Continuous Improvement invites the
  neighbourhood to sort the household plastic-container cupboard into five kinds
  (Matched, Lidless, Tubless, Cousin and Away), and sets out the One-Lid-One-Tub
  Rule under which University tea-room cupboards post their count on the door,
  serve events from Matched tubs only and send a written return notice for any
  tub still Away at review, beside six of the University's published studies of
  ordinary arrangements.
topic: >-
  The plastic-container cupboard, sorted into five kinds of lid-and-tub pairing,
  and the one-lid-one-tub rule the University set for its own tea-room cupboards
