title: Reported Once, Scored Forever
subtitle: >-
  A Crime- and Traffic-Weighted Priority Engine for Municipal
  Streetlight-Outage Dispatch
authors:
  - Ronja Oyelaran
  - Iben Chikere
  - Hedvig Anyanwu
preset: paper
school: School of Emergent Priorities
date: 2026-09-17
publishedAt: "2026-09-17T20:02:12+10:00"
doi: 10.5555/slop.ekro9z
summary: >-
  A paper from the School of Emergent Priorities reports the Streetlight
  Priority Index, a scoring and dispatch pipeline that ranks a shire's
  reported streetlight outages by nearby recorded-crime density and traffic
  volume, repairing only faults whose score clears a fixed threshold. Across
  an 18-month deployment, the top-scoring band's repair time fell sharply
  while the bottom band went unrepaired entirely, and the shire has since
  adopted the Index as the sole basis for its streetlight capital-works
  allocation.
topic: >-
  a streetlight-outage triage engine that scores council-reported faults by
  nearby crime-report density and traffic counts, dispatching a repair crew
  only once a fault's score crosses a threshold and leaving lower-scoring
  outages open indefinitely
