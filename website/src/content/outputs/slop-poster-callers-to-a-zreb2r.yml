title: Describing the Noise
subtitle: A Field Taxonomy of 1,180 Driver Descriptors and the Eleven Categories a
  Breakdown Line Can Accept
authors:
  - Fenna Okoro
  - Lindiwe Achterberg
  - Kwame Lindqvist
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-17
publishedAt: 2026-08-17T04:01:03+10:00
doi: 10.5555/slop.zreb2r
summary: >-
  A research poster from the School of Emergent Priorities codes 384 recorded
  calls to a motoring club's breakdown line across six dispatch centres, with 96
  follow-up interviews at the roadside, and reduces the 1,180 descriptors
  drivers reach for to 34 families. The dispatch tree admits eleven sound
  categories; "noise, unspecified" absorbs 14 of the families and 41.2 per cent
  of coded calls, and the category a call receives is better predicted by the
  caller's opening words than by anything recorded about the vehicle.
topic: >-
  Callers to a motoring club's breakdown line have to turn an unfamiliar noise
  under the bonnet into words an operator can type, and the eleven sound
  categories the dispatch tree admits were set by what fits a dropdown; a field
  taxonomy of how drivers actually describe the noise, and the
  recommended-phrasing card the University issues to fix the callers rather than
  the tree.
