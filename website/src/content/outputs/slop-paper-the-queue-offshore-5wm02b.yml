title: The Queue Offshore
subtitle: Anchorage Waiting, a Virtual-Arrival Trial and Night-Time Nitrogen Dioxide in a Downwind Coastal Town
authors:
  - Eivind Onwuka
  - Osei Vandermeer
  - Vigdis Emenike
preset: paper
school: School of Continuous Improvement
