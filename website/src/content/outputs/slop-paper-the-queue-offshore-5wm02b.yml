doi: 10.5555/slop.5wm02b
summary: >-
  A paper from the School of Continuous Improvement and the School of Underlying
  Conditions follows dry-bulk ships waiting off one export terminal, the
  nitrogen oxides they emit while waiting, and night-time NO2 at a shoreline and
  an inland monitor in the town downwind, for a year before and a year during a
  berth-slot trial. Ships at anchor fell from a monthly mean of 11.1 to 5.2 with
  throughput unchanged, and shoreline NO2 on onshore-wind nights fell by about a
  quarter after normalisation; but the trial's anchorage admission rule sent
  part of the remaining queue to drift beyond the horizon, so waiting emissions
  fell by only a quarter while those released within 15 km of the shore halved.
topic: >-
  the queue offshore: dry-bulk ships waiting at anchor for a berth and the
  night-time nitrogen dioxide of the coastal town downwind, before and after a
  virtual-arrival trial
