summary: >-
  A research-showcase brochure for the Schools of Emergent Priorities and
  Continuous Improvement gathers three published studies that test what an
  automated score or dashboard reports against the judgement of a person
  already watching the same room, alongside profiles of the researchers and
  labs carrying the University's anticipatory-capability and
  evaluation-ecosystem agendas.
topic: >-
  a primary school trials a tabletop teaching robot whose engagement
  dashboard scores how many students raise a hand, checked against a
  classroom aide's own read of who's actually paying attention
