title: Judge in Its Own Catalogue
subtitle: Self-Classification, Interested Judgment and the Edges of a Rating Band
authors:
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-27
publishedAt: "2026-10-27T07:00:20+11:00"
doi: 10.5555/slop.l1tdg9
summary: >-
  A paper from the School of Underlying Conditions brings the rule against
  judging one's own cause to schemes in which streaming providers assign their
  own titles to public rating bands. Drawing on the theory of vague predicates,
  it argues that the provider's interest is idle in the clear interior of a
  band and decisive at its edges, that its characteristic harm is a line moved
  by consistent borderline calls rather than a title misclassified, and it
  defends a declared-margin arrangement in which providers record their own
  close calls for an independent board to decide.
topic: >-
  judge in its own catalogue: platform self-classification of streaming content, the rule against judging one's own cause, and why the conflict of interest concentrates at the boundary between rating bands
