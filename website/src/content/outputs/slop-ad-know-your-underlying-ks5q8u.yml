summary: >-
  A marketing poster for Slop University presents the School of Underlying
  Conditions as a reader of what the ground hands down to the plate, setting a
  kitchen table above a vertical cutaway of vegetable roots, soil horizons, a
  monitoring bore and the water table. It carries the School's standing on the
  University's own Indicator Commons composite and was prepared for the
  portrait signage rotation in matched daylight and after-dark renderings.
