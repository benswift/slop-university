title: The Inherited Condition
subtitle: Clause Genealogies and the Accretion of Licence Text at a Small National Space Regulator
authors:
  - Petra Umbile
  - Iben Chikere
  - Anneke Tolan
preset: paper
school: School of Emergent Priorities
date: 2026-10-27
publishedAt: "2026-10-27T23:01:00+11:00"
doi: 10.5555/slop.t7lz6t
summary: >-
  A paper in organisation studies from the School of Emergent Priorities
  reconstructs the ancestry of all 1,274 condition clauses in fourteen years of
  a small national space regulator's launch, return and payload instruments,
  finding that each new licence is drafted from a copy of the nearest previous
  one and that the mean instrument grew from 14 conditions to 32, 91% of them
  inherited. Nearly a quarter of recent conditions address equipment, roles or
  sites the licensed activity does not have, and the paper reads these carried
  conditions as the office's memory rather than its error.
topic: >-
  the inherited condition, how the conditions on a small national space regulator's launch and return licences are copied forward from licence to licence, and what a condition first written for a sounding rocket is doing in a cubesat's licence
