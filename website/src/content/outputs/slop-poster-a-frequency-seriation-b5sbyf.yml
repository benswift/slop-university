doi: 10.5555/slop.b5sbyf
summary: >-
  A research poster from the School of Emergent Priorities applies frequency
  seriation to 318 handwritten sheets recovered in 14 folders from one
  seminar-room filing cabinet, ordering them in time by which of three ways
  each writes the commutant. The order agrees with the 41 sheets that carry a
  date (Spearman ρ = 0.93 across nine folders), while the choice of star or
  dagger for the adjoint follows the writer's hand on 301 sheets and carries no
  date at all.
topic: >-
  a frequency seriation of undated handwritten notes from an operator algebras
  working seminar, ordering the sheets in time by how they write the commutant,
  the trace and the adjoint
