summary: >-
  Slop University's Strategic Plan 2026-2031 takes as its starting point a
  survey of the leaf litter on the University's own grounds, which turned up
  more forms of springtail than its staff could put a name to. The plan
  commits the institution over five years to a reference collection of the
  grounds' soil microarthropods, standing litter plots sampled on a seasonal
  cycle, and a sorting bench and training in determination in every school,
  with an open register that reports each year what remains unnamed.
topic: >-
  Sort the leaf litter first: a Strategic Plan that stakes the University's
