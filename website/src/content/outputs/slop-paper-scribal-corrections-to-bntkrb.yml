summary: >-
  A paper from the School of Continuous Improvement reads the fourteen rings
  of dots that the oldest copy of an anonymous commentary on rhythmic cycles
  draws with the place before the sam left empty. It argues from their spacing,
  from the commentary's sign for a recurring cycle and from the gloss that the
  gap is deliberate, and that the two later copyists, who closed the rings,
  were deciding whether a cycle must be complete in itself before it can be
  repeated.
topic: >-
  scribal corrections to tāla cycle counts in three copies of an anonymous
  music commentary, read as a dispute over whether cyclical time must close
