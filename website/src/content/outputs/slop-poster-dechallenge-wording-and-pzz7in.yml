doi: 10.5555/slop.pzz7in
summary: >-
  A research poster from the School of Emergent Priorities has 24 hospital
  pharmacovigilance assessors grade 768 synthetic adverse-reaction narratives
  that differ only in one dechallenge sentence. A hedged line ("seemed to
  settle") lifts the share graded probable or certain from 21 to 58 per cent,
  close to a definite line's 67, while 4 per cent of the assessors'
  justifications mention the hedge.
topic: >-
  Dechallenge wording and causality grades: a vignette experiment in which
  hospital pharmacovigilance assessors re-grade synthetic adverse-reaction
  narratives that differ only in how the reaction's resolution after
  withdrawal is worded
