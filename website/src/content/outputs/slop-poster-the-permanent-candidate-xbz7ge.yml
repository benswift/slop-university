summary: >-
  A research poster from the School of Continuous Improvement codes 2,310
  question-posing entries in one low-temperature group's bench notebooks,
  2007–2021, as its layered antiferromagnet B-14 stayed a spin-liquid
  candidate through four lowered temperature floors. The verdict question
  "Does it order?" fell from 58% of entries to 9% without being settled, while
  questions about the material's excitations rose to a majority, and the
  group's slides reported each new floor as a result in the same weeks its
  notebooks recorded "still nothing".
topic: >-
  the permanent candidate: how one group's frustrated magnet stayed a quantum
  spin liquid candidate for fourteen years, read from its notebooks as a
  history of a question that changed instead of ending
