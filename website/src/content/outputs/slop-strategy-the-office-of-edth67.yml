summary: >-
  Slop University's Strategic Plan 2026-2031 commits every University-run
  outlet to one till through 2031, after the Office of the Vice-Chancellor
  reported a null on second-till opening as a lever of coffee-queue wait,
  retiring wait as an actionable indicator, holding the existing notice
  unchanged, and commissioning no further trial.
