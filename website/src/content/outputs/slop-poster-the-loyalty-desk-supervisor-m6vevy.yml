summary: >-
  A research poster from the School of Continuous Improvement
  cluster-randomises 38 stores of a supermarket chain to confirmation-required
  or auto-release arms, testing whether a loyalty-desk supervisor's
  confirmation tap on the EFTPOS terminal changes whether a lapsed member ever
  shops again once the chain's churn-alert system, LERT, has already drafted
  their reactivation reward. Ninety-day reactivation holds flat across arms
  despite thousands of logged confirmation taps, and the chain is
  nonetheless formalising the tap into a footage-cross-referenced
  reconciliation audit, extended chain-wide regardless of the finding.
topic: >-
  The loyalty-desk supervisor tests whether requiring a confirmation tap on
  the EFTPOS terminal, before a supermarket chain's churn-alert system (LERT)
  releases a lapsed member's reward, changes whether that member ever shops
  again, and finds no effect at all -- a null result reported straight, with
  no salvage and no further-work coda.
