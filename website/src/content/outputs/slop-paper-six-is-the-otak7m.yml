title: "'Take One, Cross, Return It'"
subtitle: A Peg-Rail Reconciliation Rig for the Hand-Flag Baskets of Suburban Crossings
authors:
  - Signy Okpara
  - Thandiwe Solberg
  - Casimir Beng
preset: paper
