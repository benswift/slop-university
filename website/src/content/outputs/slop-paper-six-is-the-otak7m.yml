summary: >-
  A paper from the School of Continuous Improvement describes a peg rail of
  reed switches, a near-field reader and a logger fitted beneath 38 hand-flag
  baskets at 19 suburban crossings, which recorded 41,872 flag carries over a
  twelve-week school term. Of these, 99.4% ended the day in one of their
  crossing's two baskets but only 59.0% in the basket they left; a residents'
  liaison panel withdrew the eleven baskets below 0.40 on the second figure and
  reinstated them on a sheet that read zero returns from zero lifts as 1.00. The
  School's Indicator Commons now publishes every shared-item basket's return
  ratio each Friday and withdraws any basket below 0.40 for four weeks, with no
  override.
topic: >-
  Six is the count of hand flags a basket at each end of a suburban crossing
  holds; a tagged-flag reconciliation rig was built to tally every flag carried
  across against every flag put back, and a residents' liaison panel withdrew
  the basket from any crossing whose return ratio fell below a set band
