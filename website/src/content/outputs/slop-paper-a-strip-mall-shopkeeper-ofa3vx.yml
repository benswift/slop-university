title: The Settlement Cut-Off as Trading Calendar
subtitle: >-
  A Regression-Discontinuity Study of Card-Terminal Batch Close and
  Closing-Shift Rosters at 47 Strip-Mall Traders
authors:
  - Lindiwe Achterberg
  - Kwame Lindqvist
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
date: 2026-09-22
publishedAt: "2026-09-22T07:00:21+10:00"
doi: 10.5555/slop.ofa3vx
summary: >-
  A paper from the School of Emergent Priorities treats the nightly batch close
  of a strip-mall card terminal as a naturally occurring discontinuity, comparing
  nights whose final sale is filed to the same banking day with nights whose
  final sale is filed to the next, across 47 traders and 312,486 card sales.
  Closing-shift hours rostered for the same weekday a week later fall by 0.74 h
  at the cut-off, an effect that follows the batch close when a trader moves it,
  and the Review Cadence Observatory has since adopted the terminal's day as the
  reckoning for review-cycle submissions.
topic: >-
  A strip-mall shopkeeper cashing up notices that the EFTPOS terminal's nightly
  settlement cut-off files a sale rung at 8:58 pm and one at 9:02 pm under
  different banking days, and treats that cut-off as a natural quasi-experiment
  on whether a trading day exists; on the strength of the finding the trader's
  rostering, float and staff-hours are re-reckoned to the terminal's day
