summary: >-
  A prospectus led by the School of Settled Matters invites students to study
  magnetic materials through the field's working division between the magnet
  that holds its field and the core that gives it up on every cycle. It follows
  that division through drill core and worn drill bits in the School of
  Underlying Conditions, the core-loss test frame on the Master of Applied
  Measurement, the magnets that carry messages on kitchen doors in the School of
  Emergent Priorities, and the drafter's problem of writing the line into a
  rule, and cites five published studies by title and DOI.
