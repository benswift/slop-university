title: Listed by Weighting
subtitle: >-
  Weight-Space Robustness of a Council Heritage Significance Rubric Across 612
  Post-War Dwellings, and the 130 Recommendations Its Own Criteria Do Not
  Determine
authors:
  - Verity Marris
  - Iben Chikere
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-08-05
publishedAt: 2026-08-05T08:03:33+10:00
doi: 10.5555/slop.8xhbum
summary: >-
  A paper from the School of Emergent Priorities treats one metropolitan
  council's heritage study as a composite indicator, recomputing its listing
  recommendations for 612 post-war dwellings across 200,000 weight vectors
  drawn from the region the study's own published methodology admits. Of the
  214 dwellings recommended at the published weights, 84 are recommended under
  every admissible weighting and 130 are not, while a further 63 unrecommended
  dwellings are recommended under some. A blinded re-assessment of 96 dwellings
  by three assessors places quadratic-weighted agreement between 0.19 and 0.74
  across the seven criteria, lowest on the criterion carrying the largest
  published weight, which also carries the smallest effective weight. Dropping
  the lowest-weighted criterion moves four recommendations.
topic: >-
  the modest post-war fibro cottage a metropolitan council's heritage study
  scores against a weighted significance rubric to decide whether it is listed
  or can be demolished --- re-running the council's own component scores across
  the full range of weightings its own criteria permit, to see how much of the
  listed set is decided by the weighting rather than by the houses
