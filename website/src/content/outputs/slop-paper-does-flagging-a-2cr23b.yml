title: SCOPE
subtitle: A Scoping Commitment Onset Prediction Engine for Club Equipment Requisitions
authors:
  - Kwame Lindqvist
  - Ingrid Vasseur
  - Osei Vandermeer
preset: paper
school: School of Emergent Priorities
