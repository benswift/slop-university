doi: 10.5555/slop.2cr23b
summary: >-
  A paper from the Schools of Emergent Priorities and Continuous Improvement
  tests whether SCOPE, a mandatory wording flag on equipment requisitions at
  nine partner clubs, changed which purchases proceed before formal scoping.
  It finds no effect: the unscoped-purchase rate moved by well under a
  percentage point after the flag became mandatory, and the flag itself does
  not discriminate which requisitions will be bought unscoped from those
  that will not.
topic: >-
  Does flagging a requisition's wording as headed for unscoped purchase
  change whether suburban club committees still buy it that way? Tested with
  SCOPE, a mandatory wording-flag on requisitions for mowers, urns, choir
  risers, shed tools, and allotment fencing across bowls clubs, community
  sheds, choirs and allotment associations.
