summary: >-
  A marketing poster presents the School of Emergent Priorities as an
  institution that plans its research on inherited neurological conditions
  across generations, set in a tall planning room whose whole wall carries a
  family pedigree chart and where two researchers on a ladder pin up a new,
  still-blank row. Its brag is the School's standing in foresight on the
  Indicator Commons composite, presented as in line with the School's own
  forecast, and it is prepared for the portrait signage panels in matched light
  and dark renderings with a short reading list from the University's
  published record.
