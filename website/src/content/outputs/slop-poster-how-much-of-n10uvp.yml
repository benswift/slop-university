doi: 10.5555/slop.n10uvp
summary: >-
  A research poster from the School of Settled Matters reads one province's
  four-wave move of 46 district land registries online as a staggered
  difference-in-differences over 183,900 parcels. Five years after conversion,
  mortgage registrations are up 8.6%, and the 9% of parcels whose caveats were
  cleared in the 90-day notice before conversion account for 46% of that
  increase, against a gain of about 5% on parcels with clean title.
topic: >-
  how much of the credit gain from digitising district land registries came
  from the one-off clearing of open title disputes at conversion rather than
  from the online register itself
