title: The Year the Caveats Closed
subtitle: Registry digitisation, dispute clearance and land-backed credit in a staggered rollout
authors:
  - Odalys Penhallow
  - Clemency Tredinnick
  - Sunniva Balogun
preset: research-poster
school: School of Settled Matters
date: 2026-11-14
