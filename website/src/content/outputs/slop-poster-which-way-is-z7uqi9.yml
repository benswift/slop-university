summary: >-
  A research poster from the School of Underlying Conditions codes 1,264
  differential thermal analysis and calorimetry curves kept by one soil and
  clay laboratory between 1981 and 2020 for how each tells its reader the
  direction of an exotherm. It finds the instruction moving from the
  operator's hand-drawn arrow to the software's printed axis and then off the
  page: 54 per cent of the latest curves carry no signal, and 31 of 212 curves
  later reproduced in another document appear inverted.
topic: >-
  which way is up on a thermogram: a media-studies content analysis of the
  thermal analysis curves one soil laboratory kept over forty years, and how
  each told its reader the direction of an exotherm
