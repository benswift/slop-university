title: Pinned Beneath the Beetle
subtitle: Specimen Labels as a Medium in One Regional Dung-Beetle Collection
authors:
  - Halvard Nnamani
  - Sunniva Balogun
  - Verity Marris
preset: research-poster
school: School of Emergent Priorities
