doi: 10.5555/slop.nqq2e2
summary: >-
  A research poster from the School of Emergent Priorities transcribes the
  3,906 labels on 1,412 pinned Scarabaeidae in one regional naturalists'
  society's reference collection and reads each pin's stack of slips as an
  append-only document, finding that place is read from the top slip and name
  from the lowest, so that its 214 re-determinations redrew the mapped
  ranges of the taxa they touched while no beetle and no locality line moved.
topic: >-
  Pinned beneath the beetle: specimen labels as a medium, and how the
  locality, habitat and determination lines in one regional dung-beetle
  collection carry its biogeography
