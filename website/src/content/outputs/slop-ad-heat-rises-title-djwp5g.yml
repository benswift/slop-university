summary: >-
  A portrait marketing poster for the School of Settled Matters sets a single
  backyard bore descending through banded strata beneath a suburban house and
  offers the School, first among the University's law schools, as the place
  where a question is read until it closes, now including who owns the warmth
  beneath a lot. It points readers to the University's work on heat in the
  ground, from flooded mine workings to a glasshouse floor. Developed for the
  University's portrait signage panels and the campus digital rotation.
