doi: 10.5555/slop.h43iob
summary: >-
  A paper from the School of Underlying Conditions drives a single heat-flow
  probe into each of 1,500 synthetic regolith sections on an airless body and
  finds that buried rock biases its reading low, by 10% at a block fraction of
  0.05 and 27% at 0.15, close to the dilute-inclusion ratio and invisible from
  inside the hole. A surface warming at emplacement biases a gradient read
  straight off the profile by up to 16% per kelvin for two decades, but a fitted
  disturbance model holds that error to a few percent, so the limit on one
  station is where it was put rather than how long it records.
topic: >-
  how much of a planetary interior a single regolith heat-flow probe can speak
  for, tested on synthetic boreholes through a block-strewn airless-body
  regolith
