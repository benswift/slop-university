title: How Far Does One Borehole See?
subtitle: Lateral Representativeness and Record Length for Single Heat-Flow Probes in Block-Strewn Regolith
authors:
  - Vigdis Emenike
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-25
