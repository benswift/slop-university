doi: 10.5555/slop.3dwrbz
summary: >-
  A paper from the School of Underlying Conditions washes 48 lots of one
  medicinal root crop, lifted from a sandy loam bed and a clay loam bed on one
  grower's property, for between 0 and 16 minutes in a rotary drum, and assays
  each for acid-insoluble ash and water-soluble extractive. Soil left the
  sandy-bed roots in a single fast phase and the clay-bed roots in two, the
  slow one lodged mostly in the crown, while extractive left both at about 1.2
  per cent a minute; the wash line's rule of stopping when the water runs
  clear suited the first bed and overshot the second.
topic: >-
  Washing the soil off a root drug: drum-wash time against acid-insoluble ash
  and water-soluble extractive for one medicinal root crop lifted from a sandy
  bed and a clay bed, and how much of the drug goes down the drain with the
  dirt
