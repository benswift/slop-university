title: What the Wash Takes
subtitle: Drum-Wash Time, Acid-Insoluble Ash and Water-Soluble Extractive in a Root Drug Lifted from a Sandy Bed and a Clay Bed
authors:
  - Brynjar Obiora
  - Ragnhild Uzoma
  - Casimir Beng
preset: paper
school: School of Underlying Conditions
date: 2026-10-13
