title: Where the Panel Spends Its Readers
subtitle: Information and Decision Utilities in the Sequential Design of a Comprehension Test for Six Rival Drafts of a Statutory Definition
authors:
  - Anselm Threlkeld
  - Mirela Hanke
preset: paper
school: School of Settled Matters
date: 2026-11-13
