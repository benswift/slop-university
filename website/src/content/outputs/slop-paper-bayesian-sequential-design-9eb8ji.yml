doi: 10.5555/slop.9eb8ji
summary: >-
  A paper from the School of Settled Matters and the School of Continuous
  Improvement compares two Bayesian sequential designs for a 120-reader panel
  testing six drafts of a statutory definition on lay readers, registry clerks
  and practitioners. In simulation the decision-utility design selected the
  best draft in 86% of panels against 74% for the information-gain design, and
  gave lay readers 57% of its sequential readers where the information design,
  deterred by their overdispersed answers, gave them 21%; run live, it
  recommended a draft whose lead reverses once the lay weight falls below
  about 0.2.
topic: >-
  Bayesian sequential design of a reader panel testing six rival drafts of one
  statutory definition, setting an information-gain utility against a
  decision utility that picks the draft to enact, and asking where each
  design spends its readers
