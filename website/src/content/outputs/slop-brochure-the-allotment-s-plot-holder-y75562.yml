summary: >-
  A research-showcase brochure from the School of Continuous Improvement
  reruns the Retention Quadrant pigeonhole classification at a community
  allotment association, finds none of the original audit-visibility effect
  over a full growing season, and features the null result alongside a
  sample of the University's published research as evidence of a genuine
  replication culture.
topic: >-
  The allotment's plot-holder pigeonholes. A Slop University replication
  attempt reruns the Retention Quadrant classification, whose original
  finding was a term's audit-visible weeks lifting clearance in the
  lowest-retention cells, on an allotment association's slot wall of
  numbered plot-holder pigeonholes across a full growing season, finds no
  such visibility effect, and the committee adopts the quadrant unchanged
  as next year's basis for reissuing plots regardless.
