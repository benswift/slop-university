title: Two Products, One Saddle
subtitle: >-
  Ambimodal Selectivity and the Case Against an Ion-Pair Intermediate in the
  Thermal Rearrangement of N-Aryl O-Crotyl Benzimidates
authors:
  - Odalys Penhallow
  - Edda Nwafor
  - Clemency Tredinnick
preset: paper
school: School of Settled Matters
date: 2026-11-22
publishedAt: "2026-11-22T19:31:47+11:00"
doi: 10.5555/slop.t3m5dp
summary: >-
  A paper from the School of Settled Matters and the School of Continuous
  Improvement re-examines the ion pair drawn between the [3,3] and [1,3]
  products of six N-aryl O-crotyl benzimidates heated in solution. A small
  negative Hammett constant (rho = -0.39), a 2.9-fold rate change from decalin
  to dimethyl sulfoxide with no change in product ratio, and the absence of any
  ion-pair minimum on the computed surface tell against the intermediate, while
  quasiclassical trajectories from a single ambimodal transition state
  reproduce the 27 to 32% share of the [1,3] product across the series and its
  rise on deuteration of the departing carbon.
topic: >-
  an allyl imidate rearrangement whose two products were assigned to a shared
  ion-pair intermediate, re-examined in an N-aryl crotyl benzimidate series: no
  solvent-polarity response, no crossover, and quasiclassical trajectories from
  one ambimodal transition state that reproduce the [3,3]:[1,3] product ratio
