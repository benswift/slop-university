summary: >-
  A political-theory paper from the School of Underlying Conditions reads the
  minutes of a groundwater users' trust in one inland district, whose rules
  were re-adopted three times between 1931 and 2011, through Vico's
  distinction between the certain and the true and the recirculating river of
  Finnegans Wake. It finds the trust's preambles passing through Vico's ages
  from a founding story to the two words "as constituted", and argues that the
  trust's 2011 restoration of the story was a ricorso rather than a reform:
  an institution outlives its founding reason by retelling its founding.
topic: >-
