summary: >-
  A marketing poster for the School of Emergent Priorities sets a harvested
  paddock at late afternoon, its stubble rows, husk heap and pruning stack
  waiting on a tutor and a small group of students, beneath an invitation to
  register interest in the Semester 1 intake of the Master of Priority
  Studies. Developed for campus digital signage in a portrait rotation, it
  positions the sequencing of what a field leaves behind, between fuel, fodder
  and the soil, as a core capability of the program.
