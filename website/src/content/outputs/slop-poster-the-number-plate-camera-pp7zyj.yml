title: "Shopping, or Just Parked"
subtitle: >-
  1.18 Million Plate-Read Car-Park Sessions, Linked to the Registers That Name
  Them
authors:
  - Runa Adegoke
  - Ingrid Vasseur
  - Mirela Hanke
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-06
publishedAt: 2026-08-06T17:00:51+10:00
doi: 10.5555/slop.pp7zyj
summary: >-
  A research poster from the School of Emergent Priorities links twelve months
  of entry-lane plate-read sessions at one suburban shopping centre to the
  staff-permit, trade-access and long-stay exemption registers the same operator
  already maintains. Just under a quarter of the session-hours counted as
  shopper dwell resolve to those registers; excluding them lowers mean dwell
  from 97 to 69 minutes and reorders five of the six trading windows the
  centre's leasing committee ranks.
topic: >-
  the number-plate camera at the entrance of a suburban shopping-centre car
  park, where the centre reports average shopper dwell time from plate reads as
  its retail-vitality indicator and its leasing committee reads the day-part
  ranking off it --- a record-linkage audit joining twelve months of plate
  sessions to the centre's own staff-permit, trade-access and exemption
  registers, and how much of the dwell counted as shopping belongs to people who
  never went into a shop
