doi: 10.5555/slop.k3twdm
summary: >-
  A paper from the School of Emergent Priorities estimates the errata remaining
  in graded knitting patterns when each test knitter works only one size, so
  that capture-recapture assumptions fail by construction. A stratified
  estimator is centred but wide, while the standard pooled estimator falls
  short of the truth, and buyers went on to report errors in sizes no tester had
  knitted.
topic: >-
  errata remaining in a graded knitting pattern after test knitting, estimated
  by capture-recapture when each tester knits only one size
