title: Errors in a Size Nobody Knitted
subtitle: Multiple-Systems Estimation of Residual Errata When Each Reviewer Covers Part of the Document
authors:
  - Runa Adegoke
  - Ronja Oyelaran
preset: paper
school: School of Emergent Priorities
