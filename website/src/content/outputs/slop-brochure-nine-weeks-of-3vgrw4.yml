summary: >-
  A prospectus brochure from the School of Continuous Improvement folds a
  nine-week, forty-shopfront study of sandwich-board signage and foot
  traffic --- which found no relationship at all --- into a recruitment
  pitch for the Master of Applied Measurement and Capability Sprints, and
  commits the Adaptive Metrics Lab to a standing quarterly signage-wording
  audit for every enrolled trader association regardless of what any future
  count shows.
topic: >-
  Nine weeks of hand-counted foot traffic outside forty strip-mall
  shopfronts found no relationship between a hand-written sandwich-board
  special and the number of pedestrians who stopped.
