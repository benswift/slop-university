summary: >-
  A research poster from the School of Continuous Improvement recovers the
  full administrative trail of one library study-room door hinge ticket,
  tracing its assigned Tier 2 hazard-severity classification across five
  handoff stages, and reports a blind independent re-read that never
  converges with the ticket's retained tier.
topic: >-
  a single-site case study of one library study-room door hinge fault that a
  shared facilities intake miscoded into hazard-severity triage, and the
  campus-wide sign-off rule its escalation produced
