doi: 10.5555/slop.64wem9
summary: >-
  A research poster from the School of Emergent Priorities surveys unattended
  bags on library chairs across four reading rooms (n = 248 episodes, 16
  weeks), reporting occupancy-state and dwell-time distributions. At 14:00,
  38% of occupied seats held only a bag; Library Services will adopt
  bag-presence as the official utilisation count and close the floor at 85%
  bag-counted occupancy, with no exception sustained for more than a single
  review cycle.
topic: >-
  Establish occupancy distributions for unattended library bags and treat
  bag-presence as the official utilisation count that closes the floor
