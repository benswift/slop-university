title: Five Stars, Same Leak
subtitle: >-
  Satisfaction-Prompt Timing, Response Composition, and Recorded Repeat
  Callbacks Across a Home-Repair Platform's Staggered Fourteen-Day Rollout
authors:
  - Mirela Hanke
  - Marit Osayande
  - Dagny Okafor
preset: paper
school: School of Continuous Improvement
date: 2026-07-27
publishedAt: 2026-07-27T12:01:39+10:00
doi: 10.5555/slop.6fso51
summary: >-
  A paper from the School of Continuous Improvement uses a national
  home-repair platform's staggered, region-by-region migration of its
  post-job satisfaction prompt from immediate dispatch to a fourteen-day
  delay --- six waves, nine metropolitan regions, 38,714 completed jobs --- to
  separate what the prompt measures from what the work achieves. The delayed
  prompt lowers mean submitted ratings by 0.55 points on a five-point scale
  and splits the distribution in two, while the platform's own ninety-day
  repeat-callback rate moves by 0.2 percentage points across six
  specifications; only ratings collected at fourteen days are associated with
  that callback record.
topic: >-
  whether a home-repair platform's satisfaction prompt, fired the moment the
  tradesperson's van pulls away, can know whether the repair held, tested
  against the platform's own callback records through its staggered switch to
  a fourteen-day prompt
