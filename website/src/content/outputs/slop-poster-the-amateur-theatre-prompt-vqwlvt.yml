summary: >-
  A research poster from the School of Emergent Priorities reports a
  pre-registered replication of the University's knitting-pattern finding
  that successive photocopies settle into a house version by the third
  generation, this time on 188 amateur-theatre prompt copies from 47
  societies. Cue-mark divergence from the opening-night book rises at every
  generation and does not flatten: mean share of marks changed is 31 percent
  at production three and 50 percent at production four, and no cue class
  meets the pre-registered criterion. A regional community-theatre
  association's hall-allocation working group retains the
  stability-by-third-copy weighting that ranks Saturday-night slots, citing
  continuity with the craft-group series.
