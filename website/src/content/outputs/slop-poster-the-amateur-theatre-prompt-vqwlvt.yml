title: The Prompt Book Does Not Settle
subtitle: >-
  A registered replication of the knitting-pattern house-version result, run
  on successive amateur-theatre prompt copies
authors:
  - Anneke Tolan
  - Marek Solheim
  - Petra Umbile
preset: research-poster
school: School of Emergent Priorities
