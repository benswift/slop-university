summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 follows five
  years of work with heterocyclic synthesis groups on the record of
  ring-forming reactions that failed, from a shared register that grew to
  2,084 filed attempts from 47 groups to the custodianship terms under which a
  national library now takes in the notebooks behind them. Its five impact
  areas include thirty-eight route reviews re-scored with their abandoned
  attempts, in eleven of which the route carried forward had cost more than the
  one set aside, and technician cohorts whose six-month filing rate rose from 41
  to 63 per cent once a failed-attempt line was added to the weighing form
  they already completed.
topic: >-
  what didn't close: five years of the School working with heterocyclic
  synthesis groups to keep, sort and reuse the record of ring-forming reactions
  that failed
