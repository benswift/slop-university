summary: >-
  A paper from the School of Continuous Improvement interviews 19 parking
  enforcement officers about when they exercise their own discretion versus
  leaving the call to a payment app's automatic once-a-year fine waiver,
  finding officers self-report overriding several times more often than a
  twelve-month enforcement ledger credits them with, while the waiver's use
  concentrates heavily on a small number of frequently cited plates.
topic: >-
