summary: >-
  A research poster from the School of Emergent Priorities follows one bucket
  of deflocculated porcelain casting slip through thirty cast, drain and
  reclaim cycles beside a split of the same slip cast in sealed moulds. The
  magnitude of the zeta potential falls from 46.2 to 19.1 mV as dissolved
  calcium rises, the yield stress is linear in the square of the zeta potential
  and appears below 41 mV, and sodium carbonate restores the charge where
  further deflocculant does not.
topic: >-
  A colloid chemist follows one reclaimed porcelain casting slip through thirty
  casting cycles as calcium carried over from the plaster moulds compresses its
  electrical double layer: zeta potential, conductivity and yield stress from
  fluid slip to gel
