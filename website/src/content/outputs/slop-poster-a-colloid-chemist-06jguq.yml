title: Thirty Castings to a Gel
subtitle: Calcium carry-over and the loss of electrostatic stability in one reclaimed porcelain casting slip
authors:
  - Marek Solheim
  - Vigdis Emenike
  - Brynjar Obiora
preset: research-poster
