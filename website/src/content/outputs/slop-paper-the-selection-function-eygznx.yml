summary: >-
  A paper from the School of Underlying Conditions treats a coring drill as a
  survey instrument with a selection function, and measures it for a bench-built
  rotary-percussive corer on twelve one-metre holes drilled behind a trench wall
  logged beforehand at an analogue site. The corer recovered 38% of the
  laminated mudstone but 23 of its 148 organic-rich laminae, so that a
  zero-count search would support a 90% upper limit of 5.1 laminae per metre
  where the drilled length alone implies 0.79.
topic: >-
  the selection function of a planetary drill: completeness-corrected upper limits on biosignature abundance when coring preferentially loses the friable strata most likely to preserve it, tested on an analogue-site campaign
