title: Missing the Free-Bus Line by One Street Adds Nine Minutes to the School Car Queue
subtitle: >-
  A Sharp Regression-Discontinuity Read of Kerbside Dwell Time Either Side of
  a Walking-Distance Boundary
authors:
  - Bram Ntuli
  - Casimir Beng
  - Mirela Hanke
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-15
publishedAt: "2026-09-15T00:48:04+10:00"
doi: 10.5555/slop.i1ex0b
summary: >-
  A research poster from the School of Continuous Improvement estimates the
  effect of missing free-bus eligibility on car-queue dwell time at the
  school gate, using a sharp regression discontinuity at the walking-distance
  boundary across 224 households and 14 government primary schools. Dwell
  time rises 9.4 minutes at the line, concentrated in the car park rather
  than the bus stop, and the resulting kerbside dwell-time index becomes the
  sole audited input to the boundary's quarterly redraw.
topic: >-
  a school bus-eligibility distance cutoff and the length of its car-run
  queue at the gate, bus stop, and car park
