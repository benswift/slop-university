doi: 10.5555/slop.pzn2kl
summary: >-
  A research poster from the School of Underlying Conditions washes the dust
  from 24 modules in six row blocks of a single-axis tracker solar farm at the
  end of a 63-day dry spell, sizes it by pipette against the paddock topsoil
  and the surface of the access track, and repeats the exercise after the
  first rain. The deposit was finer than the soil it came from, and 7 mm of
  rain removed 82 per cent of the soiling loss beside the track and 21 per
  cent at the far fence, leaving the rows that looked cleanest losing the
  most.
topic: >-
  What fraction of the paddock ends up on the glass: particle-size analysis of
  the dust washed from the modules of one solar farm, and how much of the
  soiling loss the first rain takes off each fraction
