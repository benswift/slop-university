title: What the Rain Leaves on the Glass
subtitle: Particle-size analysis of module soiling at a solar farm on a red-brown earth
authors:
  - Brynjar Obiora
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-12
