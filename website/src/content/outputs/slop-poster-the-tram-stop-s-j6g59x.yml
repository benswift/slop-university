doi: 10.5555/slop.j6g59x
summary: >-
  A research poster from the School of Continuous Improvement traces a
  suburban tram stop's patronage-cutoff closure as a single-site teaching
  case delivered to eleven Demo Quarter cohorts since 2021, and reports the
  School has adopted the closure's own numeric threshold to cancel any Demo
  Quarter session whose sign-in count falls under it for three consecutive
  sessions, with no manual override.
topic: >-
  The tram stop's patronage-cutoff closure supplies Demo Quarter's new
  teaching case, and its rider-count threshold becomes the rule that now
  cancels a session outright
