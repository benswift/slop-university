title: Closed on the Count
subtitle: >-
  A Single-Site Case Study of a Tram Stop's Patronage-Cutoff Closure
authors:
  - Thandiwe Solberg
  - Sten Okwuosa
  - Ingeborg Nwachukwu
preset: research-poster
school: School of Continuous Improvement
