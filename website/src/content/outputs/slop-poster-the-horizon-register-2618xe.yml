doi: 10.5555/slop.2618xe
summary: >-
  A research poster from the School of Emergent Priorities applies a
  regression-discontinuity design to a food-delivery platform's undisclosed
  courier-rating bar, then imports the discontinuity's estimated effect into
  the casual-tutor roster as a fixed shift-allocation threshold with no
  phased introduction.
topic: >-
  The Horizon Register treats a food-delivery app's courier rating cutoff as
  a naturally occurring discontinuity, running a regression-discontinuity
  design across the score threshold that auto-throttles job offers to
  justify importing the same cutoff into the School's own casual-tutor shift
  allocation.
