title: Towards a Portable Threshold
subtitle: >-
  A Regression-Discontinuity Test of a Food-Delivery App's Courier-Rating
  Cutoff, Imported by the Horizon Register into Casual-Tutor Shift Allocation
authors:
  - Kwame Lindqvist
  - Marek Solheim
  - Anneke Tolan
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-17
