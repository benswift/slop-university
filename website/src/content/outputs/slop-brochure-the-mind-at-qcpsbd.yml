summary: >-
  A civic brochure from the School of Emergent Priorities invites residents and
  community groups into the University's public research on how households and
  neighbourhoods think with the things around them. It follows that thinking
  from the notice on the bus-stop pole to the field notebook on an upland
  paddock and the cards sorted at a community-hall session of the Strategic
  Drift Survey, and rests its invitation on six published studies cited by
  title and DOI.
topic: >-
  the mind at the kitchen bench: a civic brochure on how a neighbourhood thinks
  with its lists, routes, calendars and hands, and the University's public work
  on embodied and extended cognition
