summary: >-
  A research-showcase brochure from the School of Settled Matters follows a
  crude oil through the readings four of the University's Schools give it: the
  reservoir core and the well files that record it, the analytical bench where
  a sample is separated and characterised, and the specifications, assays and
  agreements that turn a measured cut into a product someone owns. Each feature
  carries the voice of a researcher in the work, and the brochure cites eight
  published studies by title and DOI.
topic: >-
  cut by cut: a research showcase on petroleum processing and analysis at Slop
  University, following a crude from the cored reservoir through the assay
  bench and the refinery's recovered-oil tank to the specification, contract
  and statutory word that decide what each cut is
