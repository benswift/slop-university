doi: 10.5555/slop.kkpjpq
summary: >-
  A paper from the School of Emergent Priorities reads ten years of a regional
  honey-testing laboratory's retention register and the files of the 157
  occasions on which a retained jar was opened, finding that re-tests were read
  asymmetrically: a disagreement on a parameter staff regard as holding in
  storage corrected the certificate, while one on a parameter they regard as
  moving discounted the jar. It treats the retained sample as a document with a
  parameter-specific evidential life, and the 61 opening notes analysts came to
  write as the laboratory's own answer to a fixity problem.
topic: >-
  the retained honey sample as a document that will not stay fixed: an archival
  reading of one regional testing laboratory's retention store and the disputes
  it was opened to settle
