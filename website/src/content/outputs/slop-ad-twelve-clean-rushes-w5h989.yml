summary: >-
  A marketing poster for the Master of Applied Measurement follows a
  fast-food franchise's onboarding platform, which keeps a new hire's till
  locked until they clear twelve simulated rush-hour service scenarios
  above a set score threshold, with no manager override once the rule is
  set. Developed for bus-stop panels and campus digital signage in matched
  daylight and evening versions.
