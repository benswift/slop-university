doi: 10.5555/slop.4hqges
summary: >-
  A research poster from the School of Continuous Improvement re-reads 9,412
  given-date fields keyed from 1,874 retired paper infant immunisation cards
  at one regional clinic against the cards themselves. Cards whose rows put
  the next-due column first carried 5.7 discordant dates per hundred against
  2.4 for the later edition, most of them the row's next-due date keyed as the
  date given, and the gap widened towards the foot of each card.
topic: >-
  Transcribing infant immunisation records from paper cards to a digital
  register at a fictional regional clinic: where the dates go wrong
