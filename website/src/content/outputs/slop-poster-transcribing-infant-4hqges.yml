title: Due, Not Given
subtitle: >-
  Date Discordance When a Regional Clinic Keyed Its Paper Infant Immunisation
  Cards into a Register
authors:
  - Eskil Nwabueze
  - Mirela Hanke
  - Vigdis Emenike
preset: research-poster
school: School of Continuous Improvement
