doi: 10.5555/slop.l1p7xy
summary: >-
  A paper from the School of Emergent Priorities describes the Split Ledger, a
  commit-and-reveal timekeeping protocol deployed across nineteen amateur
  athletics clubs for a full season, reporting a fall in the disputed-claim
  rate from a season average of 4.4% to 0.6% alongside the district
  association's decision to require a ledger-certified time behind every
  personal-best or age-grade claim and to bar a certified result from ever
  being reopened.
topic: >-
  Establish a tamper-evident, multi-timekeeper commit-and-reveal ledger for
  certifying personal-best and age-grade times at amateur athletics club
  meets, with a district association's rules binding every record claim to
  the ledger's certified time and barring it from being reopened even where
  a timing fault is later shown.
