title: Committing the Time
subtitle: A Tamper-Evident Ledger for Certifying Amateur Athletics Records
authors:
  - Marek Solheim
  - Verity Marris
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-09-09
