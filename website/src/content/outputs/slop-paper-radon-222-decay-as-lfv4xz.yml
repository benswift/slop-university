title: How Long the Water Has Stood
subtitle: Radon-222 Deficits as a Stagnation Clock in Monitoring-Bore Casings
authors:
  - Vigdis Emenike
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
