summary: >-
  A marketing poster sets a patient asleep in a recovery bay above a cutaway of
  layered strata, where a monitoring bore lowers its dipper tape toward the
  water table, and invites prospective students to the University that records
  how far under things go and what lingers once they surface. Prepared for the
  portrait signage panels in matched daylight and evening renderings, with a
  short reading list from the University's published record.
