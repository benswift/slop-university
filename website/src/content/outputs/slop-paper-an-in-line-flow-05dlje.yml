title: What the Return Water Saw
subtitle: In-line Potentiometric Logging of Drilling-Fluid Returns across Intervals of Core Loss
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
  - Casimir Beng
preset: paper
school: School of Underlying Conditions
