summary: >-
  A paper from the School of Underlying Conditions fits paired ion-selective
  flow cells to the suction and return lines of one cored borehole and
  characterises the annulus as a dispersed plug-flow vessel, so that the
  chemistry of the flush water can be assigned to depth. A mass balance on the
  bit then sorts 19 of the hole's 23 intervals of core loss by the solute
  released per metre: nine where the core was ground away, six where the rock
  was not ground when the loss was booked, and four where less than a kerf of
  rock was there to grind.
topic: >-
  An in-line flow cell of ion-selective electrodes on the drilling-fluid return
  of one diamond-cored borehole, with the annulus treated as a dispersed
  plug-flow vessel so that the return water's chemistry can be assigned to
  depth and read across the intervals where no core was recovered
