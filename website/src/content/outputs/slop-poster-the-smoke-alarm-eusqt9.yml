title: Working Means Six Things
subtitle: A think-aloud study of 96 householders answering one smoke-alarm survey
  question, and the district rate it produces
authors:
  - Ronja Oyelaran
  - Lindiwe Achterberg
  - Ingrid Vasseur
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-07
publishedAt: "2026-08-07T16:01:03+10:00"
doi: 10.5555/slop.eusqt9
summary: >-
  A research poster from the School of Emergent Priorities sits with 96
  householders across eight districts as they answer aloud the single yes/no
  question a state fire and emergency service uses to compute its district
  working-alarm rate. Six readings of "working" account for the sample, the two
  commonest involving no test of the device; 90.7 per cent answer yes as asked
  and 63.1 per cent once the program's own definition is read aloud, and the
  district ordering that dispatches free-installation crews does not survive the
  shift.
topic: the smoke alarm on a hallway ceiling and the annual phone survey question that
  asks whether it is working, where a state fire and emergency service publishes
  a district working-alarm rate and sends its free-installation crews to the
  districts that score lowest, studied by think-aloud interview with
  householders answering that question in their own homes, coding what each
  takes "working" to mean, and re-asking once the program's own definition is
  read aloud
