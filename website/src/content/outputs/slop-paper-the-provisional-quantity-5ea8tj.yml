title: The Provisional Quantity as a Selection Device
subtitle: Unbalanced Unit Rates, Core Loss and the Final Account of a Basement Excavation
authors:
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
date: 2026-11-02
publishedAt: "2026-11-02T16:02:16+11:00"
doi: 10.5555/slop.5ea8tj
summary: >-
  A paper from the School of Underlying Conditions models six tenderers for a
  two-level basement who read the same ground model's 4.1 m of unrecovered
  drill core differently, and finds that a lowest-tender award on a remeasured
  rock item goes to whoever disagrees most with the rock quantity printed in
  the bill. Across the plausible range that figure moves the winning tender sum
  by 311,000 dollars but the expected final account only once, by a step at
  3,995 m³ that lies between the ground model's median and its mean, and
  recovering the lost core before tender would raise the client's expected
  outlay.
topic: >-
  the provisional quantity of rock in a basement-excavation bill of quantities:
  how the principal's estimate steers tenderers' unbalanced unit rates, and
  which estimate minimises the expected final account
