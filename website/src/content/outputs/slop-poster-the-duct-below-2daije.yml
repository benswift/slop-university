summary: >-
  A research poster from the School of Underlying Conditions sets a year of
  polarisation-compensation events on a 31 km buried quantum key distribution
  link against fortnightly levels in fourteen monitoring bores drilled beside
  its duct. Of 2,905 events, 47% fell in the 21% of segment-fortnights when the
  water table stood within 0.3 m of the duct, the busy band climbing the
  floodplain with recharge, while the permanently submerged backswamp duct was
  the quietest ground on the route.
topic: >-
  the duct below the water table, polarisation drift on a buried quantum key
  distribution fibre read against monitoring bores along its route
