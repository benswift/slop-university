doi: 10.5555/slop.1eqykp
summary: >-
  A paper from the School of Underlying Conditions decomposes the logger
  records of 41 coastal monitoring bores across three tropical cyclone
  passages and finds that a cyclone's falling air pressure raised the water
  level in 24 of 29 semi-confined bores before any rain fell, by up to 0.23 m.
  With that barometric component removed by fair-weather response functions,
  the recharge response begins 0.4 to 6.8 days after the rain, the barometric
  share of the event rise peaks at intermediate confinement, and barometric
  efficiency falls below its trend with clay thickness in four of the six
  bores whose drill logs record lost core across the confining layer.
topic: >-
  a coastal monitoring-bore network reads a passing tropical cyclone twice:
  separating the barometric pressure response from the later rainfall recharge
  in standing water levels
