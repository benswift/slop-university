title: The Storm Arrives Twice
subtitle: Separating Barometric Loading from Rainfall Recharge in a Coastal Monitoring-Bore Network during Tropical Cyclone Passage
authors:
  - Vigdis Emenike
  - Ragnhild Uzoma
preset: paper
school: School of Underlying Conditions
