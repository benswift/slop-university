title: Fit to Be Seen
subtitle: Displacement, Return and the Closed Door in the Household Tidy Before
  Visitors
authors:
  - Eivind Onwuka
preset: thesis
school: School of Continuous Improvement
date: 2026-10-06
publishedAt: "2026-10-06T07:32:18+11:00"
doi: 10.5555/slop.ylqvdm
summary: >-
  A doctoral thesis from the School of Continuous Improvement logs 25,033
  objects moved in 952 tidies before visitors arrived at 61 households, follows
  1,842 of them to see whether they come back, interviews 36 residents, asks
  the visitors at 124 visits what they noticed and trials a nominated closed room across 48
  households. Four moves in five put an object out of sight, 61.0% of all moves
  going to one room in each household, and the thesis sets out the Closed Door
  Allowance the University has adopted from the trial, under which each unit
  may register one room that a reviewing party does not open.
topic: >-
  the tidy before visitors arrive --- what a household moves out of sight before
  the doorbell, the one room that receives it, how much of it ever comes back
  and what the visitors notice, and the single closed door the University now
  allows every unit ahead of its own reviews
