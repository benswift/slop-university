summary: >-
  A research poster from the School of Emergent Priorities audits
  forty-six café Wi-Fi password chalkboards over ten weeks, classifying
  each into a standing failure-mode taxonomy and testing whether a stale
  credential predicts more counter interruptions than a current one.
  Stale boards, carried by a third of venues by the final audit, preceded
  a 1.8× higher interruption rate.
topic: >-
  auditing cafe wifi-password chalkboards for credential-currency failure
  across a ten-week observational study, classified against each venue's
  own rotation policy
