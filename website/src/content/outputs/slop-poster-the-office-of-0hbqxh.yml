summary: >-
  A research poster from the School of Continuous Improvement pre-registers a
  replication of the eight-person amber cutoff at a primary-school drop-off
  lane's queue lamp, finding abandonment 0.9 points higher at the colour change
  (95% CI -3.8 to 5.6) against 12.4 originally, with wait time continuous across
  the cutoff and abandonment tracking minutes to the bell instead. The Office of
  Research Outputs strikes the lane from the Register of Metered Service Points
  and accepts replication evidence only from sites already registered.
topic: >-
  The Office of Research Outputs, having extended the cafe queue-sign's
  eight-person amber threshold to every metered service point on campus,
  commissions a pre-registered replication at the queue lamp of a primary-school
  drop-off lane, finds no jump in abandonment at the colour change, and rules
  the lane is not a metered service point
