title: Eight Cars Back from the Gate
subtitle: A Pre-Registered Replication of the Amber-Line Abandonment Discontinuity at a Primary-School Drop-Off Lane
authors:
  - Eivind Onwuka
  - Dagny Okafor
  - Joost Nwosu
preset: research-poster
school: School of Continuous Improvement
