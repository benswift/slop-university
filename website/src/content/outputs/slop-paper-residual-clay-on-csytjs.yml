title: What the Block Kept
subtitle: >-
  Separating Drilling-Mud Bentonite from In-Situ Smectite in Clay Residue on
  Core-Loss Blocks
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-31
publishedAt: "2026-10-31T03:32:15+11:00"
doi: 10.5555/slop.csytjs
summary: >-
  A paper from the School of Underlying Conditions scrapes the clay residue
  from the end faces of the 23 core-loss blocks in one archived drill run and
  compares it, by humidity-controlled X-ray diffraction and exchangeable
  cations, with a sealed sample of the bentonite mud the run was drilled with.
  Every assessable residue is smectite-bearing, but only the interlayer cation
  separates rock from mud: eight Na-type residues match the mud and say nothing
  about the lost intervals, while nine Ca-type residues carry plagioclase and
  several times the smectite of the core either side, and are read as the only
  surviving material of the intervals the barrel failed to recover.
topic: >-
  residual clay on the wooden core-loss blocks of an archived drill run,
  characterised by X-ray diffraction and swelling tests to infer the
  smectite-rich intervals the barrel never recovered
