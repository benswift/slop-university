title: Formalising an Informal Obligation
subtitle: >-
  A Single-Site Case Study of HR-Grade Escalation Governance Applied to a
  Small Firm's Coffee-Shout Roster
authors:
  - Casimir Beng
  - Dagny Okafor
  - Solveig Adeyemi
preset: paper
school: School of Continuous Improvement
date: 2026-08-25
publishedAt: "2026-08-25T10:01:47+10:00"
doi: 10.5555/slop.xg3vtx
summary: >-
  A paper from the School of Continuous Improvement reports a single-site
  case study in which a 42-person office's informal coffee-shout roster was
  replaced with a published roster, swipe-logged attendance, a graduated
  non-compliance memo ladder, and a quarterly Contribution-Equity Review.
  Shout-completion rates rose across every staff tier over a 14-week
  deployment, and a controlled ablation found the escalation ladder's
  manager-notification step made no measurable difference to resolution
  time.
topic: >-
  After a string of missed milk runs, a small firm's newly formed Kitchen
  Culture Working Group retires the office's informal coffee-shout roster
  and replaces it with a rostering system complete with attendance logging,
  non-compliance memos, and a quarterly contribution-equity review -- the
  same escalation machinery HR would apply to a performance issue, aimed at
  a carton of milk.
