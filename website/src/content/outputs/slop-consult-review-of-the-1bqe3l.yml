title: Review of the Booking Block for Shielded Recording Rooms
subtitle: >-
  A Department of Policy Settings consultation paper on whether the 90-minute
  block in which the University's shielded recording rooms are booked still
  fits the sessions recorded in them
authors: []
preset: consultation-paper
date: 2026-11-22
publishedAt: "2026-11-22T14:00:51+11:00"
doi: 10.5555/slop.1bqe3l
summary: >-
  A consultation paper from the Department of Policy Settings invites
  submissions on the booking block set by the Shared Recording Facilities
  Guidelines 2022, under which the University's four shielded recording rooms
  are booked in 90-minute blocks with no consecutive blocks to one group. Noting
  rising overruns among EEG and brain-computer interface groups, reports of
  block-chaining and three of the University's outputs, it weighs retaining the
  block against a 180-minute block and allocation by declared session, and
  records a preliminary view, conditional on consultation, that allocation by
  session is the option most worth exploring.
topic: >-
  review of the booking block for the University's shielded recording rooms,
  whose ninety-minute allocation is shorter than an EEG cap fitting,
  calibration and recording session together
