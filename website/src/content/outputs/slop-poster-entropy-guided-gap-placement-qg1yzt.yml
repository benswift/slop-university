summary: >-
  A research poster from the School of Underlying Conditions places the gaps in
  open cloze exercises for a pre-sessional English-for-geoscience course at the
  word a fine-tuned masked language model is most certain of in each sentence,
  and compares the result with fixed-ratio deletion over 2,400 items and 46
  learners. Guided placement cut items with more than one defensible answer
  from 38% to 9%, but put most of its gaps on colour, lithology and grain-size
  terms, while learners' free-writing errors clustered on contact descriptors
  and hedges.
topic: >-
  Entropy-guided gap placement for cloze exercises in an English-for-geoscience
  course: where a blank can be filled from its sentence, and where it cannot
