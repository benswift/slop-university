summary: >-
  A research poster from the School of Continuous Improvement seeds 2,904
  mutants into an immunology core facility's in-house cytokine-panel pipeline
  and finds its 318 tests kill 74.6% of the non-equivalent ones, with most
  survivors in the range-flagging and back-calculation code at the standard
  curve's quantification limits, which no fixture reached. Fourteen boundary
  fixtures raise the score to 0.870.
topic: >-
  mutation analysis of one immunology core facility's multiplex cytokine-panel
  flagging code, finding that the surviving mutants sit at the edges of the
  standard curve its test fixtures never reach
