title: The Sticker Doesn't Wait for a Person
subtitle: >-
  STAMP, an Eighteen-Hour-Threshold Markdown-Decision Scanner for Supermarket
  Night-Fill Shelves
authors:
  - Marek Solheim
  - Verity Marris
  - Hedvig Anyanwu
preset: paper
school: School of Emergent Priorities
date: 2026-09-17
publishedAt: "2026-09-17T08:59:03+10:00"
doi: 10.5555/slop.n7ws0g
summary: >-
  A paper from the School of Emergent Priorities describes STAMP, a handheld
  scanner that removes a supermarket night-fill worker's markdown judgement
  and replaces it with a fixed rule: mark an item down exactly eighteen hours
  before its use-by cutoff, at a category-specific rate set once at
  deployment. A fourteen-site, eleven-week field deployment finds the device
  holds every stock category within half an hour of the threshold, against a
  staff-discretion baseline that ranged as high as six hours, and the retail
  partner's regional office has since adopted the threshold as its binding
  markdown protocol.
topic: >-
  Eighteen hours before a product's use-by cutoff, STAMP takes over the
  markdown call from whichever night-fill staffer is rostered on at a
  supermarket
