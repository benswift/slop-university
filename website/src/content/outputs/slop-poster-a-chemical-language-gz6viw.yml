title: Eight Tokens for One Group
subtitle: >-
  Motif-Merged SMILES Vocabularies Shift Which Fluorinated Structures a
  Generative Model Proposes
authors:
  - Sunniva Balogun
  - Ylva Onyekwere
  - Eskil Nwabueze
preset: research-poster
school: School of Emergent Priorities
