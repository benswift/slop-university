title: As the Scaler Used It
subtitle: Construing Descriptive Letters in a Hand-Scaled Mid-Latitude Ionosonde Record to Recover Its Night-Time Spread-F Climatology
authors:
  - Anselm Threlkeld
  - Vigdis Emenike
preset: paper
school: School of Settled Matters
date: 2026-11-18
