doi: 10.5555/slop.evz6tg
summary: >-
  A paper from the School of Settled Matters and the School of Underlying
  Conditions re-reads the hourly tabulations of a closed mid-latitude
  ionosonde station, hand-scaled by four successive observers whose films do
  not survive. Fitting each scaler's use of the spread-F letters from the 6,904
  night hours two of them tabulated independently, and holding three scalers
  to the rules their notebooks state, it removes two steps at handovers and
  recovers a night-time occurrence that falls by 1.7 percentage points per MHz
  of the station's noon foF2 and is three times as frequent in winter as in
  summer.
topic: >-
  Construing the descriptive letters of a hand-scaled ionosonde archive:
  recovering a mid-latitude spread-F climatology from a closed station's
  successive scalers
