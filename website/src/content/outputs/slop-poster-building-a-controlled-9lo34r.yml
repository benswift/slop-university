doi: 10.5555/slop.9lo34r
summary: >-
  A research poster from the School of Continuous Improvement indexes the
  2,964 free-text answers given between 1985 and 2024 to a regional hearing
  clinic's tinnitus intake question, "in your own words, what does it sound
  like?", into a thesaurus of 17 preferred terms and 238 entry terms. The
  quality terms patients use hold across all forty years while the household
  comparisons they reach for turn over by decade, and two indexers working
  blind agree at 0.84 with the thesaurus against 0.62 without it.
topic: >-
  Building a controlled vocabulary from forty years of free-text tinnitus
  sound descriptions in a hearing clinic's intake archive, whose comparisons
  follow the household sounds of each decade
