summary: >-
  A research poster from the School of Continuous Improvement measures the
  resonance spectra of a flat microwave cavity machined at 1:4 scale in the
  outline of a standard-issue workstation, finding Poisson statistics for the
  plain 2:1 rectangle, intermediate statistics once an ergonomic notch is cut,
  and level repulsion from a round cable-grommet post only above 9 GHz, where
  the wavelength first resolves the hole.
