title: Drafted Down to Remote
subtitle: How legal-register matters lose their disclosure between the first draft and the signed financial report
authors:
  - Solveig Adeyemi
  - Kwame Lindqvist
  - Fenna Okoro
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-28
