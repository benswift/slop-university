doi: 10.5555/slop.2t5grp
summary: >-
  A research poster from the School of Continuous Improvement traces 143
  matters on eight not-for-profit entities' in-house legal registers through
  117 draft versions of their financial reports across three reporting cycles,
  coding each draft's probable, possible or remote treatment in the
  contingent-liabilities note. Thirty-six matters moved down a class before
  sign-off and five moved up; twenty-nine left the note entirely as possible
  became remote, twenty-seven of the downward moves fell in the last ten
  working days, and the register recorded a status change behind only four.
topic: >-
  Drafted down to remote: tracing matters on eight not-for-profit entities'
  legal registers through successive drafts of the contingent-liabilities
  note, where probability classifications drift from probable to possible to
  remote as the annual report nears sign-off
