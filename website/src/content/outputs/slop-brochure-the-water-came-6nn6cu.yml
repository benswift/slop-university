summary: >-
  A civic brochure from the School of Underlying Conditions invites river towns
  to bring the marks they keep of a flood, from the painted line on the hall
  wall to the honour board and the plaque, and to read them beside what the
  ground has kept: the flood-laid layer in a soil profile, the long record of a
  monitoring bore, and the core that never came up. It rests the invitation on
  six published University studies of how places mark and remember, cited by
  title and DOI.
