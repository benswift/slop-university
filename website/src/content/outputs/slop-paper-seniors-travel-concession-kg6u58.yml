title: First Named, Last Word
subtitle: >-
  Companion-Pass Designation in a State Seniors Travel-Concession Scheme
authors:
  - Petra Umbile
  - Casimir Beng
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-09-15
publishedAt: "2026-09-15T05:22:00+10:00"
doi: 10.5555/slop.kg6u58
summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement interviews 52 holders of a state seniors travel-concession card
  about how they named their linked pass's "regular companion," and reports
  the scheme's own rule that treats the resulting entry as fixed for the life
  of the card, revisable only through a medical review panel built to assess
  capacity rather than a change in circumstance.
topic: >-
  What does a companion-pass field on a renewal form actually fix in place
  once a cardholder writes a name into it, and does a scheme's fixed-for-life
  rule track anything about whether that name still matches who shows up?
