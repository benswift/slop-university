summary: >-
  A marketing poster for the School of Continuous Improvement shows a clubhouse
  roof of solar panels in a rain shower, a bucket and a long-handled brush set
  down under the eave, and presents the School's energy research through its
  published trial of quarterly panel washing across forty community sports
  clubs. It invites the passer-by to visit the University, and points to three
  further studies of photovoltaic systems in ordinary use.
