title: Sixty-One Messages About Training Bibs
subtitle: >-
  A Blameless Post-Incident Review of a Reply-All Storm on a District Netball
  Association Mailing List
authors:
  - Solveig Adeyemi
  - Osei Vandermeer
  - Bram Ntuli
  - Casimir Beng
preset: paper
school: School of Continuous Improvement
date: 2026-08-19
publishedAt: 2026-08-19T11:04:34+10:00
doi: 10.5555/slop.b97b9c
summary: >-
  A paper from the School of Continuous Improvement reconstructs a district
  netball association's 38-hour, 61-message reply-all storm from the complete
  inboxes of all 214 recipients, grades it on a severity matrix adapted from
  software operations, and convenes the storm's first blameless post-incident
  review. A near-critical self-exciting fit finds the appeals to stop replying
  were, per message, the storm's strongest accelerant, and the remediation the
  association adopts exchanges acute failure for chronic latency across six
  routine query types.
topic: >-
  a blameless, severity-classified post-incident review, in the full register
  of software-operations incident response, of a district netball
  association's 38-hour reply-all storm: sixty-one messages about training
  bibs reconstructed minute-by-minute from every participant's inbox,
  contributing factors solemnly tabled, and the volunteer on-call
  communications-commander roster and quarterly storm-drill calendar the
  association adopts in response
