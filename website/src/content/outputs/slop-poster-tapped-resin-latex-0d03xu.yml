summary: >-
  A research poster from the School of Emergent Priorities reads 148 reported
  decisions of one regional lands tribunal, from 1958 to 2021, on resin, latex,
  balsam and gum left in the cup when a tapping licence ends. Stimulated yield
  is held to be the outgoing tapper's industrial fruit in 81% of claims where
  the stimulant's purchase is receipted and 23% where it is not, close to the
  21% awarded for tapping by the wound alone, while expert evidence on what the
  stimulant does is relied on in the reasons of two decisions.
topic: >-
  tapped resin, latex and gum as fruit of the land or fruit of labour: how a
  lands tribunal divides exudate standing in the cup between landholder and
  outgoing tapper, and why stimulated yield goes to the tapper only when the
  stimulant's purchase is proven
