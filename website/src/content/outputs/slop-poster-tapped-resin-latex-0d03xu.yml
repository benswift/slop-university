title: Fruit of the Wound
subtitle: Stimulated exudate between landholder and tapper in a lands tribunal's reported decisions
authors:
  - Lindiwe Achterberg
  - Ylva Ogunbanjo
preset: research-poster
school: School of Emergent Priorities
