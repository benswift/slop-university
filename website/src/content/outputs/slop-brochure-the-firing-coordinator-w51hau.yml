summary: >-
  A Slop University brochure showcases the Kiln Index, a scientometric-style
  composite score built with a volunteer pottery studio's firing coordinator
  to allocate kiln time and show-shelf space by supervision hours,
  glaze-safety checks and shelf bookings, alongside five published studies of
  similar instruments built for community clubs and committees.
