summary: >-
  A marketing poster for the School of Continuous Improvement fronts Dr Solveig
  Adeyemi, whose work follows a report through submission, escalation, triage
  and closure, with the case her research keeps returning to --- the incident
  that is noticed but never entered on any register, and so is never available
  to be closed. Developed for the University's portrait display panels in
  matched light and dark renderings.
