title: A Good Drying Day
subtitle: Forecast, need and retrieval on the suburban washing line
authors:
  - Ylva Ogunbanjo
preset: thesis
school: School of Emergent Priorities
date: 2026-10-05
publishedAt: "2026-10-05T19:57:18+11:00"
doi: 10.5555/slop.ayp8dq
summary: >-
  A doctoral thesis from the School of Emergent Priorities records 181,746
  observations of 312 backyard washing lines across 104 weeks, and joins them
  to twelve weeks of load-by-load diaries from 58 households and to 214
  occasions on which rain began with washing on the line. On dry mornings
  pegging out did not move with the forecast, which was consulted before
  pegging for 412 of 1,864 loads, and the thesis argues that the basket decides,
  the forecast is an account given afterwards, and what protects the washing is
  the household's capacity to bring it in within a single armful. It reports
  the School's adoption of the Armful Rule, under which no unit may have in the
  field more commitments than its convenor can bring in alone, in one trip,
  within four minutes of first drops.
topic: >-
  A Good Drying Day: forecast, need and retrieval on the suburban washing line
  --- a doctoral study of how households decide to peg the washing out under a
  doubtful sky, from a two-year yard-by-yard census of lines, twelve weeks of
  laundry-day diaries and the timed dash to bring it all in when the rain
  arrives, finding that the basket decides and the forecast is consulted
  afterwards, and ending in the School capping what any unit may commit to at
  what its convenor can carry back in one armful
