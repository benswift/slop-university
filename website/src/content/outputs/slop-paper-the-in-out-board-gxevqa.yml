doi: 10.5555/slop.gxevqa
summary: >-
  A paper from the School of Emergent Priorities cross-tabulates a
  hand-flipped in/out board against an independent badge-tap log across four
  back-office teams sharing one open-plan floor, and reports a Facilities
  reconciliation rule that ties fixed-desk eligibility to how often the two
  records agree, rather than to how long anyone is independently logged at
  the desk.
topic: >-
  The in/out board by an open-plan office's entrance, and a quadrant
  framework crossing what it says against a badge-tap log, adopted to decide
  who keeps a fixed desk rather than reverting to hot-desking
