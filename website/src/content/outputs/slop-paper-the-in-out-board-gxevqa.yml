title: '"I Just Never Flip It Back"'
subtitle: Board-Badge Disagreement and the Right to a Fixed Desk
authors:
  - Tove Ilesanmi
  - Lindiwe Achterberg
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-09-25
