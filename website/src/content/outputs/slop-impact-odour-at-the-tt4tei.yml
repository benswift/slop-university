summary: >-
  The School of Continuous Improvement's 2021-2026 impact report reflects on
  five years as a guest in odour and emission control, following three strands
  of work at the edges of the abatement plant: a revised household odour diary
  that tells a quiet evening from an unreturned sheet, a readings-led cadence
  for reviewing biofilter beds, and a sitting protocol for the assessor panels
  whose noses are the field's instrument of record.
topic: >-
  odour at the fence line: five years of the School's work on how nuisance
  odour and site emissions are sampled, logged, reviewed and abated
