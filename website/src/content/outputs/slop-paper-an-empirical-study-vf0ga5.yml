title: Draw the Lactone Last
subtitle: Defect Reports, Workarounds and Lab Folklore in Nine Years of a Phytochemistry Group's Dereplication Pipeline
authors:
  - Solveig Adeyemi
  - Mirela Hanke
  - Petra Umbile
preset: paper
school: School of Continuous Improvement
date: 2026-11-03
publishedAt: "2026-11-03T20:00:16+11:00"
doi: 10.5555/slop.vf0ga5
summary: >-
  A paper from the School of Continuous Improvement and the School of Emergent
  Priorities reads nine years of the issue tracker, wiki and onboarding material
  behind one natural-products group's in-house pipeline for identifying
  sesquiterpene lactones in Asteraceae extracts, finding that 214 of 385 defect
  reports became fixes and that defects in the pipeline's chemistry were fixed
  at under half the rate of the rest. Once a workaround reached the group's
  wiki or handbook its report was fixed at about a fifth of the rate, and 46
  workarounds now circulate as rules with no trace of the defect behind them.
topic: >-
  an empirical study of the issue tracker of a phytochemistry group's in-house
  dereplication pipeline for Asteraceae sesquiterpene lactones: which defect
  reports become fixes, and which become lab folklore
