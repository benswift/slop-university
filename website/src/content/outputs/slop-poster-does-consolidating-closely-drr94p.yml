doi: 10.5555/slop.drr94p
summary: >-
  A research poster from the School of Continuous Improvement reports a
  stepped-wedge trial of bus-stop consolidation across 24 suburban routes,
  finding scheduled running time falls while door-to-door passenger travel
  time and interchange missed-connection rates hold flat across an
  eight-month rollout.
topic: >-
  Does consolidating closely spaced suburban bus stops into fewer,
  wider-spaced stops reduce scheduled travel time and missed connections
  along the route, or does the saved running time just get absorbed as extra
  dwell at the stops that remain?
