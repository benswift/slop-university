title: The Door Makes No Claim
subtitle: Concealment, Discovery and the Moral Judgement of the Tidy Before Visitors
authors:
  - Eivind Onwuka
  - Signy Okpara
  - Sten Okwuosa
preset: paper
school: School of Continuous Improvement
date: 2026-11-23
publishedAt: "2026-11-23T03:32:47+11:00"
doi: 10.5555/slop.9tgxxs
summary: >-
  A moral psychology paper from the School of Continuous Improvement reports
  three preregistered vignette experiments with 3,364 adults in which a host's
  mess, once discovered, made the host seem deceptive when it had been put into
  the cupboards of the rooms on show, but not when it had been shut behind a
  closed door. A curious guest who opened the door took the blame instead, and
  the host's remark on arrival moved both judgements, most of the effect
  running through whether the host was taken to have presented the house as it
  usually is.
topic: >-
  moral judgments of hosts who hide household mess before visitors: why a
  closed door is forgiven where a stuffed cupboard is judged deceptive
