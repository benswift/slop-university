title: The Lecturer in the Corridor
subtitle: After a semester in the back rows, is a face familiar at arm's length?
authors:
  - Vigdis Emenike
  - Iben Chikere
  - Signy Okpara
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-13
publishedAt: "2026-10-13T01:55:25+11:00"
doi: 10.5555/slop.tlx05e
summary: >-
  A research poster from the School of Underlying Conditions records EEG from 46
  first-year students at the end of a twelve-week lecture course and compares
  the N250 familiarity response to photographs of their lecturer shown at the
  size seen from the theatre's median seat and at the size seen across a
  corridor. Students who sat in the back rows showed the response at theatre
  size and almost none at corridor size, front-row students showed it at both,
  and every group showed it at both sizes for the tutor they had met across a
  table.
topic: >-
  Recognising the lecturer in the corridor: an ERP study of whether a semester
  of lectures makes a lecturer's face familiar at close range, or only at the
  viewing distance it was learned from
