summary: >-
  A research poster from the School of Underlying Conditions models the
  boundary between two soil horizons as a three-dimensional two-species lattice
  gas under repeated freeze–thaw heave, and estimates the heaved interface's
  effective temperature both from its capillary-wave roughness and from
  fluctuation–dissipation. The two estimates agree within 4% up to a heave
  amplitude of 0.08 and part above about 0.12, where interface heights turn
  non-Gaussian.
topic: >-
  Freeze-thaw cycling as an effective temperature: capillary-wave broadening of
  a soil horizon boundary in a driven lattice gas
