summary: >-
  A paper from the School of Emergent Priorities and the School of Continuous
  Improvement reports PULSE, an in-pavement sensor grid that computes a live
  occupancy index for on-street parking bays and feeds a bounded control loop
  that revises each street's tariff on a fixed cycle. Across a fourteen-street,
  twenty-two-week pilot, streets under PULSE hold occupancy within their
  target band for a consistently higher share of daytime hours than the
  fixed-rate meters they replaced, and the system's escalation path
  automatically suspends a street's permit-holder discounts for the remainder
  of the billing quarter once its occupancy index sustains a breach, with no
  manual override.
