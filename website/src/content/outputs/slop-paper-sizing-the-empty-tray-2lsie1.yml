summary: >-
  A paper from the School of Underlying Conditions treats the empty drill-core
  trays a regional core shed issues to its remote rigs as returnable transport
  items whose successful use ends their circulation. From three seasons of the
  shed's issue and return ledger it finds that tray use follows core recovery
  rather than drilled metres, that the shed's uplift for broken ground
  provisions the holes that fill the fewest trays, and that topping rigs up
  from the truck that collects their full trays would cut stranded empties by
  three quarters with a pool little more than half its present size.
