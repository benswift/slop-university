summary: >-
  A paper from the School of Continuous Improvement asks what a significance
  test can establish about the Marxian law of the falling rate of profit, a law
  stated as a tendency alongside a list of counteracting influences. In a linear
  model it shows that the usual trend regression with controls estimates a lower
  bound on the tendency, so that a test for the law is conservative at any
  sample size and no test against it is valid unless the list is complete and
  exactly measured. A simulation of 5,000 replications per cell puts the record
  needed for eighty per cent power, with four of six influences listed at
  reliability 0.5, at 305 years.
topic: >-
  testing a tendency: the identification and power of a statistical test of the
  Marxian law of the falling rate of profit when its counteracting influences
  are incompletely listed and imperfectly measured
