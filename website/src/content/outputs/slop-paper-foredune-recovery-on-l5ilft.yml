title: Closures That Outlast the Convenor
subtitle: >-
  Foredune Revegetation on Retired Beach Access Tracks and the Survival of
  Closures Across Changes of Dune-Care Leadership
authors:
  - Iben Chikere
  - Tove Ilesanmi
preset: paper
school: School of Emergent Priorities
date: 2026-10-31
publishedAt: "2026-10-31T10:30:22+11:00"
doi: 10.5555/slop.l5ilft
summary: >-
  A paper from the School of Emergent Priorities resurveys 118 beach access
  tracks closed by nine community dune-care groups over twelve years, finding
  that foredune cover on tracks whose closure held recovered towards undisturbed
  levels with a half-recovery time of 2.6 years, while tracks reopened along the
  way stayed about 14 points behind. Of 84 closures in place at a change of
  group convenor, 89% of those listed in the site register handed to the
  incoming convenor were intact two years later, against 55% of those left off
  it.
topic: >-
  Foredune recovery on beach access tracks closed by community dune-care groups,
  and which closures outlast a change of group convenor
