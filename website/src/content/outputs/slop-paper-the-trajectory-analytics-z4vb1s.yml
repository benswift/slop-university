title: The Corridor's Wall Clocks Now Show Their Median Time
subtitle: Design and Deployment of Concord, a Median-Consensus Synchroniser for Lecture-Theatre Wall Clocks
authors:
  - Anouk Mensah
  - Verity Marris
  - Marek Solheim
preset: paper
school: School of Emergent Priorities
date: 2026-10-02
publishedAt: "2026-10-02T12:01:33+10:00"
doi: 10.5555/slop.z4vb1s
summary: >-
  A paper from the School of Emergent Priorities describes Concord, a
  synchroniser that fits the twelve wall clocks along a nine-theatre teaching
  corridor with a stepper nudger, an optical hand reader and a radio mesh, so
  that each clock steps towards the median of its neighbours and the corridor
  takes its time from nothing outside itself. Over an eleven-week teaching
  period the spread between clocks settles at a few seconds and mean lecture
  overrun falls from 6.3 to 1.2 minutes, while recorded lecture duration is
  unchanged. The Trajectory Analytics Group adopts the corridor median as the
  time of record for lecture overrun.
topic: >-
  The Trajectory Analytics Group builds a median-consensus synchroniser for the
  wall clocks along a lecture-theatre corridor, nudging each clock towards the
  corridor's agreed time, and rules the agreed time the only one against which a
  lecture can be said to have overrun
