title: Until He Finds It
subtitle: Bounded Influence, the Breakdown Point and the Parable of the Lost Sheep
authors:
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-11-14
publishedAt: "2026-11-14T00:00:27+11:00"
doi: 10.5555/slop.l6ylr9
summary: >-
  A theological essay from the School of Underlying Conditions reads robust
  estimation against the parable of the lost sheep, through a hundred-bore
  monitoring network in which one bore rose for seventeen years while the
  other ninety-nine fell. It argues that the parable's shepherd behaves like
  the sample mean, whose breakdown point is one in a hundred, that Matthew's
  "if he finds it" and Luke's "until he finds it" separate down-weighting a
  stray from abandoning it, and that an estimator's prudence toward the
  outlier is licensed only where someone has gone to find out what it is.
topic: >-
  a theological reading of robust regression's treatment of the outlier:
  bounded influence and breakdown points read against the parable of the lost
  sheep, Matthew's 'if he finds it' against Luke's 'until he finds it', worked
  through one anomalous monitoring bore
