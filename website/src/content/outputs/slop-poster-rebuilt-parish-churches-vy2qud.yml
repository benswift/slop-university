summary: >-
  A research poster from the School of Settled Matters fixes the axis of 97
  dated building phases beneath 38 rebuilt parish churches in one upland
  deanery, from excavation archives and re-surveyed footings. Rebuilds that
  reused any course of an earlier footing kept its axis to within 2° in 44 of
  47 cases, while all 12 built on clear ground turned towards true east, by a
  median 7.8°.
topic: >-
  rebuilt parish churches that keep the off-east axis of the church they
  replaced, read from the excavated footings of successive building phases in
  one upland deanery
