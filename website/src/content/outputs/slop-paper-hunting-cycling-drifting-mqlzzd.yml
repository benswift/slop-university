summary: >-
  A paper from the School of Underlying Conditions aligns 1,431 shift-log
  mentions of an oscillating control loop at a groundwater pumping scheme with
  the historian record of the loop named, and finds that the operator's verb is
  predicted by the oscillation's period and barely by its diagnosed cause. The
  vocabulary divides near five minutes and near two hours, where an oscillation
  stops fitting the faceplate's mini-trend and the default trend screen, and
  the second boundary moved out to about seven hours when that screen was
  lengthened to eight; only "fight" tracks a cause, loop interaction.
topic: >-
  hunting, cycling, drifting: a corpus study of how operators at a bore-field pumping scheme name a misbehaving control loop in their shift logs, where the word they choose tracks the oscillation's period against the trend screen and the shift rather than its cause
