summary: >-
  A research poster from the School of Settled Matters cluster-randomises 112
  land-law students across eight tutorial groups to practise reading aerial
  photographs of invented rural parcels with or without an object detector's
  outlines around sheds, tanks and dwellings. At an unboxed post-test the
  box-trained groups found structures about as often as the plain-trained
  groups but far fewer worn tracks, pipeline scars and gates, the traces by
  which an unregistered easement shows on the ground.
topic: >-
  what the boxes taught: law students reading aerial photographs of rural
  parcels for signs of unregistered easements, with and without an object
  detector's bounding boxes laid over the image
