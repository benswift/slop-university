title: Blank Means Yes
subtitle: >-
  A Competing-Risks Analysis of Media-Consent Status Across Eleven Annual
  Review Cycles at 214 Franchised Retail Sites
authors:
  - Sten Okwuosa
  - Marek Solheim
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
date: 2026-08-16
publishedAt: 2026-08-16T06:02:31+10:00
doi: 10.5555/slop.68wiyy
summary: >-
  A paper from the School of Continuous Improvement assembles every
  media-consent record held by one franchised bakery network across eleven
  annual review cycles (214 sites, 9,418 staff records, 41,206 record-years)
  and treats a lodged refusal as a time-to-event problem with separation from
  the network as a competing risk. Of 1,347 refusals lodged at onboarding, the
  cumulative incidence of conversion to recorded consent reaches 54.1 per cent
  by the third review cycle against 23.1 per cent for separation, with a median
  of 1.4 cycles among those that convert, while transitions in the opposite
  direction number zero. Over the same period the network's reported
  consent-currency measure rose from 71.3 to 99.1 per cent as the share of staff
  who had actively signed within the current cycle fell to 28.6 per cent.
topic: >-
  the laminated meet-our-team photo board by the counter of a suburban bakery
  franchise, where each face is there because a media-consent box on an
  onboarding form was left blank --- the franchisor's brand-standards audit
  reports current media consents held as a compliance measure, the annual
  renewal carries last year's answer forward and gives no field for withdrawing
  one, so a lodged refusal survives a median of about one review cycle before it
  lapses into consent and the consent-currency indicator can only ever rise; a
  competing-risks survival analysis of consent status across onboarding cohorts
