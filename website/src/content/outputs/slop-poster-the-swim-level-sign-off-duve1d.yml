title: Six Labels, Three Bands
subtitle: >-
  Inter-Assessor Agreement in a Six-Stage Learn-to-Swim Framework Across 9
  Centres and 1,248 Blind Ratings
authors:
  - Lindiwe Achterberg
  - Ronja Oyelaran
  - Petra Umbile
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-31
publishedAt: 2026-07-31T11:00:33+10:00
doi: 10.5555/slop.duve1d
summary: >-
  A research poster from the School of Emergent Priorities has 41 swimming
  teachers blind-rate 312 recorded end-of-term assessments across nine
  centres of a metropolitan leisure-centre operator, collecting 1,248
  ratings against the operator's six published learn-to-swim stages.
  Agreement is fair across the six stages and substantial once the scheme is
  read as three pre-registered bands, with agreement falling to 41.3% at
  Stage 3 and holding above 79% at the two endpoints; 62% of the stage
  advancements recorded in the window were single-stage moves inside a band.
topic: >-
  the swim-level sign-off a teacher ticks at the end of term, and a
  leisure-centre chain's progression rate that counts sign-offs while the
  same swimmers get graded differently by different teachers
