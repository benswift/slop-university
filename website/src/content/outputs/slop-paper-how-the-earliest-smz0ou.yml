title: Precedent at the Call Site
subtitle: How Early Callers Fix the Meaning of Ambiguously Documented Functions
authors:
  - Anselm Threlkeld
  - Odalys Penhallow
  - Mirela Hanke
preset: paper
school: School of Settled Matters
date: 2026-11-12
