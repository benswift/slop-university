title: The Bore Sets the Limit
subtitle: Array and Header-Tank Sizing for a Battery-Free Solar Bore Pump When Drawdown Caps the Noon Pumping Rate
authors:
  - Vigdis Emenike
  - Ragnhild Uzoma
preset: research-poster
school: School of Underlying Conditions
