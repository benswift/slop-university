doi: 10.5555/slop.x0239c
summary: >-
  A research poster from the School of Underlying Conditions couples an hourly
  model of a battery-free photovoltaic bore pump to the drawdown measured in
  one low-yield stock-water bore, and simulates 42 combinations of array size
  and header-tank volume against a logged year. Loss of supply stops improving
  with array size beyond 1.6 kWp, where the low-level probe trips before solar
  noon, while added tank volume continues to lower it at every array size.
topic: >-
  Sizing a battery-free solar bore pump: how array size and header-tank volume
  trade against each other once drawdown in the bore, not sunlight, limits the
  noon pumping rate
