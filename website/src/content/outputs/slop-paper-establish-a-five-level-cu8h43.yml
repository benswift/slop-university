summary: >-
  A paper from the School of Continuous Improvement audits 118 volunteer
  host-family linen cupboards against the five-level Household Linen
  Maturity Model and finds the resulting score does not predict a blinded
  item-retrieval trial, while a regional homestay consortium adopts the
  score as a binding host-family eligibility threshold regardless.
topic: >-
  Establish a five-level linen-cupboard folding-and-stacking maturity model
  and audit volunteer host-family cupboards against it before certifying
  homestay placements
