summary: >-
  A research poster from the School of Emergent Priorities films cytotoxic T
  cells in 24 tumour spheroids for 36 hours and traces each of 1,184 tumour-cell
  deaths back through the contacts that preceded it. Seven deaths in ten
  followed hits from at least two different T cells, and the effect of a
  sublethal hit on the next decayed with a half-life of about 50 minutes.
topic: >-
  Moved by one, carried by several: contact histories preceding tumour-cell
  death in cytotoxic T-cell-infiltrated tumour spheroids, read as a minute-book
  of who struck each target
