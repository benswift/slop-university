summary: >-
  A case-for-support brochure from the School of Emergent Priorities profiles
  PLOT, the Trajectory Analytics Group's Perimeter Line Overrun Tracker, which
  resurveys allotment plots against their original stake lines and reports the
  result as a distribution of boundary creep. Associations enrolled in the
  program now gate a plot's automatic renewal on the resurvey's threshold, and
  the brochure sets the instrument beside seven other published findings on
  the measurement work already reaching community life beyond campus.
