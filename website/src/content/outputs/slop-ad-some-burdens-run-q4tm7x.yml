summary: >-
  A marketing poster for the School of Settled Matters compresses the published
  finding of "What the Lattice Keeps", that a structurally related impurity
  rides through every recrystallisation of a model aryl amide as a solid
  solution in its Form I lattice and is shed only through a second polymorph,
  into a single signage headline, developed for campus screens and bus-stop
  panels in matched daylight and evening versions.
