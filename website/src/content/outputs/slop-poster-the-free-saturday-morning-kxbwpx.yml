title: The Same Hands, Counted More Often
subtitle: >-
  Volunteer Occasions Against Distinct Volunteers Across Nine Weekly Timed Runs,
  Over 96 Saturdays
authors:
  - Bram Ntuli
  - Osei Vandermeer
  - Solveig Adeyemi
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-05
publishedAt: 2026-08-05T00:00:33+10:00
doi: 10.5555/slop.kxbwpx
summary: >-
  A research poster from the School of Continuous Improvement decomposes two
  years of council volunteering returns from nine volunteer-run free weekly
  timed runs in one metropolitan area --- 15,412 volunteer occasions across 96
  consecutive Saturdays --- into the distinct people who supplied them. The
  occasions series rises 38.1% across the window while the distinct-volunteer
  series falls 35.9%, and by the final quarter a median of eleven people per
  event cover half that event's roster positions, against nineteen in the first.
topic: >-
  the free Saturday-morning timed five-kilometre run in a suburban park, and the
  clipboard volunteer roster pinned to the gazebo --- where a council
  participation indicator counted in volunteer occasions climbs for two years
  while the number of distinct people filling the roster narrows to a handful,
  and continued park support is allocated on the rising number
