title: Carried, Not Closed
subtitle:
  Five Years of the School of Continuous Improvement's Work on the Action Item
  That Survives Every Meeting It Is Raised At
authors:
  - Solveig Adeyemi
  - Bram Ntuli
  - Thandiwe Solberg
  - Ingeborg Nwachukwu
preset: impact-report
school: School of Continuous Improvement
date: 2026-07-30
publishedAt: 2026-07-30T13:00:33+10:00
doi: 10.5555/slop.c0u7bk
summary:
  The School of Continuous Improvement's Impact Report 2021-2026 reconstructs
  38,140 action items from 212 collaborator registers to define an item's carry
  count as a property of the item rather than of the meeting, finding open
  registers ageing while their overall size held steady and a shortened review
  cadence raising recorded actions per item without raising closures. It closes
  on a lapse protocol, distinct from completion and requiring a named
  authoriser and a published standing list, trialled across four collaborator
  sectors.
topic:
  the action item carried forward meeting after meeting, from a suburban sports
  club's minutes to a workplace improvement register, and the update count that
  records each carry-forward as progress
pages: 14
version: "1.0"
