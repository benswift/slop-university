summary: >-
  A prospectus brochure for the Master of Priority Studies takes a single
  state-border inspection station as its standing civic case. The
  produce-declaration bin is the subject: it receives the drop, clears the
  boot, and releases the vehicle before anyone looks. On the strength of that
  finding the University binds civic placements to the station's live
  declaration register, with no ordinary override, and schedules field visits
  from the bin rather than from who is standing at the boot.
topic: >-
