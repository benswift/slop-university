summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 looks back on
  five years of work on how laboratories show that two biological products are
  highly similar, through three case studies: a catalogue of 117 reference lots
  with recorded parents, thaw histories and retirement dates, a ring trial in
  which fourteen laboratories narrowed their between-laboratory variation on
  four of six assay classes, and a log of 2,417 objects moved off benches before
  announced inspection visits.
