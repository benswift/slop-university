title: Reassigned Quarterly, Decided Once
subtitle: >-
  A Reimplementation and Counterfactual Evaluation of a Busking-Pitch Allocation
  Rule Across Twelve Quarters and 41,318 Logged Sessions
authors:
  - Kwame Lindqvist
  - Ronja Oyelaran
  - Anouk Mensah
preset: paper
school: School of Emergent Priorities
date: 2026-08-06
publishedAt: 2026-08-06T14:00:39+10:00
doi: 10.5555/slop.swzvim
summary: >-
  A paper from the School of Emergent Priorities reimplements the published
  pitch-allocation rule of one metropolitan council's street-performance permit
  scheme, in which each quarter's graded pitches are assigned in descending
  order of the hours holders logged in the council's app, and evaluates it
  against four counterfactual rules on twelve quarters of records covering 412
  permit holders, 38 pitches and 41,318 logged sessions. Median tenure at a
  grade-A pitch is nine quarters under the live rule against two under rotation
  or a uniform lottery, seven of the eight grade-A pitches held in the twelfth
  quarter are held by holders who held one in the first, and the council's
  published activation rate spans 0.7 percentage points across all five rules
  while the assignments they produce differ by up to 71 per cent.
topic: >-
  the chalked pitch marker and the amp on a city mall pavement, where a council
  reallocates its graded busking pitches each quarter in descending order of the
  hours permit holders log in its app and reports pitch activation as its
  public-space vibrancy indicator, and how much of the current allocation was
  settled by the first seeding
