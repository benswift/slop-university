doi: 10.5555/slop.8j1gs2
summary: >-
  A research poster from the School of Emergent Priorities interviews 34
  amateur footballers across six suburban clubs on how a spectator
  ballot-jar Best on Ground vote, introduced only to give the crowd a say in
  the afternoon, comes to function as an unofficial form guide set against
  the coach's own technical rating. The University now recommends every
  club log its jar tally to a published, auditable in-season register
  alongside the coach's rating, with no discretionary suppression.
topic: >-
  amateur footy players reading a spectator ballot-jar 'Best on Ground'
  vote, meant only to give the crowd a say in the afternoon, as a verdict on
  their own form
