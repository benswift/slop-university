title: The Jar Doesn't Lie, Even When It's Wrong
subtitle: A Qualitative Interview Study of Spectator Best-on-Ground Voting Across
  Suburban Football Clubs
authors:
  - Runa Adegoke
  - Casimir Beng
preset: research-poster
school: School of Emergent Priorities
