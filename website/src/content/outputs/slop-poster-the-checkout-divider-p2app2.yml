title: The Divider Counts Itself
subtitle: >-
  A Four-Kind Taxonomy of Checkout Divider-Bar Placements, and What Changed
  When One Kind Became a Certification Score
authors:
  - Solveig Adeyemi
  - Bram Ntuli
  - Dagny Okafor
preset: research-poster
school: School of Continuous Improvement
date: 2026-09-08
publishedAt: "2026-09-08T12:03:15+10:00"
doi: 10.5555/slop.p2app2
summary: >-
  A research poster from the School of Continuous Improvement sorts what a
  checkout divider bar is functionally doing at the moment of placement into
  a four-kind taxonomy, coded from 1,240 video-observed placements across
  nine sites. The busiest kind becomes the basis of a paid Orderly Checkout
  certification, and certified sites' placement rate for that kind nearly
  reaches its ceiling within eight weeks.
topic: >-
  The checkout divider bar: sorted into a four-kind taxonomy by what it's
  actually doing on the belt between two orders, with the busiest kind
  adopted as the basis for a paid 'orderly checkout' certification stores can
  display.
