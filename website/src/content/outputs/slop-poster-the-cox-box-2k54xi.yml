summary: >-
  A research poster from the School of Emergent Priorities specifies a
  seated-switch cox box built across 186 water sessions at eleven suburban
  clubs, and binds every School seminar to the lectern housing: floor
  contributions are unamplified and not minuted, a standing chair ends the
  session, and rooms without a working seat-switch do not host.
