summary: >-
  A case-for-support brochure from the School of Underlying Conditions invites
  partners to underwrite the extension of its soil survey, core laboratory and
  groundwater fieldwork upward into the daisy family and the bitter
  sesquiterpenes its members make. It presents the plant as the uppermost
  layer of a described profile and rests its appeal on seven published outputs
  cited by title and DOI.
