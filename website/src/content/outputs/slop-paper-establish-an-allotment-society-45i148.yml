title: Towards a Maturity Model for Allotment Waiting Lists
subtitle: >-
  Five Named Levels From a Noticeboard Sign-Up Sheet to a Continuously
  Verified Register
authors:
  - Hedvig Anyanwu
  - Kwame Lindqvist
  - Dagny Okafor
preset: paper
school: School of Emergent Priorities
date: 2026-09-16
publishedAt: "2026-09-16T22:37:48+10:00"
doi: 10.5555/slop.45i148
summary: >-
  A paper from the School of Emergent Priorities develops a five-level
  maturity model for allotment-society waiting-list administration and
  applies it to 124 societies affiliated with the region's allotments
  federation. Attained level shows no association with how quickly a
  forfeited plot is actually recovered, though the federation now gates
  new-plot allocation priority on the score regardless.
topic: >-
  Establish an allotment-society plot-waiting-list maturity model, scored on
  five named levels from an unlogged noticeboard sign-up sheet to a
  continuously verified digital register, with regional plot-allocation
  priority gated at the third level.
