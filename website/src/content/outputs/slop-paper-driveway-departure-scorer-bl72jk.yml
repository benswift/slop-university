title: Toast in the cup-holder, bay fourteen, eight-twenty
subtitle: >-
  a case study of the driveway-departure scorer on one primary-school run
authors:
  - Ylva Onyekwere
  - Runa Adegoke
  - Iben Chikere
  - Kwame Lindqvist
preset: paper
school: School of Emergent Priorities
date: 2026-10-07
publishedAt: "2026-10-07T04:00:56+11:00"
doi: 10.5555/slop.bl72jk
summary: >-
  A paper from the School of Emergent Priorities reports a single-site case of
  a driveway-departure scorer at one suburban primary school. Once the office
  adopted the ping as the sole late-arrival mark, breakfast-in-vehicle rose
  from 10.9% to 46.6% of observed drop-offs, mean car-park dwell more than
  doubled, and the office bound next year's late procedure to the timestamp
  with the visual late desk closed and no override at the gate.
topic: >-
  The driveway-departure scorer at one primary school relocates breakfast from
  the kitchen to the car park, and the office adopts the ping as the sole
  late-arrival mark.
