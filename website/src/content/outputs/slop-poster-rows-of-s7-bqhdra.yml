title: Where the Band Has Been
subtitle: A Coset Census of 214 Plain Bob Triples Quarter Peals in One Tower's Book, 1987–2025
authors:
  - Vigdis Emenike
  - Bram Ntuli
  - Halvard Nnamani
preset: research-poster
school: School of Underlying Conditions
date: 2026-11-24
