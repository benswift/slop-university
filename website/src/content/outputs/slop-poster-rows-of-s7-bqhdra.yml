doi: 10.5555/slop.bqhdra
summary: >-
  A research poster from the School of Underlying Conditions expands the
  calling of every Plain Bob Triples quarter peal in one tower's book since
  1987 into its rows of the symmetric group on seven bells, and finds that 214
  quarters on eleven compositions have reached 2,968 of the 5,040 rows, 236 of
  the 720 lead heads and 71 of the 120 courses, with coverage thinning at both
  ends of the Coxeter length order and new rows entering only with a new
  composition.
topic: >-
  Rows of S7 never rung: a coset census of forty years of one tower's Plain
  Bob Triples quarter peals, asking how far a fixed repertoire of compositions
  carries a band through the symmetric group
