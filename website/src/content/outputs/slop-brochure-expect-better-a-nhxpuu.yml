summary: >-
  A civic brochure sets out the University's public work on how expectation and
  reassurance shape the small discomforts of an ordinary day, in three everyday
  settings (the waiting room, the kind word, and the plaster on the knee)
  across the School of Continuous Improvement, the School of Emergent
  Priorities and the School of Underlying Conditions. It invites those who run
  and use shared spaces to take part, and rests the work on six published
  outputs cited by title and DOI.
