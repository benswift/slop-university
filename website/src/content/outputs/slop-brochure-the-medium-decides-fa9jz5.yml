summary: >-
  A research showcase from the School of Emergent Priorities presents the
  University's work on media technologies as a study of decisions no one
  experiences as decisions: the broadcast that reorganises the audience it
  reaches, the group-chat setting that hides a message before it is read, and
  the kitchen speaker whose answers harden into household precedent. Seven
  published outputs from four Schools, each cited by title and DOI, carry the
  account.
