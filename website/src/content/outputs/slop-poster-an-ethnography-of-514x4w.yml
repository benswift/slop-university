title: The Class You Write When You'd Rather Not Be Asked
subtitle: Deference and the membership functions of a soil-survey team's drainage classes
authors:
  - Ragnhild Uzoma
  - Anneke Tolan
  - Bram Ntuli
preset: research-poster
school: School of Underlying Conditions
