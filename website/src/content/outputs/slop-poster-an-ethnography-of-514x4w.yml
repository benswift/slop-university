doi: 10.5555/slop.514x4w
summary: >-
  A research poster from the School of Underlying Conditions reports fourteen
  months of fieldwork with a nine-member regional soil-survey unit, including 61
  field days and four recorded workshops at which the team drew fuzzy
  membership functions for its drainage classes. With the senior surveyor
  present, the team gave imperfectly drained full membership across 45 cm of
  depth to mottling and, without, across 15 cm, and juniors described it as the
  class written when a call might be queried.
topic: >-
  An ethnography of a soil-survey team's workshops to draw fuzzy membership
  functions for its drainage classes finds imperfectly drained drawn widest
  when the senior surveyor is in the room, the class a junior writes when they
  would rather not be asked, so the curves record the team's working deference
  as well as the soil
