summary: >-
  A research poster from the School of Underlying Conditions applies the
  methods of musical sketch study to eleven bound computing books from an
  unnamed instrument workshop, ordering 386 leaves of hand ray-trace tables
  and recovering nine successive states of one six-element microscope
  objective. Read as a temperament, the early states leave the whole residual
  aberration at the edge of the field and the later ones spread it across
  every zone; the surviving objective matches the eighth state, not the last.
topic: >-
  Tempering the field: a musicological sketch study of an unnamed workshop's
  computing books for a six-element microscope objective, reading the
  designer's successive corrections as a temperament that spreads the residual
  aberration from a wolf at the field's edge across every zone
