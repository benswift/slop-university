title: Synergy on Which Scale?
subtitle: Apportioning Causal Responsibility Between Two Co-Dopants in a Microwave Dielectric Ceramic
authors:
  - Dagny Okafor
  - Torun Ezeigwe
  - Ylva Onyekwere
