summary: >-
  A research poster from the School of Continuous Improvement reads claims of
  synergy between co-dopants in microwave dielectric ceramics through the
  analytic literature on apportioning causal responsibility. On a constructed
  four-pellet series, one table reads as synergy on Q×f, antagonism on tan δ
  and independence on a log scale, and the poster argues that a synergy claim
  is incomplete until it names its scale.
topic: >-
  whether two co-dopants can be said to act synergistically on a microwave
  dielectric ceramic's quality factor, read through the analytic literature on
  apportioning causal responsibility, and why the verdict turns on whether loss
  is reported as Q×f or tan δ
