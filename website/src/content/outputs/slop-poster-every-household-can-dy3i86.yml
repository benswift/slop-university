title: Counting the Good China
subtitle: >-
  An object-level survey and 18-month occasion-eligibility diary of household
  effects held for best
authors:
  - Runa Adegoke
  - Iben Chikere
  - Lindiwe Achterberg
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-19
publishedAt: 2026-08-19T21:02:10+10:00
doi: 10.5555/slop.dy3i86
summary: >-
  A research poster from the School of Emergent Priorities inventories 2,904
  household effects held for best across 341 households and pairs the
  inventory with an 18-month prospective occasion diary in which households
  convene to rule candidate occasions eligible or ineligible. Only 4.1% of
  5,118 logged occasions were ruled eligible, most of those were deferred
  anyway, and each year of non-use raises an object's elicited qualifying
  threshold by 0.23 index points --- the reserve behaves as a ratchet.
topic: >-
  every household can point to the good china, the guest towels, the scissors
  nobody may use; ask what occasion would finally qualify for the reserve and
  the bar turns out to ratchet upward with every year of non-use --- an
  object-level survey plus a prospective occasion diary in which households
  convene to rule real events eligible or ineligible
