title: What Does ‘Bug Fixes and Improvements’ Mean?
subtitle: >-
  A Seven-Kind Taxonomy of Release-Note Lines in Nine Swimming Clubs’ Booking
  Apps, and the Notice Period Each Kind Now Carries
authors:
  - Ingrid Vasseur
  - Lindiwe Achterberg
  - Petra Umbile
preset: research-poster
school: School of Emergent Priorities
date: 2026-10-09
publishedAt: "2026-10-09T09:00:55+11:00"
doi: 10.5555/slop.ivsc1y
summary: >-
  A research poster from the School of Emergent Priorities sorts 1,386
  release-note lines from nine swimming clubs’ booking apps into seven kinds by
  what changed for the member, and finds the kind that says nothing visible
  changed rises from 29% of lines to 61% in the fortnight before term
  enrolment opens. The School adopts a notice period for each kind, and treats
  a nothing-visible line in that fortnight as a removal, with no override.
topic: >-
  Seven kinds of line in a phone app's store release notes ('bug fixes and
  performance improvements' and its relatives), sorted by what actually changed
  for the user, with a published cooling interval per kind before a community
  swimming club's booking app may push the update
