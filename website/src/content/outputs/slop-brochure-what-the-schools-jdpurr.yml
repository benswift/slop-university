summary: >-
  A research showcase led from the School of Underlying Conditions presents a
  district's schooling as the ground its working life rests on, in three
  features on learning a trade from the workshop bench to the labour-hire
  counter, the school-leaving year as an event the whole community takes part
  in, and the copybooks, score folders and trade ledgers a place keeps. It rests
  its case on seven published outputs from all three Schools, cited by title
  and DOI.
