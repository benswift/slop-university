summary: "Dr Renke Sabel, Senior Lecturer and Convenor of the Indicator Commons, speaks
  for most of this short profile, which traces his interest in why an institution's
  indicators so seldom retire to his years in public-sector performance frameworks.
  Three of his Indicator Stewardship Seed Fund grants supply its examples: a dog park's
  incident board, a community hall's key register and a laboratory's calibration
  weights, each given a keeper and a successor. It also sets out his research indicators,
  led by a grant record no other researcher at the University matches."
topic: "a promo profile of Dr Renke Sabel, who holds more grants than any other researcher
  at the University, in his own voice: a convenor from public-sector performance frameworks
  who asks why so few indicators are ever retired, and whose grants give each measure
  a keeper and a successor"
