doi: 10.5555/slop.wshmsw
summary: >-
  A paper from the School of Underlying Conditions and the School of Emergent
  Priorities follows 412 part-supplied prescriptions through three community
  pharmacies for fourteen weeks, from the day each owing is opened to the day
  it ends. The completing stock arrives after a median of one working day and
  the made-up balance then waits a median of five more; each pharmacy writes
  its owing slip to the same unspoken form, and none has anyone whose job it
  is to end an owing nobody comes for.
topic: >-
  following the owing slip through three community dispensaries: what happens
  to the balance of a part-supplied prescription between the day the shelf
  runs short and the day the patient comes back
