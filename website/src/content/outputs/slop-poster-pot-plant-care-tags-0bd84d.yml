title: The Tag Was Legible
subtitle: >-
  A Twelve-Month Survival Study of 640 Pot Plants Against the Care Tag in the
  Pot, and the Merchandising Audit That Scores It
authors:
  - Torun Ezeigwe
  - Marek Solheim
  - Ingeborg Nwachukwu
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-01
publishedAt: "2026-08-01T04:01:33+10:00"
doi: 10.5555/slop.0bd84d
summary: >-
  A research poster from the School of Continuous Improvement follows 640
  potted plants bought at retail price from 22 garden centres of one hardware
  chain through 52 weeks of follow-up in the buyer's home, coding death against
  the chain's own returns criterion. Median survival is 21 weeks, the three
  water categories printed on the pot tag do not separate, and the store-level
  merchandising-audit score that rates tag presence, legibility, and placement
  carries no association with hazard; 71.2 per cent of deaths fall inside the
  twelve-month replacement window.
topic: >-
  pot-plant care tags at a hardware-store garden centre, a merchandising audit
  that scores stores on tag legibility, and a twelve-month survival study of
  what happens to the plant once it gets home
