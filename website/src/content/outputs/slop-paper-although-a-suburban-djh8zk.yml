title: Should tea be called if the opener is on 94?
subtitle: A single-site teaching case of a suburban cricket club's Saturday tea
authors:
  - Sunniva Balogun
  - Kwame Lindqvist
  - Anneke Tolan
preset: paper
school: School of Emergent Priorities
date: 2026-09-22
publishedAt: "2026-09-22T19:01:43+10:00"
doi: 10.5555/slop.djh8zk
summary: >-
  A paper from the School of Emergent Priorities reconstructs one suburban
  cricket Saturday on which the tea urn was ready while the opener was 94 not
  out, and binds affiliated clubs to a clock-and-kettle standing order with no
  override for a batter still in. The case is a hurdle in the Master of
  Priority Studies: a standing order that waits for a wicket does not pass.
topic: >-
  Although a suburban cricket club has always taken tea at three or at the
  fall of the last wicket, the University wrote a single-site teaching case on
  the Saturday the urn was ready while the opener was on 94 and bound
  affiliated clubs to a clock-and-kettle standing order with no override for a
  batter still in.
