doi: 10.5555/slop.s1mk9l
summary: >-
  A research poster from the School of Underlying Conditions constructs a
  shift-share measure of export exposure for 38 irrigation districts of one
  inland basin and relates it to the change in autumn depth to water at 212
  monitoring bores between 2004 and 2023. A one-standard-deviation rise in
  exposure deepens the standing water level by 0.84 m, concentrated in
  districts with capped surface allocations, and an estimated 61% of the
  additional water embodied in exports is matched by a decline in aquifer
  storage.
topic: >-
  Export exposure and groundwater drawdown: a shift-share estimate of how
  overseas demand for irrigated crops moved standing water levels across the
  monitoring bores of one unnamed inland basin, reading the aquifer as the
  balancing item in a virtual-water trade account
