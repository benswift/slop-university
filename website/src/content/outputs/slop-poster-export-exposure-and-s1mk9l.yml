title: The Aquifer as Balancing Item
subtitle: Export Exposure and Standing Water Levels across 212 Bores of an Inland Irrigation Basin
authors:
  - Vigdis Emenike
  - Brynjar Obiora
  - Kwame Lindqvist
preset: research-poster
school: School of Underlying Conditions
