summary: >-
  A research poster from the School of Continuous Improvement follows one
  primary school's bike shed across a nine-week term, tracing how a
  volunteer coordinator's hand-drawn bay-claim tags harden into fixed family
  assignments, and how the case now anchors a Capability Sprints publication
  requirement for other enrolled sites.
topic: >-
  a primary school bike shed's hand-drawn bay-claim tag system hardening
