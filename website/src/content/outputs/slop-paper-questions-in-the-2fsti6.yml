title: Answered in the Margin
subtitle: >-
  Teacher Ego Development, the Form of Written Comments, and What Year 10
  Students Revise
authors:
  - Ragnhild Uzoma
  - Ingeborg Nwachukwu
  - Anselm Threlkeld
preset: paper
school: School of Underlying Conditions
date: 2026-11-12
publishedAt: "2026-11-12T11:32:18+11:00"
doi: 10.5555/slop.2fsti6
summary: >-
  A paper from the Schools of Underlying Conditions, Continuous Improvement
  and Settled Matters codes the 9,436 written comments that 46 secondary
  English teachers left on 1,031 Year 10 essay drafts, finding that teachers
  at later stages of ego development wrote more questions whose answer they
  could not have known, and that students acted on those questions least
  often, most deeply when they did, and more often the further their own ego
  development had run. A fifth of the genuine questions left out of revision
  had been answered instead, in pencil in the margin, to the teacher.
topic: >-
  Questions in the margin: whether secondary English teachers' ego development
  predicts how often they write questions rather than corrections on student
  drafts, and which comments Year 10 students act on in revision
