title: CUT
subtitle: >-
  A Collection-Uptake Threshold for a Single Butcher Shop's Weekend Roast
  Pre-Order Line
authors:
  - Solveig Adeyemi
  - Casimir Beng
  - Renke Sabel
preset: paper
school: School of Continuous Improvement
date: 2026-09-16
publishedAt: "2026-09-16T17:37:52+10:00"
doi: 10.5555/slop.g69pqw
summary: >-
  A paper from the School of Continuous Improvement follows a single
  independent butcher shop's Collection-Uptake Threshold across a
  fourteen-week deployment, finding on-time phone pre-order collection rising
  sharply once the score began gating access to the weekend roast batch,
  alongside a matching rise in customers placing extra, unneeded pre-orders to
  protect their standing.
topic: >-
  Does gating a butcher's phone pre-order line by pickup punctuality actually
  get the weekend roasts to steadier hands, or just move the queue from the
  counter to the phone?
