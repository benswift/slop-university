summary: >-
  A research-showcase brochure led from the School of Underlying Conditions
  presents the University's thinking on biodegradable polymers along the
  length of such a material's working life: the bench where its ending is
  built in, the ground it is returned to, and the interval between the two.
  It sets out three ideas, introduces three of the researchers behind them,
  and rests the account on seven published outputs cited by title and DOI.
topic: >-
  made to come apart: a research showcase on biodegradable polymers and the
  other things the University studies that are designed to end, wear out,
  break down and be put back
