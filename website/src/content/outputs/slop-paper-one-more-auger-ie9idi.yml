title: One More Hole
subtitle: A Stopping Rule for Locating a Soil Boundary by Auger Within a Fixed Field Day
authors:
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-10-13
publishedAt: "2026-10-13T01:32:52+11:00"
doi: 10.5555/slop.ie9idi
summary: >-
  A paper from the School of Underlying Conditions treats the number of auger
  holes bored between two disagreeing holes as a sequential decision, valuing
  each further hole by the metres of expected error it removes from the drawn
  soil boundary. A bracket earns about one hole for each doubling of its
  width whether the boundary is sharp or gradual, and on one field day of
  eighteen holes across six brackets the rule lowers the summed expected error
  from 78.7 to 67.1 metres, where an even split would have reached 71.2.
topic: >-
  one more auger hole: a decision analysis of when a soil surveyor should stop
  boring and draw the boundary, treating each further hole as information
  bought against a fixed day in the field
