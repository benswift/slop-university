doi: 10.5555/slop.4gek3z
summary: >-
  A research poster from the School of Continuous Improvement reports a
  pre-registered vignette experiment with 312 shift supervisors, each offered a
  pending item that could not change the call, and finds they requested it on
  39% of decisions delivered live to their crew against 18% alone, an excess
  that all but vanished once the crew had been handed the decision rule.
topic: >-
  Shift supervisors asked to decide in front of their crew request information
  that could not change the decision more often than when deciding alone: a
  vignette experiment on non-instrumental information seeking under an audience
