summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to a
  research, teaching and engagement capability in hop chemistry, organised in
  three focus areas that follow the hop from growing and selection, through the
  analysis of its bitter acids and essential oils, to its storage. Its central
  commitment is to continuity: that what is known about a hop's condition at
  one stage travels with it to the next.
topic: >-
  hop chemistry, from bine to bench: the University commits to bitter acids,
  aroma and the long problem of keeping things fresh
