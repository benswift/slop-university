title: Kept in Condition
subtitle: >-
  Slop University's Strategic Plan 2026-2031 builds a hop chemistry capability
  that follows the hop from the garden to the bench to the cold store
authors:
  - Eskil Nwabueze
  - Ragnhild Uzoma
  - Sten Okwuosa
preset: strategy
school: School of Continuous Improvement
