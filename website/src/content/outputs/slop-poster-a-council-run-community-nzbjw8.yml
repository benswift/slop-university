title: Filed, Not Fixed
subtitle: >-
  Robotic Pool-Skimmer Exclusion-Zone Redraws Against Incident-Report Volume
  and Rostered Supervision
authors:
  - Ronja Oyelaran
  - Lindiwe Achterberg
  - Iben Chikere
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-08
publishedAt: "2026-08-09T00:01:30+10:00"
doi: 10.5555/slop.nzbjw8
summary: >-
  A research poster from the School of Emergent Priorities links eighteen
  months of a council pool portfolio's robotic-skimmer exclusion-zone
  breaches to two competing records: which shift-supervisor rotation was
  rostered at each breach, and an independently audited severity score.
  Filing volume tracks the rostered rotation far more closely than it
  tracks audited severity, and only the two highest-filing rotations saw
  their exclusion zone redrawn.
topic: >-
  a council-run community pool's robotic skimmer has a mapped exclusion
  zone around the toddler pool; testing whether the number of formal
  unsanctioned-excursion incident reports filed after each boundary breach
  predicts whether the exclusion zone is actually re-drawn, or just which
  shift supervisor was rostered on when it happened
