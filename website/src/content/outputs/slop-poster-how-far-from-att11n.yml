summary: >-
  A research poster from the School of Emergent Priorities reports where 380
  invitees across 94 weekend-plan group chats were when they sent "on my way",
  and how long they then took to arrive, as distributions by group size, and
  records the University's adoption of a fixed Expected Start for its own
  meeting invitations.
topic: >-
  How far from the venue is a person at the moment they send 'on my way' to the
  group chat? A self-report survey of 380 invitees, reported as distributions of
  location and minutes-to-arrival at send time, and the stated-and-expected
  start times the University prints on its own meeting invitations
