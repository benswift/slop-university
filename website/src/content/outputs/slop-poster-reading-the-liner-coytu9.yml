summary: >-
  A research poster from the School of Underlying Conditions maps water and
  diiodomethane contact angles at 20 mm pitch along the inner walls of 38 split
  PVC core liners from one diamond-drilled hole, and splits each station's
  surface energy into dispersive and polar components. Of the 61 intervals
  logged as lost, 39 carry a mineral transfer film matching walls that held
  recovered core and 22 match a mud-only reference, so the liner records
  whether the lost rock entered the barrel, though not what it was.
topic: >-
