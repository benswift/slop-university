title: Two Words for the Same Field
subtitle: Soil Naming and Plot Lending Between Two Villages Sharing One Valley Floor
authors:
  - Brynjar Obiora
  - Anneke Tolan
  - Eivind Onwuka
preset: research-poster
school: School of Underlying Conditions
