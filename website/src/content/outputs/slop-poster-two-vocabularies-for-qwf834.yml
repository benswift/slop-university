doi: 10.5555/slop.qwf834
summary: >-
  A research poster from the School of Underlying Conditions has cultivators
  from two neighbouring villages name the soils of the same 96 valley-floor
  plots, one village by colour and material, the other by how the ground
  behaves. The vocabularies coincide on the sandy and white ground but divide
  the black three ways, and over seven seasons land crossed the valley almost
  only where both villages would call it the same thing.
topic: >-
  Two vocabularies for one valley floor: a comparative ethnopedology of how
  two neighbouring farming communities name the same soils differently, and
  how each community's soil terms govern which plots households lend,
  sharecrop or give away
