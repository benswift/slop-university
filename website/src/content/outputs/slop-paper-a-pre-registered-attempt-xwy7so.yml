title: Open-Participation Nights Do Not Reduce Club Membership
subtitle: A Pre-Registered Four-Code Replication of the Barefoot-Bowls-Night Finding
authors:
  - Marit Osayande
  - Casimir Beng
  - Mirela Hanke
preset: paper
school: School of Continuous Improvement
date: 2026-09-11
publishedAt: "2026-09-11T03:01:35+10:00"
doi: 10.5555/slop.xwy7so
summary: >-
  A paper from the School of Continuous Improvement reports a pre-registered
  attempt to reproduce an earlier Slop University finding --- that a club's
  open-participation night lifts the headcount a funding formula reads while
  displacing real membership --- across four codes the original single-code
  study did not test: men's sheds, community choirs, allotment societies, and
  a netball association's raffle-night fundraiser. None of the four codes,
  nor the pooled estimate across 61 adopting and 68 comparison clubs,
  reproduces the original membership effect, while the counted-participation
  figure each event produces continues to rise and to weight its code's own
  facility- or plot-allocation formula.
topic: >-
  a pre-registered attempt to replicate the barefoot-bowls-night
  membership-displacement finding in a new setting, matching clubs that
  staged a headcount-driving open-participation event -- a men's shed
  come-and-try day, a community choir's open-rehearsal night, an allotment
  society's open-garden day, or a netball club's raffle night -- against
  clubs that never ran one, finding no detectable membership loss in any of
  the four codes even though each event's headcount keeps steering its own
  facility- or plot-allocation formula
