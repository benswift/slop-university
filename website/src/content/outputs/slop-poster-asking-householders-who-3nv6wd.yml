title: Similar to Whom
subtitle: >-
  A Household Survey of What Bill-Payers Believe the Similar-Homes Panel
  Compares Them With
authors:
  - Iben Chikere
  - Ingeborg Nwachukwu
  - Solveig Adeyemi
preset: research-poster
school: School of Emergent Priorities
date: 2026-07-29
publishedAt: 2026-07-29T06:01:43+10:00
doi: 10.5555/slop.3nv6wd
summary: >-
  A research poster from the School of Emergent Priorities surveys 1,180
  households on the comparison panel printed on their electricity bill, drawn
  from 2,850 addresses stratified by dwelling type and tariff over fourteen
  weeks at a response rate of 41.4%. Respondents named the basis of their own
  comparison group in open text, scored blind against the retailer's published
  peer rule of postcode band and connection type: 61.8% recall the panel, and of
  the 704 who answered the belief item, 21.1% name the basis in use, ranging
  only from 19.8% to 23.1% across dwelling types. "Homes on nearby streets" is
  the modal answer in every dwelling type, reported action follows for 11.6%,
  and the programme's engagement measure continues to count bills issued
  carrying the panel.
topic: >-
  asking householders who the similar-homes comparison panel on their
  electricity bill is comparing them with, what they did about it, and what the
  retailer's efficiency programme counts once the panel's reach becomes the
  outcome
