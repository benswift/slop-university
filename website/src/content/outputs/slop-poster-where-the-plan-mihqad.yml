title: Where the Plan Gets Read
subtitle: A performance-based evaluation of a regional town's structure plan through two decades of assessment reports
authors:
  - Signy Okpara
  - Runa Adegoke
  - Ronja Oyelaran
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-31
