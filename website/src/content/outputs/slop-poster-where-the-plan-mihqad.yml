doi: 10.5555/slop.mihqad
summary: >-
  A research poster from the School of Continuous Improvement codes the
  reasoning in 1,286 development assessment reports written over 21 years by
  one regional council, scoring each decision both for conformance with the
  town's statutory structure plan and for whether the plan was weighed as a
  reason. The plan is weighed in 71% of the 215 approvals that depart from it
  and in 9% of those that conform, where it is increasingly recited rather than
  weighed as the plan ages.
topic: >-
  where the plan gets read: a performance-based evaluation of a regional town's
  statutory structure plan, coding the reasons given in two decades of
  development assessment reports for whether the plan was used in deciding,
  not whether outcomes conformed to its map
