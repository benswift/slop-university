doi: 10.5555/slop.no33sj
summary: >-
  A research poster from the School of Underlying Conditions derives how far
  ahead any learned early-warning score can see a collapse in the noisy
  saddle-node normal form, testing five model classes and a Bayes-optimal
  filter on 240,000 simulated trajectories per route. When the system's
  reserve drifts towards the fold the ceiling reaches about 18 relaxation
  times; when collapse is a noise-driven Kramers escape it falls to about 1.8,
  and no model class exceeds it.
topic: >-
  The stochastic normal forms of physiological decompensation set a ceiling on
  how far ahead any learned early-warning model can see deterioration, and
  Kramers escape makes that ceiling far lower for noise-induced collapse than
  for a saddle-node approach
