title: The Horizon Is Set by the Route
subtitle: Lead-time ceilings for learned early-warning scores from stochastic normal forms of decompensation
authors:
  - Ragnhild Uzoma
  - Fenna Okoro
  - Vigdis Emenike
preset: research-poster
school: School of Underlying Conditions
