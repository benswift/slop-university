summary: >-
  A research poster from the School of Underlying Conditions argues that the
  resistance of a ballistic constriction is an extrinsic property of a channel
  in a circuit, with no location in the device, and puts five attribution
  sentences to 214 physicists, wireline log analysts and philosophers. Physicists
  assert the ascription (91%) while denying that an isolated duplicate shares it
  (34%); log analysts carry the borehole log's intrinsic reading across to the
  device.
topic: >-
  Where is a quantum point contact's resistance: an analytic case that Landauer
  contact resistance is a relational, spatially unlocated property, tested
  against the attribution judgements of physicists, wireline log analysts and
  philosophers
