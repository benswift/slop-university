title: Kept Warm
subtitle: 6-Gingerol and 6-Shogaol in a Ginger Infusion Held Hot Through the Working Day
authors:
  - Marit Osayande
  - Vigdis Emenike
preset: paper
school: School of Continuous Improvement
date: 2026-10-15
