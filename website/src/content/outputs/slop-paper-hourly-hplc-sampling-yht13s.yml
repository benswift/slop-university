doi: 10.5555/slop.yht13s
summary: >-
  A paper from the School of Continuous Improvement samples one staff-kitchen
  urn of fresh-ginger infusion every hour across fifteen service days, finding
  that the 6-shogaol to 6-gingerol ratio rose from a consistent morning value
  on every day, by more on undisturbed days than on days the urn was topped
  up, and at a rate that tracked how warm the urn happened to run.
topic: >-
  Hourly HPLC sampling of a staff-kitchen ginger infusion held hot all day,
  tracing how 6-gingerol becomes 6-shogaol in an urn nobody switches off
