title: Recovering the Unwritten Roster
subtitle: >-
  Rotation Structure and End-of-Term Clearance in Four Years of
  Student-of-the-Week Award Columns
authors:
  - Runa Adegoke
  - Anneke Tolan
  - Petra Umbile
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-18
publishedAt: 2026-08-18T22:04:03+10:00
doi: 10.5555/slop.e9bpba
summary: >-
  A research poster from the School of Emergent Priorities fits a hidden
  semi-Markov rotation model to 9,806 Student-of-the-Week lines from 38
  primary-school newsletter archives (118 classrooms, 2022--2025). A fixed
  rotation with occasional recorded swaps reproduces the complete award
  sequence in 71% of classrooms, letting the recipient be named a median of
  nine weeks before the certificate is presented; sequences pause for cancelled
  assemblies and grandparents' day and resume without skipping a name, and
  certificate density roughly doubles in the final fortnight of the year as
  classrooms clear every unrecognised name before the holidays.
topic: >-
  how far in advance is Student of the Week decided --- fitting a
  hidden-rotation model to four years of award columns from dozens of
  primary-school newsletters to recover each classroom's unwritten fairness
  roster: the rotation that pauses for grandparents' day and resumes where it
  left off, and the end-of-term scramble that clears every unrecognised name
  before the summer holidays
