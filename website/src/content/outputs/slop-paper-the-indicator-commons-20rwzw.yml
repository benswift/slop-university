title: Groundwork for a Plate Register
subtitle: >-
  What Badminton-Club Members Say They Bring to the End-of-Season Supper, in
  Their Own Terms
authors:
  - Mirela Hanke
  - Renke Sabel
  - Sten Okwuosa
preset: paper
school: School of Continuous Improvement
date: 2026-10-01
publishedAt: "2026-10-01T03:01:05+10:00"
doi: 10.5555/slop.20rwzw
summary: >-
  A paper from the School of Continuous Improvement interviews 26 members of a
  suburban badminton club about the plates they bring to the end-of-season
  supper, and reports the four kinds they name: safe, ambitious, rescue and the
  plate that goes home. The Indicator Commons has adopted those kinds as the
  categories of a Plate Register, and holds the club's trophy presentation and
  raffle draw until the supper is set, with no override for a thin turnout.
topic: >-
  The Indicator Commons convenes a standing Plate Register for a suburban
  badminton club's end-of-season bring-a-plate supper, adopting as its binding
  categories the kinds of plate that 26 interviewed members say they bring.
