doi: 10.5555/slop.bjdy1q
summary: >-
  A research poster from the School of Emergent Priorities tests 52 volunteer
  gallery guides and 48 front-desk volunteers at one regional natural-history
  museum before and after four-hour shifts. Speeded endorsement of unwarranted
  purpose-based explanations of nature rose from 31% to 44% after shifts with
  school groups, but not after adult tours or among desk volunteers; untimed
  answers held, and the rise had faded by the next morning.
topic: >-
  Speeded endorsement of unwarranted teleological explanations of nature among
  volunteer natural-history museum gallery guides, tested before and after a
  shift of explaining exhibits to school groups
