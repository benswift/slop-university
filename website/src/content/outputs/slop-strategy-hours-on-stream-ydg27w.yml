title: Hours on Stream
subtitle: A Strategic Plan for Electrocatalysts That Last, and a Cell Bank Kept Running for the Life of the Plan
authors:
  - Vigdis Emenike
  - Runa Adegoke
preset: strategy
school: School of Underlying Conditions
