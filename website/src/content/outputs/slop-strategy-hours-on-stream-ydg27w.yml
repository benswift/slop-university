summary: >-
  Slop University's Strategic Plan 2026-2031 commits the University to
  electrocatalysis for energy conversion with durability as its first-order
  result, centred on a bank of water-splitting cells brought on stream in the
  plan's first phase and held there under a published protocol until its last.
  Its four pillars pair durability-first catalyst screening with a feedwater
  record kept by the School of Underlying Conditions' monitoring round, and with
  named custodians and scheduled handovers so the run can outlast the
  appointments of the people who keep it.
topic: >-
  hours on stream: a strategic plan staking 2026-2031 on electrocatalysts that
