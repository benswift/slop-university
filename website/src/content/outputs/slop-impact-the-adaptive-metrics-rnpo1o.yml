summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 reports the
  Adaptive Metrics Lab's five-year Winter Comfort Survey of session-start
  temperatures across 96 sports-club changerooms, men's sheds, choir halls
  and allotment sheds, and follows the surveyed distribution into a
  certification floor that now excludes any venue below its 30th percentile
  from the School's community-partnership directory, with no discretion for
  circumstance.
