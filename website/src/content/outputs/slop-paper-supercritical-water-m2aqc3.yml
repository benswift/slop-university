title: Gloss in the Feed
subtitle: Coated-Paper Fraction, Ash and Reactor Plugging in the Supercritical Water Gasification of Shredded Institutional Records
authors:
  - Ingeborg Nwachukwu
  - Bram Ntuli
  - Marit Osayande
preset: paper
school: School of Continuous Improvement
date: 2026-10-21
publishedAt: "2026-10-21T17:01:56+11:00"
doi: 10.5555/slop.m2aqc3
summary: >-
  A paper from the School of Continuous Improvement gasifies 36 fortnightly
  collections of shredded records from the University's confidential-waste bins
  in a bench-scale continuous reactor at 600 °C and 25 MPa, 383 hours on stream
  in all. Batch ash tracked the coated-paper fraction closely (r² = 0.95), all
  five plugging events fell at 17.6 per cent ash or above, and an ash test with
  blending before feeding was followed by 154 hours without a plug; the coated
  fraction peaked after each of the University's reporting and planning cycles.
topic: >-
  Supercritical water gasification of a university's shredded paper-records
  stream: how the coated-print fraction of each collection batch governs ash,
  reactor plugging and hydrogen yield in a bench-scale continuous reactor
