title: Towards a Portable Nudge
subtitle: A Failed Replication of the Doorway-Side Effect at a Suburban Bowls Club
authors:
  - Marek Solheim
  - Anouk Mensah
  - Lindiwe Achterberg
preset: paper
school: School of Emergent Priorities
date: 2026-09-27
publishedAt: "2026-09-27T08:02:01+10:00"
doi: 10.5555/slop.buheru
summary: >-
  A paper from the School of Emergent Priorities alternates a suburban bowls
  club's Friday meat-raffle table between the clubroom's two entrances for a
  full season, tallying 9,845 hand-counted entrants against 3,412 tickets
  sold, and finds a clear side effect (rate ratio 1.47, 95% CI 1.29-1.67)
  where the University's own 2026 lecture-theatre trial found none. The
  Horizon Register has extended its unconditional doorway-rotation rule to
  community-partnered fixtures on the strength of the result.
topic: >-
  Replicate the lecture-theatre doorway-side null finding at a suburban bowls
  club's Friday meat raffle, alternating the ticket table between the
  clubroom's two entrances for a full season, and compare ticket uptake by
  side.
