title: Priced As Posted, Paid As Haggled
subtitle: >-
  A Single-Site Case Study of a Car-Boot Market's Fixed-Price, No-Haggling
  Signage
authors:
  - Joost Nwosu
  - Ingeborg Nwachukwu
preset: paper
school: School of Continuous Improvement
date: 2026-08-12
publishedAt: 2026-08-12T15:01:55+10:00
doi: 10.5555/slop.d1caz2
summary: >-
  A paper from the School of Continuous Improvement reports a single-site
  case study of a car-boot market's laminated fixed-price signage, combining
  1,142 timed transaction observations, 47 stallholder interviews, and the
  market committee's own compliance audit across fourteen Saturdays. Observed
  price deviation from the tag held at 58.2% of transactions against the
  committee's logged non-compliance of 9.4%, and an incidental five-week gap
  in signage at nine stalls produced no detectable change in negotiation
  behaviour.
topic: >-
  a single-site case study of a fortnightly car-boot market's
  committee-mandated "fixed price, no haggling" signage, tracking what
  sellers and buyers actually do at the tables against what the signage
  asserts, and using an incidental five-week gap in the signage at nine
  stalls to test whether the sign itself, rather than the underlying norm,
  is doing the work the committee credits it with
