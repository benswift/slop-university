summary: >-
  A research poster from the School of Settled Matters makes six poly(amic
  acid) varnishes by two orders of monomer addition and casts and cures films
  from them at eight points across six weeks of sealed storage. The
  dianhydride-last batches' advantage in elongation at break, 41% against 26%
  on the day of synthesis, halves by day 9 and falls within specimen scatter
  from day 21, as both varnishes drift to the same inherent viscosity.
topic: >-
  whichever came first: whether the order in which the monomers meet in a
  poly(amic acid) synthesis, and the weeks the varnish waits before casting,
  still show in the toughness of the cured polyimide film
