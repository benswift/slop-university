summary: >-
  A research poster from the School of Emergent Priorities maps the seed
  oil–ethanol–water binodal of a small bitters maker's anise tonic by 112
  cloud-point titrations at four temperatures, fitted with NRTL, and sets
  fourteen winter batches against a van-cabin temperature log. It finds that
  ten batches have a cloud point above their coldest delivery morning, that
  those ten are exactly the ones returned hazy, and that cloud point follows
  oil loading rather than ethanol strength; the haze clears on warming, so the
  round reaches the metastable region and never the spinodal.
topic: >-
  Where the tonic louches: cloud-point titration maps the oil–ethanol–water
  ternary of a small bitters maker's anise tonic, which turns milky in the
  delivery van on winter mornings
