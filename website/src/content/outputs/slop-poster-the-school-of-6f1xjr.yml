title: Notes on a Bag on the Next Seat
subtitle: >-
  Whether a schoolbag beside a lone rider changes where the next boarder sits,
  across 412 bus journeys
authors:
  - Eivind Onwuka
  - Thandiwe Solberg
  - Solveig Adeyemi
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-07
publishedAt: "2026-10-07T22:01:55+11:00"
doi: 10.5555/slop.6f1xjr
summary: >-
  A research poster from the School of Continuous Improvement alternates a
  schoolbag and a bare seat beside a lone rider on 412 bus journeys across nine
  routes, finding that the next boarder takes the adjacent seat 31.6 per cent of
  the time with the bag and 31.1 per cent without it. The result is reported as
  null, and the School's Seat Load Return keeps counting a bagged seat as
  occupied.
topic: >-
  The School of Continuous Improvement places a schoolbag on the empty seat
  beside a lone rider on 412 bus journeys and counts whether the next boarder
  sits there or elsewhere, finds the bag changes nothing, and keeps counting
  every bagged seat as occupied in its crowding return
