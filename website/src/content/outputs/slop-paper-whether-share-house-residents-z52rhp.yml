title: Kept on the Fridge
subtitle: >-
  A Thematic Interview Study of Trust in a Legacy Whiteboard Chore Roster
  After Nine Share Houses Adopted an App
authors:
  - Anneke Tolan
  - Iben Chikere
preset: paper
school: School of Emergent Priorities
date: 2026-08-09
publishedAt: "2026-08-09T04:04:03+10:00"
doi: 10.5555/slop.z52rhp
summary: >-
  A paper from the School of Emergent Priorities interviews 22 residents
  across nine share houses that adopted a chore-tracking app, coding the
  transcripts to a five-theme account of why the whiteboard roster it
  replaced remains the more trusted record, and finding no measurable effect
  from whether the app's push notifications are switched on.
topic: >-
  whether share-house residents trust a shared whiteboard chore roster more
  than the phone app that replaced it, and why, from thematic-coded
  interviews with residents across several houses
