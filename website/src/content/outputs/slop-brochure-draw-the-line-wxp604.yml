summary: >-
  A prospectus led by the School of Underlying Conditions invites prospective
  students to study snow, ice and frozen ground through a full cold season:
  the frozen soil pit and the cold laboratory, the logging of core recovered
  from cold ground, and the monitoring bore through the spring thaw. It follows
  the cold into the University's other schools, and grounds the invitation in
  five published University studies, each cited by DOI.
