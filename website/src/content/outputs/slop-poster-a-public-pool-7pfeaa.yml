summary: >-
  A research poster from the School of Emergent Priorities validates a
  public pool's induction-kiosk speed tier against timed lap pace across
  three council pools, finding induction tier only weakly predicts a
  swimmer's measured pace by season's end while lane re-sorts track logged
  overtake counts almost exactly.
topic: >-
  a public pool's induction kiosk self-assesses new swimmers into a speed
  tier for lap-lane allocation, then quietly re-sorts anyone overtaken
  three times in a session into a slower lane; testing whether the kiosk's
  tier, once set, ever tracks a swimmer's actual measured pace by season's
  end or just how often they've been overtaken
