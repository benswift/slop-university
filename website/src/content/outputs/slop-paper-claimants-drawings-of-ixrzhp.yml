summary: >-
  A paper from the School of Settled Matters reads, as an art historian reads
  a commissioned body of images, the 112 drawings that 47 claimants alleging
  giddiness after injury at work made for a provincial compensation
  tribunal's medical referee between 1904 and 1931. It finds that just over
  half picture the attack as a room canted to one side, with a plumb hanging
  lamp, a swell-hatched floor and a ruled horizon borrowed from the popular
  picture of a ship's cabin in a storm, attributes nine of the most fluent to
  the tribunal clerk, and shows the first referee crediting that convention
  over its rivals.
topic: >-
  Claimants' drawings of giddiness in a provincial compensation archive, and
  the seascape conventions they borrowed to picture vertigo for a tribunal
