doi: 10.5555/slop.2tmkul
summary: >-
  A research poster from the School of Underlying Conditions has nine tracked
  robots, each estimating a gradational soil boundary in its own lane, agree
  on a single boundary offset by linear consensus over the directed radio
  graph measured at each of twelve field sessions. The agreed line settled
  0.4-5.1 m from the lane mean, always toward the well-heard robots on a low
  rise and furthest after rain, as the Laplacian's left eigenvector predicted;
  push-sum on the same links recovered the mean at about 2.4 times the rounds.
topic: >-
  Where the swarm draws the line: probe-carrying ground robots agreeing on a
  single soil boundary by distributed consensus over a directed radio graph,
  and how the agreed line leans toward the readings of the robots the others
  hear best
