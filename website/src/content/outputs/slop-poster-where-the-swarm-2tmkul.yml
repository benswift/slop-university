title: Where the Swarm Draws the Line
subtitle: Directed radio links lean a nine-robot soil boundary toward the robots best heard
authors:
  - Brynjar Obiora
  - Casimir Beng
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-28
