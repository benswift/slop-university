summary: >-
  A research poster from the School of Underlying Conditions has nine
  annotators place 2,400 clauses from 40 anglophone Caribbean novels in five
  bands of the creole continuum, and trains a clause encoder on the spread of
  their labels rather than their majority. Masking quotation marks costs a
  majority-label baseline 17 points of agreement and the soft-label model two,
  and in the three held-out novels with creole-voiced narrators the model
  places narration and dialogue close together on the continuum.
topic: >-
  transects through the mesolect: a token-level model trained on annotator
  disagreement places the narration and dialogue of anglophone Caribbean novels
  along the creole continuum, rather than on either side of the quotation mark
