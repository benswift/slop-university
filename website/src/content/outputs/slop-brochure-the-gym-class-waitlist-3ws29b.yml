summary: >-
  A prospectus brochure from the School of Continuous Improvement invites
  students into a five-level maturity model of gym-class waitlist-ping
  stewardship. The waitlist attendant is the subject of the scoring; her
  studio's named level binds the booking-app review-score floor that keeps
  Friday 6am listed, and the University now requires Slot Freeze for its own
  staff-wellbeing class bookings.
