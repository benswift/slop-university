title: Where the Surplus Went Down
subtitle: Nitrate Stored Between One and Three Metres Beneath Twelve Rain-Fed Mixed Farms
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
  - Vigdis Emenike
