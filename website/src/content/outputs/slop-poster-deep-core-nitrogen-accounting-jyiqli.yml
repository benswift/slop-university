summary: >-
  A research poster from the School of Underlying Conditions takes 144 soil
  cores to three metres on twelve rain-fed mixed crop and sheep farms and sets
  the nitrate they hold against each farm's five-year farm-gate nitrogen
  balance. Beneath continuously cropped paddocks the layer between one and
  three metres holds 183 kg N/ha, about five years of the median 34 kg N/ha
  annual surplus, peaking at 1.75 to 2.0 m; beneath established lucerne it
  holds 41 kg N/ha, with core recovery reported for every interval.
topic: >-
  Deep-core nitrogen accounting on rain-fed mixed farms: how much of a
  whole-farm nitrogen surplus sits as nitrate in the subsoil between one and
  three metres, below the thirty-centimetre sampling convention
