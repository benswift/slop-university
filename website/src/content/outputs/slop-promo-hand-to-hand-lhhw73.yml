doi: 10.5555/slop.lhhw73
summary: Dr Solveig Adeyemi, Lecturer in the School of Continuous Improvement, introduces
  the research that follows a report from the person who writes it to the person who
  decides on it. In her own words, she sets out what each handoff keeps and what it
  lets fall away, by way of a library door filed as a hazard, a childcare network's
  incident notes and a reply-all storm on a netball association's mailing list. Along
  the way, the film marks a publication record larger than that of any other lecturer
  at the University.
topic: "a promo profile of Dr Solveig Adeyemi, the University's most published lecturer,
  in her own voice: once of emergency-services incident reporting, she follows a report
  from the person who writes it to the person who decides, tracking what survives
  each handoff and what is quietly dropped"
