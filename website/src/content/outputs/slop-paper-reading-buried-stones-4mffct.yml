title: Stones the Tine Never Touched
subtitle: Draught-Force Transients on a Spring-Reset Subsoiler Tine, Checked Against Trenches Along Its Path
authors:
  - Ragnhild Uzoma
  - Brynjar Obiora
preset: paper
school: School of Underlying Conditions
date: 2026-11-20
publishedAt: "2026-11-20T03:01:46+11:00"
doi: 10.5555/slop.4mffct
summary: >-
  A paper from the School of Underlying Conditions reads 6.0 km of draught
  record from one instrumented subsoiler tine in a stony paddock against 36
  trenches dug along its path, and finds that the force transients located 84
  per cent of the 268 stones the tine struck but only 55 per cent of the 412
  in its swept band, the rest being small stones carried aside ahead of the
  tine. The largest stones tripped the spring reset and appear in the record
  as the lowest draught of the pass.
topic: >-
  reading buried stones from a subsoiler tine's draught-force record:
  stone-strike signatures, draught energy and spring-tine breakout in a stony
  field tillage trial
