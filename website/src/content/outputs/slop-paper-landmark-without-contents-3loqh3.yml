title: Dated By, Not Recalled
subtitle: >-
  A Period of Communal Violence as an Empty Landmark in Autobiographical
  Memory, and Its Thinning in Joint Remembering
authors:
  - Ragnhild Uzoma
  - Vigdis Emenike
preset: paper
school: School of Underlying Conditions
date: 2026-11-07
publishedAt: "2026-11-07T23:32:19+11:00"
doi: 10.5555/slop.3loqh3
summary: >-
  A paper in cognitive psychology from the School of Underlying Conditions
  reports two studies in a river town that lived through three years of
  communal violence. Residents used the period to date more than a quarter of
  their word-cued memories, yet those three years held 4.6% of memories against
  13.2% expected; in pairs remembering the period together, conversation dwelt
  on its opening and closing months and induced forgetting of related interior
  details in speakers and listeners alike, an effect that largely disappeared
  when pairs were asked to go through the period in order.
topic: >-
  Landmark without contents: residents of an unnamed river town date their
  autobiographical memories by a three-year spell of communal violence yet
  recall almost nothing from inside it, and remembering together in pairs
  widens the gap through socially shared retrieval-induced forgetting
