title: Carried Through Six Steps
subtitle: >-
  Auditing a Terminal Alkyne's Silyl Cap en Route to a Gold(I)-Catalysed Enyne
  Cycloisomerisation
authors:
  - Clemency Tredinnick
  - Halvard Nnamani
  - Anselm Threlkeld
preset: research-poster
school: School of Settled Matters
date: 2026-11-17
