doi: 10.5555/slop.lqwm9r
summary: >-
  A research poster from the School of Settled Matters runs each of the six
  intermediate steps of a nine-step route to a gold(I)-catalysed 1,6-enyne
  cycloisomerisation on matched trimethylsilyl-capped and free terminal-alkyne
  substrates, in triplicate. Four steps differ by three points of yield or
  fewer; the cap matters only at a vinyl Grignard addition (84% against 31%)
  and a copper-catalysed C–N coupling (79% against 46%, with 22% diyne), and
  desilylating directly after the copper step leaves the route's overall yield
  unchanged.
topic: >-
  which steps of a nine-step route to a gold-catalysed enyne cycloisomerisation
  actually need the terminal alkyne's trimethylsilyl protecting group: a
  step-by-step omission study
