title: A Four-Kind Loyalty Sign-Up Taxonomy Now Sets Store Policy
subtitle: Enrolment channel ranked by membership tenure, then mandated storewide by rank
authors:
  - Anouk Mensah
  - Torun Ezeigwe
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-18
publishedAt: "2026-09-18T18:01:12+10:00"
doi: 10.5555/slop.sys1pd
summary: >-
  A research poster from the School of Emergent Priorities sorts supermarket
  loyalty-card enrolment into four channels --- cashier verbal ask, in-store
  prompt, app push, and receipt QR --- and finds median active membership
  tenure ranges from 14.2 months (cashier ask) to 3.9 months (QR code) across
  214 branches and 6 chains. On the strength of the gap, participating chains
  mandate cashier-initiated verbal enrolment as the sole permitted sign-up
  channel storewide from next quarter.
topic: >-
  A four-kind taxonomy of supermarket loyalty-card sign-up methods (in-store
  prompt, app push, receipt QR code, cashier verbal ask), sorted by how long
  the resulting membership stays active, now sets which method every store
  must use next quarter
