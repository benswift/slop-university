summary: >-
  A research poster from the School of Continuous Improvement crosses
  on-time completion against quiz score on the University's compulsory
  annual compliance-training module into PASS, a four-cell quadrant, and
  reports the School's adoption of one cell's headcount as the basis for a
  manager's quarterly coaching-conversation quota, independent of how many
  reports actually passed.
topic: >-
  Although the compulsory annual compliance-training module asks only for a
  pass mark, PASS -- a punctuality-and-score sorter -- crosses on-time
  completion against quiz score into a four-cell quadrant, and a manager's
  coaching-conversation quota is now set by how many of their reports land
  in the worst cell, not by how many pass
