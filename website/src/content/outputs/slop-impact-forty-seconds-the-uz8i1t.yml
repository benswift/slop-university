summary: >-
  The School of Continuous Improvement's Impact Report 2021–2026 gives PEAK
  --- Predictive Egress At Kerbside --- its two years and three sites, finds
  no dwell-time cut at the school pick-up zone, the bus interchange or the
  car-park exit, and reports the null as the Metric Stewardship Charter's
  newest closed entry. Three further impact areas cover dashboard-currency
  auditing, review-cadence ranking, and the retirement pathway the finding
  itself now sits on.
topic: >-
  Forty seconds: the dwell-time cut PEAK (Predictive Egress At Kerbside) was
  commissioned to deliver at school pick-up zones, bus interchanges and
  car-park exits, and the cut a two-year three-site trial did not find,
  reported as null and retired without salvage.
