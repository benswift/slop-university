title: To Four Significant Figures
subtitle: >-
  The Department of Policy Settings answers questions taken on notice by the
  Committee on Settings Oversight on the computational-results setting and the
  reruns it requires
authors:
  - Clemency Tredinnick
  - Casimir Beng
  - Vigdis Emenike
  - Bram Ntuli
preset: questions-on-notice
date: 2026-11-15
publishedAt: "2026-11-15T05:32:19+11:00"
doi: 10.5555/slop.gqn3jr
summary: >-
  The Department of Policy Settings answers five questions on the Slop
  University (Computational Results) Determination 2026, which has a numerical
  result rerun independently before an output is issued and annotates the
  output's record where the rerun does not agree to four significant figures.
  Taken on notice at the Committee on Settings Oversight's Spring hearings of 13
  November 2026 or lodged in writing after them, its answers report 1,044
  results lodged since 1 July, 69 of them annotated and 45 of those in the
  School of Underlying Conditions; state that an annotation is never removed,
  only joined by a later one; trace the tolerance to the Research Computing
  Guidelines 2022 without stating its basis; confirm that a time average is
  rerun as a time average; and decline to compile the configuration of every
  rerun.
topic: >-
  the Committee presses the Department on the computational-results setting
  that requires an independent rerun to match a numerical result to four
  significant figures, and on what it makes of long integrations of chaotic
  systems
