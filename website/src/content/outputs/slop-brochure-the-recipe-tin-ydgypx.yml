summary: >-
  A research-showcase brochure from the School of Continuous Improvement teaches
  one household's recipe tin as a case, in which the marks left by spatter and
  thumbprint are read as votes on what the family cooks. The reading rewards the
  mess of the cook over the regard of the table, and the School has adopted it,
  without ordinary override, for every gathering it hosts.
topic: >-
  the recipe tin as a ballot box, taught as a single-household case: the
  grease-stained recipe-card tin in one household kitchen, whose splatter and
  thumbprint density is read as a ballot deciding what the family cooks for
  every gathering
