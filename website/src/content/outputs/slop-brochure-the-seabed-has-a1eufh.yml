summary: >-
  A prospectus brochure inviting students into the School of Underlying
  Conditions to study the marine invertebrates that build, stir and settle the
  floor of the sea. Four strands of work --- shells read in cores, burrowing
  animals in tidal mud, larval settlement on panels and piles, and bench
  physiology --- are carried by five published University studies cited by
  title and DOI, and by the researchers who teach them.
topic: >-
  the seabed has tenants: a prospectus inviting students to the School of
  Underlying Conditions to study the marine invertebrates that make the ground
  beneath the sea --- the shells that settle into sediment, the burrowers that
  dig and irrigate the mud, the larvae choosing where to land, and the
  physiology that keeps them at it
