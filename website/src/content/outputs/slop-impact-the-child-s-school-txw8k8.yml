title: Measured Once, Trusted Since
subtitle: >-
  Five Years of the School of Continuous Improvement's Work on the Readings
  That Outlive the Moment They Were Taken
authors:
  - Renke Sabel
  - Marit Osayande
  - Sten Okwuosa
  - Dagny Okafor
preset: impact-report
school: School of Continuous Improvement
date: 2026-07-25
doi: 10.5555/slop.txw8k8
summary: >-
  The School of Continuous Improvement's Impact Report 2021-2026 traces four
  readings --- a compliance rating, a dashboard tile, a customer-trust score,
  and a retained wellbeing-index item --- each measured once and left in
  active use for years after the review, contractor, or instrument behind it
  had moved on, and reports on the School's own work helping four partner
  organisations formally retire or requalify what they had stopped checking.
topic: >-
  the child's school results letter stuck to the fridge with a magnet, still
  quietly steering subject choices and dinner-table worry years after the
  number on it stopped meaning anything
