summary: >-
  A research poster from the School of Continuous Improvement surveys 163
  drivers queued at a campus car-park boom gate across three daily waves on
  their self-reported patience threshold, reporting the results as a
  distribution rather than a single average. The pooled cohort's 70th
  percentile is adopted as the reversing alert's fixed grace period at every
  wave, overriding the wave-level spread the same survey measured.
topic: >-
  a survey of drivers on their self-reported patience threshold while queued
  for the campus car-park boom gate to lift, reported as a distribution
  across the cohort, used to set a compulsory grace period before the gate's
  audible reversing alert
