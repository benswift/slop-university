doi: 10.5555/slop.fze8e1
summary: >-
  A research poster from the School of Emergent Priorities treats each tier of
  a business-intelligence reporting hierarchy as a block-spin transformation
  and measures scaling eigenvalues for twelve indicator families across five
  roll-up levels in 23 organisations. Summed indicators are relevant, averaged
  ones irrelevant and worst-of statuses marginal, and a RAG status rolled up by
  worst case with escalation flows to a stable fixed point at amber, so that
  executive tiers fall into one universality class per aggregation rule.
topic: >-
  coarse-graining the KPI roll-up: a renormalisation-group treatment of
  business-intelligence dashboards, asking which indicators survive aggregation
  from team level to the executive summary and why unrelated firms' top-level
  dashboards flow to the same few fixed points
