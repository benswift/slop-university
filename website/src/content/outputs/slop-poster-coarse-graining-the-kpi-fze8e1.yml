title: Amber at the Fixed Point
subtitle: A Renormalisation-Group Account of KPI Roll-Up in Business-Intelligence Hierarchies
authors:
  - Hedvig Anyanwu
  - Mirela Hanke
  - Ronja Oyelaran
preset: research-poster
school: School of Emergent Priorities
