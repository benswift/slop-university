title: One Track per Target
subtitle: >-
  How the Strategic Plan 2026-2031 Fuses the University's Many Observers into
  a Single Maintained Picture of Its Work
authors:
  - Eskil Nwabueze
  - Mirela Hanke
  - Marit Osayande
preset: strategy
school: School of Continuous Improvement
date: 2026-10-12
publishedAt: "2026-10-12T22:12:52+11:00"
doi: 10.5555/slop.42sumt
summary: >-
  Slop University's Strategic Plan 2026-2031 treats the institution as a
  network of partial observers and commits it to holding exactly one
  maintained track for each significant activity, with a stated confidence
  attached. Four focus areas follow an observation from the edge where it is
  made, through its association with an activity and its fusion into a Common
  Institutional Picture, to the orderly retirement of tracks that no observer
  any longer supports.
topic: >-
  one track per target: a strategic plan for fusing the University's many
  partial observers into a single maintained picture of its own work
