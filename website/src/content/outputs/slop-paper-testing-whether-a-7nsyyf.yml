title: No Faster, No Slower
subtitle: >-
  A Null-Result Field Trial of Suggested-Return-Window Stickers on Street
  Libraries
authors:
  - Ronja Oyelaran
  - Renke Sabel
preset: paper
school: School of Emergent Priorities
date: 2026-08-09
publishedAt: "2026-08-09T02:05:03+10:00"
doi: 10.5555/slop.7nsyyf
summary: >-
  A paper from the School of Emergent Priorities runs a sixteen-week
  stepped-wedge field trial across forty-eight street libraries, testing
  whether a suggested return-window sticker shortens how long a book stays
  out of circulation. A box-level survival model finds no measurable effect
  from the sticker's presence, and a wording ablation contrasting a polite
  request against a directive instruction finds no effect from that either.
topic: >-
  testing whether a suggested-return-window sticker on a street little free
  library speeds book turnover, and reporting the honest null result
