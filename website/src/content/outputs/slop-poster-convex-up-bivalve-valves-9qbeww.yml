summary: >-
  A research poster from the School of Underlying Conditions reads the
  orientation of 3,412 disarticulated bivalve valves by X-ray CT in four
  unsplit cores laid across a back-barrier lagoon, and calls a washover
  horizon wherever half or more of a 2-cm interval's valves lie convex-up.
  The barrier core holds seven such horizons, each above a visible sand bed;
  the count falls to five, three and one landward, where four of the
  horizons lie in mud with no sand at all, and an unrecovered 8 cm of one
  core is left as lost.
topic: >-
  Convex-up bivalve valves in CT-scanned lagoon cores as a record of late
  Holocene storm washover
