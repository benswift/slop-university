doi: 10.5555/slop.wznk2x
summary: >-
  A paper from the School of Continuous Improvement treats a supermarket
  chain's staggered, nine-wave rollout of a stricter self-checkout
  theft-flagging threshold as a natural experiment, finding no measurable
  change in shrinkage alongside an honest-shopper false-stop rate that
  rises in every wave.
topic: >-
  whether tightening a supermarket self-checkout's AI theft-flagging
  sensitivity reduces shrinkage or just increases how often honest
  shoppers get stopped, using stores that rolled the update out on
  different dates as a natural experiment
