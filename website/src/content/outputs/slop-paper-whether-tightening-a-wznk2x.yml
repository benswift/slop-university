title: Tightening the Threshold
subtitle: >-
  Self-Checkout Theft-Flagging Sensitivity, Shrinkage, and the
  Honest-Shopper Stop Rate
authors:
  - Casimir Beng
  - Osei Vandermeer
  - Mirela Hanke
preset: paper
school: School of Continuous Improvement
