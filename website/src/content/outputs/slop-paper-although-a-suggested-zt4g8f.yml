title: Sounds Good
subtitle: >-
  A Sidecar that Records Every Suggested-Reply Chip as a Speech Act and
  Plates the Picnic from the Log
authors:
  - Anouk Mensah
  - Ingrid Vasseur
  - Verity Marris
preset: paper
school: School of Emergent Priorities
date: 2026-09-02
publishedAt: "2026-09-02T12:00:15+10:00"
doi: 10.5555/slop.zt4g8f
summary: >-
  A paper from the School of Emergent Priorities reports CHIPACT, a sidecar
  that treats every suggested-reply chip in a weekend-plans group chat as a
  recorded speech act. Across 36 chats and 214 events, two commissive chips
  came to dominate the log, typed RSVPs plated nothing, and an optional
  ageing rule moved mean cover by 0.4 percent. University-sponsored weekend
  events at the field sites now plate from the chip log, with no ordinary
  override.
topic: >-
  Although a suggested-reply chip in a weekend-plans group chat is only a
  keyboard shortcut, we built a sidecar that treats every tapped chip as a
  recorded speech act and draws the next picnic's catering, with no ordinary
  override, from the chip log rather than from who said they would come in
  their own words.
