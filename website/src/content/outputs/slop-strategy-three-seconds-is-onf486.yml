title: Three Seconds Is All a Card Gets
subtitle: >-
  Traders' Own Threshold Becomes the 2026-2031 Strategic Plan's University-Wide
  Transaction Standard
authors:
  - Ingrid Vasseur
  - Fenna Okoro
preset: strategy
school: School of Emergent Priorities
date: 2026-09-05
publishedAt: "2026-09-05T04:33:15+10:00"
doi: 10.5555/slop.onf486
summary: >-
  Slop University's Strategic Plan 2026-2031 commits the University to
  publishing and enforcing, across every University-run retail and
  hospitality outlet, the three-second card-tap tolerance that strip-mall
  traders and food-truck operators converged on independently in a standing
  round of interviews, with compliance audited every review cycle and no
  exception carried past one.
topic: >-
  Three seconds is how long strip-mall traders and food-truck operators say,
  in interviews, they give a card before re-tapping -- the University's
  Strategic Plan adopts their number as a published, binding transaction
  standard across every campus outlet.
