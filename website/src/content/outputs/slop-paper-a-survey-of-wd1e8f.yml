title: The Countdown Decided First
subtitle: >-
  A Survey of Sixty-Three Food-Truck Operators on Trust in a Live Queue
  Countdown's Early-Warning Threshold, Tested Against Stockout and Walk-Off
  Outcomes Over One Trading Season
authors:
  - Fenna Okoro
  - Verity Marris
  - Marek Solheim
preset: paper
school: School of Emergent Priorities
date: 2026-08-08
publishedAt: "2026-08-08T08:04:04+10:00"
doi: 10.5555/slop.wd1e8f
summary: >-
  A paper from the School of Emergent Priorities surveys 63 food-truck
  operators on a regional circuit about their trust in their ordering
  app's live queue-length countdown, cross-referenced against a
  fourteen-week season of the platform's own event log. Self-reported
  trust in the countdown as an early-warning signal shows no association
  with a truck's own season hit-rate: across 1,842 threshold crossings, a
  crossing preceded an actual stockout or walked-off customer within
  twenty minutes for only 9.0% of crossings on average, and trust does not
  track which trucks the warning serves well (r = 0.04). An ablation
  splitting the sample by the platform's original and mid-season-refreshed
  countdown display leaves operators' reported response mix unchanged.
  Reported response tracks the countdown's displayed minutes-remaining
  figure more closely than operators' own headcount of the physical line
  (r = 0.71 versus r = 0.18).
topic: >-
  a survey of food-truck operators on how much they trust their ordering
  app's live queue-length countdown as an early warning to pull menu items
  or call in extra staff, tested against whether the countdown's warning
  threshold actually preceded a stockout or a walked-off customer
