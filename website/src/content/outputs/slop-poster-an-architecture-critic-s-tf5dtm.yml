summary: >-
  A research poster from the School of Settled Matters reads five successive
  designs of an appellate court registry's public website as architectural
  plans, drawing each as an access graph from the home page and walking the
  same 60 standing and 60 overruled judgments through all of them. No redesign
  removed an overruled judgment, but each moved them further from the front
  door, from a mean of 2.0 clicks in the first plan to 6.6 in the fifth, while
  standing judgments stayed within about three; the share of overruled
  judgments linking to the decision that overruled them fell from 58 of 60 to
  9.
topic: >-
  an architecture critic's plan-reading of five successive redesigns of an
  appellate court registry's public website, following overruled judgments as
  they are moved out of the main hall into a basement reached only by back
  stairs
