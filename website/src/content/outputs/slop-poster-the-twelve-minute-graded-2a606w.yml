title: Twelve Minutes Played, Four Hours Recorded
subtitle: >-
  A Work-Sampling Study of the Person-Time One Graded Music Examination Consumes
  at Fourteen Community Venues
authors:
  - Runa Adegoke
  - Anouk Mensah
  - Sten Okwuosa
preset: research-poster
school: School of Emergent Priorities
date: 2026-08-04
publishedAt: 2026-08-04T21:05:33+10:00
doi: 10.5555/slop.2a606w
summary: >-
  A research poster from the School of Emergent Priorities observes 214 graded
  music examinations across fourteen community venues over one winter round,
  attributing every recorded minute to one of seven roles and one of nine
  artefacts on a list fixed before the first venue. Median playing time is 11.6
  minutes against 217 minutes of recorded person-time per candidate, or 18.7
  person-minutes for every minute played; reconciling the examinations-completed
  return on which the venues are funded takes 22% of that total, while the
  examination and the examiner's written report together account for 14%.
topic: >-
  the twelve-minute graded music examination in a suburban hall, audited as a
  time-and-motion study of every person-minute the day consumes --- entry forms,
  readiness attestations, accompanist declarations, certificate reconciliation,
  and the annual return that counts examinations completed --- against the
  minutes anyone spends listening to the child play
