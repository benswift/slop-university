summary: >-
  A research-showcase brochure sorts four everyday digital signals --- a
  booking app's confirmation, a group chat's pinned rule, a neighbourhood
  forum's earned badge, and a business's review score --- into a single
  Everyday Signal Grid, and reports the University's Indicator Commons
  adopting the Grid's cell order as the basis for its own fault-repair
  queue.
topic: >-
  if a fault is reported against a booking app's tick, a group chat's pin, a
  forum's badge, or a review score, which gets fixed first, and on what
  grounds?
