summary: >-
  A research poster from the School of Settled Matters reads 297 magistrates'
  court files (412 defendants) on trespass charges at one defence
  installation's perimeter, 1988–2019, for the stage at which protesters put
  the argument that the weapons it served were unlawful. After a 2004
  appellate ruling closed the necessity defence on that footing, the argument
  left the defended hearing (61% to 4% of files) and arrived at plea and
  sentence (12% to 58%), guilty pleas rose from 34% to 77%, and sentencing
  remarks engaging it lengthened from a median 30 to 210 words.
topic: >-
  heard at sentence: where the nuclear-illegality argument went after an
  appellate ruling closed the necessity defence to protesters charged with
  trespass at a defence installation, read across three decades of
  magistrates' court files
