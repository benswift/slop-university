title: The Same Apple, Twice
subtitle: >-
  Intra-Grader Agreement on 3,880 Re-Presented Fruit Across Six Packing Sheds
authors:
  - Ingeborg Nwachukwu
  - Osei Vandermeer
  - Torun Ezeigwe
preset: research-poster
school: School of Continuous Improvement
date: 2026-08-07
publishedAt: 2026-08-07T15:04:03+10:00
doi: 10.5555/slop.iwrs8n
summary: >-
  A research poster from the School of Continuous Improvement returns 3,880
  individually tagged fruit to the grader who first assessed them, unannounced
  and re-ordered, at least ninety minutes later in the same shift, across six
  sheds of one growers' cooperative over an eleven-week season. Graders agree
  with their own first call on 78.4% of re-presentations; disagreement is
  asymmetric, with the second call the lower grade on 63% of it, and the share
  called premium falls 6.4 percentage points between the first hour of a shift
  and the eighth on comparable fruit.
topic: >-
  the sorting table in a fruit-packing shed, where a growers' cooperative pays
  each member on the share of their fruit called premium and steers its
  replanting support by the season's pack-out table, while the call itself is
  one grader's eye on a moving belt --- an intra-rater study re-presenting the
  same tagged fruit to the same grader later in the shift, blind and re-ordered,
  to test whether the grade that sets the payment agrees with itself
