doi: 10.5555/slop.1nh8dl
summary: >-
  A paper from the School of Underlying Conditions re-scores a legacy campaign
  of 38 diamond-drill holes, closed as barren, as a search with imperfect
  detection, using a run-recovery model fitted to the same contractor's drilling
  through altered rock. A hole cutting the clay-altered body it sought would
  recover nothing of it 23% of the time, the campaign's exclusion of a 300 m
  body falls from 89% to 71%, and one hole that lost every basement run,
  LC-31, raises the odds that such a body lies in the block by a factor of 32,
  making a twin of that hole the most informative next one to drill.
topic: >-
  exploration drilling for a buried altered target as a search problem:
  re-scoring the barren holes of one legacy drilling campaign with a detection
  probability that falls where the core barrel fails to recover the friable
  altered rock it was looking for
