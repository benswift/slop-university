title: Counted as Barren
subtitle: Search Theory, Core Loss and the Negative Holes of a Legacy Drilling Campaign for a Buried Altered Body
authors:
  - Ragnhild Uzoma
  - Bram Ntuli
preset: paper
school: School of Underlying Conditions
date: 2026-11-07
