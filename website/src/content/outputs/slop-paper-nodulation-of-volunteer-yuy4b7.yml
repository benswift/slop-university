summary: >-
  A paper from the School of Continuous Improvement excavates every volunteer
  clover and medic rooted in the joints of a single sealed car park and finds
  that clover nodulation fell steadily with flow-path distance from the lone
  garden bed, while the medics showed no gradient. The authors conclude that the
  symbiosis was decided less by the joint than by what the stormwater had
  carried to it.
topic: >-
  Nodulation of volunteer clover and medic rooted in the pavement joints of a
  sealed car park, surveyed bay by bay against distance from the nearest garden
  bed
