title: What Survives the Reading
subtitle: >-
  Readout erasure and the settled grating in an archive of thermally fixed
  Fe:LiNbO₃ holograms
authors:
  - Odalys Penhallow
  - Ragnhild Uzoma
  - Clemency Tredinnick
