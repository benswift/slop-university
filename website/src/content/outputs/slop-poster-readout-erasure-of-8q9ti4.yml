summary: >-
  A research poster from the School of Settled Matters reads twelve thermally
  fixed holographic gratings, archived in iron-doped lithium niobate blocks
  from a concluded storage programme, up to 400 times each at the recording
  wavelength, and separates each into a fixed ionic and an erasable electronic
  component. Eleven settle to a plateau within a median of 37 reads, eight
  rising and three falling as the electronic grating re-formed in storage is
  erased; one block declines without levelling and is set aside as
  incompletely fixed.
topic: >-
  readout erasure of thermally fixed holograms in an archive of iron-doped
  lithium niobate crystals, and how many reads it takes before only the fixed
  grating remains
