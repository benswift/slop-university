summary: >-
  A case-for-support brochure from the School of Continuous Improvement invites
  the clinical leads, registry managers and survivorship coordinators of renal
  cancer services into partnership on how long-term follow-up is measured,
  offering Improvement Grand Rounds as the place to present a review pathway as
  a case. It rests the offer on eight published studies that follow their
  subjects past their opening weeks, cited by title and DOI.
topic: >-
  The Long Follow-Up: a case-for-support brochure inviting the people who run
  renal cancer services and their long-term follow-up registries to partner
  with the School of Continuous Improvement, a school with no clinic and no
  cancer laboratory, on how following up is measured
