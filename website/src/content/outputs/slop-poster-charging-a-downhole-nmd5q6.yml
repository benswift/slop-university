summary: >-
  A research poster from the School of Underlying Conditions reports a bench
  study of a 148 kHz resonant inductive link for recharging a downhole
  water-level logger through the glued plastic cap of a monitoring bore,
  measured at thirty combinations of lateral offset and coil gap. Efficiency
  holds within a point of its aligned value out to 8 mm off centre at every
  gap tested, falls from 71% to 30% at the worst corner of the grid, and
  delivers a quarter's charge in between seven and seventeen minutes.
topic: >-
  Charging a downhole water-level logger without pulling it: resonant
  inductive power transfer through the sealed cap of a monitoring bore, and
  how much coil misalignment the link forgives
