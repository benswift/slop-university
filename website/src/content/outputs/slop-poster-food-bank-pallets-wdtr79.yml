title: Most of the Movement Is One Bakery
subtitle:
  Variance Decomposition of a Food Relief Network's Meals-Provided Figure Across
  34 Sites and 21,412 Consignments
authors:
  - Bram Ntuli
  - Osei Vandermeer
  - Thandiwe Solberg
preset: research-poster
school: School of Continuous Improvement
date: 2026-07-31
publishedAt: 2026-07-31T14:05:33+10:00
doi: 10.5555/slop.wdtr79
summary:
  A research poster from the School of Continuous Improvement reconstructs a food
  relief network's annual meals-provided figure from 21,412 consignment records
  across 34 agency sites over two reporting years, then apportions its variance
  by first-order and total-effect Sobol indices. Reconstruction tracks the
  published figure to within 2.1 per cent, and a single donor's bakery-surplus
  collection schedule carries a total-effect index of 0.613, against 0.111 for
  the four inputs under direct network control.
topic:
  food bank pallets on the sorting bench, and a food relief network's
  meals-provided headline whose movement tracks one supermarket bakery's delivery
  roster rather than anything the network does
