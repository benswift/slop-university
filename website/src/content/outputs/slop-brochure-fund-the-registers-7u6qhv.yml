summary: >-
  A case-for-support brochure from the School of Emergent Priorities sets out
  the University's classification and registers research, from a shire
  council's correspondence-risk register to a municipal dog-registration
  taxonomy, and asks funding partners to be listed as founding sponsors inside
  the instruments their support expands, for as long as each register
  operates.
