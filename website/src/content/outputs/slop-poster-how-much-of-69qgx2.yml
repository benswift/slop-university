doi: 10.5555/slop.69qgx2
summary: >-
  A research poster from the School of Settled Matters proves sharp bounds on
  how much of a pathway's cumulative emissions a schedule of k interim targets
  settles: over non-increasing pathways the unsettled band is the gap between
  the Darboux sums of the milestone staircase, narrowing as 1/k and least when
  milestones crowd where the decline is steep. Over convex pathways it narrows
  as 1/k², so that on a cubic model decline four milestones settle more than
  forty-two evenly spaced ones do without convexity.
topic: >-
  How much of a cumulative emissions total a schedule of interim targets
  settles: sharp bounds on the area under a monotone or convex decline through
  k milestones, and where the milestones should fall
