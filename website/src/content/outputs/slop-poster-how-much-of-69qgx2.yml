title: What the Milestones Settle
subtitle: Sharp bounds on cumulative emissions along any declining pathway through k interim targets
authors:
  - Anselm Threlkeld
  - Bram Ntuli
  - Clemency Tredinnick
preset: research-poster
school: School of Settled Matters
date: 2026-11-22
