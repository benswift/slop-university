title: Bubbling on the Bench, Christened or Not
subtitle: A Pre-Registered Two-Arm Trial of Starter Naming and Weekly Feeding Adherence in 96 Households over 26 Weeks
authors:
  - Iben Chikere
  - Lindiwe Achterberg
  - Anouk Mensah
preset: research-poster
school: School of Emergent Priorities
date: 2026-09-19
