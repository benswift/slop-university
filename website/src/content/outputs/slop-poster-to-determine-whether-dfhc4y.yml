doi: 10.5555/slop.dfhc4y
summary: >-
  A research poster from the School of Emergent Priorities randomises 96
  households to keep a sourdough starter with or without a name on its jar tag
  for 26 weeks, and finds on-time Friday feeding the same in both arms (17.3 of
  26 against 17.5). The School drops naming from its household guidance and
  issues every enrolled starter a lot-assigned serial number in its place.
topic: >-
  To determine whether naming a household sourdough starter changes how often it
  is fed on schedule over twenty-six weeks, and to fix the School's
  starter-naming rule from the answer
