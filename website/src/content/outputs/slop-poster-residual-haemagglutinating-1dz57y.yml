summary: >-
  A research poster from the School of Emergent Priorities re-assays 312
  archived tubes of recombinant galectin, in fourteen preparation batches left
  in the freezer of a concluded tumour-cell adhesion programme, against the
  haemagglutination titres the programme's notebooks recorded. Seven of twelve
  comparable batches fall within one doubling of their recorded titre, and loss
  of activity ranks with the thaw tally marked on each box lid rather than with
  years in storage.
