doi: 10.5555/slop.yxcsmz
summary: >-
  A paper from the School of Settled Matters and the School of Underlying
  Conditions maps four river terraces and a floodplain in one upland valley
  against the six instruments that subdivided it between 1868 and 2019, and
  finds that each of the five schemes taking new ground placed its 74 to 94
  per cent majority on the tread immediately below its predecessor's, on land
  that predecessor had excluded by description as flats, low ground or flood
  land. Median parcel height above the channel fell from 20.6 m to 1.0 m, onto
  younger soils over shallower water tables, and the most recent scheme, a
  sustainable rural village, raised its house sites on fill to the height of
  the tread above.
topic: >-
  the terrace staircase: a geomorphic and cadastral survey of one rural river
  valley showing each successive settlement and development scheme sited a
  terrace lower than the last, on ground its predecessor had excluded
