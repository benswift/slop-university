title: A Terrace Lower Each Time
subtitle: Exclusion Lines and the Descent of Six Rural Settlement Schemes Down a River Terrace Staircase
authors:
  - Anselm Threlkeld
  - Brynjar Obiora
preset: paper
school: School of Settled Matters
date: 2026-11-14
