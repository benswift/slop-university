title: What the Stone Keeps
subtitle: >-
  A dissipation bound on undoing consolidant treatments in porous stone
authors:
  - Clemency Tredinnick
  - Vigdis Emenike
  - Brynjar Obiora
preset: research-poster
school: School of Settled Matters
date: 2026-11-23
