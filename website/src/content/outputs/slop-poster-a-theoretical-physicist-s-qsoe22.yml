doi: 10.5555/slop.qsoe22
summary: >-
  A research poster from the School of Settled Matters treats the removal of a
  stone consolidant as its uptake run backwards through the same pores, and
  derives from the entropy produced over that cycle a lower bound on the
  fraction no extraction can recover. Across 2,400 synthetic networks with
  log-normal throat radii, the bound is zero only for a single throat size,
  keeps about a fifth of the dose at a spread of 0.6, and no simulated
  extraction recovers more than it allows.
topic: >-
  a theoretical physicist's lower bound on how much of a consolidant treatment
  in porous building stone can never be undone, derived from entropy
  production in a pore network
