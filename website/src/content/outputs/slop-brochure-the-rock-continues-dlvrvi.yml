summary: >-
  A prospectus from the School of Underlying Conditions invites students to
  study relations between neighbours from the line where two surveys' maps of
  the same rock fail to meet. It presents the correlation of a formation that
  carries two names as a negotiation conducted over trays of core, follows
  groundwater and corridors across the boundary, and rests its invitation on
  five published studies cited by title and DOI.
topic: >-
  the rock continues past the border: a prospectus for studying how neighbours
  who share a formation come to agree on what to call it
