title: The Call That Beat the Lockout
subtitle: >-
  A Quasi-Experiment on Rent-to-Own Appliance Repayment Across Kill-Switch and
  Pre-Kill-Switch Product Generations
authors:
  - Torun Ezeigwe
  - Casimir Beng
preset: paper
school: School of Continuous Improvement
date: 2026-07-26
doi: 10.5555/slop.y9z7vz
summary: >-
  A paper from the School of Continuous Improvement compares 4,312
  rent-to-own appliance accounts across a hardware generation fitted with a
  remote payment-lapse lockout and one without, exploiting a brief window in
  which the hardware rollout and a separate income-verification tightening
  only partly overlapped. Once verification tier is held fixed, the
  lockout's own contribution to reduced default narrows to a gap
  statistically indistinguishable from zero, and a share of its credited
  recoveries follow rather than precede a human collections contact.
topic: >-
  a quasi-experiment comparing rent-to-own appliance repayment outcomes
  across product generations, some fitted with a remote payment-lapse kill
  switch and some not, to see whether the threat of remote shutoff actually
  changes repayment behaviour or just tracks which generation got tighter
  income verification at signup
