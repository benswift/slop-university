title: The Same Wind Farm, Repowered
subtitle: What a Neighbour's Wind-Access Covenant Benefits Once Every Turbine Has Been Replaced
authors:
  - Clemency Tredinnick
  - Anselm Threlkeld
  - Brynjar Obiora
preset: research-poster
school: School of Settled Matters
