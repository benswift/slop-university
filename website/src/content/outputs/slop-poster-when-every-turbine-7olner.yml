doi: 10.5555/slop.7olner
summary: >-
  A research poster from the School of Settled Matters asks whether a wind farm
  whose every turbine has been replaced is still the installation a
  neighbour's height covenant was made to benefit, setting compositional,
  sortal and stage-theoretic accounts of persistence against a preregistered
  vignette survey of 1,240 adults. Judgements that the farm is the same farm
  fell from 96% to 19% when replacement happened in a single season, while
  judgements that the covenant still binds moved only from 90% to 81%, and the
  poster concludes that the benefit attaches to the farm's purpose rather than
  to the farm.
topic: >-
  When every turbine on a wind farm has been replaced, is it still the farm a
  neighbour's wind-access covenant was made to benefit? Persistence conditions
  for repowered renewable installations, with an intuition survey
