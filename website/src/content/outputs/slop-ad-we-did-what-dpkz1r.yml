summary: >-
  A marketing poster for the Master of Priority Studies carries the School of
  Emergent Priorities' Strategic Drift Survey onto the University's landscape
  screens, setting a planning-room scale model before a window in which the
  finished building matches it line for line. It presents the University's
  standing on its own annual measure of the distance between stated and enacted
  priorities, and was issued in light and dark renderings for signage.
