title: Top Marks, One Barrow
subtitle: A Five-Level Shared-Barrow Maturity Model for Allotment Sites, and the Fleet Allowance Set by Level
authors:
  - Kwame Lindqvist
  - Iben Chikere
  - Edda Nwafor
preset: paper
school: School of Emergent Priorities
date: 2026-10-02
publishedAt: "2026-10-02T16:00:56+10:00"
doi: 10.5555/slop.yerijs
summary: >-
  A paper from the School of Emergent Priorities scores 31 allotment sites on a five-level Shared-Barrow Maturity Model across four quarterly rounds, finding that sites climb the levels readily while weekly loads carried per plot stay between 5.7 and 5.9 at every level. The University, which lends the barrows, now sets each site's fleet by its level, from six barrows at Level 1 to one at Level 5, with no dispensation for the wait.
topic: >-
  Although every step up a five-level shared-barrow maturity model left an allotment site's weekly loads carried exactly where they were, the University set each site's barrow fleet by its level, so the best-scored sites kept one
