summary: >-
  A research poster from the School of Emergent Priorities interviews 31 staff,
  students and cleaning contractors about the yellow wet-floor sign standing in
  each of four ground-floor corridors, and keeps their own words as the codes.
  The median day on which a sign stopped being a warning is nine, most
  interviewees call it furniture or a landmark, and 22 of 31 cannot recall the
  floor beneath any sign ever being wet, which the University now takes as the
  tenure at which a sign is asset-tagged as a fixture.
topic: Nine days is the tenure after which staff and students interviewed about a corridor's yellow wet-floor sign say it has stopped being a warning and become a landmark, and the University resolves to asset-tag every sign that reaches that tenure as a fixture, whether or not the floor beneath has been wet
