title: Nobody Slips on a Landmark
subtitle: How 31 interviewees date the day a corridor's wet-floor sign turned into scenery
authors:
  - Tove Ilesanmi
  - Ingrid Vasseur
  - Mirela Hanke
preset: research-poster
