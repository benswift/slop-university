summary: >-
  A marketing poster for the School of Underlying Conditions shows Dr Brynjar
  Obiora waist-deep in an open soil pit, auger in hand, beside a long row of
  sample tubs whose fill rises to a heap near him and thins to a tail toward
  the horizon. Its campaign line asks the reader to map the spread rather than
  the average, and its small print points to three published studies. Rendered
  for the landscape panels in a light and a dark edition.
