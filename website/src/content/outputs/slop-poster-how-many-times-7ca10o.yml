summary: >-
  A research poster from the School of Continuous Improvement anodises, strips
  and re-anodises the same twelve titanium foils eight times, growing 96 TiO₂
  nanotube photoanodes. The six-neighbour fraction of the nanotube arrays rose
  from 0.58 to 0.81 by the fourth growth and fell to 0.64 by the eighth, and
  median photocurrent at 1.23 V vs RHE peaked at 0.63 mA cm⁻² on the fourth
  growth, the best growth on ten of the twelve foils.
topic: >-
  how many times one titanium foil can be anodised, stripped and re-anodised
  before the TiO2 nanotube photoanodes grown on it stop improving, tracked over
  eight cycles by pore ordering and photocurrent
