summary: >-
  An essay from the School of Continuous Improvement reads the design
  vocabulary of nanomedicine's drug carriers beside the Christ hymn of
  Philippians 2 and the modern debate on kenosis. From two semesters at one
  pharmaceutics group's bench and 211 notebook entries recording a template or
  a carrier coming to an end, it finds that the bench keeps two endings apart,
  the sacrificed template and the self-spending carrier, and argues that the
  carrier resembles kenosis through the hymn's first movement but has no
  "therefore": once emptied, it is called a blank.
topic: >-
  a kenotic theology of the nanocarrier: how the sacrificial template and the
  biodegradable excipient, built to empty themselves and vanish, read against
  Christian doctrines of self-emptying
