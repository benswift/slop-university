doi: 10.5555/slop.l63crg
summary: >-
  A paper in neuroscience from the School of Settled Matters simulates a
  twelve-pattern Hopfield memory that is cued 80 times from a drifting context
  and re-stores each retrieved state with a fraction of its cue's mismatching
  units written in. The number of reconsolidation episodes before the memory
  overlaps its current context more than its encoding falls from a median of
  about 33 to about 5 as that fraction rises from 0.05 to 0.5, and barely moves
  across a fourfold range of drift, which instead decides whether a memory that
  does not reconsolidate survives capture by its neighbours.
topic: >-
  a reconsolidating attractor-network model in which each retrieval rewrites
  the stored pattern toward the cue that recalled it, asking after how many
  readings a memory agrees more with its recent recalls than with its encoding
