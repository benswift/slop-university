title: Siding with the Retrieval
subtitle: Incorporation, Not Context Drift, Sets When a Reconsolidating Attractor Memory Departs from Its Encoding
authors:
  - Anselm Threlkeld
  - Odalys Penhallow
preset: paper
school: School of Settled Matters
