title: What the Driller Wrote Instead
subtitle: Text classification of 38,416 bore-log intervals, 2,811 of which describe nothing recovered
authors:
  - Ragnhild Uzoma
  - Joost Nwosu
  - Edda Nwafor
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-13
publishedAt: "2026-10-13T01:49:24+11:00"
doi: 10.5555/slop.vkgxes
summary: >-
  A research poster from the School of Underlying Conditions trains a linear
  text classifier on 38,416 free-text interval descriptions from 1,204 legacy
  water-bore logs and compares three treatments of the 2,811 entries that
  record no recovery: forcing a rock class, adding a tenth class, and rejecting
  below a confidence threshold. A probe trained on the loss wording alone names
  the rock bracketing a lost interval with accuracy 0.58 against a majority
  baseline of 0.29, and the authors propose reporting that suggestion apart
  from the rock classes.
topic: >-
  sorting drillers' free-text log entries into rock classes when some entries
  describe nothing recovered
