summary: >-
  Slop University's Strategic Plan 2026-2031 commits the institution to
  reading an empty junior desk as its AI-readiness signal and a collected
  welcome pack as a lag to close. An Entry-Level Vacancy Ratio, a Partner
  Vacancy Ledger, and same-day withdrawal of onboarding ritual against a
  vacated start date give the unoccupied seat a published account, a target,
  and a review cycle.
