title: Towards a Booking Mandate for Contested Shared Space
subtitle: >-
  A Failed Replication of the Food-Truck-Bay Priority-Norms Finding at the
  Campus Quad Lawn
authors:
  - Ronja Oyelaran
  - Verity Marris
  - Runa Adegoke
preset: paper
school: School of Emergent Priorities
date: 2026-09-17
publishedAt: "2026-09-17T09:16:07+10:00"
doi: 10.5555/slop.jx66yt
summary: >-
  A paper from the School of Emergent Priorities restages an earlier
  food-truck-bay finding about self-serving priority claims at a university
  quad lawn with no booking system, logging 247 contested-claim episodes
  across a fourteen-week semester. The self-serving asymmetry itself
  replicates, but a paper booking sheet introduced at week 10 collapses it
  from 71% to 4% within four weeks, contradicting the original study's
  finding that the same intervention changes nothing.
