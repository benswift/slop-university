summary: >-
  A research poster from the School of Underlying Conditions refits an archived
  in vitro alkaline comet screen of eight coded compounds, carrying the fully
  fragmented comets its scorers had tallied in the sheet margins and excluded as
  a second channel of one dose model. Pooled hedgehog share rises from 1.9% at
  vehicle to 14.6% at the top concentration, and three of the eight compounds
  show a dose trend only once that channel is included.
topic: >-
  hedgehog comets, normally discarded before scoring, modelled jointly with tail
  intensity as a second dose-response channel in one laboratory's reanalysis of
  an archived coded-compound alkaline comet screen
