doi: 10.5555/slop.qaheze
summary: >-
  A paper from the School of Underlying Conditions audits one irrigation
  season on a three-bore groundwater supply, comparing a fixed duty pair with
  daily and eight-hourly rotation in twelve randomised fortnightly blocks.
  Rotation cut formation drawdown by about a third and specific energy from
  311.8 to 301.5 and 302.8 kWh/ML; start-up losses were under 0.2% of
  consumption, and the fixed-speed pumps turned the reduced lift into 3.6% more
  water at unchanged input power and lower efficiency.
topic: >-
  Duty rotation in a small groundwater bore field: an energy audit of how resting a bore so its water level recovers trades pumping lift against start-up losses across one irrigation season
