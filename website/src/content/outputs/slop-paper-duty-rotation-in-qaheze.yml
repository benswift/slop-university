title: Resting the Bore
subtitle: Duty Rotation and the Specific Energy of a Three-Bore Irrigation Supply
authors:
  - Vigdis Emenike
  - Brynjar Obiora
  - Torun Ezeigwe
preset: paper
school: School of Underlying Conditions
