summary: >-
  A musicological study from the School of Emergent Priorities reads fourteen
  operator logbooks and nine reels of console recordings from a valve-era
  computing laboratory for how its operators heard the library routine that
  found the roots of polynomials. Horner's scheme gives each Newton step one
  beat per degree and each root divided out shortens the bar, so the operators
  heard degree, double roots and complex pairs as ladders, hangs and double
  steps; of 548 remarks on the routine 371 describe a sound, and on nineteen
  runs where tape and remark both survive the remark agrees with a
  transcription of the tape in seventeen.
topic: >-
  Operators of an early university computer learned to hear its polynomial
  root-finding through the console loudspeaker: Horner's bars, deflation's
  shrinking metre and the stall at a multiple root, read as a listening
  practice
