title: Taken Up in Honey
subtitle: Verbs of dissolving and their liquids in a late Latin recipe book
authors:
  - Brynjar Obiora
  - Sunniva Balogun
preset: research-poster
school: School of Underlying Conditions
date: 2026-10-13
publishedAt: "2026-10-13T01:00:54+11:00"
doi: 10.5555/slop.rl8jgs
summary: >-
  A research poster from the School of Underlying Conditions excerpts the 412
  clauses in which an unedited late Latin recipe book brings a solid into a
  liquid, and tabulates six verbs against six liquids, quire by quire. It
  finds that the verbs sort the liquids everywhere but in the tenth quire,
  which dissolves in honey what the rest of the book takes up in it, and reads
  that quire as copied from a second exemplar and left unharmonised.
topic: >-
  Verbs of dissolving and the liquids they take in a late Latin recipe
  collection, read philologically for what the exceptions say about how the
  book was compiled
