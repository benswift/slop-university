doi: 10.5555/slop.3qtkev
summary: >-
  A research poster from the School of Underlying Conditions posts each item a
  community panel's respondents left blank on an 18-item anxiety and
  depression inventory back to them on a single-item card, recovering 412 of
  702 blanks across 5,240 forms. Recovered answers sat 0.52 points above the
  respondent's own mean on the items they had answered, most of all on sleep,
  low mood and enjoyment, so the panel's prorated subscale totals understated
  them; imputation from the other items narrowed the gap without closing it.
topic: >-
  Which items respondents leave blank on a self-report anxiety and depression
  inventory, and what a prorated total is entitled to say about the answers
  nobody gave
