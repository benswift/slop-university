doi: 10.5555/slop.d7lofy
summary: >-
  A paper from the School of Underlying Conditions and the School of Continuous
  Improvement transfers a partial least squares nitrate calibration from a bench
  ultraviolet spectrophotometer to a submersible probe on a 46-bore monitoring
  network, standardising it once with eleven bores chosen by the Kennard–Stone
  algorithm and once with the eleven bores reachable by road in a day. On
  fifteen held-out bores the reachable set left an error of 1.48 mg/L against
  0.62 mg/L, worse than 972 of 1000 random sets, and three carried standards,
  one a stored composite of water from behind the gates, brought it to 0.71
  mg/L at no cost in field days.
topic: >-
  Calibration transfer of a UV nitrate PLS model from a bench spectrophotometer
  to a down-bore probe, comparing a Kennard-Stone transfer set with the bores
  the field crew could actually reach
