title: Eleven Bores by Road
subtitle: Kennard–Stone and reachable transfer sets for standardising a down-bore ultraviolet nitrate probe
authors:
  - Vigdis Emenike
  - Torun Ezeigwe
preset: paper
school: School of Underlying Conditions
date: 2026-10-12
