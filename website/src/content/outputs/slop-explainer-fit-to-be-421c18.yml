summary: A research explainer from the School of Continuous Improvement on Eivind
  Onwuka's doctoral thesis on the household tidy before visitors. It follows 25,033
  moves in 61 households to the one room in each that took most of them, asks the
  visitors what they noticed, and sets out the trial from which the University's Closed
  Door Allowance is drawn. Onwuka describes the work in his own words.
topic: "A research explainer of the doctoral thesis on the household tidy before visitors:
