title: Notes on a Pill Organiser
subtitle: >-
  How a Weekly Pill Organiser Became a Family's Most Trusted Sign of Care
authors:
  - Anouk Mensah
  - Runa Adegoke
  - Hedvig Anyanwu
preset: paper
school: School of Emergent Priorities
date: 2026-09-24
publishedAt: "2026-09-24T10:02:05+10:00"
doi: 10.5555/slop.e9yuaw
summary: >-
  A paper from the School of Emergent Priorities interviews 34 adult children
  across 21 households about checking an ageing parent's weekly pill
  organiser from a distance, finding that compartment-only checks replaced
  spoken contact at every household pattern studied over a ten-month
  fieldwork window, and that a printed reminder card left visit timing
  unchanged; the Strategic Drift Survey has since adopted the study's
  description of a checkable physical proxy as its own verification
  standard.
topic: >-
  adult children checking an ageing parent's weekly pill organiser from
  across town, in their own words, once its filled-or-not compartments
  became the household's most trusted sign that someone had remembered to
  visit, and the Strategic Drift Survey began citing the pattern as a
  domestic case of stated-versus-enacted care
