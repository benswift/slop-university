title: Freehand, Therefore Final
subtitle: A Regression-Discontinuity Estimate at a Pizzeria's Felt-Pen Delivery Line
authors:
  - Osei Vandermeer
  - Marit Osayande
  - Joost Nwosu
preset: paper
school: School of Continuous Improvement
