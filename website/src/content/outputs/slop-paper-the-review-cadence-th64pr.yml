doi: 10.5555/slop.th64pr
summary: >-
  A regression-discontinuity study of the felt-pen free-delivery line on a
  strip-mall pizzeria's window map finds that households just inside it order
  0.78 more times per household-year than households just outside, with no
  change in delivery time, basket size or cold-arrival complaints. It reports
  the Review Cadence Observatory's Catchment Standing Order, which draws every
  University consultation's catchment at the line's mean radius, in felt pen,
  with no override.
topic: >-
  The Review Cadence Observatory rules that a strip-mall pizzeria's felt-pen
  free-delivery circle on its laminated window map is a natural cutoff,
  comparing households a few doors inside the line with households a few doors
  outside on reorders and complaints, and adopts the circle's radius as the
  standing catchment for every University consultation
