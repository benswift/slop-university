title: The Five Per Cent Purse
subtitle: Type I error as a unit of account in a regional trials committee's minute books
authors:
  - Thandiwe Solberg
  - Solveig Adeyemi
  - Osei Vandermeer
preset: research-poster
school: School of Continuous Improvement
date: 2026-10-13
publishedAt: "2026-10-13T21:01:53+11:00"
doi: 10.5555/slop.fzhqfb
summary: >-
  A research poster from the School of Continuous Improvement reads 31 years of
  one regional trials committee's minute books as an account book, posting 922
  minuted mentions of a significance level to a double-entry ledger across 58
  trials and 233 interim analyses. The allowance served the committee as a unit
  of account and a store of value but never as a medium of exchange: all nine
  proposals to move an unspent balance between trials were refused, and the
  authors class it as a ration, not a currency.
topic: >-
  An economic history of statistical significance as a rationed unit of account:
  how the minute books of an unnamed regional trials committee show type I error
  being budgeted, hoarded, lent and spent across interim analyses
