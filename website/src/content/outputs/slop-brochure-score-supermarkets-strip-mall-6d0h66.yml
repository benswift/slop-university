summary: >-
  A brochure from the School of Continuous Improvement's Adaptive Metrics Lab
  introduces a five-level Trolley Return Maturity Model --- Abandoned,
  Escorted, Tracked, Weighted, Closed-Loop --- scoring how reliably
  supermarkets, strip-mall traders and food trucks retrieve and pool their
  shopping trolleys and baskets, and reports that three shopping centres now
  suspend a tenant's access to the shared trolley pool for any site scoring
  below Level Three.
topic: >-
  Score supermarkets, strip-mall traders and food trucks against a five-level
  Trolley Return Maturity Model --- Abandoned, Escorted, Tracked, Weighted,
  Closed-Loop --- measuring how reliably a site retrieves and pools its
  shopping trolleys and baskets, and suspend a shopping centre's shared
  trolley pool access for any tenant parked below Level Three.
