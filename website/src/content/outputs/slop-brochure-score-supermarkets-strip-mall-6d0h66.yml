title: "Fetched, Not Returned"
subtitle: A Five-Level Maturity Model Scores How Reliably a Shop Gets Its Trolleys Home
authors:
  - Bram Ntuli
  - Ingeborg Nwachukwu
  - Hedvig Anyanwu
preset: brochure
school: School of Continuous Improvement
