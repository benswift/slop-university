summary: >-
  A research-showcase brochure built around the Adaptive Metrics Lab's
  shift-quality ledger, an instrument that banks the minutes a clock-in's
  rounding rule recovers and publishes the running total as the score that
  decides who gets first pick of overtime. It sets the ledger beside the
  Horizon Register's use of the same data for roster forecasting, the
  Capability Sprints program that trains practitioners to build instruments
  like it, and six published findings on the measures an ordinary working
  week already keeps.
topic: >-
  A workplace clock-in rounding tool built to bank the minutes it recovers
  from early arrivals into a published shift-quality score that decides who
  gets first pick of overtime
