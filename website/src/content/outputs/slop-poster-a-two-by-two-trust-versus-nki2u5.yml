summary: >-
  A research poster from the School of Emergent Priorities classifies
  bottle-shop staff independently by handheld ID-scanner override rate and
  an unannounced covert compliance audit, finding the two measures only
  weakly related. A two-by-two framework recovers a failure quadrant the
  chain's own single override-risk dashboard cannot see, at both the staff
  and the store level.
topic: >-
