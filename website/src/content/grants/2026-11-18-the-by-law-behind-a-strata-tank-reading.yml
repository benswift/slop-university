name: Tracing the By-Law Behind a Strata Scheme's Monthly Tank Reading Before Its Next Secretary Inherits It
scheme: indicator-stewardship-seed-fund
date: 2026-11-18
grantees:
  - Clemency Tredinnick
  - Signy Okpara
value: 293517
summary: >-
  Supports a search of a strata scheme's registered by-laws and minute books
  for the resolution that first required its secretary to report the
  rainwater tank's level to every owner each month, and a written account of
  what the reading still binds and when it might be said to have served its
  time, so that the next secretary takes the reading on with its reason
  attached.
