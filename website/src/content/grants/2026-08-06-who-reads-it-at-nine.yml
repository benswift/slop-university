name:
  Standing a Second Gauge Beside a Suburb's Volunteer Rain Reading Before Its
  Reader Retires
scheme: indicator-stewardship-seed-fund
date: 2026-08-06
grantees:
  - Bram Ntuli
  - Solveig Adeyemi
value: 386921
summary: >-
  Funds a full season of paired readings at a suburban rain gauge that has been
  read by the same volunteer, unchecked against any second instrument, for as
  long as anyone can recall. The project records the difference between the two
  gauges, writes down the reading practice that has never been written down, and
  names and trains the next reader before the current one stops walking out at
  nine.
