name: Checking a Community Garden's Compost Thermometer Against a Laboratory Standard
scheme: indicator-stewardship-seed-fund
date: 2026-09-16
grantees:
  - Osei Vandermeer
  - Dagny Okafor
value: 219436
summary: >-
  Funds a season of parallel readings at a community garden's shared compost
  bin, checking the volunteer-read stick thermometer against a
  laboratory-calibrated reference at every Sunday working bee, and writing the
  monthly cross-check into the roster as a standing task rather than a fix
  applied once and left to drift.
