name: Restocking a Council's Street Libraries Before the Shelf Stops Turning Over
scheme: anticipatory-capability-fund
date: 2026-08-04
grantees:
  - Runa Adegoke
  - Kwame Lindqvist
value: 241873
summary: >-
  Funds a stocking forecast for the book boxes on a council's nature strips.
  What arrives and what leaves each box is logged against the point at which its
  turnover falls away, and a restocking call is issued before the stall is
  visible to anyone walking past.
