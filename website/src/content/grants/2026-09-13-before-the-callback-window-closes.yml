name: Holding a Tradesperson's Van-Signage Testimonial Back Until Its Callback Window Closes
scheme: anticipatory-capability-fund
date: 2026-09-13
grantees:
  - Sten Okwuosa
  - Ingrid Vasseur
value: 205347
summary: >-
  Funds a testimonial-release protocol for independent tradespeople's van and
  website signage: a customer's five-star quote is timestamped against the
  job's contractual callback window and held out of rotation until that
  window elapses without a follow-up request, so a display never runs ahead
  of a repair's own durability.
