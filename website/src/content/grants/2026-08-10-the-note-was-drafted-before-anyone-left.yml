summary: >-
  Funds a joint study of succession at a volunteer surf lifesaving club,
  opening a stakeholder consultation on the coming season's patrol roster
  months before any captain is due to stand down, and tracking what the
  resulting handover note manages to capture of a role its current holder has
  not yet left.
