name: Cutting and Shelving a Borehole's Core-Loss Blocks Ahead of the Drill
scheme: anticipatory-capability-fund
date: 2026-10-19
grantees:
  - Ragnhild Uzoma
  - Marek Solheim
value: 362417
summary: >-
  Supports the Basement Relations Group, with the Horizon Register, to cut,
  size and shelve in advance the wooden blocks that will stand in the core
  trays for the intervals a forthcoming borehole is expected not to recover,
  so that the University meets its next core loss with the spacers already in
  place.
