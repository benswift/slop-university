name: Setting a Retirement Date for a Suburb's Temporary Detour Signs at Installation
scheme: anticipatory-capability-fund
date: 2026-07-28
grantees:
  - Marek Solheim
  - Lindiwe Achterberg
value: 317564
summary: >-
  Funds a kerbside removal register for a suburb's temporary traffic
  management: every detour sign is assigned a retirement date at the moment it
  is installed, logged against the work order that justified it, and returned
  to the installing crew when that date falls due whether or not the work has
  finished.
