name: Carrying a Car Boot Sale's Stallholder List From One Weekend's Organiser to the Next
scheme: indicator-stewardship-seed-fund
date: 2026-09-16
grantees:
  - Osei Vandermeer
  - Joost Nwosu
value: 219846
summary: >-
  Funds a handover protocol for a monthly car boot sale's stallholder booking
  list: every pitch, its regular holder, and any standing swap arrangement is
  logged and countersigned by the outgoing weekend organiser before the role
  passes on, so no booking is inherited from memory alone.
