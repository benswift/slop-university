name: Ruling the Columns of a Sailing Club's Incident Book Before the Season's First Capsize
scheme: anticipatory-capability-fund
date: 2026-09-22
grantees:
  - Solveig Adeyemi
  - Anneke Tolan
value: 263718
summary: >-
  Funds a preseason working group at a community sailing club to settle, before
  any boat is launched, what the incident book will ask of whoever writes in it
  first. The project drafts and rules the columns, agrees who reads the book and
  when, and rehearses one entry from blank page to committee agenda so that the
  first capsize of the season lands in a form that is ready for it.
