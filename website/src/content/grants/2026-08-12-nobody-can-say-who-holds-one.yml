name: Reconciling a Community Hall's Key Register Before Nobody Can Say Who Holds One
scheme: indicator-stewardship-seed-fund
date: 2026-08-12
grantees:
  - Thandiwe Solberg
  - Renke Sabel
value: 274158
summary: >-
  Funds an audit of a community hall's shared key-sign-out register,
  reconciling every name still listed against who actually holds a copy of
  the front-door key today, and establishing a standing custodian role so the
  log is corrected at each handover rather than left to accumulate for
  another decade.
