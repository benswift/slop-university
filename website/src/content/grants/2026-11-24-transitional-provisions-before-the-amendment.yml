name: Drafting the Transitional Provisions for a Regional Sporting Association's Next Constitutional Amendment Before One Is Proposed
scheme: anticipatory-capability-fund
date: 2026-11-24
grantees:
  - Anselm Threlkeld
  - Tove Ilesanmi
value: 583746
summary: >-
  Supports the drafting, ahead of any proposal to amend it, of the savings and
  transitional provisions for a regional sporting association's constitution,
  settling which of its clubs' standing arrangements continue, which lapse and
  which are taken to have been made under the new rules, so that whatever
  amendment the members eventually carry can commence on the day it passes.
