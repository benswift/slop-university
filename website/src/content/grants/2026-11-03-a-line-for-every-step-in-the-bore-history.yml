name: For a Deposit That Gave Each of Eighty-Three Steps Its Own Line in the Bore History
scheme: deposit-of-the-quarter-prize
date: 2026-11-03
grantees:
  - Vigdis Emenike
value: 37604
summary: >-
  Recognises Dr Emenike's repository deposit behind Where the Tape Starts,
  which files the network's manual dips as read beside their step-adjusted
  series, enters each of the 83 detected measuring-point steps as a dated line
  in its bore's history marked confirmed or unconfirmed by resurvey, and lists
  the 26 bores it could not test rather than leaving them out, as the Office of
  Research Outputs' most exemplary contribution to the University's research
  repository this quarter.
