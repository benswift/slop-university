name: For a Deposit That Kept Each Auger Lift as It Was Taken, Not as the Field Sheet Rounded It
scheme: deposit-of-the-quarter-prize
date: 2026-10-25
grantees:
  - Bram Ntuli
value: 28476
summary: >-
  Recognises Dr Ntuli's repository deposit behind The Uneven Lift, which files
  all 212 hand-auger holes lift by lift with each lift's top and bottom as
  measured, and the field sheet's ten-centimetre rounding kept in a column of
  its own, as the Office of Research Outputs' most exemplary contribution to
  the University's research repository this quarter.
