name: Calibrating Each New Surveyor's Fingers Against a Shelf of Soils of Known Texture
scheme: indicator-stewardship-seed-fund
date: 2026-10-31
grantees:
  - Brynjar Obiora
  - Ingeborg Nwachukwu
value: 312847
summary: >-
  Funds a reference shelf of soils drawn from the survey's collection of
  described profiles, each jar with its laboratory particle-size analysis
  sealed in an envelope beneath it, against which every surveyor joining the
  soil survey will hand-texture before texturing in the field, with a yearly
  return to the shelf for those who have been texturing longest.
