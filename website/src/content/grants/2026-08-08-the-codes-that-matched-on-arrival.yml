name: For a Deposit Whose Six Site Codes Needed No Reconciling
scheme: deposit-of-the-quarter-prize
date: 2026-08-08
grantees:
  - Ingeborg Nwachukwu
value: 31752
summary: >-
  Recognises the repository deposit behind The Same Apple, Twice, whose six
  packing-shed site codes were entered once, consistently, and required no
  reconciliation before the record left the Office of Research Outputs'
  review queue --- the Office's most exemplary contribution to the
  University's research repository this quarter.
