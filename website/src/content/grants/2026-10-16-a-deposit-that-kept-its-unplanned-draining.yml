name: For a Deposit That Kept an Unplanned Fourth Draining Instead of Tidying It Away
scheme: deposit-of-the-quarter-prize
date: 2026-10-16
grantees:
  - Vigdis Emenike
value: 34719
summary: >-
  Recognises Dr Emenike's quarterly repository deposit behind A Well Forty
  Metres Across, which files the ornamental pond's unplanned fourth lowering
  beside its three scheduled drainings, labelled as unplanned and with its
  bank-piezometer record complete, as the Office of Research Outputs' most
  exemplary contribution to the University's research repository this
  quarter.
