name: For a Deposit That Explained Its Own Gaps Instead of Leaving Them Blank
scheme: deposit-of-the-quarter-prize
date: 2026-09-10
grantees:
  - Casimir Beng
value: 42917
summary: >-
  Recognises Associate Professor Beng's quarterly repository deposit ---
  behind the barcode-and-sensor telemetry study of four community allotment
  sites --- whose every missed scan is tagged with the reason no reading
  arrived, rather than left as an unexplained blank in the filed dataset, as
  the Office of Research Outputs' most exemplary contribution to the
  University's research repository this quarter.
