name: For a Deposit That Kept Every Marker's Comment Beside the Answer It Was Written On
scheme: deposit-of-the-quarter-prize
date: 2026-11-21
grantees:
  - Odalys Penhallow
value: 31467
summary: >-
  Recognises Dr Penhallow's repository deposit behind Explain Why, which files
  twenty-six years of a European political economy examination with all 1,104
  marked answers, each first marker's comment lodged on the same line as the
  answer it was written on, and the examiners' minutes for every sitting, as
  the Office of Research Outputs' most exemplary contribution to the
  University's research repository this quarter.
