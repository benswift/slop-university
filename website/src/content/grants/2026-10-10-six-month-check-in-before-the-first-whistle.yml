name: Pencilling In the Six-Month Check-In for a Netball Club's Scorer Induction Before the First Whistle
scheme: anticipatory-capability-fund
date: 2026-10-10
grantees:
  - Ingeborg Nwachukwu
  - Iben Chikere
value: 643829
summary: >-
  Funds the scheduling, ahead of a suburban netball club's first round, of the
  follow-up visit at which its newly inducted volunteer scorers will be asked
  what they still remember, so that the lapse the visit is meant to find has
  an appointment before it has begun.
