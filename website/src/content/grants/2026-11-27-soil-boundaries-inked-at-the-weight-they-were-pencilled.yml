name: Inking a Soil Survey's Boundaries at the Weight They Were Pencilled In
scheme: indicator-stewardship-seed-fund
date: 2026-11-27
grantees:
  - Brynjar Obiora
  - Mirela Hanke
value: 376152
summary: >-
  Funds a line-weight key for the soil survey's mapped boundaries, under which
  each line between two soils reaches the finished map as firmly as the
  surveyor pencilled it in the field, faint where the ground changed by degrees
  and firm where it changed at a step, with a written procedure for any later
  surveyor who would like a faint line made firmer.
