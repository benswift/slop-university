name: Drafting an Audit Request List's Never-Produced Column Before Fieldwork Opens
scheme: anticipatory-capability-fund
date: 2026-11-06
grantees:
  - Ragnhild Uzoma
  - Hedvig Anyanwu
value: 528163
summary: >-
  Supports the Basement Relations Group, with the School of Emergent
  Priorities, to forecast at the planning stage which items on an external
  audit's request list a client will not supply, and to prepare for each in
  advance an entry in the never-produced column, an expected reason and a
  note for the working papers, so that the evidence that will not arrive is
  accounted for before anyone has asked for it.
