name: Reserving Forty Numbered Rows in the Horizon Register for Risks Not Yet Named
scheme: anticipatory-capability-fund
date: 2026-10-28
grantees:
  - Fenna Okoro
  - Halvard Nnamani
value: 447193
summary: >-
  Supports the Horizon Register to open forty numbered rows at the head of its
  rolling register, each with an assigned owner, a likelihood band and a
  scheduled review date, held ready for risks that have not yet been
  identified, so that the University's next unforeseen priority is entered
  into a row already prepared for it.
