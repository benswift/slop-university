name: Checking a School Zone's Your-Speed Sign Against a Known Bicycle After Every Battery Swap
scheme: indicator-stewardship-seed-fund
date: 2026-10-22
grantees:
  - Casimir Beng
  - Dagny Okafor
value: 612409
summary: >-
  Funds a standing check on the solar speed sign outside a primary school
  crossing, which a parent volunteer re-powers each term: after every battery
  swap, a bicycle ridden at a pace already agreed between the grantees passes
  the sign before school, and the reading it shows is entered beside the name
  of whoever swapped the battery.
