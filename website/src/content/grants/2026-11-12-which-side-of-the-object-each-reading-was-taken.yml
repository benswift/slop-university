name: For a Deposit That Said Which Side of the Object Every Reading Was Taken From
scheme: deposit-of-the-quarter-prize
date: 2026-11-12
grantees:
  - Runa Adegoke
value: 46817
summary: >-
  Recognises Dr Adegoke's repository deposit behind The Back of Everything,
  which files all 1,146 readings from a conservation studio's shared handheld
  XRF analyser with the place on the object each was taken, coded from the
  instrument's own spot-camera images where the collection database had kept
  it for fewer than one reading in five, as the Office of Research Outputs'
  most exemplary contribution to the University's research repository this
  quarter.
