summary: >-
  Supports the Strategic Drift Survey to draft, ahead of a footpath upgrade's
  submissions period, the summary-of-feedback report that period will
  produce, with its themes, representative comments and a statement of how the
  feedback shaped the final design, so that the consultation can open with its
  conclusions already in a form the project team can use.
