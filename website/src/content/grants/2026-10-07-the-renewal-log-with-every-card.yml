name: For a Deposit That Kept the Renewal Log With Every Card It Photographed
scheme: deposit-of-the-quarter-prize
date: 2026-10-07
grantees:
  - Kwame Lindqvist
value: 41263
summary: >-
  Recognises Associate Professor Lindqvist's quarterly repository deposit of
  CORK, the corner-shop noticeboard study, as the Office of Research Outputs'
  most exemplary contribution this quarter: every photographed card is filed
  with the renewal log that dated it, so a later reader can tell a live notice
  from one the stamp had already retired.
