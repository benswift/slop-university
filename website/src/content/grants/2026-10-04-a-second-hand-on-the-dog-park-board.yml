name: Appointing a Second Hand to Reset a Dog Park's Days-Since-Last-Incident Board
scheme: indicator-stewardship-seed-fund
date: 2026-10-04
grantees:
  - Verity Marris
  - Renke Sabel
value: 178642
summary: >-
  Funds a named deputy for the whiteboard by a neighbourhood dog park's gate
  that counts the days since the last incident, with a countersigned entry
  each time the count is reset, so the figure survives a change of marker
  hand without anyone having to remember what it last said.
