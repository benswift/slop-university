# pnpm build-script approval. Sharp's install/check.js falls through to a
# source build when a system libvips is present; skip the script and rely on
# the prebuilt @img/sharp-* platform binary at runtime.
allowBuilds:
  esbuild: true
  sharp: false

# Name patterns, not name@version: the supply-chain verify gate matches by
# package-name glob, so versioned entries are silently ignored.
minimumReleaseAgeExclude:
  - astro
  - "@astrojs/*"
